      hints:
        - match: "-v "
          say: "No shared directory is needed any more: the site is inside the image now. Leave out `-v`."
        - match: "-p 8080:18280"
          say: "The host port comes first, then the container's: `-p 18280:8080`."
        - match: "busybox"
          say: "Run your own image, `localhost/site:1.0`, which contains the site."
        - match: "^podman run( .*)? (-p|--publish)$"
          say: "The port option needs a value: the host port, a colon, then the container's port."
      hint: "`podman run -d --name site -p 18280:8080` and the image's name, `localhost/site:1.0`."
      run: "podman run -d --name site -p 18280:8080 localhost/site:1.0 >/dev/null; curl -s --retry 5 --retry-connrefused --retry-delay 1 http://localhost:18280/"
      then: "The page comes from inside the image this time: no `-v`, nothing shared with the host."
    - kind: teach
      id: layers
      title: "Layers, and the build cache"
      body: |
        An image is a stack of read-only **layers**: each instruction that changes files adds one, on top of the
        layers of the `FROM` image. A container started from the image adds one more, writable layer of its own,
        where everything it writes goes. The image never changes, and that writable layer is deleted with the
        container, which is why data that must last needs a volume.

        When you build again, Podman reuses (caches) every step whose instruction and inputs have not changed, and
        rebuilds from the first step that differs. Everything after that step is rebuilt too, because it sits on
        top of it.
    - kind: show
      id: rebuild-same
      body: "First, the same build again, with nothing changed:"
      run: "podman build -t localhost/site:1.0 . 2>&1 | grep -E '^STEP|Using cache|^COMMIT'"
      notice: "Every step after `FROM` says `Using cache`: nothing changed, so the layers from the first build were reused."
    - kind: ask
      id: guess-cache
      guess: true
      prompt: "You change one line in `site/index.html` and build again. Which steps can come from the cache?"
      choices:
        - text: "None: any change rebuilds everything"
          why: "That would make builds slow for no reason. The next step shows what Podman reuses."
        - text: "FROM only; COPY and after are rebuilt"
          why: "See the next step."
        - text: "All of them: the Containerfile did not change"
          why: "The cache also looks at the files a COPY reads. The next step shows the effect of changing one."
      answer: 1
    - kind: show
      id: rebuild
      run: "echo '<p>release 1.1</p>' >> site/index.html && podman build -t localhost/site:1.1 . 2>&1 | grep -E '^STEP|Using cache|^COMMIT'"
      notice: |
        No `Using cache` this time after `FROM`: `COPY` read a changed file, so it ran again, and every later step
        was rebuilt on top of the new layer, even `EXPOSE` and `CMD`, which did not change. That is why
        Containerfiles put what changes least (installing packages) first and what changes most (your
        application's files) last.
    - kind: try
      id: try-build
      body: "The release manager wants the current files tagged as release 2.0. Build an image from the current directory, named `localhost/site` with the tag `2.0`. Nothing changed since 1.1: decide before you read the output which steps should come from the cache."
      accept:
        - "podman build -t localhost/site:2.0 ."
        - "podman build --tag localhost/site:2.0 ."
        - "podman build --tag=localhost/site:2.0 ."
        - "podman build -t=localhost/site:2.0 ."
        - "podman build . -t localhost/site:2.0"
        - "podman build . --tag localhost/site:2.0"
        - "podman build -t site:2.0 ."
        - "podman build --tag site:2.0 ."
        - "podman image build -t localhost/site:2.0 ."
      hints:
        - match: "^podman build$"
          say: "Podman needs the build directory (`.` for the current one) and a name: add `-t localhost/site:2.0`."
        - match: "^docker "
          say: "This machine uses Podman: start with `podman`. (Docker's build command takes the same `-t` and directory.)"
        - match: "podman build.* -t [^ ]+$"
          say: "The build directory is missing: end the command with `.`, the current directory."
        - match: "site-2\\.0|:2$|site 2\\.0"
          say: "A name and a tag are separated by a colon: `localhost/site:2.0`."
      hint: "`podman build`, `-t` with the name and tag joined by a colon, then the build directory."
      run: "podman build -t localhost/site:2.0 . 2>&1 | grep -E '^STEP|Using cache|^COMMIT'"
      then: "The files did not change since the 1.1 build, so every step after `FROM` comes from the cache, and the new tag points at the same image content."
    - kind: show
      id: history
      body: "`podman history` lists the build history of an image, newest first, with the instruction behind each entry:"
      run: "podman history --format '{{.CreatedBy}} | {{.Size}}' localhost/site:1.1 | cut -c1-90"
      notice: "Your instructions on top. Only `COPY` added files to the image (2.56 kB); `CMD` and `EXPOSE` change the image's settings and add no files (0 bytes). Below them, the history of the busybox image you started `FROM`."
    - kind: teach
      id: ignore
      title: "What must stay out of an image"
      body: |
        Everything in an image can be read by anyone who can pull it, including files you did not mean to ship. The
        build directory here also contains a local log and a file of secrets, `site/build.log` and
        `site/secrets.env` among the source files, placed there to be kept out. A **`.containerignore`** file lists
        what the build must never see:
    - kind: show
      id: ignore-file
      run: "cat .containerignore; podman run --rm localhost/site:1.1 ls /www"
      notice: "The image's `/www` holds only `index.html`: the log and `secrets.env` were never sent to the build. Even deleting a file in a later step would not help: it would still be in the earlier layer."
    - kind: ask
      id: secret-later
      prompt: "A Containerfile copies `secrets.env`, uses it, then runs `rm secrets.env` in a later step. Is the secret gone from the image?"
      choices:
        - text: "No: it remains in the earlier layer"
          why: "Layers are stacked, never rewritten. The `rm` adds a layer that hides the file, but anyone with the image can read the layer that contains it."
        - text: "Yes: the file was deleted"
          why: "It is hidden in the final view, but the layer created by the COPY still contains it."
        - text: "Yes, if the image is pushed with `--compress`"
          why: "Compression changes how layers are transferred, not what they contain."
      answer: 0
    - kind: teach
      id: cmd-forms
      title: "Writing CMD so it runs what you meant"
      body: |
        `CMD ["httpd", "-f", …]`, with brackets and double quotes, is the **exec form**: the list is the program and
        its arguments, run directly, so the program becomes the container's PID 1. Brackets need double quotes:
        the list is JSON, the format `podman inspect` prints, in which text is always written in double quotes.
        Here is what happens with single quotes:
    - kind: show
      id: quotes
      run: "cat Containerfile.quotes; podman build -q -f Containerfile.quotes -t localhost/site:quotes . >/dev/null && podman run --rm localhost/site:quotes"
      notice: |
        The build accepted it, but the container fails at once: with single quotes the line is not valid JSON, so
        it is treated as **shell form**, a plain command run by a shell. The shell removes the single quotes, so
        the first word it sees is `[httpd,`, exactly the token in the error `[httpd,: not found`. That is not a
        program. Nothing warns you until the container runs.
    - kind: reflect
      id: explain-cache
      prompt: "Explain to a colleague why a Containerfile should copy the application's files after installing its packages."
      model: |
        Each build step is cached, and a rebuild reuses cached steps up to the first one whose inputs changed;
        everything after is rebuilt. (History lists every instruction; only the ones that change files, such as
        COPY, add filesystem content, while CMD and EXPOSE change settings.) Packages change rarely and take long to
        install, application files change on every build. With the files copied last, a code change only rebuilds
        the last steps, and the package layer comes from the cache.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can read a Containerfile, build and tag an image from it, run it, predict what the build cache reuses,
        keep files out of the build with `.containerignore`, and tell the exec form of CMD from the broken one.
        Writing a Containerfile from scratch is not practised in this lesson.

        An image on your workstation is not yet anywhere else. Next: how images are named, stored in registries and
        identified by digests, so that exactly the same bytes run everywhere.
  sections:
    - id: more-build
      title: "Multi-stage builds, ENTRYPOINT and users"
      depth: true
      body: |
        - A **multi-stage** build uses one `FROM … AS build` stage with compilers and tools, then a second, small
          `FROM` that copies only the result: `COPY --from=build /out /app`. The tools never reach the final image.
        - `ENTRYPOINT` sets the program; `CMD` then gives its default arguments, which `podman run image args…`
          replaces. With only `CMD`, the arguments after the image name replace the whole command.
        - `USER 1001` makes the container run as that user unless `--user` overrides it. Images meant to run under
          any user give their writable directories to group 0 with group permissions equal to the owner's
          (`chgrp -R 0 dir && chmod -R g=u dir`), as the container security lesson explains.
        - `RUN a && b` in one instruction makes one layer; cleaning up package caches in the same `RUN` keeps that
          layer small.
  review:
    - q: "What do FROM, COPY and CMD do in a Containerfile?"
      a: "FROM: the base image. COPY: add files from the build directory. CMD: the command the container runs."
    - q: "Which steps does a rebuild take from the cache?"
      a: "Every step up to the first one whose instruction or input files changed; that step and all after it are rebuilt."
    - q: "How do you keep a file out of an image?"
      a: "List it in `.containerignore`, so it is never sent to the build. Deleting it in a later step leaves it in an earlier layer."
    - q: "Where do the files a container writes go, and what happens to them?"
      a: "Into the container's own writable layer, on top of the image's read-only layers; it is deleted with the container, and the image is unchanged."
    - q: "Why must the exec form of CMD use double quotes?"
      a: "It is JSON; with single quotes it is not valid JSON and is run as a shell command instead."
  commands:
    - cmd: "podman pull -q quay.io/prometheus/busybox:latest >/dev/null"
      meaning: "make sure the base image is present (not shown in the lesson)"
    - cmd: "cat Containerfile"
      meaning: "the recipe"
    - cmd: "podman build -t localhost/site:1.0 . 2>&1 | grep -E '^STEP|^COMMIT'"
      meaning: "build and tag the image"
    - cmd: "podman run -d --name site -p 18280:8080 localhost/site:1.0 >/dev/null; curl -s --retry 5 --retry-connrefused --retry-delay 1 http://localhost:18280/"
      meaning: "run it; the site is inside"
    - cmd: "podman build -t localhost/site:1.0 . 2>&1 | grep -E '^STEP|Using cache|^COMMIT'"
      meaning: "an unchanged rebuild: every step from the cache"
    - cmd: "echo '<p>release 1.1</p>' >> site/index.html && podman build -t localhost/site:1.1 . 2>&1 | grep -E '^STEP|Using cache|^COMMIT'"
      meaning: "a rebuild after a content change: what the cache reuses"
    - cmd: "podman build -t localhost/site:2.0 . 2>&1 | grep -E '^STEP|Using cache|^COMMIT'"
      meaning: "the learner's own build: a new tag from unchanged files"
    - cmd: "podman history --format '{{.CreatedBy}} | {{.Size}}' localhost/site:1.1 | cut -c1-90"
      meaning: "the image's layers"
    - cmd: "cat .containerignore; podman run --rm localhost/site:1.1 ls /www"
      meaning: "ignored files never reach the image"
    - cmd: "cat Containerfile.quotes; podman build -q -f Containerfile.quotes -t localhost/site:quotes . >/dev/null && podman run --rm localhost/site:quotes"
      expect: fail
      meaning: "single quotes in the exec form: run as a shell command, which fails"
    - cmd: "podman rm -f -t 0 site >/dev/null; podman rmi -f localhost/site:1.0 localhost/site:1.1 localhost/site:2.0 localhost/site:quotes >/dev/null; echo cleaned up"
      meaning: "clean up (not shown in the lesson)"
  files:
    Containerfile: |
      FROM quay.io/prometheus/busybox:latest
      COPY site/ /www/
      EXPOSE 8080
      CMD ["httpd", "-f", "-p", "8080", "-h", "/www"]
    Containerfile.quotes: |
      FROM quay.io/prometheus/busybox:latest
      COPY site/ /www/
      CMD ['httpd', '-f', '-p', '8080', '-h', '/www']
    .containerignore: |
      site/*.log
      site/secrets.env
    site/index.html: |
      <h1>Built into the image</h1>
    site/build.log: |
      local build output that must not reach the image
    site/secrets.env: |
      API_TOKEN=never-in-an-image
  references:
    - {title: "Podman documentation: podman build", url: "https://docs.podman.io/en/latest/markdown/podman-build.1.html"}
    - {title: "Containerfile reference (containers/common: Containerfile.5)", url: "https://github.com/containers/common/blob/main/docs/Containerfile.5.md"}
    - {title: "Containerignore reference (containers/common: containerignore.5)", url: "https://github.com/containers/common/blob/main/docs/containerignore.5.md"}
    - {title: "Podman documentation: podman history", url: "https://docs.podman.io/en/latest/markdown/podman-history.1.html"}
    - {title: "Docker documentation: images, layers and the writable container layer", url: "https://docs.docker.com/engine/storage/drivers/"}
    - {title: "Docker documentation: Dockerfile reference (shell and exec form)", url: "https://docs.docker.com/reference/dockerfile/#shell-and-exec-form"}

- id: a.images-registries
  title: "Image names, tags and digests"
  subtitle: "Where images come from, why a tag can change under you, and reading a failed pull"
  module: ct1-podman
  mode: LOCAL_SIMULATION
  minutes: 22
  level: 1
  supports: "Podman 5.8 and Skopeo on RHEL 9. Recorded on a RHEL 9 workstation as an ordinary user, with public registries; digests change whenever an image is rebuilt, so yours will differ."
  concepts: [container.images, container.registries]
  prerequisites: [ct.build-images]
  objective: |
    Read an image reference (registry, repository, tag), explain why a tag can point to different content over time
    while a digest cannot, inspect a remote image without pulling it, and tell from a failed pull whether the tag,
    the access or the registry is the problem.
  flow:
    - kind: ask
      id: recall-cache
      prompt: "A look back. You change one file that the Containerfile copies, and rebuild. Which steps are rebuilt?"
      recalls: ct.build-images
      choices:
        - text: "That COPY and every step after it"
          why: "The cache is reused up to the first step whose inputs changed; everything above it is rebuilt."
        - text: "Only that one COPY step, nothing else"
          why: "Later steps sit on top of the COPY's layer, so they are rebuilt too, even if unchanged."
        - text: "Every single step, including the FROM step"
          why: "Steps before the change come from the cache; FROM does not change because of your file."
      answer: 0
    - kind: teach
      id: situation
      title: "Same name, different code"
      body: |
        Your image now runs on your workstation. To run it anywhere else, it has to be stored where other machines
        can fetch it: a **registry**, a server that stores images, such as quay.io or registry.access.redhat.com.
        Other machines **pull** images from a registry; you **push** yours to one.

        This brings a classic surprise. A fix is pushed under the same name, `myapp:1.4`, and afterwards some
        machines run the fix and others the old code, and nobody can tell which from the name alone. Understanding
        the name is the first step.
    - kind: teach
      id: reference
      title: "Reading an image reference"
      body: |
        This tagged image reference has three parts: registry, repository and tag.

        ```
        registry.access.redhat.com / ubi9/ubi-minimal : latest
        └─ registry ─────────────┘  └─ repository ─┘   └─ tag
        ```

        The **registry** is the server, the **repository** the image's name on it (often with an organisation in
        front: `ubi9/`), and the **tag** a label for one version. (An image can also be named by digest instead of a tag;
        the next step shows that.) `localhost/site:1.0`, from [the last lesson](/lesson/ct.build-images), is the name Podman gave the image you
        built on this machine. The `localhost/` prefix is part of that name: it does not say where copies of the
        image are stored.
    - kind: ask
      id: read-ref
      prompt: "You run `quay.io/acme/web:1.4` and want the next release, 1.5, from the same place. Which part do you change?"
      choices:
        - text: "The tag: `:1.4` becomes `:1.5`"
          why: "The tag labels a version and comes after the colon; the registry and repository stay the same."
        - text: "The repository: `acme/web` becomes `acme/web1.5`"
          why: "The repository is the image's name on the registry; versions are tags within it, so a new version does not need a new repository."
        - text: "The registry: `quay.io` becomes `1.5`"
          why: "The registry is the server the image is pulled from, and it does not change between versions."
      answer: 0
    - kind: teach
      id: tags-digests
      title: "Tags move; digests do not"
      body: |
        A **tag** is a movable label. Whoever controls the repository can point `1.4` (or `latest`) at new content at
        any time, and nothing tells the machines that pulled it earlier.

        Each version of an image also has a **digest**, such as `sha256:5a1d…`: a fingerprint computed from its
        content. Change one byte and the digest changes. Referring to an image by digest
        (`busybox@sha256:5a1d…`) therefore means exactly that content, forever.

        Podman works with images on this machine and pulls the ones it needs. To look at an image in a registry
        without downloading it, there is a separate tool, **Skopeo** (installed separately; see the setup
        guide). `skopeo inspect` reads an image's information
        straight from the registry. It needs to be told where the image lives, and `docker://` in front of the
        name means "an image in a registry". It does not need Docker, and nothing is running on this machine.

        `--format` picks fields out of the information, which Skopeo otherwise prints as JSON: `.Digest` is the
        digest, `.Architecture` the processor type, and `len .Layers` counts the layers.
    - kind: show
      id: inspect
      run: "skopeo inspect --format '{{.Digest}} {{.Architecture}} {{len .Layers}}' docker://quay.io/prometheus/busybox:latest"
      notice: |
        What `latest` points to right now. This image is published for several architectures, so the digest names
        the whole multi-platform list (a list with one image per architecture); Skopeo then chose the entry
        matching this machine, `amd64`, and counted its 2 layers. Next week `latest` may point to another digest;
        a digest always means the same content, here the same list of images.
    - kind: try
      id: try-inspect
      body: "Inspect the image `registry.access.redhat.com/ubi9/ubi-minimal:latest` in its registry, without pulling it. Plain `skopeo inspect` prints everything; adding the same `--format` as in the last step prints only three fields. Either works."
      accept:
        - "skopeo inspect docker://registry.access.redhat.com/ubi9/ubi-minimal:latest"
        - "skopeo inspect --format '{{.Digest}} {{.Architecture}} {{len .Layers}}' docker://registry.access.redhat.com/ubi9/ubi-minimal:latest"
        - "skopeo inspect docker://registry.access.redhat.com/ubi9/ubi-minimal:latest --format '{{.Digest}} {{.Architecture}} {{len .Layers}}'"
        - "skopeo inspect --format \"{{.Digest}} {{.Architecture}} {{len .Layers}}\" docker://registry.access.redhat.com/ubi9/ubi-minimal:latest"
        - "skopeo inspect docker://registry.access.redhat.com/ubi9/ubi-minimal:latest --format \"{{.Digest}} {{.Architecture}} {{len .Layers}}\""
        - "skopeo inspect docker://registry.access.redhat.com/ubi9/ubi-minimal"
        - "skopeo inspect --format '{{.Digest}} {{.Architecture}} {{len .Layers}}' docker://registry.access.redhat.com/ubi9/ubi-minimal"
        - "skopeo inspect docker://registry.access.redhat.com/ubi9/ubi-minimal --format '{{.Digest}} {{.Architecture}} {{len .Layers}}'"
        - "skopeo inspect --format \"{{.Digest}} {{.Architecture}} {{len .Layers}}\" docker://registry.access.redhat.com/ubi9/ubi-minimal"
        - "skopeo inspect docker://registry.access.redhat.com/ubi9/ubi-minimal --format \"{{.Digest}} {{.Architecture}} {{len .Layers}}\""
      hints:
        - match: "^podman (pull|inspect|image inspect)"
          say: "Podman works with images it has pulled. Skopeo can read the registry directly, without pulling."
        - match: "^skopeo inspect registry"
          say: "Skopeo wants a transport in front of the name: `docker://` means \"a registry\"."
        - match: "^skopeo inspect docker:/[^/]"
          say: "The transport is written `docker://`, with two slashes."
      hint: "`skopeo inspect docker://` followed by the full reference."
      run: "skopeo inspect --format '{{.Digest}} {{.Architecture}} {{len .Layers}}' docker://registry.access.redhat.com/ubi9/ubi-minimal:latest"
      then: "The recording used `--format` for three fields. Without it, Skopeo prints everything it knows, as JSON, including labels and the list of tags; both are correct answers."
    - kind: teach
      id: cached
      body: |
        Here is the rule: `podman run` uses the image already stored on the machine when there is one, and only
        pulls when it is missing. You can pull again on purpose (`podman pull`, or `podman run --pull=always`).
    - kind: ask
      id: guess-cached
      prompt: "A fix is pushed under the tag `myapp:1.4`. Machine A pulled that tag last week. Machine B pulled it today. Both now run `podman run myapp:1.4`. Which code runs?"
      choices:
        - text: "A is old, B has the fix"
          why: "Each machine uses the copy it already stored, and the two copies were pulled at different times."
        - text: "Both run the fix from the registry"
          why: "Machine A already has an image named `myapp:1.4` and does not check the registry again unless asked, so it keeps last week's copy."
        - text: "Both run the old code from last week"
          why: "Machine B pulled after the fix, so its stored copy is the fix. Each machine's copy depends on when it last pulled."
      answer: 0
    - kind: teach
      id: pin-digests
      body: |
        Ten machines can therefore run ten different versions of "the same" tag.

        That is why production deployments pin **digests**, or tags that are never reused, such as a version
        number per build, and why `latest` is a poor choice for anything that must be reproducible. `latest` is
        only a name: it is the tag Podman uses when you write none (`quay.io/prometheus/busybox` means
        `quay.io/prometheus/busybox:latest`), and nothing obliges it to point at the newest version.
    - kind: teach
      id: failures
      title: "Reading a failed pull"
      body: |
        A pull fails in a few typical ways, and the error message says which, if you read past the start. Three
        recorded failures: a tag that does not exist, a repository you have no access to (or that does not exist),
        and a registry name that does not resolve.

        Each recorded command pipes the error through `tail -n 1` to keep only its last line, the one that names
        the cause. The pipe also makes the exit status the one of `tail`, 0, so the recording shows these failures
        as successful commands. `podman pull` on its own fails with a non-zero exit status.
    - kind: show
      id: fail-tag
      run: "podman pull registry.access.redhat.com/ubi9/ubi-minimal:no-such-tag 2>&1 | tail -n 1"
      highlight: ["manifest unknown", "reading manifest"]
      notice: "\"reading manifest no-such-tag … manifest unknown\": the registry and the repository answered, but that tag does not exist. Check the tag's spelling, or list the tags with `skopeo list-tags`."
    - kind: show
      id: fail-auth
      run: "podman pull quay.io/academy-no-such-org/nothing:1 2>&1 | tail -n 1"
      highlight: ["unauthorized"]
      notice: |
        "unauthorized": the registry refused to show the repository, `academy-no-such-org/nothing`, a name invented
        for this test. Registries give the same answer for a private
        repository you have not logged in to (`podman login`) and for one that does not exist, so that strangers
        cannot discover private names. Check the name first, then your credentials.
    - kind: ask
      id: why-unauthorized
      prompt: "A pull of `quay.io/acme/wbe:2` fails with \"unauthorized\". The public repository is really called `acme/web`. What do you check first?"
      choices:
        - text: "The repository's spelling"
          why: "\"unauthorized\" is also the answer for a repository that does not exist, so a typo looks like missing access. Check the name before the credentials."
        - text: "Whether the tag `2` exists"
          why: "A missing tag in a repository you can reach gives \"manifest unknown\", as the first failure showed. Here the registry would not even show the repository."
        - text: "The network connection"
          why: "The registry answered, so the network works; an unreachable registry gives a connection or name-resolution error, as the next failure shows."
      answer: 0
    - kind: show
      id: fail-dns
      run: "podman pull registry.invalid/team/app:1 2>&1 | tail -n 1"
      highlight: ["registry.invalid"]
      notice: "\"pinging container registry … dial tcp: lookup …\": Podman could not even reach the registry, here because its name does not resolve (`.invalid` is a top-level domain reserved never to exist, so the failure is certain). It is the same failure as `curl`'s \"Could not resolve host\", in another form."
    - kind: ask
      id: diagnose
      prompt: "A pull fails with `reading manifest 2.1 in quay.io/acme/web: manifest unknown`. The previous release, `2.0`, pulls fine. What is wrong?"
      choices:
        - text: "Tag `2.1` is not in that repository"
          why: "The registry and repository answered (2.0 works); only that tag is unknown. It was perhaps never pushed, or is spelled differently."
        - text: "The credentials for quay.io are wrong"
          why: "Missing access gives \"unauthorized\", and 2.0 would fail too."
        - text: "quay.io cannot be reached from here"
          why: "Then 2.0 would fail as well, with a connection or name-resolution error."
      answer: 0
    - kind: reflect
      id: explain-tags
      prompt: "Explain to a colleague why two servers can run different code from the same image name, and how to prevent it."
      model: |
        A tag is a movable label: it can be pointed at new content after a server has pulled it, and `podman run` keeps
        using the copy already on the machine. So servers that pulled at different times run different versions. Refer
        to images by digest (`image@sha256:…`), which always means the same bytes, or never reuse a tag, and pull
        explicitly when updating.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can read an image reference, explain tags and digests, inspect a remote image with Skopeo, and tell a
        missing tag from missing access and from an unreachable registry.

        Next: running containers safely, as an ordinary user, with only the rights they need, and building images
        that work under any user ID in group 0.
  sections:
    - id: more-images
      title: "Manifests, layers and short names"
      depth: true
      body: |
        - An image in a registry is a **manifest**: a small JSON document listing the image's configuration and its
          layers, each identified by its own digest. The digest of an image is the digest of its manifest.
        - A **multi-architecture** image has an index (a manifest list) pointing to one manifest per architecture;
          Podman and Skopeo pick the one that matches the machine. The index has its own digest, and each
          per-architecture manifest has a different one. Pinning the index fixes the set of versions for all
          architectures; each architecture still runs its own image.
        - A **short name** such as `ubi9` or `nginx` has no registry. Podman resolves it through
          `/etc/containers/registries.conf` and its short-name aliases, and may ask which registry you mean. Writing
          full names avoids ambiguity and pulling an unexpected image from an unexpected registry.
        - `skopeo list-tags docker://<registry>/<repository>` lists a repository's tags; `skopeo copy` copies images
          between registries without pulling them into local storage.
  review:
    - q: "What are the parts of `quay.io/prometheus/busybox:latest`?"
      a: "Registry `quay.io`, repository `prometheus/busybox`, tag `latest`."
    - q: "What is the difference between a tag and a digest?"
      a: "A tag is a movable label; a digest is a fingerprint of the content and always means the same bytes."
    - q: "Why can a machine run old code after a fix is pushed under the same tag?"
      a: "`podman run` uses the copy already on the machine and does not pull unless the image is missing (or `--pull=always`)."
    - q: "A pull says \"manifest unknown\". What does it mean?"
      a: "The registry and repository answered, but that tag (or digest) does not exist."
  commands:
    - cmd: "skopeo inspect --format '{{.Digest}} {{.Architecture}} {{len .Layers}}' docker://quay.io/prometheus/busybox:latest"
      meaning: "what a tag points to, read from the registry"
    - cmd: "skopeo inspect --format '{{.Digest}} {{.Architecture}} {{len .Layers}}' docker://registry.access.redhat.com/ubi9/ubi-minimal:latest"
      meaning: "another image, inspected the same way"
    - cmd: "podman pull registry.access.redhat.com/ubi9/ubi-minimal:no-such-tag 2>&1 | tail -n 1"
      meaning: "a tag that does not exist"
    - cmd: "podman pull quay.io/academy-no-such-org/nothing:1 2>&1 | tail -n 1"
      meaning: "a repository without access (or that does not exist)"
    - cmd: "podman pull registry.invalid/team/app:1 2>&1 | tail -n 1"
      meaning: "a registry that cannot be reached"
  references:
    - {title: "Podman documentation: podman pull", url: "https://docs.podman.io/en/latest/markdown/podman-pull.1.html"}
    - {title: "Podman documentation: podman run (--pull)", url: "https://docs.podman.io/en/latest/markdown/podman-run.1.html"}
    - {title: "Skopeo: skopeo-inspect(1)", url: "https://github.com/containers/skopeo/blob/main/docs/skopeo-inspect.1.md"}
    - {title: "OCI Image Specification: descriptors and digests", url: "https://github.com/opencontainers/image-spec/blob/main/descriptor.md"}
    - {title: "containers-registries.conf(5): short names", url: "https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md"}

- id: a.container-security
  title: "Containers that run as anyone"
  subtitle: "Root inside a rootless container, unprivileged ports, and images that work under any user ID in group 0"
  module: ct1-podman
  mode: LOCAL_SIMULATION
  minutes: 22
  level: 1
  supports: "Podman 5.8 (rootless) on RHEL 9. Recorded on a RHEL 9 workstation as an ordinary user; the test images are built for the recording and removed afterwards."
  concepts: [container.security, linux.permissions]
  prerequisites: [a.images-registries, lx.users-permissions]
  labs: []
  objective: |
    Explain what root inside a rootless container corresponds to on the host, run a container as a different
    user, know why an ordinary user cannot listen on port 80 in the recorded setup, and build an image whose writable directories work
    whatever user ID it is started with, as long as that user is in group 0.
  flow:
    - kind: ask
      id: recall-digest
      prompt: "A look back. Why do production deployments refer to images by digest?"
      recalls: a.images-registries
      choices:
        - text: "A digest always means the same content"
          why: "A digest is computed from the content, so it cannot be moved to other bytes the way a tag can."
        - text: "Digests download faster"
          why: "The download is the same; what differs is that a digest cannot point to anything else later."
        - text: "Tags are not allowed in production"
          why: "Tags are allowed; they are risky because they can move. Unique version tags are a common alternative."
      answer: 0
    - kind: teach
      id: situation
      title: "Root, but not the host's root"
      body: |
        Run `id` in a container and it usually says `root`. That sounds alarming: a program you downloaded runs as
        the most powerful user. With **rootless** Podman, the containers you start as an ordinary user, it is less
        alarming than it sounds, and this lesson shows why. It also shows the opposite habit that well-built images
        follow: not needing root at all, and working under whatever user ID they are given.
    - kind: show
      id: root-inside
      run: "podman run --rm quay.io/prometheus/busybox:latest id"
      notice: "UID 0, root, inside the container."
    - kind: show
      id: top
      body: "`podman top` shows each process of a container twice: as the container sees it (`USER`) and as the host sees it (`HUSER`):"
      run: "podman run -d --name sleeper quay.io/prometheus/busybox:latest sleep 100 >/dev/null; podman top sleeper user huser args; podman rm -f -t 0 sleeper >/dev/null"
      notice: |
        Root inside, UID 1000 on the host: the ordinary user who started it. A **user namespace** maps the
        container's UID 0 to your own user. This is the default mapping of rootless Podman for UID 0: it means the
        container's root has the host rights of an ordinary user, which reduces what a compromised container can do
        on the host. It does not promise anything about every possible attack.

        Rootless is a choice of how Podman is started. If you run `sudo podman`, or use a Docker daemon that runs
        as root, the container's root is mapped to the host's root. Docker also has a rootless mode.
    - kind: ask
      id: escape
      prompt: "In this default rootless mapping, which host user corresponds to UID 0 inside the container?"
      choices:
        - text: "The user who started the container"
          why: "The user namespace maps the container's UID 0 to the ordinary user who ran Podman, as the `huser` column showed."
        - text: "The host's root, UID 0"
          why: "That mapping applies when Podman runs as root (`sudo podman`) or with a root daemon. In rootless mode, UID 0 inside is an ordinary host user."
        - text: "A user with no rights at all"
          why: "It is not a special empty user: it is the user who started the container, with that user's normal rights, such as access to their own files."
      answer: 0
    - kind: teach
      id: other-user
      title: "Running as another user"
      body: |
        Images may also choose a user (`USER 1001` in a Containerfile), and `podman run --user UID:GID` overrides it.
        The number does not have to exist in the image's `/etc/passwd`: users are numbers to the kernel.
    - kind: ask
      id: guess-uid
      prompt: "You run `podman run --user 54321:0 <image> id`, and no user 54321 exists in the image. What does `id` report?"
      choices:
        - text: "UID 54321 in group 0, with no user name"
          why: "The kernel runs the process with that number; `id` finds no name for it. Group 0 was given explicitly with `:0`."
        - text: "An error: user 54321 does not exist"
          why: "No lookup is needed: users are numbers to the kernel, and the name in /etc/passwd is optional."
        - text: "root, because the image was built as root"
          why: "`--user` replaces the image's user for this container. The image's build user does not matter at run time."
      answer: 0
      explain: "The kernel only needs numbers. A process can run as any UID, whether or not /etc/passwd names it; images that expect a particular user break under such a UID."
    - kind: teach
      id: ports
      title: "Port 80 needs privilege"
      body: |
        On Linux, ports below 1024 are **privileged**: only root, or a process given that specific capability, may
        listen on them. This limit is a kernel setting (`net.ipv4.ip_unprivileged_port_start`, 1024 by default) that
        applies to each network namespace, and a container has its own. In this Podman recording the default holds.
        Docker commonly lowers it to 0 inside a container, so there a non-root process can listen on port 80. Here,
        busybox's web server tries port 80 and then port 8080 as user 1001:
    - kind: show
      id: port80
      run: "podman run --rm --user 1001 quay.io/prometheus/busybox:latest sh -c 'httpd -p 80 && echo \"listening on 80\" || echo \"port 80 refused\"'; podman run --rm --user 1001 quay.io/prometheus/busybox:latest sh -c 'httpd -p 8080 && echo \"listening on 8080\"'"
      highlight: ["Permission denied", "8080"]
      notice: |
        In this recording, port 80 is refused for an ordinary user, and port 8080 works. Listening on 8080 or a
        similar port does not depend on privilege or on that setting, which is why images meant to run without root
        listen there and leave mapping to port 80 or 443 to whatever sits in front of them. (Publishing a host port
        below 1024 with `-p` is a separate matter: rootless Podman can refuse that too.)
    - kind: ask
      id: which-port
      prompt: "An image must run as an ordinary user. Which port should its web server listen on inside the container?"
      choices:
        - text: "8080, mapped to 80 from outside"
          why: "Unprivileged ports (1024 and up) need no special rights; the outside world can still reach it on 80 through a mapping."
        - text: "80, the standard port for HTTP"
          why: "In this setup, ports below 1024 need privilege, which an ordinary user lacks. Other runtimes may allow it, but listening on 8080 works everywhere."
        - text: "443, because that traffic is encrypted"
          why: "443 is also below 1024, so it falls under the same limit as 80; encryption does not change it."
      answer: 0
    - kind: teach
      id: write
      title: "Writable directories for any user"
      body: |
        The harder case is files. An image prepares `/data` owned by user 1001 (`chown 1001 /data`), which works when
        it runs as 1001. Some environments, though, start every container with a UID chosen for them, in group 0.
        From [the permissions lesson](/lesson/lx.users-permissions): a process gets the owner's permissions if its
        UID owns the file, otherwise the group's if it is in the file's group, otherwise the others'. UID 54321 is
        not the owner, but it is in group 0, so the group's permissions are what matter for a directory in group 0.

        Two versions of the same image, then, each started as `--user 54321:0`. A Containerfile **`RUN`**
        instruction runs a command while the image is built, so it can prepare the directory. In the first image,
        `/data` belongs to 1001 only; in the second, `chown 1001:0` also gives it to group 0, and `chmod g=u` gives
        the group the same permissions as the owner:
    - kind: show
      id: two-recipes
      run: "head -n 5 Containerfile.owner Containerfile.group"
      highlight: ["chown 1001 /data", "chown 1001:0 /data && chmod g=u /data"]
      notice: "The two recipes, both among this lesson's source files, differ only in the `RUN` line: the second adds group 0 and the group permissions. Because the folder holds two Containerfiles, the builds below name the one to use with `-f`, and tag the results `localhost/data-owner` and `localhost/data-group`."
    - kind: show
      id: owner-only
      body: "The first image, started as UID 54321 in group 0, is expected to be refused:"
      run: "podman build -q -f Containerfile.owner -t localhost/data-owner . >/dev/null && podman run --rm --user 54321:0 localhost/data-owner sh -c 'ls -ld /data; id; touch /data/x && echo written'"
      notice: "Look at `ls -ld`: owner 1001 has `rwx`, but group `root` (0) has only `r-x`. UID 54321 is not the owner, it is in group 0, so the group's permissions apply, with no `w`: refused."
    - kind: show
      id: group-zero
      run: "podman build -q -f Containerfile.group -t localhost/data-group . >/dev/null && podman run --rm --user 54321:0 localhost/data-group sh -c 'ls -ld /data; touch /data/x && echo written'"
      notice: "`/data` is now owned by 1001 and group `root` (0), mode `rwxrwxr-x`. The process is in group 0, so the group set applies, and it can write."
    - kind: ask
      id: which-fix
      prompt: "An app writes to `/app/data`, owned by UID 1001 with mode 755. Under `--user 54321:0` it gets Permission denied. Which Containerfile change works for any UID in group 0?"
      choices:
        - text: "`chgrp -R 0 /app/data && chmod -R g=u /app/data`"
          why: "The process is not the owner but is in group 0, so the group bits apply, and `g=u` gives the group what the owner had."
        - text: "`chown -R 54321 /app/data`"
          why: "That works for UID 54321 only. The next run may use another UID, which falls back to the others bits."
        - text: "`USER root` at the end of the Containerfile"
          why: "`--user` on the command line overrides the image's USER, so the process still runs as 54321."
      answer: 0
      explain: "Give the directory to group 0 and the group the owner's permissions: any UID started in group 0 then uses the group set, which can write."
    - kind: try
      id: try-fix-dir
      body: "A Containerfile creates `/app/logs` with `RUN mkdir /app/logs && chown 1001 /app/logs`. Write the one `RUN` line that also works for any user ID in group 0."
      accept:
        - "RUN mkdir /app/logs && chown 1001:0 /app/logs && chmod g=u /app/logs"
        - "RUN mkdir /app/logs && chown 1001:root /app/logs && chmod g=u /app/logs"
        - "RUN mkdir /app/logs && chown -R 1001:0 /app/logs && chmod -R g=u /app/logs"
        - "RUN mkdir /app/logs && chown 1001 /app/logs && chgrp 0 /app/logs && chmod g=u /app/logs"
        - "RUN mkdir /app/logs && chown 1001 /app/logs && chgrp -R 0 /app/logs && chmod -R g=u /app/logs"
        - "RUN mkdir /app/logs && chgrp 0 /app/logs && chmod g=u /app/logs"
        - "RUN mkdir /app/logs && chgrp -R 0 /app/logs && chmod -R g=u /app/logs"
        - "RUN mkdir /app/logs && chown 1001:0 /app/logs && chmod 775 /app/logs"
        - "RUN mkdir /app/logs && chown 1001:0 /app/logs && chmod g+w /app/logs"
        - "RUN mkdir /app/logs && chown 1001:0 /app/logs && chmod 0775 /app/logs"
        - "RUN mkdir -p /app/logs && chown 1001:0 /app/logs && chmod g=u /app/logs"
        - "RUN mkdir -p /app/logs && chown 1001:root /app/logs && chmod g=u /app/logs"
        - "RUN mkdir -p /app/logs && chown -R 1001:0 /app/logs && chmod -R g=u /app/logs"
        - "RUN mkdir -p /app/logs && chgrp 0 /app/logs && chmod g=u /app/logs"
        - "RUN mkdir -p /app/logs && chgrp -R 0 /app/logs && chmod -R g=u /app/logs"
        - "RUN mkdir -p /app/logs && chown 1001:0 /app/logs && chmod 775 /app/logs"
        - "RUN mkdir -p /app/logs && chown 1001:0 /app/logs && chmod g+w /app/logs"
        - "RUN mkdir /app/logs && chmod g=u /app/logs && chown 1001:0 /app/logs"
        - "RUN mkdir /app/logs && chmod 775 /app/logs && chown 1001:0 /app/logs"
        - "RUN mkdir /app/logs && chmod g+w /app/logs && chown 1001:0 /app/logs"
        - "RUN mkdir /app/logs && chmod g=u /app/logs && chgrp 0 /app/logs"
        - "RUN mkdir -p /app/logs && chmod g=u /app/logs && chown 1001:0 /app/logs"
        - "RUN mkdir -p /app/logs && chmod 775 /app/logs && chown 1001:0 /app/logs"
        - "RUN mkdir -p /app/logs && chmod g+w /app/logs && chown 1001:0 /app/logs"
      hints:
        - match: "chown -R? ?54321"
          say: "A fixed number works for one UID only. Give the directory to group 0 instead."
        - match: "^RUN mkdir /app/logs && chown 1001 /app/logs$"
          say: "That is the line you started with. Add group 0 to the directory, and give the group write permission."
        - match: "^(mkdir|chown|chgrp|chmod)"
          say: "Start the line with `RUN`, the instruction that runs a command during the build."
      hint: "Group 0 needs to own the directory (`chown 1001:0`), and the group needs the owner's permissions (`chmod g=u`)."
      then: "The same pattern as the recorded `data-group` image: group 0 owns the directory, and the group has the owner's permissions."
    - kind: reflect
      id: explain-any-uid
      prompt: "Explain to a colleague why an image should not depend on running as root or as one particular user."
      model: |
        Many environments start containers as an ordinary, sometimes arbitrary, user ID, and some refuse root
        entirely. An image that needs root, or writes only where user 1001 may, then fails. Images that listen on
        unprivileged ports and give their writable directories to group 0 with group write work under any user ID,
        and limit the damage if a process is compromised.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can explain what root inside a rootless container means on the host, run a container as another user,
        know why port 80 needed privilege in the recording, and write the build line that makes a directory
        writable for any user ID in group 0.

        This matters again later in the course, on platforms that start every container as an arbitrary user. Next:
        what to do when a container will not start or exits at once.
  sections:
    - id: what-restricted-v2-does-to-your
      title: 'Later in the course: what restricted-v2 does to your process'
      depth: true
      body: "On this cluster, pods created by `developer` are admitted by the **restricted-v2** SCC (the pod carries\nthe\
        \ annotation `openshift.io/scc: restricted-v2`). In the lab [Anatomy of a container](/lab/lab.container-anatomy),\nwhose recording holds this output, the container ran as\n`uid=1004310000(1004310000) gid=0(root)\
        \ groups=0(root),1004310000`, with `CapEff: 0000000000000000`:\nevery Linux capability dropped. Each part comes from\
        \ a rule of the SCC:\n\n- `runAsUser: MustRunAsRange`: the UID is the first one of the project's range (namespace\
        \ annotation\n  `openshift.io/sa.scc.uid-range`, for example `1004310000/10000`) unless the pod asks for another UID\n\
        \  inside that range. Any other UID, including 0, is rejected.\n- `fsGroup: MustRunAs`: the pod gets the first ID\
        \ of the project's supplemental group range\n  (annotation `openshift.io/sa.scc.supplemental-groups`) as its fsGroup.\
        \ That is the extra group\n  `1004310000` you see in `id`, and volumes that support it are made writable for that\
        \ group.\n- `seLinuxContext: MustRunAs`: the pod gets the project's SELinux MCS label (annotation\n  `openshift.io/sa.scc.mcs`),\
        \ so SELinux also keeps projects apart.\n- `requiredDropCapabilities: [ALL]` (only `NET_BIND_SERVICE` may be added\
        \ back, explicitly) and\n  `allowPrivilegeEscalation: false`.\n- `seccompProfiles: [runtime/default]`: the pod's seccomp profile defaults to `RuntimeDefault`.\n- Only some volume\
        \ types: `configMap`, `csi` (inline CSI volumes), `downwardAPI`, `emptyDir`,\n  `ephemeral`, `image`, `persistentVolumeClaim`,\
        \ `projected` and `secret` (the 4.21 definition). A\n  `hostPath` volume needs another SCC.\n- The **primary group\
        \ is 0 (the root group)** when the pod sets no `runAsGroup`. This is not an SCC rule:\n  the assigned UID has no entry\
        \ in the image's `/etc/passwd`, so the runtime falls back to group 0;\n  restricted-v2 neither fills in nor checks\
        \ `runAsGroup`. Group 0 grants no privileges by itself; it is the\n  contract that lets images make writable paths\
        \ group-owned by 0 and group-writable.\n\nrestricted-v2 is one of several **Security Context Constraints** (SCCs),\
        \ the OpenShift policies that check a\npod's security settings when it is created. Ordinary pods without a user namespace normally\
        \ get restricted-v2 unless an administrator\nhas granted something wider; eligible pods that request `hostUsers:\
        \ false` can use restricted-v3. How admission chooses between SCCs, and how an administrator\
        \ grants one, is\nplatform administration, covered in [Security Context Constraints](/lesson/f.scc). For now, the\
        \ rules\nabove are the ones your images must live with.\n"
    - id: investigate-a-rejected-pod
      title: 'A pointer: when a cluster rejects the pod'
      depth: true
      body: |
        Clusters that enforce a security policy can refuse a pod whose image insists on root or on a fixed user
        ID. You will meet this again, with the evidence to read, in [Security Context Constraints](/lesson/f.scc)
        and in the lab [A Deployment with no pods](/lab/inc.scc-root), after the Kubernetes and OpenShift
        lessons. Until then, the rule in this lesson is the one that prevents it: images that listen on a high
        port and give their writable directories to group 0 work under any user ID.
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: "- **Asking for `anyuid` to fix a permission error.** The real fix is almost always in the image: make\n  the\
        \ path group 0 and group-writable. A wider SCC changes the security posture of every pod using that\n  ServiceAccount.\n\
        - **Setting `runAsUser` to 0 or to a fixed UID such as 1001 in the Deployment.** It is outside the\n  project's range,\
        \ so admission rejects the pod. Leave `runAsUser` unset and let the SCC choose.\n- **Looking for the error on a pod.**\
        \ A pod rejected by SCC admission never exists: the message\n  (`unable to validate against any security context constraint`)\
        \ is a `FailedCreate` event on the\n  ReplicaSet.\n- **Expecting the same UID in every project.** Each project has\
        \ its own range, so a UID that works in\n  development is different in production; images must not care.\n"
  review:
    - q: "What does root inside a rootless Podman container correspond to on the host?"
      a: "The ordinary user who started the container: a user namespace maps the container's UID 0 to that user."
    - q: "Why can an ordinary user not listen on port 80?"
      a: "Ports below 1024 are privileged; listen on 8080 or similar and map it from outside."
    - q: "How do you make a directory writable for any UID in group 0?"
      a: "`chgrp -R 0 dir && chmod -R g=u dir` in the Containerfile."
  commands:
    - cmd: "podman pull -q quay.io/prometheus/busybox:latest >/dev/null"
      meaning: "make sure the image is present (not shown in the lesson)"
    - cmd: "podman run --rm quay.io/prometheus/busybox:latest id"
      meaning: "root inside the container"
    - cmd: "podman run -d --name sleeper quay.io/prometheus/busybox:latest sleep 100 >/dev/null; podman top sleeper user huser args; podman rm -f -t 0 sleeper >/dev/null"
      meaning: "root inside, an ordinary user on the host"
    - cmd: "podman run --rm --user 1001 quay.io/prometheus/busybox:latest sh -c 'httpd -p 80 && echo \"listening on 80\" || echo \"port 80 refused\"'; podman run --rm --user 1001 quay.io/prometheus/busybox:latest sh -c 'httpd -p 8080 && echo \"listening on 8080\"'"
      meaning: "port 80 refused to an ordinary user, 8080 allowed"
    - cmd: "head -n 5 Containerfile.owner Containerfile.group"
      meaning: "the two recipes"
    - cmd: "podman build -q -f Containerfile.owner -t localhost/data-owner . >/dev/null && podman run --rm --user 54321:0 localhost/data-owner sh -c 'ls -ld /data; id; touch /data/x && echo written'"
      expect: fail
      meaning: "a directory owned by 1001 only: refused to UID 54321"
    - cmd: "podman build -q -f Containerfile.group -t localhost/data-group . >/dev/null && podman run --rm --user 54321:0 localhost/data-group sh -c 'ls -ld /data; touch /data/x && echo written'"
      meaning: "group 0 with the owner's permissions: any UID in group 0 can write"
    - cmd: "podman rmi -f localhost/data-owner localhost/data-group >/dev/null; echo cleaned up"
      meaning: "clean up (not shown in the lesson)"
  files:
    Containerfile.owner: |
      FROM quay.io/prometheus/busybox:latest
      RUN mkdir /data && chown 1001 /data
      USER 1001
    Containerfile.group: |
      FROM quay.io/prometheus/busybox:latest
      RUN mkdir /data && chown 1001:0 /data && chmod g=u /data
      USER 1001
  references:
    - {title: "Podman documentation: rootless containers", url: "https://github.com/containers/podman/blob/main/docs/tutorials/rootless_tutorial.md"}
    - {title: "Podman documentation: podman top (huser)", url: "https://docs.podman.io/en/latest/markdown/podman-top.1.html"}
    - {title: "Linux man-pages: user_namespaces(7)", url: "https://man7.org/linux/man-pages/man7/user_namespaces.7.html"}
    - {title: "Linux man-pages: capabilities(7) (CAP_NET_BIND_SERVICE)", url: "https://man7.org/linux/man-pages/man7/capabilities.7.html"}
    - {title: "OpenShift 4.21: Creating images (support arbitrary user ids)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/creating-images"}

- id: ct.troubleshoot-containers
  title: "When a container will not run"
  subtitle: "Status, exit code, logs, a look inside: five recorded failures, read from their evidence"
  module: ct1-podman
  mode: LOCAL_SIMULATION
  minutes: 28
  level: 2
  supports: "Podman 5.8 (rootless) on RHEL 9. Recorded on a RHEL 9 workstation as an ordinary user; the broken image is built for the recording and removed afterwards."
  concepts: [container.podman, container.debugging, linux.process]
  prerequisites: [a.container-security]
  objective: |
    Find out why a container does not run by reading, in order, its status and exit code, its logs, its
    configuration, and its files from a shell; recognise a script with Windows line endings, a missing execute
    permission, a command that is not found, a missing setting and a memory limit by their evidence.
  flow:
    - kind: ask
      id: recall-uid
      prompt: "A look back. An image runs fine as root but cannot write to `/app` under `--user 54321:0`. What is the usual fix?"
      recalls: a.container-security
      choices:
        - text: "Give `/app` to group 0 with group write"
          why: "Any UID started in group 0 then uses the group set, which can write."
        - text: "Run the container as root again"
          why: "That hides the problem, and some platforms refuse root entirely. Fix the directory's permissions."
        - text: "Create user 54321 in the image"
          why: "The next run may use another UID. Group 0 permissions work for all of them."
      answer: 0
    - kind: teach
      id: method
      title: "Four questions, in order"
      body: |
        A container that will not start, or stops at once, is one of the most common problems with containers, and
        guessing wastes time. The evidence is always in the same four places, best read in this order:

        1. **Status and exit code**: `podman ps -a` shows `Exited (N)`. The number already narrows things down.
        2. **Logs**: `podman logs NAME` shows what the program (or the runtime) said before it stopped.
        3. **Configuration**: `podman inspect NAME` shows the command it was started with, the user, and more.
        4. **A look inside**: start the image with a shell instead of its normal command, and check the files.

        The recordings follow this order on a deliberately broken image.
    - kind: teach
      id: experiment-setup
      title: "The broken image, and where it comes from"
      body: |
        Every failure in this lesson comes from one image that you build yourself; nothing is downloaded except
        the `busybox` base image. Its inputs are listed in **Before you start: source files** above this lesson.
        To reproduce it, save them in a new, empty folder at the paths shown, including `data/input.csv`, and run
        the lesson's commands from that folder: they use relative paths.

        Only `Containerfile` and the two scripts it copies, `start.sh` and `noshebang.sh`, go into the image.
        Two more scripts appear inside the image without being in your folder: the build itself writes them, as
        the next step shows. `data/input.csv` is used only by the SELinux example under "Go deeper", which gives
        its commands but is not part of this lesson's recording.

        The containers are named `config-test`, `app` and `oom`. Use these names only if no container of yours
        already has them, and remove only what you created for this exercise.
    - kind: show
      id: broken-recipe
      caption: "Containerfile"
      code: |
        FROM quay.io/prometheus/busybox:latest
        LABEL academy.lesson=ct.troubleshoot-containers
        WORKDIR /app
        COPY start.sh noshebang.sh ./
        RUN printf '#!/bin/sh\r\necho ready\r\n' > crlf.sh \
         && cp start.sh noexec.sh \
         && chmod 755 start.sh noshebang.sh crlf.sh && chmod 644 noexec.sh
        ENTRYPOINT ["/app/crlf.sh"]
      notice: |
        - `WORKDIR /app` makes `/app` the image's working directory, so `COPY … ./` puts the two scripts there.
        - The `RUN` line runs during the build. It writes `crlf.sh` with `printf`, ending each line with `\r\n`,
          the Windows line ending, on purpose. It copies `start.sh` to `noexec.sh` and gives that copy mode `644`:
          readable, but not executable.
        - `ENTRYPOINT` makes `/app/crlf.sh` the program that starts when no other is asked for.

        The build names its result `localhost/broken`: an image made on your machine, not one to pull from a
        registry. `noshebang.sh` is a spare example that the main steps do not run. One program the steps call,
        `startapp`, exists nowhere, on purpose.
    - kind: ask
      id: which-source
      prompt: "Your folder has no `noexec.sh`, yet the lesson runs `/app/noexec.sh` in the image. Where does it come from?"
      choices:
        - text: "The build copies `start.sh` to it"
          why: "The `RUN` line runs `cp start.sh noexec.sh` inside the image during the build, then removes its execute bits with `chmod 644`."
        - text: "It is missing from your source files"
          why: "Nothing is missing: the file is made by the build. Only files that `COPY` reads must exist in your folder."
        - text: "Podman downloads it with the base image"
          why: "The base image is plain `busybox`; it knows nothing about this lesson. The `RUN` line of the Containerfile creates the file."
      answer: 0
    - kind: teach
      id: first-failure
      title: "A first failure: a missing setting"
      body: |
        An image can name the program that starts when you run it without giving a command: its **entrypoint**
        (`ENTRYPOINT`), its default command (`CMD`), or both. The broken image of this lesson sets an `ENTRYPOINT`,
        which a later step examines. To start with, the recording replaces it for one run with
        `--entrypoint /app/start.sh`, a small script that needs a setting called
        `DB_URL`. Such a setting is an **environment variable**: a named value that a program receives when it
        starts. The script stops with an error if it does not get one:
    - kind: show
      id: start-script
      run: "cat start.sh"
      notice: "The second line stops the script with the message `DB_URL is not set` when the variable is empty or missing."
    - kind: show
      id: run
      run: "podman build -q -t localhost/broken . >/dev/null && podman run --name config-test --entrypoint /app/start.sh localhost/broken"
      notice: "The program complained on the terminal, and `podman run` returned at once. The container was named `config-test` and not removed (no `--rm`), so it can still be examined."
      understand:
        purpose: Builds the lesson's image from the Containerfile in the current folder, then, only if the build
          succeeded, starts one container from it that runs `/app/start.sh` instead of the image's entrypoint.
        parts:
          - text: podman build -q -t localhost/broken .
            means: 'Builds an image. `.` is the build context: the current folder, where Podman finds the Containerfile
              and the files `COPY` reads. `-q` silences the progress messages, `-t` names the result `localhost/broken`.'
          - text: '>/dev/null'
            means: Throws away what is left of the build's normal output; error messages still reach the terminal.
          - text: '&&'
            means: Runs the next command only if the build succeeded, so a build error is never mistaken for a
              failing container.
          - text: --name config-test
            means: Names the container. Without `--rm`, it is kept after it stops, ready to be examined.
          - text: --entrypoint /app/start.sh
            means: Replaces the image's `ENTRYPOINT` (`/app/crlf.sh`) for this one container.
        output: The script's own error message, `DB_URL is not set`, and a non-zero exit status.
        needs: The source files of this lesson in the current folder, and the `busybox` base image cached or
          reachable on quay.io.
        mistakes:
          - 'Running it from another folder: the build then cannot find the Containerfile or `start.sh`.'
          - 'Running it twice: the second `podman run` refuses, because a container named `config-test` already
            exists. Remove your own `config-test` first.'
        concepts:
          - container.build
          - container.debugging
        refs:
          - title: 'podman-build(1): context directory, --quiet, --tag'
            url: https://docs.podman.io/en/latest/markdown/podman-build.1.html
          - title: 'podman-run(1): --name, --entrypoint'
            url: https://docs.podman.io/en/latest/markdown/podman-run.1.html
          - title: 'GNU Bash manual: lists of commands (&&)'
            url: https://www.gnu.org/software/bash/manual/html_node/Lists.html
    - kind: try
      id: try-status
      body: "Question 1: show the container `config-test`, which has already stopped, with its status."
      accept:
        - "podman ps -a"
        - "podman ps -a --filter name=config-test"
        - "podman ps --filter name=config-test -a"
        - "podman ps -a -f name=config-test"
        - "podman ps -f name=config-test -a"
        - "podman ps -a --filter=name=config-test"
        - "podman ps --filter=name=config-test -a"
        - "podman ps -a --filter name=^config-test$"
        - "podman ps --filter name=^config-test$ -a"
        - "podman ps --all"
        - "podman ps --all --filter name=config-test"
        - "podman ps --filter name=config-test --all"
        - "podman ps --all -f name=config-test"
        - "podman ps -f name=config-test --all"
        - "podman ps --all --filter=name=config-test"
        - "podman ps --filter=name=config-test --all"
        - "podman ps --all --filter name=^config-test$"
        - "podman ps --filter name=^config-test$ --all"
        - "podman container ps -a"
        - "podman container ps -a --filter name=config-test"
        - "podman container ps --filter name=config-test -a"
        - "podman container ps -a -f name=config-test"
        - "podman container ps -f name=config-test -a"
        - "podman container ps -a --filter=name=config-test"
        - "podman container ps --filter=name=config-test -a"
        - "podman container ps -a --filter name=^config-test$"
        - "podman container ps --filter name=^config-test$ -a"
        - "podman container ps --all"
        - "podman container ps --all --filter name=config-test"
        - "podman container ps --filter name=config-test --all"
        - "podman container ps --all -f name=config-test"
        - "podman container ps -f name=config-test --all"
        - "podman container ps --all --filter=name=config-test"
        - "podman container ps --filter=name=config-test --all"
        - "podman container ps --all --filter name=^config-test$"
        - "podman container ps --filter name=^config-test$ --all"
        - "podman container ls -a"
        - "podman container ls -a --filter name=config-test"
        - "podman container ls --filter name=config-test -a"
        - "podman container ls -a -f name=config-test"
        - "podman container ls -f name=config-test -a"
        - "podman container ls -a --filter=name=config-test"
        - "podman container ls --filter=name=config-test -a"
        - "podman container ls -a --filter name=^config-test$"
        - "podman container ls --filter name=^config-test$ -a"
        - "podman container ls --all"
        - "podman container ls --all --filter name=config-test"
        - "podman container ls --filter name=config-test --all"
        - "podman container ls --all -f name=config-test"
        - "podman container ls -f name=config-test --all"
        - "podman container ls --all --filter=name=config-test"
        - "podman container ls --filter=name=config-test --all"
        - "podman container ls --all --filter name=^config-test$"
        - "podman container ls --filter name=^config-test$ --all"
        - "podman container list -a"
        - "podman container list -a --filter name=config-test"
        - "podman container list --filter name=config-test -a"
        - "podman container list -a -f name=config-test"
