    - kind: teach
      id: exit-codes
      title: "What the exit code already tells you"
      body: |
        A nonzero exit code needs context: the program may have reported a failure, or it may not have started.
        Two numbers matter: the **exit status** that `podman run` returns to your shell (`echo $?`), and the code
        the container stores, shown by `podman inspect` as `.State.ExitCode`. Podman also reserves some numbers for
        its own failures:

        | Exit code | Usually means |
        |---|---|
        | 125 | Podman itself failed (a wrong option, an image that cannot be found) |
        | 126 | the command was found but cannot be executed (no `x` permission) |
        | 127 | the command was not found |
        | 137 | killed by SIGKILL (128 + 9): out of memory, or a forced stop |
        | 143 | stopped by SIGTERM (128 + 15) |
        | 1, 2, … | the program, or the runtime, reported an error: read the logs and the terminal message |

        Two more recorded failures, started with a different command from the same broken image:
    - kind: show
      id: noexec
      run: "podman run --rm --entrypoint /app/noexec.sh localhost/broken"
      notice: "126: the file exists but has no execute permission. The error is printed by the runtime, and the exit status is 126."
    - kind: show
      id: notfound
      run: "podman run --rm --entrypoint startapp localhost/broken"
      notice: "127: no program called `startapp` in the container's `$PATH`. A typo, or a tool the image does not contain."
    - kind: ask
      id: guess-127
      prompt: "An image's command is `startapp`, and `podman run` fails with exit code 127. What do you check first?"
      choices:
        - text: "Whether `startapp` exists in the image's `$PATH`"
          why: "127 is \"command not found\": a typo in the name, or a program the image does not contain."
        - text: "Whether `startapp` is executable"
          why: "A program that exists but cannot be executed gives 126. 127 means it was not found at all."
        - text: "Whether the container ran out of memory"
          why: "That gives 137 with OOMKilled true. 127 is about finding the command."
      answer: 0
    - kind: teach
      id: crlf-intro
      title: "A harder case: the image's own entrypoint"
      body: |
        Now the image's own entrypoint, the script `/app/crlf.sh`. It fails too, but the message looks wrong: the
        file exists. The recording runs it without `--entrypoint`:
    - kind: show
      id: crlf-run
      run: "podman build -q -t localhost/broken . >/dev/null && podman run --name app localhost/broken"
      notice: "It stops at once, with an error from the runtime: it cannot execute `/app/crlf.sh`, \"No such file or directory\"."
    - kind: show
      id: crlf-status
      body: "The stored exit code, and whether memory was involved:"
      run: "podman inspect app --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} entrypoint={{json .Config.Entrypoint}} user={{.Config.User}}'"
      notice: "Exit code 1, even though the script never ran: this is a case of the last row of the table, where the runtime, not the program, reported the error. `oom=false`, and the entrypoint is `/app/crlf.sh`."
    - kind: show
      id: crlf-logs
      body: "And the logs of this container:"
      run: "podman logs app"
      notice: "The runtime's error is in the logs as well: the same line as on the terminal. Read the terminal output and `podman logs`; either may hold the message."
    - kind: ask
      id: guess-missing
      guess: true
      prompt: "The runtime says `/app/crlf.sh`: \"No such file or directory\". Does the file exist in the image?"
      choices:
        - text: "No, the COPY must have missed it"
          why: "A reasonable reading of the message. The next step looks inside the image."
        - text: "Yes, something else is missing"
          why: "The next step looks inside the image and shows what it is."
        - text: "It cannot be known from outside"
          why: "It can: start the image with a shell instead of its command. The next step does exactly that."
      answer: 1
    - kind: show
      id: inside
      body: "Question 4: `--entrypoint sh` starts the image with a shell instead of its normal command, so you can look:"
      run: "podman run --rm --entrypoint sh localhost/broken -c 'ls -l /app; head -1 /app/crlf.sh | od -c'"
      highlight: ["crlf.sh", "\\r"]
      notice: |
        The script is there and executable. `od -c` shows its first line character by character: `#!/bin/sh\r\n`.
        The `\r` is a Windows line ending. The kernel reads the first line to find the interpreter, and looks for a
        program called `/bin/sh\r`, which does not exist: hence "No such file or directory" for a file that exists.
    - kind: show
      id: crlf-fix
      body: "The repair removes the `\\r` at the end of each line. The recording does it on a copy inside the container and runs the result:"
      run: "podman run --rm --entrypoint sh localhost/broken -c \"sed 's/\\r\\$//' /app/crlf.sh > /tmp/fixed.sh && chmod +x /tmp/fixed.sh && /tmp/fixed.sh\""
      notice: "`ready`: with the line endings fixed, the script runs. Only this temporary container's copy changed (`--rm` removed it): the image, and every new container started from it, still has the `\\r`. A lasting fix changes the build input and rebuilds."
    - kind: ask
      id: durable-fix
      prompt: "After that repair, a colleague runs `podman run --name app2 localhost/broken`. What happens, and where does the lasting fix go?"
      choices:
        - text: "It fails again; fix the Containerfile's `printf` and rebuild"
          why: "The repair was made in a temporary container's writable layer, gone with it. The `\\r` comes from the `printf` in the Containerfile's `RUN` line: write `\\n` there, rebuild, and check a new container."
        - text: "It prints `ready`; the image was repaired in place"
          why: "A container never changes its image: the fixed copy lived in the temporary container's own layer and disappeared with it."
        - text: "It prints `ready` once the old container `app` is removed"
          why: "Containers do not share their changes. Every new container starts from the unchanged image, `\\r` included."
      answer: 0
    - kind: show
      id: oom
      body: "And the last classic: a program that needs more memory than its limit allows (here 32 MiB):"
      run: "podman run --name oom --memory 32m --entrypoint sh localhost/broken -c 'head -c 200m /dev/zero | tail > /dev/null'; podman inspect oom --format 'exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}}'"
      highlight: ["Killed", "oomkilled=true"]
      notice: "`Killed`, exit 137, and `oomkilled=true`: the kernel's out-of-memory killer ended it, as the cgroups lesson predicted. Raise the limit, or make the program use less."
      understand:
        purpose: Starts a container limited to 32 MiB of memory whose shell command needs far more, then prints the exit
          code and whether the kernel killed it for memory.
        parts:
          - text: --memory 32m
            means: The container's memory limit, 32 mebibytes, enforced by the kernel through cgroups.
          - text: --entrypoint sh
            means: Replaces the image's entrypoint (the broken script) with `sh`, so `-c '…'` is a shell command to run.
          - text: head -c 200m /dev/zero
            means: 'Prints the first 200 MiB of `/dev/zero`, a device file that returns zero bytes forever. `head` passes
              the bytes on as it reads them, so it needs little memory itself.'
          - text: '| tail > /dev/null'
            means: '`tail` prints the last 10 lines, so it must keep everything since the tenth line from the end. The
              zero bytes contain no line break: the whole 200 MiB is one line, which `tail` keeps in memory. That
              is what exceeds the limit. `> /dev/null` discards what it would print.'
          - text: --format 'exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}}'
            means: 'A Go template: prints two fields of the stopped container''s state, its exit code and the flag Podman
              sets when the kernel killed it for memory.'
        mistakes:
          - 'Thinking `head` is what uses the memory: it streams. The process that grows is the one that has to remember
            its input.'
        concepts:
          - linux.cgroups
          - container.debugging
        refs:
          - title: 'podman-run(1): --memory, --entrypoint'
            url: https://docs.podman.io/en/latest/markdown/podman-run.1.html
          - title: podman-inspect(1)
            url: https://docs.podman.io/en/latest/markdown/podman-inspect.1.html
          - title: 'BusyBox commands: head, tail'
            url: https://busybox.net/downloads/BusyBox.html
    - kind: ask
      id: match-137
      prompt: "A container shows `Exited (137)` and `podman inspect` reports `OOMKilled: false`. What should you check next?"
      choices:
        - text: "Whether it was forcibly stopped"
          why: "137 is conventionally 128 + 9, SIGKILL, and without the out-of-memory flag the next suspect is a forced stop, such as `podman stop` after SIGTERM was ignored. It is a lead, not proof: a program can also return 137 itself."
        - text: "Whether the limit on memory is too low"
          why: "`OOMKilled: false` says the kernel did not kill it for memory, so a memory limit is not the first suspect. 137 alone only says SIGKILL."
        - text: "Whether a script has Windows line endings"
          why: "That failure showed up as exit code 1 with an exec error on the terminal, not as 137."
      answer: 0
    - kind: order
      id: order-method
      prompt: "Put the troubleshooting questions in the order this lesson uses."
      items:
        - "`podman ps -a`: status and exit code"
        - "`podman logs`: what the program said"
        - "`podman inspect`: command, user, limits"
        - "`podman run --entrypoint sh`: look at the files"
      why: "Cheapest and most telling first: the exit code narrows the cause, the logs usually name it, the configuration explains it, and a shell inside confirms it."
    - kind: reflect
      id: explain-crlf
      prompt: "Explain to a colleague how a container can fail with \"No such file or directory\" for a script that exists."
      model: |
        For a script, the kernel reads the first line, `#!/bin/sh`, to find the interpreter. If the file was saved
        with Windows line endings, that line is really `#!/bin/sh\r`, and the kernel looks for a program named
        `/bin/sh\r`, which does not exist. The error names the script, but the missing file is the interpreter.
        `od -c` on the first line shows the `\r`; converting the line endings fixes it.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can investigate a container that will not run, in a fixed order, and recognise five common causes from
        their evidence: a missing setting, a missing execute permission, a command that is not found, Windows line
        endings, and a memory limit. You can also give a container a setting with `-e`.

        Next: several containers working together: a network, a volume, a secret and a health check.
  sections:
    - id: network-failures
      title: It runs, but nobody can reach it
      depth: true
      body: |
        Two common cases. The messages below are examples, not part of this lesson's recording: ports, names and
        addresses depend on your setup.

        **Port already in use.** A second container asking for a host port that the first already publishes, here
        18380, is never started: it stays `Created`, and with rootless Podman 5 the error names the port, for
        example `Failed to bind port 18380 (Address already in use)`. Find the owner with
        `podman ps --format '{{.Names}} {{.Ports}}'` (or `ss -tlnp` for a host process) and pick another port.

        **The application listens on 127.0.0.1.** The container runs, the port is published, yet `curl` from the
        host fails, for example:

        ```
        $ curl http://localhost:18380/
        curl: (56) Recv failure: Connection reset by peer
        ```

        `netstat -tln` inside the container, run as `podman exec NAME netstat -tln`, shows the cause:

        ```
        Proto Recv-Q Send-Q Local Address           Foreign Address         State
        tcp        0      0 127.0.0.1:8080          0.0.0.0:*               LISTEN
        ```

        The server listens on the container's loopback only, and published traffic arrives on the container's
        network interface. Make the application listen on `0.0.0.0` (all addresses). Any other container or health
        check that connects to the container's own address fails with `connection refused` in the same way, because
        only a process inside the container reaches its loopback.
    - id: selinux-bind-mounts
      title: SELinux and bind mounts
      depth: true
      body: |
        An experiment to repeat on your own machine, from the lesson's folder with `data/input.csv`. The outputs
        below are an example, not part of this lesson's recording: the file's label depends on where the folder
        is, and the date and categories will differ.

        On the host, the file to mount is readable by everyone; `stat` prints its mode and label:

        ```
        $ stat -c '%A %C %n' data/input.csv
        -rw-r--r-- unconfined_u:object_r:user_tmp_t:s0 data/input.csv
        ```

        Mounted without `:Z`, the container (root inside, which is your own UID on the host) sees the directory
        with ordinary permissions, yet cannot read the file. That is what
        `podman run --rm -v ./data:/data quay.io/prometheus/busybox:latest sh -c 'ls -ld /data; cat /data/input.csv'`
        prints:

        ```
        drwxr-xr-x    2 root     root            23 Oct 15 03:11 /data
        cat: can't open '/data/input.csv': Permission denied
        ```

        When mode bits and ownership say yes and the kernel says no, the refusal comes from SELinux. The file's
        type is `user_tmp_t` (files under your home are `user_home_t`), which the container's type,
        `container_t`, may not read. With `:Z`,
        `podman run --rm -v ./data:/data:Z quay.io/prometheus/busybox:latest cat /data/input.csv` prints `id,amount`,
        and `stat -c '%A %C %n' data/input.csv` then shows the same mode with a new label, such as
        `system_u:object_r:container_file_t:s0:c584,c654`: the type containers may use and that container's two
        MCS categories. The new label stays on the host folder: relabel only a folder made for containers.

        Proof on a machine where you have root: `ausearch -m avc -ts recent` lists the denial. The fix is the
        label, never `setenforce 0`. The same lock keeps containers apart from each other: each one gets its own MCS
        categories, such as the `c584,c654` above. Clusters use the labels to keep projects apart, as
        [SELinux, seccomp and the node underneath](/lesson/n.selinux-node) explains later in the course.
    - id: from-podman-to-pods
      title: 'A pointer: the same failures in a pod'
      depth: true
      body: |
        The same method, status, logs, configuration and a look inside, applies to a pod on a cluster, where the
        symptoms have other names (`CrashLoopBackOff`, `OOMKilled`, `ImagePullBackOff`). You will practise that in
        [Life of a pod](/lesson/b.pod-lifecycle) and [A method for troubleshooting applications](/lesson/o1.troubleshooting),
        after the Kubernetes lessons.
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: "- **Reading only the last log line.** The real error is often a few lines earlier; with Podman read the\n  whole\
        \ `podman logs`, on a cluster read the logs of the run that crashed.\n- **Trying `podman exec` on a container\
        \ that exited.** There is no process to join. Start the image\n  again with `--entrypoint sh`.\n- **Treating every\
        \ 137 as \"out of memory\".** Check `OOMKilled`; if it is false, it is a lead, not proof: look for a\n  forced stop (`podman stop` after the timeout, `podman kill`) in `podman events`, and remember a program\n  can exit 137 itself.\n- **Running\
        \ as root \"to see if it helps\".** It hides the permission problem you will meet on OpenShift.\n- **Disabling SELinux\
        \ to fix a bind mount.** Relabel the directory with `:Z` or `:z` instead.\n- **Assuming \"No such file or directory\"\
        \ means the file is missing.** For scripts it often means the\n  interpreter on the `#!` line is missing.\n"
  review:
    - q: "In which order do you investigate a container that will not run?"
      a: "Status and exit code (`podman ps -a`), logs, configuration (`podman inspect`), then a shell inside (`--entrypoint sh`)."
    - q: "What do exit codes 126, 127 and 137 usually mean?"
      a: "126: found but not executable. 127: command not found. 137: killed by SIGKILL (out of memory if OOMKilled is true)."
    - q: "Why can a script that exists fail with \"No such file or directory\"?"
      a: "Its #! line ends with a Windows \\r, so the interpreter it names does not exist."
    - q: "How do you look at the files of an image whose command fails at once?"
      a: "Start it with another command: `podman run --rm --entrypoint sh IMAGE -c '…'`."
  commands:
    - cmd: "podman pull -q quay.io/prometheus/busybox:latest >/dev/null"
      meaning: "make sure the base image is present (not shown in the lesson)"
    - cmd: "cat start.sh"
      meaning: "the script that needs DB_URL"
    - cmd: "podman build -q -t localhost/broken . >/dev/null && podman run --name config-test --entrypoint /app/start.sh localhost/broken"
      expect: fail
      meaning: "a missing setting: the program complains and exits with 2; the container is kept"
    - cmd: "podman ps -a --filter name=^config-test$ --format '{{.Names}} | {{.Status}}'"
      meaning: "Exited (2)"
    - cmd: "podman logs config-test"
      meaning: "the program's message, kept by Podman"
    - cmd: "podman inspect config-test --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} entrypoint={{json .Config.Entrypoint}} user={{.Config.User}}'"
      meaning: "the configuration it ran with"
    - cmd: "podman run --rm -e MESSAGE=hello --entrypoint printenv localhost/broken MESSAGE"
      meaning: "-e gives the container an environment variable"
    - cmd: "podman run --rm --entrypoint /app/noexec.sh localhost/broken"
      expect: fail
      meaning: "not executable"
    - cmd: "podman run --rm --entrypoint startapp localhost/broken"
      expect: fail
      meaning: "not found"
    - cmd: "podman run --rm -e DB_URL=postgres://db:5432/app --entrypoint /app/start.sh localhost/broken"
      meaning: "with the setting"
    - cmd: "podman build -q -t localhost/broken . >/dev/null && podman run --name app localhost/broken"
      expect: fail
      meaning: "a script with Windows line endings as the entrypoint"
    - cmd: "podman inspect app --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} entrypoint={{json .Config.Entrypoint}} user={{.Config.User}}'"
      meaning: "exit code 1 from the runtime"
    - cmd: "podman logs app"
      meaning: "the logs of the container that could not start its script"
    - cmd: "podman run --rm --entrypoint sh localhost/broken -c 'ls -l /app; head -1 /app/crlf.sh | od -c'"
      meaning: "a look inside: the \\r at the end of the #! line"
    - cmd: "podman run --rm --entrypoint sh localhost/broken -c \"sed 's/\\r\\$//' /app/crlf.sh > /tmp/fixed.sh && chmod +x /tmp/fixed.sh && /tmp/fixed.sh\""
      meaning: "removing the \\r makes the script run"
    - cmd: "podman run --name oom --memory 32m --entrypoint sh localhost/broken -c 'head -c 200m /dev/zero | tail > /dev/null'; podman inspect oom --format 'exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}}'"
      meaning: "killed for memory: 137, OOMKilled true"
    - cmd: "podman rm -f -t 0 app oom config-test >/dev/null; podman rmi -f localhost/broken >/dev/null; echo cleaned up"
      meaning: "clean up (not shown in the lesson)"
  files:
    "Containerfile": |
      FROM quay.io/prometheus/busybox:latest
      LABEL academy.lesson=ct.troubleshoot-containers
      WORKDIR /app
      COPY start.sh noshebang.sh ./
      RUN printf '#!/bin/sh\r\necho ready\r\n' > crlf.sh \
       && cp start.sh noexec.sh \
       && chmod 755 start.sh noshebang.sh crlf.sh && chmod 644 noexec.sh
      ENTRYPOINT ["/app/crlf.sh"]
    "start.sh": |
      #!/bin/sh
      : "${DB_URL:?DB_URL is not set}"
      echo "connecting to ${DB_URL}"
    "noshebang.sh": |
      echo "this script has no #! line"
    "data/input.csv": |
      id,amount
  references:
    - {title: "Podman documentation: podman ps", url: "https://docs.podman.io/en/latest/markdown/podman-ps.1.html"}
    - {title: "Podman documentation: podman logs", url: "https://docs.podman.io/en/latest/markdown/podman-logs.1.html"}
    - {title: "Podman documentation: podman inspect", url: "https://docs.podman.io/en/latest/markdown/podman-inspect.1.html"}
    - {title: "Podman documentation: podman run (--entrypoint, -e, --memory)", url: "https://docs.podman.io/en/latest/markdown/podman-run.1.html"}
    - {title: "Linux man-pages: execve(2) (interpreter scripts)", url: "https://man7.org/linux/man-pages/man2/execve.2.html"}

- id: ct.podman-stack
  title: "Several containers that work together"
  subtitle: "A network where containers find each other by name, data that outlives a container, secrets, and start order"
  module: ct1-podman
  mode: LOCAL_SIMULATION
  minutes: 25
  level: 2
  supports: "Podman 5.8 (rootless) on RHEL 9. Recorded on a RHEL 9 workstation as an ordinary user; every network, volume, secret and container is created for the recording and removed afterwards."
  concepts: [container.podman, net.dns, sec.secrets]
  prerequisites: [ct.troubleshoot-containers]
  objective: |
    Put containers on a network where they reach each other by name, keep data in a named volume that outlives
    any container, give a container a secret without exposing it in its configuration, and wait for a service to
    be healthy rather than merely started.
  flow:
    - kind: ask
      id: recall-order
      prompt: "A look back. A container exits with code 127. What does that usually mean?"
      recalls: ct.troubleshoot-containers
      choices:
        - text: "Its command was not found"
          why: "127 is the shell's and the runtime's code for \"command not found\": a typo, or a program missing from the image."
        - text: "It ran out of memory"
          why: "That gives 137 with OOMKilled true."
        - text: "It was stopped by SIGTERM"
          why: "That gives 143 (128 + 15)."
      answer: 0
    - kind: teach
      id: situation
      title: "An application is rarely one container"
      body: |
        Real applications are a few programs working together: a web front end, an API (a program other programs
        call over the network), a database. Each runs in its own container, and they need four things a single
        `podman run` did not: to **find each other**, to keep **data** that survives a container being replaced,
        to receive **secrets** such as passwords safely, and to start in a sensible **order**.

        This lesson builds a small two-part application: an API that serves values from storage and requires a
        password, and short-lived client containers that call it.
    - kind: teach
      id: networks
      title: "A network where names work"
      body: |
        Containers on the same Podman **network** can reach each other, and on a network you create, Podman also
        runs a small DNS server: each container is reachable by its **name**. Without `--network`, there is no
        such name resolution. A rootless container, as in this lesson, then gets a private network of its own,
        set up by `pasta` (the rootless default in Podman 5). Containers run as root join Podman's built-in network,
        called `podman`, which a rootless container uses only when named with `--network podman`; it has no DNS.
    - kind: try
      id: try-net
      body: "Create a network for a shop application, called `shop-net`."
      accept: ["podman network create shop-net"]
      hints:
        - match: "^podman create"
          say: "`podman create` creates a container. Networks have their own subcommand: `podman network create`."
        - match: "^podman network shop-net"
          say: "The verb is missing: `podman network create`, then the name."
        - match: "^docker "
          say: "This machine uses Podman: start with `podman`."
      hint: "`podman network create`, then the name."
      then: "The recording created one called `academy-ct3-net` for the rest of the lesson:"
    - kind: show
      id: net-create
      run: "podman network create academy-ct3-net && podman network inspect academy-ct3-net --format 'driver={{.Driver}} dns={{.DNSEnabled}} subnet={{range .Subnets}}{{.Subnet}}{{end}}'"
      notice: "A new network, `academy-ct3-net`, with its own address range and `dns=true`."
    - kind: show
      id: net-default
      run: "podman network inspect podman --format 'the default network: dns={{.DNSEnabled}}'"
      notice: "The built-in `podman` network has no DNS (`dns=false`): containers on it must use addresses, which change every time a container is recreated. A rootless container started without `--network` is not on it at all, but on its own `pasta` network, where other containers' names do not resolve either. (The words \"the default network\" come from the command's own format string: `podman` is the default for containers run as root.) So applications of several containers get a network of their own."
    - kind: teach
      id: volumes
      title: "Data that outlives a container"
      body: |
        A container's own files disappear with it. A **named volume** is storage that Podman manages separately:
        containers mount it, write to it, and are removed, and the data stays. Here a volume is created, and a
        throwaway container writes the API's data into it:
    - kind: try
      id: try-volume
      body: "Create a named volume called `shop-data`."
      accept: ["podman volume create shop-data"]
      hints:
        - match: "^podman create"
          say: "`podman create` creates a container. Volumes have their own subcommand: `podman volume create`."
        - match: "^mkdir"
          say: "A directory on the host would be a bind mount. A named volume is managed by Podman: `podman volume create`."
      hint: "`podman volume create`, then the name."
      then: "The recording's volume is called `academy-ct3-data`:"
    - kind: show
      id: volume
      run: "podman volume create academy-ct3-data && podman volume inspect academy-ct3-data --format 'driver={{.Driver}} mountpoint={{.Mountpoint}}'"
      notice: "The volume lives under your user's container storage. You normally never touch that directory; containers use the volume by name."
    - kind: show
      id: fill
      run: "podman run --rm -v academy-ct3-data:/data quay.io/prometheus/busybox:latest sh -c 'mkdir -p /data/kv && echo blue > /data/kv/colour && echo ok > /data/healthz && ls -R /data'"
      notice: "The container has already gone (`--rm`), but its files stay in the volume: a value `kv/colour`, and a `healthz` file the API will use to say it is alive."
    - kind: teach
      id: secrets
      title: "Secrets, not environment variables in plain sight"
      body: |
        The API needs a password. Passing it with `-e PASSWORD=…` works, but the value then sits in the container's
        configuration, where `podman inspect` shows it to anyone who can run that. A Podman **secret** is stored
        separately and handed to the container only when it starts.
    - kind: show
      id: secret
      run: "printf 'kv-s3cret' | podman secret create academy-ct3-token - > /dev/null && podman secret ls --filter name=academy-ct3 --format '{{.Name}} driver={{.Driver}}'; podman secret inspect academy-ct3-token --format 'name={{.Spec.Name}} data=[{{.SecretData}}]'"
      notice: "The secret exists, and inspecting it does not reveal its value (`data=[]`)."
    - kind: ask
      id: guess-leak
      guess: true
      prompt: "A container gets one token with `-e PLAIN_TOKEN=…` and another as a secret. Which one does `podman inspect` reveal?"
      choices:
        - text: "Both"
          why: "See the next step."
        - text: "Only the environment variable"
          why: "See the next step."
        - text: "Neither: inspect hides values"
          why: "`inspect` shows the configuration as it is. The next step shows what that includes."
      answer: 1
    - kind: show
      id: leak
      run: "podman run -d --name academy-ct3-leak -e PLAIN_TOKEN=kv-s3cret --secret academy-ct3-token,type=env,target=KV_TOKEN quay.io/prometheus/busybox:latest sleep 60 > /dev/null && podman inspect academy-ct3-leak --format '{{range .Config.Env}}{{println .}}{{end}}' | grep TOKEN; podman exec academy-ct3-leak sh -c 'echo \"inside: KV_TOKEN=$KV_TOKEN\"'; podman rm -f -t 0 academy-ct3-leak > /dev/null"
      highlight: ["PLAIN_TOKEN"]
      notice: |
        `inspect` printed `PLAIN_TOKEN` with its value; the secret is not in the configuration. Inside the container,
        the program still received the secret, as `KV_TOKEN`: it was injected as that variable at start. The
        difference is who else can read it.
      understand:
        purpose: Starts a throwaway container that receives the same value twice, once as a plain environment variable
          and once as a Podman secret, compares what `podman inspect` reveals with what the program inside sees, and removes
          the container.
        parts:
          - text: -e PLAIN_TOKEN=kv-s3cret
            means: Sets an environment variable. Its value is stored in the container's configuration, where `podman inspect`
              shows it.
          - text: --secret academy-ct3-token,type=env,target=KV_TOKEN
            means: Gives the container the secret `academy-ct3-token`. `type=env` delivers it as an environment variable
              instead of the default file, and `target=KV_TOKEN` names that variable.
          - text: '{{range .Config.Env}}{{println .}}{{end}}'
            means: 'A Go template: prints each entry of the container''s configured environment on its own line.'
          - text: 'sh -c ''echo "inside: KV_TOKEN=$KV_TOKEN"'''
            means: 'The single quotes stop your shell from expanding `$KV_TOKEN`: the shell inside the container expands
              it.'
          - text: rm -f -t 0
            means: Removes the container although it is still running (`-f`), without the usual 10-second wait before
              it is killed (`-t 0`).
        mistakes:
          - 'Writing `$KV_TOKEN` in double quotes on your own command line: your shell replaces it (usually with nothing)
            before Podman runs.'
        caution: A value passed with `-e` can be read by anyone who can inspect the container, and it stays in your shell
          history. Pass credentials with `--secret`.
        concepts:
          - container.podman
          - sec.secrets
        refs:
          - title: 'podman-run(1): --secret, --env'
            url: https://docs.podman.io/en/latest/markdown/podman-run.1.html
          - title: podman-rm(1)
            url: https://docs.podman.io/en/latest/markdown/podman-rm.1.html
    - kind: teach
      id: health
      title: "Started is not ready"
      body: |
        The API needs a few seconds to start serving. A container is **running** as soon as its process starts, which
        is not the same as **ready to answer**. A **health check** is a command Podman runs regularly inside the
        container; until it succeeds, the container is `starting`, then `healthy`. Here the API starts with a
        health check that fetches `/healthz`. Podman normally runs it on a timer, every 30 seconds by default
        (`--health-interval 2s` would check every 2 seconds). The recording turned the timer off
        (`--health-interval disable`), so that every check happens at a step you can see, and ran the check on
        demand with `podman healthcheck run`, which runs the same check:
    - kind: show
      id: api
      run: "podman run -d --name academy-ct3-api --network academy-ct3-net -v academy-ct3-data:/data --secret academy-ct3-token,type=env,target=KV_TOKEN --health-cmd 'wget -qO /dev/null http://localhost:8080/healthz' --health-interval disable quay.io/prometheus/busybox:latest sh -c 'trap \"exit 0\" TERM; sleep 5; echo \"/kv:app:$KV_TOKEN\" > /tmp/httpd.conf; httpd -f -p 8080 -h /data -c /tmp/httpd.conf & wait'; podman inspect academy-ct3-api --format 'state={{.State.Status}} health={{.State.Health.Status}}'"
      notice: "Started in the background, on the network, with the volume and the secret. Its state is `running`, but its health is still `starting`."
      understand:
        purpose: Starts the API container in the background, on the stack's network, with its volume, its secret and a
          health check, then prints its state and its health.
        parts:
          - text: --network academy-ct3-net
            means: Connects the container to the network created earlier in this lesson. Without it, this rootless
              container would get a private `pasta` network of its own.
          - text: -v academy-ct3-data:/data
            means: Mounts the named volume `academy-ct3-data` at `/data` inside the container (Podman creates the volume
              if it does not exist).
          - text: --health-cmd 'wget -qO /dev/null http://localhost:8080/healthz'
            means: 'The command Podman runs inside the container to decide whether it is healthy: success means healthy.
              A command given as one string is run with `/bin/sh -c`.'
          - text: --health-interval disable
            means: 'No automatic timer: the check runs only when asked, with `podman healthcheck run`. Without this option
              it would run every 30 seconds.'
          - text: trap "exit 0" TERM
            means: 'When Podman stops the container with SIGTERM, the script exits with status 0 instead of ignoring the
              signal: at once while it waits for the server, or as soon as the first `sleep 5` has finished.'
          - text: '& wait'
            means: '`&` starts the web server in the background; `wait` keeps the script, the container''s first process,
              running until the server ends. A trapped signal interrupts `wait`, so the script can still stop cleanly.'
        concepts:
          - container.podman
          - linux.process
        refs:
          - title: 'podman-run(1): --network, --volume, --health-cmd, --health-interval'
            url: https://docs.podman.io/en/latest/markdown/podman-run.1.html
          - title: 'POSIX shell: trap and wait'
            url: https://pubs.opengroup.org/onlinepubs/9799919799/utilities/V3_chap02.html
    - kind: ask
      id: guess-early
      guess: true
      prompt: "The API container is `running`, its health still `starting`. A client calls it right now. What happens?"
      choices:
        - text: "It gets the value"
          why: "That is what \"running\" suggests. The next step shows what the client actually gets."
        - text: "It is refused: nothing listens yet"
          why: "See the next step."
        - text: "Podman holds the call until it is healthy"
          why: "Podman does not delay network traffic; health is only a status. The next step shows the result."
      answer: 1
    - kind: show
      id: too-early
      body: "A client that calls it immediately. It gets the same secret as a file, `/run/secrets/academy-ct3-token`, where `--secret` puts it by default, and sends it as the password of the user `app`: the API's start command wrote `/kv:app:$KV_TOKEN` (path, user, password) into its web server's configuration, so `/kv` requires that login."
      run: "podman run --rm --network academy-ct3-net --secret academy-ct3-token quay.io/prometheus/busybox:latest sh -c 'wget -qO- \"http://app:$(cat /run/secrets/academy-ct3-token)@academy-ct3-api:8080/kv/colour\"'"
      notice: "Connection refused: the container is running, but the server inside is not listening yet. Clients that start \"after\" a service can still arrive too early."
    - kind: show
      id: healthy
      body: "The recording ran the health check until it succeeded (with a timer, `podman wait --condition healthy` does the waiting for you); then the same call:"
      run: "until podman healthcheck run academy-ct3-api > /dev/null 2>&1; do sleep 1; done; podman inspect academy-ct3-api --format 'state={{.State.Status}} health={{.State.Health.Status}}'; podman run --rm --network academy-ct3-net --secret academy-ct3-token quay.io/prometheus/busybox:latest sh -c 'wget -qO- \"http://app:$(cat /run/secrets/academy-ct3-token)@academy-ct3-api:8080/kv/colour\"'"
      notice: "Healthy, and the client gets the value `blue`, from the volume, through the network, authenticated with the secret."
    - kind: ask
      id: names
      prompt: "A client container on the default network (no `--network`) calls `http://academy-ct3-api:8080/`. What happens?"
      choices:
        - text: "The name does not resolve"
          why: "The name is known only on `academy-ct3-net`, whose DNS answers for its containers. Without `--network`, a rootless container gets its own `pasta` network (a container run as root would join the `podman` network), and neither resolves that name."
        - text: "It works: names are global"
          why: "Names are resolved by each network's DNS, and only for the containers on that network."
        - text: "It is refused by the password"
          why: "It never gets that far: without the name, there is no address to connect to."
      answer: 0
    - kind: show
      id: bad-address
      run: "podman run --rm quay.io/prometheus/busybox:latest wget -T 3 -qO- http://academy-ct3-api:8080/healthz"
      notice: "\"bad address\": this client, started without `--network`, is not on `academy-ct3-net`, so the name does not exist for it."
    - kind: show
      id: volume-survives
      body: "Finally, the API container is removed. The volume remains, with its data:"
      run: "podman rm -f -t 3 academy-ct3-api > /dev/null && podman volume ls --filter name=academy-ct3 --format '{{.Name}}' && podman run --rm -v academy-ct3-data:/data:ro quay.io/prometheus/busybox:latest cat /data/kv/colour"
      notice: "The volume is still listed, and a new container reads `blue` from it. Replacing a container never touches its named volumes."
    - kind: reflect
      id: explain-stack
      prompt: "Explain to a colleague why a two-container application should use its own network, a named volume and a secret."
      model: |
        On a network you create, containers reach each other by name, which stays valid when a container is
        recreated with a new address. A named volume keeps data when containers are removed or replaced. A secret
        passes a password to the container at start without leaving it in the configuration that `podman inspect`
        shows. And a health check, waited for, makes clients start only when the service can answer.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can connect containers by name on their own network, keep data in named volumes, pass secrets safely,
        and wait for a service to be healthy.

        These four needs come back on every platform that runs containers at scale, under other names. Next: moving
        images between machines without a registry.
  sections:
    - id: pods-and-kube-yaml
      title: The same stack as a pod and Kubernetes-format YAML
      depth: true
      body: "Separate containers on a network talk to each other by name. Containers that must share `localhost`\nbelong in\
        \ one **Podman pod**, because the containers of a pod share one network namespace\n([A container is a process](/lesson/a.container-is-a-process)).\
        \ Put the API into a pod\npublished on host port 18480, with the same volume, secret and healthcheck,\
        \ and ask\n`podman kube generate` for the YAML. What follows is an example of the output and results, not part of this lesson's recording:\n\n```\nspec:\n  containers:\n  - command:\n    - sh\n    - -c\n\
        \    - trap \"exit 0\" TERM; echo \"/kv:app:$KV_TOKEN\" > /tmp/httpd.conf; httpd -f -p\n      8080 -h /data -c /tmp/httpd.conf\
        \ & wait\n    image: quay.io/prometheus/busybox:latest\n    name: academy-ct3-pod-api\n    ports:\n    - containerPort:\
        \ 8080\n      hostPort: 18480\n    volumeMounts:\n    - mountPath: /data\n      name: academy-ct3-data-pvc\n  volumes:\n\
        \  - name: academy-ct3-data-pvc\n    persistentVolumeClaim:\n      claimName: academy-ct3-data\n```\n\nThe named volume\
        \ became a `persistentVolumeClaim`. Two things are **missing**: there is no `env` for\nthe secret and no probe for\
        \ the healthcheck. Replayed as it is, this YAML starts a server without its\ntoken and without any health signal.\
        \ Generated YAML is a draft to complete, never a finished manifest.\n\nCompleting it by hand means adding\
        \ a `Secret` object, `env` with\n`valueFrom.secretKeyRef`, and a `livenessProbe` that runs the same `wget`.\
        \ Saved as `stack.yaml` (a file this lesson does not ship; like the generate output above, these\nresults are an example, not recorded),\
        \ `podman kube play stack.yaml`\nprints what it created (`Secrets:`, `Pod:`, `Container:`), reuses the existing volume\
        \ because the claim\nname matches, and serves `blue` both from the host (`curl -u app:… http://localhost:18480/kv/colour`)\n\
        and from a second container joined to the pod at `localhost:8080`. Podman turns the probe into a\nhealthcheck, with the probe's period as its interval, for example:\n\n\
        ```\nhealthcheck=[\"CMD\",\"wget\",\"-qO\",\"/dev/null\",\"http://localhost:8080/healthz\"] every 2s\n```\n\n`podman\
        \ kube down stack.yaml` removes the pod and the Secret it created; its `Volumes removed:`\nlist is empty,\
        \ and `podman volume ls` still shows `academy-ct3-data` (add `--force` to remove volumes\nfrom claims too).\n\nKnow\
        \ the limits of the replay. `podman kube play` supports Pods, Deployments, DaemonSets, Jobs,\nPersistentVolumeClaims,\
        \ ConfigMaps and Secrets, and `livenessProbe`; `readinessProbe` is ignored. (The support table also marks `startupProbe`\
        \ unsupported, although the Podman 5.8 code turns it into a startup healthcheck; test before relying on it.)\nAnd\
        \ before the YAML is used anywhere but your workstation, `hostPort` gives way to a proper way to\nexpose the pod,\
        \ the pod to a managed workload, and the Secret to one created from a protected source\nrather than a file in Git,\
        \ as the section \"Later in the course: the same habits on a cluster\" lists.\n"
    - id: compose-briefly
      title: Where Compose fits
      depth: true
      body: 'Compose files describe a stack as services, networks and volumes. `podman compose` is a thin wrapper:

        it runs an external provider, `docker-compose` or `podman-compose` (docker-compose takes precedence when

        both are installed), and points it at Podman. Neither provider is part of Podman itself, so availability

        varies from machine to machine. The notice `podman compose` prints before running names the provider it executes (unless
        `compose_warning_logs` is turned off), and `podman compose version` prints that provider''s version.


        Compose is useful for local development, but it is not what a cluster reads. When the stack may later

        move to a cluster, keep Kubernetes-format YAML as the source: it replays with `podman kube play`, runs

        under systemd on a RHEL host through a Quadlet `.kube` unit, and is the same language clusters speak.

        '
    - id: later-on-a-cluster
      title: 'Later in the course: the same habits on a cluster'
      depth: true
      body: "Each Podman habit in this lesson has a counterpart on Kubernetes and OpenShift, which you will meet in\nlater\
        \ tracks:\n\n| You need to | With Podman | In Kubernetes and OpenShift |\n|---|---|---|\n| find the other part | a\
        \ user-defined network and the container's name | a Service and its DNS name |\n| keep data | a named volume | a PersistentVolumeClaim\
        \ |\n| pass a credential | a Podman secret | a Secret |\n| know it can serve | a healthcheck, `podman wait --condition\
        \ healthy` | a readiness probe |\n| share `localhost` | a Podman pod | the containers of one pod |\n\n- Every new\
        \ pod gets a new IP, so clients use a Service name such as `api` (or\n  `api.<project>.svc.cluster.local`), as [Services,\
        \ EndpointSlices and DNS](/lesson/d.services-dns)\n  explains.\n- On a cluster a claim is bound to real storage through\
        \ a StorageClass:\n  [Volumes, claims, StorageClasses and CSI](/lesson/e.storage).\n- Kubernetes has its own Secret\
        \ objects, kept by the API server and given to pods as variables or files, a role close to a Podman\n  secret's but\
        \ stored and protected differently: [Configuration with ConfigMaps and Secrets](/lesson/o1.config-secrets).\n- Kubernetes has no\
        \ start order between pods at all. A **readiness probe** keeps a pod out of its\n  Service's endpoints until it answers,\
        \ a liveness probe restarts a container that stops answering, and\n  clients are expected to retry ([Health probes](/lesson/b.health-probes),\
        \ and the incident\n  [Running but never Ready](/lab/inc.readiness-503)).\n- Before the generated YAML goes near OpenShift,\
        \ `hostPort` gives way to a Service, the pod to a\n  Deployment, and the Secret to one created from a protected source.\n\
        - For a stack heading to OpenShift, keep Kubernetes YAML as the source rather than a Compose file.\n"
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: "- **Copying an IP address from `podman inspect` into configuration.** It changes when the container is\n  recreated.\
        \ Use the name on a user-defined network.\n- **Expecting `localhost` to reach another container on the same network.**\
        \ `localhost` is the\n  container's own network namespace; only containers of one pod share it.\n- **Treating `depends_on`\
        \ or start order as readiness.** Both only mean \"started\".\n- **Putting a Secret in YAML under version control.**\
        \ base64 is an encoding. Create real secrets from a\n  protected source.\n- **Running `podman volume prune` to tidy\
        \ up.** It removes every unused volume, including data of stopped\n  applications you meant to keep.\n- **Trusting\
        \ generated YAML.** Check it for what is missing (secrets, probes) as well as for what must\n  go (`hostPort`, fixed\
        \ UIDs, host paths).\n"
  review:
    - q: "Why create a network for an application instead of using Podman's default one?"
      a: "On a network you create, Podman's DNS lets containers reach each other by name. Without one, names do not resolve: a rootless container gets its own `pasta` network, and the built-in `podman` network has no DNS."
    - q: "What happens to a named volume when the container using it is removed?"
      a: "Nothing: the volume and its data stay until the volume itself is removed."
    - q: "Why prefer a Podman secret to `-e PASSWORD=…`?"
      a: "Environment variables appear in the container's configuration (`podman inspect`); a secret's value does not."
    - q: "Why can a client fail with \"connection refused\" right after the service container started?"
      a: "Running is not ready: the server inside may not listen yet. Wait for its health check (`podman wait --condition healthy`)."
  commands:
    - cmd: "podman pull -q quay.io/prometheus/busybox:latest"
      meaning: "make sure the image is present (not shown in the lesson)"
    - cmd: "podman network create academy-ct3-net && podman network inspect academy-ct3-net --format 'driver={{.Driver}} dns={{.DNSEnabled}} subnet={{range .Subnets}}{{.Subnet}}{{end}}'"
      meaning: "a network with DNS"
    - cmd: "podman network inspect podman --format 'the default network: dns={{.DNSEnabled}}'"
      meaning: "the built-in `podman` network has no DNS"
    - cmd: "podman volume create academy-ct3-data && podman volume inspect academy-ct3-data --format 'driver={{.Driver}} mountpoint={{.Mountpoint}}'"
      meaning: "a named volume"
    - cmd: "podman run --rm -v academy-ct3-data:/data quay.io/prometheus/busybox:latest sh -c 'mkdir -p /data/kv && echo blue > /data/kv/colour && echo ok > /data/healthz && ls -R /data'"
      meaning: "data written into the volume by a throwaway container"
    - cmd: "printf 'kv-s3cret' | podman secret create academy-ct3-token - > /dev/null && podman secret ls --filter name=academy-ct3 --format '{{.Name}} driver={{.Driver}}'; podman secret inspect academy-ct3-token --format 'name={{.Spec.Name}} data=[{{.SecretData}}]'"
      meaning: "a secret, whose value inspect does not show"
    - cmd: "podman run -d --name academy-ct3-leak -e PLAIN_TOKEN=kv-s3cret --secret academy-ct3-token,type=env,target=KV_TOKEN quay.io/prometheus/busybox:latest sleep 60 > /dev/null && podman inspect academy-ct3-leak --format '{{range .Config.Env}}{{println .}}{{end}}' | grep TOKEN; podman exec academy-ct3-leak sh -c 'echo \"inside: KV_TOKEN=$KV_TOKEN\"'; podman rm -f -t 0 academy-ct3-leak > /dev/null"
      meaning: "an environment variable is visible in inspect; a secret is not"
    - cmd: "podman run -d --name academy-ct3-api --network academy-ct3-net -v academy-ct3-data:/data --secret academy-ct3-token,type=env,target=KV_TOKEN --health-cmd 'wget -qO /dev/null http://localhost:8080/healthz' --health-interval disable quay.io/prometheus/busybox:latest sh -c 'trap \"exit 0\" TERM; sleep 5; echo \"/kv:app:$KV_TOKEN\" > /tmp/httpd.conf; httpd -f -p 8080 -h /data -c /tmp/httpd.conf & wait'; podman inspect academy-ct3-api --format 'state={{.State.Status}} health={{.State.Health.Status}}'"
      meaning: "the API, running but not yet healthy"
    - cmd: "podman run --rm --network academy-ct3-net --secret academy-ct3-token quay.io/prometheus/busybox:latest sh -c 'wget -qO- \"http://app:$(cat /run/secrets/academy-ct3-token)@academy-ct3-api:8080/kv/colour\"'"
      expect: fail
      meaning: "a client that calls too early"
    - cmd: "until podman healthcheck run academy-ct3-api > /dev/null 2>&1; do sleep 1; done; podman inspect academy-ct3-api --format 'state={{.State.Status}} health={{.State.Health.Status}}'; podman run --rm --network academy-ct3-net --secret academy-ct3-token quay.io/prometheus/busybox:latest sh -c 'wget -qO- \"http://app:$(cat /run/secrets/academy-ct3-token)@academy-ct3-api:8080/kv/colour\"'"
      meaning: "healthy, and the call succeeds"
    - cmd: "podman run --rm quay.io/prometheus/busybox:latest wget -T 3 -qO- http://academy-ct3-api:8080/healthz"
      expect: fail
      meaning: "outside the network, the name does not resolve"
    - cmd: "podman rm -f -t 3 academy-ct3-api > /dev/null && podman volume ls --filter name=academy-ct3 --format '{{.Name}}' && podman run --rm -v academy-ct3-data:/data:ro quay.io/prometheus/busybox:latest cat /data/kv/colour"
      meaning: "the volume outlives the container"
    - cmd: "podman rm -f -t 0 academy-ct3-api > /dev/null 2>&1; podman volume rm academy-ct3-data > /dev/null && podman secret rm academy-ct3-token > /dev/null && podman network rm academy-ct3-net > /dev/null && echo cleaned up"
      meaning: "clean up (not shown in the lesson)"
  references:
    - {title: "Podman documentation: podman network create", url: "https://docs.podman.io/en/latest/markdown/podman-network-create.1.html"}
    - {title: "Podman documentation: podman volume create", url: "https://docs.podman.io/en/latest/markdown/podman-volume-create.1.html"}
    - {title: "Podman documentation: podman secret create", url: "https://docs.podman.io/en/latest/markdown/podman-secret-create.1.html"}
    - {title: "Podman documentation: podman run (--health-cmd)", url: "https://docs.podman.io/en/latest/markdown/podman-run.1.html"}
    - {title: "Podman documentation: podman wait (--condition)", url: "https://docs.podman.io/en/latest/markdown/podman-wait.1.html"}

- id: ct.image-archives
  title: "What a container changed, and moving images without a registry"
  subtitle: "diff and cp, commit versus a Containerfile, and images as files"
  module: ct1-podman
  mode: LOCAL_SIMULATION
  minutes: 25
  level: 2
  supports: "Podman 5.8 (rootless) and Skopeo on RHEL 9. Recorded on a RHEL 9 workstation as an ordinary user; every container, image and archive is created for the recording and removed afterwards."
  concepts: [container.images, container.registries, container.build]
  prerequisites: [ct.podman-stack]
  objective: |
    See what a container changed compared with its image, copy files in and out, explain why a Containerfile beats
    committing a container, and move an image to a machine without registry access, checking that it arrived
    intact.
  flow:
    - kind: ask
      id: recall-volume
      prompt: "A look back. What happens to a named volume when the container using it is removed?"
      recalls: ct.podman-stack
      choices:
        - text: "It stays, with its data"
          why: "Named volumes live apart from containers; only removing the volume deletes the data."
        - text: "It is removed with the container"
          why: "That is true of the container's own writable layer, not of a named volume."
        - text: "It is emptied but kept"
          why: "Podman never empties a volume by itself; the data stays until the volume is removed."
      answer: 0
    - kind: teach
      id: situation
      title: "\"I fixed it inside the container\""
      body: |
        It happens on every team: something is wrong in a running container, someone opens a shell inside it and
        fixes a file by hand, and it works. Then the container is replaced and the fix is gone, or nobody knows what
        was changed. This lesson shows how to see exactly what a container changed, why turning such a container
        into an image is a poor habit, and how images travel as files when there is no registry in between.

        The build lesson showed that an image is a stack of read-only layers. A container started from it adds one
        more layer on top, a writable one that belongs to that container alone: every change it makes goes there.
    - kind: show
      id: box
      body: "A container that changes a few files, then exits:"
      run: "podman run --name academy-ct3-box quay.io/prometheus/busybox:latest sh -c 'echo \"tuned by hand\" > /etc/academy.conf && unlink /etc/group && mkdir -p /srv/cache && echo 1 > /srv/cache/item'"
      notice: "It wrote a configuration file, removed `/etc/group` and created a cache directory. No output: the evidence is in its writable layer."
    - kind: show
      id: diff
      run: "podman diff academy-ct3-box"
      notice: "`podman diff` lists what differs from the image: `A` added, `C` changed (a directory whose content changed), `D` deleted."
    - kind: ask
      id: read-diff
      prompt: "In that list, what does `D /etc/group` mean?"
      choices:
        - text: "The container deleted that file"
          why: "`D` is deleted. The image still contains `/etc/group`; the container's layer records it as removed."
        - text: "The file is a directory"
          why: "`D` is about the change, not the type: deleted. Directories show as `C` when their content changed."
        - text: "The file was downloaded"
          why: "Nothing is downloaded here; `D` marks a file the container removed."
      answer: 0
    - kind: show
      id: cp
      body: "`podman cp` copies files between the host and a container, in both directions, even when the container has stopped:"
      run: "echo 'patched from the host' > patch.txt && podman cp patch.txt academy-ct3-box:/srv/patch.txt && podman cp academy-ct3-box:/etc/academy.conf ./copied-out.conf && cat copied-out.conf && podman diff academy-ct3-box | grep srv/patch"
      notice: "A file copied out (`tuned by hand`), and one copied in, which now shows up in the diff as added."
    - kind: teach
      id: commit
      title: "commit, and why a Containerfile is better"
      body: |
        `podman commit` turns a container's current state into a new image. It works, and it is tempting after a
        manual fix. The recording also gives the new image a default command with `-c` (`--change`), which applies
        one Containerfile instruction, here `CMD`, to the image being saved; `-q` keeps the command quiet:
    - kind: show
      id: commit-run
      run: "podman commit -q -c 'CMD [\"cat\", \"/etc/academy.conf\"]' academy-ct3-box localhost/academy-ct3-snap:1 > /dev/null && podman run --rm localhost/academy-ct3-snap:1"
      notice: "The new image contains the hand-made changes, and runs."
    - kind: ask
      id: why-containerfile
      prompt: "Six months later the base image needs a security update. Why is the committed image harder to update than one built from a Containerfile?"
      choices:
        - text: "Nobody can see which steps made it"
          why: "A commit records the result, not the steps; to rebuild it on a new base, someone must rediscover every manual change. A Containerfile is the steps, reviewable and repeatable."
        - text: "Committed images cannot be pulled"
          why: "They can be pushed and pulled like any image. The problem is reproducing them."
        - text: "Committed images are always larger"
          why: "Size depends on the changes, not on how the image was made. The problem is that the recipe is lost."
      answer: 0
    - kind: teach
      id: files
      title: "Images as files"
      body: |
        Sometimes an image must reach a machine that cannot reach a registry: a secured network, a laptop on a plane.
        Two pairs of commands turn images and containers into files:

        - `podman save` writes an **image**, with all its layers and settings, to a tar archive; `podman load` reads it
          back. The image is exactly the same.
        - `podman export` writes a **container's filesystem**, flattened into one tar, without layers or settings;
          `podman import` makes a new single-layer image from it.
    - kind: show
      id: save
      run: "podman save -q -o snap-docker.tar localhost/academy-ct3-snap:1 && podman save -q --format oci-archive -o snap-oci.tar localhost/academy-ct3-snap:1 && ls -l snap-*.tar | awk '{print $5, $9}'"
      notice: "The same image saved in two formats, sizes in bytes: the Docker archive format, which stores the layers uncompressed, and the OCI format, which stores them compressed, hence less than half the size."
    - kind: show
      id: export
      run: "podman export -o box-fs.tar academy-ct3-box && tar -tf box-fs.tar | grep -E '^(etc/academy.conf|etc/group|srv/)'; echo \"entries: $(tar -tf box-fs.tar | wc -l), manifest or config files: $(tar -tf box-fs.tar | grep -cE 'manifest|json')\""
      notice: "The container's whole filesystem, with the changes, but as plain files: no layers, no image configuration."
    - kind: ask
      id: guess-import
      guess: true
      prompt: "The exported filesystem is imported as a new image, and run without giving any command. What happens?"
      choices:
        - text: "It runs like the committed image"
          why: "Both contain the same files. The next step shows what the import lost."
        - text: "It fails: the image has no command"
          why: "See the next step."
        - text: "It runs a shell by default"
          why: "Images do not fall back to a shell. The next step shows what happens."
      answer: 1
    - kind: show
      id: import
      run: "podman import -q -m 'flattened from academy-ct3-box' box-fs.tar localhost/academy-ct3-flat:1 > /dev/null && podman image inspect --format '{{index .RepoTags 0}} cmd={{json .Config.Cmd}} env={{json .Config.Env}} layers={{len .RootFS.Layers}}' localhost/academy-ct3-snap:1 localhost/academy-ct3-flat:1; podman run --rm localhost/academy-ct3-flat:1"
      notice: "The committed image kept its command, environment and 3 layers; the imported one has 1 layer, no command and no environment, so `podman run` has nothing to start. `export` keeps files, not images."
    - kind: show
      id: load
      body: "`podman load`, by contrast, restores the exact image: here it is removed, then loaded from the saved archive:"
      run: "podman image inspect --format 'before: {{.ID}}' localhost/academy-ct3-snap:1 && podman rm academy-ct3-box > /dev/null && podman rmi localhost/academy-ct3-snap:1 localhost/academy-ct3-flat:1 > /dev/null && podman load -q -i snap-oci.tar && podman image inspect --format 'after:  {{.ID}}' localhost/academy-ct3-snap:1"
      notice: "The same image ID before and after: the image's configuration and layers came back unchanged (the manifest digest is not guaranteed; to keep it, copy with `skopeo copy --preserve-digests` instead)."
    - kind: teach
      id: skopeo-move
      title: "Moving an image, and checking it arrived intact"
      body: |
        Skopeo can copy an image straight from a registry into an archive file, without storing it in Podman first.
        Before carrying the file anywhere, record its **checksum**; on arrival, compare. That catches corruption on
        the way. To also catch tampering, the expected checksum must reach the other side by a separate, trusted
        channel (or the image must be signed and the signature verified).
    - kind: show
      id: transfer
      run: "skopeo copy -q docker://quay.io/prometheus/busybox:latest docker-archive:busybox-transfer.tar:quay.io/prometheus/busybox:latest && sha256sum busybox-transfer.tar > busybox-transfer.tar.sha256 && sha256sum -c busybox-transfer.tar.sha256"
      notice: "The image as an archive file, its SHA-256 checksum recorded, and `sha256sum -c` confirming the file matches it."
    - kind: order
      id: order-offline
      prompt: "Put the steps of moving an image to a machine without registry access in order."
      items:
        - "`skopeo copy` the image into an archive file"
        - "Record the archive's checksum with `sha256sum`"
        - "Carry the archive; send the checksum by a separate trusted channel"
        - "Verify it there with `sha256sum -c`"
        - "`podman load` the archive"
      why: "The checksum must be taken before the move and checked after it, and only a verified archive is loaded."
    - kind: reflect
      id: explain-save-export
      prompt: "Explain to a colleague the difference between `podman save` and `podman export`."
      model: |
        `podman save` writes an image with all its layers and configuration (command, environment, user), and
        `podman load` restores exactly that image. `podman export` writes a container's filesystem as plain files,
        flattened, without the image's configuration; importing it gives a one-layer image with no command. To move
        an image, use save and load (or Skopeo); export is for getting at a container's files.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can see what a container changed, copy files in and out, explain why changes belong in a Containerfile,
        and move an image as a file, verified by its checksum.

        Next: registries in more depth, inspecting and copying images between them with Skopeo.
  sections:
    - id: events
      title: 'podman events: what happened, and when'
      depth: true
      body: 'Podman records an event for every lifecycle step of containers, pods, images, volumes, networks and

        secrets. On RHEL the events go to the journal (the `journald` events backend). `podman events` streams

        new events; `--stream=false` with `--since` (a time stamp or a duration such as `10m`) lists past ones

        and exits. `--filter` narrows by `container`, `image`, `pod`, `volume`, `type`, `event` or `label`.


        This lesson''s recording does not include `podman events`, so what follows is an illustration of the event

        names, not recorded output. A container that goes through this lesson''s steps, from its first command to

        `podman rm`, produces these lifecycle events in this order:


        ```

        create init start attach died cleanup commit export remove

        ```


        Its image events (`--filter type=image` with two `event=` filters) would name the archives the lesson

        writes and reads; real output adds a time stamp and the image ID to each line:


        ```

        image save snap-docker.tar

        image save snap-oci.tar

        image loadfromarchive snap-oci.tar

        ```


        The answer to "who removed my container?" is a `remove` event with a time stamp. Read the journal

        entries for the full context (`journalctl --user` for rootless Podman). Clusters keep the equivalent evidence in their
        own event streams and audit logs.

        '
    - id: to-the-cluster
      title: 'Later in the course: why pods must be reproducible from images'
      depth: true
      body: 'Everything in this lesson has a sharp edge on a cluster. A pod''s container can be restarted, rescheduled

        or replaced at any time, and each new container starts from the image again. Files written into the

        container''s own filesystem disappear with it; there is no commit on a cluster, and an image committed on

        a workstation cannot be rebuilt by anyone else.


        So on OpenShift, every change goes through the image (a Containerfile, a build, a new tag or digest) or

        through the pod spec (a ConfigMap, a Secret, a volume). When you need evidence from a running pod, the

        `oc` client can copy files out of a container, or synchronise a directory, much as `podman cp` does:

        use it to collect, never to fix. A fix applied by copying a file into a pod lasts until the next restart.

        '
    - id: choosing
      title: Which command for which job
      depth: true
      body: '| Need | Use | Not |

        |---|---|---|

        | back up or carry an image | `podman save` (`--format oci-archive` for the standard layout), then `podman load` |
        `export`, which drops the configuration and layers |

        | carry an image without pulling it locally | `skopeo copy docker://… docker-archive:…` or `oci-archive:…` | a pull,
        save and remove on the connected machine |

        | keep registry digests intact | `skopeo copy --all --preserve-digests` | `docker-archive`, which writes a new manifest
        |

        | a filesystem snapshot to inspect | `podman export` | `commit` |

        | evidence from a broken container | `podman diff`, `podman cp`, or `commit` before `rm` | fixing it in place |

        | a change that must last | a Containerfile and `podman build` | `commit` |

        | who did what, and when | `podman events --stream=false --since …` | guessing from `podman ps -a` |

        '
    - id: what-goes-wrong
      title: What goes wrong, and how to see it
      depth: true
      body: '| Symptom | Evidence | Cause | Fix |

        |---|---|---|---|

        | an image from an archive will not start, exit 127 | `podman image inspect --format ''{{json .Config.Cmd}}''` prints
        `null` | it came from `export`/`import`, which drops the configuration | `podman save` / `podman load`; or `import
        -c` |

        | `podman load` of a file from `export` fails | the tar has no `manifest.json` or `index.json` | export makes a filesystem
        tar, not an image archive | `podman import` for that tar; `save` next time |

        | a digest-pinned reference cannot find its image after transfer | `skopeo inspect` digest differs from the pinned
        one | the archive rewrote the manifest | `skopeo copy --all --preserve-digests` |

        | a committed image is much larger than expected | `podman image tree` shows a large top layer | caches, logs or downloads
        in the container were committed | build from a Containerfile instead |

        | a change made in a container is gone | the container was recreated (`podman events`: `remove`, `create`) | writable
        layers die with their container | put it in the image or a volume |

        | the archive arrives corrupted | `sha256sum -c` reports `FAILED` | incomplete copy | copy again; always ship the
        checksum |

        '
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: "- **Confusing `save` with `export` (and `load` with `import`).** `save`/`load` move images;\n  `export`/`import`\
        \ move filesystems.\n- **Using `commit` as a build system.** It produces images nobody can rebuild or review.\n- **Believing\
        \ a backup of the image includes the data.** Volumes are outside both images and\n  containers.\n- **Carrying archives\
        \ without checksums.** A truncated tar may load partially or fail late.\n- **Expecting the same digest after any copy.**\
        \ Only the configuration digest is guaranteed by a\n  `docker-archive`; pin by digest only after checking what the\
        \ mirror stores.\n"
  review:
    - q: "What does `podman diff` show?"
      a: "What a container changed compared with its image: A added, C changed, D deleted."
    - q: "Why prefer a Containerfile to `podman commit`?"
      a: "A Containerfile records the steps, so the image can be reviewed and rebuilt on a new base; a commit records only the result."
    - q: "save/load or export/import: which keeps the image's layers and command?"
      a: "save and load. export and import keep only a flattened filesystem."
  commands:
    - cmd: "date -u +%Y-%m-%dT%H:%M:%SZ > started-at && podman pull -q quay.io/prometheus/busybox:latest"
      meaning: "pull the base image first, a 2.8 MB image, and print its ID (not shown in the lesson). The start time saved in `started-at` is only for a `podman events --since` check of your own: the lesson does not run `podman events`"
    - cmd: "podman run --name academy-ct3-box quay.io/prometheus/busybox:latest sh -c 'echo \"tuned by hand\" > /etc/academy.conf && unlink /etc/group && mkdir -p /srv/cache && echo 1 > /srv/cache/item'"
      meaning: "a container that adds a file, deletes one and creates a directory, then exits"
    - cmd: "podman diff academy-ct3-box"
      meaning: "the writable layer: A added, C changed, D deleted"
    - cmd: "echo 'patched from the host' > patch.txt && podman cp patch.txt academy-ct3-box:/srv/patch.txt && podman cp academy-ct3-box:/etc/academy.conf ./copied-out.conf && cat copied-out.conf && podman diff academy-ct3-box | grep srv/patch"
      meaning: "podman cp works on a stopped container, in both directions"
    - cmd: "podman commit -q -c 'CMD [\"cat\", \"/etc/academy.conf\"]' academy-ct3-box localhost/academy-ct3-snap:1 > /dev/null && podman run --rm localhost/academy-ct3-snap:1"
      meaning: "the container's changes become an image, with a new CMD"
    - cmd: "podman save -q -o snap-docker.tar localhost/academy-ct3-snap:1 && podman save -q --format oci-archive -o snap-oci.tar localhost/academy-ct3-snap:1 && ls -l snap-*.tar | awk '{print $5, $9}'"
      meaning: "the same image in both archive formats, and their sizes in bytes"
    - cmd: "podman export -o box-fs.tar academy-ct3-box && tar -tf box-fs.tar | grep -E '^(etc/academy.conf|etc/group|srv/)'; echo \"entries: $(tar -tf box-fs.tar | wc -l), manifest or config files: $(tar -tf box-fs.tar | grep -cE 'manifest|json')\""
      meaning: "a flat filesystem: the changes are in it, /etc/group is not, and there is no image metadata"
    - cmd: "podman import -q -m 'flattened from academy-ct3-box' box-fs.tar localhost/academy-ct3-flat:1 > /dev/null && podman image inspect --format '{{index .RepoTags 0}} cmd={{json .Config.Cmd}} env={{json .Config.Env}} layers={{len .RootFS.Layers}}' localhost/academy-ct3-snap:1 localhost/academy-ct3-flat:1; podman run --rm localhost/academy-ct3-flat:1"
      expect: fail
      meaning: "the committed image keeps its settings; the imported one has none, so it cannot start"
    - cmd: "podman image inspect --format 'before: {{.ID}}' localhost/academy-ct3-snap:1 && podman rm academy-ct3-box > /dev/null && podman rmi localhost/academy-ct3-snap:1 localhost/academy-ct3-flat:1 > /dev/null && podman load -q -i snap-oci.tar && podman image inspect --format 'after:  {{.ID}}' localhost/academy-ct3-snap:1"
      meaning: "remove everything, load the OCI archive: same name, same image ID"
    - cmd: "skopeo copy -q docker://quay.io/prometheus/busybox:latest docker-archive:busybox-transfer.tar:quay.io/prometheus/busybox:latest && sha256sum busybox-transfer.tar > busybox-transfer.tar.sha256 && sha256sum -c busybox-transfer.tar.sha256"
      meaning: "registry straight to an archive, with a checksum to verify on the far side"
    - cmd: "podman rmi localhost/academy-ct3-snap:1 quay.io/prometheus/busybox:latest > /dev/null && echo cleaned up"
      meaning: "remove the images this lesson created and pulled"
