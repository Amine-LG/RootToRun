    - kind: show
      id: logs-step
      body: "Question 2, the logs: what did the program say before it stopped?"
      run: "podman logs config-test"
      notice: "The same message, kept by Podman: the program started and wrote it, so it is in the logs. Reading the logs is worth doing even when the terminal already showed the message, because the container may have run in the background."
    - kind: show
      id: inspect
      body: "Question 3, the configuration: which command did it run, as which user?"
      run: "podman inspect config-test --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} entrypoint={{json .Config.Entrypoint}} user={{.Config.User}}'"
      notice: "It was not killed for memory (`oom=false`), it ran `/app/start.sh`, as the image's default user (empty: root). The script never chose exit code 2: this image's shell, BusyBox `sh`, exits with 2 when a `${DB_URL:?}` check fails. The shell standard only asks for a non-zero status, and other shells use other numbers (bash uses 1 for a script), so the message says more than the code."
