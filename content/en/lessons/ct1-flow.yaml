# Containers path, module ct1-podman, written as teaching flows. Recorded with rootless Podman.
- id: ct.podman-run
  title: "Running a service with Podman"
  subtitle: "Ports, shared files, logs, and the life of a container"
  module: f1-containers
  mode: LOCAL_SIMULATION
  minutes: 22
  level: 1
  supports: "Podman 5.8 (rootless) and curl on RHEL 9. Outputs recorded on a RHEL 9 workstation as an ordinary user; each command continues from what the previous ones left."
  concepts: [container.podman, linux.namespaces, linux.process]
  prerequisites: [a.container-is-a-process]
  objective: |
    Run a small web server in a container, publish its port so the host can reach it, share a directory with it,
    read its logs, run a command inside it, and stop and remove it.
  flow:
    - kind: ask
      id: recall-view
      prompt: "A look back. A file `/srv/data.txt` exists on the host. Can a process in a container read it at that path?"
      recalls: a.container-is-a-process
      choices:
        - text: "No: its `/` comes from the image"
          why: "The container's mount namespace shows it the image's files. Host files appear only if you share them, which this lesson shows how to do."
        - text: "Yes: it runs on the same host"
          why: "Running on the same kernel does not mean seeing the same files. The container's filesystem view starts from its image."
        - text: "Only if it runs as root"
          why: "What a process can see is decided by its namespaces, not its user. Root inside the container still sees the image's tree."
      answer: 0
    - kind: teach
      id: situation
      title: "A website in a container"
      body: |
        In [the last lesson](/lesson/a.container-is-a-process), the containers ran `sleep` and `echo`: useful for looking at a container, not for
        doing anything. Real containers usually run a **service**: a program that keeps running and answers
        requests, such as a web server.

        This lesson runs a tiny website. The busybox image you already know contains a small web server,
        `httpd`. Three things are needed that `sleep` did not need: the server must be reachable from outside the
        container, it needs the site's files, and you will want to see what it is doing.
    - kind: show
      id: site
      body: "The site is one file, `site/index.html`: this lesson's only source file, listed in **Before you start: source files**. To repeat the lesson, save it in a new folder and run every command from that folder, because `-v ./site` is a path relative to where you are:"
      run: "cat site/index.html"
    - kind: teach
      id: the-command
      title: "Where Podman's part ends"
      body: |
        The command that starts the site has two parts, and the **image name** is the boundary between them.
        Everything before the image is for Podman: options that say how to run the container. Everything after the
        image is the **command to run inside** the container, with its own options, which Podman passes on without
        reading them:

        | Part | Who reads it | Meaning |
        |---|---|---|
        | `podman run -d --name web -p 18180:8080 -v ./site:/www:Z` | Podman | how to run the container |
        | `quay.io/prometheus/busybox:latest` | Podman | the image |
        | `httpd -f -p 8080 -h /www` | the program in the container | busybox's web server, in the foreground (`-f`), on port 8080 (`-p 8080`), serving the directory `/www` (`-h /www`) |

        The two `-p` options are unrelated: the first belongs to Podman, the second to `httpd`.
    - kind: ask
      id: which-p
      prompt: "In `podman run -d -p 9090:80 IMAGE httpd -p 80`, which `-p` does the web server itself read?"
      choices:
        - text: "The one after the image name"
          why: "Everything after the image is the command run inside the container, so `httpd` reads `-p 80`: the port it listens on."
        - text: "The one before the image name"
          why: "That `-p 9090:80` is Podman's option, read before the container starts, to publish a port."
        - text: "Both of them"
          why: "Podman reads the options before the image name and passes the rest on untouched, so each program reads only its own."
      answer: 0
    - kind: teach
      id: the-options
      title: "Podman's options, one at a time"
      body: |
        - `-d --name web`: run the container in the background (detached), called `web`.
        - `-p 18180:8080`: **publish a port**. The server listens on port 8080 inside the container; this option
          makes the host's port 18180 lead to it. The step after next explains why this is needed.
        - `-v ./site:/www:Z`: **share a directory**: the host's `./site` appears inside the container as `/www`.
          The `:Z` is for SELinux, the extra security layer on RHEL: it relabels the directory so the container may
          read it. Without it, the server would be refused access to the files.
    - kind: show
      id: run
      run: "podman run -d --name web -p 18180:8080 -v ./site:/www:Z quay.io/prometheus/busybox:latest httpd -f -p 8080 -h /www"
      notice: "The container's ID, and the prompt is back: the server runs in the background."
    - kind: try
      id: try-ps
      body: "Check that the container `web` is running."
      accept: ["podman ps", "podman container ls", "podman ps -a", "podman container list"]
      hints:
        - match: "^docker "
          say: "This machine uses Podman: start with `podman`."
        - match: "^ps"
          say: "That lists the host's processes. Ask Podman for its containers."
      hint: "The command that listed the running containers in [the last lesson](/lesson/a.container-is-a-process)."
      then: "On your machine, look for `web` in the NAMES column and `Up` in STATUS. Its PORTS column shows the published port: the host side, an arrow, then the container's port."
    - kind: teach
      id: ports
      title: "Why the port must be published"
      body: |
        A **port** is a number that tells the machine which program should receive a network connection: a web
        server waits for connections on one port, and a client names that port to reach it. `localhost` means
        this machine, the host you are typing on.

        In [the last lesson](/lesson/a.container-is-a-process) you saw that a container gets its own namespaces. One of them is a **network
        namespace**: the container has its own network interfaces and its own ports. The server listens on
        port 8080 *inside* that namespace, which is not the host's port 8080.

        `-p 18180:8080` asks Podman to forward the host's port 18180 into the container's port 8080. The two
        numbers do not have to differ; a different host port makes it obvious which side is which. The address
        `http://localhost:18180/` reads as: contact this machine, on port 18180, using the web protocol (HTTP).
    - kind: ask
      id: guess-port
      guess: true
      prompt: "From the host, which address reaches the web server?"
      choices:
        - text: "`http://localhost:18180/`"
          why: "18180 is the host side of `-p 18180:8080`: connections to it are forwarded to the container's port 8080. The next step shows it working."
        - text: "`http://localhost:8080/`"
          why: "8080 is the port inside the container's own network namespace. The next step shows the address that works."
        - text: "Neither: containers cannot be reached from the host"
          why: "They can, through a published port: that is what `-p` is for. The next step shows it."
      answer: 0
    - kind: show
      id: curl
      body: "`curl` fetches a web page from the command line and prints it:"
      run: "curl -s --retry 5 --retry-connrefused --retry-delay 1 http://localhost:18180/"
      notice: |
        The page from `site/index.html`, served by the web server inside the container, through the published
        port. (`--retry` only makes `curl` wait a moment in case the server is still starting.)
    - kind: teach
      id: shared
      title: "A shared directory is the same directory"
      body: |
        `-v` does not copy the files: the container sees the host's directory itself, mounted at a second place,
        `/www`, in its own tree. This is called a **bind mount**. Change a file on the host, and the server inside
        sees the change at once. Here the recording rewrites the page, then fetches it again:
    - kind: ask
      id: guess-live
      guess: true
      prompt: "The site directory is shared with `-v`. You overwrite `site/index.html` on the host. What does the running server return next?"
      choices:
        - text: "The new page"
          why: "The container sees the host's directory itself, so it reads the new file. The next step shows it."
        - text: "The old page"
          why: "That would be true if `-v` copied the files at start. It shares the directory instead, so no copy exists to go stale."
        - text: "An error, until the container restarts"
          why: "The server reads the file each time it is asked, and the file is still there, so there is no error."
      answer: 0
    - kind: show
      id: live-edit
      run: "echo '<h1>Changed on the host</h1>' > site/index.html; curl -s http://localhost:18180/"
      notice: "No restart: the container read the new file from the shared directory."
    - kind: teach
      id: logs
      title: "What the container printed: podman logs"
      body: |
        A program in a container writes its messages to its standard output and standard error, the two
        streams from the Linux lessons. Podman keeps them, and `podman logs <name>` shows them, whether the
        container is running or has stopped.

        This web server prints nothing while it works normally, so the recording starts a second container whose
        command prints two lines (the second one to standard error) and then waits:
    - kind: show
      id: logger
      run: "podman run -d --name talker quay.io/prometheus/busybox:latest sh -c 'echo starting up; echo \"config file missing, using defaults\" >&2; sleep 600' >/dev/null; sleep 1"
    - kind: try
      id: try-logs
      body: "Show what the container `talker` has printed."
      accept: ["podman logs talker", "podman container logs talker"]
      hints:
        - match: "^podman log talker"
          say: "The subcommand is `logs`, with an `s`."
        - match: "^podman logs$"
          say: "Podman needs to know which container: add its name."
        - match: "^docker "
          say: "This machine uses Podman: start with `podman`. (Docker's command is the same: `docker logs`.)"
        - match: "^cat "
          say: "The messages are not in a file you can `cat`: Podman collects the container's output streams. Ask Podman for them."
      hint: "`podman logs`, then the container's name."
      run: "podman logs talker"
      then: "Both lines: the normal message, and the warning written to standard error. Podman keeps both streams. This is the first place to look when a container misbehaves."
    - kind: ask
      id: logs-where
      prompt: "The container `batch` stopped with an error an hour ago. Which command shows what it printed?"
      choices:
        - text: "`podman logs batch`"
          why: "Podman keeps the output streams of the main process, so they can be read even after the container stopped."
        - text: "`podman exec batch cat /dev/stderr`"
          why: "`exec` runs a command inside a running container, and `batch` has stopped. Standard error is also a stream, not a file that stores earlier messages."
        - text: "`podman start batch`"
          why: "Starting it runs the program again and does not replay the earlier output; reading old messages is the job of `podman logs`."
      answer: 0
    - kind: teach
      id: exec
      title: "Looking inside: podman exec"
      body: |
        `podman exec <name> <command>` runs one more command inside a running container, as you did with `ps` in
        [the last lesson](/lesson/a.container-is-a-process). Here it lists the directory the server is serving:
    - kind: show
      id: exec-ls
      run: "podman exec web ls -l /www"
      notice: "The shared file, visible inside the container at `/www`."
    - kind: teach
      id: stop-rm
      title: "Stopping, restarting and removing"
      body: |
        `podman stop <name>` asks the main process to stop (the signal SIGTERM) and, if it is still running after
        10 seconds, kills it (SIGKILL). A stopped container still exists: its settings and logs are kept, `podman
        ps -a` lists it, and `podman start <name>` starts it again.

        `podman rm <name>` removes a stopped container for good. `podman rm -f` stops and removes in one go.

        A container whose program ends by itself, or crashes, also stays stopped: Podman's default restart policy
        is `no`, and `podman run --restart=on-failure` (or `always`) asks for another.

        First, a program that behaves well: the recording starts a container whose shell prints `goodbye` when it
        receives SIGTERM and then exits.
    - kind: show
      id: tidy-start
      run: "podman run -d --name tidy quay.io/prometheus/busybox:latest sh -c 'trap \"echo goodbye; exit 0\" TERM; echo ready; while true; do sleep 1; done' >/dev/null; sleep 1"
    - kind: ask
      id: guess-tidy
      guess: true
      prompt: "`tidy` handles SIGTERM and exits normally. After `podman stop tidy`, what will `podman ps -a` show as its status?"
      choices:
        - text: "Exited (0)"
          why: "The program received SIGTERM, ran its handler and exited with code 0. The next step shows it."
        - text: "Exited (137)"
          why: "137 means SIGKILL (128 + 9), used only when the program does not stop in time. This one stops by itself."
        - text: "Running"
          why: "The stop ends the main process, which ends the container's run. The container still exists, but stopped."
      answer: 0
    - kind: show
      id: tidy-stop
      run: "podman stop tidy; podman ps -a --filter name=^tidy$ --format '{{.Names}} {{.Status}}'"
      notice: "`podman stop` printed the name and returned quickly. The container still exists, with the status `Exited (0)`: the program ended normally."
      understand:
        purpose: Stops the container `tidy`, then lists that one container, running or not, with only its name and
          status. The same listing comes back several times in the container lessons.
        parts:
          - text: podman stop tidy
            means: Sends the container's main process its stop signal (SIGTERM, unless the image chose another),
              waits up to 10 seconds, then sends SIGKILL if it is still running. It prints the container's name.
          - text: -a
            means: All containers, stopped ones included. Without it, `podman ps` lists only running containers, and
              the stopped `tidy` would not appear at all.
          - text: --filter name=^tidy$
            means: Keeps the containers whose name matches the regular expression `^tidy$`. `^` and `$` tie it to the
              whole name; without them, any name containing `tidy`, such as `tidy2`, would match too.
          - text: --format '{{.Names}} {{.Status}}'
            means: A template, as with `podman inspect`, applied to each container listed. It prints the name, a space
              and the status, instead of the full table.
        output: "`tidy`, printed by `podman stop`, then one line with the name and the status, such as `tidy Exited
          (0) Less than a second ago`."
        mistakes:
          - "Leaving out `-a`: the stopped container is not listed, which looks as if it had been removed."
        concepts:
          - container.podman
        refs:
          - title: 'podman-ps(1): --all, --filter (name accepts a regular expression), --format'
            url: https://docs.podman.io/en/latest/markdown/podman-ps.1.html
          - title: 'podman-stop(1): --time, default 10 seconds'
            url: https://docs.podman.io/en/latest/markdown/podman-stop.1.html
    - kind: show
      id: tidy-logs
      run: "podman logs tidy"
      notice: "The program's own goodbye is in the logs: it received SIGTERM and handled it."
    - kind: try
      id: tidy-restart
      body: "`tidy` has stopped but still exists. Start the same container again."
      accept: ["podman start tidy", "podman container start tidy", "podman restart tidy", "podman container restart tidy"]
      hints:
        - match: "^podman run"
          say: "`run` creates a new container from an image. To start an existing stopped container, use its name with `podman start`."
        - match: "^docker "
          say: "This machine uses Podman: start with `podman`."
        - match: "^podman start$"
          say: "Podman needs to know which container: add its name."
      hint: "`podman start`, then the container's name."
      run: "podman start tidy; podman ps --filter name=^tidy$ --format '{{.Names}} {{.Status}}'"
      then: "The same container runs again: `Up`. Its name and settings were kept while it was stopped."
    - kind: show
      id: tidy-rm
      run: "podman stop tidy >/dev/null; podman rm tidy"
      notice: "`podman rm` prints the name of the container it removed, and the container is gone."
    - kind: teach
      id: stop-timeout
      title: "When a program ignores SIGTERM"
      body: |
        Not every program reacts to SIGTERM. The web server of this lesson is the container's PID 1 (the first
        process), and the kernel gives PID 1 special treatment: a signal it has no handler for is ignored. The next
        recording stops it with a shorter wait (`-t 3`) to see what happens.
    - kind: show
      id: stop
      run: "podman stop -t 3 web; podman ps -a --filter name=^web$ --format '{{.Names}} {{.Status}}'"
      highlight: ["SIGKILL", "Exited (137)"]
      notice: |
        Look at the warning: SIGTERM did not stop the container within the 3 seconds allowed (`-t 3`), so Podman
        used SIGKILL, and the exit status is 137, which you can read as 128 + 9 (signal 9 is SIGKILL). This busybox
        server sets no handler, so only SIGKILL could stop it.

        Real images avoid this by running a program that handles SIGTERM, or by using `podman run --init`, which
        starts a tiny init process as PID 1 that passes the signal on. The container itself still exists, in the
        state `Exited`.
    - kind: order
      id: order-life
      prompt: "Put a container's typical life in order."
      items:
        - "`podman run -d …`: create and start it"
        - "`podman logs` and `podman exec`: check on it"
        - "`podman stop`: stop the main process"
        - "`podman rm`: remove the stopped container"
      why: "Run creates and starts; while it runs you read its logs and look inside; stop ends the process but keeps the container; rm removes it."
    - kind: ask
      id: rm-running
      prompt: "You run `podman rm talker` while it is still running. What happens?"
      choices:
        - text: "Podman refuses: stop it first, or use `-f`"
          why: "Removing a running container needs `podman stop` first, or `podman rm -f`, which stops it for you."
        - text: "The container is removed, and its process keeps running"
          why: "A container and its main process go together. Podman refuses rather than leave a process without its container."
        - text: "Its logs are deleted, but it keeps running"
          why: "`rm` is about the whole container, and Podman refuses it while the container runs."
      answer: 0
    - kind: reflect
      id: explain-flags
      prompt: "Explain to a colleague what `-p 18180:8080` and `-v ./site:/www:Z` each do, and why the container needs both here."
      model: |
        The container has its own network namespace, so its port 8080 is not reachable from the host until
        `-p 18180:8080` forwards the host's port 18180 to it. Its filesystem comes from the image, so the site's
        files must be shared: `-v ./site:/www:Z` makes the host's `site` directory appear as `/www` inside, with an
        SELinux label that allows the container to read it.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can run a service in a container, publish its port, share a directory with it, read its logs, run a
        command inside it, and stop and remove it. (On your machine, `podman rm -f web talker` removes the two
        containers left at the end: `web`, stopped, and `talker`, still running.)

        Sharing a directory from the host works on one machine, but the site is not part of the container: copy
        the container elsewhere and the files stay behind. The next step is to build an **image** that contains
        the site itself, so that it runs the same anywhere.
  sections:
    - id: rootless
      title: "Rootless containers and low ports"
      depth: true
      body: |
        These containers run **rootless**: started by an ordinary user, with no administrator rights on the host.
        Inside, the process is root (UID 0), but a user namespace maps it to your own user outside. Consequences:

        - An ordinary user cannot publish host ports below 1024 by default: `-p 80:8080` fails with "permission
          denied" unless the system's `net.ipv4.ip_unprivileged_port_start` setting allows it.
        - Files the container creates in a shared directory belong to your user on the host (or to a subordinate
          UID, for other users inside the container).
        - `podman unshare cat /proc/self/uid_map` shows the mapping.

        `:z` (lower case) relabels a directory so that several containers can share it; `:Z` makes it private to
        one container. Never relabel system directories such as `/home` or `/etc`.
  review:
    - q: "What does `-p 18180:8080` do?"
      a: "Forwards connections to the host's port 18180 to port 8080 inside the container."
    - q: "What does `-v ./site:/www:Z` do?"
      a: "Makes the host's `./site` directory appear inside the container as `/www`; `:Z` sets the SELinux label so the container may use it."
    - q: "How do you see what a container printed?"
      a: "`podman logs <name>`, even after it has stopped."
    - q: "What is the difference between `podman stop` and `podman rm`?"
      a: "`stop` ends the main process but keeps the container; `rm` removes a stopped container (`rm -f` stops it first)."
  commands:
    - cmd: "podman pull -q quay.io/prometheus/busybox:latest >/dev/null"
      meaning: "make sure the image is present (not shown in the lesson)"
    - cmd: "cat site/index.html"
      meaning: "the site's only page"
    - cmd: "podman run -d --name web -p 18180:8080 -v ./site:/www:Z quay.io/prometheus/busybox:latest httpd -f -p 8080 -h /www"
      meaning: "a web server with a published port and a shared directory"
    - cmd: "curl -s --retry 5 --retry-connrefused --retry-delay 1 http://localhost:18180/"
      meaning: "the page, through the published port"
    - cmd: "echo '<h1>Changed on the host</h1>' > site/index.html; curl -s http://localhost:18180/"
      meaning: "the shared directory is live"
    - cmd: "podman run -d --name talker quay.io/prometheus/busybox:latest sh -c 'echo starting up; echo \"config file missing, using defaults\" >&2; sleep 600' >/dev/null; sleep 1"
      meaning: "a container that prints two lines"
    - cmd: "podman logs talker"
      meaning: "what it printed"
    - cmd: "podman exec web ls -l /www"
      meaning: "the shared file inside the container"
    - cmd: "podman stop -t 3 web; podman ps -a --filter name=^web$ --format '{{.Names}} {{.Status}}'"
      meaning: "PID 1 ignores SIGTERM, so Podman uses SIGKILL after 3 seconds: Exited (137)"
    - cmd: "podman run -d --name tidy quay.io/prometheus/busybox:latest sh -c 'trap \"echo goodbye; exit 0\" TERM; echo ready; while true; do sleep 1; done' >/dev/null; sleep 1"
      meaning: "a container whose program handles SIGTERM"
    - cmd: "podman stop tidy; podman ps -a --filter name=^tidy$ --format '{{.Names}} {{.Status}}'"
      meaning: "a normal stop: the program exits with 0"
    - cmd: "podman logs tidy"
      meaning: "the program's goodbye message"
    - cmd: "podman start tidy; podman ps --filter name=^tidy$ --format '{{.Names}} {{.Status}}'"
      meaning: "starting a stopped container again"
    - cmd: "podman stop tidy >/dev/null; podman rm tidy"
      meaning: "stop and remove the container"
    - cmd: "podman rm talker"
      expect: fail
      meaning: "a running container cannot be removed without -f (checks the answer to a question; not shown)"
    - cmd: "podman rm -f -t 0 web talker >/dev/null"
      meaning: "clean up (not shown in the lesson)"
  files:
    site/index.html: |
      <h1>Hello from a container</h1>
  references:
    - {title: "Podman documentation: podman run (-p, -v, -d)", url: "https://docs.podman.io/en/latest/markdown/podman-run.1.html"}
    - {title: "Podman documentation: podman logs", url: "https://docs.podman.io/en/latest/markdown/podman-logs.1.html"}
    - {title: "Podman documentation: podman stop", url: "https://docs.podman.io/en/latest/markdown/podman-stop.1.html"}
    - {title: "Podman documentation: podman rm", url: "https://docs.podman.io/en/latest/markdown/podman-rm.1.html"}
    - {title: "RHEL 9: Building, running, and managing containers", url: "https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/building_running_and_managing_containers/index"}

- id: ct.build-images
  title: "Building your own image"
  subtitle: "A Containerfile, layers and the build cache, and what must stay out of an image"
  module: f1-containers
  mode: LOCAL_SIMULATION
  minutes: 25
  level: 1
  supports: "Podman 5.8 (rootless, Buildah inside) and curl on RHEL 9. Outputs recorded on a RHEL 9 workstation as an ordinary user; each command continues from what the previous ones left."
  concepts: [container.build, container.images, linux.process]
  prerequisites: [ct.podman-run]
  objective: |
    Read a short Containerfile, build and tag an image with podman build, run it, explain which steps the build
    cache reuses and why, keep files out of an image with .containerignore, and write CMD so that it runs the
    program you meant.
  flow:
    - kind: ask
      id: recall-volume
      prompt: "A look back. Why did the web server in the last lesson need `-v ./site:/www:Z`?"
      recalls: ct.podman-run
      choices:
        - text: "The site's files were not in the image"
          why: "The container's filesystem comes from its image; the site lived on the host, so it had to be shared."
        - text: "httpd cannot start without a volume"
          why: "httpd starts with any directory it can read. The volume was there because the site's files were on the host."
        - text: "To publish the port to the host"
          why: "Ports are published with `-p`. `-v` shares files."
      answer: 0
    - kind: teach
      id: why-build
      title: "Putting the site inside the image"
      body: |
        Sharing a directory from the host works on one machine. To run the same website elsewhere, on a server or
        later on a cluster, the files must travel **inside the image**. So you build your own image: start from an
        existing one (busybox, which has the web server) and add your files to it.

        The recipe is a text file, a **Containerfile** (Docker calls the same format a Dockerfile; Podman reads
        both). This lesson's source files (**Before you start**) are the build folder: the Containerfile, a second
        one used near the end, a `.containerignore`, and a `site` directory. Save them in a new folder and run the
        commands there. Each line of the Containerfile is an instruction, run in order:
    - kind: show
      id: containerfile
      run: "cat Containerfile"
      notice: |
        - `FROM`: the image to start from.
        - `COPY`: copy files from the build directory into the image.
        - `EXPOSE`: documents the port the program listens on (it does not publish anything).
        - `CMD`: the command the container runs when started, here the same `httpd` command as before.
    - kind: teach
      id: build
      body: |
        `podman build` reads the Containerfile in a directory (`.`, the current one) and produces an image. `-t`
        gives it a name and tag. We name this locally built image `localhost/site:1.0`; `localhost/` is part of the
        name that Podman gives to images built on this machine. Podman also finds the image by the shorter `site:1.0`,
        but the full name is clearer. Where copies of an image exist, and how registries name images, are separate
        questions that the next lesson answers.
    - kind: show
      id: build-run
      run: "podman build -t localhost/site:1.0 . 2>&1 | grep -E '^STEP|^COMMIT'"
      notice: "One step per instruction, then `COMMIT`: the image is saved under its name. (The recording kept only these lines of the build's output.)"
