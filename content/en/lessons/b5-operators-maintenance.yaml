# Teaching flows; cluster changes are documented examples, and quoted output names its existing lab recording.
- id: c.openshift-extends
  title: A platform run by operators
  subtitle: How the platform extends Kubernetes
  module: f3-openshift
  mode: GUIDED_INVESTIGATION
  minutes: 25
  level: 1
  supports: "OpenShift 4.21. Every command was run on OpenShift Local 4.21 by its cluster administrator (kubeadmin), and one by the ordinary user developer; all of them only read. No platform component is changed or broken on purpose, so the outputs show a cluster as it was found at recording time."
  concepts:
    - ocp.clusteroperators
    - k8s.crd-operator
  prerequisites:
    - b.crds-operators
    - k.kubectl-to-oc
  record_on: cluster-admin
  labs:
    - lab.cli-tour
    - lab.cluster-health
  objective: |
    Read the health of an OpenShift cluster from ClusterVersion and ClusterOperators, explain what the
    Cluster Version Operator does, and follow a ClusterOperator's report to the configuration and namespaces behind it.
  diagram: openshift
  flow:
    - kind: teach
      id: situation
      title: The application works; is the platform healthy?
      body: |
        Your application is running, but a colleague says the cluster's built-in login service is still changing after a restart.
        You need to tell normal progress from a problem before anyone changes the platform again.

        In [Custom resources and operators](/lesson/b.crds-operators), an operator reconciled an application's desired
        state. OpenShift uses the same pattern for its own components. This lesson follows them from a release to a
        health report, then to the configuration and evidence behind it.

        The commands were run on a lab cluster (OpenShift Local 4.21) by its administrator, `kubeadmin`, because these
        reports are cluster-wide; the prompt in front of each command names who ran it. Nothing here changes the
        cluster. Repeat them as `kubeadmin` on your own OpenShift Local; on a shared cluster, ask for a read-only role
        such as `cluster-reader`.

        Here to run applications? The next territory relies on three parts: a release managed by operators, reading
        their conditions together, and the map of Projects, Services and Routes. The rest reads the platform from the
        administrator's seat. It comes back in Platform administration, so you can skim it now.
    - kind: teach
      id: release
      title: One release, many managed components
      body: |
        Kubernetes supplies the API server, scheduler and controllers. OpenShift adds a tested set of components such
        as login, a web console, an integrated registry and an application router. It also adds API kinds such as
        Project and Route (you created a Route in [From kubectl to oc](/lesson/k.kubectl-to-oc)), and BuildConfig and ImageStream, which later lessons cover.

        A **release image** packages the platform's manifests and identifies its component images. The **Cluster Version
        Operator (CVO)** applies that release and keeps its platform resources at the declared state. Most components
        have their own **cluster operator**, which manages that component and publishes a ClusterOperator status object.

        This gives two levels of reconciliation: the CVO manages the release's operators; each operator manages its component.
    - kind: show
      id: version
      run: "oc get clusterversion"
      notice: |
        The object is named `version`. VERSION is the release the cluster runs; AVAILABLE and PROGRESSING describe
        that release; STATUS is the CVO's one-line summary.
    - kind: show
      id: developer-cannot
      body: "Now the identity changes to the ordinary user `developer`, admin of their own project only. Can developer list the cluster operators (`co` is short for `clusteroperators`)? Expect a refusal: they are cluster-scoped."
      run: "oc get co"
      notice: |
        Forbidden. ClusterOperators are cluster-scoped, and listing them needs a cluster-wide read permission that
        ordinary users do not have. Platform health is read by administrators, or by people given a reader role.
    - kind: ask
      id: manual-scale
      recalls: b.crds-operators
      prompt: An administrator scales an operator-managed Deployment from two replicas to one. What should they
        expect?
      choices:
        - text: One replica remains because the edit was authorized
          why: Authorization lets the request through the API. It does not change the state that the operator is
            trying to maintain.
        - text: Two replicas return at reconciliation
          why: The operator compares its output with its configuration and restores the declared replica count.
        - text: The operator abandons the edited Deployment
          why: An ordinary edit does not transfer management away from the operator.
      answer: 1
    - kind: teach
      id: conditions
      title: Read conditions together
      body: |
        A **condition** is a named status with a reason and message. A ClusterOperator normally settles at
        `Available=True`, `Progressing=False`, `Degraded=False`.

        `Available` says the component is functional. `Progressing` says it is moving to a new steady state, such as
        after startup or a configuration change. `Degraded` says it has persistently failed to reach its required state.

        Progressing alone after a restart is a reason to watch for convergence. Unavailable, degraded, or progress
        that stops needs investigation. Availability is a component signal; it is not an end-to-end test of every application.
    - kind: show
      id: operator-list
      body: "Back as `kubeadmin`, the cluster administrator. Every cluster operator publishes one ClusterOperator object. The list is the first health check:"
      run: "oc get clusteroperators"
      notice: |
        24 components on this cluster, every one at 4.21.8 and `True False False`. SINCE is the time since the Available condition
        last changed: `authentication` changed 147 minutes before the recording, most others 200 days ago, when the
        cluster was installed. A line that is not `True False False` is the one to open first.
    - kind: show
      id: scheduler-conditions
      body: |
        `oc describe` prints the whole report. Here `sed -n` keeps only the part between the `Conditions:` and
        `Extension:` lines, which holds one block per condition:
      run: "oc describe clusteroperator kube-scheduler | sed -n '/^  Conditions:/,/^  Extension:/p'"
      notice: |
        Read each `Type` with the `Status` immediately above it. The word Degraded inside a controller name does not
        make the Degraded condition true. Besides the usual three, the scheduler reports `Upgradeable=True` and an
        `EvaluationConditionsDetected` condition whose status is `Unknown` for lack of data.
    - kind: ask
      id: read-condition
      prompt: In this recorded report, does the scheduler report degradation?
      evidence: |2
          Conditions:
            Last Transition Time:  2026-10-16T02:00:42Z
            Message:               NodeControllerDegraded: All master nodes are ready
            Reason:                AsExpected
            Status:                False
            Type:                  Degraded
            Last Transition Time:  2026-03-30T12:43:11Z
            Message:               NodeInstallerProgressing: 1 node is at revision 6
            Reason:                AsExpected
            Status:                False
            Type:                  Progressing
            Last Transition Time:  2026-03-30T12:43:11Z
            Message:               StaticPodsAvailable: 1 nodes are active; 1 node is at revision 6
            Reason:                AsExpected
            Status:                True
            Type:                  Available
      choices:
        - text: Yes; the message contains NodeControllerDegraded
          why: Controller names can contain Degraded even when reporting success. Pair the condition type with its
            status.
        - text: Yes; revision 6 means an update failed
          why: A revision identifies configuration. It does not imply failure; this Progressing condition is False.
        - text: No; its Degraded status is False
          why: The condition type names the question. Its status answers it; the controller prefix in the message
            is not another condition.
      answer: 2
    - kind: teach
      id: follow-report
      title: A health report points to the evidence
      body: |
        ClusterOperator objects report status; they are not the configuration you edit. Their `status.relatedObjects`
        lists relevant configuration and namespaces. Start with the reason and message, then follow those objects.

        For an unhealthy component, inspect its pods, recent events and operator logs in those namespaces. Ask what
        changed: an input object, a referenced Secret, a node or a certificate. Several operators failing together
        suggest a shared dependency such as networking or the API server.
    - kind: show
      id: inspect-ingress
      body: "The ingress operator's report, cut to its related objects:"
      run: "oc describe clusteroperator ingress | sed -n '/^  Related Objects:/,/^  Versions:/p'"
      notice: |
        The list names the operator's namespace `openshift-ingress-operator`, its IngressControllers, the router's
        namespace `openshift-ingress`, and the canary namespace. Those are the places to look next.
    - kind: show
      id: ingress-pods
      body: "Following the first related namespace:"
      run: "oc get pods -n openshift-ingress-operator"
      notice: |
        The operator's own pod, with two containers. RESTARTS counts container restarts over the pod's life; the last
        one was six hours before the recording. Its logs and the namespace's events are the next evidence when the
        ingress report is unhealthy; the router pods themselves run in `openshift-ingress`.
    - kind: try
      id: inspect-authentication
      body: The colleague's worry is about login, which belongs to the cluster-scoped `authentication` ClusterOperator.
        Type one command to read its conditions, related objects and versions.
      accept:
        - oc describe clusteroperator authentication
        - oc describe clusteroperators authentication
        - oc describe co authentication
        - oc describe clusteroperator/authentication
        - oc describe co/authentication
        - oc describe clusteroperators/authentication
        - oc describe clusteroperator.config.openshift.io authentication
        - oc describe clusteroperator.config.openshift.io/authentication
      hints:
        - match: ^oc get
          say: A summary can locate an unhealthy operator. Use describe for its condition messages and related objects.
        - match: ^oc describe.* -n
          say: ClusterOperator is cluster-scoped. It does not live in an application project.
        - match: ^oc logs
          say: The report tells you which component and namespace to investigate before choosing a pod log.
      hint: Use oc with describe, the ClusterOperator kind (or co), and authentication.
      run: "oc describe clusteroperator authentication"
      then: |
        The Degraded, Progressing, Available and Upgradeable conditions all say `All is well`. Progressing and Available last changed at 15:33 UTC on the day of the
        recording, and the component had settled since: a recent change, finished. The related objects then name what the report covers:
        the `oauths` configuration named `cluster`, the `oauth-openshift` Route and Service, and namespaces such as
        `openshift-authentication` and `openshift-authentication-operator`.
    - kind: teach
      id: configuration
      title: Change the input the operator reads
      body: |
        Many cluster-wide settings live in singleton objects named `cluster` in `config.openshift.io`: for example
        OAuth configuration controls identity providers. Component settings can also live in `operator.openshift.io`
        or a component-specific API. Use that component's documentation to choose the supported input.

        Change the input, let the operator roll it out, then check its conditions again. Editing a generated
        Deployment or ConfigMap may be reconciled away.
    - kind: show
      id: scheduler-config
      body: "One such input, the cluster-wide scheduler settings, read without changing it:"
      run: "oc get scheduler cluster -o jsonpath='{.spec}{\"\\n\"}'"
      notice: |
        `mastersSchedulable: true`. OpenShift Local's only node is a control-plane node, and this setting lets
        ordinary workloads run on it. On a larger cluster it is usually false, so applications stay on workers.
    - kind: ask
      id: scheduler-input
      prompt: You must change the cluster's default scheduling profile. Where does the supported setting live?
      choices:
        - text: The Scheduler object named cluster
          why: Cluster-wide scheduler settings are a config.openshift.io object named cluster. The kube-scheduler operator reads it and rolls the change out.
        - text: The kube-scheduler ClusterOperator
          why: A ClusterOperator reports health. Writing to its status configures nothing, and the operator replaces what it finds there.
        - text: The generated kube-scheduler pod
          why: Generated pods are outputs of reconciliation. An edit there is reverted when the operator rolls out its configuration again.
      answer: 0
    - kind: teach
      id: project-service-route
      title: A map of the application APIs
      body: |
        A recap from [From kubectl to oc](/lesson/k.kubectl-to-oc), where you exposed an application. A **Project** is
        OpenShift's view of a namespace, with team-facing metadata and access management. A **Service** gives selected
        pods a stable network endpoint inside the cluster. A **Route** gives HTTP or HTTPS clients a hostname served by
        the router, the component whose ingress operator report you followed above, which forwards requests toward the
        Service's endpoints.

        The conceptual path is Deployment → pods, Service → selected pods, Route → Service. Replicas add capacity;
        they do not create an external hostname. The applications path builds on these objects from its first lessons.
    - kind: ask
      id: public-hostname
      prompt: Pods behind a Service named web run fine, but a browser outside the cluster cannot reach them by any hostname. What is missing?
      choices:
        - text: A Route for the Service
          why: A Service is reachable only inside the cluster. A Route publishes a hostname on the router and forwards requests to the Service's pods.
        - text: A second Service for the same pods
          why: A second Service is also internal. Another stable address inside the cluster publishes nothing outside it.
        - text: A ClusterOperator for the application
          why: ClusterOperators report on platform components. An application does not need one to be reachable.
      answer: 0
    - kind: teach
      id: capabilities
      title: Why clusters can expose different features
      body: |
        Some platform components are optional **capabilities** chosen at installation, such as Build, Console and
        ImageRegistry. A disabled capability can be enabled later; an enabled capability cannot be disabled again.
        Check enabled capabilities before assuming a feature is installed. Without the Build capability, Build and
        BuildConfig resources and the builder ServiceAccount are unavailable.

        OpenShift Local also uses release overrides to reduce resource use. An override can stop the CVO managing a
        resource, and causes `Upgradeable=False` with reason `ClusterVersionOverridesSet`. This is not a general way to
        customise production components. `Upgradeable=False` holds back minor updates (4.21 to 4.22); it does not by
        itself block patch updates (4.21.8 to a later 4.21 release). Overrides are the exception: while any is set, the
        CVO refuses patch updates too.
    - kind: show
      id: capability-check
      run: "oc get clusterversion version -o jsonpath='{.status.capabilities}{\"\\n\"}'"
      notice: |
        Two lists: `enabledCapabilities`, what this cluster runs (Build, Console, ImageRegistry, OperatorLifecycleManager
        and others), and `knownCapabilities`, what this release could run. Capabilities only in the second list, such
        as `Insights`, `Storage` and `OperatorLifecycleManagerV1`, are not installed here.
    - kind: show
      id: overrides-recorded
      body: "The update status, which also reports why a minor update may be blocked. Without arguments, `oc adm upgrade` only reads:"
      run: "oc adm upgrade"
      notice: |
        OpenShift Local's release overrides appear as `Upgradeable=False` with the reason `ClusterVersionOverridesSet`. The
        reason and message name the cause; another cluster would show a different one. The channel is `stable-4.21`,
        and the recommended updates are later 4.21 patch releases: Upgradeable=False does not hide them. Applying one
        would still be refused here, because the CVO allows a patch update under Upgradeable=False only when no
        override is set. The command started nothing.
    - kind: ask
      id: degraded-available
      prompt: A component is Available=True and Degraded=True. What should you do?
      choices:
        - text: Ignore it until Available becomes False
          why: Degradation is a persistent mismatch requiring investigation, even while the component remains available.
        - text: Investigate its message and check user impact
          why: Availability and degradation can coexist. The conditions guide investigation; application checks
            establish impact.
        - text: Declare every application unavailable immediately
          why: A degraded component alone does not prove a cluster-wide outage. Read the evidence and check affected
            services.
      answer: 1
    - kind: order
      id: health-investigation
      prompt: Put the investigation of a degraded operator in order.
      items:
        - Read the ClusterOperator condition, reason and message
        - Follow related objects to configuration and component namespaces
        - Inspect pods, events and logs; identify the changed input
        - Correct the supported input and verify convergence
      why: Work from the report to its evidence, then change the cause and confirm the component settles.
    - kind: reflect
      id: explain-reconciliation
      prompt: A colleague repairs a generated platform Deployment, but the edit disappears. Explain where the lasting
        change belongs.
      model: |
        The operator regenerates that Deployment from its configuration. Find the supported configuration object for the component, change that input, and watch the operator apply it and settle.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can distinguish a release from the operators it manages, read ClusterOperator conditions together,
        follow related objects, and choose configuration inputs instead of generated outputs. You also have a map of
        Projects, Services and Routes and know why optional capabilities can differ.

        This closes the Kubernetes path. The OpenShift applications path starts with
        [Console and CLI tools](/lesson/n.console-clis). The cluster health lab applies the reading method of this
        lesson to existing platform objects; it does not deliberately break a component.
  sections:
    - id: platform-reference
      title: Platform and configuration reference
      depth: true
      body: |
        | Platform layer | Examples | Evidence or input |
        |---|---|---|
        | OpenShift APIs | Project, Route, BuildConfig, ImageStream, SCC, OAuth, User, Group | API groups ending in `openshift.io` |
        | Components | router, registry, login, console, monitoring | component namespaces and ClusterOperator status |
        | Release management | CVO and its release manifests | `ClusterVersion/version`: desired update, channel, history, conditions |
        | Node management | Machine Config Operator | MachineConfig and MachineConfigPool; introduced in the maintenance lessons |

        | Configuration need | Supported object examples | Applying operator |
        |---|---|---|
        | Identity providers and token settings | `oauth.config.openshift.io/cluster` | authentication |
        | Cluster ingress domain | `ingresses.config.openshift.io/cluster` | ingress; domain changes have installation constraints |
        | Scheduler profile; cluster default node selector | `schedulers.config.openshift.io/cluster` | kube-scheduler (profile); the kube-apiserver applies `defaultNodeSelector` at pod admission |
        | Network settings | `networks.config.openshift.io/cluster` | network; many fields cannot be changed freely after installation |
        | Platform type and API URLs | `infrastructures.config.openshift.io/cluster` | primarily installation-derived status |

        This is an object map, not permission to edit every listed field. Follow the documented procedure for the setting.
    - id: condition-reference
      title: Conditions and investigation reference
      depth: true
      body: |
        | Condition | Normal steady value | What another value asks you to check |
        |---|---|---|
        | Available | True | False: a component is non-functional; read its message promptly |
        | Progressing | False | True: a transition; investigate if progress stalls |
        | Degraded | False | True: persistent failure to reach required state |
        | Upgradeable | True, Unknown or absent permits updates | False: a minor-update blocker, explained in the message |

        ClusterVersion also reports `Failing` (cannot reach the release), `Invalid` (invalid request), `RetrievedUpdates`
        (update information retrieval), `ReleaseAccepted` (payload verification and preconditions), and capability conditions.
        The CVO applies manifests in ordered stages called runlevels; it waits for the required operator progress
        before advancing. Cluster version overrides stop reconciliation of selected release resources and prevent minor updates.

        | Pattern | Next evidence |
        |---|---|
        | Degraded after a configuration edit | message, input object and referenced Secrets |
        | Progressing without progress | rollout revisions, pod events and node readiness |
        | Unavailable | component pod status, events and logs |
        | Several components fail together | shared node, network, etcd or API dependency |

        The recording lists the ClusterOperators of OpenShift Local 4.21. It omits some components, including
        monitoring, which this cluster leaves out to save memory; it is not the operator inventory of every OpenShift cluster.
  review:
    - q: What do Available, Progressing and Degraded mean on a ClusterOperator?
      a: 'Available: component functional; Progressing: moving to a new steady state; Degraded: persistent failure
        to reach required state. Read their statuses, reasons and messages together.'
    - q: Which objects take a Deployment to a URL on OpenShift?
      a: A Service that selects its pods (stable name and IP), then a Route that publishes a hostname on the router
        and sends outside traffic to that Service, all inside a project.
    - q: Where do cluster-wide OpenShift settings live?
      a: Many settings use singleton cluster objects in config.openshift.io; component APIs and operator.openshift.io
        also provide supported inputs. ClusterOperator objects are status reports.
    - q: What does the Cluster Version Operator do?
      a: Applies the release image manifests in ordered stages and reconciles the platform resources they define,
        including the cluster operators.
    - q: Where do you look after reading an unhealthy ClusterOperator's message?
      a: 'Its related objects (`oc describe clusteroperator <name>`): config objects and namespaces, then pods,
        events and the operator''s log there.'
    - q: Can a cluster capability be disabled after it is enabled?
      a: No. Capabilities can be left out at installation and enabled later, never disabled once enabled.
  limits: Every command here only reads; no component is deliberately degraded, so the recording shows whatever state the
    cluster was in at that moment. OpenShift Local runs one node and leaves monitoring out, so its operator list and
    update status differ from an installed cluster's.
  enterprise: |
    Platform teams watch ClusterOperator conditions as first-line health (alerts such as
    ClusterOperatorDegraded and ClusterOperatorDown), and every change ticket starts with "cluster healthy
    before change" evidence.
  commands:
    - {cmd: "oc get clusterversion", as: admin, meaning: "the release the cluster runs and the CVO's summary"}
    - {cmd: "oc get co", expect: fail, meaning: "the developer may not list ClusterOperators"}
    - {cmd: "oc get clusteroperators", as: admin, meaning: "every cluster operator's version and conditions"}
    - {cmd: "oc describe clusteroperator kube-scheduler | sed -n '/^  Conditions:/,/^  Extension:/p'", as: admin, meaning: "the scheduler operator's conditions, one block each"}
    - {cmd: "oc describe clusteroperator ingress | sed -n '/^  Related Objects:/,/^  Versions:/p'", as: admin, meaning: "where the ingress operator's report points"}
    - {cmd: "oc get pods -n openshift-ingress-operator", as: admin, meaning: "the ingress operator's own pod"}
    - {cmd: "oc describe clusteroperator authentication", as: admin, meaning: "the login component's full report"}
    - {cmd: "oc get scheduler cluster -o jsonpath='{.spec}{\"\\n\"}'", as: admin, meaning: "the cluster-wide scheduler input"}
    - {cmd: "oc get clusterversion version -o jsonpath='{.status.capabilities}{\"\\n\"}'", as: admin, meaning: "enabled and known capabilities"}
    - {cmd: "oc adm upgrade", as: admin, meaning: "the update status: channel, Upgradeable and recommended updates; reads only"}
  references:
    - title: 'OpenShift 4.21: Cluster Operators reference'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/operators/operator-reference
    - title: 'OpenShift 4.21: Understanding OpenShift updates (CVO, condition types)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/understanding-openshift-updates-1
    - title: 'OpenShift 4.21: Cluster capabilities'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/installation_overview/cluster-capabilities
    - title: 'OpenShift 4.21 API reference: Scheduler (config.openshift.io/v1)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/config_apis/scheduler-config-openshift-io-v1
- id: c.olm
  title: Operator Lifecycle Manager
  module: b6-operators-maintenance
  mode: GUIDED_INVESTIGATION
  minutes: 30
  level: 2
  supports: "OLM Classic and OLM v1 on OpenShift 4.21. The catalog, package, OperatorGroup, CSV, OLM configuration and capability reads were run on OpenShift Local 4.21 by its cluster administrator (kubeadmin), and one command by the ordinary user developer; all of them only read. The installation itself (Subscription, InstallPlan approval, CSV) is a documented example and was not run: the lab node had 23% of its disk free, below the 25% the course requires before pulling an operator's images."
  concepts:
    - ocp.olm
    - k8s.crd-operator
  prerequisites:
    - b.crds-operators
    - c.openshift-extends
  record_on: cluster-admin
  labs:
    - lab.olm-inspect
  objective: |
    Explain how OLM installs and updates an add-on operator (GitOps, logging, security scanning…), read the objects that
    show where an installation stopped, see what an operator would install before approving it, and say what stays
    behind when it is removed.
  diagram: olm
  flow:
    - kind: teach
      id: situation
      title: The request is to install an operator
      body: |
        A team wants an add-on operator. Its container image is only one part of the installation. The operator also
        needs new API definitions, permissions and a controller Deployment, and later it must move to newer versions
        without breaking the resources teams have already created with it.

        **Operator Lifecycle Manager (OLM)** manages this installation and update work from published packages.
        This lesson follows OLM Classic's object chain and uses it to locate a stopped installation. The reads were
        run by the administrator of a lab cluster (OpenShift Local 4.21); the installation steps are documentation
        examples, for a reason the lesson shows with real numbers.
    - kind: teach
      id: why-a-lifecycle-manager
      body: |
        In [Custom resources and operators](/lesson/b.crds-operators), a CustomResourceDefinition (CRD) added a kind to
        the API and an operator reconciled its instances. OLM installs that operator; the operator then manages
        **operands**, the applications or services requested through its custom resources.

        A **catalog** publishes operator packages and versions. In OLM Classic, the Catalog Operator resolves the
        requested package and its dependencies; the OLM Operator runs the installation described by a
        **ClusterServiceVersion (CSV)**. The CSV records the operator version, APIs, permissions and Deployment strategy.
    - kind: show
      id: catalogs
      run: "oc get catalogsources -n openshift-marketplace"
      notice: |
        Four CatalogSources: package sources, not four installed operators. Each is served by a pod in
        `openshift-marketplace` that answers OLM's questions about packages and versions. `redhat-marketplace` is
        deprecated in 4.21 and removed in 4.22; the 4.21 documentation lists the other three as the Red Hat-provided
        catalogs.
    - kind: show
      id: developer-no-api
      body: "The team wants certificates managed by the cert-manager Operator. In the developer's project, the API it would add does not exist yet:"
      run: "oc get certificates"
      notice: "`the server doesn't have a resource type \"certificates\"`: no CRD defines that kind. Installing the operator is what would add it."
    - kind: ask
      id: catalog-versus-install
      prompt: A CatalogSource is healthy. Does that prove a team’s requested operator is installed?
      choices:
        - text: Yes; every catalog package is installed
          why: Publishing a package does not request its installation. A Subscription makes that request.
        - text: Yes; the catalog pod is its controller
          why: The catalog pod serves metadata. The installed operator gets its own Deployment.
        - text: No; inspect its Subscription, plan and CSV
          why: A working catalog supplies packages. The installation request and result are separate objects.
      answer: 2
    - kind: teach
      id: from-catalog-to-running-operator
      title: Ask for a package with a Subscription
      body: |
        A **Subscription** chooses a package, a catalog, a channel and an approval policy. A **channel** is a stream of
        versions with published update paths. A **PackageManifest** is a read-only view of a package's available
        channels and install modes, so it shows what you may ask for.
    - kind: show
      id: find-package
      run: "oc get packagemanifests -n openshift-marketplace | grep cert-manager"
      notice: "Two packages match: `openshift-cert-manager-operator` from the Red Hat Operators catalog and `cert-manager` from the community catalog. A Subscription names both the package and the catalog, so the choice is explicit."
    - kind: show
      id: default-channel
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.defaultChannel}{\"\\n\"}'"
      notice: "`stable-v1`: the channel a Subscription gets when it names none."
    - kind: show
      id: channels
      body: "Every channel, with the newest CSV it offers:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[*]}{.name}{\"\\t\"}{.currentCSV}{\"\\n\"}{end}'"
      notice: "`stable-v1` follows the newest version; `stable-v1.18`, `stable-v1.19` and `stable-v1.20` each stay on one minor line. The CSV name carries the version."
    - kind: try
      id: try-install-modes
      body: "Print the install modes that the `stable-v1` channel's current version supports, one `type=supported` pair per line. The fields are `.status.channels[]`, filtered on `.name`, then `.currentCSVDesc.installModes[]` with `.type` and `.supported`."
      accept:
        - "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.installModes[*]}{.type}{\"=\"}{.supported}{\"\\n\"}{end}'"
        - "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.installModes[*]}{.type}={.supported}{\"\\n\"}{end}'"
      hints:
        - match: "^oc describe"
          say: "`describe` prints everything, for every channel. The task asks for one channel's install modes, as type=supported lines: a jsonpath."
      hint: "Start from the command that printed the channels and change the range: filter the channel with `[?(@.name==\"stable-v1\")]`, then range over `.currentCSVDesc.installModes[*]`."
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.installModes[*]}{.type}{\"=\"}{.supported}{\"\\n\"}{end}'"
      then: "OwnNamespace, SingleNamespace and AllNamespaces are supported; MultiNamespace is not. The OperatorGroup you create must select one of the supported scopes."
    - kind: teach
      id: plan-and-csv
      title: OLM turns the request into a plan and a CSV
      body: |
        OLM resolves the request and creates an **InstallPlan**, a list of resources to install. Approval permits OLM to
        create those resources, including CRDs, permissions and the CSV. The CSV's strategy creates the operator
        Deployment; `status.phase: Succeeded` reports a successful installation.

        Each object tells you where to look next. If no InstallPlan exists, look at resolution: the catalog, the package
        and the channel. If a plan completed but the CSV failed, look at the CSV's requirements and at the operator's
        own health.
    - kind: show
      id: inspect-chain
      run: "oc get subscriptions,installplans -A"
      notice: |
        `No resources found`: nothing has been installed through OLM on this cluster. On a cluster where an operator
        was installed, the same command lists its Subscription and plans. Read them from the first missing or failed
        link, rather than restarting OLM.
    - kind: show
      id: csv-list
      run: "oc get csv -A"
      notice: "The only CSV is OLM's own package server, which serves the PackageManifests read above."
    - kind: ask
      id: resolution-cause
      prompt: 'No plan exists. The Subscription says ResolutionFailed: channel not found. Where do you look?'
      choices:
        - text: The operator Deployment’s container logs
          why: There is no completed installation yet. The requested channel failed before a Deployment could be
            installed.
        - text: The PackageManifest channels
          why: Resolution needs a real package and channel. Compare the requested name with the published names.
        - text: The InstallPlan approval field
          why: No plan exists to approve. Resolve the request before considering approval.
      answer: 1
    - kind: teach
      id: operatorgroups-and-install-modes
      title: Scope is declared before installation
      body: |
        An **OperatorGroup** selects the namespaces an operator will watch and supports OLM's permission setup.
        The installing namespace needs exactly one OperatorGroup. Its selected scope must match an install mode
        supported by the CSV: own namespace, one other namespace, several namespaces, or all namespaces.

        `spec.targetNamespaces` supplies an explicit list; `spec.selector` selects namespaces by labels. With neither,
        the group targets all namespaces. If both are present, the explicit targets take precedence.

        A scope mismatch can fail the CSV with `UnsupportedOperatorGroup`. Missing or multiple groups can stop the
        plan earlier. Check both the group and the CSV's declared modes; OLM does not silently expand the scope.
    - kind: show
      id: existing-groups
      body: "The groups that already exist, each in its own namespace:"
      run: "oc get operatorgroups -A"
      notice: "`global-operators` in `openshift-operators` is where the console installs operators that watch every namespace."
    - kind: show
      id: global-scope
      body: "Its spec and the namespaces OLM resolved it to:"
      run: "oc get operatorgroup global-operators -n openshift-operators -o jsonpath='{.spec}{\"\\n\"}{.status.namespaces}{\"\\n\"}'"
      notice: "No `targetNamespaces` and no `selector`, so `status.namespaces` is `[\"\"]`: the empty name means all namespaces."
    - kind: show
      id: own-scope-real
      body: "OLM's own group, for contrast:"
      run: "oc get operatorgroup olm-operators -n openshift-operator-lifecycle-manager -o jsonpath='{.spec}{\"\\n\"}{.status.namespaces}{\"\\n\"}'"
      notice: "An explicit target list naming only its own namespace: the OwnNamespace scope."
    - kind: show
      id: own-scope
      code: |
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: team-scope
          namespace: team-operators
        spec:
          targetNamespaces:
          - team-operators
      origin: example
      caption: 'OpenShift 4.21 documentation: Understanding Operators, Operator groups; illustrative manifest.'
      notice: |
        This selects the operator’s own namespace. An operator supporting only AllNamespaces cannot use this scope.
    - kind: ask
      id: scope-mismatch
      prompt: This group targets only team-operators. The package supports AllNamespaces only. What needs changing?
      choices:
        - text: The chosen group scope or package
          why: Choose a compatible scope and package combination before installation; OLM will not rewrite the group
            for you.
        - text: The operator Deployment’s replica count
          why: Replicas decide how many copies of the controller run. The namespaces it watches come from the OperatorGroup, which must match a supported install mode.
        - text: The application’s Service selector labels
          why: Service selectors route traffic to pods. The operator's watch scope comes from its OperatorGroup; OLM marks the CSV UnsupportedOperatorGroup until group and package match.
      answer: 0
    - kind: ask
      id: second-group
      prompt: "A namespace's OperatorGroup targets only that namespace. A colleague adds a second, global group beside it. What happens to the next installation there?"
      choices:
        - text: "No CSV appears; the plan reports two groups"
          why: "A namespace may hold exactly one OperatorGroup. With two, OLM does not generate the CSV, and the InstallPlan reports that more than one operator group manages the namespace."
        - text: "The newer, global group wins and installs it"
          why: "OLM does not choose a group by age. Two groups make the namespace's group invalid, so nothing installs until one is removed."
        - text: "OLM merges both into an all-namespaces scope"
          why: "OLM never merges groups or widens a scope by itself. For an all-namespaces operator, use a separate namespace with its own global group."
      answer: 0
    - kind: teach
      id: channels-approval-and-updates
      title: Approval controls when a plan takes effect
      body: |
        With `installPlanApproval: Automatic`, OLM approves generated plans. With `Manual`, it creates a plan in
        `RequiresApproval` and waits for a person with permission to set `spec.approved: true`.

        The Subscription's `currentCSV` identifies the newest version OLM knows for the request; `installedCSV` names
        the installed version. A difference means there is pending or ongoing work, not proof that an update succeeded.

        Operators colocated in one namespace are resolved together. Pending plans include the other operators' CSVs;
        one Manual policy makes their shared updates manual. Use separate namespaces, each with a suitable
        OperatorGroup, when operators need independent update decisions.
    - kind: show
      id: manual-request
      code: |
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: example-operator
          namespace: team-operators
        spec:
          name: example-operator
          source: custom-operators
          sourceNamespace: openshift-marketplace
          channel: stable-3.7
          installPlanApproval: Manual
      origin: example
      caption: 'OpenShift 4.21 documentation: Administrator tasks, installing a specific Operator version; adapted
        example.'
      notice: |
        Package and channel names are illustrative. Obtain actual names from the catalog’s PackageManifest; this manifest does not install anything here.
    - kind: show
      id: approval-field
      body: "The cluster's own API documentation for the field, read with `oc explain`:"
      run: "oc explain subscription.spec.installPlanApproval"
      notice: "`Automatic` or `Manual`, nothing else. The field belongs to the Subscription; the approval itself is `spec.approved` on each InstallPlan."
    - kind: ask
      id: pending-version
      prompt: Manual approval is configured; currentCSV differs from installedCSV. What proves the newer operator
        is running?
      choices:
        - text: A new channel entry in the catalog
          why: Publishing a version only makes it available for resolution.
        - text: The mere existence of the Subscription
          why: A Subscription expresses intent; it does not prove installation or readiness.
        - text: A Succeeded new CSV and healthy operator pods
          why: Check the approved plan and the installation result. The differing names alone only show pending
            or ongoing work.
      answer: 2
    - kind: teach
      id: inspecting-what-an-operator-installed
      title: Read the CSV as an installation manifest
      body: |
        The CSV explains what the operator needs: owned CRDs or APIServices, install modes, namespaced `permissions`,
        `clusterPermissions`, and Deployments. `status.requirementStatus` reports whether prerequisites are satisfied.
        The InstallPlan's `status.plan` lists the planned resources and their per-object status.

        Review these before approving new permissions. A CSV's condition history can contain old failures even when
        its current phase has recovered; read the current phase and reason separately from the history.
    - kind: show
      id: csv-result
      body: "The current phase, reason and message of the one CSV on this cluster:"
      run: "oc get csv packageserver -n openshift-operator-lifecycle-manager -o jsonpath='{.status.phase}{\"  \"}{.status.reason}{\"  \"}{.status.message}{\"\\n\"}'"
      notice: "`Succeeded`, `InstallSucceeded`, `install strategy completed with no errors`: OLM's own package server, installed and healthy. An installed add-on reports the same three fields."
    - kind: show
      id: owned-crds
      body: "Before installing, the PackageManifest already says which APIs the package's current version would own:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.customresourcedefinitions.owned[*]}{.name}{\"\\n\"}{end}'"
      notice: "Ten CRDs, among them `certificates.cert-manager.io`: the kind the developer could not list. They would become cluster-wide API kinds, visible in every project."
    - kind: show
      id: related-images
      body: "And which images an installation would bring to the nodes:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.relatedImages[*]}{@}{\"\\n\"}{end}'"
      notice: "Six images, referenced by digest: the operator, the bundle, cert-manager itself and optional components. The operator and the components it starts are pulled onto the node that runs them."
    - kind: show
      id: disk-check
      body: "On a single node with limited disk, that matters. The node's free disk, from the kubelet's summary:"
      run: "oc get --raw /api/v1/nodes/crc/proxy/stats/summary | jq '.node.fs | {availableGiB: (.availableBytes / 1073741824 * 10 | floor / 10), freePercent: (.availableBytes * 100 / .capacityBytes | floor)}'"
      notice: |
        23% free. Below 15% free, the kubelet's default threshold for image storage, the kubelet starts reclaiming disk: it
        deletes unused images first and evicts pods only if that is not enough. The catalogs' periodic index refresh alone
        pulls large images. The course installs an operator only with at least 25% free, so the installation below stays a
        documented example.
    - kind: show
      id: install-chain-example
      body: "The installation an administrator would run, with this package's real names:"
      code: |
        $ oc create namespace cert-manager-operator
        $ oc create -f operatorgroup.yaml       # spec: {} → all namespaces
        $ oc create -f subscription.yaml        # channel stable-v1, installPlanApproval: Manual
        $ oc get installplan -n cert-manager-operator
        $ oc patch installplan <name from the Subscription's status.installPlanRef> -n cert-manager-operator --type merge -p '{"spec":{"approved":true}}'
        $ oc get csv -n cert-manager-operator
      origin: example
      caption: 'Adapted from the cert-manager Operator for Red Hat OpenShift 4.21 documentation (installing by using the CLI); not run, because the lab node lacked the disk headroom shown above.'
      notice: |
        The plan to approve is the one the Subscription names in `status.installPlanRef`, never "whatever plans
        exist". After approval, the CSV moves to `Succeeded` and the ten CRDs become part of the API.
    - kind: try
      id: inspect-csv
      body: You can read platform objects. In team-operators, CSV example-operator.v3.7.10 exists. Type a command
        to describe its requirements and current phase.
      accept:
        - oc describe csv example-operator.v3.7.10 -n team-operators
        - oc describe csv example-operator.v3.7.10 --namespace=team-operators
        - oc describe csv example-operator.v3.7.10 --namespace team-operators
        - oc -n team-operators describe csv example-operator.v3.7.10
        - oc describe -n team-operators csv example-operator.v3.7.10
        - oc describe csv/example-operator.v3.7.10 -n team-operators
        - oc describe clusterserviceversion example-operator.v3.7.10 -n team-operators
        - oc describe clusterserviceversions example-operator.v3.7.10 -n team-operators
        - oc --namespace team-operators describe csv example-operator.v3.7.10
        - oc --namespace=team-operators describe csv example-operator.v3.7.10
        - oc describe --namespace team-operators csv example-operator.v3.7.10
        - oc describe --namespace=team-operators csv example-operator.v3.7.10
        - oc -n team-operators describe csv/example-operator.v3.7.10
        - oc describe csv/example-operator.v3.7.10 --namespace team-operators
        - oc --namespace team-operators describe csv/example-operator.v3.7.10
        - oc describe csv/example-operator.v3.7.10 --namespace=team-operators
        - oc --namespace=team-operators describe csv/example-operator.v3.7.10
        - oc -n team-operators describe clusterserviceversion example-operator.v3.7.10
        - oc describe clusterserviceversion example-operator.v3.7.10 --namespace team-operators
        - oc --namespace team-operators describe clusterserviceversion example-operator.v3.7.10
        - oc describe clusterserviceversion example-operator.v3.7.10 --namespace=team-operators
        - oc --namespace=team-operators describe clusterserviceversion example-operator.v3.7.10
        - oc -n team-operators describe clusterserviceversions example-operator.v3.7.10
        - oc describe clusterserviceversions example-operator.v3.7.10 --namespace team-operators
        - oc --namespace team-operators describe clusterserviceversions example-operator.v3.7.10
        - oc describe clusterserviceversions example-operator.v3.7.10 --namespace=team-operators
        - oc --namespace=team-operators describe clusterserviceversions example-operator.v3.7.10
        - oc -n team-operators describe csvs example-operator.v3.7.10
        - oc describe csvs example-operator.v3.7.10 -n team-operators
        - oc --namespace team-operators describe csvs example-operator.v3.7.10
        - oc describe csvs example-operator.v3.7.10 --namespace team-operators
        - oc --namespace=team-operators describe csvs example-operator.v3.7.10
      hints:
        - match: ^oc describe.*subscription
          say: The Subscription expresses the request. Requirements and installation phase belong to the CSV.
        - match: ^oc get
          say: Use describe to read the detailed requirement report rather than only a table row.
        - match: ^(oc describe csv [^ ]+)$
          say: A CSV is namespaced. Supply team-operators explicitly so the current project cannot send you elsewhere.
      hint: Use describe on the CSV, naming both its versioned name and its namespace.
      then: |
        The report would show the CSV’s current phase, reason and requirements. If the plan completed but the operator is unhealthy, follow its Deployment, pod events and logs.
    - kind: teach
      id: uninstalling-and-what-stays
      title: Removal has an application side
      body: |
        A **finalizer** is a cleanup obligation that keeps an object from disappearing until its controller finishes.
        For intentional retirement, remove the operands while their operator still runs and wait for cleanup.
        Then remove the Subscription to stop updates and the installed CSV to remove the operator Deployment and
        associated installation resources. Check `installedCSV` as well as `currentCSV` if an update is pending.

        OLM Classic leaves CRDs and any remaining custom resources. The namespace, OperatorGroup and operand resources
        can also remain. Deleting a CRD deletes its instances cluster-wide, so inventory and data retention come first.
        Follow the operator's own backup and uninstall instructions before removing a stateful operand.
    - kind: show
      id: uninstall-message
      body: "Packages can say this themselves. The uninstall message this package's CSV carries, which the console shows before removal:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.annotations.operator\\.openshift\\.io/uninstall-message}{\"\\n\"}'"
      notice: "\"All operands created by the operator will need to be manually cleaned up.\" Removing the operator leaves cert-manager itself, its namespace and its webhooks running until you remove them."
    - kind: order
      id: remove-order
      prompt: Order a planned retirement of an OLM Classic operator.
      items:
        - Inventory operands and protect data according to the operator’s procedure
        - Delete operands and wait for their operator to finish cleanup
        - Remove the Subscription and installed CSV; verify operator removal
        - Decide about remaining CRDs, operand resources and a dedicated namespace
      why: Keep the controller alive until the cleanup it owns has finished; retaining data and deleting an API
        kind are explicit decisions.
    - kind: teach
      id: olm-v1-clusterextension-and
      title: Recognize a different OLM API
      body: |
        OLM v1 is generally available alongside Classic in OpenShift 4.21. A **ClusterCatalog** provides content;
        a **ClusterExtension** requests an installed package and allowed versions. You provide an installation
        ServiceAccount and its permissions. These APIs are cluster-scoped; they do not use Classic's Subscription,
        InstallPlan and OperatorGroup chain.

        Allowed updates are reconciled automatically without a Classic approval plan. In 4.21, supported packages
        use the existing `registry+v1` bundle format without operator dependencies and normally watch all namespaces.
        Watching a single namespace is a **Technology Preview**: a feature not yet supported for production use.
        CLI management is supported; the console's OLM v1 catalog is a Technology Preview too.

        Removal also differs: deleting a ClusterExtension removes its installed resources, including its CRDs and
        their custom resources. Confirm which lifecycle API manages the operator before planning removal.
    - kind: show
      id: capabilities
      body: "Whether a cluster runs OLM v1 is a capability. The capabilities enabled on the lab cluster:"
      run: "oc get clusterversion version -o jsonpath='{.status.capabilities.enabledCapabilities}{\"\\n\"}'"
      notice: "`OperatorLifecycleManager` (Classic) is enabled; `OperatorLifecycleManagerV1` is not in the list. Installed clusters have enabled OLM v1 by default since 4.18, alongside Classic; this OpenShift Local cluster leaves it out."
    - kind: show
      id: v1-api
      run: "oc api-resources --api-group=olm.operatorframework.io"
      notice: "Only the header: no ClusterCatalog or ClusterExtension kind is served here. On this cluster, every operator goes through OLM Classic."
    - kind: ask
      id: finalizer-cause
      prompt: A custom resource remains Terminating after its operator was removed. What is the likely cause?
      choices:
        - text: Its finalizer still needs the removed controller
          why: The cleanup obligation remains but the controller is absent. Recover cleanup using the operator’s
            documented procedure; do not strip finalizers by reflex.
        - text: OLM requires every namespace to stay forever
          why: OLM does not impose that rule. Namespace deletion waits for remaining content and cleanup obligations.
        - text: A second copy of the operator is still running
          why: OLM can show an informational copy of a CSV in other namespaces, but a copy deploys no controller.
      answer: 0
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can trace a Classic request from catalog and Subscription through plan, approval and CSV; match an
        OperatorGroup to supported scope; inspect permissions and requirements; and explain what retirement leaves behind.
        You can also recognize OLM v1 and its different removal behavior.

        Next, [Installing, updating and removing operators](/lesson/n.operators-lifecycle) turns this model into a
        procedure with review and cleanup checkpoints. The [OLM inspection lab](/lab/lab.olm-inspect) reads existing
        objects without installing another operator.
  sections:
    - id: olm-objects
      title: OLM Classic objects and modes
      depth: true
      body: |
        | Object | Scope and purpose |
        |---|---|
        | CatalogSource | namespaced source; catalogs in `openshift-marketplace` can serve the cluster |
        | PackageManifest | read-only packageserver view of packages, channels and install modes |
        | OperatorGroup | exactly one in the installing namespace; resolves target namespaces |
        | Subscription | namespaced package, catalog, channel and approval request |
        | InstallPlan | namespaced resolved resources and approval; Planning → RequiresApproval if manual → Installing → Complete or Failed |
        | CSV | installing namespace plus informational target copies; APIs, permissions, Deployments, phase and requirements |

        | CSV install mode | Group targets |
        |---|---|
        | OwnNamespace | installing namespace only |
        | SingleNamespace | one different namespace |
        | MultiNamespace | several namespaces; support is operator-specific and use is discouraged |
        | AllNamespaces | every namespace; `global-operators` in `openshift-operators` is an existing example |

        The group's resolved targets appear in `status.namespaces`. CSV annotations include `olm.operatorGroup` and
        `olm.targetNamespaces`. Copied CSVs advertise one installation in its targets; reason `Copied` does not mean
        another operator Deployment. OLM can generate API roles aggregated into the standard admin/edit/view roles;
        effective access still depends on role bindings and operator scope.

        Update graphs use `replaces`, skips and skip ranges. Channel names belong to each package: do not infer them
        from another package. `startingCSV` selects a starting version, not a permanent pin; combine it with Manual
        approval to review later plans.
    - id: when-an-install-is-stuck
      title: Installation and update diagnosis
      depth: true
      body: |
        | Evidence | Next check |
        |---|---|
        | No plan; ResolutionFailed | actual package and channel in PackageManifest; dependency constraints |
        | CatalogSourcesUnhealthy | CatalogSource connection status and catalog pod events |
        | RequiresApproval, approved false | resolved resources and new permissions before approval |
        | UnsupportedOperatorGroup | one group, resolved scope and supported CSV install modes |
        | Complete plan, unhealthy CSV | requirements, operator Deployment, pod admission, scheduling, image pulls and logs |
        | currentCSV differs from installedCSV | pending plan, approval and CSV phase; difference alone does not identify the cause |

        Subscription states include AtLatestKnown, UpgradeAvailable, UpgradePending and UpgradeFailed. During an
        update, the older CSV may enter Replacing and is removed after replacement succeeds. With no group or several
        groups, resolution may stop before any CSV exists; CSV reasons NoOperatorGroup and TooManyOperatorGroups are
        also possible when a CSV is present.

        For a persistently broken Subscription, the administrator documentation describes removing the Subscription,
        CSV and associated unpacking Job/ConfigMap before reinstalling. Inventory and preserve operands first; this
        is a recovery procedure, not the first response to an informative condition.
  review:
    - q: Which OLM object do you approve when an operator uses Manual approval?
      a: The InstallPlan.
    - q: Which object's phase tells you whether an operator install succeeded?
      a: The ClusterServiceVersion (CSV).
    - q: Which two APIs does OLM v1 use instead of Subscription, InstallPlan and OperatorGroup?
      a: ClusterCatalog (catalog content) and ClusterExtension (an installed extension).
    - q: What do currentCSV and installedCSV on a Subscription tell you?
      a: 'currentCSV: newest CSV known to OLM for the request; installedCSV: installed CSV. A difference signals
        pending or ongoing work; read the plan and CSV conditions to determine why.'
    - q: Name the four OLM Classic install modes.
      a: OwnNamespace, SingleNamespace, MultiNamespace, AllNamespaces.
    - q: What does OLM Classic leave behind when an operator is uninstalled?
      a: Its CRDs and any remaining custom resources, the namespace and OperatorGroup, and resources the operator
        created for its operands.
  limits: |
    The reads are real; the installation, approval, CSV and removal are documented examples. The lab node had 23% of
    its disk free when this was recorded, below the 25% the course requires before pulling an operator's images (below
    15% free, the kubelet's default threshold, it starts deleting unused images and then evicting pods). OLM v1 is not
    enabled on OpenShift Local.
  enterprise: |
    In regulated environments, operator updates usually go through change management: Manual approval, a
    review of the new CSV's permissions, and installation from a mirrored catalog in disconnected clusters.
  commands:
    - {cmd: "oc get catalogsources -n openshift-marketplace", as: admin, meaning: "the catalogs this cluster can install from"}
    - {cmd: "oc get certificates", expect: fail, meaning: "the developer: the Certificate kind does not exist"}
    - {cmd: "oc get packagemanifests -n openshift-marketplace | grep cert-manager", as: admin, meaning: "packages whose name contains cert-manager, and their catalog"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.defaultChannel}{\"\\n\"}'", as: admin, meaning: "the package's default channel"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[*]}{.name}{\"\\t\"}{.currentCSV}{\"\\n\"}{end}'", as: admin, meaning: "every channel and its newest CSV"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.installModes[*]}{.type}{\"=\"}{.supported}{\"\\n\"}{end}'", as: admin, meaning: "the install modes of the stable-v1 version"}
    - {cmd: "oc get subscriptions,installplans -A", as: admin, meaning: "no Subscription and no InstallPlan anywhere"}
    - {cmd: "oc get csv -A", as: admin, meaning: "the CSVs on the cluster"}
    - {cmd: "oc get operatorgroups -A", as: admin, meaning: "the existing OperatorGroups"}
    - {cmd: "oc get operatorgroup global-operators -n openshift-operators -o jsonpath='{.spec}{\"\\n\"}{.status.namespaces}{\"\\n\"}'", as: admin, meaning: "a global group's spec and resolved namespaces"}
    - {cmd: "oc get operatorgroup olm-operators -n openshift-operator-lifecycle-manager -o jsonpath='{.spec}{\"\\n\"}{.status.namespaces}{\"\\n\"}'", as: admin, meaning: "an own-namespace group's spec and resolved namespaces"}
    - {cmd: "oc explain subscription.spec.installPlanApproval", as: admin, meaning: "the API documentation of the approval field"}
    - {cmd: "oc get csv packageserver -n openshift-operator-lifecycle-manager -o jsonpath='{.status.phase}{\"  \"}{.status.reason}{\"  \"}{.status.message}{\"\\n\"}'", as: admin, meaning: "a CSV's phase, reason and message"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.customresourcedefinitions.owned[*]}{.name}{\"\\n\"}{end}'", as: admin, meaning: "the CRDs the current version would own"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.relatedImages[*]}{@}{\"\\n\"}{end}'", as: admin, meaning: "the images an installation would pull"}
    - {cmd: "oc get --raw /api/v1/nodes/crc/proxy/stats/summary | jq '.node.fs | {availableGiB: (.availableBytes / 1073741824 * 10 | floor / 10), freePercent: (.availableBytes * 100 / .capacityBytes | floor)}'", as: admin, meaning: "the node's free disk"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.annotations.operator\\.openshift\\.io/uninstall-message}{\"\\n\"}'", as: admin, meaning: "the package's own uninstall message"}
    - {cmd: "oc get clusterversion version -o jsonpath='{.status.capabilities.enabledCapabilities}{\"\\n\"}'", as: admin, meaning: "the enabled cluster capabilities"}
    - {cmd: "oc api-resources --api-group=olm.operatorframework.io", as: admin, meaning: "the OLM v1 API kinds served (none)"}
  references:
    - title: 'OpenShift 4.21: Understanding Operators (OLM Classic concepts, operator groups)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/operators/understanding-operators
    - title: 'OpenShift 4.21: Adding, updating and deleting Operators (administrator tasks)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/operators/administrator-tasks
    - title: 'OpenShift 4.21: Extensions (OLM v1) overview'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/extensions/extensions-overview
    - title: 'OpenShift 4.21: InstallPlan API reference'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/operatorhub_apis/installplan-operators-coreos-com-v1alpha1
    - title: 'Operator Framework API: CSV phases and reasons, Subscription states, InstallPlan phases'
      url: https://github.com/operator-framework/api/tree/master/pkg/operators/v1alpha1
    - title: 'OpenShift 4.21: Extensions (complete guide, lifecycle and removal)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/extensions/index
- id: n.operators-lifecycle
  title: Installing, updating and removing operators
  module: b6-operators-maintenance
  mode: GUIDED_INVESTIGATION
  minutes: 25
  level: 2
  supports: "OpenShift 4.21 OLM Classic and OLM v1. The package, channel, update-edge, API documentation and permission reads were run on OpenShift Local 4.21 by its cluster administrator (kubeadmin) and the ordinary user developer, and only read. Installation, channel changes, approval and removal are described from the official documentation and were not run: the lab node lacked the disk headroom the course requires before pulling an operator's images."
  concepts:
    - ocp.olm
    - k8s.crd-operator
  prerequisites:
    - c.olm
  record_on: cluster-admin
  labs:
    - lab.olm-inspect
  objective: |
    Plan and review the operator procedures an administrator runs (install with the right scope and approval, move to a
    new channel, remove an operator without leaving the cluster in an odd state) and say what changes with OLM v1. The
    procedures are documented examples, not run on the lab cluster; the objects behind each step are explained in
    [Operator Lifecycle Manager](/lesson/c.olm).
  flow:
    - kind: teach
      id: situation
      title: A reviewed installation, then a reviewed update
      body: |
        Two teams request operators that must update in different maintenance windows. The console installs
        operators that watch all namespaces into the shared `openshift-operators` namespace by default. You need an
        installation plan that fits each operator's supported scope and each team's update schedule.

        [Operator Lifecycle Manager](/lesson/c.olm) explained the objects. Here you use them as a procedure: choose scope,
        request a version stream, review the resolved plan, verify the controller, and retire it deliberately.
        The reads were run on a lab cluster, for one real package: the cert-manager Operator.
        The changes are documentation examples; [Operator Lifecycle Manager](/lesson/c.olm) showed why the lab node
        could not take the installation.
    - kind: ask
      id: guess-subscription-right
      guess: true
      prompt: "The developer is admin of their own project. May they create a Subscription, the request to install an operator, there?"
      choices:
        - text: "Yes: project admin and edit include it"
          why: "OpenShift aggregates Subscription rights into the project admin and edit roles. Whether anything installs is decided elsewhere, as the next checks show."
        - text: "No: only cluster administrators may do it"
          why: "Creating the request is open to project admins and editors. What they cannot do is create the OperatorGroup or approve the plan: that is where administrators keep control."
        - text: "Only once an administrator installed it"
          why: "No earlier installation is needed: the right comes from the aggregated project roles. Resolution then needs an OperatorGroup that an administrator prepared."
      answer: 0
    - kind: show
      id: who-installs
      body: "Who may install? The developer, admin of their own project, asks whether they may create a Subscription there:"
      run: "oc auth can-i create subscriptions.operators.coreos.com"
      notice: "`yes`, perhaps surprisingly: OpenShift aggregates Subscription rights into the project `admin` and `edit` roles."
    - kind: show
      id: who-installs-group
      body: "But a Subscription resolves only in a namespace with an OperatorGroup. May the developer create one in their project? Expect `no`; `oc auth can-i` then ends with exit status 1, which means no, not an error:"
      run: "oc auth can-i create operatorgroups.operators.coreos.com"
      notice: "`no`. The developer may read OperatorGroups but not create one, so a Subscription in a project without a group never resolves."
    - kind: show
      id: who-approves
      body: "May the developer approve an InstallPlan in their project? Expect `no` again, with exit status 1:"
      run: "oc auth can-i patch installplans.operators.coreos.com"
      notice: "`no` again: approving a plan, which installs cluster-wide APIs and permissions, is not part of a project role."
    - kind: show
      id: admin-installs
      body: "Now the identity changes to kubeadmin, the cluster administrator. It asks both questions in `openshift-operators`: may it create an OperatorGroup, and may it approve an InstallPlan?"
      run: "oc auth can-i create operatorgroups.operators.coreos.com -n openshift-operators; oc auth can-i patch installplans.operators.coreos.com -n openshift-operators"
      notice: "`yes` to both for kubeadmin, whose cluster-admin role covers every resource. Choosing the scope and approving the plan stay with cluster administrators."
    - kind: ask
      id: recall-shared-approval
      recalls: c.olm
      prompt: Two operators share a namespace. One Subscription uses Manual approval. What is the consequence?
      choices:
        - text: Only that Subscription’s updates require approval
          why: The namespace is the resolution group; Automatic and Manual do not remain independent there.
        - text: Their plans and approval policy are coupled
          why: OLM treats colocated operators as related. Review the whole namespace’s resolved plan, not only the
            operator that prompted the update.
        - text: The Manual operator stops being reconciled
          why: Manual pauses installation at approval. It does not stop the operator already running.
      answer: 1
    - kind: teach
      id: olm-grants
      title: "What an approval grants"
      body: |
        OLM itself runs with cluster-admin rights. When a plan is approved, it creates the package's CRDs and grants the
        operator every permission its CSV lists: `permissions` in each namespace the OperatorGroup targets, and
        `clusterPermissions` across the cluster. When the group targets all namespaces, OLM generates a ClusterRole
        and ClusterRoleBinding for each namespaced permission, so those reach every project too.

        Approving a plan is therefore a permission grant, as serious as writing a ClusterRoleBinding yourself, and it
        deserves the same review. An administrator can delegate installations by preparing an OperatorGroup that names
        a ServiceAccount; operators installed through it are confined to that account's permissions, although OLM
        still creates their CRDs with its own rights.
    - kind: ask
      id: allnamespaces-grant
      prompt: "An AllNamespaces operator's CSV asks to read Secrets. After you approve its plan, where can it read them?"
      choices:
        - text: "In every namespace of the cluster"
          why: "With a group that targets all namespaces, OLM turns the CSV's namespaced permissions into a ClusterRole and ClusterRoleBinding: the grant reaches every project, including projects created later."
        - text: "Only in openshift-operators, where it runs"
          why: "The installing namespace is where the operator's pod runs, not the limit of its permissions. The group's targets, here all namespaces, decide where they apply."
        - text: "Nowhere until each project admin agrees"
          why: "Project admins are not asked. OLM creates the bindings itself, with cluster-admin rights, once the plan is approved: the approval is the only review."
      answer: 0
    - kind: teach
      id: before-installing-scope-and
      title: Choose a namespace and compatible scope
      body: |
        Read the package's supported install modes before creating anything. A dedicated namespace can have a global
        OperatorGroup for an AllNamespaces operator, or a targeted group for a supported narrower scope. Dedicated
        namespace and narrow watch scope are different decisions.

        In the 4.21 console, start at **Ecosystem > Software Catalog** (called OperatorHub before 4.20). Classic installations then appear under
        **Ecosystem > Installed Operators**. Whether using the console or YAML, choose an actual package, source and
        channel from the catalog, and an explicit approval policy.
    - kind: show
      id: suggested-namespace
      body: "A package can suggest its namespace. The cert-manager Operator's CSV carries this annotation:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.annotations.operatorframework\\.io/suggested-namespace}{\"\\n\"}'"
      notice: "`cert-manager-operator`: the console offers to create that namespace, and the documented CLI procedure uses it. A dedicated namespace keeps its approval decisions separate from other operators'."
    - kind: show
      id: global-dedicated
      code: |
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: independent-global
          namespace: independent-operators
        spec: {}
      origin: example
      caption: 'OpenShift 4.21 documentation: Understanding Operators, colocation and Operator groups; illustrative
        manifest.'
      notice: |
        Assume independent-operators already exists and has no other OperatorGroup. Omitting both targetNamespaces and selector makes the scope global while keeping the installation in its own namespace.
    - kind: ask
      id: independent-scope
      prompt: An AllNamespaces operator needs independent approval. Which layout fits?
      choices:
        - text: Its own namespace and a global OperatorGroup
          why: The namespace separates resolution and approval; the global group supplies the supported watch scope.
        - text: Its own namespace and an own-namespace group
          why: Separating installation does not change the operator’s supported modes. This scope is incompatible.
        - text: A second OperatorGroup in openshift-operators
          why: Two groups in one installing namespace prevent a valid group selection rather than separating updates.
      answer: 0
    - kind: teach
      id: request
      title: Make the request reviewable
      body: |
        A Classic Subscription records the package, catalog, channel and approval policy. Keep it in reviewed YAML,
        together with the group's scope. Manual approval lets you inspect each resolved plan, including the first install.

        A channel change selects another published update path; it does not promise every version is reachable.
        Check the operator's release notes and compatibility guidance before moving streams.
    - kind: show
      id: channel-entries
      body: "The versions a channel holds, newest first. The `stable-v1` channel of the real package:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].entries[*]}{.name}{\"\\n\"}{end}'"
      notice: "Five versions, from 1.18.0 to 1.20.1. A Subscription to this channel can start at any of them with `startingCSV` and then follow the channel's update edges."
    - kind: ask
      id: guess-channel-ceiling
      guess: true
      prompt: "A Subscription follows the stable-v1.19 channel. Will OLM ever offer it version 1.20.1?"
      choices:
        - text: "No, unless you change its channel"
          why: "A Subscription follows only its channel's entries and update edges. Moving to the 1.20 line is a deliberate change of spec.channel."
        - text: "Yes, once 1.20.1 is newest in the catalog"
          why: "A catalog can publish newer versions in other channels; a Subscription never leaves its own channel by itself."
        - text: "Yes, if approval is set to Automatic"
          why: "Approval decides whether a resolved plan runs, not which versions the channel contains."
      answer: 0
    - kind: show
      id: channel-entries-minor
      body: "The `stable-v1.19` channel, for comparison:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1.19\")].entries[*]}{.name}{\"\\n\"}{end}'"
      notice: "It stops at 1.19.2, and it lists 1.19.1 and 1.19.2, which `stable-v1` skips. A Subscription on this channel never moves to 1.20: choosing the channel is choosing how far updates may go."
    - kind: show
      id: subscription
      code: |
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: example-operator
          namespace: independent-operators
        spec:
          name: example-operator
          source: custom-operators
          sourceNamespace: openshift-marketplace
          channel: stable-3.7
          installPlanApproval: Manual
      origin: example
      caption: 'OpenShift 4.21 documentation: Administrator tasks, installing Operators using the CLI; adapted manifest.'
      notice: |
        The package, catalog and channel names are placeholders. Take the real ones from the catalog's PackageManifest; the request fails to resolve if the catalog does not publish them.
    - kind: show
      id: read-and-approve
      code: |
        $ oc get subscription example-operator -n independent-operators -o yaml
        $ oc get installplan <resolved-plan> -n independent-operators -o yaml
        $ oc patch installplan <resolved-plan> -n independent-operators --type=merge -p '{"spec":{"approved":true}}'
        $ oc get csv -n independent-operators
      origin: example
      caption: 'OpenShift 4.21 documentation: Administrator tasks, approving pending Operator updates; described
        procedure only.'
      notice: |
        Replace the plan placeholder with the name in the Subscription's `status.installPlanRef`: that is the plan your
        request produced, and the only one to approve. Before the patch, review status.plan, bundled CSV permissions
        and CRDs. Afterwards, verify a Succeeded CSV and healthy operator pods.
    - kind: show
      id: installplan-fields
      body: "What an InstallPlan's spec holds, from the cluster's own API documentation:"
      run: "oc explain installplan.spec"
      notice: "`approval` copies the Subscription's policy, `clusterServiceVersionNames` lists the CSVs the plan installs, and `approved` is the one field an administrator changes. Nothing else in the plan is edited by hand."
    - kind: try
      id: review-plan
      body: You are authorized to read operator objects. In independent-operators, plan install-7x9ab exists. Type
        one command to retrieve its full YAML before approval.
      accept:
        - oc get installplan install-7x9ab -n independent-operators -o yaml
        - oc get installplan/install-7x9ab -n independent-operators -o yaml
        - oc get installplans install-7x9ab -n independent-operators -o yaml
        - oc -n independent-operators get installplan install-7x9ab -o yaml
        - oc get installplan install-7x9ab -o yaml -n independent-operators
        - oc get installplan install-7x9ab --namespace independent-operators --output yaml
        - oc get installplan install-7x9ab --namespace=independent-operators --output=yaml
        - oc get installplan install-7x9ab --namespace independent-operators -o yaml
        - oc get installplan install-7x9ab -o yaml --namespace independent-operators
        - oc --namespace independent-operators get installplan install-7x9ab -o yaml
        - oc get installplan install-7x9ab --namespace=independent-operators -o yaml
        - oc get installplan install-7x9ab -o yaml --namespace=independent-operators
        - oc --namespace=independent-operators get installplan install-7x9ab -o yaml
        - oc get installplan install-7x9ab -n independent-operators --output yaml
        - oc get installplan install-7x9ab -n independent-operators --output=yaml
        - oc get installplan install-7x9ab -n independent-operators -oyaml
        - oc get installplan/install-7x9ab -o yaml -n independent-operators
        - oc -n independent-operators get installplan/install-7x9ab -o yaml
        - oc get installplan/install-7x9ab --namespace independent-operators -o yaml
        - oc get installplan/install-7x9ab -o yaml --namespace independent-operators
        - oc --namespace independent-operators get installplan/install-7x9ab -o yaml
        - oc get installplan/install-7x9ab --namespace=independent-operators -o yaml
        - oc get installplan/install-7x9ab -o yaml --namespace=independent-operators
        - oc --namespace=independent-operators get installplan/install-7x9ab -o yaml
        - oc get installplan/install-7x9ab -n independent-operators --output yaml
        - oc get installplan/install-7x9ab -n independent-operators --output=yaml
        - oc get installplan/install-7x9ab -n independent-operators -oyaml
        - oc get installplans install-7x9ab -o yaml -n independent-operators
        - oc -n independent-operators get installplans install-7x9ab -o yaml
        - oc get installplans install-7x9ab --namespace independent-operators -o yaml
        - oc get installplans install-7x9ab -o yaml --namespace independent-operators
        - oc --namespace independent-operators get installplans install-7x9ab -o yaml
        - oc get installplans install-7x9ab --namespace=independent-operators -o yaml
        - oc get installplans install-7x9ab -o yaml --namespace=independent-operators
        - oc --namespace=independent-operators get installplans install-7x9ab -o yaml
        - oc get installplans install-7x9ab -n independent-operators --output yaml
        - oc get installplans install-7x9ab -n independent-operators --output=yaml
        - oc get installplans install-7x9ab -n independent-operators -oyaml
        - oc -n independent-operators get installplan install-7x9ab --output yaml
        - oc -n independent-operators get installplan install-7x9ab --output=yaml
        - oc -n independent-operators get installplan install-7x9ab -oyaml
        - oc get installplan install-7x9ab --output yaml -n independent-operators
        - oc get installplan install-7x9ab --output=yaml -n independent-operators
        - oc get installplan install-7x9ab -oyaml -n independent-operators
        - oc -n independent-operators -o yaml get installplan install-7x9ab
        - oc -o yaml -n independent-operators get installplan install-7x9ab
        - oc -o yaml get installplan install-7x9ab -n independent-operators
        - oc --namespace independent-operators --output yaml get installplan install-7x9ab
        - oc --output yaml --namespace independent-operators get installplan install-7x9ab
        - oc --namespace independent-operators get installplan install-7x9ab --output yaml
        - oc --output yaml get installplan install-7x9ab --namespace independent-operators
        - oc get installplan install-7x9ab --output yaml --namespace independent-operators
        - oc -n independent-operators -o yaml get installplan/install-7x9ab
        - oc -o yaml -n independent-operators get installplan/install-7x9ab
        - oc -o yaml get installplan/install-7x9ab -n independent-operators
        - oc --namespace independent-operators --output yaml get installplan/install-7x9ab
        - oc --output yaml --namespace independent-operators get installplan/install-7x9ab
        - oc --namespace independent-operators get installplan/install-7x9ab --output yaml
        - oc --output yaml get installplan/install-7x9ab --namespace independent-operators
        - oc get installplan/install-7x9ab --namespace independent-operators --output yaml
        - oc get installplan/install-7x9ab --output yaml --namespace independent-operators
        - oc --namespace=independent-operators --output=yaml get installplan/install-7x9ab
      hints:
        - match: "\\bget ip\\b"
          say: "On a cluster with Kubernetes 1.33 or later the short name ip also belongs to IPAddress (networking.k8s.io), which kubectl picks first, so it does not reach the InstallPlan. Spell out installplan."
        - match: ^oc patch
          say: Approval is a change. This task asks you to inspect the resolved content before approving it.
        - match: ^oc get.* -o json
          say: JSON contains the object too, but this task requests YAML for review.
        - match: ^oc get (csv|subscription)
          say: Those objects help locate the plan. This task names the plan whose resolved steps you must inspect.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n independent-operators the command looks for install-7x9ab in your current project. The plan is in independent-operators.
      hint: Use get on the named InstallPlan with the namespace and YAML output options.
      then: |
        The YAML would expose approval, phase and status.plan. Check every operator represented there and compare requested permissions with the installed version before authorizing the change.
    - kind: teach
      id: updates
      title: Move streams through the Subscription
      body: |
        To move an operator to a new supported stream, edit `spec.channel` in its Subscription. OLM resolves a path
        from the installed version using the new channel. With Manual approval, it waits for approval of the resulting plan.

        Do not edit the CSV's version or add a competing Subscription for the same package. Those actions do not
        declare the intended channel change. If resolution fails, inspect the Subscription's conditions and the
        package's available paths.
    - kind: show
      id: skip-range
      body: "How a version declares which versions it may replace: the `olm.skipRange` annotation of the channel head:"
      run: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.annotations.olm\\.skipRange}{\"\\n\"}'"
      notice: "`>=1.20.0 <1.20.1`: 1.20.1 may directly replace any installed 1.20.0. With Manual approval, that update would wait as a new InstallPlan until approved."
    - kind: show
      id: change-channel
      code: |
        $ oc patch subscription example-operator -n independent-operators --type=merge -p '{"spec":{"channel":"stable-3.8"}}'
        $ oc get subscription example-operator -n independent-operators -o yaml
        $ oc get installplans -n independent-operators
      origin: example
      caption: 'OpenShift 4.21 documentation: Administrator tasks, changing an Operator update channel; adapted
        example.'
      notice: |
        Assume this illustrative package supports an update from stable-3.7 to stable-3.8. The patch changes the request; it does not approve or prove completion of the resolved update.
    - kind: ask
      id: new-permissions
      prompt: The next plan includes a new ClusterRole. What belongs in the approval review?
      choices:
        - text: Whether today’s operator pods are healthy
          why: Current health describes the installed version, not what permissions or resources the update introduces.
        - text: 'Nothing new: the channel was approved already'
          why: A channel is an update stream, not a fixed grant. Each version in it can change permissions and
            behavior, which is what Manual approval lets you review.
        - text: The new permissions and all planned changes
          why: A version change can broaden access or change APIs. Compare the new bundle’s requirements with the
            installed one.
      answer: 2
    - kind: teach
      id: from-subscription-to-running
      title: Verify the result at both levels
      body: |
        A Complete InstallPlan means its resources were installed. A Succeeded CSV means the installation checks
        passed. Follow that with the operator's Deployment and pods, and then the operands' own status: a healthy
        controller does not prove every managed application is healthy.

        If there is no plan, inspect resolution and catalog health. If approval waits, review the plan. If a plan
        completed but the CSV reports `InstallCheckFailed`, inspect the operator's requirements, pod events and logs.
        The [OLM diagnosis table](/lesson/c.olm) is the map for these different stopping points.
    - kind: ask
      id: completed-plan-failed-csv
      prompt: The plan is Complete; the CSV reports InstallCheckFailed. What do you inspect next?
      choices:
        - text: The plan’s approval, to approve it again
          why: Complete means the plan passed approval and installation. Reapproving cannot repair an unhealthy
            controller.
        - text: The operator Deployment and pod events
          why: The resources exist, but runtime checks failed. Pod admission, image pulls, readiness or crashes
            can explain why.
        - text: The catalog source, for a broken bundle
          why: The catalog already supplied a plan that installed. A failed install check concerns the running
            operator, so it needs runtime evidence.
      answer: 1
    - kind: teach
      id: removing-an-operator-cleanly
      title: Retire operands while cleanup can still run
      body: |
        Start with the operator's backup and uninstall instructions. Inventory its custom resources and protect any
        data you need. If retiring the service, delete those operands while the operator runs, and wait for finalizers
        and external cleanup to finish.

        Capture the Subscription's `installedCSV` and `currentCSV` and inspect actual CSVs. During a pending update
        they can differ; blindly deleting only currentCSV can miss the running operator. Delete the Subscription and
        the installed CSV, and check any replacement CSVs left by an interrupted update.

        Classic leaves CRDs and remaining custom resources. Decide about them separately. Remove a dedicated namespace
        only after checking operand resources and retention needs; never delete the shared openshift-operators namespace.
    - kind: ask
      id: retire-first-step
      prompt: The service owner approves retiring a Classic operator whose custom resources hold a database. What do you do first?
      choices:
        - text: Delete the Subscription and the installed CSV
          why: That removes the controller. The custom resources then have no operator to run their finalizers, so cleanup stalls and resources can stay Terminating.
        - text: Inventory the custom resources and protect the data
          why: Retention and cleanup come before removal. Then delete the operands while the operator still runs, and only afterwards remove the Subscription and CSV.
        - text: Delete the CRDs so that the operator stops
          why: Deleting a CRD deletes every instance of that kind cluster-wide, including the data you may still need.
      answer: 1
    - kind: teach
      id: olm-v1-in-brief
      title: Check the lifecycle API before deleting
      body: |
        OLM v1 uses a ClusterExtension and an installation ServiceAccount you supply. Its allowed channel and version
        constraints drive automatic updates; there is no Classic InstallPlan approval step. Review changes to those
        constraints and monitor ClusterExtension conditions.

        Deleting the ClusterExtension removes resources it installed, including CRDs and all instances of those kinds.
        Back up or migrate retained custom resources before deletion and finish operand cleanup while the operator
        still runs. A Classic uninstall checklist cannot be copied unchanged to v1.

        In 4.21, use the supported CLI procedure. Single-namespace watching and parts of console integration are
        Technology Preview; the reference table summarizes the package restrictions.
    - kind: ask
      id: v1-delete
      prompt: A team wants to keep its custom resources while reinstalling an OLM v1 extension. What must come before
        deleting the ClusterExtension?
      choices:
        - text: Nothing; v1 retains the CRDs automatically
          why: That confuses Classic’s retention behavior with v1 removal.
        - text: Copying the CSV into another namespace
          why: A copied CSV only advertises a Classic installation. It cannot preserve the APIs or data removed with a ClusterExtension.
        - text: A documented backup or migration plan
          why: Deleting the ClusterExtension also removes its CRDs and their instances. Keeping them requires a
            deliberate preservation and restoration procedure.
      answer: 2
    - kind: reflect
      id: explain-removal
      prompt: Explain why deleting only a Subscription is not a complete Classic retirement, and why v1 needs a
        different data check.
      model: |
        The Subscription controls updates; removing it does not remove the installed CSV and operator. Classic leaves CRDs and remaining instances after operator removal. Deleting a v1 ClusterExtension removes its installed CRDs and their instances, so preserve needed data first in either procedure.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can choose compatible scope without coupling unrelated approval schedules, express a Classic request,
        review and approve its actual plan, move channels through the Subscription, verify the result, and plan removal
        around cleanup and data retention. You can recognise when the v1 procedure applies instead.

        To try an installation yourself, use a disposable cluster where you are the administrator, such as your own
        OpenShift Local with spare disk, never a shared or production cluster: an installation adds cluster-wide APIs and
        permissions, and a removal can delete data. Check the node's free disk first, as
        [Operator Lifecycle Manager](/lesson/c.olm) did.

        Next, [Jobs and CronJobs for administrative tasks](/lesson/o2.jobs-cronjobs) applies the same care to
        maintenance scripts that should finish and stop.
  sections:
    - id: lifecycle-reference
      title: Procedure checkpoints and v1 differences
      depth: true
      body: |
        | Checkpoint | What to establish |
        |---|---|
        | Before installation | actual package/channel, supported install modes, one matching OperatorGroup, compatible OpenShift version |
        | Before approval | all resources in the namespace’s plan, new CSV permissions, CRD changes and release notes |
        | After installation | plan Complete, CSV Succeeded, operator pods healthy, operands reconciled |
        | Before Classic removal | retention decision, operands cleaned, installed and pending CSVs identified |
        | Before reinstall | old controller and installation resources gone; remaining APIs and resources intentionally retained or removed |

        | Lifecycle detail | OLM Classic | OLM v1 in 4.21 |
        |---|---|---|
        | Source/request | CatalogSource/Subscription | ClusterCatalog/ClusterExtension |
        | Installation scope | supported CSV install modes plus OperatorGroup | normally all namespaces; a configured watch namespace is Technology Preview |
        | Approval | InstallPlan, Manual or Automatic, coupled within namespace | automatic reconciliation within allowed constraints; no Classic InstallPlan |
        | Installation identity | installation permissions arranged by Classic | ServiceAccount and installation permissions supplied by administrator |
        | Package format | Classic bundles and dependency resolution | supported `registry+v1` bundles without operator dependencies |
        | Removal | leaves CRDs and remaining instances | removes installed CRDs and instances |

        To select one starting Classic CSV, use `startingCSV` with Manual approval. This does not remove later updates
        from the channel; it prevents them being approved automatically. Operator streams must also remain compatible
        with planned OpenShift minor updates. Catalog mirroring and reviewed requests are common enterprise controls.
  review:
    - q: Where do you install an operator in the OpenShift 4.21 console?
      a: Ecosystem > Software Catalog (called OperatorHub before 4.20); the Installed Operators page then manages
        classic installations.
    - q: How do you move an installed operator to a newer channel?
      a: Change spec.channel on the Subscription after checking a supported update path. Review and approve the
        resolved InstallPlan when approval is Manual, then verify CSV and operand health.
    - q: What does an OLM v1 ClusterExtension need that OLM Classic did not ask for?
      a: A ServiceAccount you create, with the permissions to install and manage that operator's content.
    - q: What happens to CRDs when you delete an OLM Classic CSV, and when you delete an OLM v1 ClusterExtension?
      a: OLM Classic leaves the CRDs (and remaining custom resources); deleting a ClusterExtension deletes its CRDs.
  limits: |
    The reads are real; the installation, approval, channel change and removal are documented examples, not run. The
    lab node had 23% of its disk free, below the 25% the course requires before pulling an operator's images; below 15%
    free, the kubelet's default threshold, it starts reclaiming disk and, if that is not enough, evicting pods. OLM v1 is
    not enabled on OpenShift Local.
  enterprise: |
    Platform teams usually manage operator Subscriptions through GitOps with Manual approval in production, mirror the
    catalogs they allow (and only those) for disconnected clusters, and include operator channels in every cluster
    update plan.
  commands:
    - {cmd: "oc auth can-i create subscriptions.operators.coreos.com", meaning: "the developer may create a Subscription in their own project"}
    - {cmd: "oc auth can-i create operatorgroups.operators.coreos.com", expect: fail, meaning: "but not an OperatorGroup"}
    - {cmd: "oc auth can-i patch installplans.operators.coreos.com", expect: fail, meaning: "and may not approve an InstallPlan"}
    - {cmd: "oc auth can-i create operatorgroups.operators.coreos.com -n openshift-operators; oc auth can-i patch installplans.operators.coreos.com -n openshift-operators", as: admin, meaning: "the administrator may create OperatorGroups and approve InstallPlans"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.annotations.operatorframework\\.io/suggested-namespace}{\"\\n\"}'", as: admin, meaning: "the namespace the package suggests"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1\")].entries[*]}{.name}{\"\\n\"}{end}'", as: admin, meaning: "the versions in the stable-v1 channel"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{range .status.channels[?(@.name==\"stable-v1.19\")].entries[*]}{.name}{\"\\n\"}{end}'", as: admin, meaning: "the versions in the stable-v1.19 channel"}
    - {cmd: "oc explain installplan.spec", as: admin, meaning: "the fields of an InstallPlan's spec"}
    - {cmd: "oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace -o jsonpath='{.status.channels[?(@.name==\"stable-v1\")].currentCSVDesc.annotations.olm\\.skipRange}{\"\\n\"}'", as: admin, meaning: "the versions the channel head may replace"}
  references:
    - title: 'OpenShift 4.21: Adding Operators to a cluster'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/operators/administrator-tasks
    - title: 'OpenShift 4.21: Understanding OLM'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/operators/understanding-operators
    - title: 'OpenShift 4.21: Extensions (OLM v1): cluster extensions'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/extensions/cluster-extensions
    - title: 'OpenShift 4.21: Extensions (complete guide)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/extensions/index
- id: o2.jobs-cronjobs
  title: Jobs and CronJobs for administrative tasks
  module: b6-operators-maintenance
  mode: REAL_LAB
  minutes: 30
  level: 2
  supports: "OpenShift 4.21 / Kubernetes 1.34 batch/v1 Jobs and CronJobs. Every command was run on OpenShift Local 4.21 by the ordinary user developer, in a temporary project deleted afterwards; the manifests are the files in the practice directory. Pod names, durations and dates differ from run to run."
  concepts:
    - k8s.workloads
  prerequisites:
    - b.workloads
    - o2.service-accounts
    - o2.quotas-limits
  record_on: cluster
  labs:
    - lab.jobs-cronjobs
    - ch.bounded-cleanup
  objective: |
    Run one-off and scheduled work reliably, and control how long a failing Job keeps retrying.
  flow:
    - kind: teach
      id: situation
      title: The cleanup script must stop
      body: |
        [Choosing the right kind of workload](/lesson/b.workloads) ran a first Job and CronJob. Administrators use them
        for routine work that must finish: a nightly cleanup, a report, a check. A team's nightly cleanup script must
        finish, must not overlap itself, and must stop retrying if its input is permanently wrong. A Deployment would
        keep trying to run a service; this task has an end.

        A **Job** creates pods until its completion requirements are met or a failure limit ends it. A **CronJob**
        creates Jobs on a schedule. You will read a Job's verdict, bound its retries and runtime, and build the safety
        settings for a schedule. Everything was run for real on a lab cluster by the ordinary user `developer`, in
        the workstation shell, as admin of their own project only; nothing needs a cluster administrator.
    - kind: teach
      id: jobs-in-one-minute
      title: Completion belongs to a Job
      body: |
        For the default one-completion Job, a successful program exits with code 0 and the Job reaches Complete.
        The pod template must use `restartPolicy: Never` or `OnFailure`.

        With Never, a failed pod stays failed and the Job can create a replacement. With OnFailure, the kubelet can
        restart a failed container inside its pod. Finished pods and their logs can remain until cleanup removes them.

        The program must tolerate repetition. Even one completion and one pod at a time do not guarantee the program
        starts exactly once; design work to be **idempotent**, meaning another execution has the same intended effect.
    - kind: show
      id: hello
      run: "oc create job hello --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'echo computing; sleep 2; echo done'"
      notice: |
        `job.batch/hello created`: a finite program, in the current project. Creation is not yet proof that the program completed.
    - kind: ask
      id: created-versus-complete
      prompt: The API accepted a Job. What proves its work finished successfully?
      evidence: |
        job.batch/hello created
      choices:
        - text: 'The `created` message: the Job was accepted'
          why: Creation records intent. The controller still has to create a pod and the program still has to run.
        - text: A Running pod with no restarts so far
          why: Running means execution is ongoing; a finite task has not yet reported success.
        - text: Its Complete condition, then its logs and result
          why: Creation records intent. Completion reports the controller’s verdict, and application checks establish
            the useful result.
      answer: 2
    - kind: show
      id: hello-wait
      body: "`oc wait` blocks until the Job reports the Complete condition, or until its own timeout:"
      run: "oc wait --for=condition=Complete job/hello --timeout=180s"
      notice: "`condition met`. A wait timeout would end the client's wait, not the Job."
    - kind: show
      id: hello-verdict
      run: "oc get jobs"
      notice: |
        The row says Complete with one of one completions. Job conditions carry the verdict; duration and age are snapshot values.
    - kind: show
      id: hello-logs
      run: "oc logs job/hello"
      notice: |
        The program printed computing and done. For a real cleanup, also verify the intended data change; log text alone is not that check.
    - kind: show
      id: console-job
      body: "A completed Job in the web console (a demo `report-once`):"
      image:
        src: job.png
        alt: "The details of the Job report-once, status SuccessCriteriaMet, with its start and completion time, succeeded pods 1, active pods 0, failed pods 0 and desired completions 1."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "Workloads > Jobs > report-once"
      notice: "The console shows the condition *SuccessCriteriaMet*: the Job reached its success criteria. `Complete`, which `oc get job` printed above, is the terminal condition that follows it, so check `Complete` before relying on the result. One pod succeeded, none failed; the **Pods** tab keeps the finished pod and its logs."
    - kind: try
      id: read-cleanup-logs
      body: In project team-maintenance, the one-pod Job cleanup-check has completed and its pod remains. Type one
        command to read its logs through the Job.
      accept:
        - oc logs job/cleanup-check -n team-maintenance
        - oc logs jobs/cleanup-check -n team-maintenance
        - oc -n team-maintenance logs job/cleanup-check
        - oc logs -n team-maintenance job/cleanup-check
        - oc logs job/cleanup-check --namespace=team-maintenance
        - oc logs job/cleanup-check --namespace team-maintenance
        - oc --namespace team-maintenance logs job/cleanup-check
        - oc --namespace=team-maintenance logs job/cleanup-check
        - oc -n team-maintenance logs jobs/cleanup-check
        - oc logs jobs/cleanup-check --namespace team-maintenance
        - oc --namespace team-maintenance logs jobs/cleanup-check
        - oc logs jobs/cleanup-check --namespace=team-maintenance
        - oc --namespace=team-maintenance logs jobs/cleanup-check
        - oc logs --namespace team-maintenance job/cleanup-check
        - oc logs --namespace=team-maintenance job/cleanup-check
      hints:
        - match: ^oc logs cleanup-check
          say: That treats cleanup-check as a pod name. The task names a Job; qualify it as job/cleanup-check.
        - match: ^oc get logs
          say: Logs are retrieved with the logs verb, not an object kind named logs.
        - match: ^oc describe
          say: Describe shows controller and pod evidence. Read the program’s own output with logs.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n team-maintenance the command looks for the Job in your current project. cleanup-check is in team-maintenance.
      hint: Use the logs verb, job/name, and the explicit namespace.
      then: |
        The client would select the Job’s pod and read what the program printed. With several attempts, inspect the relevant failed pods as well; one selected pod does not explain every attempt.
    - kind: teach
      id: retries-and-when-to-stop
      title: Bound retries and total runtime separately
      body: |
        `backoffLimit` bounds failures and retries; it defaults to 6. Failed pods are retried with increasing backoff
        delays, 10, 20, 40 seconds and so on, capped at ten minutes since Kubernetes 1.28. The Kubernetes Jobs page and
        the Job controller's source for 1.34, the version OpenShift 4.21 runs (`MaxJobPodFailureBackOff`), agree on ten;
        the OpenShift 4.21 page on Jobs still gives the older six minutes. This is not a precise wall-clock timer.
        With OnFailure, container restarts in pending or running pods also count. Prefer Never while diagnosing failures
        so attempts are easier to inspect.

        `activeDeadlineSeconds` on the **Job spec** limits the Job's active duration, including retries. It takes
        precedence over the backoff limit and ends active pods. The same-named field inside the pod template limits
        that pod instead. A terminally failed Job does not restart itself; a rerun needs a new Job.
    - kind: show
      id: bounded-job
      code: |
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: bounded-check
        spec:
          backoffLimit: 2
          activeDeadlineSeconds: 120
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: check
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                command: ["sh", "-c", "echo checking; exit 1"]
                resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      caption: bounded-check.yaml in the practice directory
      notice: |
        Both limits belong to the Job spec. A real script may exhaust its failure budget first or reach its duration limit first; whichever applies ends the Job.
    - kind: show
      id: bounded-apply
      run: "oc apply -f bounded-check.yaml && oc wait --for=condition=Failed job/bounded-check --timeout=240s"
      notice: "Created, then `condition met` for Failed: the program always exits 1, so the Job failed."
    - kind: show
      id: flaky-recorded
      body: "Its pods, found by the label the Job controller puts on them:"
      run: "oc get pods -l batch.kubernetes.io/job-name=bounded-check"
      notice: |
        Three pods failed: the first try and two retries. The ages show the pause growing between attempts. Each retry
        is a new pod because `restartPolicy` is `Never`, so the failed pods stay for their logs.
    - kind: show
      id: flaky-reason
      run: "oc get job bounded-check -o jsonpath='{.status.conditions[?(@.type==\"Failed\")].reason}{\"\\n\"}'"
      notice: "`BackoffLimitExceeded`: the failure budget ran out long before the 120-second active deadline."
    - kind: ask
      id: deadline-versus-retries
      prompt: Each attempt hangs. backoffLimit is 6; the Job’s activeDeadlineSeconds is 120. Which limit bounds
        the run?
      choices:
        - text: The active deadline
          why: A running attempt need not fail to exhaust the Job’s active duration. The deadline terminates active
            work.
        - text: The seventh pod failure
          why: No failed attempts are described. Backoff cannot bound a program that never exits by itself.
        - text: The successful Job history limit
          why: History retention controls completed Jobs, not how long active work may continue.
      answer: 0
    - kind: show
      id: deadline-recorded
      body: "`deadline-check.yaml` runs `sleep 300` with `backoffLimit: 6` and `activeDeadlineSeconds: 15`. Its attempt never fails by itself:"
      run: "oc apply -f deadline-check.yaml && oc wait --for=condition=Failed job/deadline-check --timeout=180s && oc get job deadline-check -o jsonpath='{.status.conditions[?(@.type==\"Failed\")].reason}{\"  \"}{.status.conditions[?(@.type==\"Failed\")].message}{\"\\n\"}'"
      notice: "`DeadlineExceeded`, with the message `Job was active longer than specified deadline`: the Job's active deadline ended an attempt that would have slept for five minutes. The retry budget of six played no part."
    - kind: teach
      id: fail-fast
      title: Known permanent failures should end early
      body: |
        A **podFailurePolicy** matches failed pods against ordered rules. `FailJob` ends the Job for a permanent
        error, `Ignore` excludes an eligible failure from the retry count, and `Count` uses normal accounting.
        It requires `restartPolicy: Never`.

        A program can reserve an exit code for invalid input. Treating that code as FailJob avoids retrying work
        that cannot succeed unchanged. Another rule can ignore pods that the cluster itself evicted, which carry a
        `DisruptionTarget` condition, so that a node drain (moving pods off a node before maintenance, the subject of the
        next lesson) does not use up the retry budget.
        Rules operate on terminated pods, not on a pod creation rejected by admission.
    - kind: show
      id: failure-rule
      code: |
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: fail-fast
        spec:
          backoffLimit: 6
          podFailurePolicy:
            rules:
            - action: FailJob
              onExitCodes:
                containerName: check
                operator: In
                values: [42]
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: check
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                command: ["sh", "-c", "echo input is invalid; exit 42"]
                resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      caption: fail-fast.yaml in the practice directory
      notice: |
        The check container exits 42, so the rule matches. Other exit codes would follow later rules or normal failure accounting.
    - kind: show
      id: failure-verdict
      run: "oc apply -f fail-fast.yaml && oc wait --for=condition=Failed job/fail-fast --timeout=180s && oc get job fail-fast -o jsonpath='{.status.conditions[?(@.type==\"Failed\")].reason}{\"\\n\"}' && oc get pods -l batch.kubernetes.io/job-name=fail-fast"
      notice: |
        Reason `PodFailurePolicy`, and a single failed pod: six retries were allowed, none was used. The policy, not
        the exhaustion of the retry budget, explains the verdict.
    - kind: ask
      id: admission-rejection
      recalls: o2.quotas-limits
      prompt: A Job has no pods. Its FailedCreate event says exceeded quota. What is failing?
      choices:
        - text: The cleanup script after its third retry
          why: No pod exists to execute the script. Diagnose creation before looking for program logs.
        - text: Pod admission before any attempt can run
          why: The controller’s create request is rejected. Fix quota or requests; a rejected pod is not a failed
            execution counted by backoffLimit.
        - text: The pod’s readiness probe after completion
          why: A readiness probe cannot run before admission and pod creation.
      answer: 1
    - kind: teach
      id: cronjobs
      title: Make timing and overlap explicit
      body: |
        A CronJob has a five-field `schedule`: minute, hour, day of month, month, day of week. `timeZone` gives its
        named time zone; otherwise the controller manager's local time zone is used. Use the field, not TZ or CRON_TZ
        inside the schedule.

        `concurrencyPolicy: Forbid` prevents overlapping Jobs created by this same CronJob. Allow is the default;
        Replace stops an active scheduled Job in favor of a new one. Forbid does not coordinate other CronJobs or
        manually created Jobs, so the program still needs safeguards against duplicate work.
    - kind: teach
      id: identity
      title: Give the schedule its own, narrow identity
      body: |
        A scheduled script that calls the API should not borrow anyone's credentials. Give it a dedicated
        ServiceAccount and bind that account to a Role that allows exactly what the script needs, in its own project.
        A project admin can do this alone: no cluster administrator is needed for a namespaced grant.

        A task that needs rights in every project, such as removing old objects cluster-wide, needs a ClusterRole that a
        cluster administrator binds. Keep that CronJob in a project of its own where only administrators may create
        pods: anyone who can create pods in a project can run them as any of its ServiceAccounts, and so borrow their
        rights.
    - kind: show
      id: sa-create
      run: "oc create serviceaccount report-reader && oc create role pod-reader --verb=get,list --resource=pods && oc create rolebinding report-reader-pods --role=pod-reader --serviceaccount=\"$(oc project -q):report-reader\""
      notice: "A ServiceAccount, a Role that may only get and list pods, and a RoleBinding giving that Role to the account. `$(oc project -q)` supplies the project name the binding needs."
    - kind: show
      id: nightly-manifest
      code: |
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: nightly-report
        spec:
          schedule: "0 2 * * *"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 14400
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 1
          jobTemplate:
            spec:
              backoffLimit: 2
              activeDeadlineSeconds: 1800
              ttlSecondsAfterFinished: 86400
              template:
                spec:
                  serviceAccountName: report-reader
                  restartPolicy: Never
                  containers:
                  - name: report
                    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                    command:
                    - sh
                    - -c
                    - |
                      SA=/var/run/secrets/kubernetes.io/serviceaccount
                      for r in pods secrets; do
                        printf '%s: ' "$r"
                        curl -s -o /dev/null -w '%{http_code}\n' --cacert "$SA/ca.crt" \
                          -H "Authorization: Bearer $(cat "$SA/token")" \
                          "https://kubernetes.default.svc/api/v1/namespaces/$(cat "$SA/namespace")/$r"
                      done
                    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      caption: report-cron.yaml in the practice directory
      notice: |
        The script asks the API, with its own token, to list pods and then Secrets, and prints only the HTTP status
        codes. Schedule time is 02:00 UTC, late starts have a four-hour window, and each Job has a thirty-minute active limit.
    - kind: show
      id: cron-apply
      run: "oc apply -f report-cron.yaml && oc get cronjob nightly-report"
      notice: "The CronJob exists with its schedule and time zone. SUSPEND is False and LAST SCHEDULE is empty: it has not run yet, and would first run at 02:00 UTC."
    - kind: ask
      id: forbid-next-run
      prompt: An hourly CronJob uses Forbid. Its last Job is still active at the next scheduled time. What happens?
      choices:
        - text: The old Job is killed and replaced immediately
          why: That is Replace. Forbid leaves the active Job running.
        - text: A parallel Job starts with the new schedule
          why: That is Allow. It permits overlap when a run exceeds the interval.
        - text: No new scheduled Job starts then
          why: Forbid prevents overlap for Jobs from that CronJob. A missed start can later be considered within
            its starting deadline.
      answer: 2
    - kind: teach
      id: late-and-retained
      title: Separate missed starts, runtime and cleanup
      body: |
        `startingDeadlineSeconds` bounds how late a scheduled Job may start; it does not stop a running Job.
        A missed start outside that window is skipped. `suspend: true` stops future scheduling, not Jobs already running;
        suspended times count as missed starts. Resuming without a starting deadline can trigger missed work immediately.

        History limits retain finished Jobs: defaults are three successful and one failed. A Job's
        `ttlSecondsAfterFinished` can remove it and its pods after completion. Retention can remove the logs you hoped
        to inspect, so keep the results you need somewhere else.

        CronJob scheduling is approximate: starts can be missed or duplicated. Keep the program idempotent.
    - kind: show
      id: test-template
      body: "Testing the template now, without waiting for 02:00:"
      run: "oc create job report-now --from=cronjob/nightly-report && oc wait --for=condition=Complete job/report-now --timeout=180s"
      notice: |
        The Job was created from the CronJob's current template and ran at once, outside the schedule. A manually
        created Job is not protected from overlap by the CronJob's `Forbid` policy.
    - kind: show
      id: test-logs
      run: "oc logs job/report-now"
      notice: |
        `pods: 200`, `secrets: 403`. The ServiceAccount may list pods, as its Role allows, and is refused the Secrets
        it was never granted. The script's identity is exactly as wide as the binding.
    - kind: show
      id: test-copied
      body: "What the new Job copied from the template:"
      run: "oc get job report-now -o jsonpath='{.spec.template.spec.serviceAccountName}{\"  \"}{.spec.activeDeadlineSeconds}{\"\\n\"}'"
      notice: "The ServiceAccount and the thirty-minute active deadline (1800 seconds) came with the template. `--image` alone would have dropped both."
    - kind: try
      id: run-new-template
      body: In team-maintenance, CronJob weekly-audit exists with a revised template and no active work. Create
        Job audit-check from it now; do not alter its schedule.
      accept:
        - oc create job audit-check --from=cronjob/weekly-audit -n team-maintenance
        - oc create job audit-check -n team-maintenance --from=cronjob/weekly-audit
        - oc -n team-maintenance create job audit-check --from=cronjob/weekly-audit
        - oc create job audit-check --from cronjob/weekly-audit --namespace team-maintenance
        - oc create job audit-check --namespace=team-maintenance --from=cronjob/weekly-audit
        - oc create job audit-check --from=cronjobs/weekly-audit -n team-maintenance
        - oc create job audit-check --from=cronjob/weekly-audit --namespace team-maintenance
        - oc --namespace team-maintenance create job audit-check --from=cronjob/weekly-audit
        - oc create job audit-check --from=cronjob/weekly-audit --namespace=team-maintenance
        - oc --namespace=team-maintenance create job audit-check --from=cronjob/weekly-audit
        - oc create job audit-check --namespace team-maintenance --from=cronjob/weekly-audit
        - oc -n team-maintenance create job audit-check --from=cronjobs/weekly-audit
        - oc create job audit-check --from=cronjobs/weekly-audit --namespace team-maintenance
        - oc --namespace team-maintenance create job audit-check --from=cronjobs/weekly-audit
        - oc create job audit-check --from=cronjobs/weekly-audit --namespace=team-maintenance
        - oc --namespace=team-maintenance create job audit-check --from=cronjobs/weekly-audit
        - oc create job audit-check --from=cj/weekly-audit -n team-maintenance
        - oc -n team-maintenance create job audit-check --from=cj/weekly-audit
        - oc create job audit-check --from=cj/weekly-audit --namespace team-maintenance
        - oc --namespace team-maintenance create job audit-check --from=cj/weekly-audit
        - oc create job audit-check --from=cj/weekly-audit --namespace=team-maintenance
        - oc create job audit-check --from cronjob/weekly-audit -n team-maintenance
        - oc create job audit-check -n team-maintenance --from cronjob/weekly-audit
        - oc -n team-maintenance create job audit-check --from cronjob/weekly-audit
        - oc create job audit-check --namespace team-maintenance --from cronjob/weekly-audit
        - oc --namespace team-maintenance create job audit-check --from cronjob/weekly-audit
        - oc create job audit-check --from cronjob/weekly-audit --namespace=team-maintenance
        - oc create job audit-check --from cj/weekly-audit -n team-maintenance
        - oc create job audit-check -n team-maintenance --from cj/weekly-audit
        - oc -n team-maintenance create job audit-check --from cj/weekly-audit
        - oc create job audit-check --from cj/weekly-audit --namespace team-maintenance
        - oc create job audit-check --namespace team-maintenance --from cj/weekly-audit
        - oc --namespace team-maintenance create job audit-check --from cj/weekly-audit
        - oc create job audit-check --from cj/weekly-audit --namespace=team-maintenance
      hints:
        - match: ^oc create cronjob
          say: The schedule already exists. Create a one-off Job from its current template.
        - match: ^oc create job.*--image
          say: An image alone would omit the CronJob’s limits, identity and other template settings. Copy the template
            with --from.
        - match: ^oc (patch|edit)
          say: Changing the schedule is unnecessary. The create job command can use an existing CronJob as its source.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n team-maintenance the new Job is created in your current project, away from the CronJob weekly-audit.
      hint: Use create job, a fresh Job name, --from=cronjob/name, and the namespace.
      then: |
        A new Job would copy the current template. Editing the CronJob never rewrites Jobs it already created. Read the test Job’s conditions and logs, and verify its intended result before trusting the schedule.
    - kind: show
      id: console-cronjob
      body: "A CronJob in the web console (a demo `nightly-report`, scheduled for 02:00):"
      image:
        src: cronjob.png
        alt: "The details of the CronJob nightly-report: schedule 0 2 * * *, suspend False, concurrency policy Allow, with tabs Details, YAML, Pods, Jobs and Events."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "Workloads > CronJobs > nightly-report"
      notice: "The schedule, whether it is suspended, and its concurrency policy, here the default *Allow*, which lets runs overlap: the setting this lesson changes to `Forbid`. The **Jobs** tab lists the Jobs it has created."
    - kind: ask
      id: job-logs-parallel
      prompt: A Job runs three pods in parallel. What does `oc logs job/<name>` show?
      choices:
      - text: The logs of one of its pods
        why: "`job/<name>` resolves to one of the Job's pods. Add `--all-pods`, or select them with `-l job-name=<name>`, to read all three."
      - text: The three pods' logs, merged
        why: "Only with `--all-pods` or a label selector such as `-l job-name=<name>`; a plain `job/<name>` picks one pod."
      - text: 'An error: Jobs have no logs'
        why: The command works, but it picks one pod.
      answer: 0
    - kind: reflect
      id: explain-automation
      prompt: Your colleague says Forbid and backoffLimit make a cleanup script safe. What still needs checking?
      model: |
        Forbid covers only scheduled Jobs from that CronJob, and retries do not bound a hung attempt. Add a Job active deadline, an explicit time zone and late-start policy, a dedicated least-privilege ServiceAccount, retention and monitoring. Make the script safe to repeat and test its current template once.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can choose finite work instead of a service controller, read a Job's verdict and logs, bound retries and
        active duration, stop known permanent failures, and separate CronJob timing, overlap and cleanup settings.
        You can test a revised template without changing the schedule.

        [The Jobs lab](/lab/lab.jobs-cronjobs) lets you practise the same checks, and
        [Automate a cleanup safely](/lab/ch.bounded-cleanup) asks you to build an administrative CronJob with exactly
        the rights it needs, on your own. Next,
        [Machine configuration, MachineConfigPools and upgrades](/lesson/c.machineconfig-upgrades) covers configuration
        changes that roll across the cluster's nodes and must let workloads move safely.
  sections:
    - id: job-reference
      title: Job verdicts, retries and cleanup
      depth: true
      body: |
        | Concern | Field or evidence |
        |---|---|
        | Multiple independent completions | `completions`, `parallelism`; optionally `completionMode: Indexed` |
        | Failed attempt accounting | failed pods; OnFailure container restarts in Pending/Running pods also count |
        | Exhausted failure budget | Failed reason BackoffLimitExceeded |
        | Active-duration limit | Job-level activeDeadlineSeconds; Failed reason DeadlineExceeded |
        | Permanent-error policy | podFailurePolicy, restartPolicy Never; Failed reason PodFailurePolicy |
        | Pod creation rejected | FailedCreate events: quota, LimitRange, SCC, ServiceAccount; no program logs yet |
        | Locate pods | label `batch.kubernetes.io/job-name`; older `job-name` is also used in the existing lab |
        | Automatic removal | ttlSecondsAfterFinished deletes a finished Job and dependent pods |

        In Kubernetes 1.34, terminal Complete/Failed conditions normally wait for all Job pods to terminate;
        SuccessCriteriaMet or FailureTarget can announce the decision earlier. With Never, the existing lab's flaky Job
        (backoffLimit 2) left three Error pods and BackoffLimitExceeded; fail-fast left one Error pod and PodFailurePolicy.
        These are observed outcomes, not an exact timing guarantee. OnFailure restarts complicate debugging and the pod
        can be terminated after retry exhaustion; use Never and retain attempts while investigating.
    - id: cron-reference
      title: CronJob limits and diagnosis
      depth: true
      body: |
        | Field | Purpose |
        |---|---|
        | schedule, timeZone | explicit scheduled time; five cron fields or macros such as @hourly |
        | concurrencyPolicy | Allow overlaps, Forbid skips while active, Replace replaces; same CronJob only |
        | startingDeadlineSeconds | late-start window and lookback for missed schedules |
        | jobTemplate.spec.activeDeadlineSeconds | bounds each Job’s active duration |
        | suspend | stops new scheduled Jobs; does not terminate existing ones |
        | successfulJobsHistoryLimit, failedJobsHistoryLimit | finished history counts; defaults 3 and 1 |
        | serviceAccountName in pod template | dedicated identity; grant only the API rights the script needs |

        The controller checks about every ten seconds; a starting deadline below ten seconds can miss scheduling.
        More than 100 missed schedules in the relevant lookback prevents catch-up for that reconciliation; a starting
        deadline bounds that lookback. Forbid skips can count as missed starts. Editing a CronJob affects future Jobs,
        not existing ones. Keep CronJob names at most 52 characters so the appended Job suffix fits.

        | Symptom | First evidence |
        |---|---|
        | No pod | Job events and admission refusal |
        | Repeated program failure | failed pod logs and Job reason |
        | No scheduled Job | suspension, schedule/timeZone, last schedule, deadline and missed starts |
        | Unexpected overlaps | policy, run duration, and whether another CronJob or manual Job owns the work |
        | Old Jobs accumulate | history settings or manually created Jobs without TTL |
        | Logs disappeared | TTL/history cleanup or restart behavior; use retained attempts and external log collection |
  review:
    - q: What does backoffLimit count?
      a: The Job counts failed pods and, with restartPolicy OnFailure, container restarts in pending/running pods.
        Exhaustion fails it with BackoffLimitExceeded; activeDeadlineSeconds can stop it earlier.
    - q: Which CronJob setting prevents two runs overlapping?
      a: 'concurrencyPolicy: Forbid prevents overlap among Jobs created by that same CronJob. It does not coordinate
        manually created Jobs or other CronJobs.'
    - q: Which restartPolicy does a podFailurePolicy require?
      a: Never.
    - q: Where do you read a Job's final verdict?
      a: 'In .status.conditions: type Complete, or type Failed with a reason (BackoffLimitExceeded, DeadlineExceeded,
        PodFailurePolicy).'
    - q: What does startingDeadlineSeconds do on a CronJob?
      a: A run that cannot start within that many seconds of its scheduled time is skipped; it also bounds how far
        back missed schedules are counted.
  files:
    bounded-check.yaml: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: bounded-check
      spec:
        backoffLimit: 2
        activeDeadlineSeconds: 120
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: check
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "echo checking; exit 1"]
              resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
    fail-fast.yaml: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: fail-fast
      spec:
        backoffLimit: 6
        podFailurePolicy:
          rules:
          - action: FailJob
            onExitCodes:
              containerName: check
              operator: In
              values: [42]
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: check
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "echo input is invalid; exit 42"]
              resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
    report-cron.yaml: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: nightly-report
      spec:
        schedule: "0 2 * * *"
        timeZone: Etc/UTC
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 14400
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 1
        jobTemplate:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 1800
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                serviceAccountName: report-reader
                restartPolicy: Never
                containers:
                - name: report
                  image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                  command:
                  - sh
                  - -c
                  - |
                    SA=/var/run/secrets/kubernetes.io/serviceaccount
                    for r in pods secrets; do
                      printf '%s: ' "$r"
                      curl -s -o /dev/null -w '%{http_code}\n' --cacert "$SA/ca.crt" \
                        -H "Authorization: Bearer $(cat "$SA/token")" \
                        "https://kubernetes.default.svc/api/v1/namespaces/$(cat "$SA/namespace")/$r"
                    done
                  resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
    deadline-check.yaml: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: deadline-check
      spec:
        backoffLimit: 6
        activeDeadlineSeconds: 15
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: check
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "echo working; sleep 300"]
              resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
  commands:
    - {cmd: "oc create job hello --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'echo computing; sleep 2; echo done'", meaning: "create a one-off Job from an image and a command"}
    - {cmd: "oc wait --for=condition=Complete job/hello --timeout=180s", meaning: "wait for the Complete condition"}
    - {cmd: "oc get jobs", meaning: "the Job's status"}
    - {cmd: "oc logs job/hello", meaning: "what the program printed"}
    - {cmd: "oc apply -f bounded-check.yaml && oc wait --for=condition=Failed job/bounded-check --timeout=240s", timeout: 300, meaning: "create the bounded Job and wait until it fails"}
    - {cmd: "oc get pods -l batch.kubernetes.io/job-name=bounded-check", meaning: "its pods"}
    - {cmd: "oc get job bounded-check -o jsonpath='{.status.conditions[?(@.type==\"Failed\")].reason}{\"\\n\"}'", meaning: "the reason of its Failed condition"}
    - {cmd: "oc apply -f deadline-check.yaml && oc wait --for=condition=Failed job/deadline-check --timeout=180s && oc get job deadline-check -o jsonpath='{.status.conditions[?(@.type==\"Failed\")].reason}{\"  \"}{.status.conditions[?(@.type==\"Failed\")].message}{\"\\n\"}'", timeout: 240, meaning: "a Job whose attempt hangs, stopped by its active deadline"}
    - {cmd: "oc apply -f fail-fast.yaml && oc wait --for=condition=Failed job/fail-fast --timeout=180s && oc get job fail-fast -o jsonpath='{.status.conditions[?(@.type==\"Failed\")].reason}{\"\\n\"}' && oc get pods -l batch.kubernetes.io/job-name=fail-fast", timeout: 240, meaning: "a Job whose permanent failure ends it at once"}
    - {cmd: "oc create serviceaccount report-reader && oc create role pod-reader --verb=get,list --resource=pods && oc create rolebinding report-reader-pods --role=pod-reader --serviceaccount=\"$(oc project -q):report-reader\"", meaning: "a ServiceAccount with a namespaced Role and RoleBinding"}
    - {cmd: "oc apply -f report-cron.yaml && oc get cronjob nightly-report", meaning: "create the CronJob and read it"}
    - {cmd: "oc create job report-now --from=cronjob/nightly-report && oc wait --for=condition=Complete job/report-now --timeout=180s", timeout: 240, meaning: "run the CronJob's template now"}
    - {cmd: "oc logs job/report-now", meaning: "what the test run printed"}
    - {cmd: "oc get job report-now -o jsonpath='{.spec.template.spec.serviceAccountName}{\"  \"}{.spec.activeDeadlineSeconds}{\"\\n\"}'", meaning: "what the Job copied from the template"}
  references:
    - title: 'Kubernetes: Jobs'
      url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
    - title: 'Kubernetes: Handling retriable and non-retriable pod failures'
      url: https://kubernetes.io/docs/tasks/job/pod-failure-policy/
    - title: 'Kubernetes: CronJob'
      url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
    - title: 'Kubernetes: Automatic clean-up of finished Jobs (TTL)'
      url: https://kubernetes.io/docs/concepts/workloads/controllers/ttlafterfinished/
    - title: 'Kubernetes 1.34 source: Job controller back-off constants'
      url: https://github.com/kubernetes/kubernetes/blob/release-1.34/pkg/controller/job/job_controller.go
    - title: 'OpenShift 4.21: Setting the maximum number of retries for a Job (still gives six minutes)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/nodes/index#jobs-set-backoff_nodes-nodes-jobs
    - title: 'OpenShift 4.21: OpenShift CLI (oc)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc
- id: c.machineconfig-upgrades
  title: Machine configuration, MachineConfigPools and upgrades
  module: b6-operators-maintenance
  mode: ENTERPRISE_ARCHITECTURE
  minutes: 30
  level: 2
  supports: "OpenShift 4.21 Machine Config Operator and Kubernetes 1.34 disruption budgets. Every command was run on OpenShift Local 4.21 by its cluster administrator (kubeadmin), and every one of them only reads: no MachineConfig, pool or node is changed. Drains, reboots and multi-node rollouts are described from the documentation, because the only node of OpenShift Local cannot be drained or rebooted without a full outage."
  concepts:
    - ocp.mco
    - ocp.upgrades
  prerequisites:
    - c.openshift-extends
  record_on: cluster-admin
  labs:
    - lab.cluster-health
  objective: |
    Explain how OpenShift configures nodes declaratively, how a cluster upgrade rolls through control
    plane and worker pools, and read a MachineConfigPool to tell an update in progress from one that is stuck.
  flow:
    - kind: teach
      id: situation
      title: One worker will not finish maintenance
      body: |
        A cluster update has moved the control plane forward, but one worker remains unavailable for scheduling.
        Rebooting it by hand would skip the workload evacuation you need to understand.

        OpenShift manages node configuration declaratively too. This lesson follows configuration from an input
        MachineConfig to a pool and a node, then reads where rollout progress stops. What you see run was read by the
        administrator of a lab cluster (OpenShift Local 4.21, a single node); nothing here changes it. The multi-node
        maintenance steps are described from the documentation.
    - kind: teach
      id: nodes-are-configured-like
      title: Configuration is an input, not an SSH edit
      body: |
        **Red Hat Enterprise Linux CoreOS (RHCOS)** is the image-based operating system on these nodes. You do not
        configure it by editing files over SSH. A **MachineConfig** declares supported node configuration, such as
        files, systemd units and kernel arguments, as an object in the API.

        This extends the input and output distinction from [A platform run by operators](/lesson/c.openshift-extends):
        change the supported source configuration, then let its controller reconcile it.
    - kind: teach
      id: pools-and-daemons
      title: Pools merge configuration, daemons apply it
      body: |
        A **MachineConfigPool (MCP)** selects a group of nodes and the MachineConfigs that apply to them, and merges
        those into one generated configuration, called the **rendered** configuration.

        The **Machine Config Operator (MCO)** coordinates this. A **Machine Config Daemon (MCD)** on each node applies
        the rendered configuration and checks managed files for drift. A manual change to a managed file can make the
        node degraded and unable to update, even while it keeps running workloads.
    - kind: show
      id: mco-report
      body: "The MCO reports through a ClusterOperator like every platform component:"
      run: "oc get clusteroperator machine-config"
      notice: "Version 4.21.8: the operator is available, not progressing and not degraded. That is the operator's own health report; SINCE dates only the last change of Available. Whether every node has its configuration shows in the pools, read below."
    - kind: show
      id: read-inputs
      body: "The MachineConfigs of the lab cluster:"
      run: "oc get machineconfigs"
      notice: |
        Two families. Every name that does not start with `rendered-` is an input. Those with a GENERATEDBYCONTROLLER
        hash were written by OpenShift's own controllers; the others, such as `99-master-ssh`, `99-node-sizing-for-crc`
        and `custom-image`, were created directly. Names starting with `rendered-` are outputs: three for master and two
        for worker, the ones in use and older ones kept from earlier changes.
    - kind: show
      id: mc-labels
      body: "One input, `99-node-sizing-for-crc`: which pool it targets, and the file it writes."
      run: "oc get mc 99-node-sizing-for-crc -o jsonpath='{.metadata.labels}{\"\\n\"}{.spec.config.storage.files[0].path}{\"\\n\"}'"
      notice: "The role label `master` selects the master pool. The configuration is a file, `/etc/node-sizing-enabled.env`."
    - kind: show
      id: mc-file
      body: "The file's content is stored as a `data:` URL in base64. Everything after the comma, decoded:"
      run: "oc get mc 99-node-sizing-for-crc -o jsonpath='{.spec.config.storage.files[0].contents.source}' | cut -d, -f2 | base64 -d"
      notice: |
        Four settings, among them `SYSTEM_RESERVED_MEMORY=350Mi`: the memory the kubelet keeps for the operating
        system. It is the main reason the node's Allocatable memory is smaller than its Capacity; the kubelet's
        memory eviction threshold (100Mi by default) takes the rest. A node setting arrived through
        an API object, not through a login on the node.
    - kind: ask
      id: ssh-drift
      prompt: A worker still serves applications after a managed file was edited through SSH. Can that node still
        need repair?
      choices:
        - text: No; running workloads prove the file is accepted
          why: Serving applications does not mean on-disk configuration matches the rendered source.
        - text: Yes; drift can block its next update
          why: Degraded configuration is an update problem even if existing workloads still run. Restore the managed
            state and use a MachineConfig for intentional changes.
        - text: No; SSH edits automatically become MachineConfigs
          why: Configuration flows from the API to nodes. The daemon does not turn manual edits into source objects.
      answer: 1
    - kind: teach
      id: reading-pools-and-nodes
      title: Read the target and the counts
      body: |
        An MCP's `CONFIG` column shows the rendered configuration the pool has reached (`.status.configuration`); the
        one it is moving to is `.spec.configuration`. `UPDATED=True` means the pool is at its expected
        configuration; `UPDATING=True` means it is converging; `DEGRADED=True` means there is a persistent problem
        rendering or applying configuration.

        Compare `UPDATEDMACHINECOUNT` and `READYMACHINECOUNT` with `MACHINECOUNT`, and inspect any degraded count.
        A pool with zero nodes can report Updated without proving that any worker node was tested.
    - kind: show
      id: pool-table
      run: "oc get mcp"
      notice: |
        The master pool has one machine, ready and updated. The worker pool has zero machines. Both show Updated True, Updating False and Degraded False; the only node is managed through the master pool.
    - kind: show
      id: pool-sources
      body: "The master pool's target, followed by the inputs it merged into it:"
      run: "oc get mcp master -o jsonpath='{.spec.configuration.name}{\"\\n\"}{range .spec.configuration.source[*]}{.name}{\"\\n\"}{end}'"
      notice: "The rendered name is the pool's CONFIG column. Below it, every MachineConfig with the master role label, including `99-node-sizing-for-crc`. Changing one input produces a new rendered configuration."
    - kind: show
      id: pool-conditions
      run: "oc get mcp master -o jsonpath='{range .status.conditions[*]}{.type}{\"=\"}{.status}{\"  \"}{.message}{\"\\n\"}{end}'"
      notice: "Besides Updated, Updating and Degraded, the pool separates `RenderDegraded` (the merge failed) from `NodeDegraded` (a node could not apply it). The Updated message names the rendered configuration every node runs."
    - kind: try
      id: inspect-worker
      body: On another cluster, where you may read machine configuration, `oc get mcp` lists a custom pool `infra`
        with `DEGRADED` True. Type one command that shows that pool’s sources, conditions and messages.
      accept:
        - oc describe mcp infra
        - oc describe mcp/infra
        - oc get mcp infra -o yaml
        - oc get mcp/infra -o yaml
        - oc get mcp infra -o json
        - oc get mcp/infra -o json
      hints:
        - match: (mcp|machineconfigpools?)[ /](worker|master)$
          say: The pool that reports `DEGRADED` True here is the custom one, `infra`. Describe that pool by its name.
        - match: ^oc describe node
          say: A node report helps later. Start with the pool, which names source configuration and pool-level conditions.
        - match: ^oc describe.* -n
          say: MachineConfigPool is cluster-scoped; no application namespace is needed.
        - match: ^oc get
          say: A table or a single field leaves out the sources and messages. Use describe, or the whole object with -o yaml or -o json.
      hint: Describe the MachineConfigPool (mcp) named infra.
      then: |
        The report would identify source MachineConfigs, target configuration, counts and failure messages. These are inspection instructions; nothing changes on a node.
    - kind: teach
      id: node-progress
      title: Find which node is behind
      body: |
        A node's annotations include `machineconfiguration.openshift.io/currentConfig` and `desiredConfig`.
        Different names mean convergence is pending or in progress; they do not by themselves tell you why it is delayed.
        The daemon's `state` and `reason` annotations supply more evidence.

        In 4.21, MachineConfigNode objects provide per-node progress too. Use those phases and messages, the node
        state, and the daemon's logs to distinguish a pending node, a blocked drain and configuration drift.
    - kind: show
      id: node-evidence
      body: "The node's own record, from its annotations:"
      run: "oc describe node crc | grep machineconfiguration.openshift.io/"
      notice: |
        `currentConfig` and `desiredConfig` name the same rendered configuration and `state` is `Done`: nothing is
        pending. The drain annotations record that the last request was `uncordon-…`, so the node is not cordoned.
        During a rollout, desiredConfig changes first, state becomes `Working`, and a drain is requested.
    - kind: show
      id: node-mcn
      run: "oc get machineconfignodes"
      notice: "The same facts as a per-node object: pool, desired and current configuration, and UPDATED. On a larger cluster, this is the quickest way to find the node that is behind."
    - kind: ask
      id: pending-config
      prompt: A node’s currentConfig and desiredConfig differ, but it is not degraded. What can you conclude?
      choices:
        - text: Its on-disk files have definitely drifted
          why: Different config names are expected during rollout; drift needs evidence such as a content mismatch.
        - text: It already completed the new configuration
          why: Completion requires convergence to the target and readiness, not merely a desired name.
        - text: It has not reached the desired config yet
          why: It may be waiting or updating normally. Progress phases and messages explain which.
      answer: 2
    - kind: teach
      id: rollout
      title: Move workloads before disruptive changes
      body: |
        For a change that requires a reboot, the MCO normally **cordons** a node, **drains** it, applies the
        configuration, reboots and **uncordons** it. Cordon prevents new scheduling; drain requests eviction of the
        workload pods; uncordon permits scheduling again.

        Evacuating first is the point: the workloads move to other nodes while the node is down. This describes
        multi-node maintenance, not a procedure to drain OpenShift Local's only node.
    - kind: teach
      id: rollout-limits
      title: Limit how many nodes change at once
      body: |
        Each pool limits unavailable nodes with `maxUnavailable`, default 1. Different pools can progress independently
        and in parallel; this is not a global one-node limit. Keep control-plane maintenance conservative.

        Some changes need less disruption. SSH-key and global-pull-secret changes do not normally drain or reboot;
        some registry changes avoid a reboot. Supported node disruption policies can customize certain actions.
        Use the policy for the actual change rather than assuming every MachineConfig restarts every node.
    - kind: show
      id: pool-limits
      run: "oc get mcp -o custom-columns=NAME:.metadata.name,PAUSED:.spec.paused,MAXUNAVAILABLE:.spec.maxUnavailable"
      notice: "Neither pool is paused, and neither sets maxUnavailable, so the default of one node at a time applies."
    - kind: show
      id: disruption-policies
      body: "The disruption the MCO applies for changes to certain files, read from its cluster configuration (`jq -c` prints one policy per line):"
      run: "oc get machineconfiguration cluster -o jsonpath='{.status.nodeDisruptionPolicyStatus.clusterPolicies.files}' | jq -c '.[]'"
      notice: |
        Each path has an action. `None` applies the file with no restart, `Reload` reloads a service (here CRI-O),
        `Restart` restarts services, and `Special` has built-in handling. A file that matches no policy gets the
        default: drain and reboot.
    - kind: teach
      id: budgets
      title: A drain needs permission to disrupt
      body: |
        A **PodDisruptionBudget (PDB)** sets a minimum available or maximum unavailable count for selected application
        pods during voluntary disruptions. The eviction API used by drains respects it.

        One replica with `minAvailable: 1` permits no eviction while that pod is healthy. The MCO cannot finish that
        drain without a workload or budget change. Add capacity and ready replicas where appropriate, or agree an
        allowed disruption with the service owner. A PDB does not create spare capacity or move a pod without interruption.
    - kind: show
      id: blocked-budget
      code: |
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: payments
          namespace: payments
        spec:
          minAvailable: 1
          selector:
            matchLabels:
              app: payments
      origin: example
      caption: 'Kubernetes documentation: Disruptions and PodDisruptionBudgets; illustrative manifest.'
      notice: |
        Assume the matching Deployment has exactly one ready replica. Evicting it would leave fewer than one available pod, so the eviction is refused.
    - kind: show
      id: platform-budgets
      body: "The platform protects some of its own components the same way. The budgets on the lab cluster:"
      run: "oc get pdb -A"
      notice: |
        ALLOWED DISRUPTIONS is the number of pods the eviction API may remove right now; a budget showing `0` there is
        the one that stalls a drain. Every budget here allows one. The image registry's MIN AVAILABLE of `0` is another
        column: that budget requires no pod to stay up, so it never blocks.
    - kind: ask
      id: drain-remedy
      prompt: The MCO reports eviction refusals for that single payments pod. What should you address first?
      choices:
        - text: Workload capacity and its disruption budget
          why: The budget permits no healthy replica to leave. Agree how the service can tolerate eviction, then
            verify the drain progresses.
        - text: The node’s reboot command over SSH
          why: A manual reboot bypasses the planned eviction and can interrupt the service without fixing the budget.
        - text: The generated rendered configuration hash
          why: A PDB refusal is not a rendering error. Changing generated configuration does not grant eviction
            permission.
      answer: 0
    - kind: order
      id: stall-order
      prompt: A worker stays cordoned and its pool keeps Updating. Put the investigation in order.
      items:
        - Read the pool's conditions and counts
        - Find the node whose currentConfig and desiredConfig differ
        - Read that node's state and reason, and check whether it is cordoned
        - Look for eviction refusals and the PodDisruptionBudgets behind them
        - Fix the workload capacity or the agreed budget, then watch the pool converge
      why: Work from the pool to the node to the workload that blocks it, and change the cause only at the end. A forced reboot would skip the evacuation without fixing the budget.
    - kind: teach
      id: safe-change
      title: "Who may change node configuration, and how"
      body: |
        A MachineConfig writes files and systemd units as root on every node of its pool. The right to create or edit
        MachineConfigs is therefore a cluster administrator's right: whoever holds it controls those nodes, and through
        them every workload they run.

        On a shared or production cluster, a new MachineConfig is a planned change. Test it on a non-production
        cluster first, roll it out to a small custom pool before the whole worker pool, and apply it in a change window
        while someone watches the pools. If it goes wrong, deleting the MachineConfig renders the previous
        configuration again, which rolls out like any other change. None of this is run on OpenShift Local's single node.
    - kind: teach
      id: how-an-upgrade-flows
      title: Release completion and node completion differ
      body: |
        During a cluster update, the CVO verifies the release and applies manifests in ordered runlevels. The MCO
        rolls the required operating system and configuration through node pools. Control plane progress can finish
        before every worker has converged: ClusterVersion alone is not the closing check for node maintenance.

        A paused worker pool defers new configuration rollout; it does not undo work already started on a node.
        Watch pool conditions, ready/updated counts and per-node progress until the intended pools finish.
        Workers intentionally deferred to a later maintenance window need an explicit follow-up.
    - kind: ask
      id: release-complete
      prompt: ClusterVersion reports the target release; a paused worker pool still has old currentConfig values.
        Is node maintenance complete?
      choices:
        - text: Yes; ClusterVersion proves every worker rebooted
          why: ClusterVersion can report control-plane completion while worker updates remain.
        - text: No; verify and finish the worker rollout
          why: The release report and worker configuration describe different scopes of progress. Unpause according
            to the approved procedure and check convergence.
        - text: Yes; pausing automatically applies the new config
          why: Pausing defers new pool rollout. It does not bring current configurations up to date.
      answer: 1
    - kind: teach
      id: pause-limits
      title: Use pauses as part of a supported procedure
      body: |
        Minor versions always advance one at a time: 4.y, then 4.y+1, then 4.y+2. The supported **Control Plane Only** procedure between even
        minors pauses non-master pools, updates the control plane through the intervening minor, then unpauses those
        pools so workers can avoid an intermediate reboot. It does not skip the intervening control-plane version.

        Outside that procedure, do not assume indefinitely paused workers are compatible with later minor updates.
        Paused pools defer ordinary configuration and operating-system updates, though certificate rotation has
        exceptions on modern OpenShift. Keep pauses bounded and follow the exact version and skew requirements.
        The next lesson covers the update plan rather than issuing a change here.
    - kind: reflect
      id: explain-stalled-node
      prompt: Explain why a cordoned node and an Updating pool are starting evidence, not a reason to force a reboot.
      model: |
        The MCO may be waiting for safe eviction, daemon work or readiness. Read pool messages, node progress and eviction evidence first. A PDB can forbid eviction; changing workload capacity or an agreed budget addresses that cause without bypassing evacuation.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can trace MachineConfig inputs into rendered pool configuration, read pool and node progress, distinguish
        drift from an ordinary rollout, and explain why drains and disruption budgets can stall maintenance.
        You also know why a release report does not prove every worker has finished.

        Next, [Plan a cluster update](/lesson/n.cluster-updates) selects a supported update target, evaluates blockers
        and risks, and prepares the evidence for the change. The [cluster health lab](/lab/lab.cluster-health) only
        reads these objects; it never reboots the single node.
  sections:
    - id: pool-reference
      title: Machine configuration and pool diagnosis
      depth: true
      body: |
        | Object or field | Meaning |
        |---|---|
        | MachineConfig | source node configuration selected by pool labels |
        | MachineConfigPool | node/config selection, pause, disruption limit, rendered target, conditions and counts |
        | master and worker | default pools; custom pools inherit worker configuration; custom control-plane pools are unsupported |
        | rendered configuration | generated merge of selected inputs; change source objects rather than hand-editing the result |
        | maxUnavailable | pool-level limit, default 1; pools can run in parallel |
        | MachineConfigNode | per-node desired/current state and detailed progress |
        | currentConfig, desiredConfig annotations | current and requested rendered configurations |
        | state, reason annotations | daemon state and explanation |

        | Evidence | Likely investigation |
        |---|---|
        | Updating, cordoned node, eviction errors | PDB, ready replicas and spare scheduling capacity |
        | Degraded with content mismatch | managed-file drift; restore expected state through the documented recovery procedure |
        | Target does not change after a new input | MachineConfig labels/selection, validity and rendering conditions; unchanged content may render identically |
        | Desired differs but rollout does not start | pause and per-node phase |
        | All counts match but Degraded remains | read the condition; do not close solely on a counter |

        A pool is normally finished with Updated True, Updating False, Degraded False and all intended machines ready
        and updated. The source MachineConfig role label and the pool selectors must agree. A managed-file mismatch
        requires restoring the expected file or an administrator using the documented force-file reapply procedure,
        which can reboot the node. Do not use a forced reapply as a substitute for diagnosing the mismatch.

        Generated configurations should not be edited by hand. The documented pruning procedure can remove **unused**
        rendered MachineConfigs. Keep configurations still used by a pool; change source configuration to alter node behavior.
    - id: pause-reference
      title: Pausing and update constraints
      depth: true
      body: |
        | Situation | Consequence |
        |---|---|
        | Pause non-master pool | defers further ordinary config/OS rollout; does not cancel a node already updating |
        | Leave workers paused indefinitely | misses ordinary fixes and can block further updates or exceed supported skew |
        | Supported Control Plane Only procedure | permits the documented sequence through the intermediate minor while workers are paused |
        | Rotated certificates on modern releases | distribution is not universally blocked by MCP pause; 4.13/4.14 release notes document exceptions |

        A multi-node update needs replicas, readiness checks, graceful shutdown, disruption budgets and capacity on
        other nodes. A budget permits or refuses voluntary eviction; it cannot guarantee availability during an
        involuntary node failure. In a single-node cluster there is no other node to receive drained workloads, so
        these multi-node maintenance steps are not an exercise to run on OpenShift Local.
  review:
    - q: What happens on a node when its MachineConfigPool gets a new rendered config?
      a: For a reboot-requiring change, the MCO cordons, drains, applies configuration, reboots and uncordons, within
        maxUnavailable. Some changes skip drain or reboot under the supported disruption policy.
    - q: Why do PodDisruptionBudgets matter for upgrades?
      a: Drains respect them, so they prevent too many replicas being evicted at once; a PDB allowing zero disruptions
        blocks the drain entirely.
    - q: How do you know a pool has finished updating?
      a: Updated True, Updating False, Degraded False, with every intended machine ready and updated. Check node
        progress and reasons if the pool does not converge.
    - q: What marks a node degraded for configuration drift, and how is it fixed?
      a: The Machine Config Daemon finds a file that differs from the rendered config. Restore the file (or force
        a re-apply, which reboots), and make future changes through a MachineConfig.
  limits: |
    Every command here reads. Applying a MachineConfig, draining, rebooting or upgrading the only node of OpenShift
    Local is not a lab: it is a full outage, and its versions are tied to the bundle. Those steps are described from
    the documentation; the pool, node, policy and budget evidence is real.
  enterprise: |
    Regulated organisations schedule upgrades in change windows, often follow EUS releases with Control Plane
    Only updates, test on non-production clusters first, and pause worker pools to separate control-plane and
    application maintenance.
  commands:
    - {cmd: "oc get clusteroperator machine-config", as: admin, meaning: "the Machine Config Operator's own health report"}
    - {cmd: "oc get machineconfigs", as: admin, meaning: "the MachineConfig inputs and the rendered outputs"}
    - {cmd: "oc get mc 99-node-sizing-for-crc -o jsonpath='{.metadata.labels}{\"\\n\"}{.spec.config.storage.files[0].path}{\"\\n\"}'", as: admin, meaning: "the pool a MachineConfig targets and the file it writes"}
    - {cmd: "oc get mc 99-node-sizing-for-crc -o jsonpath='{.spec.config.storage.files[0].contents.source}' | cut -d, -f2 | base64 -d", as: admin, meaning: "the decoded content of that file"}
    - {cmd: "oc get mcp", as: admin, meaning: "the pools, the rendered configuration each has reached, and machine counts"}
    - {cmd: "oc get mcp master -o jsonpath='{.spec.configuration.name}{\"\\n\"}{range .spec.configuration.source[*]}{.name}{\"\\n\"}{end}'", as: admin, meaning: "the master pool's rendered target and its source MachineConfigs"}
    - {cmd: "oc get mcp master -o jsonpath='{range .status.conditions[*]}{.type}{\"=\"}{.status}{\"  \"}{.message}{\"\\n\"}{end}'", as: admin, meaning: "the master pool's conditions with messages"}
    - {cmd: "oc describe node crc | grep machineconfiguration.openshift.io/", as: admin, meaning: "the node's current and desired configuration, daemon state and drain annotations"}
    - {cmd: "oc get machineconfignodes", as: admin, meaning: "per-node configuration progress"}
    - {cmd: "oc get mcp -o custom-columns=NAME:.metadata.name,PAUSED:.spec.paused,MAXUNAVAILABLE:.spec.maxUnavailable", as: admin, meaning: "whether a pool is paused, and how many nodes it may update at once"}
    - {cmd: "oc get machineconfiguration cluster -o jsonpath='{.status.nodeDisruptionPolicyStatus.clusterPolicies.files}' | jq -c '.[]'", as: admin, meaning: "the built-in disruption policy for each file path"}
    - {cmd: "oc get pdb -A", as: admin, meaning: "the disruption budgets that a drain would have to respect"}
  references:
    - title: 'OpenShift 4.21: Machine configuration overview'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_configuration/machine-config-index
    - title: 'OpenShift 4.21: Understanding OpenShift updates (channels, runlevels)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/understanding-openshift-updates-1
    - title: 'OpenShift 4.21: Performing a cluster update (Control Plane Only updates, pausing pools)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/performing-a-cluster-update#control-plane-only-update
    - title: 'OpenShift 4.13 release notes: the MCD syncs kubelet CA certificates on paused pools'
      url: https://github.com/openshift/openshift-docs/blob/enterprise-4.13/release_notes/ocp-4-13-release-notes.adoc
    - title: 'OpenShift 4.14 release notes: certificates not bound by the machine config pool status'
      url: https://github.com/openshift/openshift-docs/blob/enterprise-4.14/release_notes/ocp-4-14-release-notes.adoc
    - title: 'Kubernetes: Disruptions and PodDisruptionBudgets'
      url: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
    - title: 'OpenShift 4.21: Managing unused rendered machine configs'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/machine_configuration/machine_configuration#managing-unused-rendered-machine-configs
- id: n.cluster-updates
  title: Plan a cluster update
  subtitle: Channels, risks and preparation
  module: b6-operators-maintenance
  mode: GUIDED_INVESTIGATION
  minutes: 30
  level: 3
  supports: "OpenShift 4.21 / Kubernetes 1.34. Every command was run on OpenShift Local 4.21 by its cluster administrator (kubeadmin), and every one of them only reads: no channel is changed and no update is started. Starting, watching and recovering a real update are described from the official update procedures, because OpenShift Local's version is tied to its bundle and its overrides block minor updates."
  concepts:
    - ocp.upgrades
    - ocp.clusteroperators
    - ocp.mco
  prerequisites:
    - c.machineconfig-upgrades
  record_on: cluster-admin
  labs:
    - lab.cluster-health
  objective: |
    Plan a cluster update like an administrator: pick a channel and a target from the update graph, read what blocks
    or warns, prepare the cluster and the workloads, and know what cannot be undone.
  flow:
    - kind: teach
      id: situation
      title: The change window needs a target and a reason
      body: |
        Your team has a maintenance window next week, and a newer OpenShift version exists. The cluster reports an
        update blocker, and one possible target carries a known risk. The date of the window decides neither question.

        You will read where update recommendations come from, distinguish a blocker from a conditional risk, and
        prepare health, compatibility, backup and workload checks. Every command you see run was run by the
        administrator of a lab cluster (OpenShift Local 4.21) and only reads; nothing selects a target or starts an
        update.
    - kind: teach
      id: where-the-list-of-updates-comes
      title: Choose a path through the update graph
      body: |
        The **OpenShift Update Service** supplies an **update graph**: versions and supported transitions between them.
        The CVO queries that graph using the current version and the selected **channel**: a named update stream tied to
        one minor release and a release policy, such as `stable-4.21`.

        Patch updates stay within a minor, such as 4.21.z. Minor updates move one minor at a time, from 4.y to 4.y+1, along an offered
        path. Switching to a target minor's channel changes the recommendations you ask for; it does not start an update
        or make an unoffered transition supported.
    - kind: show
      id: inspect-updates
      body: "The channel the cluster follows, read from ClusterVersion:"
      run: "oc get clusterversion version -o jsonpath='{.spec.channel}{\"\\n\"}'"
      notice: "`stable-4.21`: the CVO asks the update service for the stable graph of the 4.21 minor. Nothing else needs to be set for a connected cluster to receive recommendations."
    - kind: ask
      id: switch-channel
      prompt: A cluster follows stable-4.21. To assess the next minor’s offered paths, what should the administrator
        change first?
      choices:
        - text: The desired version directly to any published release
          why: A published image is not proof of an offered or supported transition for this cluster.
        - text: The channel to candidate for every minor update
          why: Candidate is for early testing. Stable and fast also offer supported minor transitions.
        - text: The channel to stable for the target minor
          why: The channel requests that minor’s graph. Then select a reachable recommended target; a switch alone
            does not update anything.
      answer: 2
    - kind: teach
      id: channels
      title: Stable and fast differ in timing
      body: |
        `fast-4.y` offers generally available releases earlier; `stable-4.y` offers the same releases after a delay and
        is the default for new clusters. `candidate-4.y` can include release candidates and is for unsupported testing.
        `eus-4.y` exists for even-numbered minors and helps with supported Control Plane Only update paths.

        A channel name is not a compatibility waiver. Review both the target release and the path the service offers.
        There is no eus-4.21 channel because 4.21 is odd-numbered. `oc adm upgrade channel <channel>` sets it.
    - kind: try
      id: set-channel
      body: "A cluster at 4.21 has an approved change to prepare for 4.22. Type the command that makes the CVO ask for the stable 4.22 recommendations. Nothing runs here."
      accept: ["oc adm upgrade channel stable-4.22"]
      hints:
        - match: "--to"
          say: "`--to` selects a target and starts an update. This step only changes which recommendations the CVO asks for."
        - match: "stable-4\\.21"
          say: "stable-4.21 is the current stream: it never offers 4.22. Name the target minor's channel."
        - match: "fast-4\\.22"
          say: "fast-4.22 is supported too, with the same releases earlier; the change asks for the stable stream."
        - match: "candidate"
          say: "Candidate channels are for testing, not for a cluster you depend on."
        - match: "^oc (patch|edit)"
          say: "Editing `spec.channel` would work, but `oc adm upgrade channel` is the documented command."
      hint: "`oc adm upgrade channel`, then the channel's name: policy, a dash, and the minor version."
      then: "On a real cluster this changes only the update stream: `oc adm upgrade` would then list what stable-4.22 offers, and nothing updates until someone selects a target with `--to`. The documented procedure requires cluster-admin. OpenShift Local's version is tied to its bundle, so here it stays an exercise."
    - kind: show
      id: read-the-update-status-recorded
      body: "Without arguments, `oc adm upgrade` only reads the update status:"
      run: "oc adm upgrade"
      notice: |
        The current version, `Upgradeable=False` because of `ClusterVersionOverridesSet`, the channel, and the
        recommended updates: 4.21 patch releases from 4.21.12 to 4.21.36, with gaps at 4.21.24 to 4.21.26. The last
        line says that more updates exist which are not recommended, or whose status is Unknown. These were the
        recommendations at recording time, not today's.
    - kind: ask
      id: minor-guard
      prompt: The cluster shows Upgradeable=False, and the same recording lists 4.21 patch releases as recommended. What does the condition block?
      evidence: |
        Cluster version is 4.21.8

        Upgradeable=False

          Reason: ClusterVersionOverridesSet
          Message: Disabling ownership via cluster version overrides prevents upgrades. Please remove overrides before continuing.

        Upstream is unset, so the cluster will use an appropriate default.
        Channel: stable-4.21

        Recommended updates:

          VERSION     IMAGE
          4.21.36     quay.io/openshift-release-dev/ocp-release@sha256:d00a000883878045a9175d7526667104e3ac8a90b7fbaa0450d4e5f8fce6fa61
          4.21.35     quay.io/openshift-release-dev/ocp-release@sha256:1f8f423477982ce16193469c26f8941ba797a6f4fc3b3621a5d426ae19deb457
      choices:
        - text: Updates to the next minor, such as 4.22
          why: "Upgradeable guards minor-version transitions, and patch targets are still offered. On this particular cluster the cause, the overrides, also stops patch updates: the CVO refuses any patch update while an override is set."
        - text: Every update, including 4.21 patch releases
          why: "True of this cluster's outcome, but not of the condition: Upgradeable=False alone lets patch updates through. Here the overrides named in the reason are what also stop them."
        - text: Nothing; the condition is only informational
          why: The CVO uses this condition to block minor updates until the cause is resolved.
      answer: 0
    - kind: teach
      id: blockers
      title: A blocker is work to complete before the change
      body: |
        Read the Upgradeable reason and message. A release override, an incompatible installed add-on, or a required
        administrator acknowledgement can block a minor update. Resolve the named cause using its documented procedure.

        OLM operators follow their own package channels; they are not all updated as part of the platform release.
        Check each add-on's compatibility and required update order. Classic or v1 operators can constrain the next
        OpenShift version. A healthy controller on today's release is not proof it supports tomorrow's release.
    - kind: teach
      id: conditional-risk
      title: A conditional target carries a cluster-specific risk
      body: |
        A **conditional update** has a known problem that applies under stated conditions. The CVO evaluates those
        conditions against your cluster and can mark the target not recommended. The explanation links to the risk;
        read it, confirm applicability and document the decision.
    - kind: show
      id: conditional-targets
      body: "The targets the graph offers only with a risk attached, and the name of each risk:"
      run: "oc get clusterversion version -o jsonpath='{range .status.conditionalUpdates[*]}{.release.version}{\"  \"}{.risks[*].name}{\"\\n\"}{end}'"
      notice: "4.21.24 to 4.21.26 carry the risk `KubeStateMetricsTimezonePanic`, and 4.21.9 to 4.21.11 carry `PrecisionTimeProtocolDPLLPins`. None of them is among the recommended updates above, which is why those versions seemed to be missing."
    - kind: show
      id: not-recommended
      body: "`--include-not-recommended` adds them to the report, with the CVO's verdict and the link to each risk:"
      run: "oc adm upgrade --include-not-recommended"
      notice: |
        The same report, then `Updates with known issues` at the end of the output (show all of its lines to read
        it). For 4.21.24 to 4.21.26 the reason is the risk itself, with
        a message (CronJobs using `.spec.timeZone`, the field [Jobs and CronJobs for administrative tasks](/lesson/o2.jobs-cronjobs)
        set, can crash kube-state-metrics) and a link. For 4.21.9 to 4.21.11 the
        reason is `EvaluationFailed`: the CVO evaluates that risk with a monitoring query, and this cluster has no
        monitoring stack (`thanos-querier` not found). A risk it cannot evaluate is reported with the Recommended
        status `Unknown`, not `False`; like a not-recommended target, it is listed only with
        `--include-not-recommended` and needs `--allow-not-recommended`. Reading this is still only reading.

        `--allow-not-recommended` accepts a not-recommended target after that review. `--force` bypasses different
        cluster-side guards, including verification and Upgradeable checks; it is not the ordinary way to accept a
        conditional risk. A risk acceptance also does not resolve an independent update blocker.
    - kind: ask
      id: risk-versus-guard
      prompt: You accepted a conditional risk, but an incompatible add-on still sets Upgradeable=False. What comes
        next?
      choices:
        - text: Treat risk acceptance as permission to bypass it
          why: The risk flag does not make an incompatible add-on compatible or clear Upgradeable.
        - text: Resolve the add-on compatibility blocker
          why: Accepting a recommendation risk and satisfying minor-update preconditions are separate decisions.
        - text: Remove the add-on’s condition from its status
          why: Controllers regenerate status. Fix the compatibility problem using the supported operator procedure.
      answer: 1
    - kind: teach
      id: preparation-checklist
      title: Start with health and recovery evidence
      body: |
        Collect a baseline before a change: no unexpected ClusterVersion progress or failure, ClusterOperators
        available and not degraded, nodes Ready, and intended MCPs converged. Investigate existing faults first.

        Take a recent supported etcd backup and store it off-cluster. Also protect application data using the
        application's backup procedure or suitable volume snapshots. An etcd backup contains cluster state; it is not
        a copy of every application's volume data.

        Read the target release notes and test the same update in non-production. An update has no supported rollback
        to an older OpenShift version; forward repair is the normal response, and recovery procedures are not an undo button.
    - kind: show
      id: health-baseline
      body: "The health round from [Check a cluster's health](/lesson/n.cluster-admin-health), as an administrator would paste it into the change record. First the release and the operators that are not settled (an empty result is the good one):"
      run: "oc get clusterversion && oc get clusteroperators --no-headers | awk '$3 != \"True\" || $4 != \"False\" || $5 != \"False\"'"
      notice: "The release line, then nothing: no operator was unavailable, progressing or degraded at that moment."
    - kind: show
      id: baseline-nodes
      run: "oc get nodes && oc get mcp"
      notice: "The node is Ready and both pools are Updated, not Updating, not Degraded: no node configuration is pending."
    - kind: show
      id: api-requests
      body: "Callers of APIs that a target release removes are found through APIRequestCount objects:"
      run: "oc get apirequestcounts"
      notice: |
        `No resources found`: this OpenShift Local cluster keeps no API request counts, a limit of the lab cluster
        rather than a sign that nothing calls the API, so the check cannot be shown here. On an
        installed cluster, each object is named after a resource and version, and the ones with a removal release
        list the users and agents still calling them.
    - kind: show
      id: admin-gates
      body: "A release that removes APIs adds a gate the administrator must acknowledge. The gates of this release, with the ConfigMap's own description:"
      run: "oc get configmap admin-gates -n openshift-config-managed -o jsonpath='{.metadata.annotations.kubernetes\\.io/description}{\"\\n\"}data: {.data}{\"\\n\"}'"
      notice: "The gates are defined here and acknowledged in `admin-acks` in `openshift-config`. The data is empty: this release asks for no acknowledgement."
    - kind: try
      id: read-cluster-input
      body: You are a cluster reader. Type one command to retrieve the full ClusterVersion named version as YAML,
        including its desired update and conditions.
      accept:
        - oc get clusterversion version -o yaml
        - oc get clusterversions version -o yaml
        - oc get clusterversion/version -o yaml
        - oc get clusterversion version --output=yaml
        - oc get clusterversion version --output yaml
        - oc get -o yaml clusterversion version
        - oc get clusterversion version -oyaml
        - oc get clusterversions version --output yaml
        - oc get clusterversions version --output=yaml
        - oc get clusterversions version -oyaml
        - oc get clusterversion/version --output yaml
        - oc get clusterversion/version --output=yaml
        - oc get clusterversion/version -oyaml
        - oc get --output yaml clusterversion version
        - oc get --output=yaml clusterversion version
        - oc get -oyaml clusterversion version
        - oc -o yaml get clusterversion version
        - oc -o=yaml get clusterversion version
        - oc --output yaml get clusterversion version
        - oc -o yaml get clusterversions version
        - oc -o=yaml get clusterversions version
        - oc --output yaml get clusterversions version
        - oc -o yaml get clusterversion/version
        - oc -o=yaml get clusterversion/version
        - oc --output yaml get clusterversion/version
        - oc -o yaml get clusterversions/version
        - oc get clusterversions/version -o yaml
        - oc -o=yaml get clusterversions/version
        - oc --output yaml get clusterversions/version
        - oc get clusterversions/version --output yaml
        - oc --output=yaml get clusterversions/version
      hints:
        - match: ^oc adm upgrade.*--to
          say: A target-selection command is a change. This task only reads the current ClusterVersion.
        - match: ^oc get.* -n
          say: ClusterVersion is cluster-scoped. Do not choose an application namespace.
        - match: ^oc get clusterversion( version)?$
          say: The table is useful, but YAML exposes spec and detailed status conditions together.
      hint: Use get on clusterversion version and request YAML output.
      then: |
        The YAML would show the requested channel/update, release history and current conditions. Read it with operator and pool evidence before judging whether the cluster is ready for another change.
    - kind: teach
      id: workload-preparation
      title: Prepare for eviction before the first drain
      body: |
        [Machine configuration, MachineConfigPools and upgrades](/lesson/c.machineconfig-upgrades) explained why one
        ready replica with `minAvailable: 1` blocks a normal drain. Review PDBs, ready replicas, graceful shutdown,
        probes, placement and spare capacity with application owners.

        A drain cannot relocate a pod while preserving the same process. It evicts a pod and relies on controllers
        and available nodes to run replacements. Test that the service tolerates those moves before the update.

        If the target removes APIs, use APIRequestCount to find callers and fix them before the required administrator
        acknowledgement. Do not add an acknowledgement merely to silence a condition; it records completed preparation.
    - kind: ask
      id: rollback-request
      prompt: An application misbehaves on the new release. What is the supported recovery direction?
      choices:
        - text: Set the old minor as the desired update target
          why: A previous image is not a supported rollback path and downgrading can damage the cluster.
        - text: Restore old etcd onto the updated running cluster
          why: An etcd restore is a constrained disaster-recovery procedure, not a general release rollback.
        - text: Diagnose and repair forward; use support if needed
          why: OpenShift does not support reverting the cluster update. A blocked or failing update needs diagnosis,
            not a guessed downgrade.
      answer: 2
    - kind: teach
      id: what-an-update-changes-in-order
      title: Watch release and node progress separately
      body: |
        The CVO retrieves and verifies the selected release image, then applies manifests in ordered stages.
        ClusterOperators reconcile their new versions and configuration; the MCO manages node OS/configuration rollout.
        Pools can progress independently within their `maxUnavailable` limits.

        ClusterVersion can report completion before every worker finishes. Keep watching intended pools and nodes,
        not only the release version. In 4.21, the read-only upgrade status subcommand summarizes control-plane and
        node-pool progress and blockers.
    - kind: show
      id: observe-update
      body: "The status subcommand, on this cluster, where no update runs:"
      run: "oc adm upgrade status"
      notice: |
        It reports that the cluster is not updating. During an update, the same command summarises control-plane
        progress, each node pool's progress and the operators still updating, which you would follow with `oc get
        clusteroperators`, `oc get mcp` and `oc describe clusteroperator` on the operator that stalls.
    - kind: show
      id: history
      body: "ClusterVersion keeps the history of every release the cluster ran, newest first:"
      run: "oc get clusterversion version -o jsonpath='{range .status.history[*]}{.state}{\"  \"}{.version}{\"  \"}{.startedTime}{\"\\n\"}{end}'"
      notice: "One entry, `Completed  4.21.8`, started on 30 March: this cluster has run only the release it was installed with. An update adds a line on top; nothing in the history can be selected to go back."
    - kind: ask
      id: stalled-worker
      prompt: The release advanced; a worker is cordoned and the MCO reports PDB eviction refusals. What should
        you investigate?
      choices:
        - text: The workload’s replicas, budget and capacity
          why: The evidence points to a blocked drain. Fix safe eviction with the workload owner, then confirm pool
            progress.
        - text: The release image’s signature, verified again
          why: The worker’s eviction refusals identify a later stage. Rechecking signatures cannot allow a prohibited
            eviction.
        - text: The update channel, to pick a newer release
          why: The release already advanced. A newer release would meet the same drain, because the disruption
            budget still forbids the eviction.
      answer: 0
    - kind: teach
      id: special-paths
      title: Special procedures still have prerequisites
      body: |
        A Control Plane Only update between even minors pauses non-master pools, updates the control plane through
        the intervening minor, then resumes worker rollout. It reduces worker reboots; it is not a direct jump over a
        control-plane version. Follow the supported version-specific procedure and resume paused pools as planned.

        Disconnected clusters obtain release images from a mirror registry, with a local Update Service or the
        documented explicit-image procedure. Mirroring does not remove compatibility, signature or health checks.

        Choose an offered target only after the preparation is complete, agree the window and monitoring owner, and
        record the baseline and risk decisions. No target-changing command is executed in this lesson.
    - kind: order
      id: update-plan
      prompt: Put an ordinary planned update in order.
      items:
        - Read release notes and compatibility; test the path in non-production
        - Resolve blockers, protect cluster and application data, prepare workloads
        - Capture healthy baseline and approve a reachable target and risk decision
        - Start the documented update and monitor operators, pools and nodes
        - Confirm intended convergence, application checks and any paused-pool follow-up
      why: The target and preparation come before the change; completion includes workloads and node convergence,
        not only a new version string.
    - kind: reflect
      id: explain-plan
      prompt: Explain to a service owner why a patch still needs preparation when Upgradeable=False blocks only
        the next minor.
      model: |
        The condition’s scope does not certify a patch is safe. Check baseline health, target-specific risks, add-on compatibility and data recovery, and verify the service can tolerate maintenance. Then observe both release and node progress and validate the service afterwards.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can choose a reachable update path, distinguish minor-update blockers from conditional risks, prepare
        cluster and application recovery evidence, and watch operators and node pools through completion.
        You can explain why an update has no supported rollback and why a pause needs a documented end.

        This completes Platform administration. [The cluster health lab](/lab/lab.cluster-health) repeats the read-only
        checks. The enterprise territory, next, starts with [Install the platform](/lesson/n.installation): the day-1
        decisions behind the clusters you have administered.
  sections:
    - id: update-reference
      title: Channel and guard reference
      depth: true
      body: |
        | Channel | Policy |
        |---|---|
        | candidate-4.y | early access including release candidates; unsupported testing |
        | fast-4.y | generally available releases earlier |
        | stable-4.y | same GA releases after delay; default for new clusters |
        | eus-4.y | even minors; convenient for supported Control Plane Only paths |

        | Signal or option | Interpretation |
        |---|---|
        | Upgradeable=False | prevents affected minor updates; patch updates still need other checks, and are refused too while cluster version overrides are set |
        | Conditional target not recommended | known risk applies or could not be evaluated safely; read the named risk |
        | --include-not-recommended | read additional offered targets and their risks |
        | --allow-not-recommended | accept that target’s recommendation risk after review |
        | --force | bypasses cluster-side safeguards; reserved for narrowly documented support/testing cases |
        | --to / --to-latest | select a version or latest offered target; these start a change |
        | channel subcommand | select update stream; does not start an update |
        | status subcommand | read progress and blockers; available in 4.21 |

        Recommendation retrieval failure and an update blocker are different. A missing target is not always a
        matching conditional risk: check channel, graph connectivity, retrieval and intermediate required versions.
        OpenShift Local uses resource-saving overrides and its version is tied to its bundle; it is not updated here.
    - id: preparation-reference
      title: Preparation and stalled-update reference
      depth: true
      body: |
        | Before the change | Evidence or action |
        |---|---|
        | Platform baseline | release stable; ClusterOperators available and not degraded; nodes ready; intended MCPs converged |
        | Recovery | supported etcd backup off-cluster; application data backup/snapshots and restore procedure |
        | API removals | target release notes; APIRequestCount callers; fixed clients before any required admin acknowledgement |
        | Add-ons | compatible versions/channels, upgrade edges and required ordering |
        | Workloads | replicas, probes, graceful termination, PDBs and scheduling capacity |
        | Process | non-production rehearsal, risk assessment, change window, observer and escalation owner |

        | Stop point | Next evidence |
        |---|---|
        | Minor update blocked | Upgradeable reason: override, incompatible add-on, missing acknowledgement or another named precondition |
        | Target absent | selected channel, graph retrieval, intermediate versions and not-recommended risks |
        | Operator stalls | its conditions/related objects, component events and logs; support diagnostics if needed |
        | Worker drain stalls | node progress, eviction errors and workload PDB/capacity |
        | Pool never starts | spec.paused and planned maintenance sequencing |

        OpenShift 4.21 preparation documentation says 4.21 removes no Kubernetes APIs; that does not predict removals in
        another target. Historical 4.19 preparation guidance explains API removals and admin-acks in openshift-config.
        Modern certificate distribution has exceptions to MCP pause, documented in 4.13/4.14 release notes. Ordinary
        worker deferral must stay within supported constraints. The supported Control Plane Only procedure allows the
        control plane to pass through the intermediate minor while workers remain paused, then requires worker convergence.
  review:
    - q: Name the four update channel types and what each contains.
      a: candidate (early access, unsupported), fast (GA releases as soon as GA), stable (the same releases after
        a delay; default), eus (even minors only, for control-plane-only updates).
    - q: What does Upgradeable=False block?
      a: Affected minor updates. Patch updates are not blocked by that condition alone (unless cluster version overrides are set, as on OpenShift Local), but still require health,
        compatibility, risk and other precondition checks.
    - q: How do you find clients still calling APIs that the next version removes?
      a: Read APIRequestCount resources (oc get apirequestcounts) for removed APIs and their requesters.
    - q: Can you roll back an OpenShift update?
      a: No, rolling back is not supported; recovery is forward. Prepare, back up etcd and test on non-production
        first.
  limits: |
    No update runs here and no channel is changed: OpenShift Local's version is tied to its bundle and its release
    overrides block minor updates. The status, recommendations, risks, gates and baseline are real reads of the lab
    cluster; starting an update, watching it, and taking an etcd backup are described from the documentation and need
    a suitable test cluster. This cluster records no APIRequestCount objects.
  enterprise: |
    Regulated organisations typically follow the stable or EUS channels, update non-production a few weeks before
    production, attach the pre-update health evidence and the conditional-risk assessment to the change record, and
    use control-plane-only updates between EUS minors to limit the number of worker reboots.
  commands:
    - {cmd: "oc get clusterversion version -o jsonpath='{.spec.channel}{\"\\n\"}'", as: admin, meaning: "the update channel"}
    - {cmd: "oc adm upgrade", as: admin, meaning: "the update status: version, Upgradeable, channel, recommended updates; reads only"}
    - {cmd: "oc get clusterversion version -o jsonpath='{range .status.conditionalUpdates[*]}{.release.version}{\"  \"}{.risks[*].name}{\"\\n\"}{end}'", as: admin, meaning: "conditional targets and the names of their risks"}
    - {cmd: "oc adm upgrade --include-not-recommended", as: admin, meaning: "the same, plus supported targets that carry a known risk; reads only"}
    - {cmd: "oc get clusterversion && oc get clusteroperators --no-headers | awk '$3 != \"True\" || $4 != \"False\" || $5 != \"False\"'", as: admin, meaning: "the release, then any ClusterOperator not in the healthy combination"}
    - {cmd: "oc get nodes && oc get mcp", as: admin, meaning: "node readiness and node-pool convergence"}
    - {cmd: "oc get apirequestcounts", as: admin, meaning: "API request counts, used to find callers of APIs a target removes"}
    - {cmd: "oc get configmap admin-gates -n openshift-config-managed -o jsonpath='{.metadata.annotations.kubernetes\\.io/description}{\"\\n\"}data: {.data}{\"\\n\"}'", as: admin, meaning: "the update gates of this release"}
    - {cmd: "oc adm upgrade status", as: admin, meaning: "update progress; reads only"}
    - {cmd: "oc get clusterversion version -o jsonpath='{range .status.history[*]}{.state}{\"  \"}{.version}{\"  \"}{.startedTime}{\"\\n\"}{end}'", as: admin, meaning: "the release history"}
  references:
    - title: 'OpenShift 4.21: Updating a cluster using the CLI'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/performing-a-cluster-update
    - title: 'OpenShift 4.21: Understanding update channels and releases'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/understanding-openshift-updates-1
    - title: 'OpenShift 4.21: Preparing to update a cluster'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/preparing-to-update-a-cluster
    - title: 'OpenShift 4.21: Performing a cluster update (CLI, control-plane-only updates)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/performing-a-cluster-update
    - title: 'OpenShift 4.19: Preparing to update (removed APIs and administrator acknowledgement)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/html/updating_clusters/preparing-to-update-a-cluster
    - title: 'Kubernetes: Pod disruption budgets'
      url: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
    - title: 'OpenShift 4.13 release notes: the MCD syncs kubelet CA certificates on paused pools'
      url: https://github.com/openshift/openshift-docs/blob/enterprise-4.13/release_notes/ocp-4-13-release-notes.adoc
    - title: 'OpenShift 4.14 release notes: certificates not bound by the machine config pool status'
      url: https://github.com/openshift/openshift-docs/blob/enterprise-4.14/release_notes/ocp-4-14-release-notes.adoc
    - title: 'OpenShift 4.21: Updating clusters (complete guide, API removals and recovery)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/updating_clusters/index
- id: o2.kustomize-helm
  title: Kustomize and Helm
  subtitle: Overlays, charts, releases and drift
  module: b1-declarative
  mode: REAL_LAB
  minutes: 35
  level: 2
  supports: "oc 4.21.8 (built-in Kustomize v5.7.1) and Helm 3.17. Every command was run on OpenShift Local 4.21 by the ordinary user developer, in a temporary project deleted afterwards, from the files in the practice directory (lab/kustomize, lab/chart and prod.yaml)."
  concepts:
    - deploy.packaging
    - deploy.declarative
  prerequisites:
    - o1.deploy-apps
    - gx.declarative
  record_on: cluster
  labs:
    - lab.kustomize-helm
    - ch.helm-release
  objective: |
    Produce the YAML for an application from reusable sources, apply it repeatably, manage a Helm release through
    install, upgrade, rollback and uninstall, and choose the right tool for each job.
  simulator: drift
  flow:
    - kind: teach
      id: situation
      title: Three environments, one application
      body: |
        Your application runs in development and production. You copied its Deployment YAML for each environment,
        but a fix reached only one copy. Now a reviewer cannot tell intended differences from forgotten edits.

        You will keep common YAML in a Kustomize base, describe differences in overlays, and compare that approach
        with Helm charts and release history. You will render before changing a cluster, then reason about drift,
        ownership and rollback. Everything below was run by an ordinary user in their own project on a lab cluster,
        from a small base, two overlays and a chart in the practice directory.
    - kind: teach
      id: kustomize-in-one-minute
      title: A base stays plain YAML
      body: |
        **Kustomize** transforms ordinary Kubernetes manifests. A **base** holds shared resources; an **overlay** refers
        to that base and declares environment differences. Each directory has a `kustomization.yaml` listing resources
        and transformations.

        A name prefix can distinguish objects, `images` can select a different image, and a patch can change a chosen
        field. Kustomize has no release history or continuously running controller. Rendering produces YAML;
        applying that result is a separate decision.
    - kind: show
      id: overlay-file
      code: |
        resources:
          - ../../base
        namePrefix: dev-
        labels:
          - pairs: {env: dev}
            includeSelectors: false
        patches:
          - target: {kind: Deployment, name: catalog}
            patch: |
              - op: replace
                path: /spec/replicas
                value: 2
      caption: lab/kustomize/overlays/dev/kustomization.yaml in the practice directory
      notice: |
        `../../base` holds a catalog Deployment (one replica) and Service, and adds the label
        `app.kubernetes.io/part-of: shop` itself. The overlay keeps their selectors stable while changing names,
        metadata labels and the replica count.
    - kind: show
      id: render-dev
      run: "oc kustomize lab/kustomize/overlays/dev"
      notice: |
        The render names both objects dev-catalog. Metadata has env: dev and part-of: shop; the selectors still use app: catalog. Rendering this local directory does not apply it to a cluster.
    - kind: try
      id: render-production
      body: From the repository root, lab/kustomize/overlays/prod/ exists with a valid kustomization and local base.
        Type one oc command to render it without applying anything.
      accept:
        - oc kustomize lab/kustomize/overlays/prod
        - oc kustomize lab/kustomize/overlays/prod/
        - oc kustomize ./lab/kustomize/overlays/prod
        - oc kustomize ./lab/kustomize/overlays/prod/
      hints:
        - match: ^oc apply
          say: Apply changes cluster objects. Render locally first with the kustomize subcommand.
        - match: ^oc kustomize.*kustomization\.ya?ml
          say: Give Kustomize the directory containing kustomization.yaml, not that file as the build target.
        - match: ^oc kustomize -k
          say: The kustomize subcommand already means render a kustomization directory. The -k flag belongs to commands
            such as apply and diff.
      hint: Use the kustomize subcommand and the prod overlay directory.
      run: "oc kustomize lab/kustomize/overlays/prod"
      then: |
        The production overlay's composed YAML: names prefixed `prod-`, the label `env: prod`, three replicas, and
        the same `app: catalog` selector. Nothing was sent to the cluster.
    - kind: teach
      id: selectors
      title: Keep identity labels stable
      body: |
        Deployment selectors identify their pods and cannot be changed on an existing apps/v1 Deployment.
        Kustomize's `labels` transformer can add metadata labels without rewriting selectors; set `includeSelectors`
        deliberately. The deprecated `commonLabels` also changes selectors and can make a later apply fail.

        `namePrefix` and `nameSuffix` rename resources and rewrite references Kustomize knows how to recognize.
        They do not understand every arbitrary string or every custom-resource field. Inspect the rendered result,
        especially when extending it to operator APIs.
    - kind: ask
      id: selector-change
      prompt: An environment label is only for reporting, but applying its overlay tries to change a live Deployment selector. What should you fix?
      choices:
        - text: Keep the label out of the selectors
          why: A reporting label does not need to redefine pod identity. Keep selectors stable; a real selector redesign needs a new Deployment.
        - text: Raise the Deployment's replica count first
          why: Replicas and selectors serve different purposes. Scaling does not make a selector mutable.
        - text: Delete the Deployment before every apply
          why: That would let the selector change, but it interrupts the service on every apply and hides the cause, a label that never needed to reach the selectors.
      answer: 0
    - kind: teach
      id: generated-config
      title: New configuration can change a pod template
      body: |
        `configMapGenerator` creates a ConfigMap from files or literals. By default its name has a content hash.
        When content changes, the name changes; Kustomize rewrites recognised references in the rendered workloads.

        If a Deployment's pod template references that generated name, the changed reference changes the template and
        starts a rollout when applied.
        Disabling the hash or updating a hand-written ConfigMap in place removes this automatic template change.
        Old generated objects also need a cleanup plan.
    - kind: show
      id: generator
      code: |
        # Fragment of a kustomization.yaml
        configMapGenerator:
        - name: app-settings
          literals:
          - mode=production
        # The base Deployment's pod template refers to app-settings,
        # for example in envFrom.configMapRef.name.
      origin: example
      caption: 'Kubernetes documentation: Kustomize, generating resources; illustrative fragment.'
      notice: |
        With the default hash suffix, the generated ConfigMap's name ends in a hash of its content. Compare that name with the reference Kustomize wrote into the pod template.
    - kind: ask
      id: generator-rollout
      prompt: You change a generated literal, but no Deployment references that ConfigMap. Does applying it roll
        the Deployment?
      choices:
        - text: Yes; every ConfigMap creation restarts all pods
          why: Kubernetes does not globally restart workloads when a ConfigMap is created or updated.
        - text: Yes; the hash automatically selects the Deployment
          why: A hash distinguishes generated content. It is not a selector linking arbitrary configuration to workloads.
        - text: No; its pod template did not change
          why: The rollout mechanism is a changed pod template reference. Creating unrelated configuration does
            not restart pods.
      answer: 2
    - kind: teach
      id: drift-and-ownership
      title: Compare the declared result with live objects
      body: |
        **Drift** means live state differs from the intended source. The option `-k DIR` makes `oc diff` and `oc apply`
        render a kustomization directory first, as `oc kustomize` does. For an overlay, diff compares the rendered desired
        objects with the cluster; apply submits them. Diff exits 0 for no differences, 1 for differences, and above 1
        for an error. The distinction matters to a pipeline.

        Neither Kustomize nor a one-time apply continuously repairs objects. Keep the source in Git and make intended
        changes there. [Why clusters drift](/lesson/gx.declarative) explains why one source of truth per object
        makes later reconciliation predictable.
    - kind: show
      id: apply-dev
      body: "Apply the overlay, and wait for its two pods:"
      run: "oc apply -k lab/kustomize/overlays/dev && oc rollout status deployment/dev-catalog --timeout=180s"
      notice: "The Service and the Deployment are created, and the rollout reports success."
    - kind: show
      id: drift
      body: "Someone scales the Deployment by hand:"
      run: "oc scale deployment/dev-catalog --replicas=4"
      notice: "`scaled`. The live object no longer matches the overlay."
    - kind: show
      id: diff-apply
      run: "oc diff -k lab/kustomize/overlays/dev"
      notice: |
        In `oc diff`, lines starting with `-` are the live object and lines starting with `+` are the object as it
        would be after applying the source: `replicas` is 4 live and 2 in the overlay, and `generation` would go up
        because the spec would change. The command exited with status 1, which means "differences found".
    - kind: ask
      id: guess-reapply
      guess: true
      prompt: "After the hand-made scale, you apply the dev overlay again. What does oc apply report for the two objects?"
      choices:
        - text: "Service unchanged, Deployment configured"
          why: "Apply compares the overlay with each live object and sends only what differs: the Service matches, the Deployment's replicas do not."
        - text: "Both configured: apply rewrites every object"
          why: "Apply is declarative: an object that already matches its source is left alone and reported unchanged."
        - text: "Both unchanged: apply keeps hand-made edits"
          why: "The overlay declares two replicas, so apply sets that field back. Only fields the source does not set are left as they are."
      answer: 0
    - kind: show
      id: reapply
      run: "oc apply -k lab/kustomize/overlays/dev"
      notice: "`service/dev-catalog unchanged`, `deployment.apps/dev-catalog configured`: only the drifted field was sent back."
    - kind: show
      id: diff-clean
      run: "oc diff -k lab/kustomize/overlays/dev && echo 'no difference (exit 0)'"
      notice: "The diff printed nothing and exited 0: no difference left."
    - kind: try
      id: compare-prod
      body: From the repository root, the valid local prod overlay exists and its objects are deployed in team-prod.
        Compare desired and live state without applying.
      accept:
        - oc diff -k lab/kustomize/overlays/prod -n team-prod
        - oc diff -k lab/kustomize/overlays/prod/ -n team-prod
        - oc diff -n team-prod -k lab/kustomize/overlays/prod
        - oc -n team-prod diff -k lab/kustomize/overlays/prod
        - oc diff --kustomize=lab/kustomize/overlays/prod --namespace=team-prod
        - oc diff --kustomize lab/kustomize/overlays/prod --namespace team-prod
        - oc diff -k lab/kustomize/overlays/prod --namespace team-prod
        - oc --namespace team-prod diff -k lab/kustomize/overlays/prod
        - oc diff -k lab/kustomize/overlays/prod --namespace=team-prod
        - oc --namespace=team-prod diff -k lab/kustomize/overlays/prod
        - oc -n team-prod diff -k lab/kustomize/overlays/prod/
        - oc diff -k lab/kustomize/overlays/prod/ --namespace team-prod
        - oc --namespace team-prod diff -k lab/kustomize/overlays/prod/
        - oc diff -k lab/kustomize/overlays/prod/ --namespace=team-prod
        - oc --namespace=team-prod diff -k lab/kustomize/overlays/prod/
        - oc diff --namespace team-prod -k lab/kustomize/overlays/prod
        - oc diff --namespace=team-prod -k lab/kustomize/overlays/prod
        - oc diff --kustomize lab/kustomize/overlays/prod -n team-prod
        - oc diff -n team-prod --kustomize lab/kustomize/overlays/prod
        - oc -n team-prod diff --kustomize lab/kustomize/overlays/prod
        - oc diff --namespace team-prod --kustomize lab/kustomize/overlays/prod
        - oc --namespace team-prod diff --kustomize lab/kustomize/overlays/prod
        - oc diff --kustomize lab/kustomize/overlays/prod --namespace=team-prod
        - oc diff --kustomize=lab/kustomize/overlays/prod -n team-prod
        - oc -n team-prod diff --kustomize=lab/kustomize/overlays/prod
        - oc diff --kustomize=lab/kustomize/overlays/prod --namespace team-prod
        - oc --namespace team-prod diff --kustomize=lab/kustomize/overlays/prod
        - oc diff -k=lab/kustomize/overlays/prod -n team-prod
        - oc -n team-prod diff -k=lab/kustomize/overlays/prod
        - oc diff -k=lab/kustomize/overlays/prod --namespace team-prod
        - oc --namespace team-prod diff -k=lab/kustomize/overlays/prod
        - oc diff -k=lab/kustomize/overlays/prod --namespace=team-prod
        - oc diff --kustomize=lab/kustomize/overlays/prod/ -n team-prod
        - oc -n team-prod diff --kustomize=lab/kustomize/overlays/prod/
        - oc diff --kustomize=lab/kustomize/overlays/prod/ --namespace team-prod
        - oc --namespace team-prod diff --kustomize=lab/kustomize/overlays/prod/
        - oc diff --kustomize=lab/kustomize/overlays/prod/ --namespace=team-prod
        - oc diff -k=lab/kustomize/overlays/prod/ -n team-prod
        - oc -n team-prod diff -k=lab/kustomize/overlays/prod/
        - oc diff -k=lab/kustomize/overlays/prod/ --namespace team-prod
        - oc --namespace team-prod diff -k=lab/kustomize/overlays/prod/
        - oc diff -k=lab/kustomize/overlays/prod/ --namespace=team-prod
        - oc diff --kustomize=./lab/kustomize/overlays/prod -n team-prod
        - oc -n team-prod diff --kustomize=./lab/kustomize/overlays/prod
        - oc diff --kustomize=./lab/kustomize/overlays/prod --namespace team-prod
        - oc --namespace team-prod diff --kustomize=./lab/kustomize/overlays/prod
        - oc diff --kustomize=./lab/kustomize/overlays/prod --namespace=team-prod
        - oc diff -k=./lab/kustomize/overlays/prod -n team-prod
        - oc -n team-prod diff -k=./lab/kustomize/overlays/prod
        - oc diff -k=./lab/kustomize/overlays/prod --namespace team-prod
        - oc --namespace team-prod diff -k=./lab/kustomize/overlays/prod
        - oc diff -k=./lab/kustomize/overlays/prod --namespace=team-prod
      hints:
        - match: ^oc apply
          say: Apply would submit changes. Diff compares without persisting the desired objects.
        - match: ^oc diff -f
          say: The target is a kustomization directory, not an already-rendered YAML file. Use the kustomization
            option.
        - match: ^oc kustomize
          say: Rendering shows desired YAML only. Diff also asks the cluster for the live objects to compare.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n team-prod the comparison uses your current project, so it would compare against the wrong objects.
      hint: Use diff with -k for the directory and -n for team-prod.
      then: |
        The comparison would show differences without applying them. Exit 1 means drift was found; a higher code means the comparison failed and should not be treated as an ordinary difference.
    - kind: teach
      id: helm-in-one-minute
      title: A chart exposes options as values
      body: |
        A Helm **chart** packages metadata in `Chart.yaml`, defaults in `values.yaml`, and Go templates in `templates/`.
        Like a [Template](/lesson/n.templates), it fills your values into manifests; unlike a Template, an installed chart
        is recorded as a release with numbered revisions. Install the Helm CLI separately. Helm 3 runs nothing in the
        cluster: it acts with your own login, so RBAC limits what a chart can create.

        Values merge from chart defaults, then each `-f` file in order (rightmost wins), then `--set` overrides.
        `helm show values CHART` reveals defaults; `helm template NAME CHART` renders locally without installing a release.

        Helm also has cluster lifecycle commands. An install or upgrade applies resources and stores a named
        **release**, unlike a local template render. Rendering and managing a release are two uses of Helm, not the same operation.
    - kind: show
      id: helm-render
      run: "helm template demo lab/chart"
      notice: |
        The rendered Deployment is demo-greeter with one replica and the default greeting. These labels in rendered YAML do not prove a Helm release exists; template only prints manifests.
    - kind: ask
      id: values-precedence
      prompt: Defaults say 1; team.yaml says 2; prod.yaml says 4. Rendering with -f team.yaml -f prod.yaml --set
        replicas=3 produces what?
      choices:
        - text: Four replicas
          why: That would win among these files without --set. The command-line override has higher precedence.
        - text: Three replicas
          why: The --set value takes precedence over both files; among files the rightmost would otherwise win.
        - text: Two replicas
          why: The first values file does not freeze a value; later files and --set can override it.
      answer: 1
    - kind: try
      id: render-chart
      body: From the repository root, lab/chart/ and prod.yaml exist. With Helm 3, render release name preview using
        prod.yaml, then override replicas to 3. Do not install.
      accept:
        - helm template preview lab/chart -f prod.yaml --set replicas=3
        - helm template preview lab/chart --set replicas=3 -f prod.yaml
        - helm template preview ./lab/chart -f prod.yaml --set replicas=3
        - helm template preview lab/chart/ -f prod.yaml --set replicas=3
        - helm template preview lab/chart --values prod.yaml --set replicas=3
        - helm template preview lab/chart --values=prod.yaml --set=replicas=3
        - helm template preview lab/chart -f ./prod.yaml --set replicas=3
        - helm template preview lab/chart -f prod.yaml --set=replicas=3
        - helm template preview lab/chart --set=replicas=3 -f prod.yaml
        - helm template preview lab/chart --set replicas=3 --values prod.yaml
        - helm template preview lab/chart --values prod.yaml --set=replicas=3
        - helm template preview lab/chart --set=replicas=3 --values prod.yaml
        - helm template preview lab/chart --values=prod.yaml --set replicas=3
        - helm template preview lab/chart --set replicas=3 --values=prod.yaml
        - helm template preview lab/chart --set=replicas=3 --values=prod.yaml
        - helm template preview ./lab/chart --set replicas=3 -f prod.yaml
        - helm template preview ./lab/chart -f prod.yaml --set=replicas=3
        - helm template preview ./lab/chart --set=replicas=3 -f prod.yaml
        - helm template preview ./lab/chart --values prod.yaml --set replicas=3
        - helm template preview ./lab/chart --set replicas=3 --values prod.yaml
        - helm template preview ./lab/chart --values prod.yaml --set=replicas=3
        - helm template preview ./lab/chart --set=replicas=3 --values prod.yaml
        - helm template preview ./lab/chart --values=prod.yaml --set replicas=3
        - helm template preview ./lab/chart --set replicas=3 --values=prod.yaml
        - helm template preview ./lab/chart --values=prod.yaml --set=replicas=3
        - helm template preview ./lab/chart --set=replicas=3 --values=prod.yaml
        - helm template preview lab/chart/ --set replicas=3 -f prod.yaml
        - helm template preview lab/chart/ -f prod.yaml --set=replicas=3
        - helm template preview lab/chart/ --set=replicas=3 -f prod.yaml
        - helm template preview lab/chart/ --values prod.yaml --set replicas=3
        - helm template preview lab/chart/ --set replicas=3 --values prod.yaml
        - helm template preview lab/chart/ --values prod.yaml --set=replicas=3
        - helm template preview lab/chart/ --set=replicas=3 --values prod.yaml
        - helm template preview lab/chart/ --values=prod.yaml --set replicas=3
        - helm template preview lab/chart/ --set replicas=3 --values=prod.yaml
        - helm template preview lab/chart/ --values=prod.yaml --set=replicas=3
        - helm template preview lab/chart/ --set=replicas=3 --values=prod.yaml
        - helm template preview ./lab/chart/ -f prod.yaml --set replicas=3
        - helm template preview ./lab/chart/ --set replicas=3 -f prod.yaml
        - helm template preview ./lab/chart/ -f prod.yaml --set=replicas=3
        - helm template preview ./lab/chart/ --set=replicas=3 -f prod.yaml
        - helm template preview ./lab/chart/ --values prod.yaml --set replicas=3
        - helm template preview ./lab/chart/ --set replicas=3 --values prod.yaml
        - helm template preview ./lab/chart/ --values prod.yaml --set=replicas=3
        - helm template preview ./lab/chart/ --set=replicas=3 --values prod.yaml
        - helm template preview ./lab/chart/ --values=prod.yaml --set replicas=3
        - helm template preview ./lab/chart/ --set replicas=3 --values=prod.yaml
        - helm template preview ./lab/chart/ --values=prod.yaml --set=replicas=3
        - helm template preview ./lab/chart/ --set=replicas=3 --values=prod.yaml
        - helm template -f prod.yaml --set replicas=3 preview lab/chart
        - helm template --set replicas=3 -f prod.yaml preview lab/chart
        - helm template -f prod.yaml preview lab/chart --set replicas=3
        - helm template --set replicas=3 preview lab/chart -f prod.yaml
        - helm template --values prod.yaml --set replicas=3 preview lab/chart
        - helm template --set replicas=3 --values prod.yaml preview lab/chart
        - helm template --values prod.yaml preview lab/chart --set replicas=3
        - helm template --set replicas=3 preview lab/chart --values prod.yaml
        - helm template --values=prod.yaml --set replicas=3 preview lab/chart
        - helm template -f prod.yaml --set=replicas=3 preview lab/chart
        - helm template --values prod.yaml --set=replicas=3 preview lab/chart
      hints:
        - match: ^helm (install|upgrade)
          say: Those commands manage a release in a cluster. Template renders locally for review.
        - match: '^helm template.*--set replicas:'
          say: --set takes a key=value assignment. A colon is YAML syntax inside a values file.
        - match: ^helm template.*-f lab/chart
          say: The chart is a positional argument. The -f option names a values file, not the chart directory.
      hint: Use helm template with the name, chart directory, values file and a replicas=3 override.
      run: "helm template preview lab/chart -f prod.yaml --set replicas=3"
      then: |
        `replicas: 3`: the `--set` value won over the 2 in `prod.yaml`, and the message comes from `prod.yaml`. No
        release or history was created by this render.
    - kind: teach
      id: release-lifecycle
      title: Install, change, then inspect history
      body: |
        With Helm 3, an install creates revision 1. An upgrade creates a new revision; inspect it with `helm history`.
        Helm's default release storage is Secrets in the release namespace. `helm get values` reads supplied values;
        `helm get manifest` reads the release's rendered manifest.

        `helm upgrade --install` installs when absent and upgrades when present. Pass the reviewed complete values file
        on each run so the intended configuration is reproducible. Check the chart's behavior and health, not only
        whether the Helm command returned successfully.
    - kind: show
      id: release-install
      run: "helm install demo lab/chart"
      notice: "Release `demo`, `STATUS: deployed`, `REVISION: 1`, in the current project. `deployed` means Helm applied the manifests; it waits for the pods to become ready only when you add `--wait`."
    - kind: show
      id: release-upgrade
      run: "helm upgrade demo lab/chart --set replicas=2 --set message=hello-v2"
      notice: "`REVISION: 2`. The values given here are recorded with the revision."
    - kind: show
      id: release-values
      run: "helm get values demo"
      notice: "The user-supplied values of the current revision: `message: hello-v2` and `replicas: 2`. The chart's defaults are not repeated."
    - kind: show
      id: release-secrets
      body: "Where Helm keeps the history: one Secret per revision, in the release's namespace."
      run: "oc get secrets -l owner=helm"
      notice: |
        `sh.helm.release.v1.demo.v1` and `.v2`, of type `helm.sh/release.v1`. Each holds one revision's record: the chart,
        its rendered manifests and the values you supplied, compressed and base64-encoded, not encrypted. The project
        `view` role cannot read Secrets, but `edit` and `admin` can, and so can read every value passed with `--set`.
        Keep passwords out of values, or treat release access as access to them.
    - kind: ask
      id: who-reads-values
      prompt: "A colleague has the edit role in this project. Can they read a password you passed to helm upgrade with --set?"
      choices:
        - text: "Yes: edit can read Secrets, including the release"
          why: "The release record in the Secret contains the supplied values. Whoever may read Secrets in the project may read them."
        - text: "No: Helm encrypts the release before storing it"
          why: "Helm compresses and base64-encodes the record; that is encoding, not encryption. Anyone allowed to read the Secret can decode it."
        - text: "No: only the user who ran the upgrade can read it"
          why: "A release belongs to the namespace, not to a person. Access is decided by RBAC on Secrets in that namespace."
      answer: 0
    - kind: teach
      id: rollback
      title: A rollback is another revision
      body: |
        `helm rollback NAME 1` reapplies revision 1's recorded configuration and manifests and creates a new revision.
        After an install and one upgrade, rolling back to 1 creates revision 3. It does not rewrite the old history.

        Manifests are not database contents. A rollback can restore an image or declared replica count, but it cannot
        reverse a schema migration or restore volume data. Check data compatibility and a recovery procedure before
        treating a manifest rollback as a service recovery plan.
    - kind: show
      id: rollback-run
      run: "helm rollback demo 1"
      notice: "`Rollback was a success!`: Helm applied revision 1's recorded manifests as a new revision. Like `deployed`, it does not say the pods are ready: check the rollout as after any change."
    - kind: show
      id: history-after-rollback
      run: "helm history demo"
      notice: |
        Revisions 1 and 2 superseded, then revision 3 deployed with the description `Rollback to 1`. Helm added a
        record rather than reactivating revision 1 in place.
    - kind: ask
      id: rollback-data
      prompt: Revision 3 reapplies an earlier application image. Has that restored the database’s earlier contents?
      choices:
        - text: No; manifests and data have separate recovery
          why: Helm history describes release resources. Data needs an application-aware recovery procedure and
            compatible schema.
        - text: Yes; the release Secret contains every volume
          why: Helm stores release information, not a snapshot of the data in every persistent volume.
        - text: Yes; rollback restarts all database storage
          why: Recreating or restarting workloads does not reverse stored application writes.
      answer: 0
    - kind: try
      id: rollback-other-release
      body: In team-apps, Helm release payments has revisions 1 and 2 and the team approved manifest rollback to
        1. Type the Helm 3 command with an explicit namespace.
      accept:
        - helm rollback payments 1 -n team-apps
        - helm rollback payments 1 --namespace team-apps
        - helm rollback payments 1 --namespace=team-apps
        - helm -n team-apps rollback payments 1
        - helm rollback -n team-apps payments 1
        - helm rollback payments -n team-apps 1
        - helm --namespace team-apps rollback payments 1
        - helm --namespace=team-apps rollback payments 1
        - helm rollback --namespace team-apps payments 1
        - helm rollback --namespace=team-apps payments 1
        - helm rollback payments --namespace team-apps 1
        - helm rollback payments --namespace=team-apps 1
      hints:
        - match: ^helm rollback payments 2
          say: Revision 2 is the current revision in this scenario. The approved target is 1.
        - match: ^helm (install|upgrade)
          say: Those commands use a chart input. Rollback selects a saved release revision.
        - match: ^helm rollback 1
          say: The release name comes before its revision number.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n team-apps Helm looks for the release payments in your current namespace. Releases are stored per namespace.
      hint: Use helm rollback, the payments release name, revision 1 and team-apps as the namespace.
      then: |
        Helm would create revision 3 using revision 1’s recorded content. Verify workload health and schema compatibility separately; the command does not restore application data.
    - kind: teach
      id: owners
      title: Choose who manages the objects
      body: |
        Helm 3 uses the previous manifest, live object and new manifest to patch a release during upgrade or rollback.
        It can correct a chart-declared replica count changed by hand, but it does not continuously watch between commands.
        Fields the chart does not set can be preserved by the merge.

        [Argo CD](/lesson/gx.argocd), taught later in the course, renders charts with `helm template` and manages the resulting objects itself. That
        creates no Helm release for the application, so `helm list` does not list it as one. Decide whether Helm CLI or Argo CD manages
        that lifecycle; avoid competing sources for the same object.
    - kind: ask
      id: drift-repair
      prompt: A Helm 3 chart declares three replicas and someone scales the Deployment to zero. When does Helm put three back?
      choices:
        - text: As soon as it changes; Helm watches its objects
          why: Helm has no controller. Between commands, nothing watches the release's objects.
        - text: At the next upgrade or rollback of the release
          why: The three-way merge runs then, and the replica count the chart declares is applied again.
        - text: When helm history reads the release
          why: helm history only reads the stored revision records. It changes no objects.
      answer: 1
    - kind: teach
      id: uninstall
      title: Removal has exceptions to inspect
      body: |
        By default `helm uninstall NAME` removes release-managed resources and history; `--keep-history` preserves
        release records. It is not a guarantee of an empty namespace.

        Hook resources, such as migration Jobs, have their own cleanup policies. Objects marked
        `helm.sh/resource-policy: keep` may be retained. CRDs from `crds/` are not upgraded or deleted by Helm. PVCs
        created from a StatefulSet template normally survive under its default retention policy.

        Review retained resources and data before reuse or reinstall.
    - kind: show
      id: uninstall-run
      run: "helm uninstall demo && helm list && oc get secrets -l owner=helm; oc get deployment dev-catalog"
      notice: "`release \"demo\" uninstalled`; `helm list` prints only its header, and the release Secrets are gone with the history. The last command still lists the Kustomize Deployment `dev-catalog`: it was never part of the release, so it stays."
    - kind: reflect
      id: choose-tools
      prompt: Your own service differs by environment; a vendor database ships a supported chart. Explain a source
        and lifecycle choice for each.
      model: |
        Use a plain-YAML base and reviewed overlays for the service’s small differences, and keep a reviewed values file for the vendor chart. Render either before applying. Choose one lifecycle owner for each object; Argo CD can render both without a Helm release. Keep data recovery separate from manifest rollback.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can compose and render an overlay, keep selectors stable, explain a generated configuration rollout,
        compare desired and live objects, render chart values, and follow Helm revisions through a rollback.
        You can also choose one lifecycle owner and identify resources or data that removal does not clean up.

        The packaging lab and Helm challenge let you apply those ideas. Next, the administration path
        moves to operators and maintenance with [Operator Lifecycle Manager](/lesson/c.olm), which installs and updates
        add-ons from published packages.
  sections:
    - id: tool-reference
      title: Choosing tools and Kustomize transformations
      depth: true
      body: |
        | Need | Useful approach |
        |---|---|
        | Own service with small per-environment differences | plain manifests plus Kustomize overlays |
        | Vendor package with exposed options | supported Helm chart plus a reviewed values file |
        | Named CLI-managed release and history | Helm install/upgrade/rollback |
        | Chart requiring an additional patch | Helm post-renderer or Kustomize helmCharts with Helm integration enabled |
        | Continuous reconciliation from Git | Argo CD renders either; it owns the application lifecycle |
        | One small object | plain YAML may be enough |

        | Kustomize field or operation | Effect and boundary |
        |---|---|
        | resources | manifests or other kustomization directories |
        | namePrefix/nameSuffix | rename and rewrite recognized references; inspect custom APIs |
        | labels | metadata labels; includeSelectors and includeTemplates control additional changes |
        | images | image name/tag/digest replacement |
        | configMapGenerator/secretGenerator | content-derived objects with hash suffix by default |
        | patches | targeted strategic-merge or JSON 6902 modifications |
        | render / apply -k / diff -k / delete -k | compose / submit / compare / remove currently rendered objects |

        An overlay does not automatically prune obsolete generated ConfigMaps. Disabling the content hash means a
        configuration update alone need not change a Deployment template. For production, pin images to reviewed
        immutable versions or digests rather than a moving tag.
    - id: helm-reference
      title: Helm 3 lifecycle and retained resources
      depth: true
      body: |
        | Operation | Meaning |
        |---|---|
        | helm template | render without creating a release |
        | helm install | create a release, normally revision 1; success does not by itself certify application readiness |
        | helm upgrade --install | install if absent, otherwise update the release |
        | helm history | revision records; upgrade history limit defaults to 10, configurable with --history-max |
        | helm rollback NAME REVISION | restore recorded release content as a new revision; not data restore |
        | helm get values / get manifest | supplied values / recorded manifests |
        | helm uninstall | delete managed release resources and history unless --keep-history |

        Helm 3 stores release Secrets named `sh.helm.release.v1.<name>.v<N>` in the release namespace by default.
        Values precedence is defaults, ordered `-f` files, then `--set`; upgrade flags such as --reuse-values and
        --reset-values alter reuse behavior, so keep a full reviewed values file and state which policy you use.

        | Possible leftover | Why |
        |---|---|
        | Hook resources | not tracked like ordinary release resources; need hook delete policy or a Job TTL |
        | Objects with resource-policy keep | skipped by deletion policy; can become orphaned when release ownership ends |
        | CRDs installed from crds/ | not upgraded or deleted by Helm; CRs require their own lifecycle decision |
        | StatefulSet-generated PVCs | default retention keeps them; a configured PVC retention policy can differ |
        | Application data | release history is not a data backup |

        Helm 4 retains chart compatibility but has behavior differences: new releases use server-side apply by default;
        --atomic is renamed --rollback-on-failure with deprecated compatibility. The existing lab uses Helm 3.17.1;
        do not assume every Helm 3 merge/flag explanation describes a Helm 4 release.
    - id: packaging-diagnosis
      title: Drift, ownership and packaging failures
      depth: true
      body: |
        | Evidence | Interpretation and action |
        |---|---|
        | diff exit 1 | desired/live differences; review before apply |
        | diff exit above 1 | comparison error; repair access, input or connectivity |
        | Deployment selector immutable | label transformation changed pod identity; stabilize selectors or design a new Deployment |
        | cannot re-use a name still in use | existing Helm release, possibly failed; inspect all release statuses and choose upgrade or planned removal |
        | object exists, invalid ownership metadata | an object is not owned as expected; decide its owner before adoption |
        | manual chart-defined replica count returns | Helm upgrade/rollback or GitOps applied the source again |
        | rollout did not occur after config edit | inspect generated name and the pod-template reference |
        | rollback succeeded but data is wrong | manifests rolled back, data did not; use the application’s recovery procedure |

        Helm checks ownership metadata including `app.kubernetes.io/managed-by: Helm` and release name/namespace
        annotations. Helm 3.17 introduced --take-ownership to skip that check on install/upgrade. It transfers
        responsibility; it is not a routine response to a naming collision. Argo CD reports drift continuously,
        while Helm CLI and one-time apply only act when invoked. Avoid having both reconcile the same declared fields.
  review:
    - q: Which Kustomize field changes the names of every resource in an overlay?
      a: namePrefix or nameSuffix rename resources and rewrite references Kustomize recognizes. Inspect custom-resource
        fields rather than assuming every string reference is rewritten.
    - q: Where does Helm 3 store release history?
      a: In Secrets (sh.helm.release.v1.<name>.v<N>) in the release's namespace.
    - q: Why does `helm list` show nothing for a chart deployed by Argo CD?
      a: Argo CD renders the chart with helm template and applies the YAML itself; no Helm release is recorded.
    - q: What survives `helm uninstall`?
      a: Possible leftovers include hook resources, kept objects, CRDs from crds/, and StatefulSet PVCs under the
        default retention policy. History is removed unless --keep-history. Data needs its own retention/recovery
        plan.
    - q: Why does a configMapGenerator change trigger a rollout?
      a: A content change gives a new generated name. If the Deployment pod template references it, Kustomize rewrites
        the reference; applying that changed template triggers a rollout.
  files:
    lab/kustomize/base/kustomization.yaml: |
      resources:
        - deployment.yaml
        - service.yaml
      labels:
        - pairs: {app.kubernetes.io/part-of: shop}
          includeSelectors: false
    lab/kustomize/base/deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog
      spec:
        replicas: 1
        selector:
          matchLabels: {app: catalog}
        template:
          metadata:
            labels: {app: catalog}
          spec:
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
    lab/kustomize/base/service.yaml: |
      apiVersion: v1
      kind: Service
      metadata:
        name: catalog
      spec:
        selector: {app: catalog}
        ports: [{port: 8080, targetPort: 8080}]
    lab/kustomize/overlays/dev/kustomization.yaml: |
      resources:
        - ../../base
      namePrefix: dev-
      labels:
        - pairs: {env: dev}
          includeSelectors: false
      patches:
        - target: {kind: Deployment, name: catalog}
          patch: |
            - op: replace
              path: /spec/replicas
              value: 2
    lab/chart/Chart.yaml: |
      apiVersion: v2
      name: greeter
      description: A tiny chart for the academy
      version: 0.1.0
      appVersion: "1.0"
    lab/chart/values.yaml: |
      replicas: 1
      message: hello from helm
    lab/chart/templates/deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .Release.Name }}-greeter
        labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/managed-by: {{ .Release.Service }}}
      spec:
        replicas: {{ .Values.replicas }}
        selector:
          matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
        template:
          metadata:
            labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
          spec:
            containers:
            - name: greeter
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command:
              - sh
              - -c
              - echo {{ .Values.message | quote }}; sleep infinity
              resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
    lab/kustomize/overlays/prod/kustomization.yaml: |
      resources:
        - ../../base
      namePrefix: prod-
      labels:
        - pairs: {env: prod}
          includeSelectors: false
      patches:
        - target: {kind: Deployment, name: catalog}
          patch: |
            - op: replace
              path: /spec/replicas
              value: 3
    prod.yaml: |
      replicas: 2
      message: hello from production
  commands:
    - {cmd: "oc kustomize lab/kustomize/overlays/dev", meaning: "render the dev overlay locally"}
    - {cmd: "oc kustomize lab/kustomize/overlays/prod", meaning: "render the prod overlay locally"}
    - {cmd: "oc apply -k lab/kustomize/overlays/dev && oc rollout status deployment/dev-catalog --timeout=180s", timeout: 240, meaning: "apply the overlay and wait for the rollout"}
    - {cmd: "oc scale deployment/dev-catalog --replicas=4", meaning: "drift: a manual change"}
    - {cmd: "oc diff -k lab/kustomize/overlays/dev", expect: fail, meaning: "live versus desired; exit 1 means differences"}
    - {cmd: "oc apply -k lab/kustomize/overlays/dev", meaning: "apply the source again"}
    - {cmd: "oc diff -k lab/kustomize/overlays/dev && echo 'no difference (exit 0)'", meaning: "no difference left"}
    - {cmd: "helm template demo lab/chart", meaning: "render the chart locally"}
    - {cmd: "helm template preview lab/chart -f prod.yaml --set replicas=3", meaning: "render with a values file and an override"}
    - {cmd: "helm install demo lab/chart", meaning: "install release demo, revision 1"}
    - {cmd: "helm upgrade demo lab/chart --set replicas=2 --set message=hello-v2", meaning: "upgrade: revision 2"}
    - {cmd: "helm get values demo", meaning: "the supplied values of the current revision"}
    - {cmd: "oc get secrets -l owner=helm", meaning: "the release history Secrets"}
    - {cmd: "helm rollback demo 1", meaning: "roll back to revision 1: a new revision 3"}
    - {cmd: "helm history demo", meaning: "the revisions"}
    - {cmd: "helm uninstall demo && helm list && oc get secrets -l owner=helm; oc get deployment dev-catalog", meaning: "remove the release and its history; the Kustomize Deployment stays"}
