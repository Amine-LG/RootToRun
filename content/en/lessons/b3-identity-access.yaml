      hints:
        - match: "can-i"
          say: "`can-i` answers for one identity. To list who may do something, use `who-can`."
        - match: "imagestreams?/layers"
          say: "A subresource is a separate option here: `--subresource=layers`, not part of the resource name."
        - match: "who-can get (imagestreams?|is)$"
          say: "That asks who may read the ImageStreams themselves. Add `--subresource=layers` for the layers that a pull reads."
        - match: "who-can (list|update|create)"
          say: "A pull is a `get`. A push would be `update`."
      hint: "`oc policy who-can get imagestreams`, then `--subresource=layers`."
      run: "oc adm policy who-can get imagestreams --subresource=layers | grep -E 'academy-lesson|^Groups|^Resource'"
      then: |
        The recording filters to project-related lines and headings. `Resource` is
        `imagestreams.image.openshift.io/layers`. `builder`, `editor` and `viewer` appear by name through direct
        bindings; `default` is covered by `system:serviceaccounts:academy-lesson-l-image-pullers`.

        The filter also drops evaluation warnings. For an audit, inspect the unfiltered answer and resolve any
        incomplete-results warning, as in [RBAC and effective permissions](/lesson/f.rbac). A filtered excerpt
        cannot establish a complete access inventory.
    - kind: teach
      id: other-projects
      title: "A pod from another project"
      body: |
        A pod in `shop` pulls from `base-images`. The default binding of `shop` covers pulls from `shop`.
        For `base-images`, the **source** project must grant it: bind `system:image-puller` there to
        `shop`'s ServiceAccount. A recording in one temporary project cannot show what happens without that
        grant, so the steps below are quoted from the course's lab, which used two projects:

        Why "uncached" below: on OpenShift 4.21, as recorded here, a node that already holds the image can start a
        new pod from it without checking that pod's pull credentials. OpenShift 4.22 switches the kubelet's credential
        check for cached images on by default (feature gate `KubeletEnsureSecretPulledImages`); administrators choose
        how strict it is with `imagePullCredentialsVerificationPolicy` in a KubeletConfig (4.22 release notes, Nodes).
    - kind: ask
      id: guess-no-grant
      guess: true
      prompt: |
        A new pod pulls an uncached image through the integrated registry from another project. Its account lacks pull permission there. What happens?
      choices:
        - text: "The image is pulled: the registry belongs to the same cluster"
          why: "Being in the same cluster gives no access. The registry makes an RBAC check for every pull, per project."
        - text: "The pod is created, then sits in `ImagePullBackOff`"
          why: "Admission does not check image access. The node tries to pull, the registry checks RBAC in `base-images`, and without a grant the answer is no."
        - text: "The pod is refused at admission and never created"
          why: "Admission does not evaluate registry permissions. The failure happens at pull time, on the node."
      answer: 1
    - kind: show
      id: lab-denied
      code: |
        $ oc get pods -l app=consumer -n academy-img-use
        NAME                        READY   STATUS             RESTARTS   AGE
        consumer-655b8674dd-fdxx4   0/1     ImagePullBackOff   0          7s
        $ oc get events -n academy-img-use --field-selector reason=Failed
        LAST SEEN   TYPE      REASON   OBJECT                          MESSAGE
        5s          Warning   Failed   pod/consumer-655b8674dd-fdxx4   Failed to pull image "image-registry.openshift-image-registry.svc:5000/academy-img-src/minimal:latest": unable to pull image or OCI artifact: pull image err: initializing source docker://image-registry.openshift-image-registry.svc:5000/academy-img-src/minimal:latest: reading manifest latest in image-registry.openshift-image-registry.svc:5000/academy-img-src/minimal: authentication required; artifact err: get manifest: build image source: reading manifest latest in image-registry.openshift-image-registry.svc:5000/academy-img-src/minimal: authentication required
        5s          Warning   Failed   pod/consumer-655b8674dd-fdxx4   Error: ErrImagePull
        3s          Warning   Failed   pod/consumer-655b8674dd-fdxx4   Error: ImagePullBackOff
      caption: "Recorded in the Image access across namespaces lab (lab.image-pullers): a Deployment in academy-img-use pulling an image from academy-img-src, before any grant."
      origin: lab
      notice: |
        `ImagePullBackOff`, and an event that says `authentication required` for the image in `academy-img-src`.
        Despite the wording, nothing is wrong with the credentials: the registry asked whether the pod's account
        may `get` `imagestreams/layers` in `academy-img-src`, and the answer was no.
    - kind: show
      id: lab-fixed
      code: |
        $ oc policy add-role-to-user system:image-puller system:serviceaccount:academy-img-use:default -n academy-img-src
        clusterrole.rbac.authorization.k8s.io/system:image-puller added: "system:serviceaccount:academy-img-use:default"
        $ oc rollout restart deploy/consumer -n academy-img-use
        deployment.apps/consumer restarted
        $ oc rollout status deploy/consumer -n academy-img-use --timeout=180s
        deployment "consumer" successfully rolled out
      caption: "Recorded in the Image access across namespaces lab (lab.image-pullers). The long progress lines of the rollout are left out."
      origin: lab
      notice: |
        One grant, in the **source** project (`-n academy-img-src`), to the consuming account (`academy-img-use`'s
        `default`), and the pod's credentials are unchanged. The restart makes the Deployment start a new pod, which
        retries the pull.
    - kind: ask
      id: auth-required-fix
      prompt: |
        New pods in `payments` fail to pull `ci-images/python:3.12` from the integrated registry, with `authentication required`. Which change fixes it?
      choices:
        - text: "In `ci-images`, grant `system:image-puller` to the pods' account"
          why: "The registry checks permission in the project that owns the image, and the pod's credentials are already valid. A grant there to the pulling account is the fix."
        - text: "In `payments`, add a pull secret holding your own token"
          why: "The message hides an RBAC refusal, not bad credentials. Your token would make the pod pull with your rights and your token's expiry: a credential leak, not a fix."
        - text: "In `payments`, grant `system:image-puller` to the pods' account"
          why: "The default binding in `payments` already covers pulls from `payments`. The check that fails is in `ci-images`, the project that owns the image."
      answer: 0
    - kind: try
      id: try-grant-foreign
      body: |
        In your project `academy-lesson-l-image-pullers`, let the ServiceAccount `default` of the project
        `shop` pull your images: bind `system:image-puller` to it, by its full name. Use the policy
        shortcut.
      accept:
        - "oc adm policy add-role-to-user system:image-puller system:serviceaccount:shop:default"
        - "oc adm policy add-role-to-user system:image-puller system:serviceaccount:shop:default --namespace academy-lesson-l-image-pullers"
        - "oc adm policy add-role-to-user system:image-puller system:serviceaccount:shop:default --namespace=academy-lesson-l-image-pullers"
        - "oc adm policy add-role-to-user system:image-puller system:serviceaccount:shop:default -n academy-lesson-l-image-pullers"
        - "oc policy add-role-to-user system:image-puller system:serviceaccount:shop:default"
        - "oc policy add-role-to-user system:image-puller system:serviceaccount:shop:default --namespace academy-lesson-l-image-pullers"
        - "oc policy add-role-to-user system:image-puller system:serviceaccount:shop:default --namespace=academy-lesson-l-image-pullers"
        - "oc policy add-role-to-user system:image-puller system:serviceaccount:shop:default -n academy-lesson-l-image-pullers"
        - "oc adm policy add-role-to-user system:image-puller system:serviceaccount:shop:default -n=academy-lesson-l-image-pullers"
        - "oc policy add-role-to-user system:image-puller system:serviceaccount:shop:default -n=academy-lesson-l-image-pullers"
      hints:
        - match: "-z default"
          say: "`-z` resolves the name in your own project, so this would grant the pull to your own `default`, which already has it. For another project's account, use the full name: `system:serviceaccount:shop:default`."
        - match: "add-role-to-group"
          say: "That would grant the pull to every account in a group, which is broader than one account needs. Name the single account."
        - match: "add-role-to-user (edit|view|admin)"
          say: "`edit` and `admin` would also allow pushing, and bring Secrets and more. `view` can pull but also reads the project. The narrow role is `system:image-puller`."
        - match: "add-role-to-user system:image-puller (shop:default|default)$"
          say: "A ServiceAccount's full name starts with `system:serviceaccount:`, then the project and the name."
      hint: "`oc policy add-role-to-user`, the role, then the account's full name."
      run: "oc policy add-role-to-user system:image-puller system:serviceaccount:shop:default; oc get rolebindings -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name"
      then: |
        The listing shows the result. The new binding is called `system:image-puller`, with the `shop` account as its
        subject, and sits one letter away from the default `system:image-pullers`. When you review a project's
        bindings, read the subject's namespace, not the binding's name.
    - kind: teach
      id: what-to-review
      title: "What to review"
      body: |
        - A ServiceAccount of another project can **pull** from yours: usually fine if intended, for shared base images.
        - A ServiceAccount of another project can **push** into yours: that project can change what yours runs.
          Rarely justified.
        - A whole group (`system:serviceaccounts`, `system:authenticated`) can pull: every workload on the cluster can.
        - Workloads that reference **mutable tags**: when the tag moves, a later pull or rollout can run another image. Whether a
          restart fetches it depends on the pull policy and any image-change trigger.

        Push is a supply-chain control, so grant it as narrowly as any production change.
    - kind: ask
      id: push-grant
      prompt: "A CI ServiceAccount in `ci` must push images into `apps`, sometimes creating new ImageStreams. Which grant fits?"
      choices:
        - text: "`edit` in `apps` for that account"
          why: "`edit` also reads Secrets and changes workloads in `apps`: far more than a pipeline that pushes needs."
        - text: "`system:image-builder` in `apps` for the group `system:serviceaccounts:ci`"
          why: "The group includes every ServiceAccount in `ci`, now and later: any workload there could replace what `apps` runs."
        - text: "`system:image-builder` in `apps` for that one account"
          why: "It grants push on the layers and the creation of ImageStreams in `apps`, and little else there. Binding it to one account keeps the audience to the pipeline."
      answer: 2
    - kind: explore
      id: rbac-model
      sim: rbac
      body: "In the model, try the second challenge: with one RoleBinding in `team-a`, let every ServiceAccount of `team-b` pull images from `team-a`. Then ask as `team-b/builder`, an account you did not mean to include: the group grant reaches it too. While you are there, ask as `alice` in `team-b`, where her group has `view`: she can pull, but not push."
    - kind: reflect
      id: explain-auth-required
      prompt: |
        A peer engineer asks why the lab's `authentication required` error was an RBAC problem, and how you would fix it narrowly.
      model: |
        In this lab the kubelet used valid registry credentials from the pod's ServiceAccount. The
        integrated registry then asks the API server whether that identity may `get` `imagestreams/layers`
        in the namespace that holds the image, and when it may not, the pull fails with a message that says
        "authentication required". So the fix is authorization, in the source namespace: bind
        `system:image-puller` there to the one ServiceAccount that needs it. The kubelet retries
        automatically; a rollout restart starts a fresh attempt sooner. Pull secrets authenticate to the
        internal registry too, but replacing valid credentials does not fix a missing RBAC grant. Adding a
        person's token would only make the pod pull as that person.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can say what the internal registry checks, name the roles that carry pull and push, and
        investigate a failed cross-project pull by checking credentials and source-project permissions. You
        can grant one account in one project the pull, tell it apart from the default binding, and review
        who can pull or push: including that `view` and `cluster-reader` can already pull.

        This is the end of the access analysis lessons. Their three lessons answered one question from three
        directions: which path gives a permission, which paths outlive their subjects, and which grants let
        one project's accounts read or change another's images.

        Next, [NetworkPolicies and OVN-Kubernetes](/lesson/d.networkpolicy-ovn) moves from who may act on the
        cluster to which pods may talk to each other.
  sections:
    - id: roles-for-images
      title: "Roles for images, in one table"
      depth: true
      body: |
        | Role | Rules on images | Use it for |
        |---|---|---|
        | `system:image-puller` | `get` on `imagestreams/layers` | a consumer that runs images |
        | `system:image-pusher` | `get` and `update` on `imagestreams/layers` | a pipeline pushing into streams that already exist |
        | `system:image-builder` | the same, plus `create` on `imagestreams` and updating build details | a build or pipeline that may create new streams |
        | `edit`, `admin`, `registry-editor` | pull and push, plus much more | people managing the project, not pipelines |
    - id: who-can-already-pull
      title: "Who can already pull"
      depth: true
      body: |
        Some subjects can pull without any grant made for images, because a role they hold already includes `get` on
        `imagestreams/layers`:

        - **`view`, `edit` and `admin`** in a project, so everyone with a read grant on a project can pull its images.
          `view` gets the rule by aggregation from the `registry-viewer` ClusterRole, which OpenShift's bootstrap
          roles label `aggregate-to-view` (the recording shows the label on this cluster).
        - **`cluster-reader`**, which aggregates the same rule, so any identity bound to it cluster-wide (monitoring and
          inventory tools, the course's read-only reader identity) can pull every image stored in the internal
          registry. Read access to the cluster is therefore also read access to all internal images, and to whatever
          is baked into them.
        - **cluster-admin**, and any role that grants `*` on `*`.
        - `registry-viewer` granted with a ClusterRoleBinding, for registry tooling.

        Keep secrets out of images, and treat `cluster-reader` grants as a data-access decision.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Granting `edit` in A so a pipeline from B can push.** It brings Secrets, pods and everything else in A;
          `system:image-builder` is enough.
        - **Granting pulls to `system:serviceaccounts`.** Fine for a deliberately public base-image project, a leak for
          anything else.
        - **Confusing registry access with pull secrets.** Pull secrets authenticate to either internal or external registries.
          OpenShift RBAC authorizes access to the integrated registry; external registries use their own authorization.
        - **Reading "authentication required" literally.** For the internal registry it usually means the identity is
          known but not allowed: a missing `system:image-puller` grant.
  review:
    - {"q": "Which role allows pushing images into a namespace's ImageStreams?", "a": "system:image-builder in that namespace (admin, edit and registry-editor include push as well)."}
    - {"q": "Which RBAC check does the internal registry make for a pull?", "a": "get on imagestreams/layers in the image's namespace (update for a push)."}
    - {"q": "How do you list who can pull from a project?", "a": "oc adm policy who-can get imagestreams --subresource=layers -n <namespace>"}
    - {"q": "A pod pulling from another project fails with 'authentication required'. What is the fix?", "a": "Check registry credentials and source-project RBAC. For the demonstrated missing grant, bind system:image-puller in the source project to the consuming ServiceAccount. The kubelet retries; restarting the rollout can prompt a new attempt."}
    - {"q": "Which read roles can pull images without a registry-specific grant?", "a": "A project's view (and edit, admin) can pull that project's images, through the aggregated registry-viewer rules; cluster-reader can pull every project's."}
  commands:
    - {cmd: "oc get rolebindings -o wide", meaning: "the default bindings: system:image-pullers to the project's group and system:image-builders to the builder account"}
    - {cmd: "oc describe clusterrole system:image-puller", meaning: "the narrowest pull role: get on imagestreams/layers"}
    - {cmd: "oc tag registry.access.redhat.com/ubi9/ubi-minimal:latest minimal:latest --reference-policy=local; for i in $(seq 1 30); do oc get istag minimal:latest 2>/dev/null && break; sleep 2; done", meaning: "an ImageStream tag whose pods pull through the internal registry"}
    - {cmd: "oc create deployment consumer --image=image-registry.openshift-image-registry.svc:5000/academy-lesson-l-image-pullers/minimal:latest -- sleep infinity; oc rollout status deployment/consumer --timeout=180s; oc get pods -l app=consumer", meaning: "a pod in the same project pulls the image with no extra grant"}
    - {cmd: "oc create serviceaccount viewer; oc create serviceaccount editor; oc policy add-role-to-user view -z viewer; oc policy add-role-to-user edit -z editor; for sa in default builder viewer editor; do for v in get update; do echo -n \"$sa: $v layers -> \"; oc auth can-i $v imagestreams --subresource=layers --as=system:serviceaccount:academy-lesson-l-image-pullers:$sa; done; done", meaning: "who may pull (get) and push (update) the layers: every account can pull, only builder and editor can push"}
    - {cmd: "oc get clusterrole registry-viewer -o jsonpath='{.metadata.labels}'", meaning: "the label that aggregates registry-viewer into view"}
    - {cmd: "oc adm policy who-can get imagestreams --subresource=layers | grep -E 'academy-lesson|^Groups|^Resource'", meaning: "who may pull from the project, filtered to its own accounts and the group line"}
    - {cmd: "oc policy add-role-to-user system:image-puller system:serviceaccount:shop:default; oc get rolebindings -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name", meaning: "a pull grant to an account of another project, and the listing that shows its namespace"}
