    - kind: show
      id: api-as-reporter
      run: "oc exec deploy/web -- sh -c 'SA=/var/run/secrets/kubernetes.io/serviceaccount; curl -s --cacert $SA/ca.crt -H \"Authorization: Bearer $(cat $SA/token)\" https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/pods' | head -n 3"
      notice: "A `PodList`. The binding was in force as soon as it was created and needed no restart of its own; the new pods run as `reporter`."
    - kind: show
      id: api-secrets-as-reporter
      body: "And the neighbours of that grant, the Secrets of the project, are still closed:"
      run: "oc exec deploy/web -- sh -c 'SA=/var/run/secrets/kubernetes.io/serviceaccount; curl -s --cacert $SA/ca.crt -H \"Authorization: Bearer $(cat $SA/token)\" https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/secrets' | grep message"
      notice: "Now the message names `reporter`: the identity changed, and `view` does not include Secrets."
    - kind: teach
      id: other-projects
      title: "A ServiceAccount from another project"
      body: |
        The binding lives in the project where the access applies, which is not always the account's own project.
        Suppose a CI job runs as the ServiceAccount `deployer` of the project `ci`, and must update Deployments in
        yours. The `-z` option would resolve `deployer` in **your** project, which is a different account.
        For another project's account, give the full user name, `system:serviceaccount:<project>:<name>`.
    - kind: try
      id: try-grant-ci
      body: |
        In your project `academy-lesson-o2-service-accounts`, practise a deliberately broad cross-project
        grant: give the ServiceAccount `deployer` of the project `ci` the `edit` role. Use the policy
        shortcut.
      accept:
        - "oc adm policy add-role-to-user edit system:serviceaccount:ci:deployer"
        - "oc adm policy add-role-to-user edit system:serviceaccount:ci:deployer --namespace academy-lesson-o2-service-accounts"
        - "oc adm policy add-role-to-user edit system:serviceaccount:ci:deployer --namespace=academy-lesson-o2-service-accounts"
        - "oc adm policy add-role-to-user edit system:serviceaccount:ci:deployer -n academy-lesson-o2-service-accounts"
        - "oc policy add-role-to-user edit system:serviceaccount:ci:deployer"
        - "oc policy add-role-to-user edit system:serviceaccount:ci:deployer --namespace academy-lesson-o2-service-accounts"
        - "oc policy add-role-to-user edit system:serviceaccount:ci:deployer --namespace=academy-lesson-o2-service-accounts"
        - "oc policy add-role-to-user edit system:serviceaccount:ci:deployer -n academy-lesson-o2-service-accounts"
        - "oc adm policy add-role-to-user edit system:serviceaccount:ci:deployer -n=academy-lesson-o2-service-accounts"
        - "oc policy add-role-to-user edit system:serviceaccount:ci:deployer -n=academy-lesson-o2-service-accounts"
      hints:
        - match: "-z deployer"
          say: "`-z` resolves the name in your own project, so this would grant `edit` to your project's `deployer`, not to the CI job's account."
        - match: "add-role-to-group"
          say: "That grants `edit` to every ServiceAccount of `ci`, now and later: far more than one job needs. Name the single account."
        - match: "add-role-to-user edit (ci:deployer|deployer)$"
          say: "Without `system:serviceaccount:` in front, this names a *user*. A ServiceAccount's full name is `system:serviceaccount:<project>:<name>`."
        - match: "add-role-to-user (view|admin)"
          say: "The task asks for `edit`, the role that lets the CI job change workloads."
      hint: "`oc policy add-role-to-user edit`, then the account's full name."
      run: "oc policy add-role-to-user edit system:serviceaccount:ci:deployer"
      then: |
        The RoleBinding is created here, in your project, with a subject from `ci`. The project `ci` does not even
        need to exist for the binding to be accepted: bindings name subjects, they do not check them.
        `edit` includes Secrets and workload changes; for image-only automation, design a narrower Role as in
        [RBAC and effective permissions](/lesson/f.rbac), while accounting for pod-template access.
    - kind: ask
      id: borrow-identity
      prompt: "A teammate has `edit`, not `admin`, in your project. Can they obtain the API rights of the ServiceAccount `deploy-bot` there?"
      choices:
        - text: "No, only admins may run pods as a ServiceAccount"
          why: "Nothing in RBAC restricts which account a pod names. `edit` is enough, which is why a privileged ServiceAccount is only as safe as the project's editors."
        - text: "Yes, by creating a pod that runs as `deploy-bot`"
          why: "An editor can create a pod naming that ServiceAccount; if admission permits the pod, it receives that account's token. RBAC alone does not provide a separate permission check for selecting the account."
        - text: "Only if they first obtain the account's token"
          why: "They do not need an existing token: a new pod running as that account receives a fresh one."
      answer: 1
    - kind: teach
      id: tokens-outside
      title: "Tokens for scripts and the end of token Secrets"
      body: |
        Outside a pod, a script or a test can ask for a short-lived token with `oc create token <account>`
        (`--duration` requests a lifetime; the server decides the actual duration). It expires on its own;
        no Secret object is created. Without an object binding, deleting a pod does not revoke this token:
        deleting and recreating the ServiceAccount invalidates all tokens issued for the old account. The
        commands in this lesson that act as an account use it, inside `$(...)`, so that the token is never
        printed.

        Older clusters also generated a long-lived token Secret for every ServiceAccount, a credential that
        never expired. Kubernetes stopped generating them in 1.24, and OpenShift 4.16 stopped creating its
        own. OpenShift preserves existing ones on upgrade. Manually created long-lived API token Secrets
        remain possible, but short-lived TokenRequest tokens are preferred.
    - kind: show
      id: act-as-account
      run: "oc --token=\"$(oc create token reporter --duration=10m)\" whoami"
      notice: "The token proves who the caller is without ever being displayed: the output is the account's user name."
    - kind: show
      id: secrets-list
      body: "What the project holds, now that it has four ServiceAccounts:"
      run: "oc get secrets"
      notice: "Only `kubernetes.io/dockercfg` Secrets: one image pull secret per account, for the internal registry. There is no token Secret to find."
    - kind: ask
      id: old-token-script
      prompt: |
        On OpenShift 4.16 or later, a script finds no API token Secret for a new ServiceAccount. How should it obtain a token?
      choices:
        - text: "Request a short-lived token with `oc create token`"
          why: "Short-lived tokens expire on their own, which limits the damage if one leaks. A script that runs in a pod can use the pod's own projected token instead."
        - text: "Wait: the Secret is created a few minutes later"
          why: "It is never created: the automatic long-lived token Secret was removed."
        - text: "Use the account's image pull secret as an API token"
          why: "That Secret exists for the internal registry. It is not an API credential."
      answer: 0
    - kind: teach
      id: no-api-token
      title: "When the app does not call the API"
      body: |
        A web server that never calls the Kubernetes API does not need an automatically mounted API credential.
        Set `automountServiceAccountToken: false` on its pod spec or ServiceAccount; the pod's setting wins if
        both are present. The automatic credential volume is then omitted for new pods.

        This does not remove the account's RBAC grants or prevent an authorised client from requesting a token.
        It reduces the credentials available inside this workload. Image pulling still uses registry credentials
        independently of this API volume.
    - kind: explore
      id: rbac-model
      sim: rbac
      body: "In the model, try the second challenge: with one RoleBinding in `team-a`, let every ServiceAccount of `team-b` pull images from `team-a`. Ask as `team-b/default`, then as `team-b/builder`: the group reaches both. Then replace it with a binding to the single account `team-b/default` and ask as `team-b/builder` again."
    - kind: reflect
      id: explain-pod-identity
      prompt: "A junior developer asks how their pod authenticates to the OpenShift API, and how to give it only the rights it needs. Answer in a few sentences."
      model: |
        Your pod runs as a ServiceAccount, `default` unless the pod template sets `serviceAccountName`.
        Kubernetes mounts a token for it at `/var/run/secrets/kubernetes.io/serviceaccount/token`, bound to
        that pod and refreshed by the kubelet; client libraries pick it up automatically. The token only
        proves who the pod is. What it may do comes from RBAC: create a dedicated ServiceAccount, bind the
        smallest role that works to it with `oc policy add-role-to-user <role> -z <account>`, and check with
        `oc auth can-i <verb> <resource> --as=system:serviceaccount:<project>:<account>`. If the app gets a
        403, the message names the exact identity that was denied. Never grant to `default`, and, for an app
        that never calls the API, omit the automatic credential volume with `automountServiceAccountToken:
        false` on the pod or ServiceAccount (the pod setting takes precedence).
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can say which account a pod runs as and why it matters, read the token a pod holds and what limits it,
        reproduce a pod's 403 from its message, and fix it with a dedicated ServiceAccount, a binding and a template
        change. You can grant a role to an account of another project, and ask for a short-lived token when a script
        needs one.

        ServiceAccounts matter a second time: they also decide which pod security settings a pod may use, through
        security context constraints. The next lesson, [Security Context Constraints](/lesson/f.scc), teaches them,
        and the "Go deeper" section "Exceptions, done properly" shows how an administrator grants one to an account.
  sections:
    - id: exceptions-done-properly
      title: "Exceptions, done properly"
      depth: true
      body: |
        Read this after the SCC lesson. Before granting anything, run `oc adm policy scc-subject-review -f pod.yaml`
        to see which SCC would admit a spec, and prefer fixing the image or the securityContext.

        `oc adm policy add-scc-to-user anyuid -z <sa> -n <ns>` grants `use` of an SCC to one ServiceAccount. It is
        plain RBAC: with an explicit `-n` it creates a RoleBinding named `system:openshift:scc:anyuid` in that
        namespace; without `-n` it creates a ClusterRoleBinding of that name. A project admin cannot do it by
        default, because RBAC only lets you bind a role whose permissions you already hold. The SCC is chosen when
        a pod is admitted, so restart the workload after the grant. Remove the exception when it is no longer
        needed: `oc adm policy remove-scc-from-user`.

        Verify both sides of the grant:
        `oc auth can-i use securitycontextconstraints/anyuid --as=system:serviceaccount:<ns>:<sa> -n <ns>` answers
        yes for that ServiceAccount and no for `default`, and the `openshift.io/scc` annotation on a new pod records
        which SCC admitted it. When several SCCs are usable, admission tries them by priority (anyuid has 10,
        restricted-v2 none), then from most to least restrictive.

        The SCC lab recorded the steps. The administrator's step and the checks that follow it, from
        `lab.sa-scc` (the checks quote stdout; the lab also records warnings that SCCs are cluster-scoped):

        ```
        $ oc adm policy add-scc-to-user anyuid -z rooty -n academy-scc
        clusterrole.rbac.authorization.k8s.io/system:openshift:scc:anyuid added: "rooty"
        $ oc auth can-i use securitycontextconstraints/anyuid --as=system:serviceaccount:academy-scc:rooty -n academy-scc
        yes
        $ oc auth can-i use securitycontextconstraints/anyuid --as=system:serviceaccount:academy-scc:default -n academy-scc
        no
        ```

        A pod keeps the SCC it was admitted with, so after a grant (or its removal) restart the workload with
        `oc rollout restart`; the lab shows pods admitted under `anyuid` and, after the exception was removed and the
        spec fixed, under `restricted-v2`. An RBAC change, by contrast, applies to the very next API call.
    - id: granting-roles
      title: "Granting roles to a ServiceAccount: the forms"
      depth: true
      body: |
        | You want to grant | Command | Subject in the binding |
        |---|---|---|
        | a role to one ServiceAccount of this project | `oc policy add-role-to-user view -z reporter -n team` | ServiceAccount `team/reporter` |
        | a role to a ServiceAccount of another project | `oc policy add-role-to-user view system:serviceaccount:ci:deployer -n team` | ServiceAccount `ci/deployer` |
        | a custom Role | `oc create rolebinding reporter-pods --role=pod-reader --serviceaccount=team:reporter -n team` | ServiceAccount `team/reporter` |
        | a role to every ServiceAccount of project ci | `oc policy add-role-to-group view system:serviceaccounts:ci -n team` | Group: covers future ServiceAccounts too |

        `-z` means "a ServiceAccount of the namespace given by `-n`", and builds the full name for you, which is
        why the documentation recommends it for a single ServiceAccount. The binding lives in the namespace where
        the access applies. Then make sure the workload really runs as that ServiceAccount: set `serviceAccountName`
        in the pod template, which rolls out new pods.
    - id: automount
      title: "Pods that never call the API"
      depth: true
      body: |
        Pods that never call the API can set `automountServiceAccountToken: false`, on the ServiceAccount or on the
        pod; when both are set, the pod's value wins. The token file is then absent, which also removes a credential
        an attacker could copy. The kubelet requests a fresh token when the current one is older than 80% of its
        lifetime or older than 24 hours, and rewrites the file; your application must re-read it (official client
        libraries do).
    - id: troubleshooting-workload-identity
      title: "When workload identity goes wrong"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | HTTP 403 from the API | the 403 message in the logs; `oc auth can-i ... --as=system:serviceaccount:<ns>:<sa>` | no binding for that identity, or a binding to a misspelt name | `oc policy add-role-to-user <role> -z <sa>`; delete the wrong binding |
        | 403 names `...:default` | `oc get pod <pod> -o jsonpath='{.spec.serviceAccountName}'` | the pod template does not set `serviceAccountName` | set it in the template; do not grant to `default` |
        | Deployment with no pods, FailedCreate `error looking up service account` | `oc get events --field-selector reason=FailedCreate` | the template names a ServiceAccount that does not exist | `oc create serviceaccount <sa>` |
        | Deployment with no pods, FailedCreate `unable to validate against any security context constraint` | the event lists each SCC and why it did not apply | the spec needs an SCC the ServiceAccount may not use | fix the spec; otherwise an administrator grants the SCC to that ServiceAccount |
        | The token file is missing | the pod spec | `automountServiceAccountToken: false` on the pod or the ServiceAccount | set it to true where API access is really needed |
        | HTTP 401 after the pod ran for a long time | the client caches the token | the application read the token once | re-read the file, or use a client library |

        Practise with the [ServiceAccounts and SCC exceptions](/lab/lab.sa-scc) lab, the incidents
        [403 Forbidden from the API](/lab/inc.rbac-denied) and [A Deployment with no pods](/lab/inc.scc-root), and
        the challenge [Control project access](/lab/ch.deploy-bot-access).
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Granting to `default`.** Every pod in the namespace without an explicit ServiceAccount inherits the
          privilege.
        - **Forgetting who can borrow an identity.** Anyone allowed to create pods in the namespace (the `edit` role
          is enough) can run a pod as any ServiceAccount there and use its rights. A privileged ServiceAccount is only
          as safe as the namespace's editors.
        - **Granting to a group.** `system:serviceaccounts:<ns>` covers every current and future ServiceAccount of
          the namespace.
        - **Expecting running pods to change SCC.** The SCC is chosen at admission: restart to apply an SCC grant, and
          to drop one. RBAC is different: a role binding change applies to the very next API call.
        - **Never removing exceptions.** Record an owner and an expiry for every SCC grant.
        - **Creating long-lived token Secrets out of habit.** Scripts that used to read a ServiceAccount's token
          Secret should request a short-lived token instead.
  review:
    - {"q": "Why should an application not run as the default ServiceAccount when it needs special rights?", "a": "Every pod in the namespace without an explicit ServiceAccount uses default, so the rights spread to all of them."}
    - {"q": "How do you invalidate a pod's ServiceAccount token?", "a": "Delete the pod: its projected bound token is invalidated, with a deletion grace period and possible authentication caching. There is no individual TokenRequest token revocation. An unbound token from oc create token is different."}
    - {"q": "A pod's API call gets a 403 naming ...:default after you granted a role to your own ServiceAccount. What is wrong and how do you fix it?", "a": "The pod runs as default. Set serviceAccountName in the pod template (for example oc set serviceaccount deployment/<name> <account>); no restart is needed for the binding itself."}
    - {"q": "Which files does the projected ServiceAccount volume contain on OpenShift?", "a": "token, ca.crt and namespace (Kubernetes), plus service-ca.crt (OpenShift's service CA bundle)."}
    - {"q": "How do you grant a role to a ServiceAccount of another project?", "a": "Give the full user name: oc policy add-role-to-user <role> system:serviceaccount:<project>:<name> -n <where it applies>. The -z option resolves the name in the -n project."}
    - {"q": "How does a script get an API token for a ServiceAccount on OpenShift 4.16 or later?", "a": "oc create token <account> --duration=<time> requests a short-lived token; the server decides its lifetime. Automatic long-lived API token Secret creation stopped in 4.16; manually created and preserved legacy Secrets can still exist."}
    - {"q": "Which command shows which SCC would admit a pod spec?", "a": "oc adm policy scc-subject-review -f <pod.yaml>"}
    - {"q": "What object does `oc adm policy add-scc-to-user anyuid -z app -n team` create?", "a": "A RoleBinding named system:openshift:scc:anyuid in namespace team, binding the ClusterRole of that name to the ServiceAccount."}
  commands:
    - {cmd: "oc get serviceaccounts", meaning: "the ServiceAccounts of a new project: default, builder and deployer"}
    - {cmd: "oc create deployment web --image=registry.access.redhat.com/ubi9/httpd-24:latest >/dev/null; oc rollout status deployment/web --timeout=180s >/dev/null; oc get pod -l app=web -o jsonpath='{.items[0].spec.serviceAccountName}'", meaning: "a Deployment that names no ServiceAccount: its pod runs as default"}
    - {cmd: "oc exec deploy/web -- ls /var/run/secrets/kubernetes.io/serviceaccount", meaning: "the files of the projected volume inside the pod"}
    - {cmd: "oc exec deploy/web -- cat /var/run/secrets/kubernetes.io/serviceaccount/token | cut -d. -f2 | tr '_-' '/+' | { cat; echo '=='; } | tr -d '\\n' | base64 -d 2>/dev/null | jq '{sub, aud, lifetime_days: ((.exp - .iat) / 86400), pod: .[\"kubernetes.io\"].pod.name, serviceaccount: .[\"kubernetes.io\"].serviceaccount.name}'", meaning: "the readable claims of the pod's token: whose, for whom, how long, bound to which pod; the token itself is not shown"}
    - {cmd: "oc exec deploy/web -- cat /var/run/secrets/kubernetes.io/serviceaccount/token > pod.token; oc --token=\"$(cat pod.token)\" whoami; oc delete pod -l app=web --wait=true >/dev/null; oc wait --for=condition=ready pod -l app=web --timeout=120s >/dev/null; sleep 15; oc --token=\"$(cat pod.token)\" whoami", expect: any, meaning: "the pod's token works from outside, and is rejected after the pod is deleted"}
    - {cmd: "oc exec deploy/web -- sh -c 'SA=/var/run/secrets/kubernetes.io/serviceaccount; curl -s --cacert $SA/ca.crt -H \"Authorization: Bearer $(cat $SA/token)\" https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/pods' | grep -E '\"(message|code)\"'", meaning: "the pod lists its project's pods as default: 403, naming the identity"}
    - {cmd: "oc create serviceaccount reporter; oc policy add-role-to-user view -z reporter", meaning: "a dedicated ServiceAccount, bound to the view role with -z"}
    - {cmd: "oc set serviceaccount deployment/web reporter; oc rollout status deployment/web --timeout=180s", meaning: "the template now names reporter, and the Deployment rolls out new pods that run as it"}
    - {cmd: "oc exec deploy/web -- sh -c 'SA=/var/run/secrets/kubernetes.io/serviceaccount; curl -s --cacert $SA/ca.crt -H \"Authorization: Bearer $(cat $SA/token)\" https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/pods' | head -n 3", meaning: "the same call from the new pod succeeds: a PodList"}
    - {cmd: "oc exec deploy/web -- sh -c 'SA=/var/run/secrets/kubernetes.io/serviceaccount; curl -s --cacert $SA/ca.crt -H \"Authorization: Bearer $(cat $SA/token)\" https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/secrets' | grep message", meaning: "Secrets are not part of view: 403, now naming reporter"}
    - {cmd: "oc policy add-role-to-user edit system:serviceaccount:ci:deployer", meaning: "a role for a ServiceAccount of another project, by its full user name"}
    - {cmd: "oc --token=\"$(oc create token reporter --duration=10m)\" whoami", meaning: "a short-lived token used without printing it: the answer is the account's user name"}
    - {cmd: "oc get secrets", meaning: "only image pull secrets: no token Secrets are generated"}
  references:
    - {"title": "OpenShift 4.21: Understanding and creating service accounts", "url": "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-and-creating-service-accounts"}
    - {"title": "OpenShift 4.21: Using service accounts in applications (default service accounts, generated pull secrets)", "url": "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/using-service-accounts"}
    - {"title": "OpenShift 4.21: Bound service account tokens", "url": "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/bound-service-account-tokens"}
    - {"title": "OpenShift 4.21: Managing security context constraints", "url": "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/managing-pod-security-policies"}
    - {"title": "Kubernetes: Service accounts", "url": "https://kubernetes.io/docs/concepts/security/service-accounts/"}
    - {"title": "Kubernetes: Managing service accounts (bound tokens, legacy token clean-up)", "url": "https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/"}
    - {"title": "Kubernetes: Configure service accounts for pods (token rotation, automount)", "url": "https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/"}
    - {"title": "Kubernetes: Accessing the API from a pod", "url": "https://kubernetes.io/docs/tasks/run-application/access-api-from-pod/"}
    - {"title": "Kubernetes: RBAC user-facing roles (edit and ServiceAccounts)", "url": "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"}
    - {"title": "Kubernetes 1.34: Pod-bound token revocation and automount", "url": "https://v1-34.docs.kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/"}
- id: l.access-paths
  title: "Effective permissions are paths"
  subtitle: "Following a permission from a subject, through groups and bindings, to a rule"
  module: l1-access
  mode: REAL_LAB
  minutes: 30
  level: 3
  supports: "RBAC on OpenShift 4.21, including OpenShift's virtual groups. Built on the ideas of the open-source Lineage project. Recorded on OpenShift Local as the ordinary user developer, in a temporary project; cluster-wide bindings and roles are read by the cluster administrator (kubeadmin) in the same recording; nothing cluster-wide is changed."
  concepts: [sec.rbac, sec.audit, ocp.auth]
  prerequisites: [f.rbac, o2.groups]
  record_on: cluster-admin
  objective: |
    Answer "who can do what, where, and why?" for any subject by following the chain of bindings, groups and roles,
    and read access the way an auditor does.
  diagram: rbac
  simulator: rbac
  labs: [lab.access-paths]
  flow:
    - kind: ask
      id: recall-virtual
      recalls: o2.groups
      prompt: "`oc get groups` never lists `system:authenticated:oauth`, yet you belong to it. Why is it missing?"
      choices:
        - text: "It is virtual: the cluster adds it, nothing stores it"
          why: "Virtual groups are computed when a request is authenticated and never stored. A binding to one still reaches everyone in it."
        - text: "Only administrators are allowed to see that group"
          why: "Visibility is not the reason: no Group object exists for it, even for an administrator."
        - text: "It is removed from the list when you log out"
          why: "Nothing is created or deleted: the cluster adds the group again to every request from an OAuth-authenticated user."
      answer: 0
    - kind: teach
      id: auditor-question
      title: "An auditor's question"
      body: |
        An auditor asks: "Why can the user `developer` create projects?" You search the bindings for `developer`
        and find nothing that grants it. Yet the permission is real. The answer is that no permission lives on a
        user. An **effective permission** is the **union** of every path from a subject to a rule:

        - `subject (or one of its groups) → RoleBinding → Role or ClusterRole → rule`, in that binding's project
        - `subject (or one of its groups) → ClusterRoleBinding → ClusterRole → rule`, everywhere

        RBAC has no deny rules, which has two consequences. A subject can do something if **any** path allows it.
        And removing access means removing **every** path, not the one you happen to know about.
    - kind: explore
      id: rbac-paths-diagram
      diagram: rbac
      body: "Follow a permission from a subject to a rule. Select Subject and the two kinds of binding: any path that ends in a matching rule allows the request, so one path is enough, and removing access means removing every path."
    - kind: ask
      id: guess-where-grant
      guess: true
      prompt: "Nobody ever bound anything to the user `developer`, yet it may create projects. Where is the grant?"
      choices:
        - text: "In the User object named `developer`, as a permission list"
          why: "User objects carry names and identities, never permissions. Grants live in bindings."
        - text: "In the OAuth server's configuration, which assigns roles"
          why: "The OAuth server authenticates. Authorization is RBAC, evaluated on every request."
        - text: "In a ClusterRoleBinding that names a group of developer"
          why: "A binding can name a group, and a user reaches it through membership. The next steps trace it."
      answer: 2
    - kind: show
      id: can-i-create-projects
      body: "First, as `developer`, the permission and the groups, as the API server sees them:"
      run: "oc auth can-i create projectrequests; oc auth whoami"
      highlight: ["yes", "Groups"]
      notice: |
        `yes`, with a warning that `projectrequests` is cluster-scoped. The request carries the virtual groups
        `system:authenticated:oauth` and `system:authenticated`. Either a direct grant or a group grant could
        explain the result; this output alone does not identify the binding. The next steps trace it, the last
        one in the administrator's terminal.
    - kind: try
      id: try-read-binding
      body: "The cluster's binding for creating projects is called `self-provisioners`. As `developer`, try to read it. Expect a refusal: it is a ClusterRoleBinding, a cluster-scoped object, and `developer` holds no cluster-level role."
      accept:
        - "oc describe clusterrolebinding self-provisioners"
        - "oc describe clusterrolebinding/self-provisioners"
        - "oc get clusterrolebinding self-provisioners"
        - "oc get clusterrolebinding self-provisioners -o json"
        - "oc get clusterrolebinding self-provisioners -o jsonpath='{.roleRef.name}{\" <- \"}{.subjects}'"
        - "oc get clusterrolebinding self-provisioners -o yaml"
        - "oc get clusterrolebinding/self-provisioners"
        - "oc get clusterrolebinding/self-provisioners -o json"
        - "oc get clusterrolebinding/self-provisioners -o yaml"
        - "oc get clusterrolebindings self-provisioners"
        - "oc get clusterrolebindings self-provisioners -o json"
        - "oc get clusterrolebindings self-provisioners -o yaml"
        - "oc get clusterrolebindings/self-provisioners"
        - "oc get clusterrolebindings/self-provisioners -o json"
        - "oc get clusterrolebindings/self-provisioners -o yaml"
      hints:
        - match: "^oc get rolebinding"
          say: "A RoleBinding lives in one project. This one grants a permission in every project, so it is a ClusterRoleBinding: `clusterrolebinding`."
        - match: "^oc get clusterrolebinding$|^oc get clusterrolebindings$"
          say: "That lists them all. Name the one you want: `self-provisioners`."
        - match: "self-provisioner( |$)"
          say: "The binding's name ends in an `s`: `self-provisioners`. The role it grants is `self-provisioner`."
      hint: "`oc get clusterrolebinding`, then its name."
      run: "oc get clusterrolebinding self-provisioners"
      then: |
        Forbidden: reading ClusterRoleBindings takes a cluster-level role, and `developer` has none. That is itself
        a finding: the ordinary user can use the permission without being able to see where it comes from. The
        cluster administrator reads it, and the role it grants:
    - kind: show
      id: admin-self-provisioners
      body: "The cluster administrator (kubeadmin), who may read cluster-scoped objects, reads the binding and the role it grants:"
      run: "oc get clusterrolebinding self-provisioners -o jsonpath='{.roleRef.name}{\" <- \"}{.subjects}{\"\\n\"}' && oc describe clusterrole self-provisioner"
      notice: |
        The whole path: `developer` → virtual group `system:authenticated:oauth` → ClusterRoleBinding
        `self-provisioners` → ClusterRole `self-provisioner` → `create` on `projectrequests`. Every user who
        logs in through the OAuth server can request a project, although no binding names them. If an
        organisation wants projects requested through a process instead, a cluster administrator first
        disables automatic reconciliation on this default binding, then removes its subjects. Otherwise the
        platform can restore the grant.
    - kind: teach
      id: groups-reach-future
      title: "A grant to a group reaches who is not there yet"
      body: |
        The virtual groups for ServiceAccounts work the same way: `system:serviceaccounts` covers every
        ServiceAccount of the cluster, and `system:serviceaccounts:<project>` every one of a project. A binding to
        that group is a grant to subjects that do not exist yet. In your project, two ServiceAccounts, `scanner` and
        `builder-bot`, and one grant of `view` to the project's group:
    - kind: ask
      id: guess-future-sa
      guess: true
      prompt: "`view` is granted to `system:serviceaccounts:<project>`. Tomorrow someone creates a new ServiceAccount there. Can it list pods?"
      choices:
        - text: "No: it did not exist when the binding was made"
          why: "RBAC does not record who a binding covered when it was created. It asks, for every request, whether a rule matches."
        - text: "Yes: the group also covers ServiceAccounts created later"
          why: "Bindings are evaluated at request time against the requester's groups, so the creation date does not matter. The next step shows it."
        - text: "Only after an administrator approves it"
          why: "Kubernetes has no approval step for new ServiceAccounts. Anyone allowed to create one gets what its groups carry."
      answer: 1
    - kind: show
      id: broad-grant
      run: "oc create serviceaccount scanner; oc create serviceaccount builder-bot; oc policy add-role-to-group view system:serviceaccounts:academy-lesson-l-access-paths; for sa in scanner builder-bot; do echo -n \"$sa: \"; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-paths:$sa; done"
      highlight: ["scanner:", "builder-bot:"]
      notice: "Both answer `yes`, although the binding names neither: they reach it through the group of their project."
    - kind: show
      id: read-broad-bindings
      run: "oc get rolebindings -o wide"
      highlight: ["view"]
      notice: |
        Read the `GROUPS` column. Two bindings reach every ServiceAccount of the project, and only one was added by
        a person: `system:image-pullers` is a default (the group may pull images from the project), and `view` is the
        grant you made. OpenShift creates the `system:` bindings in every project; in a review, a tool or a habit
        separates that baseline from what people added.
    - kind: show
      id: who-can-broad
      body: "`who-can` shows the same thing from the other side:"
      run: "oc policy who-can list pods | sed -n '/^Groups:/,$p'"
      highlight: ["system:serviceaccounts:academy-lesson-l-access-paths"]
      notice: |
        The accounts are not listed by name, only through the group, as the last entry. The `Error during
        evaluation` line is the warning from the RBAC lesson: a binding on this cluster points at a ClusterRole that
        does not exist, so the list may be incomplete.
    - kind: ask
      id: who-can-error
      prompt: "`oc policy who-can get secrets` ends with `Error during evaluation, results may not be complete`. What do you conclude?"
      choices:
        - text: "The list may be missing some subjects"
          why: "The review skipped what it could not evaluate. A dangling binding is itself a finding, and an audit cannot rest on a partial list."
        - text: "The list is complete and the warning is cosmetic"
          why: "The warning means exactly that the answer may be partial. Find the binding that could not be evaluated."
        - text: "Nobody can read Secrets"
          why: "The command still lists the subjects it could evaluate. The warning says some may be missing, not that the list is empty."
      answer: 0
    - kind: teach
      id: two-paths
      title: "Two paths to one permission"
      body: |
        Now give `scanner` a direct grant as well, so it reaches `view` by two paths: its own binding and its
        project's group. Then remove the direct one.
    - kind: show
      id: add-direct
      run: "oc policy add-role-to-user view -z scanner"
      notice: "A second path for `scanner`. `builder-bot` has only the group path."
    - kind: ask
      id: guess-two-paths
      guess: true
      prompt: "You remove the binding that names `scanner`. Can it still list pods in the project?"
      choices:
        - text: "No: its grant is gone with that binding"
          why: "That is true only if the binding was its only path. Group bindings and ClusterRoleBindings are separate paths."
        - text: "Yes: the group path still grants it"
          why: "Removing one binding removes one path. The group binding is a separate path, and the next step shows it still grants `view`."
        - text: "Yes, because its token stays valid until it expires"
          why: "Authorization is evaluated on every request, so a removed path stops working at once. The token only proves who the account is."
      answer: 1
    - kind: try
      id: try-remove-direct
      body: |
        In your project `academy-lesson-l-access-paths`, use the policy shortcut to remove `scanner` from
        its direct `view` grant, leaving the group grant.
      accept:
        - "oc adm policy remove-role-from-user view -z scanner"
        - "oc adm policy remove-role-from-user view -z scanner --namespace academy-lesson-l-access-paths"
        - "oc adm policy remove-role-from-user view -z scanner --namespace=academy-lesson-l-access-paths"
        - "oc adm policy remove-role-from-user view -z scanner -n academy-lesson-l-access-paths"
        - "oc adm policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner"
        - "oc adm policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner --namespace academy-lesson-l-access-paths"
        - "oc adm policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner --namespace=academy-lesson-l-access-paths"
        - "oc adm policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner -n academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view -z scanner"
        - "oc policy remove-role-from-user view -z scanner --namespace academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view -z scanner --namespace=academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view -z scanner -n academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner"
        - "oc policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner --namespace academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner --namespace=academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner -n academy-lesson-l-access-paths"
        - "oc adm policy remove-role-from-user view -z scanner -n=academy-lesson-l-access-paths"
        - "oc adm policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner -n=academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view -z scanner -n=academy-lesson-l-access-paths"
        - "oc policy remove-role-from-user view system:serviceaccount:academy-lesson-l-access-paths:scanner -n=academy-lesson-l-access-paths"
      hints:
        - match: "remove-role-from-group"
          say: "That removes the group's grant, which would take `builder-bot` down as well. The task is `scanner`'s own binding: `remove-role-from-user`."
        - match: "^oc delete rolebinding"
          say: "A RoleBinding can hold several subjects, and deleting it removes them all. `oc policy remove-role-from-user` takes out one subject only."
        - match: "remove-role-from-user view (scanner|-z)?$"
          say: "Name the ServiceAccount: `-z scanner`, which means the ServiceAccount `scanner` of this project."
        - match: "^oc policy add-role"
          say: "`add-role-...` creates a grant. This task takes one away: `remove-role-from-user`."
      hint: "`oc policy remove-role-from-user`, the role, then `-z scanner`."
      run: "oc policy remove-role-from-user view -z scanner; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-paths:scanner"
      then: |
        The command reports `view removed: "scanner"`, and the check still answers `yes`: the group path remains.
        The recording does not list bindings again here, so it shows removal of the subject's grant, not whether
        the binding object was deleted. Remove every granting path to remove the access.
    - kind: show
      id: remove-all-paths
      body: "Remove the group's grant too, and ask about both accounts. With no path left, both should now be refused:"
      run: "oc policy remove-role-from-group view system:serviceaccounts:academy-lesson-l-access-paths; for sa in scanner builder-bot; do echo -n \"$sa: \"; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-paths:$sa; done"
      notice: "Now both say `no`, and the exit status is 1 because the last `can-i` answered no. The lab does the opposite when it wants precision: it replaces the group grant with `-z scanner`, so that `scanner` keeps access and `builder-bot` loses it."
    - kind: teach
      id: asking-the-api
      title: "Asking the API server"
      body: |
        You never compute a permission by hand. `oc auth can-i <verb> <resource> --as=<subject>` answers for one
        subject; `--list` summarises its rules in a project; and `oc adm policy who-can <verb> <resource>`
        answers the reverse question. To test members of a group, an administrator adds `--as-group=<group>`
        to an `--as` of any name.

        Impersonation has a subtlety. When you impersonate a ServiceAccount without `--as-group`, its virtual groups
        come along. When you impersonate a user, the groups tested are the ones you add plus `system:authenticated`,
        which is always added. A `yes` therefore proves what that combined identity may do, not **which** binding
        grants it. Compare with and without `--as-group`, and read the bindings, to isolate one group's part.
    - kind: ask
      id: test-group-members
      prompt: "As cluster-admin, you want to know whether members of the group `auditors` can read Secrets in `shop`. Which command answers it?"
      choices:
        - text: "`oc auth can-i get secrets -n shop --as=someone --as-group=auditors`"
          why: "`--as` impersonates a user name, and `--as-group` adds the group. The API evaluates every binding that reaches a member of it, wherever it lives."
        - text: "`oc auth can-i get secrets -n shop --as=auditors`"
          why: "That tests a *user* called `auditors`, which is not the group. The group's bindings would not match."
        - text: "`oc get rolebindings -n shop -o wide`, then search for `auditors`"
          why: "`-o wide` does list each RoleBinding's role and subjects, so `auditors` may appear. But a ClusterRoleBinding can grant the same access without appearing in that list, and you would still have to read each role's rules."
      answer: 0
    - kind: teach
      id: why-question
      title: "Why? Reading the path yourself"
      body: |
        The last question, why can they do it, is the hard one. No `oc` command prints the path. The API server's
        audit events can carry an `authorization.k8s.io/reason` annotation naming the RBAC binding that allowed a
        request, but only the first match, and only for requests that already happened. You build the path by
        reading the bindings that name the subject or its groups, and then their roles.

        Access-review tools fill that gap: they read users, identities, groups, ServiceAccounts, bindings, roles,
        SCCs and images, read-only, and show each access as a path, separating live grants from stale ones and from
        grants that can come back. The references include an interactive demo of one such open-source tool.
    - kind: teach
      id: auditor-view
      title: "Reading access like an auditor"
      body: |
        For each sensitive permission, list the subjects, the binding that grants it, how old it is and whether it
        was intended. The list: `cluster-admin`, `use` on privileged SCCs, `get` and `list` on Secrets,
        `create` on `pods/exec`, and three verbs that turn a small grant into any grant. `escalate` lets a subject
        write roles with rules it does not hold. `bind` lets it bind roles it does not hold. `impersonate` lets it
        act as someone else. Ask what your own account, `developer`, holds:
    - kind: show
      id: sensitive-verbs
      run: "for q in \"impersonate serviceaccounts\" \"escalate roles\" \"bind roles\"; do echo -n \"$q: \"; oc auth can-i $q; done"
      notice: |
        `impersonate` on ServiceAccounts is `yes`: as the administrator of this project, `developer` may act as its
        ServiceAccounts, which is what makes `--as=system:serviceaccount:...` work in these lessons. It is scoped to
        this project, and it is the kind of permission a review lists next to `cluster-admin`. `escalate` and `bind`
        are `no`, for unrestricted checks on Roles; the exit status is 1 because the last `can-i` answered no. A
        role-specific grant can differ; the refused `cluster-admin` binding in [RBAC and effective
        permissions](/lesson/f.rbac) shows that this user cannot grant that role.
    - kind: reflect
      id: explain-developer-path
      prompt: "An auditor asks why the user `developer` can create projects. Explain the path to a non-technical manager."
      model: |
        The permission is not attached to developer's account. A cluster-wide binding called `self-provisioners`
        gives the `self-provisioner` role to everyone in the group `system:authenticated:oauth`, and OpenShift puts
        every person who logs in through its login page into that group automatically. So any logged-in user can
        request a project. If the organisation wants projects to be requested through a process instead, a cluster
        administrator removes that group from the binding and marks the binding so the platform does not restore
        it; it is a single, reversible, cluster-wide decision.
    - kind: explore
      id: rbac-model
      sim: rbac
      body: "In the model, try the first challenge: make `oc auth can-i list pods` answer no for the `ci` ServiceAccount in `team-a`. Find every path that grants it, including the one through a virtual group, and remove them all."
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can follow a permission from a subject through groups, bindings and roles to a rule, say why a user can do
        something nobody granted them by name, and see that removing access means removing every path. You can use
        `can-i`, `--list` and `who-can`, say what impersonation does and does not prove, and name the verbs an access
        review should list.

        Next, [Stale and resurrectable grants](/lesson/l.access-can-come-back) looks at paths whose subject no longer
        exists, which stay in place and come back when someone reuses the name.
  sections:
    - id: tools-for-each-question
      title: "Tools for each question"
      depth: true
      body: |
        | Question | Tool |
        |---|---|
        | Can X do Y here? | `oc auth can-i <verb> <resource> --as=<X> -n <ns>` |
        | Can members of group G do Y here? | `oc auth can-i <verb> <resource> --as=<anyone> --as-group=<G> -n <ns>` |
        | Everything X can do here | `oc auth can-i --list --as=<X> -n <ns>` |
        | Who can do Y here? | `oc adm policy who-can <verb> <resource> -n <ns>` |
        | Which SCC would admit this pod for this subject? | `oc adm policy scc-subject-review -u <X> -f <pod.yaml>` (or `-z <sa>`; with neither, it checks you and the pod's ServiceAccount) |
        | Why? | read the bindings that name X or its groups, then their roles |

        Impersonation (`--as`) needs the `impersonate` permission. Project admins have it for the ServiceAccounts of
        their own project, as the recording shows; impersonating users or groups needs a cluster administrator.
    - id: aggregated-and-defaults
      title: "Aggregated roles and the baseline"
      depth: true
      body: |
        Aggregated ClusterRoles (`admin`, `edit`, `view`) collect rules from other roles by label, so the same role can
        gain permissions when an operator is installed: review the effective rules, not the YAML you wrote. OpenShift
        creates default bindings in every project (`system:image-pullers`, `system:image-builders`,
        `system:deployers`, the project `admin`; the `builder` and `deployer` ServiceAccounts they name exist only
        when the Build and DeploymentConfig capabilities are enabled). Good tools separate that baseline from what
        humans added.
    - id: when-the-answer-surprises-you
      title: "When the answer surprises you"
      depth: true
      body: |
        | Symptom | Evidence | Likely cause | Fix |
        |---|---|---|---|
        | `can-i` says yes, and no binding in the namespace names the subject | `oc get clusterrolebindings -o wide`, the subject's groups | a ClusterRoleBinding or a group (often virtual) grants it | remove or narrow that path; check the others before declaring it gone |
        | you removed a binding and the subject still has access | `oc auth can-i --list --as=<X> -n <ns>` still shows the rule | another path: a group binding, a ClusterRoleBinding, an aggregated role | find and remove every path (RBAC has no deny) |
        | `--as=alice` says no, alice says she can | alice's groups | the access comes through a group that `--as` alone does not test | repeat with `--as-group` for her groups |
        | `who-can` ends with `Error during evaluation, results may not be complete` | the warning itself | a ClusterRoleBinding references a ClusterRole that does not exist (seen on the course cluster) | treat the list as incomplete; find and fix the dangling binding |
        | a role gained rules nobody wrote | `oc get clusterrole edit -o yaml`: `aggregationRule` and the rules | an operator added a ClusterRole labelled to aggregate into it | review effective rules after installing operators |
    - id: reaching-a-node
      title: "Another kind of path: reaching a node"
      depth: true
      body: |
        An administrator who needs a shell on a worker to read a file under `/etc`, while the API works, should follow
        the OpenShift 4.21 guidance: `oc debug` against the node, then `chroot /host`. That starts a privileged pod on the
        node, authorised by RBAC and audited by the API server. SSH as `core` is the documented fallback when the API
        or the kubelet is down: it is not recommended while the API is available, it leaves no API audit trail, and
        keys added to a node by hand drift from the configuration the Machine Config Operator manages.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Reading only the namespace.** RoleBindings tell half the story; ClusterRoleBindings and group membership
          (including virtual groups) grant the rest.
        - **Treating `system:authenticated` as "all staff".** It also contains every ServiceAccount of every
          namespace.
        - **Testing a user without their groups.** `--as=<user>` checks that name; add `--as-group=<group>` to test
          access that comes through a group, as the groups lab does.
        - **Reviewing a role once.** Aggregated roles change when operators add rules to them; review the effective
          rules, not the YAML you wrote.
  review:
    - q: "Which command lists every subject that can delete pods in a namespace?"
      a: "oc adm policy who-can delete pods -n <namespace>"
    - q: "Why does a new ServiceAccount sometimes have access nobody granted it?"
      a: "A binding to a virtual group (system:serviceaccounts or system:serviceaccounts:<ns>) covers every current and future ServiceAccount."
    - q: "Which virtual group contains ServiceAccounts as well as people?"
      a: "system:authenticated (system:authenticated:oauth contains only users who logged in through OAuth)."
    - q: "Can an RBAC rule deny access?"
      a: "No. RBAC is purely additive; to remove access you remove every path that grants it."
    - q: "Which three verbs turn a small grant into any grant?"
      a: "escalate (write roles with rules you lack), bind (bind roles you lack) and impersonate (act as someone else)."
    - q: "Why can the user developer create projects without any binding naming it?"
      a: "The self-provisioners ClusterRoleBinding gives the self-provisioner role to the virtual group system:authenticated:oauth, which every OAuth login joins."
    - q: "What does a yes from can-i with --as and --as-group prove?"
      a: "What that combined identity (the name, the asserted groups and system:authenticated) may do, not which binding grants it or who is really in the group."
  commands:
    - {cmd: "oc get clusterrolebinding self-provisioners -o jsonpath='{.roleRef.name}{\" <- \"}{.subjects}{\"\\n\"}' && oc describe clusterrole self-provisioner", as: admin, meaning: "the binding that grants project requests to every OAuth user, and the role's rules"}
    - {cmd: "oc auth can-i create projectrequests; oc auth whoami", expect: any, meaning: "the permission is yes, and the groups of the request are virtual"}
    - {cmd: "oc get clusterrolebinding self-provisioners", expect: fail, meaning: "reading a ClusterRoleBinding needs a cluster-level role: Forbidden"}
    - {cmd: "oc create serviceaccount scanner; oc create serviceaccount builder-bot; oc policy add-role-to-group view system:serviceaccounts:academy-lesson-l-access-paths; for sa in scanner builder-bot; do echo -n \"$sa: \"; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-paths:$sa; done", meaning: "a grant to the project's virtual group reaches both ServiceAccounts, though neither is named"}
    - {cmd: "oc get rolebindings -o wide", meaning: "the bindings, with the group-wide ones visible in the GROUPS column"}
    - {cmd: "oc policy who-can list pods | sed -n '/^Groups:/,$p'", meaning: "the groups that may list pods; ServiceAccounts appear only through their group"}
    - {cmd: "oc policy add-role-to-user view -z scanner", meaning: "a second path for scanner: its own binding"}
    - {cmd: "oc policy remove-role-from-user view -z scanner; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-paths:scanner", meaning: "removing one path: the answer is still yes, through the group"}
    - {cmd: "oc policy remove-role-from-group view system:serviceaccounts:academy-lesson-l-access-paths; for sa in scanner builder-bot; do echo -n \"$sa: \"; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-paths:$sa; done", expect: any, meaning: "removing the last path: both answer no"}
    - {cmd: "for q in \"impersonate serviceaccounts\" \"escalate roles\" \"bind roles\"; do echo -n \"$q: \"; oc auth can-i $q; done", expect: any, meaning: "the sensitive verbs the current account holds in this project"}
  references:
    - {title: "Lineage, an open-source access explainer by the author of this site: interactive demo with mock data", url: "https://amine-lg.github.io/lineage-demo/demo/"}
    - {title: "OpenShift 4.21: Using RBAC to define and apply permissions", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/using-rbac"}
    - {title: "OpenShift 4.21: Groups and virtual groups", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-authentication#rbac-groups_understanding-authentication"}
    - {title: "Kubernetes: Using RBAC authorization (additive rules, aggregation, escalation prevention)", url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"}
    - {title: "Kubernetes: Audit annotations (authorization.k8s.io/reason)", url: "https://kubernetes.io/docs/reference/labels-annotations-taints/audit-annotations/"}
    - {title: "Kubernetes: RBAC good practices", url: "https://kubernetes.io/docs/concepts/security/rbac-good-practices/"}
    - {title: "Kubernetes 1.34 source: impersonation filter (groups for ServiceAccounts)", url: "https://github.com/kubernetes/kubernetes/blob/release-1.34/staging/src/k8s.io/apiserver/pkg/endpoints/filters/impersonation.go"}
- id: l.access-can-come-back
  title: "Stale and resurrectable grants"
  subtitle: "Permissions that outlive the subject they were made for"
  module: l1-access
  mode: REAL_LAB
  minutes: 30
  level: 3
  supports: "RBAC and SCC semantics on OpenShift 4.21; behaviour reproduced in this lesson's recording (as the ordinary user developer, in a temporary project, and, for two read-only cluster-wide checks, as the cluster administrator kubeadmin) and in the access-can-come-back lab, and documented by the Lineage project. Cross-project and cluster-wide cases are quoted from the lab, which used two projects."
  concepts: [sec.rbac, sec.serviceaccounts, sec.audit]
  prerequisites: [l.access-paths, f.scc, o2.service-accounts]
  record_on: cluster-admin
  objective: |
    Recognise grants that outlive their subjects, explain why they are dangerous, know where they hide, and
    decommission a project without leaving them behind.
  labs: [lab.access-can-come-back]
  flow:
    - kind: ask
      id: recall-two-paths
      recalls: l.access-paths
      prompt: "You remove the one binding that names a ServiceAccount, and `oc auth can-i` still says `yes`. What is the most likely reason?"
      choices:
        - text: "The answer is cached and updates after a while"
          why: "Brief propagation delays are possible, but persistent access points to another granting path. Evaluate the request again and inspect both binding kinds and groups."
        - text: "The ServiceAccount's token must also be revoked"
          why: "A token proves who the account is. It grants nothing, so revoking it would not change what a binding allows."
        - text: "A second path, such as a group binding"
          why: "Effective access is the union of all paths, and RBAC has no deny. Removing one binding removes one path."
      answer: 2
    - kind: teach
      id: retired-project
      title: "The project that was retired"
      body: |
        A team retires its project, `pay-old`, and deletes it. Months later someone creates a project with the same
        name, adds a ServiceAccount called `scanner`, and finds that it can read pods in another team's project.
        Nobody approved that.

        The cause is the property you met in [RBAC and effective permissions](/lesson/f.rbac): bindings and SCC
        user lists refer to subjects by **name** (`system:serviceaccount:<project>:<name>`, a group name, a user
        name). When the subject is deleted, nothing deletes the grant. While nothing can authenticate under that
        name, the grant is dormant. As soon as the name is reused, it is live again, with no new approval. This
        lesson reproduces it on a small scale, shows where such grants hide, and gives the safe order for retiring
        a project.

        The terminal in this lesson is `developer`'s: an ordinary user, administrator of the lesson's temporary
        project and of nothing else. Where a command sends a ServiceAccount's token instead, the step says so.
    - kind: show
      id: make-grant
      body: "A ServiceAccount `scanner`, granted `view` in its own project. The commands print its UID, the unique identifier the API server gives every object, and save a short-lived token to a file for later (the token is not printed):"
      run: "oc create serviceaccount scanner; oc policy add-role-to-user view -z scanner; oc get serviceaccount scanner -o jsonpath='{.metadata.uid}'; echo; oc create token scanner --duration=10m > old.token"
      notice: "The UID of this first `scanner` is the last line. Remember it."
    - kind: show
      id: token-works
      run: "oc --token=\"$(cat old.token)\" auth can-i list pods"
      notice: "`yes`: the token authenticates as `scanner`, and the binding grants `view`."
    - kind: ask
      id: guess-after-delete
      guess: true
      prompt: "`scanner` is deleted, and its binding is left alone. What does `oc auth can-i list pods --as=system:serviceaccount:<project>:scanner` answer?"
      choices:
        - text: "`no`: a deleted account has no permissions"
          why: "Permissions are not stored on the account. They are stored in bindings, which nobody deleted."
        - text: "`yes`: bindings still match that name"
          why: "Impersonation never looks up the ServiceAccount. It evaluates the bindings that mention that name. The next step shows it."
        - text: "An error, because the account no longer exists"
          why: "The API server does not verify that an impersonated ServiceAccount exists, so there is nothing to fail."
      answer: 1
    - kind: show
      id: delete-account
      body: "Delete the account, confirm that it is gone (expect NotFound), then ask by name:"
      run: "oc delete serviceaccount scanner; oc get serviceaccount scanner; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-can-come-back:scanner"
      notice: |
        The account is deleted, and `oc get` confirms it: NotFound. The answer to the last command is still `yes`.
        Two things are true at once: the account does not exist, and a check by name says it may list pods. A
        check by name cannot tell the difference, which is why a `yes` from `can-i --as` proves nothing about
        whether the subject exists.
    - kind: show
      id: binding-remains
      run: "oc get rolebindings -o wide"
      highlight: ["scanner"]
      notice: "The binding that grants `view` still lists `scanner` in `SERVICEACCOUNTS`. Deleting an account touches none of the bindings that name it."
    - kind: ask
      id: guess-old-token
      guess: true
      prompt: "A new ServiceAccount named `scanner` is created in the same project. What happens to the first `scanner`'s saved token, and to its grants?"
      choices:
        - text: "Token rejected; the grants apply to the new account"
          why: "Tokens are tied to the account object they were issued for, which no longer exists. Bindings store only the name, so the new account inherits them. The next steps show both."
        - text: "Both come back: same name, same token and grants"
          why: "The grants come back, but the token does not. It belongs to an object that was deleted; the new object is a different account, with a new UID."
        - text: "Token rejected, and the new account has no grants"
          why: "The token is rejected, but bindings match the name, not the object. Every grant that named the old account applies to the new one."
      answer: 0
    - kind: show
      id: recreate-account
      run: "oc create serviceaccount scanner; oc get serviceaccount scanner -o jsonpath='{.metadata.uid}'; echo; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-can-come-back:scanner"
      highlight: ["yes"]
      notice: |
        A new object with a new UID: the API server knows these are two different accounts. The binding never looked
        at the UID. It stores the subject's namespace and name, `academy-lesson-l-access-can-come-back` and `scanner`,
        and the new account matches both. The access is back, with no approval.
    - kind: show
      id: old-token-dead
      body: "Now the token saved from the first account. It should be rejected. The command waits a few seconds first, because the API server caches a successful authentication for a short time:"
      run: "sleep 15; oc --token=\"$(cat old.token)\" auth can-i list pods"
      notice: "Unauthorized. The credentials of the old account did not come back."
    - kind: show
      id: new-token-works
      body: "A token for the new account:"
      run: "oc --token=\"$(oc create token scanner --duration=10m)\" auth can-i list pods"
      notice: "`yes`. The risk is not the old credentials but the old grants: they apply to the new account as soon as it exists."
    - kind: teach
      id: where-they-survive
      title: "Where such grants survive"
      body: |
        In the example the binding and the account lived in one project. These places keep a grant alive after its
        subject is gone, and a namespace deletion does not reach them:

        1. **ClusterRoleBindings** that name a ServiceAccount. They are cluster-scoped, and never deleted with a
           namespace. That includes the `system:openshift:scc:<scc>` bindings that `oc adm policy add-scc-to-user`
           creates when no namespace is given.
        2. **RoleBindings in another namespace** than the subject's.
        3. **SCC `users` and `groups` entries**, and RBAC `use` grants on an SCC name that does not exist yet.
        4. Bindings to **groups** that were deleted or renamed in the directory.

        Deleting a namespace deletes the RoleBindings inside it, so a binding in the subject's own namespace does not
        survive that. Only deleting the account alone, as above, leaves it in place.
    - kind: ask
      id: namespace-deleted
      prompt: "The whole namespace `ns-a` is deleted. Which grant naming `system:serviceaccount:ns-a:scanner` is still there afterwards?"
      choices:
        - text: "A RoleBinding in `ns-a` itself"
          why: "That binding lived in `ns-a` and was deleted with it."
        - text: "A RoleBinding in the namespace `ns-b`"
          why: "Deleting a namespace deletes only the objects inside it. A binding elsewhere waits for the next `ns-a/scanner`, so decommissioning starts outside the project."
        - text: "None: Kubernetes removes every grant that names it"
          why: "Kubernetes has no reverse index from subjects to bindings. It cannot find grants elsewhere that mention a name."
      answer: 1
    - kind: ask
      id: clusterrolebinding-danger
      prompt: |
        A ClusterRoleBinding names a ServiceAccount of a deleted project. Why is that dangerous when project self-provisioning is enabled?
      choices:
        - text: "A self-provisioning user can reclaim the name"
          why: "An OAuth user allowed to create projects can reclaim a permitted free project name, then create its ServiceAccount. The surviving ClusterRoleBinding grants the new account access cluster-wide."
        - text: "The old tokens of the deleted account start working again"
          why: "Old tokens carry the old account's identity and stay invalid. The risk is the new account, which gets new tokens and the old grant."
        - text: "ClusterRoleBindings cannot be deleted once their subject is gone"
          why: "They can be deleted like any object. The problem is that nobody notices they should be."
      answer: 0
    - kind: teach
      id: finding-them
      title: "Finding them"
      body: |
        For each ServiceAccount subject, check that the account exists and belongs to the intended owner.
        For groups, check the authentication source: Group objects and virtual groups with built-in OAuth,
        token claims with direct OIDC. A missing Group object is not evidence of stale access in direct OIDC
        mode.

        A listing with the subject's namespace helps find cross-project grants. Here we bind `view` to
        `pay-old/scanner`, treating `pay-old` as retired in the scenario. `developer`, an ordinary user,
        cannot verify that project's existence, so the listing identifies something to investigate, not a
        confirmed stale grant.
    - kind: show
      id: list-subject-ns
      run: "oc policy add-role-to-user view system:serviceaccount:pay-old:scanner; oc get rolebindings -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name"
      highlight: ["pay-old"]
      notice: |
        A `SUBJECT_NS` different from the binding's own namespace is the row to check: here `pay-old`. The `<none>`
        entries are users and groups, which have no namespace. The same custom columns work on
        `oc get clusterrolebindings`, but listing ClusterRoleBindings needs cluster-wide read access, which
        `developer` does not have: that search is a cluster administrator's.
    - kind: try
      id: try-check-owner
      body: "Try to check whether the ServiceAccount named by that row, `scanner` in the project `pay-old`, still exists. As `developer` you will be refused: you have no role in `pay-old`, and a Forbidden says nothing about whether the account exists."
      accept:
        - "oc get -n pay-old sa scanner"
        - "oc get -n pay-old serviceaccount scanner"
        - "oc get sa -n pay-old scanner"
        - "oc get sa scanner --namespace pay-old"
        - "oc get sa scanner --namespace=pay-old"
        - "oc get sa scanner -n pay-old"
        - "oc get sa scanner -n=pay-old"
        - "oc get sa/scanner --namespace pay-old"
        - "oc get sa/scanner --namespace=pay-old"
        - "oc get sa/scanner -n pay-old"
        - "oc get sa/scanner -n=pay-old"
        - "oc get serviceaccount -n pay-old scanner"
        - "oc get serviceaccount scanner --namespace pay-old"
        - "oc get serviceaccount scanner --namespace=pay-old"
        - "oc get serviceaccount scanner -n pay-old"
        - "oc get serviceaccount scanner -n=pay-old"
        - "oc get serviceaccount/scanner --namespace pay-old"
        - "oc get serviceaccount/scanner --namespace=pay-old"
        - "oc get serviceaccount/scanner -n pay-old"
        - "oc get serviceaccount/scanner -n=pay-old"
        - "oc get serviceaccounts scanner --namespace pay-old"
        - "oc get serviceaccounts scanner --namespace=pay-old"
        - "oc get serviceaccounts scanner -n pay-old"
        - "oc get serviceaccounts scanner -n=pay-old"
        - "oc get serviceaccounts/scanner --namespace pay-old"
        - "oc get serviceaccounts/scanner --namespace=pay-old"
        - "oc get serviceaccounts/scanner -n pay-old"
        - "oc get serviceaccounts/scanner -n=pay-old"
        - "oc get --namespace=pay-old sa scanner"
        - "oc get --namespace pay-old sa scanner"
        - "oc get -n=pay-old sa scanner"
        - "oc get --namespace=pay-old serviceaccount scanner"
        - "oc get --namespace pay-old serviceaccount scanner"
        - "oc get -n=pay-old serviceaccount scanner"
        - "oc get sa --namespace=pay-old scanner"
        - "oc get sa --namespace pay-old scanner"
        - "oc get sa -n=pay-old scanner"
        - "oc get serviceaccount --namespace=pay-old scanner"
        - "oc get serviceaccount --namespace pay-old scanner"
        - "oc get serviceaccount -n=pay-old scanner"
      hints:
        - match: "^oc get (serviceaccounts?|sa) scanner$"
          say: "That asks about the current project. The account is in `pay-old`: add `-n pay-old`."
        - match: "pay-old"
          say: "Check the form: `oc get serviceaccount scanner -n pay-old`."
        - match: "^oc get (pods|rolebindings)"
          say: "The question is about a ServiceAccount: `oc get serviceaccount`."
      hint: "`oc get serviceaccount`, the name, and `-n` with the project."
      run: "oc get serviceaccount scanner -n pay-old"
      then: |
        Forbidden, the expected refusal, and the answer does not say whether the account exists: `developer` has no
        access to `pay-old`, whether or not it exists. An audit needs an identity that may read every project: here,
        the cluster administrator.
    - kind: show
      id: admin-check-owner
      body: "The cluster administrator, kubeadmin, who may read every project, asks the same question, and whether the project exists at all. Both answers are expected to be NotFound:"
      run: "oc get namespace pay-old; oc get serviceaccount scanner -n pay-old"
      notice: |
        NotFound twice: `pay-old` does not exist, so neither does its `scanner`. Unlike developer's Forbidden, this
        answer is evidence. The grant names an account that nobody owns now: whoever creates a project called
        `pay-old` and an account called `scanner` in it receives `view` here.
    - kind: show
      id: admin-search
      body: "Then the administrator searches every RoleBinding and ClusterRoleBinding of the cluster for a subject in `pay-old`, the search developer cannot make:"
      run: "oc get rolebindings,clusterrolebindings -A -o custom-columns='KIND:.kind,NAMESPACE:.metadata.namespace,NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name' | awk 'NR == 1 || $5 ~ /(^|,)pay-old(,|$)/'"
      notice: |
        One row: the RoleBinding `view-0` in this lesson's project grants `view` to `pay-old/scanner`, the grant made
        above. On a real cluster this search also finds ClusterRoleBindings, which grant access everywhere; this
        cluster has none naming `pay-old`.

        The course's lab made the same search with two real projects, and recorded this listing:
    - kind: show
      id: lab-listing
      code: |
        $ oc get rolebindings -n academy-ghost-target -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name
        NAME                    ROLE                   SUBJECT_NS             SUBJECT
        admin                   admin                  <none>                 developer
        system:deployers        system:deployer        academy-ghost-target   deployer
        system:image-builders   system:image-builder   academy-ghost-target   builder
        system:image-pullers    system:image-puller    <none>                 system:serviceaccounts:academy-ghost-target
        view                    view                   academy-ghost          scanner
      caption: "Recorded in the Access that can come back lab (lab.access-can-come-back), which used the two projects academy-ghost and academy-ghost-target."
      origin: lab
      notice: |
        The last row is the cross-project grant to review: the binding is in `academy-ghost-target`, and its subject
        is `academy-ghost/scanner`. The lab had already recreated that account, so the grant is live again at this
        point, not evidence of a currently missing subject. Check both existence and intended ownership.
    - kind: teach
      id: decommission
      title: "Decommissioning a project safely"
      body: |
        Delete grants before subjects, and subjects before names become free. The common failure is to delete the
        project first: it disappears, its name becomes free, and the grants that named it wait outside for whoever
        creates that name next.
    - kind: order
      id: order-decommission
      prompt: "Put the steps for retiring the project `pay-old` in order."
      items:
        - "List its ServiceAccounts and the groups of the team"
        - "Find every grant that names them outside the project"
        - "Remove those grants and confirm that access is gone"
        - "Delete the project"
        - "Re-check on a schedule"
      why: "The inventory says what to look for, and the search finds the grants that will survive the project. Removing them while you still know whom they belong to comes before freeing the name. The project is deleted only then, and grants to old names come back whenever someone copies an old manifest, hence the schedule."
    - kind: try
      id: try-remove-foreign
      body: "In your project `academy-lesson-l-access-can-come-back`, remove the `view` grant of the ServiceAccount `scanner` of `pay-old`, by its full name."
      accept:
        - "oc adm policy remove-role-from-user view system:serviceaccount:pay-old:scanner"
        - "oc adm policy remove-role-from-user view system:serviceaccount:pay-old:scanner --namespace academy-lesson-l-access-can-come-back"
        - "oc adm policy remove-role-from-user view system:serviceaccount:pay-old:scanner --namespace=academy-lesson-l-access-can-come-back"
        - "oc adm policy remove-role-from-user view system:serviceaccount:pay-old:scanner -n academy-lesson-l-access-can-come-back"
        - "oc policy remove-role-from-user view system:serviceaccount:pay-old:scanner"
        - "oc policy remove-role-from-user view system:serviceaccount:pay-old:scanner --namespace academy-lesson-l-access-can-come-back"
        - "oc policy remove-role-from-user view system:serviceaccount:pay-old:scanner --namespace=academy-lesson-l-access-can-come-back"
        - "oc policy remove-role-from-user view system:serviceaccount:pay-old:scanner -n academy-lesson-l-access-can-come-back"
        - "oc adm policy remove-role-from-user view system:serviceaccount:pay-old:scanner -n=academy-lesson-l-access-can-come-back"
        - "oc policy remove-role-from-user view system:serviceaccount:pay-old:scanner -n=academy-lesson-l-access-can-come-back"
      hints:
        - match: "-z scanner"
          say: "`-z` resolves the name in your own project, so this would remove the grant of your project's `scanner`, not `pay-old`'s. Use the full name, `system:serviceaccount:pay-old:scanner`."
        - match: "remove-role-from-user view (scanner|pay-old:scanner)$"
          say: "A ServiceAccount's full name starts with `system:serviceaccount:`, then the project and the name."
        - match: "add-role"
          say: "`add-role-...` creates a grant. The task removes one: `remove-role-from-user`."
      hint: "`oc policy remove-role-from-user`, the role, then the account's full name."
      run: "oc policy remove-role-from-user view system:serviceaccount:pay-old:scanner; oc get rolebindings -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name"
      then: "The `pay-old` row is gone from the listing. On a real cluster you would then confirm with `oc auth can-i ... --as=...`, which must answer `no`, and check an SCC's own `users` and `groups` fields with `oc describe scc <name>`, because `can-i` does not read them."
    - kind: ask
      id: decommission-first
      prompt: "You must retire `pay-old`, whose ServiceAccounts have image-puller grants in two other projects. What do you do first?"
      choices:
        - text: "Delete `pay-old` first, because its grants go with it"
          why: "Only the bindings inside `pay-old` go with it. The image-puller grants live in the other projects."
        - text: "Delete the ServiceAccounts first, then the project"
          why: "Deleting the accounts first removes nothing that names them. It only makes the grants harder to attribute."
        - text: "Remove the foreign grants before deleting `pay-old`"
          why: "Grants outside the project survive its deletion. Remove them while you still know whom they belong to, then free the name."
      answer: 2
    - kind: reflect
      id: explain-leftover-access
      prompt: "A manager asks why deleting an account or a project does not remove the access it was given elsewhere. Answer in a few sentences."
      model: |
        On OpenShift, a permission is a separate entry that says "the account called X may do Y". Deleting account X,
        or the project it lived in, does not touch entries stored elsewhere. They sit unused until someone creates a
        new account with the same name; that new account then has the old access immediately, without anyone
        approving it. That is why decommissioning removes the permissions first, and why access reviews look
        specifically for permissions that name accounts which no longer exist.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can explain why a grant outlives its subject, show it with a delete and a re-create, and say which places
        keep a grant alive when a project is deleted. You can list bindings with the subject's namespace to find
        entries that point elsewhere, and retire a project with the grants removed first.

        The next lesson, [Image access across namespaces](/lesson/l.image-pullers), applies the same
        reading to one kind of grant that crosses projects all the time: permission to pull and push images.
  sections:
    - id: grant-locations
      title: "Where a grant survives, in one table"
      depth: true
      body: |
        | Grant location | Survives deleting the ServiceAccount | Survives deleting its namespace | Who can reuse the name |
        |---|---|---|---|
        | RoleBinding in the same namespace | yes | no | admins and editors of that namespace |
        | RoleBinding in another namespace | yes | yes | whoever can create the namespace again and the account in it |
        | ClusterRoleBinding | yes | yes | the same, with a cluster-wide prize |
        | SCC `users` entry | yes | yes | the same |

        If only the ServiceAccount is deleted, a binding in its own namespace stays, but recreating the name requires
        rights in that same namespace. With default settings OAuth-authenticated users may create a project whose name is
        free and permitted by the project-name rules, so recreating a deleted project and its ServiceAccount can be enough to inherit a cluster-wide grant.
    - id: removing-the-grants
      title: "Removing each kind of grant"
      depth: true
      body: |
        Remove RBAC grants with `oc policy remove-role-from-user …` in each foreign namespace, and the
        `system:openshift:scc:<scc>` RBAC grants with `oc adm policy remove-scc-from-user …`. Neither touches an SCC's
        own `users` and `groups` fields: delete names from those with `oc edit scc <name>`. Confirm the RBAC side
        with `oc auth can-i … --as=…` (the answer must now be `no`) and the SCC fields with `oc describe scc <name>`,
        because `can-i` does not read them.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Decommissioning by deleting the namespace.** Cluster-scoped grants and bindings in other namespaces stay;
          remove them first.
        - **Trusting a "yes" or "no" from `oc auth can-i --as`.** It tests a name, not whether that subject exists.
        - **Removing people from a group but not the group's bindings** when the group itself is retired.
        - **Cleaning once.** Stale grants come back with every decommissioned project; check on a schedule.
  review:
    - q: "Why is a binding to a deleted ServiceAccount still risky?"
      a: "Anyone who can create a ServiceAccount with that name in that namespace inherits the access immediately."
    - q: "Name three places where resurrectable grants can live."
      a: "ClusterRoleBindings, RoleBindings in other namespaces, SCC users/groups entries (and grants on not-yet-existing SCCs)."
    - q: "Which binding naming a ServiceAccount is removed when its namespace is deleted?"
      a: "Only RoleBindings inside that same namespace."
    - q: "In a RoleBinding listing, which column points to possibly stale cross-namespace grants?"
      a: "The subject's namespace (SUBJECT_NS) when it differs from the binding's namespace; then check that the account exists."
    - q: "A ServiceAccount is deleted and recreated with the same name. What comes back, and what does not?"
      a: "The grants come back (bindings match the name). The old tokens do not: they were tied to the deleted object and stay invalid."
    - q: "In what order do you retire a project?"
      a: "Inventory its accounts and groups, find and remove the grants that name them outside the project, confirm access is gone, delete the project, and re-check on a schedule."
  commands:
    - {cmd: "oc create serviceaccount scanner; oc policy add-role-to-user view -z scanner; oc get serviceaccount scanner -o jsonpath='{.metadata.uid}'; echo; oc create token scanner --duration=10m > old.token", meaning: "an account, a grant to it by name, its UID, and a short-lived token saved to a file (not printed)"}
    - {cmd: "oc --token=\"$(cat old.token)\" auth can-i list pods", meaning: "the saved token works: the account may list pods"}
    - {cmd: "oc delete serviceaccount scanner; oc get serviceaccount scanner; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-can-come-back:scanner", expect: any, meaning: "the account is gone, and a check by name still answers yes"}
    - {cmd: "oc get rolebindings -o wide", meaning: "the binding still names the deleted account"}
    - {cmd: "oc create serviceaccount scanner; oc get serviceaccount scanner -o jsonpath='{.metadata.uid}'; echo; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-l-access-can-come-back:scanner", meaning: "a new account with the same name has a new UID and the old grant"}
    - {cmd: "sleep 15; oc --token=\"$(cat old.token)\" auth can-i list pods", expect: fail, meaning: "the old token is rejected after the account was re-created"}
    - {cmd: "oc --token=\"$(oc create token scanner --duration=10m)\" auth can-i list pods", meaning: "a token for the new account has the old access"}
    - {cmd: "oc policy add-role-to-user view system:serviceaccount:pay-old:scanner; oc get rolebindings -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name", meaning: "a grant to an account of a project that does not exist, and the listing that shows each subject's namespace"}
    - {cmd: "oc get serviceaccount scanner -n pay-old", expect: fail, meaning: "an ordinary user cannot check another project: Forbidden, which says nothing about whether the account exists"}
    - {cmd: "oc get namespace pay-old; oc get serviceaccount scanner -n pay-old", as: admin, expect: fail, meaning: "the administrator sees the truth: neither the project nor the account exists"}
    - {cmd: "oc get rolebindings,clusterrolebindings -A -o custom-columns='KIND:.kind,NAMESPACE:.metadata.namespace,NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name' | awk 'NR == 1 || $5 ~ /(^|,)pay-old(,|$)/'", as: admin, meaning: "every binding of the cluster whose subjects include an account of pay-old"}
    - {cmd: "oc policy remove-role-from-user view system:serviceaccount:pay-old:scanner; oc get rolebindings -o custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECT_NS:.subjects[*].namespace,SUBJECT:.subjects[*].name", meaning: "the grant to the foreign name is removed"}
  references:
    - {title: "Kubernetes: RBAC subjects", url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-subjects"}
    - {title: "Kubernetes: RBAC good practices", url: "https://kubernetes.io/docs/concepts/security/rbac-good-practices/"}
    - {title: "OpenShift 4.21: Disabling project self-provisioning", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/projects#disabling-project-self-provisioning_configuring-project-creation"}
    - {title: "OpenShift 4.21: Managing security context constraints (can-i and SCC users/groups)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/managing-pod-security-policies"}
    - {title: "oc 4.21 source: remove-scc-from-user changes RBAC only", url: "https://github.com/openshift/oc/blob/release-4.21/pkg/cli/admin/policy/modify_scc.go"}
- id: l.image-pullers
  title: "Image access across namespaces"
  subtitle: "Pull and push on the internal registry are RBAC grants"
  module: l1-access
  mode: REAL_LAB
  minutes: 30
  level: 3
  supports: "OpenShift 4.21 internal registry authorization (system:image-puller / system:image-builder). Recorded on OpenShift Local as the ordinary user developer, in one temporary project: the roles, the default bindings, a pull from the registry and the grant commands. The denied cross-project pull is quoted from the image pullers lab, which used two projects."
  concepts: [sec.supplychain, sec.rbac, ocp.imagestreams]
  prerequisites: [l.access-paths, c.projects-builds, o2.service-accounts]
  record_on: cluster
  labs: [lab.image-pullers]
  objective: |
    Understand that registry access is RBAC, grant cross-namespace pulls narrowly, treat push access as a
    supply-chain control, and recognise who can already pull without any project grant.
  flow:
    - kind: ask
      id: recall-pull-secret
      recalls: o2.service-accounts
      prompt: "`oc get secrets` in a new project lists a `...-dockercfg-...` Secret for each ServiceAccount. What are they for?"
      choices:
        - text: "Calling the Kubernetes API from a pod"
          why: "The API token is projected into the pod by the kubelet. The `dockercfg` Secrets hold registry credentials."
        - text: "Pulling images from the internal registry"
          why: "OpenShift generates an image pull secret for every ServiceAccount so that its pods can authenticate to the internal registry. They are not API tokens."
        - text: "Logging in to the OAuth server"
          why: "People log in through the OAuth server with an identity provider. ServiceAccounts never do."
      answer: 1
    - kind: teach
      id: situation
      title: "An image that will not pull"
      body: |
        A team keeps shared base images in the project `base-images`. An application in the project `shop`
        runs one of them. Its pod starts, then sits in `ImagePullBackOff`, and the event says
        `authentication required`. The team recreates the pull secret and the error stays.

        The wording misleads. In this scenario, the pod's ServiceAccount presented valid credentials. A
        permission check failed: the internal registry asks the API server whether that identity may pull
        from the image's project. The same error can also mean missing or invalid registry credentials;
        check both the pull-secret setup and the source-project permission before changing either. This
        lesson shows what the registry asks, which roles answer yes, how to grant a pull to one account in
        one project, and who can already pull without any grant.

        The terminal in this lesson is `developer`'s: an ordinary user, administrator of the lesson's temporary
        project only. Every grant here is made inside a project, which a project administrator may do.
    - kind: teach
      id: registry-asks-rbac
      title: "The registry asks RBAC"
      body: |
        The internal registry authorizes each request with the requester's token, as an RBAC check on the
        `layers` subresource of `imagestreams` in the image's project: `get` to pull, `update` to push. Several
        roles carry those verbs:

        - `system:image-puller`: pull only.
        - `system:image-pusher`: pull and push into streams that already exist.
        - `system:image-builder`: pull and push, and create new streams and update build details.
        - `admin`, `edit` and `registry-editor`: pull and push, with much more.

        Ask the API server for the narrowest one:
    - kind: try
      id: try-describe-puller
      body: "Read the rules of the narrowest pull role, the ClusterRole `system:image-puller`."
      accept: ["oc describe clusterrole system:image-puller", "oc describe clusterrole/system:image-puller", "oc describe clusterroles system:image-puller", "oc describe clusterroles/system:image-puller", "oc get clusterrole system:image-puller -o yaml", "oc get clusterrole/system:image-puller -o yaml", "oc get clusterroles system:image-puller -o yaml", "oc get clusterrole system:image-puller -o json", "oc get clusterrole/system:image-puller -o json"]
      hints:
        - match: "^oc get clusterrole system:image-puller$"
          say: "That prints only the name and creation date. Add `-o yaml`, or use `oc describe`, to see the rules."
        - match: "describe role "
          say: "A Role belongs to a project. `system:image-puller` is a ClusterRole: `oc describe clusterrole`."
        - match: "system:image-pullers"
          say: "The role has no `s`: `system:image-puller`. The binding to the group is `system:image-pullers`."
      hint: "`oc describe clusterrole`, then the role's name."
      run: "oc describe clusterrole system:image-puller"
      then: |
        A short role. The description says what it is for, and the rule is one verb, `get`, on `imagestreams/layers`
        (listed twice: once without its API group and once with `image.openshift.io`, the two spellings of the same
        rule).
    - kind: teach
      id: default-bindings
      body: |
        Each project comes with bindings that let its **own** accounts use the registry: `system:image-pullers`, to
        the group `system:serviceaccounts:<project>`, so every account of the project can pull, and
        `system:image-builders`, to the `builder` ServiceAccount, so builds can push.
    - kind: show
      id: read-bindings
      run: "oc get rolebindings -o wide"
      highlight: ["system:image-pullers", "system:image-builders"]
      notice: "Both are there from the start. `system:image-pullers` is a binding to a group in the `GROUPS` column, `system:image-builders` to a ServiceAccount in the last column."
    - kind: show
      id: import-image
      body: "An image in the registry needs an ImageStream tag. This imports `ubi-minimal` into one called `minimal`; `--reference-policy=local` makes pods pull it from the internal registry, which is the path that the RBAC check guards:"
      run: "oc tag registry.access.redhat.com/ubi9/ubi-minimal:latest minimal:latest --reference-policy=local; for i in $(seq 1 30); do oc get istag minimal:latest 2>/dev/null && break; sleep 2; done"
      notice: "The import is asynchronous, so the recording asks until the tag exists. The image reference is now an address on the internal registry (`image-registry.openshift-image-registry.svc:5000`), in this project."
    - kind: show
      id: pull-in-project
      body: "A Deployment in the same project runs that image. Nobody has granted anything:"
      run: "oc create deployment consumer --image=image-registry.openshift-image-registry.svc:5000/academy-lesson-l-image-pullers/minimal:latest -- sleep infinity; oc rollout status deployment/consumer --timeout=180s; oc get pods -l app=consumer"
      notice: "Running. The pod's ServiceAccount, `default`, is in the project's group, and the default binding grants that group the pull."
    - kind: ask
      id: guess-view-pull
      guess: true
      prompt: |
        An account from another project has `view` here and no image-specific grant. Does the default `view` role allow pulls?
      choices:
        - text: "Yes: `view` includes `get` on `imagestreams/layers`"
          why: "OpenShift's default registry-viewer rules include get on imagestreams/layers and aggregate into view. The following recordings show effective checks and the label, but do not isolate that rule from default group access."
        - text: "No: `view` is read-only, and pulling needs a registry role"
          why: "That is a common belief, and on OpenShift it is wrong. Pull is a `get`, and `view` grants `get` on the layers."
        - text: "Only for images that the ServiceAccount's own pods use"
          why: "RBAC does not look at which pods use which image. The check is on the verb, the resource and the project."
      answer: 0
    - kind: show
      id: pull-push-matrix
      body: "Four accounts, two questions each: may it pull (`get`) and may it push (`update`) on the layers of this project? `default` and `builder` come with the project; `viewer` holds `view` and `editor` holds `edit`."
      run: "oc create serviceaccount viewer; oc create serviceaccount editor; oc policy add-role-to-user view -z viewer; oc policy add-role-to-user edit -z editor; for sa in default builder viewer editor; do for v in get update; do echo -n \"$sa: $v layers -> \"; oc auth can-i $v imagestreams --subresource=layers --as=system:serviceaccount:academy-lesson-l-image-pullers:$sa; done; done"
      highlight: ["update layers -> yes"]
      notice: |
        All four accounts answer `yes` to pull; only `builder` and `editor` answer `yes` to push. Every account
        already inherits pull through `system:image-pullers`, including `viewer`, so this matrix alone cannot prove
        that `view` includes pull. The default role rules include a separate pull path through `view`, and the
        next recording checks its aggregation label.
    - kind: show
      id: registry-viewer
      body: "Where that comes from: a ClusterRole whose label makes `view` aggregate its rules."
      run: "oc get clusterrole registry-viewer -o jsonpath='{.metadata.labels}'"
      notice: |
        The output shows `{"rbac.authorization.k8s.io/aggregate-to-view":"true"}`. This proves the aggregation label,
        not the rule contents. OpenShift's default role definitions give `registry-viewer` the layer `get` rule;
        `view` collects it, and `cluster-reader` collects `view` rules as well.
