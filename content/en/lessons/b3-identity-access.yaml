    - kind: show
      id: admin-as-group
      body: "The cluster administrator may impersonate, and asks both questions about your project, where the group has `view`. Expect `yes` for listing and `no` for deleting:"
      run: "for v in list delete; do echo -n \"$v pods: \"; oc auth can-i $v pods -n academy-lesson-o2-groups --as=someone --as-group=academy-auditors; done"
      notice: |
        With `--as-group` you assert the membership yourself, so the answer tells you what the bindings
        grant to that group name, not who is in the group. `--as=someone` is any name: the impersonation
        filter adds `system:authenticated` to it, so what the answer proves is the access of the combined
        identity. `view` allows `list` but not `delete`; the exit status is 1 because the last `can-i` answered no.
    - kind: show
      id: who-can-groups
      body: "Back as `developer`: `who-can` needs no impersonation. This is the part of its answer that lists groups, for a verb that `view` grants:"
      run: "oc policy who-can list pods | sed -n '/^Groups:/,$p'"
      highlight: ["academy-auditors"]
      notice: |
        Under `Groups:`, the group you bound a few steps ago, followed by platform groups that hold broad
        roles on this cluster. The last line, `Error during evaluation, results may not be complete`, is the
        same warning as in the RBAC lesson: one binding on this cluster points at a ClusterRole that does
        not exist, so treat the list as possibly incomplete.
    - kind: try
      id: try-who-can-delete
      body: "An auditor asks who may **delete** pods in your project, people and teams alike. Run the command that lists them."
      accept:
        - "oc adm policy who-can delete po"
        - "oc adm policy who-can delete po --namespace academy-lesson-o2-groups"
        - "oc adm policy who-can delete po --namespace=academy-lesson-o2-groups"
        - "oc adm policy who-can delete po -n academy-lesson-o2-groups"
        - "oc adm policy who-can delete pod"
        - "oc adm policy who-can delete pod --namespace academy-lesson-o2-groups"
        - "oc adm policy who-can delete pod --namespace=academy-lesson-o2-groups"
        - "oc adm policy who-can delete pod -n academy-lesson-o2-groups"
        - "oc adm policy who-can delete pods"
        - "oc adm policy who-can delete pods --namespace academy-lesson-o2-groups"
        - "oc adm policy who-can delete pods --namespace=academy-lesson-o2-groups"
        - "oc adm policy who-can delete pods -n academy-lesson-o2-groups"
        - "oc policy who-can delete po"
        - "oc policy who-can delete po --namespace academy-lesson-o2-groups"
        - "oc policy who-can delete po --namespace=academy-lesson-o2-groups"
        - "oc policy who-can delete po -n academy-lesson-o2-groups"
        - "oc policy who-can delete pod"
        - "oc policy who-can delete pod --namespace academy-lesson-o2-groups"
        - "oc policy who-can delete pod --namespace=academy-lesson-o2-groups"
        - "oc policy who-can delete pod -n academy-lesson-o2-groups"
        - "oc policy who-can delete pods"
        - "oc policy who-can delete pods --namespace academy-lesson-o2-groups"
        - "oc policy who-can delete pods --namespace=academy-lesson-o2-groups"
        - "oc policy who-can delete pods -n academy-lesson-o2-groups"
        - "oc adm policy who-can delete po -n=academy-lesson-o2-groups"
        - "oc adm policy who-can delete pod -n=academy-lesson-o2-groups"
        - "oc adm policy who-can delete pods -n=academy-lesson-o2-groups"
        - "oc policy who-can delete po -n=academy-lesson-o2-groups"
        - "oc policy who-can delete pod -n=academy-lesson-o2-groups"
        - "oc policy who-can delete pods -n=academy-lesson-o2-groups"
      hints:
        - match: "can-i"
          say: "`can-i` answers for one identity, yours or one you impersonate. It cannot list everyone. The reverse question is `who-can`."
        - match: "get (groups|rolebindings)"
          say: "Bindings show subjects and role names, but not what each role allows, and they miss ClusterRoleBindings. `who-can` evaluates the roles."
        - match: "^oc (adm )?policy who-can (get|list|create|patch|update|watch)"
          say: "Check the verb: the question is about deleting pods, so `delete`."
        - match: "^oc (adm )?policy who-can$"
          say: "Add the verb and the resource: `who-can <verb> <resource>`."
      hint: "`oc policy who-can`, the verb, the resource."
      run: "oc policy who-can delete pods | sed -n '/^Groups:/,$p'"
      then: |
        The recording prints only `Groups:` and the evaluation warning. `academy-auditors` is absent: `view`
        does not grant deletion. A full `Users:` list can also contain ServiceAccounts and platform identities;
        those entries are not proof of individual human grants. Trace their bindings before drawing that conclusion.
    - kind: ask
      id: who-can-or-can-i
      prompt: "You want to know which teams can delete pods in `payments`. Which command asks that directly?"
      choices:
        - text: "`oc policy who-can delete pods -n payments`"
          why: "`who-can` starts from the action and lists every user and group whose roles allow it, through RoleBindings and ClusterRoleBindings alike."
        - text: "`oc auth can-i delete pods -n payments`"
          why: "`can-i` answers for one identity, yours unless you impersonate another. It cannot list who else may."
        - text: "`oc get groups`, then each group's members"
          why: "Membership says who is in a team, not what the team may do in `payments`."
      answer: 0
    - kind: teach
      id: membership-effect
      title: "Membership changes access"
      body: |
        Impersonation asserts a membership. Real membership is in the Group object, and changing it changes what a
        real person can do, without touching any binding. The administrator makes a project, `lab-audit`, where only
        the group may read; `developer`, a member, has no other grant there.
    - kind: show
      id: audit-project
      run: "oc adm new-project lab-audit && oc policy add-role-to-group view academy-auditors -n lab-audit"
      notice: "The project, and `view` for the group."
    - kind: show
      id: member-reads
      body: |
        As `developer`. The API server learns a user's groups when it checks their token, and caches that answer for a
        short time, so the loop retries until the membership counts:
      run: "start=$(date +%s); until oc get pods -n lab-audit >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still refused after 5 minutes'; exit 1; }; sleep 5; done; echo \"allowed after $(( $(date +%s) - start )) seconds\"; oc get pods -n lab-audit"
      notice: "Allowed: `developer` reads `lab-audit` only through the group."
    - kind: show
      id: whoami-member
      run: "oc auth whoami"
      highlight: ["academy-auditors"]
      notice: "The groups of the request now include the real group, next to the virtual ones."
    - kind: show
      id: remove-member
      body: "The administrator takes `developer` out of the team:"
      run: "oc adm groups remove-users academy-auditors developer"
      notice: "The group stays, empty; no binding changed."
    - kind: show
      id: member-loses
      body: "As `developer` again, retrying until the change counts:"
      run: "start=$(date +%s); while oc get pods -n lab-audit >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still allowed after 5 minutes'; exit 1; }; sleep 5; done; echo \"refused after $(( $(date +%s) - start )) seconds:\"; oc get pods -n lab-audit || true"
      notice: "Forbidden again. Access followed membership, with the delay of the cached token check."
    - kind: teach
      id: wrong-team-access
      title: "When a team's access is wrong"
      body: |
        The commonest cause is a name. Because RBAC does not check subjects, a binding to a misspelt group is
        accepted silently and grants nothing, until someone creates a group with that name. Here, a colleague binds
        `edit` for `payment-devs`, when the directory's group is `payments-devs`:
    - kind: show
      id: typo-group
      run: "oc policy add-role-to-group edit payment-devs; oc get rolebindings -o wide"
      highlight: ["payment-devs"]
      notice: "No error: the binding exists, and the `GROUPS` column holds the misspelt name. A member of `payments-devs` gains nothing from it."
    - kind: ask
      id: typo-diagnosis
      prompt: "Alice is in the group `payments-devs` and is Forbidden from changing Deployments. Read the bindings. What is wrong?"
      evidence: |
        NAME   ROLE              AGE   USERS   GROUPS
        edit   ClusterRole/edit   1s            payment-devs
      choices:
        - text: "Alice must log in again before the binding applies"
          why: "A binding applies to the next request. Logging in again only matters for OIDC group claims, and the names here do not match anyway."
        - text: "`edit` does not include changing Deployments"
          why: "`edit` allows changing most objects, Deployments included. The problem is who the binding names."
        - text: "The binding names `payment-devs`, a different group"
          why: "RBAC compares names exactly and accepted a binding to a group that does not exist. Bind `edit` to `payments-devs`, and delete the misspelt binding before someone creates a group with that name."
      answer: 2
    - kind: teach
      id: group-deleted
      body: |
        The other direction is the same property. Deleting a group leaves the bindings that name it, and the group's
        name stays valid in them. The administrator deletes the group, then reads the binding in `lab-audit`:
    - kind: show
      id: orphan-binding
      run: "oc delete group academy-auditors && oc get rolebindings -n lab-audit -o wide"
      highlight: ["academy-auditors"]
      notice: |
        The group is gone and the binding still names it. If anyone later creates a group called `academy-auditors`,
        it inherits the grant with no new approval. [Stale and resurrectable grants](/lesson/l.access-can-come-back)
        explains why that matters and how to find such bindings. The recording's cleanup, not shown here, then
        deleted the project `lab-audit`, and the binding with it; on your own cluster, finish with
        `oc delete project lab-audit`.
    - kind: teach
      id: directory-sync
      title: "Groups that come from a directory"
      body: |
        In most organisations the team lists live in a directory, and an administrator copies them into OpenShift.
        `oc adm groups sync` reads a sync configuration for an LDAP or Active Directory server and creates or updates
        the matching Groups. Without `--confirm` it is a dry run that only prints what it would change. Groups that
        disappear from the directory are not deleted by a sync: removing them is a separate step, `prune`, and the
        bindings that name them stay even then. With OpenID Connect, no sync runs: the groups in the token's
        `groups` claim are applied when the user logs in.
    - kind: show
      id: sync-example
      code: |
        $ oc adm groups sync --sync-config=config.yaml
        $ oc adm groups sync --sync-config=config.yaml --confirm
        $ oc adm groups prune --sync-config=config.yaml --confirm
      caption: "Documented example, not run on this cluster: preview a sync, write it, then prune groups that left the directory. Source: OpenShift 4.21, Syncing LDAP groups."
      origin: example
      notice: |
        Each command needs a cluster administrator and an LDAP server. The first prints changes, the second makes them, the
        third removes OpenShift groups whose directory entry is gone. [Synchronise groups from LDAP](/lesson/p.ldap-group-sync),
        later in the path, runs a small directory in a project: it records the preview, the sync and the prune for real, as
        the cluster administrator.
    - kind: ask
      id: oidc-timing
      prompt: |
        Carol joined `ops` at the OIDC provider after her current session began. She is denied an `ops` permission. Why?
      choices:
        - text: "OpenShift reads OIDC groups once a day, on a schedule"
          why: "A schedule is how an LDAP sync usually runs. OIDC groups come with each login."
        - text: "Her login predates the group change"
          why: "The `claims.groups` setting synchronises groups from the provider at login. Logging in again picks up the change."
        - text: "OIDC groups cannot be used in RoleBindings"
          why: "They become ordinary OpenShift groups, usable in any binding."
      answer: 1
    - kind: reflect
      id: explain-groups
      prompt: "A manager asks why access is granted to groups rather than to people, and what a periodic access review must look for. Answer in a few sentences."
      model: |
        We give access to teams, not to people: a team's group lives in the company directory, so when someone
        joins or leaves, one change there updates every project. Individual grants are the ones that get forgotten
        and outlive their reason. One subtlety matters for audits: the platform matches permissions by name, so if
        a group is deleted its grants stay behind and silently return if a new group gets the same name. A periodic
        review therefore lists who can perform sensitive actions, and looks specifically for grants to individuals
        and for grants that name groups which no longer exist.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can bind a role to a group in one project, read the binding to see which group and role it holds, and
        ask who may do something with `who-can`. You know who creates groups, how directory and OpenID Connect
        groups reach OpenShift, and why a misspelt or deleted group leaves a binding that grants nothing, or
        grants to the wrong people later.

        Next, the lessons on workload security start with how pods authenticate:
        [ServiceAccounts and workload identity](/lesson/o2.service-accounts). The
        [Control access with groups](/lab/lab.groups) lab practises this lesson as an administrator.
  sections:
    - id: troubleshooting-team-access
      title: "When a team's access is wrong: symptoms"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | A member gets Forbidden | `oc get rolebindings -n <project> -o wide` against `oc get groups` | the binding names a different group (a typo, or the directory's name differs) | bind the exact group name; delete the wrong binding |
        | Same, and the names match | `oc get groups` does not list the user | the user is not (yet) in the Group: a sync has not run, or an OIDC user has not logged in again | run the sync, or have the user log in again |
        | `oc auth can-i ... --as=someone --as-group=<group>` says yes, the person still fails | the user's real group list | impersonation asserted a membership the person does not have | add the person to the group |
        | Someone who left still has access | `oc policy who-can <verb> <resource> -n <project>` lists them under Users | a binding to the individual, or a token still valid | remove the user binding; delete the User and Identity |
        | A new group suddenly has access nobody granted | old bindings naming that group | a deleted group's bindings stayed, and the name was reused | remove bindings when the group goes |

        Practise in the [Control access with groups](/lab/lab.groups) lab, then in
        [Access that can come back](/lab/lab.access-can-come-back) and
        [Trace a permission to its source](/lab/lab.access-paths).
    - id: directory-sync-in-practice
      title: "Directory sync in practice"
      depth: true
      body: |
        - **Dry run by default.** `oc adm groups sync --sync-config=config.yaml` only prints what it would change;
          add `--confirm` to write. `--type=openshift` resyncs only groups that already exist in OpenShift.
        - **Scheduling.** Nothing runs the sync automatically; the documented pattern is a CronJob with a dedicated
          ServiceAccount that may only manage groups.
        - **Traceability.** Synced groups carry annotations such as `openshift.io/ldap.sync-time` (last sync) and
          `openshift.io/ldap.uid` (the directory entry), which tell you a group is directory-owned; manual changes to
          it are overwritten by the next sync.
        - **Pruning.** A group deleted from the directory stays in OpenShift until an administrator prunes it with
          `oc adm groups prune --sync-config=config.yaml --confirm`; its bindings stay even after that.
        - **OIDC.** With an OpenID Connect provider, `claims.groups` lists the claims used to synchronise groups when
          the user logs in; changes in the provider apply at the next login.
    - id: leavers
      title: "People who leave"
      depth: true
      body: |
        Removing someone from the directory stops new logins, not access already issued. The htpasswd procedure, for
        example, has administrators delete the User object (and its Identity), because otherwise the user can keep
        using a token that has not expired.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **"Temporary" bindings to individual users.** They outlive the temporary need they were made for; bind the team's
          group instead.
        - **Typos in subject names.** RBAC accepts a binding to a group that does not exist, so a misspelt name fails
          silently, and works later if someone creates that name.
        - **Expecting directory changes to apply at once.** Synced groups change when the sync runs; OIDC groups change
          when the user next logs in.
        - **Deleting the group and calling it done.** The bindings stay; remove them too, or a future group with the
          same name inherits them.
        - **Binding to `system:authenticated`.** It covers every authenticated user of the cluster, now and later.
  review:
    - q: "Who can create OpenShift Groups?"
      a: "Cluster administrators (Groups are cluster-scoped); project admins can bind roles to existing groups in their project."
    - q: "Which command lists the users and groups that may perform a verb in a project?"
      a: "oc policy who-can <verb> <resource> -n <project>: the reverse of can-i, and the quickest way to spot an individual binding that should have been a group."
    - q: "What does LDAP group sync do without --confirm?"
      a: "Nothing: it is a dry run that only prints what it would change."
    - q: "Name the virtual groups every OAuth-authenticated user belongs to."
      a: "system:authenticated and system:authenticated:oauth (plus any Group objects that list the user)."
    - q: "When do OpenID Connect group changes reach OpenShift?"
      a: "At the user's next login, through the claims.groups setting of the identity provider."
    - q: "Why does a binding to a misspelt group not fail?"
      a: "RBAC matches subject names and never checks that the subject exists; a deleted group's bindings stay too."
  commands:
    - {cmd: "oc adm groups new academy-auditors developer", expect: fail, meaning: "creating a Group is a cluster-admin task: Forbidden for the owner of a project"}
    - {cmd: "oc adm groups new academy-auditors developer", as: admin, meaning: "the administrator creates the group, with developer in it"}
    - {cmd: "oc get groups", as: admin, meaning: "the real Group objects; virtual groups never appear"}
    - {cmd: "oc policy add-role-to-group view academy-auditors", meaning: "bind view to a group in this project; the group's existence is not checked"}
    - {cmd: "oc get rolebindings -o wide", meaning: "the bindings with their roles; the GROUPS column holds the group name RBAC will match"}
    - {cmd: "oc auth whoami", meaning: "your own groups: the virtual groups the cluster added"}
    - {cmd: "oc auth can-i list pods --as=someone --as-group=academy-auditors", expect: fail, meaning: "testing a group needs the right to impersonate users and groups: refused"}
    - {cmd: "for v in list delete; do echo -n \"$v pods: \"; oc auth can-i $v pods -n academy-lesson-o2-groups --as=someone --as-group=academy-auditors; done", as: admin, expect: any, meaning: "the administrator may impersonate: what the group may do in the project"}
    - {cmd: "oc policy who-can list pods | sed -n '/^Groups:/,$p'", meaning: "the groups that may list pods in the project; the Users part of the answer is left out"}
    - {cmd: "oc policy who-can delete pods | sed -n '/^Groups:/,$p'", meaning: "the groups that may delete pods: view does not allow it"}
    - {cmd: "oc adm new-project lab-audit && oc policy add-role-to-group view academy-auditors -n lab-audit", as: admin, meaning: "a project where only the group may read"}
    - {cmd: "start=$(date +%s); until oc get pods -n lab-audit >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still refused after 5 minutes'; exit 1; }; sleep 5; done; echo \"allowed after $(( $(date +%s) - start )) seconds\"; oc get pods -n lab-audit", timeout: 360, meaning: "developer reads lab-audit through the group"}
    - {cmd: "oc auth whoami", meaning: "the request's groups include the real group"}
    - {cmd: "oc adm groups remove-users academy-auditors developer", as: admin, meaning: "take developer out of the group"}
    - {cmd: "start=$(date +%s); while oc get pods -n lab-audit >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still allowed after 5 minutes'; exit 1; }; sleep 5; done; echo \"refused after $(( $(date +%s) - start )) seconds:\"; oc get pods -n lab-audit || true", timeout: 360, meaning: "access follows membership"}
    - {cmd: "oc policy add-role-to-group edit payment-devs; oc get rolebindings -o wide", meaning: "a binding to a misspelt group name is accepted"}
    - {cmd: "oc delete group academy-auditors && oc get rolebindings -n lab-audit -o wide", as: admin, meaning: "the group is deleted; the binding that names it stays"}
  experiment:
    id: X-AUTH-03
    objective: "Create a Group, show that a real member gains and loses access through it, impersonate a member as the administrator, delete the group and show the binding left behind; then remove everything."
    changes:
      - "Group academy-auditors (created, membership changed, deleted)"
      - "Project lab-audit with a RoleBinding for the group (created, deleted)"
    preflight:
      - {cmd: "oc get group academy-auditors", expect: fail}
      - {cmd: "oc get project lab-audit", expect: fail}
    snapshot:
      - "oc get groups -o name"
      - "oc get project lab-audit -o name --ignore-not-found"
    rollback:
      - "oc delete group academy-auditors --ignore-not-found"
      - "oc delete project lab-audit --ignore-not-found --wait=false"
    settle:
      - "oc wait --for=delete project/lab-audit --timeout=300s"
  references:
    - {title: "OpenShift 4.21: Users and groups (understanding authentication)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-authentication#rbac-groups_understanding-authentication"}
    - {title: "OpenShift 4.21: Using RBAC (default cluster roles)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/using-rbac"}
    - {title: "OpenShift 4.21: Syncing LDAP groups", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/ldap-syncing"}
    - {title: "OpenShift 4.21: Configuring an OpenID Connect identity provider", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/configuring-identity-providers#configuring-oidc-identity-provider"}
    - {title: "OpenShift 4.21: Identity provider parameters (mappingMethod)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-identity-provider"}
    - {title: "OpenShift 4.21: Configuring an htpasswd identity provider (removing users)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/configuring-identity-providers#configuring-htpasswd-identity-provider"}
    - {title: "Kubernetes: Authenticating (system:authenticated)", url: "https://kubernetes.io/docs/reference/access-authn-authz/authentication/"}
    - {title: "Kubernetes: RBAC user-facing roles", url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles"}
- id: o2.service-accounts
  title: "ServiceAccounts and workload identity"
  subtitle: "Tokens, API access and roles with -z"
  module: b3-workload-security
  mode: REAL_LAB
  minutes: 35
  level: 2
  supports: |
    Kubernetes 1.34 bound ServiceAccount tokens; OpenShift 4.21 (automatic long-lived API token Secret creation stopped in 4.16). Recorded on OpenShift Local as the ordinary user developer, in a temporary project, with a Deployment of the ubi9/httpd-24 image. Granting an SCC to a ServiceAccount needs an administrator and is shown from the SCC lab.
  concepts: [sec.serviceaccounts, sec.scc, sec.rbac]
  prerequisites: [f.rbac]
  simulator: rbac
  labs: [lab.sa-scc, ch.deploy-bot-access]
  record_on: cluster
  objective: |
    Give each workload its own identity, grant it exactly what it needs (API access through RBAC, special pod
    privileges through SCCs), and avoid the shared `default` account.
  flow:
    - kind: ask
      id: recall-sa-name
      recalls: f.rbac
      prompt: "RBAC sees the ServiceAccount `reporter` of the project `team` as which user name?"
      choices:
        - text: "`system:serviceaccount:reporter`"
          why: "The project is part of the name: two projects can each have a `reporter`, and RBAC must tell them apart."
        - text: "`system:serviceaccounts:team`"
          why: "That is the group of every ServiceAccount in `team`, with a plural prefix. It names many accounts, not the user name of one."
        - text: "`system:serviceaccount:team:reporter`"
          why: "The name has the fixed prefix `system:serviceaccount:`, then the project and the name. It is what `--as` and the logs show."
      answer: 2
    - kind: teach
      id: situation
      title: "Who is a pod?"
      body: |
        A dashboard pod must list the pods of its own project through the API. When it calls the API server, who
        is it? A person has a login and a token from the OAuth server. A pod has neither. It runs as a
        **ServiceAccount**: an identity that belongs to one project, and that RBAC treats like any other subject.

        Every pod runs as one. The Deployment's pod template names it in `serviceAccountName`, and when it does not,
        the pod runs as the project's `default` account. People forget this detail, and it decides what the pod's
        credentials are allowed to do.

        Every command in this lesson is run by `developer`, the administrator of its own temporary project:
        creating ServiceAccounts and granting them roles there needs no cluster administrator. The calls made from
        inside a pod use that pod's ServiceAccount token, so the API server sees the ServiceAccount, not
        `developer`.
    - kind: show
      id: list-serviceaccounts
      run: "oc get serviceaccounts"
      notice: |
        This project has `default`, `builder` and `deployer`. The latter two depend on the Build and
        DeploymentConfig capabilities enabled here. `SECRETS` counts entries in each account's `secrets` field;
        on this cluster that is one generated registry pull Secret. Such Secrets depend on an enabled integrated
        registry; they are not long-lived API token Secrets.
    - kind: try
      id: try-create-web
      body: "Start a Deployment named `web` from the image `registry.access.redhat.com/ubi9/httpd-24:latest`, without naming any ServiceAccount."
      accept:
        - "oc create deploy --image=registry.access.redhat.com/ubi9/httpd-24:latest web"
        - "oc create deploy web --image registry.access.redhat.com/ubi9/httpd-24:latest"
        - "oc create deploy web --image=registry.access.redhat.com/ubi9/httpd-24:latest"
        - "oc create deployment --image=registry.access.redhat.com/ubi9/httpd-24:latest web"
        - "oc create deployment web --image registry.access.redhat.com/ubi9/httpd-24:latest"
        - "oc create deployment web --image=registry.access.redhat.com/ubi9/httpd-24:latest"
      hints:
        - match: "^oc create deployment web$"
          say: "A Deployment needs an image: add `--image=<image>`."
        - match: "^oc run"
          say: "`oc run` starts a bare pod. The task is a Deployment, which creates its pods through a ReplicaSet: `oc create deployment`."
        - match: "--serviceaccount|--service-account"
          say: "The point is to name no account and see which one the pod gets."
        - match: "^oc create web"
          say: "`oc create` needs the kind of object first: `deployment`, then the name."
      hint: "`oc create deployment`, the name, and `--image=` with the image."
      run: "oc create deployment web --image=registry.access.redhat.com/ubi9/httpd-24:latest >/dev/null; oc rollout status deployment/web --timeout=180s >/dev/null; oc get pod -l app=web -o jsonpath='{.items[0].spec.serviceAccountName}'"
      then: |
        The recording also waited for the pod to start, and printed the account the pod runs as: `default`, filled in
        by the API server although nobody wrote it in the Deployment.
    - kind: teach
      id: pod-token
      title: "The token inside the pod"
      body: |
        When a pod is created, the API server adds a **projected volume** named `kube-api-access-<suffix>`, mounted
        at `/var/run/secrets/kubernetes.io/serviceaccount`. The kubelet, the agent on the node, asks the API server
        for a token for the pod's ServiceAccount and writes it there, together with the cluster's CA certificate
        and the pod's project.
    - kind: show
      id: token-files
      run: "oc exec deploy/web -- ls /var/run/secrets/kubernetes.io/serviceaccount"
      notice: |
        `token` is the credential. `ca.crt` is the CA that signs the API server's certificate, and `namespace` the
        pod's project. `service-ca.crt` is OpenShift's own addition: the bundle for calling Services that use
        certificates from the service CA.
    - kind: ask
      id: guess-token-death
      guess: true
      prompt: "An attacker copies the token file out of a pod. Five minutes later you delete the pod. Can the attacker still use the token?"
      choices:
        - text: "It is revoked after pod deletion"
          why: "Projected tokens are bound to a pod. Deletion invalidates them, with a grace period and possible authentication caching; the recording below observes rejection after deletion."
        - text: "Yes, until the ServiceAccount itself is deleted"
          why: "That is how an unbound TokenRequest token behaves: deleting a pod does not revoke it. This question is about the projected token bound to this pod."
        - text: "Yes, for a year, because projected tokens last that long"
          why: "This cluster records a 365-day expiry, but pod deletion invalidates a projected token before that expiry."
      answer: 0
    - kind: show
      id: token-claims
      body: |
        A token is a signed document, and its middle part, the claims, is readable. This command decodes only the
        claims of the pod's token, prints some of them and the lifetime it works out from two others; the token
        itself is never shown:
      run: "oc exec deploy/web -- cat /var/run/secrets/kubernetes.io/serviceaccount/token | cut -d. -f2 | tr '_-' '/+' | { cat; echo '=='; } | tr -d '\\n' | base64 -d 2>/dev/null | jq '{sub, aud, lifetime_days: ((.exp - .iat) / 86400), pod: .[\"kubernetes.io\"].pod.name, serviceaccount: .[\"kubernetes.io\"].serviceaccount.name}'"
      highlight: ["sub", "pod", "lifetime_days"]
      notice: |
        `sub` is the user name RBAC sees. `aud`, the audience, says the token is meant for the API server. `pod` shows
        the binding: this token belongs to one pod. And `lifetime_days` is 365: the kubelet asks for about an hour,
        but the API server stretches such default-length tokens to a year (Kubernetes' extended token expiration,
        on by default in OpenShift 4.21) so that old clients keep working. What limits a stolen token is not the
        hour, it is the binding to the pod.
    - kind: show
      id: token-dies
      body: |
        Test the binding. Save the pod's token in a file, use it once, delete the pod, wait for a
        replacement plus 15 seconds, and use the saved token again:
      run: "oc exec deploy/web -- cat /var/run/secrets/kubernetes.io/serviceaccount/token > pod.token; oc --token=\"$(cat pod.token)\" whoami; oc delete pod -l app=web --wait=true >/dev/null; oc wait --for=condition=ready pod -l app=web --timeout=120s >/dev/null; sleep 15; oc --token=\"$(cat pod.token)\" whoami"
      highlight: ["Unauthorized"]
      notice: |
        The first call prints `system:serviceaccount:academy-lesson-o2-service-accounts:default`. After pod
        deletion, the saved token returns Unauthorized. This run waited for a replacement pod and then
        another 15 seconds; it does not establish a universal revocation delay. Kubernetes documents
        revocation by 60 seconds beyond the pod's deletion timestamp, and authentication caching can delay
        observation. Delete the pod if its projected token is compromised; the replacement receives a new
        token.
    - kind: teach
      id: calling-the-api
      title: "Calling the API from a pod"
      body: |
        Inside a pod the API server is at `https://kubernetes.default.svc`. A client library finds the address, the
        CA and the token by itself and re-reads the token file as the kubelet refreshes it. A plain `curl` shows the
        mechanics: it sends the token as a bearer credential. This runs inside the pod and asks for the pods of its
        own project, printing only the message and status code:
    - kind: show
      id: api-as-default
      run: "oc exec deploy/web -- sh -c 'SA=/var/run/secrets/kubernetes.io/serviceaccount; curl -s --cacert $SA/ca.crt -H \"Authorization: Bearer $(cat $SA/token)\" https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/pods' | grep -E '\"(message|code)\"'"
      highlight: ["default"]
      notice: |
        403. The message names the identity (the project's `default` account), the verb, the resource, its API group
        (`""`, the core group) and the project: everything you need to ask the same question from outside. The
        credential is valid; no rule grants it `list pods`. Its default registry pull and API discovery rights are separate.
    - kind: ask
      id: which-account-403
      prompt: "You created the ServiceAccount `reporter` and granted it `view`. The app still gets 403, and the message names the account below. What do you fix?"
      evidence: |
        pods is forbidden: User "system:serviceaccount:team:default" cannot list resource "pods"
        in API group "" in the namespace "team"
      choices:
        - text: "Grant `view` to `default` as well"
          why: "That would work, and give the right to every pod in the project that names no account: exactly what a dedicated account avoids."
        - text: "Restart the pod so it picks up the binding"
          why: "RBAC is evaluated on every request and needs no restart. The problem is that this pod is not `reporter` at all."
        - text: "Make the Deployment's pods run as `reporter`"
          why: "The 403 names the identity the pod really uses. The binding is right; the pod runs as the wrong account. The template change rolls out new pods that use `reporter`."
      answer: 2
    - kind: teach
      id: grant-and-switch
      title: "A dedicated account, then the grant"
      body: |
        Give each application its own ServiceAccount to avoid sharing its grants with unrelated pods. This
        is not isolation from project editors, who can create workloads using that same account. Granting
        uses the commands you know from RBAC. `oc policy add-role-to-user` has a `-z` option: `-z reporter`
        means "the ServiceAccount `reporter` of the project given by `-n`", and builds the long name for
        you.
    - kind: show
      id: create-and-grant
      run: "oc create serviceaccount reporter; oc policy add-role-to-user view -z reporter"
      notice: "The account exists and is bound to the `view` role in this project. The pod does not use it yet."
    - kind: teach
      id: set-account
      body: |
        A running pod's `serviceAccountName` cannot be changed. For a Deployment, change the account in its
        pod template instead; the controller then creates replacement pods. `oc set serviceaccount` edits
        the template, and the Deployment rolls out new pods that run as the account you name.
    - kind: try
      id: try-set-sa
      body: |
        In the current project `academy-lesson-o2-service-accounts`, make the Deployment `web` use the existing
        ServiceAccount `reporter`.
      accept:
        - "oc patch deploy web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\""
        - "oc patch deploy web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" --namespace academy-lesson-o2-service-accounts"
        - "oc patch deploy web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" --namespace=academy-lesson-o2-service-accounts"
        - "oc patch deploy web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" -n academy-lesson-o2-service-accounts"
        - "oc patch deploy web --patch '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}'"
        - "oc patch deploy web --patch '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}' --namespace academy-lesson-o2-service-accounts"
        - "oc patch deploy web --patch '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}' --namespace=academy-lesson-o2-service-accounts"
        - "oc patch deploy web --patch '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}' -n academy-lesson-o2-service-accounts"
        - "oc patch deploy web -p \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\""
        - "oc patch deploy web -p \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" --namespace academy-lesson-o2-service-accounts"
        - "oc patch deploy web -p \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" --namespace=academy-lesson-o2-service-accounts"
        - "oc patch deploy web -p \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" -n academy-lesson-o2-service-accounts"
        - "oc patch deploy web -p '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}'"
        - "oc patch deploy web -p '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}' --namespace academy-lesson-o2-service-accounts"
        - "oc patch deploy web -p '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}' --namespace=academy-lesson-o2-service-accounts"
        - "oc patch deploy web -p '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}' -n academy-lesson-o2-service-accounts"
        - "oc patch deploy/web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\""
        - "oc patch deploy/web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" --namespace academy-lesson-o2-service-accounts"
        - "oc patch deploy/web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" --namespace=academy-lesson-o2-service-accounts"
        - "oc patch deploy/web --patch \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\"serviceAccountName\\\":\\\"reporter\\\"}}}}\" -n academy-lesson-o2-service-accounts"
        - "oc patch deploy/web --patch '{\"spec\":{\"template\":{\"spec\":{\"serviceAccountName\":\"reporter\"}}}}'"
