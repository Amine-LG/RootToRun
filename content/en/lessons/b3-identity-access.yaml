      id: three-projects
      prompt: "A pipeline must update Deployment images in `dev`, `test` and `prod`. Which grant is the narrowest that works?"
      choices:
        - text: "A narrow ClusterRole, with one ClusterRoleBinding"
          why: "The rules are narrow, but a ClusterRoleBinding applies them in every project of the cluster, not only the three."
        - text: "A RoleBinding to `admin` in each of the three projects"
          why: "`admin` can read Secrets, delete anything and manage bindings: far more than updating images."
        - text: "A narrow ClusterRole, with a RoleBinding in each project"
          why: "Define once, bind where needed: the rules apply in exactly the three projects."
      answer: 2
    - kind: teach
      id: paths
      title: "Effective permission is a path"
      body: |
        "Can X do Y?" is answered by finding **any** binding that connects X, directly or through a group, to a
        role containing Y. You never compute it by hand. `oc auth can-i --list --as=...` summarises an
        identity's rules in a project, and `who-can` asks the reverse question, the auditor's: who may do this?
    - kind: try
      id: try-can-i-list
      body: "List everything the ServiceAccount `reporter` may do in your project `academy-lesson-f-rbac`, instead of asking about one verb."
      accept:
        - "oc auth can-i --list --as system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i --list --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i --list --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i --list --as system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i --list --as=system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i --list --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i --list --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i --list --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i --list --as system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
        - "oc auth can-i --list --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
      hints:
        - match: "--as=reporter|--as reporter"
          say: "`--as=reporter` asks about a *user* named reporter. A ServiceAccount's name is `system:serviceaccount:<project>:<name>`."
        - match: "^oc auth can-i (get|list|create|delete|patch|update|watch)"
          say: "A verb and a resource ask one question. `--list` replaces them and asks for everything."
        - match: "^oc auth can-i --list$"
          say: "That lists what you may do. Add `--as=` with the ServiceAccount's full name to list what `reporter` may do."
      hint: "`oc auth can-i --list`, then `--as=system:serviceaccount:` and the project and name."
      run: "oc auth can-i --list --as=system:serviceaccount:academy-lesson-f-rbac:reporter | grep -E '^(Resources|pods) '"
      then: |
        The recording filtered the table to its heading and the pod rule, because the full list also holds the few
        things every identity may do. One resource of its own: `pods`, with the three verbs of the Role.
    - kind: show
      id: who-can
      body: "Who may patch Deployments here? The full answer is long, because platform components hold broad roles, so the output is filtered to the project, you, and the error line:"
      run: "oc policy who-can patch deployments.apps | grep -E 'academy-lesson|developer|^Groups|Error'"
      notice: |
        `ci-deployer` is listed by name, next to `developer` (the project's administrator) and `editor`, which
        holds `edit`. Members of a group appear only as the group: a ServiceAccount allowed through `system:serviceaccounts:<project>` would not be listed
        by name. The last line, `Error during evaluation, results may not be complete`, means one binding on this
        cluster refers to a ClusterRole that does not exist. The `crc-` prefix of its name shows that it comes from
        OpenShift Local, not from a standard OpenShift installation. Treat the list as possibly incomplete.
    - kind: teach
      id: reading-403
      title: "Reading a 403 and fixing it"
      body: |
        A workload meets RBAC as `403 Forbidden`, and the message names everything you need: the identity, the
        verb, the resource, its API group and the project. Here is a real one, from a command that runs as
        `reporter` with a short-lived token (the token is never printed):
    - kind: show
      id: forbidden-as-reporter
      run: "oc --token=\"$(oc create token reporter --duration=10m)\" get secrets"
      notice: "The identity is `system:serviceaccount:academy-lesson-f-rbac:reporter`, the verb `list`, the resource `secrets`, the group `\"\"`: reproduce it with `oc auth can-i list secrets --as=...`. If that also says `no`, it is RBAC; then compare each binding's subject and role with that request."
      understand:
        purpose: Sends one request as the ServiceAccount `reporter`, with a short-lived token, to see the real error that
          identity gets.
        parts:
          - text: oc create token reporter --duration=10m
            means: Asks the API server for a new token for the ServiceAccount, with a requested lifetime of 10 minutes
              (the server may choose a different one).
          - text: --token="$(
            means: Uses that token for this one command instead of your login. The double quotes keep the token as one
              word; it is never printed.
        caution: 'The token is a credential. While the command runs it is visible in the machine''s process list, and
          anyone who copies it can act as `reporter` until it expires: keep the lifetime short.'
        concepts:
          - sec.serviceaccounts
          - sec.rbac
        refs:
          - title: 'Kubernetes: Service accounts (TokenRequest tokens)'
            url: https://kubernetes.io/docs/concepts/security/service-accounts/
          - title: OpenShift 4.21 CLI reference (oc create token)
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-create-token
    - kind: show
      id: pipeline-403
      body: |
        The message also names the API group, and the commonest subtle mistake in a Role is naming the wrong one.
        To read the message a refused pipeline sees, you create a new ServiceAccount `pipeline`, with no grant at all,
        and with its token it tries to patch a Deployment `web`. It is refused. The Deployment need not exist:
        authorization is checked before the object is looked up, so a caller without the permission gets Forbidden
        either way. (`oc patch` reads the object before it changes it, so the first refusal is for `get`.)
      run: "oc create serviceaccount pipeline; oc --token=\"$(oc create token pipeline --duration=10m)\" patch deployment web -p '{\"spec\":{\"replicas\":1}}'"
      highlight: ["forbidden"]
      notice: "The group in the message is `apps`: Deployments live there, not in the core group (`\"\"`). A Role must name `apps` for its rule to match."
    - kind: ask
      id: wrong-group-fix
      prompt: "A pipeline's ServiceAccount gets the refusal above for `get`. A colleague's Role for it is shown. What is the fix?"
      evidence: |
        # the Role
        rules:
        - apiGroups: [""]
          resources: ["deployments"]
          verbs: ["get", "list", "patch"]

        # the refusal
        cannot get resource "deployments" in API group "apps"
      choices:
        - text: "Add the verb `update`, because `patch` is not enough"
          why: "The message is about `get`, which the Role already lists. The mismatch is the API group named in the message."
        - text: "Change the rule's API group from core to `apps`"
          why: "A rule matches group, resource and verb together. `deployments` in the group `\"\"` matches nothing. `oc create role ... --resource=deployments.apps` writes the right group for you."
        - text: "Bind the `edit` ClusterRole to the account instead"
          why: "It would work, but it grants far more (Secrets, deletes) to hide a one-word mistake."
      answer: 1
    - kind: teach
      id: names-not-objects
      body: |
        One more property of this model, which the next lessons use: a binding refers to subjects **by name**.
        RBAC does not check that the subject exists, so a typo in a subject name is accepted silently and grants
        nothing. And if a ServiceAccount is deleted and another is created with the same name, the old bindings
        apply to the new one. [Stale and resurrectable grants](/lesson/l.access-can-come-back) shows it.
    - kind: explore
      id: rbac-model
      sim: rbac
      body: "In the model, try the first challenge: make `oc auth can-i list pods` answer no for the `ci` ServiceAccount in `team-a`. There is no deny rule, so remove every path that grants it, including the one through a virtual group."
    - kind: reflect
      id: explain-least-privilege
      prompt: "A junior developer asks why the CI ServiceAccount should not get the `admin` role in production. What do you tell them?"
      model: |
        The pipeline only needs to update the image of a few Deployments, so give it a Role with get, list
        and patch on deployments, and nothing else. The Role reduces direct API access, but patching a
        Deployment still allows changing its pod template, including mounting Secrets and selecting a
        privileged ServiceAccount. It does not enforce image-only updates. `admin` would let it read
        Secrets, delete anything in the project and even grant itself or others more rights. Least privilege
        is not about distrust; it limits the blast radius of mistakes and attacks.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can say how RBAC decides, choose between a Role, a ClusterRole and the two bindings, read what `admin`,
        `edit` and `view` allow, and build a least-privilege grant for a ServiceAccount, then prove it with
        `oc auth can-i --as` and with `who-can`. You can read a 403 and tell a missing binding from a wrong API
        group, and you know why a grant you cannot hold yourself is refused.

        Next, [Users, groups and access for teams](/lesson/o2.groups) moves from single ServiceAccounts to groups of
        people, where the same bindings give a whole team its access.
  sections:
    - id: reading-403-table
      title: "A 403, by symptom"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | 403 although "a binding was created" | `oc get rolebindings -o wide` shows subject `reportr` | typo in the subject (nothing checks that it exists) | delete it, bind the real ServiceAccount |
        | 403 on `deployments` with a Role that lists them | message says API group `apps`; Role has group `""` | wrong API group | rule for `deployments` in `apps` |
        | logs or `oc exec` denied, pods readable | message names `pods/log` or `pods/exec` | subresource not granted | add the subresource rule |
        | allowed in one project, 403 in another | RoleBinding exists in the first only | RoleBinding scope | one RoleBinding per project |
        | binding refused at creation: "attempting to grant RBAC permissions not currently held" | your own `can-i --list` | escalation prevention | ask someone who holds the permissions, or the `bind` verb |

        Practise on [403 Forbidden from the API](/lab/inc.rbac-denied), trace paths in
        [Trace a permission to its source](/lab/lab.access-paths), and then solve the graded
        [Control project access](/lab/ch.deploy-bot-access) challenge.
    - id: other-default-roles
      title: "The cluster-wide default roles"
      depth: true
      body: |
        | ClusterRole | Typically bound | Allows |
        |---|---|---|
        | `admin` | per project (the project's creator gets it) | view and change most objects in the project, including roles and bindings (within escalation checks); it can read but not change ResourceQuotas and LimitRanges |
        | `edit` | per project | change most objects, **including reading Secrets**, but not view or change roles and bindings |
        | `view` | per project | read most objects; no Secrets, no roles or bindings, no changes |
        | `basic-user` | cluster-wide | read basic information about projects and users |
        | `self-provisioner` | cluster-wide, to `system:authenticated:oauth` | create their own projects |
        | `cluster-reader` | cluster-wide | read most objects in the cluster, change nothing |
        | `cluster-admin` | cluster-wide | everything |

        `admin`, `edit`, `view` and `cluster-reader` are the aggregated ones.
    - id: grants-by-need
      title: "Which grant for which need"
      depth: true
      body: |
        | Need | Grant |
        |---|---|
        | read-only troubleshooting in one project | `view` with a RoleBinding |
        | a developer working in their project | `edit` (knowing it includes Secrets and running pods as any ServiceAccount there) |
        | a pipeline that updates images | custom Role: get, list, patch on `deployments.apps` |
        | a job that reads pod status | custom Role: get, list, watch on `pods` |
        | the same need in many projects | one ClusterRole, one RoleBinding per project |
        | people with the same job | bind a Group, not each user |

        A binding's `roleRef` cannot be changed after creation: to point it at another role, delete the binding and
        create a new one. On OpenShift, `oc policy add-role-to-user view -z reporter` is a shortcut that creates a
        RoleBinding to the ClusterRole `view` for the ServiceAccount `reporter`.
    - id: who-and-groups
      title: "Groups and virtual groups"
      depth: true
      body: |
        Groups include virtual ones nobody creates: `system:authenticated` (every logged-in identity),
        `system:authenticated:oauth` (users who logged in through the OAuth server) and
        `system:serviceaccounts:<ns>` (every ServiceAccount of a project). A grant to one of them reaches everyone
        in it. To test a group's access, an administrator can add `--as-group=<group>` to `can-i`; that needs the
        right to impersonate users and groups, which `developer` does not have, as the recording shows.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Granting `edit` or `admin` "to be safe".** Both can read every Secret in the project; a narrow Role
          (for example get, list and patch on `deployments.apps`) is usually enough for automation.
        - **Using a ClusterRoleBinding when a RoleBinding was meant.** The same ClusterRole then applies in every
          project.
        - **Wrong API group or subresource.** Deployments live in group `apps` (`deployments.apps`); logs and exec
          are separate subresources (`pods/log`, `pods/exec`) that `pods` rules do not cover.
        - **Testing your own permissions instead of the workload's.** Without `--as=system:serviceaccount:...` you
          check what *you* can do.
        - **Binding `--user=ci-bot` for a ServiceAccount.** A user named `ci-bot` and the ServiceAccount
          `system:serviceaccount:<ns>:ci-bot` are different subjects; use `--serviceaccount=<ns>:<name>` or `-z`.
        - **Missing group paths.** A user may get access through a group binding (including virtual groups) that no
          per-user listing shows; check the real groups and both kinds of binding. `who-can` can report incomplete
          results, and an impersonated user has only the groups you explicitly assert.
        - **Granting to `system:serviceaccounts:<ns>`.** It covers every ServiceAccount of the project, including
          ones created later.
        - **Deleting a ServiceAccount to revoke access.** Remove the bindings; otherwise a new account with the same
          name inherits them.
        - **Editing an aggregated or default role.** The control plane overwrites aggregated rules; write a new
          ClusterRole (with an aggregation label if it should extend `edit` or `view`).
  review:
    - q: "What is the scope of a RoleBinding that references a ClusterRole?"
      a: "Only the RoleBinding's project (namespace)."
    - q: "How do you check what a ServiceAccount can do without its token?"
      a: "oc auth can-i <verb> <resource> --as=system:serviceaccount:<ns>:<sa> -n <ns>. As a project admin you may impersonate the ServiceAccounts of your own projects."
    - q: "Why can a project admin not grant cluster-admin to someone?"
      a: "RBAC escalation prevention: a binding can only grant permissions you hold yourself, unless you have the bind verb on that role."
    - q: "What separates admin, edit and view in a project?"
      a: "admin: most objects including roles and bindings, but only reading ResourceQuotas and LimitRanges. edit: change most objects and read Secrets, but no roles or bindings. view: read most objects, no Secrets, no roles or bindings."
    - q: "How does a new CRD's permission reach everyone who has edit?"
      a: "Aggregation: a ClusterRole labelled rbac.authorization.k8s.io/aggregate-to-edit: \"true\" has its rules merged into edit by the control plane."
    - q: "Which parts of a 403 message do you compare with the bindings?"
      a: "The identity, the verb, the resource and its API group (\"\" = core), and the namespace."
    - q: "Which command lists the users and groups that may perform a verb in a project?"
      a: "oc policy who-can <verb> <resource> -n <project>: the reverse of can-i. Members of a group appear only as the group."
  labs: [lab.rbac, inc.rbac-denied]
  enterprise: |
    Access reviews, break-glass procedures for cluster-admin, groups synced from the corporate directory, and
    evidence of least privilege for automation accounts are standard audit topics in regulated organisations.
  commands:
    - {cmd: "oc create serviceaccount reporter; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter", expect: any, meaning: "a new ServiceAccount, and the answer for it: no, because nothing grants it anything"}
    - {cmd: "oc create role pod-reader --verb=get,list,watch --resource=pods --dry-run=client -o yaml", meaning: "the Role as YAML, nothing created: one rule with a group, a resource and verbs"}
    - {cmd: "oc create role pod-reader --verb=get,list,watch --resource=pods; oc create rolebinding reporter-pods --role=pod-reader --serviceaccount=academy-lesson-f-rbac:reporter; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter", meaning: "a Role, a RoleBinding to the ServiceAccount, and the answer now: yes"}
    - {cmd: "oc auth can-i delete pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter", expect: any, meaning: "the Role has no delete: no, and exit status 1"}
    - {cmd: "oc get rolebindings -o wide", meaning: "the bindings of the project, with their roles and subjects"}
    - {cmd: "oc create serviceaccount viewer; oc create serviceaccount editor; oc policy add-role-to-user view -z viewer; oc policy add-role-to-user edit -z editor; for sa in viewer editor; do for q in \"get secrets\" \"create deployments\" \"create rolebindings\"; do echo -n \"$sa: $q -> \"; oc auth can-i $q --as=system:serviceaccount:academy-lesson-f-rbac:$sa; done; done", expect: any, meaning: "view and edit, compared by asking the API server"}
    - {cmd: "oc get clusterrole edit -o jsonpath='{.aggregationRule}'", meaning: "the label selector that fills the rules of edit"}
    - {cmd: "oc create rolebinding grant-cluster-admin --clusterrole=cluster-admin --serviceaccount=academy-lesson-f-rbac:editor", expect: fail, meaning: "escalation prevention: you cannot grant rules you do not hold"}
    - {cmd: "oc create serviceaccount ci-deployer", meaning: "a dedicated identity for a pipeline"}
    - {cmd: "oc create role deploy-patcher --verb=get,list,patch --resource=deployments.apps", meaning: "the narrowest Role for updating Deployments"}
    - {cmd: "oc create rolebinding ci-deployer-patch --role=deploy-patcher --serviceaccount=academy-lesson-f-rbac:ci-deployer", meaning: "bind it to the dedicated ServiceAccount"}
    - {cmd: "for q in \"patch deployments.apps\" \"delete deployments.apps\" \"get secrets\"; do echo -n \"$q: \"; oc auth can-i $q --as=system:serviceaccount:academy-lesson-f-rbac:ci-deployer; done", expect: any, meaning: "prove both sides: yes to what it needs, no to its dangerous neighbours"}
    - {cmd: "oc auth can-i --list --as=system:serviceaccount:academy-lesson-f-rbac:reporter | grep -E '^(Resources|pods) '", meaning: "everything reporter may do in the project, filtered to the heading and the pod rule"}
    - {cmd: "oc policy who-can patch deployments.apps | grep -E 'academy-lesson|developer|^Groups|Error'", meaning: "who may patch Deployments here, filtered; the last line is a warning about a dangling binding"}
    - {cmd: "oc auth can-i list pods --as=alice; oc auth can-i list pods --as=system:serviceaccount:default:default -n default", expect: any, meaning: "impersonation is limited to the ServiceAccounts of your own project"}
    - {cmd: "oc --token=\"$(oc create token reporter --duration=10m)\" get secrets", expect: fail, meaning: "a real 403 as the ServiceAccount, with a short-lived token that is never printed"}
    - {cmd: "oc create serviceaccount pipeline; oc --token=\"$(oc create token pipeline --duration=10m)\" patch deployment web -p '{\"spec\":{\"replicas\":1}}'", expect: any, meaning: "a refused patch as a ServiceAccount with no grant: the 403 names the API group apps and the verb get, which oc patch needs first"}
  references:
    - {"title": "Kubernetes: Using RBAC authorization", "url": "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"}
    - {"title": "Kubernetes: Aggregated ClusterRoles", "url": "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles"}
    - {"title": "Kubernetes: Privilege escalation prevention", "url": "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#privilege-escalation-prevention-and-bootstrapping"}
    - {"title": "OpenShift 4.21: Using RBAC to define and apply permissions (default cluster roles)", "url": "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/using-rbac"}
    - {"title": "OpenShift 4.21: Groups and virtual groups", "url": "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-authentication#rbac-groups_understanding-authentication"}
    - {"title": "Kubernetes 1.34: RBAC good practices (workload creation and indirect Secret access)", "url": "https://v1-34.docs.kubernetes.io/docs/concepts/security/rbac-good-practices/"}
- id: o2.groups
  title: "Users, groups and access for teams"
  subtitle: "Groups, virtual groups and bindings that follow a team"
  module: b2-authn-authz
  mode: REAL_LAB
  minutes: 30
  level: 2
  supports: "OpenShift 4.21 user.openshift.io Groups (cluster-scoped, administrator-managed). Recorded on OpenShift Local as the ordinary user developer, in a temporary project, and as the cluster administrator (kubeadmin) for the cluster-scoped steps: creating and changing a Group, impersonating a member, deleting the group (experiment X-AUTH-03, rolled back and verified). Directory synchronisation is a documented example here; it is recorded later, against a test directory, in Synchronise groups from LDAP (p.ldap-group-sync)."
  concepts: [ocp.auth, sec.rbac]
  prerequisites: [c.auth, f.rbac]
  diagram: rbac
  labs: [lab.groups]
  record_on: cluster-admin
  objective: |
    Grant access to teams through groups, verify it, and understand what stays behind when people or groups disappear.
  flow:
    - kind: ask
      id: recall-typo
      recalls: f.rbac
      prompt: "A RoleBinding names the ServiceAccount `reportr`, a typo for `reporter`. What happens when you create it?"
      choices:
        - text: "It is refused, because no such subject exists"
          why: "Nothing validates subject names, which is why a typo fails silently, as a missing permission."
        - text: "It is accepted but misses the intended account"
          why: "RBAC refers to subjects by name and never checks that they exist. This lesson relies on that, for groups too."
        - text: "It binds the closest name that does exist"
          why: "RBAC never guesses. It compares names exactly, so the binding stays on the misspelt one."
      answer: 1
    - kind: teach
      id: why-groups
      title: "Why bind to groups"
      body: |
        Picture a project with twelve people, each given a role by name. A newcomer waits for a ticket. Someone
        who changed teams keeps access that nobody remembers granting. An auditor asks why one person can delete
        pods, and the answer is spread over twelve bindings.

        Bind the role to a **group** instead, and manage membership in one place. When a person joins or leaves the
        team, their access follows, and the project's bindings do not change. The cost is one more object to keep
        right, and what this lesson covers: who creates groups, who fills them, and how to check the result.
    - kind: teach
      id: group-object
      body: |
        A **Group** (API group `user.openshift.io`) is a cluster-scoped object that holds a list of user names.
        Cluster-scoped means it belongs to no project, so creating one needs a cluster-wide grant.
        Cluster administrators can create them, or delegate that permission. A
        project administrator can then bind roles to it inside their project. The shortcut
        `oc policy add-role-to-group <role> <group> -n <project>` creates a project RoleBinding for the team.
        Membership comes from one of three places:

        | Source | How membership changes | Who manages it |
        |---|---|---|
        | Group objects by hand | `oc adm groups new`, `add-users`, `remove-users`: at once | a cluster administrator |
        | LDAP or Active Directory sync | `oc adm groups sync`: when the sync runs | a cluster administrator |
        | OpenID Connect `groups` claim (a named field returned by the provider) | at the user's next login | the identity provider's administrators |
    - kind: show
      id: create-group-denied
      body: "As the ordinary user `developer`, try to create a group with one member:"
      run: "oc adm groups new academy-auditors developer"
      notice: "Forbidden, at the cluster scope. Creating groups is outside what the owner of a project may do."
    - kind: show
      id: admin-create-group
      body: "The cluster administrator runs the same command:"
      run: "oc adm groups new academy-auditors developer"
      notice: "Created, with `developer` as its one member."
    - kind: show
      id: admin-list-groups
      run: "oc get groups"
      notice: "The listing shows only real Group objects: the virtual groups you will meet shortly never appear in it."
    - kind: try
      id: try-bind-view
      body: |
        You are the administrator of your project `academy-lesson-o2-groups`. Use the OpenShift policy
        shortcut to give `academy-auditors` the `view` role there.
      accept:
        - "oc adm policy add-role-to-group view academy-auditors"
        - "oc adm policy add-role-to-group view academy-auditors --namespace academy-lesson-o2-groups"
        - "oc adm policy add-role-to-group view academy-auditors --namespace=academy-lesson-o2-groups"
        - "oc adm policy add-role-to-group view academy-auditors -n academy-lesson-o2-groups"
        - "oc policy add-role-to-group view academy-auditors"
        - "oc policy add-role-to-group view academy-auditors --namespace academy-lesson-o2-groups"
        - "oc policy add-role-to-group view academy-auditors --namespace=academy-lesson-o2-groups"
        - "oc policy add-role-to-group view academy-auditors -n academy-lesson-o2-groups"
        - "oc adm policy add-role-to-group view academy-auditors -n=academy-lesson-o2-groups"
        - "oc policy add-role-to-group view academy-auditors -n=academy-lesson-o2-groups"
      hints:
        - match: "add-role-to-user"
          say: "`add-role-to-user` binds a user. A group has its own command, `add-role-to-group`."
        - match: "add-cluster-role-to-group"
          say: "That binds the role in every project, present and future. The task is one project: `add-role-to-group`, which binds in the current project."
        - match: "^oc (adm )?policy add-role-to-group academy-auditors"
          say: "The role comes first, then the group: `add-role-to-group <role> <group>`."
        - match: "^oc create rolebinding"
          say: "That also works, but this task uses the shortcut that OpenShift provides for exactly this: `oc policy add-role-to-group`."
      hint: "`oc policy add-role-to-group`, the role, then the group."
      run: "oc policy add-role-to-group view academy-auditors"
      then: |
        Accepted. RBAC would have accepted it even if the group did not exist: a binding names a subject and never
        checks it. The role was `view`, a ClusterRole, granted by a RoleBinding, so it applies in this project only.
    - kind: show
      id: read-group-binding
      run: "oc get rolebindings -o wide"
      highlight: ["academy-auditors"]
      notice: |
        Two columns matter. `ROLE` says `ClusterRole/view`: a cluster-wide definition, granted in this project only.
        `GROUPS` holds `academy-auditors`: the exact name RBAC will match against the groups of each request.
    - kind: teach
      id: choose-role
      body: |
        Choose the role from what the team must do. `view` lets the team see most objects, but not read Secrets,
        change anything, or see roles and bindings. `edit` lets it change most objects, read Secrets and run pods
        as any ServiceAccount of the project. `admin` adds management of the project's role bindings, but not its
        quota.

        Prefer a RoleBinding in each project over a ClusterRoleBinding: the second grants the role in every
        project, present and future.
    - kind: ask
      id: pick-role
      prompt: |
        Auditors need to inspect workloads in your project, without reading Secrets or changing objects. Which role fits?
      choices:
        - text: "`edit`"
          why: "`edit` lets the team change most objects, and it includes reading Secrets: both are ruled out here."
        - text: "`admin`"
          why: "`admin` is `edit` plus management of roles and bindings, so it reaches Secrets and changes as well."
        - text: "`view`"
          why: "It reads most objects, and leaves out Secrets, roles, bindings and every change."
      answer: 2
    - kind: teach
      id: virtual-groups
      title: "Groups nobody creates"
      body: |
        Every request carries a user name and a list of groups, and RBAC looks for bindings that name either. The
        list holds the real Groups that contain the user, and **virtual groups** that the cluster adds on its own
        and never stores as objects: `system:authenticated` for every authenticated request,
        `system:authenticated:oauth` for those that used an OAuth token, `system:unauthenticated` for those with no
        credential, and, for ServiceAccounts, `system:serviceaccounts` and `system:serviceaccounts:<project>`.
    - kind: show
      id: whoami-groups
      body: "As `developer`, the groups of your own requests:"
      run: "oc auth whoami"
      highlight: ["Groups"]
      notice: |
        The two groups listed are virtual. `academy-auditors` is not listed yet, although the administrator made
        `developer` a member a few steps ago: the API server is still using its cached answer to the check of
        developer's token, taken before the group existed. The real group appears later in this lesson, once that
        answer has expired. A binding to one of them reaches everyone it covers, including people who
        do not exist yet. That is how self-provisioning works: the `self-provisioners` binding names
        `system:authenticated:oauth`. The access analysis lessons later in the path follow such grants.
    - kind: explore
      id: groups-diagram
      diagram: rbac
      body: "Select Subject: a group is one of the three kinds of subject, named in a binding exactly like a user, and its details tell real groups from virtual ones. Then follow a binding to its role."
