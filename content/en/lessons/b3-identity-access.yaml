# Lessons of this file, in the order of content/en/modules.yaml. Format: docs/AUTHORING.md.
- id: c.auth
  title: "Users, groups and login"
  subtitle: "OAuth, identity providers, users and groups"
  module: b2-authn-authz
  diagram: auth-flow
  mode: GUIDED_INVESTIGATION
  minutes: 30
  level: 2
  supports: "OpenShift 4.21 built-in OAuth server; OpenShift Local uses an HTPasswd identity provider for developer and kubeadmin. Recorded on OpenShift Local as the ordinary user developer, in a temporary project, and as the cluster administrator (kubeadmin) for the cluster-wide objects developer may not read; nothing is changed. Direct authentication with an external OIDC provider (generally available since 4.20.5) is described, not run."
  concepts: [ocp.auth, sec.rbac]
  prerequisites: [c.openshift-extends, o1.cli]
  record_on: cluster-admin
  objective: |
    Understand how a human logs in, how that becomes a User and Identity with a token, how groups connect people to
    RBAC, and tell an authentication failure from an authorization failure.
  flow:
    - kind: ask
      id: recall-forbidden
      recalls: o1.cli
      prompt: "You ran `oc get pods -n openshift-etcd` and the server answered Forbidden, naming `developer`. What did the server already know?"
      choices:
        - text: "Nothing, because the login itself had failed"
          why: "A failed login ends earlier, as Unauthorized, and then the server cannot name you. Here it printed `developer`."
        - text: "The caller is identified; the action is refused"
          why: "Forbidden is the answer to a request whose sender is known. This lesson looks at the two checks behind it."
        - text: "That the project does not exist at all"
          why: "A missing object gives NotFound, and only to someone allowed to look. Forbidden says nothing about whether the project exists."
      answer: 1
    - kind: teach
      id: two-questions
      title: "Two questions, always in this order"
      body: |
        Maria joins the team and logs in to the cluster. Her first command, `oc get pods -n payments`, is refused.
        She is confused: she has logged in already. But logging in answers only one of the two questions the cluster asks
        about every request.

        **Authentication** answers "who is this?". The API server looks at the credential in the request and turns it
        into a user name and a list of groups. **Authorization** answers "may this user do that?". In OpenShift it is
        done with RBAC (role-based access control), which [RBAC and effective permissions](/lesson/f.rbac) teaches
        later in this path.

        Every request goes through both checks, in that order. Admission, which applies quotas and security rules to
        requests that change something, comes after both. This lesson is about the first check: how a person
        becomes a known identity, and what the cluster records about them.
    - kind: show
      id: auth-whoami
      body: "The API server can tell you what it concluded about your credential:"
      run: "oc auth whoami"
      highlight: ["Username", "Groups"]
      notice: |
        `Username` is the name RBAC will use for you. `Groups` lists two groups you never joined by hand:
        the cluster adds `system:authenticated` to every identity it recognises, and
        `system:authenticated:oauth` to those that logged in through its OAuth server. A **scope** limits
        what a token may request. The scope `user:full` says this token may use all of your permissions; a
        token can also be limited to fewer.
    - kind: teach
      id: two-failures
      title: "Two different refusals"
      body: |
        A credential can be accepted or rejected. A rejected credential (expired, revoked or issued by another
        cluster) gives HTTP 401, shown as **Unauthorized**. A request with no credential may instead continue as
        `system:anonymous`, in `system:unauthenticated`, where anonymous authentication is enabled.

        Authorization then checks whether the request is allowed. HTTP 403, **Forbidden**, means that check refused
        it. Read the named user: it might be your expected identity or `system:anonymous`.

        For Unauthorized, renew the rejected credential. For Forbidden naming your expected user, investigate its
        permissions. Connection timeouts, DNS errors and certificate errors are separate problems; logging in again
        does not repair them.
    - kind: try
      id: try-whoami
      body: "A colleague says that nothing works for them. Print only your user name: the shortest check of whether the login is the problem."
      accept: ["oc whoami"]
      hints:
        - match: "^oc auth whoami$"
          say: "That works too, and prints a table of everything the server knows about you. For a quick check, `oc whoami` prints only the name."
        - match: "^oc whoami -"
          say: "Options such as `-t` print other things (the server, the token). The user name needs no option."
        - match: "^oc who"
          say: "Check the spelling: it is `oc whoami`, one word."
      hint: "`oc`, then the word that asks who you are."
      run: "oc whoami"
      then: |
        The recording prints `developer`. That confirms this credential was accepted. If you see Unauthorized,
        renew the login; if you see a connection or certificate error, fix that problem first. If the expected name
        appears, investigate what that identity may do.
    - kind: show
      id: unauthorized
      body: "Now the two refusals. `--token` makes `oc` send a different credential for one command; here, a made-up one:"
      run: "oc --token=not-a-real-token whoami"
      notice: "Unauthorized. The server could not tell who sent this, so there is no user name in the message."
    - kind: show
      id: forbidden
      body: "Now your own credential, asking for something it may not do:"
      run: "oc get pods -n openshift-etcd"
      notice: |
        Forbidden, and the message names `developer`: the credential was accepted. Logging in again would change
        nothing here; only a role would.
    - kind: ask
      id: which-failure
      prompt: "Yesterday `oc get pods -n shop` worked. Today even `oc whoami` fails with Unauthorized. Nothing else changed. What is the likely cause?"
      choices:
        - text: "The token expired or was revoked"
          why: "`oc whoami` needs no permission, only a credential the server accepts. When that fails, the token is the suspect, and logging in again is the fix."
        - text: "Someone deleted your RoleBinding in `shop`"
          why: "A missing binding gives Forbidden, in that project only, and `oc whoami` would still print your name."
        - text: "The `shop` project was deleted"
          why: "A deleted project breaks commands that use it. `oc whoami` does not touch any project, so it would still answer."
      answer: 0
    - kind: teach
      id: oauth-server
      title: "Where the token comes from"
      body: |
        A person's credential is an **access token**, issued by the cluster's own **OAuth server**. It runs in the
        `openshift-authentication` project and is managed by the `authentication` operator. An **identity provider** checks who the person is. HTPasswd checks a local file of password hashes;
        LDAP checks a company directory; GitHub and OpenID Connect providers use their own login services.

        `oc login` is a client of that server:

        1. `oc` asks the API server where the OAuth server is, and checks its certificate.
        2. With a user name and password, the OAuth server challenges `oc`, the identity provider checks the
           password, and the OAuth server returns a token.
        3. `oc` saves the token in your kubeconfig, together with the server and user.
        4. Every later command sends that token, never the password.
    - kind: show
      id: oauth-discovery
      body: "Step 1 is a public document that the cluster publishes. `oc` can read it too:"
      run: "oc get --raw /.well-known/oauth-authorization-server"
      highlight: ["issuer", "token_endpoint"]
      notice: |
        `issuer` identifies the OAuth server. `authorization_endpoint` starts authorization, and `token_endpoint`
        is used to exchange an authorization code for a token. The document advertises both code and implicit
        flows; it does not show which flow a particular login used. These endpoint addresses are public.
    - kind: teach
      id: browser-providers
      body: |
        Some providers cannot take a password typed into `oc`. GitHub, Google and most OpenID Connect setups
        authenticate through the browser: the identity provider's own page asks for the password. For those, copy a
        login command with a token from the web console (*Copy login command*) and pass it with `--token`, or let
        `oc login --web` open the browser for you and receive the result on a local port.
    - kind: ask
      id: github-login
      prompt: "The cluster's only identity provider is GitHub. A user runs `oc login -u alice` and types her GitHub password. What happens?"
      choices:
        - text: "She is logged in: `oc` forwards the password to GitHub"
          why: "The OAuth server cannot hand a typed password to a provider that only supports browser login. Providers such as HTPasswd and LDAP are the ones that accept it."
        - text: "She is logged in as kubeadmin, the fallback account"
          why: "There is no fallback identity: each login maps to the identity the provider confirms, and kubeadmin has its own password."
        - text: "Login fails; she needs a token or the browser flow"
          why: "GitHub authenticates through a browser redirect, so a password typed into `oc` has nowhere to go. The token comes from the console or from `oc login --web`."
      answer: 2
    - kind: show
      id: tokens
      title: "Your tokens"
      body: |
        A token is the credential: whoever holds it acts as you, so it must never be printed or shared. Each user can
        list the token objects issued to them. An object's name starts with `sha256~`: it is a hash of the token, not the
        token, and the documentation says a name cannot be used to log in. The course's recordings leave even the names out,
        so this command chooses its columns:
      run: "oc get useroauthaccesstokens -o custom-columns=CLIENT:.clientName,USER:.userName,EXPIRES_IN:.expiresIn,SCOPES:.scopes"
      highlight: ["EXPIRES_IN"]
      notice: |
        The three rows belong to `developer` and the password-login client `openshift-challenging-client`.
        `EXPIRES_IN` is the issued lifetime in seconds: 31536000 is 365 days, not the remaining time. The normal
        OpenShift default is 24 hours. These tokens have a longer lifetime; this command does not read the OAuth
        configuration or show which setting produced it.
    - kind: teach
      id: token-not-password
      body: |
        Because every command sends the token, a token outlives the thing that created it. Changing a user's
        password, or removing them from the identity provider, stops **new** logins. Tokens already issued
        can keep working until expiry or revocation; an inactivity timeout may also end them. To end a
        session earlier, delete the token object (`oc delete useroauthaccesstokens <name>`), or log out: the
        CLI's `logout` command deletes the current session's token on the server and removes it from your
        kubeconfig. Removing a person completely is a checklist, which [Manage local
        users](/lesson/n.htpasswd-users) goes through.
    - kind: explore
      id: login-model
      diagram: auth-flow
      body: "Follow a login from `oc login` to the token, then one request from the API server to the RBAC decision. Select each part: the diagram marks where authentication ends (the API server has turned the token into a user name and groups) and authorization begins."
    - kind: ask
      id: guess-objects
      guess: true
      prompt: "Maria logs in for the first time through an LDAP identity provider. What does OpenShift now hold about her?"
      choices:
        - text: "Nothing: the directory keeps all of it"
          why: "The password stays in LDAP, but with the default mapping method OpenShift creates its own User and Identity at login."
        - text: "A linked User and Identity"
          why: "With the default mapping method, the OAuth server links an Identity for the provider account to a User. The recorded User table below lists that link."
        - text: "A ServiceAccount in `openshift-authentication`"
          why: "ServiceAccounts are identities for workloads. People are represented by User objects."
      answer: 1
    - kind: teach
      id: users-identities
      title: "Users, identities and groups"
      body: |
        OpenShift keeps three kinds of object for people (API group `user.openshift.io`):

        - An **Identity** is one account at one provider. Its name is `<provider name>:<provider user ID>`. With HTPasswd that ID is the login name;
          other providers can use a different stable identifier.
        - A **User** is what RBAC bindings name. It lists the identities linked to it.
        - A **Group** is a list of user names.

        With the default mapping method, the OAuth server creates the Identity and the User at a person's first
        login. Plain Kubernetes has no User object: identity is whatever the authenticator says. Listing all users
        needs cluster-wide read access, so `developer` cannot do it:
    - kind: show
      id: get-users
      run: "oc get users"
      notice: "Forbidden, at the cluster scope: User objects are not inside any project. Your own object is a different matter."
    - kind: show
      id: admin-users
      body: "The administrator's terminal (kubeadmin), where cluster-wide reading is allowed, listing users and their identities:"
      run: "oc get users,identities"
      notice: |
        Every User, with the Identity that maps to it. On OpenShift Local both `developer` and `kubeadmin` come from
        one HTPasswd provider, named `developer`: the Identity `developer:kubeadmin` is the account `kubeadmin` in
        that provider.
    - kind: try
      id: try-user
      body: "You may not list users, but you may read your own User object. The name `~` stands for the user making the request: print it."
      accept: ["oc get user/~", "oc get users/~", "oc get user '~'", "oc get user \"~\"", "oc get users '~'", "oc get users \"~\"", "oc get user.user.openshift.io/~", "oc get user/~ -o yaml", "oc get users/~ -o yaml"]
      hints:
        - match: "^oc get users? ~"
          say: "The shell replaces an unquoted `~` with your home directory before `oc` sees it. Write `user/~` (here the `~` is not at the start of a word, so it stays), or quote it: `user '~'`."
        - match: "^oc get users?$"
          say: "That lists every user, which gives Forbidden. Name the one you want: `~` means yourself."
        - match: "^oc get users? developer"
          say: "Reading another user's object needs cluster-wide permission, even when the name is your own. `~` always works for yourself."
        - match: "^oc whoami"
          say: "`oc whoami` prints the name only. The task is the User object, which also lists the identities."
      hint: "`oc get`, the kind `user`, and `~` as its name; write them as `user/~`."
      run: "oc get user/~"
      then: |
        The `IDENTITIES` column contains `developer:developer`: provider name, then the provider's identifier for
        this account. Here both happen to be `developer`. This table does not display groups; the earlier
        `oc auth whoami` recording showed the groups on the request.

        With the default mapping method, first login creates these objects. Administrators can also provision them
        before login. Bindings may name a user before either exists, because RBAC matches subjects by name.
    - kind: teach
      id: identity-providers
      title: "Identity providers"
      body: |
        The providers are listed in one cluster-wide object, the `OAuth` resource named `cluster`. Supported types
        are HTPasswd, Keystone, LDAP, basic authentication, request header, GitHub, GitLab, Google and OpenID
        Connect. Each entry has a **name**, which becomes the prefix of every identity from that provider, and a
        **mapping method**, which decides how a successful login is tied to a User.

        Changing the list restarts the OAuth server, so it is an administrator's task. Try to read it as `developer`:
    - kind: try
      id: try-oauth
      body: "Read the cluster's OAuth configuration object, named `cluster`. The recording runs it as `developer`, so expect Forbidden: the step after it shows kubeadmin's successful read."
      accept: ["oc get oauth cluster", "oc get oauth/cluster", "oc get oauths cluster", "oc get oauth cluster -o yaml", "oc get oauth/cluster -o yaml", "oc get oauth.config.openshift.io cluster", "oc get oauth.config.openshift.io/cluster", "oc get oauth.config.openshift.io cluster -o yaml", "oc get oauths.config.openshift.io cluster", "oc get oauths.config.openshift.io/cluster", "oc get oauths cluster -o yaml"]
      hints:
        - match: "^oc get oauth$"
          say: "That lists every object of the kind. The task names one: add `cluster`."
        - match: "oauthaccesstokens?"
          say: "Access tokens are a different kind. The configuration of the login service is the `oauth` kind, with the name `cluster`."
      hint: "`oc get oauth`, then the object's name."
      run: "oc get oauth cluster"
      then: |
        As `developer`, this is Forbidden, and the message names you: the identity provider list lives outside every
        project, and reading it needs a cluster-level role. Here is what the administrator gets:
    - kind: show
      id: oauth-admin
      body: "The cluster administrator (kubeadmin) reads the same object's `spec`:"
      run: "oc get oauth cluster -o jsonpath='{.spec}' ; echo"
      notice: |
        The `spec`, as one line of JSON: one entry in `identityProviders`, named `developer`, of type `HTPasswd`,
        whose password file is in the Secret `htpass-secret`. `name` is the prefix of the Identities it creates
        (`developer:alice` for a user alice). `type` selects the kind of provider, and its own block holds the
        details. `tokenConfig` sets the lifetime of access tokens: `accessTokenMaxAgeSeconds` is 31536000 seconds, 365
        days, the lifetime seen on your tokens earlier. `mappingMethod` is the setting to understand next.
    - kind: teach
      id: mapping-method
      title: "The mapping method"
      body: |
        A login arrives with a provider name and a login. The mapping method says what the OAuth server does with
        it:

        - **`claim`** (the default) creates a User with the provider's preferred user name, and **fails** if that
          user name is already mapped to an identity from another provider.
        - **`lookup`** only uses an existing identity and user mapping. It provisions nothing, which suits clusters
          where users are created by a separate process.
        - **`add`** maps the new identity to the existing user of that name as well, which is what several
          providers that identify the same people need.
    - kind: ask
      id: claim-conflict
      prompt: "HTPasswd and LDAP both use `claim`. alice has logged in through HTPasswd. She now logs in through LDAP, where she is also `alice`. What happens?"
      choices:
        - text: "A second User, `alice-2`, is created for LDAP"
          why: "`claim` never invents another name. It claims the name or fails."
        - text: "Both identities join the same User automatically"
          why: "That is what `add` does. With `claim`, the existing mapping blocks the second identity."
        - text: "LDAP login fails: the name is already mapped"
          why: "With `claim`, a name already mapped to another provider's identity blocks the second one. If both accounts are the same person, `add` is the method meant for it; if not, keep the names distinct."
      answer: 2
    - kind: teach
      id: groups-and-kubeadmin
      title: "Groups, and the emergency accounts"
      body: |
        Roles are bound to **groups** rather than to individuals, so access follows team membership. Groups are
        created by an administrator, copied from LDAP by a scheduled sync, or taken from an OpenID Connect groups
        claim at each login. Besides real groups, every request carries the virtual groups you saw in
        `oc auth whoami`, which no object lists. [Users, groups and access for teams](/lesson/o2.groups) covers
        groups in detail.

        Two accounts exist for emergencies. `kubeadmin` is a temporary bootstrap user with `cluster-admin`, created
        by the installer; a production cluster configures a real provider, grants `cluster-admin` to a group, proves
        that it works, and only then deletes the `kubeadmin` Secret in `kube-system`. The installer also writes a
        kubeconfig that authenticates as `system:admin` with a client certificate, which does not go through the
        OAuth server and so keeps working when the OAuth server is down. It belongs in a vault, with audited use.
    - kind: ask
      id: oauth-down
      prompt: "The OAuth server is down. Who can still administer the cluster?"
      choices:
        - text: "Whoever holds a certificate-based admin kubeconfig"
          why: "The API server verifies client certificates itself, without the OAuth server. That is why the installer's kubeconfig must be stored safely."
        - text: "kubeadmin, whose account is built into the OAuth server"
          why: "kubeadmin gets its token from the OAuth server like any other user. If that server is down, kubeadmin cannot log in either."
        - text: "Nobody, until the OAuth server is repaired"
          why: "Certificate authentication does not depend on the OAuth server, so an administrator with that kubeconfig can still repair it."
      answer: 0
    - kind: reflect
      id: explain-login
      prompt: "A junior developer asks what `oc login` does with their password, and why their commands fail with Unauthorized the next day. Answer in a few sentences."
      model: |
        `oc login` does not keep your password. It asks the cluster's OAuth server, which checks the password with
        the identity provider and gives `oc` an access token, saved in your kubeconfig. Every command afterwards
        sends that token, and the token, not the password, proves who you are. Tokens expire (24 hours by default),
        so one day later the API server answers Unauthorized: it no longer knows who you are, and you log in again.
        If you got Forbidden instead, read the named user: authorization refused that identity, which could also
        be anonymous. For the expected user, investigate its permissions.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can tell authentication from authorization and Unauthorized from Forbidden, and use `oc whoami`
        to decide which one to investigate. You can say where a token comes from, how long this cluster lets
        it live, what a User, an Identity and a group are, and why removing an identity-provider credential
        does not necessarily end an existing session. You can also read an identity provider entry and say
        what its mapping method does.

        Next, [Add an HTPasswd identity provider](/lesson/n.htpasswd-idp) and then [Manage local users](/lesson/n.htpasswd-users) follow the simplest provider, HTPasswd,
        through adding, changing and removing a user, and then [RBAC and effective
        permissions](/lesson/f.rbac) teaches the second check: what an identity may do.
  sections:
    - id: when-login-or-access-fails
      title: "When login or access fails"
      depth: true
      body: |
        Start with `oc whoami`: Unauthorized points to a rejected credential; a connection or certificate error needs its
        own investigation. If it prints the expected name, move to authorization.

        | Symptom | Evidence | Likely cause | Fix |
        |---|---|---|---|
        | commands that worked yesterday now return 401 Unauthorized | `oc whoami` fails too | the token expired (24 hours by default) or was revoked | log in again; automation should use ServiceAccount tokens, not a person's token |
        | logged in, but every command in a project returns 403 Forbidden | `oc whoami` works; `oc auth can-i --list -n <ns>` shows no rules for that project | authorization: no binding reaches you there | bind a role to your group in that project (see [the 403 incident](/lab/inc.rbac-denied)) |
        | password login fails for every user right after an identity provider change | `oc get co authentication` Progressing or Degraded; pods in `openshift-authentication` | the new OAuth server is still rolling out, or the configuration is wrong (for example a Secret that does not exist) | wait for the rollout, or correct the OAuth config |
        | login through a second provider fails for one person | the User already has an Identity from the first provider | `mappingMethod: claim` refuses to map a second identity to an existing user name | use `add` when both providers identify the same person |
        | someone removed from the provider still works | their token is still valid | removing the credential stops new logins only | delete the User (which invalidates its tokens) and the Identity, then review bindings |
    - id: direct-oidc-authentication
      title: "Direct authentication with an external OIDC provider"
      depth: true
      body: |
        Since OpenShift 4.20.5 (generally available; a Technology Preview in 4.19 and earlier 4.20.z releases), a
        cluster can instead use **direct authentication with an external OIDC provider**:
        the API server trusts that provider's tokens and the built-in OAuth server is switched off. In that mode
        there are no User, Group or OAuth objects at all (`*.user.openshift.io` and `*.oauth.openshift.io` are
        unavailable); usernames and groups come from token claims, and only one OIDC provider can be configured.
        The `oc` client logs in to such a cluster through an exec plugin rather than through the OAuth flow
        described above.
    - id: service-accounts-are-different
      title: "ServiceAccounts are different"
      depth: true
      body: |
        ServiceAccounts are identities for workloads, not people. They are authenticated by Kubernetes-issued
        tokens, projected into pods and bound to them so that they stop working when the pod is gone, not by the
        OAuth server. [ServiceAccounts and workload identity](/lesson/o2.service-accounts) covers them.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Binding roles to individual users.** Every joiner, mover and leaver then needs a manual change, and
          access reviews become guesswork.
        - **Deleting a user or group and assuming its access is gone.** Bindings remain and apply again to
          anyone who later gets the same name; clean up bindings explicitly.
        - **Adding a second identity provider that maps to the same usernames with `claim`.** The second login
          fails because the user is already mapped to the other identity; `add` is the mapping method meant for
          that case.
        - **Treating ServiceAccount tokens like user passwords.** Workloads should use the tokens projected into
          their pods, which are bound to the pod, not long-lived tokens copied into pipelines.
        - **Removing `kubeadmin` before another cluster-admin exists.** Without another working administrator credential, the documented recovery is
          reinstalling. A working certificate-based admin kubeconfig is another access path.
        - **Pasting a personal token into a pipeline.** It expires, it acts as you, and every action is attributed
          to you. Give the pipeline its own ServiceAccount.
  review:
    - {"q": "What is the difference between authentication and authorization?", "a": "Authentication establishes identity (a user name and groups from a credential); authorization decides what that identity may do (RBAC)."}
    - {"q": "401 or 403: which one means 'authenticated, but not allowed'?", "a": "403 Forbidden. 401 Unauthorized means the credential was not accepted (expired, revoked or wrong cluster)."}
    - {"q": "A command fails. Which command tells you first whether authentication is the problem?", "a": "`oc whoami`: Unauthorized indicates a rejected credential; connection and certificate errors need separate investigation. If it prints your expected name, investigate permissions."}
    - {"q": "How long does an OAuth access token last by default, and how do you list yours?", "a": "24 hours (accessTokenMaxAgeSeconds 86400), unless the administrators changed it; `oc get useroauthaccesstokens`."}
    - {"q": "How is an Identity named, and when are the User and Identity created?", "a": "<provider-name>:<provider-user-ID>. HTPasswd uses the login name; other providers may use a stable ID. With claim they are provisioned at first login, or administrators can create them earlier."}
    - {"q": "What does mappingMethod claim do when a user name is already mapped to another identity?", "a": "The login fails. Use `add` when several providers identify the same people."}
    - {"q": "Why bind roles to groups rather than users?", "a": "Access then follows group membership managed in the directory: joiners, movers and leavers are handled centrally."}
    - {"q": "What disappears when a cluster switches to direct authentication with an external OIDC provider?", "a": "The built-in OAuth server and the User, Group and OAuth APIs; identities and groups come from the provider's token claims."}
  labs: []
  limits: |
    This lesson only reads. Changing the OAuth configuration restarts the login service and can lock users out, so the
    change itself is made in [Add an HTPasswd identity provider](/lesson/n.htpasswd-idp), on a lab cluster, with a
    verified rollback. Listing users and identities needs cluster-wide read access.
  enterprise: |
    Access reviews in regulated organisations are periodic and evidence-based: who has cluster-admin, which
    groups map to which roles, which ServiceAccounts hold elevated rights, which bindings point to subjects that
    no longer exist. Access-review tools exist precisely to answer "who has access to what, and why".
  commands:
    - {cmd: "oc auth whoami", meaning: "what the API server concluded about your credential: user name, groups and token scopes"}
    - {cmd: "oc --token=not-a-real-token whoami", expect: fail, meaning: "a credential the server does not accept: Unauthorized, with no user name"}
    - {cmd: "oc get pods -n openshift-etcd", expect: fail, meaning: "an accepted credential without permission: Forbidden, naming the user"}
    - {cmd: "oc whoami", meaning: "the user name the server sees for your login"}
    - {cmd: "oc get --raw /.well-known/oauth-authorization-server", meaning: "the public discovery document that tells a client where the OAuth server is"}
    - {cmd: "oc get useroauthaccesstokens -o custom-columns=CLIENT:.clientName,USER:.userName,EXPIRES_IN:.expiresIn,SCOPES:.scopes", meaning: "your own tokens, without their names: client, user, lifetime in seconds, scopes"}
    - {cmd: "oc get users,identities", as: admin, meaning: "as the administrator: every User with its Identity"}
    - {cmd: "oc get users", expect: fail, meaning: "listing users needs cluster-wide permission: Forbidden"}
    - {cmd: "oc get user/~", meaning: "your own User object, which any logged-in user may read; ~ means the requester"}
    - {cmd: "oc get oauth cluster", expect: fail, meaning: "the identity provider list is administrator-only: Forbidden"}
    - {cmd: "oc get oauth cluster -o jsonpath='{.spec}' ; echo", as: admin, meaning: "as the administrator: the identity providers and the token lifetime"}
  references:
    - {title: "OpenShift 4.21: Understanding authentication", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-authentication"}
    - {title: "OpenShift 4.21: Configuring the internal OAuth server (token lifetimes, OAuth metadata)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/configuring-internal-oauth"}
    - {title: "OpenShift 4.21: Managing user-owned OAuth access tokens", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/managing-oauth-access-tokens"}
    - {title: "OpenShift 4.21: Understanding identity provider configuration", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-identity-provider"}
    - {title: "OpenShift 4.21: Configuring identity providers (password and token logins per provider)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/configuring-identity-providers"}
    - {title: "OpenShift 4.21: Syncing LDAP groups", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/ldap-syncing"}
    - {title: "OpenShift 4.21: Enabling direct authentication with an external OIDC identity provider", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/external-auth"}
    - {title: "OpenShift 4.21: Removing the kubeadmin user", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/removing-kubeadmin"}
- id: n.htpasswd-idp
  title: "Add an HTPasswd identity provider"
  subtitle: "Password file, Secret, OAuth configuration, first logins"
  module: b2-authn-authz
  mode: REAL_LAB
  minutes: 40
  level: 2
  supports: "OpenShift 4.21 built-in OAuth server (oauth.config.openshift.io/cluster) with the HTPasswd identity provider, which the 4.21 documentation reserves for development and lab clusters. Every step was run on OpenShift Local 4.21 by the cluster administrator (kubeadmin) and by two throwaway users, alice and bob, each in their own kubeconfig; the provider, Secret, users, identities and project were then removed and the OAuth configuration was checked against the copy taken before the change (experiment X-AUTH-01). The test users' passwords were generated for the recording and are not shown."
  concepts: [ocp.auth, ocp.users-identities, sec.rbac]
  prerequisites: [c.auth]
  record_on: cluster-admin
  test_users: [alice, bob]
  objective: |
    Add an HTPasswd identity provider to a cluster without disturbing the providers it already has, watch the
    authentication operator apply it, log in as a new user, read the User and Identity that the login creates, give
    that user a role, and remove the provider again, leaving the cluster as it was.
  flow:
    - kind: ask
      id: recall-first-login
      recalls: c.auth
      prompt: "Maria's login works for the first time through the built-in OAuth server. When does OpenShift create her User and Identity?"
      choices:
        - text: "At her first successful login"
          why: "With the default mapping method, `claim`, the OAuth server creates both while it handles that login. You will watch it happen in this lesson."
        - text: "When an administrator adds her to the provider"
          why: "The provider holds only its own record of her. OpenShift hears about her when she logs in, not before."
        - text: "When she is first bound to a role"
          why: "A binding names a subject and may name one that does not exist yet. It creates no User."
      answer: 0
    - kind: teach
      id: situation
      title: "Two people need to log in"
      body: |
        Two people, alice and bob, need accounts on a lab cluster, and there is no company directory to connect to.
        The simplest identity provider for that case is **HTPasswd**: a file of user names and password hashes, kept
        in a Secret that the OAuth server reads. The OpenShift 4.21 documentation reserves it for development and lab
        clusters: it has no password policy and no central offboarding.

        Everything in this lesson was done for real on a lab cluster (OpenShift Local 4.21) by its administrator. You
        read three terminals: the administrator's, and one each for alice and bob, who log in with their own
        kubeconfig files so that their logins never replace the administrator's session. The prompt in front of each
        command names who ran it. The recorder created those three kubeconfig files and the users' passwords; to do
        it yourself, follow "Repeat it on your own cluster" under Go deeper, on a cluster you can throw away.
    - kind: show
      id: who-admin
      body: "First, who is the administrator here, and may they really do everything?"
      run: "oc whoami"
      notice: "`kubeadmin`."
    - kind: show
      id: can-everything
      run: "oc auth can-i '*' '*' --all-namespaces"
      notice: "`yes`: every verb on every resource in every project. Changing the identity providers needs exactly this kind of access."
    - kind: teach
      id: kubeadmin-here
      body: |
        On a cluster made by the installer, `kubeadmin` is a temporary bootstrap login: the installer prints its password
        when it finishes, the login is backed by the `kubeadmin` Secret in the `kube-system` project, and `oc whoami` prints
        `kube:admin`. OpenShift Local does it differently: its `kubeadmin` is an ordinary user of an HTPasswd provider, made
        all-powerful by a ClusterRoleBinding. You are about to see that provider.

        The OAuth object you change next is shared by everyone who logs in, so one mistaken change can lock every user out.
        As [Check a cluster's health](/lesson/n.cluster-admin-health) set out, repeat this only on a cluster of your own that
        you can rebuild, keep an administrator session open while you test, and save a copy of the configuration before
        changing it.
    - kind: teach
      id: current-config
      title: "What is configured now"
      body: |
        The identity providers are listed in one cluster-wide object: the `OAuth` resource named `cluster`, in the API
        group `config.openshift.io`. Before changing it, read it.
    - kind: try
      id: try-read-oauth
      body: "Print the cluster's OAuth configuration as YAML."
      accept: ["oc get oauth cluster -o yaml", "oc get oauth/cluster -o yaml", "oc get oauths cluster -o yaml", "oc get oauth.config.openshift.io cluster -o yaml", "oc get oauth.config.openshift.io/cluster -o yaml", "oc get oauth cluster --output=yaml"]
      hints:
        - match: "^oc get oauth$|^oc get oauth -o yaml$"
          say: "There is exactly one OAuth object and it is named `cluster`: name it."
        - match: "^oc describe oauth"
          say: "`describe` gives a summary for people. The task asks for the object itself as YAML: `oc get … -o yaml`."
        - match: "openshift-authentication|openshift-config"
          say: "The OAuth configuration is cluster-scoped: it lives in no project, so no `-n` is needed."
      hint: "`oc get`, the kind `oauth`, its name `cluster`, and the output format."
      run: "oc get oauth cluster -o yaml"
      then: |
        `spec.identityProviders` is a list with one entry, named `developer`, of type `HTPasswd`, whose file is in
        the Secret `htpass-secret`. Both `developer` and `kubeadmin` log in through it. `tokenConfig` sets how long
        an access token lives. Nothing here is secret: the password hashes are in the Secret, not in this object.
    - kind: show
      id: existing-secret
      body: "The administrator can see that Secret, in the `openshift-config` project, without printing its content:"
      run: "oc get secret htpass-secret -n openshift-config"
      notice: |
        One data key: the password file, with a hash for each user. The OAuth server reads it; this lesson will not touch
        it. Treat it as sensitive: anyone who may read Secrets in `openshift-config` can copy the hashes and attack them
        offline, and anyone who may change it can add a login.
    - kind: show
      id: users-before
      body: "Users and identities are cluster-wide objects as well. Before anything changes:"
      run: "oc get users,identities"
      notice: |
        Two users and two identities. An Identity's name is `<provider name>:<user name at the provider>`:
        `developer:kubeadmin` means "the account kubeadmin in the provider called developer".
    - kind: show
      id: kubeadmin-binding
      body: "What makes this `kubeadmin` all-powerful is an ordinary ClusterRoleBinding:"
      run: "oc get clusterrolebinding kubeadmin -o wide"
      notice: |
        The ClusterRole `cluster-admin` bound to the user `kubeadmin`. A **ClusterRoleBinding** grants its role in every
        project and on cluster-scoped objects; a RoleBinding, met in [Projects, builds and ImageStreams](/lesson/c.projects-builds),
        grants it in one project. Any user bound this way is equally powerful. [RBAC and effective permissions](/lesson/f.rbac)
        covers both kinds.
    - kind: teach
      id: htpasswd-file
      title: "The password file"
      body: |
        The new provider gets its own file and its own Secret. The `htpasswd` tool, from the `httpd-tools` package,
        writes one line per user: the user name, a colon and a hash of the password. The documented procedure uses
        `-B`, which hashes with bcrypt. `-c` creates the file, replacing any existing one, and `-b` takes the
        password from the command line.

        With `-b` the password lands in your shell history, so people normally leave it out and type the password at
        the prompt. The recording gives each password through a variable (`$ALICE_PASSWORD`), generated for the
        recording; the outputs never show it.
    - kind: show
      id: create-file
      run: "htpasswd -c -B -b users.htpasswd alice \"$ALICE_PASSWORD\""
      notice: "`-c` created `users.htpasswd` with one user, alice."
    - kind: show
      id: add-bob
      body: "Adding a second user uses the same command without `-c`, which would start the file again:"
      run: "htpasswd -B -b users.htpasswd bob \"$BOB_PASSWORD\""
      notice: "Same file, one more line."
    - kind: try
      id: try-add-carol
      body: "`users.htpasswd` holds alice and bob. Add `carol` with the password `example-carol-pw`, hashed with bcrypt, without losing the others."
      accept: ["htpasswd -B -b users.htpasswd carol example-carol-pw", "htpasswd -B -b users.htpasswd carol 'example-carol-pw'", "htpasswd -B -b users.htpasswd carol \"example-carol-pw\"", "htpasswd -b -B users.htpasswd carol example-carol-pw", "htpasswd -b -B users.htpasswd carol 'example-carol-pw'", "htpasswd -Bb users.htpasswd carol example-carol-pw", "htpasswd -Bb users.htpasswd carol 'example-carol-pw'", "htpasswd -bB users.htpasswd carol example-carol-pw", "htpasswd -bB users.htpasswd carol 'example-carol-pw'", "htpasswd -B -b ./users.htpasswd carol example-carol-pw", "htpasswd -B -b ./users.htpasswd carol 'example-carol-pw'"]
      hints:
        - match: "(^| )-[A-Za-z]*c[A-Za-z]*( |$)"
          say: "`-c` creates the file, replacing the one that exists: alice and bob would be gone. Adding a user to an existing file needs no `-c`."
        - match: "^htpasswd users\\.htpasswd"
          say: "The options come before the file name: `-B` for bcrypt and `-b` to give the password on the command line."
        - match: "^htpasswd -b users"
          say: "Without `-B` the tool uses an older hash that the documented procedure does not use. Add `-B` for bcrypt."
        - match: "^htpasswd -B users"
          say: "Without `-b`, the tool asks for the password interactively, and this task gives it on the command line. Add `-b`."
      hint: "`htpasswd`, the options for bcrypt and a password on the command line, the file, the user and the password."
      run: "htpasswd -B -b users.htpasswd carol 'example-carol-pw'"
      then: "Three users now. carol never logs in in this lesson; she is there to show that a file line alone creates nothing in the cluster."
    - kind: show
      id: list-users
      run: "cut -d: -f1 users.htpasswd"
      notice: "`alice`, `bob` and `carol`: `cut` printed the text before each colon. The rest of each line is a hash."
    - kind: show
      id: check-hash
      body: "Count the lines whose hash starts with `$2y$`, the marker of bcrypt, for alice, then check her password against the file with `-v`, which changes nothing:"
      run: "grep -c '^alice:\\$2y\\$' users.htpasswd"
      notice: "`1`: alice's entry is a bcrypt hash."
    - kind: show
      id: verify-password
      run: "htpasswd -vb users.htpasswd alice \"$ALICE_PASSWORD\""
      notice: "The password matches the hash. The file never contains the password itself."
    - kind: teach
      id: secret-key
      title: "The Secret and its key"
      body: |
        The OAuth server reads the file from a Secret in `openshift-config`, and the key inside the Secret must be
        named exactly `htpasswd`. In `--from-file=htpasswd=users.htpasswd`, the part before the `=` names the key.
        Leave it out, and `oc` names the key after the file. A client-side dry run builds the Secret on your machine
        and sends nothing, so you can check the key first; the template prints only the key names:
    - kind: show
      id: key-ok
      run: "oc create secret generic lab-users-htpasswd --from-file=htpasswd=users.htpasswd -n openshift-config --dry-run=client -o go-template='{{range $k, $v := .data}}{{$k}}{{\"\\n\"}}{{end}}'"
      notice: "One key, `htpasswd`: the one the provider looks for."
    - kind: try
      id: try-secret-key
      body: |
        A colleague's runbook gives `--from-file` only the file name. Build that Secret, `lab-users-htpasswd` in
        `openshift-config` from `users.htpasswd`, as a client-side dry run, and see which key it would get.
      accept:
        - "oc create secret generic lab-users-htpasswd --from-file=users.htpasswd -n openshift-config --dry-run=client"
        - "oc create secret generic lab-users-htpasswd --from-file=users.htpasswd -n openshift-config --dry-run=client -o yaml"
        - "oc create secret generic lab-users-htpasswd --from-file=users.htpasswd -n openshift-config --dry-run=client -o json"
        - "oc create secret generic lab-users-htpasswd --from-file=users.htpasswd -n openshift-config --dry-run=client -o go-template='{{range $k, $v := .data}}{{$k}}{{\"\\n\"}}{{end}}'"
      hints:
        - match: "--from-file=htpasswd="
          say: "That names the key `htpasswd`. The task is the runbook's form, with only the file: `--from-file=users.htpasswd`."
        - match: "--dry-run( |$)"
          say: "Give the dry run its value: `--dry-run=client` builds the object on your machine and sends nothing."
        - match: "^oc create secret generic lab-users-htpasswd --from-file=users\\.htpasswd( -n openshift-config)?$"
          say: "Without `--dry-run=client` this would really create the Secret. Add the dry run."
        - match: "^oc create secret lab-users"
          say: "The kind of Secret comes first: `oc create secret generic <name>`."
      hint: "`oc create secret generic lab-users-htpasswd`, `--from-file=` with only the file name, the project, and `--dry-run=client`."
      run: "oc create secret generic lab-users-htpasswd --from-file=users.htpasswd -n openshift-config --dry-run=client -o go-template='{{range $k, $v := .data}}{{$k}}{{\"\\n\"}}{{end}}'"
      then: |
        The key would be `users.htpasswd`. The OAuth server looks for `htpasswd`, finds nothing, and nobody can log
        in through the provider. The recording printed only the key names, so no hash is shown.
    - kind: show
      id: create-secret
      body: "Now for real, with the right key:"
      run: "oc create secret generic lab-users-htpasswd --from-file=htpasswd=users.htpasswd -n openshift-config"
      notice: "`secret/lab-users-htpasswd created`. Nothing reads it yet: no provider names it."
    - kind: teach
      id: register
      title: "Adding the provider without losing the others"
      body: |
        The provider is an entry in `spec.identityProviders` of the OAuth object. That field is one list, and a list
        in a manifest replaces the list on the cluster: apply a file that lists only the new provider, and `developer`
        (with `kubeadmin` inside it) disappears. So the administrator first keeps a copy of the current configuration,
        then **adds one entry** to the list.
    - kind: ask
      id: list-replaced
      prompt: "The cluster already has an LDAP provider. You apply an `OAuth` object named `cluster` whose `identityProviders` lists only a new HTPasswd provider. What happens?"
      choices:
        - text: "Both providers stay, because apply merges the lists"
          why: "The elements of the list are not merged with the live ones: your list becomes the list."
        - text: "LDAP disappears from the provider list"
          why: "`identityProviders` is one list, replaced as a whole. Read the current object first and add your provider to the existing entries."
        - text: "The apply is rejected, because LDAP is missing"
          why: "The API accepts any valid list, including one that locks people out."
      answer: 1
    - kind: show
      id: backup
      body: "The copy: the whole object as YAML, and its `spec` alone, which is what will be compared at the end."
      run: "oc get oauth cluster -o yaml > oauth-before.yaml && oc get oauth cluster -o jsonpath='{.spec}' > oauth-spec-before.json && cat oauth-spec-before.json; echo"
      notice: "The `spec` as one line of JSON: one provider, and the token lifetime."
    - kind: show
      id: patch-add
      body: |
        A JSON patch can append to a list: the operation `add` with the path `/spec/identityProviders/-`, where `-`
        means "after the last element". The value is the new provider: its name (which becomes the prefix of every
        Identity it creates), the mapping method, its type, and the Secret holding the file.
      run: "oc patch oauth cluster --type=json -p '[{\"op\":\"add\",\"path\":\"/spec/identityProviders/-\",\"value\":{\"name\":\"lab-users\",\"mappingMethod\":\"claim\",\"type\":\"HTPasswd\",\"htpasswd\":{\"fileData\":{\"name\":\"lab-users-htpasswd\"}}}}]'"
      notice: "`patched`. `oc edit oauth cluster`, adding the same entry by hand, is the other common way; either way only the list's end changes."
    - kind: show
      id: providers-after
      body: "Check the result before anything else: one line per provider, with its type and Secret."
      run: "oc get oauth cluster -o jsonpath='{range .spec.identityProviders[*]}{.name}{\"\\t\"}{.type}{\"\\t\"}{.htpasswd.fileData.name}{\"\\n\"}{end}'"
      notice: "`developer` is still first and untouched; `lab-users` follows."
    - kind: ask
      id: guess-when-login
      guess: true
      prompt: "The patch was accepted a second ago. When can alice log in?"
      choices:
        - text: "Immediately: the OAuth server reads the object on every login"
          why: "The OAuth server runs as pods with a configuration generated from this object. Something has to give them the new one."
        - text: "Once the authentication operator has rolled out OAuth server pods with the new configuration"
          why: "The operator turns the OAuth object and the Secret into the server's configuration and replaces its pods. The next steps show it."
        - text: "Only after an administrator creates her User object"
          why: "With the `claim` mapping method, the login creates the User. Nobody creates it beforehand."
      answer: 1
    - kind: show
      id: operator-progressing
      body: "The cluster operator that owns logins reports what it is doing:"
      run: "oc get clusteroperator authentication"
      notice: |
        Right after the patch, the operator still reports its old, settled state: `SINCE` counts from its last
        change, minutes before the patch. It has not reacted yet; the change is picked up within seconds.
    - kind: show
      id: wait-progressing
      run: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s"
      notice: "`condition met`: the operator is rolling out the change."
    - kind: show
      id: oauth-pods
      body: "Its work is visible in the `openshift-authentication` project, where the OAuth server runs:"
      run: "oc get pods -n openshift-authentication"
      notice: |
        The old OAuth server pod is `Terminating` and its replacement is `Pending`. The Deployment requires that no two
        OAuth server pods share a node (a required pod anti-affinity), and OpenShift Local has one node: the new pod
        can only start once the old one is gone, so new logins pause for a short while. Plan identity changes for a
        quiet moment.
    - kind: show
      id: wait-done
      body: "`oc wait` blocks until a condition holds. Wait for the rollout to finish:"
      run: "oc wait co/authentication --for=condition=Progressing=False --timeout=600s"
      notice: "The operator has finished."
    - kind: show
      id: operator-settled
      run: "oc get clusteroperator authentication"
      notice: "Available `True`, Progressing `False`, Degraded `False`: the healthy state. Check all three before testing a login."
    - kind: teach
      id: first-login
      title: "alice's first login"
      body: |
        alice logs in from her own terminal. Her kubeconfig is a separate file (in a real terminal you would point
        `KUBECONFIG` at it, or use `--kubeconfig`), so her login does not replace the administrator's. `oc login -u`
        asks for the password if you leave out `-p`.
    - kind: show
      id: alice-login
      run: "oc login -u alice -p \"$ALICE_PASSWORD\""
      notice: "`Login successful.` and no project yet: alice may create projects, but has access to none."
    - kind: show
      id: alice-whoami
      run: "oc whoami"
      notice: "`alice`: the token in alice's kubeconfig belongs to her."
    - kind: show
      id: users-after
      body: "In the administrator's terminal, the login has left its trace:"
      run: "oc get users,identities"
      highlight: ["alice"]
      notice: |
        The User `alice` and the Identity `lab-users:alice`, both created by her first login. bob and carol are in the
        file but have never logged in, so neither has a User nor an Identity.
    - kind: show
      id: alice-user
      run: "oc get user alice -o yaml"
      notice: "The User lists the identity that maps to it. It says nothing about what alice may do: that is RBAC's job."
    - kind: try
      id: try-users-identities
      body: "As the administrator, list the users and the identities of the cluster in one command."
      accept: ["oc get users,identities", "oc get user,identity", "oc get users,identity", "oc get user,identities", "oc get identities,users", "oc get identity,user", "oc get users.user.openshift.io,identities.user.openshift.io"]
      hints:
        - match: "^oc get users? identit"
          say: "Two kinds in one `oc get` are joined by a comma, without a space: `users,identities`."
        - match: "^oc get (users?|identit(y|ies))$"
          say: "That lists one of the two kinds. Join both kinds with a comma."
      hint: "`oc get`, then both kinds separated by a comma."
      run: "oc get users,identities"
    - kind: teach
      id: grant
      title: "From a login to permissions"
      body: |
        A login gives alice the permissions of every authenticated user: she may create her own projects and read a
        few cluster-wide facts, nothing more. To work in a team project, she needs a role there.
    - kind: show
      id: alice-can-create
      body: "Back in alice's terminal. Can she create projects?"
      run: "oc auth can-i create projects"
      notice: |
        `no`, with a warning that projects are not namespaced (`can-i` exits with status 1 when the answer is no).
        Yet alice can make her own project: `oc new-project` does not create a Project directly. It sends a
        **ProjectRequest**, and the server creates the project and makes the requester its administrator. The
        permission to ask about is on `projectrequests`.
    - kind: show
      id: alice-can-request
      run: "oc auth can-i create projectrequests"
      notice: "`yes`: alice may request projects of her own."
    - kind: show
      id: self-provisioners
      body: "Where that permission comes from, in the administrator's terminal:"
      run: "oc get clusterrolebinding self-provisioners -o wide"
      notice: |
        The ClusterRole `self-provisioner` is bound to the group `system:authenticated:oauth`: everyone who logged in through
        the OAuth server. To stop self-service project creation, an administrator removes that group from this binding and
        marks the binding so that the API server does not restore it; [Project templates and
        self-provisioning](/lesson/n.project-templates) does it step by step.
    - kind: show
      id: alice-no-projects
      body: "In alice's terminal, the projects she can see:"
      run: "oc get projects"
      notice: "`No resources found.`: no project grants alice anything yet."
    - kind: show
      id: team-project
      body: "The administrator creates a project for the team. `oc adm new-project` creates it without switching the administrator's own current project:"
      run: "oc adm new-project lab-team --display-name='Lab team'"
      notice: "`Created project lab-team`."
    - kind: try
      id: try-grant-edit
      body: "As the administrator, give alice the built-in `edit` role in the project `lab-team`: she may create and change most objects there, but not grant access to others."
      accept: ["oc adm policy add-role-to-user edit alice -n lab-team", "oc policy add-role-to-user edit alice -n lab-team", "oc adm policy add-role-to-user edit alice --namespace lab-team", "oc adm policy add-role-to-user edit alice --namespace=lab-team", "oc policy add-role-to-user edit alice --namespace=lab-team"]
      hints:
        - match: "add-role-to-user alice edit"
          say: "The role comes first, then the user: `add-role-to-user edit alice`."
        - match: "add-cluster-role-to-user"
          say: "That would give alice `edit` in every project, cluster-wide. The task is one project: `add-role-to-user … -n lab-team`."
        - match: "^oc (adm )?policy add-role-to-user edit alice$"
          say: "Without `-n`, the role is granted in the administrator's current project. Name the project: `-n lab-team`."
      hint: "`oc adm policy add-role-to-user`, the role, the user, and the project."
      run: "oc adm policy add-role-to-user edit alice -n lab-team"
      then: |
        `clusterrole.rbac.authorization.k8s.io/edit added: "alice"`: a RoleBinding in `lab-team` now names alice. The
        output says `clusterrole` because built-in roles such as `view` and `edit` are defined once for the whole cluster;
        this RoleBinding grants `edit` in `lab-team` only.
    - kind: show
      id: alice-sees-project
      body: "In alice's terminal again:"
      run: "oc get projects"
      notice: "alice now sees `lab-team`: the binding is the only thing that changed."
    - kind: show
      id: alice-creates
      run: "oc create configmap greeting --from-literal=message=hello -n lab-team"
      notice: "Created. `edit` lets her create objects in the project."
    - kind: show
      id: alice-cannot-grant
      body: "Can alice give someone else access to `lab-team`?"
      run: "oc auth can-i create rolebindings -n lab-team"
      notice: "`no` (and exit status 1, which is how `can-i` says no): `edit` does not let alice give access to anyone else. That needs `admin` in the project."
    - kind: show
      id: bob-login
      body: "bob logs in from his own terminal. He has no role anywhere:"
      run: "oc login -u bob -p \"$BOB_PASSWORD\""
      notice: "Login works: bob is a valid user of the provider."
    - kind: show
      id: bob-denied
      run: "oc get configmaps -n lab-team"
      notice: |
        Forbidden. bob is authenticated (the error names him) but not authorised in `lab-team`. A working login and
        permission to do something are two separate things, decided by two separate parts of the cluster.
    - kind: order
      id: order-procedure
      prompt: "Put the administrator's procedure for adding an HTPasswd provider in order."
      items:
        - "Build the password file with `htpasswd -B`"
        - "Create the Secret in `openshift-config` with the key `htpasswd`"
        - "Save a copy of the OAuth object"
        - "Append the provider to `spec.identityProviders`"
        - "Wait until `authentication` is Available, not Progressing, not Degraded"
        - "Log in as a test user from a separate kubeconfig"
      why: "The Secret must exist before the provider names it, or the operator reports the provider as broken. The copy comes before the change it protects. A login test before the operator has finished tests the old configuration."
    - kind: teach
      id: remove-title
      title: "Removing the provider, and proving the cluster is back"
      body: |
        A lab change is finished only when it is undone. The provider goes first, so that nobody can start a new
        login through it. Its position in the list comes from its name, and the patch tests that name before
        removing anything: if someone has reordered the list since, the `test` operation fails and nothing is
        removed.
    - kind: show
      id: find-index
      run: "oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}'; echo"
      notice: "`lab-users` is the second entry: index `1`, counting from zero."
    - kind: show
      id: patch-remove
      run: "oc patch oauth cluster --type=json -p '[{\"op\":\"test\",\"path\":\"/spec/identityProviders/1/name\",\"value\":\"lab-users\"},{\"op\":\"remove\",\"path\":\"/spec/identityProviders/1\"}]'"
      notice: "`patched`: the test passed and the entry was removed."
    - kind: show
      id: wait-rollback
      body: "Removing the provider is a configuration change too: the operator rolls the OAuth server out again. Wait for it at once, before it finishes unseen:"
      run: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s"
      notice: "Both conditions were met in turn: a new rollout started and finished."
    - kind: show
      id: alice-active
      body: "Meanwhile alice is still working in her terminal:"
      run: "oc whoami"
      notice: |
        `alice`: the provider she logged in through no longer exists, yet her session works. Removing a provider stops new
        logins only; tokens already issued stay valid. The API server has also checked her token a moment ago, which matters
        for the next step.
    - kind: show
      id: delete-objects
      body: "Then everything the lesson made: the Secret, the team project, and the Users and Identities of alice and bob. The Users and Identities are not removed with the provider."
      run: "oc delete secret lab-users-htpasswd -n openshift-config && oc delete project lab-team && oc delete user alice bob && oc delete identity lab-users:alice lab-users:bob"
      notice: "Each object is named; nothing is deleted by pattern."
    - kind: ask
      id: guess-alice-token
      guess: true
      prompt: "alice's terminal still holds the token from her login. Her User was deleted a second ago. What does `oc whoami` say in her terminal right now?"
      choices:
        - text: "`alice`, for a short while: the API server remembers recent token checks"
          why: "The API server asks the OAuth API server whether a token is valid and caches the answer for a while. Until that answer expires, the deleted user's token still works. The next steps show it, and measure how long."
        - text: "An error, at once: deleting the User kills its tokens immediately"
          why: "That is what one expects, and it is eventually true. But the answer to a token check is cached, so the token keeps working for a short time."
        - text: "`kube:admin`: the session falls back to the administrator"
          why: "Sessions never change identity on their own. alice's kubeconfig only ever held her token."
      answer: 0
    - kind: show
      id: alice-gone
      run: "oc whoami"
      notice: "`alice`: her User and Identity are gone, yet her token still works."
    - kind: show
      id: alice-rejected
      body: |
        The API server does not check a token itself: it asks the OAuth API server, and it caches the answer. In
        Kubernetes that cache keeps an answer for two minutes by default (`--authentication-token-webhook-cache-ttl`),
        counted from when the answer was cached: checks served from the cache do not extend it. So an active session
        survives its user by up to that long. This loop, in
        alice's terminal, tries every five seconds until the token is refused:
      run: "start=$(date +%s); while oc whoami >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still accepted after 5 minutes'; exit 1; }; sleep 5; done; echo \"refused after $(( $(date +%s) - start )) seconds:\"; oc whoami || true"
      notice: |
        The token was refused once the cached answer expired. For a person who must lose access immediately, this
        delay matters: remove the access first (the password line, the role bindings), then the User, and expect
        existing sessions to last up to the cache time.
    - kind: show
      id: compare-spec
      body: "Finally, the proof: compare the current `spec` with the copy taken before the change. `diff` prints nothing when they are identical."
      run: "oc get oauth cluster -o jsonpath='{.spec}' | diff oauth-spec-before.json - && echo 'OAuth spec identical to the copy'"
      notice: "The cluster's identity configuration is exactly what it was. The file `oauth-before.yaml` would have been the starting point for a repair if it were not."
    - kind: reflect
      id: explain-safe-change
      prompt: "A colleague wants to add a provider by applying a ten-line OAuth manifest from a blog post. Explain what you would do instead, and why."
      model: |
        I would read the current OAuth object first and save it, because `identityProviders` is one list and a
        manifest with only the new provider would replace it, removing every existing provider and the people who
        use it. I would create the provider's Secret in openshift-config with the key the provider expects, then add
        one entry to the existing list (a JSON patch `add` to `/spec/identityProviders/-`, or `oc edit`), check the
        list, wait for the authentication operator to be Available and no longer Progressing, and test a login from
        a separate kubeconfig, keeping my administrator session open in case something goes wrong.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can add an HTPasswd provider safely, check what the authentication operator does with it, recognise the
        User and Identity a first login creates, grant a role and see its limits, and undo all of it with evidence
        that the cluster is back to its starting point. The next lesson, [Manage local users](/lesson/n.htpasswd-users),
        changes passwords and removes people on a running provider, and gives administration to a group.
  sections:
    - id: repeat-it-yourself
      title: "Repeat it on your own cluster"
      depth: true
      body: |
        The recording's terminals, kubeconfig files and `$ALICE_PASSWORD` were prepared by the course's recorder; none
        of them exists in your shell. This is the same exercise by hand. Use only a cluster of your own that you can
        delete, such as OpenShift Local (`crc console --credentials` prints its administrator login), never a shared or
        production cluster: a mistake in the OAuth configuration can lock every user out.

        **1. Three separate kubeconfig files**, so that no login replaces another. In the administrator's terminal:

        ```
        mkdir -p ~/idp-lab && cd ~/idp-lab
        export KUBECONFIG=~/idp-lab/admin.kubeconfig
        oc login -u kubeadmin https://api.crc.testing:6443
        ```

        `oc login` without `-p` asks for the password, so it stays out of your shell history. If it says the server's
        certificate is not trusted, do not accept an insecure connection: pass the cluster's CA with
        `--certificate-authority`. Keep this terminal logged in until the end; it is your way back.

        **2. Passwords you choose**, used only for this lab. `htpasswd` without `-b` prompts for each one twice:

        ```
        htpasswd -c -B users.htpasswd alice
        htpasswd -B users.htpasswd bob
        ```

        **3. Save the starting point, then make the change** exactly as the lesson does:

        ```
        oc get oauth cluster -o jsonpath='{.spec}' > oauth-spec-before.json
        oc create secret generic lab-users-htpasswd --from-file=htpasswd=users.htpasswd -n openshift-config
        oc patch oauth cluster --type=json -p '[{"op":"add","path":"/spec/identityProviders/-","value":{"name":"lab-users","mappingMethod":"claim","type":"HTPasswd","htpasswd":{"fileData":{"name":"lab-users-htpasswd"}}}}]'
        oc wait co/authentication --for=condition=Progressing=True --timeout=180s
        oc wait co/authentication --for=condition=Progressing=False --timeout=600s
        ```

        **4. A training project and one role**, as the administrator:

        ```
        oc adm new-project lab-team --display-name='Lab team'
        oc adm policy add-role-to-user edit alice -n lab-team
        ```

        **5. alice and bob log in from their own terminals**, each with their own file and no `-p`:

        ```
        oc login -u alice --kubeconfig="$HOME/idp-lab/alice.kubeconfig" https://api.crc.testing:6443
        oc login -u bob --kubeconfig="$HOME/idp-lab/bob.kubeconfig" https://api.crc.testing:6443
        ```

        **6. Roll back**, in the administrator's terminal. Read `oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}'`
        first: the patch below removes the second entry only if it is `lab-users`.

        ```
        oc patch oauth cluster --type=json -p '[{"op":"test","path":"/spec/identityProviders/1/name","value":"lab-users"},{"op":"remove","path":"/spec/identityProviders/1"}]'
        oc wait co/authentication --for=condition=Progressing=True --timeout=180s
        oc wait co/authentication --for=condition=Progressing=False --timeout=600s
        oc delete secret lab-users-htpasswd -n openshift-config
        oc delete project lab-team
        oc delete user alice bob
        oc delete identity lab-users:alice lab-users:bob
        oc delete oauthaccesstokens --field-selector userName=alice
        oc delete oauthaccesstokens --field-selector userName=bob
        oc get oauth cluster -o jsonpath='{.spec}' | diff oauth-spec-before.json - && echo identical
        ```

        Then delete `~/idp-lab`: it holds password hashes and three login tokens. The URL above is OpenShift Local's;
        on another cluster, use its API address (`oc whoami --show-server` prints it).
    - id: when-logins-fail
      title: "When a new provider does not work"
      depth: true
      body: |
        Read the evidence before editing again.

        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | nobody from the new provider can log in | `oc get clusteroperator authentication` and the messages of its conditions | the Secret's key is not `htpasswd`, or its name does not match `fileData.name` | fix the Secret; the operator retries |
        | the existing provider's users cannot log in any more | `oc get oauth cluster -o yaml` | the list was replaced instead of extended | restore `spec` from the copy (a merge patch of the saved `spec`) |
        | the login still fails a minute after the change | `oc get clusteroperator authentication` shows Progressing `True` | the rollout is not finished | wait for Progressing `False` |
        | the login works, but the person can do nothing | `oc auth can-i --list` as that user | a login creates a User, not permissions | bind a role, preferably to a group |
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Applying an OAuth object that lists only the new provider.** The list replaces the old one.
        - **Wrong key in the Secret.** The key must be `htpasswd`.
        - **Testing the login in the administrator's own terminal.** `oc login` as the test user replaces the
          administrator's session in that kubeconfig. Use a separate one.
        - **Testing before the operator has finished.** Wait for Progressing `False` first.
        - **Removing the provider and nothing else.** Users, Identities, bindings and the Secret all stay behind.
  review:
    - q: "Which object lists the cluster's identity providers, and where does an HTPasswd provider's file live?"
      a: "The OAuth object named cluster (oauth.config.openshift.io); the file is in a Secret in openshift-config, under the key htpasswd."
    - q: "How do you add a provider without removing the existing ones?"
      a: "Save the current object, then append one entry to spec.identityProviders: a JSON patch add to /spec/identityProviders/-, or oc edit."
    - q: "How do you know the change has been applied?"
      a: "The authentication cluster operator went through Progressing True and is back to Available True, Progressing False, Degraded False."
    - q: "When are the User and Identity created, and how is the Identity named?"
      a: "At the first successful login (mappingMethod claim); <provider name>:<user name>, for example lab-users:alice."
    - q: "Why log in as a test user with a separate kubeconfig?"
      a: "oc login writes the new session into the kubeconfig in use, replacing the administrator's session there."
  labs: []
  limits: |
    OpenShift Local's own provider is also called HTPasswd, and its `kubeadmin` is a user of it; on an installed
    cluster, `kubeadmin` is a bootstrap login backed by a Secret in `kube-system`. Only HTPasswd is shown; LDAP and
    OpenID Connect providers follow the same OAuth list and need a directory or an issuer to talk to.
  enterprise: |
    Organisations connect OpenShift to the corporate directory (LDAP with group sync, or OpenID Connect) and keep a
    separately secured emergency access path for when the directory is down, such as the installer's certificate-based
    kubeconfig kept in a vault. The 4.21 documentation advises against HTPasswd in production; it remains the simple choice
    for development and lab clusters.
  commands:
    - {cmd: "oc whoami", as: admin, meaning: "who this terminal is logged in as"}
    - {cmd: "oc auth can-i '*' '*' --all-namespaces", as: admin, meaning: "yes: every verb on every resource everywhere, which is what changing identity providers needs"}
    - {cmd: "oc get oauth cluster -o yaml", as: admin, meaning: "the cluster's OAuth configuration, with the list of identity providers"}
    - {cmd: "oc get secret htpass-secret -n openshift-config", as: admin, meaning: "the existing provider's Secret, seen without its content"}
    - {cmd: "oc get users,identities", as: admin, meaning: "the users and identities, before the change"}
    - {cmd: "oc get clusterrolebinding kubeadmin -o wide", as: admin, meaning: "on OpenShift Local, kubeadmin is cluster-admin through an ordinary ClusterRoleBinding"}
    - {cmd: "htpasswd -c -B -b users.htpasswd alice \"$ALICE_PASSWORD\"", as: admin, meaning: "create the file (-c) with a bcrypt hash (-B) for alice; -b takes the password from the command line"}
    - {cmd: "htpasswd -B -b users.htpasswd bob \"$BOB_PASSWORD\"", as: admin, meaning: "add bob to the same file (no -c: that would start the file again)"}
    - {cmd: "htpasswd -B -b users.htpasswd carol 'example-carol-pw'", as: admin, meaning: "add carol the same way"}
    - {cmd: "cut -d: -f1 users.htpasswd", as: admin, meaning: "the users in the file, one per line"}
    - {cmd: "grep -c '^alice:\\$2y\\$' users.htpasswd", as: admin, meaning: "1: alice's entry is a bcrypt hash"}
    - {cmd: "htpasswd -vb users.htpasswd alice \"$ALICE_PASSWORD\"", as: admin, meaning: "check a password against the file without changing it"}
    - {cmd: "oc create secret generic lab-users-htpasswd --from-file=htpasswd=users.htpasswd -n openshift-config --dry-run=client -o go-template='{{range $k, $v := .data}}{{$k}}{{\"\\n\"}}{{end}}'", as: admin, meaning: "a dry run: the key names the Secret would have"}
    - {cmd: "oc create secret generic lab-users-htpasswd --from-file=users.htpasswd -n openshift-config --dry-run=client -o go-template='{{range $k, $v := .data}}{{$k}}{{\"\\n\"}}{{end}}'", as: admin, meaning: "without a key name, the key is named after the file, and the provider would find nothing"}
    - {cmd: "oc create secret generic lab-users-htpasswd --from-file=htpasswd=users.htpasswd -n openshift-config", as: admin, meaning: "the provider's Secret, with the key htpasswd"}
    - {cmd: "oc get oauth cluster -o yaml > oauth-before.yaml && oc get oauth cluster -o jsonpath='{.spec}' > oauth-spec-before.json && cat oauth-spec-before.json; echo", as: admin, meaning: "a copy of the configuration before changing it"}
    - {cmd: "oc patch oauth cluster --type=json -p '[{\"op\":\"add\",\"path\":\"/spec/identityProviders/-\",\"value\":{\"name\":\"lab-users\",\"mappingMethod\":\"claim\",\"type\":\"HTPasswd\",\"htpasswd\":{\"fileData\":{\"name\":\"lab-users-htpasswd\"}}}}]'", as: admin, meaning: "append one provider to the list, leaving the others as they are"}
    - {cmd: "oc get oauth cluster -o jsonpath='{range .spec.identityProviders[*]}{.name}{\"\\t\"}{.type}{\"\\t\"}{.htpasswd.fileData.name}{\"\\n\"}{end}'", as: admin, meaning: "one line per provider: name, type, Secret"}
    - {cmd: "oc get clusteroperator authentication", as: admin, meaning: "the operator that owns logins: Available, Progressing, Degraded"}
    - {cmd: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s", as: admin, timeout: 900, meaning: "wait until the operator starts applying the change"}
    - {cmd: "oc get pods -n openshift-authentication", as: admin, meaning: "the OAuth server's pods, replaced during the rollout"}
    - {cmd: "oc wait co/authentication --for=condition=Progressing=False --timeout=600s", as: admin, timeout: 900, meaning: "wait until the rollout has finished"}
    - {cmd: "oc get clusteroperator authentication", as: admin, meaning: "healthy again: Available True, Progressing False, Degraded False"}
    - {cmd: "oc login -u alice -p \"$ALICE_PASSWORD\"", as: alice, meaning: "alice's first login, in her own kubeconfig"}
    - {cmd: "oc whoami", as: alice, meaning: "alice"}
    - {cmd: "oc get users,identities", as: admin, meaning: "the User and Identity that alice's login created"}
    - {cmd: "oc get user alice -o yaml", as: admin, meaning: "the User lists its identity, and nothing about permissions"}
    - {cmd: "oc auth can-i create projects", as: alice, expect: fail, meaning: "no: projects are not created directly"}
    - {cmd: "oc auth can-i create projectrequests", as: alice, meaning: "yes: oc new-project sends a ProjectRequest, which every OAuth user may create here"}
    - {cmd: "oc get clusterrolebinding self-provisioners -o wide", as: admin, meaning: "the binding that lets every OAuth user request projects"}
    - {cmd: "oc get projects", as: alice, meaning: "no project grants alice anything yet"}
    - {cmd: "oc adm new-project lab-team --display-name='Lab team'", as: admin, meaning: "a team project, created without changing the administrator's current project"}
    - {cmd: "oc adm policy add-role-to-user edit alice -n lab-team", as: admin, meaning: "alice may create and change objects in lab-team"}
    - {cmd: "oc get projects", as: alice, meaning: "alice now sees lab-team"}
    - {cmd: "oc create configmap greeting --from-literal=message=hello -n lab-team", as: alice, meaning: "edit allows creating objects"}
    - {cmd: "oc auth can-i create rolebindings -n lab-team", as: alice, expect: fail, meaning: "no: edit cannot grant access to others"}
    - {cmd: "oc login -u bob -p \"$BOB_PASSWORD\"", as: bob, meaning: "bob's login works"}
    - {cmd: "oc get configmaps -n lab-team", as: bob, expect: fail, meaning: "Forbidden: authenticated, but not authorised in lab-team"}
    - {cmd: "oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}'; echo", as: admin, meaning: "the providers in order, to find the index of the one to remove"}
    - {cmd: "oc patch oauth cluster --type=json -p '[{\"op\":\"test\",\"path\":\"/spec/identityProviders/1/name\",\"value\":\"lab-users\"},{\"op\":\"remove\",\"path\":\"/spec/identityProviders/1\"}]'", as: admin, meaning: "remove entry 1 only if its name is still lab-users"}
    - {cmd: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s", as: admin, timeout: 900, meaning: "the operator rolls out the configuration without the provider"}
    - {cmd: "oc whoami", as: alice, meaning: "alice's session is active just before her User is deleted"}
    - {cmd: "oc delete secret lab-users-htpasswd -n openshift-config && oc delete project lab-team && oc delete user alice bob && oc delete identity lab-users:alice lab-users:bob", as: admin, meaning: "remove what the lesson created, by name"}
    - {cmd: "oc whoami", as: alice, meaning: "still alice, for a short while: the API server caches recent token checks"}
    - {cmd: "start=$(date +%s); while oc whoami >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still accepted after 5 minutes'; exit 1; }; sleep 5; done; echo \"refused after $(( $(date +%s) - start )) seconds:\"; oc whoami || true", as: alice, timeout: 360, meaning: "how long the deleted user's token kept working"}
    - {cmd: "oc get oauth cluster -o jsonpath='{.spec}' | diff oauth-spec-before.json - && echo 'OAuth spec identical to the copy'", as: admin, meaning: "proof that the configuration is back to the copy"}
  experiment:
    id: X-AUTH-01
    objective: "Add an HTPasswd identity provider beside OpenShift Local's own, log in with it as two test users, grant and test a role, then remove every trace and prove the OAuth configuration is unchanged."
    changes:
      - "oauth.config.openshift.io/cluster: one entry appended to spec.identityProviders, then removed"
      - "Secret openshift-config/lab-users-htpasswd (created, deleted)"
      - "Users alice and bob, Identities lab-users:alice and lab-users:bob (created by login, deleted)"
      - "Project lab-team with a RoleBinding and a ConfigMap (created, deleted)"
      - "OAuth server pods in openshift-authentication (rolled out twice by the authentication operator)"
    preflight:
      - {cmd: "oc get user alice", expect: fail}
      - {cmd: "oc get user bob", expect: fail}
      - {cmd: "oc get identity lab-users:alice", expect: fail}
      - {cmd: "oc get project lab-team", expect: fail}
      - {cmd: "oc get secret lab-users-htpasswd -n openshift-config", expect: fail}
      - {cmd: "oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}' | grep -qw lab-users", expect: fail}
      - {cmd: "oc wait co/authentication --for=condition=Available=True --timeout=30s && oc wait co/authentication --for=condition=Progressing=False --timeout=30s && oc wait co/authentication --for=condition=Degraded=False --timeout=30s"}
    snapshot:
      - "oc get oauth cluster -o jsonpath='{.spec}'"
      - "oc get secret htpass-secret -n openshift-config -o jsonpath='{.metadata.uid} {.metadata.resourceVersion}'"
      - "oc get users -o name"
      - "oc get identities -o name"
      - "oc get groups -o name"
      - "oc get secrets -n openshift-config -o name"
      - "oc get project lab-team -o name --ignore-not-found"
    rollback:
      - "oc patch oauth cluster --type=merge -p \"{\\\"spec\\\":$(cat \"$SNAPSHOT_DIR/0\")}\""
      - "oc delete secret lab-users-htpasswd -n openshift-config --ignore-not-found"
      - "oc delete project lab-team --ignore-not-found --wait=false"
      - "oc delete user alice bob --ignore-not-found"
      - "oc delete identity lab-users:alice lab-users:bob --ignore-not-found"
      - "oc delete oauthaccesstokens --field-selector userName=alice --ignore-not-found && oc delete oauthaccesstokens --field-selector userName=bob --ignore-not-found"
    settle:
      - "oc wait --for=delete project/lab-team --timeout=300s"
      - "sleep 60; oc wait co/authentication --for=condition=Progressing=False --timeout=900s"
    verify:
      - {cmd: "oc wait co/authentication --for=condition=Available=True --timeout=60s && oc wait co/authentication --for=condition=Degraded=False --timeout=60s"}
      - {cmd: "oc get pods -n openshift-authentication --no-headers | grep -c Running"}
    login_checks: [developer]
  references:
    - {title: "OpenShift 4.21: Configuring an htpasswd identity provider", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/configuring-identity-providers"}
    - {title: "OpenShift 4.21: Understanding identity provider configuration", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-identity-provider"}
    - {title: "OpenShift 4.21: Using RBAC to define and apply permissions", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/using-rbac"}
    - {title: "Kubernetes: JSON patch operations used by kubectl patch --type=json (RFC 6902)", url: "https://datatracker.ietf.org/doc/html/rfc6902"}
    - {title: "Kubernetes: kube-apiserver options (--authentication-token-webhook-cache-ttl)", url: "https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/"}
- id: n.htpasswd-users
  title: "Manage local users"
  subtitle: "Passwords, removals and administrators on a running HTPasswd provider"
  module: b2-authn-authz
  mode: REAL_LAB
  minutes: 40
  level: 2
  supports: "OpenShift 4.21 built-in OAuth server with an HTPasswd identity provider. Every step was run on OpenShift Local 4.21 by the cluster administrator (kubeadmin) and by two throwaway users, alice and bob, each in their own kubeconfig, against a provider the lesson adds at the start and removes at the end (experiment X-AUTH-02); the OAuth configuration was then checked against the copy taken before the change. Generated passwords are not shown. Retiring kubeadmin on an installed cluster is a documented example: OpenShift Local has no kubeadmin Secret to delete."
  concepts: [ocp.users-identities, ocp.auth, sec.rbac]
  prerequisites: [n.htpasswd-idp]
  record_on: cluster-admin
  test_users: [alice, bob]
  secret_vars: [BOB_NEW_PASSWORD, ERIN_PASSWORD]
  objective: |
    Change a user's password, recover from a password file replaced by mistake, remove a person completely
    (credential, User, Identity, tokens and bindings) and know how long their session survives, and give
    cluster administration to a group instead of to individual users.
  flow:
    - kind: ask
      id: recall-secret-key
      recalls: n.htpasswd-idp
      prompt: "Where does an HTPasswd identity provider read its users and password hashes from?"
      choices:
        - text: "From the OAuth object, which lists every user"
          why: "The OAuth object names the provider and its Secret. The users are in the file inside that Secret."
        - text: "From a Secret in openshift-config, under the key htpasswd"
          why: "Right: every user change in this lesson is a change to that file, put back into that Secret."
        - text: "From the User objects in the cluster"
          why: "User objects are created at login. The provider never reads them."
      answer: 1
    - kind: teach
      id: situation
      title: "A provider with two users"
      body: |
        The lab cluster has the `lab-users` provider from [the previous lesson](/lesson/n.htpasswd-idp), set up again
        at the start of this recording with the same commands, and two users, alice and bob, who have logged in once
        and work in the project `lab-team`. This lesson does what an administrator does next, all of it for real:
        change a password, recover from a mistake, remove a person, and make someone an administrator.

        As before, the prompt names who ran each command: the administrator (`kubeadmin`), alice or bob, each in
        their own terminal and kubeconfig. The recorder prepared those terminals and generated the passwords
        (`$BOB_PASSWORD` and the others); to do it yourself, follow "Repeat it on your own cluster" under Go deeper.
    - kind: show
      id: setup
      body: "The setup, in one go: the file with two users, the Secret, the provider appended to the list, and a copy of the configuration taken first."
      run: "oc get oauth cluster -o jsonpath='{.spec}' > oauth-spec-before.json && htpasswd -c -B -b users.htpasswd alice \"$ALICE_PASSWORD\" && htpasswd -B -b users.htpasswd bob \"$BOB_PASSWORD\" && oc create secret generic lab-users-htpasswd --from-file=htpasswd=users.htpasswd -n openshift-config && oc patch oauth cluster --type=json -p '[{\"op\":\"add\",\"path\":\"/spec/identityProviders/-\",\"value\":{\"name\":\"lab-users\",\"mappingMethod\":\"claim\",\"type\":\"HTPasswd\",\"htpasswd\":{\"fileData\":{\"name\":\"lab-users-htpasswd\"}}}}]'"
      notice: "Two users in the file, the Secret created, the provider added."
    - kind: show
      id: setup-wait
      run: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s"
      notice: "The authentication operator rolled out the OAuth server with the new provider."
    - kind: show
      id: setup-team
      run: "oc adm new-project lab-team && oc adm policy add-role-to-user view alice -n lab-team && oc adm policy add-role-to-user view bob -n lab-team"
      notice: |
        The team project, where alice and bob may read. The warnings are expected: alice and bob have not logged in yet
        in this recording, so their User objects do not exist, and a binding may name a user that does not exist.
    - kind: show
      id: alice-login
      body: "In alice's terminal, her login:"
      run: "oc login -u alice -p \"$ALICE_PASSWORD\""
      notice: "alice is logged in, in her own terminal. Her project list is still empty: the list a login shows can take a few seconds to include a binding made a moment before. bob, a moment later, sees `lab-team`, and so does alice's later login."
    - kind: show
      id: bob-login
      body: "In bob's terminal, his:"
      run: "oc login -u bob -p \"$BOB_PASSWORD\""
      notice: "So is bob, in his."
    - kind: teach
      id: update-loop
      title: "Changing a password"
      body: |
        bob forgot his password. The Secret holds the only copy of the file, so every change follows one loop:

        1. Extract the current file from the Secret.
        2. Change it with `htpasswd`.
        3. Put the whole file back into the same key.
        4. Wait for the authentication operator, then test the login.

        `oc extract secret/<name> --to=<directory>` writes each key of a Secret as a file in that directory.
    - kind: try
      id: try-extract
      body: |
        The empty directory `current` exists. Extract the keys of the Secret `lab-users-htpasswd`, in the project
        `openshift-config`, into `current` as files.
      accept:
        - "oc extract secret/lab-users-htpasswd -n openshift-config --to=current"
        - "oc extract secret/lab-users-htpasswd -n openshift-config --to current"
        - "oc extract secret lab-users-htpasswd -n openshift-config --to=current"
        - "oc extract secret/lab-users-htpasswd --to=current -n openshift-config"
        - "oc extract -n openshift-config secret/lab-users-htpasswd --to=current"
        - "oc extract secret/lab-users-htpasswd -n openshift-config --to=./current"
        - "oc extract secret/lab-users-htpasswd -n openshift-config --to=current --confirm"
        - "oc extract secrets/lab-users-htpasswd -n openshift-config --to=current"
      hints:
        - match: "^oc get secret"
          say: "`oc get` shows the object; its data is base64 text inside YAML. `oc extract` writes each key out as a file, which is what `htpasswd` needs."
        - match: "^oc extract lab-users"
          say: "`oc extract` needs the kind too: `secret/lab-users-htpasswd`."
        - match: "^oc extract secret/lab-users-htpasswd --to=?current$"
          say: "The Secret is in `openshift-config`, not in your current project: add `-n openshift-config`."
        - match: "--to=?-"
          say: "`--to=-` prints to the screen. Here the file must land in the directory `current`."
      hint: "`oc extract secret/lab-users-htpasswd`, its project, then the option that names the directory."
      run: "mkdir current && oc extract secret/lab-users-htpasswd -n openshift-config --to=current"
      then: "The recording created `current` first. The key name, `htpasswd`, became the file name: `current/htpasswd`."
    - kind: show
      id: change-bob
      body: "Step 2: give bob a new password in the extracted file. The same command that adds a user replaces an existing user's line:"
      run: "htpasswd -B -b current/htpasswd bob \"$BOB_NEW_PASSWORD\""
      notice: "`Updating password for user bob`: one line replaced, alice untouched. `$BOB_NEW_PASSWORD` (and `$ERIN_PASSWORD` below) were generated by the recorder for this run and never displayed: they do not exist in your terminal. On your own cluster, leave out `-b` and the variable and type a password at the prompt (Repeat it on your own cluster, under Go deeper)."
    - kind: show
      id: put-back
      body: "Step 3: put the whole file back. `oc set data` replaces the content of the key:"
      run: "oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=current/htpasswd"
      notice: "`secret/lab-users-htpasswd data updated`."
    - kind: ask
      id: guess-rollout
      guess: true
      prompt: "Only the Secret changed, not the OAuth object. Does the authentication operator roll out the OAuth server again?"
      choices:
        - text: "No: it watches the OAuth object only"
          why: "The operator copies every provider's Secret into the OAuth server's project and restarts the server when one changes. The next step shows it."
        - text: "Yes: the server must restart to read the new file"
          why: "Right. The operator records a hash of the copied Secrets on the Deployment, so a changed Secret means new pods."
        - text: "No: the OAuth server rereads the file on every login"
          why: "The file is mounted into the OAuth server's pods from a copy the operator maintains; a change goes through the operator."
      answer: 1
    - kind: show
      id: wait-password
      body: "Step 4: wait."
      run: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s"
      notice: "A new rollout started and finished: a changed Secret is a configuration change like any other."
    - kind: show
      id: bob-still
      body: "In bob's terminal, nothing has happened yet: his token was issued before the change."
      run: "oc whoami"
      notice: "`bob`. A password change stops new logins with the old password; it does not end sessions that already exist."
    - kind: show
      id: bob-old-refused
      body: "Still in bob's terminal, a new login with the old password. It should be refused now:"
      run: "oc login -u bob -p \"$BOB_PASSWORD\""
      notice: "`Login failed (401 Unauthorized)`: the old password no longer matches the hash in the file."
    - kind: show
      id: bob-new-accepted
      body: "And with the new password:"
      run: "oc login -u bob -p \"$BOB_NEW_PASSWORD\""
      notice: "The new one works."
    - kind: teach
      id: mistake
      title: "A file replaced by mistake"
      body: |
        A new colleague, erin, needs an account. A tempting shortcut is to create a file for her alone and put it
        into the Secret. Both commands succeed, and nothing warns you.
    - kind: show
      id: fresh-file
      run: "htpasswd -c -B -b fresh.htpasswd erin \"$ERIN_PASSWORD\" && oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=fresh.htpasswd"
      notice: "`data updated`, as before."
    - kind: show
      id: fresh-check
      body: "Check what the Secret now holds, printing only the user names (the error stream, where `oc extract` names the key, is hidden):"
      run: "oc extract secret/lab-users-htpasswd -n openshift-config --to=- 2>/dev/null | cut -d: -f1"
      notice: "Only erin. alice and bob have lost their accounts in this provider."
    - kind: show
      id: wait-mistake
      run: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s"
      notice: "The operator applied the mistake as faithfully as anything else."
    - kind: show
      id: alice-locked-out
      body: "alice tries to log in again:"
      run: "oc login -u alice -p \"$ALICE_PASSWORD\""
      notice: "Refused. Had the administrator's own account been in this file, they would have locked themselves out too."
    - kind: show
      id: repair
      body: "In the administrator's terminal, the repair is the extracted copy in `current/htpasswd`, which still holds alice and bob (with his new password). Put it back:"
      run: "oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=current/htpasswd && oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s"
      notice: "Restored and rolled out. Never build the file from scratch: extract, edit, put back. erin is added to the extracted file in the same way as bob was changed."
    - kind: show
      id: alice-back
      body: "alice tries again, in her terminal:"
      run: "oc login -u alice -p \"$ALICE_PASSWORD\""
      notice: "alice can log in again."
    - kind: teach
      id: removing-user
      title: "Removing a person"
      body: |
        alice is leaving. Her access is made of several pieces, and each must go: the line in the file, her User and
        Identity, her tokens, and the bindings and group memberships that name her. Start with the credential, so that
        no new login can begin.
    - kind: show
      id: remove-line
      body: "In the administrator's terminal:"
      run: "htpasswd -D current/htpasswd alice && oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=current/htpasswd && oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s"
      notice: "`Deleting password for user alice`, the Secret updated, and the rollout done."
    - kind: show
      id: alice-session-alive
      body: "In alice's terminal:"
      run: "oc whoami"
      notice: "`alice`: removing the line stopped new logins, not her existing session."
    - kind: show
      id: alice-objects
      body: "Back in the administrator's terminal: her User and Identity are still there, and so is the binding that lets her read `lab-team`:"
      run: "oc get user alice && oc get identity lab-users:alice && oc get rolebindings -n lab-team -o wide"
      highlight: ["alice"]
      notice: "Nothing in the cluster reacted to the file change. Each object must be removed on purpose."
    - kind: order
      id: order-removal
      prompt: |
        Put the steps for removing alice completely in the order this lesson runs them.
      items:
        - "Remove her line from the password file and put the file back"
        - "Delete her User"
        - "Delete her Identity"
        - "Delete her access tokens"
        - "Remove the bindings and group memberships that name her"
      why: |
        The credential goes first, so that no new login can start. Deleting the User and Identity ends the mapping from her
        account, and her tokens are deleted rather than left to expire. Bindings and memberships are not deleted with the
        User: they would apply again to anyone who later logs in as alice. When access must end at once, remove the bindings
        right after the credential: they are evaluated for every request, while a deleted user's token can still be accepted
        until the cached token check expires.
    - kind: show
      id: delete-user
      run: "oc delete user alice && oc delete identity lab-users:alice && oc delete oauthaccesstokens --field-selector userName=alice"
      notice: "The User, the Identity and her access token objects are deleted."
    - kind: show
      id: alice-session-after
      body: "The API server caches the answer to a token check for a short time, so her session may survive a little longer. In her terminal, retrying every five seconds:"
      run: "start=$(date +%s); while oc whoami >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still accepted after 5 minutes'; exit 1; }; sleep 5; done; echo \"refused after $(( $(date +%s) - start )) seconds:\"; oc whoami || true"
      notice: "Her token is refused. The delay before the refusal is the cache, not a weakness of the steps."
    - kind: show
      id: leftover-binding
      body: "In the administrator's terminal, what remains is what nobody removes for you:"
      run: "oc get rolebindings -n lab-team -o wide"
      highlight: ["alice"]
      notice: "The `view` binding still names alice. If anyone later logs in as alice, through any provider, it applies again."
    - kind: show
      id: remove-binding
      run: "oc adm policy remove-role-from-user view alice -n lab-team"
      notice: |
        Removed. A leaver's grants can also sit in other projects, in cluster-wide bindings and in groups. The next task
        searches the RoleBindings of every project; the cluster-wide places follow it.
    - kind: try
      id: try-find-grants
      body: "As the administrator: alice could hold access in any project. List the RoleBindings of every project with their subjects, keeping only the lines that name alice."
      accept: ["oc get rolebindings -A -o wide | grep alice", "oc get rolebindings -A -o wide | grep -w alice", "oc get rolebindings --all-namespaces -o wide | grep alice", "oc get rolebindings --all-namespaces -o wide | grep -w alice", "oc get rolebinding -A -o wide | grep alice", "oc get rolebinding -A -o wide | grep -w alice", "oc get rolebindings -o wide -A | grep alice", "oc get rolebindings -o wide -A | grep -w alice"]
      hints:
        - match: "^oc get rolebindings? -o wide( \\| grep.*)?$"
          say: "Without `-A` the search covers only your current project. Add `-A` for every project."
        - match: "^oc get rolebindings? -A( -o wide)?$"
          say: "That lists every binding of every project. Keep only the lines that name alice: `| grep alice`."
        - match: "^oc get rolebindings? -A \\| grep"
          say: "Without `-o wide` the table has no subjects column, so alice's name is not there to find. Add `-o wide`."
        - match: "clusterrolebindings"
          say: "Cluster-wide bindings matter too, and are covered after this task. This task is the per-project RoleBindings."
      hint: "`oc get rolebindings -A -o wide`, then `| grep alice`."
      then: |
        This task searches RoleBindings only. Cluster-wide grants need the same search: `oc get clusterrolebindings -o
        wide | grep -w alice` for ClusterRoleBindings, and `oc get groups` for her group memberships. Any of the three
        can keep a leaver's access. ClusterRoleBindings and Groups are cluster-scoped, and an ordinary user may not
        list them, nor the RoleBindings of every project: these searches need a cluster administrator (here kubeadmin).
    - kind: teach
      id: admins-group
      title: "Administrators through a group"
      body: |
        `kubeadmin` is a bootstrap login meant to be replaced. The replacement is not another all-powerful individual:
        it is a group, bound to the `cluster-admin` role with a ClusterRoleBinding, so that administration follows
        group membership. bob joins the platform team. Groups get their own lesson later,
        [Users, groups and access for teams](/lesson/o2.groups); here one command creates the group with bob in it.
    - kind: show
      id: make-group
      run: "oc adm groups new lab-admins bob && oc adm policy add-cluster-role-to-group cluster-admin lab-admins"
      notice: |
        A group with bob in it, and `cluster-admin` bound to the group, in every project. Membership of this group is now as
        powerful as `kubeadmin`: whoever may change the group can make anyone an administrator, so changes to it deserve the
        same review as a `cluster-admin` grant.
    - kind: show
      id: bob-admin
      body: "In bob's terminal, waiting until the new membership counts (his groups are part of the cached answer to his token check):"
      run: "start=$(date +%s); until oc auth can-i '*' '*' --all-namespaces >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still no after 5 minutes'; exit 1; }; sleep 5; done; echo \"yes after $(( $(date +%s) - start )) seconds\""
      notice: |
        bob is now a cluster administrator, through the group. Here it counted at once (`yes after 1 seconds`): no
        cached answer for bob's token was still fresh, so the first check already saw the new group.
    - kind: show
      id: no-kubeadmin-secret
      body: "Back in the administrator's terminal. On a cluster made by the installer, the last step would be deleting the `kubeadmin` Secret. On OpenShift Local there is none, so this read ends in NotFound:"
      run: "oc get secret kubeadmin -n kube-system"
      notice: |
        `NotFound`: here kubeadmin is an ordinary HTPasswd user with a ClusterRoleBinding, as [Add an HTPasswd identity
        provider](/lesson/n.htpasswd-idp) showed.
    - kind: show
      id: retire-example
      code: |
        $ oc login -u bob --server=<api-url> --kubeconfig=bob.kubeconfig     # a member of the admins group, in a separate kubeconfig
        $ oc auth can-i '*' '*' --all-namespaces --kubeconfig=bob.kubeconfig
        yes
        $ oc delete secrets kubeadmin -n kube-system
      caption: "Documented example, not run here (OpenShift Local has no kubeadmin Secret): retiring kubeadmin on an installed cluster, from the OpenShift 4.21 documentation (Removing the kubeadmin user)."
      origin: example
      notice: |
        Delete the Secret only after another administrator has proved a working login. Without one, the documented
        recovery is reinstalling the cluster.
    - kind: ask
      id: before-kubeadmin
      prompt: "The group lab-admins works for bob. Before you delete the kubeadmin Secret on an installed cluster, which step is essential?"
      choices:
        - text: "Restart the OAuth server pods so they pick up bob"
          why: "Restarting proves nothing about who can administer the cluster."
        - text: "Delete the kubeadmin User object first"
          why: "kubeadmin is removed by deleting its Secret in kube-system. What matters is what must exist before that."
        - text: "Prove that a member of the group can administer the cluster with a real login"
          why: "Deleting kubeadmin first can leave nobody able to administer the cluster. Prove the replacement works, in a separate kubeconfig, before removing the bootstrap credential."
      answer: 2
    - kind: show
      id: undo-admins
      body: "The lab change is undone like every other: the binding, then the group."
      run: "oc adm policy remove-cluster-role-from-group cluster-admin lab-admins && oc delete group lab-admins"
      notice: "Removed by name."
    - kind: show
      id: cleanup
      body: "Finally, the provider and everything the lesson made, then the proof that the OAuth configuration is back to the copy:"
      run: "oc patch oauth cluster --type=json -p '[{\"op\":\"test\",\"path\":\"/spec/identityProviders/1/name\",\"value\":\"lab-users\"},{\"op\":\"remove\",\"path\":\"/spec/identityProviders/1\"}]' && oc delete secret lab-users-htpasswd -n openshift-config && oc delete project lab-team && oc delete user bob && oc delete identity lab-users:bob && oc delete oauthaccesstokens --field-selector userName=bob && oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s && oc get oauth cluster -o jsonpath='{.spec}' | diff oauth-spec-before.json - && echo 'OAuth spec identical to the copy'"
      notice: "The cluster's identity configuration is back to what it was before the lesson."
    - kind: reflect
      id: explain-offboarding
      prompt: "A colleague says: \"To remove someone, I delete their line from the htpasswd file.\" Explain what that does and does not do."
      model: |
        Removing the line, putting the file back and waiting for the rollout stops new logins through that provider.
        It does not end the person's current sessions: their tokens keep working. Their User and Identity remain, and
        so do the role bindings and group memberships that name them, which would apply again if anyone logged in
        under that name. A complete removal also deletes the User, the Identity and the tokens, and removes the
        bindings and memberships; even then, the API server may accept a cached token check for a short time.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can change passwords with the extract, edit and put-back loop, recover from a replaced file, remove a
        person completely and know how long their session can survive, and give administration to a group. A login
        creates a User, not permissions; the next lesson, [RBAC and effective permissions](/lesson/f.rbac), teaches
        how roles and bindings grant access.
  sections:
    - id: repeat-it-yourself
      title: "Repeat it on your own cluster"
      depth: true
      body: |
        Only on a cluster of your own that you can delete, such as OpenShift Local: these steps change the cluster's
        login configuration and make bob a cluster administrator for a while.

        **Starting state.** Follow steps 1 to 5 of "Repeat it on your own cluster" in
        [Add an HTPasswd identity provider](/lesson/n.htpasswd-idp): three kubeconfig files in `~/idp-lab`, passwords
        you chose with `htpasswd` (no `-b`), the `lab-users` provider, the project `lab-team`, and one login each for
        alice and bob. That lesson grants them `edit`; this one's recording grants `view`. Use the role you granted
        everywhere this lesson removes or checks one: removing `view` from alice leaves an `edit` binding, and with it
        her access (`oc adm policy remove-role-from-user edit alice -n lab-team`). `oc get rolebindings -n lab-team`
        shows what is left.

        **The administrator's commands** then work as recorded, with two changes. Where the recording passes a
        password with `-b` and a variable, leave both out and type the new password at the prompt:

        ```
        htpasswd -B current/htpasswd bob
        ```

        And alice and bob log in from their own terminals with `--kubeconfig` and without `-p`, as in that lesson.
        Before the deliberate mistake with `fresh.htpasswd`, make sure `current/htpasswd` holds the good file: it is
        your way back.

        **Roll back** with step 6 of the same section, after removing the administrator group:

        ```
        oc adm policy remove-cluster-role-from-group cluster-admin lab-admins
        oc delete group lab-admins
        ```

        alice's User and Identity are already deleted, so `oc delete` reports them as not found; that is expected.
        Then delete `~/idp-lab`. Retiring `kubeadmin` itself is not part of this exercise: on OpenShift Local it is a
        user of the cluster's own provider, and on any cluster it waits until another administrator's login is
        proven.
    - id: when-logins-fail
      title: "When logins fail after a change"
      depth: true
      body: |
        Read the evidence before editing again.

        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | everyone except the newest user lost access | the extracted file has one line | the file was rebuilt from scratch | put back the previous file, then add the user to it |
        | the new password does not work yet | `oc get clusteroperator authentication` shows Progressing `True` | the rollout is not finished | wait for Progressing `False` |
        | a removed person can still run commands | `oc whoami` in their session | their token is still valid or still cached | delete the User and the tokens; allow for the cache time |
        | the login works but the person can do nothing | `oc auth can-i --list` as that user | a login creates a User, not permissions | bind a role, preferably to a group |
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Building a new file instead of editing the extracted one.** Everyone else loses access.
        - **Removing the line but not the User, the tokens and the bindings.** Sessions and grants outlive the line.
        - **Granting cluster-admin to individual users.** Every joiner, mover and leaver becomes a manual change;
          bind to a group.
        - **Removing kubeadmin first.** Prove that another administrator can log in before deleting the Secret.
  review:
    - q: "How do you change a user's password in an HTPasswd provider?"
      a: "Extract the file from the Secret, change the user's line with htpasswd -B, put the whole file back with oc set data, wait for the authentication operator's rollout, then test the login."
    - q: "Does a password change end the user's current sessions?"
      a: "No: existing tokens keep working. Only new logins need the new password."
    - q: "Name the steps to remove a person completely."
      a: "Remove the line from the file and put it back; delete the User, the Identity and the access tokens; remove the role bindings and group memberships that name them."
    - q: "Why can a deleted user's token still work for a short time?"
      a: "The API server caches the answer to token checks (two minutes by default in Kubernetes), so a token can be accepted until that cached answer expires."
    - q: "What must exist before you delete the kubeadmin Secret?"
      a: "Another identity with cluster-admin, ideally through a group, proved with a real login in a separate kubeconfig."
  labs: []
  limits: |
    OpenShift Local has no kubeadmin Secret: its kubeadmin is a user of the cluster's own HTPasswd provider, so the
    final step of retiring kubeadmin is a documented example. Changes to the cluster's own provider (the one holding
    developer and kubeadmin) are never made here; the lesson works on a provider it adds and removes itself.
  enterprise: |
    Organisations connect OpenShift to the corporate directory and handle joiners and leavers there; the platform team
    still owns the cleanup of Users, Identities, tokens and stale bindings, and keeps a separately secured emergency
    administrator account.
  commands:
    - {cmd: "oc get oauth cluster -o jsonpath='{.spec}' > oauth-spec-before.json && htpasswd -c -B -b users.htpasswd alice \"$ALICE_PASSWORD\" && htpasswd -B -b users.htpasswd bob \"$BOB_PASSWORD\" && oc create secret generic lab-users-htpasswd --from-file=htpasswd=users.htpasswd -n openshift-config && oc patch oauth cluster --type=json -p '[{\"op\":\"add\",\"path\":\"/spec/identityProviders/-\",\"value\":{\"name\":\"lab-users\",\"mappingMethod\":\"claim\",\"type\":\"HTPasswd\",\"htpasswd\":{\"fileData\":{\"name\":\"lab-users-htpasswd\"}}}}]'", as: admin, meaning: "the setup from the previous lesson, in one go"}
    - {cmd: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s", as: admin, timeout: 900, meaning: "wait for the authentication operator's rollout to start and finish"}
    - {cmd: "oc adm new-project lab-team && oc adm policy add-role-to-user view alice -n lab-team && oc adm policy add-role-to-user view bob -n lab-team", as: admin, meaning: "a team project where alice and bob may read"}
    - {cmd: "oc login -u alice -p \"$ALICE_PASSWORD\"", as: alice, meaning: "alice logs in"}
    - {cmd: "oc login -u bob -p \"$BOB_PASSWORD\"", as: bob, meaning: "bob logs in"}
    - {cmd: "mkdir current && oc extract secret/lab-users-htpasswd -n openshift-config --to=current", as: admin, meaning: "step 1: the Secret's key becomes the file current/htpasswd"}
    - {cmd: "htpasswd -B -b current/htpasswd bob \"$BOB_NEW_PASSWORD\"", as: admin, meaning: "step 2: bob's line replaced with a new hash"}
    - {cmd: "oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=current/htpasswd", as: admin, meaning: "step 3: the whole file put back into the key"}
    - {cmd: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s", as: admin, timeout: 900, meaning: "step 4: the operator rolls out the changed Secret"}
    - {cmd: "oc whoami", as: bob, meaning: "bob's existing session survives the password change"}
    - {cmd: "oc login -u bob -p \"$BOB_PASSWORD\"", as: bob, expect: fail, meaning: "the old password is refused"}
    - {cmd: "oc login -u bob -p \"$BOB_NEW_PASSWORD\"", as: bob, meaning: "the new password works"}
    - {cmd: "htpasswd -c -B -b fresh.htpasswd erin \"$ERIN_PASSWORD\" && oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=fresh.htpasswd", as: admin, meaning: "the mistake: a one-user file replaces the whole provider's file"}
    - {cmd: "oc extract secret/lab-users-htpasswd -n openshift-config --to=- 2>/dev/null | cut -d: -f1", as: admin, meaning: "only erin is left"}
    - {cmd: "oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s", as: admin, timeout: 900, meaning: "the mistake is rolled out"}
    - {cmd: "oc login -u alice -p \"$ALICE_PASSWORD\"", as: alice, expect: fail, meaning: "alice is locked out"}
    - {cmd: "oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=current/htpasswd && oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s", as: admin, timeout: 900, meaning: "the repair: the extracted copy put back, and rolled out"}
    - {cmd: "oc login -u alice -p \"$ALICE_PASSWORD\"", as: alice, meaning: "alice can log in again"}
    - {cmd: "htpasswd -D current/htpasswd alice && oc set data secret/lab-users-htpasswd -n openshift-config --from-file=htpasswd=current/htpasswd && oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s", as: admin, timeout: 900, meaning: "alice's line removed, the file put back, the rollout done"}
    - {cmd: "oc whoami", as: alice, meaning: "her existing session still works"}
    - {cmd: "oc get user alice && oc get identity lab-users:alice && oc get rolebindings -n lab-team -o wide", as: admin, meaning: "her User, Identity and binding are still there"}
    - {cmd: "oc delete user alice && oc delete identity lab-users:alice && oc delete oauthaccesstokens --field-selector userName=alice", as: admin, meaning: "delete her User, Identity and access tokens"}
    - {cmd: "start=$(date +%s); while oc whoami >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still accepted after 5 minutes'; exit 1; }; sleep 5; done; echo \"refused after $(( $(date +%s) - start )) seconds:\"; oc whoami || true", as: alice, timeout: 360, meaning: "how long her session survived"}
    - {cmd: "oc get rolebindings -n lab-team -o wide", as: admin, meaning: "the binding still names alice"}
    - {cmd: "oc adm policy remove-role-from-user view alice -n lab-team", as: admin, meaning: "remove the leftover binding"}
    - {cmd: "oc adm groups new lab-admins bob && oc adm policy add-cluster-role-to-group cluster-admin lab-admins", as: admin, meaning: "a group of administrators, bound to cluster-admin"}
    - {cmd: "start=$(date +%s); until oc auth can-i '*' '*' --all-namespaces >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 300 ] && { echo 'still no after 5 minutes'; exit 1; }; sleep 5; done; echo \"yes after $(( $(date +%s) - start )) seconds\"", as: bob, timeout: 360, meaning: "bob is a cluster administrator through the group"}
    - {cmd: "oc get secret kubeadmin -n kube-system", as: admin, expect: fail, meaning: "OpenShift Local has no kubeadmin Secret"}
    - {cmd: "oc adm policy remove-cluster-role-from-group cluster-admin lab-admins && oc delete group lab-admins", as: admin, meaning: "undo the administrators group"}
    - {cmd: "oc patch oauth cluster --type=json -p '[{\"op\":\"test\",\"path\":\"/spec/identityProviders/1/name\",\"value\":\"lab-users\"},{\"op\":\"remove\",\"path\":\"/spec/identityProviders/1\"}]' && oc delete secret lab-users-htpasswd -n openshift-config && oc delete project lab-team && oc delete user bob && oc delete identity lab-users:bob && oc delete oauthaccesstokens --field-selector userName=bob && oc wait co/authentication --for=condition=Progressing=True --timeout=180s && oc wait co/authentication --for=condition=Progressing=False --timeout=600s && oc get oauth cluster -o jsonpath='{.spec}' | diff oauth-spec-before.json - && echo 'OAuth spec identical to the copy'", as: admin, timeout: 900, meaning: "remove the provider and everything the lesson made, then compare with the copy"}
  experiment:
    id: X-AUTH-02
    objective: "On an HTPasswd provider added for the purpose, change a password, replace and repair the file, remove a user completely, give cluster-admin through a group, then remove every trace and prove the OAuth configuration is unchanged."
    changes:
      - "oauth.config.openshift.io/cluster: one entry appended to spec.identityProviders, then removed"
      - "Secret openshift-config/lab-users-htpasswd (created, updated four times, deleted)"
      - "Users alice and bob, Identities lab-users:alice and lab-users:bob, their OAuth access tokens (created by login, deleted)"
      - "Group lab-admins and a ClusterRoleBinding of cluster-admin to it (created, deleted)"
      - "Project lab-team with RoleBindings (created, deleted)"
      - "OAuth server pods in openshift-authentication (rolled out six times by the authentication operator)"
    preflight:
      - {cmd: "oc get user alice", expect: fail}
      - {cmd: "oc get user bob", expect: fail}
      - {cmd: "oc get group lab-admins", expect: fail}
      - {cmd: "oc get project lab-team", expect: fail}
      - {cmd: "oc get secret lab-users-htpasswd -n openshift-config", expect: fail}
      - {cmd: "oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}' | grep -qw lab-users", expect: fail}
      - {cmd: "oc wait co/authentication --for=condition=Available=True --timeout=30s && oc wait co/authentication --for=condition=Progressing=False --timeout=30s && oc wait co/authentication --for=condition=Degraded=False --timeout=30s"}
    snapshot:
      - "oc get oauth cluster -o jsonpath='{.spec}'"
      - "oc get secret htpass-secret -n openshift-config -o jsonpath='{.metadata.uid} {.metadata.resourceVersion}'"
      - "oc get users -o name"
      - "oc get identities -o name"
      - "oc get groups -o name"
      - "oc get clusterrolebindings -o wide | grep -w cluster-admin | sort"
      - "oc get secrets -n openshift-config -o name"
      - "oc get project lab-team -o name --ignore-not-found"
    rollback:
      - "oc patch oauth cluster --type=merge -p \"{\\\"spec\\\":$(cat \"$SNAPSHOT_DIR/0\")}\""
      - "oc adm policy remove-cluster-role-from-group cluster-admin lab-admins >/dev/null 2>&1; oc delete group lab-admins --ignore-not-found"
      - "oc delete secret lab-users-htpasswd -n openshift-config --ignore-not-found"
      - "oc delete project lab-team --ignore-not-found --wait=false"
      - "oc delete user alice bob --ignore-not-found"
      - "oc delete identity lab-users:alice lab-users:bob --ignore-not-found"
      - "oc delete oauthaccesstokens --field-selector userName=alice --ignore-not-found && oc delete oauthaccesstokens --field-selector userName=bob --ignore-not-found"
    settle:
      - "oc wait --for=delete project/lab-team --timeout=300s"
      - "sleep 60; oc wait co/authentication --for=condition=Progressing=False --timeout=900s"
    verify:
      - {cmd: "oc wait co/authentication --for=condition=Available=True --timeout=60s && oc wait co/authentication --for=condition=Degraded=False --timeout=60s"}
    login_checks: [developer]
  references:
    - {title: "OpenShift 4.21: Configuring an htpasswd identity provider (updating users)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/configuring-identity-providers"}
    - {title: "OpenShift 4.21: Understanding identity provider configuration (removing the kubeadmin user)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-identity-provider"}
    - {title: "OpenShift 4.21: Managing user-owned OAuth access tokens", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/managing-oauth-access-tokens"}
    - {title: "Kubernetes: kube-apiserver options (--authentication-token-webhook-cache-ttl)", url: "https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/"}
- id: f.rbac
  title: "RBAC and effective permissions"
  subtitle: "Roles, bindings and the path from a subject to a permission"
  module: b2-authn-authz
  mode: REAL_LAB
  minutes: 40
  level: 2
  supports: "rbac.authorization.k8s.io/v1 on OpenShift 4.21. Recorded on OpenShift Local as the ordinary user developer, in a temporary project. As project admin, developer may impersonate the ServiceAccounts of its own project with `oc auth can-i --as`, but not users or groups; the recordings show both."
  concepts: [sec.rbac, sec.serviceaccounts]
  simulator: rbac
  diagram: rbac
  prerequisites: [c.auth]
  record_on: cluster
  objective: |
    Grant exactly the permissions a workload needs, prove the result with `oc auth can-i`, and explain the
    path from a subject to a permission.
  flow:
    - kind: ask
      id: recall-which-check
      recalls: c.auth
      prompt: "`oc whoami` prints your name, but `oc get pods -n payments` is Forbidden. Which check said no?"
      choices:
        - text: "Authentication: your token is rejected"
          why: "A rejected token gives Unauthorized, and `oc whoami` would fail too."
        - text: "Admission: a quota or policy blocked it"
          why: "Admission runs after both checks, on requests that change something. Listing pods is a read, and Forbidden names a missing permission."
        - text: "Authorization: no rule allows this"
          why: "Authentication worked, since the server knows your name. Authorization found no rule that allows the action, and the rules are this lesson."
      answer: 2
    - kind: teach
      id: leaked-token
      title: "What a leaked token can do"
      body: |
        A continuous integration (CI) pipeline, an automated build and test process, leaks its token in a
        build log. What can an attacker do with it? Exactly what RBAC lets that identity do, nothing more.
        If the pipeline was given `admin` "to make it work", the token can read every Secret in the project
        and grant access to others. A role that only patches two Deployments is far narrower, but not
        harmless: patching a Deployment rewrites its pod template, so the attacker can run any image with
        any ServiceAccount of the project. "May change workloads" is trusted access, and RBAC alone does not
        limit it further.

        **RBAC** (role-based access control) is the check behind every Forbidden. Reading that error and
        tracing it to the rule that grants the permission, or should, is a daily skill on OpenShift, and the
        basis of every access review.
    - kind: teach
      id: how-rbac-decides
      body: |
        Every request to the API server says **who** wants to do **which verb** (`get`, `list`, `watch`,
        `create`, `update`, `patch`, `delete`) on **which resource**, **where** (one project, or the whole
        cluster). RBAC allows it if any rule reachable from that subject matches. If none does, the answer
        is no: RBAC denies by default, and it has no deny rules. Permissions only add up.

        The subject is a user, a group or a **ServiceAccount**: an identity for software, such as a pipeline
        or a pod, that RBAC sees as the user `system:serviceaccount:<project>:<name>`. A new one has
        baseline rights through its groups, such as API discovery and pulling this project's images; it
        cannot list pods by default. [ServiceAccounts and workload identity](/lesson/o2.service-accounts)
        covers them in depth; one is enough to practise on here.
    - kind: show
      id: first-no
      body: |
        You can ask the API server what it would answer for an identity, without being that identity.
        `oc auth can-i <verb> <resource>` prints `yes` or `no`, and `--as` makes the server evaluate the request
        as another subject. Every command in this lesson is run by `developer`, the administrator of its own
        temporary project and nothing more; a few send a ServiceAccount's token instead, and say so. As the
        administrator of your project, you may use `--as` for its ServiceAccounts. This creates one and asks
        whether it may list pods:
      run: "oc create serviceaccount reporter; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter"
      notice: |
        `reporter` was created, and listing pods is `no` (`can-i` exits with status 1 when the answer is no): no
        rule grants that action yet. It still has baseline rights through its virtual groups, including this
        project's default image-pull grant.
      understand:
        purpose: Creates a ServiceAccount and asks the API server whether that identity may list pods, without using its
          credentials.
        parts:
          - text: --as=system:serviceaccount:academy-lesson-f-rbac:reporter
            means: 'Impersonation: the server evaluates the request as this user. A ServiceAccount''s user name is `system:serviceaccount:<project>:<name>`;
              the short name `reporter` alone would be an ordinary user of that name.'
        concepts:
          - sec.rbac
          - sec.serviceaccounts
        refs:
          - title: 'Kubernetes: Using RBAC authorization (service account subjects)'
            url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
          - title: 'Kubernetes: User impersonation'
            url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/#user-impersonation
    - kind: teach
      id: four-objects
      title: "Four objects"
      body: |
        - A **Role** lists rules: API groups, resources and verbs. It belongs to one project.
        - A **ClusterRole** is the same list, defined cluster-wide, and can be reused.
        - A **RoleBinding** grants a Role, or a ClusterRole, to subjects **in one project**.
        - A **ClusterRoleBinding** grants a ClusterRole to subjects **everywhere**, including things that belong to
          no project, such as nodes.

        The role kind says where the list is defined. The binding kind says where it applies. A ClusterRole granted
        with a RoleBinding is the normal way to reuse one definition in many projects, and it applies only in the
        RoleBinding's project.
    - kind: explore
      id: rbac-diagram
      diagram: rbac
      body: "Select RoleBinding, then ClusterRoleBinding, and compare what lights up. A RoleBinding can point at a Role or a ClusterRole and grants only in its own project; a ClusterRoleBinding can point only at a ClusterRole and grants everywhere."
    - kind: ask
      id: binding-scope
      prompt: "A ServiceAccount has a RoleBinding to the ClusterRole `view` in project A. Can it list pods in project B?"
      choices:
        - text: "Yes: `view` is a ClusterRole, so it applies everywhere"
          why: "The role kind only says where the rules are defined. The binding decides where they apply."
        - text: "No: a RoleBinding grants only in its own project"
          why: "The binding kind decides the scope: a RoleBinding to a ClusterRole grants those rules in that project only. A ClusterRoleBinding would grant them everywhere."
        - text: "Only if the ServiceAccount also exists in B"
          why: "RBAC matches the subject's name and never looks where it lives. The grant in A is not in force in B."
      answer: 1
    - kind: teach
      id: a-rule
      title: "Writing a rule"
      body: |
        A rule matches three things together: an **API group**, a **resource** and a **verb**. Pods are in the core
        group, written `""`; Deployments are `deployments` in the group `apps`. Subresources are separate
        resources: `pods/log` (read logs), `pods/exec` and `deployments/scale` need their own rules.

        `oc create role` builds the YAML from options. With `--dry-run=client -o yaml`, it prints the object
        instead of sending it:
    - kind: show
      id: role-yaml
      run: "oc create role pod-reader --verb=get,list,watch --resource=pods --dry-run=client -o yaml"
      highlight: ["apiGroups", "resources", "verbs"]
      notice: "One rule: the core group (`\"\"`), the resource `pods`, three read verbs. This Role grants nothing yet: a Role does nothing until a binding names a subject."
    - kind: show
      id: bind-role
      body: "Create the Role for real, bind it to `reporter` with a RoleBinding, and ask again:"
      run: "oc create role pod-reader --verb=get,list,watch --resource=pods; oc create rolebinding reporter-pods --role=pod-reader --serviceaccount=academy-lesson-f-rbac:reporter; oc auth can-i list pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter"
      notice: "The first answer was `no`; now it is `yes`. The binding's `--serviceaccount` takes `<project>:<name>`, the same two parts as the user name."
    - kind: try
      id: try-cannot-delete
      body: "Your project is `academy-lesson-f-rbac`. The Role has no `delete`. Prove it: ask whether `reporter` may delete pods."
      accept:
        - "oc auth can-i delete po --as system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i delete po --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i delete po --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i delete po --as system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i delete po --as=system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i delete po --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i delete po --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i delete po --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i delete pod --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as=system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i delete pod --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i delete pods --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter"
        - "oc auth can-i delete pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter --namespace=academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n academy-lesson-f-rbac"
        - "oc auth can-i delete po --as system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
        - "oc auth can-i delete po --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
        - "oc auth can-i delete pod --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
        - "oc auth can-i delete pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter -n=academy-lesson-f-rbac"
      hints:
        - match: "--as=reporter|--as reporter"
          say: "`--as=reporter` asks about a *user* named reporter. A ServiceAccount has a longer name: `system:serviceaccount:<project>:<name>`."
        - match: "system:serviceaccount:reporter"
          say: "The ServiceAccount's name has two parts after `system:serviceaccount:`, the project and the name: `academy-lesson-f-rbac:reporter`."
        - match: "^oc auth can-i delete pods?$"
          say: "That asks about you. Add `--as=` with the ServiceAccount's full name to ask about `reporter`."
        - match: "^oc auth can-i (list|get|watch)"
          say: "Those verbs are granted. The task is the one the Role leaves out: `delete`."
      hint: "`oc auth can-i`, the verb, the resource, then `--as=system:serviceaccount:` and the project and name."
      run: "oc auth can-i delete pods --as=system:serviceaccount:academy-lesson-f-rbac:reporter"
      then: "`no`, and the command exits with status 1, so a script or a pipeline can assert what must work and what must not."
    - kind: show
      id: impersonation-limits
      body: "The limit of `--as`: you may impersonate your own project's ServiceAccounts, but not users, and not ServiceAccounts of other projects:"
      run: "oc auth can-i list pods --as=alice; oc auth can-i list pods --as=system:serviceaccount:default:default -n default"
      notice: "Two refusals, each naming the permission `developer` lacks: `impersonate` on `users`, and on `serviceaccounts` in the project `default`."
    - kind: show
      id: read-bindings
      body: "Read the project's bindings, with their roles and subjects:"
      run: "oc get rolebindings -o wide"
      highlight: ["reporter-pods"]
      notice: |
        `reporter-pods` points to `Role/pod-reader` and names `academy-lesson-f-rbac/reporter`. The other rows are
        bindings every project gets: your own `admin`, and the three `system:` ones for image building, deploying
        and pulling. In an access review, these are expected; anything else was added by someone.
    - kind: teach
      id: default-roles
      title: "The roles the platform ships"
      body: |
        You rarely write a role for people. OpenShift ships ClusterRoles meant to be bound per project:

        - **`admin`**: view and change everything in the project, including roles and bindings, except resource
          quota. The creator of a project gets it.
        - **`edit`**: change most objects, **including reading Secrets**, but not roles or bindings.
        - **`view`**: read most objects, but no Secrets, no roles or bindings, no changes.

        Instead of reading their long rule lists, ask the API server. Two ServiceAccounts get `view` and `edit`
        (`-z` means "a ServiceAccount of this project"), and the loop asks three questions about each:
    - kind: show
      id: default-roles-evidence
      run: "oc create serviceaccount viewer; oc create serviceaccount editor; oc policy add-role-to-user view -z viewer; oc policy add-role-to-user edit -z editor; for sa in viewer editor; do for q in \"get secrets\" \"create deployments\" \"create rolebindings\"; do echo -n \"$sa: $q -> \"; oc auth can-i $q --as=system:serviceaccount:academy-lesson-f-rbac:$sa; done; done"
      highlight: ["editor: get secrets", "editor: create rolebindings"]
      notice: |
        `view` cannot read Secrets or change anything. `edit` can read Secrets and create Deployments, and still
        cannot create RoleBindings: handing out access is what `admin` adds. That is why "give them `edit`, to be
        safe" is not a small grant. The exit status is 1 because the last `can-i` answered no.
    - kind: ask
      id: edit-cannot-bind
      prompt: "A teammate has `edit` in project `shop`. They want the ServiceAccount `ci` to read Secrets there. What can they do on their own?"
      choices:
        - text: "Read the Secrets, but not give `ci` any access"
          why: "`edit` includes reading Secrets but no permission on RoleBindings, so granting access to `ci` needs someone with `admin` in `shop`."
        - text: "Bind `edit` to `ci`: anyone may grant a role they hold"
          why: "Holding a role is not enough. Creating the RoleBinding itself needs `create` on rolebindings, which `edit` leaves out on purpose."
        - text: "Nothing: `edit` cannot read Secrets either"
          why: "That is `view`. `edit` can read Secrets, as the `editor` line above shows, which is why it is not a small grant."
      answer: 0
    - kind: teach
      id: aggregated-roles
      body: |
        `admin`, `edit` and `view` are **aggregated** ClusterRoles. Their rules are not written by hand: each has
        an `aggregationRule` with label selectors, and the control plane fills the role's `rules` with those of
        every ClusterRole that carries a matching label. When an Operator installs a new API, it can ship a small
        ClusterRole with the label for `edit`, and everyone who holds `edit` can use the new resource. Rules added
        by hand to an aggregated role are overwritten, and Red Hat advises against changing the default roles:
        create your own.
    - kind: show
      id: aggregation-rule
      run: "oc get clusterrole edit -o jsonpath='{.aggregationRule}'"
      notice: "The selector: every ClusterRole labelled `rbac.authorization.k8s.io/aggregate-to-edit: \"true\"` contributes its rules to `edit`."
    - kind: ask
      id: aggregated-crd
      prompt: |
        An Operator adds create permission through a ClusterRole labelled `rbac.authorization.k8s.io/aggregate-to-edit: "true"`. Bob already has `edit` in `shop`. Can he create those objects?
      choices:
        - text: "Yes: the labelled ClusterRole is aggregated into `edit`"
          why: "`edit`'s rules are the union of every ClusterRole that matches its selector, so Bob's existing binding now covers the new rules."
        - text: "No: `edit` only covers built-in resource types"
          why: "That limit is what aggregation removes: new APIs extend the default roles without anyone editing them."
        - text: "Only after an administrator binds the new ClusterRole to Bob"
          why: "No new binding is needed. Bob's binding points at a role whose rule list has grown."
      answer: 0
    - kind: teach
      id: no-escalation
      title: "You cannot grant what you do not hold"
      body: |
        **Escalation** means gaining permissions beyond those you hold. Creating or changing a binding first
        requires permission on the binding object. An additional check allows the grant only if you hold every
        permission in the referenced role at that scope, or have `bind` on that role.

        Creating or changing a Role likewise needs permission on the Role object. Its rules may contain only
        permissions you hold at that scope, unless you have `escalate` on that Role. These safeguards explain why
        `developer` can grant `view` in its project but cannot grant `cluster-admin` there:
    - kind: show
      id: escalation-refused
      run: "oc create rolebinding grant-cluster-admin --clusterrole=cluster-admin --serviceaccount=academy-lesson-f-rbac:editor"
      notice: "Refused when the binding is created: `developer` is not allowed to hand out rules it does not hold. The message lists them: everything on every resource."
    - kind: teach
      id: design-a-grant
      title: "Designing a grant from the calls"
      body: |
        Work from the API calls the workload really makes, not from a role name. A pipeline that updates images
        reads a Deployment and patches it: `get` and `patch` on `deployments` in the group `apps`. A log collector needs `get` on `pods/log`, not on `pods/exec`.

        The steps, in order:
    - kind: order
      id: order-grant
      prompt: "Put the steps of a least-privilege grant in order."
      items:
        - "List the API calls the workload makes"
        - "Write the narrowest Role for those calls"
        - "Bind it to a dedicated ServiceAccount with a RoleBinding"
        - "Prove both sides: `yes` to what it needs, `no` to its neighbours"
      why: |
        The calls decide the rules, and the rules decide what is bound. The proof comes last, and needs both halves: positive checks for required calls and negative checks for unwanted direct API calls. Also review indirect access through workload changes; a negative Secret check does not prevent mounting Secrets in a patched pod template.
    - kind: try
      id: try-ci-sa
      body: "A pipeline will update Deployments in your project `academy-lesson-f-rbac`. Give it its own identity: create the ServiceAccount `ci-deployer`."
      accept:
        - "oc create serviceaccount ci-deployer"
        - "oc create serviceaccount ci-deployer -n academy-lesson-f-rbac"
        - "oc create sa ci-deployer"
        - "oc create sa ci-deployer -n academy-lesson-f-rbac"
        - "oc create serviceaccount ci-deployer --namespace=academy-lesson-f-rbac"
        - "oc create serviceaccount ci-deployer --namespace academy-lesson-f-rbac"
        - "oc create serviceaccount ci-deployer -n=academy-lesson-f-rbac"
        - "oc create sa ci-deployer --namespace=academy-lesson-f-rbac"
        - "oc create sa ci-deployer --namespace academy-lesson-f-rbac"
        - "oc create sa ci-deployer -n=academy-lesson-f-rbac"
      hints:
        - match: "^oc create ci-deployer"
          say: "`oc create` needs the kind of object first: `serviceaccount`, then the name."
        - match: "^oc create (serviceaccount|sa)$"
          say: "Add the name of the ServiceAccount: `ci-deployer`."
        - match: "^oc get"
          say: "`get` reads objects that exist. To make one, use `create`."
      hint: "`oc create serviceaccount`, then the name."
      run: "oc create serviceaccount ci-deployer"
      then: |
        A dedicated identity, with baseline group rights but no Deployment grant yet. Next, define its API rules.
