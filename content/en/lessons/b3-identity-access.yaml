          say: "That asks about you. Add `--as=someone` for the user and `--as-group=academy-auditors` for the group."
        - match: "--as(=| )academy-auditors"
          say: "`--as` takes a user name. The group goes in `--as-group`; the user can be any name, such as `someone`."
