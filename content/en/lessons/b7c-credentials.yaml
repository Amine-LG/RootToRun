# Enterprise identity: credentials in kubeconfig files (generated from one command list; edit with care)
- id: p.kubeconfig-credentials
  title: Credentials in kubeconfig files
  subtitle: ServiceAccount tokens and client certificates for tools, jobs and auditors
  module: p5-identity
  mode: REAL_LAB
  minutes: 35
  level: 3
  supports: Kubernetes 1.34 kubeconfig files, TokenRequest (`oc create token`) and the certificates.k8s.io/v1 CertificateSigningRequest API with
    the `kubernetes.io/kube-apiserver-client` signer, as served by OpenShift 4.21. Every command was run on OpenShift Local 4.21 by the ordinary
    user developer in a temporary project and, for submitting and approving the certificate request, by the cluster administrator (experiment
    X-AUTH-04). The issued client certificate was valid for ten minutes and held no permission after the lesson.
  concepts:
  - sec.serviceaccounts
  - sec.rbac
  - sec.certs
  - ocp.auth
  prerequisites:
  - o2.service-accounts
  - f.rbac
  record_on: cluster-admin
  objective: |
    Build a kubeconfig file from its cluster, user and context entries; authenticate a job with a time-limited
    ServiceAccount token and revoke it; issue a short-lived client certificate through a CertificateSigningRequest,
    grant access through the group in it, and explain why such certificates cannot be revoked early.
  flow:
  - kind: ask
    id: recall-token
    recalls: o2.service-accounts
    prompt: A script outside the cluster needs to act as a ServiceAccount for one hour. How does it get a credential on OpenShift 4.16 or later?
    choices:
    - text: Request one with `oc create token <account> --duration=1h`
      why: A TokenRequest returns a signed, time-limited token for the account; nothing is stored in a Secret.
    - text: Read the token Secret that OpenShift creates for every ServiceAccount
      why: Automatic long-lived token Secrets stopped in 4.16; relying on them breaks on new clusters.
    - text: Copy the token from `oc whoami -t`
      why: 'That prints your own token, not the account''s: the script would act as you.'
    answer: 0
  - kind: teach
    id: situation
    title: A file that is a login
    body: |
      A CI job, a monitoring tool and an auditor each need to reach the API without typing a password. What
      they are given is a **kubeconfig** file: the same file `oc login` writes for you, holding where the cluster
      is, how to trust it, and a credential. Whoever holds the file *is* that identity until the credential ends.

      This lesson builds two such files by hand, for real: one with a ServiceAccount token, one with a client
      certificate signed through the Kubernetes certificates API. Each prompt names who ran the command: the
      ordinary user `developer`, in a temporary project, or the cluster administrator for the steps that need it
      (submitting and approving the certificate request, reading Users): `kubeadmin`, OpenShift Local's
      cluster administrator, who may do both. developer may do neither.
  - kind: teach
    id: three-parts
    title: Clusters, users and contexts
    body: |
      A kubeconfig has three lists. **clusters** say where an API server is and which certificate authority (CA)
      proves its identity. **users** hold credentials: a token, or a client certificate and its key. **contexts** join
      one cluster, one user and a default namespace under a name; `current-context` picks one. `oc config
      set-cluster`, `set-credentials` and `set-context` each write one entry; `--kubeconfig=<file>` keeps your own
      login untouched.
  - kind: show
    id: make-sa
    body: 'developer creates the account the CI job will use, and lets it edit this project only:'
    run: oc create serviceaccount ci-deploy && oc create rolebinding ci-deploy-edit --clusterrole=edit --serviceaccount="$(oc project -q):ci-deploy"
    notice: 'A RoleBinding in this project: the account can change things here and nowhere else. (OpenShift projects usually already have `default`,
      plus `builder` and `deployer` when the Build and DeploymentConfig capabilities are enabled, as here; a job gets its own.)'
  - kind: teach
    id: trust
    title: Trust the server as well as reach it
    body: |
      A file that skips certificate checks (`insecure-skip-tls-verify: true`) sends its token to whatever answers
      at that address. The CA belongs in the file. Every namespace receives a ConfigMap, `kube-root-ca.crt`,
      with the CA bundle for the cluster's API certificates. Its guarantee is for the internal endpoints; it also
      verified this cluster's external address in the recording below, but a cluster whose external API certificate
      comes from a company CA needs that CA instead. Check it with the address you put in the file.
  - kind: ask
    id: why-ca
    prompt: 'A colleague''s script sets `insecure-skip-tls-verify: true` because "the address is internal anyway". What does it risk?'
    choices:
    - text: Sending its token to anything that answers at that address
      why: Without the CA, nothing proves the server is the API; a spoofed DNS entry or proxy receives a working credential.
    - text: Nothing, as long as the address is internal
      why: Internal names can be redirected too; the check is what proves the server's identity.
    - text: Only slower connections
      why: Verification costs little; the risk is where the token goes.
    answer: 0
  - kind: show
    id: get-ca
    run: oc get configmap kube-root-ca.crt -o jsonpath='{.data.ca\.crt}' > api-ca.crt && grep -c 'BEGIN CERTIFICATE' api-ca.crt
    notice: Six CA certificates in one bundle. The next steps use it to verify `api.crc.testing:6443`, the address in the file.
  - kind: show
    id: cluster-entry
    run: oc config set-cluster training --server="$(oc whoami --show-server)" --certificate-authority=api-ca.crt --embed-certs --kubeconfig=ci-deploy.kubeconfig
    notice: '`--embed-certs` copies the CA into the file, so the file works on another machine without `api-ca.crt`.'
  - kind: show
    id: user-entry
    body: 'The credential: a token requested for the account, put straight into the file:'
    run: oc config set-credentials ci-deploy --token="$(oc create token ci-deploy --duration=1h)" --kubeconfig=ci-deploy.kubeconfig
    notice: The token went from the API into the file without being printed in the terminal or the shell history.
  - kind: try
    id: try-context
    body: Write the context entry `ci` that joins cluster `training`, user `ci-deploy` and namespace `payments` in the file `ci.kubeconfig`.
    accept:
    - oc config set-context ci --cluster=training --user=ci-deploy --namespace=payments --kubeconfig=ci.kubeconfig
    - oc config set-context ci --cluster training --user ci-deploy --namespace payments --kubeconfig ci.kubeconfig
    - oc config set-context ci --kubeconfig=ci.kubeconfig --cluster=training --user=ci-deploy --namespace=payments
    - oc config set-context ci --user=ci-deploy --cluster=training --namespace=payments --kubeconfig=ci.kubeconfig
    - oc config set-context ci --cluster=training --user=ci-deploy --namespace=payments --kubeconfig ci.kubeconfig
    - kubectl config set-context ci --cluster=training --user=ci-deploy --namespace=payments --kubeconfig=ci.kubeconfig
    hints:
    - match: set-credentials|set-cluster
      say: 'Those write the user and cluster entries. A context joins existing entries: `set-context`.'
    - match: ^(?!.*--kubeconfig).*$
      say: Without `--kubeconfig=ci.kubeconfig` the context goes into your own login file.
    - match: -n payments|--namespace=default
      say: The context's default namespace is set with `--namespace=payments`.
    hint: '`oc config set-context ci` with `--cluster`, `--user`, `--namespace` and `--kubeconfig`.'
    then: A context only names a combination; `oc config use-context ci --kubeconfig=ci.kubeconfig` makes it the current one.
  - kind: show
    id: context-entry
    run: oc config set-context ci-deploy --cluster=training --user=ci-deploy --namespace="$(oc project -q)" --kubeconfig=ci-deploy.kubeconfig
      && oc config use-context ci-deploy --kubeconfig=ci-deploy.kubeconfig
    notice: Context `ci-deploy` created and made current in the file.
  - kind: show
    id: view-file
    run: oc config view --kubeconfig=ci-deploy.kubeconfig
    notice: The three lists, and `current-context`. `oc config view` hides the CA (`DATA+OMITTED`) and the token (`REDACTED`); `--raw` would print
      them, so never paste raw output into a ticket.
    highlight:
    - REDACTED
    - current-context
  - kind: ask
    id: guess-who
    guess: true
    prompt: '`oc --kubeconfig=ci-deploy.kubeconfig whoami`: which name comes back?'
    choices:
    - text: '`system:serviceaccount:<project>:ci-deploy`'
      why: A ServiceAccount's user name has this form; RBAC subjects and audit logs use it.
    - text: '`ci-deploy`'
      why: That is only the entry's name inside the file; the API knows the account by its full name.
    - text: '`developer`, who created the file'
      why: The file carries the account's token; whoever made the file does not matter.
    answer: 0
  - kind: show
    id: use-file
    run: oc --kubeconfig=ci-deploy.kubeconfig whoami
  - kind: show
    id: can-here
    run: oc --kubeconfig=ci-deploy.kubeconfig auth can-i create deployments
    notice: '`yes`: the edit binding in this project.'
  - kind: show
    id: cannot-there
    run: oc --kubeconfig=ci-deploy.kubeconfig auth can-i list pods -n default
    notice: '`no`, with a non-zero exit status, so a script can test it.'
  - kind: ask
    id: second-project
    prompt: The job must also deploy to the project `staging`. What gives it that, with the same file?
    choices:
    - text: A RoleBinding in staging for the ServiceAccount
      why: The account's identity is the same everywhere; each project decides what it may do there.
    - text: A second token for staging
      why: A token proves who the account is; it carries no permission.
    - text: Changing the context's namespace to staging
      why: The context only picks a default namespace; without a binding the requests are refused there.
    answer: 0
  - kind: teach
    id: lifetime
    title: A token says when it ends
    body: |
      `oc create token` asks the API for a **TokenRequest**: a token signed by the cluster, bound to this
      account, for about the duration you ask for: the server may return a shorter or longer lifetime (the
      minimum is ten minutes), so read `status.expirationTimestamp` rather than assume. Here only the expiry is
      printed:
  - kind: show
    id: expiry
    run: oc create token ci-deploy --duration=10m -o jsonpath='{.status.expirationTimestamp}{"\n"}'
    notice: Ten minutes from the request. A pipeline asks for a fresh token per run instead of storing one.
  - kind: ask
    id: guess-revoke
    guess: true
    prompt: The CI system is retired. developer deletes the ServiceAccount `ci-deploy`. What happens to `ci-deploy.kubeconfig`, whose token has
      most of its hour left?
    choices:
    - text: It stops working soon after
      why: A requested token names the account's UID; the API server rejects it once that account is gone. The next step measures how fast.
    - text: It keeps working until the token's hour is over
      why: That is true of a certificate, later in this lesson, not of a bound token.
    - text: 'It keeps working: a token is checked only by its signature'
      why: The signature is checked, and so is the existence of the account it is bound to.
    answer: 0
  - kind: show
    id: revoke
    run: oc delete serviceaccount ci-deploy && start=$(date +%s); while oc --kubeconfig=ci-deploy.kubeconfig whoami >/dev/null 2>&1; do [ $((
      $(date +%s) - start )) -gt 120 ] && { echo 'still accepted after 2 minutes'; exit 1; }; sleep 2; done; echo "refused after $(( $(date +%s)
      - start )) s:"; oc --kubeconfig=ci-deploy.kubeconfig whoami || true
    notice: Refused 8 seconds after the deletion (the API server briefly caches token checks). Deleting the account is how you revoke the tokens
      bound to it.
  - kind: teach
    id: certs
    title: A certificate as a credential
    body: |
      Some tools, and break-glass access, use a **client certificate** instead of a token. The API server
      accepts a certificate signed by a CA it trusts for clients, and reads the identity from the certificate
      itself: the Common Name (CN) is the user name, each Organization (O) is a group.

      Nobody hands out the cluster's CA key. You create your own key and a certificate signing request (CSR), an
      administrator submits it to the Kubernetes certificates API with the signer
      `kubernetes.io/kube-apiserver-client`, approves it, and the cluster's signer issues the certificate.
  - kind: show
    id: make-key
    body: 'The auditor, here developer, makes a key and a request for user `academy-ann` in group `academy-auditors`:'
    run: openssl req -new -newkey rsa:3072 -nodes -keyout ann.key -subj '/O=academy-auditors/CN=academy-ann' -out ann.csr 2>/dev/null && openssl
      req -in ann.csr -noout -subject
    notice: The request carries the public key and the names; the private key `ann.key` stays here.
  - kind: ask
    id: which-groups
    prompt: Which part of this request will the API server read as the user's groups?
    evidence: subject=O = academy-auditors, CN = academy-ann
    choices:
    - text: O, the Organization
      why: Each O value becomes a group; CN becomes the user name.
    - text: CN, the Common Name
      why: CN is the user name.
    - text: 'Neither: groups come from Group objects'
      why: Group objects serve OAuth users. A certificate carries its own groups.
    answer: 0
  - kind: show
    id: submit
    body: 'The administrator submits it. `expirationSeconds: 600` asks for the shortest allowed validity, ten minutes:'
    run: "cat <<EOF | oc create -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\nmetadata:\n  name: academy-ann\nspec:\n\
      \  request: $(base64 -w0 ann.csr)\n  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 600\n  usages:\n  - client auth\n\
      EOF"
  - kind: show
    id: pending
    run: oc get csr academy-ann
    notice: '`Pending`: nothing is issued until someone approves it. The requested duration is shown.'
  - kind: ask
    id: approve-check
    prompt: Before approving, what must the administrator check in the request?
    choices:
    - text: 'The subject: user name and groups, which become the identity'
      why: Approving issues exactly the names in the request. Kubernetes already refuses O=system:masters for this signer, but a request naming
        a group your cluster binds to cluster-admin, such as O=platform-admins, would be approved as written.
    - text: Only that the requester is a colleague
      why: The request names its own identity; who submitted it does not limit what it asks for.
    - text: 'Nothing: the signer refuses dangerous names by itself'
      why: Only system:masters is refused automatically; any other group, including ones bound to powerful roles, is issued once approved.
    answer: 0
  - kind: show
    id: approve
    run: oc adm certificate approve academy-ann && for i in $(seq 30); do test -n "$(oc get csr academy-ann -o jsonpath='{.status.certificate}')"
      && break; sleep 2; done; oc get csr academy-ann
    notice: '`Approved,Issued`.'
    understand:
      purpose: 'Approves the certificate signing request `academy-ann`, checks up to 30 times, two seconds apart, whether
        the certificate has been issued, then shows the request. Running out of tries is not reported as an error: the
        last line shows the state.'
      parts:
        - text: oc adm certificate approve academy-ann
          means: Marks the CertificateSigningRequest as approved. Its signer can then issue the certificate, subject
            to the signer's own checks and policy.
        - text: for i in $(seq 30); do
          means: Tries up to 30 times.
        - text: test -n "$(
          means: '`test -n` is true when the text is not empty: the loop ends (`break`) as soon as `.status.certificate`
            holds a certificate.'
        - text: sleep 2
          means: Waits 2 seconds between tries.
      caution: The issued certificate can let the requester authenticate as the identity it names. Check who asked,
        and which user and groups the request names, before approving.
      concepts:
        - ocp.auth
        - sec.certs
      refs:
        - title: 'Kubernetes: Certificates and certificate signing requests'
          url: https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/
        - title: OpenShift 4.21 CLI reference (oc adm certificate approve)
          url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-adm-certificate-approve
  - kind: show
    id: cert
    run: oc get csr academy-ann -o jsonpath='{.status.certificate}' | base64 -d > ann.crt && openssl x509 -in ann.crt -noout -subject -issuer
      -startdate -enddate
    notice: The subject is the request's and the issuer is the cluster's client signer (`kube-csr-signer`). `notAfter` is ten minutes after issue;
      `notBefore` is five minutes before it, because the signer backdates certificates to tolerate clocks that are slightly behind.
    highlight:
    - subject
    - notAfter
  - kind: ask
    id: tomorrow
    prompt: The certificate ends ten minutes after issue. The auditor needs access again tomorrow. What is the clean way?
    choices:
    - text: A new request and approval tomorrow
      why: Short validity makes each grant of a credential a reviewed event; the key can even stay the same, the approval is what is repeated.
    - text: Approve the old CSR a second time
      why: An issued request is done; re-approving does not extend its certificate.
    - text: Edit the notAfter date in ann.crt
      why: The signature covers the dates; an edited certificate is rejected.
    answer: 0
  - kind: show
    id: ann-file
    body: 'developer builds the auditor''s kubeconfig, the same three entries with a certificate and key as the credential:'
    run: oc config set-cluster training --server="$(oc whoami --show-server)" --certificate-authority=api-ca.crt --embed-certs --kubeconfig=ann.kubeconfig
      && oc config set-credentials academy-ann --client-certificate=ann.crt --client-key=ann.key --embed-certs --kubeconfig=ann.kubeconfig &&
      oc config set-context ann --cluster=training --user=academy-ann --namespace="$(oc project -q)" --kubeconfig=ann.kubeconfig && oc config
      use-context ann --kubeconfig=ann.kubeconfig
  - kind: show
    id: ann-who
    run: oc --kubeconfig=ann.kubeconfig auth whoami
    notice: User `academy-ann` and group `academy-auditors`, read from the certificate's CN and O, not from any object in the cluster; `system:authenticated`
      is added to every authenticated identity. The `Extra` line, `authentication.kubernetes.io/credential-id`, is the
      SHA-256 fingerprint of this certificate, which the API server adds so that two credentials with the same names
      can be told apart.
    highlight:
    - academy-ann
    - academy-auditors
  - kind: show
    id: ann-no
    run: oc --kubeconfig=ann.kubeconfig get configmaps
    notice: 'Authenticated, but Forbidden: a certificate proves who you are, not what you may do.'
  - kind: try
    id: try-grant
    body: In your project, give the group `academy-auditors` read access with a RoleBinding named `auditors-view`.
    accept:
    - oc create rolebinding auditors-view --clusterrole=view --group=academy-auditors
    - oc create rolebinding auditors-view --clusterrole view --group academy-auditors
    - oc create rolebinding auditors-view --group=academy-auditors --clusterrole=view
    - kubectl create rolebinding auditors-view --clusterrole=view --group=academy-auditors
    hints:
    - match: --user
      say: 'Bind the group from the certificate''s O field, so every auditor''s certificate works: `--group=academy-auditors`.'
    - match: --role=view
      say: '`view` is a ClusterRole used inside one project: `--clusterrole=view`.'
    - match: clusterrolebinding
      say: A ClusterRoleBinding would grant read access to every project. A RoleBinding keeps it to yours.
    hint: '`oc create rolebinding auditors-view --clusterrole=view --group=academy-auditors`.'
    run: oc create rolebinding auditors-view --clusterrole=view --group=academy-auditors
    then: The binding names the group; anyone whose certificate says O=academy-auditors gets it.
  - kind: show
    id: ann-yes
    run: oc --kubeconfig=ann.kubeconfig get configmaps
    notice: 'The two ConfigMaps every project has: the group grant applies to the certificate''s group.'
  - kind: show
    id: no-user
    body: Is there a User for academy-ann, as there is after an OAuth login?
    run: oc get user academy-ann
    notice: '`NotFound`. Certificate users never go through the OAuth server: no User, no Identity, nothing to delete to lock them out.'
  - kind: show
    id: ungrant
    run: oc delete rolebinding auditors-view && oc --kubeconfig=ann.kubeconfig get configmaps || true
    notice: 'Removing the grant works immediately: Forbidden again.'
  - kind: ask
    id: guess-delete-csr
    guess: true
    prompt: The administrator now deletes the CSR object `academy-ann`. Does the auditor's certificate still authenticate?
    choices:
    - text: Yes, until its notAfter time
      why: The certificate is a signed file; the API server checks the signature and the dates, not whether a CSR still exists.
    - text: 'No: deleting the CSR revokes the certificate'
      why: Kubernetes has no revocation list for client certificates; the CSR is only the request's record.
    - text: Only if the user re-submits the request
      why: Nothing is re-checked against the request after issuance.
    answer: 0
  - kind: show
    id: del-csr
    run: oc delete csr academy-ann
  - kind: show
    id: still
    run: oc --kubeconfig=ann.kubeconfig whoami
    notice: 'Still `academy-ann`, with no CSR, no User and no binding left: only its expiry ends it. Here that is minutes; a certificate issued
      for a year would keep authenticating for a year.'
  - kind: order
    id: order-cert
    prompt: Put the steps of giving a person certificate access in order.
    items:
    - Create a private key and a CSR with CN=<user> and O=<group>
    - Submit a CertificateSigningRequest with signer kubernetes.io/kube-apiserver-client and a short expirationSeconds
    - Check the requested names, then approve
    - Extract the issued certificate from the CSR's status
    - Build a kubeconfig with the CA, the certificate and the key
    - Grant access to the group with a RoleBinding
    why: The names are fixed when the request is made and checked at approval; permissions come last and stay revocable, unlike the certificate.
  - kind: reflect
    id: explain-choice
    prompt: A team asks for a kubeconfig for its nightly deployment job. Explain which credential you would put in it and why, and how you would
      remove access later.
    model: |
      A ServiceAccount in the team's project, bound to a role limited to what the job needs, and a token
      requested per run with oc create token and a short duration (or the pod's own projected token if the job
      runs in the cluster). Removing access: delete the binding or the ServiceAccount; bound tokens are refused as soon
      as the deletion reaches the API server's checks (seconds in this recording), which I would verify. I would not issue a client certificate: it cannot be revoked before it expires, and it creates no User
      object to disable, so its only safe forms are short-lived or tied to group grants I can remove.
  - kind: teach
    id: what-next
    title: What you can do now
    body: |
      You can write a kubeconfig from its three parts, trust the API with the CA from `kube-root-ca.crt`, hand a
      job a time-limited ServiceAccount token and revoke it, and issue a short-lived client certificate whose
      names become a user and groups, knowing that only expiry and removed grants limit it.

      Corporate users do not get files like these: they log in through the directory, which
      [Corporate identity: LDAP and OIDC](/lesson/p.ldap-oidc) connects to the cluster.

      Next, [GitOps with Argo CD](/lesson/gx.argocd) hands cluster changes to a program that keeps the cluster
      matching Git, one of the jobs that needs exactly such a non-human identity.
  sections:
  - id: kubeconfig-reference
    title: Kubeconfig credential reference
    depth: true
    body: |
      | Task | Command |
      |---|---|
      | CA of the API, from any project | `oc get configmap kube-root-ca.crt -o jsonpath='{.data.ca\.crt}' > api-ca.crt` |
      | cluster entry | `oc config set-cluster <name> --server=<url> --certificate-authority=api-ca.crt --embed-certs --kubeconfig=<file>` |
      | token user | `oc config set-credentials <name> --token="$(oc create token <sa> --duration=1h)" --kubeconfig=<file>` |
      | certificate user | `oc config set-credentials <name> --client-certificate=<crt> --client-key=<key> --embed-certs --kubeconfig=<file>` |
      | context | `oc config set-context <name> --cluster=<c> --user=<u> --namespace=<ns> --kubeconfig=<file>` then `use-context` |
      | who am I, with groups | `oc --kubeconfig=ann.kubeconfig auth whoami` (any kubeconfig file) |
      | approve or deny a CSR | `oc adm certificate approve <csr>` / `oc adm certificate deny <csr>` |

      | Credential | Revoked by | Lifetime | Identity |
      |---|---|---|---|
      | requested ServiceAccount token | deleting the ServiceAccount (or the pod it is bound to) | about what was requested (read `status.expirationTimestamp`), minimum 10 minutes | `system:serviceaccount:<ns>:<name>` |
      | OAuth token from `oc login` | deleting the OAuthAccessToken or the User | the OAuth server's token lifetime | the User |
      | client certificate | nothing before it expires: remove its grants | the CSR's `expirationSeconds`, or the signer's maximum | CN = user, O = groups |
  - id: common-mistakes
    title: Common mistakes
    depth: true
    body: |
      - **`insecure-skip-tls-verify: true` in a shared file.** The token goes to whoever answers; embed the CA instead.
      - **Pasting `oc config view --raw` into a ticket.** It prints tokens and private keys; plain `oc config view` hides them.
      - **Long-lived certificates for people.** They outlive the person's employment; prefer short validity and group grants.
      - **Approving a CSR without reading its subject.** Kubernetes refuses `O=system:masters` for client certificates, but a
        group your cluster binds to cluster-admin is issued as written.
      - **Granting each person by user name.** It works, and a renewed certificate with the same CN keeps it, but
        every joiner and leaver becomes a binding change; grant the group in the certificate's O field instead.
  review:
  - q: What are the three lists in a kubeconfig, and what joins them?
    a: clusters (server and CA), users (credentials), contexts (one cluster + one user + a default namespace); current-context selects one.
  - q: Where can a project user get the CA bundle of the API server?
    a: The ConfigMap kube-root-ca.crt in every namespace, key ca.crt.
  - q: How do you revoke a requested ServiceAccount token?
    a: Delete the ServiceAccount (or the pod it is bound to); the API server rejects tokens bound to an object that no longer exists.
  - q: Which fields of a client certificate become the user name and the groups?
    a: The subject's Common Name (CN) is the user name; each Organization (O) is a group.
  - q: Does deleting an approved CSR revoke the certificate?
    a: No. Client certificates are valid until notAfter; remove their RBAC grants and keep their validity short.
  references:
  - title: 'Kubernetes: Organizing cluster access using kubeconfig files'
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  - title: kubectl config set-credentials reference
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_config/kubectl_config_set-credentials/
  - title: kubectl create token reference (TokenRequest)
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_token/
  - title: 'Kubernetes: Managing service accounts (bound tokens, kube-root-ca.crt)'
    url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
  - title: 'Kubernetes: Certificates and certificate signing requests (kube-apiserver-client signer, expirationSeconds)'
    url: https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/
  - title: 'Kubernetes: Authenticating (X.509 client certificates: CN is the user, O the groups)'
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
  - title: 'Kubernetes 1.34 source: the X.509 authenticator adds the credential-id fingerprint'
    url: https://github.com/kubernetes/kubernetes/blob/v1.34.0/staging/src/k8s.io/apiserver/pkg/authentication/request/x509/x509.go
  - title: 'OpenShift 4.21: Understanding and creating service accounts'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-and-creating-service-accounts
  labs: []
  limits: |
    OpenShift Local is a single disposable cluster; the certificate was issued for ten minutes with the minimum
    validity the API allows, for a user name that holds no permission once the lesson ends. The administrator
    steps (submitting and approving the CSR, reading Users) need cluster-admin.
  enterprise: |
    Platform teams give pipelines short-lived tokens from ServiceAccounts (or workload identity federation), keep
    client certificates for break-glass access with short validity and audited approval, and send people through
    the corporate identity provider.
  commands:
  - cmd: oc create serviceaccount ci-deploy && oc create rolebinding ci-deploy-edit --clusterrole=edit --serviceaccount="$(oc project -q):ci-deploy"
    as: developer
    meaning: a ServiceAccount with the edit role in this project
  - cmd: oc get configmap kube-root-ca.crt -o jsonpath='{.data.ca\.crt}' > api-ca.crt && grep -c 'BEGIN CERTIFICATE' api-ca.crt
    as: developer
    meaning: the CA bundle every project receives, saved to a file
  - cmd: oc config set-cluster training --server="$(oc whoami --show-server)" --certificate-authority=api-ca.crt --embed-certs --kubeconfig=ci-deploy.kubeconfig
    as: developer
    meaning: 'the cluster entry: API address and the CA that proves it'
  - cmd: oc config set-credentials ci-deploy --token="$(oc create token ci-deploy --duration=1h)" --kubeconfig=ci-deploy.kubeconfig
    as: developer
    meaning: 'the user entry: a one-hour token, never printed'
  - cmd: oc config set-context ci-deploy --cluster=training --user=ci-deploy --namespace="$(oc project -q)" --kubeconfig=ci-deploy.kubeconfig
      && oc config use-context ci-deploy --kubeconfig=ci-deploy.kubeconfig
    as: developer
    meaning: 'the context: this cluster, this user, this project; and select it'
  - cmd: oc config view --kubeconfig=ci-deploy.kubeconfig
    as: developer
    meaning: the file, with its secrets hidden
  - cmd: oc --kubeconfig=ci-deploy.kubeconfig whoami
    as: developer
    meaning: who the file authenticates as
  - cmd: oc --kubeconfig=ci-deploy.kubeconfig auth can-i create deployments
    as: developer
    meaning: allowed by the edit binding
  - cmd: oc --kubeconfig=ci-deploy.kubeconfig auth can-i list pods -n default
    as: developer
    meaning: not allowed outside the project
    expect: fail
  - cmd: oc create token ci-deploy --duration=10m -o jsonpath='{.status.expirationTimestamp}{"\n"}'
    as: developer
    meaning: a token request answers with the token and its expiry; only the expiry is printed
  - cmd: oc delete serviceaccount ci-deploy && start=$(date +%s); while oc --kubeconfig=ci-deploy.kubeconfig whoami >/dev/null 2>&1; do [ $((
      $(date +%s) - start )) -gt 120 ] && { echo 'still accepted after 2 minutes'; exit 1; }; sleep 2; done; echo "refused after $(( $(date +%s)
      - start )) s:"; oc --kubeconfig=ci-deploy.kubeconfig whoami || true
    as: developer
    meaning: delete the account; its tokens stop working
    timeout: 180
  - cmd: openssl req -new -newkey rsa:3072 -nodes -keyout ann.key -subj '/O=academy-auditors/CN=academy-ann' -out ann.csr 2>/dev/null && openssl
      req -in ann.csr -noout -subject
    as: developer
    meaning: a private key and a signing request; the key never leaves this directory
  - cmd: "cat <<EOF | oc create -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\nmetadata:\n  name: academy-ann\nspec:\n\
      \  request: $(base64 -w0 ann.csr)\n  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 600\n  usages:\n  - client auth\n\
      EOF"
    as: admin
    meaning: the request, submitted to the API for a client certificate valid 10 minutes
  - cmd: oc get csr academy-ann
    as: admin
    meaning: waiting for a decision
  - cmd: oc adm certificate approve academy-ann && for i in $(seq 30); do test -n "$(oc get csr academy-ann -o jsonpath='{.status.certificate}')"
      && break; sleep 2; done; oc get csr academy-ann
    as: admin
    meaning: approved; the signer issues the certificate
  - cmd: oc get csr academy-ann -o jsonpath='{.status.certificate}' | base64 -d > ann.crt && openssl x509 -in ann.crt -noout -subject -issuer
      -startdate -enddate
    as: admin
    meaning: 'the issued certificate: who, signed by whom, valid when'
  - cmd: oc config set-cluster training --server="$(oc whoami --show-server)" --certificate-authority=api-ca.crt --embed-certs --kubeconfig=ann.kubeconfig
      && oc config set-credentials academy-ann --client-certificate=ann.crt --client-key=ann.key --embed-certs --kubeconfig=ann.kubeconfig &&
      oc config set-context ann --cluster=training --user=academy-ann --namespace="$(oc project -q)" --kubeconfig=ann.kubeconfig && oc config
      use-context ann --kubeconfig=ann.kubeconfig
    as: developer
    meaning: a kubeconfig with the certificate and key embedded
  - cmd: oc --kubeconfig=ann.kubeconfig auth whoami
    as: developer
    meaning: the user name and groups, read from the certificate
  - cmd: oc --kubeconfig=ann.kubeconfig get configmaps
    as: developer
    meaning: authenticated, but no permission yet
    expect: fail
  - cmd: oc create rolebinding auditors-view --clusterrole=view --group=academy-auditors
    as: developer
    meaning: read access for the group named in the certificate
  - cmd: oc --kubeconfig=ann.kubeconfig get configmaps
    as: developer
    meaning: the group grant applies
  - cmd: oc get user academy-ann
    as: admin
    meaning: 'no User object: certificates bypass the OAuth server'
    expect: fail
  - cmd: oc delete rolebinding auditors-view && oc --kubeconfig=ann.kubeconfig get configmaps || true
    as: developer
    meaning: 'the grant removed: refused again'
  - cmd: oc delete csr academy-ann
    as: admin
    meaning: the request object deleted
  - cmd: oc --kubeconfig=ann.kubeconfig whoami
    as: developer
    meaning: the certificate still authenticates until it expires
  experiment:
    id: X-AUTH-04
    objective: developer builds a kubeconfig with a requested ServiceAccount token and revokes it by deleting the account; the cluster administrator
      submits and approves a ten-minute client-certificate request for user academy-ann in group academy-auditors; developer uses it, grants and
      removes group access in the temporary project; the CSR is deleted.
    changes:
    - CertificateSigningRequest academy-ann (cluster-scoped; created, approved, deleted)
    - A client certificate for academy-ann (groups academy-auditors, system:authenticated) issued by the kube-apiserver-client signer, valid 10
      minutes; it cannot be revoked and holds no permission after the lesson
    - ServiceAccount ci-deploy and RoleBindings ci-deploy-edit and auditors-view in developer's temporary project (deleted with it)
    preflight:
    - cmd: oc get csr academy-ann
      expect: fail
    - cmd: oc get user academy-ann
      expect: fail
    - cmd: test -z "$(oc get rolebindings,clusterrolebindings -A -o jsonpath='{range .items[*]}{.subjects[*].name}{"\n"}{end}' | grep -w -e academy-auditors
        -e academy-ann)"
    snapshot:
    - oc get csr academy-ann -o name --ignore-not-found
    - oc get users -o name
    - oc get identities -o name
    - oc get clusterrolebindings -o name
    rollback:
    - oc delete csr academy-ann --ignore-not-found
    verify:
    - cmd: test -z "$(oc get csr academy-ann -o name --ignore-not-found)"
