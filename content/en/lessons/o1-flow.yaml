      hints:
        - match: "^oc get all"
          say: "`all` leaves out Secrets. Name the two kinds, separated by a comma: `deployment,secret`."
        - match: "-l template=shop"
          say: "`shop.yaml` sets no `template` label. Its objects carry `app.kubernetes.io/instance=shop`."
        - match: "instance:shop|-l shop"
          say: "A label selector is written `key=value`: `-l app.kubernetes.io/instance=shop`."
        - match: "^oc get (deployment|secret)s? -l"
          say: "That lists one kind. Give both, separated by a comma and no space."
      hint: "`oc get`, the two kinds separated by a comma, then `-l app.kubernetes.io/instance=shop`."
      run: "oc get deployment,secret -l app.kubernetes.io/instance=shop"
      then: |
        Both objects, found by the instance label. The label holds the instance name, so a second instance
        called `store` would carry a different value and not match. A selector is not an ownership record,
        though: it matches any object of the kinds you name that carries the label, whoever created it. `all`
        leaves out Secrets, so name the kinds.
    - kind: show
      id: scoped-delete
      body: "The same selector, with `oc delete` and the same two kinds, cleans up this instance:"
      run: "oc delete deployment,secret -l app.kubernetes.io/instance=shop"
      notice: "Both objects are gone. The command deleted the matching objects of those two kinds. The cluster does not remember which Template they came from, so check the selector with `oc get` first."
    - kind: teach
      id: stored
      title: "A template stored in the project"
      body: |
        A Template is itself an object. `oc create -f shop.yaml` stores it in the current project, where `oc get
        templates` lists it and anyone allowed to read templates there can use it by name, without the file.
        The shared `openshift` project works the same way for every user; putting a template there is a cluster
        administrator's job.
    - kind: show
      id: show-stored
      run: "oc create -f shop.yaml; oc get templates"
      notice: |
        `template.template.openshift.io/shop created`. `oc get templates` lists it with its description, its 3
        parameters, 1 of them blank (`APP_NAME`, which has neither a default nor a generator), and its 2 objects.
    - kind: try
      id: try-new-app-template
      body: "Deploy a second instance, called `store`, from the stored template `shop`, with `oc new-app`."
      accept: ["oc new-app --template=shop -p APP_NAME=store", "oc new-app --template=shop --param=APP_NAME=store", "oc new-app --template shop -p APP_NAME=store", "oc new-app --template shop --param APP_NAME=store", "oc new-app --template=shop --param APP_NAME=store", "oc new-app --template shop --param=APP_NAME=store"]
      hints:
        - match: "^oc process"
          say: "Processing and applying works too. The task is the one-step form: `oc new-app --template=shop`."
        - match: "-f shop\\.yaml|--file"
          say: "That uses the file again. The template is now stored in the project: name it with `--template=shop`."
        - match: "APP_NAME=shop"
          say: "`shop` is the template's name. The instance is called `store`: `-p APP_NAME=store`."
        - match: "^oc new-app (--template[= ])?shop$"
          say: "`APP_NAME` is required. Give it with `-p APP_NAME=store`."
      hint: "`oc new-app`, `--template=shop`, then `-p APP_NAME=store`."
      run: "oc new-app --template=shop -p APP_NAME=store"
      then: |
        One command: the stored template was processed and its two objects created, for the instance `store`.
        `oc new-app` lists every parameter with the value it used, and marks the password `# generated`: the output
        of `oc new-app` can hold generated credentials, so treat it like the Secret itself. (The recording shows the
        generated password as a `<generated-N>` placeholder; your output shows the real value.)
    - kind: show
      id: show-store
      body: "The new instance's objects, found by their instance label, then removed the same way:"
      run: "oc get deployment,secret -l app.kubernetes.io/instance=store; oc delete deployment,secret -l app.kubernetes.io/instance=store"
      notice: |
        The instance label found the Deployment and the Secret of `store`, and nothing of the earlier `shop`; the
        same selector then removed them. The command named only Deployments and Secrets, so the Template stays in
        the project for the next instance.
    - kind: ask
      id: forbidden-route
      prompt: "A template creates a Deployment and a Route. For you, the Route fails with Forbidden. Why?"
      choices:
        - text: "You may not create Routes here"
          why: "The objects are created with your permissions, one request each. The others succeeded; the Route needs a right you lack."
        - text: "The template is broken"
          why: "A colleague with the right role would create the same Route without error. The template is fine; the permission is missing."
        - text: "Templates may not create Routes"
          why: "A template can hold any kind. Each object is created as you, so it depends on your rights."
      answer: 0
    - kind: teach
      id: when
      title: "Where templates are still the right tool"
      body: |
        Helm charts and Kustomize, taught later, are the portable ways to package applications. Templates remain
        in three places:

        - the **project request template**, which decides what a project contains when it is requested through
          the CLI or the console (only a template does this: a platform team adds a default quota or
          NetworkPolicy there). A namespace created directly by an administrator bypasses it;
        - samples in the shared `openshift` project, shown in the console's catalog with a form for the
          parameters;
        - existing estates, where processing once and keeping the output in Git turns them into ordinary YAML.

        The operator that maintains the sample templates is deprecated since 4.16: it still updates the
        builder images and their templates, and no new samples are added.
    - kind: show
      id: show-openshift
      body: "Templates in the `openshift` project are readable by every user:"
      run: "oc get templates -n openshift -o name | wc -l; oc get templates -n openshift -o name | head -n 4"
      notice: |
        50 templates on this cluster. The first four show how they are named: what they deploy, often with the
        database it uses (`cakephp-mysql`), then `-persistent` when the database keeps its data on a volume, or
        `-example` when it does not. `oc new-app --template=<name>` instantiates one in your project.
    - kind: ask
      id: every-project
      prompt: "Projects requested through the CLI or console must start with a default NetworkPolicy. Which mechanism fits?"
      choices:
        - text: "The project request template"
          why: "Requested projects are created from it, so an object added there exists in each of them, with no action from developers."
        - text: "A template in `openshift`"
          why: "Developers would have to remember to instantiate it in each project, and could skip it."
        - text: "A Helm chart for each project"
          why: "Someone would still have to install it in every new project. Only the project request template acts automatically on requests."
      answer: 0
    - kind: reflect
      id: explain-reprocess
      prompt: "A colleague re-processes a template with a generated database password and applies the result. Explain what can break."
      model: |
        Each processing generates a new password, so the Secret now holds a different value. In an application
        where the database was initialised with the old password and keeps it, the clients, reading the new
        Secret, can no longer log in. Re-processing must pass the original value with `-p`, or the Secret must be managed
        separately.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can read a template's parameters, predict what processing produces, create its objects knowing they
        are created with your permissions, deploy from a template stored in the project with `oc new-app
        --template`, find the objects by the template's label, avoid regenerated values, and say where templates
        still fit.

        Next: the life of a pod, from Pending to Running and on to its end. The
        [templates lab](/lab/lab.templates) practises this on a template of its own.
  sections:
    - id: more-templates
      title: "More about templates"
      depth: true
      body: |
        | Field | Holds |
        |---|---|
        | `objects` | the objects to create, with `${NAME}` references anywhere in them |
        | `parameters` | name, description, default `value`, `required`, or a generator |
        | `labels` | labels added to every object created |
        | `message` | text shown after instantiation, often with generated credentials |
        | `metadata.annotations` | catalog information: display name, description, tags, icon |

        **Generators** understand a small pattern language, not full regular expressions: character ranges with
        a count, plus `\w`, `\d`, `\a` (letters) and `\A` (symbols). In YAML, quote such patterns.

        **Namespaces.** A fixed `metadata.namespace` is removed at instantiation, so the objects land in the
        target project. A namespace containing a parameter is kept after substitution: that is how the project
        request template places its RoleBinding in the new project.

        **Server or client.** `oc process` sends the template to the API server for processing; with `--local`
        the client processes it, and the client's version then decides which features work.

        **When instantiation fails.** A required parameter without value stops processing. An unknown
        parameter stops it too (shared parameter files can be told to ignore them). AlreadyExists on a second
        instantiation means the names come from the same parameter values. A partial result is removed with
        `oc delete`, naming the kinds and the instance label.

        **Templates do not track.** Once processed, the objects live their own lives: changing a template's
        default later changes nothing that exists. Old sample templates may still create DeploymentConfigs,
        deprecated since 4.14.

        **The default project request template** can be printed by a cluster administrator with
        `oc adm create-bootstrap-project-template -o yaml`: a Project and a RoleBinding that makes the
        requester `admin`, with parameters filled in by OpenShift.
  review:
    - q: "What are the two steps of using a template, and whose permissions apply?"
      a: "Processing (parameters filled in, plain objects returned, nothing created), then creating the objects, with your own permissions."
    - q: "What is the difference between `${REPLICAS}` and `${{REPLICAS}}`?"
      a: "Single braces insert text; double braces insert the value as YAML, so `2` becomes a number."
    - q: "Why can processing a template twice break an application?"
      a: "Generated values are generated again: a new password replaces the one a database was initialised with. Pass the existing value with -p."
    - q: "How do you deploy from a template stored in your project, without its file?"
      a: "`oc new-app --template=<name> -p NAME=value` (or `oc process <name> -p … | oc apply -f -`). `oc get templates` lists the stored ones; those in `openshift` are shared with every user."
    - q: "What decides what a requested project contains?"
      a: "The project request template: OpenShift's built-in default, or one a cluster administrator configured. A namespace created directly by an administrator bypasses it."
  limits: "In the recorded outputs, each generated password is replaced with a placeholder, `<generated-N>`, a different number for each different value; on your cluster you see twelve random letters and digits. The project request template was not changed here: that is a cluster administrator's task."
  commands:
    - cmd: "sed -n '/^parameters:/,/^objects:/p' shop.yaml"
      meaning: "a template's parameters: required, default, generated"
    - cmd: "oc process --parameters -f shop.yaml"
      meaning: "list a template's parameters"
    - cmd: "oc process -f shop.yaml"
      meaning: "a required parameter is missing"
      expect: fail
    - cmd: "grep -n '\\${' shop.yaml"
      meaning: "the blanks in the objects: text and typed substitution"
    - cmd: "oc process -f shop.yaml -p APP_NAME=shop -o yaml"
      meaning: "the processed objects, nothing created"
    - cmd: "for i in 1 2; do oc process -f shop.yaml -p APP_NAME=shop -o jsonpath='{.items[0].stringData.password}{\"\\n\"}'; done"
      meaning: "a generated value is new at every processing"
    - cmd: "oc process -f shop.yaml -p APP_NAME=shop -p DB_PASSWORD=keep-this-one | oc apply -f -"
      meaning: "process, then create, with your permissions"
    - cmd: "oc get deployment,secret -l app.kubernetes.io/instance=shop"
      meaning: "what the template created, by its instance label"
    - cmd: "oc delete deployment,secret -l app.kubernetes.io/instance=shop"
      meaning: "remove one instance: the matching objects of the named kinds"
    - cmd: "oc create -f shop.yaml; oc get templates"
      meaning: "the template stored in the project"
    - cmd: "oc new-app --template=shop -p APP_NAME=store"
      meaning: "an instance from the stored template, in one step"
    - cmd: "oc get deployment,secret -l app.kubernetes.io/instance=store; oc delete deployment,secret -l app.kubernetes.io/instance=store"
      meaning: "the second instance's objects, by their label, then removed"
    - cmd: "oc get templates -n openshift -o name | wc -l; oc get templates -n openshift -o name | head -n 4"
      meaning: "the shared templates in the openshift project"
  references:
    - {title: "OpenShift 4.21: Creating applications (Using templates)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/creating-applications"}
    - {title: "OpenShift 4.21: Building applications (writing templates, parameters, labels)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/building_applications/index"}
    - {title: "OpenShift 4.21: Configuring the Cluster Samples Operator", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/configuring-samples-operator"}
    - {title: "OpenShift 4.21: Configuring the project request template", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/projects"}
- id: b.pod-lifecycle
  title: "Life of a pod"
  subtitle: "From scheduled to Ready, and from SIGTERM to gone"
  module: a2-apps
  mode: REAL_LAB
  minutes: 22
  level: 2
  supports: "Kubernetes 1.34 / OpenShift 4.21 with oc 4.21: pod phases, container states, pod conditions, init containers, graceful termination. Recorded on OpenShift Local as an ordinary user, in a temporary project; the console screenshots were taken as kubeadmin, in a separate demo project."
  concepts: [k8s.pod-lifecycle]
  prerequisites: [o1.deploy-apps, f0.linux-essentials]
  labs: [lab.container-anatomy]
  record_on: cluster
  files:
    starter.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: starter
      spec:
        initContainers:
        - name: prepare
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "15"]
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
  objective: |
    Follow a pod from creation to Ready through its phase, its containers' states and its conditions, read each
    with `oc`, and explain what happens when a pod is deleted: SIGTERM, the grace period, then SIGKILL.
  flow:
    - kind: ask
      id: recall-sigterm
      recalls: f0.linux-essentials
      prompt: "A look back. A program receives SIGTERM. What happens?"
      choices:
        - text: "It is asked to stop, and may refuse"
          why: "SIGTERM is a request: the program can clean up and exit, or ignore it. Only SIGKILL cannot be caught or ignored."
        - text: "The kernel ends it at once, without warning"
          why: "That is SIGKILL, which no program can catch. SIGTERM can be handled or ignored."
        - text: "It is paused until it receives SIGCONT"
          why: "That is SIGSTOP. SIGTERM asks the program to end."
      answer: 0
    - kind: teach
      id: three-views
      title: "Three views of a starting pod"
      body: |
        A pod goes through several steps before it does any work. The scheduler chooses a node. The kubelet on
        that node prepares the pod's sandbox, the isolated environment its containers share, with its network,
        runs any **init containers**, one after another and each to completion, then starts the application's
        containers.

        `oc` reports this progress in three ways, at three levels of detail:

        - the pod's **phase**, one coarse word: `Pending` until its containers run (scheduling, init containers
          and image pulls all count as Pending), then `Running`, and `Succeeded` or `Failed` once every container
          has ended for good;
        - each container's **state**: `waiting` (with a reason, such as `PodInitializing` or `ImagePullBackOff`),
          `running`, or `terminated` (with a reason and an exit code);
        - the pod's **conditions**, each true or false: `PodScheduled`, `PodReadyToStartContainers` (its sandbox
          and network are ready), `Initialized`, `ContainersReady` and `Ready`. `Ready` is the one Services use:
          only a Ready pod receives traffic.

        The file `starter.yaml` describes a pod whose init container, `prepare`, works for 15 seconds before the
        container `app` may start.
    - kind: ask
      id: guess-starting
      guess: true
      prompt: "Five seconds after `starter` is created, what is its phase?"
      choices:
        - text: "`Pending`"
          why: "See the next step."
        - text: "`Running`, because a container runs"
          why: "The init container runs, but the phase stays Pending until the application's containers start. See the next step."
        - text: "`Initializing`"
          why: "There is no such phase. See the next step."
      answer: 0
    - kind: show
      id: show-starting
      body: "The STATUS column first, then the three views, printed with a jsonpath template (`range … end` repeats its contents for each condition):"
      run: "oc apply -f starter.yaml && sleep 5 && oc get pod starter && oc get pod starter -o jsonpath='phase: {.status.phase}{\"\\n\"}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}prepare: {.status.initContainerStatuses[0].state}{\"\\n\"}app: {.status.containerStatuses[0].state}{\"\\n\"}'"
      notice: |
        STATUS `Init:0/1`: no init container has finished yet. The phase is `Pending`, although a container runs:
        `prepare` is `running`, while `app` is `waiting`, with the reason `PodInitializing`. The conditions agree:
        the pod is scheduled (`PodScheduled`), its sandbox and network are ready (`PodReadyToStartContainers`), but
        it is not `Initialized`, and so neither `ContainersReady` nor `Ready`.
    - kind: show
      id: show-started
      body: "The same views once the pod is Ready:"
      run: "oc wait --for=condition=Ready pod/starter --timeout=120s && oc get pod starter && oc get pod starter -o jsonpath='phase: {.status.phase}{\"\\n\"}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}prepare: {.status.initContainerStatuses[0].state}{\"\\n\"}app: {.status.containerStatuses[0].state}{\"\\n\"}'"
      notice: |
        About 20 seconds after creation: `Running` and `1/1`. `prepare` is `terminated`, reason `Completed`, exit
        code `0`, 15 seconds after it started; `app` is `running`, and every condition is `True`. `oc wait
        --for=condition=Ready` waited for exactly the condition that Services use.
      understand:
        purpose: Waits until the pod is Ready, then prints its usual line and, with a JSONPath template, its phase, its
          conditions and the state of each of its two containers.
        parts:
          - text: '&&'
            means: 'Each command runs only if the one before it succeeded: if the wait times out, nothing else is printed.'
          - text: '{"\n"}'
            means: 'A line break. A JSONPath template prints nothing between fields unless you write it; plain text such
              as `phase: ` is printed as written.'
          - text: '[*]'
            means: Every element of the list, here each condition, which `range … end` then prints one by one.
          - text: initContainerStatuses[0]
            means: 'The first element of the list: this pod has one init container and one application container.'
        concepts:
          - k8s.pod-lifecycle
          - linux.shell
        refs:
          - title: 'kubectl: JSONPath support'
            url: https://kubernetes.io/docs/reference/kubectl/jsonpath/
          - title: kubectl wait
            url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_wait/
    - kind: try
      id: try-phase
      body: "Print only the phase of the pod `starter`."
      accept: ["oc get pod starter -o jsonpath='{.status.phase}'", "oc get pod starter -o jsonpath=\"{.status.phase}\"", "oc get pod/starter -o jsonpath='{.status.phase}'", "oc get pods starter -o jsonpath='{.status.phase}'"]
      hints:
        - match: "\\{\\.phase\\}|\\.spec\\.phase"
          say: "The phase is something the cluster observes, so it is under `.status`: `{.status.phase}`."
        - match: "^oc get pods?$|^oc get pods? starter$"
          say: "That prints the STATUS column, a summary. Ask for the field itself with `-o jsonpath='{.status.phase}'`."
        - match: "^oc describe"
          say: "`describe` shows it among many lines. The task is the field alone: `oc get pod starter -o jsonpath=…`."
      hint: "`oc get pod starter`, then `-o jsonpath=` and the path `{.status.phase}`, in quotes."
      run: "oc get pod starter -o jsonpath='{.status.phase}'"
      then: |
        `Running`, and nothing else, not even a line break. Scripts that wait for a pod usually wait for the `Ready`
        condition instead, with `oc wait --for=condition=Ready` as above: a Running pod is not necessarily ready.
    - kind: show
      id: console-crash
      body: |
        In the web console, a demo Deployment `crash` whose container prints two lines and exits with an error,
        again and again. These screenshots were taken as the cluster administrator (`kubeadmin`), in a demo project,
        `console-demo`, which is not part of this lesson's commands: the lesson gives no manifest for `crash`. A
        developer sees the same pod pages for the pods of their own project.
      image:
        src: pod-crash.png
        alt: "The details of the pod crash with the status CrashLoopBackOff next to its name and as its Status, restart policy Always restart, and its labels, pod IP and node."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "The pod's status: CrashLoopBackOff"
    - kind: show
      id: console-crash-logs
      image:
        src: pod-crash-logs.png
        alt: "The Logs tab of the pod crash for the container app: two lines, starting and cannot read /config/app.conf, under a banner reading 2 lines, Log stream ended."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "Its Logs tab: the last run's output"
      notice: "*Log stream ended*: the container exited, so there is nothing more to follow. The status, *CrashLoopBackOff* on the previous page, says the kubelet is waiting before the next start. The phase is not shown on these pages; with restart policy *Always*, it normally stays *Running* while the kubelet keeps restarting the container (the next question is about that)."
    - kind: ask
      id: phase-vs-status
      prompt: "A pod's STATUS column says `CrashLoopBackOff`. What is its phase, most likely?"
      choices:
        - text: "`Running`"
          why: "The phase stays Running while the kubelet keeps restarting the container. STATUS shows the container's state instead: waiting, with the reason CrashLoopBackOff."
        - text: "`Failed`"
          why: "Failed means every container has ended and none will be restarted. A container in CrashLoopBackOff will be restarted."
        - text: "`CrashLoopBackOff`"
          why: "That is not a phase. When a container is waiting, the STATUS column shows the reason it waits."
      answer: 0
    - kind: teach
      id: ready-default
      body: |
        `app` became Ready as soon as it was running. That is the default: without a **readiness probe**, a
        running container counts as ready. A program that needs time to load its data would then receive
        traffic too early, and a program that hangs would keep receiving it. Probes, the subject of the next
        lesson, let the program say when it is ready and whether it is still alive.

        Now the other end of a pod's life.
    - kind: teach
      id: termination
      title: "The end of a pod"
      body: |
        When a pod is deleted (by a rollout, a scale-down, or someone), two things start in parallel.

        On the node, the kubelet starts the **grace period**, 30 seconds by default, in which the container
        must stop. It runs any `preStop` hook first, then sends **SIGTERM** to the main process of each
        container, and waits. The hook counts within the grace period. If a process is still running when the
        period ends, the kubelet sends **SIGKILL**.

        In the control plane, the pod's endpoint is updated: it becomes terminating, and stops being eligible
        for new traffic as the update reaches the routers and proxies. It may stay listed, with ready false,
        while the pod drains.
    - kind: teach
      id: pid-one
      body: |
        A container's main process has process number 1, and the kernel treats PID 1 specially: a signal it has
        not prepared a handler for is ignored, instead of ending it. Most programs prepare nothing for SIGTERM
        unless they were written to, and a shell prepares nothing unless the script says so with `trap`. Two
        Deployments show the difference:

        - `stubborn` runs `sh -c 'sleep infinity'`;
        - `polite` runs `sh -c 'trap "exit 0" TERM; sleep infinity & wait'`, which exits as soon as SIGTERM
          arrives. This is a demonstration of a PID 1 signal handler, not of clean shutdown: the shell does not
          pass the signal on or wait for its child.
    - kind: show
      id: show-pid-one
      body: "The recording creates both, then reads which program each container runs as PID 1, from `/proc/1/cmdline` (its words are separated by zero bytes, which `tr` turns into spaces):"
      run: "oc create deployment stubborn --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'sleep infinity' >/dev/null && oc create deployment polite --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'trap \"exit 0\" TERM; sleep infinity & wait' >/dev/null && oc rollout status deployment/stubborn --timeout=180s >/dev/null && oc rollout status deployment/polite --timeout=180s >/dev/null && for app in stubborn polite; do echo \"$app: PID 1 is $(oc exec deploy/$app -- cat /proc/1/cmdline | tr '\\0' ' ')\"; done"
      notice: |
        In `stubborn`, PID 1 is not the shell: given a single command, the shell replaced itself with `sleep`
        (provided here by `coreutils`). `sleep` has no SIGTERM handler. In `polite`, the shell stays PID 1, with
        its `trap`.
    - kind: ask
      id: guess-stubborn
      guess: true
      prompt: "You delete the `stubborn` pod. How long does it take to go away?"
      choices:
        - text: "About 30 seconds"
          why: "See the next step."
        - text: "At once"
          why: "Only if PID 1 ends on SIGTERM. This one ignores it. See the next step."
        - text: "Never"
          why: "SIGKILL cannot be ignored, and it comes when the grace period ends. See the next step."
      answer: 0
    - kind: show
      id: show-termination
      body: "Each pod is deleted in turn; `oc delete` waits until the pod is gone, and the shell measures how long that took:"
      run: "for app in stubborn polite; do start=$(date +%s); oc delete pod -l app=$app >/dev/null; echo \"$app: gone after $(( $(date +%s) - start )) seconds\"; done"
      highlight: ["stubborn", "polite"]
      notice: |
        `stubborn` ignored SIGTERM and was killed with SIGKILL when the 30 seconds ran out (33 seconds in all,
        with the kubelet's own work). `polite` was gone after 1 second: it exited as soon as SIGTERM arrived. In a
        rollout, every old pod of a `stubborn` application costs that half minute. A real application should
        catch SIGTERM itself, finish its work, and exit: `polite` only shows that a PID 1 which handles the
        signal stops at once.
    - kind: order
      id: order-end
      prompt: "A pod is deleted. Put the shutdown steps on the node in order."
      items:
        - "The kubelet starts the grace period, 30 seconds by default"
        - "A `preStop` hook, if there is one, runs"
        - "The kubelet sends SIGTERM to each container's main process"
        - "Anything still running at the end of the period receives SIGKILL"
      why: "The grace period is one budget: it starts first, and the hook and the wait after SIGTERM both use it. Endpoint updates run in parallel and are not part of this order."
    - kind: reflect
      id: explain-views
      prompt: "A colleague says: \"The pod is Running, so the application is up.\" What would you check before agreeing?"
      model: |
        Running is only the phase: the containers have started. I would check the `Ready` condition (READY 1/1 in
        `oc get pods`), because only a Ready pod receives traffic, and the containers' states and restart counts,
        because a container can be restarting again and again while the phase stays Running. And Ready itself
        means little without a readiness probe: then it only says that the container runs.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can follow a pod from creation to Ready through its phase, its containers' states and its
        conditions, read each with `oc`, and explain what happens when a pod is deleted, including why some take
        30 seconds to go.

        Next: [health probes](/lesson/b.health-probes), which decide when a container is ready, when it is
        restarted, and how long it may take to start. [Anatomy of a container](/lab/lab.container-anatomy) lets
        you look inside a running pod yourself: its user, its PID 1 and the limits the kernel enforces.
  sections:
    - id: more-lifecycle
      title: "Phases, restarts and termination details"
      depth: true
      body: |
        **Phase and status.** A pod's phase is coarse: `Pending`, `Running`, `Succeeded`, `Failed`,
        `Unknown`. The STATUS column of `oc get pods` is a summary, not the phase: a pod shown as
        `CrashLoopBackOff` is usually in phase `Running`, and one shown as `Init:0/1` is `Pending`. The detail
        is in the conditions and the container states (`waiting`, `running`, `terminated`, each with a
        reason). `oc describe pod` prints all of them, with the events at the end.

        **Restarts** happen in place, in the same pod, with a back-off that doubles from 10 seconds up to 5
        minutes and is reset after 10 minutes of running well. `oc logs --previous` reads the attempt before.

        **Init containers** run one after another, each to completion, before the application's containers;
        while they run, the status shows `Init:0/2`, `Init:1/2`, and a failing one shows
        `Init:CrashLoopBackOff`. Read its logs with `oc logs <pod> -c <init-container>`.

        **Termination details.** A `preStop` hook runs before the signal, and counts within the grace period
        (`terminationGracePeriodSeconds`). Images can choose another stop signal with `STOPSIGNAL`. An
        application that exits instantly on SIGTERM may still receive a few requests while routers catch up;
        a short `preStop` sleep covers that.
  review:
    - q: "What is the difference between a pod's phase and its Ready condition?"
      a: "The phase says, coarsely, where the pod is in its life (Pending, Running, Succeeded, Failed). Ready says whether it may receive traffic now: all its containers are ready, which, with a readiness probe, means the probe passes."
    - q: "A pod shows `Init:0/1`. What is happening, and what is its phase?"
      a: "Its first init container has not finished yet, so the application's containers have not started. The phase is Pending."
    - q: "What happens when a pod is deleted?"
      a: "Shutdown and endpoint updates start in parallel. On the node: a grace period (30 s by default) that includes any preStop hook, SIGTERM to each container's main process, then SIGKILL for anything still running. The terminating endpoint stops getting new traffic as the update propagates."
    - q: "Why did `stubborn` take about 30 seconds to stop?"
      a: "Its PID 1, `sleep` (the shell had replaced itself with it), has no SIGTERM handler, and the kernel ignores such signals for PID 1. Only SIGKILL, at the end of the grace period, stopped it. A shell as PID 1 behaves the same unless its script sets a `trap`."
  commands:
    - cmd: "oc apply -f starter.yaml && sleep 5 && oc get pod starter && oc get pod starter -o jsonpath='phase: {.status.phase}{\"\\n\"}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}prepare: {.status.initContainerStatuses[0].state}{\"\\n\"}app: {.status.containerStatuses[0].state}{\"\\n\"}'"
      meaning: "a starting pod: phase, conditions and container states"
    - cmd: "oc wait --for=condition=Ready pod/starter --timeout=120s && oc get pod starter && oc get pod starter -o jsonpath='phase: {.status.phase}{\"\\n\"}{range .status.conditions[*]}{.type}={.status}{\"\\n\"}{end}prepare: {.status.initContainerStatuses[0].state}{\"\\n\"}app: {.status.containerStatuses[0].state}{\"\\n\"}'"
      meaning: "the same pod once Ready"
      timeout: 150
    - cmd: "oc get pod starter -o jsonpath='{.status.phase}'"
      meaning: "the phase alone"
    - cmd: "oc create deployment stubborn --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'sleep infinity' >/dev/null && oc create deployment polite --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'trap \"exit 0\" TERM; sleep infinity & wait' >/dev/null && oc rollout status deployment/stubborn --timeout=180s >/dev/null && oc rollout status deployment/polite --timeout=180s >/dev/null && for app in stubborn polite; do echo \"$app: PID 1 is $(oc exec deploy/$app -- cat /proc/1/cmdline | tr '\\0' ' ')\"; done"
      meaning: "which program each container runs as PID 1"
      timeout: 420
    - cmd: "for app in stubborn polite; do start=$(date +%s); oc delete pod -l app=$app >/dev/null; echo \"$app: gone after $(( $(date +%s) - start )) seconds\"; done"
      meaning: "SIGTERM ignored by PID 1: the grace period, then SIGKILL"
      timeout: 300
  references:
    - {title: "Kubernetes: Pod lifecycle (phases, conditions, container states, termination)", url: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"}
    - {title: "Kubernetes: Init containers", url: "https://kubernetes.io/docs/concepts/workloads/pods/init-containers/"}
    - {title: "Linux man-pages: pid_namespaces(7) (signals to PID 1)", url: "https://man7.org/linux/man-pages/man7/pid_namespaces.7.html"}
- id: b.health-probes
  title: "Health probes"
  subtitle: "Startup, readiness and liveness: what each controls, how each failure shows, and how to size them"
  module: a2-apps
  mode: REAL_LAB
  minutes: 40
  level: 2
  supports: "Kubernetes 1.34 / OpenShift 4.21 with oc 4.21: startupProbe, readinessProbe and livenessProbe (exec, httpGet, tcpSocket, grpc), EndpointSlices (discovery.k8s.io/v1), Deployment rolling updates. Recorded on OpenShift Local as an ordinary user, in a temporary project; the console screenshots were taken as kubeadmin, in a separate demo project."
  concepts: [k8s.probes, net.endpointslices, k8s.pod-lifecycle]
  prerequisites: [b.pod-lifecycle]
  labs: [lab.probes-endpoints, inc.readiness-503, inc.liveness-restarts]
  record_on: cluster
  files:
    web-deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
        labels:
          app: web
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            containers:
            - name: web
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              # stands in for an application that needs START_SECONDS to start: it then creates the
              # files its probes check, and hands over to the web server (exec: it becomes PID 1)
              command:
              - /bin/sh
              - -c
              - |
                trap 'exit 0' TERM
                sleep "$START_SECONDS" & wait $!
                touch /tmp/started /tmp/ready /tmp/alive
                exec run-httpd
              env:
              - name: START_SECONDS
                value: "20"
              ports:
              - name: http
                containerPort: 8080
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              startupProbe:              # has it finished starting? the other probes wait for it
                exec:
                  command: ["test", "-f", "/tmp/started"]
                periodSeconds: 5
                failureThreshold: 12     # 12 x 5 s: up to 60 s to start
              readinessProbe:            # may it receive traffic now?
                exec:
                  command: ["test", "-f", "/tmp/ready"]
                periodSeconds: 5
                failureThreshold: 3      # out of the endpoints after 3 failures in a row
              livenessProbe:             # is it stuck beyond repair?
                exec:
                  command: ["test", "-f", "/tmp/alive"]
                periodSeconds: 5
                failureThreshold: 3      # restarted after 3 failures in a row
    slow-deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: slow
        labels:
          app: slow
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: slow
        template:
          metadata:
            labels:
              app: slow
          spec:
            containers:
            - name: web
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              # stands in for an application that needs START_SECONDS to start: it then creates the
              # files its probes check, and hands over to the web server (exec: it becomes PID 1)
              command:
              - /bin/sh
              - -c
              - |
                trap 'exit 0' TERM
                sleep "$START_SECONDS" & wait $!
                touch /tmp/started /tmp/ready /tmp/alive
                exec run-httpd
              env:
              - name: START_SECONDS
                value: "40"
              ports:
              - name: http
                containerPort: 8080
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              readinessProbe:            # may it receive traffic now?
                exec:
                  command: ["test", "-f", "/tmp/ready"]
                periodSeconds: 5
                failureThreshold: 3      # out of the endpoints after 3 failures in a row
              livenessProbe:             # is it stuck beyond repair?
                exec:
                  command: ["test", "-f", "/tmp/alive"]
                periodSeconds: 5
                failureThreshold: 3      # restarted after 3 failures in a row
  objective: |
    Say what each probe controls (startup: when the other two begin; readiness: traffic and rollout progress;
    liveness: restarts), write all three in a Deployment, recognise each failure from conditions, endpoints,
    restarts, events and rollout status, investigate a failing probe, and size its numbers with simple
    arithmetic.
  flow:
    - kind: ask
      id: recall-ready
      recalls: b.pod-lifecycle
      prompt: "A look back. A container has started a moment ago, and its pod has no probes. When does the pod's Service send it requests?"
      choices:
        - text: "At once, since it counts as ready"
          why: "Without a readiness probe, Ready follows the container's state, so traffic can arrive before the program can serve it."
        - text: "After its first successful health request"
          why: "Nothing tests it with a request unless a probe is defined. Ready follows the container's state."
        - text: "After a default wait of 30 seconds"
          why: "There is no such default wait. Without a probe, the container is ready as soon as it runs."
      answer: 0
    - kind: teach
      id: three-probes
      title: "Three questions, three consequences"
      body: |
        The kubelet can check each container regularly with **probes**. Each of the three controls something
        different:

        - the **startup** probe asks "has it finished starting?". Until it succeeds, the other two do not run.
          If it fails `failureThreshold` times in a row, the kubelet restarts the container. Once it has
          succeeded, it stops;
        - the **readiness** probe asks "may it receive traffic now?". When it fails, the container is not ready,
          the pod's `Ready` condition becomes false, and the Service's EndpointSlices mark the pod not ready, so
          it gets no new requests. During a rollout, a pod that is not ready is not **available**, and the
          rollout waits for it. **Nothing is restarted**, and the probe keeps running: the pod comes back when it
          passes again;
        - the **liveness** probe asks "is it stuck beyond repair?". When it fails `failureThreshold` times in a
          row, the kubelet stops the container (SIGTERM, then the grace period) and **restarts** it, in the same
          pod.

        Each check is an HTTP GET, a TCP connection, a command run in the container, or a gRPC call.
    - kind: show
      id: the-file
      title: "All three in a Deployment"
      body: |
        Real applications usually answer an HTTP path such as `/healthz`. The stand-in application of this
        lesson uses files instead, so that each check can be switched off on purpose: its start script waits
        `START_SECONDS` (20 here), creates `/tmp/started`, `/tmp/ready` and `/tmp/alive`, then hands over to the
        Apache web server, which listens on port 8080. Each probe runs `test -f` on one file.
      code: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: web
          labels:
            app: web
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: web
          template:
            metadata:
              labels:
                app: web
            spec:
              containers:
              - name: web
                image: registry.access.redhat.com/ubi9/httpd-24:latest
                # stands in for an application that needs START_SECONDS to start: it then creates the
                # files its probes check, and hands over to the web server (exec: it becomes PID 1)
                command:
                - /bin/sh
                - -c
                - |
                  trap 'exit 0' TERM
                  sleep "$START_SECONDS" & wait $!
                  touch /tmp/started /tmp/ready /tmp/alive
                  exec run-httpd
                env:
                - name: START_SECONDS
                  value: "20"
                ports:
                - name: http
                  containerPort: 8080
                resources:
                  requests:
                    cpu: 20m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
                startupProbe:              # has it finished starting? the other probes wait for it
                  exec:
                    command: ["test", "-f", "/tmp/started"]
                  periodSeconds: 5
                  failureThreshold: 12     # 12 x 5 s: up to 60 s to start
                readinessProbe:            # may it receive traffic now?
                  exec:
                    command: ["test", "-f", "/tmp/ready"]
                  periodSeconds: 5
                  failureThreshold: 3      # out of the endpoints after 3 failures in a row
                livenessProbe:             # is it stuck beyond repair?
                  exec:
                    command: ["test", "-f", "/tmp/alive"]
                  periodSeconds: 5
                  failureThreshold: 3      # restarted after 3 failures in a row
      caption: "web-deployment.yaml"
      origin: file
      notice: |
        The probes belong to a container, next to its `image`, `ports` and `resources`: each container of a pod
        has its own. Each probe has a check (here `exec`) and its timing: `periodSeconds` between checks and
        `failureThreshold` failures in a row before it acts. Fields left out take their defaults:
        `initialDelaySeconds` 0, `timeoutSeconds` 1, `successThreshold` 1.
    - kind: ask
      id: guess-starting
      guess: true
      prompt: "The Deployment is applied, with a Service in front. Twelve seconds later, what does `oc get pods` show for its two pods?"
      choices:
        - text: "`Running`, `1/1`"
          why: "The containers run, but are they ready? See the next step."
        - text: "`Running`, `0/1`"
          why: "See the next step."
        - text: "`ContainerCreating`, `0/1`"
          why: "Pulling the image and starting the containers takes a few seconds here, well under 12. See the next step."
      answer: 1
    - kind: show
      id: show-starting
      body: "`oc get pods`, then the same pods with columns chosen from each container's status: `started` (the startup probe has passed) and `ready`:"
      run: "oc apply -f web-deployment.yaml && oc expose deployment web --port=8080 && sleep 12 && oc get pods -l app=web && oc get pods -l app=web -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,STARTED:.status.containerStatuses[0].started,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount"
      highlight: ["0/1", "false"]
      notice: |
        Both pods are `Running`, yet `0/1`. Their containers run (the start script is in its 20-second wait), but
        `STARTED` is `false`: the startup probe has not passed yet, so readiness and liveness are not even checked,
        and the pods are not ready. The phase and readiness are two different things.
    - kind: show
      id: show-healthy
      body: "Once `oc rollout status` reports the rollout complete: the same columns, and what the Service's EndpointSlice says about each pod:"
      run: "oc rollout status deployment/web --timeout=120s && oc get pods -l app=web -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,STARTED:.status.containerStatuses[0].started,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount && oc describe endpointslices -l kubernetes.io/service-name=web | grep -e Addresses -e Ready"
      notice: |
        Once each start script had created its files, the startup probe passed, then readiness: `STARTED` and `READY`
        are `true` for both pods, with no restarts. The EndpointSlice lists both addresses with `Ready: true`, so the
        Service sends requests to both. `oc rollout status` waited until both pods were available.
    - kind: show
      id: console-health-checks
      body: "In the web console, a Deployment's probes have their own form: **Actions > Edit Health Checks**. Here it is for another Deployment, `web`, which has a readiness and a liveness probe but no startup probe. The console screenshots in this lesson were taken as the cluster administrator (`kubeadmin`), in a demo project, `console-demo`, which is not part of this lesson's commands. A developer sees the same form and the same pod pages for their own project."
      image:
        src: edit-health-checks.png
        alt: "The Edit health checks form for the container httpd-24 of the Deployment web: Readiness probe added and Liveness probe added, each with an Edit Probe link and a sentence saying what the probe does, and Add Startup probe for the startup probe that is not set."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "Actions > Edit Health Checks"
      notice: "The console's three sentences are the same three questions: *ready to handle requests* (readiness), *still running* (liveness), *started* (startup). Saving the form writes the same fields as the manifest above; nothing was saved for this picture."
    - kind: teach
      id: readiness-off
      title: "A readiness failure"
      body: |
        A real application stops reporting ready when it cannot serve for a while, for example when the
        database it needs is unreachable. The recording does the same by hand: it removes `/tmp/ready` in the
        first pod with `oc exec`, and waits 20 seconds, more than the 3 × 5 = 15 seconds the probe needs to act.
    - kind: ask
      id: guess-readiness
      guess: true
      prompt: "Twenty seconds after `/tmp/ready` disappears from one pod, what has changed for that pod?"
      choices:
        - text: "`0/1`, out of the endpoints, no restart"
          why: "See the next step."
        - text: "It has been restarted once"
          why: "Restarts are the liveness probe's action. See the next step."
        - text: "It has been replaced by a new pod"
          why: "No probe replaces a pod: liveness restarts a container inside the same pod. See the next step."
      answer: 0
    - kind: show
      id: show-not-ready
      body: "`head -n 1` keeps the first pod's name; the same name is used for the rest of this part:"
      run: "POD=$(oc get pods -l app=web -o name | head -n 1) && oc exec $POD -- rm /tmp/ready && sleep 20 && oc get pods -l app=web && oc describe endpointslices -l kubernetes.io/service-name=web | grep -e Addresses -e Ready"
      highlight: ["0/1", "false"]
      notice: |
        The first pod is `0/1` but still `Running`, with 0 restarts. In the EndpointSlice, one address is now
        `Ready: false`: the Service sends that pod no new requests, and the other pod serves alone. Nothing was
        restarted or replaced.
    - kind: show
      id: console-not-ready
      body: "The same failure in the web console: a Deployment `not-ready` in the demo project `console-demo` (as kubeadmin, not part of this lesson's commands), whose readiness probe asks for `/healthz`, a path httpd does not serve."
      image:
        src: pod-not-ready-events.png
        alt: "The Events tab of the pod not-ready, status Running: Readiness probe failed, HTTP probe failed with statuscode 404, repeated many times, and an earlier Readiness probe failed, connection refused, while the server was starting."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "A pod's Events tab: the probe's verdict, again and again"
      notice: "The pod is *Running* and stays 0/1 ready: the kubelet keeps asking, and every answer is 404. The first failure, *connection refused*, came while httpd was still starting."
    - kind: try
      id: try-unhealthy
      body: "Find the probe failures the kubelet has reported in this project: they are events with the reason `Unhealthy`."
      accept: ["oc get events --field-selector reason=Unhealthy", "oc get events --field-selector=reason=Unhealthy", "oc get event --field-selector reason=Unhealthy", "oc get ev --field-selector reason=Unhealthy", "kubectl get events --field-selector reason=Unhealthy"]
      hints:
        - match: "-l reason|--selector"
          say: "`reason` is a field of the event, not a label: filter with `--field-selector reason=Unhealthy`."
        - match: "--field-selector[ =]Unhealthy"
          say: "A field selector is `field=value`: `reason=Unhealthy`."
        - match: "^oc describe"
          say: "`describe` shows a pod's events among its details. The task is the project's events, filtered by reason: `oc get events --field-selector …`."
        - match: "^oc get events$"
          say: "That lists every event of the project. Keep only the probe failures with `--field-selector reason=Unhealthy`."
      hint: "`oc get events`, then `--field-selector` with `reason=Unhealthy`."
      run: "oc get events --field-selector reason=Unhealthy"
      then: |
        Three probe failures. Each pod reported `Startup probe failed` during its first 20 seconds: that is the
        startup probe waiting, as planned. The newest event is `Readiness probe failed`, on the first pod. After the
        colon comes the check's own output; `test` prints nothing, so it is empty here. An HTTP probe would show the
        status code it received.
    - kind: show
      id: check-by-hand
      body: |
        To investigate a failing probe, run its check yourself, in the same container. `oc exec` returns the
        command's exit status, so `||` prints it when the check fails. Then the recording gives the file back:
      run: "POD=$(oc get pods -l app=web -o name | head -n 1) && { oc exec $POD -- test -f /tmp/ready || echo \"the readiness check exits with $?\"; } && oc exec $POD -- touch /tmp/ready && sleep 10 && oc get pods -l app=web"
      notice: |
        `oc exec` reported `command terminated with exit code 1`, and the shell printed the same status: the check
        fails, exactly as the kubelet sees it. Once the file was back, the pod was `1/1` again within 10 seconds,
        still with 0 restarts. Readiness only takes a pod out of traffic and puts it back.
    - kind: teach
      id: liveness-off
      title: "A liveness failure"
      body: |
        Now the other kind of failure: a program that still runs but is stuck, the case a liveness probe is for.
        The recording removes `/tmp/alive` in the second pod, and waits 55 seconds: about 15 for the probe to
        act, then a whole new start.
    - kind: ask
      id: guess-liveness
      guess: true
      prompt: "What will the second pod look like after those 55 seconds?"
      choices:
        - text: "Same name, 1 restart, `1/1` again"
          why: "See the next step."
        - text: "`0/1` with no restart, like the first one"
          why: "That is what readiness does. Liveness acts on the container itself. See the next step."
        - text: "A new pod, with a new name"
          why: "The kubelet restarts the container inside the same pod; only a controller creates new pods. See the next step."
      answer: 0
    - kind: show
      id: show-restarted
      run: "POD=$(oc get pods -l app=web -o name | tail -n 1) && oc exec $POD -- rm /tmp/alive && sleep 55 && oc get pods -l app=web"
      highlight: ["(", "ago)"]
      notice: |
        The second pod has the same name, is `1/1` again, and shows 1 restart, 44 seconds earlier. The liveness
        probe failed 3 times, and the kubelet stopped the container and started a new one in the same pod. The new
        container began from the image again, with a fresh 20-second start covered by the startup probe; the start
        script then created a new `/tmp/alive`.
    - kind: try
      id: try-describe
      body: "Show the full description of the pods of `web`: their containers' states, restart counts and probes, their conditions, and their events."
      accept: ["oc describe pods -l app=web", "oc describe pod -l app=web", "oc describe po -l app=web", "oc describe pods --selector=app=web", "kubectl describe pods -l app=web"]
      hints:
        - match: "^oc get pods?"
          say: "`oc get pods` gives the summary. The detail, with the last state and the events, comes from `oc describe`."
        - match: "^oc logs"
          say: "Logs show what the program printed. The probes' results are in the pod's description and events."
        - match: "^oc describe (deployment|deploy)"
          say: "The Deployment's description holds the template and the rollout, not each pod's restarts and events. Describe the pods, selected by their label."
        - match: "^oc describe pods?$"
          say: "That would describe every pod of the project. Select the ones of `web` with `-l app=web`."
      hint: "`oc describe pods`, then the label selector `-l app=web`."
      run: "oc describe pods -l app=web"
      then: |
        A long report, 197 lines for the two pods; the second pod's part holds the story. Under its container:
        `Restart Count: 1`, and a `Last State` of `Terminated`, reason `Completed`, exit code `0`: the web server,
        PID 1 since `exec`, exited cleanly on SIGTERM. The three probe lines show each probe as the kubelet runs it,
        defaults included (`delay=0s timeout=1s period=5s #success=1 #failure=3`). Under `Conditions`, all are `True`
        again. The events, oldest first: `Liveness probe failed` 3 times, `Killing` with `Container web failed
        liveness probe, will be restarted`, the container created and started a second time, and `Startup probe
        failed` while it started again. Two `Readiness probe errored` events come from checks that ran while the
        container was stopping.
    - kind: teach
      id: slow-start
      title: "A slow start, without and with a startup probe"
      body: |
        Why have a startup probe at all? Take an application that needs 40 seconds to start, and a liveness probe
        that acts after 3 failures, 5 seconds apart. The file `slow-deployment.yaml` is that case: the same
        Deployment, called `slow`, with one replica, `START_SECONDS` at 40, and no startup probe. `diff -u`
        shows exactly what differs from `web-deployment.yaml` (lines with `-` are only in the first file, lines
        with `+` only in the second). `diff` exits with status 1 when the files differ: that is its normal
        answer here, not an error.
    - kind: show
      id: show-diff
      run: "diff -u web-deployment.yaml slow-deployment.yaml"
      notice: |
        Three differences: the names and labels (`slow`, with one replica), `START_SECONDS` 40 instead of 20, and
        the startup probe, removed. Readiness and liveness are unchanged.
    - kind: ask
      id: guess-slow
      guess: true
      prompt: "Liveness acts after about 3 × 5 = 15 seconds of failures, and `slow` needs 40 seconds to start. What happens?"
      choices:
        - text: "Restarted before it finishes starting, again and again"
          why: "See the next step."
        - text: "It is Ready after about 40 seconds"
          why: "Only if nothing stops it before then. See the next step."
        - text: "Nothing: liveness waits for readiness"
          why: "The two probes are independent: liveness does not wait for readiness. Only a startup probe holds both back. See the next step."
      answer: 0
    - kind: show
      id: show-slow
      body: "75 seconds after the Deployment is applied: its pod, and the `Killing` events that name it."
      run: "oc apply -f slow-deployment.yaml && sleep 75 && oc get pods -l app=slow && oc get events --field-selector reason=Killing -o custom-columns=OBJECT:.involvedObject.name,MESSAGE:.message | grep -e OBJECT -e slow"
      highlight: ["failed liveness probe"]
      notice: |
        After 75 seconds: `CrashLoopBackOff`, 3 restarts, never ready. Each time, liveness failed 3 times about 15
        seconds into the 40-second start, and the kubelet restarted the container, which then started from zero
        again; between attempts the kubelet waits longer and longer. The `Killing` event names the probe (repeats of
        the same event are counted, not listed again).
    - kind: try
      id: try-startup
      body: "Give `slow` a startup probe that runs `test -f /tmp/started` every 5 seconds and allows up to 12 failures. `oc set probe` takes the command to run after `--`."
      accept: ["oc set probe deployment/slow --startup --period-seconds=5 --failure-threshold=12 -- test -f /tmp/started", "oc set probe deploy/slow --startup --period-seconds=5 --failure-threshold=12 -- test -f /tmp/started", "oc set probe deployment slow --startup --period-seconds=5 --failure-threshold=12 -- test -f /tmp/started"]
      hints:
        - match: "--liveness|--readiness"
          say: "Those two are already there. The missing one is the startup probe: `--startup`."
        - match: "--initial-delay-seconds"
          say: "A delay works too, but it must be guessed, and it delays the check after every restart. The task is a startup probe."
        - match: "--failure-threshold[= ][1-8]( |$)"
          say: "That budget is at most 8 × 5 = 40 seconds: no margin for an application that needs 40. The task asks for 12."
        - match: "[^-]test -f /tmp/started$"
          say: "Put `--` before the command, so that `oc` does not read it as its own arguments: `-- test -f /tmp/started`."
      hint: "`oc set probe deployment/slow --startup`, the period and the threshold, then `--` and the command."
      run: "oc set probe deployment/slow --startup --period-seconds=5 --failure-threshold=12 -- test -f /tmp/started"
      then: |
        `probes updated`: the pod template changed, so a rollout starts a new pod with a startup probe. Its budget
        is 12 × 5 = 60 seconds, 20 more than the start needs.
    - kind: show
      id: show-slow-fixed
      run: "oc rollout status deployment/slow --timeout=150s && oc get pods -l app=slow"
      notice: |
        The new pod is `1/1`, with 0 restarts, 46 seconds old: its startup probe failed quietly for about 40
        seconds, then passed, and only then did readiness and liveness begin. The old pod, at 5 restarts, is being
        removed.
    - kind: teach
      id: sizing
      title: "Sizing the numbers"
      body: |
        | Question | Arithmetic | In `web` |
        |---|---|---|
        | How long may a start take? | startup `failureThreshold` × `periodSeconds` | 12 × 5 = 60 s, for a 20 s start |
        | How soon does a stuck container restart? | about liveness `failureThreshold` × `periodSeconds` | about 3 × 5 = 15 s, then a whole new start |
        | How soon does a struggling pod leave the endpoints? | about readiness `failureThreshold` × `periodSeconds` | about 3 × 5 = 15 s |

        A check that takes longer than `timeoutSeconds` (1 second by default) counts as a failure: a health
        endpoint that slows down under load can make liveness restart healthy pods. Keep checks cheap.

        `initialDelaySeconds`, the older answer to slow starts, delays the first check after every start by a
        fixed time, guessed for the slowest start. A startup probe ends as soon as the application is up.
        Readiness may react quickly, since it only removes traffic; liveness should be slow to act, since every
        restart costs a whole start.
    - kind: ask
      id: size-startup
      prompt: "An application starts in up to 90 seconds. Its startup probe checks every 10 seconds. Which `failureThreshold` do you give it?"
      choices:
        - text: "12"
          why: "12 × 10 = 120 seconds: room for its slowest start, plus a margin for a busy node."
        - text: "9"
          why: "9 × 10 = 90 seconds: on its slowest start, the probe gives up as it finishes, or a moment before. Leave a margin."
        - text: "3"
          why: "3 × 10 = 30 seconds: the kubelet restarts it long before it can finish, and it never starts."
      answer: 0
    - kind: teach
      id: liveness-advice
      body: |
        A liveness probe is a strong tool: a wrong one restarts healthy pods. It should only answer "is this
        process stuck?", cheaply, without checking databases or other services: if a database slows down, a
        liveness probe that checks it restarts every replica at once and makes the outage worse. Checking a
        dependency belongs, if anywhere, in readiness.
    - kind: explore
      id: probes-model
      sim: probes
      body: "This model replays the kubelet second by second; it is not a cluster recording. Drag the time cursor through the database outage: readiness takes the pod out of traffic and brings it back, with no restart. Then switch on \"/healthz (liveness) also checks the database\": the same outage now kills and restarts the container."
    - kind: ask
      id: startup-decision
      prompt: "An application needs about 90 seconds to start. Its startup probe allows 120 seconds. At 60 seconds it is still starting. What happens?"
      choices:
        - text: "No restart, no traffic yet"
          why: "While the startup probe has not succeeded, the other probes wait, so nothing restarts the container, and the pod is not ready for traffic."
        - text: "Liveness restarts it after 3 failures"
          why: "Liveness does not run until the startup probe succeeds. That is what a startup probe is for."
        - text: "It already receives traffic"
          why: "Readiness also waits for the startup probe, and a pod that is not ready gets no traffic."
      answer: 0
    - kind: teach
      id: rollout-stall
      title: "A release with a readiness check that never passes"
      body: |
        Readiness also decides whether a rollout goes on. Release 2 of `web` changes the readiness check to a
        file the application never creates, the same mistake as a health path renamed in the probe but not in
        the application. With 2 replicas and the default strategy, the rollout may add 1 pod (25% of 2, rounded
        up) and must keep 2 available (25% of 2 is 0.5, rounded down to 0 unavailable).
    - kind: ask
      id: guess-rollout
      guess: true
      prompt: "What happens to the rollout, and to the users?"
      choices:
        - text: "It stalls; the old pods keep serving"
          why: "See the next step."
        - text: "Both old pods are replaced; users get errors"
          why: "An old pod goes only when a new one is available, and the new one never is. See the next step."
        - text: "Kubernetes rolls it back by itself"
          why: "Kubernetes never undoes a rollout on its own. See the next step."
      answer: 0
    - kind: show
      id: show-stall
      body: "`oc set probe` changes the readiness check in the pod template, which starts the rollout; `oc rollout status` then waits at most 60 seconds:"
      run: "oc set probe deployment/web --readiness --period-seconds=5 -- test -f /tmp/ready-v2 && oc rollout status deployment/web --timeout=60s"
      notice: |
        The changed template started a rollout. One new pod was created (`1 out of 2 new replicas have been
        updated`), and the rollout went no further: after 60 seconds, `oc rollout status` gave up with `timed out
        waiting for the condition` and a non-zero exit status, which a pipeline can act on. The rollout itself is
        not cancelled: it waits.
    - kind: show
      id: show-stall-state
      run: "oc get pods -l app=web && oc get deployment web && oc describe endpointslices -l kubernetes.io/service-name=web | grep -e Addresses -e Ready"
      notice: |
        The new pod is `Running` but `0/1`: its startup probe passed, its readiness check never does. Both old pods
        are still `1/1` (one still shows the earlier liveness restart). The Deployment reads `READY 2/2`,
        `UP-TO-DATE 1`, `AVAILABLE 2`, and the EndpointSlice lists the new pod's address with `Ready: false`: the
        users are served by the old version. With `maxUnavailable` 0, no old pod may go until a new one is
        available, and none will be.
    - kind: show
      id: show-undo
      body: "`oc rollout undo` brings back the previous pod template, with its working readiness check:"
      run: "oc rollout undo deployment/web && oc rollout status deployment/web --timeout=120s && oc get pods -l app=web"
      notice: |
        `rolled back`: the previous template, with its working readiness check, is the desired one again. Its
        ReplicaSet still had two ready pods, so the rollout finished at once, and the new pod is `Terminating`. The
        users were served throughout.
    - kind: order
      id: order-investigate
      prompt: "A pod is `Running` but `0/1`, or its restarts keep climbing. Put the investigation in order."
      items:
        - "`oc get pods`: READY and RESTARTS say which probe to suspect"
        - "`oc describe pod`: the conditions, the last state, the probe's settings and its events"
        - "Run the probe's check yourself with `oc exec`"
        - "Fix the probe or the application in the Deployment, then watch `oc rollout status`"
      why: "Not ready without restarts points to readiness; climbing restarts with `failed liveness probe` events point to liveness. The description shows the probe exactly as the kubelet runs it, and running its check by hand tells a wrong probe from a sick application before you change anything."
    - kind: ask
      id: image-healthcheck
      prompt: The image was built with a HEALTHCHECK instruction. Does the pod use it?
      choices:
      - text: 'No: only the pod''s probes count'
        why: HEALTHCHECK is image metadata that Docker and Podman can run. The kubelet ignores it and runs only the probes in the pod spec.
      - text: Yes, as a default liveness probe
        why: No probe is created from image metadata; without probes in the spec, there are none.
      - text: Yes, but only on CRI-O
        why: CRI-O does not run it either.
      answer: 0
    - kind: reflect
      id: explain-probes
      prompt: "Explain to a colleague why a wrong readiness probe and a wrong liveness probe look so different in `oc get pods`."
      model: |
        A failing readiness probe only takes the pod out of traffic: it stays Running with 0/1 ready and no
        restarts, its endpoint is marked not ready, and a rollout that needs it stalls while the old pods keep
        serving. A failing liveness probe makes the kubelet restart the container again and again, so restarts
        climb and the status soon shows CrashLoopBackOff, like a crash, although the logs may show no error. The
        `Unhealthy` and `Killing` events name which probe failed.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can say what each probe controls, write all three in a Deployment, recognise a readiness failure
        (not ready, out of the endpoints, a stalled rollout) and a liveness failure (restarts, `Killing` events,
        a last state), save a slow start with a startup probe, investigate a failing probe, and size its
        numbers.

        The incidents [Running but never Ready](/lab/inc.readiness-503) and
        [Restarts, but no errors](/lab/inc.liveness-restarts) let you diagnose both on your own.

        Next: [Requests, limits, QoS and quotas](/lesson/b.resources-qos), the two numbers per container that
        decide where a pod may run and when the kernel stops it.
  sections:
    - id: more-probes
      title: "Probe fields, mechanisms and choices"
      depth: true
      body: |
        | Field | Default | Meaning |
        |---|---|---|
        | `initialDelaySeconds` | 0 | wait before the first check, after each start |
        | `periodSeconds` | 10 | interval between checks |
        | `timeoutSeconds` | 1 | a slower answer counts as a failure |
        | `failureThreshold` | 3 | consecutive failures before acting |
        | `successThreshold` | 1 | successes to pass again (must be 1 for liveness and startup) |

        `failureThreshold × periodSeconds` is an approximate failure-detection window, not the time until a
        replacement runs: stopping the container (the grace period), starting it, and the restart back-off come
        after it. A liveness or startup probe can also set its own `terminationGracePeriodSeconds`, which
        overrides the pod's value only when that probe causes the kill.

        **Mechanisms.** `httpGet` (path, port by number or name, optional headers; a status from 200 to 399 is a
        success), `tcpSocket` (the port accepts a connection), `exec` (exit status 0), `grpc` (the gRPC health
        checking protocol). An `exec` probe starts a process in the container at every check: on busy nodes,
        prefer HTTP or TCP.

        | Situation | Use |
        |---|---|
        | no traffic before the app is ready, or while overloaded | readiness, on an endpoint that says "I can serve now" |
        | the process can hang without exiting | liveness, on a cheap endpoint of the process itself |
        | the app sometimes needs minutes to start | a startup probe with the liveness check |
        | the process exits when it fails | nothing extra: the kubelet already restarts it |

        **On the command line.** `oc set probe deployment/x --readiness --get-url=http://:8080/healthz`,
        `--open-tcp=8080`, or `-- <command>`; `--remove` deletes a probe. OpenShift's documentation calls
        probes "health checks", and the console's Deployment pages can add them through a form.
  review:
    - q: "What does each probe control?"
      a: "Startup: whether the other two may begin (failure at the end of its budget restarts the container). Readiness: whether the pod receives traffic and counts as available for a rollout; it never restarts anything. Liveness: whether the container is restarted."
    - q: "Where do you see that a readiness probe fails?"
      a: "READY 0/1 with no restarts, `Readiness probe failed` events (reason Unhealthy), `Ready: false` for the pod's address in the Service's EndpointSlice, and a rollout that does not progress."
    - q: "A container keeps restarting, exits with status 0, and its logs show no error. What do you check?"
      a: "The events: `failed liveness probe, will be restarted` (reason Killing) means the kubelet stopped it. Then the liveness probe's settings in `oc describe pod`, and its check run by hand with `oc exec`."
    - q: "How do you size a startup probe for an application that starts in up to 90 seconds?"
      a: "failureThreshold × periodSeconds must exceed 90 seconds with a margin: for example 12 × 10 = 120 seconds."
    - q: "A release's new pods never become ready. What do users see, and how do you get out?"
      a: "The old pods keep serving (maxUnavailable keeps them until new pods are available), and `oc rollout status` times out. `oc rollout undo` brings the previous template back."
  commands:
    - cmd: "oc apply -f web-deployment.yaml && oc expose deployment web --port=8080 && sleep 12 && oc get pods -l app=web && oc get pods -l app=web -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,STARTED:.status.containerStatuses[0].started,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount"
      meaning: "a Deployment with three probes, while its containers start"
    - cmd: "oc rollout status deployment/web --timeout=120s && oc get pods -l app=web -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,STARTED:.status.containerStatuses[0].started,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount && oc describe endpointslices -l kubernetes.io/service-name=web | grep -e Addresses -e Ready"
      meaning: "started, ready, and in the Service's endpoints"
      timeout: 150
    - cmd: "POD=$(oc get pods -l app=web -o name | head -n 1) && oc exec $POD -- rm /tmp/ready && sleep 20 && oc get pods -l app=web && oc describe endpointslices -l kubernetes.io/service-name=web | grep -e Addresses -e Ready"
      meaning: "a readiness failure: 0/1, no restart, endpoint not ready"
    - cmd: "oc get events --field-selector reason=Unhealthy"
      meaning: "the probe failures reported by the kubelet"
    - cmd: "POD=$(oc get pods -l app=web -o name | head -n 1) && { oc exec $POD -- test -f /tmp/ready || echo \"the readiness check exits with $?\"; } && oc exec $POD -- touch /tmp/ready && sleep 10 && oc get pods -l app=web"
      meaning: "the probe's check run by hand, then the pod ready again"
    - cmd: "POD=$(oc get pods -l app=web -o name | tail -n 1) && oc exec $POD -- rm /tmp/alive && sleep 55 && oc get pods -l app=web"
      meaning: "a liveness failure: the container restarted in the same pod"
    - cmd: "oc describe pods -l app=web"
      meaning: "states, restart counts, probes, conditions and events"
    - cmd: "diff -u web-deployment.yaml slow-deployment.yaml"
      meaning: "the slow variant: 40 seconds to start, no startup probe"
      expect: fail
    - cmd: "oc apply -f slow-deployment.yaml && sleep 75 && oc get pods -l app=slow && oc get events --field-selector reason=Killing -o custom-columns=OBJECT:.involvedObject.name,MESSAGE:.message | grep -e OBJECT -e slow"
      meaning: "a slow start killed by liveness"
    - cmd: "oc set probe deployment/slow --startup --period-seconds=5 --failure-threshold=12 -- test -f /tmp/started"
      meaning: "a startup probe with a 60-second budget"
    - cmd: "oc rollout status deployment/slow --timeout=150s && oc get pods -l app=slow"
      meaning: "the slow start, saved"
      timeout: 180
    - cmd: "oc set probe deployment/web --readiness --period-seconds=5 -- test -f /tmp/ready-v2 && oc rollout status deployment/web --timeout=60s"
      meaning: "a release whose readiness check never passes: the rollout stalls"
      expect: fail
    - cmd: "oc get pods -l app=web && oc get deployment web && oc describe endpointslices -l kubernetes.io/service-name=web | grep -e Addresses -e Ready"
      meaning: "old pods still serving, the new one not ready"
    - cmd: "oc rollout undo deployment/web && oc rollout status deployment/web --timeout=120s && oc get pods -l app=web"
      meaning: "back to the previous template"
      timeout: 150
  references:
    - {title: "Kubernetes: Configure liveness, readiness and startup probes", url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"}
    - {title: "Kubernetes: Pod lifecycle (container probes, Ready condition)", url: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"}
    - {title: "Kubernetes: Deployments (rolling update, maxSurge and maxUnavailable)", url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"}
    - {title: "Kubernetes: EndpointSlices (ready, serving and terminating conditions)", url: "https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/"}
    - {title: "OpenShift 4.21: Monitoring application health by using health checks", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/application-health"}
- id: b.resources-qos
  title: "Requests, limits, QoS and quotas"
  subtitle: "Two numbers per container: one for the scheduler, one for the kernel"
  module: a2-apps
  mode: REAL_LAB
  minutes: 30
  level: 2
  supports: "Kubernetes 1.34 / OpenShift 4.21 with cgroup v2 (default on RHCOS 9) and oc 4.21; LimitRange (v1) defaults applied by the LimitRanger admission plugin. Recorded on OpenShift Local as the ordinary user developer, in a temporary project; the LimitRange in that project was created by the cluster administrator (kubeadmin) and deleted afterwards, with the project (experiment X-QOS-01)."
  concepts: [k8s.requests-limits, k8s.qos, k8s.quota, linux.cgroups]
  prerequisites: [o1.deploy-apps, f0.linux-essentials]
  labs: [lab.container-anatomy, inc.oomkilled, inc.pending-resources]
  record_on: cluster-admin
  files:
    too-big.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: too-big
      spec:
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "50"
    limited.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: limited
      spec:
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
    hungry.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: hungry
      spec:
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          # reads 200 MB with no line break: tail keeps it all in memory, far above the limit
          command: ["sh", "-c", "head -c 200M /dev/zero | tail"]
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
    plain.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: plain
      spec:
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
    lab-defaults.yaml: |
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: lab-defaults
      spec:
        limits:
        - type: Container
          defaultRequest:
            cpu: 50m
            memory: 64Mi
          default:
            cpu: 250m
            memory: 128Mi
  objective: |
    Explain what a request does at scheduling time and what a limit does at run time, read a limit in the
    container's cgroup files, predict a pod's QoS class and how an administrator's defaults change it, and tell
    a pod that cannot be scheduled from one that is killed for its memory, from their evidence.
  flow:
    - kind: ask
      id: recall-137
      recalls: f0.linux-essentials
      prompt: "A look back. A container stops with exit status 137. What do you investigate first?"
      choices:
        - text: "A possible SIGKILL, in the events"
          why: "137 is 128 + 9, SIGKILL, which cannot be caught or ignored. It is a strong hint, not proof: the termination reason and the events confirm it."
        - text: "A possible SIGTERM, 128 + 15"
          why: "128 + 15 is 143. 137 is 128 + 9: SIGKILL."
        - text: "Its own error code"
          why: "A program could choose 137, but almost none do. Start with the likelier cause, a signal, and fall back to this only if the events show no kill."
      answer: 0
    - kind: teach
      id: two-numbers
      title: "Two numbers, two different jobs"
      body: |
        Each container can declare, for CPU and for memory, two numbers:

        - a **request**: the amount the **scheduler** counts when it chooses a node for the pod. For CPU, it also
          sets the share the container gets when CPU is contested. A request does not protect a pod from every
          resource failure.
        - a **limit**: the most it may use. The **kernel** of the node enforces it while the container runs.

        They look alike, and they act at different moments. Most pods that stay "Pending" forever, restart
        with exit status 137, or answer slowly under load come back to one of these two numbers.

        CPU is counted in cores, or in thousandths of a core: `500m` is half a core. Memory is counted in bytes,
        usually written `128Mi` (128 mebibytes).
    - kind: teach
      id: requests
      title: "A request is a reservation"
      body: |
        A node has a fixed amount of CPU and memory it can give to pods. The scheduler places a pod only on a
        node where what is still **unreserved**, after the requests of the pods already there, covers the new
        pod's requests. It never looks at how busy the node actually is: a nearly idle node whose capacity is
        all reserved accepts nothing more.

        The file `too-big.yaml` describes a pod that requests 50 CPU cores. This single-node cluster has far
        fewer.
    - kind: ask
      id: guess-pending
      guess: true
      prompt: "What will `oc get pod too-big` show?"
      choices:
        - text: "`Running`, slowed down"
          why: "A request is not a speed. The scheduler must find a node with 50 unreserved cores before anything runs. See the next step."
        - text: "`Pending`"
          why: "See the next step."
        - text: "`OOMKilled`"
          why: "That comes from a memory limit, while the program runs. This pod never gets that far. See the next step."
      answer: 1
    - kind: show
      id: show-pending
      run: "oc apply -f too-big.yaml && sleep 10 && oc get pod too-big && oc get events --field-selector involvedObject.name=too-big -o custom-columns=REASON:.reason,MESSAGE:.message"
      highlight: ["Pending", "Insufficient cpu"]
      notice: |
        `Pending`, and the scheduler's event says why: `Insufficient cpu`. No node has 50 unreserved cores, and
        the end of the message adds that removing lower-priority pods (preemption) would not help either. The
        pod was never placed on a node, so no container exists and there are no logs to read.
    - kind: teach
      id: limits
      title: "A limit is enforced by the kernel"
      body: |
        On the node, each container runs in a **cgroup**, the Linux kernel's mechanism for limiting a group of
        processes. Its limits are written in files under `/sys/fs/cgroup` inside the container, and the kernel
        enforces them:

        - at its **memory** limit, the kernel first tries to reclaim memory. If that is not enough to stay
          within the limit, it may kill a process of the container (SIGKILL, so status 137);
        - at its **CPU** limit, it is **slowed down** (throttled): it gets no more CPU time in each period,
          but it is never killed for it.

        The file `limited.yaml` describes a pod with limits of half a core and 128Mi.
    - kind: show
      id: show-memmax
      body: "The recording creates the pod, waits until it is ready, and reads its memory limit from inside it. `oc exec <pod> -- <command>` runs a command in the pod's container; everything after `--` is that command, not an option for `oc`."
      run: "oc apply -f limited.yaml && oc wait --for=condition=Ready pod/limited --timeout=180s >/dev/null && oc exec limited -- cat /sys/fs/cgroup/memory.max"
      notice: "`134217728` bytes: 128 × 1024 × 1024, the 128Mi from the pod's limit, written where the kernel reads it."
    - kind: try
      id: try-cpumax
      body: "The CPU limit is in the file `cpu.max`, in the same directory. Show it, from the pod `limited`."
      accept: ["oc exec limited -- cat /sys/fs/cgroup/cpu.max", "oc exec pod/limited -- cat /sys/fs/cgroup/cpu.max"]
      hints:
        - match: "^cat "
          say: "That reads the file on this machine. The file is inside the pod: `oc exec limited --`, then the command."
        - match: "^oc exec limited cat"
          say: "Put `--` before the command to run in the container."
        - match: "memory\\.max"
          say: "That is the memory limit, already shown. The CPU limit is in `cpu.max`."
        - match: "cpu\\.max$"
          say: "Give the full path: `/sys/fs/cgroup/cpu.max`."
      hint: "Run `cat` inside the pod, through `oc exec` and `--`, with the file's full path under `/sys/fs/cgroup`."
      run: "oc exec limited -- cat /sys/fs/cgroup/cpu.max"
      then: |
        `50000 100000`: in every period of 100,000 microseconds (a tenth of a second), the container may use
        50,000 microseconds of CPU time. That is half a core, the `500m` of its limit. When it has used them,
        it waits for the next period.
    - kind: ask
      id: guess-oom
      guess: true
      prompt: "`hungry.yaml` limits a program to 64Mi of memory, and the program keeps 200 MB in memory. What happens?"
      choices:
        - text: "It is slowed down, like CPU"
          why: "Memory cannot be slowed down: once used, it must be given back or taken. See the next step."
        - text: "The kernel kills it, and it restarts"
          why: "See the next step."
        - text: "The pod is never scheduled"
          why: "Its request, 32Mi, fits, so the scheduler places it. The limit acts later, while it runs. See the next step."
      answer: 1
    - kind: show
      id: show-oom
      run: "oc apply -f hungry.yaml && sleep 30 && oc get pod hungry && oc get pod hungry -o jsonpath='{.status.containerStatuses[0].lastState.terminated.reason} exit={.status.containerStatuses[0].lastState.terminated.exitCode}{\"\\n\"}'"
      highlight: ["OOMKilled", "137"]
      notice: |
        The status says it directly: `OOMKilled`, with 2 restarts in about 30 seconds. The kernel killed the
        container, the kubelet restarted it, and it was killed again. The last termination reads `OOMKilled
        exit=137`: the kernel's out-of-memory killer, with SIGKILL. A container that keeps failing like this
        waits longer and longer between restarts, and its status shows `CrashLoopBackOff` while it waits.
    - kind: ask
      id: fix-oom
      prompt: "An application with a 64Mi limit is `OOMKilled` at every start, and it needs about 200 MB. What do you change first?"
      choices:
        - text: "Its memory limit, to what it really needs"
          why: "Here the evidence is a limit far below what it uses. Measure what it needs and set the limit (and request) to that, or fix a leak. In general, OOMKilled can also come from a node short of memory, so compare the limit, the usage and the node's events first."
        - text: "Its CPU limit"
          why: "CPU limits only slow a program down. The kill came from memory."
        - text: "Delete the pod to clear it"
          why: "The new pod has the same limit and is killed the same way."
      answer: 0
    - kind: teach
      id: qos
      title: "Who goes first when the node runs short"
      body: |
        From its requests and limits, each pod gets a **QoS class** (quality of service), computed once at
        creation:

        - **Guaranteed**: every container has CPU and memory limits, with requests equal to them (when only
          limits are written, the requests default to them);
        - **BestEffort**: no requests or limits at all;
        - **Burstable**: everything in between.

        When a node runs short of memory, its kubelet removes pods to protect it, an **eviction**. It considers
        first the pods using more than they requested, then pod priority. The QoS class helps estimate the
        risk (a BestEffort pod requests nothing, so any use is above its request), but it is not the sorting
        key. `plain.yaml` describes a pod with no resources at all.
    - kind: show
      id: show-qos
      run: "oc apply -f plain.yaml >/dev/null && oc get pods -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass"
      notice: |
        `limited` has only limits, so its requests default to them: **Guaranteed**. `plain` has nothing:
        **BestEffort**. `too-big` (a CPU request only) and `hungry` (memory only): **Burstable**.
    - kind: ask
      id: predict-qos
      prompt: "A container has `requests: {cpu: 100m, memory: 64Mi}` and `limits: {memory: 128Mi}`. Its QoS class?"
      choices:
        - text: "Burstable"
          why: "It has requests, but they are not all equal to limits (and there is no CPU limit), so it is neither of the other two."
        - text: "Guaranteed"
          why: "Guaranteed needs CPU and memory limits, with requests equal to them. Here the memory request is lower and there is no CPU limit."
        - text: "BestEffort"
          why: "BestEffort means no requests or limits at all. This one has both."
      answer: 0
    - kind: teach
      id: defaults
      title: "Defaults set by the administrator"
      body: |
        A container that declares nothing is BestEffort: the scheduler reserves nothing for it, and it is among
        the first to go when the node runs short of memory. A cluster administrator can prevent that with a
        **LimitRange** in the project: default requests and limits, filled into every container that leaves them
        out, at the moment its pod is created. The filling-in happens during **admission**: the checks that the
        API server runs on a new object, and that may complete it or refuse it, before storing it.

        It is a guardrail set for the project, not by it. `developer` administers this project, which they
        created.
    - kind: try
      id: try-can-i-limitrange
      body: "Ask whether you, `developer`, may create LimitRanges in this project."
      accept: ["oc auth can-i create limitranges", "oc auth can-i create limitrange", "oc auth can-i create limits"]
      hints:
        - match: "^oc (create|apply)"
          say: "That would try it for real. `oc auth can-i` asks the same question without doing anything."
        - match: "^oc auth can-i limit"
          say: "The verb comes first: `oc auth can-i create`, then the resource."
        - match: "^oc auth can-i create quotas?|resourcequota"
          say: "A quota caps a project's totals; the defaults are a LimitRange. Ask about `limitranges`."
      hint: "`oc auth can-i`, the verb `create`, then the resource `limitranges`."
      run: "oc auth can-i create limitranges"
      then: |
        `no`. The project's `admin` role, which `developer` holds here, may read LimitRanges and ResourceQuotas
        but not write them: otherwise every team could lift its own guardrails.
    - kind: show
      id: admin-limitrange
      body: |
        The cluster administrator creates one in this project, from the file `lab-defaults.yaml`: default
        requests of 50m CPU and 64Mi, default limits of 250m and 128Mi. The administrator names the project with
        `-n`, `academy-lesson-b-resources-qos`, the temporary project of this recording (on your own cluster, the
        name of your project):
      run: "oc create -f lab-defaults.yaml -n academy-lesson-b-resources-qos && oc describe limitrange lab-defaults -n academy-lesson-b-resources-qos"
      notice: |
        `limitrange/lab-defaults created`, then one row per resource for containers: the `Default Request` and
        `Default Limit` columns hold the values from the file. `Min` and `Max` are `-`: this LimitRange only
        supplies defaults, it refuses nothing.
    - kind: ask
      id: guess-defaults
      guess: true
      prompt: "`plain`, created earlier with no resources, still runs. Now `developer` creates `plain-2`, also with no resources. Their QoS classes?"
      choices:
        - text: "Both Burstable"
          why: "The defaults are filled in when a pod is created. See the next step."
        - text: "`plain` BestEffort, `plain-2` Burstable"
          why: "See the next step."
        - text: "Both BestEffort"
          why: "`plain-2` declares nothing, but the LimitRange fills in what it leaves out. See the next step."
      answer: 1
    - kind: show
      id: show-defaults
      body: "`oc run` creates a single pod; everything after `--` is its command. Then both pods' QoS class, requests and limits, and the note the admission plugin left on the new pod:"
      run: "oc run plain-2 --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity >/dev/null && oc get pods plain plain-2 -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass,REQUESTS:.spec.containers[0].resources.requests,LIMITS:.spec.containers[0].resources.limits && oc get pod plain-2 -o jsonpath='{.metadata.annotations.kubernetes\\.io/limit-ranger}{\"\\n\"}'"
      highlight: ["BestEffort", "Burstable"]
      notice: |
        `plain` is unchanged: BestEffort, no requests, no limits. `plain-2`, from the same image and command,
        received the defaults (requests 50m and 64Mi, limits 250m and 128Mi) and is Burstable, because its
        requests are lower than its limits. The annotation names the admission plugin, LimitRanger, and what it
        set. A LimitRange acts only when a pod is created: running pods keep what they have until they are
        replaced.
    - kind: order
      id: order-life
      prompt: "Put these in the order they can happen to a pod."
      items:
        - "The scheduler checks its requests against what is unreserved"
        - "The kubelet starts it with its limits in a cgroup"
        - "The kernel kills it for going over its memory limit"
        - "The kubelet restarts the container, and it counts a restart"
      why: "Requests act before the pod runs, limits while it runs. That is why a request problem shows as Pending, with no logs, and a limit problem as restarts with exit status 137."
    - kind: reflect
      id: explain-two
      prompt: "Two pods are not running: one is Pending with the event `Insufficient cpu`, the other restarts with OOMKilled. Why do they need different fixes?"
      model: |
        Pending alone does not identify the cause: I would check whether the pod has a node and read its events.
        Here the event says `Insufficient cpu`, so the pod was never placed: its requests are more than any
        node has unreserved, and the fix is a smaller request or more capacity. The OOMKilled pod was placed and
        started, then killed for memory. After comparing its limit, usage and the node's events, the fix is a
        limit that matches what it really uses, or a fix for a leak.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can say what a request does (a reservation the scheduler checks) and what a limit does (a ceiling
        the kernel enforces), read both in a container's cgroup files, predict a QoS class, say what an
        administrator's LimitRange defaults change and what they leave alone, and tell a pod that cannot be
        scheduled from one killed for its memory.

        Quotas, which cap a project's totals, and LimitRange bounds come with the lessons on governance. The
        incidents [Pending forever](/lab/inc.pending-resources) and
        [OOMKilled at start-up](/lab/inc.oomkilled) let you diagnose both cases on your own.

        Next: [Init containers and sidecars](/lesson/o3.init-sidecars), pods with more than one container, and
        what the scheduler reserves for them.
  sections:
    - id: more-resources
      title: "Autoscaling, eviction details, quotas"
      depth: true
      body: |
        **Autoscaling needs requests.** An HPA with a CPU **Utilization** target computes a percentage of each
        pod's request, so without requests it cannot work. It also needs the resource metrics API
        (`metrics.k8s.io`, served on OpenShift by the monitoring stack); without it, its current value shows
        `<unknown>`. The HPA owns the replica count: a later `oc scale`, or a manifest that sets `replicas`, is
        overwritten. Pod autoscaling adds no nodes: replicas that do not fit stay Pending until a cluster
        autoscaler reacts.

        **Eviction, precisely.** The kubelet does not rank pods by QoS class directly. It evicts first the
        pods whose usage exceeds their requests, ordered by priority, then by how far above the request they
        are. Its default hard thresholds include `memory.available<100Mi`, `nodefs.available<10%` and
        `imagefs.available<15%`. If memory runs out before the kubelet reacts, the kernel's OOM killer picks a
        victim, using OOM score adjustments derived from the QoS class (-997 for Guaranteed, 1000 for
        BestEffort). An OOM kill can also come from node-wide memory exhaustion, so `OOMKilled` alone does not
        prove that the container exceeded its own limit. OOMKilled restarts a container inside the same pod; eviction removes the whole pod
        (`Failed`, reason `Evicted`), and its controller creates a new one.

        **Quotas and LimitRanges.** A **ResourceQuota** caps a project's totals, and a **LimitRange** sets
        per-container defaults and bounds; administrators set both. When a quota tracks CPU or memory, every
        container must end up with those values (declared, or filled in by a LimitRange default), or the pod
        is refused. For a Deployment's pods the refusal is a `FailedCreate` event on the ReplicaSet, since no
        pod exists to carry it; a pod created directly is refused with an error. When a LimitRange sets only
        `default` (a limit), the request defaults to that same value. See
        [Quotas and LimitRanges](/lesson/o2.quotas-limits).

        **Measuring real use.** Requests and limits should come from measured use, not from guesses. On a cluster
        with the monitoring stack, `oc adm top pods` prints each pod's current CPU and memory, and the console's
        Observe pages keep the history. OpenShift Local runs without it, so there the command fails with `Metrics
        API not available`: size from the application's own figures, then confirm with the evidence above
        (restarts, `OOMKilled`, `Insufficient cpu`).

        **Common mistakes.** Removing requests to make a pod schedule hides a capacity problem. Explaining
        Pending with usage graphs: scheduling uses requests (`oc describe node`, "Allocated resources", for
        those allowed to read nodes). Setting a memory limit equal to the heap size leaves no room for threads,
        buffers and the runtime itself. Tight CPU limits on latency-sensitive services cause slow responses
        even on an idle node.
  review:
    - q: "What does the scheduler compare a pod's requests with?"
      a: "What is still unreserved on each node: allocatable capacity minus the requests of the pods already there. Not actual usage."
    - q: "What happens to a container at its CPU limit? Over its memory limit?"
      a: "CPU: it is throttled, never killed. Memory: if memory cannot be reclaimed enough, the kernel may kill it (OOMKilled, exit status 137)."
    - q: "Where does a container's memory limit appear on cgroup v2?"
      a: "In /sys/fs/cgroup/memory.max, in bytes (`max` without a limit). The CPU limit is in cpu.max, as quota and period."
    - q: "What are the three QoS classes and their rules?"
      a: "Guaranteed: CPU and memory limits with requests equal to them. BestEffort: no requests or limits. Burstable: anything else."
    - q: "A pod is Pending with `Insufficient cpu`. Are there logs to read?"
      a: "No: it was never placed on a node, so no container was started. The scheduler's events explain it."
    - q: "An administrator adds a LimitRange with default requests and limits to a project. What happens to a new pod that declares none, and to the pods already running?"
      a: "The new pod receives the defaults when it is created (so it is no longer BestEffort). Running pods are not changed until they are replaced."
  commands:
    - cmd: "oc apply -f too-big.yaml && sleep 10 && oc get pod too-big && oc get events --field-selector involvedObject.name=too-big -o custom-columns=REASON:.reason,MESSAGE:.message"
      meaning: "a request no node can satisfy: Pending, Insufficient cpu"
    - cmd: "oc apply -f limited.yaml && oc wait --for=condition=Ready pod/limited --timeout=180s >/dev/null && oc exec limited -- cat /sys/fs/cgroup/memory.max"
      meaning: "the memory limit, in the cgroup file"
      timeout: 210
    - cmd: "oc exec limited -- cat /sys/fs/cgroup/cpu.max"
      meaning: "the CPU limit, as quota and period"
    - cmd: "oc apply -f hungry.yaml && sleep 30 && oc get pod hungry && oc get pod hungry -o jsonpath='{.status.containerStatuses[0].lastState.terminated.reason} exit={.status.containerStatuses[0].lastState.terminated.exitCode}{\"\\n\"}'"
      meaning: "over the memory limit: OOMKilled, exit 137"
    - cmd: "oc apply -f plain.yaml >/dev/null && oc get pods -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass"
      meaning: "each pod's QoS class"
    - cmd: "oc auth can-i create limitranges"
      meaning: "a project administrator may not create LimitRanges"
      expect: fail
    - cmd: "oc create -f lab-defaults.yaml -n academy-lesson-b-resources-qos && oc describe limitrange lab-defaults -n academy-lesson-b-resources-qos"
      as: admin
      meaning: "the cluster administrator gives the project default requests and limits"
    - cmd: "oc run plain-2 --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity >/dev/null && oc get pods plain plain-2 -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass,REQUESTS:.spec.containers[0].resources.requests,LIMITS:.spec.containers[0].resources.limits && oc get pod plain-2 -o jsonpath='{.metadata.annotations.kubernetes\\.io/limit-ranger}{\"\\n\"}'"
      meaning: "a new pod receives the defaults; the running one does not"
  experiment:
    id: X-QOS-01
    objective: "The cluster administrator gives the lesson's temporary project default container requests and limits with a LimitRange; the ordinary user developer, who administers that project, cannot create one, and sees a running pod keep its BestEffort class while a new pod receives the defaults. The rollback deletes the LimitRange; the recorder then deletes the temporary project."
    changes:
      - "LimitRange lab-defaults in academy-lesson-b-resources-qos, the lesson's temporary project (created by the administrator, deleted by the rollback; the project and its pods are deleted by the recorder afterwards)"
    preflight:
      - {cmd: "oc get project academy-lesson-b-resources-qos -o name"}
      - {cmd: "oc get limitrange lab-defaults -n academy-lesson-b-resources-qos", expect: fail}
      - cmd: |-
          names=$(oc get limitranges,resourcequotas -n academy-lesson-b-resources-qos -o name) || exit 1
          test -z "$names"
    snapshot:
      - "oc get limitranges,resourcequotas -A -o json | jq -S '[.items[] | {kind,namespace:.metadata.namespace,name:.metadata.name,spec}] | sort_by(.kind,.namespace,.name)'"
      - "oc get project academy-lesson-b-resources-qos -o name"
    rollback:
      - "oc delete limitrange lab-defaults -n academy-lesson-b-resources-qos --ignore-not-found"
    verify:
      - cmd: |-
          names=$(oc get limitranges,resourcequotas -n academy-lesson-b-resources-qos -o name) || exit 1
          test -z "$names"
  references:
    - {title: "Kubernetes: Resource management for pods and containers", url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"}
    - {title: "Kubernetes: Pod QoS classes", url: "https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/"}
    - {title: "Kubernetes: Node-pressure eviction (eviction order, OOM scores)", url: "https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/"}
    - {title: "Kubernetes: Horizontal Pod Autoscaling", url: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"}
    - {title: "Kubernetes: Resource quotas", url: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"}
    - {title: "Linux kernel documentation: Control Group v2 (memory.max, cpu.max)", url: "https://docs.kernel.org/admin-guide/cgroup-v2.html"}
- id: o1.config-secrets
  title: "Configuration with ConfigMaps and Secrets"
  subtitle: "Settings outside the image, as variables or as files, and what each does when the settings change"
  module: a4-config-storage
  mode: REAL_LAB
  minutes: 32
  level: 2
  supports: "Kubernetes 1.34 ConfigMaps and Secrets on OpenShift 4.21 with oc 4.21. Recorded on OpenShift Local as an ordinary user, in a temporary project."
  concepts: [sec.secrets, k8s.pod-lifecycle]
  prerequisites: [o1.deploy-apps, f0.linux-essentials]
  labs: [lab.config-secrets, ch.ship-web-app, inc.configmap-missing]
  record_on: cluster
  files:
    needs-config.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: needs-config
      spec:
        selector:
          matchLabels: {app: needs-config}
        template:
          metadata:
            labels: {app: needs-config}
          spec:
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              env:
              - name: DB_URL
                valueFrom:
                  configMapKeyRef:
                    name: db-config
                    key: DB_URL
  objective: |
    Keep settings out of the image in a ConfigMap, give them to a pod as environment variables or as files,
    predict what each does when the ConfigMap changes, store credentials in a Secret knowing who can read it,
    and recognise the error of a pod whose configuration is missing.
  flow:
    - kind: ask
      id: recall-env
      recalls: f0.linux-essentials
      prompt: "A look back. A program is running, and an environment variable it uses is changed elsewhere. Does it see the new value?"
      choices:
        - text: "No, not until it is restarted"
          why: "A program receives a copy of its environment when it starts. Later changes elsewhere never reach that copy."
        - text: "Yes, at once"
          why: "The environment is copied into the program when it starts. Nothing updates that copy afterwards."
        - text: "Yes, at its next read"
          why: "The program reads its own copy, made at start. Rereading it gives the same old value."
      answer: 0
    - kind: teach
      id: why
      title: "One image, many settings"
      body: |
        The same image should run in development, in testing and in production. Only its settings differ: the
        database address, the log level, a password. If those are written into the image, every change is a
        new build, and the password travels with the image to every registry that stores it.

        Kubernetes keeps them in two kinds of objects, both sets of named **keys** with a value each:

        - a **ConfigMap** for ordinary settings;
        - a **Secret** for credentials, keys and certificates.

        A pod can receive them in two ways, as environment variables or as files, and the two behave very
        differently when the settings change. That difference is most of this lesson.
    - kind: show
      id: create-cm
      body: "A ConfigMap with two keys, each given on the command line with `--from-literal`:"
      run: "oc create configmap app-config --from-literal=LOG_LEVEL=info --from-literal=FEATURE_X=on; oc get configmap app-config -o jsonpath='{.data}{\"\\n\"}'"
      notice: "Two keys, two values. `--from-file=<file>` does the same with a file: the file's name becomes the key, and its content the value."
    - kind: show
      id: console-configmap
      body: "A ConfigMap in the web console (a demo `web-config` in another project of the same cluster): its keys and values are on its page."
      image:
        src: configmap.png
        alt: "The details of the ConfigMap web-config, and below them its Data section with the keys GREETING, value Hello from a ConfigMap, and LOG_LEVEL, value info."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "Workloads > ConfigMaps > web-config"
    - kind: ask
      id: from-file-key
      prompt: "You run `oc create configmap web --from-file=index.html`. What is the key?"
      choices:
        - text: "`index.html`"
          why: "The file's name becomes the key, and its whole content the value. `--from-file=home=index.html` would choose the key `home`."
        - text: "`web`"
          why: "`web` is the ConfigMap's name. Its keys come from what you give it: here, one file."
        - text: "`data`"
          why: "`data` is the field that holds all the keys in the YAML. The key itself comes from the file's name."
      answer: 0
    - kind: show
      id: deploy
      body: "A program to give them to: a Deployment whose container only waits, so that we can look inside it."
      run: "oc create deployment settings --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/settings --timeout=180s"
    - kind: teach
      id: as-env
      title: "As environment variables"
      body: |
        `oc set env --from=configmap/<name>` adds one environment variable per key to the Deployment's pod
        template. Changing the template starts a rollout, so new pods start with the variables set.
    - kind: show
      id: show-env
      run: "oc set env deployment/settings --from=configmap/app-config; oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- printenv LOG_LEVEL FEATURE_X"
      notice: "Both keys arrived as variables, with the same names. `oc exec` ran `printenv` inside the new pod."
    - kind: show
      id: console-env
      body: "The console shows where a pod's variables come from on its **Environment** tab. Here a demo pod reads all of `web-config`:"
      image:
        src: pod-notes-env.png
        alt: "The Environment tab of the pod notes for the container app: a note that the variables are set from the parent ReplicaSet, no single values, and under All values from existing ConfigMaps or Secrets (envFrom) the entry web-config - ConfigMap."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "A pod's Environment tab"
      notice: "*envFrom* takes every key of the ConfigMap as a variable. The fields are greyed: a pod's environment comes from its owner, so you edit it on the Deployment."
    - kind: ask
      id: which-pod
      prompt: "What happened to the pod that was running before `oc set env`?"
      choices:
        - text: "A new pod replaced it"
          why: "The variables are part of the pod template. A new template means a rollout: new pods with the variables, and the old one removed."
        - text: "It got the new variables"
          why: "A running container's environment never changes. The Deployment replaced the pod instead."
        - text: "It keeps running alongside"
          why: "The Deployment keeps one replica, from the current template. The old pod was removed once the new one was ready."
      answer: 0
    - kind: teach
      id: as-files
      title: "As files"
      body: |
        The same ConfigMap can also appear as a directory of files, one file per key, named after the key. This
        is a **volume**, mounted at a path in the container. Applications that read a configuration file use
        this form, and values that span several lines, such as certificates, fit it better.
    - kind: show
      id: show-volume
      run: "oc set volume deployment/settings --add --type=configmap --configmap-name=app-config --mount-path=/etc/app; oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- ls /etc/app"
      notice: "One file per key under `/etc/app`. This was also a change to the template, so another rollout."
    - kind: try
      id: try-cat
      body: "Show the content of the file `LOG_LEVEL` in the Deployment `settings`'s pod."
      accept: ["oc exec deploy/settings -- cat /etc/app/LOG_LEVEL", "oc exec deployment/settings -- cat /etc/app/LOG_LEVEL"]
      hints:
        - match: "^cat "
          say: "That would read a file on this machine. The file is inside the pod: run `cat` there with `oc exec deploy/settings --`."
        - match: "^oc exec (deploy|deployment)/settings cat"
          say: "Put `--` before the command to run in the container, so that `oc` does not read its options as its own."
        - match: "printenv"
          say: "`printenv` shows the variable. The task is the file under `/etc/app`."
        - match: "^oc exec settings"
          say: "`settings` is the Deployment, not a pod name. Write `deploy/settings` and `oc` picks one of its pods."
      hint: "`oc exec deploy/settings --`, then `cat` and the file's path."
      run: "oc exec deploy/settings -- cat /etc/app/LOG_LEVEL"
      then: "`info`, the value of the key. (The value has no line break at its end, so the output stops right after it.)"
    - kind: ask
      id: guess-change
      guess: true
      prompt: "`LOG_LEVEL` is changed to `debug` in the ConfigMap. After the update has reached the pod, what do its file and variable show?"
      choices:
        - text: "Both show `debug` by then"
          why: "Think back to the first question of this lesson. See the next step."
        - text: "File `debug`, variable `info`"
          why: "See the next step."
        - text: "Both still show `info`"
          why: "The variable does stay, but the file is a different mechanism. See the next step."
      answer: 1
    - kind: show
      id: show-change
      body: "`oc set data` changes one key of the ConfigMap. The kubelet refreshes mounted files periodically, so the command checks the file every 5 seconds, for at most 200 seconds:"
      run: "oc set data configmap/app-config LOG_LEVEL=debug; for i in $(seq 1 40); do [ \"$(oc exec deploy/settings -- cat /etc/app/LOG_LEVEL)\" = debug ] && break; sleep 5; done; echo \"file changed at poll $i (polls are 5 seconds apart)\"; echo \"file: $(oc exec deploy/settings -- cat /etc/app/LOG_LEVEL)\"; echo \"variable: $(oc exec deploy/settings -- printenv LOG_LEVEL)\""
      highlight: ["file: debug", "variable: info"]
      notice: |
        The file followed the ConfigMap at poll 17, about 80 seconds after the change; the variable did not. That
        delay is an observation, not a deadline: it depends on the kubelet's periodic refresh and its cache, and
        varies from one run to the next, which is why the command polls with a limit instead of sleeping a fixed
        time. Nothing about the pod changed: the kubelet rewrote the files of the
        volume, but the program's environment was copied when it started, as for any Linux program.
    - kind: teach
      id: restart
      body: |
        Most programs read their settings once, at start, from variables or files. In practice, a change to a
        ConfigMap is followed by `oc rollout restart`, which replaces the pods through a normal rollout. New
        pods start with the new values.
    - kind: try
      id: try-restart
      body: "Restart the pods of the Deployment `settings`."
      accept: ["oc rollout restart deployment/settings", "oc rollout restart deploy/settings", "oc rollout restart deployment settings", "oc rollout restart deploy settings"]
      hints:
        - match: "^oc delete pod"
          say: "That works for one pod, but `oc rollout restart` replaces all of them gradually, keeping the application available."
        - match: "^oc restart"
          say: "`oc` has no restart command of its own. A restart is a kind of rollout: `oc rollout restart`."
        - match: "^oc rollout (deployment|deploy)"
          say: "After `oc rollout` comes the action, `restart`, then the Deployment."
      hint: "`oc rollout`, then the action, then `deployment/settings`."
      run: "oc rollout restart deployment/settings"
    - kind: show
      id: after-restart
      run: "oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- printenv LOG_LEVEL"
      notice: "`debug`: the new pod copied the current value when it started."
    - kind: explore
      id: diagram
      diagram: config-injection
      body: "The two paths you watched above, in one picture. Select the kubelet, then the variables and the files, to see when each one takes a change into account, and what `oc rollout restart` does. A Secret reaches the container the same two ways."
    - kind: teach
      id: secrets
      title: "Secrets, and who can read them"
      body: |
        A Secret works like a ConfigMap: keys, given to pods as variables or files. The difference is in how
        the cluster treats it, not in strong protection. Its values are stored **base64-encoded** in the object,
        which is an encoding, not encryption: anyone allowed to read the Secret object can read the values.
        Whether the cluster also encrypts its storage (encryption at rest) is a separate setting.
    - kind: show
      id: show-secret
      run: "oc create secret generic db --from-literal=DB_PASSWORD=lab-only-password; oc get secret db -o jsonpath='{.data.DB_PASSWORD}{\"\\n\"}'; oc extract secret/db --to=-"
      highlight: ["lab-only-password"]
      notice: |
        The stored value is base64, and `oc extract` decodes it in one command, for anyone allowed to read
        the Secret. What protects it is who has that permission, and keeping Secret values out of Git.
      understand:
        purpose: Creates a Secret with one key, prints its value as the API returns it, then decodes it with `oc extract`.
        parts:
          - text: generic
            means: A Secret of the default type, `Opaque`, made of your own keys (as opposed to `tls` or `docker-registry`).
          - text: --from-literal=DB_PASSWORD=lab-only-password
            means: One key, `DB_PASSWORD`, with the value written on the command line.
          - text: '{.data.DB_PASSWORD}'
            means: The value in the Secret's `data` field, base64-encoded, as every reader of the object receives it.
          - text: --to=-
            means: Writes each key's decoded content to standard output (and the key names to the error stream) instead
              of creating one file per key.
        caution: A value written with `--from-literal` is part of the command line, so it is saved in your shell history.
          For a real credential, use `--from-file` with a file you delete afterwards.
        concepts:
          - sec.secrets
        refs:
          - title: 'Kubernetes: Managing Secrets using kubectl'
            url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
          - title: 'Kubernetes: Secrets (Opaque, base64)'
            url: https://kubernetes.io/docs/concepts/configuration/secret/
          - title: OpenShift 4.21 CLI reference (oc extract)
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-extract
    - kind: teach
      id: default-roles
      body: |
        Access in a project is given through **roles**. Two default ones matter here. `view` lets a user read
        most objects of the project, but deliberately not Secrets. `edit` lets a user change most objects and
        read Secrets. Permissions add up, so another grant could allow more; `oc auth can-i get secret/db`
        shows what a user ends up with. The next question assumes that the roles named are the only relevant
        grants. The roles themselves are taught on the administration path.
    - kind: ask
      id: who-reads
      prompt: "In a project, Ana has only the `view` role and Ben only `edit`. Who can read the value of Secret `db`?"
      choices:
        - text: "Only Ben"
          why: "`edit` includes Secrets. `view` deliberately does not, which makes it the role for people who must not see credentials."
        - text: "Both of them"
          why: "`view` lets Ana read most objects in the project, but not Secrets."
        - text: "Neither: values are encrypted"
          why: "The values are only base64-encoded in the object. Anyone allowed to read the Secret decodes them in one command, whether or not storage is encrypted."
      answer: 0
    - kind: show
      id: console-secret
      body: "A Secret in the web console (a demo `web-secret`, holding a made-up value):"
      image:
        src: secret.png
        alt: "The details of the Secret web-secret, type Opaque, and its Data section with the key API_KEY and its value hidden as dots, with a Reveal values link at the right."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20; the value was not revealed"
      caption: "Workloads > Secrets > web-secret"
      notice: "The value is hidden until someone chooses **Reveal values**, but hiding is only a display choice: anyone the API lets read the Secret can reveal it, or read it with `oc extract`."
    - kind: teach
      id: secret-use
      body: |
        A pod receives a Secret the same way it receives a ConfigMap. `oc set env --from=secret/<name>` adds
        a variable for each key of the Secret to the pod template, which starts a rollout again. The Secret
        `db` here holds a disposable lab password, never a real one.
    - kind: try
      id: try-secret-env
      body: "Give the Secret `db` to the Deployment `settings` as environment variables."
      accept: ["oc set env deployment/settings --from=secret/db", "oc set env deploy/settings --from=secret/db", "oc set env deployment settings --from=secret/db", "oc set env deploy settings --from=secret/db", "oc set env deployment/settings --from secret/db", "oc set env deploy/settings --from secret/db"]
      hints:
        - match: "--from=configmap"
          say: "That is the ConfigMap form. The source here is a Secret: `--from=secret/db`."
        - match: "^oc create"
          say: "The Secret `db` already exists. The task is to give it to the Deployment with `oc set env`."
        - match: "^oc set env (deployment|deploy)[ /]settings$"
          say: "Say where the variables come from: `--from=secret/db`."
      hint: "The same command as for the ConfigMap, with `--from=secret/db`."
      run: "oc set env deployment/settings --from=secret/db"
      then: "The template changed, so a new rollout starts. Next, check the result without printing the password."
    - kind: show
      id: show-secret-env
      run: "oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- sh -c 'test -n \"$DB_PASSWORD\" && echo DB_PASSWORD is set'; oc set env deployment/settings --list | grep DB_PASSWORD"
      highlight: ["is set", "from secret db"]
      notice: |
        `DB_PASSWORD is set`: the variable exists in the container, and the command printed only a message, not
        the value. The last line comes from `oc set env --list`: the Deployment holds a reference ("from secret
        db, key DB_PASSWORD"), not a copy of the password. The same mechanism as for a ConfigMap, with a
        Secret as the source.
    - kind: teach
      id: missing
      title: "When the configuration is missing"
      body: |
        A pod that refers to a ConfigMap, Secret or key that does not exist cannot start its container: the
        kubelet would not know what value to give it. The file `needs-config.yaml` describes a Deployment whose
        variable `DB_URL` comes from the key `DB_URL` of a ConfigMap `db-config`, which nobody created:
    - kind: show
      id: show-ref
      run: "grep -A5 'env:' needs-config.yaml"
      notice: |
        `DB_URL` comes from the key `DB_URL` of the ConfigMap `db-config` (`configMapKeyRef`). The API server
        stores a Deployment without checking that what it refers to exists: the problem shows only when a pod
        tries to start its container.
    - kind: show
      id: show-missing
      run: "oc apply -f needs-config.yaml; sleep 20; oc get pods -l app=needs-config; oc get events --field-selector reason=Failed -o custom-columns=OBJECT:.involvedObject.name,MESSAGE:.message"
      highlight: ["CreateContainerConfigError"]
      notice: |
        `CreateContainerConfigError`: the container was never created, so there are no logs. The pod's `Failed`
        event (also at the end of `oc describe pod`) names what is missing: `configmap "db-config" not found`.
        Running pods are not affected when a ConfigMap is deleted, which is why such a mistake often appears
        only at the next rollout, days later.

        The repair is the missing object: create the ConfigMap with the key the pod expects. The kubelet keeps
        retrying, so the same pod then starts, with no rollout. Verify as after any fix: the pod is `Running` and
        `1/1`, and `oc exec … -- printenv DB_URL` prints the value. If instead the name in the Deployment is
        wrong, correcting it changes the template and starts a rollout.
    - kind: order
      id: order-change
      prompt: "An application reads `LOG_LEVEL` from its environment. Put the steps to change it in order."
      items:
        - "Change the key in the ConfigMap"
        - "`oc rollout restart` the Deployment"
        - "Wait for the rollout to finish"
        - "Check the value in a new pod with `oc exec … -- printenv`"
      why: "The ConfigMap holds the value, but only a new pod copies it into its environment; checking before the rollout ends may show an old pod."
    - kind: reflect
      id: explain-two
      prompt: "Explain to a colleague why the mounted file showed the new value but the variable did not."
      model: |
        Both came from the same ConfigMap. The file is part of a volume, which the kubelet keeps up to date
        while the pod runs. The variable was copied into the program's environment when the container started,
        and nothing changes a running program's environment. Only a new pod, after a restart, gets the new value
        as a variable.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can create a ConfigMap and a Secret, give them to a pod as variables or files, predict what each
        does when the data changes, restart pods to apply a change, say who can read a Secret, and recognise a
        pod that waits for missing configuration.

        Next: storage that survives a pod, with persistent volumes. The [configuration lab](/lab/lab.config-secrets)
        and the incident [CreateContainerConfigError](/lab/inc.configmap-missing) let you practise these on
        your own.
  sections:
    - id: more-config
      title: "More ways to create, consume and roll out configuration"
      depth: true
      body: |
        **Creating.** `--from-file=<file>` (key = file name), `--from-file=<key>=<file>`, `--from-file=<dir>/`
        (one key per regular file; subdirectories ignored), `--from-env-file=app.env` (one key per `KEY=value`
        line). Secrets use the same flags after a type: `oc create secret generic`, `oc create secret tls
        --cert=… --key=…`, `oc create secret docker-registry` for registry credentials. In YAML, Secret values
        sit base64-encoded under `data`, or in plain text under `stringData`, which the server encodes. Each
        object is limited to 1 MiB.

        **The shapes in a pod spec.**

        | Shape | Pod spec | The container gets |
        |---|---|---|
        | All keys as variables | `envFrom: [{configMapRef: {name: y}}]` (or `secretRef`) | one variable per key |
        | One key, own name | `env[].valueFrom.configMapKeyRef` (or `secretKeyRef`) | one variable |
        | All keys as files | a `configMap` volume mounted at a directory | one file per key |
        | Chosen keys and file names | the volume's `items: [{key, path}]` | only those files |
        | One file into an existing directory | `volumeMounts[].subPath` | a single file, **never updated** afterwards |

        `oc set env --from=configmap/y` writes one `env` entry per key that exists *at that moment*: keys added
        later are not picked up. A variable defined in `env` wins over the same name from `envFrom`; `oc set
        env deploy/x --list` shows them all.

        **A mount hides what was there.** A volume mounted at `/etc/httpd/conf.d` hides the files the image
        shipped in that directory. To add one file next to them, mount a single key with `subPath`, and accept
        that it will not update.

        **Rolling out configuration as versions.** `oc rollout restart` records no configuration revision.
        Giving each version a new name (Kustomize's `configMapGenerator` appends a content hash) makes each
        change a normal rollout that `oc rollout undo` can reverse. `immutable: true` forbids any later change
        to the data.

        **Missing references.** As variables: `CreateContainerConfigError`. As a volume: the pod stays
        `ContainerCreating`, with `FailedMount` events. `optional: true` lets the pod start without it, only
        for applications with safe defaults.

        **Who can read a Secret.** Anyone with `get`, `list` or `watch` on secrets in the project (`admin`,
        `edit`, cluster administrators); anyone who can create pods there, by mounting it; workloads running
        as a ServiceAccount allowed to read it. Check with `oc auth can-i get secrets`. etcd encryption at rest
        is not enabled by default on OpenShift: an administrator turns it on.
  review:
    - q: "A ConfigMap used as environment variables changes. When does the program see the new value?"
      a: "Only in a new pod: the environment is copied at start. `oc rollout restart` the Deployment."
    - q: "The same ConfigMap is mounted as a volume (no subPath). What happens to the files?"
      a: "The kubelet updates them in place after a delay, without a restart. A subPath mount never updates."
    - q: "Does base64 in a Secret's `data` field protect it from someone allowed to read the object?"
      a: "No; base64 is reversible. Protection comes from RBAC and keeping it out of Git. Encryption at rest is a separate cluster setting."
    - q: "Which of the `view` and `edit` roles can read Secrets?"
      a: "`edit` (and `admin`). `view` cannot."
    - q: "What does a pod show when a ConfigMap key it uses as a variable does not exist?"
      a: "`CreateContainerConfigError`; the events name the missing ConfigMap or key."
  commands:
    - cmd: "oc create configmap app-config --from-literal=LOG_LEVEL=info --from-literal=FEATURE_X=on; oc get configmap app-config -o jsonpath='{.data}{\"\\n\"}'"
      meaning: "a ConfigMap with two keys"
    - cmd: "oc create deployment settings --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/settings --timeout=180s"
      meaning: "a pod to give the settings to"
    - cmd: "oc set env deployment/settings --from=configmap/app-config; oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- printenv LOG_LEVEL FEATURE_X"
      meaning: "keys as environment variables"
    - cmd: "oc set volume deployment/settings --add --type=configmap --configmap-name=app-config --mount-path=/etc/app; oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- ls /etc/app"
      meaning: "keys as files"
    - cmd: "oc exec deploy/settings -- cat /etc/app/LOG_LEVEL"
      meaning: "one key's file"
    - cmd: "oc set data configmap/app-config LOG_LEVEL=debug; for i in $(seq 1 40); do [ \"$(oc exec deploy/settings -- cat /etc/app/LOG_LEVEL)\" = debug ] && break; sleep 5; done; echo \"file changed at poll $i (polls are 5 seconds apart)\"; echo \"file: $(oc exec deploy/settings -- cat /etc/app/LOG_LEVEL)\"; echo \"variable: $(oc exec deploy/settings -- printenv LOG_LEVEL)\""
      meaning: "the file follows the ConfigMap, the variable does not"
      timeout: 300
    - cmd: "oc rollout restart deployment/settings"
      meaning: "replace the pods"
    - cmd: "oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- printenv LOG_LEVEL"
      meaning: "a new pod has the new value"
    - cmd: "oc create secret generic db --from-literal=DB_PASSWORD=lab-only-password; oc get secret db -o jsonpath='{.data.DB_PASSWORD}{\"\\n\"}'; oc extract secret/db --to=-"
      meaning: "base64 is an encoding: the value, decoded"
    - cmd: "oc set env deployment/settings --from=secret/db"
      meaning: "the Secret's keys as environment variables"
    - cmd: "oc rollout status deployment/settings --timeout=180s >/dev/null; oc exec deploy/settings -- sh -c 'test -n \"$DB_PASSWORD\" && echo DB_PASSWORD is set'; oc set env deployment/settings --list | grep DB_PASSWORD"
      meaning: "the variable exists in the pod, checked without printing it"
    - cmd: "grep -A5 'env:' needs-config.yaml"
      meaning: "a variable taken from a ConfigMap that does not exist"
    - cmd: "oc apply -f needs-config.yaml; sleep 20; oc get pods -l app=needs-config; oc get events --field-selector reason=Failed -o custom-columns=OBJECT:.involvedObject.name,MESSAGE:.message"
      meaning: "CreateContainerConfigError, and the event naming the missing ConfigMap"
  references:
    - {title: "Kubernetes: ConfigMaps", url: "https://kubernetes.io/docs/concepts/configuration/configmap/"}
    - {title: "Kubernetes: Configure a Pod to use a ConfigMap", url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/"}
    - {title: "Kubernetes: Secrets", url: "https://kubernetes.io/docs/concepts/configuration/secret/"}
    - {title: "Kubernetes: Good practices for Secrets", url: "https://kubernetes.io/docs/concepts/security/secrets-good-practices/"}
    - {title: "Kubernetes: RBAC user-facing roles", url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles"}
    - {title: "OpenShift 4.21: Enabling etcd encryption", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/etcd/etcd-encrypt"}
- id: g.rollouts-change
  title: "Rollout strategies and change control"
  subtitle: "How a Deployment replaces its pods, where a bad release stops, and what an undo brings back"
  module: a6-images-updates
  mode: REAL_LAB
  minutes: 32
  level: 2
  supports: "Deployment RollingUpdate/Recreate in Kubernetes 1.34 with oc 4.21; progressDeadlineSeconds and the Progressing condition; canary and blue-green with Route weights or Argo Rollouts (an add-on in Red Hat OpenShift GitOps). Recorded on OpenShift Local as an ordinary user, in a temporary project."
  concepts: [deploy.strategies, k8s.rollout, change.control]
  prerequisites: [o1.deploy-apps, b.health-probes]
  labs: [lab.deployment-reconciliation, lab.images-builds, ch.slow-start, inc.broken-rollout]
  record_on: cluster
  files:
    web.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
        annotations:
          kubernetes.io/change-cause: "release 1"
      spec:
        replicas: 3
        selector:
          matchLabels: {app: web}
        template:
          metadata:
            labels: {app: web}
          spec:
            containers:
            - name: httpd-24
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              readinessProbe:
                tcpSocket: {port: 8080}
                periodSeconds: 5
  objective: |
    Predict how a rolling update replaces pods and where a broken release stops, read the Progressing
    condition, roll back knowing exactly what comes back, batch changes with pause and resume, choose a strategy
    for a situation, and write a rollback plan that can be acted on.
  flow:
    - kind: ask
      id: recall-rs
      recalls: o1.deploy-apps
      prompt: "A look back. Which change gives a Deployment a new ReplicaSet?"
      choices:
        - text: "A change to its pod template"
          why: "Image, environment, resources, probes: anything in the pod template starts a rollout to a new ReplicaSet."
        - text: "Any change, scaling included"
          why: "Scaling only changes a number on the current ReplicaSet. Only template changes create a new one."
        - text: "Only a new image"
          why: "The image is one field of the template among many. An environment variable or a probe does the same."
      answer: 0
    - kind: teach
      id: rolling
      title: "A rollout, one step at a time"
      body: |
        When the pod template changes, the Deployment does not replace every pod at once. With its default
        strategy, **RollingUpdate**, it moves pods from the old ReplicaSet to the new one in steps, within two
        bounds:

        - `maxSurge`: how many pods the rollout may run **above** the desired number (25% by default, rounded up);
        - `maxUnavailable`: how many of the desired pods may be **unavailable** (25% by default, rounded down).

        Pods that are already shutting down (terminating) are not counted in these bounds.

        A new pod counts as **available** once it is ready, which is why the readiness probe matters so much
        here. The recording creates a Deployment `web` from the file `web.yaml`: 3 replicas, a readiness probe on
        its port, and a note for the history saying `release 1`. Then release 2 changes an environment variable.
    - kind: ask
      id: guess-max
      guess: true
      prompt: "With 3 replicas and the defaults, how many pods that are not shutting down does the rollout allow at once, at most?"
      choices:
        - text: "4"
          why: "25% of 3 rounded up is 1 extra pod, and 25% rounded down is 0 unavailable: a new pod must be ready before an old one goes. Old pods still terminating are not counted, so for a short time the total can be higher. The next step shows the rollout."
        - text: "6"
          why: "That would be two full sets. `maxSurge` allows only 25% more, rounded up: 1 pod."
        - text: "3"
          why: "Then a pod would have to go before its replacement is ready, and `maxUnavailable` rounds down to 0. One extra pod is allowed instead."
      answer: 0
    - kind: show
      id: show-rollout
      run: "oc apply -f web.yaml >/dev/null; oc rollout status deployment/web --timeout=180s >/dev/null; oc set env deployment/web RELEASE=2 >/dev/null; oc annotate deployment/web kubernetes.io/change-cause='release 2: RELEASE=2' --overwrite >/dev/null; oc rollout status deployment/web --timeout=180s"
      notice: |
        `oc rollout status` follows the rollout as it happens: new pods are added one at a time, and each old
        pod goes only once a new one is ready. The output does not count ready pods; that follows from the
        settings: with 3 replicas, `maxUnavailable` (25%) rounds down to 0, so the rollout never goes below 3
        available pods. The
        `change-cause` annotation is a note for the history, used later in this lesson.
    - kind: teach
      id: broken
      title: "A release that cannot start"
      body: |
        Now release 3 points at an image tag that does not exist. The new pod cannot start, so it never becomes
        ready, and the rollout cannot take its next step.

        A Deployment has a **progress deadline**, `progressDeadlineSeconds` (600 seconds by default): if the
        rollout makes no progress for that long, the Deployment reports it. The recording lowers it to 30 seconds
        to see it happen.
    - kind: ask
      id: guess-users
      guess: true
      prompt: "While release 3 is stuck, what do the application's users get?"
      choices:
        - text: "Answers from the old pods"
          why: "See the next step."
        - text: "Errors: the old pods are stopped"
          why: "An old pod is removed only once a new one is ready, and none is. See the next step."
        - text: "Release 2, after an automatic rollback"
          why: "They do get release 2, but not because of a rollback: Kubernetes never undoes a rollout by itself. See the next step."
      answer: 0
    - kind: show
      id: show-stuck
      run: "oc patch deployment/web -p '{\"spec\":{\"progressDeadlineSeconds\":30}}' >/dev/null; oc set image deployment/web httpd-24=registry.access.redhat.com/ubi9/httpd-24:no-such-tag >/dev/null; oc annotate deployment/web kubernetes.io/change-cause='release 3: broken tag' --overwrite >/dev/null; sleep 50; oc get replicasets -l app=web; oc get pods -l app=web"
      highlight: ["ErrImagePull", "ImagePullBackOff"]
      notice: |
        Three ReplicaSets: release 1's at zero, release 2's still with 3 ready pods, and release 3's with one pod
        that cannot pull its image. The users are served by release 2, as before. The rollout is stuck half-way:
        nothing will move until someone acts. The new pod's events would read as in case 1 of [Why is my
        application not working?](/lesson/o1.troubleshooting), which used the same missing tag: `manifest
        unknown`.
    - kind: show
      id: show-condition
      body: "The Deployment's conditions, and `oc rollout status`, which is expected to fail now (exit status 1):"
      run: "oc get deployment/web -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}{\"\\n\"}{end}'; oc rollout status deployment/web --timeout=10s"
      highlight: ["ProgressDeadlineExceeded", "exceeded its progress deadline"]
      notice: |
        `Available=True`: enough pods serve. `Progressing=False` with reason `ProgressDeadlineExceeded`: no
        progress for 30 seconds. `oc rollout status` fails with the same message, which is what a pipeline can
        act on. Kubernetes only reports this; it does not roll back.
    - kind: try
      id: try-undo
      body: "Roll the Deployment `web` back to its previous revision."
      accept: ["oc rollout undo deployment/web", "oc rollout undo deploy/web", "oc rollout undo deployment web", "oc rollout undo deploy web"]
      hints:
        - match: "^oc rollout (rollback|revert)"
          say: "The action is called `undo`: `oc rollout undo`."
        - match: "--to-revision"
          say: "That works when you know the number. The task is the previous revision, which `undo` picks by default."
        - match: "^oc set image"
          say: "Setting the old image by hand would work, but you would have to know it. `oc rollout undo` brings back the previous template, whatever it contained."
        - match: "^oc rollout undo$"
          say: "Name the Deployment: `deployment/web`."
      hint: "`oc rollout`, the action `undo`, then the Deployment."
      run: "oc rollout undo deployment/web"
    - kind: show
      id: show-history
      run: "oc rollout status deployment/web --timeout=180s; oc patch deployment/web -p '{\"spec\":{\"progressDeadlineSeconds\":600}}' >/dev/null; oc rollout history deployment/web"
      highlight: ["release 2"]
      notice: |
        The rollout completed (and the deadline was put back to its default, 600 seconds). In the history,
        release 2 came back as a **new** revision, the highest number, and its old number, 2, is gone from the
        list: an undo is a new rollout of an old template. The
        `CHANGE-CAUSE` column is the annotation each revision carried; without it, the history is a list of
        numbers.
    - kind: explore
      id: rollout-model
      sim: rollout
      body: "This model replays the Deployment controller one decision at a time; it is not a cluster recording. With 4 replicas, the defaults allow one extra pod and one unavailable pod. Start the rollout to the broken image, step until the controller can do nothing more, and count the pods that still serve. Then run `oc rollout undo` and watch the old ReplicaSet scale back up."
    - kind: ask
      id: what-comes-back
      prompt: "Someone scaled `web` to 6, then a ConfigMap change broke it. Will `oc rollout undo` help?"
      choices:
        - text: "No, it restores only the pod template"
          why: "An undo copies an older pod template back. The replica count is not part of it, and the ConfigMap is a separate object that keeps its new content."
        - text: "Yes, it restores the earlier state"
          why: "Only the pod template comes back. Replicas, ConfigMaps, Secrets and volumes are not in it."
        - text: "Yes, if the ConfigMap is in the history"
          why: "Deployments keep a history of pod templates only. ConfigMaps have no revisions."
      answer: 0
    - kind: teach
      id: pause
      title: "Several changes, one rollout"
      body: |
        Every template change starts a rollout. To change a variable and a CPU limit together,
        **pause** the Deployment first: changes are then stored without rolling out, and **resume** starts one
        rollout with all of them, as one revision.
    - kind: show
      id: show-pause
      run: "oc rollout pause deployment/web; oc set env deployment/web RELEASE=4 LOG_LEVEL=debug >/dev/null; oc set resources deployment/web --limits=cpu=200m >/dev/null; echo \"ReplicaSets while paused: $(oc get replicasets -l app=web --no-headers | wc -l)\"; oc rollout resume deployment/web; oc rollout status deployment/web --timeout=180s >/dev/null; echo \"ReplicaSets after resume: $(oc get replicasets -l app=web --no-headers | wc -l)\""
      notice: |
        While paused, the two changes created no ReplicaSet: still 3, for releases 1, 2 and 3 (the undo reused
        release 2's). After resume, one rollout added exactly one, for both changes together.
    - kind: teach
      id: strategies
      title: "Other ways to release"
      body: |
        - **Recreate** stops every old pod before starting the new ones: a gap with no pods at each release.
          It is for applications whose two versions must never run together, such as a single writer to a
          volume.
        - **Blue-green**: two Deployments and two Services, and the Route switches from one to the other at once,
          and back as fast.
        - **Canary**: a Route can split traffic between Services by weight, sending a small share to the new
          version first. **Argo Rollouts**, an add-on in OpenShift GitOps, automates such steps with
          measurements.

        Whatever the strategy, during a rolling update both versions serve at the same time, so database changes
        must stay readable by the old version.
    - kind: ask
      id: quota
      prompt: "A project's quota allows 3 pods, and `web` runs 3. Releases stall with `exceeded quota`. What setting lets them proceed?"
      choices:
        - text: "`maxSurge: 0`, `maxUnavailable: 1`"
          why: "No extra pod is needed: one old pod goes first, then its replacement starts. One pod fewer during the release, but within the quota."
        - text: "Both set to 0"
          why: "Then the rollout can neither add nor remove a pod, and could never take a step. The API refuses it."
        - text: "A longer progress deadline"
          why: "Waiting longer does not create room in the quota. The extra pod stays refused."
      answer: 0
    - kind: order
      id: order-release
      prompt: "Put the steps of a careful release in order."
      items:
        - "Write what changes, and the rollback trigger"
        - "Set the image, with a change-cause annotation"
        - "Watch `oc rollout status` until it completes or fails"
        - "If it fails, `oc rollout undo` and check the history"
      why: "A rollback plan written in advance names its trigger (such as `oc rollout status` failing), so that nobody has to decide under pressure what \"something looks wrong\" means."
    - kind: reflect
      id: explain-readiness
      prompt: "Explain to a colleague why a release without a readiness probe can \"succeed\" while users get errors."
      model: |
        Without a readiness probe, a container counts as ready as soon as it runs. The rollout then sees each new
        pod as available and removes an old one, even if the new version answers every request with an error.
        A readiness probe that checks what the application needs stops a broken version at the first pod, with
        the old pods still serving.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can predict how a rolling update replaces pods, recognise a stuck rollout and its
        `ProgressDeadlineExceeded` condition, roll back knowing that only the pod template comes back, batch
        changes with pause and resume, and pick a strategy for a situation.

        Practise the whole sequence in the incident [A rollout that never finishes](/lab/inc.broken-rollout).
        Next: [Blue/green and canary releases](/lesson/o3.release-strategies), which control traffic instead of
        pods.
  sections:
    - id: more-rollouts
      title: "Numbers, conditions and change records"
      depth: true
      body: |
        | replicas | maxSurge (25%, up) | maxUnavailable (25%, down) | at most pods (not terminating) | at least available |
        |---|---|---|---|---|
        | 1 | 1 | 0 | 2 | 1 |
        | 3 | 1 | 0 | 4 | 3 |
        | 4 | 1 | 1 | 5 | 3 |
        | 10 | 3 | 2 | 13 | 8 |

        The bounds do not count terminating pods. Old pods that are shutting down can briefly add to the total,
        and to the resources used, until they exit or their `terminationGracePeriodSeconds` expires.

        **minReadySeconds** adds a soak time: a new pod must stay ready that long to count as available, so a
        version that crashes 20 seconds after start never passes `minReadySeconds: 30`.

        **The deadline** limits time *without progress*, not the whole rollout: a long rollout that keeps moving
        never exceeds it. While paused, it is not checked, and an undo is refused until you resume.

        **History** keeps up to `revisionHistoryLimit` old ReplicaSets (10 by default). `oc rollout history
        deployment/web --revision=2` prints a revision's template: check what an undo would bring back before
        running it. The old `--record` flag is deprecated: set `kubernetes.io/change-cause` yourself.

        **Rollover.** Changing the template during a rollout starts a rollout to the newest template at once.
        **Proportional scaling** during a rollout spreads new replicas over the ReplicaSets in proportion.

        **Change records** that help answer: what changes and why, the risk, how it was tested, how success is
        verified, the rollback plan and its trigger, who approves, and when. Under GitOps with self-heal, roll
        back with `git revert`: an `oc rollout undo` would be reverted to what Git says.

        **Mutable tags.** Rolling back to a template that says `:latest` may pull the same broken image again;
        deploy by digest or by immutable tags.
  review:
    - q: "With 3 replicas and the default RollingUpdate settings, how many non-terminating pods does a rollout allow at once, and how many must stay available?"
      a: "At most 4 (maxSurge 25% rounds up to 1), and at least 3 available (maxUnavailable 25% rounds down to 0). Old pods still terminating are not counted and can briefly add to the total."
    - q: "A release uses an image that cannot be pulled. What do users see, and what does the Deployment report?"
      a: "The old pods keep serving. After progressDeadlineSeconds without progress, Progressing=False with ProgressDeadlineExceeded; nothing is rolled back automatically."
    - q: "What does `oc rollout undo` restore?"
      a: "The previous pod template only, as a new revision. Not replicas, ConfigMaps, Secrets or volumes."
    - q: "How do you apply three template changes as one rollout?"
      a: "Pause the Deployment (`oc rollout pause deployment/web`), make the changes, then resume it: one rollout, one revision."
  commands:
    - cmd: "oc apply -f web.yaml >/dev/null; oc rollout status deployment/web --timeout=180s >/dev/null; oc set env deployment/web RELEASE=2 >/dev/null; oc annotate deployment/web kubernetes.io/change-cause='release 2: RELEASE=2' --overwrite >/dev/null; oc rollout status deployment/web --timeout=180s"
      meaning: "a rolling update, followed step by step"
    - cmd: "oc patch deployment/web -p '{\"spec\":{\"progressDeadlineSeconds\":30}}' >/dev/null; oc set image deployment/web httpd-24=registry.access.redhat.com/ubi9/httpd-24:no-such-tag >/dev/null; oc annotate deployment/web kubernetes.io/change-cause='release 3: broken tag' --overwrite >/dev/null; sleep 50; oc get replicasets -l app=web; oc get pods -l app=web"
      meaning: "a release that cannot start: stuck half-way, old pods serving"
    - cmd: "oc get deployment/web -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}{\"\\n\"}{end}'; oc rollout status deployment/web --timeout=10s"
      meaning: "ProgressDeadlineExceeded"
      expect: fail
    - cmd: "oc rollout undo deployment/web"
      meaning: "back to the previous pod template"
    - cmd: "oc rollout status deployment/web --timeout=180s; oc patch deployment/web -p '{\"spec\":{\"progressDeadlineSeconds\":600}}' >/dev/null; oc rollout history deployment/web"
      meaning: "the undo as a new revision"
    - cmd: "oc rollout pause deployment/web; oc set env deployment/web RELEASE=4 LOG_LEVEL=debug >/dev/null; oc set resources deployment/web --limits=cpu=200m >/dev/null; echo \"ReplicaSets while paused: $(oc get replicasets -l app=web --no-headers | wc -l)\"; oc rollout resume deployment/web; oc rollout status deployment/web --timeout=180s >/dev/null; echo \"ReplicaSets after resume: $(oc get replicasets -l app=web --no-headers | wc -l)\""
      meaning: "two changes while paused, one rollout on resume"
      timeout: 300
  references:
    - {title: "Kubernetes: Deployments (strategy, rollback, pausing, status)", url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"}
    - {title: "Kubernetes: Failed deployment and progress deadline", url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#failed-deployment"}
    - {title: "OpenShift 4.21: Deployments and route-based deployment strategies", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/deployments"}
    - {title: "OpenShift 4.21: Route API reference (alternateBackends)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_apis/route-route-openshift-io-v1"}
- id: o1.troubleshooting
  title: "Why is my application not working?"
  subtitle: "A fixed order of questions, and three failures read from the evidence"
  module: a3-troubleshoot
  mode: REAL_LAB
  minutes: 28
  level: 2
  supports: "OpenShift 4.21 (Kubernetes 1.34) with oc 4.21. Recorded on OpenShift Local as an ordinary user, in a temporary project."
  concepts: [container.debugging, k8s.pod-lifecycle, obs.signals]
  prerequisites: [k.kubectl-to-oc, b.pod-lifecycle, o1.config-secrets, lx.users-permissions]
  labs: [lab.troubleshooting-tools, inc.imagepull, inc.crashloop-config, ch.recover-and-scale, ch.config-out-of-spec, ch.right-size]
  record_on: cluster
  objective: |
    Find out why a pod is not running by asking three questions in order (what does its status say, what
    happened to it, what did the program say), and recognise an image that cannot be pulled, a program that
    keeps crashing, a program refused by file permissions, and pods that admission never let exist. Then fix
    the right object and verify the fix from the user's side.
  flow:
    - kind: ask
      id: recall-controller
      recalls: o1.deploy-apps
      prompt: "A look back. You delete a pod that belongs to a Deployment. What happens?"
      choices:
        - text: "Its controller creates a replacement"
          why: "The Deployment still declares how many pods it wants, so the controller closes the gap with a new pod."
        - text: "It stays deleted until you restart it"
          why: "That is what happens to a pod created on its own. A Deployment's pods are replaced automatically."
        - text: "It is restarted with the same name"
          why: "Deleted pods are replaced, not restarted: the new pod gets a new name."
      answer: 0
    - kind: teach
      id: method
      title: "Start with the status, then follow the evidence"
      body: |
        When an application does not work, the cluster has usually recorded most of the answer already. Three
        commands read it:

        - **`oc get pods`**: the STATUS column summarises what is happening to each pod, and READY and
          RESTARTS add clues. Start here: it tells you which of the next two to use.
        - **`oc describe pod`** ends with the pod's **events**: what the cluster tried, and what went wrong.
          This is where to look when the program never started (an image, scheduling or configuration
          problem).
        - **`oc logs`** shows what the container's program printed. This is where to look when the program
          started, then failed or misbehaved.

        They are `kubectl get`, `describe` and `logs`, run with `oc`. The lesson follows them through three
        broken applications, recorded on a real cluster, then a fourth case where no pod exists at all.
    - kind: teach
      id: case1
      title: "Case 1: the pod never starts"
      body: "The first application was created with an image tag that does not exist:"
    - kind: show
      id: create-broken-image
      run: "oc create deployment broken-image --image=registry.access.redhat.com/ubi9/httpd-24:no-such-tag"
    - kind: show
      id: status-image
      body: "Question 1, about thirty seconds later: what does the status say?"
      run: "sleep 30; oc get pods -l app=broken-image"
      highlight: [ImagePull, ErrImage]
      notice: |
        `0/1` ready, and a status that names the problem area: the image could not be pulled (downloaded).
        `ErrImagePull` is the failure itself; `ImagePullBackOff` means the kubelet, the agent on each node
        that starts containers, is waiting longer and longer between attempts. This pod's only container has
        never started, so it has printed nothing: the events are the useful evidence.
    - kind: ask
      id: next-question
      prompt: "The status says `ErrImagePull`. Which command gives you the most useful evidence next?"
      choices:
        - text: "`oc describe pod`, for the events"
          why: "The program never started, so the evidence is in what the cluster tried: the pod's events."
        - text: "`oc logs`, for the program's output"
          why: "This pod's only container was never started, because its image was never pulled, so it has printed nothing. The events know more."
        - text: "`oc delete pod`, to retry"
          why: "The Deployment would create the same pod, with the same image reference, and it would fail the same way. First find out why."
      answer: 0
    - kind: teach
      id: read-describe
      title: "Reading a describe report"
      body: |
        `oc describe pod` prints one long report per pod, always in the same order. You read a whole one in
        [Health probes](/lesson/b.health-probes). From the top:

        | Part | Answers |
        |---|---|
        | `Status`, `Node`, `Controlled By` | where the pod runs, and which ReplicaSet, so which Deployment, owns it |
        | `Annotations` | among others `openshift.io/scc`, the SCC that admitted the pod |
        | `State`, `Last State`, `Exit Code`, `Restart Count`, `Ready` | what each container does now, and how its last attempt ended |
        | `Liveness`, `Readiness`, `Startup` | each probe exactly as the kubelet runs it |
        | `Conditions` | scheduled, initialized, ready |
        | `Events` | what the cluster did to the pod, oldest first |

        When the program never started, as here, the events at the end are the part that matters.
    - kind: show
      id: describe-image
      body: |
        The events of the broken pod: the recording keeps only the last lines of the report, with `tail` (from
        the Linux lessons):
      run: "oc describe pod -l app=broken-image | tail -n 9"
      highlight: ["Failed"]
      notice: |
        The events summarise what happened: the pod was scheduled, then the kubelet tried to pull the image and
        failed. A note such as `x2 over 28s` means the same event happened twice in that time. The evidence
        that matters is the registry's answer: `manifest unknown`, the tag `no-such-tag` does not exist. The
        cause is the image reference in the Deployment, not the cluster and not the network.
    - kind: ask
      id: where-fix
      prompt: "Where do you fix this so that it stays fixed?"
      choices:
        - text: "In the Deployment's image reference"
          why: "The Deployment holds the desired state, including the image. Change it there, and the controller replaces the broken pod with one that can pull."
        - text: "Delete the failing pod"
          why: "Its replacement is created from the same Deployment, with the same wrong tag, and fails the same way."
        - text: "Pull the image on the node by hand"
          why: "The tag does not exist in the registry, so no pull can succeed. And nodes are not where you fix desired state."
      answer: 0
    - kind: show
      id: fix-image
      body: "`oc set image` changes the image of a container in the Deployment. Here the container is called `httpd-24`, after the image:"
      run: "oc set image deployment/broken-image httpd-24=registry.access.redhat.com/ubi9/httpd-24:latest; oc rollout status deployment/broken-image --timeout=180s; oc get pods -l app=broken-image"
      notice: "The Deployment changed, so the controller started a new pod from the corrected image (`Running`, `1/1`) and is removing the broken one (`Terminating`)."
    - kind: teach
      id: case2
      title: "Case 2: the program keeps crashing"
      body: |
        The second application reads its configuration file, `/etc/app/app.conf`, when it starts, and stops
        with an error if it cannot. Nobody gave it that file:
    - kind: show
      id: create-crashy
      run: "oc create deployment crashy --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'echo starting; cat /etc/app/app.conf || exit 1; echo; echo configuration read, serving; sleep infinity'"
    - kind: ask
      id: guess-crash
      guess: true
      prompt: "The program exits with an error each time it starts. What will `oc get pods` show after a minute?"
      choices:
        - text: "`Running`, with restarts counting up"
          why: "The kubelet does restart it, but it spends most of its time waiting between restarts. The next step shows the status."
        - text: "`CrashLoopBackOff`, with restarts counting up"
          why: "See the next step."
        - text: "`Completed`: the program finished"
          why: "That status is for programs that exit successfully (code 0) and are not meant to run again. Watch the next step."
      answer: 1
    - kind: show
      id: status-crash
      run: "sleep 50; oc get pods -l app=crashy"
      highlight: [CrashLoopBackOff]
      notice: |
        `CrashLoopBackOff`: the container started, crashed, and the kubelet is waiting before the next
        attempt, a little longer each time. `RESTARTS` counts the restarts so far. This time the program did
        start, so it may have said why it stopped: its logs are the next place to look.
    - kind: try
      id: try-logs
      body: "Show what the program printed. The Deployment is called `crashy`."
      accept: ["oc logs deploy/crashy", "oc logs deployment/crashy", "oc logs -l app=crashy", "oc logs deploy/crashy --previous", "oc logs deploy/crashy -p", "oc logs deployment/crashy --previous", "oc logs deployment/crashy -p", "kubectl logs deploy/crashy", "kubectl logs deployment/crashy", "kubectl logs -l app=crashy"]
      hints:
        - match: "^oc logs crashy$"
          say: "`oc logs` expects a pod name. `crashy` is the Deployment; write `deploy/crashy` to let `oc` pick one of its pods."
        - match: "^oc describe"
          say: "`describe` answers question 2, what happened to the pod. The program's own words are in its logs."
        - match: "^oc get logs"
          say: "Logs are not a kind of object to `get`: the verb itself is `logs`, as in `oc logs <pod>`."
      hint: "`oc logs`, then `deploy/` and the Deployment's name."
      run: "oc logs deploy/crashy"
      then: |
        The program printed `starting`, then `cat` reported that `/etc/app/app.conf` does not exist, and the
        program stopped. The cluster cannot tell you that; only the program can.

        When the container has already been restarted, `oc logs` shows the current attempt. Add `--previous`
        (or `-p`) to read the attempt before it, which is often the one that explains the crash.
    - kind: show
      id: fix-config
      body: "The fix is to give the program its file. From the ConfigMaps lesson: a ConfigMap with a key `app.conf`, mounted as files at `/etc/app`."
      run: "oc create configmap app-config --from-literal=app.conf='port=8080' >/dev/null; oc set volume deployment/crashy --add --type=configmap --configmap-name=app-config --mount-path=/etc/app >/dev/null; oc rollout status deployment/crashy --timeout=180s >/dev/null; oc get pods -l app=crashy; oc logs deploy/crashy"
      highlight: ["Running", "serving"]
      notice: |
        A new pod from the changed Deployment, `Running` with no restarts, while the crashing one is removed.
        `oc logs` says it found two pods and picked the running one: its log shows it read the file
        (`port=8080`) and went on to serve.
    - kind: teach
      id: case3
      title: "Case 3: running, but not working"
      body: |
        The third application writes a line to its log file, `/var/log/app.log`, when it starts, then keeps
        running. It works on a laptop with Podman. On OpenShift, users report that it never logs anything. It
        also prints `id` first, which will matter:
    - kind: show
      id: create-writer
      run: "oc create deployment writer --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'id; echo started > /var/log/app.log; sleep 3600'"
    - kind: ask
      id: guess-writer
      guess: true
      prompt: "The write to `/var/log/app.log` fails, but the script goes on to `sleep`. There is no readiness probe. What will `oc get pods` show?"
      choices:
        - text: "`CrashLoopBackOff`, `0/1`"
          why: "That needs the container to exit, and the script keeps running `sleep` after the failed write. The next step shows the status."
        - text: "`Running`, `1/1`"
          why: "The container keeps running, and with no readiness probe it counts as ready. The next step shows why that is misleading."
        - text: "`ErrImagePull`, `0/1`"
          why: "The image is the same as in case 2, and it was pulled without trouble. The problem is inside the running program."
      answer: 1
    - kind: show
      id: logs-writer
      body: "Status first, then the logs:"
      run: "sleep 30; oc get pods -l app=writer; oc logs deploy/writer"
      highlight: ["uid=", "Permission denied"]
      notice: |
        The status looks perfect: `Running`, `1/1`, no restarts. The shell reported the failed write and went
        on to `sleep`, so the container never stopped, and with no readiness probe nothing checked whether it
        works. This is why the status is never the last thing to read: a pod can be running and still not doing
        its job.

        The logs show the problem: `Permission denied`. The line above it explains why. The program does not
        run as root, nor as any user the image defines, but as a large, random-looking UID, with group `0`
        (root's group).
    - kind: teach
      id: arbitrary-uid
      body: |
        This is an **OpenShift** behaviour, not a Kubernetes one. When a pod does not choose a user, OpenShift
        runs its containers as a UID from a range reserved for the project, normally the first one of the range,
        whatever user the image names. "Arbitrary" means the image cannot know that number in advance, so it
        must work whatever it is. Running as an unprivileged UID limits the damage a compromised program can do.
        The same image under Podman or plain Kubernetes would usually run as root or as the user the image names.

        The pod was admitted and started: this is not a refusal. It is the kernel's ordinary permission check,
        failing for a user the image did not plan for. The project's range is written in an annotation on the
        project itself, which any member can read.
    - kind: show
      id: uid-range
      body: "`oc project -q` prints only the current project's name; the jsonpath reads one annotation of that project (the dots inside the annotation's name are escaped with `\\`):"
      run: "oc get project $(oc project -q) -o jsonpath='{.metadata.annotations.openshift\\.io/sa\\.scc\\.uid-range}{\"\\n\"}'"
      notice: |
        `1001500000/10000`: this project's range starts at UID 1001500000 and holds 10,000 UIDs. The UID in
        `writer`'s log, 1001500000, is the first of the range. Each project is given its own range, so the same
        image runs as a different UID in another project.
    - kind: show
      id: compare-dirs
      body: |
        From there, it is the permissions lesson again: which of the three sets does the kernel use for this
        program? A fourth deployment writes to `/tmp` instead, keeps running, and lets us look inside with `oc
        exec`: the directory `writer` tried to write to, one it can write to, then the log `writer-tmp` wrote.
      run: "oc create deployment writer-tmp --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'echo started > /tmp/app.log; sleep 3600' >/dev/null; oc rollout status deployment/writer-tmp --timeout=180s >/dev/null; oc exec deploy/writer-tmp -- sh -c 'ls -ld /var/log /tmp; cat /tmp/app.log'"
      highlight: ["/var/log", "/tmp"]
      notice: |
        `/var/log` is `rwxr-xr-x`, owner `root`, group `root`. `/tmp` is `rwxrwxrwt`: everyone may create
        files, and the final `t` (the sticky bit) stops people deleting each other's. The arbitrary user can
        write to `/tmp`, and the last line is `writer-tmp`'s log: `started`.
    - kind: ask
      id: which-set
      prompt: "The program runs as the large UID shown above, with `gid=0(root)`. Which set of `/var/log`'s permissions applies to it?"
      evidence: |
        drwxr-xr-x. 2 root root 24 Oct 13 13:35 /var/log
      choices:
        - text: "The group set, `r-x`"
          why: "It is not the owner (UID 0), but it is in group 0, which is the directory's group `root`. So the group set applies, and it has no `w`."
        - text: "The others set, `r-x`"
          why: "The others set would apply only if the program were in neither the owner nor the group. Its GID is 0, the directory's group, so the group set comes first."
        - text: "The owner set, `rwx`, because its group is root"
          why: "Ownership is about the UID, and the program's UID is the large project one, not 0. Being in root's group gives it the group set, not the owner's."
      answer: 0
    - kind: ask
      id: perm-fix
      prompt: "Which change lets `writer` keep its log under `/var/log` without running as root?"
      choices:
        - text: "Make the directory group-0 owned and group-writable in the image"
          why: "The arbitrary user is in group 0, so a directory with group 0 and `w` for the group is writable for it, whatever the UID. This is the documented way to make images that run on OpenShift; the containers track builds one ([Containers that run as anyone](/lesson/a.container-security))."
        - text: "Run `chmod 777 /var/log` inside the running container with `oc exec`"
          why: "The arbitrary user does not own `/var/log`, so its `chmod` is refused. And a change made inside a running container is lost when the pod is replaced: the image is where the fix belongs."
        - text: "Delete the pod so that it gets a better UID"
          why: "The replacement gets the same UID from the project's range, and the same refusal: the image is what needs changing."
      answer: 0
    - kind: teach
      id: case4
      title: "Case 4: no pod at all"
      body: |
        Sometimes `oc get pods` lists nothing for a Deployment: no pod, not even a Pending one. Then the pods were
        never created. **Admission**, the checks the API server runs before it stores an object, refused them: an
        SCC that does not allow the user the pod asks for, a quota with no room left, a LimitRange bound. A
        refused pod has no events of its own, because it does not exist.

        So look one level up. `oc get deployment,replicaset` shows the ReplicaSet wanting a pod it does not
        have, and its events, at the end of `oc describe replicaset`, hold a `FailedCreate` that names the rule.
        [Init containers and sidecars](/lesson/o3.init-sidecars) showed one: an init container that asked to run
        as root, refused by the `restricted-v2` SCC.
    - kind: ask
      id: no-pods-evidence
      prompt: "In this example (not a recording), `oc get pods` lists nothing for `web`. Where do you find the reason?"
      evidence: |
        $ oc get deployment,replicaset
        NAME                  READY   UP-TO-DATE   AVAILABLE   AGE
        deployment.apps/web   0/1     0            0           21s

        NAME                             DESIRED   CURRENT   READY   AGE
        replicaset.apps/web-6c966884bf   1         0         0       21s
      choices:
        - text: "In the ReplicaSet's `FailedCreate` events"
          why: "The ReplicaSet tried to create the pod and was refused, and its event names the rule: an SCC, a quota or a LimitRange."
        - text: "In the logs of the Deployment's pod"
          why: "No container ever started, so nothing was printed. Logs need a pod that ran, and here `CURRENT 0` says none was even stored."
        - text: "In the pod's `FailedScheduling` events"
          why: "FailedScheduling belongs to a pod that exists and waits for a node. With `CURRENT 0` there is no pod to wait."
      answer: 0
    - kind: teach
      id: the-loop
      title: "From a diagnosis to a verified fix"
      body: |
        The four cases follow one loop, and it holds for any incident:

        1. **Observe**: the status first, then the events or the logs. In a serious incident, first save what a
           fix would destroy; [Collect support data](/lesson/o3.support-data), the next lesson, shows how.
        2. **Diagnose**: name one cause, and the evidence for it, such as `manifest unknown` or `Permission
           denied`.
        3. **Act**: change the object that holds the desired state (the Deployment, the ConfigMap, the image), one
           change at a time, and preferably in the file the team reviews, so that the fix lasts. Deleting a pod
           changes nothing that lasts.
        4. **Verify** from the user's side: `oc rollout status` completes, `RESTARTS` stays at 0, and a real
           request through the Service or the Route gets the right answer. Then write down what you changed and
           why.
    - kind: order
      id: order-method
      prompt: "A pod shows `ImagePullBackOff`. Put the steps in order."
      items:
        - "`oc get pods`: read the status"
        - "`oc describe pod`: read the events for the pull error"
        - "Correct the image reference in the Deployment"
        - "`oc get pods` again: check the new pod runs"
      why: "The status points to the image, so the events, not the logs, hold the reason. The fix goes where the desired state lives, the Deployment, and the last check confirms it worked."
    - kind: reflect
      id: explain-two
      prompt: "Explain to a colleague why `oc logs` helped in case 2 but not in case 1."
      model: |
        In case 1, the image could not be pulled, so the program never started and printed nothing: the only
        evidence was in the pod's events, from `oc describe pod`. In case 2, the program started and crashed,
        so it had printed its own error message before exiting, which `oc logs` shows.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can find out why a pod is not working with three questions in a fixed order, and recognise common
        causes from their evidence: an image that cannot be pulled, a program that keeps crashing, a running
        program refused by file permissions because OpenShift runs it as an arbitrary user, and pods that
        admission refused, found one level up. You can close the loop: a fix in the right object, then a check
        from the user's side.

        [The troubleshooting toolbox](/lab/lab.troubleshooting-tools) goes through the tools on one crashing
        application, step by step. Then work without guidance: [ImagePullBackOff on a new
        deployment](/lab/inc.imagepull) and [CrashLoopBackOff after a configuration change](/lab/inc.crashloop-config)
        are cases 1 and 2 again, and [Recover and scale an API](/lab/ch.recover-and-scale) hides three faults in
        one application. Next, collecting diagnostic data, for when the evidence is more than you can read
        yourself.
  sections:
    - id: more-signals
      title: "More states and where to look"
      depth: true
      body: |
        | Status | First place to look |
        |---|---|
        | `Pending` for a long time | `oc describe pod` events: no node has enough CPU or memory, or a volume cannot be attached |
        | `ErrImagePull`, `ImagePullBackOff` | events: wrong name or tag, a private registry without credentials |
        | `CrashLoopBackOff` | `oc logs --previous`, then the exit code under "Last State" in `oc describe pod` |
        | `OOMKilled` in "Last State" | killed by the kernel for memory (exit code 137), usually for exceeding its own limit: compare its real memory use with the limit, and look for a leak, before raising it |
        | `Running` but `0/1` ready | the container is not ready: still starting, or a startup or readiness probe failing; read the events, then the logs |

        `oc debug` on a Deployment starts a copy of one of its pods with a shell instead of its normal command, which helps
        when a container crashes too fast to inspect. It needs an image that contains a shell.
  review:
    - q: "Which command do you start with when an application fails, and how does it choose the next one?"
      a: "`oc get pods`. If the program never started (image, scheduling, configuration), read the events with `oc describe pod`; if it started, read `oc logs` (with `--previous` after a restart)."
    - q: "A new pod with one container is in `ImagePullBackOff`. Why are there no logs?"
      a: "Its image was never pulled, so its container never started and printed nothing. The events explain it."
    - q: "What does `CrashLoopBackOff` mean?"
      a: "The container starts and exits again and again; the kubelet waits longer between each restart."
    - q: "A pod is `Running` and `1/1` ready. Does that prove the application works?"
      a: "No. It only says the container is running (and passing its readiness check, if any). The logs, or a real request, show whether it does its job."
    - q: "Why can a program that writes to `/var/log` work under Podman and fail on OpenShift?"
      a: "OpenShift runs it as an arbitrary UID in group 0, so the group set of `/var/log` (no write) applies. Images should make such directories group-0 writable."
  commands:
    - cmd: "oc create deployment broken-image --image=registry.access.redhat.com/ubi9/httpd-24:no-such-tag"
      meaning: "a Deployment whose image tag does not exist"
    - cmd: "sleep 30; oc get pods -l app=broken-image"
      meaning: "the status names an image pull problem"
    - cmd: "oc describe pod -l app=broken-image | tail -n 9"
      meaning: "the events: the registry does not know the tag"
    - cmd: "oc set image deployment/broken-image httpd-24=registry.access.redhat.com/ubi9/httpd-24:latest; oc rollout status deployment/broken-image --timeout=180s; oc get pods -l app=broken-image"
      meaning: "fixed in the Deployment; a new pod runs"
    - cmd: "oc create deployment crashy --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'echo starting; cat /etc/app/app.conf || exit 1; echo; echo configuration read, serving; sleep infinity'"
      meaning: "a program that exits with an error each time"
    - cmd: "sleep 50; oc get pods -l app=crashy"
      meaning: "CrashLoopBackOff, with restarts"
    - cmd: "oc logs deploy/crashy"
      meaning: "the program's own error message"
    - cmd: "oc create configmap app-config --from-literal=app.conf='port=8080' >/dev/null; oc set volume deployment/crashy --add --type=configmap --configmap-name=app-config --mount-path=/etc/app >/dev/null; oc rollout status deployment/crashy --timeout=180s >/dev/null; oc get pods -l app=crashy; oc logs deploy/crashy"
      meaning: "the file provided by a ConfigMap: the program starts"
    - cmd: "oc create deployment writer --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'id; echo started > /var/log/app.log; sleep 3600'"
      meaning: "a program that writes to /var/log"
    - cmd: "sleep 30; oc get pods -l app=writer; oc logs deploy/writer"
      meaning: "Running, yet the logs show an arbitrary UID in group 0 refused by /var/log"
    - cmd: "oc get project $(oc project -q) -o jsonpath='{.metadata.annotations.openshift\\.io/sa\\.scc\\.uid-range}{\"\\n\"}'"
      meaning: "the project's UID range: arbitrary UIDs come from it"
    - cmd: "oc create deployment writer-tmp --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sh -c 'echo started > /tmp/app.log; sleep 3600' >/dev/null; oc rollout status deployment/writer-tmp --timeout=180s >/dev/null; oc exec deploy/writer-tmp -- sh -c 'ls -ld /var/log /tmp; cat /tmp/app.log'"
      meaning: "the permissions of /var/log and /tmp inside the container"
