        - match: "^oc new-app"
          say: "`oc new-app` would also create the objects. The task is to process only, and look."
      hint: "`oc process -f shop.yaml`, then `-p APP_NAME=shop`, then `-o yaml`."
      run: "oc process -f shop.yaml -p APP_NAME=shop -o yaml"
      then: |
        A `List` of two plain objects. Every `${APP_NAME}` became `shop`, the password was generated (the recording
        shows it as a `<generated-N>` placeholder; on your cluster it is twelve random letters and digits), the
        template's label `app.kubernetes.io/instance: shop` was added to both, and `replicas` is the number
        `2`, because the template wrote `${{REPLICAS}}`.
    - kind: ask
      id: typed-substitution
      prompt: "A template needs `containerPort` to be the number 8080, taken from a parameter `PORT`. What do you write?"
      choices:
        - text: "`containerPort: ${{PORT}}`"
          why: "Double braces insert the value as YAML, so `8080` stays a number."
        - text: "`containerPort: ${PORT}`"
          why: "Single braces insert text, so the Deployment would receive the string `\"8080\"` and refuse it as a port number."
        - text: "`containerPort: {{PORT}}`"
          why: "Without the `$`, nothing is substituted: the text `{{PORT}}` is left in the file as it is."
      answer: 0
    - kind: ask
      id: guess-twice
      guess: true
      prompt: "You process the template twice, the same way. Do the two outputs have the same password?"
      choices:
        - text: "Yes, the first one is kept"
          why: "A template stores nothing about earlier processing. See the next step."
        - text: "No, each processing generates a new one"
          why: "See the next step."
        - text: "Only if the first was applied"
          why: "Processing never looks at what exists in the cluster. See the next step."
      answer: 1
    - kind: show
      id: show-twice
      run: "for i in 1 2; do oc process -f shop.yaml -p APP_NAME=shop -o jsonpath='{.items[0].stringData.password}{\"\\n\"}'; done"
      notice: |
        The recording replaces each generated value with a placeholder, `<generated-N>`, and a different number
        stands for a different value. On your cluster you see twelve random letters and digits instead.

        Two different passwords. This is the classic trap. The web server in `shop.yaml` never reads this
        Secret, so nothing breaks here. But take a hypothetical application where a database keeps its first
        password and the clients read it from this Secret: applying a second processing would change the Secret,
        and the clients could no longer log in. When you process again, pass the existing value with
        `-p DB_PASSWORD=…`.
    - kind: teach
      id: create
      title: "Creating the objects"
      body: |
        To create the objects, send the processed output to `oc apply`, which reads it from its standard input
        when given `-f -`. `oc new-app --file=shop.yaml -p …` does both steps at once, and `oc new-app
        --template=<name>` does the same with a template stored in the cluster.
    - kind: show
      id: show-apply
      run: "oc process -f shop.yaml -p APP_NAME=shop -p DB_PASSWORD=keep-this-one | oc apply -f -"
      notice: "Two objects created, in the current project, by the identity running the command. The password was given this time, so processing again with the same value would change nothing."
    - kind: try
      id: try-label
      body: "Every object the template created carries the label `app.kubernetes.io/instance=shop`. List the Deployments and Secrets that have it."
      accept: ["oc get deployment,secret -l app.kubernetes.io/instance=shop", "oc get deployment,secret --selector app.kubernetes.io/instance=shop", "oc get deployment,secret --selector=app.kubernetes.io/instance=shop", "oc get secret,deployment -l app.kubernetes.io/instance=shop", "oc get secret,deployment --selector app.kubernetes.io/instance=shop", "oc get secret,deployment --selector=app.kubernetes.io/instance=shop", "oc get deployment,secrets -l app.kubernetes.io/instance=shop", "oc get deployment,secrets --selector app.kubernetes.io/instance=shop", "oc get deployment,secrets --selector=app.kubernetes.io/instance=shop", "oc get secrets,deployment -l app.kubernetes.io/instance=shop", "oc get secrets,deployment --selector app.kubernetes.io/instance=shop", "oc get secrets,deployment --selector=app.kubernetes.io/instance=shop", "oc get deployments,secret -l app.kubernetes.io/instance=shop", "oc get deployments,secret --selector app.kubernetes.io/instance=shop", "oc get deployments,secret --selector=app.kubernetes.io/instance=shop", "oc get secret,deployments -l app.kubernetes.io/instance=shop", "oc get secret,deployments --selector app.kubernetes.io/instance=shop", "oc get secret,deployments --selector=app.kubernetes.io/instance=shop", "oc get deployments,secrets -l app.kubernetes.io/instance=shop", "oc get deployments,secrets --selector app.kubernetes.io/instance=shop", "oc get deployments,secrets --selector=app.kubernetes.io/instance=shop", "oc get secrets,deployments -l app.kubernetes.io/instance=shop", "oc get secrets,deployments --selector app.kubernetes.io/instance=shop", "oc get secrets,deployments --selector=app.kubernetes.io/instance=shop", "oc get deploy,secret -l app.kubernetes.io/instance=shop", "oc get deploy,secret --selector app.kubernetes.io/instance=shop", "oc get deploy,secret --selector=app.kubernetes.io/instance=shop", "oc get secret,deploy -l app.kubernetes.io/instance=shop", "oc get secret,deploy --selector app.kubernetes.io/instance=shop", "o