# OpenShift applications path, written as teaching flows. Commands are recorded with oc against OpenShift Local,
# as the ordinary learner identity, in a temporary project (record_on: cluster).
- id: n.console-clis
  title: "Console and CLI tools"
  subtitle: "Two clients of one API, a client that matches the cluster, and the rest of the toolbox"
  module: a1-cli
  mode: REAL_LAB
  minutes: 18
  level: 1
  supports: "OpenShift 4.21 web console (perspectives unified since 4.19) and oc 4.21. The `oc` commands are recorded on OpenShift Local as an ordinary user. The console task and support data collection are described from the 4.21 documentation: nothing in them was recorded, and this lesson has no screenshots of them."
  concepts: [ocp.console, sec.rbac]
  prerequisites: [k.kubectl-to-oc]
  labs: [lab.cli-tour]
  record_on: cluster
  objective: |
    Use the web console and `oc` for what each does best, knowing that both are clients of the same API with
    the same permissions; find a Deployment's image and replica count in the console and check them with `oc`;
    keep `oc` at the cluster's version; extend it with a plugin; and know what Red Hat support asks for.
  flow:
    - kind: ask
      id: recall-api
      recalls: k.kubectl-to-oc
      prompt: "A look back. Which component receives every `oc` and `kubectl` request?"
      choices:
        - text: "The API server"
          why: "Every client talks to the API server, which checks who you are and what you may do, then reads or changes the stored objects."
        - text: "The kubelet"
          why: "The kubelet is the agent on each node. It takes its work from the API server; clients do not talk to it."
        - text: "etcd"
          why: "etcd stores the objects, but only the API server talks to it."
      answer: 0
    - kind: teach
      id: bridge
      title: "What you bring, and what this territory adds"
      body: |
        Everything from the Kubernetes lessons still holds here: Pods, Deployments, Services, labels, the API
        server and its controllers. [From kubectl to oc](/lesson/k.kubectl-to-oc) showed what OpenShift adds,
        and each addition comes back in this territory:

        | OpenShift adds | In one line | Where |
        |---|---|---|
        | `oc` | `kubectl`'s commands, plus OpenShift's | here, then [Working with the oc CLI](/lesson/o1.cli) |
        | Projects | namespaces that users request and administer | [Working with the oc CLI](/lesson/o1.cli), [Projects, builds and ImageStreams](/lesson/c.projects-builds) |
        | Routes | a host name that reaches a Service from outside | [Deploying, exposing and scaling applications](/lesson/o1.deploy-apps), [Routes, the router and TLS termination](/lesson/d.routes-tls) |
        | SCCs | pods run as an unprivileged user by default | [Init containers and sidecars](/lesson/o3.init-sidecars), [Why is my application not working?](/lesson/o1.troubleshooting) |
        | ImageStreams and builds | images tracked, and built, inside the cluster | [Images on the platform](/lesson/ct.openshift-images) |
        | Templates | lists of objects with parameters | [Templates](/lesson/n.templates) |
        | The web console | a website for the same API | here |
    - kind: teach
      id: front-doors
      title: "Two front doors, one API"
      body: |
        OpenShift comes with a **web console**, a website for the cluster. Plain Kubernetes has none built in.
        The console is itself an application running on the cluster, and it does what `oc` does: it sends
        requests to the API server, with **your** token, the credential that logging in gave you.

        That has a useful consequence. The console has no powers of its own: a page you cannot see is a list
        the API refuses you, and a button that fails returns the same Forbidden that `oc` would print. Every
        object's page also has a YAML tab, the same object `oc get -o yaml` shows.
    - kind: show
      id: console-url
      body: "`oc` can tell you where the console is:"
      run: "oc whoami --show-console"
      notice: "On OpenShift Local, the console lives under the same `apps-crc.testing` domain as applications' Routes: it is published by a Route too."
    - kind: ask
      id: forbidden-both
      prompt: "A user gets Forbidden creating a quota in the console. A colleague says: try `oc`. What happens?"
      choices:
        - text: "Forbidden again, same API and rules"
          why: "Both send the same request, with the same token, to the same API server. Permissions belong to the identity, not to the tool."
        - text: "It works: `oc` has more rights"
          why: "`oc` has no rights of its own either. The API server decides, from your identity."
        - text: "It works with `oc adm`"
          why: "`oc adm` groups administration commands; it grants nothing. Without the permission, it is refused too."
      answer: 0
    - kind: teach
      id: when-which
      title: "What each is good at"
      body: |
        The console is good for discovering and explaining: it draws an application, shows its objects in
        pages, and lets you read each object's YAML. Since 4.19, application and administration pages share one
        menu, filtered by what you may see.

        `oc` and YAML files are good for changes that must be repeated and reviewed. A change made by clicking
        is as real as any other, and the cluster may keep audit records of it, but it is not yet captured in the
        team's reviewed configuration. In a shared cluster, changes go through files kept in Git, a version-control
        system that records every change to a set of files with who made it and why ([Why clusters
        drift](/lesson/gx.declarative) teaches it).
    - kind: teach
      id: console-task
      title: "A console task, described"
      body: |
        This is a described task, not a recording: this lesson has no screenshots of it, and the menu names come
        from the 4.21 documentation. Try it on any cluster where you have a project with a Deployment.

        1. Sign in to the console and choose your project in the project selector at the top.
        2. Open **Workloads > Deployments** and click the Deployment's name.
        3. On its **Details** tab, read the replica count. On its **YAML** tab, find `spec.replicas` and
           `spec.template.spec.containers`, where the image is.
        4. In a terminal, ask `oc` for the same Deployment as YAML, and compare the same two fields.

        You see only the projects and objects your account may read, exactly as with `oc`. If a page or a field
        differs from what `oc` prints, the usual cause is a different project or a different identity.
    - kind: teach
      id: versions
      title: "A client that matches the cluster"
      body: |
        `oc` is downloaded separately, from the console's **Help > Command Line Tools** page or Red Hat's site,
        and the download includes `kubectl` as well. Keep `oc` at the same minor version as the cluster (4.21
        with 4.21): an older client lacks newer options, and a newer one may offer options the cluster does
        not understand. `oc version` shows the client and what it can learn about the cluster.
    - kind: show
      id: show-version
      run: "oc version"
      notice: |
        The client, `4.21.8`, and the cluster's Kubernetes version, `v1.34.5`, the one OpenShift 4.21 ships.
        There is no `Server Version` line: the OpenShift version is read from a cluster-wide object that
        ordinary users may not read. Run by an administrator, `oc version` adds that line.
    - kind: try
      id: try-client
      body: "Show the version of the client only, without asking the cluster. The option is `--client`."
      accept: ["oc version --client", "oc version --client=true"]
      hints:
        - match: "^oc --client"
          say: "The option belongs to the `version` command: `oc version`, then `--client`."
        - match: "^oc version -c$"
          say: "Write the option in full: `--client`."
        - match: "^kubectl version"
          say: "That shows `kubectl`'s version. The task is about `oc`."
      hint: "`oc version`, then `--client`."
      run: "oc version --client"
      then: "The client's version only. This works even with no cluster at all. If the output has other lines, such as a bundled tool's version, ignore them for now."
    - kind: ask
      id: old-client
      prompt: "Your `oc` is 4.16, the cluster is 4.21. An option from the 4.21 documentation gives `unknown flag`. What do you do?"
      choices:
        - text: "Install `oc` 4.21"
          why: "The client does not know options added after its release. A client at the cluster's minor version matches its documentation."
        - text: "Ask an administrator to enable it"
          why: "`unknown flag` comes from your client, before any request is sent. Nothing on the cluster can change that."
        - text: "Use `kubectl` instead"
          why: "The `kubectl` that came with `oc` 4.16 is as old. Update the download."
      answer: 0
    - kind: teach
      id: plugins
      title: "Adding your own commands"
      body: |
        `oc` can be extended without changing it. Any executable on your `PATH` named `oc-<name>` becomes the
        command `oc <name>`, a **plugin**. Plugins cannot replace built-in commands. Here is one, created on the
        spot: a two-line script saved as `bin/oc-hello`, then run through `oc`:
    - kind: show
      id: show-plugin
      run: "mkdir -p bin; printf '#!/bin/sh\\necho \"oc-hello was called with: $*\"\\n' > bin/oc-hello; chmod +x bin/oc-hello; PATH=$PWD/bin:$PATH oc hello world"
      notice: "Asked for its `hello` command, `oc` found `oc-hello` on the `PATH` and ran it, passing `world` along. Teams use this to share small tools; Krew installs community plugins the same way."
    - kind: teach
      id: toolbox
      title: "The rest of the toolbox"
      body: |
        Other command-line tools exist for specific features, and you install the ones whose features you use.
        None is needed for the next application lessons: the table under "Go deeper" lists them, and the
        lessons that use each one introduce it there. A tutorial that asks for an older tool, such as `odo`, is
        out of date: check what the tutorial's version says before installing anything.
    - kind: teach
      id: support
      title: "When support asks for data"
      body: |
        A support case about a cluster starts with **must-gather**: `oc adm must-gather`, run by a cluster
        administrator, starts a pod that collects the cluster's object definitions and component logs into a
        local directory, which is compressed and attached to the case. It describes your cluster in detail, so
        it is handled as sensitive data. For one node, an administrator collects an `sos report` from a debug
        pod on that node.

        This course never runs them: they need administrator rights.
    - kind: ask
      id: what-to-send
      prompt: "An operator is degraded, and support asks for diagnostic data. What do you send?"
      choices:
        - text: "A must-gather archive"
          why: "It holds the objects and logs support needs. Send it through the case, and treat it as sensitive."
        - text: "Screenshots of the console"
          why: "Screenshots show a summary. Support needs the objects, conditions and logs that must-gather collects."
        - text: "Your kubeconfig file"
          why: "A kubeconfig holds your credentials. Never send it: it would let someone act as you on the cluster."
      answer: 0
    - kind: reflect
      id: explain-console
      prompt: "A colleague changed a Route in the console during an incident. Which file and field must the team update afterwards, and why?"
      model: |
        The file in Git that defines the Route, and the field that was changed. The console change is real, but
        it is not yet captured in the team's reviewed configuration. If an automated process (a pipeline, or a
        GitOps tool that keeps the cluster matching the files in Git) later reapplies the old value of that
        field, the fix may be lost and the incident can return. Updating the file makes the change reviewed and
        repeatable.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You know that the console and `oc` are two clients of the same API with the same permissions, when to
        use each, how to compare an object in the console with `oc`, how to check that `oc` matches the cluster,
        how a plugin extends `oc`, and what support asks for.

        Next: working with `oc` itself, from which cluster and project a command acts on to asking for exactly
        the answer you need.

        About practice in this territory: in the browser, a lab, an incident or a challenge replays outputs
        recorded on a real cluster, which shows you each step. Connected to a cluster of your own, you run the
        commands yourself and the activity's checks grade the result. Only that second way shows that you can
        do it. "Reproducing a lesson on your own cluster", under Go deeper, lists what the recordings rely on and
        how to obtain each part.
  sections:
    - id: more-tools
      title: "More about the console and the tools"
      depth: true
      body: |
        **Console navigation in 4.21.** Operator catalogs are under **Ecosystem > Software Catalog** (formerly
        OperatorHub, since 4.20), installed operators under **Ecosystem > Installed Operators**, Helm under the
        same menu. An administrator can turn the separate Developer perspective back on in the console
        operator's settings. Quick starts (`ConsoleQuickStart` objects) are guided tutorials in the Help menu,
        and operators add their own pages with `ConsolePlugin` objects. The console itself runs in the
        `openshift-console` namespace and is managed by the `console` cluster operator, which runs in
        `openshift-console-operator`.

        **Logging in.** `oc login` saves a connection in your kubeconfig; `--web` logs in through the browser.
        Kubeconfig files hold tokens or certificates: they are credentials, never to be shared.

        | Tool | Purpose |
        |---|---|
        | `oc`, including `oc adm` | everything; administration under `adm` |
        | `kubectl` | upstream CLI, shipped with `oc` |
        | `helm` | Helm charts (Red Hat ships a supported build) |
        | `tkn` | OpenShift Pipelines (Tekton) |
        | `kn` | OpenShift Serverless (Knative) |
        | `opm` | building and managing operator catalogs |
        | `oc-mirror` | mirroring for disconnected clusters (use v2; v1 is deprecated) |
        | `hcp` | hosted control planes |

        **Retired tools.** **odo** was deprecated in October 2025 and reached its end of life on 31 March 2026;
        Red Hat points developers to OpenShift Dev Spaces, Podman and `oc`. The Red Hat-supported **Operator
        SDK** was removed from the product in 4.19.

        **Observe and Ecosystem.** **Observe** shows alerts and metrics (empty on OpenShift Local, which runs
        without monitoring), and **Ecosystem** lists operators to install.

        **Insights.** Connected clusters send periodic health data through the Insights Operator, which feeds
        Red Hat's recommendations about known issues. Use the documentation for **your** version:
        docs.redhat.com has one set per minor release.
    - id: reproduce
      title: "Reproducing a lesson on your own cluster"
      depth: true
      body: |
        Every command of this territory was recorded on OpenShift Local 4.21, a cluster on a single machine, and you
        can run the same steps on a cluster of your own. Nothing in a lesson comes from somewhere you cannot reach:

        | Input | In the recordings | On your cluster |
        |---|---|---|
        | files such as `web.yaml` | the lesson's source files, listed under "Before you start" | save them in an empty working folder and run the commands from it |
        | the project | a temporary project per lesson, named after it, such as `academy-lesson-o1-cli` | create your own with `oc new-project <name>`; where a command spells out the recording's project, write yours |
        | the ordinary user | `developer`, OpenShift Local's built-in user | any user who may request projects |
        | the administrator | `kubeadmin`, only in steps marked as the administrator's; on OpenShift Local, `crc console --credentials` prints its login | only on a disposable cluster that you administer, never a shared one |
        | the apps domain | `apps-crc.testing` | yours: the end of any host name that OpenShift generates for a Route |
        | the node | `crc`, the only node | one from `oc get nodes`, as an administrator |
        | images | public images from `registry.access.redhat.com`, pulled without a login | the cluster must be able to reach that registry |
        | certificates, passwords | made by a command of the lesson (`openssl`, a fake value) | the same command; never paste a real credential |

        Deleting the project removes what a lesson created in it. Cluster-wide leftovers are named in the lessons
        that create them, such as volumes kept by a `Retain` storage class in
        [Volumes, claims, StorageClasses and CSI](/lesson/e.storage).
  review:
    - q: "Can the web console do something your `oc` user is not allowed to do?"
      a: "No. It calls the same API server with your token, so RBAC gives the same answers."
    - q: "Why keep `oc` at the cluster's minor version?"
      a: "An older client lacks newer options; a newer one may send options the cluster does not support. `oc version` shows both."
    - q: "How does `oc` find a plugin called `oc hello`?"
      a: "It looks for an executable named `oc-hello` on the PATH. Plugins cannot replace built-in commands."
    - q: "What do you send Red Hat support for a cluster problem?"
      a: "A must-gather archive (collected by a cluster administrator), handled as sensitive data. Never a kubeconfig."
  commands:
    - cmd: "oc whoami --show-console"
      meaning: "the web console's address"
    - cmd: "oc version"
      meaning: "client, cluster and Kubernetes versions"
    - cmd: "oc version --client"
      meaning: "the client's version only"
    - cmd: "mkdir -p bin; printf '#!/bin/sh\\necho \"oc-hello was called with: $*\"\\n' > bin/oc-hello; chmod +x bin/oc-hello; PATH=$PWD/bin:$PATH oc hello world"
      meaning: "a plugin: an executable named oc-<name> on the PATH"
  references:
    - {title: "OpenShift 4.21: Web console overview", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/web_console/web-console-overview"}
    - {title: "OpenShift 4.21: OpenShift CLI (oc), including plugins", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc"}
    - {title: "OpenShift 4.21: CLI tools overview", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/cli-tools-overview"}
    - {title: "OpenShift 4.21: Gathering data about your cluster", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/gathering-cluster-data"}
    - {title: "Red Hat Developer: odo CLI is deprecated", url: "https://developers.redhat.com/articles/2025/10/23/odo-cli-deprecated-what-developers-need-know"}
- id: o1.cli
  title: "Working with the oc CLI"
  subtitle: "Where your command goes, what you may do there, and asking for exactly the answer you need"
  module: a1-cli
  mode: REAL_LAB
  minutes: 25
  level: 1
  supports: "OpenShift 4.21 (Kubernetes 1.34) with oc 4.21. Recorded on OpenShift Local as an ordinary user, in a temporary project."
  concepts: [k8s.labels, k8s.architecture]
  prerequisites: [k.kubectl-to-oc, b.architecture]
  labs: [lab.cli-tour, lab.cluster-health]
  record_on: cluster
  objective: |
    Before a command, know which cluster, which identity and which project it will act on. Read Forbidden and
    NotFound correctly, check a permission before you need it, ask for exactly one field or a table of your own,
    and preview a change before you make it.
  flow:
    - kind: ask
      id: recall-same-api
      recalls: k.kubectl-to-oc
      prompt: "A look back. On the same cluster, how do `kubectl get pods` and `oc get pods` differ?"
      choices:
        - text: "They show the same pods"
          why: "Both clients send the same request to the same API server, which answers both the same way."
        - text: "`oc` also shows OpenShift's own pods"
          why: "Which pods you see depends on the cluster and your permissions, never on the client. Both list the same objects."
        - text: "`kubectl` cannot read an OpenShift cluster"
          why: "OpenShift serves the standard Kubernetes API, so `kubectl` works on it. It only lacks commands for OpenShift's extra kinds."
      answer: 0
    - kind: teach
      id: before-a-command
      title: "Three things to know before you type"
      body: |
        In this part of the course, commands use `oc`, the client you will use every day on OpenShift. Most of
        its commands are the `kubectl` commands you already know.

        Picture a real day: your laptop can reach a test cluster and a production cluster, and you work in
        several projects on each. Every `oc` command acts on one cluster, as one identity, in one project. None of
        them appears in the command itself, so before anything that changes something, experienced people
        check three things:

        1. **Which cluster** will receive it?
        2. **Who am I** there?
        3. **Which project** will it act on?

        Each has a short command.
    - kind: show
      id: who-where
      run: "oc whoami; oc whoami --show-server"
      notice: |
        The first line is your identity on the cluster: here `developer`, an ordinary user. The second is the
        address of the cluster's API server, the component that receives every request. This one is
        OpenShift Local, a single-machine cluster.
    - kind: teach
      id: kubeconfig
      title: "Where oc finds the answers"
      body: |
        `oc` reads both from a file called a **kubeconfig**, normally `~/.kube/config`, the same file `kubectl`
        uses. When you log in, `oc` writes the cluster's address and your token there, in a **context**: one
        cluster, one identity and one default project, under one name.

        The file can hold several contexts, one per cluster or user, and one of them is the **current context**.
        Every command without extra options uses it. That is convenient, and it is also how people run a
        command on the wrong cluster: the last login, in any terminal, changed the current context for all of
        them.
    - kind: show
      id: contexts
      body: "`oc config get-contexts` lists them:"
      run: "oc config get-contexts"
      highlight: ["*"]
      notice: |
        Two contexts here, both for `developer` on the same cluster. The `*` marks the current one, and its
        `NAMESPACE` column holds the project your commands go to by default.
    - kind: try
      id: try-project
      body: "Ask `oc` which project your commands go to."
      accept: ["oc project", "oc project -q", "oc project --short", "oc project --short=true", "oc project -q=true"]
      hints:
        - match: "^oc get projects?$"
          say: "That lists every project you can see. The question is which one is current: `oc project`, with no name after it."
        - match: "^oc project \\S+"
          say: "With a name, `oc project` switches to that project. Without one, it tells you the current one."
        - match: "^oc whoami"
          say: "`oc whoami` answers who you are. The project is another question, answered by `oc project`."
        - match: "^kubectl project"
          say: "`kubectl` has no `project` command: projects are an OpenShift idea, so the command belongs to `oc`."
      hint: "`oc`, then the word for an OpenShift namespace."
      run: "oc project"
      then: |
        One sentence names the project, the context and the server. This recording ran in a temporary project
        created for it. The context's name was built when the user logged in: the project current at the time,
        the server, and the user, separated by slashes.

        Without `-n`, every command acts on that project. A command you meant for one project, typed after
        switching to another earlier in the day, runs where you are now, without warning. In scripts and
        runbooks, always write `-n <project>`, so the command says where it acts.
    - kind: teach
      id: forbidden
      title: "Forbidden is not NotFound"
      body: |
        Every request is checked by the API server: first **who** sent it, then whether that identity **may**
        do it (the rules for this are called RBAC, for role-based access control). Only then does the server
        look for the object. The error you get tells you which step said no, and each needs a different fix.
    - kind: try
      id: try-forbidden
      body: "List the pods of the project `openshift-etcd`, one of the cluster's own, without switching to it."
      accept: ["oc get pods -n openshift-etcd", "oc get pod -n openshift-etcd", "oc get po -n openshift-etcd", "oc get pods --namespace openshift-etcd", "oc get pods --namespace=openshift-etcd", "oc -n openshift-etcd get pods", "kubectl get pods -n openshift-etcd"]
      hints:
        - match: "^oc project"
          say: "That would switch your current project, and every later command would follow. The task is one command, for one project: add `-n`."
        - match: "^oc get pods?$"
          say: "That lists the pods of your current project. Add `-n` and the project's name."
        - match: "openshift-etcd$"
          say: "Check the spelling of the option: `-n`, followed by a space and the project's name."
      hint: "`oc get pods`, then `-n` and the project's name."
      run: "oc get pods -n openshift-etcd"
      then: |
        **Forbidden**. Read the whole message: the server knows exactly who you are (`developer`), and refuses
        to list pods in that project. Nothing in this answer says whether there are pods there. There are: they
        run the cluster's database. You are not allowed to see them.
    - kind: show
      id: notfound
      body: "Now an object that does not exist, in your own project, where you may look:"
      run: "oc get secret db-creds"
      notice: |
        **NotFound**. You were allowed to look, and there is nothing called `db-creds` here. A third error,
        **Unauthorized** ("You must be logged in to the server"), means the server could not tell who you
        are, usually because your login expired.
    - kind: ask
      id: read-forbidden
      prompt: "A colleague, also `developer`, shows you this answer from the project `payments` (an example, not a recording). What does it tell you about `db-creds`?"
      evidence: |
        $ oc get secret db-creds -n payments
        Error from server (Forbidden): secrets "db-creds" is forbidden: User "developer" cannot get resource "secrets" in API group "" in the namespace "payments"
      choices:
        - text: "It may exist, but you may not read it"
          why: "Permission is checked before the server looks for the object, so Forbidden says nothing about whether it exists. The fix is a role, not a different name."
        - text: "It does not exist in the `payments` project"
          why: "A missing object gives NotFound, and only to someone allowed to look. Forbidden is decided first."
        - text: "Your login token has expired"
          why: "Then the server could not name you, and the answer would be Unauthorized. Here it names `developer`."
      answer: 0
    - kind: teach
      id: can-i
      title: "Ask before you need it"
      body: |
        In the middle of an incident is a bad moment to find out that you cannot restart a deployment. `oc auth
        can-i` asks the API server the permission question directly, without doing anything. It answers `yes` or
        `no`, for your identity, in your current project unless you add `-n`.

        The question must match the operation you intend. Changing a Deployment's pod template, which is what a
        restart does, is a `patch` of the Deployment. Scaling writes a separate part of it, the `scale`
        subresource, so it is checked with `--subresource=scale`. `oc scale` sends a `patch` to that
        subresource; an autoscaler sends an `update`. The `edit` and `admin` roles grant both verbs.
    - kind: show
      id: show-can-i
      body: "Five questions from `developer`, the ordinary user. Expect `no` to the last two, which reach outside developer's own project; `oc auth can-i` then ends with exit status 1, which means no, not an error:"
      run: "oc auth can-i create deployments; oc auth can-i patch deployments; oc auth can-i update deployments.apps --subresource=scale; oc auth can-i delete pods -n openshift-etcd; oc auth can-i get nodes"
      notice: |
        Yes to the first three, in this project, which `developer` created and therefore administers. Each asks
        about a different operation: creating Deployments, patching them (what a restart does), and updating
        the `scale` subresource (what an autoscaler writes; `oc scale` itself patches it, so the exact question
        for `oc scale` is `oc auth can-i patch deployments.apps --subresource=scale`, which the same role also
        grants). No in the cluster's own project. No for nodes, which
        belong to no project: reading them takes a cluster-wide grant, which ordinary users rarely have. The
        warning says why `-n` would make no difference to that question. `can-i` exits 1 when its answer is no,
        so the last `no` sets the exit status the terminal shows.
    - kind: ask
      id: can-i-where
      prompt: "`oc auth can-i delete pods` answers `yes`. Where may you delete pods?"
      choices:
        - text: "In your current project"
          why: "Without `-n`, the question is asked about the current project, like any other command. Elsewhere the answer may differ."
        - text: "In every project"
          why: "Permissions are usually granted per project. The question was about your current project only; ask with `-n` for another."
        - text: "In the projects you created"
          why: "Creating a project does make you its administrator, but the question did not ask about those. It asked about the current project."
      answer: 0
    - kind: teach
      id: exact-answers
      title: "Asking for exactly what you need"
      body: |
        Most questions about an application have a one-line answer: which image a Deployment asks for, how many pods are
        ready, which node each pod is on. Reading a whole object in YAML to find it is slow, and a script cannot
        read the human table reliably, because its columns are not a fixed format.

        `oc get` takes an **output format** with `-o`. You have met some of them with `kubectl`. Here they are
        together, on a Deployment called `web` with two replicas, created for the recording:
    - kind: show
      id: wide
      body: "`-o wide` adds the columns people need most often:"
      run: "oc create deployment web --image=registry.access.redhat.com/ubi9/httpd-24:latest --replicas=2 >/dev/null; oc rollout status deployment/web --timeout=180s >/dev/null; oc get deployment web -o wide"
      highlight: ["IMAGES", "SELECTOR"]
      notice: "For a Deployment, the extra columns are the containers, their images, and the selector, the label query that picks this Deployment's pods."
    - kind: show
      id: one-field
      body: |
        `-o jsonpath` prints one field, chosen by its path in the object. The path is the one you would follow
        in the YAML, starting with a dot. Lists take an index in brackets: `containers[0]` is the first
        container. The whole expression is quoted, so that the shell leaves the braces and brackets alone. Single
        quotes are the usual choice:
      run: "oc get deployment web -o jsonpath='{.spec.replicas}'"
      notice: "Only the number, with nothing around it, not even a line break. A script can use it as it is."
    - kind: try
      id: try-jsonpath
      body: "Print only the image of the first container of `web`. In a Deployment, the containers are under `.spec.template.spec`."
      accept: ["oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment web -o jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployment web -o=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment web -o=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployment web --output jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment web --output jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployment web --output=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment web --output=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy web -o jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy web -o=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy web -o=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy web --output jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy web --output jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy web --output=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy web --output=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployments web -o jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployments web -o jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployments web -o=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployments web -o=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployments web --output jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployments web --output jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployments web --output=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployments web --output=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployment/web -o jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment/web -o jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployment/web -o=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment/web -o=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployment/web --output jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment/web --output jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deployment/web --output=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deployment/web --output=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy/web -o jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy/web -o jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy/web -o=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy/web -o=jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy/web --output jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy/web --output jsonpath=\"{.spec.template.spec.containers[0].image}\"", "oc get deploy/web --output=jsonpath='{.spec.template.spec.containers[0].image}'", "oc get deploy/web --output=jsonpath=\"{.spec.template.spec.containers[0].image}\""]
      hints:
        - match: "\\.spec\\.containers"
          say: "That path belongs to a pod. A Deployment holds a pod template, so its containers are one level deeper: `.spec.template.spec.containers`."
        - match: "jsonpath=\\{"
          say: "Quote the expression so the shell passes the braces and brackets to `oc` unchanged. Single quotes, `'{…}'`, are a convenient choice; double quotes work too."
        - match: "jsonpath='\\."
          say: "The path goes inside braces: `'{.spec…}'`."
        - match: "containers\\.image"
          say: "`containers` is a list. Pick its first element with `[0]` before asking for `.image`."
        - match: "^oc get pods?"
          say: "The task is about the Deployment `web`, not its pods: `oc get deployment web`."
      hint: "Same as the replicas example, with the path `.spec.template.spec.containers[0].image`."
      run: "oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}'"
      then: |
        The image requested for new pods, and nothing else. It is the first thing to check when a deployment
        behaves differently from yesterday. It is what the Deployment asks for, not proof of what runs: during a
        failed or partial rollout old pods may still be serving, and a tag can point to a different image over
        time. To see what a pod actually started, read its container status, which includes the image's `imageID`.
    - kind: show
      id: columns
      body: "`-o custom-columns` builds a table from fields you choose, each as `TITLE:path`:"
      run: "oc get pods -l app=web -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,NODE:.spec.nodeName"
      notice: "One row per pod, with exactly these three columns. This cluster has a single node, so both pods are on it."
    - kind: show
      id: names
      body: "`-o name` prints `kind/name`, ready to hand to another command:"
      run: "oc get pods -l app=web -o name"
      notice: "This is how scripts loop over objects: `for p in $(oc get pods -l app=web -o name); do oc describe $p; done`."
    - kind: ask
      id: script-broke
      prompt: "A script found crashing pods by cutting a column out of `oc get pods`. After an update it broke. What do you change?"
      choices:
        - text: "Read the field with `-o jsonpath`"
          why: "Field paths are part of the API and stay stable. The table is formatted for people and can change."
        - text: "Pin the version of `oc`"
          why: "Part of the table comes from the server, and pinning the client also stops security fixes. The table is not an interface to rely on."
        - text: "Search `oc describe` output instead"
          why: "`describe` is written for people too, and changes even more freely than the table."
      answer: 0
    - kind: teach
      id: discovery
      title: "What exists on this cluster?"
      body: |
        The same `oc` connects to different clusters, and each serves its own set of kinds: OpenShift adds
        Routes and Projects, and every operator installed adds more. `oc api-resources` and `oc explain` do not
        read a list built into `oc`. They ask the API server, so their answer describes this cluster.
    - kind: show
      id: api-resources
      run: "oc api-resources --api-group=route.openshift.io"
      notice: |
        One kind in OpenShift's `route.openshift.io` group: Route, which is namespaced (it lives in a project).
        Without `--api-group`, the list has every kind the cluster serves.
    - kind: show
      id: explain-route
      run: "oc explain route.spec.to"
      notice: "The cluster's own description of the field, with its subfields. The same command explains kinds that operators add."
    - kind: ask
      id: explain-elsewhere
      prompt: "The same `oc` binary runs `oc explain route.spec.to` against a plain Kubernetes cluster. What happens?"
      choices:
        - text: "It fails: that cluster serves no Routes"
          why: "`explain` asks the cluster for its schema, and a plain Kubernetes cluster has no `route.openshift.io` group."
        - text: "It prints the same text, built into `oc`"
          why: "The descriptions come from the cluster, not from the client. That is why they also cover kinds no client knows about."
        - text: "It prints the Ingress fields instead"
          why: "`oc` does not translate one kind into another. Ingress is a separate kind, with its own fields."
      answer: 0
    - kind: teach
      id: preview
      title: "Look before you change"
      body: |
        Commands such as `oc create`, `oc scale` and `oc set` change the cluster immediately. In shared clusters,
        changes usually come from YAML files kept in Git, so they can be reviewed and repeated. Two options
        bridge the two.

        `--dry-run=client -o yaml` builds the object you describe and prints it, without sending anything. It
        is a quick way to start a correct YAML file:
    - kind: show
      id: dry-run
      run: "oc create deployment web --image=registry.access.redhat.com/ubi9/httpd-24:latest --replicas=3 --dry-run=client -o yaml > web.yaml; cat web.yaml"
      highlight: ["replicas: 3"]
      notice: "A complete Deployment, with three replicas. Nothing was created: the file is the only result."
    - kind: show
      id: diff
      body: "`oc diff -f` sends the file to the server and shows what would change in the live object, without changing it:"
      run: "oc diff -f web.yaml"
      highlight: ["replicas"]
      notice: |
        The lines starting with `-` are the live object, the ones with `+` what the file would make of it:
        two replicas would become three. `generation`, a counter the server raises on each change to the
        specification, would go up with it. To apply it for real, `oc apply -f web.yaml`.

        A script reads the answer from the exit status instead: 0 when nothing would change, 1 when something
        would, as here, and more than 1 when `oc` or the comparison failed with an error.
    - kind: order
      id: order-safe
      prompt: "You are about to scale down an application during an incident. Put the checks in order."
      items:
        - "`oc whoami --show-server`: am I on the right cluster?"
        - "`oc project`: is this the right project?"
        - "`oc auth can-i patch deployments.apps --subresource=scale`: may I scale it?"
        - "`oc diff -f`: what exactly will change?"
      why: "Each check makes sense only after the one before it: permissions depend on the cluster and the project, and a preview is only useful once you know you can apply it. The permission check must name the operation: `oc scale` sends a `patch` to the `scale` subresource (an autoscaler uses `update`), and `patch` on the Deployment itself would also be enough to change replicas."
    - kind: reflect
      id: explain-errors
      prompt: "A colleague says: \"`oc get secret db-creds` says Forbidden, so it doesn't exist.\" What do you tell them?"
      model: |
        Forbidden means the server knows who you are and refuses the request, before looking for the object.
        So we cannot tell whether `db-creds` exists. NotFound would mean we were allowed to look and nothing is
        there. To find out, someone with access has to check, or we need a role that lets us read Secrets in
        that project.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        Before a command, you can check which cluster, which identity and which project it will act on. You
        can tell Forbidden from NotFound and Unauthorized, check a permission with `oc auth can-i`, print one
        field or a table of your own, find out what this cluster serves, and preview a change with
        `--dry-run` and `oc diff`.

        Next, these commands put applications on the cluster: deploying, scaling and updating them with `oc`.
        [A tour of the oc CLI](/lab/lab.cli-tour) practises the reading side in a project of its own: replayed
        here from a recording, or run on a cluster you connect, where its checks grade what you did.
  sections:
    - id: more-cli
      title: "More about oc"
      depth: true
      body: |
        **Which kubeconfig.** `oc` uses the `--kubeconfig` option if you pass one; otherwise the files listed in
        the `KUBECONFIG` environment variable; otherwise `~/.kube/config`. `oc config get-contexts` lists the
        contexts and marks the current one; `oc config use-context <name>` switches. Keeping production in its own
        file, used only on purpose, avoids most wrong-cluster mistakes.

        **What oc sends.** Add `-v=6` to any command to see each HTTP request and its status code; higher
        levels add headers and bodies. The `Authorization` header is masked, but bodies can still hold
        credentials (a Secret you read, an `oc login` exchange), so treat high-verbosity output as sensitive.

        **Watching and events.** `oc get pods -w` prints changes as they happen. `oc get events
        --sort-by=.lastTimestamp` lists what happened recently in the project, oldest first.

        **Filters.** `-l app=web` selects by label; `--field-selector status.phase=Running` by some fields;
        `-L app` shows a label as a column.

        **Same name, different command.** `oc debug` on a Deployment starts a *copy* of one of its pods with a shell;
        `kubectl debug` by default adds an ephemeral container to a running pod.

        **Server-side dry run.** `--dry-run=server` sends the request through validation and admission and
        then discards it, which catches errors the client cannot see, such as a quota or a policy.

        **Do not start from live YAML.** `oc get … -o yaml` of a live object includes `status`, `uid`,
        `resourceVersion` and many defaulted fields that do not belong in Git. Start from `--dry-run=client -o
        yaml` instead.

        **All namespaces.** `-A` lists across all namespaces, and needs a cluster-wide grant: being able to read
        several projects one by one is not enough.
  review:
    - q: "Which three things does an `oc` command take from the current context?"
      a: "The cluster (API server), the identity (user and token), and the default project."
    - q: "What is the difference between Forbidden, NotFound and Unauthorized?"
      a: "Forbidden: the server knows who you are and refuses. NotFound: you may look and nothing is there. Unauthorized: the server could not tell who you are."
    - q: "How do you check whether you may restart a deployment, or scale one, without trying it?"
      a: "Match the operation. Restart patches the Deployment: `oc auth can-i patch deployments`. Scaling with `oc scale` patches the scale subresource: `oc auth can-i patch deployments.apps --subresource=scale`. Add `-n <project>` for another project."
    - q: "How do you print only the image of the first container of Deployment web?"
      a: "oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}'"
    - q: "Where does `oc explain` get its information?"
      a: "From the cluster's API schema, so it matches the cluster, including kinds added by operators."
    - q: "How do you get a manifest from an imperative command without creating anything?"
      a: "Add --dry-run=client -o yaml, for example: oc create deployment web --image=… --dry-run=client -o yaml"
  commands:
    - cmd: "oc whoami; oc whoami --show-server"
      meaning: "your identity, and the API server you are talking to"
    - cmd: "oc project"
      meaning: "the current project, and the server"
    - cmd: "oc config get-contexts"
      meaning: "the contexts in your kubeconfig; * marks the current one"
    - cmd: "oc get pods -n openshift-etcd"
      meaning: "Forbidden: identified, but not allowed"
      expect: any
    - cmd: "oc get secret db-creds"
      meaning: "NotFound: allowed to look, and nothing is there"
      expect: any
    - cmd: "oc auth can-i create deployments; oc auth can-i patch deployments; oc auth can-i update deployments.apps --subresource=scale; oc auth can-i delete pods -n openshift-etcd; oc auth can-i get nodes"
      meaning: "ask a permission question without doing anything"
      expect: any
    - cmd: "oc create deployment web --image=registry.access.redhat.com/ubi9/httpd-24:latest --replicas=2 >/dev/null; oc rollout status deployment/web --timeout=180s >/dev/null; oc get deployment web -o wide"
      meaning: "a Deployment, with its images and selector"
    - cmd: "oc get deployment web -o jsonpath='{.spec.replicas}'"
      meaning: "exactly one field"
    - cmd: "oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}'"
      meaning: "the image of the first container"
    - cmd: "oc get pods -l app=web -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,NODE:.spec.nodeName"
      meaning: "a table of chosen fields"
    - cmd: "oc get pods -l app=web -o name"
      meaning: "kind/name, for scripts"
    - cmd: "oc api-resources --api-group=route.openshift.io"
      meaning: "which kinds this cluster serves in one API group"
    - cmd: "oc explain route.spec.to"
      meaning: "the cluster's own description of a field"
    - cmd: "oc create deployment web --image=registry.access.redhat.com/ubi9/httpd-24:latest --replicas=3 --dry-run=client -o yaml > web.yaml; cat web.yaml"
      meaning: "a manifest built and printed, nothing created"
    - cmd: "oc diff -f web.yaml"
      meaning: "what the file would change in the live object"
      expect: any
  references:
    - {title: "OpenShift 4.21: OpenShift CLI (oc)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc"}
    - {title: "Kubernetes: Organizing cluster access using kubeconfig files", url: "https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/"}
    - {title: "Kubernetes: JSONPath support", url: "https://kubernetes.io/docs/reference/kubectl/jsonpath/"}
    - {title: "Kubernetes: kubectl quick reference (output formats, verbosity)", url: "https://kubernetes.io/docs/reference/kubectl/quick-reference/"}
    - {title: "Kubernetes: Authorization (checking API access with auth can-i)", url: "https://kubernetes.io/docs/reference/access-authn-authz/authorization/"}
    - {title: "kubectl reference: kubectl diff", url: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_diff/"}
- id: o1.deploy-apps
  title: "Deploying, exposing and scaling applications"
  subtitle: "The chain from a URL to a pod, the labels that hold it together, and two ways to change capacity"
  module: a2-apps
  mode: REAL_LAB
  minutes: 30
  level: 1
  supports: "OpenShift 4.21 (Kubernetes 1.34) with oc 4.21: Deployments (apps/v1), Services, Routes, HPA autoscaling/v2. Recorded on OpenShift Local as an ordinary user, in a temporary project."
  concepts: [k8s.deployment, net.services, net.endpointslices, net.routes, k8s.rollout, k8s.requests-limits]
  prerequisites: [o1.cli, b.workloads, k.kubectl-to-oc]
  labs: [lab.deploy-apps, lab.deployment-reconciliation]
  record_on: cluster
  objective: |
    Build the chain that takes a request from a URL to a pod (Route, Service, Deployment), explain how the
    Service finds its pods by labels, recognise the 503 of a Service that selects nothing, choose between
    `oc create deployment` with `oc expose` and `oc new-app`, and change capacity with `oc scale`,
    `oc set resources` or an autoscaler, knowing which ones start a rollout.
  flow:
    - kind: ask
      id: recall-route
      recalls: k.kubectl-to-oc
      prompt: "A look back. On OpenShift, which object gives an application a public host name?"
      choices:
        - text: "A Route"
          why: "A Route names a host and the Service behind it. The cluster's router receives the requests for that host."
        - text: "A Service"
          why: "A Service gives a stable address inside the cluster. Something else must bring outside requests to it."
        - text: "A Deployment"
          why: "A Deployment decides what runs and how many copies. It does not handle traffic at all."
      answer: 0
    - kind: teach
      id: chain
      title: "A chain of objects"
      body: |
        A colleague deployed an application last month. Today its URL answers with an error, and you must find
        out why. Knowing which objects make up a running application turns that into a short walk instead of
        a guess.

        A typical web application on OpenShift is a chain:

        - a **Route** receives requests for a host name, and names the Service to send them to;
        - a **Service** gives a stable name and address, and sends each request to one of its pods;
        - a **Deployment** keeps the right number of identical pods running, through a ReplicaSet.

        Each link is either a **name** (the Route names its Service) or a **label selector** (the Service and
        the Deployment find their pods by labels). This lesson builds the chain one link at a time, then
        breaks one.
    - kind: show
      id: create
      body: "First the Deployment, from an image of the Apache web server that listens on port 8080:"
      run: "oc create deployment hello --image=registry.access.redhat.com/ubi9/httpd-24:latest --port=8080; oc rollout status deployment/hello --timeout=180s; oc get deployment,replicaset,pods"
      notice: |
        Three layers: the Deployment, the ReplicaSet it created for this version of its template, and the
        pod. The pod's name starts with the ReplicaSet's, which tells you where it came from. The pod runs,
        but nothing can reach it yet by a stable name.
    - kind: try
      id: try-expose
      body: "Create a Service in front of the Deployment `hello`, on port 8080."
      accept: ["oc expose deployment hello --port=8080", "oc expose deploy hello --port=8080", "oc expose deployment/hello --port=8080", "oc expose deploy/hello --port=8080", "oc expose deployment hello --port 8080", "oc expose deployment/hello --port 8080"]
      hints:
        - match: "^oc expose service"
          say: "There is no Service yet to expose. Here you expose the Deployment, which creates the Service."
        - match: "^oc create service"
          say: "That works too, but you would have to write the selector yourself. `oc expose deployment` copies it from the Deployment."
        - match: "^oc expose (deployment|deploy)[ /]hello$"
          say: "Add the port with `--port=8080`, so that the Service sends traffic where the server listens."
        - match: "^kubectl expose"
          say: "`kubectl expose` creates the same Service. On OpenShift, write it with `oc`, as in the rest of this lesson."
      hint: "`oc expose`, then the Deployment, then `--port=8080`."
      run: "oc expose deployment hello --port=8080"
      then: "A Service called `hello`, like the Deployment. The next link is the Route."
    - kind: show
      id: route
      body: "`oc expose` on a Service creates a Route to it:"
      run: "oc expose service hello; oc get service,route"
      highlight: ["ClusterIP", "apps-crc.testing"]
      notice: |
        The Service is of type `ClusterIP`: an address reachable only inside the cluster. The Route has a host
        name built from the Route's name, the project and the cluster's application domain, and points to the
        Service `hello`, port 8080.
    - kind: show
      id: curl-ok
      body: |
        Now a request from outside the cluster, to the Route's host name. The wait is specific to OpenShift
        Local on this machine: its background service adds each new Route's host name to this machine's
        `/etc/hosts` a few seconds after the Route is created. On a normal cluster, a wildcard DNS entry
        already covers the whole application domain, so there is nothing to wait for. `-D -` prints the
        response headers, and `grep` keeps the status line and the `Server` header:
      run: "sleep 20; curl -s -o /dev/null -D - http://$(oc get route hello -o jsonpath='{.spec.host}')/ | grep -i -e '^HTTP' -e '^server'"
      notice: |
        The status line says `403 Forbidden`, and the `Server` header names Apache: the server in this image
        answered. Its default test page returns 403 when no site has been installed, so here the request
        crossed the whole chain, Route, Service and pod. This is an HTTP status from the application. It is not
        the Forbidden that the Kubernetes API prints when RBAC refuses you.
    - kind: teach
      id: selectors
      title: "How the Service finds its pods"
      body: |
        The Service does not keep a list of pods. It has a **selector**, a set of labels, and sends traffic to
        every **ready** pod whose labels match. The cluster keeps the current list of those pods' addresses in
        objects called **EndpointSlices**, one set per Service.

        `oc expose deployment` copied the Deployment's selector into the Service, which is why the chain worked.
        When you write a Service by hand, nothing checks that its selector matches a single pod.
    - kind: show
      id: endpoints
      run: "oc get service hello -o jsonpath='{.spec.selector}{\"\\n\"}'; oc get pods --show-labels; oc get endpointslices -l kubernetes.io/service-name=hello"
      highlight: ["app=hello", "app\":\"hello"]
      notice: |
        The selector is `app=hello`, the pod carries `app=hello`, and the EndpointSlice lists the pod's address
        on port 8080. `kubernetes.io/service-name` is a label the cluster puts on each EndpointSlice, naming
        its Service.
    - kind: ask
      id: guess-selector
      guess: true
      prompt: "Someone changes the Service's selector to `app=hello,tier=web`. The pod has no `tier` label. What does the URL answer?"
      choices:
        - text: "The same as before"
          why: "The Service always uses its current selector. See the next step."
        - text: "An error from the router"
          why: "See the next step."
        - text: "Nothing: the request hangs"
          why: "The router is still there and answers at once. What is missing is behind it. See the next step."
      answer: 1
    - kind: show
      id: break
      run: "oc set selector service hello app=hello,tier=web; sleep 5; oc get endpointslices -l kubernetes.io/service-name=hello; curl -s -o /dev/null -w '%{http_code}\\n' http://$(oc get route hello -o jsonpath='{.spec.host}')/"
      highlight: ["<unset>", "503"]
      notice: |
        The EndpointSlice now lists no address (`<unset>`), and the URL answers `503`. In this recording the
        selector change caused it: the Service has no ready pod to send requests to, although the pod itself is
        still running and healthy, which is what makes this failure confusing at first. A 503 does not prove
        this cause: the router also answers 503 for a host or Route it does not know, so on an unfamiliar
        failure you check the host and the Route before the Service.
      understand:
        purpose: Replaces the Service's selector with one that no pod matches, then shows the Service's EndpointSlice
          and the HTTP status code that the Route's address returns.
        parts:
          - text: oc set selector service hello app=hello,tier=web
            means: Replaces the Service's whole selector with these two labels. A pod is selected only if it carries both.
          - text: -l kubernetes.io/service-name=hello
            means: EndpointSlices carry this label, naming the Service they belong to.
          - text: -o /dev/null -w '%{http_code}\n'
            means: Throws the page away and prints only the HTTP status code, followed by a line break.
          - text: $(oc get route hello -o jsonpath='{.spec.host}')
            means: Inserts the Route's host name into the URL.
        concepts:
          - net.services
          - net.endpointslices
          - k8s.labels
        refs:
          - title: OpenShift 4.21 CLI reference (oc set selector)
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-set-selector
          - title: 'Kubernetes: EndpointSlices'
            url: https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/
          - title: curl manual (-o, -w)
            url: https://curl.se/docs/manpage.html
    - kind: try
      id: try-fix
      body: "Put the Service's selector back to `app=hello`."
      accept: ["oc set selector service hello app=hello", "oc set selector svc hello app=hello", "oc set selector service/hello app=hello", "oc set selector svc/hello app=hello"]
      hints:
        - match: "^oc label"
          say: "Adding `tier=web` to the pod would also work, until the Deployment replaces it with a pod that lacks the label. The selector is what was changed by mistake: fix it."
        - match: "^oc set selector (service|svc)[ /]hello$"
          say: "Give the selector you want, `app=hello`, after the Service's name."
        - match: "^oc set selector (deployment|deploy)"
          say: "A Deployment's selector cannot be changed. The one that was changed is the Service's."
      hint: "`oc set selector` replaces the whole selector: give the Service, then only the label its pods really carry."
      run: "oc set selector service hello app=hello"
    - kind: show
      id: fixed
      run: "sleep 5; oc get endpointslices -l kubernetes.io/service-name=hello; curl -s -o /dev/null -w '%{http_code}\\n' http://$(oc get route hello -o jsonpath='{.spec.host}')/"
      notice: "The pod's address is back in the EndpointSlice, and the server answers again (`403`, its test page)."
    - kind: teach
      id: new-app
      title: "One command for most of the chain"
      body: |
        `oc new-app` creates several objects at once from an image: a Deployment, a Service for the ports the
        image declares, and an **ImageStream**, an OpenShift object that names the image and tracks its tags.
        It labels the objects it creates with `app=<name>`, so `oc get all -l app=<name>` lists them. It also
        builds from source code, which a later lesson covers.
    - kind: ask
      id: guess-new-app
      guess: true
      prompt: "`oc new-app --name=quick --image=…` ends with Success. Can someone outside the cluster open it?"
      choices:
        - text: "Yes, it has a public URL"
          why: "Look at the list of objects it creates, in the next step."
        - text: "No, it has no Route yet"
          why: "See the next step."
        - text: "No, nothing runs until a build"
          why: "From an existing image there is nothing to build: the Deployment starts right away. See the next step."
      answer: 1
    - kind: show
      id: show-new-app
      run: "oc new-app --name=quick --image=registry.access.redhat.com/ubi9/httpd-24:latest; oc get all -l app=quick"
      highlight: ["not exposed", "8080/TCP,8443/TCP"]
      notice: |
        An ImageStream, a Deployment and a Service, and a reminder that the application is **not exposed**:
        no Route. `oc get all -l app=quick` finds those three by the label `oc new-app` gave them; the
        Deployment, one second old, has no pod yet. The Service has two ports, the ones the image declares,
        where `oc expose` earlier used the one you chose. The warning comes from `all`, which also asks for
        DeploymentConfigs, a deprecated kind.
    - kind: teach
      id: capacity
      title: "Two ways to change capacity"
      body: |
        More copies of the same pod, or bigger pods: these are different changes, and the difference shows in
        the ReplicaSets.

        - `oc scale` changes the number of replicas. The pod template does not change.
        - `oc set resources` changes the CPU and memory each pod requests and may use. That is part of the
          pod template, so the Deployment starts a **rollout**: a new ReplicaSet, and new pods replacing the
          old ones.
    - kind: ask
      id: guess-rs
      guess: true
      prompt: "After `oc scale` to 3, then `oc set resources`, how many ReplicaSets will `hello` have?"
      choices:
        - text: "One"
          why: "Scaling does not need a new one, but changing resources changes the template. See the next step."
        - text: "Two"
          why: "See the next step."
        - text: "Three"
          why: "Scaling resizes the existing ReplicaSet instead of creating one. See the next step."
      answer: 1
    - kind: show
      id: show-scale
      run: "oc scale deployment hello --replicas=3; oc rollout status deployment/hello --timeout=180s >/dev/null; oc get replicasets -l app=hello"
      notice: "One ReplicaSet, now with three pods: scaling only changed a number."
    - kind: show
      id: show-resources
      run: "oc set resources deployment hello --requests=cpu=20m,memory=32Mi --limits=memory=128Mi; oc rollout status deployment/hello --timeout=180s >/dev/null; oc get replicasets -l app=hello"
      highlight: ["0         0         0"]
      notice: |
        A second ReplicaSet with the three pods, and the first one scaled to zero. It is kept so that `oc
        rollout undo` can go back to it.
      understand:
        purpose: Sets the CPU and memory requests and a memory limit for the Deployment's container, waits for the rollout
          that this change starts, and lists the Deployment's ReplicaSets.
        parts:
          - text: --requests=cpu=20m,memory=32Mi
            means: What the container asks for; the scheduler places the pod on a node with that much room. `20m` is 20
              millicores (0.02 of a CPU), `32Mi` is 32 mebibytes (32 × 2^20 bytes).
          - text: --limits=memory=128Mi
            means: The most memory the container may use. A container that goes above it can be stopped by the system
              (an out-of-memory kill). No CPU limit is set here.
          - text: oc rollout status deployment/hello --timeout=180s
            means: Waits until the new pods have replaced the old ones, for at most 180 seconds.
        mistakes:
          - 'Writing `memory=400m`: for memory, `m` means millibytes, so that is 0.4 bytes. Use `Mi` (or `M`).'
        concepts:
          - k8s.requests-limits
          - k8s.rollout
        refs:
          - title: 'Kubernetes: Resource management for pods and containers'
            url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          - title: OpenShift 4.21 CLI reference (oc set resources)
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-set-resources
    - kind: teach
      id: hpa
      title: "Letting the cluster choose the number"
      body: |
        A **HorizontalPodAutoscaler** (HPA) changes the number of replicas for you, from measurements such as
        CPU use. `oc autoscale deployment hello --min=2 --max=5 --cpu=60%` aims for an average of 60% of each
        pod's CPU *request*, which is why the requests set above matter: without them, there is nothing to
        compute a percentage of.

        Watch the `%`. `--cpu=60` without it means 60 millicores per pod, a very different target.
    - kind: show
      id: show-hpa
      run: "oc autoscale deployment hello --min=2 --max=5 --cpu=60%; sleep 30; oc get hpa hello; oc describe hpa hello | tail -n 12"
      highlight: ["<unknown>", "ScalingActive"]
      notice: |
        `<unknown>`: the autoscaler has no CPU measurement. The `ScalingActive False` condition says why: the
        metrics API (`pods.metrics.k8s.io`) is not served on this OpenShift Local cluster. So the HPA cannot
        compute a CPU-based replica count here. It can still correct a count that lies outside its bounds, as
        the next steps show. On a full cluster the column shows the current use against the target.
    - kind: ask
      id: scale-back
      guess: true
      prompt: "With this HPA in place, and no CPU measurement, you run `oc scale deployment hello --replicas=10`. What happens next?"
      choices:
        - text: "The HPA sets it back within its bounds"
          why: "The HPA owns the replica count now. To change the range, edit the existing HPA's `minReplicas` and `maxReplicas` fields instead of scaling by hand. See the next step."
        - text: "It stays at 10 until you change it"
          why: "Two things now write the same field, and the HPA keeps applying its own decision, between 2 and 5. See the next step."
        - text: "`oc scale` is refused while an HPA exists"
          why: "Nothing refuses it. The change is accepted, then overwritten by the HPA. See the next step."
      answer: 0
    - kind: show
      id: show-hpa-bounds
      body: "The recording scales to 10 by hand, waits 30 seconds, then reads the Deployment and the autoscaler's `SuccessfulRescale` events:"
      run: "oc scale deployment hello --replicas=10; sleep 30; oc get deployment hello; oc get events --field-selector reason=SuccessfulRescale -o custom-columns=OBJECT:.involvedObject.name,MESSAGE:.message"
      notice: |
        `scaled` to 10, yet 30 seconds later the Deployment has 5 replicas. The HPA's event says why: `New
        size: 5; reason: Current number of replicas above Spec.MaxReplicas`. It needed no CPU measurement for
        that: bringing the count back within its bounds comes before any metric. To change the range, edit the
        HPA's `minReplicas` and `maxReplicas`, not the Deployment.
    - kind: show
      id: console-hpa
      body: "An autoscaler in the web console (a demo HPA for a Deployment `web`, 2 to 4 replicas at 80% CPU):"
      image:
        src: hpa.png
        alt: "The details of the HorizontalPodAutoscaler web: scale target web, min replicas 2, max replicas 4, current replicas 2, desired replicas 0; under Metrics, resource cpu as a percentage of request with current a dash and target 80%; under Conditions, AbleToScale True."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "Workloads > HorizontalPodAutoscalers > web"
      notice: "*Current* is a dash: OpenShift Local has no metrics to measure CPU. The autoscaler still enforces its bounds, as the recording above showed; here 2 replicas are already within 2 to 4, so *Desired* stays 0 and it changes nothing."
    - kind: order
      id: order-chain
      prompt: "A request arrives for the application's URL. Put the links it crosses in order."
      items:
        - "The router finds the Route for the host name"
        - "The Route names the Service"
        - "The Service's EndpointSlices list its ready pods"
        - "One of those pods receives the request"
      why: "This is the order a request crosses, and so the order to check when a URL fails: the host and the Route, then the Service, then its ready endpoints and the port."
    - kind: reflect
      id: explain-503
      prompt: "The pods are Running and ready, yet the URL answers 503. Explain to a colleague where you look first, and why."
      model: |
        A 503 does not prove one cause: the router also answers it for a host or Route it does not know. So I
        first verify the requested host name and the Route, then the Service. With the pods healthy, I check the
        link between the Service and the pods: `oc get endpointslices -l kubernetes.io/service-name=<service>`.
        If it lists no address, the Service's selector does not match the pods' labels (or the pods are not
        ready), and I compare the selector with `oc get pods --show-labels`. I also check the Service's port
        against the one the program listens on.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can build the chain from a URL to a pod, check the Service's link to its pods through its
        selector and EndpointSlices, recognise the 503 of a Service with no endpoints, read what `oc new-app`
        creates, and change capacity knowing which change starts a rollout.

        Next in this module: templates, the life of a pod, and requests and limits.
        [Deploy, expose and scale an application](/lab/lab.deploy-apps) repeats this chain step by step. Finding
        a broken link with no guidance comes after [Services, EndpointSlices and DNS](/lesson/d.services-dns),
        in incidents such as [Route returns 503, pods are healthy](/lab/inc.service-selector-503).
  sections:
    - id: more-deploy
      title: "Other ways to create an application, and other mistakes"
      depth: true
      body: |
        | Starting point | Command | What it creates |
        |---|---|---|
        | An existing image | `oc create deployment web --image=…` | a Deployment only (labels and selector `app=web`) |
        | An existing image, more done for you | `oc new-app --name=web --image=…` | ImageStream, Deployment, Service for the ports the image declares |
        | Source code in Git | `oc new-app <builder-image>~<git-url>` | BuildConfig, ImageStreams, Deployment, Service; a first build starts |
        | A stored template | `oc new-app --template=<name>` | whatever objects the template defines |
        | Manifests (YAML in Git) | `oc apply -f <dir>` | exactly the objects in the files |

        For a team service that must be reviewed and repeated, the last row is the normal one: manifests in
        Git, applied by `oc apply` or a GitOps tool. Add `-o yaml` to `oc new-app` to preview its objects
        without creating them. OpenShift's older **DeploymentConfig** kind is deprecated since 4.14: use
        Deployments.

        - **`all` is not everything.** `oc delete all -l app=<name>` removes workloads, Services and
          ImageStreams, but not ConfigMaps, Secrets or PersistentVolumeClaims.
        - **A Deployment's selector cannot change** in `apps/v1`. A different selector means a new Deployment.
        - **Two Deployments with the same labels** in one project make one Service send traffic to both.
        - **Connection refused through a Service that has endpoints** usually means its `targetPort` is not
          the port the program listens on.
        - **With an HPA, remove `spec.replicas`** from manifests you apply again and again, or every apply
          resets the count.
        - **Rollout speed.** By default `RollingUpdate` adds up to 25% more pods (rounded up) and keeps at
          least 75% available (25% unavailable, rounded down).
  review:
    - q: "Which objects does a request cross from a URL to a pod, and how is each link made?"
      a: "Route (names the Service), Service (selects pods by labels, listed in EndpointSlices), then a pod managed by a Deployment through a ReplicaSet."
    - q: "The pods are healthy and the Route answers 503. What do you check first?"
      a: "First the host name and the Route (a router 503 also means an unknown host or Route), then `oc get endpointslices -l kubernetes.io/service-name=<svc>`: no address means the Service selects no ready pod."
    - q: "Which objects does `oc new-app --image=…` create, and which does it not?"
      a: "An ImageStream, a Deployment and a Service. No Route: expose the Service yourself."
    - q: "Does `oc scale` create a new ReplicaSet? Does `oc set resources`?"
      a: "`oc scale` does not; `oc set resources` changes the template, so it starts a rollout with a new ReplicaSet."
    - q: "What is the difference between `--cpu=60%` and `--cpu=60` in `oc autoscale`?"
      a: "60% of each pod's CPU request, versus an average of 60 millicores per pod."
  commands:
    - cmd: "oc create deployment hello --image=registry.access.redhat.com/ubi9/httpd-24:latest --port=8080; oc rollout status deployment/hello --timeout=180s; oc get deployment,replicaset,pods"
      meaning: "a Deployment, its ReplicaSet and its pod"
    - cmd: "oc expose deployment hello --port=8080"
      meaning: "a Service with the Deployment's selector"
    - cmd: "oc expose service hello; oc get service,route"
      meaning: "a Route to the Service"
    - cmd: "sleep 20; curl -s -o /dev/null -D - http://$(oc get route hello -o jsonpath='{.spec.host}')/ | grep -i -e '^HTTP' -e '^server'"
      meaning: "a request through the whole chain"
    - cmd: "oc get service hello -o jsonpath='{.spec.selector}{\"\\n\"}'; oc get pods --show-labels; oc get endpointslices -l kubernetes.io/service-name=hello"
      meaning: "the selector, the pod's labels, and the endpoints that result"
    - cmd: "oc set selector service hello app=hello,tier=web; sleep 5; oc get endpointslices -l kubernetes.io/service-name=hello; curl -s -o /dev/null -w '%{http_code}\\n' http://$(oc get route hello -o jsonpath='{.spec.host}')/"
      meaning: "a selector that matches nothing: no endpoints, 503"
    - cmd: "oc set selector service hello app=hello"
      meaning: "the selector put back"
    - cmd: "sleep 5; oc get endpointslices -l kubernetes.io/service-name=hello; curl -s -o /dev/null -w '%{http_code}\\n' http://$(oc get route hello -o jsonpath='{.spec.host}')/"
      meaning: "endpoints again, and an answer from the server"
    - cmd: "oc new-app --name=quick --image=registry.access.redhat.com/ubi9/httpd-24:latest; oc get all -l app=quick"
      meaning: "new-app: ImageStream, Deployment, Service, no Route"
    - cmd: "oc scale deployment hello --replicas=3; oc rollout status deployment/hello --timeout=180s >/dev/null; oc get replicasets -l app=hello"
      meaning: "scaling resizes the same ReplicaSet"
    - cmd: "oc set resources deployment hello --requests=cpu=20m,memory=32Mi --limits=memory=128Mi; oc rollout status deployment/hello --timeout=180s >/dev/null; oc get replicasets -l app=hello"
      meaning: "a template change: a new ReplicaSet"
    - cmd: "oc autoscale deployment hello --min=2 --max=5 --cpu=60%; sleep 30; oc get hpa hello; oc describe hpa hello | tail -n 12"
      meaning: "an autoscaler, without metrics on this cluster"
    - cmd: "oc scale deployment hello --replicas=10; sleep 30; oc get deployment hello; oc get events --field-selector reason=SuccessfulRescale -o custom-columns=OBJECT:.involvedObject.name,MESSAGE:.message"
      meaning: "a manual scale outside the HPA's bounds, set back by the HPA"
  references:
    - {title: "OpenShift 4.21: Building applications, creating applications using the CLI (oc new-app)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/creating-applications"}
    - {title: "OpenShift 4.21: Routes", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes"}
    - {title: "Kubernetes: Service (selectors and EndpointSlices)", url: "https://kubernetes.io/docs/concepts/services-networking/service/"}
    - {title: "Kubernetes: Deployments (scaling, rollout, strategy)", url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"}
    - {title: "Kubernetes: Horizontal Pod Autoscaling", url: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"}
- id: n.templates
  title: "Templates"
  subtitle: "Objects with parameters, processed into plain objects and created with your own permissions"
  module: a2-apps
  mode: REAL_LAB
  minutes: 25
  level: 2
  supports: "OpenShift 4.21 template.openshift.io/v1 (an OpenShift-only API; plain Kubernetes has no Template kind) and oc 4.21. Cluster Samples Operator deprecated since 4.16. Recorded on OpenShift Local as an ordinary user, in a temporary project."
  concepts: [ocp.templates, deploy.packaging, k8s.deployment]
  prerequisites: [o1.deploy-apps]
  labs: [lab.templates]
  record_on: cluster
  files:
    shop.yaml: |
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        name: shop
        annotations:
          description: "A web server and the Secret holding its database password"
      labels:
        app.kubernetes.io/instance: ${APP_NAME}
      parameters:
      - name: APP_NAME
        description: Name of the application
        required: true
      - name: REPLICAS
        description: Number of web servers
        value: "2"
      - name: DB_PASSWORD
        description: Generated when not supplied
        generate: expression
        from: "[a-zA-Z0-9]{12}"
      objects:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: ${APP_NAME}-db
        stringData:
          password: ${DB_PASSWORD}
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${APP_NAME}
        spec:
          replicas: ${{REPLICAS}}
          selector:
            matchLabels:
              app: ${APP_NAME}
          template:
            metadata:
              labels:
                app: ${APP_NAME}
            spec:
              containers:
              - name: web
                image: registry.access.redhat.com/ubi9/httpd-24:latest
  objective: |
    Read a Template, predict what processing produces (parameters, generated values, labels), create its objects
    knowing that they are created with your own permissions, avoid the trap of values generated again, and
    recognise when a Template is still the right tool.
  flow:
    - kind: ask
      id: recall-perms
      recalls: o1.cli
      prompt: "A look back. You run `oc apply -f app.yaml`. With whose permissions are its objects created?"
      choices:
        - text: "Yours"
          why: "The API server checks every request against the identity that sends it, whatever the file contains."
        - text: "The file author's"
          why: "A file has no identity. The request is yours, and so are the permissions checked."
        - text: "The cluster administrator's"
          why: "`oc apply` sends ordinary requests with your token. Nothing raises your rights."
      answer: 0
    - kind: teach
      id: what
      title: "A list of objects, with blanks to fill"
      body: |
        A **Template** is an OpenShift object that holds other objects, with blanks in them called
        **parameters**, written `${NAME}`. Plain Kubernetes has nothing like it.

        Using a template has two steps. **Processing** fills in the parameters and returns plain objects, a
        Secret, a Deployment and so on. Nothing is created yet. Then those objects are **created**, like any
        others: by you, with your permissions. When you process and apply a template yourself, it grants no right
        you do not have.

        Project creation is a different operation. Asking for a project, with the CLI or the console, is a
        request that the server carries out itself, from the project request template: a built-in default, or one
        an administrator configured. That is how a
        user who cannot create namespaces directly still becomes the administrator of a new project.

        The file `shop.yaml` holds a small template: a **Secret** (the object for credentials, which has its
        own lesson) holding a database password, and a Deployment of a web server. Its parameters come first:
    - kind: show
      id: show-params
      run: "sed -n '/^parameters:/,/^objects:/p' shop.yaml"
      notice: |
        Three parameters, three behaviours. `APP_NAME` is **required**: it has no value, and processing
        refuses to go on without one. `REPLICAS` has a default, `2`. `DB_PASSWORD` is **generated**: twelve
        letters and digits, drawn at random, unless you give one.
    - kind: show
      id: show-list
      body: "`oc process --parameters` lists them, as `oc` reads them:"
      run: "oc process --parameters -f shop.yaml"
      notice: |
        One row per parameter. `VALUE` is the default; for a generated parameter it holds the generator's
        pattern instead, with `expression` under `GENERATOR`. A row with neither, `APP_NAME` here, is a value
        that you must give.
    - kind: ask
      id: which-required
      prompt: "A colleague's template has these parameters. Which value must you supply to process it?"
      evidence: |
        NAME       VALUE    GENERATOR
        APP_NAME
        PORT       8080
        TOKEN               expression
      choices:
        - text: "`APP_NAME`, which has no default"
          why: "It has neither a default value nor a generator, so nothing can fill it in. Processing stops until you give one."
        - text: "`PORT`, because it is a number"
          why: "`PORT` has the default `8080`. Without `-p`, the default is used, whatever the type."
        - text: "`TOKEN`, because it is a secret"
          why: "`TOKEN` has a generator, which draws a random value when you give none. Only `-p` replaces it."
      answer: 0
    - kind: show
      id: show-missing
      body: "Now `shop.yaml` processed without a value for `APP_NAME`. This step is expected to fail:"
      run: "oc process -f shop.yaml"
      notice: "The same check on `shop.yaml`: processing stopped before producing anything, and the message names the parameter. `-p NAME=value` gives a parameter its value."
    - kind: show
      id: show-source
      body: "Before processing, here are the blanks in the objects of `shop.yaml`, with their line numbers:"
      run: "grep -n '\\${' shop.yaml"
      notice: |
        `${APP_NAME}` appears in names, labels and selectors, and `${DB_PASSWORD}` in the Secret. With single
