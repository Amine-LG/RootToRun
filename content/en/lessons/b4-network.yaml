# Network security and exposure, written as teaching flows. The cluster steps were recorded on OpenShift Local by
# the cluster administrator and the ordinary user developer; documented examples say so where they appear.
- id: d.networkpolicy-ovn
  title: NetworkPolicies and OVN-Kubernetes
  module: b4-network-security
  diagram: networkpolicy
  mode: REAL_LAB
  minutes: 45
  level: 2
  supports: "OpenShift 4.21 default OVN-Kubernetes network, networking.k8s.io/v1 NetworkPolicy, and policy.networking.k8s.io/v1alpha1 AdminNetworkPolicy. Every step was run on OpenShift Local 4.21: the ordinary user developer wrote the policies and tested every connection; the cluster administrator (kubeadmin) created the two projects, labelled a namespace and applied one AdminNetworkPolicy, all removed afterwards (experiment X-NET-03)."
  concepts:
    - net.policy
    - net.ovn
    - sec.segmentation
  prerequisites:
    - d.services-dns
  record_on: cluster-admin
  objective: |
    Write and test NetworkPolicies: default deny for ingress and egress, allowing DNS and specific callers by pod and
    namespace labels, and the OpenShift rule for the router; then see an administrator's AdminNetworkPolicy override
    a project's own allow rule.
  files:
    shop.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: web-content
      data:
        index.html: |
          hello from lab-shop
        healthz: ok
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
        labels:
          app: web
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              readinessProbe:
                httpGet: {path: /healthz, port: 8080}
                periodSeconds: 5
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - name: content
                mountPath: /var/www/html
            volumes:
            - name: content
              configMap:
                name: web-content
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: web
      spec:
        selector:
          app: web
        ports:
        - name: http
          port: 8080
          targetPort: 8080
      ---
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: web
      spec:
        to:
          kind: Service
          name: web
        port:
          targetPort: http
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: client
        labels:
          app: client
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: client
        template:
          metadata:
            labels:
              app: client
          spec:
            terminationGracePeriodSeconds: 2
            containers:
            - name: curl
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: stranger
        labels:
          app: stranger
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: stranger
        template:
          metadata:
            labels:
              app: stranger
          spec:
            terminationGracePeriodSeconds: 2
            containers:
            - name: curl
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
    reports.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: reports
        labels:
          app: reports
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: reports
        template:
          metadata:
            labels:
              app: reports
          spec:
            terminationGracePeriodSeconds: 2
            containers:
            - name: curl
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
    reach.sh: |
      # reach.sh: which callers get an answer from web? curl gives up after 3 seconds and then prints 000.
      for caller in lab-shop/client lab-shop/stranger lab-reports/reports; do
        ns=${caller%/*}; app=${caller#*/}
        code=$(oc exec deploy/$app -n $ns -- curl -s -m 3 -o /dev/null -w '%{http_code}' http://web.lab-shop.svc:8080/ 2>/dev/null)
        echo "$caller -> web: $code"
      done
    deny-ingress.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
      spec:
        podSelector: {}
        policyTypes: [Ingress]
    allow-client.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-client
      spec:
        podSelector:
          matchLabels: {app: web}
        policyTypes: [Ingress]
        ingress:
        - from:
          - podSelector:
              matchLabels: {app: client}
          ports:
          - {protocol: TCP, port: 8080}
    allow-reports.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-reports
      spec:
        podSelector:
          matchLabels: {app: web}
        policyTypes: [Ingress]
        ingress:
        - from:
          - namespaceSelector:
              matchLabels: {team: reports}
            podSelector:
              matchLabels: {app: reports}
          ports:
          - {protocol: TCP, port: 8080}
    allow-router.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-router
      spec:
        podSelector:
          matchLabels: {app: web}
        policyTypes: [Ingress]
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                policy-group.network.openshift.io/ingress: ""
          ports:
          - {protocol: TCP, port: 8080}
    deny-egress.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-egress
      spec:
        podSelector: {}
        policyTypes: [Egress]
    allow-dns.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-dns
      spec:
        podSelector: {}
        policyTypes: [Egress]
        egress:
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: openshift-dns
          ports:
          - {protocol: UDP, port: 5353}
          - {protocol: TCP, port: 5353}
    allow-client-egress.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-client-egress
      spec:
        podSelector:
          matchLabels: {app: client}
        policyTypes: [Egress]
        egress:
        - to:
          - podSelector:
              matchLabels: {app: web}
          ports:
          - {protocol: TCP, port: 8080}
    academy-deny-reports.yaml: |
      apiVersion: policy.networking.k8s.io/v1alpha1
      kind: AdminNetworkPolicy
      metadata:
        name: academy-deny-reports
      spec:
        priority: 40
        subject:
          namespaces:
            matchLabels:
              kubernetes.io/metadata.name: lab-shop
        ingress:
        - name: deny-from-lab-reports
          action: Deny
          from:
          - namespaces:
              matchLabels:
                kubernetes.io/metadata.name: lab-reports
  flow:
    - kind: teach
      id: situation
      title: Security hardening becomes a timeout
      body: |
        The web application worked until a project added network isolation. Its pod is ready, but the reporting
        client now waits until its request times out. You need to permit the intended caller while keeping
        unrelated workloads out.

        A **NetworkPolicy** selects pods and describes permitted connections. OVN-Kubernetes enforces those rules on
        OpenShift's default pod network. Everything below was done on a lab cluster: the administrator created two
        projects, `lab-shop` and `lab-reports`, with the ordinary user `developer` as their administrator, and
        developer wrote every policy and tested every connection. The prompt in front of each command names who ran
        it.
    - kind: teach
      id: isolation
      title: Isolation belongs to a pod and a direction
      body: |
        **Ingress** means incoming connections to a pod; **egress** means outgoing connections from it. A pod that
        no NetworkPolicy selects for a direction accepts all traffic in that direction. The first policy that selects
        it for ingress turns ingress into an allow list. Further policies add allowed traffic; they never subtract
        it, and their order does not matter.

        The same applies independently to egress. For a pod-to-pod connection, both the caller's egress and the
        destination's ingress must permit it. Replies to an allowed connection are allowed automatically.
    - kind: show
      id: projects
      run: "oc adm new-project lab-shop --admin=developer && oc adm new-project lab-reports --admin=developer"
      notice: "Two projects, each with developer as its administrator."
    - kind: show
      id: deploy
      body: "In `lab-shop`: `web` (a small web server behind a Service and a Route) and two pods with `curl`, `client` and `stranger`. In `lab-reports`: one more `curl` pod, `reports`."
      run: "oc apply -f shop.yaml -n lab-shop && oc apply -f reports.yaml -n lab-reports && oc wait --for=condition=Available deployment --all -n lab-shop --timeout=180s && oc wait --for=condition=Available deployment --all -n lab-reports --timeout=180s"
      notice: "Every object is created and all four Deployments are available."
    - kind: ask
      id: who-can-connect
      prompt: No NetworkPolicy exists in either project yet. Which pods can open a connection to web?
      choices:
      - text: Every pod, in both projects
        why: A pod that no NetworkPolicy selects accepts every connection. A project groups objects and permissions; on its own it is not a network boundary.
      - text: Only the pods in lab-shop
        why: Projects do not filter traffic. Until a policy selects web, a pod in lab-reports reaches it like any other.
      - text: Only pods whose labels a policy names
        why: Labels matter once a policy selects web. With no policy, nothing is checked at all.
      answer: 0
    - kind: show
      id: labels
      body: "Policies select pods by label, so read the labels first:"
      run: "oc get pods -n lab-shop --show-labels"
      notice: "`app=web`, `app=client` and `app=stranger`, plus the `pod-template-hash` label every Deployment adds."
    - kind: show
      id: open-test
      body: "A connection test runs `curl` inside a caller pod. `-m 3` gives up after three seconds:"
      run: "oc exec deploy/stranger -n lab-shop -- curl -s -m 3 http://web:8080/"
      notice: "`hello from lab-shop`: with no policy, any pod may connect."
    - kind: show
      id: reach-script
      code: |
        # reach.sh: which callers get an answer from web? curl gives up after 3 seconds and then prints 000.
        for caller in lab-shop/client lab-shop/stranger lab-reports/reports; do
          ns=${caller%/*}; app=${caller#*/}
          code=$(oc exec deploy/$app -n $ns -- curl -s -m 3 -o /dev/null -w '%{http_code}' http://web.lab-shop.svc:8080/ 2>/dev/null)
          echo "$caller -> web: $code"
        done
      caption: "reach.sh"
      notice: "Three callers, one line each: the same `oc exec … curl -s -m 3` test, printing only the HTTP status. `000` means no HTTP answer at all."
    - kind: show
      id: reach-open
      run: "sh reach.sh"
      notice: "`200` for all three, including `reports` in the other project."
    - kind: show
      id: route-open
      body: "And through the Route, from the workstation, via the router:"
      run: "curl -s -m 10 -o /dev/null -w '%{http_code}\\n' http://web-lab-shop.apps-crc.testing/"
      notice: "`200`."
    - kind: teach
      id: deny-ingress-teach
      title: Default deny for ingress
      body: |
        An empty top-level `podSelector` selects every pod in the namespace. With `policyTypes: [Ingress]` and no
        rules, it isolates every pod for ingress and allows nothing: a **default deny**.
    - kind: show
      id: deny-ingress-file
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-ingress
        spec:
          podSelector: {}
          policyTypes: [Ingress]
      caption: "deny-ingress.yaml"
    - kind: try
      id: try-deny-ingress
      body: "As developer, apply `deny-ingress.yaml` to the project `lab-shop`."
      accept: ["oc apply -f deny-ingress.yaml -n lab-shop", "oc apply -f deny-ingress.yaml --namespace=lab-shop", "oc apply -f deny-ingress.yaml --namespace lab-shop", "oc apply -n lab-shop -f deny-ingress.yaml", "oc -n lab-shop apply -f deny-ingress.yaml", "oc create -f deny-ingress.yaml -n lab-shop", "oc apply --filename=deny-ingress.yaml -n lab-shop"]
      hints:
        - match: "^(?!.*(^| )(-n|--namespace)([ =]|$)).*$"
          say: "The file names no namespace. Without `-n lab-shop`, the policy lands in your current project."
        - match: "lab-reports"
          say: "The web server to protect is in `lab-shop`."
      hint: "`oc apply -f` with the file, and `-n lab-shop`."
      run: "oc apply -f deny-ingress.yaml -n lab-shop"
      then: "`networkpolicy.networking.k8s.io/default-deny-ingress created`."
    - kind: ask
      id: guess-deny
      guess: true
      prompt: "`client` runs the same curl to web again. What does it get?"
      choices:
        - text: "A quick 'connection refused'"
          why: "A refusal is an answer from the destination. OVN-Kubernetes drops the packets instead, so nothing answers."
        - text: "No answer until curl gives up"
          why: "Dropped packets look like a silent network. The next step shows curl's exit status for that."
        - text: "The page, because client is in the same project"
          why: "Being in the same project grants nothing once web is isolated for ingress."
      answer: 1
    - kind: show
      id: client-denied
      run: "oc exec deploy/client -n lab-shop -- curl -s -m 3 http://web:8080/"
      notice: "No output, then `command terminated with exit code 28`: curl's code for a timeout. A timeout like this is the usual sign of a dropped connection; it does not say which policy dropped it."
    - kind: show
      id: reach-denied
      run: "sh reach.sh"
      notice: "`000` for all three callers."
    - kind: show
      id: route-denied
      body: "And the Route?"
      run: "curl -s -m 10 -o /dev/null -w '%{http_code}\\n' http://web-lab-shop.apps-crc.testing/"
      notice: "Still `200`, although every pod in `lab-shop` is isolated for ingress."
    - kind: teach
      id: router
      title: Why the Route still works here
      body: |
        The default router on this cluster runs on the node's own network (**host network**), and traffic that
        comes from a pod's own node is not blocked by NetworkPolicy. OpenShift Local has one node, so the router is
        always on the same node as `web`. On a cluster with several nodes, router traffic from another node is
        blocked by the same default deny. The next two commands show the evidence.
    - kind: show
      id: router-node
      run: "oc get pods -n openshift-ingress -o custom-columns=NAME:.metadata.name,HOSTNETWORK:.spec.hostNetwork,NODE:.spec.nodeName"
      notice: "`router-default-…` has `HOSTNETWORK` `true` and runs on node `crc`. (`routes-controller` belongs to OpenShift Local.)"
    - kind: show
      id: web-node
      run: "oc get pods -l app=web -n lab-shop -o wide"
      notice: "`web` runs on `crc` too. A Route test that passes on a one-node cluster therefore proves nothing about the router rule."
    - kind: show
      id: allow-client
      title: Allow one caller
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-client
        spec:
          podSelector:
            matchLabels: {app: web}
          policyTypes: [Ingress]
          ingress:
          - from:
            - podSelector:
                matchLabels: {app: client}
            ports:
            - {protocol: TCP, port: 8080}
      caption: "allow-client.yaml"
      notice: |
        The top selector chooses the pods this policy protects: web. The `from` selector allows client pods in the
        same namespace, on the web pods' TCP port 8080.
    - kind: ask
      id: first-policy
      prompt: "With `default-deny-ingress` and `allow-client` in `lab-shop`, which callers will reach web?"
      choices:
        - text: "client only"
          why: "Policies add up: the default deny allows nothing, allow-client allows client pods. stranger and reports match no allow rule."
        - text: "client and stranger, both in lab-shop"
          why: "A standalone podSelector matches labels, not the project as a whole. stranger has app=stranger."
        - text: "Nobody: the default deny wins"
          why: "There is no winning policy. Each policy adds what it allows, and nothing subtracts."
      answer: 0
    - kind: show
      id: apply-allow-client
      run: "oc apply -f allow-client.yaml -n lab-shop && sh reach.sh"
      notice: "`client` gets `200`; `stranger` and `reports` still get `000`."
    - kind: teach
      id: namespace-and-pod
      title: One peer entry means AND
      body: |
        A `podSelector` alone in `from` or `to` matches pods in the policy's own namespace. To allow callers in
        another namespace, select that namespace too.

        Within one peer list item, `namespaceSelector` and `podSelector` mean **AND**: those pods in those
        namespaces. Put them in separate list items and they mean **OR**: either match is enough.
    - kind: show
      id: combined-peer
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-reports
        spec:
          podSelector:
            matchLabels: {app: web}
          policyTypes: [Ingress]
          ingress:
          - from:
            - namespaceSelector:
                matchLabels: {team: reports}
              podSelector:
                matchLabels: {app: reports}
            ports:
            - {protocol: TCP, port: 8080}
      caption: "allow-reports.yaml"
      notice: "There is one dash under `from`: the caller must be `app=reports` AND belong to a namespace labelled `team=reports`."
    - kind: ask
      id: extra-dash
      prompt: A dash is added before podSelector. Which callers now match?
      evidence: |
        from:
        - namespaceSelector:
            matchLabels: {team: reports}
        - podSelector:
            matchLabels: {app: reports}
      choices:
        - text: Only reports pods in namespaces labelled team=reports
          why: That requires both selectors in one list item.
        - text: Reports pods in every namespace of the cluster
          why: A podSelector alone does not search every namespace.
        - text: Any team=reports namespace pod, or lab-shop reports pods
          why: The two list items are alternatives. A standalone podSelector is local to the policy namespace, lab-shop.
      answer: 2
    - kind: show
      id: apply-allow-reports
      run: "oc apply -f allow-reports.yaml -n lab-shop && sh reach.sh"
      notice: "The policy is created, yet `reports` still gets `000`."
    - kind: ask
      id: why-reports-blocked
      prompt: "`allow-reports` exists and the reports pod has `app=reports`. Why is it still blocked?"
      choices:
        - text: "Policies take minutes to apply"
          why: "OVN-Kubernetes applied the earlier policies within the same second. Look at what the selector needs."
        - text: "The namespace `lab-reports` has no label `team=reports`"
          why: "The namespaceSelector matches namespace labels, and nobody has set that one yet. A new project only has labels such as `kubernetes.io/metadata.name`."
        - text: "Cross-namespace traffic needs an egress rule in lab-shop"
          why: "The caller's egress is in lab-reports, which has no policy; lab-shop only needs the ingress rule."
      answer: 1
    - kind: show
      id: developer-label
      body: "developer administers `lab-reports`. Can they label it?"
      run: "oc label namespace lab-reports team=reports"
      notice: "`Forbidden`: namespaces are cluster-scoped objects, and the project's `admin` role does not allow changing them. A team cannot give its own namespace the label that another team's policy trusts."
    - kind: show
      id: admin-label
      body: "The cluster administrator sets it:"
      run: "oc label namespace lab-reports team=reports"
      notice: "`namespace/lab-reports labeled`."
    - kind: show
      id: reach-reports
      run: "sh reach.sh"
      notice: "`reports` now gets `200`: the namespace label was the missing piece. `stranger` is still out."
    - kind: ask
      id: why-policy-group
      guess: true
      prompt: Why does allow-router select the policy-group label instead of the namespace openshift-ingress by name?
      choices:
      - text: It also covers openshift-host-network, for host-network routers
        why: "Both namespaces carry the label, so one rule can cover router traffic whatever the router's publishing strategy. For routers on the host network the entry also needs `podSelector: {}`: a namespaceSelector alone matches only the ordinary pods of those namespaces, which is why the documented allow-from-router policy has both."
      - text: A namespaceSelector cannot match a namespace's name
        why: 'It can: Kubernetes labels every namespace with kubernetes.io/metadata.name and its name. The label is chosen to cover every namespace that carries router traffic.'
      - text: Router pods carry no labels to select
        why: 'allow-router selects namespaces, not pods: a namespace label matches whatever runs there, including routers on the host network.'
      answer: 0
    - kind: teach
      id: router-rule-teach
      title: Allow platform callers deliberately
      body: |
        Router and monitoring connections are callers too. OpenShift labels the namespaces whose pods carry router
        traffic with `policy-group.network.openshift.io/ingress: ""`, including `openshift-host-network` for routers
        that run on the host network. A project allows its Routes by selecting that label. Use the label as a
        selector; do not put it on application namespaces. One detail matters for host-network routers: a
        `namespaceSelector` alone matches only ordinary pods, so the documented rule adds `podSelector: {}` to the
        same entry to match the router pods that use the node's network.
    - kind: show
      id: ingress-namespaces
      run: "oc get namespaces -l policy-group.network.openshift.io/ingress"
      notice: "`openshift-host-network` and `openshift-ingress`: the two namespaces that the router rule will match."
    - kind: show
      id: router-rule
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-router
        spec:
          podSelector:
            matchLabels: {app: web}
          policyTypes: [Ingress]
          ingress:
          - from:
            - namespaceSelector:
                matchLabels:
                  policy-group.network.openshift.io/ingress: ""
            ports:
            - {protocol: TCP, port: 8080}
      caption: "allow-router.yaml"
    - kind: show
      id: apply-allow-router
      run: "oc apply -f allow-router.yaml -n lab-shop"
      notice: "`networkpolicy.networking.k8s.io/allow-router created`. On this cluster the Route already worked: the router runs on the pod's own node, whose traffic is never blocked. On a cluster with several nodes this rule keeps Routes working when the routers are ordinary pods in `openshift-ingress`; for routers on the host network of other nodes, use the documented form below."
    - kind: show
      id: router-rule-host-network
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-router
        spec:
          podSelector:
            matchLabels: {app: web}
          policyTypes: [Ingress]
          ingress:
          - from:
            - namespaceSelector:
                matchLabels:
                  policy-group.network.openshift.io/ingress: ""
              podSelector: {}
            ports:
            - {protocol: TCP, port: 8080}
      caption: "allow-router.yaml, also matching host-network routers (example)"
      origin: example
      highlight: ["podSelector: {}"]
      notice: |
        The documented allow-from-router policy: `podSelector: {}` sits in the same entry as the `namespaceSelector`
        (no dash before it), so the entry means pods of any kind in those namespaces, host-network router pods
        included. Without it, a router on the host network of another node is blocked. Not run here: this cluster has
        one node.
    - kind: ask
      id: egress-scope
      guess: true
      prompt: default-deny-egress will select every pod in lab-shop. Which of client's connections will it block?
      choices:
      - text: Every new outgoing connection, DNS lookups included
        why: Egress isolation covers every connection the pod opens, inside the cluster or outside it, until some policy allows it.
      - text: Only connections that leave the cluster
        why: 'Egress here means everything the pod opens, inside the cluster as well: other pods, Services and DNS.'
      - text: Only connections to other projects
        why: 'Isolation does not depend on the destination''s project: a call to web in the same project is blocked as well.'
      answer: 0
    - kind: teach
      id: deny-egress
      title: Default deny needs explicit dependencies
      body: |
        The same empty `podSelector` with `policyTypes: [Egress]` isolates every pod's outgoing connections. Before
        applying it, list what the pods need: DNS, application destinations and the API server if a workload uses
        it. DNS is an outbound connection too.
    - kind: show
      id: deny-egress-apply
      run: "oc apply -f deny-egress.yaml -n lab-shop"
      notice: "`default-deny-egress` (`podSelector: {}`, `policyTypes: [Egress]`, no rules) is created."
    - kind: show
      id: dns-blocked
      run: "oc exec deploy/client -n lab-shop -- getent hosts web"
      notice: "Nothing printed, and `command terminated with exit code 2`: getent found no address for `web`. The DNS query itself is outgoing traffic, and it is blocked."
    - kind: show
      id: reach-egress-denied
      run: "sh reach.sh"
      notice: |
        `client` now gets `000`: its own egress is blocked. `reports` still gets `200`: its pod is in `lab-reports`,
        which has no egress policy, and the reply from web needs no rule.
    - kind: ask
      id: two-ends
      prompt: Web ingress permits the client, but the client is egress-isolated with only DNS allowed. What happens?
      choices:
        - text: The application connection is blocked
          why: Both directions must allow the new connection; DNS access alone does not permit traffic to web.
        - text: The connection succeeds after name resolution
          why: Successful resolution establishes only that DNS traffic is allowed.
        - text: The destination ingress rule overrides egress
          why: Ingress and egress are independent checks, not competing rules with priorities.
      answer: 0
    - kind: show
      id: deny-and-dns
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-dns
        spec:
          podSelector: {}
          policyTypes: [Egress]
          egress:
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-dns
            ports:
            - {protocol: UDP, port: 5353}
            - {protocol: TCP, port: 5353}
      caption: "allow-dns.yaml"
      notice: |
        On OpenShift's default OVN-Kubernetes network the rule is checked against the DNS pods behind the Service,
        so it names their port 5353, not the Service's port 53. `kubernetes.io/metadata.name` is a label Kubernetes
        puts on every namespace, so it selects a namespace by name.
    - kind: show
      id: apply-dns
      run: "oc apply -f allow-dns.yaml -n lab-shop && oc exec deploy/client -n lab-shop -- getent hosts web"
      notice: "The lookup works again: `web.lab-shop.svc.cluster.local` and the Service's cluster IP."
    - kind: show
      id: dns-only
      run: "oc exec deploy/client -n lab-shop -- curl -s -m 3 http://web:8080/"
      notice: "Exit code 28 again: the name resolves, but the connection to web is still blocked by client's own egress isolation."
    - kind: ask
      id: dns-target
      prompt: Pods in this egress-isolated namespace cannot resolve names, although the rule below exists. Which edit fixes it?
      evidence: |
        egress:
        - to:
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: openshift-dns}
          ports:
          - {protocol: UDP, port: 53}
          - {protocol: TCP, port: 53}
      choices:
        - text: Change both ports to 5353
          why: The Service accepts 53, but the policy is checked against the DNS pods, which listen on 5353 in this OpenShift setup.
        - text: Put the rule in a second NetworkPolicy
          why: NetworkPolicies add up without any order, so moving the rule to another policy changes nothing.
        - text: Add an ingress rule for the replies
          why: Replies to a permitted connection are allowed automatically and need no ingress rule.
      answer: 0
    - kind: show
      id: egress-recorded
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-client-egress
        spec:
          podSelector:
            matchLabels: {app: client}
          policyTypes: [Egress]
          egress:
          - to:
            - podSelector:
                matchLabels: {app: web}
            ports:
            - {protocol: TCP, port: 8080}
      caption: "allow-client-egress.yaml"
    - kind: show
      id: apply-client-egress
      run: "oc apply -f allow-client-egress.yaml -n lab-shop && oc exec deploy/client -n lab-shop -- curl -s -m 3 http://web:8080/"
      notice: "`hello from lab-shop`: client's egress and web's ingress both allow the connection now."
    - kind: teach
      id: inspect-before-edit
      title: Inspect endpoints, policy and labels
      body: |
        A timeout suggests dropped traffic, but it does not prove NetworkPolicy is responsible.
        [Services and DNS](/lesson/d.services-dns) explained ready EndpointSlices: confirm the Service has a usable
        destination before examining isolation.

        Then list the policies, describe those selecting the destination, and compare their allowed peers with the
        caller's actual pod and namespace labels. If the caller is egress-isolated, inspect its namespace too. Do not
        remove every policy to make a test pass.
    - kind: show
      id: inspection-commands
      run: "oc get networkpolicy -n lab-shop"
      notice: "Seven policies. `POD-SELECTOR` shows which pods each one selects; `<none>` means all pods of the project."
    - kind: try
      id: inspect-reporting
      body: Policy allow-reports exists in project lab-shop. Type the command that describes its allowed peers and ports.
      accept:
        - oc describe networkpolicy allow-reports -n lab-shop
        - oc describe networkpolicy allow-reports --namespace=lab-shop
        - oc describe networkpolicy allow-reports --namespace lab-shop
        - oc describe networkpolicies allow-reports -n lab-shop
        - oc describe netpol allow-reports -n lab-shop
        - oc describe networkpolicy/allow-reports -n lab-shop
        - oc describe netpol/allow-reports -n lab-shop
        - oc -n lab-shop describe networkpolicy allow-reports
        - oc -n lab-shop describe netpol allow-reports
        - oc --namespace lab-shop describe networkpolicy allow-reports
        - oc --namespace=lab-shop describe networkpolicy allow-reports
      hints:
        - match: ^oc get
          say: A listing does not explain the interpreted peer rules; use describe for this task.
        - match: lab-reports
          say: The policy protects web, so it lives in lab-shop, not in the caller's project.
        - match: " pod"
          say: Describe the NetworkPolicy object, not a Pod.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n lab-shop the command looks in your current project, not in lab-shop, where allow-reports exists.
      hint: Use describe with the NetworkPolicy name and project lab-shop.
      run: "oc describe networkpolicy allow-reports -n lab-shop"
      then: |
        Under `Allowing ingress traffic`: `To Port: 8080/TCP`, and one `From:` with both `NamespaceSelector: team=reports`
        and `PodSelector: app=reports`: the AND form. Then `Not affecting egress traffic`.
    - kind: show
      id: console-policy
      body: "The web console draws a policy's rules as a table. A demo policy `web-from-same-project`, which lets any pod of its own project reach the pods labelled `app=web`:"
      image:
        src: networkpolicy.png
        alt: "The details of the NetworkPolicy web-from-same-project, with an Ingress rules table: target pods app=web, from namespace console-demo, pod selector any pod; and an Egress rules section that is empty."
        captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
      caption: "Networking > NetworkPolicies > web-from-same-project"
      notice: "The console states the rule this lesson is built on, for incoming traffic: a pod accepts every connection until an ingress policy selects it, then only what the ingress policies selecting it allow, together. Outgoing traffic is isolated separately, by egress policies."
    - kind: teach
      id: admin-tier
      title: An administrator's policy comes first
      body: |
        NetworkPolicies belong to the projects' administrators. A cluster administrator can set rules that no project
        can override with an **AdminNetworkPolicy** (ANP), a cluster-scoped object. OVN-Kubernetes evaluates ANPs
        first, lowest `priority` number first: `Allow` and `Deny` are final, `Pass` hands the decision to the
        NetworkPolicies. A **BaselineAdminNetworkPolicy** applies last, only when nothing before it decided.
    - kind: show
      id: anp-file
      code: |
        apiVersion: policy.networking.k8s.io/v1alpha1
        kind: AdminNetworkPolicy
        metadata:
          name: academy-deny-reports
        spec:
          priority: 40
          subject:
            namespaces:
              matchLabels:
                kubernetes.io/metadata.name: lab-shop
          ingress:
          - name: deny-from-lab-reports
            action: Deny
            from:
            - namespaces:
                matchLabels:
                  kubernetes.io/metadata.name: lab-reports
      caption: "academy-deny-reports.yaml"
      notice: "Every pod in `lab-shop` (the subject) refuses connections from every pod in `lab-reports`. It selects the namespaces by name, so it touches nothing else on the cluster."
    - kind: show
      id: anp-apply
      run: "oc apply -f academy-deny-reports.yaml"
      notice: "`adminnetworkpolicy.policy.networking.k8s.io/academy-deny-reports created`."
    - kind: ask
      id: guess-anp
      guess: true
      prompt: "`allow-reports` still exists in lab-shop. What does `reports` get now?"
      choices:
        - text: "200: the project's allow rule still applies"
          why: "The ANP is evaluated before any NetworkPolicy, and its Deny is final."
        - text: "000: the administrator's Deny wins"
          why: "A Deny in an ANP is final; the project's NetworkPolicies are never consulted for that traffic. The next step shows it."
        - text: "It depends on which policy was created last"
          why: "Neither NetworkPolicies nor ANPs depend on creation order."
      answer: 1
    - kind: show
      id: reach-anp
      run: "sh reach.sh"
      notice: "`reports` gets `000` again, although `allow-reports` is unchanged. `client` still gets `200`: the ANP only concerns `lab-reports`."
    - kind: show
      id: developer-anp
      body: "Can developer see what blocks the traffic?"
      run: "oc get adminnetworkpolicies"
      notice: "`Forbidden`: ANPs are cluster-scoped, and a project administrator cannot list them. When a project's own policies all look right and traffic is still dropped, ask the cluster administrators."
    - kind: show
      id: anp-delete
      run: "oc delete adminnetworkpolicy academy-deny-reports"
      notice: "The administrator removes the ANP."
    - kind: show
      id: reach-after-anp
      run: "sh reach.sh"
      notice: "`reports` gets `200` again: the project's own allow rule decides once more."
    - kind: try
      id: test-new-caller
      body: In project billing, Deployment auditor has curl installed. Test http://ledger:8080/ from it, with a
        three-second maximum and silent output.
      accept:
        - oc exec deploy/auditor -n billing -- curl -s -m 3 http://ledger:8080/
        - oc exec deploy/auditor -n billing -- curl -m 3 -s http://ledger:8080/
        - oc exec deploy/auditor -n billing -- curl --silent --max-time 3 http://ledger:8080/
        - oc exec deploy/auditor -n billing -- curl --max-time 3 --silent http://ledger:8080/
        - oc exec deploy/auditor -n billing -- curl -s --max-time 3 http://ledger:8080/
        - oc exec deploy/auditor -n billing -- curl -sm 3 http://ledger:8080/
        - oc exec deploy/auditor -n billing -- curl -s -m 3 http://ledger:8080
        - oc exec deploy/auditor --namespace=billing -- curl -s -m 3 http://ledger:8080/
        - oc exec deploy/auditor --namespace billing -- curl -s -m 3 http://ledger:8080/
        - oc exec deployment/auditor -n billing -- curl -s -m 3 http://ledger:8080/
        - oc exec deployment/auditor -n billing -- curl --silent --max-time 3 http://ledger:8080/
        - oc exec deployments/auditor -n billing -- curl -s -m 3 http://ledger:8080/
        - oc -n billing exec deploy/auditor -- curl -s -m 3 http://ledger:8080/
        - oc -n billing exec deploy/auditor -- curl --silent --max-time 3 http://ledger:8080/
        - oc -n billing exec deployment/auditor -- curl -s -m 3 http://ledger:8080/
        - oc --namespace billing exec deploy/auditor -- curl -s -m 3 http://ledger:8080/
      hints:
        - match: ^curl
          say: A workstation test has a different source. Run curl inside the auditor workload with exec.
        - match: ^oc logs
          say: Logs show the program’s earlier output; they do not initiate this connection.
        - match: stranger|client
          say: The source under test is auditor in billing.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n billing the command looks for the auditor Deployment in your current project, not in billing.
      hint: Use exec on deployment/auditor in billing; pass curl after --, with -s and -m 3.
      then: |
        The request would originate from an auditor pod, exercising its DNS and application egress plus ledger ingress. Compare an expected success with a separate excluded caller; one successful request does not prove isolation.
    - kind: reflect
      id: explain-outage
      prompt: Explain how you would restore reporting access without reopening every source.
      model: |
        Confirm ready endpoints and name resolution, then compare reporting's pod and namespace labels with the
        destination's ingress rules and the source's egress rules. If a namespace label is missing, ask the cluster
        administrator to set it rather than loosening the selector. Add only the flow that is needed and test from
        reporting and from an excluded pod, keeping the default deny. If the project's policies all allow the flow,
        ask whether an AdminNetworkPolicy denies it.
    - kind: show
      id: cleanup
      run: "oc delete project lab-shop lab-reports"
      notice: "Both projects go, and their policies with them."
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can isolate a project for ingress and egress, allow DNS, single callers and other namespaces by label,
        recognise why a Route test passes on a one-node cluster, and test every change from allowed and excluded
        callers. [Protect application traffic](/lab/ch.protect-traffic) grades the resulting connections;
        [NetworkPolicy](/lab/lab.networkpolicy) guides the setup.

        Next, [Certificates and non-HTTP traffic](/lesson/o2.tls-exposure) protects what permitted connections carry.
  sections:
    - id: policy-reference
      title: Policy fields and baseline additions
      depth: true
      body: |
        | Field or pattern | Meaning |
        |---|---|
        | spec.podSelector | protected pods in this policy's namespace; {} selects all |
        | policyTypes | explicit Ingress and/or Egress isolation |
        | ingress.from / egress.to | permitted peers; separate entries are alternatives |
        | one namespaceSelector plus podSelector peer | pods matching both selectors |
        | standalone podSelector peer | matching pods in the policy namespace |
        | ports | allowed destination protocols and ports; omitted means all ports |
        | ipBlock | CIDR peers, with optional except ranges |
        | no policyTypes | Ingress is implied; Egress is also implied if egress rules exist |

        To allow same-namespace traffic under default deny in both directions, add a separate policy with
        podSelector {}, ingress from a podSelector {}, and egress to a podSelector {}.
        The DNS rule does not supply those application permissions. Monitoring needs its own permitted scrape port,
        from namespaces labelled `network.openshift.io/policy-group: monitoring`.

        The 5353 rule describes OpenShift DNS pod traffic on OVN-Kubernetes. Do not generalise it to every
        Kubernetes implementation: Service address translation and ipBlock evaluation can differ between network
        implementations. For pod-selector rules use the actual destination pod port; inspect the Service targetPort.
        NetworkPolicies work at IP/port/protocol level, not HTTP paths or TLS identities.
    - id: network-triage
      title: Timeouts and implementation limits
      depth: true
      body: |
        | Symptom | Next evidence | Possible cause |
        |---|---|---|
        | timeout, ready EndpointSlices | source egress, destination ingress, actual peer labels | missing allowed flow, or another network/application fault |
        | DNS failure after egress isolation | DNS namespace and pod ports | no matching DNS rule |
        | Route fails across nodes only | router source and ingress policy | missing router policy masked by node-local exemption |
        | unintended caller succeeds | peer list structure and broader policies | OR where AND was intended, or an additive allow elsewhere |
        | every project policy allows the flow, still dropped | AdminNetworkPolicies (ask an administrator) | a cluster-wide Deny |

        OpenShift's ingress policy-group label is placed on openshift-ingress and on openshift-host-network. A
        host-network source on the destination's own node is exempt; traffic from other nodes still needs the
        appropriate allowance, and to match host-network pods an entry needs `podSelector: {}` beside its
        `namespaceSelector`. Do not assume all router traffic is exempt.

        OVN-Kubernetes implements policies using ACLs and programs the node dataplane through OVN and Open vSwitch.
        Namespace annotation `k8s.ovn.org/acl-logging` can request allow/deny logging severities;
        administrators inspect `/var/log/ovn/acl-audit-log.log` in the node's OVN-Kubernetes pod.
        [Timeouts after security hardening](/lab/inc.networkpolicy-block) practises evidence-led diagnosis.
    - id: administrator-tiers
      title: Administrator policy tiers and external destinations
      depth: true
      body: |
        | Tier | Who and how it decides |
        |---|---|
        | AdminNetworkPolicy | cluster administrator; lower priority number first (0–99); Allow/Deny are final, Pass delegates to NetworkPolicy |
        | NetworkPolicy | namespace allow lists; selected-direction isolation can deny implicitly |
        | BaselineAdminNetworkPolicy | one object named default; Allow/Deny baseline when the preceding tiers delegate the decision |

        Both administrator APIs use policy.networking.k8s.io/v1alpha1 in OpenShift 4.21.
        BANP does not override an implicit deny from NetworkPolicy isolation. A namespace policy can override
        the baseline but cannot override a final ANP Allow or Deny.

        EgressFirewall in k8s.ovn.org/v1 controls external destinations with ordered Allow/Deny rules by CIDR
        or DNS name. A project can have at most one, named default. It is separate from NetworkPolicy's additive
        peer lists. Teams commonly establish baseline isolation through project provisioning and review changes
        against a source/destination/port matrix.
  review:
    - q: When does a pod become isolated for ingress?
      a: As soon as any NetworkPolicy with policyType Ingress selects it.
    - q: How do you keep Routes working after a default-deny policy on OpenShift?
      a: Allow ingress from namespaces with label policy-group.network.openshift.io/ingress, with podSelector {} in
        the same entry so that host-network routers (in openshift-host-network) are matched too.
    - q: In which order does OVN-Kubernetes evaluate AdminNetworkPolicy, NetworkPolicy and BaselineAdminNetworkPolicy?
      a: ANP first (Allow/Deny final, Pass delegates), then NetworkPolicy, then BANP as the fallback default.
    - q: What must you account for when default-denying egress, and how is OpenShift DNS allowed?
      a: 'Permit required dependencies, including DNS lookups: to openshift-dns on UDP and TCP 5353 for the default
        OVN-Kubernetes network. Application destinations need their own rules.'
    - q: In a `from` list, what is the difference between one item with namespaceSelector and podSelector, and two
        items?
      a: 'One item: AND (those pods in those namespaces). Two items: OR (any pod in those namespaces, or those pods
        in the policy''s namespace).'
    - q: Who can set the namespace label that a namespaceSelector trusts?
      a: A cluster administrator (or whoever may update Namespace objects); a project's admin role cannot label its own namespace.
  labs:
    - lab.networkpolicy
    - ch.protect-traffic
    - ch.production-ready
    - inc.networkpolicy-block
  limits: |
    OpenShift Local has one node, and its default router runs on the host network of that node, so a Route keeps
    working under a default deny: the router's traffic comes from the pod's own node. The router rule was applied,
    but its effect can only be seen on a cluster with several nodes. A BaselineAdminNetworkPolicy and the `Pass` action
    are explained, not run.

    Recorded on OpenShift 4.21. Starting in 4.22 the operators that manage cluster DNS and Ingress install and maintain
    default deny-all NetworkPolicies in their own namespaces: do not edit those policies, and do not run your own pods
    in those namespaces, whose traffic they block. `oc get networkpolicies --all-namespaces` lists them (4.22 release
    notes, "Network policy enhancement").
  enterprise: |
    Regulated organisations usually expect namespace isolation by default (deny all ingress, allow same
    namespace, allow router, allow monitoring) created by the project template, egress control to known
    destinations (EgressFirewall or an egress proxy), and AdminNetworkPolicy guardrails that tenants cannot
    override. Policy changes go through review because a wrong policy is an outage that looks like an application
    bug.
  commands:
    - {cmd: "oc adm new-project lab-shop --admin=developer && oc adm new-project lab-reports --admin=developer", as: admin, meaning: "two projects administered by developer"}
    - {cmd: "oc apply -f shop.yaml -n lab-shop && oc apply -f reports.yaml -n lab-reports && oc wait --for=condition=Available deployment --all -n lab-shop --timeout=180s && oc wait --for=condition=Available deployment --all -n lab-reports --timeout=180s", timeout: 400, meaning: "web, client and stranger in lab-shop; reports in lab-reports"}
    - {cmd: "oc get pods -n lab-shop --show-labels", meaning: "the labels that policies select"}
    - {cmd: "oc exec deploy/stranger -n lab-shop -- curl -s -m 3 http://web:8080/", meaning: "no policy yet: stranger gets the page"}
    - {cmd: "sh reach.sh", meaning: "three callers before any policy: all 200"}
    - {cmd: "for i in $(seq 1 30); do oc get route web -n lab-shop -o jsonpath='{.status.ingress[*].routerName}' | grep -qw default && break; sleep 2; done; sleep 5", timeout: 120, meaning: "wait until the router has admitted the Route and reloaded"}
    - {cmd: "curl -s -m 10 -o /dev/null -w '%{http_code}\\n' http://web-lab-shop.apps-crc.testing/", meaning: "the Route before any policy"}
    - {cmd: "oc apply -f deny-ingress.yaml -n lab-shop", meaning: "isolate every pod in lab-shop for ingress"}
    - {cmd: "oc exec deploy/client -n lab-shop -- curl -s -m 3 http://web:8080/", expect: fail, meaning: "exit code 28: a timeout"}
    - {cmd: "sh reach.sh", meaning: "all three callers get 000"}
    - {cmd: "curl -s -m 10 -o /dev/null -w '%{http_code}\\n' http://web-lab-shop.apps-crc.testing/", meaning: "the Route under default deny"}
    - {cmd: "oc get pods -n openshift-ingress -o custom-columns=NAME:.metadata.name,HOSTNETWORK:.spec.hostNetwork,NODE:.spec.nodeName", as: admin, meaning: "the router runs on the host network of node crc"}
    - {cmd: "oc get pods -l app=web -n lab-shop -o wide", meaning: "web runs on the same node"}
    - {cmd: "oc apply -f allow-client.yaml -n lab-shop && sh reach.sh", meaning: "allow client only"}
    - {cmd: "oc apply -f allow-reports.yaml -n lab-shop && sh reach.sh", meaning: "allow reports pods from team=reports namespaces: the label is missing"}
    - {cmd: "oc label namespace lab-reports team=reports", expect: fail, meaning: "Forbidden: a project admin cannot label the namespace"}
    - {cmd: "oc label namespace lab-reports team=reports", as: admin, meaning: "the administrator labels it"}
    - {cmd: "sh reach.sh", meaning: "reports now gets 200"}
    - {cmd: "oc get namespaces -l policy-group.network.openshift.io/ingress", as: admin, meaning: "the namespaces the router rule matches"}
    - {cmd: "oc apply -f allow-router.yaml -n lab-shop", meaning: "the documented router rule"}
    - {cmd: "oc apply -f deny-egress.yaml -n lab-shop", meaning: "isolate every pod in lab-shop for egress"}
    - {cmd: "oc exec deploy/client -n lab-shop -- getent hosts web", expect: fail, meaning: "DNS is blocked too"}
    - {cmd: "sh reach.sh", meaning: "client is blocked by its own egress isolation"}
    - {cmd: "oc apply -f allow-dns.yaml -n lab-shop && oc exec deploy/client -n lab-shop -- getent hosts web", meaning: "allow DNS to the openshift-dns pods"}
    - {cmd: "oc exec deploy/client -n lab-shop -- curl -s -m 3 http://web:8080/", expect: fail, meaning: "the name resolves; the connection is still blocked"}
    - {cmd: "oc apply -f allow-client-egress.yaml -n lab-shop && oc exec deploy/client -n lab-shop -- curl -s -m 3 http://web:8080/", meaning: "allow client's egress to web"}
    - {cmd: "oc get networkpolicy -n lab-shop", meaning: "the seven policies"}
    - {cmd: "oc describe networkpolicy allow-reports -n lab-shop", meaning: "the interpreted peer rule"}
    - {cmd: "oc apply -f academy-deny-reports.yaml", as: admin, meaning: "an AdminNetworkPolicy that denies lab-reports into lab-shop"}
    - {cmd: "sh reach.sh", meaning: "reports blocked again by the administrator's Deny"}
    - {cmd: "oc get adminnetworkpolicies", expect: fail, meaning: "Forbidden for a project administrator"}
    - {cmd: "oc delete adminnetworkpolicy academy-deny-reports", as: admin, meaning: "remove the ANP"}
    - {cmd: "sh reach.sh", meaning: "the project's allow rule decides again"}
    - {cmd: "oc delete project lab-shop lab-reports", as: admin, timeout: 300, meaning: "remove both projects"}
  experiment:
    id: X-NET-03
    objective: "As developer, isolate a project for ingress and egress and allow DNS, one pod, one labelled namespace and the router; as the administrator, label the namespace a project admin cannot label and apply an AdminNetworkPolicy whose Deny overrides the project's allow rule; then remove everything and prove no AdminNetworkPolicy or test project remains."
    changes:
      - "AdminNetworkPolicy academy-deny-reports, cluster-scoped, selecting only the namespaces lab-shop and lab-reports by name (created, deleted)"
      - "Projects lab-shop and lab-reports with RoleBindings for developer, Deployments, a Service, a Route and seven NetworkPolicies (created, deleted)"
      - "Label team=reports on the namespace lab-reports (removed with the project)"
    preflight:
      - cmd: |-
          found=$(oc get namespace lab-shop --ignore-not-found -o name) || exit 1
          test -z "$found"
      - cmd: |-
          found=$(oc get namespace lab-reports --ignore-not-found -o name) || exit 1
          test -z "$found"
      - cmd: |-
          found=$(oc get adminnetworkpolicy academy-deny-reports --ignore-not-found -o name) || exit 1
          test -z "$found"
      - cmd: |-
          found=$(oc get namespaces -l team=reports -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait co/network --for=condition=Available=True --timeout=30s && oc wait co/network --for=condition=Degraded=False --timeout=30s"}
    snapshot:
      - "oc get adminnetworkpolicies,baselineadminnetworkpolicies -o name"
      - "oc get namespaces -l team=reports -o name"
      - "oc get project lab-shop lab-reports -o name --ignore-not-found"
    rollback:
      - "oc delete adminnetworkpolicy academy-deny-reports --ignore-not-found"
      - "oc delete project lab-shop lab-reports --ignore-not-found --wait=false"
    settle:
      - "oc wait --for=delete project/lab-shop project/lab-reports --timeout=300s"
    verify:
      - {cmd: "oc wait co/network --for=condition=Available=True --timeout=60s && oc wait co/network --for=condition=Degraded=False --timeout=60s"}
  references:
    - title: 'Kubernetes: Network policies'
      url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
