      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/admin-network-policy
    - title: 'OpenShift 4.21: Network policy APIs and evaluation order'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/network-policy-apis
    - title: 'OpenShift 4.21: Logging for network security (ACL audit logs)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/logging-network-security
    - title: 'OpenShift 4.21: Egress firewall'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/egress-firewall
    - title: 'OpenShift 4.21: DNS Operator'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/networking_operators/dns-operator
- id: o2.tls-exposure
  title: Certificates and non-HTTP traffic
  subtitle: Service CA, CA bundles, Route certificates you bring, and SNI passthrough
  module: b4-network-security
  mode: REAL_LAB
  minutes: 40
  level: 3
  supports: "OpenShift 4.21 service CA operator (serving certificates and CA bundle injection) and HAProxy Routes (edge, re-encrypt, passthrough). Every step was run on OpenShift Local 4.21 as the ordinary user developer, in a temporary project deleted afterwards. The lab CA and the Route certificates were generated with openssl for the recording, valid for two days, and their private keys were never printed or kept."
  concepts:
    - sec.certs
    - net.routes
    - net.services
  prerequisites:
    - d.routes-tls
  record_on: cluster
  objective: |
    Secure traffic end to end: get an internal certificate from the service CA, verify it from a client with the
    right CA bundle and name, serve your own CA's certificates on edge and re-encrypt Routes, terminate TLS in the pod
    with a passthrough Route, and tell the router which CA to trust for a backend the service CA did not sign.
  files:
    web.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: web-content
      data:
        index.html: |
          hello from web
        healthz: ok
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: web
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: web-tls
      spec:
        selector:
          app: web
        ports:
        - name: http
          port: 8080
          targetPort: 8080
        - name: https
          port: 8443
          targetPort: 8443
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
        labels:
          app: web
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              - containerPort: 8443
              readinessProbe:
                httpGet: {path: /healthz, port: 8080}
                periodSeconds: 5
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - {name: content, mountPath: /var/www/html}
              # the service CA's certificate and key replace the image's self-signed ones
              - {name: tls, mountPath: /etc/httpd/tls/localhost.crt, subPath: tls.crt}
              - {name: tls, mountPath: /etc/httpd/tls/localhost.key, subPath: tls.key}
            volumes:
            - name: content
              configMap:
                name: web-content
            - name: tls
              secret:
                secretName: web-tls
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: client
        labels:
          app: client
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: client
        template:
          metadata:
            labels:
              app: client
          spec:
            terminationGracePeriodSeconds: 2
            containers:
            - name: curl
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
    public.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: public-content
      data:
        index.html: |
          hello from public, TLS ends in the pod
        healthz: ok
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: public
      spec:
        selector:
          app: public
        ports:
        - name: https
          port: 8443
          targetPort: 8443
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: public
        labels:
          app: public
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: public
        template:
          metadata:
            labels:
              app: public
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              - containerPort: 8443
              readinessProbe:
                httpGet: {path: /healthz, port: 8080}
                periodSeconds: 5
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - {name: content, mountPath: /var/www/html}
              # a certificate from the lab CA for the public host name, created with oc create secret tls
              - {name: tls, mountPath: /etc/httpd/tls/localhost.crt, subPath: tls.crt}
              - {name: tls, mountPath: /etc/httpd/tls/localhost.key, subPath: tls.key}
            volumes:
            - name: content
              configMap:
                name: public-content
            - name: tls
              secret:
                secretName: public-tls
  flow:
    - kind: teach
      id: situation
      title: Encrypt the second connection too
      body: |
        A browser reaches your HTTPS Route, but the security team also wants encryption between the router
        and the pod, certificates from the company's own CA on the public names, and one application that must
        terminate TLS itself.

        You will give an in-cluster Service a managed certificate, check the client's trust and hostname, put your
        own CA's certificate on edge and re-encrypt Routes, and pass TLS through to a pod. Everything below ran on a
        lab cluster as the ordinary user `developer`, in a project of their own.
    - kind: ask
      id: recall-edge
      prompt: An edge Route handles browser TLS. What carries requests from that router to the application?
      recalls: d.routes-tls
      choices:
        - text: The original browser TLS connection
          why: 'That is the passthrough model: the pod handles the original TLS session.'
        - text: A second verified TLS connection
          why: Re-encrypt termination creates that second TLS connection.
        - text: Plain HTTP
          why: Edge termination ends the TLS connection at the router; backend TLS requires a different termination
            choice.
      answer: 2
    - kind: teach
      id: service-ca
      title: Ask the platform for an internal certificate
      body: |
        A **certificate authority (CA)** signs certificates so clients can verify a server's identity.
        OpenShift's **service CA operator** creates and renews a serving certificate for an internal Service.
        Annotate the Service with `service.beta.openshift.io/serving-cert-secret-name` and the Secret name you want.
        The operator creates a `kubernetes.io/tls` Secret with `tls.crt` and `tls.key`.

        Creating the Secret does not reconfigure the application: mount it in the pod and make the server use it.
        In `web.yaml` the Service carries the annotation, and the Deployment mounts the Secret over the web server's
        own certificate and key.
    - kind: show
      id: request-cert
      run: "oc apply -f web.yaml && oc rollout status deployment/web --timeout=180s && oc rollout status deployment/client --timeout=180s"
      notice: |
        The objects are created and both Deployments roll out. The web pod mounts the Secret `web-tls`, which nobody
        created by hand: the service CA operator made it from the Service's annotation, and the pod could not have
        started without it.
    - kind: show
      id: secret-issued
      run: "oc get secret web-tls -o jsonpath='{.type}{\"\\n\"}{.metadata.annotations}{\"\\n\"}'"
      notice: "Type `kubernetes.io/tls`. The annotations name the Service it was issued for and its expiry, about two years ahead."
    - kind: show
      id: cert-names
      body: "The certificate itself, read with openssl from the Secret (the key is not printed):"
      run: "oc get secret web-tls -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -subject -issuer -ext subjectAltName"
      notice: |
        Subject `web.<project>.svc`, issuer `openshift-service-serving-signer@…`, and two names: `web.<project>.svc`
        and `web.<project>.svc.cluster.local`. The short name `web` is not among them.
    - kind: try
      id: cert-for-api
      body: Service api exists in project billing and has no serving-cert annotation. Request its certificate in
        a Secret named api-tls.
      accept:
        - oc annotate service api service.beta.openshift.io/serving-cert-secret-name=api-tls -n billing
        - oc annotate svc api service.beta.openshift.io/serving-cert-secret-name=api-tls -n billing
        - oc annotate service/api service.beta.openshift.io/serving-cert-secret-name=api-tls -n billing
        - oc annotate svc/api service.beta.openshift.io/serving-cert-secret-name=api-tls -n billing
        - oc annotate service api -n billing service.beta.openshift.io/serving-cert-secret-name=api-tls
        - oc -n billing annotate service api service.beta.openshift.io/serving-cert-secret-name=api-tls
      hints:
        - match: ^oc create secret
          say: Manually creating a Secret does not ask the service CA to issue and renew a Service certificate.
        - match: ^oc annotate (pod|deployment|deploy)
          say: The service CA watches the annotation on the Service.
        - match: web-tls|shop
          say: Use the billing Service and its requested Secret name, api-tls.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n billing the command annotates a Service in your current project. The Service api is in billing.
      hint: Annotate Service api in billing with service.beta.openshift.io/serving-cert-secret-name=api-tls.
      then: |
        The operator would issue a certificate and key in api-tls for api.billing.svc. The pod would still need a Secret mount and application TLS configuration.
    - kind: teach
      id: trust-and-name
      title: Trust and hostname are separate checks
      body: |
        Clients must trust the issuing CA and call a name the certificate covers. OpenShift's service CA is not in
        an image's default trust store.

        A pod with the default service-account volume finds the service CA bundle at
        `/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt`. curl's `--cacert` names the CA file to trust.
    - kind: show
      id: verified-internal-call
      run: "oc exec deploy/client -- curl -sS -m 5 --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://web.$(oc project -q).svc:8443/"
      notice: "`hello from web`, with full verification: the CA is trusted and the name matches. `$(oc project -q)` puts the current project's name into the host name."
    - kind: ask
      id: short-name
      prompt: The same client trusts the CA but calls https://web:8443/. What fails?
      choices:
        - text: The router’s backend connection
          why: This internal Service call does not go through a Route or router.
        - text: The hostname check
          why: The certificate names web.<project>.svc and web.<project>.svc.cluster.local, not the short name web.
        - text: The CA trust check only
          why: The supplied CA bundle addresses trust; it cannot change which names the certificate covers.
      answer: 1
    - kind: show
      id: short-name-fails
      run: "oc exec deploy/client -- curl -sS -m 5 --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://web:8443/"
      notice: "`curl: (60) SSL: no alternative certificate subject name matches target host name 'web'`, and exit code 60. Trust was fine; the name was not."
    - kind: show
      id: no-ca-fails
      body: "And with the right name but no CA file:"
      run: "oc exec deploy/client -- curl -sS -m 5 https://web.$(oc project -q).svc:8443/"
      notice: "Exit code 60 again, with `self-signed certificate in certificate chain`: the server sends the service CA along with its own certificate, but curl does not trust that CA, because it is not in the image's trust store."
    - kind: try
      id: verify-ledger
      body: You are in a client pod with curl and that CA file. Ledger serves TLS on port 9443 in billing with its
        service CA certificate. Type the verified request to its .svc name.
      accept:
        - curl --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc:9443/
        - curl https://ledger.billing.svc:9443/ --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        - curl --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc:9443
        - curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc:9443/
        - curl -sS --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc:9443/
        - curl -s -m 5 --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc:9443/
        - curl -sS -m 5 --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc:9443/
        - curl --silent --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc:9443/
        - curl --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://ledger.billing.svc.cluster.local:9443/
      hints:
        - match: (^| )(-k|--insecure)( |$)
          say: Disabling verification hides both trust and identity mistakes; supply the CA instead.
        - match: 'https://ledger:'
          say: 'Use the name in the certificate: ledger.billing.svc.'
        - match: ^oc exec
          say: The task starts inside the client pod; type curl directly.
        - match: --cacert=
          say: 'curl stops here with "option --cacert=…: is unknown": give the file as the next word, `--cacert FILE`.'
      hint: Use curl --cacert with the service-ca.crt file in /var/run/secrets/kubernetes.io/serviceaccount/, then https://ledger.billing.svc:9443/.
      then: |
        curl would verify the certificate against the service CA and compare the requested hostname with the certificate. It would then request the page if TLS and connectivity both succeed.
    - kind: teach
      id: ca-bundle
      title: The CA bundle as a ConfigMap
      body: |
        A client that does not mount the service-account volume, or a tool that reads trust from a ConfigMap, can ask
        for the bundle another way: annotate a ConfigMap with `service.beta.openshift.io/inject-cabundle=true`, and
        the operator writes the service CA into its `service-ca.crt` key. The operator owns that data and replaces it
        on rotation, so keep application settings in other ConfigMaps.
    - kind: show
      id: inject-bundle
      run: "oc create configmap lab-service-ca && oc annotate configmap lab-service-ca service.beta.openshift.io/inject-cabundle=true"
      notice: "An empty ConfigMap, then the annotation."
    - kind: show
      id: bundle-content
      run: "oc get configmap lab-service-ca -o jsonpath='{.data.service-ca\\.crt}' | openssl x509 -noout -subject -enddate"
      notice: "The key `service-ca.crt` is there, and holds `openshift-service-serving-signer@…`: the issuer of `web-tls`."
    - kind: ask
      id: which-bundle
      guess: true
      prompt: A client pod that does not mount the service-account volume must trust web's certificate. Which ConfigMap can it mount?
      choices:
      - text: openshift-service-ca.crt
        why: It holds the service CA, the issuer of web-tls, and every project gets it.
      - text: kube-root-ca.crt
        why: That bundle verifies the Kubernetes API server's certificate, not the certificates the service CA issues to Services.
      - text: None until a ConfigMap is annotated in the client's project
        why: lab-service-ca shows how to request one more, but every project already has openshift-service-ca.crt with the same CA.
      answer: 0
    - kind: show
      id: every-project
      body: "OpenShift also puts such a ConfigMap into every project:"
      run: "oc get configmaps"
      notice: |
        `openshift-service-ca.crt` holds the service CA certificate, which signed the certificates Services receive, and `kube-root-ca.crt` the CA of the API server's certificate; both were created with the project. `lab-service-ca` is the one made above.
    - kind: teach
      id: own-ca
      title: Certificates from your own CA
      body: |
        Public names usually carry certificates from the company's CA, not the service CA. To show it end to end,
        the recording made a small lab CA with openssl, valid for two days, then a certificate it signed for two
        Route host names. The keys stay in the working directory and are never printed.
    - kind: show
      id: make-ca
      run: "openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj \"/CN=Academy Lab CA\" 2>/dev/null && openssl x509 -in ca.crt -noout -subject -issuer"
      notice: "Subject and issuer are the same: a self-signed CA certificate, `Academy Lab CA`."
    - kind: show
      id: make-route-cert
      body: "A key and a certificate request with both host names, then the CA's signature (`-copy_extensions copy` keeps the names from the request):"
      run: "openssl req -new -newkey rsa:2048 -nodes -keyout routes.key -out routes.csr -subj \"/CN=lab-routes\" -addext \"subjectAltName=DNS:tls-edge.apps-crc.testing,DNS:tls-reen.apps-crc.testing\" 2>/dev/null && openssl x509 -req -in routes.csr -CA ca.crt -CAkey ca.key -days 2 -copy_extensions copy -out routes.crt 2>/dev/null && openssl x509 -in routes.crt -noout -subject -issuer -ext subjectAltName"
      notice: "Subject `lab-routes`, issuer `Academy Lab CA`, and the two DNS names a client will check."
    - kind: try
      id: try-edge-route
      body: "Create an edge Route `web-edge` to the Service `web`, port `http`, host `tls-edge.apps-crc.testing`, with the certificate `routes.crt`, its key `routes.key`, and the CA certificate `ca.crt`."
      accept:
        - "oc create route edge web-edge --service=web --port=http --hostname=tls-edge.apps-crc.testing --cert=routes.crt --key=routes.key --ca-cert=ca.crt"
        - "oc create route edge web-edge --service web --port http --hostname tls-edge.apps-crc.testing --cert routes.crt --key routes.key --ca-cert ca.crt"
      hints:
        - match: "--dest-ca-cert"
          say: "`--dest-ca-cert` is the CA the router trusts for the pod's certificate (re-encrypt). Here the CA certificate is served to clients: `--ca-cert`."
        - match: "--port=8443|--port=https|--port 8443|--port https"
          say: "Edge sends plain HTTP to the pod, so it targets the Service's `http` port."
        - match: "^(?!.*--key).*$"
          say: "The router needs the private key that matches the certificate: `--key=routes.key`."
        - match: "^oc expose"
          say: "`oc expose` creates an unsecured Route. TLS options come with `oc create route edge`."
      hint: "`oc create route edge web-edge --service=web --port=http`, then `--hostname`, `--cert`, `--key` and `--ca-cert`."
      run: "oc create route edge web-edge --service=web --port=http --hostname=tls-edge.apps-crc.testing --cert=routes.crt --key=routes.key --ca-cert=ca.crt"
      then: "`route.route.openshift.io/web-edge created`."
    - kind: teach
      id: reencrypt
      title: Re-encrypt creates two TLS sessions
      body: |
        A **re-encrypt Route** terminates the client's TLS at the router with the Route's certificate, then opens a
        second, verified TLS connection to the pod. Without `--dest-ca-cert`, the router verifies the pod's
        certificate against the service CA: exactly what `web` serves on its `https` port.
    - kind: show
      id: reencrypt-route
      run: "oc create route reencrypt web-reen --service=web --port=https --hostname=tls-reen.apps-crc.testing --cert=routes.crt --key=routes.key --ca-cert=ca.crt"
      notice: "`route.route.openshift.io/web-reen created`, with the same lab certificate at the front."
    - kind: show
      id: edge-verified
      body: "From the workstation, trusting only the lab CA:"
      run: "curl -sS -m 5 --cacert ca.crt https://tls-edge.apps-crc.testing/ && curl -sS -m 5 --cacert ca.crt https://tls-reen.apps-crc.testing/"
      notice: "`hello from web` twice, both verified against `ca.crt`. Through `web-reen`, the hop from the router to the pod was TLS too, checked against the service CA."
    - kind: show
      id: edge-unverified
      body: "Without the CA file, and then with `-k`:"
      run: "curl -sS -m 5 https://tls-edge.apps-crc.testing/; echo \"exit $?\"; curl -sk -m 5 https://tls-edge.apps-crc.testing/"
      notice: |
        Without `--cacert`, exit code 60 and `self-signed certificate in certificate chain`: the router sends the lab
        CA with the certificate (from `--ca-cert`), and the workstation does not trust it. With `-k` the page comes back,
        because nothing is checked at all. `-k` is for looking at a certificate, never for proving a setup works.
    - kind: ask
      id: guess-reen-cert
      guess: true
      prompt: Through web-reen, which certificate will the workstation's curl receive?
      choices:
      - text: lab-routes, issued by Academy Lab CA
        why: The client's TLS connection ends at the router, which presents the Route's own certificate. The next step shows it.
      - text: web.<project>.svc, issued by the service CA
        why: That certificate serves the second connection, from the router to the pod. The client never sees it.
      - text: The router's default wildcard certificate
        why: The default is used only when a Route has no certificate of its own; web-reen has one.
      answer: 0
    - kind: show
      id: route-certificates
      body: "Which certificate does the client see through `web-reen`?"
      run: "curl -sv -m 5 --cacert ca.crt -o /dev/null https://tls-reen.apps-crc.testing/ 2>&1 | grep -E 'subject:|issuer:|SSL certificate verify|< HTTP'"
      notice: "`subject: CN=lab-routes`, `issuer: CN=Academy Lab CA`, the verification succeeded, and `HTTP/1.1 200 OK`: the client sees the Route's certificate. The pod's service CA certificate is used only between the router and the pod."
    - kind: teach
      id: passthrough-teach
      title: Passthrough leaves TLS to the pod
      body: |
        A **passthrough Route** does not decrypt anything. The router reads only the host name the client sends in
        the TLS handshake (SNI) and forwards the encrypted stream to the pod. The pod must therefore present a
        certificate valid for the public host name. The second application, `public`, gets such a certificate from
        the lab CA, in a TLS Secret.
    - kind: show
      id: make-pod-cert
      run: "openssl req -new -newkey rsa:2048 -nodes -keyout public.key -out public.csr -subj \"/CN=tls-pass.apps-crc.testing\" -addext \"subjectAltName=DNS:tls-pass.apps-crc.testing\" 2>/dev/null && openssl x509 -req -in public.csr -CA ca.crt -CAkey ca.key -days 2 -copy_extensions copy -out public.crt 2>/dev/null && oc create secret tls public-tls --cert=public.crt --key=public.key"
      notice: "A certificate for `tls-pass.apps-crc.testing`, and `secret/public-tls created`: `oc create secret tls` stores the pair under the keys `tls.crt` and `tls.key`."
    - kind: show
      id: passthrough-route
      run: "oc apply -f public.yaml && oc rollout status deployment/public --timeout=180s && oc create route passthrough web-pass --service=public --port=https --hostname=tls-pass.apps-crc.testing"
      notice: "`public` rolls out with its certificate, and `route.route.openshift.io/web-pass created`. A passthrough Route takes no certificate options: it has nothing to decrypt."
    - kind: ask
      id: sni-choice
      prompt: The router does not decrypt web-pass's traffic. What does it use to choose the backend?
      choices:
      - text: The host name in the TLS handshake (SNI)
        why: The client sends that name, unencrypted, at the start of the handshake; the router reads nothing else.
      - text: The Host header of the HTTP request
        why: The HTTP request travels inside the encrypted stream, which the router never opens.
      - text: The certificate that the pod presents
        why: The pod's certificate comes back after the router has already chosen the pod.
      answer: 0
    - kind: show
      id: passthrough-cert
      run: "curl -sv -m 5 --cacert ca.crt https://tls-pass.apps-crc.testing/ 2>&1 | grep -E 'subject:|issuer:|SSL certificate verify|< HTTP|hello'"
      notice: "`subject: CN=tls-pass.apps-crc.testing`: the pod's own certificate, verified against the lab CA, and the page `hello from public, TLS ends in the pod`."
    - kind: show
      id: sni-only
      body: |
        The router needed nothing from HTTP to route that connection: only the host name in the TLS handshake.
        `openssl s_client` opens a bare TLS connection and sends that name with `-servername`, without speaking
        HTTP at all:
      run: "openssl s_client -connect tls-pass.apps-crc.testing:443 -servername tls-pass.apps-crc.testing -CAfile ca.crt </dev/null 2>/dev/null | grep -E '^subject=|^issuer=|Verify return code'"
      notice: |
        The pod's certificate again, and `Verify return code: 0 (ok)`. A passthrough Route can therefore carry any
        protocol that runs inside TLS and whose clients send SNI, on the router's port 443. A plain TCP protocol
        without TLS gives the router nothing to route on: that needs a Service, in the next lesson.
      understand:
        purpose: Opens a bare TLS connection to the router, sends the host name in the handshake, reports whether the
          certificate it gets is signed by `ca.crt`, and closes without speaking HTTP.
        parts:
          - text: -connect tls-pass.apps-crc.testing:443
            means: 'Where to open the connection: host and port.'
          - text: -CAfile ca.crt
            means: 'The authority to verify the server''s certificate against; the result is the `Verify return code`
              line. `s_client` only reports it: it does not check the host name (that needs `-verify_hostname`) and does
              not stop on a failure (`-verify_return_error`).'
          - text: </dev/null
            means: Gives `s_client` an empty input. It closes the connection at the end of its input, so it stops after
              the handshake instead of waiting for you to type.
          - text: 2>/dev/null
            means: Hides the diagnostic lines that `s_client` writes to the error stream.
        concepts:
          - sec.certs
          - net.routes
        refs:
          - title: openssl-s_client(1)
            url: https://docs.openssl.org/3.0/man1/openssl-s_client/
    - kind: ask
      id: client-certificates
      prompt: The pod must verify the external client’s own TLS certificate. Which Route type preserves that handshake?
      choices:
        - text: Passthrough
          why: The original TLS session reaches the pod, including client-certificate authentication.
        - text: Re-encrypt with a service CA certificate
          why: The router ends the original session and opens its own; it does not preserve the client’s original
            TLS handshake.
        - text: Edge with HTTP redirect enabled
          why: Redirect chooses HTTPS at the front; edge still ends TLS at the router.
      answer: 0
    - kind: teach
      id: dest-ca
      title: Re-encrypt to a backend the service CA did not sign
      body: |
        `public` also serves TLS, but with the lab CA's certificate. A re-encrypt Route to it without
        `--dest-ca-cert` makes the router check that certificate against the service CA.
    - kind: show
      id: reen-wrong-ca
      run: "oc create route reencrypt public-reen --service=public --port=https --hostname=tls-pubreen.apps-crc.testing"
      notice: "`route.route.openshift.io/public-reen created`. No front certificate: the router uses its default wildcard certificate for `*.apps-crc.testing`."
    - kind: show
      id: reen-wrong-ca-result
      run: "curl -sk -m 5 -o /dev/null -w '%{http_code}\\n' https://tls-pubreen.apps-crc.testing/"
      notice: "`503`. (`-k` only because the workstation does not trust the router's default certificate.) The router could not verify the pod's certificate, so it has no usable backend."
    - kind: ask
      id: fix-503
      prompt: public-reen answers 503 while the public pod is healthy. What fixes it?
      choices:
      - text: Give the Route the CA that signed public's certificate
        why: By default the router checks the pod's certificate against the service CA; --dest-ca-cert names the CA that really signed it.
      - text: Run curl with --cacert ca.crt instead of -k
        why: That changes what the workstation trusts. The 503 comes from the router, which could not verify the pod.
      - text: Add a front certificate with --cert and --key
        why: The front certificate serves the client's connection. The failing hop is the router's connection to the pod.
      answer: 0
    - kind: show
      id: reen-dest-ca
      body: "The fix is to tell the router which CA signed the backend's certificate:"
      run: "oc delete route public-reen && oc create route reencrypt public-reen --service=public --port=https --hostname=tls-pubreen.apps-crc.testing --dest-ca-cert=ca.crt"
      notice: "The Route is recreated with `spec.tls.destinationCACertificate` set to the lab CA."
    - kind: show
      id: reen-dest-ca-result
      run: "curl -sk -m 5 -o /dev/null -w '%{http_code}\\n' https://tls-pubreen.apps-crc.testing/"
      notice: "`200`: the router trusts the backend now."
    - kind: show
      id: routes-overview
      run: "oc get routes"
      notice: "Four Routes, three terminations: `edge` and `reencrypt` with the lab certificate, `passthrough` to the pod, and `reencrypt` with a destination CA."
    - kind: teach
      id: renewal
      title: Renewal must reach the running application
      body: |
        The service CA renews the Secret, but the application must read the replacement material.
        A whole-Secret volume receives updates eventually; an application still needs to reload the files or restart.
        A `subPath` mount, as in this lesson's Deployments, does not receive Secret updates, so the pod must be
        replaced to pick them up.

        The service CA lasts 26 months and rotates automatically when less than 13 months remain. The previous
        CA remains trusted until expiry during automatic rotation. Certificates you bring, on Routes or in pods,
        are renewed by you or by tooling you configure.
    - kind: ask
      id: stale-certificate
      prompt: The Secret has renewed, but a whole-Secret mount still serves the old certificate. What should you
        check?
      choices:
        - text: Whether every renewal changes the Service name
          why: Renewal replaces certificate material; it does not require a new Service DNS identity.
        - text: Whether a passthrough Route renews the Secret
          why: The service CA manages this Secret, independently of Route forwarding.
        - text: Whether the server reloads its TLS files
          why: File propagation and application reload are separate; confirm both before deciding a restart is needed.
      answer: 2
    - kind: reflect
      id: choose-path
      prompt: Describe a browser-to-pod encrypted setup and how you would verify the two TLS connections.
      model: |
        Request a service CA Secret on the Service, mount it and configure the pod's TLS listener, then create a
        re-encrypt Route to that port with the public certificate, key and CA. Verify the internal Service from a pod
        with its .svc name and the service CA bundle, and verify the Route from outside with its public host name and
        the public CA, without -k. If the backend's certificate comes from another CA, give the Route that CA with
        --dest-ca-cert. Plan how the certificates are renewed and reloaded.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can request a Service certificate and a CA bundle, verify trust and hostname separately, put your own
        CA's certificate on edge and re-encrypt Routes, terminate TLS in a pod with passthrough, and point a
        re-encrypt Route at the right destination CA. [TLS three ways, and non-HTTP exposure](/lab/lab.tls-exposure)
        practises those choices.

        Next, [Expose plain TCP: NodePort and LoadBalancer](/lesson/n.loadbalancer-services) handles protocols that no
        Route can carry.
  sections:
    - id: exposure-reference
      title: Choose exposure and diagnose failures
      depth: true
      body: |
        | Requirement | Exposure | Check |
        |---|---|---|
        | browser HTTPS, plain backend | edge Route | backend is HTTP; insecureEdgeTerminationPolicy can Redirect HTTP |
        | encrypted browser and backend connections | re-encrypt Route plus backend TLS | service CA by default, or `--dest-ca-cert` |
        | original TLS or client certificate checked in pod | passthrough Route | TLS with SNI; pod certificate must name public host |
        | internal encrypted calls | Service plus service CA certificate | client trust and full .svc name |
        | external plain TCP/UDP | LoadBalancer or NodePort Service | see the next lesson |

        | Symptom | Evidence to distinguish causes |
        |---|---|
        | curl code 60, unable to get local issuer certificate, or self-signed certificate in certificate chain | missing or wrong client CA bundle |
        | curl code 60, no alternative certificate subject name | short name or public Route host absent from the certificate |
        | re-encrypt Route gives 503, backend healthy | backend certificate not signed by the service CA and no `--dest-ca-cert` |
        | passthrough fails against healthy HTTP pod | pod must terminate TLS, not serve plain HTTP |
        | renewed Secret, stale server certificate | subPath mount, propagation delay or missing application reload |
        | HTTP fails but HTTPS works at an edge Route | inspect insecureEdgeTerminationPolicy; None is the default |

        Serving certificates normally last two years and are renewed automatically.
        A headless Service additionally receives a wildcard subject for its pod DNS names; do not use that shared
        wildcard certificate when clients must distinguish individual pod identities.
        Deleting a generated serving Secret requests replacement; plan for the application to load the new material.

        For edge and re-encrypt Routes, spec.tls.externalCertificate can reference a TLS Secret in the Route's
        namespace instead of inline certificate fields. Configure the documented RBAC for the openshift-ingress router
        ServiceAccount to read it. A certificate manager can update that Secret; renewal and serving behaviour still
        need verification. Reading a Route with `-o yaml` prints its inline key: share Route manifests with care.
  review:
    - q: What does the serving-cert-secret-name annotation do?
      a: The service CA operator creates, and renews before expiry, a TLS Secret for the Service's names <service>.<namespace>.svc and <service>.<namespace>.svc.cluster.local.
    - q: How does a client get the service CA bundle?
      a: From /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt in a pod, from the openshift-service-ca.crt ConfigMap in every project, or from a ConfigMap annotated service.beta.openshift.io/inject-cabundle=true.
    - q: What do --cert, --key, --ca-cert and --dest-ca-cert configure on a Route?
      a: The certificate, key and CA chain the router presents to clients (edge, re-encrypt); --dest-ca-cert is the CA the router trusts for the pod's certificate (re-encrypt).
    - q: How long is the service CA valid, and when is it rotated?
      a: 26 months; it is rotated automatically when less than 13 months remain, and the previous CA stays trusted
        until it expires.
    - q: Why does trusting the service CA not make https://web valid?
      a: Trust and hostname matching are separate checks; an ordinary Service certificate covers web.<namespace>.svc,
        not the short name.
  labs:
    - lab.tls-exposure
  limits: |
    The lab CA and its certificates were generated for the recording and valid for two days; a real deployment uses
    the company's CA or an ACME issuer. The workstation reached the Routes through OpenShift Local's router.
  references:
    - title: 'OpenShift 4.21: Securing service traffic with service serving certificates'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/security_and_compliance/configuring-certificates#add-service-serving
    - title: 'OpenShift 4.21: Creating secured routes (edge, passthrough, re-encrypt)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes#configuring-default-certificate
    - title: 'OpenShift 4.21: Routes'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes
    - title: 'OpenShift 4.21: Creating advanced routes (externally managed certificates)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes#nw-ingress-route-secret-load-external-cert_creating-advanced-routes
    - title: 'OpenShift API: Route TLSConfig (insecureEdgeTerminationPolicy, destinationCACertificate)'
      url: https://github.com/openshift/api/blob/release-4.21/route/v1/types.go
    - title: 'Kubernetes: Secrets as files and subPath update limitations'
      url: https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets-as-files-from-a-pod
    - title: 'OpenSSL: openssl-req and openssl-x509 manual pages'
      url: https://docs.openssl.org/3.0/man1/openssl-req/
  commands:
    - {cmd: "oc apply -f web.yaml && oc rollout status deployment/web --timeout=180s && oc rollout status deployment/client --timeout=180s", timeout: 400, meaning: "the annotated Service, the web server mounting the Secret, and a client"}
    - {cmd: "oc get secret web-tls -o jsonpath='{.type}{\"\\n\"}{.metadata.annotations}{\"\\n\"}'", meaning: "the Secret the service CA issued"}
    - {cmd: "oc get secret web-tls -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -subject -issuer -ext subjectAltName", meaning: "the certificate's names and issuer (never the key)"}
    - {cmd: "oc exec deploy/client -- curl -sS -m 5 --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://web.$(oc project -q).svc:8443/", meaning: "verified TLS by Service name"}
    - {cmd: "oc exec deploy/client -- curl -sS -m 5 --cacert /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt https://web:8443/", expect: fail, meaning: "the short name is not in the certificate"}
    - {cmd: "oc exec deploy/client -- curl -sS -m 5 https://web.$(oc project -q).svc:8443/", expect: fail, meaning: "without the CA, the issuer is unknown"}
    - {cmd: "oc create configmap lab-service-ca && oc annotate configmap lab-service-ca service.beta.openshift.io/inject-cabundle=true", meaning: "ask for the CA bundle in a ConfigMap"}
    - {cmd: "sleep 5", meaning: "give the operator a moment"}
    - {cmd: "oc get configmap lab-service-ca -o jsonpath='{.data.service-ca\\.crt}' | openssl x509 -noout -subject -enddate", meaning: "the injected service CA"}
    - {cmd: "oc get configmaps", meaning: "the CA ConfigMaps every project gets"}
    - {cmd: "openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj \"/CN=Academy Lab CA\" 2>/dev/null && openssl x509 -in ca.crt -noout -subject -issuer", meaning: "a lab CA, valid two days"}
    - {cmd: "openssl req -new -newkey rsa:2048 -nodes -keyout routes.key -out routes.csr -subj \"/CN=lab-routes\" -addext \"subjectAltName=DNS:tls-edge.apps-crc.testing,DNS:tls-reen.apps-crc.testing\" 2>/dev/null && openssl x509 -req -in routes.csr -CA ca.crt -CAkey ca.key -days 2 -copy_extensions copy -out routes.crt 2>/dev/null && openssl x509 -in routes.crt -noout -subject -issuer -ext subjectAltName", meaning: "a Route certificate signed by the lab CA"}
    - {cmd: "oc create route edge web-edge --service=web --port=http --hostname=tls-edge.apps-crc.testing --cert=routes.crt --key=routes.key --ca-cert=ca.crt", meaning: "edge Route with the lab certificate"}
    - {cmd: "oc create route reencrypt web-reen --service=web --port=https --hostname=tls-reen.apps-crc.testing --cert=routes.crt --key=routes.key --ca-cert=ca.crt", meaning: "re-encrypt Route: lab certificate in front, service CA behind"}
    - {cmd: "for r in web-edge web-reen; do for i in $(seq 1 30); do oc get route $r -o jsonpath='{.status.ingress[*].routerName}' | grep -qw default && break; sleep 2; done; done; sleep 5", timeout: 150, meaning: "wait until the router has admitted both Routes and reloaded"}
    - {cmd: "curl -sS -m 5 --cacert ca.crt https://tls-edge.apps-crc.testing/ && curl -sS -m 5 --cacert ca.crt https://tls-reen.apps-crc.testing/", meaning: "both verified against the lab CA"}
    - {cmd: "curl -sS -m 5 https://tls-edge.apps-crc.testing/; echo \"exit $?\"; curl -sk -m 5 https://tls-edge.apps-crc.testing/", meaning: "untrusted without the CA; -k checks nothing"}
    - {cmd: "curl -sv -m 5 --cacert ca.crt -o /dev/null https://tls-reen.apps-crc.testing/ 2>&1 | grep -E 'subject:|issuer:|SSL certificate verify|< HTTP'", meaning: "the certificate a client sees through re-encrypt"}
    - {cmd: "openssl req -new -newkey rsa:2048 -nodes -keyout public.key -out public.csr -subj \"/CN=tls-pass.apps-crc.testing\" -addext \"subjectAltName=DNS:tls-pass.apps-crc.testing\" 2>/dev/null && openssl x509 -req -in public.csr -CA ca.crt -CAkey ca.key -days 2 -copy_extensions copy -out public.crt 2>/dev/null && oc create secret tls public-tls --cert=public.crt --key=public.key", meaning: "a certificate for the pod, stored in a TLS Secret"}
    - {cmd: "oc apply -f public.yaml && oc rollout status deployment/public --timeout=180s && oc create route passthrough web-pass --service=public --port=https --hostname=tls-pass.apps-crc.testing", timeout: 300, meaning: "the pod that terminates TLS, and its passthrough Route"}
    - {cmd: "for i in $(seq 1 30); do oc get route web-pass -o jsonpath='{.status.ingress[*].routerName}' | grep -qw default && break; sleep 2; done; sleep 5", timeout: 120, meaning: "wait until the router has admitted the Route and reloaded"}
    - {cmd: "curl -sv -m 5 --cacert ca.crt https://tls-pass.apps-crc.testing/ 2>&1 | grep -E 'subject:|issuer:|SSL certificate verify|< HTTP|hello'", meaning: "the pod's own certificate, verified"}
    - {cmd: "openssl s_client -connect tls-pass.apps-crc.testing:443 -servername tls-pass.apps-crc.testing -CAfile ca.crt </dev/null 2>/dev/null | grep -E '^subject=|^issuer=|Verify return code'", meaning: "a bare TLS connection with SNI, no HTTP"}
    - {cmd: "oc create route reencrypt public-reen --service=public --port=https --hostname=tls-pubreen.apps-crc.testing", meaning: "re-encrypt to a backend the service CA did not sign"}
    - {cmd: "for i in $(seq 1 30); do oc get route public-reen -o jsonpath='{.status.ingress[*].routerName}' | grep -qw default && break; sleep 2; done; sleep 5", timeout: 120, meaning: "wait until the router has admitted the Route and reloaded"}
    - {cmd: "curl -sk -m 5 -o /dev/null -w '%{http_code}\\n' https://tls-pubreen.apps-crc.testing/", meaning: "503: the router cannot verify the backend"}
    - {cmd: "oc delete route public-reen && oc create route reencrypt public-reen --service=public --port=https --hostname=tls-pubreen.apps-crc.testing --dest-ca-cert=ca.crt", meaning: "the same Route with the backend's CA"}
    - {cmd: "sleep 10", meaning: "give the router time to load the new Route"}
    - {cmd: "curl -sk -m 5 -o /dev/null -w '%{http_code}\\n' https://tls-pubreen.apps-crc.testing/", meaning: "200 with the right destination CA"}
    - {cmd: "oc get routes", meaning: "the four Routes and their terminations"}
- id: n.ingress-dns-certs
  title: Ingress, DNS and certificates
  subtitle: The platform's front door and the operators behind it
  module: b4-network-security
  mode: REAL_LAB
  minutes: 30
  level: 3
  supports: "OpenShift 4.21 Ingress, DNS, network and service CA operators. Every command was run on OpenShift Local 4.21 by the cluster administrator (kubeadmin): reads, and two changes validated with server-side dry runs that the API server checks but never stores. Copies of the DNS and default IngressController configuration taken before and after prove nothing changed (experiment X-NET-07). The pod DNS output is quoted from the existing lab.request-path recording."
  concepts:
    - net.ingresscontroller
    - net.dns
    - net.routes
    - sec.certs
  prerequisites:
    - d.routes-tls
    - o2.tls-exposure
    - d.networkpolicy-ovn
  record_on: cluster-admin
  objective: |
    Know which operator owns each piece of cluster networking, read its configuration and the workloads it generates,
    validate a DNS zone forwarder and a custom ingress certificate without applying them, and tell the certificates
    the platform renews from those your team owns.
  flow:
    - kind: teach
      id: situation
      title: One application fails, or all of them?
      body: |
        One team reports a Route returning 503. Another reports certificate warnings across every application.
        Both arrive as “the network is broken,” but they point to different owners and different evidence.

        You will read the operator configuration for ingress, DNS and certificates on a lab cluster, as its
        administrator, and separate application faults from platform faults. Two platform changes are validated
        with `--dry-run=server`: the API server checks them completely and stores nothing.
    - kind: teach
      id: ownership
      title: Change the operator’s input
      body: |
        An **operator** reconciles configuration into running components. OpenShift's Ingress Operator manages
        the HAProxy routers; the DNS Operator manages CoreDNS; the Cluster Network Operator manages cluster
        networking; the service CA operator issues internal Service certificates.

        Each reports health through a ClusterOperator. Edit the operator's configuration object, not a generated
        Deployment or ConfigMap: reconciliation can undo direct edits.
    - kind: show
      id: operators
      run: "oc get clusteroperators ingress dns network service-ca"
      notice: "All four `Available` `True`, `Progressing` and `Degraded` `False`. `SINCE` counts from each operator's last change of state."
    - kind: show
      id: read-platform-inputs
      body: "The routers are configured by IngressControllers in `openshift-ingress-operator`:"
      run: "oc get ingresscontroller -n openshift-ingress-operator"
      notice: "One, `default`, created at installation."
    - kind: ask
      id: recall-shard-input
      recalls: n.ingress-sharding
      prompt: In the sharding lesson, what did you create to get a second router?
      choices:
      - text: An IngressController in openshift-ingress-operator
        why: The Ingress Operator generated the router Deployment and its Service from it, as it does from default.
      - text: A router Deployment in openshift-ingress
        why: That Deployment was generated by the operator; a direct edit would be undone.
      - text: A Route labelled shard=academy
        why: The label chose which Routes the second router served; it did not create the router.
      answer: 0
    - kind: show
      id: default-spec
      body: "Its `spec`, the part an administrator edits:"
      run: "oc get ingresscontroller default -n openshift-ingress-operator -o yaml | sed -n '/^spec:/,/^status:/p'"
      notice: |
        Almost nothing is set: `replicas: 1` and a few policies. No `domain`, no `defaultCertificate`, no
        `endpointPublishingStrategy`: the operator uses the platform's defaults and reports what it chose in `status`.
    - kind: show
      id: ingress-domain
      body: "The default router's domain comes from the cluster-wide ingress configuration:"
      run: "oc get ingress.config.openshift.io cluster -o jsonpath='{.spec.domain}{\"\\n\"}'"
      notice: "`apps-crc.testing`: generated Route hosts end with it."
    - kind: show
      id: router-pods
      run: "oc get pods -n openshift-ingress -o wide"
      notice: |
        `router-default-…` runs with the node's own address: this cluster publishes the router on the host network.
        `routes-controller` belongs to OpenShift Local, not to the Ingress Operator.
    - kind: show
      id: generated-router
      body: "How the router Deployment is tied to its IngressController:"
      run: "oc get deployment router-default -n openshift-ingress -o jsonpath='{.metadata.labels}{\"\\n\"}'"
      notice: "The label `ingresscontroller.operator.openshift.io/owning-ingresscontroller: default`: the operator generated this Deployment from the IngressController `default` and keeps it matching."
    - kind: ask
      id: edit-generated
      prompt: "An administrator scales `deployment/router-default` to 2 replicas directly. What happens?"
      choices:
        - text: "Two routers run from now on"
          why: "The Deployment is generated. The operator compares it with the IngressController, which still says one replica."
        - text: "The Ingress Operator sets it back to one"
          why: "The IngressController's `replicas` is the input. Change it there: `oc scale ingresscontroller/default -n openshift-ingress-operator --replicas=2` or a patch."
        - text: "The API server refuses the change"
          why: "The API server accepts the edit; the operator undoes it afterwards."
      answer: 1
    - kind: ask
      id: overlap-prediction
      recalls: n.ingress-sharding
      prompt: "A second IngressController selects Routes labelled `shard=academy`. The default has no selector. Which routers serve a labelled Route?"
      choices:
        - text: Both the shard and default
          why: 'Both selectors match: the shard explicitly and default without a restriction, as the two entries in the Route''s status showed.'
        - text: Only the shard, because its selector is specific
          why: Selectors do not assign exclusive ownership or override another controller.
        - text: Only default, because it already served them
          why: An additional matching controller admits the same Routes too.
      answer: 0
    - kind: teach
      id: dns-operator
      title: The DNS operator's input
      body: |
        Cluster DNS is CoreDNS, run by the DNS Operator from one cluster-scoped object:
        `dns.operator.openshift.io/default`. It answers Service and pod names and forwards every other query
        upstream.
    - kind: try
      id: try-read-dns
      body: "As the administrator, print the DNS operator's configuration object as YAML."
      accept: ["oc get dns.operator/default -o yaml", "oc get dns.operator default -o yaml", "oc get dns.operator.openshift.io default -o yaml", "oc get dns.operator.openshift.io/default -o yaml", "oc get dnses.operator.openshift.io default -o yaml", "oc get dns.operator/default --output=yaml"]
      hints:
        - match: "^oc get dns( |$)|^oc get dns default"
          say: "`dns` alone is ambiguous: there is also `dns.config.openshift.io`. Name the operator's API: `dns.operator`."
        - match: "openshift-dns"
          say: "The configuration object is cluster-scoped: no `-n`. `openshift-dns` holds the generated workload."
        - match: "configmap"
          say: "The ConfigMap is generated from this object. The task asks for the operator's input."
      hint: "`oc get dns.operator/default` with YAML output."
      run: "oc get dns.operator/default -o yaml"
      then: |
        `spec.upstreamResolvers` sends other queries to the node's `/etc/resolv.conf` (`type: SystemResolvConf`) on
        port 53. There is no `spec.servers`: no zone is forwarded anywhere special. `status.clusterIP` is the DNS
        Service address that every pod's resolver uses.
    - kind: show
      id: dns-workloads
      run: "oc get daemonsets -n openshift-dns"
      notice: |
        `dns-default` runs CoreDNS; `node-resolver` keeps the internal registry's name in the nodes' hosts files so
        that image pulls on the node can resolve it. Pods use CoreDNS, not those hosts files.
    - kind: show
      id: corefile
      body: "The configuration the operator generated for CoreDNS:"
      run: "oc get configmap dns-default -n openshift-dns -o jsonpath='{.data.Corefile}'"
      notice: |
        CoreDNS listens on 5353 (the port NetworkPolicies must allow), answers `cluster.local` itself with the
        `kubernetes` plugin, and forwards everything else to `/etc/resolv.conf`: the `forward .` line, made from
        `upstreamResolvers`. `reload` makes CoreDNS pick up a new Corefile without a restart.
    - kind: ask
      id: persistent-dns-change
      prompt: A direct CoreDNS ConfigMap edit is undone. Where should corporate zone forwarding be configured?
      choices:
        - text: Every node’s hosts file by hand
          why: Pods do not inherit node hosts files, and manual node changes create configuration drift.
        - text: The DNS operator’s default object
          why: The operator generates CoreDNS configuration from that input, so reconciliation preserves the desired
            forwarding rules.
        - text: The same ConfigMap with a different editor
          why: The ownership is unchanged; a direct edit can still be overwritten.
      answer: 1
    - kind: teach
      id: zone-forwarding
      title: Forward a zone, not every query
      body: |
        A corporate name such as `db.corp.example` may need resolvers different from the node defaults. Configure a
        **zone forwarder** in `spec.servers`: queries for that zone go to the listed upstreams, everything else
        follows `upstreamResolvers`. `spec.servers` is one list; a merge patch replaces it whole, so include existing
        entries when you add one.

        A server-side dry run sends the change to the API server, which validates it and returns the object it
        would store, without storing it:
    - kind: show
      id: corporate-zone
      run: "oc patch dns.operator/default --type=merge -p '{\"spec\":{\"servers\":[{\"name\":\"corporate\",\"zones\":[\"corp.example\"],\"forwardPlugin\":{\"policy\":\"Random\",\"upstreams\":[\"10.1.1.53\"]}}]}}' --dry-run=server -o jsonpath='{.spec.servers}{\"\\n\"}'"
      notice: "The server accepted the entry: zone `corp.example`, upstream `10.1.1.53`, policy `Random`. The DNS pods would also have to reach `10.1.1.53` on port 53, and the record would have to exist there."
    - kind: show
      id: corporate-zone-not-stored
      run: "oc get dns.operator/default -o jsonpath='{.metadata.generation} servers={.spec.servers}{\"\\n\"}'"
      notice: "Generation `1` and no `servers`: the dry run stored nothing."
    - kind: ask
      id: pod-only-dns-failure
      recalls: d.networkpolicy-ovn
      prompt: Only one egress-isolated project cannot resolve an existing Service name. What do you inspect first?
      choices:
        - text: The cluster-wide corporate zone forwarder
          why: An internal Service name is answered by cluster DNS, not by a corporate zone forwarder.
        - text: The ingress wildcard certificate expiry date
          why: DNS lookup and certificate verification are different stages. A certificate cannot resolve a Service name.
        - text: That project's DNS egress rule
          why: Only one project fails, so look at what is special about it. Its egress policy must allow DNS to the openshift-dns pods on 5353, as in the NetworkPolicies lesson. Then confirm the spelling of the name and its namespace.
      answer: 2
    - kind: show
      id: pod-resolver-check
      code: |
        $ oc exec deploy/toolbox -n academy-net -- cat /etc/resolv.conf
        search academy-net.svc.cluster.local svc.cluster.local cluster.local crc.testing
        nameserver 10.217.4.10
        options ndots:5
        $ oc exec deploy/toolbox -n academy-net -- getent hosts web.academy-net.svc.cluster.local
        10.217.4.69     web.academy-net.svc.cluster.local
      origin: lab
      caption: 'Existing recording: lab.request-path (dns).'
      notice: |
        The pod's resolver searches its project's names first, and its nameserver is `10.217.4.10`, the DNS
        Service address in the operator's `status.clusterIP` above. A lookup that fails from the pod still needs more
        evidence to separate a policy, a spelling mistake and an upstream failure.
    - kind: try
      id: query-corporate-name
      body: Deployment toolbox exists in billing and contains getent. Type the command that resolves db.corp.example
        from that workload.
      accept:
        - oc exec deploy/toolbox -n billing -- getent hosts db.corp.example
        - oc exec deployment/toolbox -n billing -- getent hosts db.corp.example
        - oc exec deployments/toolbox -n billing -- getent hosts db.corp.example
        - oc -n billing exec deploy/toolbox -- getent hosts db.corp.example
        - oc exec deploy/toolbox --namespace=billing -- getent hosts db.corp.example
      hints:
        - match: ^getent
          say: That would test the workstation resolver; the task needs the pod’s network context.
        - match: ^oc logs
          say: Logs are not a name-resolution test. Run getent through exec.
        - match: shop
          say: The affected workload is in billing.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n billing the command looks for the toolbox Deployment in your current project. It is in billing.
      hint: Use exec on deployment/toolbox in billing, then -- getent hosts db.corp.example.
      then: |
        The lookup would test the path used by that pod. Compare it with a Service-name lookup and other projects before asking an administrator to change zone forwarding.
    - kind: teach
      id: certificate-ownership
      title: Separate managed PKI from certificates you bring
      body: |
        [Certificates and non-HTTP traffic](/lesson/o2.tls-exposure) used the service CA for internal Services.
        OpenShift rotates many internal certificates itself, including the service CA and control-plane
        certificates. That does not cover every certificate users see. Read the two that matter most here.
    - kind: show
      id: ingress-certificate
      body: "The default router's certificate, from its Secret (certificate only, never the key):"
      run: "oc get secret router-certs-default -n openshift-ingress -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -subject -issuer -startdate -enddate"
      notice: |
        A wildcard for `*.apps-crc.testing`, issued by `ingress-operator@…`, the Ingress Operator's own CA, valid for
        two years. Browsers do not trust that CA. The documentation calls this generated certificate a placeholder:
        the operator does not rotate it, so replace it with a certificate from a trusted CA.
    - kind: show
      id: service-ca-certificate
      run: "oc get secret signing-key -n openshift-service-ca -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -subject -startdate -enddate"
      notice: "The service CA, `openshift-service-serving-signer@…`, valid for 26 months. The service CA operator rotates it automatically when less than 13 months remain."
    - kind: ask
      id: renewal-owner
      prompt: A corporate wildcard certificate is configured as the ingress default. Who renews it?
      choices:
        - text: The Ingress Operator through its own internal CA
          why: Replacing the corporate certificate with an internal one would not renew its external trust chain.
        - text: Your team or its configured issuer automation
          why: The Ingress Operator can serve the Secret; it cannot obtain a replacement signature from your corporate
            CA on its own.
        - text: The service CA operator before expiry
          why: The service CA issues internal Service certificates, not corporate wildcard certificates.
      answer: 1
    - kind: teach
      id: default-certificate-teach
      title: Replacing the ingress certificate
      body: |
        A custom default certificate is a TLS Secret in `openshift-ingress`, with the full chain, referenced by name
        from the default IngressController's `spec.defaultCertificate`. Changing it rolls the router out again,
        so it was only validated here:
    - kind: show
      id: default-certificate
      run: "oc patch ingresscontroller default -n openshift-ingress-operator --type=merge -p '{\"spec\":{\"defaultCertificate\":{\"name\":\"lab-wildcard\"}}}' --dry-run=server -o jsonpath='{.spec.defaultCertificate}{\"\\n\"}'"
      notice: "`{\"name\":\"lab-wildcard\"}`: the API server accepted the reference."
    - kind: show
      id: default-certificate-missing
      body: "Does the Secret it names exist? The administrator asks for it. Expect a `NotFound` error (exit status 1): the lab never created it, and that failure is the point."
      run: "oc get secret lab-wildcard -n openshift-ingress"
      notice: |
        `NotFound`: the Secret does not exist, yet the dry run was accepted. The API server checks the field's
        shape, not what it points to. Create and check the Secret first, then change the IngressController.
    - kind: ask
      id: trust-before-switch
      prompt: The new default certificate is signed by your corporate CA. Which components need that CA in the cluster's trusted bundle?
      choices:
      - text: Components that call Routes, such as authentication and the console
        why: They connect through the router and check its certificate against the cluster's trusted bundle, not a browser's.
      - text: Pods that call Services by their .svc names
        why: Those connections use service CA certificates, which the router's default certificate does not touch.
      - text: 'None: the IngressController distributes the CA itself'
        why: The IngressController only serves the Secret. Trust is configured separately, through the cluster-wide trusted CA bundle.
      answer: 0
    - kind: teach
      id: external-api
      title: The API endpoint has its own certificate configuration
      body: |
        For a corporate certificate on the external API hostname, use a TLS Secret in `openshift-config` and
        reference it as a named serving certificate in `apiserver.config.openshift.io/cluster`.
        Do not add a named certificate for `api-int`, the API hostname that nodes and cluster components use inside the
        cluster: Red Hat warns this can degrade the cluster.

        Trust also has separate configuration. A corporate CA for cluster proxy trust goes in a ConfigMap
        referenced by `proxy.config.openshift.io/cluster`; registry trust uses the image configuration's
        `additionalTrustedCA`. Supplying a server certificate and distributing client trust are different tasks.
    - kind: show
      id: api-and-proxy
      run: "oc get apiserver cluster -o jsonpath='{.spec}{\"\\n\"}' && oc get proxy cluster -o jsonpath='{.spec}{\"\\n\"}'"
      notice: "The API server has no `servingCerts` (only the audit profile), and the proxy has no trusted CA bundle: this cluster uses only certificates the platform made itself."
    - kind: ask
      id: fault-boundary
      prompt: One Route returns 503; its Service has no ready endpoints. Where should investigation start?
      choices:
        - text: The application selector and readiness
          why: The router was reached; missing ready backends points first to application objects, though other
            503 causes also exist.
        - text: The default ingress certificate for every Route
          why: A completed HTTP response is different evidence from a failed TLS handshake.
        - text: The DNS forwarder for every corporate zone
          why: The request already reached the router; a cluster-wide zone change does not restore missing endpoints.
      answer: 0
    - kind: reflect
      id: handoff
      prompt: A team wants an internal-only router. Describe the evidence you need before calling the design complete.
      model: |
        Use selectors that exclude the internal set from other controllers, then check each Route’s admitted router entries. Confirm the publishing strategy, DNS, firewall reachability, certificate names and renewal ownership, and test from both an intended internal client and an excluded external location.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can locate the configuration that operators reconcile and the workloads they generate, read the DNS
        configuration down to the Corefile, validate a zone forwarder and a certificate reference with a server-side
        dry run, and identify who must renew each exposed certificate. The depth tables map faults to owners.

        Next, [Quotas and LimitRanges](/lesson/o2.quotas-limits) gives shared projects resource
        guardrails as well as the identity and traffic boundaries you have already studied.
  sections:
    - id: operator-map
      title: Operator ownership and networking choices
      depth: true
      body: |
        | ClusterOperator | Component | Configuration input |
        |---|---|---|
        | ingress | HAProxy routers in openshift-ingress | IngressController in openshift-ingress-operator; ingress.config.openshift.io/cluster domain |
        | dns | CoreDNS dns-default DaemonSet in openshift-dns | dns.operator.openshift.io/default |
        | network | OVN-Kubernetes | network.config.openshift.io/cluster and network.operator.openshift.io/cluster |
        | service-ca | internal serving certificates and CA injection | Service and ConfigMap annotations; supported webhook CA injection |

        | Networking feature | Purpose |
        |---|---|
        | OVN-Kubernetes | default pod networking; OpenShift SDN was removed in 4.17 |
        | AdminNetworkPolicy / EgressFirewall / EgressIP | cluster guardrails, external-destination rules, stable egress addressing |
        | user-defined networks | supported tenant network isolation; design depends on topology |
        | MetalLB | LoadBalancer Services on suitable non-cloud infrastructure |
        | Ingress objects | OpenShift creates managed Routes for supported Kubernetes Ingress configuration |
        | Gateway API | role-oriented gateway and routing API with an Istio-based OpenShift implementation |

        Gateway API for cluster ingress has been generally available since 4.19, the release in which the
        Ingress Operator also took over the lifecycle of the Gateway API CRDs. On 4.21 the Ingress Operator
        manages the supported CRDs and the OpenShift gateway implementation. Supported means the OpenShift API
        surface only: vendor-specific resources such as Istio's VirtualService are not part of it, and not every
        upstream kind or feature works with every controller, so check the 4.21 documentation.

        The pod network can be expanded through the documented procedure. The serviceNetwork range cannot
        be modified after installation, directly or through the ServiceCIDR API. Treat these as platform
        network design constraints, rather than ordinary application settings.
    - id: certificate-map
      title: Certificate and trust ownership
      depth: true
      body: |
        | Certificate or trust | Configuration | Renewal owner |
        |---|---|---|
        | generated ingress default | operator-created placeholder, valid two years | replace it; Ingress Operator does not rotate it |
        | custom ingress default | TLS Secret in openshift-ingress, IngressController defaultCertificate | team or configured cert-manager/PKI automation |
        | external API named certificate | TLS Secret in openshift-config, apiserver cluster object | team or configured issuer automation |
        | internal Service serving certificate | annotated Service and generated TLS Secret | service CA; application still reloads material |
        | service CA | 26-month CA, automatic rotation below 13 months remaining | platform; clients must refresh during overlap |
        | corporate proxy trust | CA ConfigMap in openshift-config, proxy trustedCA reference | team maintains supplied CA bundle |
        | registry trust | image.config.openshift.io/cluster additionalTrustedCA | team maintains registry CA bundle |

        cert-manager Operator for Red Hat OpenShift can automate issuance and renewal using configured issuers,
        including ACME and internal PKI. Installing it alone does not make every existing certificate managed.
        Monitor expiry and test renewal. Updating a custom ingress Secret in place lets routers detect and reload
        the new certificate; changing Secret content does not inherently require a rolling Deployment update.
    - id: fault-map
      title: Application or platform evidence
      depth: true
      body: |
        | Symptom | First evidence | Likely ownership |
        |---|---|---|
        | one Route gives 503 | EndpointSlices, readiness, Service target port, router policy | application before platform |
        | Route appears on unexpected router | status.ingress and shard selectors | platform sharding |
        | many Route certificates warn | served chain, domain and expiry | shared ingress certificate |
        | API external clients see wrong certificate | requested hostname, named serving certificate and chain | platform API configuration |
        | pods cannot resolve one corporate zone | pod resolver, DNS egress, forwarder and upstream answer | application policy or platform forwarding |
        | one short Service name fails | spelling, current namespace and resolver search suffixes | application configuration |

        [Follow a request](/lab/lab.request-path) traces the application path;
        [A DNS name that does not exist](/lab/inc.dns-typo) practises checking the query before changing CoreDNS.
  review:
    - q: Where do you configure the default router (replicas, certificate, publishing)?
      a: The IngressController named default in openshift-ingress-operator; the router Deployment in openshift-ingress is generated from it.
    - q: How do you send DNS queries for a corporate zone to specific DNS servers?
      a: Add a servers entry (name, zones, forwardPlugin upstreams) to dns.operator.openshift.io/default; the operator regenerates the Corefile.
    - q: Which platform certificates must you renew yourself?
      a: The ones you bring (custom ingress default certificate, named API server certificates, application certificates);
        and the ingress operator's generated default is never rotated, so replace it.
    - q: What does --dry-run=server prove, and what not?
      a: That the API server accepts the change (schema, validation, admission) and what it would store; not that referenced objects such as a Secret exist, nor how the operator will react.
    - q: Which network plugin does OpenShift 4.21 use, and which range cannot change after installation?
      a: OVN-Kubernetes. The pod network has a supported expansion procedure; the serviceNetwork range cannot be
        modified post-installation, directly or through the ServiceCIDR API.
  labs:
    - lab.request-path
    - lab.tls-exposure
    - lab.networkpolicy
  limits: |
    The DNS zone forwarder and the custom ingress certificate were validated with server-side dry runs and not applied:
    a forwarder needs a corporate resolver to forward to, and a new default certificate rolls out the only default
    router, interrupting every Route on this cluster. Router sharding is shown in its own lesson.
  enterprise: |
    Typical enterprise layouts use separate ingress shards for internal and external traffic, certificates issued by the
    corporate PKI or through cert-manager, conditional DNS forwarding to corporate resolvers, and expiry monitoring for
    every certificate the platform team owns.
  commands:
    - {cmd: "oc get clusteroperators ingress dns network service-ca", as: admin, meaning: "the health of the four networking operators"}
    - {cmd: "oc get ingresscontroller -n openshift-ingress-operator", as: admin, meaning: "the routers' configuration objects"}
    - {cmd: "oc get ingresscontroller default -n openshift-ingress-operator -o yaml | sed -n '/^spec:/,/^status:/p'", as: admin, meaning: "the default IngressController's spec"}
    - {cmd: "oc get ingress.config.openshift.io cluster -o jsonpath='{.spec.domain}{\"\\n\"}'", as: admin, meaning: "the cluster's ingress domain"}
    - {cmd: "oc get pods -n openshift-ingress -o wide", as: admin, meaning: "the router pods"}
    - {cmd: "oc get deployment router-default -n openshift-ingress -o jsonpath='{.metadata.labels}{\"\\n\"}'", as: admin, meaning: "the router Deployment names the IngressController that owns it"}
    - {cmd: "oc get dns.operator/default -o yaml", as: admin, meaning: "the DNS operator's configuration and status"}
    - {cmd: "oc get daemonsets -n openshift-dns", as: admin, meaning: "CoreDNS and the node resolver"}
    - {cmd: "oc get configmap dns-default -n openshift-dns -o jsonpath='{.data.Corefile}'", as: admin, meaning: "the generated CoreDNS configuration"}
    - {cmd: "oc patch dns.operator/default --type=merge -p '{\"spec\":{\"servers\":[{\"name\":\"corporate\",\"zones\":[\"corp.example\"],\"forwardPlugin\":{\"policy\":\"Random\",\"upstreams\":[\"10.1.1.53\"]}}]}}' --dry-run=server -o jsonpath='{.spec.servers}{\"\\n\"}'", as: admin, meaning: "a zone forwarder, validated by the API server and not stored"}
    - {cmd: "oc get dns.operator/default -o jsonpath='{.metadata.generation} servers={.spec.servers}{\"\\n\"}'", as: admin, meaning: "nothing was stored"}
    - {cmd: "oc get secret router-certs-default -n openshift-ingress -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -subject -issuer -startdate -enddate", as: admin, meaning: "the default router's generated certificate"}
    - {cmd: "oc get secret signing-key -n openshift-service-ca -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -subject -startdate -enddate", as: admin, meaning: "the service CA certificate and its validity"}
    - {cmd: "oc patch ingresscontroller default -n openshift-ingress-operator --type=merge -p '{\"spec\":{\"defaultCertificate\":{\"name\":\"lab-wildcard\"}}}' --dry-run=server -o jsonpath='{.spec.defaultCertificate}{\"\\n\"}'", as: admin, meaning: "a custom default certificate reference, validated and not stored"}
    - {cmd: "oc get secret lab-wildcard -n openshift-ingress", as: admin, expect: fail, meaning: "the referenced Secret does not exist"}
    - {cmd: "oc get apiserver cluster -o jsonpath='{.spec}{\"\\n\"}' && oc get proxy cluster -o jsonpath='{.spec}{\"\\n\"}'", as: admin, meaning: "no named API certificate, no proxy trust bundle"}
  experiment:
    id: X-NET-07
    objective: "Read the Ingress, DNS and service CA operators' configuration as the administrator and validate two platform changes with server-side dry runs, then prove from copies taken before and after that neither the DNS operator nor the default IngressController changed."
    changes:
      - "None intended: read-only commands, and two server-side dry runs (dns.operator.openshift.io/default spec.servers; IngressController default spec.defaultCertificate) that the API server validates without storing"
    preflight:
      - cmd: |-
          found=$(oc get secret lab-wildcard -n openshift-ingress --ignore-not-found -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait co/dns --for=condition=Available=True --timeout=30s && oc wait co/ingress --for=condition=Available=True --timeout=30s"}
    snapshot:
      - "oc get dns.operator default -o jsonpath='{.metadata.generation} {.spec}'"
      - "oc get ingresscontroller default -n openshift-ingress-operator -o jsonpath='{.metadata.generation} {.spec}'"
      - "oc get configmap dns-default -n openshift-dns -o jsonpath='{.data.Corefile}' | sha256sum"
      - "oc get deployment router-default -n openshift-ingress -o jsonpath='{.metadata.generation}'"
    rollback:
      - "echo 'nothing to undo: no change was stored'"
  references:
    - title: 'OpenShift 4.21: Ingress Operator'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/networking_operators/configuring-ingress
    - title: 'OpenShift 4.21: Configuring ingress cluster traffic (sharding)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/configuring-ingress-cluster-traffic
    - title: 'OpenShift 4.21: Cluster Network Operator'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/networking_operators/cluster-network-operator
    - title: 'OpenShift 4.21: DNS Operator (DNS forwarding)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/networking_operators/dns-operator
    - title: 'OpenShift 4.21: Configuring certificates (ingress, API server, service CA)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/security_and_compliance/configuring-certificates
    - title: 'OpenShift 4.21: Certificate types and descriptions'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/security_and_compliance/certificate-types-and-descriptions
    - title: 'OKD 4.21: Adding API server certificates (no named certificate for api-int)'
      url: https://docs.okd.io/4.21/security/certificates/api-server.html
    - title: 'OpenShift 4.21: cert-manager Operator for Red Hat OpenShift'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/security_and_compliance/cert-manager-operator-for-red-hat-openshift
    - title: 'OpenShift 4.21: Gateway API with OpenShift networking'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/ingress_and_load_balancing/index
    - title: 'OpenShift 4.21: Release notes (Gateway API implementation)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/release_notes/ocp-4-21-release-notes
    - title: 'Kubernetes: Dry-run in the API (server-side dry run)'
      url: https://kubernetes.io/docs/reference/using-api/api-concepts/#dry-run
    - title: 'Kubernetes: Debugging DNS resolution'
      url: https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
