    url: https://v1-34.docs.kubernetes.io/docs/concepts/workloads/controllers/statefulset/
  - title: 'Kubernetes: StatefulSet Basics (tutorial)'
    url: https://kubernetes.io/docs/tutorials/stateful-application/basic-stateful-set/
  - title: 'Kubernetes: DNS for Services and Pods'
    url: https://v1-34.docs.kubernetes.io/docs/concepts/services-networking/dns-pod-service/
  - title: 'Kubernetes: Service API (publishNotReadyAddresses)'
    url: https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
  - title: 'Kubernetes: Persistent Volumes (reclaim policy)'
    url: https://v1-34.docs.kubernetes.io/docs/concepts/storage/persistent-volumes/
  commands:
  - cmd: oc apply -f web.yaml; oc rollout status statefulset/web --timeout=240s
    as: developer
    meaning: a headless Service and a StatefulSet with three replicas; the pods become ready one after the other
    timeout: 300
  - cmd: oc get pods -l app=web -o custom-columns=NAME:.metadata.name,STARTED:.status.startTime
    as: developer
    meaning: 'the pods'' start times: web-0, then web-1, then web-2, several seconds apart'
  - cmd: oc get service web
    as: developer
    meaning: 'the Service has no cluster IP: it is headless'
  - cmd: oc exec web-0 -- getent hosts web-2.web
    as: developer
    meaning: from web-0, the per-pod name of web-2 resolves to that one pod's IP
  - cmd: oc exec web-0 -- getent hosts web
    as: developer
    meaning: the Service name resolves to the IPs of all three ready pods
  - cmd: oc exec web-1 -- sh -c 'echo i-am-web-1 > /data/id; cat /data/id'; oc get pod web-1 -o jsonpath='{.status.podIP}{"\n"}'; oc delete pod web-1; oc wait --for=condition=Ready pod/web-1 --timeout=120s; oc get pod web-1 -o jsonpath='{.status.podIP}{"\n"}'; oc exec web-0 -- getent hosts web-1.web; oc exec web-1 -- cat /data/id
    as: developer
    meaning: 'delete web-1: the replacement keeps its name and DNS record, gets a new IP, and an empty emptyDir'
    expect: fail
    timeout: 240
  - cmd: oc scale statefulset/web --replicas=1; oc wait pod/web-2 pod/web-1 --for=delete --timeout=120s; oc get pods -l app=web; oc get events --field-selector involvedObject.name=web,reason=SuccessfulDelete --sort-by=.lastTimestamp
    as: developer
    meaning: 'scale to one replica: web-2 is removed first, then web-1; web-0 stays'
    timeout: 240
  - cmd: oc scale statefulset/web --replicas=3; oc rollout status statefulset/web --timeout=240s | tail -n 1; oc patch statefulset web -p '{"spec":{"updateStrategy":{"type":"RollingUpdate","rollingUpdate":{"partition":2}}}}'; oc set env statefulset/web COLOR=blue; sleep 20; oc rollout status statefulset/web --timeout=120s; oc get pods -l app=web -L controller-revision-hash
    as: developer
    meaning: 'scale back to three, set partition 2 and change the template: only web-2 gets the new revision'
    timeout: 420
  - cmd: oc apply -f db.yaml; oc rollout status statefulset/db --timeout=240s; oc get pvc
    as: developer
    meaning: 'a StatefulSet with a claim template: one claim per ordinal, each bound to its own volume'
    timeout: 300
  - cmd: oc exec db-0 -- sh -c 'echo i-am-db-0 > /data/id'; oc exec db-1 -- sh -c 'echo i-am-db-1 > /data/id'; oc delete pod db-1; oc wait --for=condition=Ready pod/db-1 --timeout=120s; oc exec db-1 -- cat /data/id
    as: developer
    meaning: 'the replacement db-1 mounts data-db-1 again and finds its file'
    timeout: 240
  - cmd: oc scale statefulset/db --replicas=1; oc wait pod/db-1 --for=delete --timeout=120s; oc get pvc; oc scale statefulset/db --replicas=2; oc rollout status statefulset/db --timeout=180s; oc exec db-1 -- cat /data/id
    as: developer
    meaning: 'scale down: the claim stays; scale up: db-1 finds its old file'
    timeout: 360
  - cmd: oc get pvc -n academy-lesson-f0-statefulsets -o jsonpath='{range .items[*]}{.spec.volumeName}{"\n"}{end}' > pvs.txt; oc get pv $(cat pvs.txt) -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,RECLAIM:.spec.persistentVolumeReclaimPolicy,CLAIM:.spec.claimRef.name
    as: admin
    meaning: 'the administrator records the two volumes in pvs.txt: Bound, reclaim policy Retain'
  - cmd: oc patch statefulset db -p '{"spec":{"persistentVolumeClaimRetentionPolicy":{"whenScaled":"Delete","whenDeleted":"Delete"}}}'; oc scale statefulset/db --replicas=1; oc wait pod/db-1 --for=delete --timeout=120s; oc wait pvc/data-db-1 --for=delete --timeout=120s; oc get pvc
    as: developer
    meaning: 'whenScaled: Delete: the scale-down now deletes the removed member''s claim'
    timeout: 300
  - cmd: oc get pv $(cat pvs.txt) -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,RECLAIM:.spec.persistentVolumeReclaimPolicy,CLAIM:.spec.claimRef.name
    as: admin
    meaning: 'the deleted claim''s volume is Released; the other is Bound'
  - cmd: oc delete statefulset db; oc wait pvc/data-db-0 --for=delete --timeout=120s; oc get pvc
    as: developer
    meaning: 'whenDeleted: Delete: deleting the StatefulSet deletes its last claim'
    timeout: 240
  - cmd: oc get pv $(cat pvs.txt) -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,CLAIM:.spec.claimRef.name; for pv in $(cat pvs.txt); do oc patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'; done; for pv in $(cat pvs.txt); do oc wait --for=delete pv/"$pv" --timeout=120s; done; echo "volumes of pvs.txt left=$(oc get pv -o name | grep -c -F -f pvs.txt)"
    as: admin
    meaning: 'both volumes Released; the administrator sets each one''s policy to Delete and the provisioner removes them'
    timeout: 360
  files:
    web.yaml: |
      apiVersion: v1
      kind: Service
      metadata:
        name: web
        labels:
          app: web
      spec:
        clusterIP: None
        selector:
          app: web
        ports:
        - name: web
          port: 8080
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: web
      spec:
        serviceName: web
        replicas: 3
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            terminationGracePeriodSeconds: 2
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              volumeMounts:
              - name: scratch
                mountPath: /data
            volumes:
            - name: scratch
              emptyDir: {}
    db.yaml: |
      apiVersion: v1
      kind: Service
      metadata:
        name: db
