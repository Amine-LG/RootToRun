  commands:
  - cmd: oc create deployment notes --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/notes --timeout=180s
    as: developer
    meaning: a Deployment whose pod only waits, to write files into
  - cmd: oc exec deploy/notes -- sh -c 'echo "note 1" > /tmp/note.txt; cat /tmp/note.txt'
    as: developer
    meaning: a file in the container's own file system
  - cmd: oc delete pod -l app=notes; oc wait --for=condition=Ready pod -l app=notes --timeout=120s; oc exec deploy/notes -- cat /tmp/note.txt
    as: developer
    meaning: 'delete the pod, wait for its replacement, look for the file: gone'
    expect: fail
  - cmd: oc api-resources | awk 'NR==1 || $1 ~ /^(persistentvolumeclaims|persistentvolumes|storageclasses)$/ {print $1, $(NF-1)}' | column -t; oc get pv
    as: developer
    meaning: which of the storage kinds belong to a project (NAMESPACED), and why an ordinary user cannot list the volumes
    expect: fail
  - cmd: oc get pv
    as: admin
    meaning: 'the administrator lists every volume: the registry''s, and Released ones left by earlier labs'
  - cmd: oc get storageclass
    as: developer
    meaning: 'the class you could use: default, provisioner, reclaim policy, binding mode, expansion'
  - cmd: oc get pvc
    as: developer
    meaning: 'the claims of this project: none yet'
  - cmd: oc apply -f notes-data.yaml; sleep 5; oc get pvc notes-data; oc describe pvc notes-data | sed -n '/^Events:/,$p'
    as: developer
    meaning: 'a claim with no consumer: Pending, with a Normal WaitForFirstConsumer event'
  - cmd: oc set volume deployment/notes --add --name=data --type=pvc --claim-name=notes-data --mount-path=/data; oc rollout status deployment/notes --timeout=180s; oc get pvc notes-data
    as: developer
    meaning: 'mount the claim: the new pod is its first consumer, and the claim binds'
    timeout: 240
  - cmd: oc get pvc notes-data -n academy-lesson-e-storage -o jsonpath='{.spec.volumeName}{"\n"}' | tee pv.txt; oc describe pv "$(cat pv.txt)"
    as: admin
    meaning: the claim's volume, kept in pv.txt, and its description
  - cmd: oc exec deploy/notes -- sh -c 'echo persisted > /data/note.txt'; oc delete pod -l app=notes; oc wait --for=condition=Ready pod -l app=notes --timeout=120s; oc exec deploy/notes -- cat /data/note.txt
    as: developer
    meaning: 'a note on the volume survives the pod''s replacement'
    timeout: 240
  - cmd: oc delete deployment notes; oc delete pvc notes-data; oc get pvc
    as: developer
    meaning: 'delete the Deployment, then the claim'
    timeout: 240
  - cmd: oc get pv "$(cat pv.txt)"
    as: admin
    meaning: 'the volume is Released, and still names the deleted claim'
  - cmd: oc create -f stor-debug-ns.yaml; oc debug node/crc --to-namespace=academy-x-stor-debug --image-stream=openshift/cli:latest -- chroot /host cat "/var/lib/csi-hostpath-data/$(cat pv.txt)/note.txt"
    as: admin
    meaning: 'a namespace for debug pods, then the note read from the node''s disk after the claim was deleted'
    timeout: 240
  - cmd: oc patch pv "$(cat pv.txt)" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'; oc wait --for=delete pv/"$(cat pv.txt)" --timeout=120s
    as: admin
    meaning: 'reclaim: the policy of this one volume becomes Delete, and the provisioner deletes the storage and the PV'
    timeout: 180
  - cmd: oc debug node/crc --to-namespace=academy-x-stor-debug --image-stream=openshift/cli:latest -- chroot /host ls "/var/lib/csi-hostpath-data/$(cat pv.txt)"; oc delete namespace academy-x-stor-debug
    as: admin
    meaning: 'the directory is gone; the debug namespace is removed'
    timeout: 300
  - cmd: oc apply -f typo-data.yaml; sleep 5; oc get pvc typo-data; oc get events --field-selector involvedObject.name=typo-data
    as: developer
    meaning: 'a claim that names a class that does not exist: ProvisioningFailed'
  - cmd: oc apply -f ghost.yaml; sleep 8; oc get pod ghost
    as: developer
    meaning: 'a pod that names a claim that does not exist: it stays Pending. No claim is created'
  - cmd: oc get events --field-selector involvedObject.name=ghost
    as: developer
    meaning: the scheduler's event names the missing claim
  files:
    notes-data.yaml: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: notes-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Mi
    typo-data.yaml: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: typo-data
      spec:
        storageClassName: fast-ssd
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Mi
    ghost.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: ghost
      spec:
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
          volumeMounts:
          - name: data
            mountPath: /data
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ghost-data
    stor-debug-ns.yaml: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: academy-x-stor-debug
        annotations:
          openshift.io/node-selector: ""
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
          security.openshift.io/scc.podSecurityLabelSync: "false"
  experiment:
    id: X-STOR-01
    objective: "Show the administrator's side of a claim on a Retain class: the PV made for the developer's claim, Released when the claim is deleted, its data still on the node, then reclaimed by setting that one PV's policy to Delete so that the provisioner removes the storage and the PV; prove that the cluster's volumes, the storage class and the node are as before."
    changes:
      - "PersistentVolume made by the hostpath provisioner for claim academy-lesson-e-storage/notes-data (Bound, then Released, then reclaim policy set to Delete and deleted with its directory by the provisioner)"
      - "Namespace academy-x-stor-debug, labelled privileged for Pod Security, with debug pods crc-debug-* removed by oc when their command ended (created, deleted); on node crc only cat and ls ran"
      - "Project academy-lesson-e-storage, the developer's temporary project, with Deployment notes, claims notes-data and typo-data, pod ghost (deleted by the rollback)"
    preflight:
      - cmd: |-
          found=$(oc get namespace academy-x-stor-debug --ignore-not-found -o name) || exit 1
          test -z "$found"
      - cmd: |-
          pvs=$(oc get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace == "academy-lesson-e-storage") | .metadata.name') || exit 1
          test -z "$pvs"
      - cmd: |-
          sc=$(oc get storageclass crc-csi-hostpath-provisioner -o jsonpath='{.reclaimPolicy} {.volumeBindingMode}') || exit 1
          test "$sc" = "Retain WaitForFirstConsumer"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=30s"}
    snapshot:
      - "oc get pv -o json | jq -S '[.items[] | {name:.metadata.name,phase:.status.phase,claim:.spec.claimRef.name,ns:.spec.claimRef.namespace,reclaim:.spec.persistentVolumeReclaimPolicy}] | sort_by(.name)'"
      - "oc get storageclass -o json | jq -S '[.items[] | {name:.metadata.name,provisioner:.provisioner,parameters:.parameters,reclaim:.reclaimPolicy,binding:.volumeBindingMode,expansion:.allowVolumeExpansion,default:.metadata.annotations[\"storageclass.kubernetes.io/is-default-class\"]}]'"
      - "oc get namespace academy-x-stor-debug --ignore-not-found -o name"
      - "oc get node crc -o jsonpath='{.metadata.annotations.machineconfiguration\\.openshift\\.io/currentConfig} {.metadata.annotations.machineconfiguration\\.openshift\\.io/desiredConfig} {.metadata.annotations.machineconfiguration\\.openshift\\.io/state} {.spec.unschedulable} {.spec.taints}'"
    rollback:
      - "oc delete namespace academy-x-stor-debug --ignore-not-found --wait=false"
      - "oc delete deployment notes -n academy-lesson-e-storage --ignore-not-found && oc delete pod ghost -n academy-lesson-e-storage --ignore-not-found --wait=false && oc delete pvc notes-data typo-data -n academy-lesson-e-storage --ignore-not-found --timeout=240s"
      - |-
        pvs=$(oc get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace == "academy-lesson-e-storage") | .metadata.name') || exit 1
        for pv in $pvs; do
          oc patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}' || exit 1
          for i in $(seq 24); do
            left=$(oc get pv "$pv" --ignore-not-found -o name) || exit 1
            test -z "$left" && break
            sleep 5
          done
          left=$(oc get pv "$pv" --ignore-not-found -o name) || exit 1
          if [ -n "$left" ]; then oc delete pv "$pv" --timeout=60s || exit 1; fi
        done
      - "oc delete project academy-lesson-e-storage --ignore-not-found --wait=false"
    settle:
      - |-
        for i in $(seq 60); do
          a=$(oc get namespace academy-x-stor-debug --ignore-not-found -o name) || exit 1
          b=$(oc get namespace academy-lesson-e-storage --ignore-not-found -o name) || exit 1
          test -z "$a$b" && exit 0
          sleep 5
        done
        exit 1
    verify:
      - cmd: |-
          pvs=$(oc get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace == "academy-lesson-e-storage") | .metadata.name') || exit 1
          test -z "$pvs"
      - cmd: |-
          found=$(oc get namespace academy-x-stor-debug --ignore-not-found -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=60s"}
- id: f0.statefulsets
  title: Stable identity with StatefulSets
  module: a4-config-storage
  mode: REAL_LAB
  minutes: 50
  level: 2
  supports: 'Kubernetes 1.34 / OpenShift 4.21 with oc 4.21.8 (persistentVolumeClaimRetentionPolicy is stable since Kubernetes 1.32). Recorded on OpenShift Local 4.21: identity, DNS, ordering, partitions and claim templates by the ordinary user developer, in a temporary project; the volumes behind the claims read and reclaimed by the cluster administrator kubeadmin. The class crc-csi-hostpath-provisioner retains every volume, so the administrator set the reclaim policy of exactly the two volumes made for the lesson to Delete, the provisioner removed them, and the cluster''s list of volumes was compared with the one taken before the lesson (experiment X-STOR-02).'
  concepts:
  - k8s.workloads
  - storage.pvc
  - net.dns
  prerequisites:
  - b.workloads
  - e.storage
  - d.services-dns
  objective: |
    Decide when an application needs a StatefulSet instead of a Deployment, and predict exactly which names, DNS
    records, claims and pods a StatefulSet creates, keeps and replaces when you scale, update or delete it.
  record_on: cluster-admin
  flow:
  - kind: ask
    id: recall-emptydir
    recalls: e.storage
    prompt: A pod mounts an `emptyDir` volume and writes a file. The pod is deleted and a replacement starts. Is the file there?
    choices:
    - text: 'No: an `emptyDir` is deleted with its pod'
      why: An `emptyDir` is created with the pod and removed when the pod goes, so a replacement starts with an empty one.
    - text: 'Yes: the replacement mounts the same volume'
      why: Only a claim on a PersistentVolume outlives a pod. An `emptyDir` belongs to one pod.
    - text: Yes, if the replacement has the same name
      why: A name does not carry data. Data follows a volume, and an `emptyDir` is not kept.
    answer: 0
  - kind: teach
    id: situation
    title: Members that are not interchangeable
    body: |
      A team wants to run a message broker with three members. They find each other by name, member 0 may initialize
      the group before others join, and each member keeps its own log on disk.

      A Deployment treats replicas as interchangeable. Its pod names change on replacement, and it does not assign
      one persistent claim to each replica. A **StatefulSet** gives each member a stable name based on an **ordinal**,
      a number starting at 0 by default: `web-0`, `web-1`, `web-2`. A replacement for `web-1` is named `web-1` again.

      The temporary recording project contains no real broker. A first StatefulSet, `web`, whose pods only wait and
      use disposable `emptyDir` storage, shows identity and ordering. A second one, `db`, adds a claim per member.
      The administrator's terminal appears at the end, for the volumes. The prompt in front of each command names who
      ran it. Typed tasks compare your commands without running them.
  - kind: show
    id: manifest
    body: 'The recording uses a headless Service and a StatefulSet with three replicas whose pods only wait:'
    code: |
      apiVersion: v1
      kind: Service
      metadata:
        name: web
        labels:
          app: web
      spec:
        clusterIP: None
        selector:
          app: web
        ports:
        - name: web
          port: 8080
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: web
      spec:
        serviceName: web
        replicas: 3
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            terminationGracePeriodSeconds: 2
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              volumeMounts:
              - name: scratch
                mountPath: /data
            volumes:
            - name: scratch
              emptyDir: {}
    caption: web.yaml in the practice directory
    notice: |
      Two objects. The Service `web` has `clusterIP: None`, which makes it **headless**: the next part explains it. The
      StatefulSet names that Service in `serviceName`. Its pods only run `sleep`, so the lesson is about identity, not
      about an application. The volume is an `emptyDir`, not a claim: claims come later, with a second StatefulSet.
  - kind: show
    id: apply
    run: oc apply -f web.yaml; oc rollout status statefulset/web --timeout=240s
    notice: 'The StatefulSet waited for pods one at a time: with three to go, then two, then one.'
  - kind: show
    id: order
    run: oc get pods -l app=web -o custom-columns=NAME:.metadata.name,STARTED:.status.startTime
    highlight:
    - web-
    notice: |
      The pods are named `web-0`, `web-1` and `web-2`, with start times a few seconds apart. Default
      `podManagementPolicy: OrderedReady` creates each higher ordinal only after its predecessors are Running and
      Ready. Here there is no readiness probe, so Ready means the waiting container started; it does not prove that
      a real broker has joined its cluster.
  - kind: ask
    id: stuck-db
    prompt: A default OrderedReady StatefulSet has `db-0` Running but not Ready; later pods do not exist and there are no
      FailedCreate events. Why?
    choices:
    - text: OrderedReady waits for `db-0` readiness
      why: Default ordered creation waits for lower ordinals to be Running and Ready. Inspect the first pod's events, readiness
        checks and logs.
    - text: A resource quota blocks new pods
      why: Quota rejection normally produces FailedCreate events. This scenario instead shows the ordered-readiness gate.
    - text: The missing Service prevents pod creation
      why: A missing governing Service breaks these DNS names, but does not by itself prevent creation of the StatefulSet
        pods.
    answer: 0
  - kind: teach
    id: headless
    title: A headless Service gives each pod a name
    body: |
      A normal Service has a virtual IP for reaching its pods. A **headless Service** uses `clusterIP: None`: DNS
      returns the selected pods' addresses directly. A StatefulSet sets each pod's hostname from its name and its
      DNS subdomain from `spec.serviceName`. With a matching headless Service, its per-pod name is:

      ```
      <pod>.<service>.<namespace>.svc.<cluster-domain>
      ```

      This cluster's domain is `cluster.local`; other clusters can configure another. Create the Service yourself;
      the StatefulSet does not create it. Pods can run without it, but these DNS records will be missing. Records
      normally require Ready pods. `publishNotReadyAddresses: true` on the Service exposes them earlier, which some
      clustered applications need to discover peers during startup. A DNS cache can briefly retain an earlier failed lookup.
  - kind: show
    id: service
    run: oc get service web
    notice: '`CLUSTER-IP` is `None`, confirming the headless Service. DNS can publish pod addresses directly. These demonstration
      containers only sleep; the listed port does not mean a web server is listening.'
  - kind: try
    id: dns-pod
    body: In the recording project, all three pods are Ready. From `web-0`, use `getent hosts` to resolve `web-2` as `<pod>.<service>`.
    accept:
    - oc exec web-0 -- getent hosts web-2.web
    - oc exec web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets
    - oc exec web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc
    - oc exec web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local
    - oc exec web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local.
    - oc exec pod/web-0 -- getent hosts web-2.web
    - oc exec pod/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets
    - oc exec pod/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc
    - oc exec pod/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local
    - oc exec pod/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local.
    - oc exec po/web-0 -- getent hosts web-2.web
    - oc exec po/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets
    - oc exec po/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc
    - oc exec po/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local
    - oc exec po/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local.
    - oc exec pods/web-0 -- getent hosts web-2.web
    - oc exec pods/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets
    - oc exec pods/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc
    - oc exec pods/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local
    - oc exec pods/web-0 -- getent hosts web-2.web.academy-lesson-f0-statefulsets.svc.cluster.local.
    hints:
    - match: ^getent
      say: 'That runs on your own machine. Run it inside the pod: `oc exec web-0 -- getent hosts …`.'
    - match: getent hosts web$
      say: '`web` is the Service name, which returns every ready pod. The per-pod name adds the ordinal in front: `web-2.web`.'
    - match: ^oc exec web-0 getent
      say: Put `--` before the command to run in the container, so that `oc` does not read its options as its own.
    - match: web-2\.web\.\S*cluster\.local
      say: 'The full name works from inside the cluster, but the short form `web-2.web` is enough: the pod''s resolver adds the project and the cluster domain.'
    hint: '`oc exec web-0 --`, then `getent hosts` and the name `<pod>.<service>`.'
    run: oc exec web-0 -- getent hosts web-2.web
    then: |
      One address, the IP of `web-2` itself, and the full name that the resolver completed: `web-2.web.<project>.svc.cluster.local`.
  - kind: show
    id: dns-service
    body: 'The Service''s own name, from the same pod:'
    run: oc exec web-0 -- getent hosts web
    notice: |
      Three addresses: the IPs of all three ready pods. A headless Service name answers with every member, and each per-pod name answers with one.
  - kind: ask
    id: which-dns
    prompt: 'A StatefulSet `db` with `serviceName: db` runs three replicas in the project `shop`. Which name reaches the second pod?'
    choices:
    - text: '`db-1.db.shop.svc.cluster.local`'
      why: Ordinals start at 0, so the second pod is `db-1`, and its record is `<pod>.<service>.<project>.svc.cluster.local`.
    - text: '`db-2.db.shop.svc.cluster.local`'
      why: 'Ordinals start at 0: `db-2` is the third pod.'
    - text: '`db.shop.svc.cluster.local`'
      why: The Service name resolves to all ready pods, not to one chosen member.
    answer: 0
  - kind: ask
    id: guess-replace
    guess: true
    prompt: The pod `web-1` is deleted and the controller creates its replacement. What does the replacement keep?
    choices:
    - text: Its name; its IP may change and scratch data is lost
      why: The ordinal preserves its name and DNS name. A replacement has a fresh emptyDir; its IP can change. The next step
        shows the addresses observed here.
    - text: Its name; its IP and scratch data are preserved too
      why: A StatefulSet preserves identity, not a pod's address or emptyDir. Only persistent storage can preserve the files
        across pod replacement.
    - text: A new name; the Service copies the old scratch data
      why: The replacement has the same ordinal and name. A Service supplies networking and does not copy data.
    answer: 0
  - kind: show
    id: replace
    body: |
      The recording writes a file in `web-1`'s `emptyDir`, notes the pod's IP, deletes the pod, waits for the replacement, and then looks at the IP, the DNS record and the file:
    run: oc exec web-1 -- sh -c 'echo i-am-web-1 > /data/id; cat /data/id'; oc get pod web-1 -o jsonpath='{.status.podIP}{"\n"}'; oc delete pod web-1; oc wait --for=condition=Ready pod/web-1 --timeout=120s; oc get pod web-1 -o jsonpath='{.status.podIP}{"\n"}'; oc exec web-0 -- getent hosts web-1.web; oc exec web-1 -- cat /data/id
    highlight:
    - No such file
    notice: |
      The first line is the file. The next is the old pod's IP. After the deletion, the replacement is `web-1` again, with
      a different IP, and `web-1.web` resolves to that new address: the DNS record followed the name. The file is gone, as
      `cat` reports at the end. The identity is stable. The pod and its `emptyDir` are not.
  - kind: teach
    id: ordering-down
    title: 'Removing members: the reverse order'
    body: |
      With default OrderedReady management, scaling down removes the highest ordinal first and waits for its
      termination before removing the next. Scaling three replicas to one therefore keeps `web-0`.

      This order describes scaling down. Deleting the StatefulSet object does not guarantee ordered pod termination.
      If ordered shutdown matters, first scale it to zero and wait, then delete it. The next recording scales down
      rather than deleting the StatefulSet.
  - kind: try
    id: scale-down
    body: Scale the StatefulSet `web` down to one replica.
    accept:
    - oc scale statefulset/web --replicas=1
    - oc scale statefulset web --replicas=1
    - oc scale sts/web --replicas=1
    - oc scale sts web --replicas=1
    - oc scale statefulset/web --replicas 1
    - oc scale statefulset web --replicas 1
    - oc scale --replicas=1 statefulset/web
    - oc scale --replicas=1 statefulset web
    - oc scale statefulsets/web --replicas=1
    - oc scale statefulsets web --replicas=1
    hints:
    - match: ^oc scale (deployment|deploy)
      say: '`web` is a StatefulSet, not a Deployment. Name its kind: `statefulset/web`.'
    - match: ^oc scale statefulset[/ ]web$
      say: 'Say how many replicas: `--replicas=1`.'
    - match: ^oc delete pod
      say: 'Deleting pods does not change the replica count: the controller recreates them. Scaling is `oc scale`.'
    hint: '`oc scale`, the kind and name `statefulset/web`, and `--replicas=1`.'
    run: oc scale statefulset/web --replicas=1; oc wait pod/web-2 pod/web-1 --for=delete --timeout=120s; oc get pods -l app=web; oc get events --field-selector involvedObject.name=web,reason=SuccessfulDelete --sort-by=.lastTimestamp
    then: |
      Only `web-0` is left. The controller's events read `delete Pod web-2` and then `delete Pod web-1`: from the top down,
      one at a time, and the lowest ordinal stays.
    understand:
      purpose: The recording scales the StatefulSet down, waits until both removed pods are gone, then lists the pod
        that is left and the controller's delete events in time order.
      parts:
        - text: oc wait pod/web-2 pod/web-1 --for=delete
          means: Waits until both objects are deleted.
        - text: --field-selector involvedObject.name=web,reason=SuccessfulDelete
          means: 'Two conditions, separated by a comma: an event is listed only if it matches both.'
        - text: --sort-by=.lastTimestamp
          means: Sorts the list by that field, oldest first, so the order of the deletions shows.
      concepts:
        - k8s.workloads
        - obs.signals
      refs:
        - title: 'Kubernetes: Field selectors (chained selectors)'
          url: https://kubernetes.io/docs/concepts/overview/working-with-objects/field-selectors/
        - title: kubectl get (--sort-by)
          url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_get/
  - kind: teach
    id: updates
    title: Updates, and a canary with a partition
    body: |
      When the pod template changes, the **update strategy** decides what happens. `RollingUpdate`, the default,
      replaces pods one at a time from the highest ordinal down, waiting for each new pod to be Ready first. A
      **partition** limits the update to ordinals greater than or equal to it: with three replicas and `partition: 2`,
      only `web-2` gets the new template, as a **canary**: a first small step that you check before the rest. Lowering the
      partition continues the rollout. `OnDelete` never
      replaces a pod by itself: each pod gets the new template when someone deletes it.
  - kind: ask
    id: guess-partition
    guess: true
    prompt: 'A StatefulSet with three replicas uses `RollingUpdate` with `partition: 2`. You change an environment variable in its template. Which pods are updated?'
    choices:
    - text: Only `web-2`
      why: Only ordinals greater than or equal to the partition get the new template. With partition 2 and three replicas, that is `web-2` alone. The next step shows it.
    - text: '`web-0` and `web-1`'
      why: The partition holds back the ordinals below it, so `web-0` and `web-1` keep the old template. The next step shows it.
    - text: All three, starting with `web-2`
      why: That is the behaviour with partition 0, the default. Here the lower ordinals are held back. The next step shows it.
    answer: 0
  - kind: show
    id: partition
    body: |
      The recording scales back to three, sets the partition with `oc patch`, changes the template with `oc set env`, and shows the revision of each pod:
    run: oc scale statefulset/web --replicas=3; oc rollout status statefulset/web --timeout=240s | tail -n 1; oc patch statefulset web -p '{"spec":{"updateStrategy":{"type":"RollingUpdate","rollingUpdate":{"partition":2}}}}'; oc set env statefulset/web COLOR=blue; sleep 20; oc rollout status statefulset/web --timeout=120s; oc get pods -l app=web -L controller-revision-hash
    highlight:
    - web-2
    - partitioned
    notice: |
      `web-0` and `web-1` carry one revision hash, and `web-2` another: only the pod at or above the partition was replaced.
      The status line says that one pod has been updated. To continue, you lower the partition, down to 0 for the rest.
  - kind: teach
    id: claims
    title: One claim per ordinal
    body: |
      Identity and storage are separate guarantees. For storage that follows the ordinal, a StatefulSet has
      `volumeClaimTemplates`. For each ordinal the controller creates one claim, named `<template>-<pod>`: a template
      called `data` in a StatefulSet `db` gives `data-db-0`, `data-db-1`. A replacement `db-1` mounts `data-db-1`
      again.

      `db.yaml` is a second, smaller StatefulSet, `db`, with two replicas, its own headless Service, and the claim
      template below instead of an `emptyDir`. Each claim asks for 100Mi from the default class, which on this
      cluster retains its volumes, so the administrator will have work at the end.
  - kind: show
    id: template
    code: |
      spec:
        serviceName: db
        replicas: 2
        template:
          spec:
            containers:
            - name: app
              volumeMounts:
              - name: data
                mountPath: /data
        volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 100Mi
    caption: The part of db.yaml that differs from web.yaml (the image, command, labels and selector are the same, with db for web)
    notice: |
      The template is a claim without a name of its own: the controller names each copy after the template and the
      pod. The container mounts it by the template's name, `data`.
  - kind: show
    id: db-apply
    run: oc apply -f db.yaml; oc rollout status statefulset/db --timeout=240s; oc get pvc
    highlight:
    - data-db-
    notice: |
      Two claims, `data-db-0` and `data-db-1`, both `Bound`, each to its own volume. Nobody wrote a claim by hand:
      the controller created one for each ordinal before starting its pod.
  - kind: ask
    id: third-member
    prompt: '`db` is scaled to three replicas. Which claim does the new pod `db-2` mount?'
    choices:
    - text: A new claim, `data-db-2`
      why: The controller creates one claim per ordinal from the template, named `<template>-<pod>`, before it starts the pod.
    - text: '`data-db-0`, shared with the first member'
      why: A claim template never shares a claim between members. Each ordinal gets its own.
    - text: No claim, because templates apply only at creation
      why: The template is used whenever a new ordinal appears, at creation and when scaling up.
    answer: 0
  - kind: show
    id: db-replace
    body: 'Each member writes its name on its own volume. Then `db-1` is deleted, as `web-1` was, and its replacement reads the file:'
    run: oc exec db-0 -- sh -c 'echo i-am-db-0 > /data/id'; oc exec db-1 -- sh -c 'echo i-am-db-1 > /data/id'; oc delete pod db-1; oc wait --for=condition=Ready pod/db-1 --timeout=120s; oc exec db-1 -- cat /data/id
    notice: |
      `i-am-db-1`: the new `db-1` mounted `data-db-1` again and found its file. With `emptyDir`, `web-1` lost it.
  - kind: ask
    id: retained-claim
    guess: true
    prompt: With the default retention, `db` scales from 2 to 1 and back to 2. What does the new `db-1` find in `/data`?
    choices:
    - text: Its old file, from its retained claim
      why: Default retention keeps `data-db-1` when scaling down, and a later `db-1` mounts it again. The next step shows it.
    - text: Nothing, because scaling down deleted the claim
      why: 'Deleting claims on scale-down needs `whenScaled: Delete`. The default is Retain. The next step shows the claims.'
    - text: The file of `db-0`, because the members share storage
      why: A claim template creates a separate claim for each ordinal, never one shared claim. The next step shows it.
    answer: 0
  - kind: show
    id: db-scale
    run: oc scale statefulset/db --replicas=1; oc wait pod/db-1 --for=delete --timeout=120s; oc get pvc; oc scale statefulset/db --replicas=2; oc rollout status statefulset/db --timeout=180s; oc exec db-1 -- cat /data/id
    notice: |
      With one replica, both claims are still there and still `Bound`: the pod went, its claim stayed. Back at two
      replicas, `db-1` reads `i-am-db-1` again. That protects data from a mistaken scale-down, and it also means that a
      member can come back with stale data, which a real clustered application must handle.
  - kind: show
    id: db-pvs
    body: |
      In the administrator's terminal: the volumes behind the two claims, read from the recording's temporary
      project, `academy-lesson-f0-statefulsets` (on your own cluster, the project where `db` runs). The
      administrator writes their names into `pvs.txt`, so that every later command names exactly these two volumes
      and no other:
    run: oc get pvc -n academy-lesson-f0-statefulsets -o jsonpath='{range .items[*]}{.spec.volumeName}{"\n"}{end}' > pvs.txt; oc get pv $(cat pvs.txt) -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,RECLAIM:.spec.persistentVolumeReclaimPolicy,CLAIM:.spec.claimRef.name
    notice: |
      Two PVs, `Bound` to `data-db-0` and `data-db-1`, both with the reclaim policy `Retain` that they inherited from
      the class.
  - kind: teach
    id: two-retains
    title: Two different "retain" settings
    body: |
      Two settings decide what survives, at two levels:

      - The StatefulSet's `persistentVolumeClaimRetentionPolicy` decides what happens to the **claims**:
        `whenScaled` when replicas decrease, `whenDeleted` when the StatefulSet is deleted. Both default to `Retain`;
        `Delete` makes the controller delete the claims after their pods.
      - The PV's reclaim policy decides what happens to the **volume** once its claim is deleted. On this cluster it
        is `Retain`.

      The first is the application team's choice. The second belongs to the platform. The next step sets both
      StatefulSet fields to `Delete` and scales down again.
  - kind: show
    id: db-when-scaled
    run: oc patch statefulset db -p '{"spec":{"persistentVolumeClaimRetentionPolicy":{"whenScaled":"Delete","whenDeleted":"Delete"}}}'; oc scale statefulset/db --replicas=1; oc wait pod/db-1 --for=delete --timeout=120s; oc wait pvc/data-db-1 --for=delete --timeout=120s; oc get pvc
    notice: |
      This time the controller deleted `data-db-1` after its pod; it was already gone when `oc wait` looked, so the
      wait printed nothing. Only `data-db-0` is left.
  - kind: ask
    id: guess-pv-after-claim
    guess: true
    prompt: The claim `data-db-1` was deleted by the StatefulSet. What does the administrator now see for its volume?
    choices:
    - text: The PV, Released, with the data
      why: The claim policy deleted the claim. The volume follows its own reclaim policy, Retain on this cluster. The next step shows it.
    - text: Nothing, the volume went with the claim
      why: That would need the PV's reclaim policy to be Delete. `whenScaled` only acts on claims. The next step shows the PV.
    - text: The PV, Available for the next claim
      why: A volume whose claim was deleted keeps the claim's reference and is never handed out again by itself. The next step shows it.
    answer: 0
  - kind: show
    id: db-released
    run: oc get pv $(cat pvs.txt) -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,RECLAIM:.spec.persistentVolumeReclaimPolicy,CLAIM:.spec.claimRef.name
    highlight:
    - Released
    notice: |
      The volume of `data-db-1` is `Released`: its claim is gone, the volume and its data are not. The volume of
      `data-db-0` is still `Bound`.
  - kind: show
    id: db-delete
    body: 'As `developer`, delete the StatefulSet. With `whenDeleted: Delete`, its remaining claim goes too:'
    run: oc delete statefulset db; oc wait pvc/data-db-0 --for=delete --timeout=120s; oc get pvc
    notice: '`No resources found`: the project has no claim left, and nobody deleted one by hand.'
  - kind: show
    id: db-reclaim
    body: |
      In the administrator's terminal, both volumes are now Released. Their data is not needed, so the administrator
      reclaims them by name, from `pvs.txt`: reclaim policy `Delete` on each, then wait until the provisioner has
      deleted the storage and the PV, as in [the storage lesson](/lesson/e.storage):
    run: oc get pv $(cat pvs.txt) -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,CLAIM:.spec.claimRef.name; for pv in $(cat pvs.txt); do oc patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'; done; for pv in $(cat pvs.txt); do oc wait --for=delete pv/"$pv" --timeout=120s; done; echo "volumes of pvs.txt left=$(oc get pv -o name | grep -c -F -f pvs.txt)"
    notice: |
      Both `Released`, both patched. The provisioner deleted them so fast that the two `oc wait --for=delete` found
      nothing left and printed nothing, and the last line counts the volumes of `pvs.txt` that remain: `0`. Nothing
      was selected by pattern: each command named one of the two volumes recorded while their claims still existed.
  - kind: teach
    id: choosing
    title: Choosing the workload
    body: |
      A StatefulSet provides stable identity and controlled pod replacement. With claim templates it also assigns
      persistent storage per member. It does not implement application replication, leader election or failover.
      An **operator** is an application-specific controller that can automate such tasks.

      - Use a Deployment for interchangeable replicas, including apps storing state in an external database.
      - Use a StatefulSet for members needing stable names, ordered startup or separate persistent claims.
      - For a production database or broker, consider its supported operator for application-specific lifecycle tasks.

      The demonstrations showed identity and update ordering with `emptyDir`, and per-member claims with `db`. They did
      not demonstrate data replication between members: each one only kept its own file.
  - kind: reflect
    id: explain-broker
    prompt: A colleague wants to run a three-member message broker with a Deployment and one shared volume. Explain what a StatefulSet would give them, what it would not, and what you would recommend.
    model: |
      A StatefulSet can give broker members stable names, per-pod DNS through a headless Service, and separate claims
      when volumeClaimTemplates is configured. Default scaling creates them in order and removes them in reverse;
      scale to zero first if ordered shutdown is needed before deletion. A Deployment does not assign persistent
      identity or per-replica claims. Neither controller implements the broker's replication or failover. I would
      check the broker's supported deployment method and operator, and arrange storage and backups separately.
  - kind: teach
    id: what-next
    title: What you can do now
    body: |
      You can decide when an application needs a StatefulSet instead of a Deployment, read the names and DNS records it
      creates, predict which pods are created, removed and updated and in what order, and say what happens to claims
      and to their volumes when you scale or delete it, and who cleans up which.

      The [stable identities lab](/lab/lab.statefulset-identity) lets you repeat these steps yourself. The next lesson,
      [Why is my application not working?](/lesson/o1.troubleshooting), gives a method for finding out why a workload like this fails.
  sections:
  - id: retention
    title: Claim retention, templates and what a claim holds
    depth: true
    body: |
      `spec.persistentVolumeClaimRetentionPolicy` (stable since Kubernetes 1.32) changes what happens to the claims:

      | Field | Applies when | `Retain` (default) | `Delete` |
      |---|---|---|---|
      | `whenDeleted` | the StatefulSet is deleted | claims stay | claims are deleted after their pods |
      | `whenScaled` | replicas decrease | the removed ordinals' claims stay | those claims are deleted |

      The policy applies only to deletion and scale-down. A pod replaced for any other reason (deleted by hand, evicted,
      lost with its node) reuses its existing claim. Whether its storage is available on another node depends on the backend.

      Deleting a claim deletes the data only if the bound PersistentVolume's reclaim policy is `Delete`, which is the
      usual default for dynamically provisioned volumes. The `volumeClaimTemplates` of an existing StatefulSet cannot be
      changed (the API rejects the edit): to grow a disk, expand each claim (if its StorageClass allows expansion)
      instead.

      On the course cluster, the only storage class, `crc-csi-hostpath-provisioner`, has `RECLAIMPOLICY Retain`: every
      volume made for a claim outlives the claim, `Released`, until an administrator reclaims it, as at the end of this
      lesson.
  - id: labels-ordering
    title: Pod labels and ordering policies
    depth: true
    body: |
      Each pod carries the label `statefulset.kubernetes.io/pod-name`, so a separate Service can select exactly one
      member, for example the one that receives writes. A second label, `apps.kubernetes.io/pod-index` (stable since
      Kubernetes 1.32), holds just the ordinal.

      With the default `podManagementPolicy: OrderedReady`, pods are created in order and removed in reverse order, each
      one fully terminated before the next. One pod that never becomes ready therefore blocks all scaling behind it.
      `Parallel` creates and deletes pods without waiting; it changes **only scaling**, not updates.

      Watch progress with `oc rollout status statefulset/web`. If an updated pod never becomes ready, the rollout stops
      there. Reverting the template is not enough: delete the pod that is stuck on the bad version so the controller can
      recreate it from the reverted template. A pod below the partition that is deleted comes back with the *old*
      template.
  - id: choosing-settings
    title: Choosing the settings
    depth: true
    body: |
      | Your software… | Choose | Why |
      |---|---|---|
      | is stateless, or keeps state in an external database | Deployment | interchangeable pods, faster rollouts with surge |
      | has members that need stable names, ordered start, or a disk each | StatefulSet | ordinals, per-pod DNS, one claim per ordinal |
      | is a database or broker with replication, failover and backups | the vendor's operator (which usually creates StatefulSets) | it knows the application's own clustering, which a StatefulSet does not |

      | Setting | Use `OrderedReady` / `RollingUpdate` when | Use the alternative when |
      |---|---|---|
      | `podManagementPolicy` | members must join one at a time (the default) | members are independent and start-up time matters: `Parallel` |
      | `updateStrategy` | pods may be replaced automatically from the top ordinal down (with `partition` for a canary) | an operator or a person must choose when each member restarts: `OnDelete` |
  - id: what-goes-wrong
    title: What goes wrong, and how to see it
    depth: true
    body: |
      | Symptom | Evidence | Cause | Fix |
      |---|---|---|---|
      | the StatefulSet stops at `db-1`, no `db-2` | `oc get pods`: `db-1` not Ready | `OrderedReady` waits for each predecessor | fix `db-1` (its events and logs) first |
      | per-pod names do not resolve | `oc get svc`: no headless Service, or a name different from `spec.serviceName`; the pod not Ready | missing or mismatched governing Service, or a not-ready pod without `publishNotReadyAddresses` | create the headless Service with that exact name |
      | a pod is `Pending` and its claim too | `oc get pvc`; the claim's events | no storage class, no capacity, or a zone problem | fix the claim or the storage class; see [PVC Pending, pod Pending](/lab/inc.pvc-pending) |
      | the update stopped and reverting changed nothing | `oc rollout status` waits; one pod is on the bad template | forced rollback: the stuck pod is never replaced automatically | revert the template, then delete the stuck pod |
      | a scaled-up member serves old data | the claim's age is older than the pod | claims are retained on scale-down | wipe or resync it before it joins, or use `whenScaled: Delete` |
      | a replacement pod never starts after a node failure | the old pod is stuck `Terminating` on the lost node | the controller will not run two pods with the same identity | restore or remove the node; force-delete only when you are sure the old pod is gone |
  - id: common-mistakes
    title: Common mistakes
    depth: true
    body: |
      - **Expecting shared storage.** Claim templates create a separate claim per replica. StatefulSets can also mount
        an explicitly shared PVC, but do not create shared data or replication themselves; the backend and application must support sharing.
      - **Deleting claims to "clean up".** `data-web-0` *is* the data of `web-0`. Check the retention policy and the
        volume's reclaim policy before deleting anything.
      - **Assuming a StatefulSet makes the application clustered.** It provides names and ordering, with separate claims when templates are configured. Replication,
        leader election and failover are the application's job, or an operator's; for a database, an operator is usually
        the better choice.
      - **Forgetting the headless Service**, or sending writes through a normal Service that spreads them over every
        member.
      - **Force-deleting a pod on a node that stopped responding.** The controller waits for the old pod to be confirmed
        gone so that two `web-0` never run at once. Forcing it removes that guarantee.
      - **Keeping durable data in an `emptyDir`.** It belongs to one pod and disappears with it, even in a StatefulSet.
  review:
  - q: What PVC does a StatefulSet 'web' create for pod web-1 from a template named 'data'?
    a: data-web-1.
  - q: What does a replacement StatefulSet pod keep, and what does it not keep?
    a: Its name and DNS name, and its existing claim if configured. Its IP may change, and emptyDir is recreated. DNS publication still depends on the Service and readiness.
  - q: What happens to a StatefulSet's claims when you delete it, by default?
    a: 'They are kept (whenDeleted: Retain). You delete them yourself, or set whenDeleted: Delete.'
  - q: In which order does a StatefulSet create, and remove, its pods by default?
    a: 'Create: web-0, then web-1 once web-0 is Ready, and so on. Remove: from the highest ordinal down, one at a time.'
  - q: 'What does podManagementPolicy: Parallel change?'
    a: 'Only scaling: pods are created and deleted without waiting for each other. Updates still go one at a time in reverse ordinal order.'
  - q: With partition 2 and three replicas, which pods get a new template?
    a: 'Only web-2: ordinals greater than or equal to the partition.'
  - q: A rolling update is stuck on a pod that never becomes ready. You revert the template. What else is needed?
    a: Delete the stuck pod so it is recreated from the reverted template.
  - q: 'A StatefulSet has whenScaled: Delete and the class has reclaimPolicy Retain. After a scale-down, what is left of the removed member''s storage?'
    a: Its claim is deleted by the controller; its PersistentVolume stays Released, with the data, until an administrator reclaims it.
  - q: What must you create yourself so that each StatefulSet pod gets its own DNS name?
    a: 'A headless Service (clusterIP: None) whose name matches the StatefulSet''s spec.serviceName.'
  labs:
  - lab.statefulset-identity
  limits: OpenShift Local has one node, so StatefulSet pods are never moved to another node and the claims' volumes are directories on that node; a replacement after a node failure is explained, not shown. The pods only sleep, so no application replication is shown. The Released volumes were reclaimed by setting their policy to Delete; other ways of reclaiming are in the storage lesson.
