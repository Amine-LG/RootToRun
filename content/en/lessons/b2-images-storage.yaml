# Lessons of this file, in the order of content/en/modules.yaml. Format: docs/AUTHORING.md.
- id: ct.openshift-images
  title: Images on the platform
  subtitle: The integrated registry, ImageStreams, imports, triggers, pull secrets and cluster image policy
  module: a6-images-updates
  mode: GUIDED_INVESTIGATION
  minutes: 45
  level: 2
  supports: OpenShift 4.21 (image.openshift.io/v1, config.openshift.io/v1) with oc 4.21.8. ImageStreams, tags, triggers and pull secrets recorded on OpenShift Local 4.21 by the ordinary user developer, in a temporary project, with public images from registry.access.redhat.com; digests change when images are rebuilt. The oc image commands read registries and need no cluster. The cluster-wide image configuration and mirror sets were read by the cluster administrator kubeadmin and not changed; changing them is shown as documented examples.
  concepts:
  - ocp.imagestreams
  - container.registries
  prerequisites:
  - ct.registries-skopeo
  - k.kubectl-to-oc
  objective: |
    Explain what ImageStreams add to a plain registry, import an image and say which digest the tag records,
    choose between frozen and scheduled tags, tell what a reference policy means for the nodes, make a Deployment
    use a stream and follow a tag with local lookup and an image trigger, give a project access to a private
    registry, use `oc image` to inspect, mirror and extract images, and say which cluster-wide image settings an
    administrator controls.
  record_on: cluster-admin
  flow:
  - kind: ask
    id: recall-index
    recalls: ct.registries-skopeo
    prompt: A multi-architecture tag points to an index. What does the index list?
    choices:
    - text: One manifest for each architecture, each with a digest
      why: The index is a small document that lists one manifest, with its own digest, for each platform. This lesson meets both kinds of digest again.
    - text: One tag for each architecture, such as `latest-arm64`
      why: Tags belong to the registry's tag list. The index is a document that one tag points to, and it lists images by digest, not by tag.
    - text: The layers that every architecture has in common
      why: Layers are listed inside each manifest. The index lists only manifests, one per platform.
    answer: 0
  - kind: teach
    id: situation
    title: One base image, twelve applications
    body: |
      On Friday a security fix lands in the base image that your team builds on. Twelve applications use it. You need
      to know which exact image each application runs, whether the fixed image has arrived, and how every application
      picks it up without anyone editing twelve Deployments.

      A plain Kubernetes Deployment can name an image by tag or by digest. A tag may move, and the node's pull policy
      decides when it checks the registry. OpenShift adds an ImageStream, a project object that tracks image references,
      and triggers that can turn an approved image change into a rollout. This lesson follows that chain.

      The recordings use a temporary project. Typed tasks only compare your command; they do not execute it. Unless a
      task says otherwise, use that same project and the objects already created there.
  - kind: show
    id: info-fails
    body: |
      First, what an image is. `oc image info` reads an image's metadata from a registry. It does not use your cluster
      login, so it works on any machine that can reach the registry. Ask for the image behind the tag that
      [Inside a registry](/lesson/ct.registries-skopeo) inspected with Skopeo. Expect it to refuse (exit status 1):
      the tag names a manifest list, and the refusal is informative:
    run: oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest
    notice: |
      The error says the image is a manifest list and lists its platforms and digests. This invocation needs one
      platform. The option `--filter-by-os=<os>/<architecture>` selects it; `linux/amd64` means Linux on 64-bit Intel
      or AMD machines.
  - kind: try
    id: info-amd64
    body: Ask for the image of the same tag for 64-bit Intel and AMD machines, `linux/amd64`.
    accept:
    - oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest --filter-by-os=linux/amd64
    - oc image info --filter-by-os=linux/amd64 registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest --filter-by-os linux/amd64
    - oc image info --filter-by-os linux/amd64 registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image info registry.access.redhat.com/ubi9/ubi-minimal --filter-by-os=linux/amd64
    - oc image info --filter-by-os=linux/amd64 registry.access.redhat.com/ubi9/ubi-minimal
    - oc image info registry.access.redhat.com/ubi9/ubi-minimal --filter-by-os linux/amd64
    - oc image info --filter-by-os linux/amd64 registry.access.redhat.com/ubi9/ubi-minimal
    hints:
    - match: ^oc image info \S+$
      say: 'That is the command that was refused: the tag lists several platforms. The option `--filter-by-os` picks one.'
    - match: filter-by-os[= ]+(amd64|x86_64)
      say: 'The platform is written as operating system and architecture, separated by a slash: `linux/amd64`.'
    - match: ^skopeo
      say: Skopeo reads the same registry, but this task uses `oc image info`, which can pick one platform.
    hint: '`oc image info`, the image, and `--filter-by-os=` with the platform.'
    run: oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest --filter-by-os=linux/amd64 | head -9
    then: |
      Two digests. `Digest` is the manifest of the amd64 image. `Manifest List` is the index that the tag points to.
      Keep the first one in mind: it is the identity of the image you would run on an amd64 node.
  - kind: teach
    id: imagestream
    title: An ImageStream is a pointer
    body: |
      Image layers live in a registry. An **ImageStream** tracks images by name inside your project. It lists tags
      and a history of the images each tag has referenced, newest first, by digest. It holds references, not layers.
      An **ImageStreamTag**, written `stream:tag` and shortened to `istag`, resolves to the tag's current digest.

      `oc import-image` reads registry metadata and records it in a stream. `--confirm` allows it to create the stream
      or change a tag's source.

      For a multi-architecture tag, **Legacy** import mode keeps one platform's manifest. **PreserveOriginal** keeps
      the index and its platform manifests. The recorded cluster defaults to Legacy and selects amd64; other clusters
      can default to PreserveOriginal. The next question uses this recording's Legacy mode.
  - kind: ask
    id: guess-digest
    guess: true
    prompt: In this amd64 cluster, Legacy import mode reads the multi-architecture tag. Which digest will the ImageStream
      tag record?
    choices:
    - text: The amd64 manifest digest
      why: Legacy selects one platform, amd64 on this cluster. The next step shows its manifest digest.
    - text: The multi-architecture index digest
      why: PreserveOriginal keeps the index. Legacy selects one platform from it; the next step shows which digest was recorded.
    - text: A newly computed OpenShift digest
      why: Import records existing registry metadata. It does not rebuild the image or generate new content.
    answer: 0
  - kind: show
    id: import
    run: oc import-image ubi:latest --from=registry.access.redhat.com/ubi9/ubi-minimal:latest --confirm | head -n 17
    highlight:
    - ubi-minimal@sha256
    notice: |
      The stream `ubi` exists, and its tag `latest` was imported from the registry. The line that starts with `*` is
      the image the tag points to now. Its digest is the `Digest` of `oc image info`: the amd64 manifest, not the
      index. Only metadata was imported. No layer moved.
  - kind: teach
    id: frozen
    title: Frozen tags and scheduled imports
    body: |
      A tag imported once keeps the digest it found until another import, build or tag operation changes it. Moving
      the source registry tag alone does not update this project's tag.

      A **scheduled import** checks the external tag periodically, every 15 minutes by default, subject to the cluster's
      settings. If the digest changed, the stream records a new history entry. This discovers updates; a build or image
      trigger must still act on them. It is not a guarantee that an upstream fix will arrive within a fixed time.
  - kind: show
    id: scheduled
    run: oc tag registry.access.redhat.com/ubi9/ubi-minimal:latest watched:latest --scheduled; sleep 5; oc get imagestream watched -o jsonpath='{.spec.tags[0].importPolicy}{"\n"}'
    notice: |
      `oc tag` created the stream `watched` and said it would import the tag periodically. The tag's import policy has
      `scheduled` set to true. The other field, `importMode: Legacy`, is the default on this cluster: it keeps one
      image from a multi-architecture tag. A cluster built from a multi-architecture payload defaults to
      `PreserveOriginal`, which keeps the whole index.
  - kind: try
    id: import-older
    body: 'Add a second tag to the stream `ubi`: import `registry.access.redhat.com/ubi9/ubi-minimal:9.5`, an older release, as `ubi:9.5`.'
    accept:
    - oc import-image ubi:9.5 --from=registry.access.redhat.com/ubi9/ubi-minimal:9.5 --confirm
    - oc import-image ubi:9.5 --confirm --from=registry.access.redhat.com/ubi9/ubi-minimal:9.5
    - oc import-image ubi:9.5 --from registry.access.redhat.com/ubi9/ubi-minimal:9.5 --confirm
    - oc import-image ubi:9.5 --confirm --from registry.access.redhat.com/ubi9/ubi-minimal:9.5
    - oc import-image ubi:9.5 --from=registry.access.redhat.com/ubi9/ubi-minimal:9.5 --confirm=true
    - oc tag registry.access.redhat.com/ubi9/ubi-minimal:9.5 ubi:9.5
    hints:
    - match: ^oc import-image ubi:9\.5 --confirm$
      say: 'The command needs to know where to import from: `--from=` and the image.'
    - match: ^oc import-image ubi:9\.5 --from=\S+$
      say: Without `--confirm`, `oc import-image` does not create or change the tag's source.
    - match: ^oc import-image ubi:latest
      say: That is the tag the stream already has. The task is a second tag, `ubi:9.5`, from the `9.5` release.
    - match: --from=ubi
      say: '`--from` names the source registry image, `registry.access.redhat.com/ubi9/ubi-minimal:9.5`, not a tag of the stream.'
    hint: '`oc import-image ubi:9.5`, then `--from=` with the full image and `--confirm`.'
    run: oc import-image ubi:9.5 --from=registry.access.redhat.com/ubi9/ubi-minimal:9.5 --confirm | head -n 1; oc get istag ubi:9.5
    then: |
      The stream has a second tag, and its digest differs from the one of `latest`: this is an older release of the
      image. `oc tag` would have created the tag as well, without the report that `oc import-image` prints.
  - kind: teach
    id: reference-policy
    title: 'Reference policy: who pulls from where'
    body: |
      OpenShift can run an **integrated registry**, managed by the Image Registry Operator, the controller responsible
      for that service. Inside this cluster it answers at `image-registry.openshift-image-registry.svc:5000`.
      Repositories belong to projects. Builds push images there and pods can pull them.

      When OpenShift resolves an istag for a workload, its **reference policy** chooses the registry in the resulting
      reference. With `Source`, the default, it names the original registry: a node that needs to pull requires access
      to that source. With `Local`, it names the integrated registry, which can fetch and cache layers from the source
      on demand. Local requires an available integrated registry and source access from that registry. Importing alone
      has not copied the image for offline use. Either reference ends in a digest.
  - kind: show
    id: policy-show
    run: oc import-image ubi:latest-local --from=registry.access.redhat.com/ubi9/ubi-minimal:latest --reference-policy=local --confirm >/dev/null; oc get istag
    notice: |
      One image, two references. Compare `ubi:latest` and `ubi:latest-local`: they end in the same digest. `ubi:latest`
      uses `Source` and names `registry.access.redhat.com`. `ubi:latest-local` uses `Local` and names the integrated
      registry, although the image was never pushed there: the registry reads it from the source when something
      first pulls it.
  - kind: ask
    id: which-registry
    prompt: An istag uses Source policy and the node must pull it. With no mirror configured, which registry serves the image?
    choices:
    - text: '`registry.access.redhat.com`, by digest'
      why: Source supplies the original registry reference and digest. The node pulls there when it needs the image.
    - text: The integrated registry, using the stream name
      why: An ImageStream stores metadata. Local policy would supply an integrated-registry reference instead.
    - text: The integrated registry first, then the source
      why: Source does not configure a chain of registries. Cluster mirror settings are a separate mechanism, introduced
        below.
    answer: 0
  - kind: teach
    id: kube-does-not-know
    title: Kubernetes does not know ImageStreams
    body: |
      ImageStreams belong to OpenShift. Without OpenShift image lookup or a trigger, a Deployment that says
      `image: ubi:approved` passes that text to the node as an ordinary short image name.

      Create an approval tag from the older release already imported: `oc tag ubi:9.5 ubi:approved` copies the digest
      that `ubi:9.5` names now. It does not make `approved` follow future changes to `9.5`; that would require an alias.
      The team can move `approved` deliberately after testing. The next command creates Deployment `web` using that
      short name, before enabling lookup.
  - kind: show
    id: short-name-fails
    run: oc tag ubi:9.5 ubi:approved; oc create deployment web --image=ubi:approved -- sleep infinity; sleep 15; oc get pods; oc describe pod -l app=web | grep -m1 'Failed to pull image'
    highlight:
    - docker.io
    notice: |
      The pod cannot pull its image. The event shows what the node did: it read `ubi:approved` as a plain short name
      and asked a public registry, `docker.io/library/ubi`, for it. The stream was never consulted.
  - kind: teach
    id: lookup
    title: Resolving short names with image lookup
    body: |
      **Image lookup** resolves a short image name to an ImageStream tag in the same project. You can enable it in
      either of two places:

      - On a stream: `oc set image-lookup ubi` sets `spec.lookupPolicy.local: true`, allowing workloads to resolve its tags.
      - On one workload: `oc set image-lookup deployment/web` adds the annotation
        `alpha.image.policy.openshift.io/resolve-names: '*'`, enabling lookup for that workload.

      Both switches are not required. The recording sets the stream policy, then updates the existing Deployment's
      annotation. That update gives OpenShift a chance to resolve the name still in its pod template. Changing the
      stream policy alone does not rewrite an existing Deployment.
  - kind: show
    id: lookup-show
    run: oc set image-lookup ubi; oc set image-lookup deployment/web; sleep 15; oc get pods; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
    notice: |
      The pod runs. Look at what the Deployment holds now: not `ubi:approved` but a full reference that ends in a
      digest. OpenShift replaced the name in the pod template when the Deployment was updated.
  - kind: ask
    id: guess-lookup-follows
    guess: true
    prompt: 'The team approves the newer image: `ubi:approved` now points at `ubi:latest`. What does the Deployment `web` do?'
    choices:
    - text: 'Nothing: it keeps the digest it was given'
      why: Lookup replaced the name once, when the Deployment changed. Nothing watches the tag afterwards. The next step shows it.
    - text: It rolls out the newer image
      why: That needs something that watches the tag, and lookup does not. The next step shows what the Deployment holds.
    - text: It fails, because its name no longer matches
      why: The Deployment holds a reference, not the name `ubi:approved`, so changing the tag cannot break it. The next step shows it.
    answer: 0
  - kind: show
    id: tag-moves
    run: oc tag ubi:latest ubi:approved; sleep 5; oc get istag ubi:approved -o jsonpath='{.image.dockerImageReference}{"\n"}'; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
    notice: |
      The first two lines say that the tag moved to the newer digest. The last line is the Deployment's image, and it
      is still the older one. Lookup resolves a name once. To make a workload follow a tag, you need a trigger.
  - kind: teach
    id: triggers
    title: Image triggers
    body: |
      An **image trigger** is an annotation on the Deployment, `image.openshift.io/triggers`. It names an istag and a
      container. A controller watches that istag, and whenever it points at a new digest, writes the new reference
      into the container's `image` field. That changes the pod template, so a normal rollout follows.

      `oc set triggers deployment/web --from-image=ubi:approved -c ubi` adds one: `-c` names the container, which
      `oc create deployment` called `ubi` after the image.
  - kind: show
    id: trigger-show
    run: oc set triggers deployment/web --from-image=ubi:approved -c ubi; sleep 10; oc rollout status deployment/web --timeout=180s | tail -n 1; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'; oc get deployment web -o jsonpath='{.metadata.annotations.image\.openshift\.io/triggers}{"\n"}'
    notice: |
      The Deployment now holds the newer digest, the one `ubi:approved` points at, and a rollout replaced the pod. The
      annotation names the tag it follows, `ubi:approved`, and the field it writes, the image of the container
      `ubi`.
  - kind: try
    id: move-back
    body: The newer image misbehaves. Without editing the Deployment, make `web` go back to the older release it ran before, in one command.
    accept:
    - oc tag ubi:9.5 ubi:approved
    - oc tag --source=imagestreamtag ubi:9.5 ubi:approved
    - oc tag --source=istag ubi:9.5 ubi:approved
    hints:
    - match: ^oc tag ubi:approved ubi:9\.5
      say: 'Name the source first, then the tag to move: `oc tag <source> <destination>`.'
    - match: ^oc (import-image|import)
      say: The tested image is already imported. Use `oc tag` to copy its current digest to the approval tag.
    - match: ^oc rollout
      say: An active image trigger follows the approval tag. Move that tag back so the trigger and Deployment agree.
    - match: ^oc (set image|edit|patch)
      say: The trigger writes the image that `ubi:approved` names, so an edit to the Deployment would be replaced. Move the tag the trigger follows.
    - match: ^oc tag ubi:latest
      say: '`ubi:latest` is the newer release that misbehaves. The older one was imported as `ubi:9.5`.'
    hint: '`oc tag`, then the tag of the older release, then the tag the trigger follows.'
    run: oc tag ubi:9.5 ubi:approved; sleep 10; oc rollout status deployment/web --timeout=180s | tail -n 1; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
    then: |
      The Deployment went back to the older digest through an ordinary rollout. Promoting an image and withdrawing it
      are the same operation: moving a tag.
  - kind: teach
    id: pull-secrets
    title: Pull secrets for a private registry
    body: |
      A private registry requires credentials. A **ServiceAccount** is the identity a pod runs as. New pods that do not
      specify their own `imagePullSecrets` inherit that list from their ServiceAccount. OpenShift nodes can also use
      the cluster-wide pull secret, managed by administrators in `openshift-config`.

      For one project, create a Secret of type `kubernetes.io/dockerconfigjson` using `oc create secret docker-registry`,
      then **link** it for pulling: `oc secrets link <serviceaccount> <secret> --for=pull`. The ServiceAccount and Secret
      must be in the pod's project. Existing pods keep their original lists; recreate them to inherit a new link.
      Use a repository-scoped automation account for real pulls. Avoid putting real passwords in shell history or
      lesson text; an existing registry auth file can supply the Secret instead.

      For this cluster's integrated registry, OpenShift provisions each ServiceAccount's pull credentials. Project roles
      determine which image repositories that identity may access.
  - kind: show
    id: create-secret
    body: |
      The recording creates `registry-demo` for `registry.example.com` with deliberately fictitious credentials.
      It demonstrates the Secret type and API operation; it does not authenticate to a real private registry.
    run: oc create secret docker-registry registry-demo --docker-server=registry.example.com --docker-username=demo --docker-password=lab-only-password
    notice: '`secret/registry-demo created` confirms only that the Secret exists. No pull has tested these fictitious credentials.'
  - kind: try
    id: link-secret
    run: oc secrets link default registry-demo --for=pull; oc get serviceaccount default -o jsonpath='{.imagePullSecrets}{"\n"}'
    body: In the recording project, `registry-demo` already exists. Link it to ServiceAccount `default` for image pulls only.
    accept:
    - oc secrets link default registry-demo --for=pull
    - oc secrets link default registry-demo --for pull
    - oc secrets link --for=pull default registry-demo
    - oc secrets link --for pull default registry-demo
    hints:
    - match: ^oc secrets link default registry-demo$
      say: Without `--for=pull`, the link is for mounting, not for image pulls.
    - match: ^oc secrets link registry-demo default
      say: Name the ServiceAccount first, then the Secret to link to it.
    hint: Use `oc secrets link <serviceaccount> <secret> --for=pull`.
    then: |
      The printed list contains `default-dockercfg-fd869`, provisioned by OpenShift, and `registry-demo`, the new link.
      This verifies the ServiceAccount's list, not a successful pull. New pods that inherit this list will receive the
      link; this fictitious Secret will not grant real registry access.
  - kind: ask
    id: unlinked-secret
    prompt: You created a registry secret with valid credentials, but new pods still fail to pull with `unauthorized`. What is missing?
    choices:
    - text: A link from the pods' ServiceAccount, for pulling
      why: A pod uses a pull secret only when the pod or its ServiceAccount references it. Link it with `--for=pull`, then create the pods again.
    - text: A node restart, so the node reads the secret
      why: Nodes receive pull credentials with each pod, at pull time. Nothing needs a restart.
    - text: A copy of the secret in `openshift-config`
      why: That project holds the cluster-wide secret, which administrators manage. A project secret works once the pod references it.
    answer: 0
  - kind: teach
    id: oc-image-tools
    title: Moving images without a cluster
    body: |
      Back to the workstation. `oc image mirror` copies an image from one place to another, including to a directory,
      which is how images reach a site with no internet access. `oc image extract` takes files out of an image
      without a container runtime. Neither needs a login for a public image, and neither touches the cluster.

      By default `oc image mirror` copies only the platform of the machine it runs on. The options
      `--keep-manifest-list=true` and `--filter-by-os` change that.
  - kind: show
    id: mirror
    run: oc image mirror registry.access.redhat.com/ubi9/ubi-minimal:latest file://academy/minimal:latest --dir=mirror 2>/dev/null
    notice: |
      The command prints the digest of what it copied and where: the amd64 digest again. A copy that keeps the digest
      keeps the identity, so workloads pinned by digest still work against the copy.
  - kind: show
    id: mirror-info
    run: oc image info --dir=mirror file://academy/minimal:latest | head -5
    notice: The same command family reads the copy from the directory, offline. The digest is unchanged.
  - kind: try
    id: extract
    body: |
      `oc image extract` uses `--path=<path-inside-image>:<local-directory>` to select a file. In the workstation's
      practice directory, `extracted` already exists. Extract `/etc/redhat-release` from
      `registry.access.redhat.com/ubi9/ubi-minimal:latest` into it without starting a container.
    accept:
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path=/etc/redhat-release:extracted
    - oc image extract --path=/etc/redhat-release:extracted registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path /etc/redhat-release:extracted
    - oc image extract --path /etc/redhat-release:extracted registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal --path=/etc/redhat-release:extracted
    - oc image extract --path=/etc/redhat-release:extracted registry.access.redhat.com/ubi9/ubi-minimal
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal --path /etc/redhat-release:extracted
    - oc image extract --path /etc/redhat-release:extracted registry.access.redhat.com/ubi9/ubi-minimal
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path=/etc/redhat-release:extracted/
    - oc image extract --path=/etc/redhat-release:extracted/ registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path /etc/redhat-release:extracted/
    - oc image extract --path /etc/redhat-release:extracted/ registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal --path=/etc/redhat-release:extracted/
    - oc image extract --path=/etc/redhat-release:extracted/ registry.access.redhat.com/ubi9/ubi-minimal
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal --path /etc/redhat-release:extracted/
    - oc image extract --path /etc/redhat-release:extracted/ registry.access.redhat.com/ubi9/ubi-minimal
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path=/etc/redhat-release:./extracted
    - oc image extract --path=/etc/redhat-release:./extracted registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path /etc/redhat-release:./extracted
    - oc image extract --path /etc/redhat-release:./extracted registry.access.redhat.com/ubi9/ubi-minimal:latest
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal --path=/etc/redhat-release:./extracted
    - oc image extract --path=/etc/redhat-release:./extracted registry.access.redhat.com/ubi9/ubi-minimal
    - oc image extract registry.access.redhat.com/ubi9/ubi-minimal --path /etc/redhat-release:./extracted
    - oc image extract --path /etc/redhat-release:./extracted registry.access.redhat.com/ubi9/ubi-minimal
    hints:
    - match: ^oc image extract \S+$
      say: 'Without `--path`, `oc image extract` copies the whole file system. Name the file, a colon, and the directory: `--path /etc/redhat-release:extracted`.'
    - match: ^oc image (mirror|info)
      say: '`mirror` copies whole images and `info` reads metadata. Taking a single file out is `oc image extract`.'
    - match: '--path[= ]+extracted:'
      say: The path inside the image comes first, then a colon, then the local directory.
    hint: '`oc image extract`, the image, and `--path` with the file, a colon and the directory.'
    run: mkdir extracted && oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path /etc/redhat-release:extracted && cat extracted/redhat-release
    then: |
      The recording first made the directory, then extracted the file, then printed it. The image was never started.
  - kind: teach
    id: cluster-policy
    title: Cluster-wide image policy (administrators)
    body: |
      The image operations above either read registries from your workstation or change objects in your project.
      Administrators decide which registries nodes may pull from in the cluster-scoped object
      `image.config.openshift.io/cluster`. Ordinary users may not read it, so the next task is in the
      administrator's terminal.
  - kind: try
    id: policy-read
    body: As the administrator, print the cluster's image configuration, the object `cluster` of the kind `image.config.openshift.io`, as YAML.
    accept:
    - oc get image.config.openshift.io/cluster -o yaml
    - oc get image.config.openshift.io cluster -o yaml
    - oc get images.config.openshift.io/cluster -o yaml
    - oc get images.config.openshift.io cluster -o yaml
    hints:
    - match: ^oc get images? cluster
      say: '`image` alone means the Image objects of `image.openshift.io`, one per image digest. Name the full kind: `image.config.openshift.io`.'
    - match: ^oc get image\.config\.openshift\.io(/cluster)?$
      say: Ask for the whole object as YAML with `-o yaml`.
    - match: ^oc get image\.config\.openshift\.io -o yaml$
      say: There is exactly one such object, named `cluster`. Name it.
    - match: ' (-n|--namespace)[ =]'
      say: The image configuration is cluster-scoped. Leave out `-n`.
    hint: '`oc get image.config.openshift.io/cluster` and the output format.'
    run: oc get image.config.openshift.io/cluster -o yaml
    then: |
      The `spec` sets one thing: `additionalTrustedCA`, the ConfigMap `registry-certs` in `openshift-config`, which
      holds extra CA certificates trusted for ImageStream imports, pod and build image pulls, and the registry's
      pull-through. There is no `registrySources`, so the nodes may pull from any registry, and no
      `allowedRegistriesForImport`, so imports are not limited either. The `status` reports what the platform worked
      out: the integrated registry's internal host name, its external route, and `imageStreamImportMode: Legacy`, the
      import mode you saw on the scheduled tag. The fields below are the ones an administrator would add.
  - kind: show
    id: allowed-example
    code: |
      apiVersion: config.openshift.io/v1
      kind: Image
      metadata:
        name: cluster
      spec:
        registrySources:
          allowedRegistries:
          - registry.redhat.io
          - quay.io
    caption: Incomplete policy example for analysis, based on OpenShift 4.21 Images, Image configuration. It omits required
      cluster registries; do not apply it. No configuration was changed in this recording.
    origin: example
    notice: |
      With `allowedRegistries`, the container runtime may pull only from the listed registries, and every other
      registry is blocked. That includes the integrated registry, unless it is listed too. The Machine Config Operator,
      the operator that manages the configuration of the nodes, applies the change to each node, which restarts the
      container runtime.
  - kind: ask
    id: allowed-registries
    prompt: An administrator applies the allow-list above. Which of these images can a new pod no longer pull?
    choices:
    - text: '`registry.access.redhat.com/ubi9/ubi-minimal`, used in this lesson'
      why: The list matches registry host names, and `registry.access.redhat.com` is a different host from `registry.redhat.io`. Every unlisted registry is blocked, the integrated one included.
    - text: '`registry.redhat.io/ubi9/ubi-minimal`, from the same vendor'
      why: '`registry.redhat.io` is on the list, so pulls from any of its repositories are still allowed. Two Red Hat registries are two separate entries.'
    - text: 'None of them: the list adds to the default registries'
      why: '`allowedRegistries` is not additive. Anything not on the list is blocked, including the integrated registry unless it is listed.'
    answer: 0
  - kind: show
    id: mirror-set-example
    body: |
      Mirrors work differently. An **ImageDigestMirrorSet** tells the nodes to fetch an image by digest from a mirror
      instead of its source, while the manifests keep naming the source. This cluster has none (shown after the
      example):
    code: |
      apiVersion: config.openshift.io/v1
      kind: ImageDigestMirrorSet
      metadata:
        name: ubi-mirror
      spec:
        imageDigestMirrors:
        - source: registry.access.redhat.com/ubi9/ubi-minimal
          mirrors:
          - mirror.example.com/redhat/ubi9/ubi-minimal
          mirrorSourcePolicy: AllowContactingSource
    caption: 'Documented example: an ImageDigestMirrorSet, from the OpenShift 4.21 documentation, Images, Image configuration. Not applied on this cluster.'
    origin: example
    notice: |
      The mirror can serve a pull for `registry.access.redhat.com/ubi9/ubi-minimal@sha256:…` without changing the
      Deployment. It must hold the same digest. `AllowContactingSource` permits a fallback to the source when mirrors
      cannot serve it; `NeverContactSource` forbids that fallback. An `ImageTagMirrorSet` redirects tag-based pulls,
      whose content can differ across registries. Neither object copies images: populate the mirror separately, as in
      [Inside a registry](/lesson/ct.registries-skopeo).
  - kind: show
    id: mirror-sets
    body: 'In the administrator''s terminal, the mirror sets of this cluster:'
    run: oc get imagedigestmirrorsets,imagetagmirrorsets
    notice: '`No resources found`: this cluster has no ImageDigestMirrorSet and no ImageTagMirrorSet, so every pull goes to the registry that the reference names.'
  - kind: order
    id: order-rebuild
    prompt: A scheduled base-image tag directly feeds a Deployment image trigger. Put the steps from upstream rebuild to
      running the updated base image in order.
    items:
    - The registry has a new image under the tag
    - The scheduled import records the new digest in the istag
    - The trigger writes the new digest into the pod template
    - The Deployment rolls out new pods from the new image
    why: Import discovers the upstream digest, and the Deployment image trigger writes it into the pod template. This direct
      consumer runs that base image. Applications built on the base need a build trigger and a successful rebuild before
      their own image tags move.
  - kind: reflect
    id: explain-pointer
    prompt: 'Explain to a colleague what an ImageStream tag with an image trigger gives them that `image: registry/app:1.4` in a Deployment does not.'
    model: |
      A registry tag can move. Depending on pull policy and cache state, pods using it can run different content.
      An ImageStream tag records a current digest and its history inside the cluster. An image trigger writes that
      reference into the Deployment, pinning the resulting pod template. Moving the approval tag deliberately can
      then roll out the tested image. To withdraw it while the trigger is active, move the approval tag back; a direct
      Deployment rollback can be overwritten by the trigger if the tag still points at the bad image.
  - kind: teach
    id: what-next
    title: What you can do now
    body: |
      You can inspect an image's platform and digest, import metadata into an ImageStream, distinguish scheduled
      imports from deliberate tag moves, and choose Source or Local references. You can resolve a short name, add an
      image trigger, link a pull secret, copy an image and extract a file. You can also read the cluster-wide image
      settings as an administrator and tell which of them would change what the nodes may pull.

      The next lesson, [Projects, builds and ImageStreams](/lesson/c.projects-builds), adds the missing build stage:
      an updated base image must be used in a new application build before that application's tag and Deployment can
      change. Importing a base image does not patch images already built from it. After that lesson, the lab
      [Build and deploy an image](/lab/lab.images-builds) practises the stream, the trigger and the rollout together.
      Short names, pull secrets and `oc image` have no practice activity yet: repeat them in a project of your own.
  sections:
  - id: stream-fields
    title: The fields of an ImageStream
    depth: true
    body: |
      | Field | Holds | Example |
      |---|---|---|
      | `spec.tags[].from` | what you asked for: an external reference or another istag | `registry.access.redhat.com/ubi9/ubi-minimal:latest` |
      | `spec.tags[].importPolicy` | `scheduled`, `importMode`, `insecure` | `scheduled: true` |
      | `spec.tags[].referencePolicy.type` | `Source` or `Local` | `Local` |
      | `spec.lookupPolicy.local` | whether names in this project resolve to the stream | `true` |
      | `status.tags[].items[]` | what was resolved: `dockerImageReference`, `image` (digest), `created`, `generation` | newest first |

      Authorisation on the integrated registry is RBAC: a pull is a `get` on `imagestreams/layers` in the image's
      project, covered in the [image access lesson](/lesson/l.image-pullers). External access requires an administrator to expose the registry,
      for example through its `defaultRoute` setting. The recorded workloads use the internal service address.
  - id: import-modes
    title: Importing and tagging in detail
    depth: true
    body: |
      | Command | Does | Key options |
      |---|---|---|
      | `oc tag <source> <stream>:<tag>` | points a tag at an external image, another istag, or a digest | `--source=docker`, `--alias`, `--scheduled`, `--reference-policy=local`, `--import-mode`, `-d` to delete |
      | `oc import-image <stream>:<tag>` | (re)imports metadata for a tag from its source | `--from` and `--confirm` to create or change the source, `--all`, `--scheduled`, `--import-mode=PreserveOriginal`, `--reference-policy=local` |

      In `Legacy` import mode, OpenShift imports one image from a manifest list: the platform is chosen
      from tag annotations, then from the control plane's architecture, then `linux/amd64`, then the first manifest. With `PreserveOriginal`
      it keeps the whole list. The cluster-wide `imageStreamImportMode` field, a Technology Preview in 4.21, changes
      the default; when it is not set, a single-architecture payload implies `Legacy` and a multi-architecture
      payload implies `PreserveOriginal`.

      Imports from private registries use the `kubernetes.io/dockerconfigjson` secrets in the project: the import
      picks them up and presents them to the registry, without any link. A trigger entry has a `paused` field to
      suspend it without removing it.
  - id: oc-image-vs-skopeo
    title: oc image and Skopeo compared
    depth: true
    body: |
      | Need | Skopeo | `oc image` |
      |---|---|---|
      | metadata of a remote image | `skopeo inspect` | `oc image info` |
      | copy between registries or to disk | `skopeo copy` | `oc image mirror` (also understands mirror mapping files) |
      | read one file from an image | not available | `oc image extract` |

      For whole OpenShift releases and operator catalogs, Red Hat's `oc-mirror` plugin builds on the same idea and also
      generates the mirror configuration for the cluster.
  - id: cluster-policy-detail
    title: Cluster-wide image policy in detail
    depth: true
    body: |
      | Field of `image.config.openshift.io/cluster` | Effect |
      |---|---|
      | `registrySources.allowedRegistries` | only these registries (or repositories) may be pulled from; everything else is blocked, **including the integrated registry** unless it is listed |
      | `registrySources.blockedRegistries` | these are refused, the rest allowed; set either this or `allowedRegistries`, not both |
      | `registrySources.insecureRegistries` | registries reached without valid TLS |
      | `registrySources.containerRuntimeSearchRegistries` | the registries nodes may use for short names |
      | `allowedRegistriesForImport` | which registries ordinary users may import ImageStreams from |

      The Machine Config Operator applies these to every node: it cordons the node, writes the CRI-O configuration
      (`policy.json`, `registries.conf`), restarts CRI-O and uncordons it, without a reboot.

      **ImageDigestMirrorSet** (IDMS) and **ImageTagMirrorSet** (ITMS) tell nodes to fetch `registry.redhat.io/...`
      from a mirror, for references by digest (IDMS) or by tag (ITMS). `mirrorSourcePolicy: NeverContactSource`
      forbids falling back to the source; the default, `AllowContactingSource`, allows it. Creating an IDMS does not
      drain or reboot nodes; creating an ITMS, and changing or deleting either, drains and reboots them. The older
      ImageContentSourcePolicy is deprecated. Mirrors by digest work only if the copy preserved digests.
  - id: choosing
    title: Choosing a mechanism
    depth: true
    body: |
      | Goal | Use | Watch out for |
      |---|---|---|
      | pin exactly what was tested | a digest in the Deployment | updates are manual, by design |
      | follow an approved tag automatically | istag + image trigger | the tag must be moved deliberately (promotion) |
      | pick up upstream security rebuilds | `oc tag … --scheduled` on the base image + build trigger | rebuilds arrive unannounced |
      | write short names in one project's YAML | image lookup (stream or workload) | works only in that project, and resolves once |
      | shield nodes from an external registry | reference policy `Local` | the integrated registry must be healthy and have storage |
      | a private external registry for one project | pull secret linked to the ServiceAccount | rotate it; use a robot account |
      | a disconnected cluster | mirror with digests preserved + IDMS | an administrator task |
  - id: what-goes-wrong
    title: What goes wrong, and how to see it
    depth: true
    body: |
      | Symptom | Evidence | Cause | Fix |
      |---|---|---|---|
      | `ImagePullBackOff` for `image: web:v2` although stream `web` exists | the pod's events show the literal name | no image lookup enabled for the name, and no trigger | enable image lookup on the stream or workload, or add a trigger |
      | new upstream build never arrives | `oc get istag <stream>:<tag>`: same digest, old `UPDATED` | imported once, not scheduled | import again, or schedule the tag |
      | the istag shows an import error | `oc describe istag <stream>:<tag>` (or the stream's status conditions) | wrong source, missing project pull secret, registry not allowed for import | fix the source or secret; ask whether `allowedRegistriesForImport` blocks it |
      | `unauthorized` from a private registry | the event; `imagePullSecrets` of the ServiceAccount | secret missing, wrong or not linked | create and link for pull, recreate pods |
      | trigger exists but nothing rolls out | the `image.openshift.io/triggers` annotation | wrong container name or `paused: true` | correct the annotation |
      | every pull from a registry fails on every node | events mention the registry; the cluster image config | not in `allowedRegistries`, or in `blockedRegistries` | ask the platform team |
      | `oc image info` fails with a platform list | the error output | the tag is a manifest list | add `--filter-by-os` |
  - id: common-mistakes
    title: Common mistakes
    depth: true
    body: |
      - **Believing an ImageStream stores images.** It stores pointers and history; layers live in a registry.
        Deleting a tag does not free registry storage; pruning is separate.
      - **Expecting `allowedRegistries` to be additive.** Listing a single registry blocks every other one, the
        integrated registry included.
      - **Comparing the istag digest with Skopeo's index digest.** Legacy records a per-platform manifest;
        PreserveOriginal keeps the index. Check which mode the tag uses.
      - **Expecting local lookup to follow a tag.** It resolves a name once; only a trigger follows.
      - **Turning on scheduled import for production tags without a gate.** Rebuilds then roll out on upstream's
        schedule, not yours.
      - **Creating a pull secret and forgetting to link it.** Pods use it only when the pod or its ServiceAccount
        references it (ImageStream imports are the exception).
  review:
  - q: What does an ImageStream contain?
    a: Tags and, per tag, a history of image references by digest. Never the layers.
  - q: How does import mode affect the digest recorded for a multi-architecture tag?
    a: With Legacy, one selected platform manifest (amd64 in this recording); with PreserveOriginal, the index and its platform manifests. Check the tag's import mode rather than assuming one default.
  - q: 'An imported tag, not scheduled: upstream moves the tag. What does the istag show?'
    a: The old digest, until someone imports again. With `--scheduled` the cluster re-imports every 15 minutes by default (a cluster-wide setting).
  - q: What does referencePolicy Local change?
    a: Consumers get an internal-registry reference; the integrated registry pulls through from the source and keeps the layers, so pulls using that resolved reference go through the integrated registry. Import alone does not make an offline copy.
  - q: What does a Deployment need to use `stream:tag` as its image, and what does it need to follow the tag?
    a: Image lookup on the stream or workload (`oc set image-lookup`) resolves a short name during an API write. An image trigger (`oc set triggers --from-image`) follows the tag.
  - q: A registry secret exists in the project but pods still cannot pull. What is missing?
    a: A link to the pods' ServiceAccount for pulling (`oc secrets link … --for=pull`), or `imagePullSecrets` in the pod; then new pods.
  - q: Name the two objects that redirect node pulls to mirrors, and which one never reboots nodes on creation.
    a: ImageDigestMirrorSet and ImageTagMirrorSet; creating an IDMS does not drain or reboot nodes (creating an ITMS, or changing or deleting either, does).
  - q: What must be added to allowedRegistries that people forget?
    a: The integrated registry, image-registry.openshift-image-registry.svc:5000.
  labs: []
  limits: The oc image commands run against public registries and need no cluster. The ImageStream, lookup, trigger and secret commands were recorded on OpenShift Local 4.21.8 as an ordinary user. The cluster image configuration and the mirror sets were only read by the administrator. Changing registrySources or creating mirror sets was not done, because the Machine Config Operator rolls such changes out to the nodes (restarting CRI-O, and for some mirror-set changes draining and rebooting) and mirror sets need a mirror registry that this course does not run, so those changes are documented examples.
  enterprise: Regulated platforms typically allow only an internal registry (Quay or similar) in allowedRegistries, mirror vendor content into it with oc-mirror, point nodes at it with ImageDigestMirrorSet and NeverContactSource, and promote applications by moving ImageStream tags or digests between environments instead of rebuilding.
  references:
  - title: 'OpenShift 4.21: Managing image streams'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/managing-image-streams
  - title: 'OpenShift 4.21: Managing images (tags, reference policy, pull secrets)'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/managing-images
  - title: 'OpenShift 4.21: Using image streams with Kubernetes resources (image lookup)'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/using-imagestreams-with-kube-resources
  - title: 'OpenShift 4.21: Triggering updates on image stream changes'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/triggering-updates-on-imagestream-changes
  - title: 'OpenShift 4.21: Image configuration (registry sources, mirror sets)'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/images/images#images-configuration
  - title: 'OpenShift 4.21: Accessing the registry'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/registry/accessing-the-registry
  - title: 'Kubernetes: Pull an image from a private registry'
    url: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  - title: 'OKD 4.21: Using image pull secrets (link to a ServiceAccount or list in the workload)'
    url: https://docs.okd.io/4.21/openshift_images/managing_images/using-image-pull-secrets.html
  commands:
  - cmd: oc version --client
    as: developer
    meaning: 'the oc client alone: the oc image commands read registries, not the cluster'
  - cmd: oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest
    as: developer
    meaning: 'refused: the tag is a manifest list; the error lists the platforms and their digests'
    expect: fail
  - cmd: oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest --filter-by-os=linux/amd64 | head -9
    as: developer
    meaning: 'one platform: Digest is the amd64 manifest, Manifest List is the index, plus size and layers'
  - cmd: oc image mirror registry.access.redhat.com/ubi9/ubi-minimal:latest file://academy/minimal:latest --dir=mirror 2>/dev/null
    as: developer
    meaning: copy the image to a local directory, as for a disconnected site; the printed digest is unchanged
  - cmd: oc image info --dir=mirror file://academy/minimal:latest | head -5
    as: developer
    meaning: 'read the mirrored copy offline: same digest as in the registry'
  - cmd: mkdir extracted && oc image extract registry.access.redhat.com/ubi9/ubi-minimal:latest --path /etc/redhat-release:extracted && cat extracted/redhat-release
    as: developer
    meaning: take one file out of the image without running it or using a container runtime
  - cmd: oc import-image ubi:latest --from=registry.access.redhat.com/ubi9/ubi-minimal:latest --confirm | head -n 17
    as: developer
    meaning: creates the stream ubi and points its tag latest at the image the registry has now; the output starts with the stream and the digest it recorded
  - cmd: oc tag registry.access.redhat.com/ubi9/ubi-minimal:latest watched:latest --scheduled; sleep 5; oc get imagestream watched -o jsonpath='{.spec.tags[0].importPolicy}{"\n"}'
    as: developer
    meaning: 'a tag that imports again periodically: scheduled is true, and importMode shows how a multi-architecture tag is imported'
  - cmd: oc import-image ubi:9.5 --from=registry.access.redhat.com/ubi9/ubi-minimal:9.5 --confirm | head -n 1; oc get istag ubi:9.5
    as: developer
    meaning: a second tag of the same stream, from an older release
  - cmd: oc import-image ubi:latest-local --from=registry.access.redhat.com/ubi9/ubi-minimal:latest --reference-policy=local --confirm >/dev/null; oc get istag
    as: developer
    meaning: 'the same image under two reference policies: Source (the default) and Local'
  - cmd: oc tag ubi:9.5 ubi:approved; oc create deployment web --image=ubi:approved -- sleep infinity; sleep 15; oc get pods; oc describe pod -l app=web | grep -m1 'Failed to pull image'
    as: developer
    meaning: 'a tag that points at another tag, and a Deployment that uses the short name: the node cannot pull it'
  - cmd: oc set image-lookup ubi; oc set image-lookup deployment/web; sleep 15; oc get pods; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
    as: developer
    meaning: 'local lookup on the stream and on the Deployment: the name is replaced by the tag''s reference'
  - cmd: oc tag ubi:latest ubi:approved; sleep 5; oc get istag ubi:approved -o jsonpath='{.image.dockerImageReference}{"\n"}'; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
    as: developer
    meaning: the tag moved; the Deployment did not follow
  - cmd: oc set triggers deployment/web --from-image=ubi:approved -c ubi; sleep 10; oc rollout status deployment/web --timeout=180s | tail -n 1; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'; oc get deployment web -o jsonpath='{.metadata.annotations.image\.openshift\.io/triggers}{"\n"}'
    as: developer
    meaning: 'an image trigger: the Deployment takes the tag''s current image and the annotation names the tag it follows'
    timeout: 240
  - cmd: oc tag ubi:9.5 ubi:approved; sleep 10; oc rollout status deployment/web --timeout=180s | tail -n 1; oc get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
    as: developer
    meaning: 'the tag moved back: the Deployment rolls out the older image'
    timeout: 240
  - cmd: oc create secret docker-registry registry-demo --docker-server=registry.example.com --docker-username=demo --docker-password=lab-only-password
    as: developer
    meaning: a pull secret for a registry that needs a login (a made-up login)
  - cmd: oc secrets link default registry-demo --for=pull; oc get serviceaccount default -o jsonpath='{.imagePullSecrets}{"\n"}'
    as: developer
    meaning: the secret linked to the ServiceAccount for pulling
  - cmd: oc get image.config.openshift.io/cluster -o yaml
    as: admin
    meaning: the cluster-wide image settings, read by the administrator
  - cmd: oc get imagedigestmirrorsets,imagetagmirrorsets
    as: admin
    meaning: the cluster's mirror sets
  - cmd: rm -rf mirror extracted && echo cleaned
    as: developer
    meaning: clean up (not shown in the lesson)
- id: ct.images-on-nodes
  title: Images on a node
  subtitle: Pulls, the node's image store, crictl, image garbage collection and disk pressure
  module: a6-images-updates
  mode: GUIDED_INVESTIGATION
  minutes: 50
  level: 2
  supports: Kubernetes 1.34 kubelet and CRI-O as on OpenShift 4.21 (RHCOS 9), with oc 4.21.8. Pull events, pull policies and pull failures recorded on OpenShift Local 4.21 by the ordinary user developer, in a temporary project; image sizes and timings vary. The node's image store, its kubelet settings and its disk usage were read by the cluster administrator kubeadmin, through the node proxy of the API and through oc debug node with read-only crictl commands; the debug pods ran in a namespace created for the recording and deleted afterwards (experiment X-IMG-01). Podman 5.8 outputs recorded on a RHEL 9 workstation as an ordinary user, in a scratch directory.
  concepts:
  - container.registries
  - container.images
  - k8s.architecture
  prerequisites:
  - ct.registries-skopeo
  - k.kubectl-to-oc
  objective: |
    Describe what the kubelet and CRI-O do with an image when a pod starts, read pull events and pull policies
    correctly, know where images live on a node and when the kubelet removes them, and recognise a failed pull, a
    missing image and a wrong architecture from their evidence.
  record_on: cluster-admin
  flow:
  - kind: ask
    id: recall-tags
    recalls: ct.registries-skopeo
    prompt: Two nodes pull `myapp:1.4` a week apart. Can they end up with different images?
    choices:
    - text: Yes, if the tag moved in between
      why: A tag is a movable label, so nodes that pulled at different times can hold different images under the same name.
    - text: 'No: a tag always names the same image'
      why: Only a digest is fixed. A tag can be moved to new content whenever its owner pushes.
    - text: 'No: the registry refuses to move a tag'
      why: Registries allow pushing a tag again, and that is how a fix reaches people who use `latest`.
    answer: 0
  - kind: teach
    id: situation
    title: Every image problem ends on a node
    body: |
      A pod takes minutes to start on one node and seconds on another. Another node reports **DiskPressure**, meaning
      its available disk space or inodes have crossed a threshold. An image built on a laptop fails to execute on a
      cluster node. A Deployment's template alone cannot explain these symptoms.

      Each node has its own image store. A node may need to fetch missing content, reclaim unused images, or reject
      binaries built for another CPU architecture. This lesson follows those decisions using pod events and status,
      then reads the node itself, as its administrator.

      Cluster recordings use one OpenShift Local node: the ordinary user `developer` in a temporary project, and the
      cluster administrator for the node. The prompt in front of each command names who ran it. Podman demonstrations
      use a separate workstation store. Typed tasks compare commands without executing them; use the recording
      project unless the task explicitly says workstation or administrator.
  - kind: teach
    id: pod-start
    title: What the node does when a pod starts
    body: |
      Once the scheduler has picked a node, the **kubelet**, the agent on that node, works through each container of
      the pod:

      1. It decides whether to pull, from the container's `imagePullPolicy`.
      2. It gathers credentials: the pod's `imagePullSecrets`, including those inherited from its ServiceAccount.
      3. It asks **CRI-O**, the container runtime of an OpenShift node, to pull. CRI-O applies the node's registry
         configuration, resolves the tag to a digest, downloads only the layers it does not have, and stores them.
      4. It starts the container from the stored image.

      The pod's events tell this story. The next demonstration starts a pod and reads them.
  - kind: show
    id: first-pull
    body: |
      Start a pod from the tag `latest`, wait until it is Ready, and read the events the cluster recorded for it:
    run: oc run pull-latest --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc wait --for=condition=Ready pod/pull-latest --timeout=180s; oc get events --field-selector involvedObject.name=pull-latest
    highlight:
    - Pulling
    - Pulled
    notice: |
      The events show `Pulling image`, `Successfully pulled image`, `Created` and `Started`. The pull took 3.055s,
      including waiting, and the reported image size is 108819904 bytes. These events show a successful runtime pull
      operation; they do not say which layers were already cached or how many bytes crossed the network.
  - kind: show
    id: image-id
    body: |
      The pod's status records which image the node really started. The command prints the image the pod asked for, then
      its `status.containerStatuses[].imageID`, with the `sed` cutting everything before the `@` (the node reports the
      digest under the name it first stored the image with, which can differ from yours):
    run: 'oc get pod pull-latest -o jsonpath=''{.spec.containers[0].image}{"\n"}{.status.containerStatuses[0].imageID}{"\n"}'' | sed ''s/^[^ ]*@/digest: /'''
    notice: |
      The first line is what the pod asked for: a tag, which can move. The second is what the node started: a digest,
      which cannot. When two pods of one Deployment behave differently, `imageID` is the quickest proof of what each one
      runs.
  - kind: ask
    id: guess-present
    guess: true
    prompt: A second pod on this node uses the cached digest, leaving pull policy unset. What do you expect in its events?
    choices:
    - text: The image is already present on the machine
      why: A digest defaults to IfNotPresent, which reuses a cached image for that reference. The next step shows the event,
        then explains the policy defaults.
    - text: Every layer is downloaded again for the new pod
      why: The image store belongs to the node, not the pod. Runtime pulls can reuse layers; a new pod does not need a separate
        copy of each layer.
    - text: The pull fails because digests cannot name runnable images
      why: A manifest digest can identify an image directly. It avoids depending on a movable tag.
    answer: 0
  - kind: show
    id: present
    body: |
      The command takes the digest of the amd64 image from `oc image info` (see [Images on the platform](/lesson/ct.openshift-images)) and starts a pod whose image is that digest:
    run: DIGEST=$(oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest --filter-by-os=linux/amd64 | awk '/^Digest:/ {print $2}'); oc run pull-digest --image=registry.access.redhat.com/ubi9/ubi-minimal@$DIGEST -- sleep infinity; oc wait --for=condition=Ready pod/pull-digest --timeout=180s; oc get events --field-selector involvedObject.name=pull-digest
    highlight:
    - already present
    notice: |
      `Container image … already present on machine`, and no `Pulling` event at all. For a digest, present means exactly
      those bytes, so the cached copy is always correct and the registry is not contacted.
  - kind: teach
    id: pull-policy
    title: Pull policies
    body: |
      The container's **`imagePullPolicy`** decides when the node asks the registry. `IfNotPresent` pulls only if the
      node has no image for that reference. `Always` makes the runtime resolve the reference at the registry every time,
      reusing the layers it already has. `Never` does not pull at all. When you do not set it, Kubernetes chooses: `Always`
      for the tag `latest` or no tag, `IfNotPresent` for any other tag and for a digest.

      "Present" is judged on the reference. For a digest, that means exactly the right bytes. For a tag, it means
      "something is stored under that tag", which may be an old build.
  - kind: show
    id: policies
    run: oc get pods -o custom-columns=NAME:.metadata.name,POLICY:.spec.containers[0].imagePullPolicy
    notice: |
      `pull-latest` uses the tag `latest` and got `Always`. `pull-digest` uses a digest and got `IfNotPresent`.
  - kind: ask
    id: tag-cache
    prompt: You push a fix under the same tag, `myapp:1.4`, and delete one pod. Its policy is `IfNotPresent`. What runs in the new pod?
    choices:
    - text: The old image, if that node cached the tag
      why: With `IfNotPresent` the node does not contact the registry when it has an image for that tag. A node without it pulls the new content, so one tag can give two versions.
    - text: The new image, because the tag now points to it
      why: Only `Always`, or a node without the image, fetches the new content. A cached tag is reused as it is.
    - text: The pull fails, because the tag was overwritten
      why: Nothing is wrong with the tag. The node uses its cached copy, and that silence is what makes it dangerous.
    answer: 0
  - kind: show
    id: frozen-policy
    body: |
      One more rule that people often miss. A Deployment is created from the tag `9.5` with no policy, and later its image is changed to `latest`:
    run: oc create deployment fixed --image=registry.access.redhat.com/ubi9/ubi-minimal:9.5 -- sleep infinity; oc get deployment fixed -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}{"\n"}'; oc set image deployment/fixed ubi-minimal=registry.access.redhat.com/ubi9/ubi-minimal:latest; oc get deployment fixed -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].imagePullPolicy}{"\n"}'
    notice: |
      After the creation message, the policy is `IfNotPresent`, chosen for tag `9.5`. The final line shows `latest`
      with the policy still `IfNotPresent`. The default was stored when the Deployment was created; changing the image
      does not recompute it. New pods may therefore reuse a stale cached `latest`.
  - kind: try
    id: never
    body: Create a pod `never` from `registry.access.redhat.com/ubi9/ubi-minimal:9.1`, with the pull policy `Never`, that runs `sleep infinity`. The node does not have that image.
    accept:
    - oc run never --image=registry.access.redhat.com/ubi9/ubi-minimal:9.1 --image-pull-policy=Never -- sleep infinity
    hints:
    - match: ^oc run never --image[= ]\S+( -- sleep infinity)?$
      say: That uses the default policy, which pulls an image the node lacks. Add `--image-pull-policy=Never`.
    - match: ^oc create deployment
      say: A Deployment would work too, but `oc run` makes a single pod, and the task says pod. `oc create deployment` also has no option for the pull policy.
    - match: ' -- .*--image'
      say: 'Put `--image=` and the pull policy before `--`: everything after the double dash is the command to run in the container.'
    hint: '`oc run never`, `--image=` with the image, `--image-pull-policy=Never`, then `-- sleep infinity`.'
    run: oc run never --image=registry.access.redhat.com/ubi9/ubi-minimal:9.1 --image-pull-policy=Never -- sleep infinity; sleep 8; oc get pod never; oc get events --field-selector involvedObject.name=never,type=Warning
    then: |
      The pod never starts, and its status is `ErrImageNeverPull`: the node does not have the image, and the policy
      forbids pulling it. The event says so in plain words.
  - kind: show
    id: bad-tag
    body: 'A different failure: a tag that does not exist in the repository.'
    run: oc run bad-tag --image=registry.access.redhat.com/ubi9/ubi-minimal:no-such-tag -- sleep infinity; sleep 15; oc get pod bad-tag; oc get events --field-selector involvedObject.name=bad-tag,type=Warning
    highlight:
    - manifest unknown
    notice: |
      `ErrImagePull`, and then `ImagePullBackOff`, which means the kubelet retries with longer and longer pauses, up to
      five minutes. The event carries the registry's own answer at the end of the message.
  - kind: ask
    id: manifest-unknown
    prompt: Other tags of this repository pull fine, but this one fails with the line below. What does `manifest unknown` mean?
    evidence: |
      reading manifest no-such-tag in registry.access.redhat.com/ubi9/ubi-minimal: manifest unknown
    choices:
    - text: The registry has no such tag in that repository
      why: The registry answered and found the repository, but no manifest for that reference. Check which tags the repository really has.
    - text: The node cannot reach the registry
      why: An unreachable registry gives `no such host` or a timeout, never a registry error.
    - text: The credentials for the registry have expired
      why: Credential problems give `unauthorized`, and the other tags of the repository would fail too.
    answer: 0
  - kind: teach
    id: where-images-live
    title: Where images live
    body: |
      CRI-O and Podman use the containers/storage library and similar disk layouts, but the workstation and node
      stores are separate. OpenShift nodes normally store CRI-O images under `/var/lib/containers/storage`, using the
      **overlay** driver. Rootless Podman keeps its store in your home directory by default.

      The overlay filesystem presents several directories as one view. Image layers supply the read-only content;
      each container adds a writable layer. Images can share identical base layers within a store, saving disk space.
      The next commands inspect the workstation store as an illustration; the node's own store comes later in the
      lesson.
  - kind: show
    id: podman-info
    run: podman info --format 'driver={{.Store.GraphDriverName}} root={{.Store.GraphRoot}}'
    notice: |
      The rootless store and the `overlay` driver. On a node, the same line would show `/var/lib/containers/storage`.
  - kind: show
    id: podman-inspect
    run: podman pull -q registry.access.redhat.com/ubi9/ubi-minimal:latest >/dev/null && podman image inspect --format 'layers={{len .RootFS.Layers}} dir={{.GraphDriver.Data.UpperDir}}' registry.access.redhat.com/ubi9/ubi-minimal:latest
    notice: |
      The recorded image has one layer, and `dir=` points at its unpacked directory inside the workstation's `overlay`
      store. This is a Podman directory, not a cluster node measurement. Treat layer directories as implementation
      details: use the runtime's tools rather than editing or deleting files there.
  - kind: try
    id: podman-df
    body: On the workstation, `podman system df` summarizes disk usage; `-v` adds detail. Ask for the summary of images,
      containers and volumes.
    accept:
    - podman system df
    - podman system df -v
    - podman system df --verbose
    hints:
    - match: ^podman images
      say: '`podman images` lists the images with their sizes. The summary with the reclaimable part is `podman system df`.'
    - match: ^podman (system )?(info|df)\S
      say: 'The command has a space between its words: `podman system df`.'
    - match: ^podman df
      say: '`df` belongs to the `system` group: `podman system df`.'
    hint: '`podman system df`.'
    run: podman system df
    then: |
      The image row reports 5.623GB used and 776.2MB reclaimable. `RECLAIMABLE` is an estimate: Podman can overstate
      what pruning images will free when layers are shared. Deleting one image may free almost nothing. On a node,
      images, logs and disk-backed `emptyDir` volumes can compete for disk space.
  - kind: teach
    id: gc
    title: Image garbage collection
    body: |
      The kubelet checks unused images every five minutes. With the default thresholds, image garbage collection
      starts at **85%** usage (`imageGCHighThresholdPercent`) and tries to reduce usage to **80%**
      (`imageGCLowThresholdPercent`), removing the least recently used unused images first. It keeps recently detected
      images for at least two minutes. Images in use by running containers are protected. These are defaults;
      administrators can configure them.

      The target is not guaranteed: there may be too few eligible images to remove. After collection, a node may no
      longer have your image. A later `IfNotPresent` start then needs the registry again.
  - kind: show
    id: node-gc
    body: |
      Defaults can be changed per cluster, so read them on the node. The kubelet serves its running configuration at
      `/configz`, which an administrator can reach through the API server's proxy to the node; `jq` keeps the image
      and eviction fields. `crc` is the name of OpenShift Local's only node; on another cluster, an administrator
      picks one from `oc get nodes`:
    run: oc get --raw /api/v1/nodes/crc/proxy/configz | jq '.kubeletconfig | {imageGCHighThresholdPercent, imageGCLowThresholdPercent, imageMinimumGCAge, imageMaximumGCAge, evictionHard}'
    notice: |
      This node runs with the defaults: collection from 85% towards 80%, images younger than two minutes kept, no
      maximum age (`0s`). `evictionHard` lists the eviction thresholds of the next part.
  - kind: ask
    id: disk-87
    prompt: Image storage is at 87%, with enough eligible unused images. What does default image garbage collection try to
      do?
    choices:
    - text: Remove unused images toward 80% usage
      why: The high threshold triggers collection and the low threshold is its target. Only eligible unused images can be
        removed.
    - text: Keep every image until the next pull fails
      why: Collection runs periodically and starts at the high threshold; it does not wait for a failed pull.
    - text: Remove running containers to free their images
      why: Image garbage collection protects images in use. Pod eviction is a separate response to node pressure.
    answer: 0
  - kind: teach
    id: disk-pressure
    title: Disk pressure and eviction
    body: |
      The kubelet also checks **eviction thresholds**: minimum free resources needed to keep a node healthy.
      Kubernetes defaults include `nodefs.available<10%` and `imagefs.available<15%`. When a disk threshold is met,
      the node reports `DiskPressure`. The control plane adds a **taint**, a scheduling marker that keeps ordinary
      new pods away. The kubelet tries to reclaim space and evicts pods if reclaiming node resources is insufficient.

      These checks run separately from periodic image collection. At 87% used on a separate image filesystem,
      13% is free, already below the 15% eviction threshold. Garbage collection is not guaranteed to finish before
      `DiskPressure` is reported. Read the node's actual thresholds and filesystem layout during an incident.
  - kind: show
    id: node-disk
    body: 'How full is this node? The kubelet''s summary statistics, through the same proxy, for the node''s file system:'
    run: oc get --raw /api/v1/nodes/crc/proxy/stats/summary | jq '.node | {capacity_GiB:(.fs.capacityBytes/1073741824*10|round/10), available_GiB:(.fs.availableBytes/1073741824*10|round/10), available_percent:(.fs.availableBytes*1000/.fs.capacityBytes|round/10), imagefs_available_GiB:(.runtime.imageFs.availableBytes/1073741824*10|round/10)}'
    notice: |
      39.4 GiB in all, 6.4 GiB free: 16.3%. The image file system reports the same free space, because on this node
      images share one file system with everything else. The eviction threshold for images is 15% free, a little more
      than one percentage point away, and image garbage collection starts at 85% used, which is the same point. A few
      large pulls would bring `DiskPressure`, which is why this course only pulls small images on this node.
    understand:
      purpose: 'Reads the kubelet''s own statistics for node `crc` through the API server, and keeps four numbers from
        them: the node file system''s size and free space in GiB, its free share in percent, and the space free for
        images.'
      parts:
        - text: oc get --raw /api/v1/nodes/crc/proxy/stats/summary
          means: Sends a GET for this path to the API server, which passes it on to the kubelet of node `crc`; the
            kubelet answers with its Summary API, statistics for the node and for each of its pods, as JSON. `--raw`
            prints that JSON as it comes.
        - text: .node
          means: Keeps the node's part of the answer and leaves out the pods.
        - text: '.fs.capacityBytes/1073741824*10|round/10'
          means: 'Bytes to GiB (1073741824 bytes in a GiB), with one decimal: multiply by 10, round, divide by 10.'
        - text: .runtime.imageFs.availableBytes
          means: The free space of the file system where the container runtime keeps images. On this node it is the
            same file system as `fs`, which is why the two free values agree.
      caution: Reading a node through the API server's proxy needs a cluster-wide right that ordinary users do not
        have; the recording ran it as the administrator.
      concepts:
        - k8s.architecture
        - container.images
      refs:
        - title: 'Kubernetes: Node metrics data (the Summary API through the API server proxy)'
          url: https://kubernetes.io/docs/reference/instrumentation/node-metrics/
        - title: kubectl get (--raw)
          url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_get/
        - title: jq 1.7 manual (math functions, round)
          url: https://jqlang.org/manual/v1.7/
  - kind: show
    id: dangling
    body: |
      On the workstation, Podman keeps images until you remove them. The practice directory contains a Containerfile
      that starts from ubi-minimal, labels the image `academy.demo=images-on-nodes`, and writes a build argument,
      `RELEASE`, into a file. Build it twice with different RELEASE values under the same tag:
    run: podman build -q --build-arg RELEASE=1 -t localhost/academy-node:latest . && podman build -q --build-arg RELEASE=2 -t localhost/academy-node:latest .
    notice: 'Two image IDs: the first build, then the second. The tag `latest` now belongs to the second.'
  - kind: show
    id: dangling-list
    run: podman images --filter label=academy.demo=images-on-nodes --format '{{.Repository}}:{{.Tag}} {{.ID}} dangling={{.Dangling}}'
    highlight:
    - dangling=true
    notice: |
      The first build is now untagged: `<none>:<none>` with `dangling=true`. The second still has `latest`.
      `podman image prune` selects unused dangling images by default. Use `--filter label=<key>=<value>` to restrict
      which labeled images it considers, and `-f` to skip confirmation. Apply those options to this lesson's label next.
  - kind: try
    id: prune
    body: On the workstation, use `podman image prune` to remove dangling images labeled `academy.demo=images-on-nodes`,
      without confirmation. Keep the tagged second build.
    accept:
    - podman image prune -f --filter label=academy.demo=images-on-nodes
    - podman image prune --filter label=academy.demo=images-on-nodes -f
    - podman image prune -f --filter=label=academy.demo=images-on-nodes
    - podman image prune --filter=label=academy.demo=images-on-nodes -f
    - podman image prune --force --filter label=academy.demo=images-on-nodes
    - podman image prune --filter label=academy.demo=images-on-nodes --force
    - podman image prune --force --filter=label=academy.demo=images-on-nodes
    - podman image prune --filter=label=academy.demo=images-on-nodes --force
    hints:
    - match: ^podman rmi
      say: '`rmi` can remove an image by ID, even if it has no tag. To select dangling images by label as requested here,
        use `podman image prune`.'
    - match: ^podman image prune( -f| --force)?$
      say: Without a filter this considers every dangling image on the workstation. Restrict it with `--filter label=academy.demo=images-on-nodes`.
    - match: ^podman image prune --filter\S* label=\S+$
      say: Add `-f` or `--force` to skip the confirmation prompt.
    - match: (^| )(-a|--all)( |$)
      say: '`-a` includes unused tagged images matching the filter. Keep it out so the second build remains.'
    hint: '`podman image prune`, the option for no confirmation, and `--filter label=…`.'
    run: podman image prune -f --filter label=academy.demo=images-on-nodes
    then: |
      The printed ID is the first build's ID. The label filter restricted pruning to this lesson's images. Adding `-a`
      would also remove unused tagged images that match that same filter, including the second build here.
  - kind: teach
    id: arch
    title: The wrong architecture
    body: |
      An image contains programs for a CPU architecture. These course nodes are amd64. The arm64 manifest of the same
      tag has a different digest and contains arm64 programs. Without CPU emulation, an amd64 node cannot execute them.

      When a pod references that arm64 manifest digest directly, CRI-O can fetch it, but starting its program fails.
      The next command deliberately selects the arm64 digest and asks this amd64 node to run `uname -m` from it.
  - kind: show
    id: arm-pod
    run: ARM=$(oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest 2>&1 | awk '/linux\/arm64/ {print $2}'); oc run arm --restart=Never --image=registry.access.redhat.com/ubi9/ubi-minimal@$ARM -- uname -m; oc wait --for=jsonpath='{.status.phase}'=Failed pod/arm --timeout=180s; oc get pod arm
    notice: |
      The pod table shows `Error`, with zero restarts, rather than `ImagePullBackOff`. That table alone does not
      identify the cause. Read the log next to find what failed during startup.
  - kind: try
    id: arm-log
    body: Print the log of the pod `arm`.
    accept:
    - oc logs arm
    - oc logs pod/arm
    - oc logs po/arm
    hints:
    - match: ^oc describe
      say: '`describe` shows the pod''s events, which only say that the container started. What the container itself printed is in its log: `oc logs`.'
    - match: ^oc get events
      say: 'The events say the container started. What the container printed when it failed is in its log: `oc logs`.'
    - match: ^oc logs$
      say: 'Name the pod: `arm`.'
    hint: '`oc logs`, then the pod''s name.'
    run: oc logs arm
    then: |
      The container could not execute its program: `Exec format error`. The binary was built for another architecture than the node's.
  - kind: ask
    id: exec-format
    prompt: This deliberately selected arm64 image fails on an amd64 node with the log below. What should you compare first?
    evidence: |
      exec container process `/usr/bin/uname`: Exec format error
    choices:
    - text: The image's platforms and node architecture
      why: This example deliberately chose arm64 for amd64 nodes. More generally, `Exec format error` means an executable
        format problem; inspect architecture and scripts before concluding the cause.
    - text: The registry credentials and their expiry time
      why: The log shows an attempt to execute `/usr/bin/uname`, so the pull succeeded. Invalid pull credentials would prevent
        reaching this stage.
    - text: The node's available disk and eviction thresholds
      why: Low disk space can prevent pulls or cause eviction, but this log points to executing the program. Start with the
        image and its executable.
    answer: 0
  - kind: teach
    id: node-view
    title: The node's own image store (administrators)
    body: |
      Pod events say what the kubelet decided. The node's store says what it holds. A cluster administrator reads it
      with a **debug pod**: `oc debug node/crc` starts a privileged pod on the node with the node's root file system
      at `/host`, and `chroot /host` runs the node's own tools. **crictl** is a client for the Container Runtime
      Interface (CRI), the API the kubelet uses to ask CRI-O to run containers and manage images.

      The administrator first creates a namespace for the debug pods (`node-debug-ns.yaml`: privileged for Pod
      Security, the way `oc debug` prepares its own temporary namespaces) and names it with `--to-namespace`.
      `--image-stream=openshift/cli:latest` picks a debug image that this node already holds: the default one would
      be pulled first, on a node with little disk to spare. Every command on the node only reads.
  - kind: show
    id: node-ns
    run: oc create -f node-debug-ns.yaml
    notice: The namespace exists. Each debug pod below is created in it, and removed by `oc` when its command ends.
  - kind: try
    id: node-images
    body: In the administrator's terminal, list the images in the store of node `crc` with `crictl`, from a debug pod.
    accept:
    - oc debug node/crc -- chroot /host crictl images
    - oc debug node/crc --to-namespace=academy-x-img-debug -- chroot /host crictl images
    - oc debug node/crc --image-stream=openshift/cli:latest -- chroot /host crictl images
    - oc debug node/crc --to-namespace=academy-x-img-debug --image-stream=openshift/cli:latest -- chroot /host crictl images
    hints:
    - match: ^oc debug crc
      say: 'A node is named with its kind: `oc debug node/crc`.'
    - match: ^(ssh|crictl)
      say: These nodes are reached through the API, not over SSH. Start a debug pod on the node, `oc debug node/crc`, and run crictl from there.
    - match: '-- crictl'
      say: The debug pod's own file system is not the node's. Run `chroot /host` first, then the node's `crictl`.
    - match: crictl (ps|image )
      say: '`crictl ps` lists containers. The node''s images are `crictl images`.'
    hint: '`oc debug node/crc --`, then `chroot /host` and `crictl images`.'
    run: 'oc debug node/crc --to-namespace=academy-x-img-debug --image-stream=openshift/cli:latest -- chroot /host sh -c ''crictl images | grep -E "^IMAGE|ubi9/ubi-minimal"'''
    then: |
      The recording kept the header and the ubi-minimal lines with `grep`. The node holds three: `latest`, from the
      first pods; `9.5`, pulled when the Deployment `fixed` started, before its image was changed; and one whose tag
      is `<none>`. This listing prints no architecture, but that one is almost certainly the arm64 image of the pod
      `arm`, pulled by its digest only, so no tag names it (the other pull by digest named the amd64 image that
      `latest` already is). There is no `9.1`, which
      the policy `Never` refused to pull, and no `no-such-tag`, which the registry does not have. `IMAGE ID` is CRI-O's
      own identifier, not a registry digest. (`crictl images <name>` is not a repository filter: it resolves the name
      as an image, `:latest` when no tag is given, hence the `grep`.)
    understand:
      purpose: Lists the images that the node's container runtime holds, from a temporary debug pod on the node.
      parts:
        - text: crictl images
          means: Lists the images in the store of the node's container runtime, CRI-O.
        - text: sh -c 'crictl images | grep -E "^IMAGE|ubi9/ubi-minimal"'
          means: Runs the whole pipeline on the node, so only the matching lines come back. A `| grep` outside the quotes
            would filter on your machine instead, with the same result.
        - text: grep -E "^IMAGE|ubi9/ubi-minimal"
          means: Keeps the header line (it starts with `IMAGE`) and the lines that mention `ubi9/ubi-minimal`; `-E`
            lets `|` mean "or".
      caution: The debug pod is privileged on the node; reading the image list changes nothing, but other `crictl` commands
        (such as `rmi`) do.
      concepts:
        - container.images
        - k8s.architecture
      refs:
        - title: 'Kubernetes: Debugging Kubernetes nodes with crictl'
          url: https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
        - title: 'OpenShift 4.21: Troubleshooting (debug pods on nodes)'
          url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/troubleshooting
  - kind: show
    id: node-inspecti
    body: '`crictl inspecti` prints CRI-O''s record of one image as JSON. With `-o go-template`, the recording keeps four fields: the names, the digests, the size and the architecture:'
    run: 'oc debug node/crc --to-namespace=academy-x-img-debug --image-stream=openshift/cli:latest -- chroot /host crictl inspecti -o go-template --template ''{{range .status.repoTags}}tag    {{.}}{{"\n"}}{{end}}{{range .status.repoDigests}}digest {{.}}{{"\n"}}{{end}}size   {{.status.size}}{{"\n"}}arch   {{.info.imageSpec.architecture}}{{"\n"}}'' registry.access.redhat.com/ubi9/ubi-minimal:latest'
    notice: |
      CRI-O knows this image by its tag and by two digests: `c2fcb…`, the amd64 manifest, which is the `imageID` the
      pod reported, and `c4c285…`, the multi-architecture index that the tag points to (the `Manifest List` digest in
      [Images on the platform](/lesson/ct.openshift-images)). The size, 108819904 bytes, is the `Image size` of the
      first pull event.
  - kind: show
    id: node-cleanup
    body: 'No debug pod is left in the namespace, and the namespace goes:'
    run: oc get pods -n academy-x-img-debug; oc delete namespace academy-x-img-debug
    notice: Nothing on the node was changed, and nothing is left of the debug sessions.
  - kind: order
    id: order-start
    prompt: A pod is scheduled on a node that has never run its image. Put what the node does in order.
    items:
    - The kubelet reads the pull policy and the pod's credentials
    - CRI-O resolves the tag to a digest at the registry
    - CRI-O downloads the layers the node does not have
    - The kubelet starts the container from the stored image
    why: The kubelet decides and gathers the credentials, CRI-O does the registry work, and only then does the container start. On a node that already holds the image under an `IfNotPresent` policy, the middle two steps are skipped.
  - kind: reflect
    id: explain-slow
    prompt: A developer asks why their pod took four minutes to start on one node and two seconds on another, with the same image. Explain what the nodes do.
    model: |
      Each node has its own store. With `IfNotPresent`, a node that has the image can start without a registry pull;
      with `Always`, it still resolves the reference but can reuse layers. A node missing layers must download them,
      which can take time. Pull queues and network conditions can also affect timing. Events distinguish a pull from
      an already-present image, but do not prove how many bytes were downloaded. Garbage collection can remove unused
      images, so a node that once held an image may need it again.
  - kind: teach
    id: what-next
    title: What you can do now
    body: |
      You can read what a node does with an image from a pod's events, say when a pull happens and when it does not,
      recognise `ErrImageNeverPull`, `manifest unknown` and `exec format error` from their evidence, tell where a
      node stores images and when it removes them, and, as an administrator, read a node's image store, its kubelet
      settings and its disk usage without changing anything.

      With this lesson, the images part of the application track is complete. The incident
      [ImagePullBackOff on a new deployment](/lab/inc.imagepull) asks you to read a pull failure from its events and
      repair it with no guidance. The next lesson, [Rollout strategies and change control](/lesson/g.rollouts-change),
      builds on it: how to change what runs without breaking the application.
  sections:
  - id: podman-pull
    title: The same decisions with Podman
    depth: true
    body: |
      `podman run --pull` takes almost the same choices as `imagePullPolicy`:

      | Kubernetes | Podman | Behaviour |
      |---|---|---|
      | `IfNotPresent` | `--pull=missing` (the default) | pull only when no local image has that name |
      | `Always` | `--pull=always` | resolve at the registry every time; reuse unchanged layers |
      | `Never` | `--pull=never` | use the local store or fail (`image not known`) |
      | none | `--pull=newer` | pull only if the registry has a newer image |

      A failed pull gives `ErrImagePull`, then `ImagePullBackOff` with retries spaced further and further apart, up to
      300 seconds. OpenShift lets a node pull in parallel by default (`serializeImagePulls: false`), and administrators
      can cap it with `maxParallelImagePulls`.
  - id: gc-settings
    title: Garbage collection settings
    depth: true
    body: |
      | Setting (KubeletConfiguration) | Default | Meaning |
      |---|---|---|
      | `imageGCHighThresholdPercent` | 85 | above this disk usage, collection starts |
      | `imageGCLowThresholdPercent` | 80 | it deletes until usage falls to this |
      | `imageMinimumGCAge` | 2m | an unused image younger than this is kept |
      | `imageMaximumGCAge` | off | Kubernetes 1.30+ (beta): delete images unused for this long, whatever the disk usage |

      On OpenShift you do not edit the kubelet's file. An administrator creates a **KubeletConfig** object
      (`machineconfiguration.openshift.io/v1`) whose `machineConfigPoolSelector` picks the pool and whose `kubeletConfig`
      sets fields such as `imageGCHighThresholdPercent` or `evictionHard`; the Machine Config Operator then updates the
      nodes, rebooting them one by one.
  - id: crictl-table
    title: crictl commands
    depth: true
    body: |
      | Command (in the chroot) | Shows |
      |---|---|
      | `crictl images` | images in the node's store: repository, tag, image ID, size (`crictl images <image>` shows one image, `:latest` when no tag is given; filter the full list to see every tag of a repository) |
      | `crictl images --digests` | the same with digests |
      | `crictl inspecti <image>` | the runtime's record of one image: digests, size, user, and more with `-o json` |
      | `crictl ps` / `crictl ps -a` | running containers / all containers, with the image each one uses |
      | `crictl imagefsinfo` | the image file system's usage |
      | `crictl pull <image>` | pulls into the node's store directly |

      Everything except the last is read-only. `crictl pull` asks CRI-O to pull without the kubelet: no pod exists, so no
      `imagePullSecrets` apply, and a private registry needs `--creds USER[:PASSWORD]` or `--auth` on the command line
      (or credentials CRI-O already has at node level). Afterwards the image is "present" for every `IfNotPresent` pod
      on that node, which can make one node behave differently from the others. `crictl rmi <name:tag>` asks CRI-O to
      remove that name: CRI-O untags it and deletes the image only when no other tag remains (crictl may still warn
      that all tags will be deleted). `crictl rmi <image-id>` removes the image with all its tags.
  - id: works-on-my-laptop
    title: '"It works on my laptop": a diagnosis order'
    depth: true
    body: |
      Work from the cheapest check to the most expensive, using what the pod's events and status tell you.

      | Check | Evidence | Typical finding |
      |---|---|---|
      | 1. Same reference? | the `image:` in the pod spec vs what you ran; a short name locally? | your laptop resolved a short name through an alias; the node needs the full name |
      | 2. Same bytes? | the pod's `imageID` vs the platform manifest's digest (`skopeo inspect --raw` or `oc image info` separates an index from its per-platform manifests) | a moved tag, `IfNotPresent` and a stale cache |
      | 3. Right architecture? | `skopeo inspect --raw` lists platforms; the container log says `exec format error` | single-arch image built for arm64, nodes are amd64 |
      | 4. Can the node reach the registry? | event: `no such host`, `i/o timeout`, `connection refused` | proxy, firewall, DNS, registry not in `allowedRegistries` |
      | 5. Can the node authenticate? | event: `unauthorized`, `authentication required` | your `auth.json` is not the pod's pull secret; secret not linked |
      | 6. Is a mirror in the way? | the cluster's ImageDigestMirrorSet / ImageTagMirrorSet | mirror lacks the image, or a tag reference meets a digest-only mirror |
      | 7. Does it run as OpenShift runs it? | `CrashLoopBackOff`, `Permission denied` in logs | root-only image under an arbitrary UID ([security contexts](/lesson/a.container-security)) |

      For the architecture, the fix is never on the node: build for the nodes' architecture (`--platform`, see
      [Building your own image](/lesson/ct.build-images)), or publish a multi-arch index.
  - id: what-goes-wrong
    title: What goes wrong, and how to see it
    depth: true
    body: |
      | Symptom | Evidence | Cause | Fix |
      |---|---|---|---|
      | `ContainerCreating` for minutes on one node only | events: `Pulling image` with no `Pulled` yet; the image size | first pull of a large image on that node | smaller images, a closer mirror, pre-pull with a DaemonSet if justified |
      | `ErrImageNeverPull` | the container's `imagePullPolicy: Never` | image not on that node | use `IfNotPresent` or make the image available |
      | pods evicted, node `DiskPressure` | `oc describe node <node>`: conditions, taints, events | disk filled by images, logs or `emptyDir` | the platform team frees space or tunes GC and eviction; set ephemeral-storage limits |
      | a pod starts on node A, fails to pull on node B | events per pod; `imageID` | A had the image cached (perhaps pulled by hand), B must really pull | fix credentials or access; do not rely on caches |
      | `exec format error` right after start | container logs; platforms from `skopeo inspect --raw` | wrong architecture | rebuild or publish a multi-arch index |
      | same tag, different behaviour across pods | `status.containerStatuses[].imageID` differs | moved tag + `IfNotPresent` | deploy by digest or with an image trigger |
  - id: common-mistakes
    title: Common mistakes
    depth: true
    body: |
      - **Fixing a pull problem by pulling on the node.** It hides the cause on one node and leaves the rest broken.
      - **Assuming images stay cached.** Garbage collection removes unused images; plan for re-pulls.
      - **Reading `Always` as "download everything".** Unchanged layers are reused; only the registry round trip is
        guaranteed.
      - **Treating the cache as access control.** With `IfNotPresent`, a pod without credentials can start from an image
        another pod pulled with credentials. Kubernetes 1.34 has only an alpha fix (`KubeletEnsureSecretPulledImages`);
        multi-tenant clusters use the `AlwaysPullImages` admission plugin or separate nodes.
      - **Testing only on your own architecture.** Inspect the platforms before you ship.
  review:
  - q: Which component pulls images on an OpenShift node, and who asks it to?
    a: CRI-O pulls, through the CRI image service, when the kubelet asks while starting a pod's containers.
  - q: What does a node do when a pod's image, under IfNotPresent, is already in its store?
    a: 'It starts the container without contacting the registry: the event says the image is already present on the machine. For a digest, that is exactly the right bytes.'
  - q: What is the default imagePullPolicy, and when is it decided?
    a: Always for the tag latest or no tag, IfNotPresent for any other tag or a digest. It is written into the template when the object is created and is not recomputed when the image changes.
  - q: Where do you find the digest a container really started from?
    a: In the pod's status.containerStatuses[].imageID.
  - q: Where does CRI-O store images on an RHCOS node, and where does rootless Podman store them?
    a: /var/lib/containers/storage (overlay) on the node; ~/.local/share/containers/storage for rootless Podman.
  - q: What are the default image garbage collection thresholds?
    a: At 85% image filesystem usage, try to delete eligible unused images toward 80%; recently detected images are kept for at least 2 minutes. Eviction thresholds are checked separately.
  - q: How do you change kubelet garbage collection settings on OpenShift?
    a: With a KubeletConfig object selecting a machine config pool; the Machine Config Operator rolls it out, rebooting nodes one by one.
  - q: Why is crictl pull a poor fix for ImagePullBackOff?
    a: It fills one node's cache without the pod's credentials being fixed; other nodes, and the same node after garbage collection, still fail.
  - q: What do ErrImageNeverPull, manifest unknown and exec format error each mean?
    a: Policy Never and the image is not on the node; the registry has no such tag; the executable has an incompatible format, often a CPU architecture mismatch, as in this example.
  labs: [inc.imagepull]
  limits: OpenShift Local has one node, so the lesson cannot show two nodes holding different images under one tag; it shows one node's store instead. The node was only read (crictl images and inspecti, the kubelet's configz and statistics); no KubeletConfig was created, because it rolls out to the nodes through the Machine Config Operator with a reboot, and crictl pull and rmi were not run. The debug image was taken from the openshift/cli image stream, already on the node, to avoid pulling the default debug image on a node close to its disk eviction threshold. Podman outputs are from a RHEL 9 workstation.
  enterprise: Platform teams size node disks for image churn, keep images small with shared base layers, mirror registries close to clusters, alert on DiskPressure and image pull latency, and forbid manual changes on nodes; node-level investigation goes through audited debug pods.
  references:
  - title: 'Kubernetes: Images (pull policy, ImagePullBackOff, pre-pulled image credentials)'
    url: https://v1-34.docs.kubernetes.io/docs/concepts/containers/images/
  - title: 'Kubernetes: Garbage collection (container images)'
    url: https://v1-34.docs.kubernetes.io/docs/concepts/architecture/garbage-collection/
  - title: 'Kubernetes: Node-pressure eviction'
    url: https://v1-34.docs.kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/
  - title: 'Kubernetes: Debugging Kubernetes nodes with crictl'
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
  - title: crictl user guide (cri-tools)
    url: https://github.com/kubernetes-sigs/cri-tools/blob/master/docs/crictl.md
  - title: 'OpenShift 4.21: Working with nodes (garbage collection, KubeletConfig, parallel image pulls)'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/nodes/working-with-nodes
  - title: 'OpenShift 4.21: Troubleshooting (debug pods, chroot /host)'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/troubleshooting
  - title: 'podman-run(1): --pull'
    url: https://docs.podman.io/en/latest/markdown/podman-run.1.html
  - title: podman-image-prune(1)
    url: https://docs.podman.io/en/latest/markdown/podman-image-prune.1.html
  - title: podman-system-df(1)
    url: https://docs.podman.io/en/latest/markdown/podman-system-df.1.html
  - title: 'containers/image storage destination: how layer IDs are derived'
    url: https://github.com/containers/container-libs/blob/main/image/storage/storage_dest.go
  commands:
  - cmd: oc run pull-latest --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc wait --for=condition=Ready pod/pull-latest --timeout=180s; oc get events --field-selector involvedObject.name=pull-latest
    as: developer
    meaning: 'a pod from the :latest tag: its events show the pull'
    timeout: 240
  - cmd: 'oc get pod pull-latest -o jsonpath=''{.spec.containers[0].image}{"\n"}{.status.containerStatuses[0].imageID}{"\n"}'' | sed ''s/^[^ ]*@/digest: /'''
    as: developer
    meaning: the image the pod asked for, and the digest the node actually started
  - cmd: DIGEST=$(oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest --filter-by-os=linux/amd64 | awk '/^Digest:/ {print $2}'); oc run pull-digest --image=registry.access.redhat.com/ubi9/ubi-minimal@$DIGEST -- sleep infinity; oc wait --for=condition=Ready pod/pull-digest --timeout=180s; oc get events --field-selector involvedObject.name=pull-digest
    as: developer
    meaning: 'a second pod, pinned by that digest, on the same node: the image is already there'
    timeout: 240
  - cmd: oc get pods -o custom-columns=NAME:.metadata.name,POLICY:.spec.containers[0].imagePullPolicy
    as: developer
    meaning: 'the pull policy each pod got: Always for the :latest tag, IfNotPresent for the digest'
  - cmd: oc create deployment fixed --image=registry.access.redhat.com/ubi9/ubi-minimal:9.5 -- sleep infinity; oc get deployment fixed -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}{"\n"}'; oc set image deployment/fixed ubi-minimal=registry.access.redhat.com/ubi9/ubi-minimal:latest; oc get deployment fixed -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].imagePullPolicy}{"\n"}'
    as: developer
    meaning: the default pull policy is written when the Deployment is created and stays when the image changes
    timeout: 240
  - cmd: oc run never --image=registry.access.redhat.com/ubi9/ubi-minimal:9.1 --image-pull-policy=Never -- sleep infinity; sleep 8; oc get pod never; oc get events --field-selector involvedObject.name=never,type=Warning
    as: developer
    meaning: 'pull policy Never with an image the node does not have: ErrImageNeverPull'
  - cmd: oc run bad-tag --image=registry.access.redhat.com/ubi9/ubi-minimal:no-such-tag -- sleep infinity; sleep 15; oc get pod bad-tag; oc get events --field-selector involvedObject.name=bad-tag,type=Warning
    as: developer
    meaning: 'a tag that does not exist: the registry''s answer is in the event'
    timeout: 240
  - cmd: ARM=$(oc image info registry.access.redhat.com/ubi9/ubi-minimal:latest 2>&1 | awk '/linux\/arm64/ {print $2}'); oc run arm --restart=Never --image=registry.access.redhat.com/ubi9/ubi-minimal@$ARM -- uname -m; oc wait --for=jsonpath='{.status.phase}'=Failed pod/arm --timeout=180s; oc get pod arm
    as: developer
    meaning: 'an image for another architecture: it is pulled, started, and fails'
    timeout: 300
  - cmd: oc logs arm
    as: developer
    meaning: 'what the container said: exec format error'
    expect: ok
  - cmd: oc get --raw /api/v1/nodes/crc/proxy/configz | jq '.kubeletconfig | {imageGCHighThresholdPercent, imageGCLowThresholdPercent, imageMinimumGCAge, imageMaximumGCAge, evictionHard}'
    as: admin
    meaning: the kubelet's image garbage collection and eviction settings, read from the node
  - cmd: oc get --raw /api/v1/nodes/crc/proxy/stats/summary | jq '.node | {capacity_GiB:(.fs.capacityBytes/1073741824*10|round/10), available_GiB:(.fs.availableBytes/1073741824*10|round/10), available_percent:(.fs.availableBytes*1000/.fs.capacityBytes|round/10), imagefs_available_GiB:(.runtime.imageFs.availableBytes/1073741824*10|round/10)}'
    as: admin
    meaning: how full the node's file system is
  - cmd: oc create -f node-debug-ns.yaml
    as: admin
    meaning: a namespace for the debug pods, privileged for Pod Security
  - cmd: 'oc debug node/crc --to-namespace=academy-x-img-debug --image-stream=openshift/cli:latest -- chroot /host sh -c ''crictl images | grep -E "^IMAGE|ubi9/ubi-minimal"'''
    as: admin
    timeout: 240
    meaning: the ubi-minimal images in the node's store (crictl images, kept to that repository by grep)
  - cmd: 'oc debug node/crc --to-namespace=academy-x-img-debug --image-stream=openshift/cli:latest -- chroot /host crictl inspecti -o go-template --template ''{{range .status.repoTags}}tag    {{.}}{{"\n"}}{{end}}{{range .status.repoDigests}}digest {{.}}{{"\n"}}{{end}}size   {{.status.size}}{{"\n"}}arch   {{.info.imageSpec.architecture}}{{"\n"}}'' registry.access.redhat.com/ubi9/ubi-minimal:latest'
    as: admin
    timeout: 240
    meaning: CRI-O's record of one image
  - cmd: oc get pods -n academy-x-img-debug; oc delete namespace academy-x-img-debug
    as: admin
    timeout: 240
    meaning: no debug pod left; the namespace is removed
  - cmd: podman info --format 'driver={{.Store.GraphDriverName}} root={{.Store.GraphRoot}}'
    as: developer
    meaning: 'your image store: the overlay driver and the rootless location (a node uses /var/lib/containers/storage)'
  - cmd: podman pull -q registry.access.redhat.com/ubi9/ubi-minimal:latest >/dev/null && podman image inspect --format 'layers={{len .RootFS.Layers}} dir={{.GraphDriver.Data.UpperDir}}' registry.access.redhat.com/ubi9/ubi-minimal:latest
    as: developer
    meaning: the unpacked layer's directory, named after the layer's uncompressed digest
  - cmd: podman system df
    as: developer
    meaning: space used by images, containers and volumes, and how much could be reclaimed
  - cmd: podman build -q --build-arg RELEASE=1 -t localhost/academy-node:latest . && podman build -q --build-arg RELEASE=2 -t localhost/academy-node:latest .
    as: developer
    meaning: build the Containerfile below twice under the same tag; the tag moves to the second image
  - cmd: podman images --filter label=academy.demo=images-on-nodes --format '{{.Repository}}:{{.Tag}} {{.ID}} dangling={{.Dangling}}'
    as: developer
    meaning: 'the first build lost its name: a dangling <none>:<none> image'
  - cmd: podman image prune -f --filter label=academy.demo=images-on-nodes
    as: developer
    meaning: remove dangling images, limited by label to this lesson's image; prints what was deleted
  - cmd: podman rmi localhost/academy-node:latest > /dev/null && podman images -a --filter label=academy.demo=images-on-nodes --format '{{.ID}}' | wc -l
    as: developer
    meaning: 'clean up: no image with the lesson''s label is left (0)'
  files:
    Containerfile: |
      FROM registry.access.redhat.com/ubi9/ubi-minimal:latest
      LABEL academy.demo=images-on-nodes
      ARG RELEASE=1
      RUN echo "release $RELEASE" > /etc/academy-release
    node-debug-ns.yaml: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: academy-x-img-debug
        annotations:
          openshift.io/node-selector: ""
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
          security.openshift.io/scc.podSecurityLabelSync: "false"
  experiment:
    id: X-IMG-01
    objective: "Read a node's image store (crictl images, crictl inspecti), its kubelet garbage collection and eviction settings and its disk usage as the administrator, with the debug pods in a namespace the experiment creates and deletes, and prove that no debug namespace remains and the node's configuration is unchanged."
    changes:
      - "Namespace academy-x-img-debug, labelled privileged for Pod Security, with debug pods crc-debug-* removed by oc when their command ended (created, deleted); on node crc only crictl images and crictl inspecti ran"
      - "Project academy-lesson-ct-images-on-nodes, the developer's temporary project, with pods and a Deployment pulling small ubi-minimal images (deleted by the rollback)"
    preflight:
      - cmd: |-
          found=$(oc get namespace academy-x-img-debug --ignore-not-found -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=30s"}
    snapshot:
      - "oc get namespace academy-x-img-debug --ignore-not-found -o name"
      - "oc get node crc -o jsonpath='{.metadata.annotations.machineconfiguration\\.openshift\\.io/currentConfig} {.metadata.annotations.machineconfiguration\\.openshift\\.io/desiredConfig} {.metadata.annotations.machineconfiguration\\.openshift\\.io/state} {.spec.unschedulable} {.spec.taints}'"
      - "oc get machineconfigs -o name"
    rollback:
      - "oc delete namespace academy-x-img-debug --ignore-not-found --wait=false"
      - "oc delete project academy-lesson-ct-images-on-nodes --ignore-not-found --wait=false"
    settle:
      - |-
        for i in $(seq 60); do
          a=$(oc get namespace academy-x-img-debug --ignore-not-found -o name) || exit 1
          b=$(oc get namespace academy-lesson-ct-images-on-nodes --ignore-not-found -o name) || exit 1
          test -z "$a$b" && exit 0
          sleep 5
        done
        exit 1
    verify:
      - cmd: |-
          found=$(oc get namespace academy-x-img-debug --ignore-not-found -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=60s"}
- id: c.projects-builds
  title: Projects, builds and ImageStreams
  module: a6-images-updates
  mode: REAL_LAB
  minutes: 45
  level: 2
  supports: OpenShift 4.21 project.openshift.io, build.openshift.io and image.openshift.io APIs, with oc 4.21.8. Recorded on OpenShift Local as an ordinary user, in a temporary project. Builds pull ubi-minimal from registry.access.redhat.com; build times and digests vary.
  concepts:
  - ocp.projects
  - ocp.imagestreams
  prerequisites:
  - c.openshift-extends
  - ct.openshift-images
  objective: |
    Say what a Project adds to a Namespace, read the RoleBindings a new project gets, describe a build with a
    BuildConfig, start a build and follow its log, run the result so that it follows the tag, find the cause of a
    failed build, and promote a tested image by moving a tag.
  record_on: cluster
  flow:
  - kind: ask
    id: recall-lookup
    recalls: ct.openshift-images
    prompt: 'A Deployment says `image: web:v2`, and the ImageStream `web` has that tag in the same project. The pods fail to pull. What is missing?'
    choices:
    - text: Image lookup, or an image trigger
      why: Lookup enabled on a stream or workload can resolve its short name during an API write. A trigger writes the stream
        reference into the Deployment and follows later changes.
    - text: The stream must be in the `openshift` project
      why: Lookup uses streams in the workload's own project. The shared `openshift` project is not required.
    - text: The tag must have been created by a build
      why: Imported and built images can both be referenced through an ImageStream tag. The node needs the tag to be resolved
        to a registry reference.
    answer: 0
  - kind: teach
    id: projects
    title: A place for the team
    body: |
      A new team needs a place on the cluster where its objects are grouped and it can control who may do what.

      Kubernetes provides a namespace. OpenShift adds a **Project** view and a **ProjectRequest** API. With the default
      project request template, a request creates a namespace, records the requester and binds the project `admin` role
      to that user. By default OAuth-authenticated users can request projects; administrators can restrict this or
      customize the template. A project alone does not isolate network traffic.

      The recording starts in a temporary project. It creates `academy-demo-shop` only to inspect project setup.
      `--skip-config-write` keeps the original project selected. All subsequent build commands and typed tasks use
      that original temporary project, not `academy-demo-shop`. Typed tasks compare commands; they do not run them.
  - kind: show
    id: new-project
    body: |
      Request a project called `academy-demo-shop`. The option `--skip-config-write` keeps your current project selected, instead of switching to the new one:
    run: oc new-project academy-demo-shop --skip-config-write; sleep 15
    notice: |
      The request was accepted. The project is empty, but OpenShift has already done some work on it. (The recording waited 15 seconds afterwards, for the platform to finish its setup.) Look at what it recorded.
  - kind: show
    id: describe-project
    run: oc describe project academy-demo-shop
    highlight:
    - openshift.io/requester
    notice: |
      The project is a namespace plus a few annotations. `openshift.io/requester` records who asked. The `sa.scc`
      annotations are ranges that the platform hands to the project's pods; the lesson on security contexts explains
      them later. The `pod-security` labels make the cluster warn about, and audit, pods that do not meet the
      `restricted` pod security level.
  - kind: teach
    id: roles
    title: Who may do what in the project
    body: |
      A **role** is a set of API permissions. A **RoleBinding** grants a role to users, groups or ServiceAccounts in
      one project. A ServiceAccount is the identity a pod runs as. This new project has four bindings:

      - `admin` grants the requester project administration.
      - `system:image-pullers` lets the project's ServiceAccounts pull its images.
      - `system:image-builders` lets `builder`, the ServiceAccount used by build pods, push images.
      - `system:deployers` grants permissions to `deployer`, used by older DeploymentConfig rollouts.

      Controllers create the last three shortly after project creation. The wide output option, `-o wide`, on
      `oc get rolebindings` includes the users, groups and ServiceAccounts each binding grants permissions to.
  - kind: try
    id: rolebindings
    body: List the RoleBindings of the project `academy-demo-shop`, with the users, groups and ServiceAccounts they are bound to.
    accept:
    - oc get rolebindings -o wide -n academy-demo-shop
    - oc get rolebindings -n academy-demo-shop -o wide
    - oc get rolebinding -o wide -n academy-demo-shop
    - oc get rolebinding -n academy-demo-shop -o wide
    - oc get rolebindings -o wide --namespace academy-demo-shop
    - oc get rolebindings -o wide --namespace=academy-demo-shop
    - oc get rolebindings -n academy-demo-shop -owide
    - oc get rolebindings -owide -n academy-demo-shop
    - oc get rolebindings -n academy-demo-shop -o=wide
    - oc get rolebindings -o=wide -n academy-demo-shop
    - oc get rolebindings -n=academy-demo-shop -o wide
    - oc get rolebindings -o wide -n=academy-demo-shop
    - oc get rolebinding -n academy-demo-shop -owide
    - oc get rolebinding -owide -n academy-demo-shop
    hints:
    - match: ^oc get rolebindings?( -n[= ]academy-demo-shop)?$
      say: 'That lists the bindings and their roles. The task also asks who each one is bound to: add `-o wide`.'
    - match: ^oc get (rolebindings?|rb) -o wide$
      say: 'The project is not the one you work in: add `-n academy-demo-shop`.'
    - match: clusterrolebinding
      say: ClusterRoleBindings apply across the cluster and an ordinary user may not list them. A project's own bindings are RoleBindings.
    - match: ^oc get project
      say: '`oc get project` shows the project itself. The bindings are separate objects: `rolebindings`.'
    hint: '`oc get rolebindings`, the option `-o wide` and `-n` with the project name.'
    run: oc get rolebindings -o wide -n academy-demo-shop
    then: |
      Four bindings. `admin` is bound to the user `developer`, who requested the project. The other three are bound to
      ServiceAccounts or to the group of all the project's ServiceAccounts.
  - kind: ask
    id: which-binding
    prompt: Which binding lets the build pods of this project push the image they build?
    evidence: |
      NAME                    ROLE                               AGE   USERS       GROUPS                                     SERVICEACCOUNTS
      admin                   ClusterRole/admin                  16s   developer
      system:deployers        ClusterRole/system:deployer        15s                                                          academy-demo-shop/deployer
      system:image-builders   ClusterRole/system:image-builder   15s                                                          academy-demo-shop/builder
      system:image-pullers    ClusterRole/system:image-puller    15s               system:serviceaccounts:academy-demo-shop
    choices:
    - text: '`system:image-builders`'
      why: It is bound to the `builder` ServiceAccount, which runs build pods and may push images to the project's streams.
    - text: '`system:image-pullers`'
      why: That binding lets the project's ServiceAccounts pull images. Pushing needs the builders' role.
    - text: '`admin`'
      why: '`admin` is bound to the person who requested the project. Build pods run as the `builder` ServiceAccount and receive their own, narrower role.'
    answer: 0
  - kind: teach
    id: buildconfig
    title: 'Builds: a recipe and its runs'
    body: |
      A **BuildConfig** describes where source comes from, how to build an image, and where to push it. Each run is a
      **Build**, executed in a **build pod** in the cluster. Common strategies are **Docker**, using Dockerfile
      instructions, and **Source-to-Image** (S2I), using a builder image that knows how to assemble application source.
      A Custom strategy is also available. Output can go to the integrated registry and an ImageStream tag, as in
      [Images on the platform](/lesson/ct.openshift-images).

      This recording uses Docker strategy and **binary input**, meaning source uploaded from your workstation for each
      build. It is not automatically fetched or retriggered when files change. The source is the lesson's own files
      (listed under "Before you start"), saved in one working folder: `Dockerfile`, the recipe, in the same
      instruction format as a Containerfile; `message.txt`, the file it copies; and `broken/Dockerfile`, used later.
      The upload sends the whole folder, so keep nothing else in it.
  - kind: show
    id: dockerfile
    code: |
      FROM registry.access.redhat.com/ubi9/ubi-minimal:latest
      COPY message.txt /message.txt
      CMD ["sh", "-c", "cat /message.txt; sleep infinity"]
    caption: Dockerfile in the practice directory; message.txt next to it holds the text version 1
    notice: |
      A three-line recipe: start from a base image, copy one file into it, and print that file when the container starts.
  - kind: show
    id: new-build
    body: '`oc new-build` creates the BuildConfig. `--binary` selects uploaded source; `--strategy=docker` selects Dockerfile
      instructions. The default recipe filename here is `Dockerfile`.'
    run: oc new-build --name=hello --binary --strategy=docker; oc get buildconfig,imagestream
    notice: |
      Two objects: the BuildConfig `hello`, with `LATEST 0` because no build has run, and the ImageStream `hello`, which
      has no tags yet. The output says where the result will go: the tag `hello:latest`.
  - kind: ask
    id: guess-where-build
    guess: true
    prompt: You run `oc start-build hello --from-dir=. --follow`. Where is the image built?
    choices:
    - text: In a build pod in the cluster
      why: '`oc start-build` only creates a Build object and uploads the directory. A build pod in the cluster does the work. The next step shows its log.'
    - text: On your machine, and the result is pushed
      why: Your machine sends the source and shows the log, but it builds nothing, and has no need of a container runtime. The next step shows where the log comes from.
    - text: In the pods of the Deployment that will run it
      why: Deployment pods only run images. A separate build pod produces them. The next step shows the build pod's log.
    answer: 0
  - kind: show
    id: start-build
    run: oc start-build hello --from-dir=. --follow --wait
    highlight:
    - STEP
    - Push successful
    notice: |
      The build pod's streamed log receives your directory, pulls the base image and executes the Dockerfile. Its
      three instructions become five logged steps: OpenShift appends ENV and LABEL metadata for the build name and
      namespace. The final push names `hello:latest` in the integrated registry and reports `Push successful`.
      `--follow` streams the log; `--wait` waits for the final build status.
    understand:
      purpose: Starts a build of the BuildConfig `hello` from the files in the current directory, shows its log as it
        runs, and ends with the build's result.
      parts:
        - text: --from-dir=.
          means: Archives the current directory and uploads it as the build's input (a binary build).
        - text: --follow
          means: Streams the build's log until the build completes or fails.
        - text: --wait
          means: Waits for the build to finish and exits with a non-zero status if it fails, which scripts can test.
      caution: 'The directory is uploaded to the cluster, except `.git` (the default of `--exclude`): keep credentials
        and unrelated files out of it.'
      concepts:
        - ocp.imagestreams
      refs:
        - title: 'OpenShift 4.21: Performing and configuring basic builds'
          url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/builds_using_buildconfig/basic-build-operations
        - title: OpenShift 4.21 CLI reference (oc start-build)
          url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-start-build
  - kind: teach
    id: phases
    title: The phases of a build
    body: |
      A Build moves through `New` (created), `Pending` (waiting for its pod to run), and `Running` (its pod is executing).
      Terminal phases are `Complete` (successful), `Failed` (the build ran but failed), `Error` (a problem prevented
      normal build execution), and `Cancelled` (the build was stopped).

      `Error` is not proof that no work ever started; inspect the reason, events and logs. In this lesson the output
      is configured to push to an ImageStream tag, so a successful build includes that push. `oc get builds` shows
      phases and, for the recorded failure, a reason in parentheses.
  - kind: show
    id: builds-istag
    run: oc get builds; oc get istag hello:latest
    notice: |
      `hello-1` is `Complete`. The tag `hello:latest` now points at the digest that the build pushed, in the integrated
      registry, under this project's name. Nobody imported anything: the build moved the tag.
  - kind: teach
    id: run-it
    title: Running what was built
    body: |
      An image in a stream is not yet a running application. `oc new-app` can create a Deployment from a stream tag:
      use `--image-stream=<stream>:<tag>` and optionally `--name=<application-name>`. It adds an image trigger on the
      tag, like the annotation in [Images on the platform](/lesson/ct.openshift-images).

      In the temporary recording project, `hello:latest` now exists from build 1. Its container prints the copied
      message and waits. The pod's log therefore identifies the source version built into the image: here, build 1's.
  - kind: try
    id: new-app
    body: Create an application named `hello` from the image stream tag `hello:latest`.
    accept:
    - oc new-app --image-stream=hello:latest --name=hello
    - oc new-app --image-stream=hello:latest
    - oc new-app --image-stream hello:latest --name hello
    - oc new-app --image-stream hello:latest
    - oc new-app -i hello:latest --name=hello
    - oc new-app -i hello:latest
    - oc new-app --name=hello --image-stream=hello:latest
    - oc new-app --name hello --image-stream hello:latest
    - oc new-app --image-stream=hello --name=hello
    - oc new-app --image-stream=hello
    - oc new-app hello:latest
    - oc new-app hello:latest --name=hello
    - oc new-app hello
    hints:
    - match: ^oc new-app$
      say: '`oc new-app` needs to know what to create it from. Name the stream tag: `--image-stream=hello:latest`.'
    - match: ^oc create deployment
      say: That works too, but then you would add the trigger yourself. `oc new-app --image-stream=…` creates the Deployment and the trigger together.
    - match: ^oc new-build
      say: '`new-build` makes a recipe. The task is to run the image that the build already produced: `oc new-app`.'
    - match: ^oc new-app --(docker-)?image[= ]
      say: '`--image` (formerly `--docker-image`) takes an image in a registry. The image here is in a stream of the project: `--image-stream=hello:latest`.'
    hint: '`oc new-app`, then `--image-stream=` with the stream and tag.'
    run: oc new-app --image-stream=hello:latest --name=hello; sleep 15; oc get deployment hello; oc logs deployment/hello
    then: |
      The Deployment runs the image that build 1 pushed, and its log prints the text of `message.txt`: version 1.
  - kind: show
    id: trigger
    run: oc get deployment hello -o jsonpath='{.metadata.annotations.image\.openshift\.io/triggers}{"\n"}'
    notice: |
      `oc new-app` added the trigger: the annotation names the stream tag `hello:latest` and the container whose image it
      will write. The Deployment follows the tag from now on.
  - kind: ask
    id: guess-second-build
    guess: true
    prompt: The source changes and a second build pushes to `hello:latest`. What happens to the running Deployment?
    choices:
    - text: The trigger rolls out the new image
      why: The trigger watches `hello:latest`. A build that moves the tag changes what the trigger writes into the pod template, and a template change rolls out. The next step shows it.
    - text: 'Nothing: the pods keep running the old image'
      why: That is what a Deployment with no trigger does. Here the trigger reacts to the tag. The next step shows it.
    - text: The Deployment must be updated by hand
      why: Updating by hand is the job the trigger replaces. The next step shows the Deployment change without anyone touching it.
    answer: 0
  - kind: show
    id: second-build
    body: |
      The recording changes `message.txt` to version 2, builds again, waits for the rollout, and compares the Deployment with the tag.
      The evidence for build 2 is the digest: this recording does not print the new pod's log.
    run: echo 'version 2' > message.txt; oc start-build hello --from-dir=. --follow --wait | tail -n 3; sleep 10; oc rollout status deployment/hello --timeout=240s | tail -n 1; oc get deployment hello -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'; oc get istag hello:latest -o jsonpath='{.image.dockerImageReference}{"\n"}'; oc rollout history deployment/hello
    highlight:
    - hello@sha256
    - REVISION
    notice: |
      The push reports a new digest. The Deployment's image and `hello:latest`, printed after the successful rollout,
      both name that same digest. The trigger updated the Deployment after build 2 without a manual image edit.

      The history table lists revisions 1, 2 and 3, with no change causes recorded. It does not display their saved
      image fields, so this output alone cannot establish what each older revision ran. When a trigger remains active,
      a direct Deployment rollback can be overwritten by its current tag. Move the approval tag back to withdraw an
      image through that trigger.
  - kind: ask
    id: failed-evidence
    prompt: A build ends `Failed`. Where would you look first for the cause?
    guess: true
    evidence: |
      NAME       TYPE     FROM     STATUS                       STARTED              DURATION
      hello-1    Docker   Binary   Complete                     7 minutes ago        2m22s
      hello-2    Docker   Binary   Complete                     4 minutes ago        2m14s
      broken-1   Docker   Binary   Failed (DockerBuildFailed)   About a minute ago   1m51s
    choices:
    - text: The log of the build
      why: 'A failed build ran and stopped on an error. Its log shows, at the last step, what failed and why: an instruction, a base image pull, or the push. The next steps show one.'
    - text: The events of the Deployment
      why: The Deployment never received a new image, because the build did not produce one. Its events say nothing about the build. The next steps show where the cause is.
    - text: The tags of the ImageStream
      why: Tags move only after a successful push, so they still show the previous good image. The next steps show where the cause is.
    answer: 0
  - kind: teach
    id: failures
    title: When a build fails
    body: |
      A build can fail for the same reasons as any `docker build` or `podman build`: a bad instruction, a missing
      package, a base image that cannot be pulled. The evidence is in the build's log, at the last step before the
      error, and `oc logs build/<name>` shows it again after the fact. The next build uploads only the subfolder
      `broken`, whose `Dockerfile` runs `microdnf install -y no-such-package`, a package that does not exist:
  - kind: show
    id: broken-build
    run: oc new-build --name=broken --binary --strategy=docker >/dev/null; oc start-build broken --from-dir=broken --follow --wait 2>&1 | tail -n 5; oc get builds
    highlight:
    - 'error:'
    - Failed
    notice: |
      The log reports `No package matches 'no-such-package'` and names the failing RUN instruction. The table confirms
      `broken-1` is `Failed (DockerBuildFailed)`, while `hello-1` and `hello-2` are `Complete`. This separate build has
      not replaced `hello:latest`.

      The recorded shell line itself exits zero because its final command lists builds successfully. That is not the
      build's outcome: use its phase and log to judge the failure.
  - kind: teach
    id: promote
    title: Build once, promote the digest
    body: |
      A **CI pipeline** is automation that builds and checks changes. Many teams use one to push images to an external
      registry such as Quay; others use in-cluster builds. Either way, build once and promote the tested digest.
      A rebuild can change content even from the same commit, because base images, dependencies or timestamps can change.

      In an ImageStream, `oc tag <source> <destination>` copies the digest the source names at that moment. It is a
      snapshot, not a following alias, which is what promotion needs: a stable name for the tested image. In production,
      select a recorded tested digest if another build could move `latest` during promotion. A cross-project tag does
      not copy layers or grant pull access; the consuming ServiceAccount still needs access to the source repository.
  - kind: try
    id: promote-tag
    body: The image behind `hello:latest` passed testing. Promote it in the same stream under a new tag, `prod`.
    accept:
    - oc tag hello:latest hello:prod
    - oc tag hello:latest hello:prod --alias=false
    - oc tag --alias=false hello:latest hello:prod
    hints:
    - match: ^oc tag hello:prod hello:latest
      say: 'The order is the source first, then the new tag: `oc tag <what it points at> <the new tag>`.'
    - match: ^oc (start-build|new-build)
      say: 'A build would produce a different image. Promotion points a tag at the image that was tested: `oc tag`.'
    - match: ^oc tag hello:latest$
      say: '`oc tag` needs a destination too: the new tag, `hello:prod`.'
    hint: '`oc tag`, then the tag that holds the tested image, then the new tag.'
    run: oc tag hello:latest hello:prod; sleep 3; oc get istag
    then: |
      Two tags, one digest: `hello:prod` points at exactly the image that `hello:latest` pointed at, and nothing was rebuilt.
  - kind: ask
    id: promote-choice
    prompt: Production must run exactly the image that passed testing in staging. Which approach fits?
    choices:
    - text: Promote the tested digest to the production stream
      why: A digest identifies the exact tested content. Keep that digest when promoting and ensure production can pull the
        source repository.
    - text: Rebuild the same commit with production configuration
      why: A rebuild can change base images, dependencies or metadata. Its result is not guaranteed to be the tested digest.
    - text: Use the mutable tag `app:latest` in both environments
      why: The tag may move between pulls. Sharing its spelling does not ensure both environments run the tested bytes.
    answer: 0
  - kind: order
    id: order-change
    prompt: For this binary build, a developer uploads changed source and starts a new build. Put the successful build-to-rollout
      steps in order.
    items:
    - A new build starts from the changed source
    - The build pod pushes the image and the tag moves
    - The trigger writes the new digest into the Deployment
    - The Deployment rolls out pods from the new image
    why: The developer must upload the source for each binary build; source edits alone trigger nothing. A successful push
      moves the tag, then the image trigger updates the Deployment template and starts a rollout.
  - kind: teach
    id: what-next
    title: What you can do now
    body: |
      You can create a project and read what the request set up, describe a build with a BuildConfig, start a build and
      follow its log, read the phases and the end states of builds, run a stream tag as an application that follows the
      tag, find the cause of a failed build, and promote an image by moving a tag.

      The next lesson, [Images on a node](/lesson/ct.images-on-nodes), follows an image the rest of the way: what a node
      does with it when a pod starts. The lab [Build and deploy an image](/lab/lab.images-builds) lets you do this chain
      on your own.
  sections:
  - id: terminating
    title: When a project will not go away
    depth: true
    body: |
      Deleting a project is asynchronous. The namespace goes `Terminating`, the namespace controller deletes
      everything inside it, and the namespace disappears once nothing is left. When it stays `Terminating`, its
      **status conditions** say why: `NamespaceContentRemaining` and `NamespaceFinalizersRemaining` name the kinds of
      objects still present and the finalizers holding them, and `NamespaceDeletionDiscoveryFailure` means an
      aggregated API (an APIService) is unavailable, so the controller cannot even list what to delete.

      Reading those conditions needs access to the namespace, and a normal user can lose it during deletion: the
      RoleBinding that gave them access is deleted with everything else. The project then vanishes from their list
      and their requests are refused, although it still exists. A user can lose access within seconds, while a
      cluster reader still sees the namespace `Terminating`, for example held by a finalizer. (This is described,
      not shown: the lesson's recording deletes its demonstration project without watching it go.)

      A finalizer is a promise that a controller cleans something up first (detach a volume, remove an external
      record). Deleting again with a zero grace period does not skip it. The fix is to let that controller finish:
      restore the missing APIService or operator, or resolve what it is waiting for. Removing a finalizer by hand
      makes the object disappear but abandons whatever was not cleaned up, so it is an administrator's last resort,
      after confirming that the controller is gone for good.
  - id: project-template
    title: Self-provisioning and the project template
    depth: true
    body: |
      Any user bound to the `self-provisioner` role may request a project. By default the `self-provisioners`
      ClusterRoleBinding grants it to the group `system:authenticated:oauth`, that is, everyone who logs in through
      the OAuth server. The API server processes the **project request template**: it creates the Namespace with the
      annotations `openshift.io/requester`, `openshift.io/display-name` and `openshift.io/description`, and a
      RoleBinding that gives the requester the `admin` role. `oc adm create-bootstrap-project-template -o yaml`
      prints the default template.

      A user can only list and read the projects where they have a role: `oc projects` as `developer` shows only
      their own. Administrators customize the template to add a default **LimitRange**, **ResourceQuota** and
      **NetworkPolicies** to every new project: guardrails by default. A template change applies only to projects
      created afterwards; existing projects must be updated separately. The default RoleBindings
      (`system:image-pullers`, `system:image-builders`, `system:deployers`) are created by controllers, which is
      why they appear a few seconds after the project; the [access analysis lesson](/lesson/l.access-paths)
      explains how to read them.
  - id: choosing
    title: Choosing how to produce and reference images
    depth: true
    body: |
      | Situation | Good fit | Why |
      |---|---|---|
      | developers push source, no Containerfile, a supported language | S2I BuildConfig | the builder image knows how to assemble the app |
      | the team owns a Containerfile and wants in-cluster builds | Docker-strategy BuildConfig | same file locally and in the cluster |
      | builds must be scanned, signed and promoted across clusters | CI pipeline pushing to an external registry | one build, the same digest in every environment, no build pods on runtime clusters |
      | several Deployments must follow "the current approved image" | ImageStream tag + image trigger | moving one tag rolls every consumer, each pinned to a digest |
      | a Deployment should keep exactly what was tested | a digest (`image@sha256:…`) in the Deployment | nothing moves unless someone changes the spec |

      Depending on source type, builds can start from Git webhooks, image changes, config changes or manual requests.
      Binary builds require a fresh upload with each start and cannot be triggered automatically. The Jenkins Pipeline build
      strategy is deprecated in favour of OpenShift Pipelines. The samples in the `openshift` project (httpd, nginx,
      python and others) are ImageStreams.
  - id: what-goes-wrong
    title: When a build or an image reference fails
    depth: true
    body: |
      | Symptom | Evidence | Likely cause | Fix |
      |---|---|---|---|
      | build stays `New` or `Pending` | `oc describe build <name>`, events in the project | the build pod cannot be scheduled (quota, limits) or its builder image cannot be pulled | adjust the quota or resources, fix the builder image reference |
      | build `Failed` | `oc logs build/<name>`: the last STEP before the error | an error in the Containerfile or source, a base image that cannot be pulled, a failed test | fix the source and start a new build |
      | build `Failed` at the push | the end of the log | the output ImageStream is in a project the build's ServiceAccount cannot push to | grant push on that project (see the image access lesson) or push to the build's own project |
      | pods `ImagePullBackOff` with `image: web:v2` | `oc get pods`, the pod's events | the node looked for an image literally named `web:v2`: no image lookup or trigger resolving the short name | enable image lookup on the stream or workload, or add a trigger |
      | new upstream image never arrives | `oc get istag <name>:<tag>` keeps the same digest | imported once, no scheduled import | re-import, or enable scheduled import if that is the intended behaviour |

      Pull failures from another project's ImageStream are an authorization question; [the image access
      lesson](/lesson/l.image-pullers) covers them. For general pull failures, practise with [the ImagePullBackOff
      incident](/lab/inc.imagepull).
  - id: common-mistakes
    title: Common mistakes
    depth: true
    body: |
      - **Recreating a project right after deleting it.** Deletion is asynchronous: the namespace stays
        `Terminating` while its content is removed, and the name is unavailable until it is gone.
      - **Thinking an ImageStream holds the image.** Deleting a tag removes a pointer, not necessarily the layers;
        pruning the registry is a separate administrative task.
      - **Assuming an ImageStream tag follows its external source.** Without scheduled import it keeps the digest it
        imported, which is often what you want, but surprising if you expected updates.
      - **Rebuilding per environment.** Building again for production can produce a different digest from the one that
        was tested; promote the tested digest instead.
  review:
  - q: What does OpenShift do when a user requests a new project?
    a: 'Processes the project request template: creates the namespace with requester, display name and description annotations, and binds the admin role to the requester.'
  - q: Which RoleBinding lets a project's build pods push images, and which lets its ServiceAccounts pull them?
    a: '`system:image-builders` (the `builder` ServiceAccount) and `system:image-pullers`.'
  - q: What are a BuildConfig, a Build and a build pod?
    a: The recipe, one run of it, and the pod in the cluster that executes the run.
  - q: What are the phases of a Build?
    a: New, Pending, Running, then Complete, Failed (it ran and failed), Error (normal execution was prevented; inspect reason, events and logs) or Cancelled.
  - q: What does an ImageStream tag record, and what moves it after a build?
    a: The image digest the tag points to (with history). A successful build pushes the image and moves the tag.
  - q: A build ends Failed. Where is the cause?
    a: 'In the build log, at the last STEP before the error: `oc logs build/<name>`.'
  - q: How do you make production run exactly the image that passed testing?
    a: 'Promote the tested digest: tag it into production''s stream (`oc tag`), or deploy by digest. Do not rebuild.'
  - q: Which namespace conditions explain a project stuck in Terminating?
    a: NamespaceContentRemaining, NamespaceFinalizersRemaining and NamespaceDeletionDiscoveryFailure (also NamespaceDeletionContentFailure when deleting some content fails).
  labs:
  - lab.images-builds
  enterprise: Project onboarding (template, quotas, network isolation, RBAC groups) is a core platform-team service. Deciding whether builds happen in-cluster or in CI is an architecture decision with security consequences.
  references:
  - title: 'Kubernetes: Finalizers'
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/
  - title: 'OpenShift 4.21: Using image streams with Kubernetes resources'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/using-imagestreams-with-kube-resources
  - title: 'OpenShift 4.21: Working with projects'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/projects
  - title: 'OpenShift 4.21: Builds using BuildConfig'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/builds_using_buildconfig/index
  - title: 'OpenShift 4.21: Performing and configuring basic builds'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/builds_using_buildconfig/basic-build-operations
  - title: 'OpenShift 4.21: Managing image streams'
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/images/managing-image-streams
  - title: 'OpenShift API: build phases (build.openshift.io/v1 types)'
    url: https://github.com/openshift/api/blob/master/build/v1/types.go
  - title: 'Kubernetes 1.34 API source: namespace condition types'
    url: https://github.com/kubernetes/api/blob/release-1.34/core/v1/types.go
  commands:
  - cmd: oc new-project academy-demo-shop --skip-config-write; sleep 15
    meaning: a new project, requested as an ordinary user; --skip-config-write keeps the recording in its own project
  - cmd: oc describe project academy-demo-shop
    meaning: 'the namespace behind the project: requester, display name, and the ranges for pod security'
  - cmd: oc get rolebindings -o wide -n academy-demo-shop
    meaning: the RoleBindings the project request created, with who each one is bound to
  - cmd: oc delete project academy-demo-shop --wait=false
    meaning: clean up the demonstration project (not shown in the lesson)
  - cmd: oc new-build --name=hello --binary --strategy=docker; oc get buildconfig,imagestream
    meaning: 'a binary Docker build: a BuildConfig, and the ImageStream its result will be pushed to'
  - cmd: oc start-build hello --from-dir=. --follow --wait
    meaning: start the first build from this directory and follow its log until it ends
    timeout: 600
  - cmd: oc get builds; oc get istag hello:latest
    meaning: the build is Complete and the tag points at the digest that was pushed
  - cmd: oc new-app --image-stream=hello:latest --name=hello; sleep 15; oc get deployment hello; oc logs deployment/hello
    meaning: 'an application from the stream tag: a Deployment with an image trigger; its container prints the file''s text'
  - cmd: oc get deployment hello -o jsonpath='{.metadata.annotations.image\.openshift\.io/triggers}{"\n"}'
    meaning: the trigger new-app added to the Deployment
  - cmd: echo 'version 2' > message.txt; oc start-build hello --from-dir=. --follow --wait | tail -n 3; sleep 10; oc rollout status deployment/hello --timeout=240s | tail -n 1; oc get deployment hello -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'; oc get istag hello:latest -o jsonpath='{.image.dockerImageReference}{"\n"}'; oc rollout history deployment/hello
    meaning: 'change the source, build again: the tag moves, the trigger rolls the Deployment out'
    timeout: 600
  - cmd: oc new-build --name=broken --binary --strategy=docker >/dev/null; oc start-build broken --from-dir=broken --follow --wait 2>&1 | tail -n 5; oc get builds
    meaning: 'a build that fails: the end of its log, and the phase it ends in'
    timeout: 600
  - cmd: oc tag hello:latest hello:prod; sleep 3; oc get istag
    meaning: 'promotion: a second tag pointing at the tested image'
    expect: ok
  files:
    Dockerfile: |
      FROM registry.access.redhat.com/ubi9/ubi-minimal:latest
      COPY message.txt /message.txt
      CMD ["sh", "-c", "cat /message.txt; sleep infinity"]
    message.txt: |
      version 1
    broken/Dockerfile: |
      FROM registry.access.redhat.com/ubi9/ubi-minimal:latest
      RUN microdnf install -y no-such-package
- id: e.storage
  title: Volumes, claims, StorageClasses and CSI
  module: a4-config-storage
  mode: REAL_LAB
  minutes: 55
  level: 2
  supports: 'Kubernetes 1.34 PV/PVC/StorageClass on OpenShift 4.21 with oc 4.21.8. Recorded on OpenShift Local 4.21 by the ordinary user developer, in a temporary project, and by the cluster administrator kubeadmin, who read the volumes, read the retained file on the node through oc debug node, and reclaimed the volume. OpenShift Local has one StorageClass, crc-csi-hostpath-provisioner (default, provisioner kubevirt.io.hostpath-provisioner, WaitForFirstConsumer, reclaimPolicy Retain, no expansion), whose volumes are directories on the node''s disk. The lesson''s volume was removed by its provisioner once the administrator set its reclaim policy to Delete; the debug pods ran in a namespace created for the recording and deleted afterwards, and the cluster''s list of volumes was compared with the one taken before the lesson (experiment X-STOR-01).'
  concepts:
  - storage.pvc
  - storage.class
  prerequisites:
  - b.pod-lifecycle
  objective: |
    Tell which storage survives a container restart, a pod deletion and a node failure, read a claim, a class and a
    volume and say who owns each, predict when a volume is created and what deleting a claim does, choose an access
    mode, explain a Pending claim from its events, and, as an administrator, find the volume of a claim, recognise a
    Released volume and reclaim it.
  record_on: cluster-admin
  flow:
  - kind: ask
    id: recall-replace
    recalls: b.pod-lifecycle
    prompt: A Deployment's pod is deleted. What does the Deployment do?
    choices:
    - text: It creates a new pod to replace it
      why: The controller keeps the number of pods at the desired count, so it creates a replacement, with a new name and a new filesystem.
    - text: It restarts the same pod in place
      why: Deleting a pod removes it. Only containers restart, and only inside a pod that still exists.
    - text: It waits for the node to bring it back
      why: Nothing brings a deleted pod back. The controller creates a new one.
    answer: 0
  - kind: teach
    id: situation
    title: Monday morning, the notes are gone
    body: |
      A team keeps service notes as files. On Monday a rollout replaces the pod and every note disappears. The notes
      were written inside a container's writable filesystem; a replacement container starts with new writable storage.

      Data that must outlive containers or pods needs storage with its own lifecycle. This lesson demonstrates the
      loss, then explains claims, storage classes and volumes. Node-failure recovery depends on the chosen storage
      backend. A claim alone does not guarantee it.

      Everything here was run on a lab cluster (OpenShift Local 4.21) from two terminals: the ordinary user
      `developer`, in a temporary project, and the cluster administrator, who owns the volumes. The prompt in front of
      each command names who ran it. Typed tasks compare your command without executing it.
  - kind: show
    id: start
    body: 'A Deployment `notes` whose container only waits, so that we can write into it:'
    run: oc create deployment notes --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/notes --timeout=180s
    notice: One pod, running. Next, a file in its own file system.
  - kind: show
    id: write
    body: 'Write a note into the container''s file system, under `/tmp`, and read it back:'
    run: oc exec deploy/notes -- sh -c 'echo "note 1" > /tmp/note.txt; cat /tmp/note.txt'
    notice: The file exists and the read-back works.
  - kind: ask
    id: guess-lose
    guess: true
    prompt: The pod is deleted and its replacement is Ready. Does `/tmp/note.txt` exist in the replacement?
    choices:
    - text: 'No: the replacement has a fresh file system'
      why: A pod's container file system is created with the container and removed with it. The next step shows the replacement.
    - text: 'Yes: the Deployment copies the files across'
      why: A Deployment replaces pods from the same template, and the template contains no data. The next step shows the replacement.
    - text: 'Yes: files under `/tmp` are kept'
      why: '`/tmp` inside a container is part of the same temporary file system as everything else. The next step shows the replacement.'
    answer: 0
  - kind: show
    id: lose
    run: oc delete pod -l app=notes; oc wait --for=condition=Ready pod -l app=notes --timeout=120s; oc exec deploy/notes -- cat /tmp/note.txt
    highlight:
    - No such file
    notice: |
      The new pod is a new container on a new file system, and `cat` reports `No such file or directory`. The
      Deployment did exactly what it should: it replaced a pod. The data was never part of what it replaces.
  - kind: teach
    id: lifetimes
    title: Three lifetimes
    body: |
      Storage can outlive different things:

      - The **container's writable filesystem** is recreated when the container is replaced, including on restart.
      - An **emptyDir** is temporary storage tied to one pod on one node. Containers in that pod can share it, and it
        survives their restarts. Removing the pod removes the data.
      - A **PersistentVolume** (PV) describes storage with a lifecycle independent of a pod. A replacement pod can reuse it.

      Persistence across pod replacement is not protection against node or disk loss. A local PV still depends on its
      node's disk. Recovery on another node needs storage accessible there; resilience and backups depend on the storage
      system. This course's OpenShift Local storage is node-local. Keep disposable scratch data in emptyDir and choose
      persistent storage for data that must outlive pods.
  - kind: teach
    id: claim-class-volume
    title: Claim, class, volume
    body: |
      A pod normally gets persistent storage through three objects:

      - A **PersistentVolumeClaim** (PVC) belongs to a project. It requests capacity, an **access mode** describing
        which nodes or pods may use it, and a storage class.
      - A **StorageClass** is a cluster-wide recipe naming a **provisioner**, the controller that creates storage,
        and its policies. Most production drivers use CSI, the Container Storage Interface connecting Kubernetes to
        storage systems. A class can be marked as the default.
      - A **PersistentVolume** (PV) is a cluster-wide object describing storage. Binding assigns it to exactly one claim.

      Administrators may create PVs beforehand: **static provisioning**. With **dynamic provisioning**, a provisioner
      creates backing storage and a PV in response to a claim. You normally write the claim and pod; administrators
      manage classes, volumes and the storage platform. A class name containing `csi` does not by itself prove which
      driver or protocol its provisioner uses.
  - kind: show
    id: scope
    body: 'The scope of each kind shows in the API, and the last command tries to read the volumes:'
    run: oc api-resources | awk 'NR==1 || $1 ~ /^(persistentvolumeclaims|persistentvolumes|storageclasses)$/ {print $1, $(NF-1)}' | column -t; oc get pv
    notice: |
      `persistentvolumeclaims` has `NAMESPACED true`; `persistentvolumes` and `storageclasses` have `false`.
      The final request is Forbidden: `developer` may not list PVs. Scope alone does not decide that: permissions are
      granted separately for each resource. The next commands show the same request in the administrator's terminal,
      and a cluster-wide list that `developer` may read.
    understand:
      purpose: From the list of every kind the cluster serves, keeps the header and the three storage kinds, with their
        name and whether they belong to a project; then tries to list the volumes as `developer`.
      parts:
        - text: NR==1
          means: The first line, the header. `NR` is the number of the line that awk is reading.
        - text: $1 ~ /^(persistentvolumeclaims|persistentvolumes|storageclasses)$/
          means: 'Or a line whose first column, `$1`, is exactly one of the three names: `~` tests a regular
            expression, `^` and `$` anchor it at both ends, and `|` separates the alternatives.'
        - text: '{print $1, $(NF-1)}'
          means: 'Prints the first column and the one before last. `NF` is the number of columns of the line; counting
            from the end finds `NAMESPACED` even in a row with no short name.'
        - text: column -t
          means: Lines the columns up as a table.
      concepts:
        - storage.pvc
        - storage.class
        - linux.shell
      refs:
        - title: gawk(1) (NR, NF, the ~ operator)
          url: https://man7.org/linux/man-pages/man1/gawk.1.html
        - title: column(1)
          url: https://man7.org/linux/man-pages/man1/column.1.html
        - title: kubectl api-resources
          url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-resources/
  - kind: try
    id: try-admin-pv
    body: In the administrator's terminal, list the cluster's PersistentVolumes.
    accept:
    - oc get pv
    - oc get persistentvolumes
    - oc get persistentvolume
    - oc get pv -o wide
    - oc get persistentvolumes -o wide
    hints:
    - match: ' (-n|--namespace)[ =]'
      say: PersistentVolumes belong to no project, so `-n` has nothing to select. Leave it out.
    - match: ^oc get (pvc|persistentvolumeclaims?)
      say: Those are the claims, which live in projects. The volumes are `pv`.
    - match: (^| )(-A|--all-namespaces)( |$)
      say: PVs are cluster-scoped, so there are no namespaces to cover. `oc get pv` lists them all.
    hint: '`oc get`, then the short name `pv`.'
    run: oc get pv
    then: |
      The administrator sees every volume of the cluster. Their names are generated: `pvc-` and the UID of the claim
      they were made for. `CLAIM` says `<project>/<claim>`. One volume is `Bound`: the integrated image registry's. The
      seven others are `Released`, with `RECLAIM POLICY` `Retain`: volumes of earlier labs whose claims were deleted.
      They still hold their data and their disk space, and nothing will reuse or remove them until an administrator
      does. This lesson leaves them alone.
  - kind: try
    id: list-classes
    body: As `developer`, list the storage classes of the cluster.
    accept:
    - oc get storageclass
    - oc get storageclasses
    - oc get sc
    - oc get storageclass.storage.k8s.io
    - oc get storageclasses.storage.k8s.io
    hints:
    - match: ^oc get (pv|persistentvolumes?)$
      say: This account cannot list PVs. StorageClasses are another resource and can be listed here.
    - match: ^oc get pvc
      say: PVCs are project claims. List the cluster's storageclass resource to discover available classes.
    - match: ^oc get storageclass\S
      say: Use the resource name `storageclass`, `storageclasses` or `sc`.
    hint: '`oc get`, then the kind `storageclass`.'
    run: oc get storageclass
    then: |
      One class on this cluster. `(default)` marks the class that a claim gets when it names none. The columns
      that matter are `RECLAIMPOLICY`, what happens to the volume when its claim is deleted, `VOLUMEBINDINGMODE`, when
      the volume is created, and `ALLOWVOLUMEEXPANSION`, whether a claim can grow. Their values here are `Retain`,
      `WaitForFirstConsumer` and `false`, and the next steps explain each one.
  - kind: show
    id: console-classes
    body: "The same list in the web console, **Storage > StorageClasses**:"
    image:
      src: storageclasses.png
      alt: "Storage > StorageClasses: one class, crc-csi-hostpath-provisioner, marked Default, with the provisioner kubevirt.io.hostpath-provisioner and the reclaim policy Retain."
      captured: "OpenShift Local 4.21.8 console as kubeadmin, 2026-10-20"
    caption: "Storage > StorageClasses"
  - kind: try
    id: list-claims
    body: List the claims of your project.
    accept:
    - oc get pvc
    - oc get persistentvolumeclaim
    - oc get persistentvolumeclaims
    - oc get pvc -o wide
    - oc get persistentvolumeclaims -o wide
    hints:
    - match: ^oc get (pv|persistentvolumes?)$
      say: That is the volumes, which are cluster-wide. The project's claims are `pvc`.
    - match: ^oc get storageclass
      say: That lists the classes, which you read in the previous step. The claims are `pvc`.
    hint: '`oc get`, then the short name `pvc`.'
    run: oc get pvc
    then: None yet. The next steps create one.
  - kind: show
    id: console-claim
    body: "A bound claim in the web console (a demo claim `data` of 1 GiB in another project, mounted by a pod):"
    image:
      src: pvc.png
      alt: "The details of the PersistentVolumeClaim data, status Bound, requested capacity 1 GiB, capacity 54 GiB, access mode ReadWriteOnce, volume mode Filesystem."
      captured: "OpenShift Local 4.21.8 console as kubeadmin, in the demo project console-demo, 2026-10-20"
    caption: "Storage > PersistentVolumeClaims > data"
    notice: "*Requested capacity* 1 GiB, *Capacity* 54 GiB: OpenShift Local's hostpath provisioner reports the space of the node's disk at that moment, which all its volumes share (the screenshot was taken at another time than the recordings, so the figure differs from theirs). The claim is not given 54 GiB of its own, and nothing stops several claims from filling the same disk."
  - kind: teach
    id: provisioning
    title: From a claim to a volume
    body: |
      For a dynamically provisioned claim, the class controls when storage is created:

      - With **Immediate**, provisioning and binding can begin as soon as the claim exists.
      - With **WaitForFirstConsumer**, the scheduler first finds a suitable node for a pod using the claim. Storage is
        provisioned or selected to fit that placement. The claim binds before the scheduler completes assigning the
        pod. The driver then makes the storage available and mounts it as needed.

      This avoids creating storage in a zone or on a node the pod cannot use. A claim can instead bind to a matching
      PV created beforehand; dynamic provisioning is not required for every claim.

      If `storageClassName` is omitted and a default class exists, Kubernetes supplies it. If no default exists, the
      claim can remain without a class and receive a default later. Explicit `storageClassName: ""` requests a
      classless PV and disables dynamic provisioning for that claim.
  - kind: explore
    id: claims-diagram
    diagram: storage
    body: Select each part of the diagram, from the pod to the backing storage, and read what it does. Note which parts a project owns and which belong to the cluster.
  - kind: ask
    id: pending-status
    prompt: A claim for the default class of this cluster is created, and no pod uses it yet. What is its status a few seconds later?
    choices:
    - text: Pending, waiting for a pod to use it
      why: WaitForFirstConsumer delays provisioning and binding until a consuming pod participates in scheduling. A suitable
        node and storage must be found before scheduling completes.
    - text: Bound, because the default class always creates storage immediately
      why: Default selects the class, not its binding mode. This class waits for a consuming pod.
    - text: Lost, because it has not acquired a volume yet
      why: Lost indicates a broken existing binding. A new unbound claim is Pending.
    answer: 0
  - kind: show
    id: claim-pending
    body: |
      `notes-data.yaml` is a claim for 100Mi with the access mode ReadWriteOnce, and it names no class. Apply it, then
      read the claim and the events at the end of its description:
    run: oc apply -f notes-data.yaml; sleep 5; oc get pvc notes-data; oc describe pvc notes-data | sed -n '/^Events:/,$p'
    highlight:
    - WaitForFirstConsumer
    - Pending
    notice: |
      `Pending` with no volume, yet `STORAGECLASS` is filled in although the claim named none: admission applied the
      default class. The event is `Normal`, and it says why: `waiting for first consumer to be created before binding`.
      Nothing is wrong. The claim is waiting for a pod.
  - kind: try
    id: try-mount
    body: Give the claim a consumer. Add it to the Deployment `notes` as a volume of type `pvc`, mounted at `/data`, with `oc set volume`.
    accept:
    - oc set volume deployment/notes --add --type=pvc --claim-name=notes-data --mount-path=/data
    - oc set volume deployment/notes --add --name=data --type=pvc --claim-name=notes-data --mount-path=/data
    - oc set volume deploy/notes --add --type=pvc --claim-name=notes-data --mount-path=/data
    - oc set volume deploy/notes --add --name=data --type=pvc --claim-name=notes-data --mount-path=/data
    - oc set volumes deployment/notes --add --type=pvc --claim-name=notes-data --mount-path=/data
    - oc set volumes deployment/notes --add --name=data --type=pvc --claim-name=notes-data --mount-path=/data
    - oc set volume deployment/notes --add -t pvc --claim-name=notes-data -m /data
    - oc set volume deployment/notes --add --name=data -t pvc --claim-name=notes-data -m /data
    hints:
    - match: --claim-size
      say: The claim already exists. `--claim-size` asks `oc` to create a new claim; name the existing one with `--claim-name=notes-data` only.
    - match: ^oc set volumes? (deployment|deploy)[ /]notes (?!.*--add)
      say: Without `--add`, `oc set volume` only lists the volumes. Add `--add` to change the Deployment.
    - match: --type[= ]persistentVolumeClaim
      say: '`oc set volume` calls this type `pvc`: `--type=pvc`.'
    - match: ^oc set volumes? (?!(deployment|deploy)[ /]notes)
      say: Name the Deployment as `deployment/notes`.
    - match: ^oc (edit|patch)
      say: That works, but the task is the one-line form, `oc set volume … --add`.
    hint: '`oc set volume deployment/notes --add`, then `--type=pvc`, `--claim-name=` and `--mount-path=`.'
    run: oc set volume deployment/notes --add --name=data --type=pvc --claim-name=notes-data --mount-path=/data; oc rollout status deployment/notes --timeout=180s; oc get pvc notes-data
    then: |
      The recording also named the volume `data` (`--name=data`; without it `oc` makes up a name). The Deployment
      rolled out a new pod with the claim mounted, and the claim is now `Bound` to a volume named `pvc-` and the
      claim's UID. It asked for 100Mi, yet `CAPACITY` reports `39Gi`, the space the hostpath provisioner reported for
      the node's disk at that moment: that is what this provisioner reports, not a dedicated disk or a 100Mi quota. Production guarantees depend on the actual
      provisioner and storage backend.
  - kind: show
    id: admin-pv
    body: |
      In the administrator's terminal: the claim's `spec.volumeName` names its volume. The command names the
      recording's temporary project, `academy-lesson-e-storage`; on your own cluster it is the project where you
      created the claim. The administrator keeps the volume's name in a file, `pv.txt`, for the next commands, and
      describes the volume:
    run: oc get pvc notes-data -n academy-lesson-e-storage -o jsonpath='{.spec.volumeName}{"\n"}' | tee pv.txt; oc describe pv "$(cat pv.txt)"
    notice: |
      The PV records its class, its status `Bound`, and `Claim: academy-lesson-e-storage/notes-data`, the project and
      the claim it belongs to. `Reclaim Policy: Retain` came from the class when the provisioner made it. `Node
      Affinity` ties it to the node `crc`, because the storage is a directory on that node's disk. `Source` names the
      CSI driver and the `VolumeHandle` by which the driver knows the storage.
  - kind: show
    id: survives
    body: 'Back as `developer`: write a note on the volume, delete the pod, and read the note from the replacement:'
    run: oc exec deploy/notes -- sh -c 'echo persisted > /data/note.txt'; oc delete pod -l app=notes; oc wait --for=condition=Ready pod -l app=notes --timeout=120s; oc exec deploy/notes -- cat /data/note.txt
    notice: |
      `oc delete` named two pods: the current one, and the pod from before the volume was added, still shutting down
      (its `sleep` ignores the stop signal, so it waits out the 30-second grace period). Then `persisted`: the
      replacement pod mounted the same volume and found the file. Compare this with `/tmp/note.txt` above.
  - kind: teach
    id: reclaim
    title: What deleting a claim does
    body: |
      The bound PV's **reclaim policy** controls what happens after its claim is deleted. Dynamically created PVs
      inherit it from their StorageClass; changing the class later does not update existing PV policies.

      With **Delete**, the provisioner removes the backing storage and the PV. With **Retain**, the PV enters
      `Released` and the data remains for an administrator to reclaim. A StorageClass defaults to Delete if it omits
      the policy. Deletion is asynchronous; a PVC used by a pod is protected until that pod is gone.

      Before deleting a real claim or its project, check the bound PV's actual policy, with administrator help if you
      cannot read it. A claim is not a backup.
  - kind: explore
    id: claims-model
    sim: storage
    body: Open the model. Set `volumeBindingMode` to `WaitForFirstConsumer`, then to `Immediate`, create the claim and a pod each time, and compare when the volume appears and in which zone. Then set `reclaimPolicy` to `Delete`, then to `Retain`, and delete the claim. Nothing in the model touches a real cluster.
  - kind: ask
    id: retain-pv
    guess: true
    prompt: The Deployment `notes` and then the claim `notes-data` are deleted. What happens to the claim's PersistentVolume?
    evidence: |
      NAME                                     PROVISIONER                        RECLAIMPOLICY   VOLUMEBINDINGMODE      ALLOWVOLUMEEXPANSION   AGE
      crc-csi-hostpath-provisioner (default)   kubevirt.io.hostpath-provisioner   Retain          WaitForFirstConsumer   false                  199d
    choices:
    - text: It stays, `Released`, with its data
      why: The PV inherited this class's Retain policy. The next steps show its status and the file on the node.
    - text: It is deleted together with its data
      why: That is the `Delete` policy, the default for classes that do not set one. This cluster's class says `Retain`. The next steps show the PV.
    - text: It is bound to the next claim that asks for the same size
      why: A `Released` PV still records its previous claim and holds its old data, so it is never handed to a new claim automatically. The next steps show the PV.
    answer: 0
  - kind: show
    id: delete-claim
    body: 'As `developer`, remove the Deployment, then the claim:'
    run: oc delete deployment notes; oc delete pvc notes-data; oc get pvc
    notice: |
      Both deleted, and the project has no claim left. A claim that a pod still uses is only marked for deletion: the
      `kubernetes.io/pvc-protection` **finalizer**, a marker that holds back an object's deletion until a controller
      has done its part, keeps it until the pod has stopped, and `oc delete` waits for that.
  - kind: show
    id: released
    body: 'In the administrator''s terminal, the volume named in `pv.txt`:'
    run: oc get pv "$(cat pv.txt)"
    highlight:
    - Released
    notice: |
      The PV still exists and is `Released`. Its `CLAIM` column still names `academy-lesson-e-storage/notes-data`, a
      claim that no longer exists: the PV keeps that reference, which is why no new claim can bind to it.
  - kind: show
    id: retained-file
    body: |
      Is the data still there? On this cluster a volume is a directory on the node, under
      `/var/lib/csi-hostpath-data/`, named after the PV. The administrator creates a namespace for debug pods
      (`stor-debug-ns.yaml`: privileged for Pod Security, the way `oc debug` prepares its own temporary namespaces),
      then reads the note through `oc debug node/crc`, which starts a pod on the node with the node's file system at
      `/host`. `--image-stream=openshift/cli:latest` picks an image that the node already holds:
    run: oc create -f stor-debug-ns.yaml; oc debug node/crc --to-namespace=academy-x-stor-debug --image-stream=openshift/cli:latest -- chroot /host cat "/var/lib/csi-hostpath-data/$(cat pv.txt)/note.txt"
    highlight:
    - persisted
    notice: |
      `persisted`, the note written through the claim, read from the node's disk after the claim was deleted. The
      debug pod was removed when its command ended. Retain means exactly this: the data stays, and so does the disk
      space it uses, until someone decides what to do with it.
    understand:
      purpose: Reads one file on the node's disk through a temporary debug pod, after creating the namespace that pod
        runs in.
      parts:
        - text: --to-namespace=academy-x-stor-debug
          means: Creates the debug pod in this namespace instead of the current project.
        - text: --
          means: Everything after it is the command for the debug pod, not options for `oc`.
        - text: chroot /host
          means: Runs the rest with the node's file system as `/`, so the path is the node's own.
        - text: $(cat pv.txt)
          means: 'Expanded by your shell on your machine before `oc` starts (it is inside double quotes, not single
            quotes): `pv.txt` is a local file, and the pod receives the finished path.'
      caution: 'A node debug pod is privileged: with `chroot /host` it can read and change any file of the node. It
        needs cluster-administrator rights; use it to read, as here.'
      concepts:
        - storage.pvc
        - k8s.architecture
      refs:
        - title: 'OpenShift 4.21: Troubleshooting (debug pods on nodes)'
          url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/troubleshooting
        - title: OpenShift 4.21 CLI reference (oc debug)
          url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-debug
  - kind: teach
    id: reclaim-how
    title: Reclaiming a Released volume
    body: |
      Kubernetes leaves a Released volume to the administrator, who chooses:

      - **Keep the data** for its owner: leave the PV, or delete the PV object (the storage stays) and later create a
        new PV that points at the same storage, for a claim that names it.
      - **Give the space back**: delete the PV, then clean up and delete the storage by hand; or, for storage that a
        provisioner created, change the PV's reclaim policy to `Delete`, and the provisioner deletes the storage and
        the PV itself.

      A Released PV is never reused for someone else without wiping it: the old data is still on it. Here the note is
      not needed, and the storage was made by the hostpath provisioner, so the administrator chooses the last way.
  - kind: ask
    id: which-policy
    prompt: The note is not needed. Which change gives this volume's space back without touching anything else?
    choices:
    - text: Set this PV's reclaim policy to Delete
      why: The provisioner deletes a Released volume whose policy is Delete, storage first, then the PV. The change names one volume, and nothing else is affected.
    - text: Set the StorageClass's reclaimPolicy to Delete
      why: A class's policy is copied into volumes when they are created. Existing PVs keep theirs, and every future volume of the cluster would lose its protection.
    - text: Delete the project that held the claim
      why: The claim is already gone, and PVs belong to no project, so deleting a project does nothing to this volume.
    answer: 0
  - kind: show
    id: reclaim-delete
    run: oc patch pv "$(cat pv.txt)" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'; oc wait --for=delete pv/"$(cat pv.txt)" --timeout=120s
    notice: |
      The patch changed one field of one PV, named from `pv.txt`. The provisioner noticed a Released volume with the
      policy `Delete` and deleted its storage, then the PV, so quickly that `oc wait --for=delete` found nothing left
      to wait for: it printed nothing and succeeded. The next step checks the node.
    understand:
      purpose: Changes one field of the PersistentVolume, its reclaim policy, then waits until the PV no longer exists.
      parts:
        - text: -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'
          means: 'The patch: only the field written changes, the rest of the PV stays. Without `--type`, `oc patch`
            sends a strategic merge patch. The single quotes keep the shell away from the JSON''s quotes and braces.'
        - text: oc wait --for=delete
          means: Returns when the object no longer exists, or fails when the `--timeout` runs out.
      caution: With the policy `Delete`, the provisioner deletes the storage and the data on it. There is no undo.
      concepts:
        - storage.pvc
      refs:
        - title: 'Kubernetes: Change the reclaim policy of a PersistentVolume'
          url: https://kubernetes.io/docs/tasks/administer-cluster/change-pv-reclaim-policy/
        - title: kubectl wait
          url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_wait/
  - kind: show
    id: reclaim-gone
    body: 'The directory on the node, and then the debug namespace, which is no longer needed:'
    run: oc debug node/crc --to-namespace=academy-x-stor-debug --image-stream=openshift/cli:latest -- chroot /host ls "/var/lib/csi-hostpath-data/$(cat pv.txt)"; oc delete namespace academy-x-stor-debug
    notice: |
      `No such file or directory`: the provisioner removed the directory with the PV (`oc debug` reports the failed
      `ls` as a non-zero exit code). The other Released volumes listed at the start are untouched; the experiment
      checked the cluster's list of volumes against the one taken before the lesson.
  - kind: order
    id: order-reclaim
    prompt: A claim was deleted on a class with Retain, and its data is not needed. Put the administrator's steps in order.
    items:
    - Find the PV from the claim, or from the CLAIM column of `oc get pv`
    - Check that it is Released and that nobody needs its data
    - Set its reclaim policy to Delete
    - Wait for the provisioner to delete the storage and the PV
    why: The PV name comes first, because every later command names exactly that volume. Checking before changing the policy matters because Delete cannot be undone. The provisioner works asynchronously, so the job is finished only when the PV is gone.
  - kind: teach
    id: access-modes
    title: Access modes
    body: |
      An **access mode** describes the storage access requested by a claim:

      - **ReadWriteOnce** (RWO): read-write from one node. Several pods on that node can use it.
      - **ReadWriteOncePod** (RWOP): use by only one pod cluster-wide; requires a supporting CSI driver.
      - **ReadOnlyMany** (ROX) and **ReadWriteMany** (RWX): access from many nodes, read-only or read-write.

      Choose a mode supported by the actual driver and backend. Ordinary access modes help match and attach volumes;
      they are not filesystem write locks. A read-only mount also needs `readOnly: true`. RWOP enforces the single-pod
      constraint. For replicas sharing files across nodes, choose storage supporting RWX. For separate data per member,
      use separate claims, as in the next lesson on StatefulSets. Shared storage alone does not make concurrent writes
      safe for the application.
  - kind: ask
    id: rwo-replicas
    prompt: A Deployment has three replicas on three nodes. They all mount one ReadWriteOnce claim, backed by a cloud disk. What do you expect?
    choices:
    - text: Only pods on the attached node can run
      why: This cloud disk supports read-write attachment to one node. Pods on other nodes wait for access and can show Multi-Attach
        errors.
    - text: All three run and share the cloud disk
      why: RWO does not provide multi-node read-write attachment. Choose a backend and mode that support the required sharing.
    - text: The claim is rejected because RWO means one pod
      why: RWO restricts read-write access to one node, not one pod. RWOP is the single-pod mode.
    answer: 0
  - kind: teach
    id: failures
    title: Reading failures
    body: |
      When storage misbehaves, read both the claim's and the pod's events. An unbound claim can mean normal
      WaitForFirstConsumer coordination or a real provisioning failure. Scheduling cannot finish until the required
      claims are bound.

      The next recordings show two real failures. `typo-data.yaml` is a claim that names a class, `fast-ssd`, which
      this cluster does not have. `ghost.yaml` is a pod that requests `ghost-data`, a claim that does not exist.
      Creating that pod creates no claim or volume.
  - kind: show
    id: typo-claim
    run: oc apply -f typo-data.yaml; sleep 5; oc get pvc typo-data; oc get events --field-selector involvedObject.name=typo-data
    highlight:
    - ProvisioningFailed
    notice: |
      The claim is `Pending`, and its own event is a `Warning`: `ProvisioningFailed`, because the class it names,
      `fast-ssd`, does not exist. Compare it with the `Normal` event of `notes-data` above: the type and the reason
      tell a waiting claim from a failing one.
  - kind: ask
    id: pending-fix
    prompt: A claim is Pending with this Warning, and the pod that uses it is Pending too. What is the fix?
    evidence: |
      LAST SEEN   TYPE      REASON               OBJECT                            MESSAGE
      1s          Warning   ProvisioningFailed   persistentvolumeclaim/typo-data   storageclass.storage.k8s.io "fast-ssd" not found
    choices:
    - text: Create a replacement claim using an existing class
      why: For this explicitly set missing class, replace the unbound claim and update the workload to use the new one. A
        platform administrator could instead supply the intended missing class.
    - text: Edit the existing claim to use another class
      why: An explicitly set storageClassName cannot be replaced through an ordinary PVC edit. Use a new claim for a different
        class.
    - text: Wait for this pod to make the class appear
      why: A consuming pod does not create StorageClasses. Waiting alone cannot resolve a missing class.
    answer: 0
  - kind: show
    id: ghost
    run: oc apply -f ghost.yaml; sleep 8; oc get pod ghost
    notice: |
      The pod stays `Pending`: the scheduler cannot place a pod whose claim it cannot find. The reason is in the pod's events.
  - kind: try
    id: ghost-events
    body: Show the events of the pod `ghost`.
    accept:
    - oc get events --field-selector involvedObject.name=ghost
    - oc get events --field-selector=involvedObject.name=ghost
    - oc describe pod ghost
    - oc describe pod/ghost
    - oc describe po ghost
    - oc get event --field-selector involvedObject.name=ghost
    hints:
    - match: ^oc logs
      say: A pod that never started has no logs. The scheduler's reasons are in its events.
    - match: ^oc get pod\S* ghost( -o \S+)?$
      say: 'That shows the pod''s state, which you saw. The reason is in the events: `oc describe pod ghost`, or `oc get events` for the pod.'
    - match: ^oc get events$
      say: That lists every event in the project. Narrow it to the pod with `--field-selector involvedObject.name=ghost`.
    hint: '`oc describe pod ghost`, or `oc get events` with a field selector on the pod''s name.'
    run: oc get events --field-selector involvedObject.name=ghost
    then: |
      A `Warning` from the scheduler: `persistentvolumeclaim "ghost-data" not found`. The pod waits for a claim that
      nobody created. The fix is to create the claim, or to correct the name in the pod.
  - kind: teach
    id: growing
    title: Growing a volume
    body: |
      Expansion requires both `allowVolumeExpansion: true` on the class and a driver that supports it. Increase
      `spec.resources.requests.storage` on the existing PVC; the controller and driver expand the storage, then the
      filesystem if required. Track its conditions until resizing finishes. Shrinking a provisioned volume is unsupported.

      This cluster's class has expansion disabled. To change to another class or obtain larger storage where expansion
      is unavailable, create a new claim and copy the data. An explicitly set claim class cannot be switched in place.
  - kind: ask
    id: two-defaults
    prompt: Someone marks a second StorageClass as default, so two classes carry the default annotation. What happens to a new claim that
      names no class?
    choices:
    - text: It gets the most recently created default class
      why: Since Kubernetes 1.26 the admission plugin picks the newest default instead of refusing the claim; still, keep one default
        so the choice is deliberate.
    - text: It is refused until only one default remains
      why: Older versions refused such claims; current Kubernetes chooses the newest default.
    - text: It stays Pending with no class at all
      why: A claim with no class is given a default when one exists; here two exist, and the newest wins.
    answer: 0
  - kind: reflect
    id: explain-pending
    prompt: Explain to a colleague who knows Linux but not Kubernetes why a claim can be Pending with nothing wrong, and how to tell that from a real failure.
    model: |
      With WaitForFirstConsumer, the claim waits for a consuming pod so the scheduler can choose a suitable node and
      storage together. Provisioning and binding complete before the scheduler finishes assigning that pod. Before
      there is a consumer, Pending with a Normal waiting event is expected. A Warning such as ProvisioningFailed
      points to an actual problem, for example a missing class or a driver error. I read both objects' current events
      and check whether scheduling or provisioning is making progress.
  - kind: teach
    id: what-next
    title: What you can do now
    body: |
      You can distinguish container storage, emptyDir and persistent volumes, and explain why persistence alone is
      not protection against node or disk loss. You can create a claim, mount it, read Pending claims and pods through
      their events, and choose an access mode. As an administrator, you can find the volume of a claim, recognise a
      Released one and the data it still holds, and reclaim it on purpose.

      The next lesson, [Stable identity with StatefulSets](/lesson/f0.statefulsets), assigns a claim per member. The
      lab [Keep data across pods](/lab/lab.storage) lets you repeat the claim side yourself; [PVC Pending, pod
      Pending](/lab/inc.pvc-pending) practises diagnosing one. Both can leave Released volumes on OpenShift Local for
      an administrator to reclaim.
  sections:
  - id: phases
    title: Phases of claims and volumes
    depth: true
    body: |
      | Object | Phase | Means |
      |---|---|---|
      | PVC | `Pending` | not bound yet (waiting, or failing: read the events) |
      | PVC | `Bound` | bound to a PV |
      | PVC | `Lost` | its binding to a PV is broken (the PV object is gone or now refers to another claim); the API describes its data as lost, but if only the PV object disappeared (a Retain volume, say) the data may still be on the back-end: check the events, the PV and the storage back-end |
      | PV | `Available` | free, not bound to a claim |
      | PV | `Bound` | bound to a claim |
      | PV | `Released` | its claim was deleted, the data is still there, not yet reclaimed |
      | PV | `Failed` | automatic reclamation failed |

      A `Released` PV is not handed to a new claim automatically: its `spec.claimRef` still names the deleted claim.
      The documented way to reuse retained data is to delete the PV object (the storage itself remains), clean or keep
      the data, and create a new PV pointing at the same storage. `developer` cannot do any of this: PVs are
      cluster-scoped and ordinary users may not even list them. The third reclaim policy, `Recycle`, is deprecated.
  - id: modes
    title: Access modes, volume modes and choosing
    depth: true
    body: |
      Access modes describe what the storage **can** do; they are not a write lock. Kubernetes uses them to match claims
      to volumes and to decide where a volume may be attached, but a volume mounted from a `ReadOnlyMany` PV is not
      guaranteed to be read-only (use `readOnly: true` on the mount for that). `ReadWriteOncePod` is the exception: it
      really limits the claim to one pod (CSI volumes, stable since Kubernetes 1.29). Consult the supported-mode table for the actual driver. Native NFS, for example, supports RWO, ROX and RWX,
      but RWOP requires CSI; it is not available on every file or block volume.

      **Volume mode** is a separate choice. `Filesystem` (the default) gives the container a mounted directory; the node
      creates a filesystem on an empty block device first. `Block` hands the container a raw device with no filesystem,
      declared under `volumeDevices` with a `devicePath` instead of `volumeMounts`. Only databases and virtual machines
      that manage the device themselves need it. A Block claim never binds to a Filesystem volume, or the reverse.

      | Workload | Choose |
      |---|---|
      | scratch or cache data that may be lost | `emptyDir` (no claim) |
      | one database or app instance | RWO (or RWOP to forbid a second writer) |
      | several replicas, each with its own data | a StatefulSet with `volumeClaimTemplates`: one RWO claim per pod |
      | several replicas sharing the same files | RWX from a file storage class |
      | configuration and credentials | ConfigMap and Secret volumes, not a PVC |
  - id: binding-details
    title: Binding modes and the default class in detail
    depth: true
    body: |
      With `Immediate` binding (the default when a class does not set the field) the volume is provisioned at once and
      can end up in a zone where the pod cannot then be scheduled. With `WaitForFirstConsumer`, never pin a pod with
      `nodeName`: that bypasses the scheduler, and the claim then stays Pending; use a `nodeSelector` on
      `kubernetes.io/hostname` instead. The default class is marked with the annotation
      `storageclass.kubernetes.io/is-default-class: "true"`.

      Omitting `storageClassName` selects the default class. Writing `storageClassName: ""` asks for a PV with no class
      and disables dynamic provisioning for that claim: it stays Pending unless a matching PV was created by hand, with
      the Normal event `FailedBinding`: `no persistent volumes available for this claim and no storage class is set`.

      Growing a claim: you raise `spec.resources.requests.storage`, for example with `oc patch`; no new PV is created.
      The driver enlarges the volume, then the filesystem is resized on the node, while the pod runs if the driver
      supports online expansion, otherwise when a pod next mounts it. During the process the claim shows a `Resizing`
      condition, and OpenShift documents `FileSystemResizePending` for the stage where the storage has grown but the
      filesystem not yet. Filesystem growth is supported for XFS, ext3 and ext4.
  - id: what-goes-wrong
    title: What goes wrong, and how to see it
    depth: true
    body: |
      | Symptom | Evidence | Likely cause | Fix |
      |---|---|---|---|
      | PVC Pending | Normal event `waiting for first consumer` | WaitForFirstConsumer | create or schedule the pod |
      | PVC Pending; pod Pending | `ProvisioningFailed ... storageclass ... not found`; pod `FailedScheduling ... unbound immediate PersistentVolumeClaims` | typo, or a class from another cluster | new claim with an existing class (class is immutable) |
      | PVC Pending with an existing class | `ProvisioningFailed` with a driver error | quota, capacity or permissions in the storage system | read the driver's message; involve the storage team |
      | PVC Pending, `storageClassName: ""` | Normal `FailedBinding`: `no persistent volumes available for this claim and no storage class is set` | static binding requested, no matching PV | create a replacement claim using a class, or have an admin create a matching PV |
      | Pod `ContainerCreating`, `FailedAttachVolume` (Multi-Attach error) | the volume is attached to another node | RWO volume still in use elsewhere | Recreate strategy, RWX, or one claim per pod |
      | Pod `ContainerCreating`, `FailedMount` | mount error in the pod's events | node or CSI driver problem, wrong Secret/ConfigMap name, permissions | fix the reference; check the driver pods |
      | Pod Pending, `node(s) didn't match PersistentVolume's node affinity` (`had volume node affinity conflict` before Kubernetes 1.33) | the PV's node affinity | volume lives in a zone/node the pod cannot use | WaitForFirstConsumer, or a scheduling constraint that matches |
      | PVC stuck `Terminating` | `Used By:` lists a pod | the `kubernetes.io/pvc-protection` finalizer waits for that pod | delete or move the pod first |
      | Released PVs pile up, disk fills | `oc get pv` (administrator): many `Released`, `Retain` | claims deleted on a Retain class | the administrator reclaims each one by name |
      | pod cannot write to a mounted volume | `Permission denied`; the pod runs as an arbitrary UID with group 0 | the volume's root directory is owned by `0:0` with mode 755 | `fsGroup` in the pod's security context (on OpenShift the `restricted-v2` SCC assigns it from the project's range) |
  - id: common-mistakes
    title: Common mistakes
    depth: true
    body: |
      - **Scaling a Deployment that mounts one RWO claim.** Replicas that land on other nodes stay in
        `ContainerCreating` with a Multi-Attach error. Use RWX storage, or a StatefulSet with one claim per pod.
      - **Rolling updates with an RWO volume.** The new pod may be scheduled on another node while the old one still
        holds the volume, and the rollout stalls; the `Recreate` strategy (stop the old pod first) avoids it.
      - **Hard-coding a StorageClass name from another cluster** (`fast-ssd`): the claim never binds. Omit
        `storageClassName` to use the default class, or check `oc get storageclass` first.
      - **Writing `storageClassName: ""` to mean "default".** An empty string asks for a class-less, statically created
        PV; omitting the field is what selects the default.
      - **Assuming deleting a PVC frees or wipes storage.** With `Retain` the data stays on a Released PV; with
        `Delete` it is gone, including when someone deletes the whole namespace.
      - **Reclaiming by pattern.** Deleting every Released PV at once can destroy data that someone kept on purpose.
        Name each volume, and check its claim and project first.
      - **Expecting StatefulSet claims to disappear with the StatefulSet.** By default, deleting or scaling down a
        StatefulSet keeps its claims; `persistentVolumeClaimRetentionPolicy` (`whenDeleted`, `whenScaled`) changes that.
      - **Treating the requested size as a limit.** Some provisioners (like OpenShift Local's hostpath one) do not
        enforce it.
  review:
  - q: Which storage survives a container restart, a pod deletion and a node failure?
    a: The container's file system survives none of them. An `emptyDir` survives a container restart but not the pod's deletion. A PersistentVolume survives pod replacement. Node-failure recovery depends on the backend; node-local storage cannot make data available on another node by itself.
  - q: Who owns a PersistentVolumeClaim, a StorageClass and a PersistentVolume, and which are namespaced?
    a: The project owns the claim (namespaced). The class and the volume are cluster-scoped, owned by the platform.
  - q: What does WaitForFirstConsumer change?
    a: Provisioning and binding coordinate with scheduling of a consuming pod, so storage matches its node or zone before scheduling completes. Until then the claim is Pending with a Normal event.
  - q: What happens to data when a PVC is deleted with reclaimPolicy Retain? With Delete?
    a: 'Retain: the PV and its data remain (Released). Delete: the PV and the backing storage are deleted.'
  - q: How does an administrator find the volume of a claim?
    a: In the claim's spec.volumeName (the VOLUME column of oc get pvc), or in the CLAIM column of oc get pv.
  - q: Name two ways for an administrator to reclaim a Released volume whose data is not needed.
    a: Delete the PV and then clean up and delete the storage by hand; or, for storage a provisioner created, set the PV's persistentVolumeReclaimPolicy to Delete so that the provisioner deletes the storage and the PV.
  - q: Why can a Deployment with 3 replicas and one RWO claim end up with only one running pod?
    a: RWO allows one node; replicas scheduled on other nodes cannot attach the volume (Multi-Attach error).
  - q: How do you tell a PVC that is waiting normally from one that is failing?
    a: 'By its events: Normal `waiting for first consumer` is normal. A Warning such as `ProvisioningFailed` names the cause (a missing class, a driver error).'
  - q: What is the difference between omitting storageClassName and setting it to an empty string?
    a: 'Omitted: Kubernetes uses a default class if one exists, or can assign one later. Explicit empty string: request a classless PV and disable dynamic provisioning for this claim.'
  - q: What does a claim need before it can grow, and can it shrink?
    a: 'Its class must allow expansion and its driver must support it; increase spec.resources.requests.storage and track resize conditions. Shrinking the provisioned volume is unsupported.'
  labs:
  - lab.storage
  - inc.pvc-pending
  limits: OpenShift Local has one node and one hostpath storage class, so attaching a volume on another node, node failure and expansion are explained, not shown, and the requested size is not enforced. Of the ways to reclaim a Released volume, only setting the policy to Delete was run; re-using retained data through a new PV, and deleting a PV with manual cleanup of its storage, are described from the documentation. The other Released volumes on this cluster belong to earlier labs and were only listed.
  enterprise: Storage choices (block vs file, RWO vs RWX, snapshot support, encryption, zonal vs regional) are made with the infrastructure team. Platform teams publish classes with clear names ("fast-rwo-zonal") and default reclaim policies matching data-protection rules, and watch for Released volumes so that retained data is either handed back to its owner or reclaimed on purpose.
