  experiment:
    id: X-STOR-02
    objective: "Run a StatefulSet with volumeClaimTemplates as the developer (claims kept on scale-down, then deleted through persistentVolumeClaimRetentionPolicy), show the administrator the volumes Released under the class's Retain policy, and reclaim exactly those two volumes by name; prove that the cluster's volumes and the storage class are as before."
    changes:
      - "Two PersistentVolumes made by the hostpath provisioner for claims data-db-0 and data-db-1 of academy-lesson-f0-statefulsets (Bound, then Released, then reclaim policy set to Delete and deleted with their directories by the provisioner)"
      - "Project academy-lesson-f0-statefulsets, the developer's temporary project, with StatefulSets web and db, two headless Services and the claims (deleted by the rollback)"
    preflight:
      - cmd: |-
          pvs=$(oc get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace == "academy-lesson-f0-statefulsets") | .metadata.name') || exit 1
          test -z "$pvs"
      - cmd: |-
          sc=$(oc get storageclass crc-csi-hostpath-provisioner -o jsonpath='{.reclaimPolicy} {.volumeBindingMode}') || exit 1
          test "$sc" = "Retain WaitForFirstConsumer"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=30s"}
    snapshot:
      - "oc get pv -o json | jq -S '[.items[] | {name:.metadata.name,phase:.status.phase,claim:.spec.claimRef.name,ns:.spec.claimRef.namespace,reclaim:.spec.persistentVolumeReclaimPolicy}] | sort_by(.name)'"
      - "oc get storageclass -o json | jq -S '[.items[] | {name:.metadata.name,provisioner:.provisioner,parameters:.parameters,reclaim:.reclaimPolicy,binding:.volumeBindingMode,expansion:.allowVolumeExpansion,default:.metadata.annotations[\"storageclass.kubernetes.io/is-default-class\"]}]'"
    rollback:
      - "oc delete statefulset db web -n academy-lesson-f0-statefulsets --ignore-not-found && oc delete pvc data-db-0 data-db-1 -n academy-lesson-f0-statefulsets --ignore-not-found --timeout=240s"
      - |-
        pvs=$(oc get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace == "academy-lesson-f0-statefulsets") | .metadata.name') || exit 1
        for pv in $pvs; do
          oc patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}' || exit 1
          for i in $(seq 24); do
            left=$(oc get pv "$pv" --ignore-not-found -o name) || exit 1
            test -z "$left" && break
            sleep 5
          done
          left=$(oc get pv "$pv" --ignore-not-found -o name) || exit 1
          if [ -n "$left" ]; then oc delete pv "$pv" --timeout=60s || exit 1; fi
        done
      - "oc delete project academy-lesson-f0-statefulsets --ignore-not-found --wait=false"
    settle:
      - |-
        for i in $(seq 60); do
          b=$(oc get namespace academy-lesson-f0-statefulsets --ignore-not-found -o name) || exit 1
          test -z "$b" && exit 0
          sleep 5
        done
        exit 1
    verify:
      - cmd: |-
          pvs=$(oc get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace == "academy-lesson-f0-statefulsets") | .metadata.name') || exit 1
          test -z "$pvs"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=60s"}
