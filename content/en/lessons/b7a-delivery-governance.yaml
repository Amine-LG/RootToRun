  commands:
    - {cmd: "oc get validatingadmissionpolicies", as: admin, meaning: "the admission policies that OpenShift's own components installed"}
    - {cmd: "oc create -f lab-require-owner.yaml", as: admin, meaning: "store the owner rule; nothing binds it yet"}
    - {cmd: "oc label namespace academy-lesson-n-policy-governance lab-tenant=true", as: admin, meaning: "mark the team's namespace as a tenant namespace"}
    - {cmd: "oc label namespace academy-lesson-n-policy-governance lab-tenant-", as: developer, expect: fail, meaning: "the tenant cannot remove the label: project administration does not include the Namespace object"}
    - {cmd: "oc create deployment old-shop --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity && oc rollout status deployment/old-shop --timeout=180s", as: developer, timeout: 240, meaning: "an owner-less Deployment while the policy is unbound: accepted silently"}
    - {cmd: "oc create -f lab-require-owner-binding.yaml", as: admin, meaning: "bind the policy to labelled namespaces in report mode (Warn, Audit)"}
    - {cmd: "start=$(date +%s); until oc create deployment probe --image=registry.access.redhat.com/ubi9/ubi-minimal:latest --dry-run=server -o name 2>&1 | grep -q Warning; do [ $(( $(date +%s) - start )) -gt 120 ] && { echo 'no warning after 2 minutes'; exit 1; }; sleep 2; done; echo \"the binding was in force after $(( $(date +%s) - start )) seconds\"", as: developer, timeout: 180, meaning: "how long the new binding takes to reach admission (a server dry run, repeated)"}
    - {cmd: "oc create deployment new-shop --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity", as: developer, meaning: "created, with a warning that names the policy"}
    - {cmd: "oc adm node-logs crc --path=kube-apiserver/audit.log | grep -F lab-require-owner | jq -c 'select(.objectRef.namespace == \"academy-lesson-n-policy-governance\" and .objectRef.name == \"new-shop\" and .verb == \"create\") | {user: .user.username, verb, resource: .objectRef.resource, name: .objectRef.name, code: .responseStatus.code, failure: .annotations[\"validation.policy.admission.k8s.io/validation_failure\"]}'", as: admin, meaning: "the audit event of that request, with its validation_failure annotation"}
    - {cmd: "oc get validatingadmissionpolicybinding lab-require-owner -o yaml", as: admin, meaning: "the binding: policy, actions and namespace selector"}
    - {cmd: "oc patch validatingadmissionpolicybinding lab-require-owner --type=merge -p '{\"spec\":{\"validationActions\":[\"Deny\"]}}'", as: admin, meaning: "switch the binding from report mode to Deny"}
    - {cmd: "start=$(date +%s); while oc create deployment probe --image=registry.access.redhat.com/ubi9/ubi-minimal:latest --dry-run=server -o name >/dev/null 2>&1; do [ $(( $(date +%s) - start )) -gt 120 ] && { echo 'still allowed after 2 minutes'; exit 1; }; sleep 2; done; echo \"Deny was in force after $(( $(date +%s) - start )) seconds\"", as: developer, timeout: 180, meaning: "how long the switch to Deny takes to reach admission"}
    - {cmd: "oc get deployments", as: developer, meaning: "stored Deployments are untouched by enabling Deny"}
    - {cmd: "oc rollout restart deployment/old-shop", as: developer, expect: fail, meaning: "the next update of the old owner-less Deployment is refused"}
    - {cmd: "oc create deployment cart --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity", as: developer, expect: fail, meaning: "a new owner-less Deployment is refused"}
    - {cmd: "oc create deployment scope-check --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -n default --dry-run=server", as: admin, meaning: "the same request in an unlabelled namespace, as a server dry run: admission runs, nothing is stored"}
    - {cmd: "oc label deployment old-shop owner=team-shop && oc rollout restart deployment/old-shop", as: developer, meaning: "a compliant update, then the restart is accepted"}
  experiment:
    id: X-VAP-01
    objective: "Create a ValidatingAdmissionPolicy and its binding scoped to one labelled tenant namespace, show report mode (warning and audit annotation) and then Deny on the developer's requests, and remove both, leaving the cluster's admission policies as they were."
    changes:
      - "ValidatingAdmissionPolicy lab-require-owner (created, deleted)"
      - "ValidatingAdmissionPolicyBinding lab-require-owner (created, patched from Warn/Audit to Deny, deleted)"
      - "Label lab-tenant=true on the developer's temporary namespace academy-lesson-n-policy-governance (added, removed; the recorder deletes the project afterwards)"
      - "Deployments old-shop and new-shop in that temporary project"
    preflight:
      - {cmd: "found=$(oc get validatingadmissionpolicy lab-require-owner --ignore-not-found -o name) || exit 1; test -z \"$found\""}
      - {cmd: "found=$(oc get validatingadmissionpolicybinding lab-require-owner --ignore-not-found -o name) || exit 1; test -z \"$found\""}
      - {cmd: "found=$(oc get namespaces -l lab-tenant -o name) || exit 1; test -z \"$found\""}
    snapshot:
      - "oc get validatingadmissionpolicies -o name"
      - "oc get validatingadmissionpolicybindings -o name"
      - "oc get namespaces -l lab-tenant -o name"
      - "oc get validatingwebhookconfigurations,mutatingwebhookconfigurations -o name"
    rollback:
      - "oc delete validatingadmissionpolicybinding lab-require-owner --ignore-not-found"
      - "oc delete validatingadmissionpolicy lab-require-owner --ignore-not-found"
      - "oc label namespace academy-lesson-n-policy-governance lab-tenant- >/dev/null 2>&1 || true"
    verify:
      - {cmd: "oc get --raw /readyz"}
      - {cmd: "oc wait co/kube-apiserver --for=condition=Available=True --timeout=60s && oc wait co/kube-apiserver --for=condition=Degraded=False --timeout=60s"}
