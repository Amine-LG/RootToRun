# Platform delivery and governance: conceptual teaching flows; no cluster commands are executed.
- id: g.iac
  title: Infrastructure as code
  subtitle: Terraform, Ansible and GitOps around the platform
  module: p3-delivery
  mode: ENTERPRISE_ARCHITECTURE
  minutes: 30
  level: 2
  supports: Conceptual practice using Terraform/OpenTofu, Ansible and Argo CD documentation. No infrastructure
    or automation runs here; command fields compare text only. OpenShift examples target 4.21.
  concepts:
    - iac
    - gitops.argocd
  prerequisites:
    - gx.declarative
    - gx.argocd
  objective: |
    Assign an owning tool to each platform layer, explain state loss and locking, distinguish idempotent
    execution from change reporting, and plan a controlled handover to GitOps.
  flow:
    - kind: teach
      id: situation
      title: Rebuild the surroundings
      body: |
        Your team can restore application manifests, but a replacement cluster still cannot receive traffic.
        Nobody knows which DNS records and load balancer settings the old site used.

        Infrastructure as code (IaC) puts those settings in reviewed, versioned files too. You will decide
        which tool owns each layer, protect the tool’s record of existing resources, and stop two
        automations undoing each other’s work.

        These are design exercises. Nothing is installed or run here: the commands you type are checked as
        text, and the examples come from the tools' documentation.
    - kind: teach
      id: layers
      title: Choose an owner before a tool
      body: |
        [Declarative management](/lesson/gx.declarative) separates the desired configuration from the
        current state. Apply that idea around the cluster as well as inside it.

        Terraform or OpenTofu describes infrastructure such as networks, DNS and load balancers. A provider
        translates its resource definitions into API calls. Ansible runs ordered tasks, such as installing a
        component and waiting for it. [Argo CD](/lesson/gx.argocd) keeps comparing selected Kubernetes objects
        with Git.

        These tools overlap in capability. The useful boundary is responsibility: give each managed object,
        or deliberately separated set of fields, one agreed owner.
    - kind: ask
      id: choose-owner
      recalls: gx.argocd
      prompt: Someone raises a ResourceQuota by hand in a live project. Which setup restores the Git value without
        anyone starting a run?
      choices:
        - text: Argo CD with self-heal on
          why: Self-heal syncs again when the live object drifts from Git, so the correction needs no person to
            start it.
        - text: A Terraform configuration for the quota
          why: Terraform compares configuration with reality only when someone runs a plan or apply. Between
            runs the hand edit stays.
        - text: An Ansible playbook kept in the repository
          why: A playbook corrects drift only when it runs, and nothing starts it between scheduled runs.
      answer: 0
    - kind: teach
      id: state
      title: State connects names to real objects
      body: |
        Terraform’s state maps a configuration address to a real object ID. A normal plan refreshes
        information about tracked resources, then compares it with the configuration to propose changes.
        Apply executes the reviewed changes.

        With an empty state and no imports, configured managed resources look new even if matching
        infrastructure already exists. Applying can create duplicates or fail on unique names. Check the
        backend (where state is stored) and workspace (which state set is selected) first; recover the state
        or import existing objects before applying.
    - kind: show
      id: plan-example
      code: |
        $ terraform plan
      origin: example
      caption: 'Terraform documentation: State and plan command; command example, not executed'
      notice: |
        Run from an initialized infrastructure directory, plan proposes changes without applying them.
        Review the resource addresses and proposed actions before approving an apply.
    - kind: ask
      id: empty-state
      prompt: A colleague plans in a fresh clone of the repository. The cloud is unchanged, yet the plan proposes
        to add all 14 resources. What is the likely cause?
      choices:
        - text: Terraform found no state for them, so each resource looks new
          why: Without state bindings or imports, Terraform cannot connect the configuration to the existing
            objects. Check the backend and workspace, and restore or import before applying.
        - text: Someone deleted the 14 resources from the cloud
          why: Resources deleted outside Terraform show up as a plan to recreate them, but the cloud is unchanged
            here, and the cause would not be the fresh clone.
        - text: A first plan lists every resource, and apply skips the existing ones
          why: Apply does not skip objects it has no record of. It tries to create them, which duplicates them or
            fails on a name that is already taken.
      answer: 0
    - kind: teach
      id: protect-state
      title: Protect the memory of the estate
      body: |
        Use a remote backend with restricted access, encryption, version history and locking support.
        Locking prevents concurrent writers; an active lock is a reason to wait, not to force an unlock.
        Force-unlock only a verified stale lock from your own failed operation.

        State and saved plans can contain secrets even when values are marked sensitive: that marking hides
        display, not storage. Terraform’s supported ephemeral values and write-only arguments can avoid
        persistence for those values; OpenTofu also offers state and plan encryption. Neither removes the
        need for access control.
    - kind: ask
      id: incident-change
      prompt: A plan would undo a load balancer timeout increased during an incident. What should the reviewer
        do?
      choices:
        - text: Approve because code always wins
          why: Desired configuration can be outdated too. Blind approval can reintroduce the incident.
        - text: Remove the balancer from state
          why: Forgetting the resource abandons management rather than deciding which timeout is correct.
        - text: Review the incident fix
          why: If the fix is still needed, update the configuration and review a fresh plan; otherwise deliberately
            approve the revert.
      answer: 2
    - kind: teach
      id: idempotence
      title: Make reruns safe
      body: |
        Ansible playbooks are ordered tasks. An idempotent task leaves the target in the same desired state
        when repeated, reporting no change if nothing needed changing. Many resource modules support that
        pattern, but check each module’s documented behavior.

        A command or shell task runs a program; it cannot infer whether the program needed to run. Prefer a
        resource module, or inspect the target and use a condition. File-based creates and removes guards
        can skip execution. changed_when controls the report and handler notifications after execution; it
        does not stop the program running.
    - kind: show
      id: guard-example
      code: |
        - name: Initialize the local application database once
          ansible.builtin.command:
            cmd: /usr/local/bin/init-db
            creates: /var/lib/shop/initialized
      origin: example
      caption: 'Written for this course with the creates option of the Ansible command module (see its documentation); not executed'
      notice: |
        Assume init-db creates the marker only after successful initialization. The guard skips the program
        when that file exists. It is meaningful only if the marker reliably represents the desired state.
    - kind: ask
      id: report-versus-execution
      prompt: A bucket-creation script runs nightly even when the bucket exists. Which change prevents needless
        execution?
      choices:
        - text: Set changed_when to false
          why: That changes reporting after the script runs. It does not prevent repeated side effects.
        - text: Check the resource before execution
          why: A module or a prior existence check can decide whether work is needed before changing the target.
        - text: Hide changed tasks in the job output
          why: Suppressing output hides the symptom while leaving execution and its risks unchanged.
      answer: 1
    - kind: teach
      id: handover
      title: Bootstrap, then hand over
      body: |
        A typical sequence is infrastructure provisioning, cluster installation, GitOps bootstrap, then
        continuous reconciliation of selected cluster configuration.

        Ansible or a pipeline can install the GitOps operator, wait for its API kinds, then create a root
        [Application](/lesson/gx.argocd) pointing to the configuration repository. A root Application can
        manage other Applications: Argo CD calls this the app-of-apps pattern.

        Document when bootstrap stops managing those objects. Argo CD manages the declared Kubernetes
        resources, with the permissions you grant; it does not automatically own every object in the
        cluster. Keep sensitive installer inputs and secret values outside Git. For example, the GitOps
        repository can declare OAuth settings, operator subscriptions and quotas; secret values come from a
        separate protected source.
    - kind: order
      id: handover-order
      prompt: Order this team’s handover from an empty site to GitOps-managed configuration.
      items:
        - Provision the network, DNS and load balancers with the infrastructure owner.
        - Install the cluster and check its API is available.
        - Install GitOps, wait for its APIs, and create the root Application.
        - Verify sync and end bootstrap writes to the handed-over objects.
      why: Each phase needs the previous phase to be usable. The final ownership change prevents scheduled bootstrap
        jobs from undoing GitOps.
    - kind: teach
      id: competing-writers
      title: When a field keeps changing back
      body: |
        Suppose a nightly Ansible job writes a quota of 20 CPUs, while Argo CD’s Git configuration specifies
        10 and self-heal is enabled. The job writes 20; reconciliation restores 10. Repeating the job
        repeats the conflict.

        Compare the automation schedules, desired definitions and API audit trail. The `managedFields` record
        that [server-side apply](/lesson/gx.declarative) keeps can help identify writers, but several
        managers alone do not prove a conflict: controllers often manage different fields legitimately.

        Agree the desired value, remove the competing write without deleting the live object, and verify the
        chosen owner’s next reconciliation.
    - kind: show
      id: diff-example
      code: |
        $ oc diff -f quotas.yaml -n shop
      origin: example
      caption: 'OpenShift 4.21 CLI documentation: diff; command example, not executed'
      notice: |
        Assume quotas.yaml exists in the current directory and defines a ResourceQuota in shop. Diff
        compares that manifest with live state without applying it. An actual run may show differences or
        none; it does not resolve ownership.
    - kind: try
      id: preview-other-project
      body: |
        The current directory contains quotas.yaml defining a ResourceQuota for payments. Type one command
        to preview its differences in payments without applying it.
      accept:
        - oc diff -f quotas.yaml -n payments
        - oc diff -n payments -f quotas.yaml
        - oc -n payments diff -f quotas.yaml
        - oc diff --filename=quotas.yaml --namespace=payments
        - oc diff --filename quotas.yaml --namespace payments
        - oc diff -f ./quotas.yaml -n payments
        - oc diff -n payments -f ./quotas.yaml
        - oc diff -f quotas.yaml --namespace payments
        - oc diff -f quotas.yaml --namespace=payments
        - oc --namespace=payments diff -f quotas.yaml
        - oc diff --namespace payments -f quotas.yaml
        - oc --namespace payments diff -f quotas.yaml
        - oc diff --namespace=payments -f quotas.yaml
        - oc -n payments diff -f ./quotas.yaml
        - oc diff -f ./quotas.yaml --namespace payments
        - oc diff --namespace payments -f ./quotas.yaml
        - oc --namespace payments diff -f ./quotas.yaml
        - oc diff -f ./quotas.yaml --namespace=payments
        - oc diff --namespace=payments -f ./quotas.yaml
        - oc --namespace=payments diff -f ./quotas.yaml
        - oc diff -f=quotas.yaml -n payments
        - oc diff -n payments -f=quotas.yaml
        - oc -n payments diff -f=quotas.yaml
        - oc diff -f=quotas.yaml --namespace payments
        - oc diff --namespace payments -f=quotas.yaml
        - oc --namespace payments diff -f=quotas.yaml
        - oc diff -f=quotas.yaml --namespace=payments
        - oc diff --namespace=payments -f=quotas.yaml
        - oc --namespace=payments diff -f=quotas.yaml
        - oc diff --filename quotas.yaml -n payments
        - oc diff -n payments --filename quotas.yaml
        - oc -n payments diff --filename quotas.yaml
        - oc diff --namespace payments --filename quotas.yaml
        - oc --namespace payments diff --filename quotas.yaml
        - oc diff --filename quotas.yaml --namespace=payments
        - oc diff --namespace=payments --filename quotas.yaml
        - oc --namespace=payments diff --filename quotas.yaml
        - oc diff --filename=quotas.yaml -n payments
        - oc diff -n payments --filename=quotas.yaml
        - oc -n payments diff --filename=quotas.yaml
        - oc diff --filename=quotas.yaml --namespace payments
        - oc diff --namespace payments --filename=quotas.yaml
        - oc --namespace payments diff --filename=quotas.yaml
        - oc diff --namespace=payments --filename=quotas.yaml
        - oc --namespace=payments diff --filename=quotas.yaml
        - oc diff --filename ./quotas.yaml -n payments
        - oc diff -n payments --filename ./quotas.yaml
        - oc -n payments diff --filename ./quotas.yaml
        - oc diff --filename ./quotas.yaml --namespace payments
        - oc diff --namespace payments --filename ./quotas.yaml
        - oc --namespace payments diff --filename ./quotas.yaml
        - oc diff --filename ./quotas.yaml --namespace=payments
        - oc diff --namespace=payments --filename ./quotas.yaml
        - oc --namespace=payments diff --filename ./quotas.yaml
        - oc diff --filename=./quotas.yaml -n payments
        - oc diff -n payments --filename=./quotas.yaml
        - oc -n payments diff --filename=./quotas.yaml
        - oc diff --filename=./quotas.yaml --namespace payments
        - oc diff --namespace payments --filename=./quotas.yaml
        - oc --namespace payments diff --filename=./quotas.yaml
        - oc diff --filename=./quotas.yaml --namespace=payments
        - oc diff --namespace=payments --filename=./quotas.yaml
        - oc --namespace=payments diff --filename=./quotas.yaml
        - kubectl diff -f quotas.yaml -n payments
        - kubectl diff -f ./quotas.yaml -n payments
        - kubectl diff --filename=quotas.yaml --namespace=payments
        - kubectl -n payments diff -f quotas.yaml
      hints:
        - match: ^(oc|kubectl) apply
          say: Apply would write the configuration. The task is to compare it first.
        - match: ^(oc|kubectl) diff(?!.*(?:-n|--namespace))
          say: Name payments explicitly so the preview does not depend on the current project.
        - match: ^(oc|kubectl) get
          say: Get reads live objects; it does not compare them with the local manifest.
      hint: Use the diff subcommand with -f for the file and -n for payments.
      then: |
        On a connected cluster this would compare the file with payments and leave the objects untouched.
        Nothing runs in this practice step. Review the differences and the owning tool before making a
        real change.
    - kind: reflect
      id: explain-ownership
      prompt: A colleague wants one tool for DNS, installation procedures and ongoing quotas. Explain your proposed
        division and how to handle emergency edits.
      model: |
        Use Terraform or OpenTofu for tracked infrastructure, Ansible for checked procedures and bootstrap,
        and Argo CD for declared cluster configuration. Their capabilities overlap, so record the handover
        and one owner for each managed field. After an emergency edit, reconcile the owner’s source
        configuration deliberately so the next run does not undo a needed fix.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can assign ownership across infrastructure and cluster configuration, interpret an empty-state
        plan, protect state, and distinguish a skipped task from a quiet report. You can preview a manifest
        change and investigate competing writers.

        Next, [Pipelines and builds](/lesson/n.cicd) follows an application change from source to the image
        that GitOps deploys.
  sections:
    - id: tool-reference
      title: Tool and ownership reference
      depth: true
      body: |
        | Tool | Operating model | Record of existing resources | Typical responsibility |
        |---|---|---|---|
        | Terraform / OpenTofu | Declarative resource graph, plan then apply | State bindings and provider refresh | Infrastructure outside the cluster |
        | Ansible | Ordered tasks through modules, APIs or SSH | Modules inspect the target; no Terraform-style state mapping | Bootstrap and procedures |
        | Argo CD / OpenShift GitOps | Continuous comparison and configured sync from Git | Git plus live Kubernetes objects | Declared cluster configuration and apps |

        OpenTofu is a Linux Foundation project forked after Terraform’s license change. Its familiar
        configuration and workflow do not guarantee all future features remain interchangeable. Ansible
        Automation Platform adds controlled execution, scheduling and auditing around Ansible.

        These are ownership choices, not capability limits. Terraform has a Kubernetes provider; Ansible has
        Kubernetes modules; Argo CD can manage custom resources whose controllers provision external
        infrastructure. Separate infrastructure and cluster-content changes so a routine quota change does
        not share an approval with cluster replacement.
    - id: k8s-module
      title: Ansible Kubernetes module details
      depth: true
      body: |
        | Setting | Meaning |
        |---|---|
        | state: present | Create or update the declared object |
        | state: absent | Delete the object |
        | state: patched | Patch an existing object; skip a missing object |
        | apply: true | Compare with the previously supplied definition |
        | server_side_apply | Use server-side apply with apply enabled; field management and conflict handling occur at the API server |
        | creates / removes on command | Skip based on a target path; permit partial check-mode prediction |
        | changed_when | Decide the reported change and handler notifications after execution |

        A playbook repeatedly applying manifests corrects drift only when it runs. Use ordered automation
        for procedures such as draining, updating and checking a node; use continuous reconciliation where
        that is the requirement.
    - id: troubleshooting
      title: Troubleshooting ownership and state
      depth: true
      body: |
        | Symptom | Inspect | Response |
        |---|---|---|
        | Plan creates the estate again | Backend, workspace, state history | Restore the correct state or import; do not apply blindly |
        | Plan reverses a manual fix | Configuration diff and incident record | Retain the fix in code or deliberately revert it |
        | Apply cannot acquire a lock | Lock holder and running automation | Wait; unlock only your own verified stale operation |
        | Playbook always reports changes | Module behavior and script preconditions | Prevent unnecessary execution, then make reporting accurate |
        | A quota repeatedly changes back | Competing definitions, schedules, managedFields and audit | Remove the competing write and verify the agreed owner |

        Keep versioned state in a protected backend and secrets outside configuration repositories. A local,
        unprotected state file is unsuitable for shared production automation.
  review:
    - q: What does Terraform's state file record, and why does it matter?
      a: The mapping between configuration and real resources; plans and applies depend on it, so it must be stored
        safely and locked.
    - q: Where does GitOps take over from provisioning tools?
      a: After the cluster exists and GitOps is bootstrapped, the objects assigned to Argo CD are reconciled from
        their Git configuration.
    - q: What happens if Terraform runs with an empty state against existing infrastructure?
      a: It plans to create everything again; recover the state or import the objects instead of applying.
    - q: Why must Terraform state be protected like a secret?
      a: State and saved plans can contain readable secret values even when marked sensitive. Protect storage
        and access; supported ephemeral or write-only values can avoid persistence.
    - q: What makes an Ansible task idempotent, and what breaks it?
      a: An idempotent task checks the target and changes only what is needed. Module behavior varies; command/shell
        tasks need guards or conditions. changed_when only controls reporting.
    - q: Two tools manage the same object. What do you see, and what is the fix?
      a: Conflicting writers repeatedly restore different values. Use definitions and audit to confirm; multiple
        managedFields managers alone are not proof. Choose one owner for the disputed fields.
  labs: []
  limits: |
    No cloud infrastructure or automation tool runs here. Commands are documentation examples and typed
    practice only. The [drift incident](/lab/inc.gitops-drift) supplies the course’s practical
    comparison of a manifest and live configuration.
  enterprise: |
    Keep infrastructure, bootstrap and cluster configuration under explicit owners and review rules.
    Protect remote state with encryption, versioning, access control and supported locking. Use
    controlled automation credentials and hand selected in-cluster objects to GitOps after bootstrap.
  references:
    - title: 'Terraform: State'
      url: https://developer.hashicorp.com/terraform/language/state
    - title: 'Terraform: State locking'
      url: https://developer.hashicorp.com/terraform/language/state/locking
    - title: 'Terraform: Manage sensitive data in state'
      url: https://developer.hashicorp.com/terraform/language/state/sensitive-data
    - title: 'Terraform: Import existing resources'
      url: https://developer.hashicorp.com/terraform/language/import
    - title: OpenTofu FAQ
      url: https://opentofu.org/faq/
    - title: 'OpenTofu: State and plan encryption'
      url: https://opentofu.org/docs/language/state/encryption/
    - title: Ansible kubernetes.core collection (k8s module source and documentation)
      url: https://github.com/ansible-collections/kubernetes.core
    - title: 'Ansible: command module'
      url: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/command_module.html
    - title: 'Argo CD: Cluster bootstrapping (app of apps)'
      url: https://argo-cd.readthedocs.io/en/stable/operator-manual/cluster-bootstrapping/
    - title: 'Ansible: kubernetes.core.k8s module'
      url: https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_module.html
    - title: 'Argo CD: Automated sync and self-healing'
      url: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
    - title: 'Kubernetes: Server-side apply and field management'
      url: https://kubernetes.io/docs/reference/using-api/server-side-apply/
- id: n.cicd
  title: Pipelines and builds
  subtitle: Tekton, Shipwright and BuildConfig
  module: p3-delivery
  mode: ENTERPRISE_ARCHITECTURE
  minutes: 35
  level: 2
  supports: OpenShift 4.21 BuildConfig; OpenShift Pipelines (Tekton) using 1.20/1.21 documentation; Builds for
    Red Hat OpenShift 1.7 (Shipwright). Operators are not installed here. Documentation examples are not executed;
    the labeled build excerpts come from lab.images-builds.
  concepts:
    - cicd.pipelines
    - ocp.imagestreams
    - gitops.argocd
  prerequisites:
    - c.projects-builds
    - gx.argocd
  objective: |
    Place CI, image builds and CD correctly on OpenShift, read and design a Tekton pipeline, choose
    between BuildConfig and Shipwright builds, and build a delivery flow that promotes one tested image
    instead of rebuilding it.
  flow:
    - kind: teach
      id: situation
      title: The tested image changed
      body: |
        Staging passes its tests. The release pipeline rebuilds the same commit for production, but the new
        image behaves differently. A base image or dependency may have changed between builds.

        This lesson follows one image from a commit to production: where builds run, how Tekton connects
        work, how to find a failed step, and how GitOps promotes a tested digest. The pipeline examples are
        for reading and typed practice; no pipeline runs here.
    - kind: teach
      id: ci-and-cd
      title: Separate building from deploying
      body: |
        Continuous integration (CI) checks source changes and can build, test, scan and sign an image.
        Continuous delivery (CD) makes a reviewed, tested release available for deployment.

        Kubernetes runs containers but provides no built-in image-build or pipeline API. OpenShift adds
        BuildConfig, the build API you met in [Projects, builds and ImageStreams](/lesson/c.projects-builds). Two operators add
        more: OpenShift Pipelines packages Tekton, an open-source engine that runs pipelines as pods, and
        Builds for Red Hat OpenShift packages Shipwright, an open-source API for building images. External CI
        runners can produce the same artifacts.

        [Argo CD](/lesson/gx.argocd) supplies the deployment half by comparing Git with the cluster and
        syncing approved configuration.
    - kind: ask
      id: choose-delivery-change
      prompt: Staging tested app at one digest. Production rebuilds the commit and gets another digest. What should
        promotion carry instead?
      choices:
        - text: The tested digest
          why: A different digest identifies different image content. Promote the tested artifact rather than
            assuming a repeat build is identical.
        - text: The moving latest tag
          why: A moving tag can point to different content when each environment pulls it. It does not pin what
            passed tests.
        - text: The same commit plus a fresh build
          why: The commit fixes application source, but base layers, dependencies and build metadata can still
            differ.
      answer: 0
    - kind: teach
      id: task-model
      title: A Task is a recipe; a TaskRun executes it
      body: |
        A Tekton Task defines ordered steps, each run in a container in the same pod.

        A TaskRun is one execution of that Task. For an ordinary container Task, it creates one pod with
        step containers named step-<step-name>. The controller schedules the work; it does not run build
        commands inside its own process.
    - kind: show
      id: task-example
      code: |
        apiVersion: tekton.dev/v1
        kind: Task
        metadata:
          name: check-tools
        spec:
          steps:
            - name: version
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["/bin/sh", "-c"]
              args: ["cat /etc/os-release"]
            - name: identity
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["id"]
      origin: example
      caption: 'Tekton Tasks and TaskRuns documentation: adapted teaching manifest, not executed'
      notice: |
        There are two steps in one Task. An ordinary TaskRun executes them sequentially in one pod. These
        moving tool-image tags keep the example readable; production task definitions should pin approved
        tool images too.
    - kind: ask
      id: count-pods
      prompt: The example Task gains a third container step. How many pods does one ordinary TaskRun need?
      choices:
        - text: Three, one per step
          why: Steps of the same Task share a pod. Separate ordinary Tasks generally use separate pods.
        - text: One, containing the steps
          why: The TaskRun groups the ordered step containers into one pod and can share volumes between them.
        - text: None, because the controller executes it
          why: The controller creates and observes the workload pod; it does not execute the commands itself.
      answer: 1
    - kind: teach
      id: task-data
      title: Pass inputs, values and files
      body: |
        Tasks can take params (input values), publish results (small output values) and use workspaces
        (shared files). For example, an image destination can be a parameter, its built digest a result, and
        the checked-out source a workspace. A Pipeline connects these interfaces between Tasks.
    - kind: teach
      id: pipeline-model
      title: Connect Tasks into a Pipeline
      body: |
        A Pipeline connects Task recipes; a PipelineRun supplies one execution’s inputs. `runAfter` requires
        named Tasks to finish first. Results can pass the built digest into later Tasks. Workspaces pass
        files, often backed by a persistent volume claim (PVC).

        Shared Tasks can be resolved from a cluster namespace, Git or OCI bundles rather than copied into
        every repository. OpenShift Pipelines removed ClusterTask in 1.17; use the cluster resolver for
        shared namespace Tasks. Version shared definitions so their changes are reviewed.
    - kind: show
      id: pipeline-example
      code: |
        apiVersion: tekton.dev/v1
        kind: Pipeline
        metadata:
          name: checked-build
        spec:
          tasks:
            - name: test
              taskRef:
                name: unit-tests
            - name: build
              runAfter: [test]
              taskRef:
                name: build-image
      origin: example
      caption: 'OpenShift Pipelines 1.21 creating pipelines documentation: adapted dependency example, not executed'
      notice: |
        Assume unit-tests and build-image are compatible Tasks already installed in the same project,
        requiring no additional bindings for this sketch. The build waits for test. A real pipeline also
        binds its source, parameters, workspaces and image destination.
    - kind: ask
      id: read-dependency
      prompt: What happens to build after test fails under normal failure behavior?
      choices:
        - text: It starts because both Tasks exist
          why: Existence is not the dependency. runAfter requires the preceding Task to complete successfully
            under this normal failure behavior.
        - text: It reruns the tests inside its own pod
          why: runAfter expresses ordering; it neither copies steps nor implements a retry policy.
        - text: It does not start
          why: The failed dependency prevents the normal build Task from running. Inspect the test TaskRun and
            its step log.
      answer: 2
      evidence: |
        # Excerpt of the example Pipeline, with no failure overrides or finally Tasks
        tasks:
          - name: test
            taskRef: {name: unit-tests}
          - name: build
            runAfter: [test]
            taskRef: {name: build-image}
    - kind: teach
      id: choose-build-api
      title: Choose the build API for the destination
      body: |
        BuildConfig is an OpenShift API with Dockerfile, Source-to-Image and Custom strategies. It remains
        supported in 4.21; its Jenkins pipeline strategy is deprecated. Its Build capability can be omitted
        during installation.

        Shipwright defines Build (the source, strategy and output) and BuildRun (an execution). Builds for
        Red Hat OpenShift packages it with reusable strategies, including Buildah, Source-to-Image and
        buildpacks. The upstream Shipwright project can run on Kubernetes outside OpenShift; that does not
        extend Red Hat product support to every distribution.
    - kind: ask
      id: portable-builds
      prompt: A partner runs upstream Kubernetes and needs the same build API as your OpenShift team. Which option
        should you evaluate?
      choices:
        - text: Upstream Shipwright
          why: Its custom-resource build API can be installed on Kubernetes. Verify the target platform and strategy
            requirements separately.
        - text: BuildConfig without its operator
          why: BuildConfig belongs to OpenShift, not the standard Kubernetes API. Removing an operator does not
            make that API portable.
        - text: Kubernetes built-in BuildRun
          why: Kubernetes has no built-in BuildRun kind. Shipwright adds it through its controllers and custom
            resources.
      answer: 0
    - kind: show
      id: build-recording
      code: |
        $ oc get istag hello:latest -n academy-builds
        NAME           IMAGE REFERENCE                                                                                                                                 UPDATED
        hello:latest   image-registry.openshift-image-registry.svc:5000/academy-builds/hello@sha256:9c3f0be923a237d7df969f3cb35187f6da1a60ed211bdb756b647e22d7eb13a5   3 seconds ago

        $ oc get deploy hello -n academy-builds -o jsonpath='{.spec.template.spec.containers[0].image}'
        image-registry.openshift-image-registry.svc:5000/academy-builds/hello@sha256:a2cbc9dd4d5c47febd0ea4fe7ce71e07d4de621c6334e5856f68c9efd2c1fe9f
      origin: lab
      caption: 'Images and builds lab (lab.images-builds): two exact command/output excerpts'
      notice: |
        The first excerpt reads the first built image’s ImageStream tag. The second reads the Deployment’s
        image after the second build and image-change trigger. Both builds used the same Dockerfile, yet the
        sha256 values differ. OpenShift writes per-build environment variables into the image, such as
        `OPENSHIFT_BUILD_NAME`, and timestamps and base images can change too: a rebuild is a different image,
        which is why rebuilding is not promotion.
    - kind: teach
      id: promotion
      title: Approve the same artifact at each stage
      body: |
        Build once, then scan and test the image, push it to the registry, and sign its digest with
        provenance (evidence of its build inputs and process). The pipeline opens a pull request changing
        the first environment’s digest in the GitOps repository.

        After Argo CD syncs that change and environment tests pass, another reviewed pull request carries
        the same digest to the next environment. Production approval is the protected merge. Give CI scoped
        image-push and pull-request rights; keep production deployment rights with GitOps. Protect merge
        rules too, so CI cannot approve its own release.
    - kind: ask
      id: separate-credentials
      prompt: CI can push images and open pull requests. Which extra permission would defeat this production approval
        boundary?
      choices:
        - text: Read the source repository
          why: CI needs source access to build it. Read access alone does not authorize a production change.
        - text: Change production Deployments
          why: A compromised pipeline could bypass the protected Git approval path and deploy directly.
        - text: Publish its test report
          why: Publishing results supplies reviewers with evidence. It does not authorize changes to production
            workloads.
      answer: 1
    - kind: teach
      id: debug-path
      title: Follow a failed run down to the step
      body: |
        Start with the PipelineRun to identify the failed TaskRun. Read that TaskRun’s status to find its
        podName, failing step, termination reason and exit code. Then read the named step container’s log in
        that pod.

        A Pending pod needs events: a workspace claim may be unbound, quota may reject creation, or
        scheduling may lack resources. A registry push denial needs the push step’s log and the run
        identity’s scoped credentials. Controller logs describe the controller, not your test program’s
        output.
    - kind: show
      id: logs-example
      code: |
        $ oc get taskrun unit-tests-7 -n delivery -o yaml
        $ oc logs unit-tests-7-pod -c step-run -n delivery
      origin: example
      caption: 'Tekton TaskRuns documentation and OpenShift 4.21 CLI: inspection examples, not executed'
      notice: |
        Assume the TaskRun status names unit-tests-7-pod and its failing step is run. The first command
        supplies status; the second reads the test process’s output. No example output is presented as a
        recording.
