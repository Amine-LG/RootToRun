# Lessons of this file, in the order of content/en/modules.yaml. Format: docs/AUTHORING.md.
- id: d.services-dns
  title: "Services, EndpointSlices and DNS"
  subtitle: "How a name becomes a pod, and how to tell three failures apart"
  module: a5-network
  mode: REAL_LAB
  minutes: 50
  level: 2
  supports: "Kubernetes 1.34 Services and discovery.k8s.io/v1 EndpointSlices; OVN-Kubernetes on OpenShift 4.21. Recorded on OpenShift Local (service network 10.217.4.0/23, cluster DNS at 10.217.4.10) as an ordinary user, in a temporary project."
  concepts: [net.services, net.endpointslices, net.dns, k8s.labels]
  simulator: traffic
  prerequisites: [b.pod-lifecycle, b.health-probes]
  record_on: cluster
  objective: |
    Trace how a name like `web` becomes a pod IP: DNS, the Service's virtual IP, EndpointSlices and
    readiness. Be able to tell "no endpoints", "wrong port" and "DNS" apart in one command each.
  diagram: request-path
  flow:
    - kind: teach
      id: situation
      title: "A name that outlives its pods"
      body: |
        A checkout service calls `http://payments:8080` all day. At every release, each payments pod is replaced,
        and each new pod has a new IP address. Checkout never notices. When this promise breaks, the ticket says
        "the network is down", and almost always the network is fine: a Service, a name or a port is wrong.

        A **Service** keeps the promise. It has three parts: a stable virtual IP address inside the cluster, its
        **ClusterIP**; a DNS name; and a **selector**, a set of labels that says which pods stand behind it.
        [Deploying, exposing and scaling applications](/lesson/o1.deploy-apps) built that chain once.

        This lesson follows a request from the name to the pod. Then it breaks the path three different ways,
        because each break gives a different error, and each error points at a different place.
    - kind: ask
      id: recall-readiness
      recalls: b.health-probes
      prompt: "A look back. A pod is `Running`, but its readiness probe now fails. What does its Service's EndpointSlice show for it?"
      choices:
        - text: "The pod, listed and marked not ready"
          why: "The slice keeps the address with `ready: false`, so the Service sends the pod no new connections and nothing restarts it."
        - text: "Nothing: the pod's entry is removed"
          why: "The entry stays. Removing it would hide the difference between a pod that matches the Service but is not ready and a Service that matches no pod at all."
        - text: "The pod, listed as ready until it restarts"
          why: "Readiness is checked continuously, and a failing probe takes effect without a restart. Restarts are the liveness probe's action."
      answer: 0
    - kind: show
      id: service-yaml
      body: |
        Everything below runs in one project, from two of the lesson's source files (listed under "Before you
        start"). `web.yaml` holds a ConfigMap with a one-line page, `hello from web`, and a Deployment `web` of two
        Apache web server pods, labelled `app: web`, that serve that page. `service.yaml` is the Service in front of
        them:
      code: |
        apiVersion: v1
        kind: Service
        metadata:
          name: web
        spec:
          selector:
            app: web
          ports:
          - name: http
            port: 8080
            targetPort: 8080
      caption: "service.yaml"
      notice: |
        Three fields matter. `selector` says which pods: those labelled `app: web`. `port` is the port clients
        use when they call the Service. `targetPort` is the port the container listens on. They can differ, and
        Kubernetes never checks that `targetPort` is right.
    - kind: show
      id: apply
      run: "oc apply -f web.yaml -f service.yaml; oc rollout status deployment/web --timeout=180s; oc get service web; oc get endpointslices -l kubernetes.io/service-name=web"
      highlight: ["ClusterIP", "8080"]
      notice: |
        The Deployment's two pods are available, and the Service has a `ClusterIP`: an address from the cluster's
        service network, reachable only from inside the cluster. The cluster also keeps an **EndpointSlice** for the Service: a list
        of the addresses of the pods that match the selector, each marked ready or not. Here it holds the two
        pods' addresses on port 8080. Its name is generated, so you always find it by the label
        `kubernetes.io/service-name`.
    - kind: teach
      id: dns
      title: "The name"
      body: |
        Every pod has a **resolver**, the part that turns names into addresses, and it is pointed at the
        cluster's own DNS server. OpenShift runs CoreDNS for it, as the `dns-default` pods in the
        `openshift-dns` project. That server answers for every Service in the cluster, so a Service's name
        resolves as soon as the Service exists.
    - kind: ask
      id: guess-lookup
      guess: true
      prompt: "A pod inside the cluster looks up the name `web`. Which address comes back?"
      choices:
        - text: "The IP of one of the two web pods"
          why: "That is what a headless Service returns, which comes later. A normal Service has an address of its own in front of its pods. The lookup below shows it."
        - text: "The IP of the node running the pods"
          why: "Cluster DNS never returns node addresses for a normal Service. Node addresses are what a NodePort Service uses from outside. The lookup below shows the real answer."
        - text: "The Service's ClusterIP"
          why: "The Service is the stable name, and its ClusterIP is the stable address. Spreading connections over the pods happens after the lookup. The lookup below shows it."
      answer: 2
    - kind: show
      id: toolbox
      run: "oc create deployment toolbox --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/toolbox --timeout=180s; oc get pods -l app=toolbox"
      body: |
        To look up a name the way a program does, we use `getent hosts <name>`, which asks the system's name
        databases, DNS included. It has to run inside the cluster, so we start `toolbox`: a pod that only waits,
        with `getent` and `curl` in it.
      notice: "One pod called `toolbox`, running. Nothing else about it matters: it is a place to run commands from."
    - kind: show
      id: lookup
      body: "`oc exec deploy/toolbox -- <command>` runs a command inside that pod; the `--` separates the options of `oc` from the command."
      run: "oc exec deploy/toolbox -- getent hosts web"
      highlight: ["svc.cluster.local"]
      notice: |
        One address and one name. The address is the Service's ClusterIP, the same one `oc get service web`
        printed. `getent` also prints the full name that the short name `web` was completed to: the Service,
        the project, `svc`, and the cluster's domain. DNS answered for the Service. No pod address appears.
    - kind: teach
      id: connection
      title: "From the ClusterIP to a pod"
      body: |
        The ClusterIP belongs to no pod and no machine, and no process listens on it. When a pod connects to
        `ClusterIP:8080`, the cluster's network plugin changes the destination to the IP and `targetPort` of one
        **ready** pod taken from the Service's EndpointSlices. On OpenShift that plugin is OVN-Kubernetes, and it
        does this on every node. Upstream Kubernetes usually uses `kube-proxy` for the same job.

        Two consequences. The ClusterIP answers only on the ports the Service declares. And `ping` tells you
        nothing about a Service: test it with the protocol the application speaks. `curl` is a command-line web
        client; `-s` keeps it quiet and `-m 3` gives up after three seconds.
    - kind: show
      id: call
      run: "oc exec deploy/toolbox -- curl -s -m 3 http://web:8080/"
      notice: "The web server's page. The request went from the name to the ClusterIP to one of the two pods. Which pod answered is not visible here, and the caller does not need to know."
    - kind: explore
      id: request-path
      diagram: request-path
      body: "The same path as a diagram. Select the Service, the EndpointSlices and the Pod to read what each one does. The client, the router and the Route are the way in from outside the cluster; the next lesson covers them."
    - kind: teach
      id: pods-change
      title: "Pods come and go, the Service stays"
      body: |
        Now the promise itself. We delete every pod of `web` and let the Deployment replace them, printing the
        Service's address and the pods' addresses before and after. `-o custom-columns` chooses which columns
        to print.
    - kind: show
      id: restart
      run: "echo before; oc get service web -o custom-columns=NAME:.metadata.name,CLUSTER-IP:.spec.clusterIP; oc get pods -l app=web -o custom-columns=NAME:.metadata.name,IP:.status.podIP; oc delete pod -l app=web >/dev/null; oc wait pod -l app=web --for=condition=Ready --timeout=120s >/dev/null; echo after; oc get service web -o custom-columns=NAME:.metadata.name,CLUSTER-IP:.spec.clusterIP; oc get pods -l app=web -o custom-columns=NAME:.metadata.name,IP:.status.podIP"
      highlight: ["before", "after"]
      notice: "The pods have new names and new IP addresses. The Service has the same ClusterIP. A client that kept using the name never noticed."
    - kind: teach
      id: short-names
      title: "Short names, and where they stop"
      body: |
        How did `web` become a full name? Each pod's `/etc/resolv.conf` tells its resolver where DNS is and
        which suffixes to try on a short name. The first suffix is the pod's own project, so `web` is tried as
        `web.<project>.svc.cluster.local`.

        `ndots:5` means that a name with fewer than five dots is tried with each suffix before it is tried as
        written. That is what makes short names work, and it is also why looking up an external name such as
        `api.example.com` costs a few extra queries.
    - kind: show
      id: resolv
      run: "oc exec deploy/toolbox -- cat /etc/resolv.conf"
      highlight: ["search", "nameserver", "ndots"]
      notice: |
        `search` lists the suffixes, starting with this project's. `nameserver` is the address of the cluster's DNS
        service. The last suffix, `crc.testing`, comes from the machine this cluster runs on, not from OpenShift.
    - kind: ask
      id: guess-other-project
      guess: true
      prompt: "The Service `kubernetes` lives in the project `default`. From `toolbox`, in this project, you look up `kubernetes`. What happens?"
      choices:
        - text: "It finds nothing: only this project is searched"
          why: "The suffixes complete `kubernetes` with this project's name first, then with `svc.cluster.local` and `cluster.local`. None of them names the project `default`. The next step shows the failure."
        - text: "It resolves: Service names are unique in the cluster"
          why: "Service names are unique only inside a project, and two projects can both have a `web`. The short name is completed with the caller's own project only. The next step shows it."
        - text: "It is refused, because `default` is another project"
          why: "DNS does not check who is asking. A name from another project resolves when you write the project in the name. The next step shows what fails and what works."
      answer: 0
    - kind: show
      id: lookup-short-fails
      run: "oc exec deploy/toolbox -- getent hosts kubernetes"
      notice: "No address. `getent` ends with exit status 2, which means that the name was not found. Nothing is wrong with DNS: no Service called `kubernetes` exists in this project."
    - kind: try
      id: try-qualified
      body: "Resolve the Service `kubernetes` of the project `default` from `toolbox`: add the project's name to the name."
      accept: ["oc exec deploy/toolbox -- getent hosts kubernetes.default", "oc exec deploy/toolbox -- getent hosts kubernetes.default.svc", "oc exec deploy/toolbox -- getent hosts kubernetes.default.svc.cluster.local", "oc exec deployment/toolbox -- getent hosts kubernetes.default", "oc exec deployment/toolbox -- getent hosts kubernetes.default.svc", "oc exec deployment/toolbox -- getent hosts kubernetes.default.svc.cluster.local"]
      hints:
        - match: "getent hosts kubernetes$"
          say: "That is the short name that failed a moment ago. Add the project after it, joined with a dot."
        - match: "kubernetes/default|default/kubernetes|default\\.kubernetes"
          say: "The Service's name comes first, then a dot, then the project: `<service>.<project>`."
        - match: "-n default"
          say: "`-n default` would look for the `toolbox` pod in the project `default`. The pod stays here; the project goes into the name that you look up."
        - match: "^oc exec (deploy|deployment)/toolbox -- kubernetes"
          say: "The command to run in the pod is `getent hosts`, followed by the name."
        - match: "^kubectl"
          say: "`kubectl exec` would work too. This course uses `oc`, as in the rest of the lesson."
      hint: "Keep the pod and the lookup command; write the name as `<service>.<project>`."
      run: "oc exec deploy/toolbox -- getent hosts kubernetes.default"
      then: |
        `kubernetes.default` is `<service>.<project>`, and it works from any project. The resolver completed it to
        `kubernetes.default.svc.cluster.local`. This Service is the cluster's API server: every cluster has one in
        `default`.
    - kind: teach
      id: dns-service-not-pods
      title: "DNS knows the Service, not its pods"
      body: |
        A name resolves as soon as the Service exists, whatever stands behind it. So a name that does not resolve
        points at the name, the project or DNS itself, never at missing pods.

        The other direction matters as much. If the Service's selector matches no pod, the name still resolves,
        and the connection fails. To see it, we change the selector of `web` to `app=web,tier=blue`, a label that
        no pod carries.
    - kind: ask
      id: guess-no-endpoints
      guess: true
      prompt: "The selector of `web` now matches no pod. From `toolbox`, what does `curl http://web:8080/` report?"
      choices:
        - text: "Could not resolve host: web"
          why: "The name still resolves: DNS answers for the Service, and the Service exists. Name resolution fails only when the name or the project is wrong. The next steps show it."
        - text: "Connection refused"
          why: "The name resolves to the ClusterIP, but there is no endpoint to forward to, and the network plugin refuses the connection. The next steps show it."
        - text: "An HTTP 503 response"
          why: "A Service forwards connections and never makes up HTTP status codes. A 503 comes from the router, which sits in front of a Route. The next steps show what a Service does."
      answer: 1
    - kind: show
      id: break-selector
      run: "oc set selector service web app=web,tier=blue; sleep 3; oc get endpointslices -l kubernetes.io/service-name=web; oc exec deploy/toolbox -- getent hosts web; oc exec deploy/toolbox -- curl -sS -m 3 http://web:8080/"
      highlight: ["<unset>", "Connection refused"]
      notice: |
        Three results, one after another. The slice lists no address (`<unset>`): the selector matches no pod,
        although both pods are running and healthy. The name still resolves, to the same ClusterIP as before. And
        `curl` is refused: `Connection refused`, curl's exit status 7 (`-S` makes a quiet `curl` still print its
        error). The network plugin rejects connections to a Service that has no ready endpoint: something answered,
        and the answer was no. A timeout, shown later, is different. A 503 is the answer of the OpenShift router for
        a Route, one layer further out.
    - kind: show
      id: fixed
      run: "oc set selector service web app=web; sleep 3; oc exec deploy/toolbox -- curl -s -m 3 http://web:8080/"
      notice: "The selector matches the pods again, and the page is back. Nothing was changed in the pods."
    - kind: teach
      id: wrong-port
      title: "The port that does not match"
      body: |
        A Service has two port fields. `port` is what clients call. `targetPort` is where the container listens.
        The slice always shows the **target** port, because that is where traffic is sent.

        Nobody checks `targetPort` against the program. A colleague writes a second Service, `web-wrong`, with
        `targetPort: 80`, because most web servers listen on 80, but this one listens on 8080. `oc expose` can
        make the same mistake on purpose with `--target-port`:
    - kind: show
      id: create-wrong
      run: "oc expose deployment web --name=web-wrong --port=8080 --target-port=80; oc get services"
      notice: "Two Services now select the same pods. `web-wrong` has the same selector, so its pods are found and ready. Only its `targetPort` differs."
    - kind: try
      id: try-slices
      body: "The slice of `web-wrong` shows where its traffic really goes. List the EndpointSlices that carry the label `kubernetes.io/service-name=web-wrong`."
      accept: ["oc get endpointslices -l kubernetes.io/service-name=web-wrong", "oc get endpointslices -l=kubernetes.io/service-name=web-wrong", "oc get endpointslices -lkubernetes.io/service-name=web-wrong", "oc get endpointslices --selector=kubernetes.io/service-name=web-wrong", "oc get endpointslices --selector kubernetes.io/service-name=web-wrong", "oc get endpointslice -l kubernetes.io/service-name=web-wrong", "oc get endpointslice -l=kubernetes.io/service-name=web-wrong", "oc get endpointslice -lkubernetes.io/service-name=web-wrong", "oc get endpointslice --selector=kubernetes.io/service-name=web-wrong", "oc get endpointslice --selector kubernetes.io/service-name=web-wrong", "oc get endpointslices.discovery.k8s.io -l kubernetes.io/service-name=web-wrong", "oc get endpointslices -l kubernetes.io/service-name=web-wrong -o wide", "oc get endpointslice -l kubernetes.io/service-name=web-wrong -o wide", "oc get endpointslices -o wide -l kubernetes.io/service-name=web-wrong", "oc get endpointslice -o wide -l kubernetes.io/service-name=web-wrong", "oc get endpointslices --selector=kubernetes.io/service-name=web-wrong -o wide", "oc get endpointslice --selector=kubernetes.io/service-name=web-wrong -o wide"]
      hints:
        - match: "service-name=web$"
          say: "That is the slice of the first Service, `web`. Ask for the one labelled `web-wrong`."
        - match: "^oc get (service|services|svc)"
          say: "That shows the Service's own ports. The addresses and ports that traffic really reaches are in its EndpointSlice."
        - match: "^oc get endpoints"
          say: "`Endpoints` is the older object. The current one is the EndpointSlice, and the label that finds it is `kubernetes.io/service-name`."
        - match: "^oc get endpointslices?$"
          say: "That would list every slice in the project. Add `-l` and the label to keep the one of `web-wrong`."
        - match: "^oc describe"
          say: "`describe` works too, but it needs the slice's generated name. `oc get` with `-l` finds it by label."
      hint: "`oc get endpointslices`, then `-l` and the label with the Service's name."
      run: "oc get endpointslices -l kubernetes.io/service-name=web-wrong"
      then: |
        The pods are listed, and `PORTS` says `80`. The selector matches and the pods are ready, but traffic is sent
        to port 80, where nothing listens. Kubernetes accepted the Service without a warning.
    - kind: show
      id: refused-wrong-port
      run: "oc exec deploy/toolbox -- curl -sS -m 3 http://web-wrong:8080/"
      notice: |
        Refused again, this time with ready pods behind the Service. So `Connection refused` alone does not tell
        "no endpoints" from "wrong port". The slice does: `<unset>` means the selector matches no pod, and a `PORTS`
        value that differs from what the program listens on means a wrong `targetPort`.
    - kind: teach
      id: three-failures
      title: "Three failures, three signatures"
      body: |
        The way `curl` fails is evidence about where to look:

        | curl says | Exit status | Most likely |
        |---|---|---|
        | `Could not resolve host` | 6 | the name or the project is wrong, or DNS is broken |
        | `Connection refused` | 7 | no ready endpoint, or nothing listens on the `targetPort` |
        | `Connection timed out` | 28 | packets are dropped on the way, typically by a NetworkPolicy |

        You have seen the second one twice. What does a mistyped name give?
    - kind: ask
      id: guess-typo
      guess: true
      prompt: "A client calls `http://webb:8080/`, but the Service is called `web`. What does `curl` report?"
      choices:
        - text: "Connection refused, exit status 7"
          why: "A refusal needs a name that resolved, to a Service with no endpoint or a wrong port. `webb` resolves to nothing, so no connection is tried. The next step shows it."
        - text: "Could not resolve host, exit status 6"
          why: "The name is looked up first, and `webb` matches no Service, so resolution fails before any connection. The next step shows it."
        - text: "Connection timed out, exit status 28"
          why: "A timeout means packets were sent and dropped. Here nothing is sent, because the name gives no address. The next step shows it."
      answer: 1
    - kind: show
      id: typo
      run: "oc exec deploy/toolbox -- curl -sS -m 3 http://webb:8080/"
      highlight: ["Could not resolve host"]
      notice: |
        `webb` has an extra `b`. Resolution fails before any connection is tried, so the cause is the name, not
        the pods. As the list of Services after `web-wrong` was created showed, only `web` and `web-wrong` exist, and
        no `webb`. The fix is in the client's configuration, not in the cluster.
    - kind: teach
      id: timeout
      title: "A timeout: something drops packets"
      body: |
        A timeout is different from a refusal: nobody answered, not even to refuse. The usual cause is a
        **NetworkPolicy**, an object that tells the network which pods may talk to which. A later lesson,
        [NetworkPolicies and OVN-Kubernetes](/lesson/d.networkpolicy-ovn), covers them. This one is the smallest
        possible policy: it selects the `web` pods and allows no incoming traffic at all.
    - kind: show
      id: policy-yaml
      code: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: deny-web
        spec:
          podSelector:
            matchLabels:
              app: web
          policyTypes:
          - Ingress
      caption: "deny-web.yaml"
      notice: "`podSelector` chooses the pods that the policy protects. Listing `Ingress` without any rule means that no incoming connection is allowed."
    - kind: show
      id: timed-out
      run: "oc apply -f deny-web.yaml; sleep 3; oc exec deploy/toolbox -- curl -sS -m 3 http://web:8080/; oc delete -f deny-web.yaml"
      highlight: ["timed out", "exit code"]
      notice: "`curl` waited the full three seconds and ended with exit status 28. The Service, its slice and the name were fine; the traffic never arrived. The last line removes the policy again."
    - kind: ask
      id: read-timeout
      prompt: "A client's `curl` ends with exit status 28. The Service's slice lists two ready pods on the right port. Where do you look next?"
      evidence: |
        curl: (28) Connection timed out after 3060 milliseconds
        command terminated with exit code 28
      choices:
        - text: "The Service's selector"
          why: "A selector that matches nothing gives an empty slice and a quick `Connection refused`. This slice lists two ready pods, so the selector is fine."
        - text: "The name in DNS"
          why: "A wrong name fails at once with `Could not resolve host`. This client got as far as sending packets, which is how it timed out."
        - text: "The NetworkPolicies of the project"
          why: "Ready endpoints on the right port, and still no answer, means that packets are dropped on the way. A NetworkPolicy is the usual reason: `oc get networkpolicy` lists them."
      answer: 2
    - kind: teach
      id: service-types
      title: "Which kind of Service?"
      body: |
        Everything so far used the default type. Which type to choose depends on who must reach the Service:

        | Type | You get | Use it for |
        |---|---|---|
        | `ClusterIP` (default) | a virtual IP inside the cluster | pod-to-pod calls, and the target of Routes |
        | headless (`clusterIP: None`) | no virtual IP: DNS returns the ready pods' addresses | StatefulSets, clients that pick their own peer |
        | `NodePort` | a ClusterIP plus a port (30000-32767 by default) on every node | non-HTTP traffic with no load balancer |
        | `LoadBalancer` | a NodePort plus an external address from the infrastructure | non-HTTP traffic on clouds or with MetalLB |
        | `ExternalName` | a DNS alias to an outside host name; nothing is proxied | giving an external service a cluster-local name |

        On OpenShift, HTTP and TLS applications (TLS: the encryption in HTTPS) are normally
        exposed with a Route in front of a ClusterIP Service. Next, the headless case: a lookup of `web` and
        `web-headless`, a second Service on the same pods with `--cluster-ip=None`.
    - kind: show
      id: headless
      run: "oc expose deployment web --name=web-headless --cluster-ip=None --port=8080; oc exec deploy/toolbox -- getent hosts web web-headless"
      notice: "`web` returns its one ClusterIP. `web-headless` has no virtual IP, so DNS returns the address of each ready pod behind it. The client chooses; nothing load-balances for it."
    - kind: ask
      id: choose-exposure
      prompt: "A database speaking plain TCP must be reachable from outside the cluster, on a cloud platform. Which object fits?"
      choices:
        - text: "A LoadBalancer Service"
          why: "The infrastructure provides an external address that forwards TCP to the Service's node ports. On OpenShift Local, which has no load-balancer provider, it stays `<pending>`."
        - text: "A Route"
          why: "A Route carries HTTP and TLS, found by host name through the router. An arbitrary TCP protocol does not fit through it."
        - text: "An ExternalName Service"
          why: "ExternalName goes the other way: it gives an outside host a name inside the cluster. It exposes nothing."
      answer: 0
    - kind: explore
      id: traffic
      sim: traffic
      body: "Break each link in the model: edit the selector, the port or a policy, send a request from the router or from a client pod, and see where it stops and with which error. Predict the error before you send."
    - kind: reflect
      id: explain-refused
      prompt: "A junior colleague says: \"The Service exists and its name resolves, so the network is fine, yet every connection is refused.\" In a few sentences, explain how that can be, and what you check."
      model: |
        DNS only knows the Service object, so the name resolves as soon as the Service exists. The real backends are
        the ready pods whose labels match its selector, listed in its EndpointSlice. A connection to the ClusterIP
        is forwarded to one of those pod IPs on the targetPort. If the selector matches nothing, the slice is empty
        and the connection is refused. If the targetPort is not the port the program listens on, the slice looks
        healthy and the pod refuses. So I read the slice: no endpoints means a selector or readiness problem, and a
        PORTS value that differs from the program's port means a targetPort problem.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can follow a name to a pod: DNS gives the ClusterIP, and the network plugin forwards the connection to a
        ready endpoint on the `targetPort`. You can resolve a Service from another project with `<service>.<project>`.
        And you can tell three failures apart: a name that does not resolve (exit 6), a refusal (exit 7), which the
        EndpointSlice splits into "no endpoints" and "wrong port", and a timeout (exit 28).

        The next lesson, [Routes, the router and TLS termination](/lesson/d.routes-tls), covers the way in from
        outside the cluster. The incidents [Could not resolve host](/lab/inc.dns-typo),
        [Route returns 503, pods are healthy](/lab/inc.service-selector-503) and
        [Endpoints exist, connections are refused](/lab/inc.wrong-targetport) let you diagnose these failures on
        your own.
  sections:
    - id: endpointslice-conditions
      title: "EndpointSlice conditions, and large Services"
      depth: true
      body: |
        Each endpoint carries three conditions:

        | Condition | Means |
        |---|---|
        | `ready` | serving and not terminating: the endpoint that receives new connections |
        | `serving` | the pod passes its readiness probe, even while it is shutting down |
        | `terminating` | the pod has been marked for deletion |

        `serving` and `terminating` exist so that proxies can handle graceful shutdown. For everyday troubleshooting,
        `ready` is the one to read. A Service with `publishNotReadyAddresses: true` marks every endpoint ready,
        which StatefulSets use to publish their peers before they are ready.

        A large Service is split over several slices (at most 100 endpoints each by default), so always select
        slices by label rather than by name.

        `targetPort` may be a **name** (`targetPort: http`), resolved per pod from the container's `ports[].name`.
        Different pods can then listen on different numbers behind one Service, and a new version that moves the
        application to another port changes only the pod template.
    - id: what-goes-wrong
      title: "What goes wrong, and how to prove it"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | `Could not resolve host: payments-web` | `oc get svc` lists no such Service; `getent hosts` exits 2 | typo, or the short name used from another project | correct the name, or use `<service>.<project>` |
        | refused at once; slice `ENDPOINTS <unset>` | `oc get pods --show-labels` against the Service's selector | the selector does not match the pod labels | fix the selector (`oc set selector`) or the labels |
        | refused at once; endpoint listed, `PORTS 80` | the app answers on `localhost:8080` inside the pod | wrong `targetPort` | patch the Service's `targetPort` |
        | Route 503, pod `0/1` Running | endpoint `ready=false`; `Unhealthy` events | the readiness probe fails | fix the probe or the app |
        | timeout after the client's limit | endpoints fine; `oc get networkpolicy` lists policies | traffic dropped by a policy | add the missing allow rule |

        Every row is a recorded incident: [Could not resolve host](/lab/inc.dns-typo),
        [Route returns 503, pods are healthy](/lab/inc.service-selector-503),
        [Endpoints exist, connections are refused](/lab/inc.wrong-targetport),
        [Running but never Ready](/lab/inc.readiness-503) and
        [Timeouts after security hardening](/lab/inc.networkpolicy-block). Work through them without hints once you
        have done the guided lab; keep the last one for after
        [NetworkPolicies and OVN-Kubernetes](/lesson/d.networkpolicy-ovn), in the administration territory.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Selector copied from the Deployment's labels.** A Service selects pods, so compare its selector with
          `oc get pods --show-labels`, not with the labels on the Deployment object.
        - **Confusing `port` and `targetPort`.** Clients use `port`; `targetPort` must be the port the process
          listens on. The `containerPort` field in the pod spec is informational and does not open or move anything.
        - **Using the short name across projects.** `web` only resolves inside the Service's project; from
          elsewhere use `web.<project>`.
        - **Expecting a Running pod to receive traffic.** For ordinary routing only ready endpoints get traffic: a
          failing readiness probe takes the pod out of rotation (its endpoint stays listed, marked not ready).
        - **Selecting too much.** A selector such as `tier=web` that also matches another application's pods mixes
          two backends behind one name; requests then fail at random. Use a label unique to the application.
  review:
    - q: "Which three things must line up for a Service to deliver traffic?"
      a: "The selector matches the pods' labels, the targetPort matches the port the container listens on, and the pods are ready."
    - q: "What DNS name reaches Service `web` in project `shop` from another project?"
      a: "web.shop (or web.shop.svc.cluster.local)."
    - q: "What does `ENDPOINTS <unset>` in an EndpointSlice tell you, and what does a timeout from curl usually tell you?"
      a: "<unset>: the selector matches no pod. Timeout: packets are being dropped, typically by a NetworkPolicy."
    - q: "A pod fails its readiness probe. What happens to its EndpointSlice entry?"
      a: "It stays listed with ready=false and receives no new connections; the container is not restarted."
    - q: "Which curl exit status means a name that does not resolve, which a refusal, which a timeout?"
      a: "6 for a name that does not resolve, 7 for connection refused, 28 for a timeout."
    - q: "What does DNS return for a headless Service?"
      a: "The addresses of the ready pods behind it, instead of a virtual IP."
  labs: [lab.request-path, lab.probes-endpoints, inc.service-selector-503, inc.wrong-targetport, inc.dns-typo]
  enterprise: |
    Most "the network is broken" tickets are Service, selector, port or readiness mistakes. A platform team that
    publishes a three-command triage (endpoints, ports, DNS) and the meaning of each curl error saves the network
    team many escalations.
  references:
    - {title: "Kubernetes: Service", url: "https://kubernetes.io/docs/concepts/services-networking/service/"}
    - {title: "Kubernetes: EndpointSlices", url: "https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/"}
    - {title: "Kubernetes: DNS for Services and Pods", url: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"}
    - {title: "OpenShift 4.21: DNS Operator", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/networking_operators/dns-operator"}
  commands:
    - cmd: "oc apply -f web.yaml -f service.yaml; oc rollout status deployment/web --timeout=180s; oc get service web; oc get endpointslices -l kubernetes.io/service-name=web"
      meaning: "two web pods and the Service in front of them, with its ClusterIP and its EndpointSlice"
    - cmd: "oc create deployment toolbox --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/toolbox --timeout=180s; oc get pods -l app=toolbox"
      meaning: "a pod to run commands from inside the cluster"
    - cmd: "oc exec deploy/toolbox -- getent hosts web"
      meaning: "DNS from the application's point of view: the Service's ClusterIP"
    - cmd: "oc exec deploy/toolbox -- curl -s -m 3 http://web:8080/"
      meaning: "a call to the Service by name"
    - cmd: "echo before; oc get service web -o custom-columns=NAME:.metadata.name,CLUSTER-IP:.spec.clusterIP; oc get pods -l app=web -o custom-columns=NAME:.metadata.name,IP:.status.podIP; oc delete pod -l app=web >/dev/null; oc wait pod -l app=web --for=condition=Ready --timeout=120s >/dev/null; echo after; oc get service web -o custom-columns=NAME:.metadata.name,CLUSTER-IP:.spec.clusterIP; oc get pods -l app=web -o custom-columns=NAME:.metadata.name,IP:.status.podIP"
      meaning: "new pods, new IPs, the same ClusterIP"
      timeout: 240
    - cmd: "oc exec deploy/toolbox -- cat /etc/resolv.conf"
      meaning: "the search suffixes, the cluster DNS address and ndots"
    - cmd: "oc exec deploy/toolbox -- getent hosts kubernetes"
      expect: fail
      meaning: "a short name is completed with this project only: not found, exit status 2"
    - cmd: "oc exec deploy/toolbox -- getent hosts kubernetes.default"
      meaning: "service.project reaches a Service in another project"
    - cmd: "oc set selector service web app=web,tier=blue; sleep 3; oc get endpointslices -l kubernetes.io/service-name=web; oc exec deploy/toolbox -- getent hosts web; oc exec deploy/toolbox -- curl -sS -m 3 http://web:8080/"
      expect: fail
      meaning: "a selector that matches no pod: the slice has no address, the name still resolves, and the connection is refused (curl exit status 7)"
    - cmd: "oc set selector service web app=web; sleep 3; oc exec deploy/toolbox -- curl -s -m 3 http://web:8080/"
      meaning: "the selector put back: the page returns"
    - cmd: "oc expose deployment web --name=web-wrong --port=8080 --target-port=80; oc get services"
      meaning: "a second Service on the same pods, with the wrong targetPort"
    - cmd: "oc get endpointslices -l kubernetes.io/service-name=web-wrong"
      meaning: "the slice lists the pods with PORTS 80"
    - cmd: "oc exec deploy/toolbox -- curl -sS -m 3 http://web-wrong:8080/"
      expect: fail
      meaning: "ready pods, but nothing listens on port 80: connection refused"
    - cmd: "oc exec deploy/toolbox -- curl -sS -m 3 http://webb:8080/"
      expect: fail
      meaning: "a mistyped name: could not resolve host (curl exit status 6)"
    - cmd: "oc get services"
      meaning: "the Services of the project: no webb"
    - cmd: "oc apply -f deny-web.yaml; sleep 3; oc exec deploy/toolbox -- curl -sS -m 3 http://web:8080/; oc delete -f deny-web.yaml"
      meaning: "a NetworkPolicy that allows no incoming traffic: the connection times out (curl exit status 28); the policy is removed at the end"
    - cmd: "oc expose deployment web --name=web-headless --cluster-ip=None --port=8080; oc exec deploy/toolbox -- getent hosts web web-headless"
      meaning: "a normal Service returns one ClusterIP; a headless one returns the ready pods' addresses"
  files:
    web.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: web-content
      data:
        index.html: |
          hello from web
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - name: content
                mountPath: /var/www/html
            volumes:
            - name: content
              configMap:
                name: web-content
    service.yaml: |
      apiVersion: v1
      kind: Service
      metadata:
        name: web
      spec:
        selector:
          app: web
        ports:
        - name: http
          port: 8080
          targetPort: 8080
    deny-web.yaml: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: deny-web
      spec:
        podSelector:
          matchLabels:
            app: web
        policyTypes:
        - Ingress
- id: d.routes-tls
  title: "Routes, the router and TLS termination"
  subtitle: "How a host name reaches a Service, and where the encryption ends"
  module: a5-network
  mode: REAL_LAB
  minutes: 55
  level: 2
  supports: "OpenShift 4.21 route.openshift.io/v1 with the HAProxy-based default IngressController. Recorded on OpenShift Local (wildcard domain *.apps-crc.testing, router on the host network of the single node) as an ordinary user, in a temporary project, with a throwaway self-signed certificate made for the recording."
  concepts: [net.routes, sec.certs]
  prerequisites: [d.services-dns]
  record_on: cluster
  objective: |
    Expose an application with a Route, choose between edge, passthrough and re-encrypt termination, and read the
    router's responses (200, 503, TLS errors) and the Route's status as evidence.
  diagram: request-path
  flow:
    - kind: teach
      id: situation
      title: "From a host name to a Service"
      body: |
        Users type `https://shop.apps.example.com`. Something must accept that connection, present a certificate
        the browser trusts, and pick a healthy pod. On OpenShift that something is the **router**: a set of pods in
        the `openshift-ingress` project that run HAProxy, a proxy server. A **Route** tells the router what to
        do: which host name, and optionally which path, goes to which Service.

        The router watches Routes and the EndpointSlices of their Services, and sends each request straight to a
        ready pod's IP. The ClusterIP that [the previous lesson](/lesson/d.services-dns) followed is not on this
        path. The Service still matters, for its selector, its ports and its endpoints.

        When a site is down, the router's own answer says where to look: a page, a 503 error, a certificate
        warning or a timeout. This lesson builds Routes, reads what the router answers, and follows TLS, the
        encryption of HTTPS, from the client to the pod.
    - kind: ask
      id: recall-unset
      recalls: d.services-dns
      prompt: "A look back. A Service's EndpointSlice shows `ENDPOINTS <unset>`. What does that tell you?"
      choices:
        - text: "The Service's selector matches no pod"
          why: "With no matching pod, there is nothing to list. `<unset>` is the sign, and it is the first thing to check behind a 503."
        - text: "The pods match but fail their readiness probe"
          why: "Pods that match and are not ready are listed, marked not ready. An empty slice lists no pod at all."
        - text: "The Service's `targetPort` is wrong"
          why: "A wrong `targetPort` shows in the `PORTS` column, next to the pods' addresses. The addresses are still listed."
      answer: 0
    - kind: show
      id: setup
      body: "The lesson's source files `web.yaml` and `service.yaml` hold the same two-pod `web` Deployment and page as in [Services, EndpointSlices and DNS](/lesson/d.services-dns), with a second container port, 8443, and a Service with two ports: `http` (8080) and `https` (8443). The command applies them:"
      run: "oc apply -f web.yaml -f service.yaml; oc rollout status deployment/web --timeout=180s; oc get pods,service"
      notice: "Two pods, ready, and a Service with both ports. There is no Route yet, so nothing outside the cluster can reach them."
    - kind: teach
      id: create-route
      title: "Creating a Route"
      body: |
        A Route names a Service and one of its ports. If you leave the host name out, OpenShift builds one from
        the Route's name, the project and the cluster's application domain: `<route>-<project>.<apps domain>`.

        `oc create route` has a subcommand for each way of handling **TLS**, the encryption in HTTPS. Ending the
        encrypted connection is called **terminating** it. The simplest choice is `edge`: the router terminates the
        client's TLS connection and sends plain HTTP to the pod. This creates an edge Route to the `http` port of
        `web`, and lists it:
    - kind: show
      id: create
      run: "oc create route edge web --service=web --port=http; oc get route web"
      highlight: ["edge"]
      notice: |
        `HOST/PORT` is the generated host name, built from the Route's name and the project. `SERVICES` is the
        Service the Route sends traffic to, `PORT` is that Service's port by name, and `TERMINATION` is `edge`.
    - kind: ask
      id: guess-http
      guess: true
      prompt: "This edge Route has no policy for plain HTTP. A client opens `http://<host>/`, without TLS. What happens?"
      choices:
        - text: "The page loads, unencrypted"
          why: "The Route is a TLS Route, and for a TLS Route the router does not serve plain HTTP by default. The request below shows what it does."
        - text: "The router redirects to `https://`"
          why: "A redirect is possible, but it must be asked for with a field on the Route. Without it, nothing redirects. The request below shows what happens."
        - text: "The router answers 503 for plain HTTP"
          why: "By default a TLS Route serves only TLS, and the router answers other requests with its 503 page. The request below shows it."
      answer: 2
    - kind: show
      id: request
      body: |
        Now a request from this machine, after a short wait: the router needs a few seconds to load a new Route.
        On OpenShift Local with user-mode networking, the wait also covers something specific to it: its background
        service adds each new Route's host name to this machine's `/etc/hosts` a few seconds after the Route is
        created. In OpenShift Local's system networking mode, a local wildcard DNS entry already covers the domain,
        and on a normal cluster a wildcard DNS entry covers the whole application domain.
        `-k` tells `curl` not to verify the certificate, for a reason the next part explains.
      run: "host=$(oc get route web -o jsonpath='{.spec.host}'); sleep 15; curl -sk https://$host/; curl -s -o /dev/null -D - http://$host/ | head -n 1"
      highlight: ["hello from web", "HTTP/1.0 503"]
      notice: |
        Over HTTPS the router terminated TLS and returned the pod's page. Over plain HTTP it answered `503 Service
        Unavailable`, the same status code that a Route with no ready endpoint gets, for a different reason: the pods
        are fine. So a 503 on `http://` that works on `https://` points at the Route's policy, not at the Service.
    - kind: show
      id: route-yaml
      body: "The Route's `spec` says what to do, and its `status` says what the router did:"
      run: "oc get route web -o yaml | sed -n '/^spec:/,$p'"
      highlight: ["host:", "termination", "Admitted", "routerName"]
      notice: |
        `spec.host` is the generated host. `spec.to` names the Service and a weight, and `spec.port.targetPort` the
        port. The condition `Admitted` with status `"True"` in `status.ingress` says that the router accepted the Route
        and serves it. A Route that is not admitted is not served at all, and its condition says why.
    - kind: explore
      id: request-path
      diagram: request-path
      body: "The whole path in one picture. Select the Router, the Route, the Service and the EndpointSlices, and read where the ClusterIP is, and is not, used."
    - kind: teach
      id: insecure-policy
      title: "What happens to plain HTTP"
      body: |
        The field `spec.tls.insecureEdgeTerminationPolicy` decides what the router does with plain HTTP on port 80
        for a TLS Route:

        - `None`, the default: no traffic is allowed on the plain HTTP port. The router answers 503.
        - `Redirect`: the router answers with a redirect, status 302, to the `https://` address.
        - `Allow`: both are served, for edge and re-encrypt Routes. Passthrough Routes accept only `None` or
          `Redirect`.

        `Redirect` is the usual choice for web applications, because people type `http://`.
    - kind: try
      id: try-shop
      body: "Create a second edge Route, called `shop`, to the `http` port of the Service `web`, with plain HTTP redirected to HTTPS."
      accept: ["oc create route edge shop --service=web --port=http --insecure-policy=Redirect", "oc create route edge shop --service=web --insecure-policy=Redirect --port=http", "oc create route edge shop --port=http --service=web --insecure-policy=Redirect", "oc create route edge shop --port=http --insecure-policy=Redirect --service=web", "oc create route edge shop --insecure-policy=Redirect --service=web --port=http", "oc create route edge shop --insecure-policy=Redirect --port=http --service=web", "oc create route edge shop --service=web --port=8080 --insecure-policy=Redirect", "oc create route edge shop --service=web --insecure-policy=Redirect --port=8080", "oc create route edge shop --port=8080 --service=web --insecure-policy=Redirect", "oc create route edge shop --port=8080 --insecure-policy=Redirect --service=web", "oc create route edge shop --insecure-policy=Redirect --service=web --port=8080", "oc create route edge shop --insecure-policy=Redirect --port=8080 --service=web", "oc create route edge shop --service web --port http --insecure-policy Redirect", "oc create route edge shop --service web --insecure-policy Redirect --port http", "oc create route edge shop --port http --service web --insecure-policy Redirect", "oc create route edge shop --port http --insecure-policy Redirect --service web", "oc create route edge shop --insecure-policy Redirect --service web --port http", "oc create route edge shop --insecure-policy Redirect --port http --service web", "oc create route edge shop --service web --port 8080 --insecure-policy Redirect", "oc create route edge shop --service web --insecure-policy Redirect --port 8080", "oc create route edge shop --port 8080 --service web --insecure-policy Redirect", "oc create route edge shop --port 8080 --insecure-policy Redirect --service web", "oc create route edge shop --insecure-policy Redirect --service web --port 8080", "oc create route edge shop --insecure-policy Redirect --port 8080 --service web"]
      hints:
        - match: "^oc create route shop"
          say: "`oc create route` needs the kind of TLS handling before the name: `edge`."
        - match: "^oc expose"
          say: "`oc expose` creates a plain HTTP Route, with no TLS. A TLS Route, and its redirect, comes from `oc create route edge`."
        - match: "^oc create route edge shop$|^oc create route edge shop --service[= ]web$"
          say: "A Route also needs the Service's port, with `--port`, and the policy for plain HTTP, with `--insecure-policy`."
        - match: "--insecure-policy[= ](redirect|REDIRECT)"
          say: "The value is case-sensitive: `Redirect`, with a capital R."
        - match: "^oc create route edge web"
          say: "`web` already exists as a Route. The new one is called `shop`."
        - match: "^kubectl"
          say: "`kubectl` has no `create route`: Routes are an OpenShift object. Use `oc`."
      hint: "`oc create route edge shop`, then the Service, the port and the policy: `--service`, `--port` and `--insecure-policy`."
      run: "oc create route edge shop --service=web --port=http --insecure-policy=Redirect; oc get route shop"
      then: "The `TERMINATION` column now says `edge/Redirect`: the type, and the policy for plain HTTP."
    - kind: show
      id: redirect
      body: "A plain HTTP request to the new Route, keeping the status line and the `Location` header:"
      run: "sleep 15; curl -s -o /dev/null -D - http://$(oc get route shop -o jsonpath='{.spec.host}')/ | grep -i -e '^HTTP' -e '^location'"
      highlight: ["302", "location"]
      notice: "Status `302 Found`, and a `location` header with the `https://` address of the same host. A browser follows it by itself."
    - kind: teach
      id: certificate-warning
      title: "Which certificate the client gets"
      body: |
        TLS starts with the server showing a **certificate**, a document that ties a host name to a public key and is
        signed by an authority the client has to trust. For an edge Route, the router shows the certificate.

        Unless the Route carries one of its own, the router uses a **default certificate**. It is set on the
        **IngressController**, the object that configures the router, and it is a wildcard for the cluster's whole
        apps domain, made by the cluster itself. A wildcard certificate such as `*.apps-crc.testing` covers every
        host name under that domain. Your machine has no reason to trust the cluster's own authority. Without
        `-k`, `curl` refuses:
    - kind: show
      id: certificate
      body: "`curl -v` writes the connection details to the error stream, and we keep only the lines about the certificate. First without `-k`, then with it:"
      run: "host=$(oc get route web -o jsonpath='{.spec.host}'); curl -sS -m 5 -o /dev/null https://$host/ 2>&1 | head -n 1; curl -skv -o /dev/null https://$host/ 2>&1 | grep -E 'subject:|issuer:|expire date'"
      highlight: ["curl: (60)", "subject", "issuer"]
      notice: |
        Without `-k`, `curl` stops at the certificate check, with status 60, before any page is requested: the Route
        works, but this machine does not trust the certificate's issuer. A browser would show a warning page here.
        The subject is the wildcard `*.apps-crc.testing`, the same certificate for every Route that has none of its
        own. The issuer is the ingress operator's own authority. Production clusters usually replace this default
        with a certificate from the organisation's authority.
    - kind: show
      id: make-cert
      body: |
        To present its own certificate, a Route is given the certificate, its private key and, if needed, the
        authority's chain: `--cert`, `--key` and `--ca-cert` on `oc create route edge`. The certificate must name the
        Route's host in its **subjectAltName** field, because modern clients ignore the subject's common name.

        Nobody hands you these files here: you make them. `openssl`, run on your own machine (the one where you type
        `oc`), creates a throwaway certificate, valid for two days and signed by itself, for the host name that a
        Route called `web-own` will get, and writes `tls.crt` and `tls.key` into the working folder. The host is
        `<route>-<project>.<apps domain>`; `apps-crc.testing` is OpenShift Local's apps domain, and on another cluster
        you use yours, the end of the host name that OpenShift gave the Route `web` above. A real certificate comes
        from your organisation's authority instead.
      run: "host=web-own-$(oc project -q).apps-crc.testing; openssl req -x509 -newkey rsa:2048 -nodes -keyout tls.key -out tls.crt -days 2 -subj \"/CN=$host\" -addext \"subjectAltName=DNS:$host\" 2>/dev/null; openssl x509 -in tls.crt -noout -subject -ext subjectAltName -enddate"
      highlight: ["subject=", "DNS:"]
      notice: "The certificate is for one host name, in the subject and in the subjectAltName, and it expires in two days. The key was written to `tls.key` and is not shown."
      understand:
        purpose: Creates a new private key and a self-signed certificate for one host name, valid for two days, then prints
          the certificate's subject, alternative names and expiry date.
        parts:
          - text: $(oc project -q)
            means: The name of your current project (`-q` prints only the name), which becomes part of the Route's host
              name.
          - text: -x509
            means: Writes a certificate, signed with its own key, instead of a certificate request for an authority.
          - text: -newkey rsa:2048
            means: Generates a new 2048-bit RSA private key for it.
          - text: -nodes
            means: Does not encrypt the private key with a passphrase. (OpenSSL 3 calls this option `-noenc`; `-nodes`
              still works.)
          - text: -keyout tls.key -out tls.crt
            means: Where to write the key and the certificate.
          - text: -days 2
            means: Valid for two days from now (the default is 30).
          - text: -subj "/CN=$host"
            means: 'The subject, given on the command line: a common name (CN) equal to the host.'
          - text: -addext "subjectAltName=DNS:$host"
            means: Adds the subjectAltName extension, the field that clients check against the host name.
          - text: -noout -subject -ext subjectAltName -enddate
            means: '`openssl x509` reads the certificate back and prints only these fields, not the encoded certificate.'
        caution: '`-nodes` leaves `tls.key` unencrypted on disk: anyone who can read that file can present this certificate.
          Acceptable for a two-day test; delete the files afterwards.'
        concepts:
          - sec.certs
          - net.routes
        refs:
          - title: openssl-req(1)
            url: https://docs.openssl.org/3.0/man1/openssl-req/
          - title: openssl-x509(1)
            url: https://docs.openssl.org/3.0/man1/openssl-x509/
    - kind: try
      id: try-own
      body: "Create an edge Route called `web-own`, to the `http` port of the Service `web`, that presents this certificate: the files `tls.crt` and `tls.key` in the current directory."
