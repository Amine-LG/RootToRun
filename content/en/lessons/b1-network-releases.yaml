 --cert=tls.crt", "oc create route edge web-own --key=tls.key --port=8080 --cert=tls.crt --service=web", "oc create route edge web-own --key=tls.key --cert=tls.crt --service=web --port=8080", "oc create route edge web-own --key=tls.key --cert=tls.crt --port=8080 --service=web"]
      hints:
        - match: "^oc create route web-own"
          say: "`oc create route` needs the kind of TLS handling before the name: `edge`."
        - match: "--cert[= ]tls\\.key|--key[= ]tls\\.crt"
          say: "The flags are swapped: `--cert` takes the certificate, `tls.crt`, and `--key` the private key, `tls.key`."
        - match: "^oc create route edge web-own( --(service|port)[= ]\\S+)*$"
          say: "The Route also needs its certificate and its key: `--cert` and `--key`, with the two files."
        - match: "--ca-cert"
          say: "`--ca-cert` is for the authority's chain. This certificate is its own authority, and the files to give are `--cert` and `--key`."
        - match: "^oc create route edge (web |tls)"
          say: "The Route is called `web-own`: its host name has to match the one in the certificate."
        - match: "^kubectl"
          say: "`kubectl` has no `create route`: Routes are an OpenShift object. Use `oc`."
      hint: "`oc create route edge web-own`, the Service and its port, then `--cert` and `--key` with the two files."
      run: "oc create route edge web-own --service=web --port=http --cert=tls.crt --key=tls.key; oc get route web-own"
      then: "The Route exists, with TERMINATION `edge`. The certificate and key are stored in the Route object itself."
    - kind: show
      id: own-cert
      run: "host=web-own-$(oc project -q).apps-crc.testing; sleep 15; curl -sv --cacert tls.crt -o /dev/null https://$host/ 2>&1 | grep -E 'subject:|subjectAltName|SSL certificate verify|< HTTP'"
      highlight: ["verify ok", "matched"]
      notice: |
        The router presented the Route's own certificate instead of the wildcard. `--cacert tls.crt` tells `curl` to
        trust exactly this certificate, and then `curl` verifies it for real: the host name matches the
        subjectAltName (`matched`), and the report says `SSL certificate verify ok`.
    - kind: teach
      id: terminations
      title: "Three places where TLS can end"
      body: |
        Edge is one of three choices. They differ in where the client's TLS connection ends, and so in who must hold
        the private key:

        | Termination | TLS from the client ends at | Router to pod | Router can read HTTP? |
        |---|---|---|---|
        | edge | the router | plain HTTP | yes: paths, cookies, headers |
        | re-encrypt | the router, which opens a new TLS connection to the pod | TLS, verified by the router | yes |
        | passthrough | the pod | the client's TLS, untouched | no: only the host name, read from the TLS handshake |

        To try the other two, the pod must serve TLS. OpenShift can issue a certificate for a Service's name from the
        cluster's **service CA** when the Service has an annotation, and stores it in a Secret.
    - kind: show
      id: tls-pod
      body: |
        The Apache image reads its certificate from `/etc/httpd/tls/`. First the annotation, then two mounts of the
        Secret's files there. Each change to the pod template starts a rollout, so the pods are replaced:
      run: "oc annotate service web service.beta.openshift.io/serving-cert-secret-name=web-tls; sleep 3; oc get secret web-tls; oc set volume deployment/web --add --name=tls --type=secret --secret-name=web-tls --mount-path=/etc/httpd/tls/localhost.crt --sub-path=tls.crt; oc set volume deployment/web --add --name=tls-key --type=secret --secret-name=web-tls --mount-path=/etc/httpd/tls/localhost.key --sub-path=tls.key; oc rollout status deployment/web --timeout=180s"
      highlight: ["kubernetes.io/tls", "successfully rolled out"]
      notice: "The service CA created a Secret of type `kubernetes.io/tls` with two entries, the certificate and its key, for the name `web.<project>.svc`. After the rollout, port 8443 of the new pods serves that certificate."
      understand:
        purpose: Asks OpenShift's service CA for a certificate for the Service `web`, checks that the Secret holding it
          exists, mounts its two files where the Apache image expects them, and waits for the new pods.
        parts:
          - text: service.beta.openshift.io/serving-cert-secret-name=web-tls
            means: The annotation that asks the service CA to create the Secret `web-tls`, holding a certificate for the
              Service's internal name and its private key.
          - text: sleep 3
            means: Gives the service CA a moment to create the Secret before `oc get secret` looks for it.
          - text: --add --name=tls --type=secret --secret-name=web-tls
            means: Adds a volume named `tls` to the Deployment's pod template, filled from the Secret `web-tls`.
          - text: --mount-path=/etc/httpd/tls/localhost.crt --sub-path=tls.crt
            means: Mounts one entry of the Secret, `tls.crt`, as the single file `localhost.crt`, instead of the whole
              Secret as a directory.
          - text: oc rollout status deployment/web --timeout=180s
            means: Waits until the rollout is complete, the new pods available and the old ones gone, for at most 180
              seconds.
        mistakes:
          - 'Expecting renewed certificates to appear by themselves: files mounted with `--sub-path` are not updated when
            the Secret changes. When the service CA renews the certificate, restart the pods.'
        concepts:
          - sec.certs
          - net.routes
          - sec.secrets
        refs:
          - title: 'OpenShift 4.21: Service serving certificate secrets'
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/security_and_compliance/configuring-certificates#add-service-serving
          - title: OpenShift 4.21 CLI reference (oc set volume)
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-set-volumes
          - title: 'Kubernetes: Secrets (subPath mounts are not updated)'
            url: https://kubernetes.io/docs/concepts/configuration/secret/
    - kind: show
      id: more-routes
      body: "Two more Routes to the same Service, both to the `https` port, because the pod must answer TLS there:"
      run: "oc create route passthrough web-pass --service=web --port=https; oc create route reencrypt web-reen --service=web --port=https; oc get routes"
      highlight: ["passthrough", "reencrypt"]
      notice: "Five Routes now. `shop`, `web` and `web-own` are edge: they end TLS at the router. `web-reen` ends it there too and starts a new connection to the pod, and `web-pass` hands the connection to the pod. Both new Routes point at `https`, the Service's TLS port."
      understand:
        purpose: Creates a passthrough Route and a re-encrypt Route to the Service's TLS port, then lists all the Routes
          of the project.
        parts:
          - text: passthrough web-pass
            means: 'A Route named `web-pass` whose TLS connection the router does not open: the pod presents its own certificate
              to the client.'
          - text: reencrypt web-reen
            means: 'A Route named `web-reen`: the router ends the client''s TLS and opens a new TLS connection to the
              pod. Without `--dest-ca-cert`, the router checks the pod''s certificate against the service CA, which is
              why the service CA''s certificate from the last step works.'
          - text: --port=https
            means: The Service port to send traffic to, by its name. A number here would mean a port of the pods' containers,
              not of the Service.
        concepts:
          - net.routes
          - sec.certs
        refs:
          - title: 'OpenShift 4.21: Creating secured routes'
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes#creating-advanced-routes
          - title: OpenShift 4.21 CLI reference (oc create route)
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/cli_tools/openshift-cli-oc#oc-create-route-reencrypt
    - kind: ask
      id: guess-passthrough-cert
      guess: true
      prompt: "A client connects to the passthrough Route `web-pass`. Which certificate does it see?"
      choices:
        - text: "The certificate the pod serves"
          why: "The router only reads the host name and forwards the encrypted bytes, so the client talks TLS with the pod itself. The next step shows it."
        - text: "The router's default wildcard certificate"
          why: "That is what edge and re-encrypt show. A passthrough router never decrypts the connection, so it has no way to present its own certificate. The next step shows it."
        - text: "A certificate the router makes for the Route"
          why: "The router makes none. It either terminates with the Route's or the default certificate, or, for passthrough, it forwards. The next step shows which certificate arrives."
      answer: 0
    - kind: show
      id: cert-per-route
      run: "sleep 15; for r in web web-reen web-pass; do echo \"== $r\"; curl -skv -o /dev/null https://$(oc get route $r -o jsonpath='{.spec.host}')/ 2>&1 | grep -E 'subject:|issuer:|< HTTP'; done"
      highlight: ["== web", "subject"]
      notice: |
        `web` (edge) and `web-reen` (re-encrypt) present the same wildcard certificate: a client cannot tell them
        apart. `web-pass` presents the pod's certificate, for the name `web.<project>.svc`, issued by the service CA.
        A browser that reached it by the Route's host name would report a name mismatch. All three answer `200`.
    - kind: ask
      id: choose-termination
      prompt: "A team wants `/api` to go to one Service and `/` to another on the same host, with TLS all the way to the pods. Which termination?"
      choices:
        - text: "Passthrough: the pod ends TLS"
          why: "With passthrough the router sees only the host name; the path is inside the encrypted connection. It cannot route on it."
        - text: "Re-encrypt: the router ends TLS, then starts a new one"
          why: "The router reads the path after decrypting, then encrypts again towards the pod. It keeps router features and encryption inside the cluster."
        - text: "Edge: the router ends TLS and the pod gets plain HTTP"
          why: "Edge can route by path, but the hop from the router to the pod is plain HTTP, which is what the team wants to avoid."
      answer: 1
    - kind: teach
      id: passthrough-limits
      body: |
        The choice follows who must hold the key. If the router may, use edge, or re-encrypt when the hop inside the
        cluster must be encrypted too. If the pod must hold the key, or must check client certificates itself, use
        passthrough, and accept that the router can route on the host name only.

        With passthrough, the pod has to speak TLS on the port the Route points to. If it does not, the client gets a
        handshake error from the pod, not an answer from the router. Here is a passthrough Route that points at
        port 8080, where the pod speaks plain HTTP:
    - kind: show
      id: bad-passthrough
      run: "oc create route passthrough web-badpass --service=web --port=http; sleep 15; curl -sS -m 5 -o /dev/null https://$(oc get route web-badpass -o jsonpath='{.spec.host}')/"
      highlight: ["curl: (35)"]
      notice: "`curl` fails with status 35, a TLS connection error: the router forwarded the client's TLS handshake, and the pod answered in plain HTTP."
    - kind: ask
      id: fix-passthrough
      prompt: "A passthrough Route points at a pod port that speaks plain HTTP, and clients get a TLS handshake error. What is the right fix?"
      choices:
        - text: "Add a certificate and key to the Route"
          why: "A passthrough Route carries no certificate: the router never decrypts anything on it, so it has nothing to present."
        - text: "Set the plain-HTTP policy of the Route to `Allow`"
          why: "That field only decides what happens to plain HTTP on port 80. The failure is on the HTTPS side, in the handshake."
        - text: "Make the termination match the pod's port"
          why: "The termination has to match what the pod speaks on that port: edge for plain HTTP on 8080, or a pod that serves TLS if the Route stays passthrough."
      answer: 2
    - kind: teach
      id: routes-503
      title: "Reading the router's answers"
      body: |
        The router answers `503` with its "Application is not available" page when it has no working backend for a
        Route. One status code, several causes, and the next layer tells them apart: walk from the outside in, from
        the Route's status to the Service's endpoints to the pod.

        Here is a re-encrypt Route that points at the plain HTTP port. We print the answer, the Route, and the
        Service's slice:
    - kind: show
      id: bad-reencrypt
      run: "oc create route reencrypt web-badreen --service=web --port=http; sleep 15; curl -sk -m 5 -o /dev/null -w '%{http_code}\\n' https://$(oc get route web-badreen -o jsonpath='{.spec.host}')/; oc get route web-badreen -o custom-columns=NAME:.metadata.name,TERMINATION:.spec.tls.termination,PORT:.spec.port.targetPort; oc get pods -l app=web; oc get endpointslices -l kubernetes.io/service-name=web"
      highlight: ["503", "reencrypt"]
      notice: "A 503, although both pods are ready (`1/1`) and the slice lists their two addresses. The Route is `reencrypt` and points at `http`, the port that speaks plain HTTP."
    - kind: ask
      id: read-503
      prompt: "The Route answers 503 and its Service has two ready endpoints. What is the most likely cause?"
      evidence: |
        503
        NAME          TERMINATION   PORT
        web-badreen   reencrypt     http
        NAME                  READY   STATUS    RESTARTS   AGE
        web-c9bbccc89-5jl76   1/1     Running   0          60s
        web-c9bbccc89-vtvkg   1/1     Running   0          55s
        NAME        ADDRESSTYPE   PORTS       ENDPOINTS                   AGE
        web-h6qp5   IPv4          8080,8443   10.217.1.102,10.217.1.103   2m2s
      choices:
        - text: "The Service's selector matches no pod"
          why: "A selector that matches nothing gives an empty slice, and the slice here lists two pods."
        - text: "The router cannot connect to the ready pods"
          why: "The router knows where to send traffic, so the failure is in the connection to the pods. A re-encrypt Route opens TLS to the port it points at, here `http`, where the pod speaks plain HTTP."
        - text: "DNS for the Route's host is broken"
          why: "If the host did not resolve, the request would never reach the router, and no 503 page would appear."
      answer: 1
    - kind: show
      id: host-claim
      body: "Another thing that stops a Route from being served: its host is already taken. We create a second Route for the host of `web`:"
      run: "oc create route edge web-copy --service=web --port=http --hostname=$(oc get route web -o jsonpath='{.spec.host}'); sleep 3; oc get routes web web-copy; oc get route web-copy -o jsonpath='{.status.ingress[0].conditions[0].message}{\"\\n\"}'"
      highlight: ["HostAlreadyClaimed", "older"]
      notice: |
        The new Route is created, but it is not admitted: its `HOST/PORT` column shows the reason,
        `HostAlreadyClaimed`, and the condition says that the older Route keeps the host. Across projects the default
        is stricter still: with the IngressController's default `Strict` namespace ownership, a host that a Route of
        one project holds cannot be claimed by a Route of another project. This recording used one project.
    - kind: show
      id: host-change
      body: "Changing the host of an existing Route is a separate permission. As the ordinary user, the recording tries to move `web` to another host; this is expected to fail:"
      run: "oc patch route web -p '{\"spec\":{\"host\":\"other.apps-crc.testing\"}}'"
      notice: "Refused: the user may set a host when creating a Route, but not change it afterwards (`you do not have permission to set the host field of the route`). The Route keeps its host."
    - kind: show
      id: no-pods
      body: "Last, the plainest cause of a 503: nothing is ready. We scale `web` to zero and ask again:"
      run: "oc scale deployment web --replicas=0; sleep 10; curl -sk -m 5 -w '\\nHTTP %{http_code}\\n' https://$(oc get route web -o jsonpath='{.spec.host}')/ | grep -e 'Application is not available' -e '^HTTP'"
      highlight: ["Application is not available", "HTTP 503"]
      notice: "The router's own page, and status 503."
    - kind: try
      id: try-slices
      body: "The Route is fine and the Service exists. Check the Service `web` for endpoints: list its EndpointSlices with the label `kubernetes.io/service-name=web`."
      accept: ["oc get endpointslices -l kubernetes.io/service-name=web", "oc get endpointslices -l=kubernetes.io/service-name=web", "oc get endpointslices -lkubernetes.io/service-name=web", "oc get endpointslices --selector=kubernetes.io/service-name=web", "oc get endpointslices --selector kubernetes.io/service-name=web", "oc get endpointslice -l kubernetes.io/service-name=web", "oc get endpointslice -l=kubernetes.io/service-name=web", "oc get endpointslice --selector=kubernetes.io/service-name=web", "oc get endpointslices -l kubernetes.io/service-name=web -o wide", "oc get endpointslice -l kubernetes.io/service-name=web -o wide", "oc get endpointslices -o wide -l kubernetes.io/service-name=web", "oc get endpointslice -o wide -l kubernetes.io/service-name=web"]
      hints:
        - match: "^oc get (routes?|ingress)"
          say: "The Route is the layer above, and it is fine here. The question is whether the Service behind it has endpoints."
        - match: "^oc get (pods?|po)"
          say: "Pods show what runs. The slice shows what the Service can send traffic to, which is what the router uses."
        - match: "^oc get (service|services|svc)"
          say: "That shows the Service's own ports. Its endpoints are in the EndpointSlice."
        - match: "service-name=web-"
          say: "The Service is called `web`: the label is `kubernetes.io/service-name=web`."
      hint: "`oc get endpointslices`, then `-l` and the label with the Service's name."
      run: "oc get endpointslices -l kubernetes.io/service-name=web"
      then: "`ENDPOINTS` is `<unset>`: no pod is behind the Service. The 503 comes from here, and the cause is the Deployment, not the Route."
    - kind: reflect
      id: explain-termination
      prompt: "Explain to a colleague how you choose between edge, re-encrypt and passthrough for a new application."
      model: |
        I start from who must hold the private key. If the router may, I choose edge for the simplest setup, or
        re-encrypt when traffic inside the cluster must be encrypted too. Both let the router use paths, cookies
        and headers, and both present the router's certificate: the default wildcard, unless the Route carries its
        own. If the pod must hold the key, or must check client certificates itself, I use passthrough, and accept
        that the router can route on the host name only. For re-encrypt, a service serving certificate on the pod
        lets the router verify it without extra configuration.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can expose a Service with a Route, read its `spec` and its `Admitted` status, and tell what the router
        answers apart: a page, a redirect for plain HTTP, a certificate error for the client, and a 503 with its
        causes. You can choose edge, re-encrypt or passthrough by who must hold the key, and say which certificate a
        client sees through each.

        Kubernetes also has its own object for the same job, the Ingress, and OpenShift serves it by turning it into
        Routes. The next lesson, [Ingress and the Gateway API](/lesson/o3.ingress-gateway), shows how, and what the
        Gateway API adds. Requesting, trusting and rotating service certificates is covered in
        [Certificates and non-HTTP traffic](/lesson/o2.tls-exposure).
  sections:
    - id: reaching-the-router
      title: "How clients reach the router"
      depth: true
      body: |
        How clients reach the router depends on the platform. On AWS, Azure, Google Cloud and similar clouds the
        default IngressController is published through a cloud load balancer (`LoadBalancerService`). On bare
        metal, vSphere, platform `None` and other platforms it uses `HostNetwork`, with router pods listening on
        ports 80 and 443 of the nodes they run on. On OpenShift Local the router is a host-network pod on the
        single node, and `*.apps-crc.testing` resolves to it.

        When a Route has no ready endpoints, the router answers HTTP 503 with its "Application is not available" page. That one status code covers wrong selector, failing
        readiness, zero replicas, and pods that cannot be reached (wrong targetPort, NetworkPolicy).
    - id: reencrypt-details
      title: "Re-encrypt: how the router verifies the pod"
      depth: true
      body: |
        For re-encrypt, the router verifies the pod's certificate against the Route's `destinationCACertificate`. If
        that field is empty, it uses the cluster's service CA and checks the internal name `<service>.<namespace>.svc`,
        which is exactly what a service serving certificate contains. A pod certificate that is neither signed by the
        service CA nor covered by `destinationCACertificate` makes the backend unusable, and the client sees 503.

        `oc create route edge` and `oc create route reencrypt` accept `--cert`, `--key` and `--ca-cert`;
        re-encrypt also takes `--dest-ca-cert`. Passthrough takes none of them: the pod serves its own. To see what
        the router really serves, connect with the host name as SNI, for example
        `openssl s_client -connect <host>:443 -servername <host>`, and read the certificate's subject and
        subjectAltName.
    - id: route-options
      title: "Useful Route options"
      depth: true
      body: |
        Routes are tuned with fields and annotations rather than router configuration files:

        | Need | How |
        |---|---|
        | slow back-end requests cut off | annotation `haproxy.router.openshift.io/timeout` (for example `2m`); the IngressController's server timeout defaults to 30s |
        | sticky sessions | cookies are set by default for edge and re-encrypt Routes (not passthrough); `router.openshift.io/cookie_name` names the cookie |
        | load-balancing algorithm | annotation `haproxy.router.openshift.io/balance`: `random` by default (`source` for passthrough), or `roundrobin`, `leastconn`, `source` |
        | HSTS | annotation `haproxy.router.openshift.io/hsts_header`, for example `max-age=31536000;includeSubDomains` (edge and re-encrypt only) |
        | A/B or canary split | `spec.alternateBackends`: up to 3 more Services, each with a `weight` from 0 to 256 (0 takes it out of load balancing) |
        | several apps on one host | one Route per path (`--path=/api`): plain HTTP, edge or re-encrypt (never passthrough) |

        Administrators can also replace the router's 503 and 404 pages with a ConfigMap in `openshift-config`.
    - id: what-goes-wrong
      title: "What goes wrong at the router"
      depth: true
      body: |
        Walk from the outside in: the Route's status, then the Service's endpoints, then the pod.

        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | 503 "Application is not available" | `oc get endpointslices -l kubernetes.io/service-name=<svc>` empty or not ready | selector, readiness or zero replicas | as in the Services lesson |
        | 503, endpoints ready | the pod refuses on the Route's `targetPort`, or a NetworkPolicy drops router traffic | wrong port, missing router rule | point the Route at the right Service port; allow the ingress policy group |
        | host not served at all | `status.ingress[].conditions` not `Admitted` | host already claimed by an older Route | pick another host, or ask the owner |
        | TLS handshake error with passthrough | the pod serves plain HTTP on that port | passthrough to a non-TLS port | edge, or make the pod serve TLS |
        | 503 with re-encrypt only | edge to the same pods works | router cannot verify the pod certificate, or the port speaks plain HTTP | service serving certificate, `destinationCACertificate`, or the right port |
        | browser warning, page loads | certificate subject is the wildcard or the service name | default certificate, or passthrough's internal certificate | Route certificate for the host |
        | `http://` returns 503 while `https://` works | `insecureEdgeTerminationPolicy` is `None` | by design | set `Redirect` |

        Practise on [Route returns 503, pods are healthy](/lab/inc.service-selector-503) and
        [Running but never Ready](/lab/inc.readiness-503), then the [TLS lab](/lab/lab.tls-exposure) and the graded
        [Ship a web app](/lab/ch.ship-web-app) challenge.
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Passthrough to a pod that speaks plain HTTP.** With passthrough the pod must terminate TLS itself; the
          router only forwards bytes, so the client gets a TLS handshake error.
        - **Expecting path rules or header changes on a passthrough Route.** The router cannot see inside the TLS
          stream; it only reads the SNI hostname.
        - **Pointing `spec.port.targetPort` at the wrong Service port.** A name is looked up among the
          endpoint port names (the Service port's name); a number is the port on the pods. A re-encrypt or passthrough
          Route must point at the HTTPS port.
        - **Concluding that HTTP is broken.** With the default `insecureEdgeTerminationPolicy: None`, plain HTTP is
          refused by design; set `Redirect` if users type `http://`.
        - **Editing a Route's host.** Project roles may set a host when they create a Route but not change it afterwards (that needs `update` on `routes/custom-host`); create a new Route instead.
  review:
    - q: "Where does TLS terminate for edge, passthrough and re-encrypt?"
      a: "Edge: router. Passthrough: the pod. Re-encrypt: router, which opens a new TLS connection to the pod."
    - q: "What does the router answer when a Route's Service has no ready endpoints?"
      a: "HTTP 503 (Application is not available)."
    - q: "Where do you check that the router accepted a Route?"
      a: "status.ingress[].conditions: type Admitted, status True."
    - q: "Why can a passthrough Route not have path rules or sticky cookies?"
      a: "The router never decrypts passthrough traffic; it only sees the SNI host name, not HTTP."
    - q: "An edge Route works over HTTPS. What does plain `http://` get by default, and which field changes it?"
      a: "A 503 page: with `insecureEdgeTerminationPolicy` None, plain HTTP is not served. Redirect answers with a 302 to HTTPS."
    - q: "Which certificate does the router present for a TLS Route that has none of its own?"
      a: "The IngressController's default certificate: a wildcard for the apps domain."
  labs: [lab.request-path]
  enterprise: |
    In large organisations external traffic usually crosses a corporate load balancer or WAF before the router,
    certificates come from the internal PKI (cert-manager or a manual process), and passthrough is reserved for
    applications that must hold their own keys. Router sharding (several IngressControllers selecting Routes by
    label or namespace) separates internal and external traffic.
  references:
    - {title: "OpenShift 4.21: Configuring the Ingress Controller (default certificate)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/networking_operators/configuring-ingress"}
    - {title: "OpenShift 4.21: Routes", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes"}
    - {title: "OpenShift 4.21: Creating secured routes (edge, re-encrypt, passthrough)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes#creating-advanced-routes"}
    - {title: "OpenShift 4.21: Route API reference", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_apis/route-route-openshift-io-v1"}
    - {title: "OpenShift 4.21: Ingress configuration API (apps domain)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/config_apis/ingress-config-openshift-io-v1"}
  commands:
    - cmd: "oc apply -f web.yaml -f service.yaml; oc rollout status deployment/web --timeout=180s; oc get pods,service"
      meaning: "two web pods and a Service with an http and an https port"
    - cmd: "oc create route edge web --service=web --port=http; oc get route web"
      meaning: "an edge Route: host name generated from the Route's name and the project"
    - cmd: "oc get route web -o yaml | sed -n '/^spec:/,$p'"
      meaning: "the Route's spec and the router's status (Admitted)"
    - cmd: "host=$(oc get route web -o jsonpath='{.spec.host}'); sleep 15; curl -sk https://$host/; curl -s -o /dev/null -D - http://$host/ | head -n 1"
      meaning: "HTTPS answers with the page; plain HTTP on a Route without a policy answers 503"
    - cmd: "oc create route edge shop --service=web --port=http --insecure-policy=Redirect; oc get route shop"
      meaning: "an edge Route that redirects plain HTTP"
    - cmd: "sleep 15; curl -s -o /dev/null -D - http://$(oc get route shop -o jsonpath='{.spec.host}')/ | grep -i -e '^HTTP' -e '^location'"
      meaning: "a 302 redirect to the https address"
    - cmd: "host=$(oc get route web -o jsonpath='{.spec.host}'); curl -sS -m 5 -o /dev/null https://$host/ 2>&1 | head -n 1; curl -skv -o /dev/null https://$host/ 2>&1 | grep -E 'subject:|issuer:|expire date'"
      meaning: "without -k, curl refuses the router's default certificate; with -k, the certificate is a wildcard issued by the ingress operator's authority"
    - cmd: "host=web-own-$(oc project -q).apps-crc.testing; openssl req -x509 -newkey rsa:2048 -nodes -keyout tls.key -out tls.crt -days 2 -subj \"/CN=$host\" -addext \"subjectAltName=DNS:$host\" 2>/dev/null; openssl x509 -in tls.crt -noout -subject -ext subjectAltName -enddate"
      meaning: "a throwaway self-signed certificate for the host name of the Route web-own"
    - cmd: "oc create route edge web-own --service=web --port=http --cert=tls.crt --key=tls.key; oc get route web-own"
      meaning: "an edge Route that carries its own certificate and key"
    - cmd: "host=web-own-$(oc project -q).apps-crc.testing; sleep 15; curl -sv --cacert tls.crt -o /dev/null https://$host/ 2>&1 | grep -E 'subject:|subjectAltName|SSL certificate verify|< HTTP'"
      meaning: "the router presents the Route's certificate, and curl verifies it"
    - cmd: "oc annotate service web service.beta.openshift.io/serving-cert-secret-name=web-tls; sleep 3; oc get secret web-tls; oc set volume deployment/web --add --name=tls --type=secret --secret-name=web-tls --mount-path=/etc/httpd/tls/localhost.crt --sub-path=tls.crt; oc set volume deployment/web --add --name=tls-key --type=secret --secret-name=web-tls --mount-path=/etc/httpd/tls/localhost.key --sub-path=tls.key; oc rollout status deployment/web --timeout=180s"
      meaning: "the service CA issues a certificate for the Service's name, and the pods serve it on port 8443"
      timeout: 240
    - cmd: "oc create route passthrough web-pass --service=web --port=https; oc create route reencrypt web-reen --service=web --port=https; oc get routes"
      meaning: "passthrough and re-encrypt Routes to the https port"
    - cmd: "sleep 15; for r in web web-reen web-pass; do echo \"== $r\"; curl -skv -o /dev/null https://$(oc get route $r -o jsonpath='{.spec.host}')/ 2>&1 | grep -E 'subject:|issuer:|< HTTP'; done"
      meaning: "edge and re-encrypt show the wildcard certificate; passthrough shows the pod's"
    - cmd: "oc create route passthrough web-badpass --service=web --port=http; sleep 15; curl -sS -m 5 -o /dev/null https://$(oc get route web-badpass -o jsonpath='{.spec.host}')/"
      expect: fail
      meaning: "passthrough to a port that speaks plain HTTP: a TLS error (curl exit status 35)"
    - cmd: "oc create route reencrypt web-badreen --service=web --port=http; sleep 15; curl -sk -m 5 -o /dev/null -w '%{http_code}\\n' https://$(oc get route web-badreen -o jsonpath='{.spec.host}')/; oc get route web-badreen -o custom-columns=NAME:.metadata.name,TERMINATION:.spec.tls.termination,PORT:.spec.port.targetPort; oc get pods -l app=web; oc get endpointslices -l kubernetes.io/service-name=web"
      meaning: "re-encrypt to the plain HTTP port: 503, with ready pods and their endpoints"
    - cmd: "oc create route edge web-copy --service=web --port=http --hostname=$(oc get route web -o jsonpath='{.spec.host}'); sleep 3; oc get routes web web-copy; oc get route web-copy -o jsonpath='{.status.ingress[0].conditions[0].message}{\"\\n\"}'"
      meaning: "a second Route for the same host is not admitted: the older Route keeps it"
    - cmd: "oc patch route web -p '{\"spec\":{\"host\":\"other.apps-crc.testing\"}}'"
      expect: fail
      meaning: "an ordinary user cannot change a Route's host"
    - cmd: "oc scale deployment web --replicas=0; sleep 10; curl -sk -m 5 -w '\\nHTTP %{http_code}\\n' https://$(oc get route web -o jsonpath='{.spec.host}')/ | grep -e 'Application is not available' -e '^HTTP'"
      meaning: "no ready pod: the router's 503 page"
    - cmd: "oc get endpointslices -l kubernetes.io/service-name=web"
      meaning: "the Service has no endpoints"
  files:
    web.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: web-content
      data:
        index.html: |
          hello from web
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              - containerPort: 8443
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - name: content
                mountPath: /var/www/html
            volumes:
            - name: content
              configMap:
                name: web-content
    service.yaml: |
      apiVersion: v1
      kind: Service
      metadata:
        name: web
      spec:
        selector:
          app: web
        ports:
        - name: http
          port: 8080
          targetPort: 8080
        - name: https
          port: 8443
          targetPort: 8443
- id: o3.init-sidecars
  title: "Init containers and sidecars"
  subtitle: "Ordering, shared volumes, native sidecars and their failures"
  module: a2-apps
  mode: GUIDED_INVESTIGATION
  minutes: 40
  level: 2
  supports: "Kubernetes 1.34 / OpenShift 4.21: init containers, native sidecar containers (an init container with restartPolicy: Always, stable since Kubernetes 1.33 and always on in OpenShift 4.21), emptyDir volumes. Recorded on OpenShift Local as an ordinary user, in a temporary project. The scheduler's effective resource request is worked out from the Kubernetes documentation, because an ordinary user cannot read it from a node."
  concepts: [k8s.pod-lifecycle, k8s.workloads, k8s.requests-limits]
  prerequisites: [b.pod-lifecycle]
  record_on: cluster
  objective: |
    Design a pod whose init containers, sidecars and application containers start, share files and stop in the
    right order; predict the resources the scheduler reserves for it; and diagnose `Init:` statuses, missing
    shared files and a Job that never completes.
  flow:
    - kind: teach
      id: situation
      title: "Why one container is not always enough"
      body: |
        Three situations where one container per pod is not enough:

        - An application must not start before its configuration file has been written from the pod's own name.
          If it starts first, it crashes on the missing file.
        - A log-shipping helper must run next to the application for as long as the application runs, and must
          still be there to ship the last lines while the application shuts down.
        - A batch Job has a helper next to it. The batch work ends after two minutes, yet the Job stays `Running`
          for days, because the helper never exits.

        Kubernetes has three kinds of containers in one pod for this: **init containers**, **sidecar containers**
        and **application containers**. They share the pod's network, with one IP and `localhost` between them, and
        its files through volumes. What differs is when each one runs, and what stops it.
    - kind: teach
      id: three-kinds
      title: "Three kinds of containers, one pod"
      body: |
        The pod spec has two lists: `initContainers` and `containers`. The kubelet works through `initContainers`
        in order, then starts everything in `containers` together.

        | Kind | Declared in | Starts | Runs until |
        |---|---|---|---|
        | regular init container | `initContainers` | after the previous one has **exited 0** | it exits; it must succeed |
        | native sidecar | `initContainers`, with `restartPolicy: Always` | in its place in the list; the next entry waits until it has **started** | the pod ends |
        | application container | `containers` | after regular init containers succeed and native sidecars have started | the pod's `restartPolicy` decides |

        Think of `initContainers` as a checklist that the kubelet works through from top to bottom. A regular init
        container is a task that must be finished before the next line. A native sidecar is a service that must be
        up before the next line, and stays up. When the list is complete, the pod's `Initialized` condition becomes
        `True` and the application containers start.
    - kind: show
      id: app-yaml
      body: "One pod with all three kinds. `render-config` writes a file into a volume and exits. `log-shipper` follows a log file for as long as the pod lives. `app` is the application."
      code: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: app
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: app
          template:
            metadata:
              labels:
                app: app
            spec:
              initContainers:
              - name: render-config
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                command: ["sh", "-c", "echo \"pod=$POD_NAME\" > /work/app.conf; echo rendered /work/app.conf"]
                env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                volumeMounts:
                - name: work
                  mountPath: /work
              - name: log-shipper
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                restartPolicy: Always
                command: ["sh", "-c", "touch /work/app.log; tail -F /work/app.log"]
                volumeMounts:
                - name: work
                  mountPath: /work
              containers:
              - name: app
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                command: ["sh", "-c", "cat /work/app.conf; while true; do date >> /work/app.log; sleep 5; done"]
                volumeMounts:
                - name: work
                  mountPath: /work
              volumes:
              - name: work
                emptyDir: {}
      caption: "app.yaml"
      notice: |
        Two entries under `initContainers` and one under `containers`. The line `restartPolicy: Always` is the only
        difference between the sidecar and a regular init container. The volume `work` is an `emptyDir`: empty
        storage that lives as long as the pod stays on its node. Each container has its own filesystem, so the
        `volumeMounts` of all three name it, and that is how they share files.
    - kind: ask
      id: start-order
      prompt: "In this pod, what must have happened before the `app` container starts?"
      choices:
        - text: "`render-config` has exited 0 and `log-shipper` has started"
          why: "A regular init container must exit 0 before the next entry; a native sidecar only has to have started. Then the application containers start."
        - text: "All three containers start at the same time"
          why: "Only the containers under `containers` start together, and only after every regular init container has succeeded and every native sidecar has started. That ordering is what init containers guarantee."
        - text: "`log-shipper` has exited with code 0"
          why: "A native sidecar is not meant to exit. It stays up for the whole life of the pod, and the next entry waits only until it has started."
      answer: 0
    - kind: show
      id: apply
      run: "oc apply -f app.yaml; oc rollout status deployment/app --timeout=180s; oc get pods -l app=app"
      highlight: ["2/2"]
      notice: "`READY` is `2/2`: the application container and the native sidecar count. A regular init container never does, because it is finished long before the pod is ready."
    - kind: show
      id: share
      body: "Data flows one way out of an init container: it has finished before the application exists. These two containers hand over a local file through a shared volume (an init container can also change something outside the pod, such as a database). Here `app` reads the file that `render-config` wrote, and `render-config`'s own log says what it did:"
      run: "oc exec deploy/app -c app -- cat /work/app.conf; oc logs deploy/app -c render-config"
      notice: "The file holds the pod's name, which only the pod itself could write. `-c` chooses the container: logs and `oc exec` are per container, and an init container has logs of its own."
    - kind: try
      id: try-sidecar-logs
      body: "The application appends a line to `app.log` every five seconds, and the sidecar follows that file. Read the log of the sidecar `log-shipper` in the Deployment `app`."
      accept: ["oc logs deploy/app -c log-shipper", "oc logs deploy/app -c=log-shipper", "oc logs deploy/app --container=log-shipper", "oc logs deploy/app --container log-shipper", "oc logs deployment/app -c log-shipper", "oc logs deployment/app -c=log-shipper", "oc logs deployment/app --container=log-shipper", "oc logs deployment/app --container log-shipper", "oc logs deploy/app log-shipper", "oc logs deployment/app log-shipper"]
      hints:
        - match: "^oc logs (deploy|deployment)/app$"
          say: "Without a container name, `oc logs` reads the pod's default container, `app`. Name the sidecar with `-c`."
        - match: "-c[= ]app$|--container[= ]app$"
          say: "`app` is the application container. The sidecar is called `log-shipper`."
        - match: "-c[= ]render-config"
          say: "`render-config` ran once and exited. The sidecar that follows the log is `log-shipper`."
        - match: "^oc (exec|rsh)"
          say: "`exec` runs a command in a container. To read what a container has printed, use `oc logs`."
        - match: "^kubectl"
          say: "`kubectl logs` works the same way. This course uses `oc`."
      hint: "`oc logs deploy/app`, then `-c` and the container's name."
      run: "oc logs deploy/app -c log-shipper"
      then: "The date line that `app` appended to the file: the sidecar copies every new line to its own output, where a log collector can read it, and the list grows by one line every five seconds. Neither container knows about the other. They only share the file."
    - kind: teach
      id: native-sidecars
      title: "Native sidecars: what the kubelet guarantees"
      body: |
        Kubernetes implements sidecars as a special case of init containers: an entry in `initContainers` with
        `restartPolicy: Always`. The feature was beta and on by default from Kubernetes 1.29, and stable in 1.33.
        OpenShift 4.21 runs Kubernetes 1.34, so there is nothing to enable.

        What the native form guarantees:

        - **Start order.** The next entry waits until the sidecar has *started*: its process runs, or its
          `startupProbe` has succeeded. A proxy (a program that receives connections and passes them on) is up
          before the application makes its first call.
        - **Its own restarts.** If the sidecar exits, the kubelet restarts it without touching the application.
        - **Probes.** A sidecar may have startup, readiness and liveness probes, and its readiness counts towards the
          pod's `Ready` condition.

        A helper that is only listed as a second entry in `containers` gets none of this.
    - kind: ask
      id: recall-sigterm
      recalls: b.pod-lifecycle
      prompt: "A look back. A pod is deleted. What does the kubelet send first to each container's main process?"
      choices:
        - text: "SIGKILL, which ends it at once"
          why: "SIGKILL comes last, and only for a process that is still running when the grace period ends. A process cannot catch it, so the kubelet tries SIGTERM first."
        - text: "Nothing: the container is removed from the node"
          why: "The container's process has to stop first, and the kubelet signals it. Removing the container does not give it a chance to finish its work."
        - text: "SIGTERM, then SIGKILL after the grace period"
          why: "SIGTERM asks the process to finish and exit; the grace period, 30 seconds by default, is how long the kubelet waits before it sends SIGKILL."
      answer: 2
    - kind: teach
      id: stop-order
      body: |
        The same ordering applies when the pod ends. The kubelet stops the application containers first, waits until
        they have fully stopped, and only then stops the sidecars, in reverse order of their declaration. The log
        shipper is still there to ship the application's last lines. If the application uses up the whole grace
        period, the sidecars get SIGTERM and SIGKILL almost at once, and a non-zero exit code from a sidecar at pod
        termination is normal.

        To see it, a pod has a sidecar `shipper` and an application `app` that needs six seconds to stop. Both print
        a line when SIGTERM arrives, and both are followed with `oc logs --timestamps`.
    - kind: ask
      id: guess-stop-order
      guess: true
      prompt: "The pod is deleted, and SIGTERM reaches both containers. Which line is printed first?"
      choices:
        - text: "`shipper got SIGTERM`"
          why: "The sidecar is stopped last, not first, so the application can keep using it while it shuts down. The next steps show the timestamps."
        - text: "`app got SIGTERM`"
          why: "The kubelet stops the application containers first and waits for them. The sidecar is signalled only after the application has stopped. The next steps show the timestamps."
        - text: "Both at the same moment"
          why: "That is how containers listed under `containers` are stopped, and how a helper placed there would be. A native sidecar waits. The next steps show the timestamps."
      answer: 1
    - kind: show
      id: stop-yaml
      code: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: stop-order
        spec:
          initContainers:
          - name: shipper
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            restartPolicy: Always
            command: ["sh", "-c", "trap 'echo shipper got SIGTERM; exit 0' TERM; echo shipper started; sleep infinity & wait"]
          containers:
          - name: app
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            command: ["sh", "-c", "trap 'echo app got SIGTERM; sleep 6; echo app done; exit 0' TERM; echo app started; sleep infinity & wait"]
      caption: "stop-order.yaml"
      notice: "Each shell sets a `trap`, a handler for SIGTERM, because the first process of a container (PID 1) ignores a signal that it has no handler for. The application's handler takes six seconds."
    - kind: show
      id: stop-run
      run: "oc apply -f stop-order.yaml; oc wait --for=condition=Ready pod/stop-order --timeout=120s >/dev/null; (oc logs -f --timestamps stop-order -c shipper > shipper.log 2>&1 &); (oc logs -f --timestamps stop-order -c app > app.log 2>&1 &); sleep 2; oc delete pod stop-order >/dev/null; sleep 3; cat shipper.log app.log | sort"
      highlight: ["got SIGTERM", "app done"]
      notice: |
        Read the timestamps. `app got SIGTERM`, then six seconds of shutdown, then `app done`. `shipper got SIGTERM`
        came about 0.3 seconds after `app done`: the kubelet waited until the application had stopped before it
        signalled the sidecar. Both containers ran for the whole time, so the sidecar could still ship the
        application's last lines. (`sort` merges the two log files by timestamp.)
    - kind: teach
      id: jobs
      title: "Jobs that never finish"
      body: |
        A Job is complete when its pod has ended successfully, and a pod ends only when every container listed under
        `containers` has exited. A helper that never exits, listed there, keeps the Job `Running` for ever.

        A native sidecar does not count. When the application containers have finished, the kubelet stops the
        sidecars, and the pod, and so the Job, completes.

        Two Jobs, both in the lesson's file `jobs.yaml`, run the same batch container, which prints a line, waits
        five seconds and exits, next to the same helper, which waits for SIGTERM. In `classic-helper` the helper is
        listed under `containers`. In `native-sidecar` it is a native sidecar.
    - kind: ask
      id: guess-job
      guess: true
      prompt: "Both batch containers finish after five seconds. A minute later, which Job is `Complete`?"
      choices:
        - text: "`classic-helper`, the helper in `containers`"
          why: "A pod with a helper under `containers` ends only when the helper exits too, and this one waits for a signal that never comes. The next step shows both Jobs."
        - text: "Both, because the batch work is done"
          why: "The batch container is only one of the containers of `classic-helper`'s pod. The pod stays until all of them exit. The next step shows both Jobs."
        - text: "`native-sidecar`, the helper as a sidecar"
          why: "The kubelet stops a native sidecar once the application containers have finished, so the pod can complete. The next step shows both Jobs."
      answer: 2
    - kind: show
      id: jobs-run
      run: "oc apply -f jobs.yaml; sleep 45; oc get jobs; oc get pods -l 'job-name in (classic-helper,native-sidecar)'"
      highlight: ["classic-helper", "native-sidecar"]
      notice: |
        `classic-helper` is still `Running` after 45 seconds, and its pod shows `1/2` and `NotReady`: the batch
        container has exited, the helper has not. `native-sidecar` is `Complete`, and its pod is `Completed`: the
        kubelet stopped the sidecar after the batch container finished. Both Jobs ran the same batch container.
    - kind: teach
      id: init-failures
      title: "When an init container does not finish"
      body: |
        An init container that does not finish keeps the application from ever starting. The `STATUS` column of
        `oc get pods` shows where the pod is:

        | STATUS | Meaning |
        |---|---|
        | `Init:1/3` | three entries in `initContainers` (a sidecar counts too), one done; the next is running or waiting |
        | `Init:Error` | an init container exited non-zero |
        | `Init:CrashLoopBackOff` | it failed repeatedly, and the kubelet is backing off |
        | `Init:ImagePullBackOff` | the init container's image cannot be pulled |
        | `PodInitializing` | init is done; the application containers are being created |

        The lesson's file `wait.yaml` is a Deployment, `needs-db`, whose init container `wait-for-db` loops
        `until getent hosts db`, printing `waiting for db` every two seconds, as many charts do. No Service `db`
        exists yet.
    - kind: show
      id: waiting
      run: "oc apply -f wait.yaml; sleep 15; oc get pods -l app=needs-db"
      highlight: ["Init:0/1"]
      notice: "`Init:0/1`: none of the pod's one init container has finished yet, and `RESTARTS` is 0. Nothing has failed. The container is doing what it was told, waiting."
    - kind: show
      id: default-logs
      body: "The reflex is to read the pod's logs, which fails here (this step expects the error):"
      run: "oc logs deploy/needs-db"
      highlight: ["PodInitializing", "Defaulted"]
      notice: "The default container is `app`, which has not started: there is nothing to read. The first line lists the containers of the pod, with `(init)` after the init containers."
    - kind: try
      id: try-init-logs
      body: "Read the log of the init container `wait-for-db` in the Deployment `needs-db`."
      accept: ["oc logs deploy/needs-db -c wait-for-db", "oc logs deploy/needs-db -c=wait-for-db", "oc logs deploy/needs-db --container=wait-for-db", "oc logs deploy/needs-db --container wait-for-db", "oc logs deployment/needs-db -c wait-for-db", "oc logs deployment/needs-db -c=wait-for-db", "oc logs deployment/needs-db --container=wait-for-db", "oc logs deployment/needs-db --container wait-for-db", "oc logs deploy/needs-db wait-for-db", "oc logs deployment/needs-db wait-for-db"]
      hints:
        - match: "^oc logs (deploy|deployment)/needs-db$"
          say: "That reads the default container, `app`, which has not started. Name the init container with `-c`."
        - match: "-c[= ]app$"
          say: "`app` has not started yet: it waits for the init container. The one that is running is `wait-for-db`."
        - match: "^oc (describe|get events)"
          say: "Events help, but the init container's own log says what it is waiting for. `oc logs` reads it, with `-c`."
      hint: "`oc logs deploy/needs-db`, then `-c` and the init container's name."
      run: "oc logs deploy/needs-db -c wait-for-db"
      then: "The loop's own message: it is waiting for `db`. The application never ran, so its logs could not have helped. The init container's log named the missing dependency."
    - kind: show
      id: unblock
      body: "Creating the missing Service, a bare one with no pods, is enough for the name to resolve:"
      run: "oc create service clusterip db --tcp=5432:5432; oc wait --for=condition=Ready pod -l app=needs-db --timeout=120s; oc get pods -l app=needs-db; oc logs deploy/needs-db -c wait-for-db | tail -n 2"
      notice: "The name resolves, and the init container's last line is the address it finally got. It exits, and the application container starts: `1/1 Running`. A wait loop like this only delays the first start. The application must still cope with a dependency that disappears an hour later."
    - kind: show
      id: debug-init
      body: "To investigate a pod whose init container fails, `oc debug` starts a copy of the pod with a shell. Two of its options decide what the copy runs; the help text says:"
      run: "oc debug --help | grep -A1 -E '^    --(keep-init-containers|one-container)='"
      notice: "By default (`--keep-init-containers=true`) the copy runs the pod's init containers first, so a failing one can hold the copy back too; `--keep-init-containers=false` skips them. `--one-container` keeps only the selected container. This step only reads the help; no debug pod was started."
    - kind: teach
      id: openshift-init
      title: "Init containers on the platform"
      body: |
        Charts written for other clusters often have an init container that runs as root to `chown` a volume, so
        that the application can write to it. OpenShift handles ownership another way. Every pod runs under a
        **Security Context Constraint** (SCC), which limits, among other things, the user ID a pod may use. The
        default, `restricted-v2`, gives the pod a user ID from a range reserved for the project, and a **fsGroup**:
        a group ID that is applied to volumes that support ownership management, such as `emptyDir`.
    - kind: show
      id: fsgroup
      body: "The application container of `app` writes to its `emptyDir` without any `chown`:"
      run: "oc exec deploy/app -c app -- sh -c 'id -u; id -G; ls -ld /work'"
      notice: |
        `id -u` is a user ID from a range that OpenShift reserved for this project, not root. `id -G` lists the
        groups: `0`, and the pod's fsGroup, which here has the same number as the user ID. `/work` belongs to that
        group, with group write permission and the setgid bit (`rws`: the `s` replaces the `x`), so files made in it keep the group. The
        container writes to the volume without any init container changing ownership.

        This demonstration does not prove that the fsGroup is what makes the write possible: an `emptyDir` is also
        writable by everyone (`rwx` for others), so any user ID could write here. The fsGroup matters for volumes
        such as persistent volume claims, whose files would otherwise belong to another user, and it is why new
        files keep the project's group.
    - kind: ask
      id: guess-chown
      guess: true
      prompt: "A Deployment's init container sets `securityContext.runAsUser: 0` to run `chown` as root. What does OpenShift do with its pods?"
      choices:
        - text: "Refuses to create them: root is outside the range"
          why: "The default SCC allows only user IDs from the project's range, and 0 is not in it. The pod is never created. The next step shows the message."
        - text: "Runs them: init containers may use root"
          why: "The constraint applies to every container of the pod, init containers included. The next step shows the refusal."
        - text: "Runs them, as a random user instead of root"
          why: "OpenShift does not replace an explicit `runAsUser`; it refuses a value that is not allowed. The next step shows the message."
      answer: 0
    - kind: show
      id: chown
      body: "The lesson's file `chown-init.yaml` is that Deployment: its init container, `fix-permissions`, runs `chown -R 1000:1000 /data` with `runAsUser: 0`, on an `emptyDir` that the application container also mounts."
      run: "oc apply -f chown-init.yaml 2>/dev/null; sleep 6; oc get deployment chown-init; oc get events --field-selector reason=FailedCreate -o jsonpath='{.items[-1:].message}{\"\\n\"}' | grep -oP 'provider restricted-v2: \\S+ Invalid value: 0: must be in the ranges: \\[[0-9, ]+\\]'"
      highlight: ["0/1", "restricted-v2"]
      notice: |
        No pod: `0/1` ready and `0` up to date. The ReplicaSet could not create it, and its event says why. The
        message names the SCC, `restricted-v2`, and the field, `.initContainers[0].runAsUser`: the value 0 is not in
        the range that this project allows. (`2>/dev/null` hides a warning that `oc apply` prints, which the
        recording did not keep; on OpenShift this is normally the API server's Pod Security warning that the pod
        template would violate the `restricted` profile. `grep -o` keeps only the part of the long event message
        that concerns `restricted-v2`.)
    - kind: teach
      id: resources
      title: "What the scheduler reserves"
      body: |
        Regular init containers run one at a time, before the application starts, so their requests are not
        added to the application's. Kubernetes computes an **effective** request for each resource, the
        **higher** of two values:

        - the **sum** of everything that runs for the pod's whole life: the application containers and the
          native sidecars;
        - the **highest** request of any regular init container. One that is listed after a native sidecar runs
          beside it, so that sidecar's request is added to its own.

        | Container, in list order | Kind | CPU request | Memory request |
        |---|---|---|---|
        | `migrate` | regular init | 500m | 512Mi |
        | `log-shipper` | native sidecar | 50m | 64Mi |
        | `app` | application | 100m | 128Mi |

        The long-running sum is 150m and 192Mi. `migrate` is listed first, so nothing is added to its 500m and
        512Mi. The scheduler reserves **500m and 512Mi**, although the pod uses about a third of that after it
        starts.
    - kind: ask
      id: effective-request
      prompt: "A regular init container listed first requests 1 CPU, a native sidecar 100m, the application 200m. What must the scheduler find free?"
      choices:
        - text: "1300m: all the requests added together"
          why: "The init container ends before the application starts, so its request is compared with the long-running sum, not added to it."
        - text: "1 CPU: the init request is the highest"
          why: "The effective request is the higher of 1000m, the init request, and 300m, the sum of the sidecar and the application. The sidecar starts after this init container, so it adds nothing to it."
        - text: "300m: init containers finish, so they do not count"
          why: "The pod must be able to run its init container on that node, so the larger init request is reserved, even though it is used only at the start."
      answer: 1
    - kind: reflect
      id: explain-sidecar
      prompt: "A developer's Job never completes since a log-shipping helper was added. Explain why, and how native sidecars change the behaviour of startup, shutdown and Jobs."
      model: |
        The helper is listed next to the batch container under `containers`, and Kubernetes treats those as equals:
        the pod is finished only when every one of them has exited. The batch part finishes, but the helper never
        does, so the pod and the Job stay running. If the helper moves into `initContainers` with
        `restartPolicy: Always`, it becomes a native sidecar. It then starts before the batch container and stays
        up, the kubelet stops it only after the batch container has stopped, and when the batch container finishes,
        the kubelet stops the sidecar and the Job completes. OpenShift 4.21 runs Kubernetes 1.34, where this is
        stable, so only the manifest changes.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can build a pod from the three kinds of containers and say in which order they start and stop. You can
        share files between them with an `emptyDir`, read the log of any one container with `-c`, recognise an
        `Init:` status and find what an init container is waiting for. And you can say why a root `chown` init
        container does not belong on OpenShift, and what the scheduler reserves for a pod with init containers.

        The next lesson on the applications path, [Services, EndpointSlices and DNS](/lesson/d.services-dns), follows a
        request from a name to a pod. Native sidecars come back wherever a proxy or an agent runs next to an application.
  sections:
    - id: init-containers-in-detail
      title: "How init containers behave, and what they are for"
      depth: true
      body: |
        The rules of a regular init container:

        - Each one must exit with code 0 before the next starts. A failure is retried: with the pod's
          `restartPolicy: Always` (every Deployment) init containers are retried as if the policy were `OnFailure`,
          with the usual back-off; with `restartPolicy: Never`, one failure fails the whole pod.
        - They have no probes and no `lifecycle` hooks: completion *is* their health signal.
        - When the pod is recreated, they all run again. Write them to be **idempotent**: a file in an `emptyDir` may
          already exist from an earlier attempt.
        - Changing an init container in a Deployment's template is a template change: it rolls out new pods like any
          other change.

        | Use | Example | Watch out for |
        |---|---|---|
        | render configuration | write a file from the pod name, IP or a template into a shared volume | the application must read it from the shared volume, not from its own filesystem |
        | wait for a dependency | loop until `getent hosts db` succeeds | this only delays the start; the application must survive the dependency disappearing later |
        | fetch content | clone a repository or download a model into a volume | the pod start now depends on that remote system |
        | database migration | run the schema migration before the new version starts | with three replicas, three init containers run it at the same time; a migration usually belongs in a Job that runs once per release |
        | fix permissions | `chown` a volume before the app starts | on OpenShift this is usually unnecessary and often refused (see above) |
    - id: emptydir-details
      title: "emptyDir in detail"
      depth: true
      body: |
        - It is created empty when the pod is assigned to a node, and deleted for good when the pod leaves the node,
          for any reason.
        - It survives **container** restarts: a crashed application finds the files again.
        - By default it uses the node's disk (ephemeral storage); `sizeLimit` caps it. With `medium: Memory` it is a
          tmpfs, and whatever a container writes there counts against **that container's memory limit**: a
          memory-backed scratch directory can get a container OOMKilled.
    - id: debugging-multi-container-pods
      title: "Reading and debugging a multi-container pod"
      depth: true
      body: |
        `oc logs <pod> --all-containers --prefix` reads every container's log and labels each line with its source.
        `oc describe pod <pod>` lists an **Init Containers** section before **Containers**, each with State, Last State,
        exit code and restart count: read the failing init container's last state the way you read an application's.
        For a failing init container, `oc logs <pod> -c <init-container> --previous` reads the attempt that crashed.

        READY counts application containers **and native sidecars**: a pod with one application and one native
        sidecar shows `2/2` when healthy.
    - id: what-goes-wrong
      title: "What goes wrong, and how to see it"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | `Init:CrashLoopBackOff`, application logs empty | the init container's logs, with `--previous`, show the error | the init container fails (migration error, bad URL) | fix its command or input; the application never ran, so its logs cannot help |
        | `Init:0/1` for many minutes, 0 restarts | the init container's logs repeat "waiting for …" | a wait-for loop on a Service name that does not exist (typo, other project) | correct the name, or create the dependency; add a time limit to the loop |
        | pod never created, `FailedCreate` on the ReplicaSet | the event names the init container's `runAsUser` | a root `chown` init container refused by `restricted-v2` | remove it; rely on the fsGroup |
        | application: "file not found", init succeeded | the volume is not in the application's `volumeMounts`, or the init container wrote outside it | files do not cross mount namespaces | mount the same `emptyDir` in both, at the path each expects |
        | Job `Running` for days, READY `1/2` | the batch container is `Completed`, the helper is still running | helper declared in `containers` | declare it as a native sidecar |
        | pod not Ready although the application is healthy | READY `1/2`; the sidecar's readiness probe fails | a native sidecar's readiness counts towards the pod's | fix the sidecar or its probe |
        | OOMKilled with low heap usage | the container writes into a `medium: Memory` emptyDir | tmpfs pages count against the writer's memory limit | use the disk medium, or raise the limit |
    - id: choosing-the-pattern
      title: "Which pattern for which job"
      depth: true
      body: |
        | You need | Use |
        |---|---|
        | a step that must finish before the application starts, in every pod | regular init container |
        | a helper that must be up before the application and outlive it (proxy, log shipper, certificate refresher) | native sidecar |
        | several equal processes with no ordering requirement | several entries in `containers` |
        | work that must happen once per release, not once per pod (schema migration) | a Job, run before the rollout |
        | one agent per node rather than per pod | a DaemonSet |
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Non-idempotent init containers.** A pod that is recreated runs them again; an init container that appends
          to a file or creates a record each time causes duplicates.
        - **Expecting an init container to see the application.** It has finished before the application starts; only
          files in a shared volume pass between them.
        - **Using a wait-for init container instead of resilience.** It covers the first start only; the dependency
          can still go away an hour later.
        - **Heavy init requests.** The scheduler reserves the largest init request for the pod's whole life.
        - **Classic sidecars in Jobs.** A helper in `containers` that never exits keeps the Job from completing; native
          sidecars do not.
        - **Treating a sidecar's exit code at shutdown as a failure.** Sidecars stop last and may be killed when the
          grace period is used up; a non-zero exit there is expected.
  review:
    - q: "In what order does the kubelet start the containers of a pod?"
      a: "The initContainers list from top to bottom (a regular init container must exit 0, a native sidecar must have started, before the next), then all application containers together."
    - q: "How do you declare a native sidecar?"
      a: "As an entry in initContainers with restartPolicy: Always."
    - q: "What happens to a failing init container in a Deployment's pod?"
      a: "It is retried with back-off (shown as Init:Error, then Init:CrashLoopBackOff) and the application containers never start until it succeeds."
    - q: "In which order do the containers of a pod stop when it has a native sidecar?"
      a: "The application containers first; once they have stopped, the sidecars, in reverse order of their declaration."
    - q: "How is a pod's effective CPU request computed with init containers and sidecars?"
      a: "The higher of two values: the sum of the application containers and all native sidecars; and the highest init stage, where each regular init container counts its own request plus those of the native sidecars listed (and started) before it."
    - q: "How do you read the logs of an init container?"
      a: "`oc logs <pod> -c <init-container>`, with --previous for the attempt that crashed; or --all-containers --prefix for every container."
    - q: "Which containers count in the READY column?"
      a: "Application containers and native sidecars; regular init containers do not."
  labs: []
  limits: |
    The pod behaviour is recorded on OpenShift Local. The effective resource request cannot be read as an ordinary
    user, so that arithmetic comes from the Kubernetes documentation and, for sidecars listed before an init container, the Kubernetes 1.34 source. Native sidecars are upstream Kubernetes
    behaviour; the OpenShift 4.21 documentation describes classic init containers only.
  references:
    - {title: "Kubernetes 1.34: Init containers", url: "https://v1-34.docs.kubernetes.io/docs/concepts/workloads/pods/init-containers/"}
    - {title: "Kubernetes 1.34: Sidecar containers", url: "https://v1-34.docs.kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/"}
    - {title: "Kubernetes 1.34: Debug init containers (Init: statuses)", url: "https://v1-34.docs.kubernetes.io/docs/tasks/debug/debug-application/debug-init-containers/"}
    - {title: "Kubernetes 1.34: Volumes (emptyDir)", url: "https://v1-34.docs.kubernetes.io/docs/concepts/storage/volumes/#emptydir"}
    - {title: "Kubernetes 1.34: Pod lifecycle (termination)", url: "https://v1-34.docs.kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"}
    - {title: "Kubernetes source (release-1.34): pod table printer (Init: statuses, READY with sidecars)", url: "https://github.com/kubernetes/kubernetes/blob/release-1.34/pkg/printers/internalversion/printers.go"}
    - {title: "Kubernetes source (release-1.34): effective pod requests with sidecars (component-helpers resource helpers)", url: "https://github.com/kubernetes/kubernetes/blob/release-1.34/staging/src/k8s.io/component-helpers/resource/helpers.go"}
    - {title: "OpenShift 4.21: Working with containers (using init containers)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/nodes/working-with-containers"}
    - {title: "OpenShift 4.21 release notes (Kubernetes 1.34)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/release_notes/ocp-4-21-release-notes"}
  commands:
    - cmd: "oc apply -f app.yaml; oc rollout status deployment/app --timeout=180s; oc get pods -l app=app"
      meaning: "a pod with an init container, a native sidecar and an application container"
    - cmd: "oc exec deploy/app -c app -- cat /work/app.conf; oc logs deploy/app -c render-config"
      meaning: "the file written by the init container, read by the application; the init container's log"
    - cmd: "oc logs deploy/app -c log-shipper"
      meaning: "the sidecar's log: the lines the application wrote to the shared file"
    - cmd: "oc apply -f stop-order.yaml; oc wait --for=condition=Ready pod/stop-order --timeout=120s >/dev/null; (oc logs -f --timestamps stop-order -c shipper > shipper.log 2>&1 &); (oc logs -f --timestamps stop-order -c app > app.log 2>&1 &); sleep 2; oc delete pod stop-order >/dev/null; sleep 3; cat shipper.log app.log | sort"
      meaning: "both containers log when SIGTERM arrives; the timestamps show the application stops before the sidecar"
      timeout: 240
    - cmd: "oc apply -f jobs.yaml; sleep 45; oc get jobs; oc get pods -l 'job-name in (classic-helper,native-sidecar)'"
      meaning: "a helper in containers keeps a Job running; a native sidecar does not"
      timeout: 240
    - cmd: "oc apply -f wait.yaml; sleep 15; oc get pods -l app=needs-db"
      meaning: "an init container that waits for a Service: Init:0/1"
    - cmd: "oc logs deploy/needs-db"
      expect: fail
      meaning: "the default container has not started: PodInitializing"
    - cmd: "oc logs deploy/needs-db -c wait-for-db"
      meaning: "the init container's log names what it waits for"
    - cmd: "oc create service clusterip db --tcp=5432:5432; oc wait --for=condition=Ready pod -l app=needs-db --timeout=120s; oc get pods -l app=needs-db; oc logs deploy/needs-db -c wait-for-db | tail -n 2"
      meaning: "the dependency exists: the init container exits and the application starts"
      timeout: 240
    - cmd: "oc debug --help | grep -A1 -E '^    --(keep-init-containers|one-container)='"
      meaning: "oc debug runs the pod's init containers in the copy by default; --keep-init-containers=false skips them, --one-container keeps only the selected container"
    - cmd: "oc exec deploy/app -c app -- sh -c 'id -u; id -G; ls -ld /work'"
      meaning: "the application runs as a user from the project's range, and the volume belongs to the fsGroup"
    - cmd: "oc apply -f chown-init.yaml 2>/dev/null; sleep 6; oc get deployment chown-init; oc get events --field-selector reason=FailedCreate -o jsonpath='{.items[-1:].message}{\"\\n\"}' | grep -oP 'provider restricted-v2: \\S+ Invalid value: 0: must be in the ranges: \\[[0-9, ]+\\]'"
      meaning: "an init container that runs as root is refused: the Deployment gets no pod"
  files:
    app.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: app
        template:
          metadata:
            labels:
              app: app
          spec:
            initContainers:
            - name: render-config
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "echo \"pod=$POD_NAME\" > /work/app.conf; echo rendered /work/app.conf"]
              env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              volumeMounts:
              - name: work
                mountPath: /work
            - name: log-shipper
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              restartPolicy: Always
              command: ["sh", "-c", "touch /work/app.log; tail -F /work/app.log"]
              volumeMounts:
              - name: work
                mountPath: /work
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "cat /work/app.conf; while true; do date >> /work/app.log; sleep 5; done"]
              volumeMounts:
              - name: work
                mountPath: /work
            volumes:
            - name: work
              emptyDir: {}
    stop-order.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: stop-order
      spec:
        initContainers:
        - name: shipper
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          restartPolicy: Always
          command: ["sh", "-c", "trap 'echo shipper got SIGTERM; exit 0' TERM; echo shipper started; sleep infinity & wait"]
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sh", "-c", "trap 'echo app got SIGTERM; sleep 6; echo app done; exit 0' TERM; echo app started; sleep infinity & wait"]
    jobs.yaml: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: classic-helper
      spec:
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: batch
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "echo batch work; sleep 5; echo batch done"]
            - name: helper
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
      ---
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: native-sidecar
      spec:
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            initContainers:
            - name: helper
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              restartPolicy: Always
              command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
            containers:
            - name: batch
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "echo batch work; sleep 5; echo batch done"]
    wait.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: needs-db
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: needs-db
        template:
          metadata:
            labels:
              app: needs-db
          spec:
            initContainers:
            - name: wait-for-db
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "until getent hosts db; do echo waiting for db; sleep 2; done"]
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
    chown-init.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: chown-init
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: chown-init
        template:
          metadata:
            labels:
              app: chown-init
          spec:
            initContainers:
            - name: fix-permissions
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "chown -R 1000:1000 /data"]
              securityContext:
                runAsUser: 0
              volumeMounts:
              - name: data
                mountPath: /data
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sleep", "infinity"]
              volumeMounts:
              - name: data
                mountPath: /data
            volumes:
            - name: data
              emptyDir: {}
- id: o3.ingress-gateway
  title: "Ingress and the Gateway API"
  subtitle: "How the platform serves a Kubernetes Ingress, and what the Gateway API adds in 4.21"
  module: a5-network
  mode: GUIDED_INVESTIGATION
  minutes: 40
  level: 2
  supports: "OpenShift 4.21: Ingress (networking.k8s.io/v1) converted to Routes by the ingress-to-route controller, IngressClass openshift-default; Gateway API gateway.networking.k8s.io/v1 implemented by the Ingress Operator (generally available since 4.19). Ingress conversion is recorded on OpenShift Local 4.21 by the ordinary user developer, in a temporary project. The cluster administrator kubeadmin read the Gateway API state of the cluster (definitions present, no GatewayClass, no Gateway) and changed nothing. Enabling the Gateway API was not done, because it installs a service mesh control plane that this single small node has no room for, so its GatewayClass and Gateway are documented examples."
  concepts: [net.routes, net.ingresscontroller]
  prerequisites: [d.routes-tls]
  record_on: cluster-admin
  objective: |
    Predict the Route that OpenShift generates from a Kubernetes Ingress (host, path, TLS, annotations), know which
    object to change when it misbehaves, and explain how the Gateway API is enabled on OpenShift 4.21, who creates
    which object, and how an HTTPRoute attaches to a Gateway.
  flow:
    - kind: teach
      id: situation
      title: "Three APIs for one job"
      body: |
        A chart written for plain Kubernetes ships an **Ingress**. Your platform team announces that the
        **Gateway API** is available. And everything in [the last lesson](/lesson/d.routes-tls) used **Routes**.
        Three APIs can say "send `shop.example.com` to this Service". When a site breaks, you must know which object
        the router really serves, which one you may change, and which change will last.

        The short answer: on OpenShift an Ingress becomes a Route, and the router serves the Route. The Gateway API
        is a separate path, through a different proxy, and it exists only once a cluster administrator has enabled
        it. The first part of this lesson runs the conversion for real. The second part explains the Gateway API,
        which an ordinary user can only look at from the outside.
    - kind: ask
      id: recall-default-cert
      recalls: d.routes-tls
      prompt: "A look back. A TLS Route carries no certificate of its own. Which certificate does the router present?"
      choices:
        - text: "The IngressController's default wildcard certificate"
          why: "A TLS Route without its own certificate is served with the default one, a wildcard for the apps domain. This lesson meets it again on Ingress objects."
        - text: "The service CA's certificate for the Service"
          why: "Service serving certificates are presented by the pod to the router, for re-encrypt and passthrough. They are not what the router shows to clients."
        - text: "None: a TLS Route needs its own certificate"
          why: "The Route works over HTTPS: the router falls back to the default certificate, and clients that do not trust its issuer see a warning."
      answer: 0
    - kind: teach
      id: ingress-becomes-route
      title: "From Ingress to Route"
      body: |
        OpenShift's **ingress-to-route controller** watches Ingress objects and creates Routes from them. It makes
        **one Route per host and path** of the Ingress, named after the Ingress plus a random suffix, and the Route
        carries an **owner reference** to the Ingress: a field that says which object it belongs to.

        An Ingress names a class of controller that should serve it. The default IngressController has the class
        `openshift-default`.

        `oc create ingress` writes an Ingress from one `--rule` per host and path, in the form
        `host/path=service:port`. A `*` at the end of the path makes it a Prefix path. An Ingress gets no generated
        host, so the command writes one: the project's name under `apps-crc.testing`, OpenShift Local's apps domain,
        whose wildcard DNS name already leads to the router. On another cluster, use your own apps domain. This
        creates an Ingress `frontend` and lists the Ingress and the Routes:
    - kind: show
      id: create-ingress
      body: "The lesson's source files `web.yaml` and `service.yaml` hold the same `web` Deployment and Service as in [Services, EndpointSlices and DNS](/lesson/d.services-dns): two pods, and a Service port called `http`. They are applied first, and then the Ingress is created:"
      run: "oc apply -f web.yaml -f service.yaml; oc rollout status deployment/web --timeout=180s; oc create ingress frontend --class=openshift-default --rule=\"frontend-$(oc project -q).apps-crc.testing/*=web:8080\"; sleep 5; oc get ingress; oc get routes"
      notice: |
        The first lines apply the Deployment and the Service and wait for the rollout. Then the Ingress is created.
        `ADDRESS` is filled in once the router has taken it: it is the router's host name. The controller made one
        Route, `frontend-` plus a random suffix, with the host and path of the rule (`/`, because of the `*`), the
        Service `web`, and the port `http`: the rule named port 8080, and the Route uses the name of that Service
        port. `TERMINATION` is empty: this is a plain HTTP Route, because the Ingress has no TLS section.
    - kind: show
      id: owner
      body: "The Route's owner reference and its `spec`, read from the Route that the controller created:"
      run: "oc get routes -o name | head -n 1 | xargs oc get -o yaml | sed -n '/ownerReferences:/,/uid:/p; /^spec:/,/wildcardPolicy/p'"
      highlight: ["controller: true", "kind: Ingress", "host:", "targetPort"]
      notice: |
        `ownerReferences` names the Ingress `frontend` with `controller: true`: the Ingress owns this Route. The
        `spec` is what the rule said: host, path `/`, the Service `web`, its port `http`, and weight 100. The
        controller compares the Route with the Ingress all the time, and puts the Route back in line when they
        differ.
      understand:
        purpose: Prints two parts of the Route that the ingress-to-route controller generated, its owner reference and
          its spec, without typing the Route's random name.
        parts:
          - text: oc get routes -o name | head -n 1
            means: The name of the project's first Route, written as kind and name (`route.route.openshift.io/frontend-…`).
              There is only one here, the one the controller made.
          - text: xargs oc get -o yaml
            means: '`xargs` reads that name from its standard input and adds it to the end of the command, so this runs
              `oc get -o yaml` on the Route.'
          - text: sed -n '/ownerReferences:/,/uid:/p; /^spec:/,/wildcardPolicy/p'
            means: '`-n` prints nothing unless told to. Each `/start/,/end/p` prints a range of lines, from a line
              matching `start` to the next line matching `end`: first the owner reference, then the `spec`.'
        concepts:
          - net.routes
          - linux.shell
        refs:
          - title: xargs(1)
            url: https://man7.org/linux/man-pages/man1/xargs.1.html
          - title: sed(1) (address ranges, -n, p)
            url: https://man7.org/linux/man-pages/man1/sed.1.html
          - title: 'OpenShift 4.21: Routes (creating a route through an Ingress object)'
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes
    - kind: ask
      id: guess-annotate
      guess: true
      prompt: "You add a router annotation to the Route that was generated from an Ingress. Ten seconds later, what does the Route carry?"
      choices:
        - text: "The annotation, as you set it"
          why: "The Route is owned by the Ingress, and the controller keeps it in line with the Ingress. A hand edit does not stay. The next step shows it."
        - text: "The annotation, and a warning event on the Route"
          why: "Nothing warns. The controller quietly reconciles the Route, and the edit disappears. The next step shows it."
        - text: "No annotation: the controller removed it"
          why: "The controller compares the Route with what the Ingress says and puts it back, annotations included. The next step shows it."
      answer: 2
    - kind: show
      id: annotate-route
      run: "r=$(oc get routes -o name); oc annotate $r haproxy.router.openshift.io/timeout=2m; sleep 10; echo \"timeout annotations on the Route after 10 seconds: $(oc get $r -o yaml | grep -c 'haproxy.router.openshift.io/timeout')\""
      highlight: ["annotated", "after 10 seconds"]
      notice: |
        The API accepted the annotation (`annotated`). Ten seconds later it is not there: the count of `timeout`
        annotations on the Route is `0`. The controller rebuilt the Route from the Ingress, which does not carry it.
    - kind: try
      id: try-annotate-ingress
      body: "Set the same annotation where it will last: `haproxy.router.openshift.io/timeout=2m`, on the Ingress `frontend`."
      accept: ["oc annotate ingress/frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ingress frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ing/frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ing frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ingresses/frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ingresses frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ingress.networking.k8s.io/frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ingress.networking.k8s.io frontend haproxy.router.openshift.io/timeout=2m", "oc annotate ingress/frontend haproxy.router.openshift.io/timeout=2m --overwrite", "oc annotate ingress frontend haproxy.router.openshift.io/timeout=2m --overwrite", "oc annotate ing/frontend haproxy.router.openshift.io/timeout=2m --overwrite", "oc annotate ing frontend haproxy.router.openshift.io/timeout=2m --overwrite", "oc annotate ingress/frontend --overwrite haproxy.router.openshift.io/timeout=2m", "oc annotate ingress frontend --overwrite haproxy.router.openshift.io/timeout=2m", "oc annotate ing/frontend --overwrite haproxy.router.openshift.io/timeout=2m", "oc annotate ing frontend --overwrite haproxy.router.openshift.io/timeout=2m", "oc annotate ingress/frontend haproxy.router.openshift.io/timeout=\"2m\"", "oc annotate ingress frontend haproxy.router.openshift.io/timeout=\"2m\"", "oc annotate ing/frontend haproxy.router.openshift.io/timeout=\"2m\"", "oc annotate ing frontend haproxy.router.openshift.io/timeout=\"2m\"", "oc annotate ingress/frontend haproxy.router.openshift.io/timeout='2m'", "oc annotate ingress frontend haproxy.router.openshift.io/timeout='2m'", "oc annotate ing/frontend haproxy.router.openshift.io/timeout='2m'", "oc annotate ing frontend haproxy.router.openshift.io/timeout='2m'"]
      hints:
        - match: "^oc annotate (route|routes)"
          say: "That is the object that was reverted. The Route is generated from the Ingress, so the annotation belongs on the Ingress."
        - match: "^oc annotate (ingress|ing|ingresses)[ /]frontend$"
          say: "Give the annotation too: `haproxy.router.openshift.io/timeout=2m`, as `key=value`."
        - match: "^oc annotate haproxy"
          say: "Name the object first: the kind and the name, `ingress frontend`, then the annotation."
        - match: "^oc (edit|patch|label)"
          say: "`oc annotate` sets one annotation in a single command: `oc annotate <kind> <name> <key>=<value>`."
        - match: "^kubectl"
          say: "`kubectl annotate` works the same way. This course uses `oc`."
      hint: "`oc annotate`, the Ingress `frontend`, then the annotation as `key=value`."
      run: "oc annotate ingress frontend haproxy.router.openshift.io/timeout=2m; sleep 5; oc get routes -o jsonpath='{.items[0].metadata.annotations}{\"\\n\"}'"
      then: "The controller copied the annotation from the Ingress to the Route, and keeps it there. Router annotations such as timeouts, HSTS and balancing therefore work on an Ingress too."
    - kind: teach
      id: not-converted
      title: "Rules that do not become Routes"
      body: |
        The controller skips a rule that OpenShift cannot serve, and records an event named
        `IncompleteIngressToRouteRules` on the Ingress. The rules that are skipped:

        - a rule **without a host**: the host is mandatory on OpenShift;
        - a path of type **`Exact`**: `Prefix` and `ImplementationSpecific` paths are converted;
        - a backend that is not a Service, a Service that does not exist, or a port that the Service does not have;
        - a TLS section whose Secret is missing or invalid (below).

        Annotations that are meant for other controllers, such as nginx, have no effect. Two Ingresses show the
        first two cases. `nohost` has a rule without a host. `exact` has a host, and a path
        written without the trailing `*`, which makes it an `Exact` path:
    - kind: show
      id: create-incomplete
      run: "oc create ingress nohost --class=openshift-default --rule=\"/*=web:8080\"; oc create ingress exact --class=openshift-default --rule=\"exact-$(oc project -q).apps-crc.testing/api=web:8080\"; sleep 8; oc get routes; oc describe ingress exact | tail -n 2"
      notice: |
        Two more Ingresses, and still only one Route, the one of `frontend`. `nohost` and `exact` produced nothing.
        And `oc describe ingress exact`, the usual place to look, ends with `Events: <none>`.
    - kind: try
      id: try-events
      body: "Two Ingresses exist and neither has a Route. Read the events of the project that were recorded with the reason `IncompleteIngressToRouteRules`."
      accept: ["oc get events --field-selector reason=IncompleteIngressToRouteRules", "oc get event --field-selector reason=IncompleteIngressToRouteRules", "oc get ev --field-selector reason=IncompleteIngressToRouteRules", "oc get events --field-selector=reason=IncompleteIngressToRouteRules", "oc get event --field-selector=reason=IncompleteIngressToRouteRules", "oc get ev --field-selector=reason=IncompleteIngressToRouteRules", "oc get events --field-selector involvedObject.kind=Ingress", "oc get event --field-selector involvedObject.kind=Ingress", "oc get ev --field-selector involvedObject.kind=Ingress", "oc get events --field-selector=involvedObject.kind=Ingress", "oc get event --field-selector=involvedObject.kind=Ingress", "oc get ev --field-selector=involvedObject.kind=Ingress", "oc get events --field-selector reason=IncompleteIngressToRouteRules -o wide", "oc get event --field-selector reason=IncompleteIngressToRouteRules -o wide", "oc get ev --field-selector reason=IncompleteIngressToRouteRules -o wide", "oc get events -o wide --field-selector reason=IncompleteIngressToRouteRules", "oc get event -o wide --field-selector reason=IncompleteIngressToRouteRules", "oc get ev -o wide --field-selector reason=IncompleteIngressToRouteRules"]
      hints:
        - match: "^oc describe"
          say: "On this cluster, `describe` shows no events for these Ingresses, as the output above did. The events exist in the project: list them with `oc get events`."
        - match: "^oc get events?$|^oc get ev$"
          say: "That lists every event of the project. Filter them with `--field-selector reason=IncompleteIngressToRouteRules`."
        - match: "^oc get (ingress|ing|routes?)"
          say: "Those are the objects, and the reason is missing from them. The explanation is in the events."
        - match: "^oc logs"
          say: "The controller's reason is an event on the Ingress, not a log line you can reach. Use `oc get events`."
        - match: "--field-selector.*(IncompleteIngress|incomplete)"
          say: "The field is `reason`, and the value is case-sensitive: `reason=IncompleteIngressToRouteRules`."
      hint: "`oc get events`, filtered with `--field-selector` on the field `reason`."
      run: "oc get events --field-selector reason=IncompleteIngressToRouteRules"
      then: |
        Two events, both with the reason `IncompleteIngressToRouteRules`, one on `ingress/exact` and one on
        `ingress/nohost`. Their messages name the cause: `Unsupported exact path type in rule at index 0`, and
        `Missing host field in rule at index 0`. `oc describe` showed no events for the same Ingress on this cluster,
        so ask for the events by reason: that is where the controller records why it skipped a rule.
    - kind: ask
      id: read-rules
      prompt: "Which of these `oc create ingress --rule` values becomes a Route?"
      evidence: |
        --rule="/*=web:8080"
        --rule="shop.example.com/api=web:8080"
        --rule="shop.example.com/*=web:8080"
      choices:
        - text: "The first: it has a Prefix path"
          why: "It has no host. The host is mandatory on OpenShift, so the controller skips the rule and records an event."
        - text: "The second: it has a host and a path"
          why: "Without the trailing `*` the path is `Exact`, and Exact paths are not converted. The path `/api/*` would have worked."
        - text: "The third: it has a host and a Prefix path"
          why: "A host, and a path ending in `*`, which makes it a Prefix. That is the combination that the controller converts."
      answer: 2
    - kind: teach
      id: ingress-tls
      title: "TLS on an Ingress"
      body: |
        An Ingress has no field for the termination type. OpenShift reads the Ingress's `tls` section and one
        annotation:

        | Ingress has | Generated Route |
        |---|---|
        | no `tls`, no annotation | plain HTTP Route |
        | `tls` with `secretName` (a `kubernetes.io/tls` Secret) | **edge**, with that certificate, plain HTTP redirected |
        | `tls: [{}]`, an empty entry | edge with the default certificate, plain HTTP redirected |
        | annotation `route.openshift.io/termination: reencrypt` or `passthrough` | that termination |

        A `secretName` that does not exist, or a Secret without a valid certificate, gives **no Route** for that host until it
        is fixed: the controller will not publish a host with a broken certificate. `oc create ingress` writes the
        `tls` section from `,tls=<secret>` at the end of a rule. The Secret `shop-tls` does not exist yet:
    - kind: show
      id: missing-secret
      run: "oc create ingress secure --class=openshift-default --rule=\"secure-$(oc project -q).apps-crc.testing/*=web:8080,tls=shop-tls\"; sleep 8; oc get routes; oc get events --field-selector reason=IncompleteIngressToRouteRules | grep secure"
      notice: |
        The Ingress `secure` exists, and `frontend` is still the only Route: nothing was made for `secure`. One
        event explains: `Invalid or missing TLS secret` for the host. The controller will not publish a host whose
        certificate it cannot read.
    - kind: show
      id: make-secret
      body: "A throwaway self-signed certificate for the host of `secure`, stored as a TLS Secret. The Ingress is not touched. Then the Routes, and a request over HTTPS that trusts the certificate, and one over plain HTTP:"
      run: "host=secure-$(oc project -q).apps-crc.testing; openssl req -x509 -newkey rsa:2048 -nodes -keyout tls.key -out tls.crt -days 2 -subj \"/CN=$host\" -addext \"subjectAltName=DNS:$host\" 2>/dev/null; oc create secret tls shop-tls --cert=tls.crt --key=tls.key; sleep 10; oc get routes; sleep 10; curl -sv --cacert tls.crt -o /dev/null https://$host/ 2>&1 | grep -E 'subject:|SSL certificate verify|< HTTP'; curl -s -o /dev/null -D - http://$host/ | grep -i -e '^HTTP' -e '^location'"
      highlight: ["verify ok", "302", "secure-"]
      notice: |
        Once the Secret `shop-tls` exists, the controller makes the Route by itself. `secure-` plus a suffix has
        `TERMINATION` `edge/Redirect`: edge, with plain HTTP redirected. The router presented the Secret's
        certificate (`subject` is the host, and `curl --cacert` verified it) and answered 200. Plain HTTP got a 302
        to `https://`.
      understand:
        purpose: Makes a throwaway certificate for the Ingress's host (the same `openssl` command as in [Routes and TLS](/lesson/d.routes-tls)),
          stores it as a TLS Secret, then checks the Route that appears, over HTTPS and over plain HTTP.
        parts:
          - text: oc create secret tls shop-tls --cert=tls.crt --key=tls.key
            means: 'Creates a Secret of type `kubernetes.io/tls` with the entries `tls.crt` and `tls.key`: the format
              that an Ingress''s `secretName` expects.'
          - text: --cacert tls.crt
            means: 'Gives `curl` this file as the authority to trust. The certificate is self-signed, so it is its own
              authority: `curl` can then check the server''s certificate and host name for real.'
          - text: -sv
            means: '`-v` writes the connection details (TLS handshake, headers) to the error stream; `2>&1` sends them
              into the pipe, where `grep` keeps the lines about the certificate and the status.'
          - text: -D -
            means: Writes the response headers to standard output (`-` means standard output), so that `grep` can find
              the status line and `Location`.
          - text: grep -i -e '^HTTP' -e '^location'
            means: '`-i` ignores case; each `-e` adds a pattern; `^` means the start of a line.'
        concepts:
          - sec.certs
          - net.routes
        refs:
          - title: 'Kubernetes: Secrets (TLS secrets)'
            url: https://kubernetes.io/docs/concepts/configuration/secret/
          - title: curl manual (--cacert, -v, -D)
            url: https://curl.se/docs/manpage.html
    - kind: teach
      id: route-or-ingress
      title: "Route or Ingress?"
      body: |
        | You need | Use | Why |
        |---|---|---|
        | a manifest or chart that also runs on other Kubernetes distributions | Ingress | portable; OpenShift converts it |
        | weighted backends (A/B, canary) | Route | `alternateBackends` exist only on Routes; the generated Route is rebuilt from the Ingress, which has no weights |
        | passthrough or re-encrypt with full control of the certificates | Route, or an Ingress with the annotations above | the Route has these as fields |
        | a host name generated for you from the apps domain | Route | an Ingress must name its host |
        | router behaviour (timeouts, HSTS, balancing) | either | annotations are copied from the Ingress |
        | role separation, and HTTP matching and splitting in a portable API | Gateway API, if the platform provides it | see below |
    - kind: ask
      id: choose-canary
      prompt: "A team exposes `shop.apps.example.com` with an Ingress and wants 5% of its traffic on a canary Service. The cluster has no GatewayClass. What do you recommend?"
      choices:
        - text: "Replace it with a weighted Route"
          why: "Weighted backends live on Routes, and a Route that the team owns is not rewritten by a controller. The Ingress has to go, or both would claim the host. The Gateway API has weights too, but this cluster has no GatewayClass."
        - text: "Add weights to the Ingress's backend"
          why: "The Ingress API has no weight field, so there is nothing to add."
        - text: "Add `alternateBackends` to the generated Route"
          why: "The controller rebuilds the generated Route from the Ingress, so the edit would be undone, as the annotation was."
      answer: 0
    - kind: teach
      id: gateway-api-model
      title: "The Gateway API model"
      body: |
        The Gateway API is the Kubernetes community's successor to Ingress. It is organised around **roles**:

        | Resource | Scope | Says | Typically owned by |
        |---|---|---|---|
        | `GatewayClass` | cluster | which controller implements gateways of this class | cluster administrators |
        | `Gateway` | namespace | listeners: ports, protocols, host names, TLS, which namespaces may attach routes | platform team |
        | `HTTPRoute` (and `GRPCRoute`) | namespace | match host, path, headers; send to Services, with weights | application team |
        | `ReferenceGrant` | namespace | allows a reference into this namespace from another | the owner of the target namespace |

        Both sides must agree. A Route claims a host on the shared router by itself. An HTTPRoute attaches only
        to a Gateway whose listener allows routes from its namespace.
    - kind: show
      id: gateway-resources
      body: "Does this cluster know these resources? `oc api-resources` lists the kinds that the API serves, and `grep` keeps the Gateway API ones:"
      run: "oc api-resources | grep -i gateway"
      notice: |
        The API serves the Gateway API kinds: GatewayClass (not namespaced, `false`), Gateway, GRPCRoute, HTTPRoute
        and ReferenceGrant, which is still at `v1beta1`. OpenShift installs these definitions by default since 4.19, so
        they are here whether or not the Gateway API is in use. That says nothing about whether anything serves them.
    - kind: ask
      id: guess-gatewayclass
      guess: true
      prompt: "As an ordinary project user, you run `oc get gatewayclass`. What do you get?"
      choices:
        - text: "The list of the cluster's GatewayClasses"
          why: "A GatewayClass is cluster-scoped, and listing cluster-scoped objects needs a permission that project users do not have by default. The next step shows the answer."
        - text: "Forbidden: it is cluster-scoped"
          why: "Project permissions stop at the project. Listing cluster-scoped objects needs a cluster-level role. The next step shows the message."
        - text: "An empty list: nothing is enabled"
          why: "An empty list would mean that you may look and nothing exists. You are not allowed to look at all, so you cannot tell. The next step shows the message."
      answer: 1
    - kind: show
      id: gatewayclass
      run: "oc get gatewayclass"
      notice: |
        Forbidden: a GatewayClass is cluster-scoped, and the user `developer` may not list it at the cluster scope.
        An application team cannot tell from here whether the platform enabled the Gateway API. You ask the platform
        team, or look for a Gateway that you are allowed to attach to.
    - kind: try
      id: gatewayclass-admin
      body: "The platform team's answer. In the cluster administrator's terminal, list in one command every GatewayClass and every Gateway, in all namespaces."
      accept: ["oc get gatewayclasses,gateways -A", "oc get gatewayclass,gateway -A", "oc get gatewayclasses,gateways --all-namespaces", "oc get gatewayclass,gateway --all-namespaces", "oc get gc,gtw -A", "oc get gc,gtw --all-namespaces", "oc get gateways,gatewayclasses -A", "oc get gateway,gatewayclass -A"]
      hints:
        - match: "^oc get (gatewayclass(es)?|gc)$"
          say: "That lists the classes only. Add the Gateways with a comma, `gatewayclasses,gateways`, and `-A` for every namespace."
        - match: "^oc get \\S+ (gateways?|gtw)"
          say: "Two kinds in one `oc get` are joined by a comma, without a space."
        - match: "^oc get \\S*(gateways?|gtw)\\S*$"
          say: "Gateways live in namespaces. Without `-A` you only see the current one."
      hint: "`oc get`, both kinds joined by a comma, and `-A`."
      run: "oc get gatewayclasses,gateways -A"
      then: |
        `No resources found`: no GatewayClass and no Gateway anywhere. The definitions are installed, but nobody has
        enabled the Gateway API on this cluster, so nothing would serve an HTTPRoute. That is the answer the
        application team could not get by itself.
    - kind: show
      id: gateway-crds
      body: "Where the definitions come from. The administrator reads the version annotations of one of them, and the message of an admission policy that protects them:"
      run: "oc get crd gatewayclasses.gateway.networking.k8s.io -o jsonpath='{.metadata.annotations.gateway\\.networking\\.k8s\\.io/bundle-version} {.metadata.annotations.gateway\\.networking\\.k8s\\.io/channel}{\"\\n\"}'; oc get validatingadmissionpolicy openshift-ingress-operator-gatewayapi-crd-admission -o jsonpath='{.spec.validations[0].message}{\"\\n\"}'"
      notice: |
        The cluster carries Gateway API `v1.3.0`, `standard` channel. The admission policy's message says who owns the
        definitions: `Gateway API Custom Resource Definitions are managed by the Ingress Operator and may not be
        modified`. Even a cluster administrator does not install or change them by hand; enabling the API is done
        with a GatewayClass.
    - kind: teach
      id: gateway-on-openshift
      title: "How version 4.21 enables it"
      body: |
        The Gateway API is not on until a **cluster administrator** creates a GatewayClass, a cluster-scoped object,
        with exactly this controller name. Then the platform team creates **Gateways**, the listeners that
        application teams attach to:
    - kind: show
      id: gateway-yaml
      code: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        metadata:
          name: openshift-default
        spec:
          controllerName: openshift.io/gateway-controller/v1
        ---
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: shared-gateway
          namespace: openshift-ingress
        spec:
          gatewayClassName: openshift-default
          listeners:
          - name: https
            hostname: "*.gwapi.apps.example.com"
            port: 443
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
              - name: gwapi-wildcard
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    shared-gateway-access: "true"
      caption: "A GatewayClass and a Gateway, as the OpenShift 4.21 documentation describes them. Not run on this cluster: they need a cluster administrator and the platform team."
      origin: example
      notice: |
        `openshift.io/gateway-controller/v1` is the only controller name that the Ingress Operator manages. A
        GatewayClass with any other name, and its Gateways and routes, are ignored. When the class appears, the
        Ingress Operator installs a lightweight Red Hat OpenShift Service Mesh (Istio) control plane in
        `openshift-ingress`. How it installs it changed within 4.21. Up to 4.21.22 it used a Service Mesh
        subscription in Operator Lifecycle Manager, and the 4.21 documentation warns that an existing Service Mesh
        2.x subscription then makes the `ingress` cluster operator report `Degraded`, with the reason
        `GatewayAPIOSSMConflict`. From 4.21.23 it installs Istio directly, from an embedded library, and the
        release notes say that an existing Service Mesh installation is no longer affected.

        Gateways must live in `openshift-ingress`, and each gets its own proxy Deployment and a Service of type
        `LoadBalancer`; without a load-balancer implementation, that Service gets no external address. The listener's
        host name must be a subdomain of the cluster's domain. `allowedRoutes` decides which namespaces may attach
        routes. The documentation warns never to use `from: All`, which lets any namespace claim host names. Without
        `allowedRoutes`, only routes in the Gateway's own namespace attach.
    - kind: teach
      id: httproute-basics
      title: "HTTPRoute basics"
      body: |
        As an application team you create an **HTTPRoute** in your own project. Its `parentRefs` name the Gateway,
        with its namespace, since the Gateway is not yours. Its `hostnames` must fall within the listener's host
        name. Its `backendRefs` point at Services in your namespace, each with a `weight`, so canaries are native.

        Whether it worked is in the route's `status.parents[].conditions`. `Accepted` says whether the Gateway took
        the route: `False` with the reason `NotAllowedByListeners` means that the listener does not allow your
        namespace. `ResolvedRefs` says whether the backends exist and may be referenced.
    - kind: ask
      id: httproute-status
      prompt: "An HTTPRoute in the project `shop` names the shared Gateway. Its `Accepted` condition is `False`, reason `NotAllowedByListeners`. What is missing?"
      choices:
        - text: "A ReferenceGrant in `openshift-ingress`"
          why: "A ReferenceGrant allows a reference to an object in another namespace, such as a backend Service. Attaching to a Gateway is decided by the listener's `allowedRoutes`."
        - text: "A readiness probe on the backend pods"
          why: "Readiness shows up in the backends' state, under `ResolvedRefs` or in the proxy. It does not decide whether the Gateway accepts the route."
        - text: "The label the listener's selector wants"
          why: "The listener lets in only namespaces that match its `allowedRoutes` selector. The platform team labels the namespace, for example `shared-gateway-access: \"true\"`."
      answer: 2
    - kind: show
      id: httproute-yaml
      body: "An HTTPRoute can be applied in any project. This one names the Gateway from the example above, and sends 90% of the traffic to `web` and 10% to a canary Service:"
      code: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: web
        spec:
          parentRefs:
          - name: shared-gateway
            namespace: openshift-ingress
          hostnames: ["web.gwapi.apps.example.com"]
          rules:
          - matches:
            - path: {type: PathPrefix, value: /api}
            backendRefs:
            - {name: web, port: 8080, weight: 90}
            - {name: web-canary, port: 8080, weight: 10}
      caption: "httproute.yaml"
      notice: "`weight` is proportional, like a Route's weights. A rule without `matches` matches the prefix `/`."
    - kind: show
      id: httproute-run
      run: "oc apply -f httproute.yaml; sleep 5; oc get httproute; oc get httproute web -o jsonpath='status: {.status}{\"\\n\"}'"
      notice: |
        The API stored the HTTPRoute, and `oc get httproute` lists it. But its `status` is empty: a route that a
        Gateway had accepted would show `status.parents` with conditions. Nothing has reported on this one, so no
        Gateway has taken it. A project user cannot list the Gateways of `openshift-ingress`; the administrator's
        listing above found none at all. An object that exists is not an object that is served.
    - kind: reflect
      id: explain-ingress-gateway
      prompt: "A colleague used to plain Kubernetes asks what happens on OpenShift when they apply their Ingress, and whether they should use the Gateway API instead. Explain the path and the choice."
      model: |
        On OpenShift your Ingress is not served directly: a controller turns each host and path into a Route, owned by
        the Ingress, and the HAProxy router serves that Route. Change the Ingress, not the generated Route; annotations
        on the Ingress are copied over, so router timeouts and similar settings work. TLS follows the tls section, edge
        by default, and the route.openshift.io/termination annotation chooses re-encrypt or passthrough. The Gateway
        API is a separate path: it is generally available on 4.21, but a cluster administrator must enable it by
        creating a GatewayClass with the controller name openshift.io/gateway-controller/v1, and the platform team
        creates Gateways in openshift-ingress. You then attach HTTPRoutes from your namespace if the Gateway allows it.
        If the cluster offers it and you want a portable API with role separation, use it; otherwise an Ingress or a
        Route is the way.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can predict the Route that OpenShift makes from an Ingress: one per host and path, owned by the Ingress,
        with its annotations, and edge TLS from the `tls` section. You know which rules are skipped and where the
        reason is recorded, and that changes belong on the Ingress and not on the generated Route. And you can say how
        the Gateway API is enabled on 4.21, who owns which object, and how an HTTPRoute attaches to a Gateway.

        Weighted backends, which Ingress cannot express, are the subject of
        [Blue/green and canary releases](/lesson/o3.release-strategies), later in this path. Next on the path:
        [Configuration with ConfigMaps and Secrets](/lesson/o1.config-secrets), the settings that an image should
        not contain.
  sections:
    - id: ingress-details
      title: "Ingress conversion in detail"
      depth: true
      body: |
        - **Labels.** Labels are kept in sync only when the Ingress has the annotation
          `route.openshift.io/reconcile-labels: "true"`, which then replaces any label added to the Route by hand. The
          documentation says that the Route does not inherit labels by default, although the 4.21 controller sets the
          Ingress's labels when it first creates the Route.
        - **Status.** When the router has admitted the Route, the controller writes the router's canonical host name into
          the Ingress's `status.loadBalancer`. That is the `ADDRESS` column of `oc get ingress`.
        - **Classes.** An Ingress that names a class handled by another controller is left alone. One that names no
          class is still converted, but about 24 hours later the cluster raises an `ingressWithoutClassName` alert:
          set `spec.ingressClassName: openshift-default`.
        - **Passthrough.** The documentation asks for `path: ''` and `pathType: ImplementationSpecific`, since the router
          cannot see paths inside TLS.
        - **Re-encrypt.** With the annotation `route.openshift.io/destination-ca-certificate-secret: <secret>`, the
          Route's `destinationCACertificate` comes from that Secret's `tls.crt`.
    - id: gateway-details
      title: "The Gateway API in version 4.21: what to know"
      depth: true
      body: |
        On OpenShift 4.21 the implementation is based on `gateway.networking.k8s.io/v1`, all fields of that version
        are supported, and the documentation lists these resources: GatewayClass, Gateway, HTTPRoute, GRPCRoute and
        ReferenceGrant. `oc api-resources` shows ReferenceGrant at `v1beta1`. The feature has been generally available
        since OpenShift 4.19. It does not support user-defined networks (UDN). The 4.21 documentation says that the
        Ingress Operator installs and manages Service Mesh 3 (OSSM v3.x) for the Gateway API. Until 4.21.22 it did so
        through an Operator Lifecycle Manager subscription; from 4.21.23 it installs Istio itself, through the Sail
        Library, and clusters are moved to that method during the update. OpenShift 4.22 adds BackendTLSPolicy
        (`gateway.networking.k8s.io/v1`) to the resources it documents. This course's recordings come from 4.21.8.

        | | Route | HTTPRoute |
        |---|---|---|
        | proxy | the router (HAProxy) | a per-Gateway proxy, managed by Istio |
        | who can publish a host | any project (oldest claim wins) | only namespaces the Gateway allows |
        | TLS | per Route | per Gateway listener (`certificateRefs`) |
        | weights | `alternateBackends`, up to 3 besides the main Service | `backendRefs[].weight` |
        | available | always | after a cluster administrator creates the GatewayClass |

        Wait for a Gateway with `oc wait --for=condition=Programmed` on the Gateway object.
    - id: what-goes-wrong
      title: "What goes wrong, and how to see it"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | an Ingress exists, no Route appears | an `IncompleteIngressToRouteRules` event | missing host, `Exact` path type, Service missing | fix the rule |
        | no Route for one TLS host | the same event: "Invalid or missing TLS secret" | the `secretName` does not exist or holds no valid certificate | create the TLS Secret |
        | the Ingress is ignored completely | `spec.ingressClassName` names another controller's class | not OpenShift's class | `openshift-default` |
        | a change to the generated Route disappears | the Route's `ownerReferences` is the Ingress | the controller reconciles the Route | change the Ingress |
        | Gateway objects have no effect | no `status` on the Gateway or HTTPRoute; `oc get gatewayclass` shows another controller name, or none | the class is not OpenShift's | ask a cluster administrator for `openshift.io/gateway-controller/v1` |
        | HTTPRoute not served | `status.parents[].conditions`: `Accepted=False`, `NotAllowedByListeners` | namespace not allowed by the listener | the label the Gateway selects |
        | Gateway has no address | its Service's external IP stays pending | no load-balancer implementation on the platform | a platform with one (cloud, MetalLB) |
        | `ingress` ClusterOperator Degraded, `GatewayAPIOSSMConflict` | `oc get clusteroperator ingress -o yaml` | Service Mesh 2.x subscription present (4.21 releases before 4.21.23, which installs Istio without a subscription) | remove the GatewayClass or the 2.x subscription |
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Editing the generated Route.** It belongs to the Ingress and is patched back.
        - **Leaving out the host.** OpenShift does not convert host-less Ingress rules.
        - **Expecting nginx annotations to work.** Only `route.openshift.io/*` and router annotations have meaning here.
        - **Assuming the Gateway API is just there.** It needs a GatewayClass created by a cluster administrator, and
          Gateways in `openshift-ingress`. The API kinds being present does not mean that anything serves them.
        - **`allowedRoutes: from: All` on a shared Gateway.** Any namespace could then claim any host name the listener
          accepts.
  review:
    - q: "What does OpenShift create from an Ingress, and who owns it?"
      a: "One Route per host and path, named after the Ingress with a random suffix, owned by the Ingress (controller: true) and reconciled from it."
    - q: "Which annotation chooses re-encrypt or passthrough for an Ingress on OpenShift?"
      a: "route.openshift.io/termination (edge, passthrough or reencrypt); without it, a TLS Ingress becomes an edge Route."
    - q: "Which Ingress rules are not converted to Routes, and where do you read why?"
      a: "Rules without a host, non-Service backends, pathType Exact, backends whose Service is missing, and a missing TLS Secret. The event IncompleteIngressToRouteRules records why: read it with oc get events."
    - q: "How is the Gateway API enabled on OpenShift 4.21?"
      a: "A cluster administrator creates a GatewayClass with controllerName openshift.io/gateway-controller/v1; the Ingress Operator then installs an Istio control plane in openshift-ingress."
    - q: "Where must a Gateway be created on OpenShift?"
      a: "In the openshift-ingress namespace."
    - q: "Which two status conditions tell you whether an HTTPRoute works?"
      a: "Accepted (the Gateway's listener took it) and ResolvedRefs (its backends exist and may be referenced), in status.parents."
  labs: [lab.request-path]
  limits: |
    Ingress conversion is recorded on OpenShift Local. The Gateway API was only read, not enabled. Creating the
    GatewayClass makes the Ingress Operator install a lightweight OpenShift Service Mesh 3 and an Istio control plane
    (`istiod-openshift-gateway`) in `openshift-ingress`, which pulls several images onto this cluster's single node;
    that node has about 1 GB of disk left before the kubelet evicts pods, and most of its memory is already requested.
    The 4.21 documentation says that removing the GatewayClass makes the Ingress Operator stop provisioning the
    Gateway API; it does not describe removing what was installed, so the change could not be shown to be fully
    reversible. Each Gateway would also need a load balancer, which OpenShift Local does not provide by default. So
    the GatewayClass, Gateway and an accepted HTTPRoute are documented examples from the OpenShift 4.21
    documentation.
  references:
    - {title: "OpenShift 4.21: Routes (creating a route through an Ingress object, label propagation, default certificate)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes"}
    - {title: "OpenShift 4.21: Configuring ingress cluster traffic (ingressWithoutClassName, Gateway API)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/configuring-ingress-cluster-traffic"}
    - {title: "OpenShift 4.19 release notes (Gateway API generally available)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/html/release_notes/ocp-4-19-release-notes"}
    - {title: "OKD 4.21: Gateway API (what the Ingress Operator installs, removing the GatewayClass, OSSM 2.x conflict)", url: "https://docs.okd.io/4.21/networking/ingress_load_balancing/configuring_ingress_cluster_traffic/ingress-gateway-api.html"}
    - {title: "OpenShift route-controller-manager (release-4.21): ingress-to-route controller", url: "https://github.com/openshift/route-controller-manager/blob/release-4.21/pkg/route/ingress/ingress.go"}
    - {title: "Kubernetes 1.34: Ingress", url: "https://v1-34.docs.kubernetes.io/docs/concepts/services-networking/ingress/"}
    - {title: "Kubernetes 1.34: Gateway API", url: "https://v1-34.docs.kubernetes.io/docs/concepts/services-networking/gateway/"}
    - {title: "Gateway API v1.3.0 source: route conditions and backendRef weight", url: "https://github.com/kubernetes-sigs/gateway-api/blob/v1.3.0/apis/v1/shared_types.go"}
    - {title: "OpenShift 4.21 release notes (4.21.23: Istio for the Gateway API installed through the Sail Library)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/release_notes/index"}
    - {title: "OpenShift 4.22 release notes (Gateway API resources, BackendTLSPolicy)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html-single/release_notes/index"}
  commands:
    - cmd: "oc apply -f web.yaml -f service.yaml; oc rollout status deployment/web --timeout=180s; oc create ingress frontend --class=openshift-default --rule=\"frontend-$(oc project -q).apps-crc.testing/*=web:8080\"; sleep 5; oc get ingress; oc get routes"
      as: developer
      meaning: "two web pods and their Service, then an Ingress, and the Route that the controller made from it"
      timeout: 240
    - cmd: "oc get routes -o name | head -n 1 | xargs oc get -o yaml | sed -n '/ownerReferences:/,/uid:/p; /^spec:/,/wildcardPolicy/p'"
      as: developer
      meaning: "the generated Route: owned by the Ingress, with host, path and port from the Ingress rule"
    - cmd: "r=$(oc get routes -o name); oc annotate $r haproxy.router.openshift.io/timeout=2m; sleep 10; echo \"timeout annotations on the Route after 10 seconds: $(oc get $r -o yaml | grep -c 'haproxy.router.openshift.io/timeout')\""
      as: developer
      meaning: "an annotation added to the generated Route disappears again"
      timeout: 240
    - cmd: "oc annotate ingress frontend haproxy.router.openshift.io/timeout=2m; sleep 5; oc get routes -o jsonpath='{.items[0].metadata.annotations}{\"\\n\"}'"
      as: developer
      meaning: "an annotation on the Ingress is copied to the Route and stays"
    - cmd: "oc create ingress nohost --class=openshift-default --rule=\"/*=web:8080\"; oc create ingress exact --class=openshift-default --rule=\"exact-$(oc project -q).apps-crc.testing/api=web:8080\"; sleep 8; oc get routes; oc describe ingress exact | tail -n 2"
      as: developer
      meaning: "two Ingresses that produce no Route"
    - cmd: "oc get events --field-selector reason=IncompleteIngressToRouteRules"
      as: developer
      meaning: "the events that say why the rules were skipped"
    - cmd: "oc create ingress secure --class=openshift-default --rule=\"secure-$(oc project -q).apps-crc.testing/*=web:8080,tls=shop-tls\"; sleep 8; oc get routes; oc get events --field-selector reason=IncompleteIngressToRouteRules | grep secure"
      as: developer
      meaning: "a TLS Ingress whose Secret does not exist: no Route, and an event"
    - cmd: "host=secure-$(oc project -q).apps-crc.testing; openssl req -x509 -newkey rsa:2048 -nodes -keyout tls.key -out tls.crt -days 2 -subj \"/CN=$host\" -addext \"subjectAltName=DNS:$host\" 2>/dev/null; oc create secret tls shop-tls --cert=tls.crt --key=tls.key; sleep 10; oc get routes; sleep 10; curl -sv --cacert tls.crt -o /dev/null https://$host/ 2>&1 | grep -E 'subject:|SSL certificate verify|< HTTP'; curl -s -o /dev/null -D - http://$host/ | grep -i -e '^HTTP' -e '^location'"
      as: developer
      meaning: "the Secret now exists: the Route appears, edge with plain HTTP redirected, and the router presents the Secret's certificate"
      timeout: 240
    - cmd: "oc api-resources | grep -i gateway"
      as: developer
      meaning: "the Gateway API kinds that this cluster serves"
    - cmd: "oc get gatewayclass"
      as: developer
      expect: fail
      meaning: "GatewayClass is cluster-scoped: an ordinary project user may not list it"
    - cmd: "oc get gatewayclasses,gateways -A"
      as: admin
      meaning: "the administrator's view: no GatewayClass and no Gateway on this cluster"
    - cmd: "oc get crd gatewayclasses.gateway.networking.k8s.io -o jsonpath='{.metadata.annotations.gateway\\.networking\\.k8s\\.io/bundle-version} {.metadata.annotations.gateway\\.networking\\.k8s\\.io/channel}{\"\\n\"}'; oc get validatingadmissionpolicy openshift-ingress-operator-gatewayapi-crd-admission -o jsonpath='{.spec.validations[0].message}{\"\\n\"}'"
      as: admin
      meaning: "the Gateway API version that the platform installed, and the policy that keeps its definitions as they are"
    - cmd: "oc apply -f httproute.yaml; sleep 5; oc get httproute; oc get httproute web -o jsonpath='status: {.status}{\"\\n\"}'"
      as: developer
      meaning: "an HTTPRoute is accepted by the API, but nothing reports on it: no controller serves it"
  files:
    web.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: web-content
      data:
        index.html: |
          hello from web
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - name: content
                mountPath: /var/www/html
            volumes:
            - name: content
              configMap:
                name: web-content
    service.yaml: |
      apiVersion: v1
      kind: Service
      metadata:
        name: web
      spec:
        selector:
          app: web
        ports:
        - name: http
          port: 8080
          targetPort: 8080
    httproute.yaml: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: web
      spec:
        parentRefs:
        - name: shared-gateway
          namespace: openshift-ingress
        hostnames: ["web.gwapi.apps.example.com"]
        rules:
        - matches:
          - path: {type: PathPrefix, value: /api}
          backendRefs:
          - {name: web, port: 8080, weight: 90}
          - {name: web-canary, port: 8080, weight: 10}
- id: o3.release-strategies
  title: "Blue/green and canary releases"
  subtitle: "Switch or split traffic with Services and Route weights"
  module: a6-images-updates
  mode: GUIDED_INVESTIGATION
  minutes: 40
  level: 2
  supports: "OpenShift 4.21 route.openshift.io/v1 (spec.to, spec.alternateBackends with weights) and the HAProxy-based default IngressController; oc 4.21 set route-backends and set selector. Recorded on OpenShift Local as an ordinary user, in a temporary project. Counts of requests vary from run to run; the recording shows one run."
  concepts: [deploy.strategies, net.routes, k8s.rollout]
  prerequisites: [g.rollouts-change, d.routes-tls]
  record_on: cluster
  objective: |
    Release a new version with a blue/green switch (by Service selector or by Route backend) or a weighted canary
    (Route alternateBackends), predict who receives which version, roll back completely, and choose between these
    and a rolling update.
  flow:
    - kind: teach
      id: situation
      title: "Controlling traffic, not pods"
      body: |
        A rolling update, as [Rollout strategies and change control](/lesson/g.rollouts-change) showed, replaces pods
        one by one, so for a while both versions serve requests, and you do not choose who gets the new one. If
        version 2 has a slow query, users meet it as soon as the first new pods are ready, and `oc rollout undo`
        is itself another rollout that takes time.

        Two techniques control **traffic** instead of pods:

        - **Blue/green**: run the new version (green) next to the current one (blue), test it, then move all
          traffic in one step, with an equally quick step back.
        - **Canary**: send a small share of requests to the new version first, watch it, and widen the share only
          while it behaves.

        On OpenShift both use objects you already know: Services, and Routes with weights.
    - kind: ask
      id: recall-rolling
      recalls: g.rollouts-change
      prompt: "A look back. During a rolling update, which versions of the application serve requests?"
      choices:
        - text: "Only the old one, until every new pod is ready"
          why: "A rolling update adds new pods while old ones still run, and a new pod serves requests as soon as it is ready. It does not wait for all of them."
        - text: "Only the new one, from the first new pod on"
          why: "Old pods are removed step by step, as new ones become ready. For a while, both versions run side by side."
        - text: "Both, for a while"
          why: "Old and new pods are ready at the same time during the rollout, and requests go to whichever pods are ready. You do not choose who gets which version."
      answer: 2
    - kind: teach
      id: controls
      title: "What a Deployment controls, and what it does not"
      body: |
        A Deployment's strategy decides how *pods* are replaced. Traffic follows whichever pods are ready behind the
        Service. To control traffic you need **two Deployments**, one per version, each running complete, and a
        traffic object that chooses between them:

        | Traffic object | Switch by | Affects |
        |---|---|---|
        | Service | changing its selector | everyone who calls the Service: the Route, and other pods in the cluster |
        | Route | changing `spec.to`, or the weights in `spec.alternateBackends` | only requests that arrive through that Route |

        These strategies never scale anything. Two versions cost two sets of pods, and when you shift traffic you may
        have to scale the Deployment that receives it.
    - kind: show
      id: service-yaml
      body: "The recording uses two Deployments, `web-blue` and `web-green`. Their pods carry the labels `app: web` and `version: blue` or `version: green`. The Service `web` starts out on blue:"
      code: |
        apiVersion: v1
        kind: Service
        metadata:
          name: web
        spec:
          selector:
            app: web
            version: blue
          ports:
          - name: http
            port: 8080
            targetPort: 8080
      caption: "the Service `web` in app.yaml"
      notice: "The selector has two keys. A Service selects the pods that carry all of them."
    - kind: ask
      id: which-pods
      prompt: "The Service `web` has the selector `app: web, version: blue`. Which of these pods does it select?"
      evidence: |
        pod of web-blue      app=web      version=blue
        pod of web-green     app=web      version=green
        pod of billing-blue  app=billing  version=blue
      choices:
        - text: "Only the pod of `web-blue`"
          why: "A selector matches the pods that carry every one of its labels. Only this pod has both `app=web` and `version=blue`."
        - text: "The pods of `web-blue` and `billing-blue`"
          why: "That would be the selector `version: blue` alone. With `app: web` too, the billing pod, which has `app=billing`, does not match."
        - text: "The pods of `web-blue` and `web-green`"
          why: "That would be the selector `app: web` alone. The second key, `version: blue`, excludes the green pod."
      answer: 0
    - kind: show
      id: setup
      body: "`app.yaml` holds a page for each version (`version blue`, `version green`), the two Deployments, and the Services `web` (blue), `web-blue` and `web-green`. Two Routes follow: `web` points at the Service `web`, and `shop` at `web-blue`."
      run: "oc apply -f app.yaml; oc rollout status deployment/web-blue --timeout=180s; oc rollout status deployment/web-green --timeout=180s; oc create route edge web --service=web --port=http; oc create route edge shop --service=web-blue --port=http; oc get pods; oc get services; oc get routes"
      notice: "One pod per version, three Services, two Routes. Both Routes lead to blue for now."
    - kind: teach
      id: blue-green-selector
      title: "Blue/green by switching a Service selector"
      body: |
        When every green pod is ready, you switch the Service:
        `oc set selector service web app=web,version=green`.

        `oc set selector` **overwrites** the whole selector, so you always write the complete new selector. A
        selector of only `version=green` would also match every other application's green pods in the project.
        Then you confirm what the Service points at: its EndpointSlice must list the green pods' addresses.

        Rolling back is the same command with `blue`, which is why blue stays running, untouched, until you are
        confident. The router needs a few seconds to pick up the change, so the recording waits before it asks.
    - kind: show
      id: switch-selector
      run: "host=$(oc get route web -o jsonpath='{.spec.host}'); sleep 10; echo before; curl -sk https://$host/; oc set selector service web app=web,version=green; sleep 10; echo after; curl -sk https://$host/; oc get endpointslices -l kubernetes.io/service-name=web; oc get pods -l version=green -o custom-columns=NAME:.metadata.name,IP:.status.podIP"
      highlight: ["before", "after", "version"]
      notice: |
        `before` the change the page says `version blue`, and after it, `version green`: same Route, same host name,
        and only the Service's selector changed. The Service's slice now lists a single address, and it is the IP of
        the green pod printed below it: the Service's endpoints are the green pods.
    - kind: try
      id: try-selector-back
      body: "Something is wrong with green. Switch the Service `web` back to blue, with the complete selector."
      accept: ["oc set selector service web app=web,version=blue", "oc set selector service web version=blue,app=web", "oc set selector service web 'app=web,version=blue'", "oc set selector service web \"app=web,version=blue\"", "oc set selector service web 'version=blue,app=web'", "oc set selector svc web app=web,version=blue", "oc set selector svc web version=blue,app=web", "oc set selector svc web 'app=web,version=blue'", "oc set selector svc web \"app=web,version=blue\"", "oc set selector svc web 'version=blue,app=web'", "oc set selector service/web app=web,version=blue", "oc set selector service/web version=blue,app=web", "oc set selector service/web 'app=web,version=blue'", "oc set selector service/web \"app=web,version=blue\"", "oc set selector service/web 'version=blue,app=web'", "oc set selector svc/web app=web,version=blue", "oc set selector svc/web version=blue,app=web", "oc set selector svc/web 'app=web,version=blue'", "oc set selector svc/web \"app=web,version=blue\"", "oc set selector svc/web 'version=blue,app=web'"]
      hints:
        - match: "^oc set selector (service|svc)[ /]web version=blue$"
          say: "That writes only one key, and `oc set selector` replaces the whole selector: `app=web` would be dropped. Write both keys: `app=web,version=blue`."
        - match: "version=green"
          say: "`green` is the version to leave. The Service has to select the blue pods again."
        - match: "^oc set selector (service|svc)[ /]web$"
          say: "Give the new selector after the Service's name, as `key=value` pairs separated by commas."
        - match: "^oc (patch|edit)"
          say: "Those can change a selector too, but `oc set selector` is the direct command, and it replaces the whole selector in one step."
        - match: "^oc set selector (deployment|deploy)"
          say: "A Deployment's selector cannot be changed. The Service is what switches traffic."
      hint: "`oc set selector service web`, then the two labels, `app=web` and `version=blue`, with a comma between them."
      run: "oc set selector service web app=web,version=blue; sleep 10; curl -sk https://$(oc get route web -o jsonpath='{.spec.host}')/"
      then: "Blue again: one command back, because the blue pods never stopped."
    - kind: show
      id: partial-selector
      body: "Why the complete selector matters: the recording sets only `version=blue`, prints the selector, then puts the complete one back:"
      run: "oc set selector service web version=blue; oc get service web -o jsonpath='selector: {.spec.selector}{\"\\n\"}'; oc set selector service web app=web,version=blue; oc get service web -o jsonpath='selector: {.spec.selector}{\"\\n\"}'"
      highlight: ["selector:"]
      notice: "After the partial command, the selector is only `{\"version\":\"blue\"}`: `app=web` was dropped, so the Service would also select any other pod labelled `version=blue` in the project. The complete command restores `{\"app\":\"web\",\"version\":\"blue\"}`."
    - kind: teach
      id: blue-green-route
      title: "Blue/green by switching the Route's backend"
      body: |
        The other way: each version has its own Service, `web-blue` and `web-green`, and the Route decides.
        `oc set route-backends shop web-green=100` replaces the Route's backends with exactly that list: the first
        becomes `spec.to`, and any alternate backends are removed. Without weights, the command prints the current
        backends. It does not scale anything.

        | | Service selector switch | Route backend switch |
        |---|---|---|
        | who moves | every caller of the Service, inside and outside the cluster | only traffic through that Route |
        | test green before the switch | needs its own Service or Route anyway | a preview Route to `web-green` |
        | internal callers of `web-blue` | not applicable (one Service) | keep reaching blue until you change them |
        | rollback | set the selector back | point `spec.to` back |
    - kind: ask
      id: guess-internal
      guess: true
      prompt: "The Route `shop` is switched from `web-blue` to `web-green`. A pod inside the cluster calls `http://web-blue:8080/`. Which version does it get?"
      choices:
        - text: "Green: the Route in front of it was switched"
          why: "The pod does not use the Route's host name, so the Route plays no part. The next step shows what it gets."
        - text: "Blue: it calls the Service directly"
          why: "A Route configures the router. A pod that calls a Service by name reaches that Service's endpoints directly, without passing the router. The next step shows it."
        - text: "Neither: the switch removed the Service's endpoints"
          why: "The Route switch changes no Service: `web-blue` still selects the blue pods. The next step shows what the pod gets."
      answer: 1
    - kind: show
      id: switch-route
      body: "`toolbox` is the pod that only waits, from [Services, EndpointSlices and DNS](/lesson/d.services-dns), here to call a Service from inside the cluster. It is created first, then the Route `shop` is switched."
      run: "oc create deployment toolbox --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/toolbox --timeout=180s; oc set route-backends shop; oc set route-backends shop web-green=100; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); echo \"through the Route:\"; curl -sk https://$host/; echo \"inside the cluster, calling web-blue:\"; oc exec deploy/toolbox -- curl -s http://web-blue:8080/"
      highlight: ["through the Route", "calling web-blue", "version"]
      notice: |
        `oc set route-backends shop` without weights printed the current backends: `web-blue`, weight 100. The next
        command replaced them with `web-green=100`, and through the Route the answer is now green. The pod
        `toolbox`, which calls the Service `web-blue` directly, still gets blue: the Route is not on its path. A
        Route switch moves only the traffic that enters through the Route.
    - kind: teach
      id: canary
      title: "Canary: split traffic with Route weights"
      body: |
        A Route can send traffic to up to **four** Services: `spec.to` plus up to three `spec.alternateBackends`. Each
        has a `weight` from 0 to 256, and 100 when you leave it out. A Service's share is its weight divided by the
        sum of the weights.

        `oc set route-backends shop web-blue=90 web-green=10` makes blue the primary backend with 90, and green an
        alternate with 10. The documentation recommends the `roundrobin` balance algorithm on a weighted Route, so
        that requests follow the weights, and the 4.21 router uses it by itself when more than one backend has a
        weight above 0. The recording sends 40 requests, from a client that keeps no cookies, and counts the
        answers.
    - kind: show
      id: canary-90
      run: "oc set route-backends shop web-blue=90 web-green=10; oc set route-backends shop; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 40); do curl -sk https://$host/; done | sort | uniq -c"
      highlight: ["90", "10", "version"]
      notice: |
        `oc set route-backends shop` printed the backends: `web-blue` 90 (90%) and `web-green` 10 (10%). Of the 40
        requests, 37 got blue and 3 got green. A share of 10% would be 4. The router chooses for each request, so a
        run lands near the weights and not exactly on them, and another run gives other counts.
    - kind: try
      id: try-canary-more
      body: "The canary looks healthy. Widen it: set the Route `shop` to 75% blue and 25% green."
      accept: ["oc set route-backends shop web-blue=75 web-green=25", "oc set route-backends route/shop web-blue=75 web-green=25", "oc set route-backends routes/shop web-blue=75 web-green=25"]
      hints:
        - match: "web-green=25 web-blue=75$"
          say: "The first Service listed becomes the Route's primary backend, `spec.to`. Keep blue, the stable version, first: `web-blue=75 web-green=25`."
        - match: "^oc set route-backends shop web-green=25$"
          say: "That would make green the only listed backend, with weight 25, and drop blue. List both Services, each with its weight."
        - match: "web-blue=25|web-green=75"
          say: "The weights are swapped: blue is the stable version with 75, and green is the canary with 25."
        - match: "%"
          say: "Without `--adjust`, weights are plain numbers, not percentages. 75 and 25 sum to 100, so they read as percentages."
        - match: "^oc (patch|edit)"
          say: "`oc patch` works, but `oc set route-backends` sets all the weights in one short command."
        - match: "^oc set route-backends shop$"
          say: "Without weights this only prints the current backends. Add the Services with their weights."
      hint: "`oc set route-backends shop`, then each Service with `=` and its weight."
      run: "oc set route-backends shop web-blue=75 web-green=25; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 40); do curl -sk https://$host/; done | sort | uniq -c"
      then: "Of the 40 requests, 31 got blue and 9 got green: close to 75% and 25%, and again not exact."
    - kind: teach
      id: stickiness
      title: "The sticky-session caveat"
      body: |
        For edge and re-encrypt Routes the router sets a **cookie** by default, and a client that sends it back keeps
        going to the same pod. Two consequences for releases. A 25% canary means about 25% of **new sessions**, not
        25% of requests: a client that already has a cookie stays where it is while you change the weights. And the
        counts above came from a `curl` that kept no cookie, so each request was a new session.

        A cookie jar makes `curl` behave like a browser: `-c` writes the cookies it receives to a file, and `-b` sends
        them back. Twenty requests from one such client:
    - kind: show
      id: sticky
      run: "host=$(oc get route shop -o jsonpath='{.spec.host}'); rm -f jar; for i in $(seq 1 20); do curl -sk -c jar -b jar https://$host/; done | sort | uniq -c; echo \"Set-Cookie headers in one response: $(curl -skI https://$host/ | grep -ic '^set-cookie')\""
      highlight: ["20", "Set-Cookie"]
      notice: |
        All 20 requests of this client went to the same version, `green` in this run, although the Route sends only a
        quarter of new sessions there. A fresh request gets a `Set-Cookie` header from the router (the second line
        counts one), and this `curl` sent the cookie back each time. The counts in the earlier steps came from clients that
        kept no cookie.
    - kind: teach
      id: weight-zero
      title: "A complete rollback"
      body: |
        Setting a canary's weight to 0 takes it out of load balancing, but the documentation says that a backend with
        weight 0 still serves its existing persistent connections. Clients that are pinned to a canary pod by their
        cookie can keep reaching it.

        To see it, we first look for a client that the router pins to green, using fresh cookie jars until one lands
        there. Then green gets weight 0 in the Route, and both that pinned client and new clients ask:
    - kind: show
      id: weight0
      run: "host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 50); do rm -f jar; curl -sk -c jar -b jar https://$host/ | grep -q green && break; done; oc set route-backends shop web-blue=100 web-green=0; sleep 10; echo \"the pinned client:\"; for i in 1 2 3 4 5; do curl -sk -c jar -b jar https://$host/; done | sort | uniq -c; echo \"new clients:\"; for i in $(seq 1 10); do curl -sk https://$host/; done | sort | uniq -c"
      highlight: ["pinned client", "new clients", "version"]
      notice: |
        With `web-green=0`, the new clients all got blue: 10 of 10. The pinned client, which still sent its cookie, got
        green 5 times out of 5. Weight 0 stopped new sessions from reaching green, and left the existing session
        where it was.
    - kind: try
      id: try-remove-canary
      body: "A complete rollback has two steps. First remove the canary from the Route: leave `web-blue` as its only backend, at 100."
      accept: ["oc set route-backends shop web-blue=100", "oc set route-backends route/shop web-blue=100", "oc set route-backends routes/shop web-blue=100"]
      hints:
        - match: "web-green=0"
          say: "That is the weight-0 case from above: green stays in the Route and still serves pinned clients. List only `web-blue`."
        - match: "^oc set route-backends shop$"
          say: "Without weights this only prints the current backends. Name the Service you keep, with its weight."
        - match: "web-blue=[0-9]{1,2}$"
          say: "A single backend is the whole traffic, at any weight, but 100 is the clear way to write it."
        - match: "^oc (delete|scale)"
          say: "Scaling green to zero is the second step. First the Route has to stop naming green."
      hint: "`oc set route-backends shop`, then only the Service that stays: `web-blue=100`."
      run: "oc set route-backends shop web-blue=100; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); echo \"the pinned client:\"; for i in 1 2 3 4 5; do curl -sk -c jar -b jar https://$host/; done | sort | uniq -c; oc get route shop -o jsonpath='{.spec.to.name} {.spec.alternateBackends}{\"\\n\"}'"
      then: |
        The pinned client now gets blue. Green is no longer one of the Route's backends, so the cookie that pointed
        there no longer holds the client on it, and the router picks among the listed backends. `spec.alternateBackends` is empty and `spec.to` is `web-blue`. The second
        step of a complete rollback is to scale the green Deployment to zero, so that no green pod is left to serve
        anyone.
    - kind: teach
      id: per-service-weights
      title: "Weights belong to Services, not to pods"
      body: |
        A Service's weight is divided among its endpoints, so each pod carries its share. The documentation adds that,
        when a Service's weight is not 0, each endpoint has a minimum weight of 1. More pods behind a Service
        therefore do not mean more traffic for it. The minimum matters only at very small weights, where a canary with
        many pods ends up with a larger share than its weight says.

        `web-green` is scaled to three pods, and the Route is set to 50 and 50, so blue has one pod and green has
        three:
    - kind: ask
      id: guess-per-pod
      guess: true
      prompt: "Blue has one pod and green has three, and the Route gives each Service weight 50. Which version gets more of the 60 requests?"
      choices:
        - text: "Green: it has three pods"
          why: "Weights are per Service. Green's 50 is shared among its three pods, so each pod gets about a third of that. The next step shows the counts."
        - text: "Blue: its single pod has the whole weight"
          why: "The weight of 50 belongs to the Service, not to the pod. Green is not penalised for having more pods. The next step shows the counts."
        - text: "Neither: about half each"
          why: "Each Service gets its weight's share, 50%, whatever the number of pods behind it. The next step shows the counts."
      answer: 2
    - kind: show
      id: per-pod
      run: "oc scale deployment web-green --replicas=3; oc rollout status deployment/web-green --timeout=180s; oc set route-backends shop web-blue=50 web-green=50; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 60); do curl -sk https://$host/; done | sort | uniq -c; oc get pods -l app=web"
      highlight: ["version"]
      notice: |
        Blue has one pod and green has three, and the 60 requests split 31 to blue and 29 to green: about half each.
        The weight belongs to the Service, and each green pod carries a third of it.
    - kind: teach
      id: readiness
      title: "Readiness is the safety net, not the test"
      body: |
        Every switch in this lesson sends traffic only to **ready** endpoints. That is a safety net, with two sides.
        Switch a Route to a Service that has no ready pod, and users get a 503, because the router has nothing to send
        to. Check the endpoints before the switch, never after.

        And readiness only answers "can this pod take requests?". A canary that returns errors for one feature, or is
        twice as slow, passes its readiness probe and gets its full share. A canary is useful only if you **measure
        it separately**: error rate and latency per version, compared with stable over the same minutes. Both
        versions run at once, so both must work with the same data: whatever version 2 writes, version 1 must still
        read.
    - kind: ask
      id: guess-no-ready
      guess: true
      prompt: "`web-green` has no pod. You switch the Route with `oc set route-backends shop web-green=100`. What do users get?"
      choices:
        - text: "503, the router's \"Application is not available\""
          why: "The router has no endpoint for its only backend, and it has no rule to fall back to the previous one. The next step shows the status."
        - text: "Blue keeps answering, as a fallback"
          why: "A Route has no fallback: it sends to the backends it lists. Blue is no longer listed. The next step shows the status."
        - text: "The switch is refused until green has pods"
          why: "The API accepts the change without checking endpoints. The next step shows what users get."
      answer: 0
    - kind: show
      id: no-ready
      run: "oc scale deployment web-green --replicas=0; sleep 5; oc set route-backends shop web-green=100; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); curl -sk -o /dev/null -w 'HTTP %{http_code}\\n' https://$host/; oc get endpointslices -l kubernetes.io/service-name=web-green; oc set route-backends shop web-blue=100"
      highlight: ["HTTP 503", "<unset>"]
      notice: |
        HTTP 503. The Route's only backend has no endpoint, and the slice of `web-green` shows `<unset>`. Nothing fell
        back to blue. The last command put the Route back on `web-blue`.
    - kind: teach
      id: choosing
      title: "Choosing a release strategy"
      body: |
        | Strategy | Versions mixed? | Rollback | Needs |
        |---|---|---|---|
        | RollingUpdate | yes, briefly | another rollout | readiness, N-1 compatibility |
        | Recreate | no | another rollout, with downtime | a maintenance window |
        | blue/green by selector | no | change the selector back | a full second Deployment; internal callers move too |
        | blue/green by Route | no, for Route traffic | point the Route back | a full second Deployment, two Services |
        | canary with weights | yes, controlled | remove the backend, scale to zero | metrics per version; cookies understood |
        | Argo Rollouts | as configured | automated on failed analysis | the add-on in Red Hat OpenShift GitOps |

        Rolling updates suit routine changes. Blue/green suits a release that must be all-or-nothing, with an instant way
        back. A canary suits a risky release that you can measure. A schema change that the old version cannot read
        needs a plan for the data first, whatever the strategy.
    - kind: ask
      id: canary-errors
      prompt: "A canary's pods pass their readiness probe, but its error rate on the checkout page is three times stable's. What do you conclude?"
      choices:
        - text: "Ready pods are working, so the errors come from clients"
          why: "Readiness means \"can take requests\", not \"answers correctly\". A canary is judged by its own error rate against stable's."
        - text: "The canary has a defect that readiness cannot see"
          why: "That is what a canary is for. Remove it from the Route, keep stable serving, then investigate."
        - text: "Raise the canary's weight to get more data"
          why: "More traffic to a version that measurably fails means more failed users. The data already says no."
      answer: 1
    - kind: reflect
      id: explain-canary
      prompt: "Your manager asks why the team wants canary releases on top of rolling updates, and what could make a canary misleading. Explain it without jargon."
      model: |
        Today we replace the servers of an application a few at a time, so for a while some users get the new version
        and some the old, but we do not decide who. With a canary we decide: first a few percent of new visitors, and
        only if their error rate and response times look as good as everyone else's do we widen it. That needs
        measurement per version; without it a canary only delays problems. Two caveats: visitors stay on the version
        they first reached because of a session cookie, so the share applies to new sessions, and an emergency rollback
        must remove the new version completely; and since both versions run at once, they must both work with the same
        data.
    - kind: teach
      id: territory-end
      title: "The end of Application operations"
      body: |
        This lesson ends the Application operations territory. Across it you deployed, exposed, configured,
        stored, scaled, updated and repaired applications with `oc`, and read each problem from its evidence before
        changing anything.

        The application challenges check that you can do it without instructions: [Ship a web
        app](/lab/ch.ship-web-app), [Recover and scale an API](/lab/ch.recover-and-scale),
        [Right-size two workloads](/lab/ch.right-size), [Keep a slow starter alive](/lab/ch.slow-start) and
        [Take configuration out of the spec](/lab/ch.config-out-of-spec). Each is graded by what the cluster really
        contains, so it counts only when you solve it on a cluster you connect. Without one you can plan a solution
        and compare it with the recorded reference, and nothing is marked as solved.

        The next territory, Platform administration, starts with [Check a cluster's
        health](/lesson/n.cluster-admin-health): the same habit of evidence first, applied to the whole cluster.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can release a new version by switching a Service selector or a Route backend, and say who each switch
        moves: every caller of the Service, or only the traffic through the Route. You can split traffic with
        weights, count what each version received, and explain why a canary's share applies to new sessions and why
        weights belong to Services, not pods. You can roll back completely, in two steps, and you know why readiness
        protects you from an empty backend but not from a defective one.

        Release strategies pair with the probes of [Health probes](/lesson/b.health-probes), and with GitOps
        ([GitOps with Argo CD](/lesson/gx.argocd), in the enterprise territory), which can automate the steps you
        did by hand here.
  sections:
    - id: route-weight-details
      title: "Weights, algorithms and cookies in detail"
      depth: true
      body: |
        - **Algorithm.** The documentation recommends the `roundrobin` balance annotation
          (`haproxy.router.openshift.io/balance: roundrobin`) on a weighted Route. The default for non-passthrough Routes
          is `random`; the 4.21 router already switches to roundrobin when a Route has more than one backend with a
          non-zero weight, and setting the annotation makes it explicit.
        - **Minimum weight.** With stable at weight 99 on 2 pods and a canary at weight 1 on 10 pods, each stable pod
          weighs 256 after scaling and each canary pod is raised from about 0.5 to 1: the canary gets about 2%
          instead of 1%. Keep the canary's pod count small.
        - **Per-request splits.** For stateless APIs where you want the split per request, the annotation
          `haproxy.router.openshift.io/disable_cookies: "true"` makes the router choose a backend for every request.
          Passthrough Routes cannot use cookies at all: the router hashes the client's source address, and behind a
          load balancer that hides it, all clients look the same.
        - **`oc set route-backends`.** `--adjust` changes one backend's weight, `--equal` gives every backend 100, and
          `--zero` sets every weight to 0, after which all requests return 503.
    - id: what-goes-wrong
      title: "What goes wrong, and how to see it"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | 503 right after a blue/green switch | `oc get endpointslices -l kubernetes.io/service-name=<svc>` empty or not ready | selector typo, or green not ready yet | set the selector back; switch only when green's endpoints are ready |
        | canary gets far more than its weight | many canary pods compared with stable | each endpoint has a minimum weight of 1 | fewer canary pods, or adjust the weights |
        | split differs from the weights | the Route or the IngressController sets a non-roundrobin `balance`, or cookies pin sessions | the algorithm or stickiness overrides the per-request split | `haproxy.router.openshift.io/balance: roundrobin`; `disable_cookies` for per-request splits |
        | some users still on the canary after weight 0 | they hold the router's cookie | weight 0 still serves persistent connections | remove the backend and scale the canary to zero |
        | internal callers still on blue after the switch | they call `web-blue` directly | only the Route was switched | change their configuration, or switch by selector |
        | errors only for some users, canary pods ready | error rate by version label | a functional bug that readiness cannot see | roll back the canary; add a check for it |
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Deleting blue right after the switch.** Rollback is only instant while blue is still running and ready.
        - **Writing a partial selector.** `oc set selector` replaces the whole selector; a selector of only
          `version=green` also matches other applications' green pods in the project.
        - **Judging a canary by its readiness.** Readiness says "accepts requests", not "answers correctly".
        - **Forgetting the cost.** Blue/green doubles the pods of an application for the duration of the release; check
          the project's quota before you start.
        - **Expecting Route weights to affect internal traffic.** Calls from other pods to a Service name go straight to
          that Service's endpoints; only requests addressed to the Route's host name pass through the router.
  review:
    - q: "How many Services can one Route send traffic to, and with which weights?"
      a: "Up to four: spec.to plus up to three alternateBackends, each with a weight from 0 to 256 (default 100)."
    - q: "What does `oc set route-backends shop web-blue=90 web-green=10` do?"
      a: "Sets web-blue as the primary backend (spec.to) with weight 90 and web-green as the first alternate with weight 10, replacing the Route's previous backends."
    - q: "Why does a canary with a weight of 25 get about 25% of new sessions, not of requests?"
      a: "The router sets a cookie on edge and re-encrypt Routes, and a client that sends it back keeps going to the same pod, so the weights decide only where new sessions start."
    - q: "What does weight 0 do to a backend?"
      a: "It no longer takes part in load balancing, but it keeps serving existing persistent connections (clients pinned by the router's cookie). A full rollback removes the backend and scales the canary to zero."
    - q: "What is the difference between a blue/green switch by Service selector and by Route?"
      a: "A selector switch moves every caller of the Service, including other pods; a Route switch moves only traffic that enters through that Route."
    - q: "What does `oc set selector` do to the existing selector?"
      a: "It overwrites it completely, so you must write the full new selector."
    - q: "Does a Service with more pods get more of the Route's traffic?"
      a: "No. The weight belongs to the Service and is divided among its pods; each pod has a minimum weight of 1, which matters only at very small weights."
  labs: [lab.probes-endpoints]
  limits: |
    The switches, weights and cookie behaviour are recorded on OpenShift Local. The minimum weight of one per endpoint
    and the algorithm defaults come from the OpenShift 4.21 documentation and the 4.21 router's HAProxy template; they are not visible
    from outside the router. Readiness and endpoints are practised in the probes lab.
  references:
    - {title: "OpenShift 4.21: Deployments (route-based deployment strategies, blue-green, A/B, oc set route-backends)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/deployments"}
    - {title: "OpenShift 4.21: Routes (cookies, route-specific annotations)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/ingress_and_load_balancing/routes"}
    - {title: "OpenShift 4.21 API: Route [route.openshift.io/v1] (alternateBackends)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_apis/route-route-openshift-io-v1"}
    - {title: "oc source (release-4.21): oc set route-backends", url: "https://github.com/openshift/oc/blob/release-4.21/pkg/cli/set/routebackends.go"}
    - {title: "Router source (release-4.21): HAProxy configuration template (balance)", url: "https://github.com/openshift/router/blob/release-4.21/images/router/haproxy/conf/haproxy-config.template"}
    - {title: "Kubernetes 1.34: Service", url: "https://v1-34.docs.kubernetes.io/docs/concepts/services-networking/service/"}
  commands:
    - cmd: "oc apply -f app.yaml; oc rollout status deployment/web-blue --timeout=180s; oc rollout status deployment/web-green --timeout=180s; oc create route edge web --service=web --port=http; oc create route edge shop --service=web-blue --port=http; oc get pods; oc get services; oc get routes"
      meaning: "two versions, three Services and two Routes, all leading to blue"
      timeout: 240
    - cmd: "host=$(oc get route web -o jsonpath='{.spec.host}'); sleep 10; echo before; curl -sk https://$host/; oc set selector service web app=web,version=green; sleep 10; echo after; curl -sk https://$host/; oc get endpointslices -l kubernetes.io/service-name=web; oc get pods -l version=green -o custom-columns=NAME:.metadata.name,IP:.status.podIP"
      meaning: "a blue/green switch by Service selector: the page changes, and the slice lists the green pod's address"
    - cmd: "oc set selector service web app=web,version=blue; sleep 10; curl -sk https://$(oc get route web -o jsonpath='{.spec.host}')/"
      meaning: "the selector switched back to blue"
    - cmd: "oc set selector service web version=blue; oc get service web -o jsonpath='selector: {.spec.selector}{\"\\n\"}'; oc set selector service web app=web,version=blue; oc get service web -o jsonpath='selector: {.spec.selector}{\"\\n\"}'"
      meaning: "oc set selector replaces the whole selector: a partial selector drops the other keys"
    - cmd: "oc create deployment toolbox --image=registry.access.redhat.com/ubi9/ubi-minimal:latest -- sleep infinity; oc rollout status deployment/toolbox --timeout=180s; oc set route-backends shop; oc set route-backends shop web-green=100; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); echo \"through the Route:\"; curl -sk https://$host/; echo \"inside the cluster, calling web-blue:\"; oc exec deploy/toolbox -- curl -s http://web-blue:8080/"
      meaning: "a blue/green switch by Route backend: the Route serves green, a pod calling web-blue still gets blue"
      timeout: 240
    - cmd: "oc set route-backends shop web-blue=90 web-green=10; oc set route-backends shop; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 40); do curl -sk https://$host/; done | sort | uniq -c"
      meaning: "a 90/10 canary: 40 requests from a client without cookies"
      timeout: 240
    - cmd: "oc set route-backends shop web-blue=75 web-green=25; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 40); do curl -sk https://$host/; done | sort | uniq -c"
      meaning: "a 75/25 canary: 40 requests from a client without cookies"
      timeout: 240
    - cmd: "host=$(oc get route shop -o jsonpath='{.spec.host}'); rm -f jar; for i in $(seq 1 20); do curl -sk -c jar -b jar https://$host/; done | sort | uniq -c; echo \"Set-Cookie headers in one response: $(curl -skI https://$host/ | grep -ic '^set-cookie')\""
      meaning: "a client that keeps its cookie stays on one version"
    - cmd: "host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 50); do rm -f jar; curl -sk -c jar -b jar https://$host/ | grep -q green && break; done; oc set route-backends shop web-blue=100 web-green=0; sleep 10; echo \"the pinned client:\"; for i in 1 2 3 4 5; do curl -sk -c jar -b jar https://$host/; done | sort | uniq -c; echo \"new clients:\"; for i in $(seq 1 10); do curl -sk https://$host/; done | sort | uniq -c"
      meaning: "weight 0: new clients get blue, but a client pinned to green still gets green"
      timeout: 240
    - cmd: "oc set route-backends shop web-blue=100; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); echo \"the pinned client:\"; for i in 1 2 3 4 5; do curl -sk -c jar -b jar https://$host/; done | sort | uniq -c; oc get route shop -o jsonpath='{.spec.to.name} {.spec.alternateBackends}{\"\\n\"}'"
      meaning: "green removed from the Route: the pinned client moves to blue"
      timeout: 240
    - cmd: "oc scale deployment web-green --replicas=3; oc rollout status deployment/web-green --timeout=180s; oc set route-backends shop web-blue=50 web-green=50; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); for i in $(seq 1 60); do curl -sk https://$host/; done | sort | uniq -c; oc get pods -l app=web"
      meaning: "weights belong to Services: one blue pod and three green pods still split 50/50"
      timeout: 300
    - cmd: "oc scale deployment web-green --replicas=0; sleep 5; oc set route-backends shop web-green=100; sleep 10; host=$(oc get route shop -o jsonpath='{.spec.host}'); curl -sk -o /dev/null -w 'HTTP %{http_code}\\n' https://$host/; oc get endpointslices -l kubernetes.io/service-name=web-green; oc set route-backends shop web-blue=100"
      meaning: "a Route switched to a Service with no ready pod answers 503; the Route is set back at the end"
      timeout: 240
  files:
    app.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: page-blue
      data:
        index.html: |
          version blue
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: page-green
      data:
        index.html: |
          version green
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-blue
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: web
            version: blue
        template:
          metadata:
            labels:
              app: web
              version: blue
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - name: page
                mountPath: /var/www/html
            volumes:
            - name: page
              configMap:
                name: page-blue
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-green
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: web
            version: green
        template:
          metadata:
            labels:
              app: web
              version: green
          spec:
            containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
              - containerPort: 8080
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
              - name: page
                mountPath: /var/www/html
            volumes:
            - name: page
              configMap:
                name: page-green
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: web
      spec:
        selector:
          app: web
          version: blue
        ports:
        - name: http
          port: 8080
          targetPort: 8080
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: web-blue
      spec:
        selector:
          app: web
          version: blue
        ports:
        - name: http
          port: 8080
          targetPort: 8080
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: web-green
      spec:
        selector:
          app: web
          version: green
        ports:
        - name: http
          port: 8080
          targetPort: 8080
- id: o3.support-data
  title: "Collect support data"
  subtitle: "oc adm inspect, must-gather, node logs and sosreport"
  module: a3-troubleshoot
  mode: GUIDED_INVESTIGATION
  minutes: 35
  level: 2
  supports: "oc 4.21 (help recorded with oc 4.21.8); OpenShift 4.21 support tooling: oc adm inspect, oc adm must-gather (cluster-admin), oc adm node-logs (nodes/log), sos report from a debug pod on an RHCOS node. Recorded on OpenShift Local 4.21: oc adm inspect of named objects and of a whole project, and the search for a leaked password, by the ordinary user developer in a temporary project; oc adm inspect of a cluster operator and oc adm node-logs by the cluster administrator kubeadmin. must-gather and sosreport were not run (they pull large images onto a node with little free disk) and are described from the documentation."
  concepts: [container.debugging, obs.incident, obs.signals]
  prerequisites: [o1.troubleshooting]
  record_on: cluster-admin
  objective: |
    Choose the right collector for the scope and the permissions you have, capture a project's state with
    `oc adm inspect` before evidence disappears, know what must-gather, node logs and a sosreport contain and who may
    run them, and check an archive for secrets before you share it.
  flow:
    - kind: teach
      id: situation
      title: "Evidence disappears"
      body: |
        Evidence on a cluster is short-lived. Events are kept for a limited time: three hours by default on OpenShift,
        and less where an administrator shortened it (the API server's `eventTTLMinutes`, 5 to 180 minutes, generally
        available since 4.21.12). `oc logs --previous` holds only the last crashed attempt. A pod that is deleted takes its logs with it. And the
        person who can solve the problem, a colleague on the platform team or a vendor's support engineer, often
        looks at it hours later, without access to your cluster.

        So the first move in a serious incident is to **take a snapshot**, and the second is to make sure that
        the snapshot does not leak passwords when you hand it over. This lesson uses an application, `shop`, that
        crashes on start and prints its connection string, and follows it through both moves.
    - kind: ask
      id: recall-previous
      recalls: o1.troubleshooting
      prompt: "A look back. A program started, crashed, and the container restarted. Where do you read what it printed before the crash?"
      choices:
        - text: "`oc logs --previous`, for the attempt before"
          why: "`oc logs` shows the current attempt. `--previous` reads the one that crashed, as long as the cluster still has it."
        - text: "`oc describe pod`: its events hold the program's output"
          why: "Events record what the cluster did, such as pulling an image or restarting a container. What the program printed is in its logs."
        - text: "`oc logs`, which always shows the last crash"
          why: "Without `--previous`, `oc logs` reads the current container, which after a restart is the new one and may have printed nothing yet."
      answer: 0
    - kind: show
      id: shop-crash
      body: "`shop` comes from the lesson's source file `shop.yaml`: a ConfigMap `shop-settings` and an `env` value of the Deployment, both holding the same fake password, and a container that only prints what a failing application might (a connection string with the password, then `error: connection refused`) and exits with status 1. No database exists and nothing tries to connect: the script stands in for an application that cannot reach its database."
      run: "oc apply -f shop.yaml; sleep 30; oc get pods -l app=shop; oc logs deploy/shop"
      highlight: ["connecting to", "error:"]
      notice: |
        `shop` crashes at start: its pod is in `Error` with two restarts already (between attempts it shows
        `CrashLoopBackOff`). `oc logs` shows what it printed before it exited: its connection string **with the password in it**, then the refusal message. A real application that logs its connection string on failure leaks the same way. A
        ConfigMap and an `env` value of the Deployment hold the same password. Remember that line.
    - kind: ask
      id: guess-deleted
      guess: true
      prompt: "You delete the crashing pod, and the Deployment replaces it. Can you still read the old pod's logs?"
      choices:
        - text: "Yes: the cluster keeps the logs of deleted pods"
          why: "The logs of a container live with its pod, on the node. When the pod object is deleted, they go. The next step shows the error."
        - text: "Yes, with `oc logs --previous`"
          why: "`--previous` reads an earlier attempt of a container that still exists in a pod that still exists. It cannot read a pod that is gone. The next step shows the error."
        - text: "No: they went with the pod"
          why: "A log belongs to a container of a pod. Delete the pod and the log is no longer reachable through the API. The next step shows it."
      answer: 2
    - kind: show
      id: deleted-pod
      run: "p=$(oc get pod -l app=shop -o name | head -n 1); oc delete $p; oc logs $p"
      notice: "The pod is deleted, and asking for its log fails with `NotFound`. A restart, a rollback or a deletion can erase the one piece of evidence that mattered. Collect first, then fix."
    - kind: teach
      id: scopes
      title: "Four tools, four scopes"
      body: |
        OpenShift gives you a collector for each scope. The skill is choosing the one that answers the question with the
        permissions you actually have:

        | Tool | Scope | Who may run it | Result |
        |---|---|---|---|
        | `oc adm inspect` | the resources you name: a project, a Deployment | anyone, with **their own** permissions | a directory on your machine |
        | `oc adm must-gather` | the whole cluster, or what a product's image collects | cluster-admin | a directory made by a pod on a control plane node |
        | `oc adm node-logs` | one or more nodes' journals and `/var/log` | users allowed to read `nodes/log` | text on your terminal |
        | `sos report` | one node's operating system | cluster-admin, through a debug pod | an archive made on the node |

        Application teams live in the first row. The other three are platform work: they need cluster-level rights and
        collect data about everyone's workloads.
    - kind: ask
      id: which-tool
      prompt: "You administer the project `shop` only and have no cluster role. You run `oc adm must-gather` to help support. What happens?"
      choices:
        - text: "It collects everything, because `oc adm` runs with elevated rights"
          why: "`oc adm` is only a group of administrative commands. It grants nothing: your own permissions decide what works."
        - text: "It is refused: it needs cluster-admin, so use `oc adm inspect`"
          why: "must-gather creates a project and a gather pod on a control plane node, which needs cluster-admin. `oc adm inspect` works within your own permissions."
        - text: "It collects only the project `shop`, the part you may see"
          why: "must-gather does not scale itself down to your rights; it fails to start. Limiting itself to what you can read is what `oc adm inspect` does."
      answer: 1
    - kind: teach
      id: inspect
      title: "oc adm inspect: a snapshot of what you can read"
      body: |
        `oc adm inspect <resources> --dest-dir=<directory>` downloads the objects you name, and writes them as files in a
        directory on your machine. It reads **as you**: it uses your token, so it can collect only what your permissions
        allow, and for an object you may not read it stops with the same Forbidden error as `oc get`. That is the
        safety of this tool: it can never collect more than you could already read yourself.

        First an object that a project user cannot read, a cluster operator:
    - kind: show
      id: inspect-denied
      run: "oc adm inspect clusteroperator/dns --dest-dir=inspect-denied"
      notice: "Forbidden, as for `oc get`: the user `developer` may not read `clusteroperators` at the cluster scope, and the command stops with that error. This is a job for the platform team."
    - kind: show
      id: inspect-admin
      body: "The platform team's view: the cluster administrator runs the same command. For a cluster operator, inspect also follows the objects that the operator lists as related, its namespaces among them, and collects those with their pods' logs. The output goes to a log file; the command then shows its last line, the size of the result, the namespaces it holds and the number of log files:"
      run: "oc adm inspect clusteroperator/dns --dest-dir=inspect-dns > inspect-dns.log 2>&1; tail -n 1 inspect-dns.log; du -sh inspect-dns; ls inspect-dns/namespaces; find inspect-dns -name '*.log' | wc -l"
      notice: |
        `Wrote inspect data to inspect-dns.`: 2.2 MB, with the two namespaces that the operator names as related,
        `openshift-dns` and `openshift-dns-operator`, and 15 container log files from their pods. The command refused
        to `developer` a moment ago needed nothing else: only the identity differs.
      understand:
        purpose: Collects the DNS operator's data as the administrator, keeps the command's own messages in a log file,
          then summarises what was written.
        parts:
          - text: '> inspect-dns.log 2>&1'
            means: 'Sends the output to the file, then the errors to the same place. The order matters: `2>&1` copies
              wherever stream 1 points at that moment.'
          - text: tail -n 1
            means: Prints the last line of the log.
          - text: du -sh
            means: The total disk space the directory uses (`-s`, one total), in readable units (`-h`).
          - text: find inspect-dns -name '*.log' | wc -l
            means: 'Counts the paths whose names end in `.log`: here, the log files. The quotes keep your shell from expanding
              `*.log` itself.'
        caution: 'The directory holds copies of cluster objects and pod logs. The next part of this lesson shows what
          those can contain: treat the directory as sensitive before you share it.'
        concepts:
          - obs.incident
          - obs.signals
        refs:
          - title: 'OpenShift 4.21: Gathering data about your cluster'
            url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/gathering-cluster-data
          - title: 'Bash manual: Redirections (order)'
            url: https://www.gnu.org/software/bash/manual/html_node/Redirections.html
    - kind: try
      id: try-inspect
      body: "Now what you may read. Collect the Deployment `shop` and the ConfigMap `shop-settings` into a directory called `inspect-shop`."
      accept: ["oc adm inspect deployment/shop configmap/shop-settings --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop deployment/shop configmap/shop-settings", "oc adm inspect deployment/shop configmap/shop-settings --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop deployment/shop configmap/shop-settings", "oc adm inspect configmap/shop-settings deployment/shop --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop configmap/shop-settings deployment/shop", "oc adm inspect configmap/shop-settings deployment/shop --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop configmap/shop-settings deployment/shop", "oc adm inspect deployment/shop cm/shop-settings --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop deployment/shop cm/shop-settings", "oc adm inspect deployment/shop cm/shop-settings --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop deployment/shop cm/shop-settings", "oc adm inspect cm/shop-settings deployment/shop --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop cm/shop-settings deployment/shop", "oc adm inspect cm/shop-settings deployment/shop --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop cm/shop-settings deployment/shop", "oc adm inspect deploy/shop configmap/shop-settings --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop deploy/shop configmap/shop-settings", "oc adm inspect deploy/shop configmap/shop-settings --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop deploy/shop configmap/shop-settings", "oc adm inspect configmap/shop-settings deploy/shop --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop configmap/shop-settings deploy/shop", "oc adm inspect configmap/shop-settings deploy/shop --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop configmap/shop-settings deploy/shop", "oc adm inspect deploy/shop cm/shop-settings --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop deploy/shop cm/shop-settings", "oc adm inspect deploy/shop cm/shop-settings --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop deploy/shop cm/shop-settings", "oc adm inspect cm/shop-settings deploy/shop --dest-dir=inspect-shop", "oc adm inspect --dest-dir=inspect-shop cm/shop-settings deploy/shop", "oc adm inspect cm/shop-settings deploy/shop --dest-dir inspect-shop", "oc adm inspect --dest-dir inspect-shop cm/shop-settings deploy/shop"]
      hints:
        - match: "^oc inspect"
          say: "`inspect` is a subcommand of `oc adm`: `oc adm inspect`."
        - match: "^oc adm inspect (deployment|deploy)/shop$|^oc adm inspect (configmap|cm)/shop-settings$"
          say: "Name both objects, the Deployment and the ConfigMap, and the directory with `--dest-dir=inspect-shop`."
        - match: "^oc adm inspect (?!.*--dest-dir)"
          say: "Without `--dest-dir`, the data goes to a directory with a random name, `inspect.local.<random>`. Name the directory `inspect-shop`, so that you can find it."
        - match: "^oc adm inspect (deployment|configmap) (shop|shop-settings)"
          say: "An object is named as `<kind>/<name>`, with a slash: `deployment/shop`."
        - match: "^oc (get|describe|export)"
          say: "Those print on your terminal. `oc adm inspect` writes files that you can keep and send."
      hint: "`oc adm inspect`, the two objects as `<kind>/<name>`, and `--dest-dir=inspect-shop`."
      run: "oc adm inspect deployment/shop configmap/shop-settings --dest-dir=inspect-shop; find inspect-shop -type f | sort"
      then: |
        The first line says where the data went, and the other lines are the files. The directory is organised like the
        API: under `namespaces/<project>`, a directory for each API group (`apps`, `core`) holds the Deployment and the
        ConfigMap. The rest is two discovery files of the cluster's API (`aggregated-discovery-api.yaml` and
        `aggregated-discovery-apis.yaml`), a page `event-filter.html` for browsing events, and a `timestamp`.
    - kind: teach
      id: inspect-namespace
      title: "The namespace form, and what it hides"
      body: |
        For a whole project, `oc adm inspect ns/<project>` follows the same rules. According to the oc 4.21 source, it
        collects the Namespace object, the workloads (pods, Services, Deployments and the rest of the `all` category),
        ConfigMaps, events, endpoints and EndpointSlices, NetworkPolicies, PersistentVolumeClaims, Secrets and a few
        others. For every pod it saves each container's current log and, when there is one, the previous log, init
        containers included. `--since` limits the logs to a recent window. Where the project's permissions fall short,
        it collects what it can and reports the rest in one error list at the end.

        It also **elides Secrets**: every value is replaced by its length, except the public certificates `tls.crt`,
        `ca.crt` and `service-ca.crt`. A Route's TLS key is emptied. To see it, the recording project gets a Secret
        `db` holding the same fake password, and then a whole-project inspect.
    - kind: show
      id: secret-sample
      body: "The command prints the last line of inspect's output, then the Secret's `password` line as inspect wrote it, then that value decoded:"
      run: "oc create secret generic db --from-literal=password=example-not-a-real-password; oc adm inspect ns/academy-lesson-o3-support-data --dest-dir=inspect-ns > inspect-ns.log 2>&1; tail -n 1 inspect-ns.log; v=$(find inspect-ns -path '*secret*' -type f -exec grep -h -o 'password: .*' {} + | head -n 1); echo \"$v\"; echo \"${v#password: }\" | base64 -d; echo"
      understand:
        purpose: Creates a Secret with a fake password, collects the whole project with `oc adm inspect`, then finds the
          Secret's `password` line in the collected files and decodes it, to show what inspect wrote in place of the
          value.
        parts:
          - text: ns/academy-lesson-o3-support-data --dest-dir=inspect-ns
            means: The whole project, this recording's temporary one, written as files under `inspect-ns`.
          - text: "find inspect-ns -path '*secret*' -type f"
            means: The files below `inspect-ns` whose path contains `secret`; `-type f` keeps files, not directories.
          - text: "-exec grep -h -o 'password: .*' {} +"
            means: 'Runs `grep` on batches of those files, putting their names at the end of each command (`{} +`); a few files fit in one batch. `-o` prints only the
              matching text, the `password:` line, and `-h` leaves out the file names.'
          - text: "${v#password: }"
            means: 'The shell''s parameter expansion: the value of `v` with the prefix `password: ` removed, which leaves
              the base64 text.'
          - text: base64 -d
            means: Decodes base64 back to the text it encodes.
        caution: Decoding a real Secret value the same way prints the credential on your screen and in any log of your
          session. Here the decoded text is only the length that inspect wrote.
        concepts:
          - sec.secrets
          - linux.shell
        refs:
          - title: find(1) (-path, -type, -exec … {} +)
            url: https://man7.org/linux/man-pages/man1/find.1.html
          - title: grep(1) (-o, -h)
            url: https://man7.org/linux/man-pages/man1/grep.1.html
          - title: bash(1) (parameter expansion, ${parameter#word})
            url: https://man7.org/linux/man-pages/man1/bash.1.html
          - title: base64(1)
            url: https://man7.org/linux/man-pages/man1/base64.1.html
          - title: 'oc source (release-4.21): oc adm inspect (Secret elision)'
            url: https://github.com/openshift/oc/tree/release-4.21/pkg/cli/admin/inspect
      notice: |
        `secret/db created`. Inspect's last line is its error list: `egressfirewalls`, `egressqoses` and
        `servicemonitors`, kinds that `developer` may not list in this project; everything else was collected. In the
        Secret, `password` is `MjcgYnl0ZXMgbG9uZw==`, which decodes to `27 bytes long`: the length of
        `example-not-a-real-password`, not the password. The Secret and its key stay visible, which is useful: an
        empty password would be `0 bytes long`.
    - kind: teach
      id: redact
      title: "Before you share: look for secrets"
      body: |
        Secret values are elided. Credentials hide in other places, which `oc adm inspect` and must-gather copy as they
        are:

        | Where | Copied as is? | Example |
        |---|---|---|
        | Secret `data` | no: replaced by its length | `password: OSBieXRlcyBsb25n` |
        | ConfigMaps | **yes** | a `DB_PASSWORD` someone put in a ConfigMap |
        | `env` values written in Deployments and pods | **yes** | `value: s3cr3t` in the pod template |
        | `kubectl.kubernetes.io/last-applied-configuration` on anything but a Secret | **yes** | a whole manifest, kept by `oc apply` |
        | container logs | **yes** | a connection string printed at start-up |
        | node journals and sosreports | **yes** | whatever services logged |

        So before you attach anything, unpack it and search it. The password of `shop` is known: it is in a ConfigMap,
        in an `env` value of the Deployment, and in the log you saw.
    - kind: try
      id: try-grep
      body: "Search the directory `inspect-shop`, with all its subdirectories, for the leaked value `example-not-a-real-password`."
      accept: ["grep -r example-not-a-real-password inspect-shop", "grep -rn example-not-a-real-password inspect-shop", "grep -R example-not-a-real-password inspect-shop", "grep -rI example-not-a-real-password inspect-shop", "grep -rnI example-not-a-real-password inspect-shop", "grep -rF example-not-a-real-password inspect-shop", "grep -rnF example-not-a-real-password inspect-shop", "grep -r example-not-a-real-password inspect-shop/", "grep -rn example-not-a-real-password inspect-shop/", "grep -R example-not-a-real-password inspect-shop/", "grep -r 'example-not-a-real-password' inspect-shop", "grep -rn 'example-not-a-real-password' inspect-shop", "grep -R 'example-not-a-real-password' inspect-shop", "grep -r \"example-not-a-real-password\" inspect-shop", "grep -rn \"example-not-a-real-password\" inspect-shop", "grep -R \"example-not-a-real-password\" inspect-shop", "grep -rl example-not-a-real-password inspect-shop", "grep -lr example-not-a-real-password inspect-shop", "grep -Rl example-not-a-real-password inspect-shop", "grep -lR example-not-a-real-password inspect-shop", "grep -rc example-not-a-real-password inspect-shop", "grep -ro example-not-a-real-password inspect-shop", "grep -rno example-not-a-real-password inspect-shop", "grep -ron example-not-a-real-password inspect-shop", "grep -r -n example-not-a-real-password inspect-shop", "grep -n -r example-not-a-real-password inspect-shop", "grep -r -l example-not-a-real-password inspect-shop", "grep -l -r example-not-a-real-password inspect-shop", "grep example-not-a-real-password -r inspect-shop", "grep example-not-a-real-password -rn inspect-shop", "grep example-not-a-real-password -rl inspect-shop", "grep --recursive example-not-a-real-password inspect-shop", "grep -r --line-number example-not-a-real-password inspect-shop", "grep -r --files-with-matches example-not-a-real-password inspect-shop", "grep -ri example-not-a-real-password inspect-shop", "grep -rni example-not-a-real-password inspect-shop", "grep -rli example-not-a-real-password inspect-shop"]
      hints:
        - match: "^grep [^-]\\S* inspect-shop"
          say: "`grep` needs `-r` (recursive) to search inside a directory and the files below it. Add it before the value."
        - match: "^grep -[a-zA-Z]* ?password"
          say: "The value to search for is the whole text, `example-not-a-real-password`, not the word `password`."
        - match: "^grep -r?[a-zA-Z]* ?(example-not-a-real-password)$"
          say: "`grep` also needs the place to look: the directory `inspect-shop`."
        - match: "^(cat|less|ls|find)"
          say: "Those show files or names. To look for a value inside many files, use `grep -r`."
        - match: "^oc "
          say: "This is a plain search in files on your machine, so it takes `grep`, not `oc`."
      hint: "`grep -r`, the value, then the directory."
      run: "grep -rn -o -E '.{0,18}example-not-a-real-password' inspect-shop"
      then: |
        The recording ran `grep -rn -o -E '.{0,18}example-not-a-real-password' inspect-shop`: `-o` prints only the
        matching part, with up to 18 characters before it, to keep the long JSON lines short. A plain `grep -r`
        finds the same four matches in two files, and prints the whole lines.

        Line 4 of the ConfigMap (`data`) and line 122 of the Deployment (`env`) are the expected ones. Line 7 of
        the Deployment and line 11 of the ConfigMap are JSON: the whole manifest that `oc apply` keeps in the
        annotation `kubectl.kubernetes.io/last-applied-configuration`, which inspect blanks only on Secrets. So
        the value would have left with the archive, in two copies each. The log of the crashing pod holds it as
        well, and a project inspect collects logs.
    - kind: show
      id: ns-leaks
      body: "The whole-project inspect from above, `inspect-ns`, searched the same way, listing only the names of the files that hold the value:"
      run: "grep -rl example-not-a-real-password inspect-ns | sed 's|^inspect-ns/namespaces/academy-lesson-o3-support-data/||' | sort"
      notice: |
        Six files still hold the password: the Deployment, its ReplicaSet, the ConfigMap, the pods (as a list and one
        by one), and the current log of the crashing container. The Secret is not among them.
    - kind: ask
      id: which-leaks
      prompt: "You are about to attach a project inspect to a case. Which item must you check by hand because inspect copies it unchanged?"
      choices:
        - text: "The values of Secrets"
          why: "Secret values are replaced by their length. The Secret's existence and keys stay visible."
        - text: "The service CA certificate"
          why: "A CA certificate is public data, and inspect keeps it on purpose. Nothing secret leaves with it."
        - text: "A ConfigMap that holds `DB_PASSWORD`"
          why: "Only Secret values and Route TLS keys are elided. ConfigMaps, `env` literals and logs are copied as they are, so a password stored there leaves with the archive."
      answer: 2
    - kind: teach
      id: must-gather
      title: "must-gather: the cluster-wide archive"
      body: |
        `oc adm must-gather` is what Red Hat support asks for first. A cluster-admin runs it from an empty working
        directory. It creates a temporary project, starts a gather pod, by default on a random control plane node, runs
        the gather image, and copies the result into `must-gather.local.<random>`. It relies on `oc adm inspect`
        internally, so Secrets get the same treatment.

        You can aim it: `--image=<product's gather image>` collects an operator's own data, and `--image-stream=openshift/must-gather`
        adds the default data back. A command after `--` replaces the image's default gather script:
        `-- /usr/bin/gather_audit_logs` collects the audit logs instead of the usual data. `--since` and `--dest-dir` do what
        they do for inspect. The help of the client lists the options:
    - kind: show
      id: must-gather-help
      run: "oc adm must-gather --help | grep -A1 -E '^    --(dest-dir|image|image-stream|run-namespace|since|timeout|volume-percentage)='"
      notice: |
        The options named above: `--dest-dir`, `--image`, `--image-stream`, `--run-namespace`, `--since`, `--timeout`
        and `--volume-percentage`. This client's default for `--volume-percentage` is 70. When the help of the client you
        run and a page of documentation disagree, the help is the authority for that client.
    - kind: show
      id: must-gather-example
      code: |
        oc adm must-gather --dest-dir=must-gather
        tar cvaf must-gather-<date>-<cluster_id>.tar.gz must-gather/
      caption: "Documented example, from OpenShift 4.21, Support, Gathering data about your cluster. Not run on this course's cluster: it would pull the must-gather image onto a single node that has only about half a gigabyte of disk left before the kubelet starts evicting pods, and write an archive of several hundred megabytes."
      origin: example
      notice: "Run by a cluster administrator from an empty directory. The archive's name carries the date and the cluster ID, as support asks."
    - kind: ask
      id: gather-product
      prompt: "Support wants data about OpenShift Data Foundation in addition to the usual cluster data. How does a cluster administrator collect it?"
      choices:
        - text: "`must-gather` with only the product's `--image`, for a smaller archive"
          why: "Naming any `--image` replaces the default one, so the usual cluster data would be missing. The default image stream, `--image-stream=openshift/must-gather`, adds it back."
        - text: "`oc adm inspect` on the product's pods, which collects the same data"
          why: "inspect would miss what the product's own gather script knows to collect: its custom resources and diagnostics."
        - text: "`must-gather` with the product `--image` plus the default `--image-stream`"
          why: "Products ship their own must-gather image, and naming one replaces the default. Adding `--image-stream=openshift/must-gather` in the same run brings the default data back."
      answer: 2
    - kind: teach
      id: node-evidence
      title: "Node evidence: node-logs and sosreport"
      body: |
        Some problems are below Kubernetes: the kubelet, CRI-O, the kernel. The node's **systemd journal** holds them.
        `oc adm node-logs` reads it through the API, without logging in to the node: for example `-u crio` for the
        container runtime, `-u kubelet` for the kubelet, `--role=worker` or `--role=master` for the nodes. Node logs
        may contain sensitive output, so they are limited to users who may `get` the resource `nodes/log`, a right of
        the role `system:node-admins`.

        When support needs more than logs, they ask for a **sosreport** of one node. The documented route is a debug
        pod on that node, a `chroot` into its filesystem, and the `toolbox` container. SSH to the node is the fallback
        only when the API or the kubelet is down.
    - kind: show
      id: node-logs-help
      run: "oc adm node-logs --help | sed -n '1,7p'"
      notice: "The help says where the logs come from, the journal or `/var/log`, and which resource decides who may read them: `nodes/log`."
    - kind: try
      id: node-logs-admin
      body: "As the cluster administrator, read the journal of the container runtime's unit, `crio`, on the node `crc`, for the last ten minutes. `--since` takes a relative time such as `-10m`."
      accept: ["oc adm node-logs crc -u crio --since=-10m", "oc adm node-logs crc --unit=crio --since=-10m", "oc adm node-logs crc -u crio --since -10m", "oc adm node-logs crc --since=-10m -u crio"]
      hints:
        - match: "^oc logs"
          say: "`oc logs` reads containers. A node's journal is read with `oc adm node-logs`."
        - match: "^oc adm node-logs crc$"
          say: "That would print the node's whole journal. Choose the unit with `-u crio` and the window with `--since=-10m`."
        - match: "^oc adm node-logs (?!.*(-u|--unit))"
          say: "Name the unit: `-u crio`."
        - match: "^oc adm node-logs (?!.*--since)"
          say: "Limit it to the last ten minutes with `--since=-10m`."
        - match: "^ssh|journalctl"
          say: "The node is read through the API: `oc adm node-logs`, no login to the node."
      hint: "`oc adm node-logs crc`, then `-u crio` and `--since=-10m`."
      run: "oc adm node-logs crc -u crio --since=-10m | grep -m 3 academy-lesson-o3-support-data | cut -c1-200"
      then: |
        The recording kept the first three lines that mention this lesson's project, cut to 200 characters (`grep -m 3`
        and `cut` on your own machine). They are CRI-O starting the sandbox of a `shop` pod and connecting it to the
        pod network. Look at the pod's name, `shop-6977cc964f-c6xj5`: it is not one of this run's pods. It belonged to
        an earlier recording of this lesson, in a project of the same name that had been deleted a few minutes
        before. The node's journal kept it: these lines outlive the pod and the project, until the journal rotates.
    - kind: show
      id: sos-yaml
      code: |
        oc debug node/<node-name>
        chroot /host
        toolbox
        sos report -k crio.all=on -k crio.logs=on -k podman.all=on -k podman.logs=on
      caption: "The documented route to a sosreport on an OpenShift 4.21 node: a cluster administrator's debug session. Not run on this course's cluster: toolbox pulls a support-tools image of several hundred megabytes, and the node has little disk to spare."
      origin: example
      notice: "`sos` asks for the support case number, puts it in the archive's name, and writes the archive under `/var/tmp` on the node, which is `/host/var/tmp` from the debug pod. A second debug session then copies it out. Treat a sosreport as confidential: it describes a whole node."
    - kind: teach
      id: what-to-attach
      title: "What to attach to a support case"
      body: |
        A case is answered faster when the first message already holds six things:

        1. **The cluster ID and version.** `oc get clusterversion` shows the version; the ID is in
           `.spec.clusterID` of that object, and in the console when you open a case from Help.
        2. **The symptom and what you expected**, in one or two sentences, with the impact.
        3. **The time window**, with the time zone, and what changed shortly before.
        4. **The must-gather archive**, from the platform team, named with the date and the cluster ID.
        5. For an application problem, your project's **inspect directory**, compressed, with the events you saved
           early.
        6. A **sosreport**, only for the node that support names.

        If you are on an application team, you hand items 2, 3 and 5 to your platform team. Opening the case and
        collecting cluster-wide data is their job.
    - kind: reflect
      id: explain-collect
      prompt: "A new on-call engineer asks why the runbook says \"collect before you fix\", and which collector to use when. Explain."
      model: |
        A fix destroys evidence: restarting a pod drops the crashed container's logs, events vanish after a few hours,
        and a deleted pod takes everything with it. So first take a snapshot. For our own project, `oc adm inspect`
        collects the objects, the events and the logs using our own permissions. If the problem looks like the platform,
        the platform team runs must-gather, which needs cluster-admin and collects the whole cluster, with extra product
        images or audit logs when support asks. Node problems are read with `oc adm node-logs`, or a sosreport from a
        debug pod, both for node administrators. Before anything leaves the company, search it: Secret values are
        replaced by their length, but ConfigMaps, environment values and logs are copied as they are.
    - kind: teach
      id: what-next
      title: "What you can do now"
      body: |
        You can choose the collector for a problem: `oc adm inspect` for your own project, must-gather for the cluster,
        node logs and a sosreport for a node, and you know which of them you may run yourself. You can capture a
        project's state before a restart or a deletion erases it, and you can search the result for credentials that
        survive the elision of Secrets.

        This lesson closes the troubleshooting module. The incidents in the practice arena, for example
        [Route returns 503, pods are healthy](/lab/inc.service-selector-503), are where you apply it: first take the
        evidence, then fix. No activity grades `oc adm inspect` itself yet: before you fix an incident on your own
        cluster, run it on the incident's project and search the result as above. The next module, on images,
        builds and updates, starts with [Images on the platform](/lesson/ct.openshift-images).
  sections:
    - id: must-gather-options
      title: "More must-gather options"
      depth: true
      body: |
        | Need | How |
        |---|---|
        | an operator's own data (Virtualization, Data Foundation, Service Mesh, logging…) | `--image=<that product's must-gather image>`; several `--image` flags in one run (add `--image-stream=openshift/must-gather` to keep the default data) |
        | every operator that declares a gather image | `--all-images` (operators annotated with `operators.openshift.io/must-gather-image`) |
        | audit logs, which are not in the default set | `oc adm must-gather -- /usr/bin/gather_audit_logs` |
        | only one project | `oc adm must-gather -- oc adm inspect ns/<project>` |
        | a smaller archive | `--since`, or `-- /usr/bin/gather --no-logs` |
        | a longer gathering phase | `--timeout` (10 minutes by default) |

        The gather pod stops when its volume fills beyond `--volume-percentage` and still copies what it has. Then
        compress the result with the date and the cluster ID in the name, as the documentation suggests:
        `tar cvaf must-gather-<date>-<cluster_id>.tar.gz must-gather.local.<random>/`. If must-gather cannot run at all
        (no node can schedule its pod), fall back to `oc adm inspect` on the resources that support names.
    - id: node-logs-examples
      title: "node-logs examples"
      depth: true
      body: |
        ```
        oc adm node-logs --role=worker -u crio --since=-1h
        oc adm node-logs --role=master -u kubelet --tail=200
        oc adm node-logs --role=master --path=openshift-apiserver/audit.log
        ```

        On this course's OpenShift Local node, `-u kubelet` combined with `--tail` or `-g` was refused with
        `options present and query resolved to log files for [kubelet]`, and `-g` with `--tail` on the `crio` unit
        returned no entries; `-u crio --since=…`, filtered with `grep` locally, worked. Check the exact form on your
        own nodes.

        `-u` selects units, `--since`, `--until`, `--tail` and `-g` filter, and `--path` reads files under `/var/log`
        instead of the journal.
    - id: what-goes-wrong
      title: "What goes wrong, and how to see it"
      depth: true
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | must-gather refused at once | Forbidden creating the namespace or the gather pod | not cluster-admin | `oc adm inspect` on your project; ask the platform team for must-gather |
        | must-gather hangs on its pod | the gather pod is Pending on a NotReady control plane node | a random control plane node was picked | `--node-name`, or inspect the resources support asks for |
        | "Disk usage exceeds the volume percentage" | message in the must-gather output | the gather volume filled up | narrow the scope (`--since`, a single project), or raise `--volume-percentage` |
        | inspect of a named object ends with Forbidden | the message names the resource and the cluster scope | RBAC: you lack read access to that type | ask someone with the access |
        | node-logs Forbidden | the message names `nodes/log` | not a node administrator | the platform team runs it |
        | a password reaches the vendor | it was in a ConfigMap or a log | elision only covers Secrets | search before sharing; move credentials into Secrets |
    - id: common-mistakes
      title: "Common mistakes"
      depth: true
      body: |
        - **Fixing first, collecting later.** A restart or a rollback erases the crashed container's logs and, after the
          events' retention time, the events.
        - **Assuming the archive is safe because Secrets are elided.** ConfigMaps, `env` literals and logs are not.
        - **Sending a cluster-wide must-gather for an application bug.** A project inspect is smaller, faster, and
          within your own permissions.
        - **SSH to a node by habit.** Use `oc adm node-logs` or a debug pod; SSH is for when the API is down.
        - **Forgetting the time zone.** "It failed at 14:00" means nothing next to logs in UTC.
  review:
    - q: "What does `oc adm inspect` collect, and with whose permissions?"
      a: "The objects you name (for ns/<project>: the project's workloads, ConfigMaps, events, EndpointSlices, Secrets with values elided, and each container's current and previous logs), using your own token."
    - q: "Who may run `oc adm must-gather`, and where does its output go?"
      a: "A cluster-admin; it runs a gather pod in a temporary project and copies the result to must-gather.local.<random> in the current directory (or --dest-dir)."
    - q: "How do you add audit logs or a product's data to a must-gather?"
      a: "Audit logs: `oc adm must-gather -- /usr/bin/gather_audit_logs`. A product: `--image=<its must-gather image>` (repeatable), or --all-images."
    - q: "Which permission does `oc adm node-logs` need?"
      a: "get on nodes/log, granted by the system:node-admins role."
    - q: "How is a sosreport collected on an OpenShift 4.21 node?"
      a: "From a debug pod on the node: chroot /host, start toolbox, run sos report (with the CRI-O and Podman plugin options), then copy the archive from /host/var/tmp."
    - q: "Which data do inspect and must-gather elide, and which do they not?"
      a: "Secret values (replaced by their length, except public certificates) and Route TLS keys are elided; ConfigMaps, env literals and logs are copied as they are."
    - q: "How do you find the cluster ID for a support case?"
      a: "`oc get clusterversion -o jsonpath='{.items[].spec.clusterID}{\"\\n\"}'`, or the Cluster ID field on the console's overview."
  labs: [lab.troubleshooting-tools]
  limits: |
    must-gather and sosreport were not run on this course's cluster: both pull an image of several hundred megabytes
    onto its single node, which has only about half a gigabyte of disk left before the kubelet evicts pods, and must-gather writes an
    archive of several hundred megabytes. Their commands are documented examples. `oc adm inspect` (named objects, a
    whole project with a fake password, a cluster operator) and `oc adm node-logs` ran for real. The list of what a
    namespace inspect collects is taken from the oc 4.21 source.
  references:
    - {title: "OpenShift 4.21: Gathering data about your cluster (must-gather, inspect, sosreport, node logs, cluster ID)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/gathering-cluster-data"}
    - {title: "OpenShift 4.21: Getting support (submitting a support case)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/getting-support"}
    - {title: "OpenShift 4.21: Troubleshooting (node-logs examples)", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/troubleshooting"}
    - {title: "oc source (release-4.21): oc adm inspect (namespace resources, pod logs, Secret elision)", url: "https://github.com/openshift/oc/tree/release-4.21/pkg/cli/admin/inspect"}
    - {title: "Kubernetes 1.34: Secrets", url: "https://v1-34.docs.kubernetes.io/docs/concepts/configuration/secret/"}
    - {title: "openshift/api: kube-apiserver event TTL setting (default 3 hours)", url: "https://github.com/openshift/api/pull/2520"}
  commands:
    - cmd: "oc apply -f shop.yaml; sleep 30; oc get pods -l app=shop; oc logs deploy/shop"
      as: developer
      meaning: "an application that crashes at start and prints its connection string, with the password in it"
    - cmd: "p=$(oc get pod -l app=shop -o name | head -n 1); oc delete $p; oc logs $p"
      as: developer
      expect: fail
      meaning: "the log of a deleted pod is gone"
    - cmd: "oc adm inspect clusteroperator/dns --dest-dir=inspect-denied"
      as: developer
      expect: fail
      meaning: "inspect reads with your own permissions: a project user may not read cluster operators"
    - cmd: "oc adm inspect clusteroperator/dns --dest-dir=inspect-dns > inspect-dns.log 2>&1; tail -n 1 inspect-dns.log; du -sh inspect-dns; ls inspect-dns/namespaces; find inspect-dns -name '*.log' | wc -l"
      as: admin
      timeout: 300
      meaning: "the administrator inspects a cluster operator: its related namespaces, with their pods' logs"
    - cmd: "oc adm inspect deployment/shop configmap/shop-settings --dest-dir=inspect-shop; find inspect-shop -type f | sort"
      as: developer
      meaning: "inspect of two objects the user may read: the files it wrote"
    - cmd: "oc create secret generic db --from-literal=password=example-not-a-real-password; oc adm inspect ns/academy-lesson-o3-support-data --dest-dir=inspect-ns > inspect-ns.log 2>&1; tail -n 1 inspect-ns.log; v=$(find inspect-ns -path '*secret*' -type f -exec grep -h -o 'password: .*' {} + | head -n 1); echo \"$v\"; echo \"${v#password: }\" | base64 -d; echo"
      as: developer
      timeout: 300
      meaning: "a whole-project inspect: the Secret's value is replaced by its length"
    - cmd: "grep -rn -o -E '.{0,18}example-not-a-real-password' inspect-shop"
      as: developer
      meaning: "the password is copied as it is: in the ConfigMap, in the Deployment's env, and in the stored manifests"
    - cmd: "grep -rl example-not-a-real-password inspect-ns | sed 's|^inspect-ns/namespaces/academy-lesson-o3-support-data/||' | sort"
      as: developer
      meaning: "the files of the project inspect that still hold the password"
    - cmd: "oc adm must-gather --help | grep -A1 -E '^    --(dest-dir|image|image-stream|run-namespace|since|timeout|volume-percentage)='"
      as: developer
      meaning: "the must-gather options; note the default volume percentage that this client shows"
    - cmd: "oc adm node-logs --help | sed -n '1,7p'"
      as: developer
      meaning: "node logs come from the journal or /var/log, and only node administrators (nodes/log) may read them"
    - cmd: "oc adm node-logs crc -u crio --since=-10m | grep -m 3 academy-lesson-o3-support-data | cut -c1-200"
      as: admin
      meaning: "the container runtime's journal on the node, filtered to this project"
  files:
    shop.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: shop-settings
      data:
        LOG_LEVEL: info
        DB_URL: postgresql://shop@db:5432/shop
        DB_PASSWORD: example-not-a-real-password
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: shop
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: shop
        template:
          metadata:
            labels:
              app: shop
          spec:
            containers:
            - name: shop
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["sh", "-c", "echo \"connecting to postgresql://shop:$DB_PASSWORD@db:5432/shop\"; echo \"error: connection refused\" >&2; sleep 2; exit 1"]
              env:
              - name: DB_PASSWORD
                value: example-not-a-real-password
              envFrom:
              - configMapRef:
                  name: shop-settings
