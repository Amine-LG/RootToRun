# OpenShift workload security, written as teaching flows.
# Both lessons are recorded on OpenShift Local as the ordinary user developer and the cluster administrator
# (record_on: cluster-admin), each inside an experiment with a verified rollback (X-SCC-01, X-NODE-01).
- id: f.scc
  title: Security Context Constraints
  subtitle: "Read a rejection, fix the workload, grant a narrow exception and take it back"
  module: b3-workload-security
  diagram: scc-admission
  mode: REAL_LAB
  minutes: 40
  level: 2
  supports: "OpenShift 4.21 SCCs (restricted-v2, anyuid, privileged) and oc 4.21. Every command was run on OpenShift Local 4.21 by the ordinary user developer, in a temporary project of their own, and by the cluster administrator kubeadmin, who granted and then removed one SCC exception for one ServiceAccount; the grant and the project were then removed and the cluster's SCCs and SCC bindings were compared with the copy taken before (experiment X-SCC-01)."
  concepts:
    - sec.scc
    - container.security
  prerequisites:
    - a.container-security
    - f.rbac
    - o2.service-accounts
  objective: |
    Diagnose an SCC admission failure from real evidence, fix the workload rather than the policy, review a manifest
    before applying it, and, when an exception is really needed, have it granted to one ServiceAccount in one project,
    prove which SCC admitted the pod, and take the exception back.
  record_on: cluster-admin
  flow:
    - kind: teach
      id: situation
      title: A Deployment with no pods
      body: |
        A vendor's Deployment requests one replica. It works on a laptop, but OpenShift shows zero pods, and there is
        no container log to read. You need to find which security setting stopped it.

        A **Security Context Constraint (SCC)** is an OpenShift admission policy: it checks the security settings a pod
        asks for before the API server stores the pod. You will follow that check, repair the workload, and watch an
        administrator grant a narrow exception when one is really needed.

        Everything here ran on OpenShift Local 4.21: the ordinary user `developer` in their own project,
        `academy-lesson-f-scc`, and the cluster administrator `kubeadmin` for the exception. The prompt in front of
        each command names who ran it.
    - kind: show
      id: vendor-manifest
      body: "The vendor's example asks for one thing at pod level: `runAsUser: 0`, the root user."
      code: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: vendor-app
          labels: {app: vendor-app}
        spec:
          replicas: 1
          selector:
            matchLabels: {app: vendor-app}
          template:
            metadata:
              labels: {app: vendor-app}
            spec:
              terminationGracePeriodSeconds: 2
              securityContext:
                runAsUser: 0                 # copied from the vendor's example
              containers:
              - name: app
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                imagePullPolicy: IfNotPresent
                command: ["sleep", "infinity"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                  seccompProfile: {type: RuntimeDefault}
                resources:
                  requests: {cpu: 10m, memory: 16Mi}
                  limits: {memory: 64Mi}
      caption: vendor-app.yaml
      notice: |
        The container settings already drop every capability, forbid privilege escalation and ask for the runtime's
        default seccomp filter. Only the pod-level UID is unusual. The container only sleeps: it stands for the
        vendor's application.
    - kind: show
      id: apply-vendor
      run: "oc apply -f vendor-app.yaml"
      notice: |
        The Deployment is created. The warning comes from a different check, Kubernetes Pod Security Admission, which
        this project runs in warning mode: it names `runAsUser=0` and the missing `runAsNonRoot`, but blocks nothing.
    - kind: show
      id: rollout-waits
      body: "Wait for the Deployment to become available, for at most twenty seconds:"
      run: "oc rollout status deploy/vendor-app --timeout=20s"
      notice: "`0 out of 1 new replicas have been updated`, then `timed out waiting for the condition`. Something stops the pod."
    - kind: try
      id: no-pods
      body: "List the Deployments, ReplicaSets and pods of the project in one command."
      accept:
        - "oc get deploy,rs,pods"
        - "oc get deployments,replicasets,pods"
        - "oc get deployment,replicaset,pod"
        - "oc get deploy,rs,po"
        - "oc get deploy,rs,pod"
        - "oc get deployments,rs,pods"
      hints:
        - match: "^oc get (deploy|deployments?|rs|replicasets?|pods?|po) "
          say: "Several kinds in one `oc get` are joined by commas, without spaces: `deploy,rs,pods`."
        - match: "^oc get all"
          say: "`all` lists more kinds than the three asked for. Name them: `deploy,rs,pods`."
      hint: "`oc get` and the three kinds, separated by commas."
      run: "oc get deploy,rs,pods"
      then: |
        The ReplicaSet wants one pod (`DESIRED 1`) and has none (`CURRENT 0`), and no pod is listed. Admission refused
        the creation request before any pod existed, so there is no pod to describe. The ReplicaSet's events hold the
        reason.
    - kind: teach
      id: read-rejection
      title: Read the provider messages
      body: |
        A ReplicaSet event can list every SCC, called a provider in the message. Separate two kinds of evidence:
        `not usable by user or serviceaccount` means the identity has no permission to use that SCC; a complaint
        about a field means admission tried that SCC and found a value it does not allow.
    - kind: show
      id: describe-rs
      run: "oc describe rs -l app=vendor-app"
      highlight: ["FailedCreate"]
      notice: |
        The condition `ReplicaFailure` is `True` with reason `FailedCreate`, and the event, repeated 13 times in 22
        seconds, says `unable to validate against any security context constraint`. `anyuid` is `not usable`: the
        pod's ServiceAccount may not use it. `restricted-v2` was usable but refused UID 0, which `must be in the
        ranges: [1000810000, 1000819999]` of this project. `restricted-v3` refused it too, for two reasons.

        The question below quotes the same message from an earlier recording of this lesson, whose project had
        the range `[1001520000, 1001529999]`: each project gets its own range.
    - kind: ask
      id: find-cause
      prompt: The restricted-v2 message names the rejected UID. Which change addresses it before any exception is requested?
      evidence: |
        provider restricted-v2: .containers[0].runAsUser: Invalid value: 0: must be in the ranges: [1001520000, 1001529999]
      choices:
        - text: Restart the container with the same security settings
          why: No container exists to restart. Recreating the pod from the same template repeats the admission failure.
        - text: Grant privileged access to every project workload
          why: That widens access far beyond a UID problem and leaves the image unfixed.
        - text: Remove the fixed UID and adapt writable paths
          why: Let restricted-v2 assign the UID from the project's range, and build the image so that user can write the paths the application needs.
      answer: 2
    - kind: try
      id: try-events
      body: "The same message is in the project's event list. List only the events whose reason is `FailedCreate`, letting the API server do the filtering."
      accept:
        - "oc get events --field-selector reason=FailedCreate"
        - "oc get events --field-selector=reason=FailedCreate"
        - "oc get event --field-selector reason=FailedCreate"
        - "oc get ev --field-selector reason=FailedCreate"
        - "oc get events --field-selector reason=FailedCreate -n academy-lesson-f-scc"
        - "oc get events -n academy-lesson-f-scc --field-selector reason=FailedCreate"
        - "oc get events --field-selector=reason=FailedCreate -n academy-lesson-f-scc"
        - "oc get events -n academy-lesson-f-scc --field-selector=reason=FailedCreate"
      hints:
        - match: "\\| *grep"
          say: "`grep` filters on your machine after every event has been sent. Ask the API server instead: `--field-selector reason=FailedCreate`."
        - match: "^oc describe"
          say: "`describe` shows one object's events. The task asks for the project's event list, filtered by reason."
        - match: "--field-selector[ =]type="
          say: "`type` is Normal or Warning. The field that holds `FailedCreate` is `reason`."
        - match: "failedcreate|Failedcreate|failedCreate"
          say: "Field selector values are compared exactly: `FailedCreate`, with two capitals."
      hint: "`oc get events` with `--field-selector reason=…`."
      run: "oc get events --field-selector reason=FailedCreate"
      then: |
        One event, from `replicaset/vendor-app-75cbd798d4`, seen `2s` ago: the controller keeps retrying, and the
        same event is updated at each refusal (`describe` counted 13 in 22 seconds).
    - kind: teach
      id: assigned-uid
      title: Let the project supply the UID
      body: |
        With `restricted-v2`, an omitted `runAsUser` is set to the first UID of the project's allocated range. It is
        not a new random number at every start. The project's annotation `openshift.io/sa.scc.uid-range` stores the
        range: a value such as `1000810000/10000` means 10,000 UIDs starting at 1000810000.

        As in [Container security](/lesson/a.container-security), images must work with an arbitrary UID. For the
        usual group-0 convention, make the directories the application writes group-owned by 0 and group-writable in
        the image. Group 0 does not make the process UID 0 or give it root's capabilities.
    - kind: show
      id: uid-range
      body: "The developer can read the range of their own project:"
      run: "oc get project academy-lesson-f-scc -o jsonpath='{.metadata.annotations.openshift\\.io/sa\\.scc\\.uid-range}{\"\\n\"}'"
      notice: "`1000810000/10000`: the range in the rejection message, `[1000810000, 1000819999]`. It belongs to this project."
    - kind: teach
      id: review-tool
      title: Review a manifest before applying it
      body: |
        `oc adm policy scc-subject-review -f <file>` runs the same SCC matching as admission on the pod that a
        manifest would create, and creates nothing. Run by the developer, it checks what the developer and the pod's
        ServiceAccount (`default` here) may use. `ALLOWED BY` names the SCC that would admit the pod.
    - kind: try
      id: review-before
      body: "Review `vendor-app.yaml` in your current project with this command."
      accept:
        - "oc adm policy scc-subject-review -f vendor-app.yaml"
        - "oc adm policy scc-subject-review --filename=vendor-app.yaml"
        - "oc adm policy scc-subject-review --filename vendor-app.yaml"
        - "oc adm policy scc-subject-review -f ./vendor-app.yaml"
        - "oc adm policy scc-subject-review -f vendor-app.yaml -n academy-lesson-f-scc"
        - "oc adm policy scc-subject-review -n academy-lesson-f-scc -f vendor-app.yaml"
      hints:
        - match: "^oc apply|^oc create"
          say: "That would create the Deployment again. The review creates nothing."
        - match: "scc-review"
          say: "`scc-review` asks which ServiceAccounts could create the pod. `scc-subject-review` checks the identities that would create it."
        - match: "(^| )-z( |$)"
          say: "Leave out `-z`: the manifest's ServiceAccount and your own identity are checked without it."
      hint: "`oc adm policy scc-subject-review` and `-f` with the file."
      run: "oc adm policy scc-subject-review -f vendor-app.yaml"
      then: "`ALLOWED BY <none>`: no SCC available here admits the manifest as written, as the rejection said."
    - kind: show
      id: fixed-manifest
      body: "The fix is in the manifest: no fixed UID, and a promise that the pod never runs as root."
      code: |
        # vendor-app-fixed.yaml: the same Deployment; only the pod-level securityContext changed
              securityContext:
                runAsNonRoot: true           # was: runAsUser: 0
      caption: vendor-app-fixed.yaml (the changed lines)
    - kind: show
      id: review-fixed
      run: "oc adm policy scc-subject-review -f vendor-app-fixed.yaml"
      notice: "`restricted-v2`: the default SCC would admit the fixed manifest. Nothing was created."
    - kind: show
      id: review-z
      body: |
        A tempting shortcut is `-z`, to check one ServiceAccount by name. Here it gives a different answer for the
        same fixed manifest:
      run: "oc adm policy scc-subject-review -z default -f vendor-app-fixed.yaml"
      notice: |
        `<none>`. With `-z`, the review treats the ServiceAccount as a user with no groups. `restricted-v2` is
        granted to the group `system:authenticated`, so it is not counted. Use `-z` to check a grant made to the
        ServiceAccount itself, not to predict whether an ordinary pod is admitted.
    - kind: try
      id: review-another-pod
      body: In your current directory, worker.yaml is a Pod manifest for ServiceAccount worker in project billing.
        Type the SCC subject-review command for that file and project.
      accept:
        - oc adm policy scc-subject-review -f worker.yaml -n billing
        - oc adm policy scc-subject-review -n billing -f worker.yaml
        - oc adm policy scc-subject-review --filename=worker.yaml --namespace=billing
        - oc adm policy scc-subject-review --namespace=billing --filename=worker.yaml
        - oc adm policy scc-subject-review -f ./worker.yaml -n billing
        - oc adm policy scc-subject-review --filename worker.yaml --namespace billing
        - oc adm policy scc-subject-review --namespace billing --filename worker.yaml
        - oc adm policy scc-subject-review -f worker.yaml --namespace=billing
        - oc adm policy scc-subject-review --namespace=billing -f worker.yaml
        - oc adm policy scc-subject-review -f worker.yaml --namespace billing
        - oc adm policy scc-subject-review --namespace billing -f worker.yaml
        - oc adm policy scc-subject-review --filename worker.yaml -n billing
        - oc adm policy scc-subject-review -n billing --filename worker.yaml
        - oc adm policy scc-subject-review --filename worker.yaml --namespace=billing
        - oc adm policy scc-subject-review --namespace=billing --filename worker.yaml
        - oc adm policy scc-subject-review --filename=worker.yaml -n billing
        - oc adm policy scc-subject-review -n billing --filename=worker.yaml
        - oc adm policy scc-subject-review --filename=worker.yaml --namespace billing
        - oc adm policy scc-subject-review --namespace billing --filename=worker.yaml
        - oc adm policy scc-subject-review -n billing -f ./worker.yaml
        - oc adm policy scc-subject-review -f ./worker.yaml --namespace billing
        - oc adm policy scc-subject-review --namespace billing -f ./worker.yaml
        - oc adm policy scc-subject-review -f ./worker.yaml --namespace=billing
        - oc adm policy scc-subject-review --namespace=billing -f ./worker.yaml
        - oc adm policy scc-subject-review --filename ./worker.yaml -n billing
        - oc adm policy scc-subject-review -n billing --filename ./worker.yaml
        - oc adm policy scc-subject-review --filename ./worker.yaml --namespace billing
        - oc adm policy scc-subject-review --namespace billing --filename ./worker.yaml
        - oc adm policy scc-subject-review --filename ./worker.yaml --namespace=billing
        - oc adm policy scc-subject-review --namespace=billing --filename ./worker.yaml
        - oc adm policy scc-subject-review --filename=./worker.yaml -n billing
        - oc adm policy scc-subject-review -n billing --filename=./worker.yaml
        - oc adm policy scc-subject-review --filename=./worker.yaml --namespace billing
        - oc adm policy scc-subject-review --namespace billing --filename=./worker.yaml
        - oc adm policy scc-subject-review --filename=./worker.yaml --namespace=billing
        - oc adm policy scc-subject-review --namespace=billing --filename=./worker.yaml
      hints:
        - match: ^oc apply
          say: Applying creates a real object; this task asks for an admission review.
        - match: scc-review
          say: The subject-review command checks the ServiceAccount named by this Pod; scc-review asks which ServiceAccounts
            could create it.
        - match: "(^| )-z( |$)|--serviceaccount"
          say: "With `-z` the ServiceAccount is checked as a user without groups, so SCCs granted to all authenticated users are left out. The Pod already names its ServiceAccount; give the file and the project only."
        - match: shop
          say: The Pod belongs to billing; the review must use that project.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n billing the review uses your current project. The Pod belongs to billing.
      hint: Use the scc-subject-review subcommand of oc adm policy, with -f for the file and -n for the project.
      then: |
        The review would evaluate worker.yaml for its ServiceAccount, and for you, in billing. It would not create or
        start the pod.
    - kind: show
      id: apply-fixed
      run: "oc apply -f vendor-app-fixed.yaml"
      notice: "`configured`, and no Pod Security warning this time: the template no longer asks for root. The Deployment starts a new ReplicaSet."
    - kind: show
      id: rollout-fixed
      run: "oc rollout status deploy/vendor-app --timeout=120s"
      notice: "`successfully rolled out`: the new ReplicaSet's pod was admitted."
    - kind: show
      id: assigned-uid-recorded
      run: "oc exec deploy/vendor-app -- id"
      notice: |
        The process runs as the first UID of the project's range, the value in the rejection message. `gid=0(root)`
        is the primary group, which the image's group permissions rely on; it is not the root user.
    - kind: show
      id: scc-of-fixed
      body: "Which SCC admitted it is written on the pod, in the annotation `openshift.io/scc`:"
      run: "oc get pods -l app=vendor-app -o 'custom-columns=NAME:.metadata.name,SCC:.metadata.annotations.openshift\\.io/scc'"
      notice: "`restricted-v2`, the default. No exception was needed: the vendor's `runAsUser: 0` was a habit, not a requirement."
    - kind: ask
      id: uid-transfer
      prompt: A restricted-v2 project range is 1004000000/10000. A pod omits runAsUser. Which UID is assigned?
      choices:
        - text: A fresh random UID on every restart
          why: The range is allocated to the project; the default is its first UID.
        - text: '1004000000'
          why: MustRunAsRange defaults to the minimum of the allocated range.
        - text: 0, if the image declares USER root
          why: SCC admission supplies runAsUser in the pod spec, overriding the image user.
      answer: 1
    - kind: teach
      id: whose-grant
      title: Use the workload identity
      body: |
        A **ServiceAccount** is the API identity of a workload ([ServiceAccounts](/lesson/o2.service-accounts) covers
        them). For a Deployment's pods, SCC admission uses the pod's ServiceAccount, not the person who created the
        Deployment. For a pod created directly, the creator's SCCs count too.

        Permission to use an SCC is RBAC's `use` verb on `securitycontextconstraints` in `security.openshift.io`. Only
        a cluster administrator can grant it. Granting it to `default` spreads it to every workload that omits
        `serviceAccountName`, so an exception goes to a dedicated ServiceAccount.
    - kind: teach
      id: when-needed
      title: When the requirement is real
      body: |
        A second component, `legacy`, comes from an old image that really must start as UID 0 and cannot be rebuilt
        yet. In this lesson its container also only sleeps; it stands for such an image. The developer gives it its
        own ServiceAccount, `legacy-sa`, so that an exception would reach this workload only, and asks the
        administrator for one. The team's manifest keeps the usual hardening, including the seccomp line.
    - kind: try
      id: create-sa
      body: "Create the ServiceAccount `legacy-sa` in your current project."
      accept:
        - "oc create serviceaccount legacy-sa"
        - "oc create sa legacy-sa"
        - "oc create serviceaccount legacy-sa -n academy-lesson-f-scc"
        - "oc create sa legacy-sa -n academy-lesson-f-scc"
      hints:
        - match: "^oc new-|^oc adm"
          say: "A ServiceAccount is created like other simple objects: `oc create serviceaccount <name>`."
        - match: "service-account|serviceAccount"
          say: "The kind is written `serviceaccount` (or `sa`)."
      hint: "`oc create`, the kind `serviceaccount`, the name."
      run: "oc create serviceaccount legacy-sa"
      then: "`serviceaccount/legacy-sa created`. Creating it grants nothing."
    - kind: show
      id: hardened-manifest
      code: |
        # legacy-hardened.yaml (pod template, abridged): the Deployment legacy
            spec:
              serviceAccountName: legacy-sa
              securityContext:
                runAsUser: 0
              containers:
              - name: app
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                  seccompProfile: {type: RuntimeDefault}
      caption: legacy-hardened.yaml (abridged)
    - kind: show
      id: admin-review-hardened
      body: |
        Before granting anything, the administrator asks which SCC would admit this pod. `kubeadmin` may use every
        SCC, so the answer is the SCC admission would choose if access were not the question:
      run: "oc adm policy scc-subject-review -f legacy-hardened.yaml -n academy-lesson-f-scc"
      notice: "`Deployment/legacy` is `ALLOWED BY privileged`, the broadest SCC of all, for a pod that asks only for UID 0. Read why before granting anything."
    - kind: show
      id: compare-sccs
      run: "oc get scc anyuid restricted-v2 privileged -o custom-columns=NAME:.metadata.name,PRIORITY:.priority,RUNASUSER:.runAsUser.type,SECCOMP:.seccompProfiles,PRIVILEGED:.allowPrivilegedContainer,HOSTPID:.allowHostPID"
      notice: |
        `anyuid` (priority 10) allows any UID (`RunAsAny`) but its `SECCOMP` column is `<none>`: it allows no seccomp
        profile to be named. The manifest names `RuntimeDefault`, so `anyuid` cannot admit it, and `privileged`, which
        allows every profile (`[*]`), is the SCC that fits.
    - kind: ask
      id: which-repair
      prompt: The review named privileged only because of the seccomp line. What is the narrowest way forward?
      choices:
        - text: Grant privileged to legacy-sa, as the review says
          why: "An SCC permits settings; it does not add them to the pod. But privileged would let every pod run as legacy-sa ask for host access, far more than this one needs. The review names the SCC that fits, not the one you should grant."
        - text: Add runtime/default to the anyuid SCC itself
          why: Default SCCs belong to the platform. Editing them changes every workload that uses them, and updates can undo it.
        - text: Drop the seccomp line and grant anyuid to legacy-sa
          why: The pod then fits anyuid, which allows UID 0 and keeps the other restrictions. The next steps show the price it pays.
      answer: 2
    - kind: show
      id: admin-review-legacy
      body: "`legacy.yaml` is the same manifest without the `seccompProfile` line. The same review:"
      run: "oc adm policy scc-subject-review -f legacy.yaml -n academy-lesson-f-scc"
      notice: "`anyuid`: the narrower SCC now fits."
    - kind: ask
      id: priority-prediction
      prompt: Both SCCs can admit a pod. Which one wins?
      evidence: |
        anyuid: priority 10
        restricted-v2: priority unset (counts as 0)
      guess: true
      choices:
        - text: anyuid
          why: Priority is compared first, so 10 is tried before 0. The next step explains the order.
        - text: restricted-v2, because it restricts more
          why: Restrictiveness only breaks ties between equal priorities; it does not override a higher priority. The next step explains the order.
        - text: Both SCCs, with their rules merged
          why: Exactly one SCC supplies the defaults and validates the pod; settings are never combined. The next step explains it.
      answer: 0
    - kind: teach
      id: selection
      title: One SCC wins
      body: |
        Admission sorts the SCCs a pod may use by highest `priority`, then most restrictive, then name. An unset
        priority counts as 0. It tries each candidate's defaults and validation and stops at the first that fits.
        Settings are not combined across SCCs.

        The built-in `anyuid` has priority 10; `restricted-v2` has none. If both are usable and `anyuid` validates the
        pod, `anyuid` wins even when restricted-v2 would also work. Priority cannot make invalid settings valid: as
        the review showed, a pod that `anyuid` does not fit falls through to the next SCC that does.
    - kind: teach
      id: exception-lifecycle
      title: Keep exceptions narrow and temporary
      body: |
        An administrator grants an SCC by binding its ClusterRole, `system:openshift:scc:<name>`, to a ServiceAccount.
        Name the project with `-n`: the command then creates a RoleBinding in that project. Without `-n` it creates a
        ClusterRoleBinding instead, for a ServiceAccount of the administrator's current project.

        SCC selection happens when a pod is created. Granting or revoking does not change running pods. An exception
        needs an owner, a reason and a review date. Do not modify the platform's default SCCs.
    - kind: try
      id: try-grant
      body: "As the administrator, grant `anyuid` to the ServiceAccount `legacy-sa` of the project `academy-lesson-f-scc`, and to nothing else."
      accept:
        - "oc adm policy add-scc-to-user anyuid -z legacy-sa -n academy-lesson-f-scc"
        - "oc adm policy add-scc-to-user anyuid -z legacy-sa --namespace academy-lesson-f-scc"
        - "oc adm policy add-scc-to-user anyuid -z legacy-sa --namespace=academy-lesson-f-scc"
        - "oc adm policy add-scc-to-user anyuid --serviceaccount=legacy-sa -n academy-lesson-f-scc"
        - "oc adm policy add-scc-to-user anyuid --serviceaccount legacy-sa -n academy-lesson-f-scc"
        - "oc adm policy add-scc-to-user anyuid -n academy-lesson-f-scc -z legacy-sa"
        - "oc adm policy add-scc-to-user -z legacy-sa anyuid -n academy-lesson-f-scc"
      hints:
        - match: "^(?!.*(^| )(-n|--namespace)([ =]|$)).*$"
          say: "Without `-n`, oc creates a ClusterRoleBinding for a ServiceAccount of your own current project. Name the project with `-n academy-lesson-f-scc`."
        - match: "add-scc-to-user legacy-sa"
          say: "The SCC comes first, then the subject: `add-scc-to-user anyuid -z legacy-sa`."
        - match: "-z default|--serviceaccount[= ]default"
          say: "`default` runs every pod that names no ServiceAccount. The exception is for `legacy-sa` only."
        - match: "privileged"
          say: "The review showed that `anyuid` admits `legacy.yaml`. `privileged` would admit it too, and would let every pod of that account ask for host access."
        - match: "add-role-to-user|add-cluster-role"
          say: "The command made for SCCs is `oc adm policy add-scc-to-user`; it creates the binding to the right ClusterRole."
        - match: "add-scc-to-group"
          say: "The subject is one ServiceAccount, given with `-z`, not a group."
      hint: "`oc adm policy add-scc-to-user`, the SCC, `-z` and the ServiceAccount, and the project."
      run: "oc adm policy add-scc-to-user anyuid -z legacy-sa -n academy-lesson-f-scc"
      then: "`clusterrole.rbac.authorization.k8s.io/system:openshift:scc:anyuid added: \"legacy-sa\"`: a binding now names the ServiceAccount."
    - kind: show
      id: grant-binding
      body: "The administrator reads what the command created:"
      run: "oc get rolebinding system:openshift:scc:anyuid -n academy-lesson-f-scc -o wide"
      notice: "A RoleBinding in `academy-lesson-f-scc`, from the ClusterRole `system:openshift:scc:anyuid` to one subject: `academy-lesson-f-scc/legacy-sa`."
    - kind: try
      id: apply-legacy
      body: "Back in the developer's terminal, create the Deployment from `legacy.yaml`."
      accept:
        - "oc apply -f legacy.yaml"
        - "oc create -f legacy.yaml"
        - "oc apply -f ./legacy.yaml"
        - "oc apply --filename=legacy.yaml"
      hints:
        - match: "legacy-hardened"
          say: "The hardened manifest names a seccomp profile, which anyuid does not admit. Use `legacy.yaml`."
      hint: "`oc apply -f` and the file."
      run: "oc apply -f legacy.yaml"
      then: |
        Created, and without the Pod Security warning that the first root manifest got. The 4.21 documentation
        describes why: OpenShift sets a project's Pod Security warning level from the SCCs its ServiceAccounts may
        use, and `legacy-sa` may now use `anyuid`. After the revoke, later in this lesson, the warning comes back.
    - kind: show
      id: rollout-legacy
      run: "oc rollout status deploy/legacy --timeout=120s"
      notice: "`successfully rolled out`: the pod was admitted."
    - kind: show
      id: chosen-scc
      run: "oc get pods -l app=legacy -o 'custom-columns=NAME:.metadata.name,SA:.spec.serviceAccountName,SCC:.metadata.annotations.openshift\\.io/scc,PHASE:.status.phase'"
      notice: "The pod runs as `legacy-sa` and was admitted by `anyuid`. The annotation is the record of which SCC supplied its settings."
    - kind: show
      id: legacy-id
      run: "oc exec deploy/legacy -- id"
      notice: "`uid=0(root)`: what the exception was for."
    - kind: ask
      id: guess-seccomp
      guess: true
      prompt: "vendor-app runs under restricted-v2 with RuntimeDefault; legacy runs under anyuid with no profile named. Which has a seccomp filter?"
      choices:
        - text: Both, because every container gets the runtime's default filter
          why: The default filter is applied when the pod asks for it. The next two steps read the kernel's answer.
        - text: Only vendor-app
          why: Only vendor-app's manifest names `RuntimeDefault`. The next two steps confirm it.
        - text: Neither, because seccomp needs a privileged container
          why: seccomp filters are set up by the runtime for ordinary containers. The next two steps read them.
      answer: 1
    - kind: show
      id: vendor-seccomp
      body: "The price of dropping the seccomp line. `Seccomp:` in a process's status is 0 with no filter and 2 with a filter. First the vendor app, admitted by restricted-v2:"
      run: "oc exec deploy/vendor-app -- grep '^Seccomp:' /proc/1/status"
      notice: "2: a seccomp filter is active."
    - kind: show
      id: legacy-seccomp
      run: "oc exec deploy/legacy -- grep '^Seccomp:' /proc/1/status"
      notice: |
        `0`: no seccomp filter at all. That is the price of fitting `anyuid` here: the pod runs as root without the
        syscall filter the vendor app has. A custom SCC that allows UID 0 and requires `runtime/default` would keep
        it; the next lesson shows how a custom SCC is built and granted.
    - kind: show
      id: default-refused
      body: "The exception follows the ServiceAccount. A pod that asks for root as the project's `default` ServiceAccount, created directly by the developer:"
      run: "oc create -f root-pod.yaml"
      notice: "Forbidden, with the same reasons as the first rejection: `anyuid` is `not usable by user or serviceaccount`, neither by the developer nor by `default`."
    - kind: ask
      id: revoke-running
      prompt: The anyuid binding is removed. What happens to pods already running under anyuid?
      choices:
        - text: They immediately change to the project UID
          why: SCC admission does not rewrite a running pod after an RBAC change.
        - text: They are evicted by the permission check
          why: SCC access is checked at admission, not by a continuous eviction controller.
        - text: They keep their admitted settings
          why: Revocation affects future creation requests. The next steps show a running pod staying and its replacement refused.
      answer: 2
    - kind: show
      id: revoke
      body: "The administrator takes the exception back:"
      run: "oc adm policy remove-scc-from-user anyuid -z legacy-sa -n academy-lesson-f-scc"
      notice: "`removed: \"legacy-sa\"`."
    - kind: try
      id: restart-legacy
      body: "As the developer, ask the Deployment `legacy` for new pods without changing its manifest."
      accept:
        - "oc rollout restart deploy/legacy"
        - "oc rollout restart deployment/legacy"
        - "oc rollout restart deployment legacy"
        - "oc rollout restart deploy legacy"
        - "oc rollout restart deployments/legacy"
      hints:
        - match: "delete pod"
          say: "Deleting the pod also makes a new one, but the task asks the Deployment for a fresh rollout: `oc rollout restart`."
        - match: "rollout (status|undo|history)"
          say: "The subcommand that starts new pods is `restart`."
        - match: "scale"
          say: "Scaling changes the number of pods. A restart replaces them."
      hint: "`oc rollout restart` and the Deployment."
      run: "oc rollout restart deploy/legacy"
      then: |
        `restarted`, and the Pod Security warning is back (`runAsUser=0`, the missing seccomp profile): with the
        grant gone, the project's warning level returned to `restricted`. A new ReplicaSet now tries to create a pod.
    - kind: show
      id: restart-refused
      body: "As the developer, wait for the new pod, for at most thirty seconds. With the grant gone, this is expected to time out:"
      run: "oc rollout status deploy/legacy --timeout=30s"
      notice: "`0 out of 1 new replicas have been updated`, then `timed out`: no new pod becomes available. The next steps show what is still running and why the replacement is missing."
    - kind: show
      id: old-pod-stays
      run: "oc get pods -l app=legacy -o 'custom-columns=NAME:.metadata.name,SA:.spec.serviceAccountName,SCC:.metadata.annotations.openshift\\.io/scc,PHASE:.status.phase'"
      notice: "The same pod, `legacy-988f579f-56gqk`, is still `Running` under `anyuid`. A rolling update removes it only when a replacement is ready, and none can be created."
    - kind: show
      id: rs-after-revoke
      run: "oc get rs -l app=legacy"
      notice: "The new ReplicaSet `legacy-6d48845d68` wants one pod and has none, like the vendor app at the start; the old one still runs its pod."
    - kind: show
      id: rs-refusal
      body: "As the developer, read the refusal itself: the FailedCreate events of the project's ReplicaSets, keeping the header and the lines of the `legacy` ReplicaSets, so the generated name is not needed:"
      run: "oc get events --field-selector involvedObject.kind=ReplicaSet,reason=FailedCreate -o custom-columns=REPLICASET:.involvedObject.name,MESSAGE:.message | grep -E '^(REPLICASET|legacy-)'"
      notice: |
        The new ReplicaSet's pod is `forbidden: unable to validate against any security context constraint`, the
        same message as the vendor app's at the start: `anyuid` is again `not usable by user or serviceaccount` for
        `legacy-sa`, and `restricted-v2` refuses UID 0. The running pod was admitted before the revoke and keeps
        its settings; its replacement is checked now, without the grant.
    - kind: teach
      id: user-namespaces
      title: A separate user namespace
      body: |
        OpenShift 4.21 also provides `restricted-v3`, available to authenticated users. It requires `hostUsers: false`:
        a **Linux user namespace** maps container UIDs to different, unprivileged UIDs on the node. Without that
        request, a pod cannot use restricted-v3 and normally uses restricted-v2, which is why `restricted-v3` refused
        the root pods in this lesson with `Host Users must be set to false`.

        This mapping does not grant root inside a restricted-v3 container; its SCC still constrains container UIDs.
        Compatible storage must support ID-mapped mounts.
    - kind: reflect
      id: explain-rejection
      prompt: Explain why a Deployment has no pod to describe after an SCC rejection, and where you would fix a
        root-only image.
      model: |
        The ReplicaSet's creation request was refused before a pod was stored, so its FailedCreate event holds the
        evidence. Remove the fixed root UID from the template and adapt writable image paths for the assigned UID;
        request an exception only if the requirement cannot be removed, for a dedicated ServiceAccount in one
        project, after reviewing which SCC would admit the manifest and why.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can tell an unavailable SCC from an incompatible setting, review a manifest before applying it, read
        which SCC admitted a pod, and follow an exception from request to grant to removal, knowing that running
        pods keep what they were admitted with.

        [ServiceAccounts and SCC exceptions](/lab/lab.sa-scc) practises the lifecycle on your own. Next,
        [Run privileged workloads safely](/lesson/n.privileged-workloads) takes the hardest case: a node agent that
        needs host access.
  sections:
    - id: scc-controls
      title: SCC controls and common repairs
      depth: true
      body: |
        | Area | restricted-v2 rule | Repair to consider |
        |---|---|---|
        | runAsUser | MustRunAsRange; default minimum project UID | omit a copied fixed UID; adapt the image |
        | SELinux | MustRunAs; project MCS level | use storage with compatible labels |
        | fsGroup | MustRunAs; allocated project group | check namespace group allocation |
        | supplementalGroups | RunAsAny | choose only groups needed for storage |
        | capabilities | drop ALL; NET_BIND_SERVICE may be added | prefer a high application port, such as 8080 |
        | privilege escalation | unset or false | remove a request for true |
        | privileged container | forbidden | remove it; identify the actual operation needed |
        | host network, PID, IPC, ports | forbidden | use cluster networking |
        | hostPath | forbidden | choose an appropriate PVC or ConfigMap |
        | seccomp | runtime/default | investigate a specific blocked syscall |
        | read-only root filesystem | not required | a custom SCC can require it |

        restricted-v2 allows volume types such as configMap, secret, projected, emptyDir, CSI and
        persistentVolumeClaim; consult the installed SCC for the complete version-specific list.
        `nonroot-v2` permits fixed nonzero UIDs; `anyuid` permits UID 0 but keeps the other restrictions, and on
        OpenShift 4.21 it lists no allowed seccomp profile, so a pod that names one does not fit it. The hostnetwork
        and hostmount families relax host access; `privileged` allows the broadest access. These require explicit
        grants. A low port can require NET_BIND_SERVICE depending on the privileged-port sysctl; NET_ADMIN is a
        different capability and restricted-v2 does not allow adding it.

        Namespace allocation annotations are `openshift.io/sa.scc.uid-range`,
        `openshift.io/sa.scc.supplemental-groups` and `openshift.io/sa.scc.mcs`.
    - id: access-and-admission
      title: Access reviews and independent admission checks
      depth: true
      body: |
        | Evidence | Meaning |
        |---|---|
        | ReplicaSet FailedCreate, no pod | admission refused the requested pod |
        | openshift.io/scc on a pod | one SCC admitted that pod |
        | scc-subject-review, run as yourself | which SCC would admit the manifest for you and its ServiceAccount |
        | scc-subject-review -z | the ServiceAccount alone, without its groups |
        | RBAC can-i result | RBAC use grants in the specified scope |
        | SCC users and groups fields | direct grants, with cluster-wide scope |
        | running pod, failed file write | investigate runtime checks rather than admission |

        A required `openshift.io/required-scc` annotation on a workload's pod template pins admission to that SCC:
        the identity must be allowed to use it and the pod must satisfy it. Pinning grants no access, and it protects
        a workload from silently moving to another SCC when someone grants one with a higher priority.
        The scc-review subcommand asks which ServiceAccounts could create a Pod; scc-subject-review checks its
        subject. Both are reviews, not test executions of the image.

        Kubernetes Pod Security Admission is independent of SCCs. On this cluster user projects are labelled to warn
        and audit at the `restricted` level and do not enforce it, which is why the recorded `oc apply` printed a
        warning and still created the Deployment. Namespace label synchronisation adjusts those labels to the SCCs
        the project's ServiceAccounts may use. An explicit enforce label can also reject a pod, so an SCC admission
        success does not exempt a pod from other admission policies.
  review:
    - q: Where do you find the reason when a Deployment has zero pods because of SCC?
      a: 'Events of its ReplicaSet (FailedCreate: unable to validate against any security context constraint), with oc describe rs or oc get events --field-selector reason=FailedCreate.'
    - q: How is permission to use an SCC granted?
      a: 'Through RBAC: the use verb on the securitycontextconstraints resource, bound to the pod''s ServiceAccount. oc adm policy add-scc-to-user <scc> -z <sa> -n <project> creates a RoleBinding to system:openshift:scc:<scc>.'
    - q: Which annotation tells you which SCC admitted a pod?
      a: openshift.io/scc.
    - q: In what order does admission try the SCCs a pod may use?
      a: Highest priority first, then most restrictive first, then by name; the first one that validates wins.
    - q: Whose SCCs count for pods created by a Deployment?
      a: Only the pod's ServiceAccount's (for a pod created directly, the creating user's too).
    - q: Why can an administrator's scc-subject-review name privileged for a pod that only needs root?
      a: The administrator may use every SCC, so the review names the first one that fits. If the pod names a seccomp profile, anyuid (which lists none) does not fit, and privileged does. Read why before granting.
    - q: You granted or revoked an SCC. Why do the running pods not change?
      a: The SCC is chosen once, at pod creation. New pods are checked against the access that exists when they are created.
  labs:
    - lab.container-anatomy
    - lab.sa-scc
  limits: |
    The recording runs on single-node OpenShift Local, in a project created for the recording. The containers only
    sleep: they stand for applications whose requirements the lesson describes. An exception granted directly in an
    SCC's `users` or `groups` field is not shown, because it changes a cluster-wide object; the 4.21 documentation
    uses RBAC grants, as here.
  enterprise: |
    SCC exceptions are security decisions: they need an owner, a justification, an expiry or review date, and
    a dedicated ServiceAccount so the exception does not spread to other workloads.
  references:
    - title: 'OpenShift 4.21: Managing security context constraints'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/managing-pod-security-policies
    - title: 'OpenShift 4.21: Understanding and managing pod security admission'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/understanding-and-managing-pod-security-admission
    - title: 'OpenShift 4.21: Running pods in Linux user namespaces'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/nodes/index#nodes-pods-user-namespaces-configuring_nodes-pods-user-namespaces
    - title: 'oc 4.21 source: add-scc-to-user and remove-scc-from-user'
      url: https://github.com/openshift/oc/blob/release-4.21/pkg/cli/admin/policy/modify_scc.go
    - title: 'Kubernetes: Pod Security Admission'
      url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
  commands:
