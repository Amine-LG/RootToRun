    vendor-app.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vendor-app
        labels: {app: vendor-app}
      spec:
        replicas: 1
        selector:
          matchLabels: {app: vendor-app}
        template:
          metadata:
            labels: {app: vendor-app}
          spec:
            terminationGracePeriodSeconds: 2
            securityContext:
              runAsUser: 0                 # copied from the vendor's example
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              imagePullPolicy: IfNotPresent
              command: ["sleep", "infinity"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
