    - {cmd: "oc get events --field-selector reason=FailedCreate", as: developer, meaning: "the same refusals in the project's event list"}
    - {cmd: "oc get project academy-lesson-f-scc -o jsonpath='{.metadata.annotations.openshift\\.io/sa\\.scc\\.uid-range}{\"\\n\"}'", as: developer, meaning: "the project's UID range"}
    - {cmd: "oc adm policy scc-subject-review -f vendor-app.yaml", as: developer, meaning: "no SCC would admit the manifest as written"}
    - {cmd: "oc adm policy scc-subject-review -f vendor-app-fixed.yaml", as: developer, meaning: "restricted-v2 would admit the fixed manifest"}
    - {cmd: "oc adm policy scc-subject-review -z default -f vendor-app-fixed.yaml", as: developer, meaning: "with -z, the ServiceAccount is checked without its groups"}
    - {cmd: "oc apply -f vendor-app-fixed.yaml", as: developer, meaning: "the fixed template: no fixed UID, runAsNonRoot true"}
    - {cmd: "oc rollout status deploy/vendor-app --timeout=120s", as: developer, meaning: "the new pod is admitted"}
    - {cmd: "oc exec deploy/vendor-app -- id", as: developer, meaning: "the first UID of the project's range, group 0"}
    - {cmd: "oc get pods -l app=vendor-app -o 'custom-columns=NAME:.metadata.name,SCC:.metadata.annotations.openshift\\.io/scc'", as: developer, meaning: "restricted-v2 admitted it"}
    - {cmd: "oc create serviceaccount legacy-sa", as: developer, meaning: "a dedicated identity for the component that needs an exception"}
    - {cmd: "oc adm policy scc-subject-review -f legacy-hardened.yaml -n academy-lesson-f-scc", as: admin, meaning: "for an administrator, the SCC admission would choose: privileged, because of the seccomp line"}
    - {cmd: "oc get scc anyuid restricted-v2 privileged -o custom-columns=NAME:.metadata.name,PRIORITY:.priority,RUNASUSER:.runAsUser.type,SECCOMP:.seccompProfiles,PRIVILEGED:.allowPrivilegedContainer,HOSTPID:.allowHostPID", as: admin, meaning: "anyuid lists no seccomp profile"}
    - {cmd: "oc adm policy scc-subject-review -f legacy.yaml -n academy-lesson-f-scc", as: admin, meaning: "without the seccomp line, anyuid fits"}
    - {cmd: "oc adm policy add-scc-to-user anyuid -z legacy-sa -n academy-lesson-f-scc", as: admin, meaning: "the exception: a RoleBinding in this project for one ServiceAccount"}
    - {cmd: "oc get rolebinding system:openshift:scc:anyuid -n academy-lesson-f-scc -o wide", as: admin, meaning: "the binding the grant created"}
    - {cmd: "oc apply -f legacy.yaml", as: developer, meaning: "the component that needs UID 0"}
    - {cmd: "oc rollout status deploy/legacy --timeout=120s", as: developer, meaning: "admitted"}
    - {cmd: "oc get pods -l app=legacy -o 'custom-columns=NAME:.metadata.name,SA:.spec.serviceAccountName,SCC:.metadata.annotations.openshift\\.io/scc,PHASE:.status.phase'", as: developer, meaning: "admitted by anyuid, running as legacy-sa"}
    - {cmd: "oc exec deploy/legacy -- id", as: developer, meaning: "uid 0"}
    - {cmd: "oc exec deploy/vendor-app -- grep '^Seccomp:' /proc/1/status", as: developer, meaning: "the seccomp mode under restricted-v2"}
    - {cmd: "oc exec deploy/legacy -- grep '^Seccomp:' /proc/1/status", as: developer, meaning: "the seccomp mode under anyuid with no profile named"}
    - {cmd: "oc create -f root-pod.yaml", as: developer, expect: fail, meaning: "the default ServiceAccount still cannot run as root"}
    - {cmd: "oc adm policy remove-scc-from-user anyuid -z legacy-sa -n academy-lesson-f-scc", as: admin, meaning: "the exception is taken back"}
    - {cmd: "oc rollout restart deploy/legacy", as: developer, meaning: "ask for new pods"}
    - {cmd: "oc rollout status deploy/legacy --timeout=30s", as: developer, expect: fail, meaning: "the replacement pod is refused"}
    - {cmd: "oc get pods -l app=legacy -o 'custom-columns=NAME:.metadata.name,SA:.spec.serviceAccountName,SCC:.metadata.annotations.openshift\\.io/scc,PHASE:.status.phase'", as: developer, meaning: "the running pod keeps anyuid"}
    - {cmd: "oc get rs -l app=legacy", as: developer, meaning: "the new ReplicaSet has no pod"}
    - {cmd: "oc get events --field-selector involvedObject.kind=ReplicaSet,reason=FailedCreate -o custom-columns=REPLICASET:.involvedObject.name,MESSAGE:.message | grep -E '^(REPLICASET|legacy-)'", as: developer, meaning: "the SCC refusal of the replacement pod, after the revoke"}
