    - {cmd: "oc rollout status deploy/vendor-app --timeout=20s", as: developer, expect: fail, meaning: "times out: no pod becomes available"}
    - {cmd: "oc get deploy,rs,pods", as: developer, meaning: "the ReplicaSet wants one pod and has none"}
