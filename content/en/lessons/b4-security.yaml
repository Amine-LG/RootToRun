  experiment:
    id: X-SCC-01
    objective: "Show an SCC rejection and its repair as the developer, then have the administrator grant anyuid to one ServiceAccount in one project, prove which SCC admitted the pod, revoke the grant, and leave no SCC binding behind."
    changes:
      - "RoleBinding system:openshift:scc:anyuid in project academy-lesson-f-scc, naming only the ServiceAccount legacy-sa (created by the administrator, removed)"
      - "Project academy-lesson-f-scc, the developer's temporary lesson project, with the Deployments vendor-app and legacy and the ServiceAccount legacy-sa (deleted by the rollback)"
    preflight:
      - {cmd: "oc get clusterrole system:openshift:scc:anyuid -o name"}
      - cmd: |-
          ans=$(oc auth can-i use securitycontextconstraints/anyuid --as=system:serviceaccount:academy-lesson-f-scc:legacy-sa -n academy-lesson-f-scc 2>/dev/null)
          test "$ans" = no
      - cmd: |-
          found=$(oc get clusterrolebinding system:openshift:scc:anyuid --ignore-not-found -o name) || exit 1
          test -z "$found"
    snapshot:
      - "oc get scc -o json | jq -S '[.items[] | {name:.metadata.name,body:del(.metadata,.status)}] | sort_by(.name)'"
      - "oc get clusterrolebindings -o json | jq -S '[.items[] | {name:.metadata.name,roleRef,subjects}] | sort_by(.name)'"
      - "oc get clusterrole system:openshift:scc:anyuid -o jsonpath='{.rules}'"
    rollback:
      - "oc delete rolebinding system:openshift:scc:anyuid -n academy-lesson-f-scc --ignore-not-found"
      - "oc delete project academy-lesson-f-scc --ignore-not-found --wait=false"
    settle:
      - |-
        for i in $(seq 60); do
          found=$(oc get namespace academy-lesson-f-scc --ignore-not-found -o name) || exit 1
          test -z "$found" && exit 0
          sleep 5
        done
        exit 1
    verify:
      - cmd: |-
          found=$(oc get namespace academy-lesson-f-scc --ignore-not-found -o name) || exit 1
          test -z "$found"
      - cmd: |-
          ans=$(oc auth can-i use securitycontextconstraints/anyuid --as=system:serviceaccount:academy-lesson-f-scc:legacy-sa -n academy-lesson-f-scc 2>/dev/null)
          test "$ans" = no
- id: n.selinux-node
  title: SELinux, seccomp and the node underneath
  subtitle: "The checks after admission, read inside the pod and on the node"
  module: b3-workload-security
  mode: GUIDED_INVESTIGATION
  minutes: 30
  level: 2
  supports: "OpenShift 4.21 on RHCOS, Kubernetes 1.34 security contexts. Every command was run on OpenShift Local 4.21: by the ordinary user developer, in a temporary project of their own, and by the cluster administrator kubeadmin, who read the node through oc debug node/crc with read-only commands. The debug pods ran in a namespace created for the recording and deleted afterwards; the node's configuration was only read, and the cluster was checked for leftover debug namespaces and pods (experiment X-NODE-01)."
  concepts:
    - linux.selinux
    - container.security
    - sec.scc
  prerequisites:
    - f.scc
    - e.storage
  objective: |
    Explain the four independent locks on every OpenShift container (UID and file permissions, capabilities,
    seccomp, SELinux), read the SELinux level OpenShift gives each project inside a pod and on the node, and recognise
    a "Permission denied" that file permissions cannot explain.
  record_on: cluster-admin
  flow:
    - kind: teach
      id: situation
      title: The pod runs, but a write fails
      body: |
        Your pod starts successfully, but the application cannot write its data. A colleague changes the file mode
        to allow everyone and the error remains. Which permission check did that change actually address?

        [Security Context Constraints](/lesson/f.scc) explained admission. This lesson follows the Linux checks
        after admission: file permissions, capabilities, seccomp and SELinux. Everything here ran on OpenShift Local
        4.21: the ordinary user `developer` read the evidence inside a pod of their project,
        `academy-lesson-n-selinux-node`, and the cluster administrator `kubeadmin` read the same labels on the node.
    - kind: teach
      id: permissions
      title: Start with the process identity
      body: |
        **Discretionary access control (DAC)** is the UID, group and mode-bit check from Linux file permissions.
        It is one check on access, not the whole security model. Under restricted-v2, OpenShift assigns a project
        UID; images using the group-0 convention give that user access through the group permission bits.

        First read the actual identity, then the directory's owner and mode. Do not infer privileges from the
        word `root` in a group name.
    - kind: show
      id: box-manifest
      body: "The developer runs a small Deployment with an `emptyDir` volume, `box-data`, mounted at `/data`:"
      code: |
        spec:
          template:
            spec:
              securityContext:
                runAsNonRoot: true
              containers:
              - name: box
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                # a copy of sleep with a name that is easy to find among the node's processes
                command: ["/bin/sh", "-c", "cp /bin/sleep /tmp/box-app && exec /tmp/box-app infinity"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                  seccompProfile: {type: RuntimeDefault}
                volumeMounts:
                - {name: box-data, mountPath: /data}
              volumes:
              - {name: box-data, emptyDir: {}}
      caption: box.yaml (the pod template, abridged)
    - kind: ask
      id: guess-uid
      guess: true
      recalls: f.scc
      prompt: "The manifest sets runAsNonRoot but no runAsUser, and the image's default user is root. Which UID will the process have?"
      choices:
        - text: 0, the image's default user
          why: runAsNonRoot forbids UID 0, and restricted-v2 sets a UID of its own. The next steps show which.
        - text: The first UID of the project's range
          why: restricted-v2 fills in runAsUser from the project's range when the pod sets none. The next steps show it.
        - text: A random UID at every start
          why: The UID comes from the project's allocation and stays the same. The next steps show it.
      answer: 1
    - kind: show
      id: apply-box
      run: "oc apply -f box.yaml"
      notice: "Created, with no warning: the pod asks for nothing that restricted-v2 refuses."
    - kind: show
      id: rollout-box
      run: "oc rollout status deploy/box --timeout=120s"
      notice: "`successfully rolled out`."
    - kind: show
      id: identity
      run: "oc exec deploy/box -- id"
      notice: |
        `uid=1001540000`, not 0: a UID from the project's allocated range, which restricted-v2 fills in when the pod
        sets none. This lesson does not read the range; [Security Context Constraints](/lesson/f.scc) does, and shows
        that the default is its first UID. `gid=0(root)` names a group, not the root user. Another project has a
        different allocation.
    - kind: ask
      id: recall-group
      prompt: The process above tries to create a file in a directory owned by root:root with mode 0755. Which permission set applies?
      recalls: f.scc
      choices:
        - text: Others r-x because the UID is large
          why: Group membership is checked before the others bits; the numeric size of a UID has no privilege meaning.
        - text: Group r-x
          why: The UID differs from the owner but the process belongs to group 0, so the group bits apply and do
            not allow writing.
        - text: Owner rwx because the group is root
          why: A matching group does not make the UID match the file owner.
      answer: 1
    - kind: teach
      id: selinux
      title: Labels are an independent check
      body: |
        **SELinux** applies mandatory access control: the node's policy checks labels on the process and on the
        object it tries to access, independently of mode bits. OpenShift nodes run RHCOS (Red Hat Enterprise Linux
        CoreOS), which keeps SELinux enforcing; disabling it is unsupported.

        A label has the form `user:role:type:level`. The **type** describes the policy domain: ordinary confined
        containers use `container_t`, and their writable files commonly use `container_file_t`.
        Passing the DAC check does not grant access to a file with an incompatible SELinux label.
    - kind: ask
      id: mode-prediction
      prompt: Back to the opening case. After `chmod 777` on the data directory, the write still fails with `Permission denied`. What do you inspect next?
      choices:
        - text: The SELinux labels of the process and the directory
          why: Mode bits now allow everyone, so DAC is no longer the refusal. SELinux compares labels independently; the next steps show how to read them.
        - text: The directory's owner, to `chown` it to the pod's UID
          why: Ownership belongs to the same DAC check that mode 777 already opened to everyone. Changing the owner cannot satisfy a label check.
        - text: The capabilities, to add `DAC_OVERRIDE` to the container
          why: '`DAC_OVERRIDE` bypasses mode bits, which mode 777 already opened. It does not bypass SELinux, which is a separate check.'
      answer: 0
    - kind: teach
      id: mcs
      title: A project gets its own categories
      body: |
        The label's **level** includes Multi-Category Security (MCS) categories. For ordinary restricted-v2 pods,
        OpenShift supplies the project's level from the annotation `openshift.io/sa.scc.mcs`. Pods in the same
        project normally share it; another project receives a different level. The node's policy uses those
        categories to separate container data even when processes share the type `container_t`.

        Read the project's allocation and the admitted pod's `seLinuxOptions` together. Matching levels are necessary
        for access but not sufficient: the mode bits and the requested operation must allow it too.
    - kind: show
      id: read-labels
      body: "The developer reads the level allocated to their project:"
      run: "oc get project academy-lesson-n-selinux-node -o jsonpath='{.metadata.annotations.openshift\\.io/sa\\.scc\\.mcs}{\"\\n\"}'"
      notice: "`s0:c39,c29`: sensitivity `s0` and two categories, `c39` and `c29`. That is this project's level."
    - kind: show
      id: pod-level
      body: "SCC admission copied it into the pod:"
      run: "oc get pods -l app=box -o jsonpath='{.items[0].spec.securityContext.seLinuxOptions}{\"\\n\"}'"
      notice: "`{\"level\":\"s0:c39,c29\"}`: the same level, in the pod's `seLinuxOptions`. The manifest never asked for it."
    - kind: show
      id: process-label
      body: "A process can read its own label in `/proc/self/attr/current`:"
      run: "oc exec deploy/box -- cat /proc/self/attr/current"
      notice: |
        `system_u:system_r:container_t:s0:c29,c39`: the confined container type and the project's categories. The
        kernel prints them in ascending order, `c29,c39`, where the annotation said `c39,c29`; they are the same pair.
    - kind: ask
      id: guess-file-label
      guess: true
      prompt: "This process writes a new file on its emptyDir volume. Which categories will the file's label carry?"
      choices:
        - text: None, only `s0`, like system files
          why: Files a confined container creates on its volume are labelled for it. The next step shows the label.
        - text: The project's categories, `c29,c39`
          why: The volume was labelled with the pod's level, and new files inherit it. The next step shows it.
        - text: A new pair, chosen for each file
          why: Categories belong to the project, not to files. The next step shows the label.
      answer: 1
    - kind: show
      id: file-label
      body: "Files the container writes on its volume carry a label too. `ls -Z` prints it:"
      run: "oc exec deploy/box -- sh -c 'echo saved > /data/report.txt && ls -Z /data'"
      notice: "`system_u:object_r:container_file_t:s0:c29,c39 report.txt`: the container file type with the same categories. The file belongs to this project's level."
    - kind: try
      id: inspect-other-pod
      body: Pod worker-abc exists in project billing. Type a command to read its full YAML, including the admitted
        security context.
      accept:
        - oc get pod worker-abc -n billing -o yaml
        - oc get pod worker-abc -o yaml -n billing
        - oc get pod worker-abc --namespace=billing --output=yaml
        - oc get pod worker-abc --output=yaml --namespace=billing
        - oc get pod worker-abc --namespace billing --output yaml
        - oc get pod worker-abc --output yaml --namespace billing
        - oc get pods worker-abc -n billing -o yaml
        - oc get pods worker-abc -o yaml -n billing
        - oc get pods worker-abc --namespace=billing --output=yaml
        - oc get pods worker-abc --output=yaml --namespace=billing
        - oc get pods worker-abc --namespace billing --output yaml
        - oc get pods worker-abc --output yaml --namespace billing
        - oc get pod/worker-abc -n billing -o yaml
        - oc get pod/worker-abc -o yaml -n billing
        - oc get pod/worker-abc --namespace=billing --output=yaml
        - oc get pod/worker-abc --output=yaml --namespace=billing
        - oc get pod/worker-abc --namespace billing --output yaml
        - oc get pod/worker-abc --output yaml --namespace billing
        - oc get pods/worker-abc -n billing -o yaml
        - oc get pods/worker-abc -o yaml -n billing
        - oc get pods/worker-abc --namespace=billing --output=yaml
        - oc get pods/worker-abc --output=yaml --namespace=billing
        - oc get pods/worker-abc --namespace billing --output yaml
        - oc get pods/worker-abc --output yaml --namespace billing
        - oc get pod worker-abc -n billing -o=yaml
        - oc get pod worker-abc -o=yaml -n billing
        - oc get pod worker-abc -n billing --output yaml
        - oc get pod worker-abc --output yaml -n billing
        - oc get pod worker-abc -n billing --output=yaml
        - oc get pod worker-abc --output=yaml -n billing
        - oc get pod worker-abc --namespace billing -o yaml
        - oc get pod worker-abc -o yaml --namespace billing
        - oc get pod worker-abc --namespace billing -o=yaml
        - oc get pod worker-abc -o=yaml --namespace billing
        - oc get pod worker-abc --namespace billing --output=yaml
        - oc get pod worker-abc --output=yaml --namespace billing
        - oc get pod worker-abc --namespace=billing -o yaml
        - oc get pod worker-abc -o yaml --namespace=billing
        - oc get pod worker-abc --namespace=billing -o=yaml
        - oc get pod worker-abc -o=yaml --namespace=billing
        - oc get pod worker-abc --namespace=billing --output yaml
        - oc get pod worker-abc --output yaml --namespace=billing
        - oc get pods worker-abc -n billing -o=yaml
        - oc get pods worker-abc -o=yaml -n billing
        - oc get pods worker-abc -n billing --output yaml
        - oc get pods worker-abc --output yaml -n billing
        - oc get pods worker-abc -n billing --output=yaml
        - oc get pods worker-abc --output=yaml -n billing
        - oc get pods worker-abc --namespace billing -o yaml
        - oc get pods worker-abc -o yaml --namespace billing
        - oc get pods worker-abc --namespace billing -o=yaml
        - oc get pods worker-abc -o=yaml --namespace billing
        - oc get pods worker-abc --namespace billing --output=yaml
        - oc get pods worker-abc --output=yaml --namespace billing
        - oc get pods worker-abc --namespace=billing -o yaml
        - oc get pods worker-abc -o yaml --namespace=billing
        - oc get pods worker-abc --namespace=billing -o=yaml
        - oc get pods worker-abc -o=yaml --namespace=billing
        - oc get pods worker-abc --namespace=billing --output yaml
        - oc get pods worker-abc --output yaml --namespace=billing
        - oc get pod/worker-abc -n billing -o=yaml
        - oc get pod/worker-abc -o=yaml -n billing
        - oc get pod/worker-abc -n billing --output yaml
        - oc get pod/worker-abc --output yaml -n billing
        - oc get pod/worker-abc -n billing --output=yaml
        - oc get pod/worker-abc --output=yaml -n billing
        - oc get pod/worker-abc --namespace billing -o yaml
        - oc get pod/worker-abc -o yaml --namespace billing
        - oc get pod/worker-abc --namespace billing -o=yaml
        - oc get pod/worker-abc -o=yaml --namespace billing
        - oc get pod/worker-abc --namespace billing --output=yaml
        - oc get pod/worker-abc --output=yaml --namespace billing
        - oc get pod/worker-abc --namespace=billing -o yaml
        - oc get pod/worker-abc -o yaml --namespace=billing
        - oc get pod/worker-abc --namespace=billing -o=yaml
        - oc get pod/worker-abc -o=yaml --namespace=billing
        - oc get pod/worker-abc --namespace=billing --output yaml
        - oc get pod/worker-abc --output yaml --namespace=billing
        - oc get pods/worker-abc -n billing -o=yaml
        - oc get pods/worker-abc -o=yaml -n billing
        - oc get pods/worker-abc -n billing --output yaml
        - oc get pods/worker-abc --output yaml -n billing
        - oc get pods/worker-abc -n billing --output=yaml
        - oc get pods/worker-abc --output=yaml -n billing
        - oc get pods/worker-abc --namespace billing -o yaml
        - oc get pods/worker-abc -o yaml --namespace billing
        - oc get pods/worker-abc --namespace billing -o=yaml
        - oc get pods/worker-abc -o=yaml --namespace billing
        - oc get pods/worker-abc --namespace billing --output=yaml
        - oc get pods/worker-abc --output=yaml --namespace billing
        - oc get pods/worker-abc --namespace=billing -o yaml
        - oc get pods/worker-abc -o yaml --namespace=billing
        - oc get pods/worker-abc --namespace=billing -o=yaml
        - oc get pods/worker-abc -o=yaml --namespace=billing
        - oc get pods/worker-abc --namespace=billing --output yaml
        - oc get pods/worker-abc --output yaml --namespace=billing
        - oc -n billing get pod worker-abc -o yaml
        - oc --namespace=billing get pod worker-abc --output=yaml
      hints:
        - match: ^oc logs
          say: Application logs do not show the whole admitted pod spec; retrieve the object as YAML.
        - match: -n shop|--namespace[= ]shop
          say: This Pod belongs to billing; use its project.
        - match: -o json
          say: JSON contains the settings too, but this task asks for YAML so it can be compared with the example.
        - match: ^(?!.*(^| )(-n|--namespace)([ =]|$)).*$
          say: Without -n billing the command looks for worker-abc in your current project. The Pod is in billing.
      hint: Retrieve the Pod with get, select billing with -n, and choose YAML with -o.
      then: |
        The YAML would show the pod's admitted settings, including its SELinux level and seccomp profile. It would not
        prove that SELinux caused an application error.
    - kind: teach
      id: volumes
      title: A shared volume also has labels
      body: |
        SELinux labels live on files, so a volume carries them too, as `report.txt` showed. When a pod starts, the
        node can relabel the files of a volume with that pod's level, if the storage type supports it. If a pod from
        a second project relabels the same shared filesystem with its own categories, the first project's pods can
        lose access even though the file modes allow it. Other storage types handle labels differently; check the
        driver.

        When SELinux refuses an access, the node records an **AVC denial** (AVC stands for access vector cache) in
        its audit log: the process label, the file label and the refused operation. The application sees only
        "permission denied".

        [Storage](/lesson/e.storage) separates volume lifetime from pod lifetime, but a long-lived shared volume is not
        a safe way to share data between projects; prefer a service API. restricted-v2 also forbids hostPath volumes.
    - kind: ask
      id: shared-data
      prompt: "A shared filesystem was relabelled for billing. Now shop's pods get \"permission denied\" although the modes allow writes. What evidence do you request?"
      choices:
        - text: The application log repeated after another chmod
          why: The same error text cannot identify which kernel check refused the access, and mode bits do not change labels.
        - text: The ReplicaSet event for a rejected Pod
          why: These pods exist and are accessing files; admission rejection is a different stage.
        - text: The node denial with both labels
          why: An AVC denial names the process label, the file label and the refused operation. Differing categories alone suggest a cause but do not prove it.
      answer: 2
    - kind: teach
      id: capabilities
      title: Root operations are divided into capabilities
      body: |
        **Linux capabilities** split privileged operations into separate permissions. A process with UID 0 is
        not automatically given every capability inside a container. restricted-v2 drops all capabilities;
        a pod may explicitly add NET_BIND_SERVICE, but not NET_ADMIN.

        `/proc/1/status` describes process 1 of the container: `CapEff` holds its effective capabilities, `CapBnd`
        the most it could ever gain, and `Seccomp` its syscall filter mode (0 none, 2 a filter). A failed ownership
        change might involve capabilities; the error text alone still does not prove it.
    - kind: show
      id: effective-capabilities
      run: "oc exec deploy/box -- grep -E '^(CapEff|CapBnd|Seccomp)' /proc/1/status"
      notice: |
        `CapEff` and `CapBnd` are all zeros: no capability now, and none can be gained. `Seccomp: 2` with one filter
        (`Seccomp_filters: 1`): the runtime's default filter, which the pod asked for with `RuntimeDefault`, is active.
    - kind: ask
      id: choose-image-repair
      prompt: Startup runs chown on a root-owned directory without CAP_CHOWN. Which repair removes that runtime
        dependency?
      choices:
        - text: Change only the file SELinux type
          why: Labels are a separate check; they do not grant the missing ownership-change capability.
        - text: Prepare ownership in the image
          why: Build-time ownership and group-writable paths avoid needing a privileged ownership change at startup.
        - text: Add NET_BIND_SERVICE to the Pod
          why: That capability relates to binding low network ports, not changing file ownership.
      answer: 1
    - kind: teach
      id: seccomp
      title: A syscall can be filtered too
      body: |
        A **system call** asks the kernel to perform an operation. **seccomp** filters those calls.
        `seccompProfile.type: RuntimeDefault` selects the container runtime's default profile, rather than
        one universal list supplied by Kubernetes. Profiles and the resulting errors depend on the runtime.

        An unusual tool can fail while ordinary application work succeeds. Confirm the blocked call and the
        profile before proposing a narrowly scoped exception. Running as root does not remove a seccomp filter.
    - kind: teach
      id: node-access
      title: Evidence from the node
      body: |
        The developer has shown everything a pod can see. The node's own view (its SELinux mode, the label of a
        process among all the others, the label of a volume on disk, the audit log) needs the administrator.
        RHCOS nodes are not logged in to with SSH: `oc debug node/crc` starts a privileged pod on the node with the
        host's filesystem at `/host`, and `chroot /host` runs the node's own tools.

        That pod is privileged, so where it runs matters. Without `--to-namespace`, oc creates a temporary namespace
        for it and deletes it afterwards. Here the administrator creates the namespace, so the recording can prove
        that nothing is left. The default debug image, `tools`, would be pulled onto the node (about 240 MB
        compressed); `--image-stream` picks the `cli` image, which this node already has. Any image with `chroot`
        will do, because after `chroot /host` only the node's tools run.
    - kind: show
      id: debug-ns-manifest
      code: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: academy-x-node-debug
          annotations:
            openshift.io/node-selector: ""       # no project node selector: the debug pod may land on any node
          labels:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
            security.openshift.io/scc.podSecurityLabelSync: "false"
      caption: node-debug-ns.yaml
      notice: |
        The labels tell Pod Security Admission to expect privileged pods here and stop OpenShift from adjusting them,
        as oc does for its own temporary namespaces. Only the administrator can create pods in it.
    - kind: show
      id: create-debug-ns
      run: "oc create -f node-debug-ns.yaml"
      notice: "`namespace/academy-x-node-debug created`."
    - kind: try
      id: try-getenforce
      body: "As the administrator, ask node `crc` whether SELinux is enforcing, with the node's own `getenforce`."
      accept:
        - "oc debug node/crc -- chroot /host getenforce"
        - "oc debug node/crc --to-namespace=academy-x-node-debug -- chroot /host getenforce"
        - "oc debug node/crc --to-namespace academy-x-node-debug -- chroot /host getenforce"
        - "oc debug node/crc --image-stream=openshift/cli:latest -- chroot /host getenforce"
        - "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host getenforce"
        - "oc debug node/crc --image-stream=openshift/cli:latest --to-namespace=academy-x-node-debug -- chroot /host getenforce"
      hints:
        - match: "-- getenforce$"
          say: "Without `chroot /host`, the command runs from the debug image, not from the node. Put `chroot /host` before it."
        - match: "^oc debug crc"
          say: "Name the kind: `node/crc`. A bare name is looked up as a pod."
        - match: "^ssh|^oc rsh"
          say: "RHCOS nodes are reached with `oc debug node/crc`, not SSH or a pod shell."
        - match: "node-logs"
          say: "`oc adm node-logs` reads the node's journals. `getenforce` needs a command run on the node."
        - match: "setenforce"
          say: "`setenforce` changes the mode. The task only reads it, with `getenforce`."
      hint: "`oc debug node/crc`, then `--`, then `chroot /host` and the command."
      run: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host getenforce"
      then: |
        `Enforcing`. Around it, oc reported `Starting pod/crc-debug-sfg7t` and `Removing debug pod` when the command
        ended, and suggested `chroot /host`. The recording added `--to-namespace` and `--image-stream`, for the
        reasons above.
    - kind: show
      id: two-levels
      body: "Every namespace gets its own level, the new one included:"
      run: "oc get namespace academy-lesson-n-selinux-node academy-x-node-debug -o custom-columns='NAME:.metadata.name,MCS:.metadata.annotations.openshift\\.io/sa\\.scc\\.mcs'"
      notice: |
        `s0:c39,c29` and `s0:c39,c34`. They share `c39` but not the other category. A process may use a file only if
        the file's categories are all among its own, so neither namespace's pods can use the other's files.
    - kind: show
      id: node-process
      body: "The container's process among all the node's processes. `ps -eZ` prints each process's label:"
      run: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host sh -c 'ps -eZ | grep box-app'"
      notice: "One line among all the node's processes: `box-app`, PID 245701 on the node, labelled `container_t:s0:c29,c39`, the label the pod read from the inside."
    - kind: show
      id: node-files
      body: "The volume on the node's disk, under the kubelet's directory for the pod:"
      run: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host sh -c 'ls -Z /var/lib/kubelet/pods/*/volumes/kubernetes.io~empty-dir/box-data'"
      notice: "`report.txt`, labelled `container_file_t:s0:c29,c39` on the node's disk, as it was inside the pod."
    - kind: ask
      id: guess-debug-type
      guess: true
      prompt: "The debug pod read a process and a file of another namespace. Which SELinux type does it run as?"
      choices:
        - text: container_t, with its own namespace's categories
          why: With those categories it could not have read `c29,c39` files. The next step shows its type.
        - text: spc_t, which SELinux does not confine
          why: A privileged container runs as the super-privileged type. The next step shows it.
        - text: unconfined_t, like an administrator's login shell
          why: Containers get container types; the next step shows which one.
      answer: 1
    - kind: show
      id: debug-label
      body: "And the debug pod itself:"
      run: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host id -Z"
      notice: |
        `system_u:system_r:spc_t:s0`: the super-privileged container type, with no categories. SELinux does not
        confine it. That is why it can read every process and file on the node, and why only administrators may
        start it.
    - kind: show
      id: node-evidence
      body: "Finally, the audit log: did SELinux refuse anything in the last ten minutes?"
      run: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host ausearch -m AVC,USER_AVC -ts recent"
      notice: |
        `<no matches>`: no SELinux denial was logged in the last ten minutes, so nothing in this lesson was refused by
        SELinux. `ausearch` exits with 1 when it finds nothing, and oc passes that on as `error: non-zero exit code
        from debug container`. Here that is the answer, not a failure.
    - kind: ask
      id: confirmed-seccomp
      prompt: An administrator confirms a runtime seccomp profile blocks the tool's required call. What should the
        team do?
      choices:
        - text: Review an exception for that workload
          why: Confirm the need, then scope the exception or choose a tool that avoids the call.
        - text: Disable seccomp on all cluster nodes
          why: That removes protection from unrelated workloads to solve one requirement.
        - text: Run every container as root instead
          why: UID changes do not remove an installed syscall filter.
      answer: 0
    - kind: show
      id: debug-pods-gone
      body: "Each `oc debug` removed its pod when its command ended. The administrator checks, then deletes the namespace:"
      run: "oc get pods -n academy-x-node-debug"
      notice: "`No resources found`: each of the five debug pods was removed."
    - kind: show
      id: delete-debug-ns
      run: "oc delete namespace academy-x-node-debug"
      notice: "`namespace \"academy-x-node-debug\" deleted`. The node was only read."
    - kind: reflect
      id: explain-locks
      prompt: A colleague says Permission denied proves the image needs root. Give an evidence-based response.
      model: |
        First inspect the UID, groups, directory mode and ownership. If DAC allows the operation, compare the labels
        of the process and the file and ask for a node AVC record; check capabilities or the runtime seccomp profile
        when the failing operation requires them. One error string cannot identify which independent check refused
        it, and running as root removes none of the other three.
    - kind: teach
      id: what-next
      title: What you can do now
      body: |
        You can read an admitted pod's identity, labels, capabilities and seccomp mode from the inside, read the same
        labels on the node as an administrator without leaving anything behind, and tell file permissions from
        SELinux, capabilities and seccomp.
        [Container anatomy](/lab/lab.container-anatomy) lets you inspect a container on your own.

        Next, [Effective permissions are paths](/lesson/l.access-paths) turns from what a container may do to who
        may act on the cluster, and why a permission can arrive by more than one path.
  sections:
    - id: four-checks
      title: Runtime checks and useful evidence
      depth: true
      body: |
        | Check | Question | Evidence and repair |
        |---|---|---|
        | DAC | do UID, groups and modes allow the access? | inspect id and directory modes; fix writable image paths |
        | capabilities | is this privileged operation allowed? | inspect CapEff for the relevant process; remove runtime privilege needs |
        | seccomp | is this syscall allowed by the active filter? | identify the actual syscall and runtime profile; review a scoped exception |
        | SELinux | do policy and labels allow this operation? | node AVC record; fix labels or sharing design |
        | SCC admission, before runtime | is the requested Pod allowed at all? | no pod and ReplicaSet FailedCreate; fix the template |

        A high UID is not random at each start: restricted-v2 defaults to the project's minimum UID.
        Group 0 is a group and does not supply capabilities. SELinux type enforcement and MCS category checks
        add restrictions beyond file modes; not every file has a container-private MCS label.
        Labels alone are not conclusive proof of a denial, and absence of a displayed AVC is not proof that
        all SELinux checks passed: audit visibility and policy logging matter.

        RHCOS is an image-based operating system managed through cluster updates and MachineConfigs.
        Administrators use node journal collection (`oc adm node-logs`) or debug sessions for host evidence, and
        read before they change anything. SSH is possible but discouraged; ad hoc changes can be lost or produce
        configuration drift.
    - id: volume-labelling
      title: SELinux volume behaviour in 4.21
      depth: true
      body: |
        | Volume case | Default or limitation |
        |---|---|
        | supported RWO/RWX filesystem volume | recursive relabelling can walk every file, increasing startup time |
        | supported ReadWriteOncePod volume | an SELinux mount context can avoid a recursive walk |
        | RWO/RWX SELinux mount option | Technology Preview in OpenShift 4.21, requiring the documented feature gates |
        | seLinuxChangePolicy: Recursive | keeps recursive behaviour; applies to newly created pods |
        | storage without suitable label support | depends on the storage implementation; inspect its documentation |
        | hostPath under restricted-v2 | rejected at admission |

        Namespace label `storage.openshift.io/selinux-change-policy=Recursive` can default that policy for new pods;
        a pod-level setting can override it. Check CSI driver support before assuming mount-option behaviour.
        This does not change the separate ID-mapped mount requirement of user-namespaced restricted-v3 pods.

        Workstation Podman commonly allocates SELinux categories per container, while ordinary OpenShift
        restricted-v2 pods receive a project level. A successful laptop test therefore does not establish
        that UID allocation, labels and capability sets match the cluster.
  review:
    - q: Which SELinux type do ordinary confined container processes use on OpenShift?
      a: container_t (their writable files are container_file_t).
    - q: Where does a pod's SELinux level (MCS categories) come from?
      a: From the project's openshift.io/sa.scc.mcs annotation, applied by SCC admission because restricted-v2 uses
        seLinuxContext MustRunAs.
    - q: How can a process read its own SELinux label, and a file's?
      a: cat /proc/self/attr/current for the process; ls -Z for files (ps -eZ lists the labels of every process on a node).
    - q: What does seccompProfile RuntimeDefault do, and how do you see it is active?
      a: It selects the container runtime's default syscall filter; Seccomp 2 in /proc/<pid>/status shows a filter is active.
    - q: How do administrators read a node's files and processes on RHCOS without SSH?
      a: oc debug node/<name> starts a privileged debug pod (type spc_t) with the host at /host; chroot /host runs the node's tools. oc adm node-logs reads the journals.
  labs:
    - lab.container-anatomy
  limits: |
    No SELinux denial was provoked: producing one would need two projects sharing a volume or a change to a node,
    and the node is only read here. The AVC search shows what the audit log held during the recording. Node
    commands need cluster-admin; learners without it can still read every developer-side step on their own pods.
  enterprise: |
    Security assessments in regulated organisations ask how tenants are isolated on shared nodes. The precise answer
    is layered: separate UID ranges, dropped capabilities, seccomp, and SELinux MCS categories per project, plus
    NetworkPolicies for traffic. Keeping SELinux enforcing on every node is part of the platform's compliance
    baseline, and node debug sessions are themselves privileged access that is logged and reviewed.
  references:
    - title: 'OpenShift 4.21: Managing security context constraints'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/authentication_and_authorization/managing-pod-security-policies
    - title: 'Kubernetes: Configure a security context (SELinux, seccomp)'
      url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    - title: 'Kubernetes: Restrict a container''s syscalls with seccomp'
      url: https://kubernetes.io/docs/tutorials/security/seccomp/
    - title: 'OpenShift 4.21: Container security (SELinux and MCS in projects)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/security_and_compliance/container-security
    - title: 'OpenShift 4.21: Understanding persistent storage (SELinux relabelling)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/storage/understanding-persistent-storage
    - title: 'RHEL 9: Troubleshooting problems related to SELinux'
      url: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/using_selinux/troubleshooting-problems-related-to-selinux_using-selinux
    - title: 'OpenShift 4.21: Gathering data about your cluster (node logs and debug)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/support/gathering-cluster-data
  commands:
    - {cmd: "oc apply -f box.yaml", as: developer, meaning: "a small Deployment with an emptyDir volume"}
    - {cmd: "oc rollout status deploy/box --timeout=120s", as: developer, meaning: "running"}
    - {cmd: "oc exec deploy/box -- id", as: developer, meaning: "the project's first UID and group 0"}
    - {cmd: "oc get project academy-lesson-n-selinux-node -o jsonpath='{.metadata.annotations.openshift\\.io/sa\\.scc\\.mcs}{\"\\n\"}'", as: developer, meaning: "the SELinux level allocated to the project"}
    - {cmd: "oc get pods -l app=box -o jsonpath='{.items[0].spec.securityContext.seLinuxOptions}{\"\\n\"}'", as: developer, meaning: "the level SCC admission put into the pod"}
    - {cmd: "oc exec deploy/box -- cat /proc/self/attr/current", as: developer, meaning: "the process's own SELinux label"}
    - {cmd: "oc exec deploy/box -- sh -c 'echo saved > /data/report.txt && ls -Z /data'", as: developer, meaning: "a file on the volume and its label"}
    - {cmd: "oc exec deploy/box -- grep -E '^(CapEff|CapBnd|Seccomp)' /proc/1/status", as: developer, meaning: "capabilities and seccomp mode of process 1"}
    - {cmd: "oc create -f node-debug-ns.yaml", as: admin, meaning: "a namespace for the debug pods, labelled privileged for Pod Security"}
    - {cmd: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host getenforce", as: admin, timeout: 240, meaning: "SELinux mode on the node"}
    - {cmd: "oc get namespace academy-lesson-n-selinux-node academy-x-node-debug -o custom-columns='NAME:.metadata.name,MCS:.metadata.annotations.openshift\\.io/sa\\.scc\\.mcs'", as: admin, meaning: "each namespace has its own level"}
    - {cmd: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host sh -c 'ps -eZ | grep box-app'", as: admin, timeout: 240, meaning: "the container's process and its label on the node"}
    - {cmd: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host sh -c 'ls -Z /var/lib/kubelet/pods/*/volumes/kubernetes.io~empty-dir/box-data'", as: admin, timeout: 240, meaning: "the volume's file and its label on the node's disk"}
    - {cmd: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host id -Z", as: admin, timeout: 240, meaning: "the debug pod's own label"}
    - {cmd: "oc debug node/crc --to-namespace=academy-x-node-debug --image-stream=openshift/cli:latest -- chroot /host ausearch -m AVC,USER_AVC -ts recent", as: admin, expect: any, timeout: 240, meaning: "SELinux denials in the last ten minutes"}
    - {cmd: "oc get pods -n academy-x-node-debug", as: admin, meaning: "no debug pod left"}
    - {cmd: "oc delete namespace academy-x-node-debug", as: admin, meaning: "remove the debug namespace"}
  files:
    box.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: box
        labels: {app: box}
      spec:
        replicas: 1
        selector:
          matchLabels: {app: box}
        template:
          metadata:
            labels: {app: box}
          spec:
            terminationGracePeriodSeconds: 2
            securityContext:
              runAsNonRoot: true
            containers:
            - name: box
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              imagePullPolicy: IfNotPresent
              # a copy of sleep with a name that is easy to find among the node's processes
              command: ["/bin/sh", "-c", "cp /bin/sleep /tmp/box-app && exec /tmp/box-app infinity"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              volumeMounts:
              - {name: box-data, mountPath: /data}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
            volumes:
            - {name: box-data, emptyDir: {}}
    node-debug-ns.yaml: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: academy-x-node-debug
        annotations:
          openshift.io/node-selector: ""
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
          security.openshift.io/scc.podSecurityLabelSync: "false"
  experiment:
    id: X-NODE-01
    objective: "Read SELinux evidence on the node as the administrator (getenforce, process and file labels, the audit log) through oc debug node, with the debug pods in a namespace the experiment creates and deletes, and prove that no debug namespace or pod remains and the node's configuration is unchanged."
    changes:
      - "Namespace academy-x-node-debug, labelled privileged for Pod Security (created, deleted)"
      - "Debug pods crc-debug-* in academy-x-node-debug, one per oc debug node/crc command, each removed by oc when its command ended; on node crc only read-only commands ran (getenforce, ps, ls, id, ausearch)"
      - "Project academy-lesson-n-selinux-node, the developer's temporary lesson project, with one Deployment (deleted by the rollback)"
    preflight:
      - cmd: |-
          found=$(oc get namespace academy-x-node-debug --ignore-not-found -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=30s"}
    snapshot:
      - "oc get namespace academy-x-node-debug --ignore-not-found -o name"
      - "oc get node crc -o jsonpath='{.metadata.annotations.machineconfiguration\\.openshift\\.io/currentConfig} {.metadata.annotations.machineconfiguration\\.openshift\\.io/desiredConfig} {.metadata.annotations.machineconfiguration\\.openshift\\.io/state} {.spec.unschedulable} {.spec.taints}'"
      - "oc get machineconfigs -o name"
    rollback:
      - "oc delete namespace academy-x-node-debug --ignore-not-found --wait=false"
      - "oc delete project academy-lesson-n-selinux-node --ignore-not-found --wait=false"
    settle:
      - |-
        for i in $(seq 60); do
          a=$(oc get namespace academy-x-node-debug --ignore-not-found -o name) || exit 1
          b=$(oc get namespace academy-lesson-n-selinux-node --ignore-not-found -o name) || exit 1
          test -z "$a$b" && exit 0
          sleep 5
        done
        exit 1
    verify:
      - cmd: |-
          found=$(oc get namespace academy-x-node-debug --ignore-not-found -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait node/crc --for=condition=Ready --timeout=60s"}
