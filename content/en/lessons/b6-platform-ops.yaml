- id: h.slo-incidents
  title: SLOs and incident response
  subtitle: SLIs, error budgets, burn-rate alerts, incidents and postmortems
  module: p2-reliability
  mode: ENTERPRISE_ARCHITECTURE
  minutes: 25
  level: 2
  supports: Practices from the Google SRE book and workbook (SLIs, SLOs, error budgets and policies, multiwindow
    burn-rate alerting, incident command, blameless postmortems); they apply to any platform. The incidents in the
    course rehearse the triage half on a real cluster; SLO measurement needs a monitoring stack the course's OpenShift
    Local cluster does not run.
  concepts:
    - obs.slo
    - obs.incident
  prerequisites:
    - h.observability
  objective: |
    Define a useful SLI and SLO, compute and spend an error budget, design burn-rate alerts that page only when the
    budget is really at risk, run an incident with clear roles and mitigation first, and write a blameless postmortem
    with actions that change the system.
  flow:
    - kind: teach
      id: situation
      body: |
        Checkout has failed twice this week. Developers want to release a feature; operators want to
        stop all changes. Both point to different graphs. The team needs an agreed measure of user
        experience and a policy for acting when reliability falls short.

        You will define an SLI and SLO, calculate an error budget and burn rate, and rehearse decisions
        during and after an incident. The calculations and scenarios need no cluster. Measuring a real
        SLO over time requires telemetry that is not running here.
      title: Should the next release wait?
    - kind: teach
      id: sli
      body: |
        A **service level indicator (SLI)** measures user experience, often as good events divided by
        valid events. Define both: for example, eligible checkout requests that return successfully
        within 300 ms, divided by all eligible checkout requests. State exclusions and measurement points.

        A **service level objective (SLO)** sets a target over a window, such as 99.9% over 30 days.
        An **SLA** is a contractual commitment with consequences; it is different from an internal
        engineering objective. Choose a few meaningful user outcomes rather than a target for every metric.
      title: Define what counts as good
    - kind: ask
      id: measure-edge
      guess: true
      prompt: All pods are unready; the router returns 503s. Which measurement sees those failed requests?
      choices:
        - text: Only the application’s own success counter
          why: A program cannot count requests that never reached it; its apparent success ratio can mislead.
        - text: Only the deployment’s desired replica count
          why: Desired replicas say what should run, not whether users received successful responses.
        - text: The router’s request counters
          why: The router handled these failures before any application pod could count them. The next step names
            where each measurement point sits.
      answer: 2
    - kind: teach
      id: measurement
      body: |
        Each signal in [Events, logs, metrics, traces](/lesson/h.observability) is collected at some point,
        and it can show only what passes that point. Application counters miss requests rejected by ingress; router counters
        miss failures before the cluster. External probes exercise a full path from a few vantage points;
        client instrumentation can describe actual users but needs its own reliable telemetry.

        For latency, measure a share under a threshold or percentiles. An average can hide a slow tail.
        A percentile is a latency value at a rank; a share under a threshold is a proportion of requests.
        They are related ways to describe a distribution, not the same quantity.
      title: Measure close to the user
    - kind: teach
      id: budget
      body: |
        The **error budget** is the permitted bad-event ratio: 100% − SLO. A 99.9% SLO allows 0.1%
        of valid events to be bad. Remaining budget subtracts what has already been spent in the window.

        For a time-based availability SLI, 0.1% of 30 days is 43.2 minutes. For a request-based SLI,
        you cannot convert the budget into outage minutes without a traffic assumption. A peak-hour
        outage can spend much more request budget than an equally long quiet outage.
      title: The allowance follows from the target
    - kind: ask
      id: remaining-time
      prompt: A time-based 99.9% SLO covers 30 days. After a 20-minute outage and no other downtime, what remains?
      choices:
        - text: 23.2 minutes of budget
          why: Thirty days contain 43,200 minutes; 0.1% is 43.2, and 43.2 − 20 = 23.2.
        - text: No budget after the first outage
          why: The target permits some bad events; an outage spends the allowance rather than automatically exhausting
            it.
        - text: 99.9% of the original allowance
          why: 99.9% is the target, not the fraction of budget remaining after downtime.
      answer: 0
    - kind: teach
      id: burn
      body: |
        **Burn rate** is observed bad-event ratio divided by the allowed ratio. With a 0.1% budget,
        1.44% bad requests means a burn rate of 14.4. A rate of 1 maintained through the SLO window
        spends exactly the budget; 14.4 spends it much faster.

        The Google SRE (site reliability engineering) workbook combines a long window with a short one. Both must exceed the threshold:
        the long window establishes sustained budget risk, and the short one checks that it is still
        happening, so the alert can reset soon after recovery. The depth table gives page and ticket thresholds.
      title: How fast are you spending it?
    - kind: show
      id: burn-example
      code: |
        # Calculation from the SRE workbook's 30-day, 99.9% SLO example
        allowed_bad_ratio = 1 - 0.999 = 0.001
        observed_bad_ratio = 0.0144
        burn_rate = 0.0144 / 0.001 = 14.4
        budget_fraction_in_one_hour = 14.4 * 1 / (30 * 24) = 0.02
      origin: example
      caption: 'Google SRE workbook: Alerting on SLOs; worked arithmetic, not executable code or monitoring output.'
      notice: Two percent is a share of the budget, not a two-percent request error ratio. Interpreting the time
        windows as exact consumed budget assumes appropriate traffic weighting; variable request volume needs care.
    - kind: ask
      id: page-window
      prompt: A 99.9% SLO has over 1.44% bad requests in both the last hour and five minutes. What does the workbook
        rule do?
      choices:
        - text: Wait until the request error ratio reaches 2%
          why: The 2% figure describes budget share in the workbook example, not the request error threshold.
        - text: Page on the fast burn
          why: Both windows exceed 14.4 times the allowed 0.1% ratio, meeting the fast-burn condition.
        - text: Open only a slow-burn ticket
          why: The example ticket threshold is a much slower burn over longer windows.
      answer: 1
    - kind: teach
      id: policy
      body: |
        An **error-budget policy** translates the budget into action agreed by product, developers and
        operations. The workbook's example halts changes after the trailing four-week budget is exhausted,
        except urgent P0 (highest-priority) and security fixes, until the service returns within SLO. It also requires a
        postmortem for a single incident spending more than 20% of that budget.

        These are example policy choices, not universal constants. Define scope, exceptions and owners
        for your service. A budget does not authorise leaving users broken while allowance remains.
      title: Agree the consequence before the outage
    - kind: ask
      id: release-policy
      prompt: The team’s agreed policy freezes risky releases when budget is exhausted. The budget is exhausted
        today. What follows?
      choices:
        - text: Re-label the outage as planned downtime afterward
          why: Changing scope after the event undermines the agreement; define valid exclusions in advance.
        - text: Keep releasing because the dashboard still works
          why: A functioning dashboard does not restore the spent error budget or satisfy the policy.
        - text: Apply the policy and prioritise reliability
          why: A pre-agreed response turns the measurement into a decision, with the policy’s urgent exceptions.
      answer: 2
    - kind: teach
      id: incident
      body: |
        Declare an incident early when users are affected, another team is needed, or focused analysis
        is not resolving the issue. The **incident commander** coordinates decisions; the **operations
        lead** controls changes; **communications** keeps stakeholders informed. Longer incidents also
        need planning and explicit handovers.

        Mitigate first when a safe rollback, failover or other known action can restore service. Preserve
        logs, revision identifiers and observations for later diagnosis. One operations group coordinates
        changes so competing fixes do not obscure cause and effect. Keep a live timeline and verify
        recovery from the user's side.
      title: Restore service with coordinated changes
    - kind: ask
      id: mitigate
      prompt: Errors rose after a release. A rollback is safe, but two engineers each want to try their own fix. What
        does the incident commander decide?
      choices:
        - text: Let both try their fixes at once to save time
          why: Simultaneous changes hide which one helped and can interact. One group, the operations lead's, changes
            the system.
        - text: Roll back through the operations lead, then diagnose
          why: A known safe rollback restores users quickly, and one coordinated change keeps cause and effect clear.
            Keep the logs and revision details for the postmortem.
        - text: Find the root cause before touching anything
          why: Diagnosis matters, but when a safe mitigation exists, restoring service comes first. The evidence can be
            kept for afterwards.
      answer: 1
    - kind: order
      id: incident-loop
      prompt: Put this response loop in a useful order.
      items:
        - Confirm the user symptom and its scope; establish incident roles.
        - Check recent changes and collect cheap evidence for a hypothesis.
        - Apply a small safe mitigation, coordinated through operations.
        - Verify user-facing recovery and watch for recurrence.
        - After recovery, write up the timeline and investigate contributing factors.
      why: Evidence guides a targeted mitigation; user-side verification establishes recovery. A longer investigation
        follows without unnecessarily extending the outage.
    - kind: teach
      id: postmortem
      body: |
        A **blameless postmortem** asks how the conditions and available information made the incident
        possible. Document impact, detection, response, timeline and contributing factors. “Be more careful”
        is not a system change.

        Choose actions with owners and dates: validate configuration before rollout, add a missing readiness
        probe, automate a fragile step, improve a runbook, or fix late alerting. Typical triggers include
        significant user-visible degradation, data loss, a major intervention, slow recovery, or a monitoring
        failure. Agree thresholds with the team rather than writing one after every harmless event.
      title: Change the system that allowed the failure
    - kind: reflect
      id: postmortem-action
      prompt: Replace “the engineer should be more careful editing configuration” with an actionable postmortem
        finding.
      model: The process allowed an unvalidated configuration to reach production, and checks did not detect the
        user impact promptly. Assign owners and dates for configuration validation, review and a staged rollout
        check; improve detection if it was late. Explain contributing conditions without blaming the person.
    - kind: teach
      id: what-next
      body: |
        You can define a user-facing SLI and SLO, compute a budget without confusing requests with minutes,
        interpret multiwindow burn alerts, and connect an agreed policy to releases and incident response.
        You can also turn a postmortem into owned changes to the system.

        Next, delivery and automation apply these reliability constraints to how infrastructure and software
        changes are reviewed and released.
      title: What you can do now
  sections:
    - id: choosing-slis
      title: Choosing and measuring SLIs
      body: |
        For request-driven services the SRE workbook suggests three kinds of SLI, each a ratio of good to valid events:

        | SLI | Good event | Typical target shape |
        |---|---|---|
        | availability | the request got a successful response | 99.9% of valid requests |
        | latency | the request was answered faster than a threshold | 99% under 300 ms |
        | quality | the response was not degraded (no fallback content) | 99% full responses |

        *Where* you measure decides what you can see:

        | Source | Sees | Misses |
        |---|---|---|
        | application metrics or logs | what the code handled | requests that never reached a ready pod |
        | ingress router or load balancer | every request that reached the cluster, including router 503s | failures before the cluster (DNS, client network) |
        | synthetic probes from outside | the full path, from a few vantage points | problems that only some users hit |
        | client-side instrumentation | the real user experience | needs code changes and its own telemetry pipeline |

        On OpenShift, a Route whose Service has no ready endpoints is answered by the router with a 503, so the
        application never counts that failure. Two incidents show exactly that path:
        [Running but never Ready](/lab/inc.readiness-503) and
        [Route returns 503, pods are healthy](/lab/inc.service-selector-503). Application-only counters miss these failures; depending on the query, the apparent ratio may stay high or be undefined when no requests arrive.

        Use percentiles or "share under a threshold" for latency: an average hides the slow tail users complain about.
      depth: true
    - id: burn-rate-alerting
      title: 'Alerting on the budget: burn rates'
      body: |
        An alert should fire when the error budget is genuinely at risk, quickly for severe problems and without
        paging for blips. The SRE workbook's recommended starting point for a 99.9% SLO combines several windows:

        | Budget consumed | Long window | Short window | Burn rate | Action |
        |---|---|---|---|---|
        | 2% | 1 hour | 5 minutes | 14.4 | page |
        | 5% | 6 hours | 30 minutes | 6 | page |
        | 10% | 3 days | 6 hours | 1 | ticket |

        Burn rate is the observed error ratio divided by the budget ratio: with a 0.1% budget, 1.44% of requests
        failing is a burn rate of 14.4. The **long window** makes the alert significant (sustained elevated error ratio);
        the **short window**, about one twelfth of the long one, must also be burning, so the alert stops soon after
        the problem is fixed instead of firing for another hour.

        In Prometheus terms these are recording rules for the error ratio over each window and an alerting rule that
        requires both windows above the threshold. The workbook judges alerting strategies by precision, recall,
        detection time and reset time; burn-rate alerts trade a little detection time for far fewer false pages than
        "error rate above X for one minute".

        The budget-consumed percentages use the workbook’s time-window model. For a variable-volume request SLI, compute actual budget spend from bad-event counts and the window’s valid-event denominator; elapsed time alone is not exact.
      depth: true
    - id: error-budget-policy
      title: An error budget policy
      body: |
        A budget only changes behaviour if the consequences are agreed in advance, in writing, by the product manager,
        the developers and the SREs who defend the SLO. The workbook's example policy says:

        - if the service has spent more than its budget over the trailing four weeks, **halt changes and releases**
          except urgent (P0) fixes and security fixes until it is back within its SLO;
        - if a single incident consumed **more than 20%** of the four-week budget, a postmortem is mandatory, with at
          least one top-priority action;
        - exceptions exist when the budget was spent by something the team does not control (a company-wide network
          outage, another team's frozen service) or by traffic outside the SLO's scope, such as load tests.

        The policy is what turns an SLO from a dashboard into a decision rule.
      depth: true
    - id: during-an-incident
      title: During an incident
      body: |
        Roles: **incident commander** (coordinates, decides), **operations lead** (hands on keyboard),
        **communications** (stakeholders, status page). Priorities: **mitigate first** (rollback, fail over,
        scale), diagnose later. Keep a timeline of observations and actions as you go.

        A systematic approach to any service problem: confirm and scope the symptom → check what changed →
        follow the request path layer by layer → form a hypothesis → test it with the cheapest evidence → apply
        the smallest safe fix → verify recovery from the user's point of view → document.

        The SRE book adds a **planning** role for longer incidents (tracking follow-up work and what was changed so it
        can be reverted), and one rule for the operations group: only it changes the system, so two people never fix
        the same thing in different ways. Declare an incident early, when any of these is true: a second team is
        needed, customers can see the problem, or an hour of focused analysis has not solved it. Hand over command
        explicitly ("you are now incident commander") and keep one live incident document, newest important facts at
        the top.

        On OpenShift the usual mitigations are a rollback (`oc rollout undo`), scaling (`oc scale`), or reverting the
        change in Git and letting GitOps sync. The incidents in this course are small rehearsals of the triage loop:
        [A rollout that never finishes](/lab/inc.broken-rollout),
        [CrashLoopBackOff after a configuration change](/lab/inc.crashloop-config),
        [Timeouts after security hardening](/lab/inc.networkpolicy-block).
      depth: true
    - id: blameless-postmortems
      title: Blameless postmortems
      body: |
        Ask *how* the system allowed the failure, not *who* caused it: detection (how did we find out?),
        response (what slowed us down?), contributing factors, and actions with owners and dates. A good
        postmortem produces fewer, better alerts and runbooks, not a list of people to retrain.

        Typical triggers for writing one: user-visible downtime or degradation beyond a threshold, any data loss, an
        on-call intervention such as a rollback or traffic reroute, a resolution time above a threshold, and a
        monitoring failure (the incident was found by a person, not an alert). Blameless means assuming everyone acted
        in good faith with the information they had; it does not mean nothing changes. The actions change the system:
        a missing readiness probe becomes a platform default, a manual step becomes a runbook or automation, an alert
        that fired too late gets a burn-rate rule.
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **A 100% target**, or one SLO per metric. Pick a few user-facing SLIs with targets you can actually meet.
        - **Averages for latency.** Use percentiles or the share of requests under 300 ms; an average
          hides the slow tail users complain about.
        - **SLIs measured inside the application only.** Router 503s and DNS failures never reach its counters.
        - **Diagnosing while the service is down** when a rollback would restore it in two minutes.
        - **Changing several things at once** during an incident, so nobody knows which change helped.
        - **An error budget without a policy.** If spending it changes nothing, it is a dashboard, not an SLO.
        - **Postmortem actions without an owner and a date**; they are never done.
  review:
    - q: A service has a 99.9% monthly SLO. What is its error budget?
      a: 0.1% of valid events. For a time-based SLI, that is 43.2 minutes per 30 days; for a request-based SLI,
        converting to outage time requires a traffic assumption.
    - q: 'What comes first in an incident: diagnosis or mitigation?'
      a: Mitigation (restore service), then root-cause analysis.
    - q: How do you compute a burn rate?
      a: Observed error ratio divided by the error budget ratio; 1 spends exactly the budget over the window.
    - q: Why does a burn-rate alert use a long and a short window?
      a: The long window makes it significant; the short window (about 1/12) confirms it is still happening and
        lets the alert reset quickly.
    - q: Why measure availability at the router or load balancer rather than in the application?
      a: Requests that fail before reaching a ready pod (for example router 503s) never appear in the application's
        metrics.
    - q: Name three common postmortem triggers.
      a: User-visible downtime beyond a threshold, data loss, an on-call intervention such as a rollback (also long
        resolution time, monitoring failure).
    - q: Is the share of requests below 300 ms a percentile?
      a: No. It is a proportion at a fixed threshold; a percentile is the latency at a fixed rank. Both describe
        the latency distribution, unlike an average that can hide the tail.
  labs: []
  limits: |
    SLOs need a monitoring stack that measures request success and latency over days, and the course's single-node
    OpenShift Local cluster runs without Prometheus or Alertmanager, so SLIs, burn rates and alert routing cannot be
    practised here. The incidents (for example inc.readiness-503 and inc.broken-rollout) do rehearse the incident loop
    on a real cluster: scope the symptom, find what changed, mitigate, verify. The organisational parts (roles, error
    budget policy, postmortems) are practised with a team, not a cluster.
