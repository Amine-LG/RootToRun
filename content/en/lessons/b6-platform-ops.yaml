    - kind: teach
      id: profiles
      body: |
        OpenShift exposes three scheduler profiles: `LowNodeUtilization` favours spreading and is the
        default; `HighNodeUtilization` favours packing; `NoScoring` disables scoring. An administrator
        sets the profile in the Scheduler object named `cluster`.

        Packing can concentrate replicas, so explicit spread rules still matter. The scheduler does not
        rebalance running pods when load changes; moving them requires recreation or a separately
        configured descheduler. The depth tables name framework stages, plugins, weights and failure signatures.
      title: Cluster-wide preferences
    - kind: show
      id: scheduler-config
      body: "The administrator reads the cluster's Scheduler object:"
      run: "oc get scheduler cluster -o jsonpath='{.spec}{\"\\n\"}'"
      notice: |
        No `profile` field, so the default profile applies, `LowNodeUtilization`. `mastersSchedulable: true` is
        what lets ordinary pods run on this cluster's only node, which is also its control plane. `policy` with an
        empty name is a deprecated field (the old scheduler policy ConfigMap); empty means it is not used.
    - kind: explore
      id: scheduler-model
      sim: scheduler
      body: This is a simulation of default scheduling, not a cluster recording. Raise a request until all nodes
        fail, restore it, then add an SSD preference. Compare filtering with weighted scoring. Next tolerate the
        GPU taint. worker-c1 now passes the filters, and it wins because it is the emptiest node. Its
        TaintToleration score is the same as the other nodes' scores, so the toleration allowed the node but did
        not make the pod prefer it.
    - kind: reflect
      id: dedicated-nodes
      prompt: A team asks you to "reserve the GPU node for us". Using what you saw in this lesson, say what you would put on the node and what the team must put in its pods, and why each part is needed.
      model: |
        A label on the node (for example `gpu=true`) and a taint (`gpu=true:NoSchedule`). The team's pods need a
        node selector or required affinity for the label, and a toleration for the taint. The taint keeps other
        pods off, as it kept `plain` Pending; the toleration lets the team's pods pass it, as it did for
        `tolerant`, but does not draw them there; the selector does that, as it did for `tier`. Add the taint
        before other pods land there, because NoSchedule leaves running pods in place.
    - kind: teach
      id: what-next
      body: |
        You can separate feasibility from preference, label and taint a node as an administrator and undo it,
        combine selectors and tolerations deliberately, explain what a single node does with spreading rules,
        and read a Pending pod's FailedScheduling event.

        Next, [Nodes, machines and capacity planning](/lesson/n.nodes-capacity) connects those requests to node
        capacity, maintenance and the disruption budgets that can stop a drain.
      title: What you can do now
  sections:
    - id: the-scheduling-cycle-in-one
      title: The scheduling cycle in one paragraph
      body: |
        The scheduler takes one unscheduled pod at a time from its queue (ordered by priority, then by age) and
        runs a **scheduling cycle** built from plugins of the *scheduling framework*. Pods that already have
        `spec.nodeName` set never enter this queue: the kubelet on that node runs them directly.

        1. **PreFilter / Filter**: remove every node where the pod *cannot* run. Each filter plugin answers
           yes or no for a node. Any "no" eliminates the node. In very large clusters the scheduler stops once it
           has found enough feasible nodes (`percentageOfNodesToScore`); below 100 nodes it checks them all.
        2. **PostFilter**: if no node passed, try **preemption**: could evicting lower-priority pods make room?
        3. **PreScore / Score**: each score plugin rates every remaining node. If only one node passed the
           filters, scoring is skipped entirely.
        4. **NormalizeScore**: plugins whose raw values are not already on the 0–100 scale rescale them.
        5. Each plugin score is multiplied by the plugin's **weight** and summed. The node with the highest
           total wins; **ties are broken at random**.
        6. **Reserve / Permit**, then the binding cycle (**PreBind / Bind**): the pod is assumed on the node and
           bound (the scheduler writes a Binding, which sets `spec.nodeName`).

        Filtering is about *feasibility*, scoring is about *preference*. A requirement goes in a filter
        (nodeSelector, required affinity, taints, resources); a wish goes in a score (preferred affinity,
        spreading, less loaded nodes).
      depth: true
    - id: the-default-filters-and-the
      title: The default filters, and the message they produce
      body: |
        | Filter plugin | Removes a node when… | FailedScheduling text (Kubernetes 1.34) |
        |---|---|---|
        | NodeUnschedulable | the node is cordoned | `node(s) were unschedulable` |
        | TaintToleration | a NoSchedule/NoExecute taint is not tolerated | `node(s) had untolerated taint(s)` |
        | NodeAffinity | nodeSelector or required node affinity does not match | `node(s) didn't match Pod's node affinity/selector` |
        | NodeResourcesFit | requests do not fit in allocatable minus already-requested | `Insufficient cpu` / `Insufficient memory` / `Too many pods` |
        | NodePorts | a requested hostPort is in use | `node(s) didn't have free ports for the requested pod ports` |
        | VolumeBinding / VolumeZone… | a volume cannot be used from that node | `node(s) didn't match PersistentVolume's node affinity`, `pod has unbound immediate PersistentVolumeClaims` |
        | PodTopologySpread | a DoNotSchedule constraint would exceed maxSkew, or the node lacks the topology label | `node(s) didn't match pod topology spread constraints`, followed by `(missing required label)` in the second case |
        | InterPodAffinity | required (anti-)affinity with other pods fails | `node(s) didn't match pod affinity rules` / `node(s) didn't match pod anti-affinity rules` / `node(s) didn't satisfy existing pods anti-affinity rules` |

        An event aggregates rejection reasons across candidate nodes. One node can fail on both CPU
        and memory fit, so reason counts are not necessarily disjoint. The appended preemption message describes whether removing
        lower-priority workloads could help; it is not a recommendation to evict them manually.
      depth: true
    - id: requests-selectors-and-node-affinity
      title: 'Requests, node selectors and node affinity: the pod chooses'
      body: |
        **Requests** must fit in the node's allocatable resources minus the requests already placed there, on
        **one** node (see [Requests, limits, QoS and quotas](/lesson/b.resources-qos)).

        **`nodeSelector`** is the simplest placement rule: the node must carry *every* listed label with exactly
        that value. **Node affinity** says the same thing with more expressive rules:

        ```yaml
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:   # a filter
              nodeSelectorTerms:
              - matchExpressions:
                - {key: topology.kubernetes.io/zone, operator: In, values: [zone-a, zone-b]}
            preferredDuringSchedulingIgnoredDuringExecution:  # a score
            - weight: 50
              preference:
                matchExpressions:
                - {key: disktype, operator: In, values: [ssd]}
        ```

        - Operators: `In`, `NotIn`, `Exists`, `DoesNotExist`, `Gt`, `Lt`. `NotIn` and `DoesNotExist` express
          "keep away from these nodes".
        - Several `nodeSelectorTerms` are **ORed**; the expressions inside one term are **ANDed**.
        - If a pod has both `nodeSelector` and node affinity, **both** must be satisfied.
        - `IgnoredDuringExecution`: the rule is checked only when the pod is placed. Removing a label from a node
          later does not move pods that are already running.
        - Preferred terms carry a `weight` from 1 to 100; they only change scores and never block a pod.

        On OpenShift, a project can also carry a node selector (the `openshift.io/node-selector` annotation on its
        namespace, set by administrators). It is added to every pod created in the project, and a pod whose own
        selector contradicts it is refused at creation: `pod node label selector conflicts with its project node
        label selector`.
      depth: true
    - id: taints-and-tolerations
      title: 'Taints and tolerations: the node says no'
      body: |
        A **taint** on a node repels pods; a **toleration** on a pod lets it ignore one taint. A taint has a key,
        an optional value and an **effect**:

        | Effect | New pods without a toleration | Pods already running there without a toleration |
        |---|---|---|
        | `NoSchedule` | not placed (filter) | keep running |
        | `PreferNoSchedule` | less preferred by this score plugin; other scores still contribute | keep running |
        | `NoExecute` | not placed | **evicted**; with a toleration that sets `tolerationSeconds`, evicted after that delay |

        A toleration matches with `operator: Equal` (the default: key, value and effect must match) or
        `operator: Exists` (no value; an empty key with `Exists` matches every key and value, and every taint
        when `effect` is also left empty). A toleration only *removes an obstacle*: it does not attract the pod to the tainted node.

        Some taints are set automatically. The control plane adds `node.kubernetes.io/not-ready`,
        `unreachable` (both `NoExecute`), `memory-pressure`, `disk-pressure`, `pid-pressure` and `unschedulable`
        when the corresponding health or schedulability state calls for them, and admission normally gives pods a 300-second
        toleration for `not-ready` and `unreachable` unless the pod sets its own; DaemonSets have different automatic tolerations. On a multi-node OpenShift
        cluster, control-plane nodes carry `node-role.kubernetes.io/master:NoSchedule` by default, which keeps
        applications off them. OpenShift Local has a single node that is control plane and worker at once
        (`mastersSchedulable: true` in the `Scheduler` object), so it carries no such taint and normally shows
        `Taints: <none>` in `oc describe node`.
      depth: true
    - id: pod-affinity-and-topology-spread
      title: 'Pod affinity, anti-affinity and topology spread: placement relative to other pods'
      body: |
        These rules look at **pods already placed**, grouped by a **topology key**: a node label such as
        `kubernetes.io/hostname` (each node is its own domain) or `topology.kubernetes.io/zone` (each zone is a
        domain).

        - **Pod affinity** ("put me in the same domain as pods labelled `app=cache`") and **pod anti-affinity**
          ("never in the same domain as another `app=web` pod") come in required (filter) and preferred (score)
          forms. They are expensive to evaluate: the Kubernetes documentation advises against them in clusters
          larger than several hundred nodes, and every node must carry the topology key label consistently.
        - **Topology spread constraints** keep a group of pods balanced. For each candidate domain the scheduler
          computes *skew = matching pods in that domain + 1 (the new pod) − the minimum count over all eligible
          domains*. `whenUnsatisfiable` is required in every constraint: with `DoNotSchedule` a node whose skew
          would exceed `maxSkew` is filtered out; with `ScheduleAnyway` the skew only lowers its score.

        ```yaml
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: web}}
        ```

        For a hard DoNotSchedule constraint, nodes missing its topology key cannot receive the pod.
        With no eligible domain, that hard rule leaves the pod Pending. ScheduleAnyway is a scoring preference,
        not the same placement prohibition. For DoNotSchedule, the minimum is zero when eligible domains are
        fewer than minDomains; otherwise it is the minimum matching-pod count across eligible domains.
      depth: true
    - id: affinity-taints-and-spreading
      title: 'Affinity, taints and spreading: who constrains whom'
      body: |
        | Mechanism | Who decides | Hard form (filter) | Soft form (score) | Use it for |
        |---|---|---|---|---|
        | nodeSelector / node affinity | the *pod* chooses nodes by label | nodeSelector, `required…` | `preferred…` with a weight | hardware or OS requirements, zones |
        | taints and tolerations | the *node* repels pods | `NoSchedule`, `NoExecute` | `PreferNoSchedule` | dedicated or special nodes |
        | pod affinity / anti-affinity | the pod chooses relative to other pods | `required…` | `preferred…` | co-location with a cache; replicas apart |
        | topology spread | the pod asks for balance in a group | `DoNotSchedule` | `ScheduleAnyway` | even spread across zones or nodes |

        In OpenShift, infrastructure nodes are something administrators build: they label nodes
        `node-role.kubernetes.io/infra`, usually add a taint such as
        `node-role.kubernetes.io/infra=reserved:NoSchedule`, then configure the router, registry and monitoring
        (through their operators' settings) with a matching node selector and toleration. Dedicated nodes are
        always taint + toleration + selector together: the taint keeps others out, the selector brings the
        intended pods in.
      depth: true
    - id: failure-signatures
      title: What each rule looks like when it fails
      body: |
        A pod blocked by a filter is `Pending` with NODE `<none>`, condition `PodScheduled=False`, and a
        `FailedScheduling` event. The message names the rule. On a single-node cluster some rules can only ever
        show their failure: there is no second node for the pod to go to instead.

        | Rule | Failing message (filter part) | On single-node OpenShift Local |
        |---|---|---|
        | request too large | `Insufficient cpu` / `Insufficient memory` | observable: [the scheduling lab](/lab/lab.scheduling), [Pending forever](/lab/inc.pending-resources) |
        | nodeSelector or required node affinity | `didn't match Pod's node affinity/selector` | observable: this lesson (`tier`) and the same lab (`picky`) |
        | taint not tolerated | `had untolerated taint(s)` (the taint itself is not named) | observable when an administrator taints the node, as in this lesson (`plain`); a node under pressure also carries automatic taints such as `disk-pressure` |
        | required pod anti-affinity on `kubernetes.io/hostname` | `didn't match pod anti-affinity rules` | observable as a refusal (`apart` in this lesson): with 2 replicas, one runs and one stays Pending; the spreading itself cannot be seen |
        | topology spread on `kubernetes.io/hostname` | none | never blocks with one eligible domain and minDomains 1: this lesson's `spread` runs 3 replicas on the one node; higher minDomains can block |
        | topology spread on `topology.kubernetes.io/zone` | `didn't match pod topology spread constraints (missing required label)` | observable: the node has no zone label |
        | unbound PersistentVolumeClaim | `pod has unbound immediate PersistentVolumeClaims` | observable: [PVC Pending, pod Pending](/lab/inc.pvc-pending) |
        | preferred affinity, `ScheduleAnyway`, scores | none | never visible: with one feasible node, scoring is skipped |

        The flow shows the investigation commands. The pod list identifies unassigned pods; events
        explain scheduler refusals. With node-read permissions (the administrator's half), inspect allocatable
        and requested resources, taints and labels. Then fix the rule in the pod's **owner** (the Deployment template), never by changing the node to
        fit a wrong requirement. If a pod is Pending with no FailedScheduling event at all, look at its status
        first: `SchedulingGated` means a scheduling gate holds it back on purpose, and a missing pod means
        admission refused it (FailedCreate on the ReplicaSet).
      depth: true
    - id: the-default-scores-and-their
      title: The default scores and their weights
      body: |
        In the default profile, score plugins and weights are:

        | Score plugin | Prefers | Weight |
        |---|---|---|
        | TaintToleration | fewer untolerated `PreferNoSchedule` taints | 3 |
        | NodeAffinity | nodes matching more `preferredDuringScheduling` terms (sum of their weights) | 2 |
        | PodTopologySpread | domains with fewer matching pods | 2 |
        | InterPodAffinity | preferred pod (anti-)affinity | 2 |
        | NodeResourcesFit | strategy-dependent: **LeastAllocated** (emptier nodes) by default | 1 |
        | NodeResourcesBalancedAllocation | nodes whose requested CPU and memory fractions stay balanced | 1 |
        | ImageLocality | nodes that already have the image | 1 |

        So a single preferred node-affinity term (weight 2 plugin) can outweigh "this node is a bit emptier"
        (weight 1). The **OpenShift scheduler profiles** change this cluster-wide through `spec.profile` of the
        `Scheduler` object named `cluster` (read it with `oc get scheduler cluster -o yaml`; changing it needs
        cluster-admin): `LowNodeUtilization` spreads pods (the default behaviour), `HighNodeUtilization` packs
        them onto as few nodes as possible (useful with autoscaling, but it can put every replica of a
        ReplicaSet on the same node), `NoScoring` disables all score plugins for the fastest decisions.

        The scheduler model in the flow illustrates these decisions; it is not the real binary.
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **Expecting a toleration to place a pod on the tainted node.** It only removes an obstacle; add a
          nodeSelector or node affinity to target those nodes.
        - **Setting `spec.nodeName` to "pin" a pod.** It bypasses the scheduler and every filter: if the node
          lacks resources the pod fails (`OutOfcpu`, `OutOfmemory`) instead of waiting as Pending.
        - **Expecting the scheduler to rebalance running pods.** It only places new pods. Moving running pods
          is the job of the descheduler (the Kube Descheduler Operator on OpenShift).
        - **Asking for more than any single node can offer.** The cluster may have enough capacity in total,
          but a pod must fit on one node.
        - **Required anti-affinity with more replicas than nodes.** The extra replicas stay Pending forever;
          use preferred anti-affinity or topology spread with `ScheduleAnyway` when best-effort spreading is
          enough.
        - **Adding a toleration to "fix" an untolerated-taint message.** The taint is usually there on purpose
          (infra, GPU or control-plane nodes). Ask why the pod does not fit on the untainted nodes instead.
        - **Labelling a node to satisfy a selector.** The label then lies about the node to every future
          scheduling decision; correct the requirement instead.
  review:
    - q: What are the two phases of a scheduling cycle, and what does each decide?
      a: Filter decides feasibility (which nodes can run it); Score ranks feasible nodes (which is preferable).
    - q: Does the scheduler use actual CPU usage or requests to decide if a pod fits?
      a: Requests (allocatable minus the sum of requests already scheduled).
    - q: What happens when no node passes the filters?
      a: PostFilter tries preemption; if impossible the pod stays Pending with a FailedScheduling event.
    - q: Name the three OpenShift scheduler profiles.
      a: LowNodeUtilization (default, spread), HighNodeUtilization (pack), NoScoring (filter only).
    - q: What do the three taint effects do to new pods and to running pods?
      a: 'NoSchedule: blocks new pods, running ones stay. PreferNoSchedule: avoided if possible. NoExecute: blocks
        new pods and evicts running ones without a toleration (after tolerationSeconds if set).'
    - q: Which placement rules can you see fail on a single-node cluster, and which never show anything?
      a: Hard resource, selector, affinity, taint and topology rules can fail on one node. Required hostname anti-affinity
        can block a second replica. With one feasible node, scoring is skipped. Hostname spread with minDomains
        1 has no alternative domain; higher minDomains can block.
    - q: Does PreferNoSchedule absolutely require choosing an untainted node whenever one exists?
      a: No. It contributes a soft preference to weighted scoring; other plugin scores can outweigh it. NoSchedule
        is the hard scheduling effect.
  labs:
    - lab.scheduling
    - lab.placement-rules
  limits: |
    The training cluster has **one node**, so filtering can only say "this node or nothing" and scoring never
    runs (with a single feasible node the scheduler skips it). The recording shows real filter failures, a real
    label and a real `NoSchedule` taint added and removed by the administrator; it never uses `NoExecute`, which
    would evict the platform's own pods from the only node. Spreading across nodes or zones, anti-affinity that
    moves a replica elsewhere, and scoring between nodes need several nodes: the simulator shows them, labelled
    as a simulation, and the zone example is a documentation snippet. A multi-node cluster (for example a kind
    cluster with several nodes, or a cloud OpenShift trial) shows them for real.
  enterprise: |
    In production the questions are about *capacity and placement policy*: are requests realistic, are
    replicas spread across zones (topology spread + PodDisruptionBudgets), are infra components on infra
    nodes, are GPU or licensed nodes protected by taints. A Pending pod is often a capacity signal for the
    platform team, not an application bug.
