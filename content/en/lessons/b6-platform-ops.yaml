      hints:
        - match: \bservices?\b
          say: The Service is the scrape target’s front door. This task asks for the monitor’s own selector and
            endpoints.
        - match: \bshop\b|\bweb\b
          say: Apply the example to api in billing.
        - match: ^oc get servicemonitor(?!.*(?:-o|--output))
          say: Add YAML output so you can inspect the selector and endpoints fields.
      hint: Use get servicemonitor with api, namespace billing and output yaml.
      then: A real response exposes the scrape configuration. It does not prove that a target exists, is reachable
        or has produced samples; verify those separately.
    - kind: teach
      id: rules
      body: |
        A **PrometheusRule** defines recording rules or alert expressions in PromQL, the metric query
        language. Evaluate an actionable user symptom such as error ratio or latency. As
        [Events, logs, metrics, traces](/lesson/h.observability) explains, unbounded labels and noisy
        cause-based pages make monitoring harder to use.

        A rule can be correct and firing while notifications still go nowhere. Prometheus or Thanos
        Ruler evaluates the condition; Alertmanager handles notification delivery. Trace both halves.
      title: Turn a measured symptom into an alert
    - kind: teach
      id: routing
      body: |
        By default, user-workload alerts reach the platform Alertmanager. Administrators can allow
        project **AlertmanagerConfig** objects to contribute routing, or configure a separate user-workload
        Alertmanager. A route chooses a receiver; grouping reduces duplicate notifications, inhibition
        suppresses related noise, and silences temporarily mute matching alerts.

        Use a comment and an expiry aligned with the maintenance window for each silence. The permanently
        firing **Watchdog** alert is a heartbeat: an external service should notify you when it stops arriving.
      title: A firing alert still needs a route
    - kind: ask
      id: firing-no-page
      prompt: Observe shows an application alert firing, but its team gets no page. What should you inspect next?
      choices:
        - text: The ServiceMonitor’s port name only
          why: Scraping already supplied enough data to fire this alert. That alone does not route notifications.
        - text: Whether Watchdog can be deleted
          why: Watchdog tests pipeline continuity; deleting it cannot repair this team’s route.
        - text: Alertmanager routing and receivers
          why: Firing establishes evaluation; delivery still needs a route to the team’s receiver.
      answer: 2
    - kind: teach
      id: retention
      body: |
        Platform Prometheus defaults to 15 days of retention; user-workload Prometheus defaults to
        24 hours. Retention bounds data kept in the store; it cannot make ephemeral storage persistent.
        Configure supported filesystem-mode persistent volumes for Prometheus and Alertmanager so data,
        silences and notification state survive pod replacement.

        An emptyDir survives a container crash within the same pod, but is deleted when the pod leaves
        the node. Send data needed for longer-term analysis to suitable remote storage. Size storage
        for series count, sample rate and retention, not the retention number alone.
      title: Retention needs storage that survives replacement
    - kind: ask
      id: retention-loss
      prompt: Prometheus has 15-day retention but only emptyDir storage. Its pod is deleted and replaced. Which
        history survives locally?
      choices:
        - text: None from the old pod’s emptyDir
          why: Retention cannot preserve a deleted volume; persistent or remote storage is needed.
        - text: Exactly the last 15 days of samples
          why: Retention is a deletion limit, not a backup or durable storage provisioner.
        - text: Every sample until the next node reboot
          why: Pod removal already destroys emptyDir data, even if the node stays up.
      answer: 0
    - kind: teach
      id: supported
      body: |
        Use the documented cluster-monitoring-config and user-workload-monitoring-config options.
        Editing generated Deployments or rules in monitoring namespaces is unsupported and can be
        reverted. Put application monitors and rules in user projects, not openshift-* or kube-* namespaces;
        do not label an application namespace as platform monitoring to bypass the boundary.

        Project roles delegate monitoring edits and rules separately; alert-routing-edit delegates routing
        where enabled. The reference tables list the components, roles and troubleshooting checks. Use
        the separate Cluster Observability Operator when a custom monitoring stack is required.
      title: Configure through the supported interfaces
    - kind: show
      id: no-monitoring-roles
      body: "Those delegation roles are created by the Cluster Monitoring Operator. On the lab cluster, where it does not run:"
      run: "oc get clusterrole monitoring-edit"
      notice: "NotFound: the role an administrator would bind to let a team edit ServiceMonitors and PodMonitors does not exist here."
    - kind: show
      id: developer-cannot-monitor
      body: "Now the identity changes to developer, admin of their own project only. May developer create a ServiceMonitor in that project? Expect `no`, with exit status 1: the project admin role does not include it, whether or not monitoring runs."
      run: "oc auth can-i create servicemonitors"
      notice: |
        `no`. The project `admin` role does not include the monitoring API group; on a cluster with monitoring,
        that permission comes from `monitoring-edit`, bound in the project.
    - kind: reflect
      id: missing-target
      prompt: User monitoring is enabled, but there is no target for an app. Give the checks before blaming Prometheus.
      model: Check monitoring permissions and namespace/monitor exclusion labels, ServiceMonitor selection against
        Service metadata labels, and the named Service port. If a target exists but is down, check the application
        endpoint and NetworkPolicy. If an alert fires but no page arrives, investigate routing instead.
    - kind: teach
      id: what-next
      body: |
        You can distinguish platform from user monitoring, follow ServiceMonitor selection, separate
        scraping from alert delivery, and explain why retention requires durable storage.

        Next, logging follows a different pipeline: collecting text from nodes, forwarding it to stores,
        and controlling who can read it and for how long.
      title: What you can do now
  sections:
    - id: kubernetes-defines-a-metrics-api
      title: Kubernetes defines a metrics API; the platform ships a monitoring stack
      body: |+
        Plain Kubernetes ships no monitoring system: it defines the resource metrics API (used by autoscaling and
        `top`) and leaves Prometheus or anything else to you. OpenShift installs and manages a complete stack by default,
        through the **Cluster Monitoring Operator** in `openshift-monitoring`:

        | Component | Job |
        |---|---|
        | Prometheus (platform) | scrapes and stores metrics of the platform's own components |
        | Alertmanager | groups, silences and routes alerts to receivers |
        | Thanos Querier | one query endpoint over platform and user-workload data (what the console queries) |
        | kube-state-metrics, openshift-state-metrics, node-exporter | turn object state and node statistics into metrics |
        | Metrics Server | serves the resource metrics API for HPAs and `oc adm top` (it replaced Prometheus Adapter in 4.16) |
        | monitoring plugin | the console's **Observe** pages: Alerting, Metrics, Dashboards, Targets |

      depth: true
    - id: where-alerts-go
      title: Where alerts go
      body: |
        Alertmanager receives firing alerts, **groups** related ones, applies **inhibitions** and **silences**, and
        **routes** them to receivers (email, chat, paging, webhooks). By default, alerts from user projects are routed
        by the **platform Alertmanager**, configured by administrators. Two documented options give teams control:
        allow `AlertmanagerConfig` objects in user projects to be merged into the platform Alertmanager, or run a
        separate Alertmanager for user workloads.

        The platform fires a **Watchdog** alert permanently on purpose: it proves the alerting pipeline works. Send it to
        an external "dead man's switch" service that pages you when Watchdog *stops* arriving. Use silences, with an
        end time and a comment, for planned maintenance.
      depth: true
    - id: supported-changes-retention-and
      title: Supported changes, retention and storage
      body: |
        The monitoring stack is part of the platform: configure it only through the documented ConfigMaps
        (`cluster-monitoring-config`, `user-workload-monitoring-config`). Unsupported, among others: modifying resources
        in the two monitoring namespaces, adding ServiceMonitors, PodMonitors or rules in `openshift-*` and `kube-*`
        projects, labelling your own namespace `openshift.io/cluster-monitoring: "true"`, and installing your own
        Prometheus instances next to it (the separate Cluster Observability Operator exists for custom stacks).

        By default the platform Prometheus keeps **15 days** of data and the user-workload Prometheus **24 hours**. Without
        persistent storage, data is lost when the Prometheus pod is removed and recreated with a new ephemeral volume: production clusters configure persistent
        volumes (filesystem mode) for Prometheus and Alertmanager. Long-term trends belong in remote storage or a
        dedicated system.
      depth: true
    - id: when-metrics-or-alerts-are-missing
      title: When metrics or alerts are missing
      body: |
        | Symptom | Evidence | Likely cause | Fix |
        |---|---|---|---|
        | no metrics for your app in Observe > Metrics | Observe > Targets shows no target for the project | user workload monitoring not enabled; the project or the ServiceMonitor carries the label `openshift.io/user-monitoring=false` | ask an administrator to enable it; remove the exclusion label |
        | still no target | `oc get service <svc> -o yaml` against `oc get servicemonitor <name> -o yaml` | `selector.matchLabels` does not match the **Service's** labels (pod labels do not count), or `endpoints.port` is not the Service port's **name** | align the labels and use the port name |
        | target listed but down | the target's error in Observe > Targets | the app does not serve `/metrics` on that port, or a NetworkPolicy blocks the scrape | fix the endpoint; allow traffic from the monitoring namespace |
        | rule exists, alert never reaches the team | Observe > Alerting shows it firing | routing: user alerts go to the platform Alertmanager by default, and nobody routes them to the team | an AlertmanagerConfig (if allowed) or a route added by administrators |
        | `oc adm top` fails, HPA shows `<unknown>` | `error: Metrics API not available` | no Metrics Server: monitoring disabled (OpenShift Local) | enable monitoring, or accept that resource-based autoscaling cannot work there |
        | graphs stop at the last pod replacement | Prometheus pods recently replaced, no PVCs in `openshift-monitoring` | no persistent storage configured | configure storage through the documented ConfigMap |

        Most "monitoring is broken" reports are label or port-name mismatches between three objects (Deployment,
        Service, ServiceMonitor); compare them side by side before suspecting the stack.
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **Creating a ServiceMonitor before user workload monitoring is enabled**, then waiting for data that never
          comes. The object is accepted; nothing scrapes it.
        - **Alerting on causes** (CPU at 80%) instead of symptoms (errors, latency). It produces noise and alert fatigue.
        - **Silences much longer than the maintenance.** Every silence has an end time, but one set for weeks "to be
          safe" hides the next real incident; match it to the window and write a comment saying why.
        - **Treating the Watchdog alert as noise.** It is the alarm that tells you the alarms work.
        - **No persistent storage.** Prometheus pod replacement with ephemeral storage erases the evidence you will need in the next postmortem.
        - **Tweaking the platform stack directly** (editing its Deployments or rules). The operator reverts it, and the
          change is unsupported.
    - id: team-permissions
      title: Delegated monitoring permissions
      depth: true
      body: |
        | ClusterRole, bound in an application project | Delegation |
        |---|---|
        | monitoring-edit | ServiceMonitors, PodMonitors and rules |
        | monitoring-rules-edit | Edit rules |
        | monitoring-rules-view | Read rules |
        | alert-routing-edit | AlertmanagerConfig management where enabled |

        The endpoint, monitor and PrometheusRule belong in the team's project. User-workload monitoring must be
        enabled first. openshift.io/user-monitoring=false on the project or monitor excludes it from monitoring.
  review:
    - q: In which namespaces do the platform and the user-workload monitoring stacks run?
      a: openshift-monitoring and openshift-user-workload-monitoring.
    - q: How is user workload monitoring enabled?
      a: 'enableUserWorkload: true in config.yaml of the cluster-monitoring-config ConfigMap in openshift-monitoring.'
    - q: Which objects does a team create to monitor and alert on its application?
      a: A ServiceMonitor or PodMonitor, and PrometheusRules, in its own project.
    - q: Default retention of the platform and user-workload Prometheus?
      a: 15 days and 24 hours.
    - q: What serves the resource metrics API used by HPAs and oc adm top since OpenShift 4.16?
      a: Metrics Server (it replaced Prometheus Adapter).
    - q: Does a retention setting preserve data when ephemeral Prometheus storage is lost?
      a: No. Retention limits stored history; persistent or remote storage must preserve it across pod replacement.
        An emptyDir can survive a container crash within the same pod, but not pod removal.
  labs: []
  limits: |
    The course's OpenShift Local cluster runs without the monitoring stack (it is disabled to fit in a laptop's
    memory), so there is no Prometheus to query, no target to inspect, no alert to route and no Metrics API for
    `oc adm top` or HPAs. The recording shows that disabled state, read only: no pods in `openshift-monitoring`, no
    `monitoring` cluster operator, the ClusterVersion overrides, ServiceMonitors with nothing to read them, and no
    monitoring roles. Enabling monitoring was not attempted: on OpenShift Local it needs about 14 GiB of memory
    assigned to the instance and cannot be undone without deleting the instance (OpenShift Local documentation).
    Every enabling, scraping, rule and routing step is a documentation example. To practise them, use a cluster
    with monitoring enabled.
  enterprise: |
    Platform teams own the platform stack, its storage and its routing; application teams own their ServiceMonitors,
    rules and dashboards. Alert routing usually mirrors team ownership, Watchdog feeds an external heartbeat, and metrics
    needed beyond 15 days go to a central long-term store.
  references:
    - title: 'Monitoring stack for Red Hat OpenShift 4.21: Monitoring stack architecture'
      url: https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/about_monitoring/monitoring-stack-architecture
    - title: 'Monitoring stack for Red Hat OpenShift 4.21: Preparing to configure user workload monitoring'
      url: https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/configuring_user_workload_monitoring/preparing-to-configure-the-monitoring-stack-uwm
    - title: 'Monitoring stack for Red Hat OpenShift 4.21: Managing alerts as an administrator'
      url: https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/managing_alerts/managing-alerts-as-an-administrator
    - title: 'Monitoring stack for Red Hat OpenShift 4.21: Support for monitoring'
      url: https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/support_for_monitoring/support-for-monitoring
    - title: 'Monitoring stack for Red Hat OpenShift 4.21: Troubleshooting monitoring issues'
      url: https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/troubleshooting_monitoring_issues/index
    - title: 'Monitoring stack for Red Hat OpenShift 4.21: Storing and recording data for core platform monitoring'
      url: https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/configuring_core_platform_monitoring/storing-and-recording-data
    - title: 'OpenShift 4.21: Network policy (allowing monitoring traffic)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/network_security/network-policy
    - title: 'OpenShift Local (crc.dev): Administrative tasks (enabling cluster monitoring)'
      url: https://crc.dev/docs/administrative-tasks/
    - title: 'Kubernetes: Volumes (emptyDir lifetime)'
      url: https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
  commands:
    - {cmd: "oc get pods -n openshift-monitoring", as: admin, meaning: "no pod of the platform monitoring stack runs"}
    - {cmd: "oc get clusteroperator monitoring", as: admin, expect: fail, meaning: "NotFound: no monitoring cluster operator"}
    - {cmd: "oc get clusterversion version -o jsonpath='{range .spec.overrides[*]}{.kind}{\" \"}{.namespace}{\"/\"}{.name}{\" unmanaged=\"}{.unmanaged}{\"\\n\"}{end}'", as: admin, meaning: "the components the Cluster Version Operator leaves alone on OpenShift Local"}
    - {cmd: "oc get configmap cluster-monitoring-config -n openshift-monitoring", as: admin, expect: fail, meaning: "NotFound: the monitoring configuration was never created"}
    - {cmd: "oc get servicemonitors -A --no-headers | wc -l", as: admin, meaning: "how many ServiceMonitors exist"}
    - {cmd: "oc get servicemonitors -A | head -n 4", as: admin, meaning: "a few of them, in platform namespaces"}
    - {cmd: "oc get prometheuses,alertmanagers -A", as: admin, meaning: "nothing to read the monitors or deliver alerts"}
    - {cmd: "oc get clusterrole monitoring-edit", as: admin, expect: fail, meaning: "NotFound: the delegation roles come with the monitoring operator"}
    - {cmd: "oc auth can-i create servicemonitors", as: developer, expect: fail, meaning: "no: a project admin cannot create monitors here"}
- id: n.logging
  title: Collect and forward logs
  subtitle: From oc logs to collection, storage and forwarding
  module: p2-reliability
  mode: ENTERPRISE_ARCHITECTURE
  minutes: 25
  level: 2
  supports: Red Hat OpenShift Logging 6.6 (supported on OpenShift 4.20 to 4.22) with the Vector collector and ClusterLogForwarder
    (observability.openshift.io/v1), the Loki Operator (LokiStack) and the Cluster Observability Operator for the
    console view. None of these are installed on the course's OpenShift Local cluster; the local log sources and
    the missing logging API were recorded there, read only, by the cluster administrator (kubeadmin) and the
    ordinary user developer in a temporary project. Collection, forwarding and storage are documentation examples.
  record_on: cluster-admin
  concepts:
    - obs.logging
    - obs.signals
    - sec.audit
  prerequisites:
    - h.observability
  objective: |
    Know where logs exist without a logging stack and why that is not enough, describe the current OpenShift logging
    architecture, and design collection, access and retention for application, infrastructure and audit logs.
  flow:
    - kind: teach
      id: situation
      body: |
        An application failed yesterday. Its Deployment was rolled back and the old pods were deleted.
        Today an investigator asks for the failed container's error and the API changes around the incident.
        The current pods' logs cannot answer both requests.

        You will follow logs from node files through collection, forwarding, storage and access control,
        and decide which types need which retention. The local sources come from a lab cluster (OpenShift
        Local 4.21), read by its administrator and by an ordinary user, `developer`. No logging operator is
        installed there, so the forwarding examples are documentation-based and typed practice runs nothing.
      title: Yesterday’s evidence is gone
    - kind: teach
      id: local-logs
      body: |
        CRI-O, the container runtime on OpenShift nodes, writes container standard output and error to node
        files. The kubelet serves their
        available contents through the logs API. `--previous` selects the last terminated instance in
        the same pod, not a previous rollout's deleted pods.

        As [Events, logs, metrics, traces](/lesson/h.observability) explains, files rotate and pod or
        host removal can end access to that evidence; [Collect support data](/lesson/o3.support-data) showed a
        deleted pod's log disappear. The kubelet and CRI-O also write node journals;
        API servers produce audit records. These sources answer different questions and need collection
        if you expect to search them after replacement.
      title: Local logs are a short window
    - kind: show
      id: talker-logs
      body: "developer runs a pod that prints two lines, then reads its log:"
      run: "oc run talker --image=registry.access.redhat.com/ubi9/ubi-minimal:latest --image-pull-policy=IfNotPresent --restart=Never -- sh -c 'echo order 1001 accepted; echo order 1002 failed: payment timeout; sleep 3600' && oc wait pod/talker --for=condition=Ready --timeout=120s && oc logs talker"
      notice: "The pod is created and Ready, and the kubelet serves both lines from the node's log file."
    - kind: show
      id: talker-deleted
      body: "The pod is deleted, as a rollout or a scale-down would delete it, then developer asks again:"
      run: "oc delete pod talker --grace-period=1 && oc logs talker"
      notice: |
        The pod is deleted, then `NotFound`: the log went with the pod. Nothing had collected it, so the line
        about order 1002 exists nowhere any more.
    - kind: show
      id: node-journal
      body: "The node's own services log to its journal, which the administrator can read through the API:"
      run: "oc adm node-logs crc -u crio --tail=3"
      notice: |
        The last three lines of CRI-O's journal on `crc`, among them its own record of removing the `talker`
        container a moment ago. The node knows the container existed, but not what it printed. A node journal is
        infrastructure evidence, and it lives on that host only.
    - kind: show
      id: audit-files
      body: "The API server's audit records are files on the control-plane node. `--path` lists a directory under `/var/log`:"
      run: "oc adm node-logs crc --path=kube-apiserver/"
      notice: |
        The current `audit.log` and older, rotated files with a timestamp in their names. They record who called
        the API and when. Rotation removes the oldest files, and a replaced control-plane host takes them all
        with it, which is why audit records that must be kept are collected off the node.
    - kind: ask
      id: deleted-pod
      recalls: h.observability
      prompt: The failed pod was deleted yesterday and no collector shipped its logs. What can --previous retrieve
        today?
      choices:
        - text: All replicas from the previous Deployment revision
          why: Deployment revision history does not archive container standard output.
        - text: No log from that deleted pod
          why: Previous selects a terminated container in an existing pod; it is not a rollout archive.
        - text: The old application output from API audit records
          why: Audit records describe API activity, not everything the application printed.
      answer: 1
    - kind: teach
      id: pipeline
      body: |
        In OpenShift Logging 6, the Logging Operator manages **Vector** collectors. A
        **ClusterLogForwarder**, using `observability.openshift.io/v1`, declares sources, filters,
        destinations and pipelines; the operator turns it into collector configuration.

        The **Loki Operator** can provide a **LokiStack**, which stores logs in object storage (bucket
        storage such as S3). Alternatively, forward to external destinations. The console logging view is
        provided by the Cluster Observability Operator's Logging UIPlugin. Collection, storage and the UI
        are separate pieces: installing one does not imply all are configured.

        Older guides (Logging 5) describe a `ClusterLogging` object with Elasticsearch, Kibana and Fluentd.
        Logging 6 replaced them, and those APIs no longer exist.
      title: Four pieces of the logging system
    - kind: show
      id: forwarder-shape
      code: |
        # ClusterLogForwarder excerpt; outputs must be defined separately
        apiVersion: observability.openshift.io/v1
        kind: ClusterLogForwarder
        metadata:
          name: team-logs
          namespace: openshift-logging
        spec:
          serviceAccount:
            name: collector
          pipelines:
          - name: applications
            inputRefs: [application]
            outputRefs: [central-store]
      origin: example
      caption: 'Red Hat OpenShift Logging 6.6: Configure inputs and set up log forwarding; adapted forwarder excerpt,
        not a complete manifest.'
      notice: The pipeline connects an input to a named output. central-store needs a valid output definition, credentials
        and connectivity; this excerpt does not install a collector or store by itself.
    - kind: show
      id: no-forwarder-api
      body: "On the lab cluster, the administrator asks for forwarders:"
      run: "oc get clusterlogforwarders -A"
      notice: |
        The server does not have that resource type: the API exists only once the Logging Operator is installed and
        has registered its custom resource definitions.
    - kind: show
      id: logging-packages
      body: "The operators are offered by the cluster's Red Hat catalog, not installed:"
      run: "oc get packagemanifests -n openshift-marketplace -l catalog=redhat-operators | grep -E '^(cluster-logging|loki-operator|cluster-observability-operator) '"
      notice: "The three pieces named above: the Logging Operator (`cluster-logging`), the Loki Operator and the Cluster Observability Operator."
    - kind: show
      id: logging-channel
      run: "oc get packagemanifest cluster-logging -n openshift-marketplace -o jsonpath='{.status.defaultChannel}{\"\\n\"}'"
      notice: "`stable-6.6`: the catalog's default channel is Logging 6.6, the version this lesson describes."
    - kind: ask
      id: old-guide
      prompt: A guide tells you to create a ClusterLogging object with Elasticsearch and Kibana. Your cluster runs
        Logging 6. What do you do?
      choices:
        - text: Create it; Logging 6 still reads that object
          why: Logging 6 removed the `logging.openshift.io` APIs, so the guide describes an architecture this version
            does not have.
        - text: Rewrite it as a ClusterLogForwarder with a destination
          why: Logging 6 configures collection with a ClusterLogForwarder. Storage is separate, for example a
            LokiStack.
        - text: Ask the Logging operator to deploy Elasticsearch
          why: The Logging 6 operator no longer deploys Elasticsearch, Kibana or Fluentd. Forwarding to an external
            Elasticsearch is still supported.
      answer: 1
    - kind: teach
      id: inputs
      body: |
        **Application logs** come from user workloads. **Infrastructure logs** include platform
        containers and node journals. **Audit logs** record security-relevant activity such as API calls.
        Audit collection is explicit: installing logging does not automatically retain those records.

        The collector ServiceAccount needs roles for the selected inputs: collect-application-logs,
        collect-infrastructure-logs and, for audit, collect-audit-logs. Bind the needed role before adding
        a new log type to the forwarder. Adding audit without authorisation can stop the whole collector,
        not merely drop the audit stream.
      title: Choose log types intentionally
    - kind: ask
      id: audit-history
      prompt: Only application and infrastructure pipelines were configured last week. Where are last week’s audit
        records in LokiStack?
      choices:
        - text: They were never forwarded there
          why: Audit needs an explicit pipeline and the collector’s audit role; adding them today cannot backfill
            unavailable history.
        - text: Automatically in the infrastructure tenant
          why: Audit is a distinct input and tenant, not an implicit part of infrastructure collection.
        - text: Automatically visible to every project developer
          why: Audit data needs explicit collection and restricted access; project log access does not grant it.
      answer: 0
    - kind: order
      id: audit-change
      prompt: Order a safe change to add audit forwarding to an existing collector.
      items:
        - Choose an approved destination, retention and access policy for audit data.
        - Grant collect-audit-logs to the forwarder’s collector ServiceAccount.
        - Add the audit pipeline and its output configuration.
        - Check authorisation, validity, readiness and arrival at the destination.
      why: Authorise the input before requesting it, then prove end-to-end delivery. Forwarder readiness alone does
        not establish that stored records are searchable.
    - kind: teach
      id: health
      body: |
        Inspect the forwarder's status conditions. `observability.openshift.io/Authorized` checks
        collector permissions, `observability.openshift.io/Valid` reports configuration validation,
        and `Ready` reports reconciliation. Per-item conditions can identify an invalid input, output
        or pipeline.

        If collection stops after adding an input, check authorisation first. If validation fails,
        correct the named item. If those are healthy but records do not arrive, follow collector logs,
        credentials, network reachability and destination health. A startup backlog can briefly cause
        Loki rate limits; observe recovery before increasing limits.
      title: Separate permission failure from bad configuration
    - kind: show
      id: inspect-forwarder
      code: |
        $ oc get clusterlogforwarder team-logs -n openshift-logging -o yaml
      origin: example
      caption: 'Red Hat OpenShift Logging 6.6: Troubleshoot; forwarder inspection command example.'
      notice: Read status.conditions as well as spec. Then compare the permitted inputs with the ServiceAccount
        and pipelines.
