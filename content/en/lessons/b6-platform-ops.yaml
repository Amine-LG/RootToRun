          --all-pods, oc logs -n shop deployments/checkout --all-pods, oc logs deployments/checkout --all-pods=true
          -n shop, oc -n shop logs deployments/checkout --all-pods=true, oc logs -n shop deployments/checkout --all-pods=true,
        oc logs deployments/checkout --namespace shop --all-pods, oc logs deployments/checkout --all-pods --namespace
          shop, oc --namespace shop logs deployments/checkout --all-pods, oc logs --namespace shop deployments/checkout
          --all-pods, oc logs deployments/checkout --namespace shop --all-pods=true, oc logs deployments/checkout
          --all-pods=true --namespace shop, oc --namespace shop logs deployments/checkout --all-pods=true, oc logs
          --namespace shop deployments/checkout --all-pods=true, oc logs deployments/checkout --namespace=shop --all-pods,
        oc logs deployments/checkout --all-pods --namespace=shop, oc --namespace=shop logs deployments/checkout
          --all-pods, oc logs --namespace=shop deployments/checkout --all-pods, oc logs deployments/checkout --namespace=shop
          --all-pods=true, oc logs deployments/checkout --all-pods=true --namespace=shop, oc --namespace=shop logs
          deployments/checkout --all-pods=true, oc logs --namespace=shop deployments/checkout --all-pods=true]
      hints:
        - match: ^oc logs(?!.*--all-pods)
          say: Naming a Deployment alone can choose one replica. Request all its pods.
        - match: --all-containers
          say: All containers and all pods are different dimensions. Each pod here has one container; you need every
            replica.
      hint: Name the checkout Deployment and use --all-pods with namespace shop.
      then: The real command would request each replica’s available log and prefix lines by pod. It still cannot
        recover logs from deleted pods or rotated files.
    - kind: teach
      id: metrics
      body: |
        **Metrics** are numeric time series: request counts, error ratios, latency distributions and
        resource use. **Prometheus**, the monitoring system OpenShift ships, **scrapes** an application's metrics endpoint (it
        requests the current values over HTTP at a fixed interval) and stores them for queries over time.
        Metrics make trends convenient to analyse; collected logs can also reveal trends when queried.

        Each distinct label-value combination creates another series. Use bounded labels such as status
        class; user IDs and request IDs can create unbounded **cardinality**, the number of distinct series,
        and overwhelm storage and queries.

        The resource Metrics API used by top and resource-based autoscaling is served by Metrics Server
        in OpenShift. It is different from the historical Prometheus query interface.
      title: Ask how much, how often and since when
    - kind: show
      id: no-metrics
      body: "On the lab cluster, developer asks for the current CPU and memory use of the project's pods:"
      run: "oc adm top pods"
      notice: |
        `error: Metrics API not available`. Monitoring is disabled on this cluster, and with it the Metrics API.
        Events and logs still work, because the API server and the kubelet provide them without any monitoring
        stack.
    - kind: ask
      id: labels
      prompt: Which metric label is the safest starting choice for counting HTTP requests?
      choices:
        - text: A unique request ID on every request
          why: Every value creates a distinct series. Use request IDs in logs or traces instead.
        - text: A bounded response status class
          why: A small known set of values controls series growth while supporting error-ratio queries.
        - text: The full URL including user-specific query text
          why: Unbounded query values can generate a new series for nearly every request.
      answer: 1
    - kind: teach
      id: alerts
      body: |
        Prometheus evaluates rules; **Alertmanager** groups related alerts, applies silences and routes
        notifications. An alert should describe an actionable symptom, such as user errors, and point
        to a response. Busy CPU alone does not establish user impact.

        A rule's `for` duration delays firing until its condition has remained true long enough, filtering
        brief spikes. Too many unhelpful pages produce alert fatigue. The next monitoring lesson separates
        platform ownership from application monitoring and notification routing.
      title: Make the notification worth acting on
    - kind: teach
      id: traces
      body: |
        A **trace** links timed operations called **spans** across services for one request. Services
        propagate trace context so you can connect a slow frontend operation with its downstream calls.
        Traces need application instrumentation and a collector and store, such as OpenTelemetry and Tempo.

        Metrics might reveal that checkout became slow at noon. A trace can locate the slow call, and
        logs can explain its error. These signals complement one another; none is complete evidence alone.
      title: Ask where one request spent its time
    - kind: ask
      id: slow-request
      prompt: Metrics show checkout latency increased. You need to locate the slow hop across seven services. Which
        signal helps next?
      choices:
        - text: The pod’s image-pull event
          why: That explains startup, not time spent across calls in an already running request.
        - text: A single node’s current CPU percentage
          why: It may suggest contention but cannot locate the request’s slow downstream hop.
        - text: A distributed trace
          why: Its related spans show where that request spent time, subject to instrumentation and sampling.
      answer: 2
    - kind: teach
      id: what-next
      body: |
        You can choose an initial signal from the symptom, inspect controller events when pods never
        exist, distinguish current from previous container logs, read a container's last termination state,
        and avoid mistaking one replica for a service.

        Next, platform and user-workload monitoring connect metric endpoints to scraping, alert evaluation,
        storage and notification ownership.
      title: What you can do now
  sections:
    - id: four-signals-four-questions
      title: Four signals, four questions
      body: |+
        | Signal | Answers | On OpenShift | Lives for |
        |---|---|---|---|
        | Events | what did Kubernetes do or refuse to do, recently? | `oc get events`, the Events section of `oc describe` | 3 hours by default on OpenShift (the API server's `event-ttl`; upstream Kubernetes defaults to 1 hour) |
        | Logs | what did the program say? | `oc logs` (current and `--previous`); Red Hat OpenShift Logging 6 collects with Vector and stores in LokiStack or forwards to external systems | current and usually one previous instance; latest log file only, unless collected elsewhere |
        | Metrics | how much, how fast, how often, over time? | platform Prometheus in `openshift-monitoring`; monitoring for user-defined projects (opt-in) for apps | 15 days by default for platform Prometheus, if it has storage |
        | Traces | where did this request spend its time across services? | Red Hat build of OpenTelemetry + the distributed tracing platform (Tempo) (add-ons) | whatever the trace store keeps |

      depth: true
    - id: traces-and-choosing
      title: Traces, and choosing a signal
      body: |
        A trace follows one request through several services: each hop records a span with its start, duration and
        result, linked by a trace ID that the services pass along. Traces answer "the checkout takes 4 seconds: which
        of the seven services is slow?", which neither logs nor metrics answer cleanly. They require instrumentation
        in the applications (OpenTelemetry libraries or auto-instrumentation) and a collector and store; on OpenShift
        those are the Red Hat build of OpenTelemetry and the Tempo-based distributed tracing platform, both add-ons.

        | You want to know… | Start with | Then |
        |---|---|---|
        | why a pod is Pending, not pulling, or not created | events (`oc describe`) | the controller's events (ReplicaSet, Deployment) |
        | why a container exits or restarts | `oc logs --previous`, last state and exit code | events (`BackOff`, `Killing`, OOM) |
        | whether users are affected, and since when | metrics (error ratio, latency) | logs of the failing component |
        | where a slow request spends its time | traces | metrics and logs of the slow service |
        | what happened last night | collected logs and metrics | events are already gone |

        Practise the first two rows on real broken workloads:
        [CrashLoopBackOff after a configuration change](/lab/inc.crashloop-config),
        [OOMKilled at start-up](/lab/inc.oomkilled), [Restarts, but no errors](/lab/inc.liveness-restarts),
        [Pending forever](/lab/inc.pending-resources), [ImagePullBackOff](/lab/inc.imagepull) and
        [A Deployment with no pods](/lab/inc.scc-root).
      depth: true
    - id: what-goes-wrong
      title: What goes wrong in triage
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | logs look clean, restarts keep climbing | `oc describe pod`: `Killing` events with liveness probe failures; last state `Error` or `Completed` | the kubelet kills a healthy program because the probe is wrong | fix the probe ([incident](/lab/inc.liveness-restarts)) |
        | restarts, no stack trace in `oc logs` | `oc logs --previous`; last state `OOMKilled` (exit code 137 alone is insufficient evidence) | the evidence is in the previous instance, or the kernel killed it before it could print | raise the memory limit or fix the leak ([incident](/lab/inc.oomkilled)) |
        | Deployment shows 0 pods, no pod events at all | `oc get events` warnings on the ReplicaSet: `FailedCreate` | admission (SCC, quota) rejected the pod before it existed | fix the pod spec or the quota ([incident](/lab/inc.scc-root)) |
        | "nothing in the events" the morning after | event list empty or only recent | events expired (3 hours) | use collected logs and metrics; collect them before you need them |
        | `oc logs deploy/x` shows no error, users see some errors | the "Found N pods, using…" line | `oc logs` read one replica | `oc logs deploy/x --all-pods`, or query the logging stack |
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **Reading only the current container's logs after a crash.** The stack trace is usually in the previous
          instance: `oc logs <pod> --previous`.
        - **Reading `oc logs deploy/<name>` as "the Deployment's logs".** It picks one pod; with several replicas,
          look at each pod or use the logging stack.
        - **Coming back tomorrow for events.** They expire after a few hours by default.
        - **Treating a missing event as proof.** Events are best-effort; absence of a warning is not evidence of
          health.
        - **Using `oc adm top` for capacity planning.** It shows current usage, not requests or limits, and needs
          the Metrics API (absent on the course's OpenShift Local cluster).
        - **Alerting on causes instead of symptoms**, and high-cardinality metric labels (user IDs, request IDs)
          that make Prometheus slow and expensive.
    - id: signal-details
      title: Signal lifetime and alerting details
      depth: true
      body: |
        Events are aggregated, best-effort objects. OpenShift defaults to a three-hour TTL. The `eventTTLMinutes`
        field of the KubeAPIServer object named `cluster` accepts 5–180 minutes; it was Technology Preview in 4.21.0
        and is generally available from 4.21.12 (and in 4.22).
        The upstream API server defaults to one hour. Querying .lastTimestamp is useful for the legacy Event view,
        but counts and times should be read together rather than as an exact incident timeline.

        The Cluster Monitoring Operator manages platform Prometheus, Alertmanager, Thanos Querier, object-state
        exporters, node-exporter and Metrics Server. Metrics Server replaced Prometheus Adapter in 4.16.
        OpenShift tracing is an add-on: Red Hat build of OpenTelemetry plus the Tempo-based tracing platform.

        | Observation | Additional evidence |
        |---|---|
        | Restart, clean current log | Previous instance, termination reason and exit code |
        | OOMKilled | Memory limits and use; exit 137 alone does not establish an OOM |
        | Killing after probe failure | Probe events and configuration, not only application errors |
        | No historical events | Collected logs and stored metrics, not proof of health |
  review:
    - q: Which signal would you check first for a pod that never started?
      a: Events (oc describe pod / oc get events).
    - q: What makes an alert good?
      a: Symptom-based, actionable, rare enough to be read; tied to a runbook.
    - q: How long does OpenShift keep events by default?
      a: 3 hours (the API server's event TTL; upstream Kubernetes defaults to 1 hour).
    - q: What does `oc logs <pod> --previous` return before the container has ever restarted?
      a: 'An error: the previous terminated container is not found.'
    - q: Which pod does `oc logs deploy/<name>` read when there are several replicas?
      a: One of them, which it names; add --all-pods, read each pod, or use the logging stack.
    - q: Which signal answers 'where did this slow request spend its time across services'?
      a: Traces (OpenTelemetry instrumentation and a trace store such as Tempo).
  labs:
    - lab.troubleshooting-tools
    - lab.cluster-health
  limits: |
    Events and container logs are real on OpenShift Local and are practised in the troubleshooting lab and the
    incidents. Metrics, alerting and tracing are not: the course's single-node cluster runs without the monitoring
    stack (it is disabled to fit a laptop's memory), so there is no Prometheus to query, no alert to watch and no
    Metrics API, and neither OpenTelemetry nor a trace store is installed. Those parts are concepts here and need a
    cluster with monitoring enabled.
  references:
    - title: 'Monitoring stack for Red Hat OpenShift 4.21: Monitoring stack architecture'
      url: https://docs.redhat.com/en/documentation/monitoring_stack_for_red_hat_openshift/4.21/html/about_monitoring/monitoring-stack-architecture
    - title: 'Red Hat OpenShift Logging 6.6: Logging overview'
      url: https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.6/html/discover/openshift-logging-overview
    - title: 'Prometheus: Alerting best practices'
      url: https://prometheus.io/docs/practices/alerting/
    - title: 'Prometheus: Alerting rules (the for clause)'
      url: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
    - title: 'Prometheus: Metric and label naming (cardinality)'
      url: https://prometheus.io/docs/practices/naming/
    - title: 'Kubernetes: Logging architecture'
      url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
    - title: 'Kubernetes API: Event (events.k8s.io/v1)'
      url: https://kubernetes.io/docs/reference/kubernetes-api/cluster-resources/event-v1/
    - title: 'OpenShift 4.21: Setting the event time to live (etcd)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/etcd/etcd-performance
    - title: 'OpenTelemetry: Traces'
      url: https://opentelemetry.io/docs/concepts/signals/traces/
    - title: OpenShift 4.21 release notes (eventTTLMinutes, GA from 4.21.12)
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/release_notes/ocp-4-21-release-notes
    - title: kubectl logs reference (--all-pods)
      url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
    - title: 'Kubernetes 1.34 source: the events.k8s.io recorder used by the scheduler sets eventTime'
      url: https://github.com/kubernetes/kubernetes/blob/v1.34.0/staging/src/k8s.io/client-go/tools/events/event_recorder.go
  files:
    crashy.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crashy
      spec:
        replicas: 1
        selector:
          matchLabels: {app: crashy}
        template:
          metadata:
            labels: {app: crashy}
          spec:
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "echo starting app; sleep 20; echo fatal: CONFIG_URL is not set; exit 1"]
    web.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 2
        selector:
          matchLabels: {app: web}
        template:
          metadata:
            labels: {app: web}
          spec:
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "echo serving from $HOSTNAME; sleep infinity"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {memory: 32Mi}
  commands:
    - {cmd: "oc apply -f crashy.yaml && oc rollout status deploy/crashy --timeout=120s", meaning: "an application that fails 20 seconds after it starts"}
    - {cmd: "oc logs deploy/crashy --previous", expect: fail, meaning: "no previous instance yet: the container has never terminated"}
    - {cmd: "oc logs deploy/crashy", meaning: "the current instance's log"}
    - {cmd: "oc wait pod -l app=crashy --for=jsonpath='{.status.containerStatuses[0].restartCount}'=1 --timeout=120s && oc get pods -l app=crashy", meaning: "wait for the first restart"}
    - {cmd: "oc logs deploy/crashy --previous", meaning: "the terminated instance's last words"}
    - {cmd: "oc describe pod -l app=crashy | sed -n '/Last State/,/Restart Count/p'", meaning: "the last termination state: reason and exit code"}
    - {cmd: "oc get events --sort-by=.lastTimestamp", meaning: "what the platform did, in time order"}
    - {cmd: "oc apply -f web.yaml && oc rollout status deploy/web --timeout=120s && oc logs deploy/web", meaning: "a Deployment's logs come from one chosen pod"}
    - {cmd: "oc logs deploy/web --all-pods", meaning: "every replica's log, prefixed with its pod"}
    - {cmd: "oc adm top pods", expect: fail, meaning: "no Metrics API: monitoring is disabled on this cluster"}
- id: n.monitoring
  title: Monitor platform and apps
  subtitle: The platform stack and user workloads
  module: p2-reliability
  mode: EXTERNAL_LAB_REQUIRED
  minutes: 25
  level: 2
  supports: 'OpenShift 4.21 platform and user-workload monitoring: Cluster Monitoring Operator, Prometheus, Alertmanager,
    Thanos and Metrics Server. The course’s OpenShift Local cluster has monitoring disabled: the cluster administrator
    (kubeadmin) and the ordinary user developer recorded what that state looks like, read only. Enabling and using
    monitoring are documentation examples; typed tasks run nothing.'
  record_on: cluster-admin
  concepts:
    - obs.monitoring-stack
    - obs.prometheus
  prerequisites:
    - h.observability
  objective: |
    Explain what OpenShift monitors out of the box, enable and use monitoring for your own applications, route alerts
    to the right people, and stay within what is supported.
  flow:
    - kind: teach
      id: situation
      body: |
        A team creates a ServiceMonitor, an object that tells Prometheus which Service to scrape, and sees
        no application metrics. Another team sees an alert firing in the console but receives no page. Creating an object is only one link in each chain.

        You will trace application metrics from endpoint to scrape and alerts from rule to receiver,
        while keeping platform configuration supported. The course's lab cluster (OpenShift Local 4.21) runs
        with monitoring disabled, and its administrator shows you, read only, what a cluster looks like when the
        objects exist but nothing reads them. Enabling and using the stack are documentation examples.
      title: The monitor exists; the graph is empty
    - kind: teach
      id: two-stacks
      body: |
        OpenShift's **Cluster Monitoring Operator** manages the platform monitoring stack in
        `openshift-monitoring`. Prometheus collects platform metrics; Thanos Querier provides a query
        endpoint used by the console. Metrics Server separately serves the resource metrics used by `oc adm top` and by autoscaling.

        **User workload monitoring** is an optional stack in `openshift-user-workload-monitoring` for
        application projects. An administrator enables it through cluster-monitoring-config. The platform
        Prometheus does not start scraping user applications merely because a team created a ServiceMonitor.
      title: Platform health and application metrics have owners
    - kind: show
      id: monitoring-pods
      body: "On the lab cluster, the administrator looks where the platform stack would run:"
      run: "oc get pods -n openshift-monitoring"
      notice: "`No resources found in openshift-monitoring namespace.`: the namespace exists, but no Prometheus, Alertmanager, Thanos Querier or Metrics Server runs in it."
    - kind: show
      id: monitoring-co
      run: "oc get clusteroperator monitoring"
      notice: "NotFound: the monitoring cluster operator, which reports the stack's health on every installed cluster, does not exist here."
    - kind: show
      id: monitoring-overrides
      body: "How OpenShift Local switches it off: the ClusterVersion object lists components the Cluster Version Operator must leave alone."
      run: "oc get clusterversion version -o jsonpath='{range .spec.overrides[*]}{.kind}{\" \"}{.namespace}{\"/\"}{.name}{\" unmanaged=\"}{.unmanaged}{\"\\n\"}{end}'"
      notice: |
        The first two lines mark the `cluster-monitoring-operator` Deployment and the `monitoring` ClusterOperator
        as unmanaged: the Cluster Version Operator no longer creates or reconciles them, and OpenShift Local has
        removed them, so nothing starts or reports the monitoring stack; the other lines switch off cloud
        credentials, the cluster autoscaler and the cloud controller manager the same way. OpenShift Local does
        this to save memory, and pays for it: with overrides set, the cluster reports `Upgradeable=False`
        (`ClusterVersionOverridesSet`). `Upgradeable=False` normally blocks only updates to a new minor version;
        with overrides set, patch updates are refused too. [Check a cluster's health](/lesson/n.cluster-admin-health)
        read the same overrides.
    - kind: show
      id: enable-user-monitoring
      code: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: cluster-monitoring-config
          namespace: openshift-monitoring
        data:
          config.yaml: |
            enableUserWorkload: true
      origin: example
      caption: 'Monitoring stack for Red Hat OpenShift 4.21: Configuring user workload monitoring; enabling example.'
      notice: The setting is inside the config.yaml data value. This minimal example is for reading; preserve existing
        configuration when an administrator edits a real ConfigMap.
    - kind: show
      id: no-monitoring-config
      body: "On the lab cluster, that ConfigMap has never been created:"
      run: "oc get configmap cluster-monitoring-config -n openshift-monitoring"
      notice: "NotFound. On a cluster where the operator runs, its absence means default settings, with user workload monitoring off."
    - kind: ask
      id: monitor-only
      prompt: User workload monitoring is disabled. An authorised developer creates a valid ServiceMonitor. What
        should they expect?
      choices:
        - text: An accepted object without application scraping
          why: The API kind can exist while the user-workload stack that consumes it is disabled.
        - text: Immediate scraping by platform Prometheus
          why: The platform stack monitors platform components; user projects need the separate enabled stack.
        - text: Automatic installation of a new monitoring operator
          why: A ServiceMonitor declares a scrape target; it does not install its controller.
      answer: 0
    - kind: show
      id: monitors-exist
      body: "The lab cluster shows that state at platform scale. The administrator counts the ServiceMonitors, then looks for something to read them:"
      run: "oc get servicemonitors -A --no-headers | wc -l"
      notice: "`46` ServiceMonitors: the platform's own operators ship one for each component they want scraped."
    - kind: show
      id: monitors-sample
      run: "oc get servicemonitors -A | head -n 4"
      notice: "The first few, in platform namespaces such as `openshift-apiserver`. They are ordinary, valid objects."
    - kind: show
      id: no-prometheus
      run: "oc get prometheuses,alertmanagers -A"
      notice: |
        `No resources found`: no Prometheus and no Alertmanager exist to read those monitors or deliver alerts. The
        monitors are accepted, and nothing scrapes them: a valid object is one link of the chain, not the chain.
    - kind: teach
      id: service-selection
      body: |
        The app must expose Prometheus-format metrics, commonly at `/metrics`. A **ServiceMonitor**
        selects Services by their metadata labels, then names a Service port to scrape. The Service in
        turn selects pods. These are two different label relationships.

        A **PodMonitor** selects pods directly. With either, the endpoint must be reachable from monitoring;
        a NetworkPolicy can block it. A valid monitor with no matching targets and a selected target that
        is down require different investigations.

        Before comparing labels, check two switches: user workload monitoring must be enabled, and neither
        the project nor the monitor may carry the label `openshift.io/user-monitoring=false`, which excludes
        it from user workload monitoring.
      title: Select the Service, then its named port
    - kind: show
      id: monitor-pair
      code: |
        # Two objects in the same application project; excerpts
        apiVersion: v1
        kind: Service
        metadata:
          name: web
          labels: {app: web}
        spec:
          selector: {app: web}
          ports:
          - name: metrics
            port: 9090
            targetPort: 9090
        ---
        apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: web
        spec:
          selector:
            matchLabels: {app: web}
          endpoints:
          - port: metrics
            interval: 30s
      origin: example
      caption: 'Monitoring stack for Red Hat OpenShift 4.21: Configuring user workload monitoring; adapted Service
        and ServiceMonitor examples.'
      notice: The monitor matches metadata.labels on the Service, and endpoints.port matches its port name metrics.
        It does not match the port number or directly select pod labels.
    - kind: ask
      id: port-name
      prompt: A monitor already selects the Service, but its endpoints.port is `metrics` and the Service port is
        named `http-metrics`. What should change?
      choices:
        - text: Add a port named `metrics` to the container
          why: A ServiceMonitor reads the Service's port names. The container's port list is not consulted.
        - text: Set endpoints.port to `http-metrics`
          why: endpoints.port must equal the Service port's name exactly.
        - text: Match the monitor selector to the pod labels
          why: The selector matches the Service's labels, and this Service is already selected. Pod labels never count.
      answer: 1
    - kind: show
      id: inspect-monitor
      code: |
        $ oc get service web -n shop -o yaml
        $ oc get servicemonitor web -n shop -o yaml
      origin: example
      caption: 'Monitoring stack for Red Hat OpenShift 4.21: Troubleshooting monitoring issues; comparison command
        examples.'
      notice: Compare Service labels and port names with the monitor’s selector and endpoints. Then use Observe
        > Targets to distinguish absent targets from scrape failures.
    - kind: try
      id: monitor-task
      body: Hypothetical project billing has ServiceMonitor api. Inspect that monitor as YAML, explicitly naming
        the project. Nothing runs.
      accept: [oc get servicemonitor api -n billing -o yaml, oc get servicemonitors api -n billing -o yaml, oc get
          servicemonitor/api -n billing -o yaml, oc get servicemonitor api -o yaml -n billing, oc -n billing get
          servicemonitor api -o yaml, oc get servicemonitor api --namespace=billing --output=yaml, oc get servicemonitor
          api -n billing --output yaml, oc get -n billing servicemonitor api -o yaml, oc get servicemonitor api
          --namespace billing -o yaml, oc get servicemonitor api -o yaml --namespace billing, oc --namespace billing
          get servicemonitor api -o yaml, oc get --namespace billing servicemonitor api -o yaml, oc get servicemonitor
          api --namespace=billing -o yaml, oc get servicemonitor api -o yaml --namespace=billing, oc --namespace=billing
          get servicemonitor api -o yaml, oc get --namespace=billing servicemonitor api -o yaml, oc get servicemonitor
          api --output yaml -n billing, oc -n billing get servicemonitor api --output yaml, oc get -n billing servicemonitor
          api --output yaml, oc get servicemonitor api --namespace billing --output yaml, oc get servicemonitor
          api --output yaml --namespace billing, oc --namespace billing get servicemonitor api --output yaml, oc
          get --namespace billing servicemonitor api --output yaml, oc get servicemonitor api --namespace=billing
          --output yaml, oc get servicemonitor api --output yaml --namespace=billing, oc --namespace=billing get
          servicemonitor api --output yaml, oc get --namespace=billing servicemonitor api --output yaml, oc get
          servicemonitor api -n billing --output=yaml, oc get servicemonitor api --output=yaml -n billing, oc -n
