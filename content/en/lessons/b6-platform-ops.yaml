    - {cmd: "oc delete pod talker --grace-period=1 && oc logs talker", as: developer, expect: fail, meaning: "the log is gone with the pod"}
    - {cmd: "oc adm node-logs crc -u crio --tail=3", as: admin, meaning: "the CRI-O journal on the node"}
    - {cmd: "oc adm node-logs crc --path=kube-apiserver/", as: admin, meaning: "the API server's audit log files on the node"}
    - {cmd: "oc get clusterlogforwarders -A", as: admin, expect: fail, meaning: "no such resource type: no Logging Operator"}
