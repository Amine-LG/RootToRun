    - kind: teach
      id: access
      body: |
        The collector's collect-* roles permit reading sources for forwarding. They do not grant
        application developers access to the stored logs.

        LokiStack keeps application, infrastructure and audit logs in separate **tenants**, each with its own
        access rules. Project RoleBindings to
        cluster-logging-application-view can give a team its own project's log access. Infrastructure
        and audit use separate view roles or authorised administrator groups. Choose both the collection
        scope and the query access scope, especially when sending another copy to an external system.
      title: Collection permission is not read permission
    - kind: ask
      id: read-permission
      prompt: The collector ships a team's application logs to LokiStack, but its developers see nothing in Observe >
        Logs. What is missing?
      choices:
        - text: The collect-application-logs role, given to each developer
          why: That role belongs to the collector's ServiceAccount, which reads the sources. People need a view role.
        - text: The application log view role, bound in their project
          why: Reading stored logs is a separate grant from collecting them. A RoleBinding to
            cluster-logging-application-view gives a team its own project's application logs.
        - text: A second ClusterLogForwarder pipeline for that team
          why: Pipelines decide where logs go, not who may query them. Delivery already works.
      answer: 1
    - kind: teach
      id: retention
      body: |
        Configure global or per-tenant LokiStack retention in days. With no LokiStack retention configured,
        LokiStack does not prune logs; object-storage lifecycle rules are a separate policy. Supported short-term LokiStack storage is up to
        30 days; longer audit or compliance retention needs a suitable external destination and policy.

        The same collector can send to LokiStack and to an external system such as a corporate SIEM (a
        security information and event management system).
        Each copy needs its own access, retention and capacity plan. Filter what you do not need, and
        keep secrets out of application output: forwarding replicates a leaked token too.
      title: Decide when copies expire
    - kind: reflect
      id: logging-design
      prompt: Design destinations for developers debugging this week and auditors investigating much later.
      model: Collect application logs to a short-term searchable store with project read access. Explicitly collect
        authorised audit inputs to an approved external audit store with the required longer retention and restricted
        access. Verify delivery, expiry and access at each destination; installing the operator alone proves none
        of these.
    - kind: teach
      id: what-next
      body: |
        You can explain what local logs can recover, follow a forwarder pipeline, add audit collection
        in the right order, and separate source permissions from query access and retention.

        Next, [Keep events with the Event Router](/lesson/p.event-router) forwards expiring events into the log pipeline; then SLOs use these signals to agree reliability targets and guide alerting, incident response
        and system improvements.
      title: What you can do now
  sections:
    - id: openshift-logging-6-collector
      title: 'Logging 6: collector, forwarder, store, view'
      body: |
        | Piece | Provided by | Job |
        |---|---|---|
        | **Vector** collector (a pod on every node) | Red Hat OpenShift Logging Operator | reads container logs, node journals and audit logs |
        | **ClusterLogForwarder** (`observability.openshift.io/v1`) | same operator | declares inputs, filters, outputs and pipelines; the operator configures Vector from it |
        | **LokiStack** (optional) | Loki Operator | stores logs in object storage, with per-tenant access control |
        | **Logs view** in Observe | Cluster Observability Operator (a `UIPlugin` of type Logging) | queries LokiStack from the console |

        Logging 6.0 was a clean break: the operator no longer deploys Elasticsearch, Kibana or Fluentd, the old
        `logging.openshift.io` APIs are gone, and there was no automated migration. Forwarding to an *external*
        Elasticsearch is still a supported output. Material describing `ClusterLogging` objects or Kibana is outdated.
      depth: true
    - id: inputs-outputs-and-the
      title: Inputs, outputs and the collector's permissions
      body: |
        Logs come in three types: **application** (user projects), **infrastructure** (platform projects and node
        journals) and **audit** (API server and node audit records). Audit logs are **not** collected or stored unless a
        pipeline asks for them explicitly.

        Outputs include LokiStack, Loki, Splunk, Elasticsearch, Kafka, syslog, HTTP, OTLP, Amazon CloudWatch, Google
        Cloud Logging and S3, so the same collector can feed both the cluster's own LokiStack and a corporate SIEM.

        The collector runs as a **ServiceAccount you create**, named in the ClusterLogForwarder, and needs the cluster
        roles `collect-application-logs`, `collect-infrastructure-logs` and, only if you forward them,
        `collect-audit-logs`. Bind the roles before adding a log type to the forwarder; otherwise the operator removes
        the collector.
      depth: true
    - id: access-and-retention
      title: Access and retention
      body: |
        LokiStack keeps the three types in separate tenants. Read access is RBAC: cluster roles such as
        `cluster-logging-application-view` bound with a RoleBinding let a team read only its own project's logs.
        Infrastructure and audit logs need their own view roles (`cluster-logging-infrastructure-view`,
        `cluster-logging-audit-view`) or membership of the LokiStack's administrator groups.

        Retention is configured in the LokiStack (globally or per tenant, in days). If neither LokiStack retention nor bucket lifecycle deletion is configured, logs are never
        pruned from the bucket. LokiStack is supported for short-term storage (up to 30 days); long retention for audit
        or compliance belongs in a system built for it, fed by another output.
      depth: true
    - id: when-logs-are-missing
      title: When logs are missing
      body: |
        The ClusterLogForwarder reports its own health in three conditions, read with
        `oc get clusterlogforwarder <name> -n <namespace> -o jsonpath='{.status.conditions}'`:
        `observability.openshift.io/Authorized` (the collector's ServiceAccount holds the roles for every input),
        `observability.openshift.io/Valid` (the spec passes validation) and `Ready` (the operator reconciled it).

        | Symptom | Evidence | Likely cause | Fix |
        |---|---|---|---|
        | all collection stopped after a forwarder change | Authorized is False; the collector DaemonSet is gone | a log type was added before its `collect-*` role was bound: the operator removes the **whole** collector until it is | bind the role to the collector's ServiceAccount, then add the input |
        | the forwarder does nothing | Valid is False; per-item conditions (`ValidInput-…`, `ValidOutput-…`, `ValidPipeline-…`) name the faulty part | an input, output, filter or pipeline in the spec does not validate | correct that item and read the conditions again |
        | a developer sees no logs in Observe > Logs | the developer's bindings in the project | no RoleBinding of `cluster-logging-application-view` in that project (or no logging UI plugin installed) | bind the view role per project |
        | no audit records | the pipelines in the forwarder | no pipeline includes the audit input | add it, with the audit role and a destination fit for audit |
        | rate-limit errors (429) from LokiStack shortly after installation | collector logs | the collector flushes the backlog it accumulated | usually clears within minutes; watch it before tuning limits |
        | object storage keeps growing | LokiStack retention and bucket lifecycle configuration | no expiry policy | set supported Loki retention; use longer bucket lifecycle expiry as a safety net |
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **Treating `oc logs` as history.** It only sees containers that still exist on their node.
        - **Assuming audit logs are kept** because logging is installed. They are collected only when a pipeline includes
          them.
        - **No retention policy.** Without LokiStack retention or an independent bucket lifecycle policy, the bucket keeps growing.
        - **Following old documentation** with `ClusterLogging`, Fluentd or Kibana: those belong to Logging 5.
        - **Logging secrets.** Tokens and passwords printed by applications end up in every copy of the logs, including
          the SIEM.
        - **Forwarding everything everywhere.** Infrastructure logs are large; send each type only where it is used.
  review:
    - q: Which objects configure log collection in OpenShift Logging 6?
      a: A ClusterLogForwarder (observability.openshift.io/v1) plus a ServiceAccount with the collect-* cluster
        roles; Vector runs as the collector.
    - q: Which three log types does OpenShift Logging distinguish?
      a: Application, infrastructure and audit.
    - q: Are audit logs collected by default when logging is installed?
      a: No; a pipeline must include them and the collector needs collect-audit-logs.
    - q: What happens to Loki data if no retention is configured on the LokiStack?
      a: LokiStack does not prune it. Without an independent bucket lifecycle policy, it remains in object storage
        indefinitely.
    - q: What did Logging 6.0 stop deploying?
      a: Elasticsearch, Kibana and Fluentd (and the logging.openshift.io APIs).
  labs:
    - lab.troubleshooting-tools
  limits: |
    No logging stack runs on the course's cluster. The recording shows the local sources only: a container log
    that disappears with its pod, the CRI-O journal, the list of audit log files on the node, the missing
    ClusterLogForwarder API and the operators available in the catalog. Collection, forwarding, tenant access and
    retention are documentation-based examples: deploying Vector, LokiStack and the logging UI needs object
    storage and more memory than this single-node cluster has. The linked troubleshooting lab practises local
    container logs and previous-instance retrieval; it does not establish durable log retention.
  enterprise: |
    In regulated organisations, audit logs go off-cluster to a SIEM with long retention and restricted access,
    application logs go to a store teams can search with project-level RBAC, and retention periods are set per log type
    from legal and operational requirements, then sized and budgeted.
  references:
    - title: 'Red Hat OpenShift Logging 6.6: Logging overview'
      url: https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.6/html/discover/openshift-logging-overview
    - title: 'Red Hat OpenShift Logging 6.6: Setting up log forwarding'
      url: https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.6/html/configure/set-up-log-forwarding
    - title: 'Red Hat OpenShift Logging 6.6: Creating a LokiStack'
      url: https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.6/html/configure/create-the-lokistack
    - title: 'Red Hat OpenShift Logging 6.6: Controlling access to Loki logs'
      url: https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.6/html/secure/control-access-to-loki-logs
    - title: 'Red Hat OpenShift Logging 6.6: Troubleshoot'
      url: https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.6/html/troubleshoot/index
    - title: Red Hat OpenShift Operator life cycles
      url: https://access.redhat.com/support/policy/updates/openshift_operators
    - title: 'Red Hat OpenShift Logging 6.6: Configure inputs (audit permissions and collector shutdown)'
      url: https://docs.redhat.com/en/documentation/red_hat_openshift_logging/6.6/html/configure/configure-inputs
    - title: 'Kubernetes: Logging architecture (rotation and previous container logs)'
