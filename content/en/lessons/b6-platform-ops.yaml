        - match: ^oc logs(?!.*(?:--previous| -p\b))
          say: Default logs select the current instance. Add --previous for the last terminated one.
        - match: ^oc logs(?!.*(?:\s-c\b|--container))
          say: api-8 has two containers, so the command must say which one. Add -c server.
