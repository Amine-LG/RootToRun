      then: On a real cluster the kubelet would return the available previous server log for api-8. Capture it promptly;
        another restart or pod removal can make that evidence unavailable.
    - kind: teach
      id: replicas
      body: |
        A logs request naming a Deployment normally picks one pod. A failure on another replica can
        therefore be invisible. Read specific pods or request `--all-pods` when you need every replica;
        name a container when several exist.

        Node files rotate by size, and the logs API serves only the latest file for the selected instance.
        Pod removal, eviction and host replacement make this history unreliable for later investigations.
        Collect logs off the node before you need durable, searchable history.
      title: One replica is not the whole service
    - kind: ask
      id: missing-error
      prompt: One of three replicas fails requests; logs selected through the Deployment look clean. What should
        you check?
      choices:
        - text: Each replica, or all pods together
          why: A Deployment logs request can select a healthy replica and miss the failing one.
        - text: Only the selected replica for another hour
          why: More lines from the same healthy pod do not reveal the other pod’s failure.
        - text: Only older events after they expire
          why: Events have short retention and do not contain every application request error.
      answer: 0
    - kind: show
      id: one-replica
      body: "developer runs `web`, a Deployment with two replicas whose container runs `echo serving from $HOSTNAME; sleep infinity`: each replica prints the name of its pod."
      run: "oc apply -f web.yaml && oc rollout status deploy/web --timeout=120s && oc logs deploy/web"
      notice: |
        `oc logs deploy/web` says it found 2 pods and chose one, and prints only that pod's line. The other
        replica's log was not read.
    - kind: show
      id: all-pods-example
      run: "oc logs deploy/web --all-pods"
      notice: |
        Both replicas, each line prefixed with its pod and container. Central collection is better suited to
        longer time windows and queries across many workloads.
