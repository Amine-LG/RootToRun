  files:
    pod-tier.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: tier
      spec:
        nodeSelector:
          lab-tier: demo
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
    pod-affine.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: affine
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - {key: lab-tier, operator: In, values: [demo, staging]}
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                - {key: disktype, operator: In, values: [ssd]}
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
    pod-plain.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: plain
      spec:
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
    pod-tolerant.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: tolerant
      spec:
        tolerations:
        - key: lab-demo
          operator: Equal
          value: "true"
          effect: NoSchedule
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
    apart.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: apart
      spec:
        replicas: 2
        selector:
          matchLabels: {app: apart}
        template:
          metadata:
            labels: {app: apart}
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: {matchLabels: {app: apart}}
                  topologyKey: kubernetes.io/hostname
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              imagePullPolicy: IfNotPresent
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {memory: 32Mi}
    spread.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: spread
      spec:
        replicas: 3
        selector:
          matchLabels: {app: spread}
        template:
          metadata:
            labels: {app: spread}
          spec:
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector: {matchLabels: {app: spread}}
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              imagePullPolicy: IfNotPresent
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {memory: 32Mi}
  commands:
    - {cmd: "oc get nodes", as: admin, meaning: "the cluster's nodes: one, crc, control plane and worker at once"}
    - {cmd: "oc get node crc -L lab-tier -L topology.kubernetes.io/zone", as: admin, meaning: "two label columns, both empty: no lab-tier label, no zone label"}
    - {cmd: "oc describe node crc | grep -E '^(Taints|Unschedulable):'", as: admin, meaning: "no taints, and the node accepts new pods"}
    - {cmd: "oc apply -f pod-tier.yaml", as: developer, meaning: "a pod that requires the label lab-tier=demo"}
    - {cmd: "oc wait pod/tier --for=condition=PodScheduled=false --timeout=60s", as: developer, meaning: "the scheduler found no node for it"}
    - {cmd: "oc get events --field-selector reason=FailedScheduling,involvedObject.name=tier", as: developer, meaning: "the reason: the node does not match the selector"}
    - {cmd: "oc get nodes", as: developer, expect: fail, meaning: "Forbidden: an ordinary user cannot read nodes"}
    - {cmd: "oc label node crc lab-tier=demo", as: admin, meaning: "the administrator labels the node"}
    - {cmd: "oc wait pod/tier --for=condition=Ready --timeout=120s && oc get pod tier -o wide", as: developer, meaning: "the waiting pod is scheduled on crc without being recreated"}
    - {cmd: "oc apply -f pod-affine.yaml && oc wait pod/affine --for=condition=Ready --timeout=120s", as: developer, meaning: "required affinity matches; the unmet preference does not block"}
    - {cmd: "oc adm taint node crc lab-demo=true:NoSchedule", as: admin, meaning: "a NoSchedule taint with the lesson's own key, for well under a minute"}
    - {cmd: "oc describe node crc | grep -E '^(Taints|Unschedulable):'", as: admin, meaning: "the taint is on the node"}
    - {cmd: "oc apply -f pod-plain.yaml && oc wait pod/plain --for=condition=PodScheduled=false --timeout=60s", as: developer, meaning: "a pod without rules is not scheduled"}
    - {cmd: "oc get events --field-selector reason=FailedScheduling,involvedObject.name=plain", as: developer, meaning: "the reason names the untolerated taint"}
    - {cmd: "oc get pods -o wide", as: developer, meaning: "the running pods stay; plain is Pending"}
    - {cmd: "oc apply -f pod-tolerant.yaml && oc wait pod/tolerant --for=condition=Ready --timeout=120s", as: developer, meaning: "a pod with a matching toleration is scheduled on the tainted node"}
    - {cmd: "oc adm taint node crc lab-demo-", as: admin, meaning: "remove the taint"}
    - {cmd: "oc wait pod/plain --for=condition=Ready --timeout=120s && oc describe pod plain | sed -n '/^Events:/,$p'", as: developer, meaning: "plain is scheduled once the taint is gone; its events tell the story"}
    - {cmd: "oc describe pod tolerant | grep -A4 '^Tolerations:'", as: developer, meaning: "the pod's toleration and the default ones"}
    - {cmd: "oc label node crc lab-tier-", as: admin, meaning: "remove the label"}
    - {cmd: "oc get pod tier -o wide", as: developer, meaning: "still running: the selector is ignored during execution"}
    - {cmd: "oc get node crc -L lab-tier && oc describe node crc | grep '^Taints:'", as: admin, meaning: "the node is back to no label and no taint"}
    - {cmd: "oc apply -f apart.yaml -f spread.yaml && oc rollout status deploy/spread --timeout=120s", as: developer, meaning: "required anti-affinity and a hostname spread constraint on one node"}
    - {cmd: "oc get pods -l 'app in (apart,spread)' -o wide", as: developer, meaning: "one apart replica Pending; all spread replicas Running"}
    - {cmd: "oc get events --field-selector reason=FailedScheduling -o custom-columns=POD:.involvedObject.name,MESSAGE:.message", as: developer, meaning: "every scheduling refusal of the lesson"}
    - {cmd: "oc get scheduler cluster -o jsonpath='{.spec}{\"\\n\"}'", as: admin, meaning: "the cluster's scheduler settings: default profile, schedulable control plane"}
  experiment:
    id: X-NODE-03
    objective: "Label and taint (NoSchedule) the only node of OpenShift Local for a short time, show an ordinary user's pods waiting and being scheduled because of it, then remove both and prove the node's labels, taints and schedulability are exactly as before."
    changes:
      - "Node crc: label lab-tier=demo (added, then removed)"
      - "Node crc: taint lab-demo=true:NoSchedule (on for well under a minute, then removed); new untolerated pods anywhere wait during that window, running pods are not evicted"
      - "Pods and Deployments in the developer's temporary project (deleted with the project)"
    preflight:
      - {cmd: "test \"$(oc get nodes -o name | wc -l)\" = 1 && oc get node crc -o name"}
      - {cmd: "oc get node crc -o jsonpath='{.metadata.labels}' | grep -q '\"lab-tier\"'", expect: fail}
      - {cmd: "oc get node crc -o jsonpath='{.spec.taints[*].key}' | grep -qw lab-demo", expect: fail}
      - {cmd: "test \"$(oc get node crc -o jsonpath='{.spec.unschedulable}')\" != true"}
      - {cmd: "oc wait node/crc --for=condition=Ready=True --timeout=30s"}
    snapshot:
      - "oc get node crc -o jsonpath='{.metadata.labels}'"
      - "oc get node crc -o jsonpath='{.spec}'"
    rollback:
      - "if oc get node crc -o jsonpath='{.spec.taints[*].key}' | grep -qw lab-demo; then oc adm taint node crc lab-demo-; fi"
      - "if oc get node crc -o jsonpath='{.metadata.labels}' | grep -q '\"lab-tier\"'; then oc label node crc lab-tier-; fi"
    settle:
      - "sleep 10"
    verify:
      - {cmd: "oc wait node/crc --for=condition=Ready=True --timeout=60s"}
      - {cmd: "oc get node crc -o jsonpath='{.spec.taints[*].key}' | grep -qw lab-demo", expect: fail}
      - {cmd: "for i in $(seq 1 24); do n=$(oc get pods -A --field-selector=status.phase=Pending --no-headers 2>/dev/null | grep -c '^openshift-'); [ \"$n\" = 0 ] && exit 0; sleep 5; done; oc get pods -A --field-selector=status.phase=Pending; exit 1", timeout: 180}
      - {cmd: "oc wait co --all --for=condition=Degraded=False --timeout=120s"}
- id: n.nodes-capacity
  title: Nodes, machines and capacity planning
  module: p1-scheduling
  mode: REAL_LAB
  minutes: 35
  level: 3
  supports: OpenShift 4.21 Machine API, node reservations, KubeletConfig and multi-project quotas. The node
    capacity, cordon and disruption-budget steps were run on OpenShift Local 4.21, a one-node cluster, by the
    cluster administrator (kubeadmin) and by the ordinary user developer in a temporary project; the node was
    uncordoned and its spec and labels were compared with the copy taken before (experiment X-NODE-02). The drain
    was a server-side dry run limited to the lesson's own pods. Machine API, autoscaling and real drains are
    documentation examples, because this cluster has no machines to manage and only one node.
  concepts:
    - ocp.machines
    - ent.capacity
    - k8s.requests-limits
    - k8s.quota
  prerequisites:
    - b.scheduler
    - c.machineconfig-upgrades
  record_on: cluster-admin
  objective: |
    Read a node's real capacity, maintain nodes without surprising application teams, explain how OpenShift adds and
    replaces machines, and size a cluster with headroom for failures and updates.
  flow:
    - kind: teach
      id: situation
      body: |
        Three workers look quiet on CPU graphs. Yet new pods wait, and an upcoming node update will
        remove a third of the workers temporarily. You need to know whether the remaining two can carry
        the workload before approving the window.

        You will distinguish capacity, reservations and usage; connect Machines to Nodes; and plan safe
        maintenance and autoscaling. The node readings, the cordon and the refused eviction were done for real
        on a lab cluster (OpenShift Local 4.21, one node) by its administrator and by an ordinary user,
        `developer`; the prompt in front of each command names who ran it. Machine operations and real drains
        need a multi-node cluster with the Machine API, so they are documentation examples, labelled as such.
      title: Maintenance needs room
    - kind: teach
      id: three-numbers
      body: |
        **Capacity** is the hardware the kubelet reports. **Allocatable** subtracts system reservations
        and eviction headroom: this is the space available to pods. **Allocated requests** are the sum
        of requests already scheduled there.

        As [How pods get a node](/lesson/b.scheduler) explains, the next pod must fit in allocatable
        minus those requests. Usage answers a different question: how busy the node actually is. Large
        requests can fill a nearly idle node on paper; usage above requests can expose workloads to contention.
      title: Capacity is not all application space
    - kind: show
      id: capacity
      body: "The administrator reads the node's two capacity sections. `sed -n '/A/,/B/p'` prints the lines from A to B:"
      run: "oc describe node crc | sed -n '/^Capacity:/,/^System Info:/p'"
      notice: |
        - `Capacity` is the hardware: 4 CPUs and about 10 GiB of memory (the `Ki` values are kibibytes).
        - `Allocatable` is `3800m` CPU (m is a thousandth of a CPU): 200m is held back for the system, so pods can
          request at most 3.8 CPUs here. Memory loses a few hundred MiB the same way.
    - kind: show
      id: allocated
      run: "oc describe node crc | sed -n '/^Allocated resources:/,/^Events:/p'"
      notice: |
        `Allocated resources` adds up the requests of the pods already placed (nothing from this lesson yet):
        `2282m` of CPU, 60% of allocatable, and `9433Mi` of memory, 94%. Memory is the scarce resource on this node.
        Limits are listed too, but the scheduler does not add them up.
    - kind: show
      id: top-fails
      body: "Usage is a different number. It comes from the Metrics API. On this lab cluster the command fails (exit status 1), because monitoring, which serves that API, is disabled:"
      run: "oc adm top nodes"
      notice: |
        `error: Metrics API not available`. On OpenShift that API is served by Metrics Server, which the Cluster
        Monitoring Operator deploys, and monitoring is disabled on this cluster. Nothing here can say how busy
        the node really is. The requests above are known anyway: they come from the pod specs, not from measurement.
    - kind: ask
      id: idle-pending
      prompt: A pod asking for 1 GiB of memory stays Pending with `Insufficient memory`, while a dashboard shows
        40% memory use. Which line of this output explains it?
      evidence: |
          Resource           Requests      Limits
          --------           --------      ------
          cpu                2282m (60%)   10m (0%)
          memory             9433Mi (94%)  0 (0%)
        # The node's Allocated resources, recorded above.
      choices:
        - text: "`memory` Requests: `9433Mi (94%)`"
          why: Pods already placed have requested 94% of the node's allocatable memory, about 9990Mi, so another
            1 GiB does not fit, however idle the node is.
        - text: "`memory` Limits: `0 (0%)`"
          why: The scheduler does not add up limits when it places a pod. Limits cap what a container may use.
        - text: "`cpu` Requests: `2282m (60%)`"
          why: Each resource is checked separately. The refusal names memory, and CPU still has room.
      answer: 0
    - kind: teach
      id: machine-ownership
      body: |
        A **Machine** describes a provider host; that host registers as a Node. A **MachineSet** keeps
        a requested number of Machines from a template, usually with separate sets per zone. Deleting a
        Machine owned by a MachineSet prompts replacement to restore the count; replacement is a new host,
        not preservation of the old host's local disk.

        This works only on supported, configured Machine API platforms. Platform type `none` cannot use
        it; UPI does not automatically supply it. Manually added nodes need verified client and serving
        certificate requests approved. The upstream Cluster API is Technology Preview in 4.21.
      title: A host can have an owner too
    - kind: show
      id: no-machines
      body: "Where do this cluster's hosts come from? The administrator asks the Machine API, then the cluster's infrastructure record:"
      run: "oc get machines,machinesets -n openshift-machine-api"
      notice: "`No resources found`: no Machine and no MachineSet. Nothing in this cluster creates or replaces hosts."
    - kind: show
      id: platform-none
      run: "oc get infrastructure cluster -o jsonpath='{.status.platform}{\" \"}{.status.controlPlaneTopology}{\"\\n\"}'"
      notice: |
        `None SingleReplica`: the platform type is `None` (no provider integration) and the control plane has a
        single replica. This is why every Machine example in this lesson is a documentation example.
    - kind: ask
      id: replace-host
      prompt: A MachineSet wants three Machines. One owned Machine is deleted. What does its controller try to do?
      choices:
        - text: Restore the deleted host’s local filesystem
          why: The controller provisions a replacement; local data is not a backup.
        - text: Create a replacement Machine
          why: The set reconciles the count from its template, subject to provider capacity and permissions.
        - text: Leave two hosts until replicas is increased
          why: The desired count is already three, so no replica-count change is needed.
      answer: 1
    - kind: teach
      id: autoscaler
      body: |
        A **MachineAutoscaler** sets minimum and maximum replicas for a MachineSet; a **ClusterAutoscaler**
        sets cluster-wide limits and scaling policy. Scale-up evaluates unschedulable pods and whether
        an offered node type could make them fit.

        Requests matter: omitting a CPU request removes the CPU-fit signal, even if usage is high. Adding
        nodes also helps only if the pod would fit on a new node of the type the MachineSet offers.
        Selectors, taints, volume placement and autoscaler limits can also prevent scale-up. Scale-down needs movable pods and sufficient room
        elsewhere; low measured usage alone does not authorise removal.
      title: Scale only when another offered node helps
    - kind: ask
      id: too-big
      prompt: The ClusterAutoscaler is on. A pod requesting 12 CPUs is Pending, and the MachineSet's hosts have 8
        CPUs. What happens?
      choices:
        - text: Two new hosts add up to 16 CPUs, so it fits
          why: A pod runs on one node. CPUs on different nodes cannot be combined for one request.
        - text: No scale-up, because no new host could fit it
          why: A new host offers at most 8 CPUs, fewer than the pod requests, so adding hosts cannot help.
        - text: One new host is added and the pod runs on it
          why: The autoscaler checks that the pod would fit on the new node type first. 8 CPUs, less what the
            system reserves, are not enough.
      answer: 1
    - kind: teach
      id: repair
      body: |
        A **MachineHealthCheck** watches health conditions and timeouts for selected Machines. For managed
        compute Machines it can trigger deletion and replacement when a host stays unhealthy.
        `maxUnhealthy` limits remediation: if too many selected Machines are unhealthy, repair stops
        so an infrastructure-wide problem does not cause mass replacement.

        For a NotReady node, inspect node conditions and the kubelet journal; CRI-O's journal is another
        node-level source. Application container logs do not explain why the node agent stopped reporting.
      title: Automatic repair has a stop rule
    - kind: show
      id: node-conditions
      body: "The conditions the kubelet reports, one per line:"
      run: "oc get node crc -o jsonpath='{range .status.conditions[*]}{.type}{\"=\"}{.status}{\"\\n\"}{end}'"
      notice: |
        Three pressure conditions `False` and `Ready=True`: a healthy node. A pressure condition that turns `True`
        also puts an automatic taint on the node, and `Ready` that is not `True` is what a MachineHealthCheck acts on.
    - kind: show
      id: node-logs
      body: "And the last lines of CRI-O's journal, read through the API without logging in to the host:"
      run: "oc adm node-logs crc -u crio --tail=3"
      notice: |
        Timestamped lines from the `crio` service on `crc`: the runtime stopping and removing a pod sandbox.
        `-u kubelet` reads the kubelet's journal the same way. Use these services' own logs for node failures,
        and do not edit files on the node by hand to fix what you find: node configuration is managed centrally,
        and a manual change can mark the node Degraded.
    - kind: ask
      id: common-failure
      prompt: Three of ten selected Machines become unhealthy; maxUnhealthy is 2. What should the team expect?
      choices:
        - text: Remediation stops for investigation
          why: Three exceeds the threshold. Look for a shared failure such as networking before replacing hosts.
        - text: All three hosts are replaced immediately
          why: The threshold exists to prevent this potentially destructive response to a shared problem.
        - text: One replacement starts every minute regardless
          why: The unhealthy threshold stops remediation; it is not a rate limit for ongoing replacements.
      answer: 0
    - kind: teach
      id: maintenance
      body: |
        **Cordon** stops ordinary new scheduling onto a node. **Drain** requests eviction of eligible
        pods, respecting **PodDisruptionBudgets (PDBs)**, which limit voluntary disruption. DaemonSet
        pods are skipped with the appropriate option, and static pods are not evicted.

        A normal drain refuses unmanaged bare pods and pods with `emptyDir` data unless the administrator
        explicitly accepts those risks. Controllers recreate evicted pods; Kubernetes does not live-migrate
        them. A single replica can lose service, and a budget allowing zero disruption can block maintenance.

        The **Machine Config Operator (MCO)** applies operating-system and kubelet configuration to nodes; see
        [Machine configuration, MachineConfigPools and upgrades](/lesson/c.machineconfig-upgrades). It usually
        coordinates drains and reboots for disruptive node changes, one node per pool by default. Some changes
        need neither, and SNO skips the MCO drain operation.
      title: Cordon, drain, maintain, uncordon
    - kind: show
      id: maintenance-example
      code: |
        $ oc adm cordon worker-a
        $ oc adm drain worker-a --ignore-daemonsets
        # After successful maintenance and verification:
        $ oc adm uncordon worker-a
      origin: example
      caption: 'OpenShift 4.21: Working with nodes; Kubernetes: Safely drain a node; administrator command examples.'
      notice: On a cluster with several workers, this sequence empties one of them for maintenance. A refusal is
        evidence to resolve with the workload owner. Do not add force or data-deletion options without
        understanding why the drain stopped.
    - kind: teach
      id: one-node-maintenance
      title: What one node allows
      body: |
        A real drain of this cluster's only node would evict the platform's own pods with nowhere to go. What the
        lab can show safely is the part that matters for planning: a cordon, its effect on new pods, and a
        disruption budget refusing an eviction. developer runs an application, `web`, with one replica and a
        budget that requires one pod to stay available. The administrator then cordons the node for well under a
        minute.
    - kind: show
      id: web-manifest
      code: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: web
        spec:
          replicas: 1
          selector:
            matchLabels: {app: web}
          template:
            metadata:
              labels: {app: web, academy-experiment: X-NODE-02}
            spec:
              containers:
              - name: app
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                imagePullPolicy: IfNotPresent
                command: ["sleep", "infinity"]
                resources:
                  requests: {cpu: 5m, memory: 8Mi}
                  limits: {memory: 32Mi}
        ---
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: web
        spec:
          minAvailable: 1
          selector:
            matchLabels: {app: web}
      caption: web.yaml, applied by developer in the next step
      notice: The budget selects the Deployment's pods by their `app` label and asks that at least one stays available during voluntary disruptions. The second label, `academy-experiment`, marks the only pods the administrator's drain will be allowed to consider.
    - kind: show
      id: web-up
      run: "oc apply -f web.yaml && oc rollout status deploy/web --timeout=120s"
      notice: "The Deployment and the budget are created, and the single replica is running."
    - kind: show
      id: pdb-zero
      run: "oc get pdb web"
      notice: |
        `ALLOWED DISRUPTIONS 0`: one healthy pod and a minimum of one leave nothing to spare. The budget's
        controller computes this number from the pods it selects.
    - kind: try
      id: try-cordon
      body: "As the administrator, stop new pods from being scheduled on `crc`, without touching the pods already there."
      accept: ["oc adm cordon crc"]
      hints:
        - match: "\\bdrain\\b"
          say: "A drain also evicts the pods already there. The task is only to stop new scheduling."
        - match: "\\buncordon\\b"
          say: "Uncordon reverses a cordon. The node is schedulable now; the task is to stop that."
        - match: "\\btaint\\b"
          say: "A taint would also stop untolerated pods, but cordon is the maintenance command made for this, and uncordon undoes it."
      hint: "`oc adm cordon` and the node's name."
      run: "oc adm cordon crc"
      then: "`node/crc cordoned`."
    - kind: show
      id: node-cordoned
      run: "oc get node crc"
      notice: |
        STATUS `Ready,SchedulingDisabled`: the node is healthy, but closed to ordinary new pods. Behind the
        status, `spec.unschedulable` is `true`, and the control plane adds the taint
        `node.kubernetes.io/unschedulable:NoSchedule`.
    - kind: show
      id: late-pending
      body: "developer creates a new pod, `late`, with no placement rule:"
      run: "oc apply -f pod-late.yaml && oc wait pod/late --for=condition=PodScheduled=false --timeout=60s"
      notice: "Created, and not scheduled."
    - kind: show
      id: late-event
      run: "oc get events --field-selector reason=FailedScheduling,involvedObject.name=late"
      notice: |
        The scheduler's reason for a cordoned node: `1 node(s) were unschedulable`. Any platform pod replaced
        during this window would wait the same way, which is why the cordon is kept short here.
    - kind: show
      id: web-stays
      run: "oc get pods -o wide"
      notice: "The `web` pod still runs on `crc`: a cordon only closes the node to new pods. `late` waits with NODE `<none>`."
    - kind: ask
      id: pdb-block
      guess: true
      prompt: 'One healthy replica has minAvailable: 1. What happens when drain requests its eviction?'
      choices:
        - text: The pod moves live without interruption
          why: Eviction terminates a pod and its controller creates a replacement; there is no pod live migration.
        - text: The budget refuses the eviction
          why: Removing the only healthy replica would violate the budget. The next step shows the refusal.
        - text: The budget adds a replica automatically
          why: A PDB limits disruption; it does not scale the workload.
      answer: 1
    - kind: teach
      id: dry-drain
      body: |
        The administrator asks for a drain with three restrictions, each one a safety catch:
        `--pod-selector=academy-experiment=X-NODE-02` limits it to the pods of this lesson's Deployment, the only
        pods on the cluster with that label; `--dry-run=server` makes the API server check each eviction without
        carrying it out; and `--timeout=20s` stops the drain from retrying forever.
    - kind: show
      id: drain-refused
      run: "oc adm drain crc --pod-selector=academy-experiment=X-NODE-02 --ignore-daemonsets --dry-run=server --timeout=20s"
      notice: |
        The node is `already cordoned`. The drain tries to evict the `web` pod, and the API server answers `Cannot
        evict pod as it would violate the pod's disruption budget`. The drain retries every 5 seconds, then gives up
        at the timeout: `unable to drain node "crc"`, with `crc` still listed as pending.
        On a real node, this is the drain that never finishes during an update: the budget is doing its job, and
        the fix is a second replica (on another node) or a budget agreed with the owning team for the window.
    - kind: try
      id: return-node
      body: "Maintenance is over and `crc` is still cordoned. Allow ordinary scheduling onto it again."
      accept: [oc adm uncordon crc]
      hints:
        - match: \bcordon\b(?!.*uncordon)
          say: Cordon disables ordinary scheduling; uncordon reverses it.
        - match: \bdrain\b
          say: Drain removes eligible workloads; maintenance is already complete.
      hint: Use the uncordon administration command with crc.
      run: "oc adm uncordon crc"
      then: "`node/crc uncordoned`. The scheduler places pods that are waiting; pods that already run elsewhere do not move back on their own."
    - kind: show
      id: late-runs
      run: "oc wait pod/late --for=condition=Ready --timeout=120s && oc get pods -o wide"
      notice: "`late` was scheduled once the node opened again, without being recreated. The `web` pod is the same one as before: nothing was evicted."
    - kind: show
      id: node-open
      run: "oc get node crc"
      notice: "STATUS `Ready` again. The recording's rollback also uncordons, and compared the node's spec and labels with copies taken before the lesson."
    - kind: teach
      id: headroom
      body: |
        For N similar workers, a first estimate for one-node headroom is to keep total requests below
        (N−1)/N of total allocatable resources. Three workers each 80% requested carry 2.4 nodes' worth;
        two remaining workers can offer only 2.0.

        This is a starting bound, not a placement guarantee. Check memory, pod sizes, selectors, volumes
        and zone failures as well as CPU. Dedicated pools must absorb their own displaced workloads.
        Right-size from observed usage with margin, then schedule using requests.
      title: Size the remaining pool
    - kind: reflect
      id: capacity-plan
      prompt: A pool has five workers, and its CPU requests total 4.3 workers' worth. Can you drain one worker and
        have every pod fit elsewhere? What do you check or change?
      model: No. Four workers remain and offer 4.0 workers' worth, less than the 4.3 requested. By the (N−1)/N rule,
        requests should stay below 80% of the pool, and here they are 86%. Add suitable capacity or reduce oversized
        requests using usage evidence, then check memory, selectors and volumes too. PDBs protect availability but do
        not create capacity.
    - kind: teach
      id: declarative-settings
      body: |
        Use a **KubeletConfig** selecting a MachineConfigPool for settings such as maxPods and reservations;
        the MCO renders and applies the change. New 4.21 clusters size system reservations automatically;
        upgraded clusters retain prior settings until an administrator opts in.

        Overcommit allows configured demand above reserved capacity; it needs a policy and observation.
        A ResourceQuota caps one project; a **ClusterResourceQuota** caps several projects selected by
        labels or requester annotation. Quotas control consumption, but do not reserve physical headroom.
        The depth references cover override percentages and failure diagnosis.
      title: Reserve and govern capacity deliberately
    - kind: teach
      id: what-next
      body: |
        You can read a node's capacity, allocatable and requested resources, say why usage needs the Metrics API,
        cordon and uncordon a node, read a disruption budget's refusal, explain host ownership and autoscaler
        limits, and estimate failure headroom.

        Next, [Partition a cluster for teams and workloads](/lesson/p.cluster-partitioning) applies those checks
        to dedicated groups of nodes with separate placement and operating-system configuration.
      title: What you can do now
  sections:
    - id: capacity-reference
      title: Capacity and maintenance reference
      depth: true
      body: |
        | Quantity or control | Meaning |
        |---|---|
        | Capacity | Hardware reported by the kubelet |
        | Allocatable | Capacity after system reservations and eviction headroom |
        | Allocated requests | Requests of already assigned pods, including platform workloads |
        | Usage | Current consumption, served through the Metrics API for top |
        | KubeletConfig | Declarative kubelet changes for selected MachineConfigPools |
        | PDB | Bound on voluntary disruption; not protection against all failures |

        A normal drain refuses bare pods without --force, and emptyDir data without --delete-emptydir-data.
        DaemonSet pods require --ignore-daemonsets and stay running. These options acknowledge different risks;
        they do not create replacement capacity. Some MCO changes avoid drain/reboot; on SNO the MCO skips drain.
    - id: machines-how-openshift-adds-and
      title: 'Machines: how the platform adds and replaces nodes'
      body: |
        On installer-provisioned infrastructure (and other platforms with the Machine API), nodes are themselves
        managed by controllers in `openshift-machine-api`, exactly like pods by a ReplicaSet:

        | Object | Role |
        |---|---|
        | **Machine** | one host to create at the provider (VM or bare-metal server); becomes a Node |
        | **MachineSet** | keeps N Machines of one template, usually one MachineSet per zone |
        | **MachineHealthCheck** | deletes Machines whose Node stays unhealthy, so their MachineSet replaces them |
        | **ClusterAutoscaler** + **MachineAutoscaler** | grow a MachineSet when pods are Pending for lack of requested resources, shrink it when nodes are underused |

        Scaling workers is then a change of `replicas` on a MachineSet. Clusters with platform type `none` cannot use the
        Machine API, and user-provisioned clusters need extra configuration for it; there, adding a node is a manual
        procedure, and each new node's certificate signing requests (client first, then serving) must be approved
        before it joins (`oc get csr` lists them). The upstream Cluster API is a Technology Preview in 4.21.

        The cluster autoscaler reacts to **Pending pods**, and Pending depends on **requests**. Pods without CPU or memory requests
        provide no resource-fit scale-up signal for that resource; other constraints can still make them unschedulable, and pods with oversized requests trigger
        expensive ones.
      depth: true
    - id: planning-capacity-and-headroom
      title: Planning capacity and headroom
      body: |
        Plan on **requests**, check against **usage**:

        - Requests decide whether pods fit; usage decides whether nodes are really busy. A large gap between the two
          (requests much higher than usage) means wasted capacity; usage above requests relies on unreserved
          capacity and can cause contention.
        - Keep **headroom for one node failure and for updates**: when one node is drained, the remaining nodes of that
          pool must absorb its pods' requests. With N similar workers, staying below about (N-1)/N of allocatable is the
          simple rule; zones multiply this (losing a zone removes a third of a three-zone cluster).
        - **Overcommit** on purpose, not by accident: limits above requests allow consumption beyond reservations; aggregate limits can exceed node capacity. The Cluster Resource
          Override operator sets requests as a percentage of limits in labelled projects (by default memory requests at
          50% and CPU requests at 25% of limits), which raises density on development clusters; the 4.21 release notes
          list a known issue (OCPBUGS-74224): the 4.21 version of this operator ships in a later 4.21 maintenance
          release, so check the catalog before planning on it.
        - Use **quotas as contracts**: a ResourceQuota per project, and on OpenShift a **ClusterResourceQuota** to cap
          the total of several projects (selected by label or by the requester annotation), for example everything
          one team creates.
      depth: true
    - id: when-capacity-goes-wrong
      title: When capacity or nodes go wrong
      body: |
        | Symptom | Evidence | Likely cause | Fix |
        |---|---|---|---|
        | pods Pending, event `Insufficient cpu` or `Insufficient memory` | `oc get events --field-selector reason=FailedScheduling`; `oc describe node` (Allocated resources) | requests exceed what is left of allocatable, whatever the usage | right-size requests, or add capacity |
        | the cluster autoscaler adds nothing | the pod's events; the ClusterAutoscaler's limits | the pod has no requests, the cluster is at `maxNodesTotal` or a resource limit, or the pod would not fit on a new machine of that MachineSet either | set requests; raise the limits; offer a machine type large enough |
        | a drain never finishes | the drain keeps retrying refused evictions; `oc get pdb -A` shows ALLOWED DISRUPTIONS 0 | a PodDisruptionBudget allows no disruption (often one replica with `minAvailable: 1`) | add replicas, or relax the budget for the window with the owning team |
        | a node is gone and nothing replaces it | `oc get machines -n openshift-machine-api`; the MachineHealthCheck's status | no MachineHealthCheck, a machine not owned by a MachineSet, or more unhealthy machines than `maxUnhealthy` allows (remediation then stops on purpose) | find the common cause first, then remediate |
        | new nodes never become Ready | `oc get csr` shows Pending requests | on manually added nodes, nobody approved the client and then the serving certificate requests | approve them after checking they come from the expected hosts |
        | capacity "disappeared" | `oc get nodes` shows `SchedulingDisabled` | a node was cordoned and never uncordoned | uncordon it once the work is done |


        Scale-down follows rules too: the autoscaler removes a node only when the requests on it fall below a utilisation
        threshold (50% by default) and its pods can move elsewhere. Pods without a controller, pods with local storage and
        pods behind a restrictive PodDisruptionBudget can block scale-down, depending on policy and annotations.
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **Sizing from usage graphs alone.** Resource-fit filtering uses requests: a cluster at 30% CPU usage can be
          100% requested and refuse every new pod.
        - **No headroom for updates.** Disruptive multi-node updates normally drain nodes; a cluster that is full when all nodes are up
          will have Pending pods during every maintenance.
        - **Pods without requests in an autoscaled cluster.** They rarely trigger a scale-up, and with no requests or
          limits at all they are BestEffort: their usage always exceeds their (zero) requests, which puts them among
          the first pods evicted under memory pressure.
        - **Hand-editing kubelet settings on a node.** Use a KubeletConfig so the change is versioned, applied to the
          whole pool and survives updates.
        - **Cordoning and forgetting to uncordon.** The node stays healthy and empty; capacity silently shrinks.
  review:
    - q: What is the difference between capacity, allocatable and allocated on a node?
      a: Capacity is the hardware; allocatable is capacity minus system reservations and eviction threshold; allocated
        is the sum of scheduled pods' requests.
    - q: Which objects scale worker nodes on an installer-provisioned cluster?
      a: MachineSets (replicas), automatically through a ClusterAutoscaler plus MachineAutoscalers.
    - q: What does draining a node do, and what can block it?
      a: A normal drain cordons and evicts eligible pods through the eviction API, respecting PDBs. DaemonSet and
        static pods stay. Bare pods and emptyDir data need explicit risk-accepting flags; a zero-disruption PDB
        blocks eviction.
    - q: How do you change kubelet settings such as maxPods on OpenShift?
      a: With a KubeletConfig selecting a MachineConfigPool; the Machine Config Operator rolls it out.
    - q: What does a ClusterResourceQuota add over a ResourceQuota?
      a: One quota across several projects, selected by labels or by the requester annotation.
    - q: Does the MCO drain and reboot for every configuration change?
      a: No. It normally does so for disruptive changes on multi-node clusters, but some changes avoid drain or
        reboot, and SNO skips the MCO drain operation.
  labs:
    - lab.scheduling
    - lab.cluster-health
  limits: |
    The capacity readings, the cordon and the refused eviction were recorded on OpenShift Local, which has one
    node. The drain is a server-side dry run limited to the lesson's own pods: a real drain of the only node would
    evict the platform's pods with nowhere to go, so a drain that moves pods is shown only as a documentation
    example. The cluster has platform type `None` and no Machines or MachineSets, so Machine API replacement,
    MachineHealthChecks and autoscaling are documentation examples. Usage (`oc adm top`) is unavailable because
    monitoring, which provides the Metrics API, is disabled. Typed tasks compare commands without running them.
  enterprise: |
    Capacity reviews in large organisations compare requested and used resources per team, keep explicit headroom
    for a zone failure and for update windows, and turn quotas into an agreement with each team. Node changes go
    through MachineConfigs and KubeletConfigs in Git, never through hand edits on hosts.
  references:
    - title: 'OpenShift 4.21: Overview of machine management'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_management/overview-of-machine-management
    - title: 'OpenShift 4.21: Applying autoscaling to a cluster'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_management/applying-autoscaling
    - title: 'OpenShift 4.21: Working with nodes'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/nodes/working-with-nodes
    - title: 'OpenShift 4.21: Managing compute machines with the Machine API'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_management/managing-compute-machines-with-the-machine-api
    - title: 'OpenShift 4.21: Working with clusters (overcommitment, Cluster Resource Override)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/nodes/working-with-clusters
    - title: 'OpenShift 4.21: Recommended performance and scalability practices'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/scalability_and_performance/recommended-performance-and-scalability-practices
    - title: 'OpenShift 4.21: Setting quotas across multiple projects'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/building_applications/quotas
    - title: 'Kubernetes: Reserve compute resources for system daemons'
      url: https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/
    - title: 'Kubernetes: Safely drain a node'
      url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
    - title: 'OpenShift 4.21: Deploying machine health checks'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_management/deploying-machine-health-checks
    - title: 'Kubernetes: API-initiated eviction'
      url: https://kubernetes.io/docs/concepts/scheduling-eviction/api-eviction/
    - title: 'OpenShift 4.21: Machine configuration overview (configuration drift detection)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_configuration/machine-config-index
    - title: 'OpenShift 4.21: Red Hat Enterprise Linux CoreOS (direct access for debugging only)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/architecture/architecture-rhcos
    - title: OpenShift 4.21 release notes (OCPBUGS-74224)
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/release_notes/ocp-4-21-release-notes
    - title: 'Kubernetes: Node-pressure eviction (eviction order)'
      url: https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/
    - title: 'Kubernetes: drain command reference (bare pods and emptyDir safeguards)'
      url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_drain/
  files:
    web.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 1
        selector:
          matchLabels: {app: web}
        template:
          metadata:
            labels: {app: web, academy-experiment: X-NODE-02}
          spec:
            containers:
            - name: app
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              imagePullPolicy: IfNotPresent
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {memory: 32Mi}
      ---
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: web
      spec:
        minAvailable: 1
        selector:
          matchLabels: {app: web}
    pod-late.yaml: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: late
        labels: {app: late}
      spec:
        containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
  commands:
    - {cmd: "oc describe node crc | sed -n '/^Capacity:/,/^System Info:/p'", as: admin, meaning: "capacity (hardware) and allocatable (what pods may request)"}
    - {cmd: "oc describe node crc | sed -n '/^Allocated resources:/,/^Events:/p'", as: admin, meaning: "the sum of the requests already placed on the node"}
    - {cmd: "oc adm top nodes", as: admin, expect: fail, meaning: "usage needs the Metrics API, which this cluster does not serve"}
    - {cmd: "oc get machines,machinesets -n openshift-machine-api", as: admin, meaning: "no Machine and no MachineSet: nothing creates or replaces hosts here"}
    - {cmd: "oc get infrastructure cluster -o jsonpath='{.status.platform}{\" \"}{.status.controlPlaneTopology}{\"\\n\"}'", as: admin, meaning: "platform None, single control-plane replica"}
    - {cmd: "oc get node crc -o jsonpath='{range .status.conditions[*]}{.type}{\"=\"}{.status}{\"\\n\"}{end}'", as: admin, meaning: "the node's pressure and Ready conditions"}
    - {cmd: "oc adm node-logs crc -u crio --tail=3", as: admin, meaning: "the last lines of the CRI-O journal on the node"}
    - {cmd: "oc apply -f web.yaml && oc rollout status deploy/web --timeout=120s", as: developer, meaning: "one replica and a budget requiring one available pod"}
    - {cmd: "oc get pdb web", as: developer, meaning: "ALLOWED DISRUPTIONS 0"}
    - {cmd: "oc adm cordon crc", as: admin, meaning: "close the node to new pods, for well under a minute"}
    - {cmd: "oc get node crc", as: admin, meaning: "Ready,SchedulingDisabled"}
    - {cmd: "oc apply -f pod-late.yaml && oc wait pod/late --for=condition=PodScheduled=false --timeout=60s", as: developer, meaning: "a new pod is not scheduled on a cordoned node"}
    - {cmd: "oc get events --field-selector reason=FailedScheduling,involvedObject.name=late", as: developer, meaning: "the reason: the node is unschedulable"}
    - {cmd: "oc get pods -o wide", as: developer, meaning: "the running pod stays; the new one waits"}
    - {cmd: "oc adm drain crc --pod-selector=academy-experiment=X-NODE-02 --ignore-daemonsets --dry-run=server --timeout=20s", as: admin, expect: fail, meaning: "a server-side dry-run drain of the lesson's pods only: the budget refuses the eviction"}
    - {cmd: "oc adm uncordon crc", as: admin, meaning: "open the node again"}
    - {cmd: "oc wait pod/late --for=condition=Ready --timeout=120s && oc get pods -o wide", as: developer, meaning: "the waiting pod is scheduled; the web pod was never evicted"}
    - {cmd: "oc get node crc", as: admin, meaning: "Ready again"}
  experiment:
    id: X-NODE-02
    objective: "Cordon the only node of OpenShift Local for well under a minute, show a new pod waiting and a PodDisruptionBudget refusing a server-side dry-run eviction of the lesson's own pod, then uncordon and prove the node's spec and labels are exactly as before."
    changes:
      - "Node crc: spec.unschedulable true and the automatic taint node.kubernetes.io/unschedulable:NoSchedule, for well under a minute; new untolerated pods anywhere wait during that window, running pods are not touched"
      - "Deployment, PodDisruptionBudget and Pod in the developer's temporary project (deleted with the project)"
      - "No eviction is carried out: the drain is a server-side dry run limited by --pod-selector=academy-experiment=X-NODE-02 to the lesson's Deployment, whose pods alone carry that label (checked before any change)"
    preflight:
      - cmd: |-
          nodes=$(oc get nodes -o name) || exit 1
          test "$nodes" = node/crc
      - cmd: |-
          u=$(oc get node crc -o jsonpath='{.spec.unschedulable}') || exit 1
          test "$u" != true
      - cmd: |-
          keys=$(oc get node crc -o jsonpath='{.spec.taints[*].key}') || exit 1
          ! grep -qw node.kubernetes.io/unschedulable <<<"$keys"
      - cmd: |-
          found=$(oc get pods -A -l academy-experiment=X-NODE-02 -o name) || exit 1
          test -z "$found"
      - {cmd: "oc wait node/crc --for=condition=Ready=True --timeout=30s"}
      - {cmd: "oc wait node/crc --for=condition=DiskPressure=False --timeout=30s"}
    snapshot:
      - "oc get node crc -o jsonpath='{.spec}'"
      - "oc get node crc -o jsonpath='{.metadata.labels}'"
    rollback:
      - "oc adm uncordon crc"
    settle:
      - |-
        for i in $(seq 1 30); do
          keys=$(oc get node crc -o jsonpath='{.spec.taints[*].key}') || exit 1
          grep -qw node.kubernetes.io/unschedulable <<<"$keys" || exit 0
          sleep 2
        done
        exit 1
    verify:
      - {cmd: "oc wait node/crc --for=condition=Ready=True --timeout=60s"}
      - cmd: |-
          u=$(oc get node crc -o jsonpath='{.spec.unschedulable}') || exit 1
          test "$u" != true
      - cmd: |-
          for i in $(seq 1 24); do
            pending=$(oc get pods -A --field-selector=status.phase=Pending --no-headers -o custom-columns=NS:.metadata.namespace) || exit 1
            grep -q '^openshift-' <<<"$pending" || exit 0
            sleep 5
          done
          oc get pods -A --field-selector=status.phase=Pending
          exit 1
        timeout: 180
      - {cmd: "oc wait co --all --for=condition=Degraded=False --timeout=120s"}
- id: p.cluster-partitioning
  title: Partition a cluster for teams and workloads
  subtitle: Node labels, infrastructure nodes, custom MachineConfigPools, project node selectors and dedicated nodes
  module: p1-scheduling
  mode: REAL_LAB
  minutes: 35
  level: 3
  supports: OpenShift 4.21 node roles, infrastructure placement, worker-derived MachineConfigPools, project node
    selectors and scheduler defaults; Kubernetes 1.34 taints and tolerations. The project node selector was set and
    tested on OpenShift Local 4.21, a one-node cluster, by the cluster administrator (kubeadmin) and the ordinary user
    developer; the project and the node label were then removed and the node's labels and spec were compared with
    the copy taken before (experiment X-NODE-04). Node pools, infrastructure nodes and custom MachineConfigPools need
    several nodes, so they are documentation examples, next to the real state of this cluster's one node and its pools.
  concepts:
    - k8s.affinity
    - ocp.mco
    - ocp.machines
  prerequisites:
    - b.scheduler
    - n.nodes-capacity
  objective: |
    Split one cluster into groups of nodes with different jobs: label nodes durably, move the router, registry and
    monitoring onto infrastructure nodes, give a group of nodes its own MachineConfigPool, pin projects to nodes with
    project and cluster-wide node selectors, and make nodes exclusive to one team with a taint and a selector together.
  flow:
    - kind: teach
      id: situation
      body: |
        The payments team needs separate hosts and a maintenance window. The router team wants
        infrastructure components away from application bursts. Both call their request “a node pool”,
        but placement and operating-system configuration are separate decisions.

        You will design labels, selectors, taints and MachineConfigPools together, then identify who owns
        each setting. A project node selector is set and tested for real on a lab cluster (OpenShift Local 4.21)
        by its administrator and by an ordinary user, `developer`; the prompt in front of each command names who
        ran it. That cluster has a single node, so pools of nodes, infrastructure nodes and custom
        MachineConfigPools are documentation examples, shown next to what the one node really looks like.
      title: Payments needs its own hosts
    - kind: teach
      id: boundary
      body: |
        Dedicated nodes separate hosts and their resource contention. They still share the API, etcd,
        cluster networking and administrators. They are not a separate security control plane.

        Use quotas and shared hosts when fair shares are enough. Use dedicated nodes for hardware,
        maintenance or host-level separation. Use separate clusters when the requirement includes separate
        administration or incompatible cluster-wide settings. Subscription and software licensing depend
        on the applicable terms, not the presence of a label alone.
      title: Choose the boundary first
    - kind: ask
      id: separate-api
      prompt: Two teams require independent cluster administrators and API availability. Which boundary fits?
      choices:
        - text: Separate node labels in one cluster
          why: Labels describe placement targets; they do not create another control plane.
        - text: Separate clusters
          why: Dedicated hosts inside one cluster still share its API and administrator authority.
        - text: Separate MachineConfigPools in one cluster
          why: Pools control node configuration and update rollout, not API or administrator separation.
      answer: 1
    - kind: teach
      id: four-controls
      body: |
        A label describes a node. A selector or required affinity restricts which nodes a pod may use.
        A taint repels pods that lack a matching toleration. A **MachineConfigPool (MCP)** selects nodes
        to receive operating-system configuration through the MCO.

        [How pods get a node](/lesson/b.scheduler) separates feasibility from preference. Here, the key
        distinction is placement versus configuration: adding an infra MCP does not move router pods,
        and adding a payments selector does not keep other teams off those hosts.
      title: Four settings answer different questions
    - kind: show
      id: roles
      body: "The administrator starts from what exists. A node's roles are labels, listed in the ROLES column:"
      run: "oc get nodes"
      notice: |
        One node with three role labels: `control-plane`, `master` and `worker`. A role label describes the node;
        it grants nothing and moves no pod by itself.
    - kind: show
      id: pools
      run: "oc get mcp"
      notice: |
        The two pools every cluster starts with, as you read them in [Machine configuration, MachineConfigPools and
        upgrades](/lesson/c.machineconfig-upgrades). `master` manages one machine, this node. `worker` manages zero,
        although the node carries the worker label: a node belongs to exactly one pool, and here the master pool
        has it. A custom pool would need worker nodes of its own, which this cluster does not have.
    - kind: show
      id: durable-template
      code: |
        # MachineSet spec.template excerpt; provider configuration omitted
        spec:
          metadata:
            labels:
              node-role.kubernetes.io/payments: ""
              pool: payments
          taints:
          - key: dedicated
            value: payments
            effect: NoSchedule
      origin: example
      caption: 'OpenShift 4.21: Managing compute machines and controlling pod placement; adapted MachineSet template
        excerpt.'
      notice: Node labels belong under spec.template.spec.metadata.labels in the full MachineSet. Taints belong
        under spec.template.spec.taints. A role label makes the role visible; it grants no permission.
    - kind: ask
      id: replacement-label
      prompt: A replacement host loses the old node’s payments label. Where should the durable label have lived?
      choices:
        - text: Only on the old Node object
          why: That changes the current Node, not the template used for its replacement.
        - text: Only in the team’s Deployment selector
          why: A selector requires a label but cannot create it on a node.
        - text: In its MachineSet template
          why: New Machines and Nodes receive template settings; a direct label on the deleted Node cannot survive
            replacement.
      answer: 2
    - kind: teach
      id: new-machines
      body: |
        MachineSet template changes apply to newly created Machines, not retroactively to existing hosts.
        Plan a supported replacement rollout with spare capacity. Without the Machine API, node labels
        and taints need a repeatable host-provisioning procedure.

        For exclusivity, payments pods need a selector targeting `pool=payments` and a toleration for
        `dedicated=payments:NoSchedule`. The taint keeps untolerated pods out; the selector keeps payments
        pods in. NoSchedule leaves existing pods alone, so plan migration before adding it to busy hosts.
    - kind: ask
      id: toleration-only
      recalls: b.scheduler
      prompt: Payments pods tolerate the dedicated taint but lack a selector. Why do some run on general workers?
      choices:
        - text: Tolerations do not target nodes
          why: They permit dedicated nodes but leave other feasible nodes eligible. Add the required selector.
        - text: The taint must use PreferNoSchedule
          why: That weakens repulsion and still does not target payments pods.
        - text: The MachineConfigPool has too few replicas
          why: An MCP does not set pod placement or provision a replica count of hosts.
      answer: 0
    - kind: teach
      id: projects
      body: |
        OpenShift can add a node selector to new pods from the Namespace annotation
        `openshift.io/node-selector`. A project selector takes precedence over the Scheduler object's
        cluster-wide `defaultNodeSelector`; an empty project annotation opts out of that default.

        A pod may add other selector keys but cannot contradict a project key. The conflicting pod is
        refused at creation: for a Deployment, look for FailedCreate on the ReplicaSet rather than a
        Pending pod. Admission is the check before an object is accepted; scheduling comes later.
      title: Apply project placement at admission
    - kind: show
      id: project-selector
      code: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: payments
          annotations:
            openshift.io/node-selector: "pool=payments"
            scheduler.alpha.kubernetes.io/defaultTolerations: >-
              [{"key":"dedicated","operator":"Equal","value":"payments","effect":"NoSchedule"}]
      origin: example
      caption: 'OpenShift 4.21: Controlling pod placement onto nodes; adapted project selector and default toleration
        example.'
      notice: 'The selector constrains new payments pods; the default toleration permits the dedicated nodes. Defaults
        alone do not establish a tenant security boundary: review who may set or override placement and enforce
        the intended policy at admission.'
    - kind: teach
      id: selector-lab
      title: A project pinned to a pool, for real
      body: |
        The administrator creates a project for the payments team whose pods may run only on nodes labelled
        `lab-pool=payments`, and gives developer the `edit` role there. No node has that label yet. `oc adm
        new-project` creates the project directly and sets the annotation; `oc new-project`, the self-service
        request, has no option for it.
    - kind: try
      id: try-new-project
      body: "As the administrator, create the project `lab-payments` with the project node selector `lab-pool=payments`."
      accept: ["oc adm new-project lab-payments --node-selector='lab-pool=payments'", "oc adm new-project lab-payments --node-selector=lab-pool=payments", "oc adm new-project lab-payments --node-selector \"lab-pool=payments\"", "oc adm new-project lab-payments --node-selector=\"lab-pool=payments\"", "oc adm new-project lab-payments --node-selector 'lab-pool=payments'", "oc adm new-project --node-selector='lab-pool=payments' lab-payments", "oc adm new-project --node-selector=lab-pool=payments lab-payments"]
      hints:
        - match: "^oc new-project"
          say: "`oc new-project` sends a self-service request and has no node selector option. The administrator uses `oc adm new-project`."
        - match: "lab-pool:payments"
          say: "A node selector is written `key=value`: `lab-pool=payments`."
        - match: "^oc adm new-project lab-payments$"
          say: "That creates the project without a node selector. Add `--node-selector=`."
        - match: "^oc annotate"
          say: "Annotating an existing namespace is possible too, but the task is to create the project with its selector in one step."
      hint: "`oc adm new-project`, the name, and `--node-selector=` with `key=value`."
      run: "oc adm new-project lab-payments --node-selector='lab-pool=payments'"
      then: "`Created project lab-payments`. The selector is stored on the project's namespace."
    - kind: show
      id: ns-annotation
      body: "The annotation the option wrote. Dots in a key are escaped with a backslash in a JSONPath:"
      run: "oc get namespace lab-payments -o jsonpath='{.metadata.annotations.openshift\\.io/node-selector}{\"\\n\"}'"
      notice: "`lab-pool=payments`: the value of `openshift.io/node-selector` on the namespace."
    - kind: show
      id: grant-edit
      run: "oc adm policy add-role-to-user edit developer -n lab-payments"
      notice: "developer may now create and change most objects in `lab-payments`, but not the namespace itself."
    - kind: show
      id: ledger-run
      body: "developer starts a pod, `ledger`, without any placement rule:"
      run: "oc run ledger -n lab-payments --image=registry.access.redhat.com/ubi9/ubi-minimal:latest --image-pull-policy=IfNotPresent --restart=Never -- sleep infinity"
      notice: "`pod/ledger created`."
    - kind: show
      id: ledger-selector
      body: "developer wrote no node selector. What did the API store?"
      run: "oc get pod ledger -n lab-payments -o jsonpath='{.spec.nodeSelector}{\"\\n\"}'"
      notice: |
        `{"lab-pool":"payments"}`: the project's selector, added to the pod when it was created. The team does not
        have to remember it, and the pod spec in its Git repository does not show it.
    - kind: show
      id: ledger-pending
      run: "oc wait pod/ledger -n lab-payments --for=condition=PodScheduled=false --timeout=60s && oc get events -n lab-payments --field-selector reason=FailedScheduling"
      notice: "Not scheduled, with the familiar reason: the only node `didn't match Pod's node affinity/selector`."
    - kind: ask
      id: guess-override
      guess: true
      prompt: developer starts another pod in `lab-payments` with its own node selector, `lab-pool=general`. What happens?
      choices:
        - text: The pod is created and runs wherever `lab-pool=general` points
          why: That would let every team escape the project's placement. The project's key cannot be given another value.
        - text: The pod is refused when it is created
          why: Admission compares the pod's selector with the project's and refuses a different value for the same key. The next step shows the refusal.
        - text: The pod is created and stays Pending, because it needs both values
          why: A pod cannot ask for two values of one label key. The conflict is caught before the pod exists.
      answer: 1
    - kind: show
      id: rogue-refused
      run: "oc run rogue -n lab-payments --image=registry.access.redhat.com/ubi9/ubi-minimal:latest --image-pull-policy=IfNotPresent --restart=Never --overrides='{\"apiVersion\":\"v1\",\"spec\":{\"nodeSelector\":{\"lab-pool\":\"general\"}}}' -- sleep infinity"
      notice: |
        Forbidden: `pod node label selector conflicts with its project node label selector`. No pod was created.
        A Deployment with the same template would show this message in a `FailedCreate` event of its ReplicaSet.
    - kind: show
      id: annotate-refused
      body: "Can the team remove the project's selector instead?"
      run: "oc annotate namespace lab-payments openshift.io/node-selector-"
      notice: |
        Forbidden: developer may not change the namespace object. Project placement is the administrator's
        decision, which is what makes it a policy rather than a default.
    - kind: show
      id: label-pool
      body: "The administrator gives the node the pool label:"
      run: "oc label node crc lab-pool=payments"
      notice: "`node/crc labeled`."
    - kind: show
      id: ledger-runs
      run: "oc wait pod/ledger -n lab-payments --for=condition=Ready --timeout=120s && oc get pod ledger -n lab-payments -o wide"
      notice: "`ledger` runs on `crc`, the only node that now carries `lab-pool=payments`."
    - kind: show
      id: unlabel-pool
      body: "The administrator undoes both changes: the label first, then the project with everything in it."
      run: "oc label node crc lab-pool-"
      notice: "`node/crc unlabeled`. `ledger` keeps running until the project goes: selectors are checked at placement."
    - kind: show
      id: delete-project
      run: "oc delete project lab-payments"
      notice: "The project, its pod and developer's role binding in it are deleted together. The recording's rollback checked the node's labels and spec against copies taken before."
    - kind: ask
      id: admission-conflict
      prompt: The project sets pool=payments; a Deployment template asks for pool=general. Where should you look
        for the refusal?
      choices:
        - text: A Pending pod’s scheduler score
          why: There may be no pod to schedule. Admission rejects the conflict first.
        - text: ReplicaSet FailedCreate events
          why: The pod is refused before creation because its selector conflicts with the project selector.
        - text: The node’s current CPU usage
          why: Label conflict is independent of resource usage.
      answer: 1
    - kind: teach
      id: cluster-default
      body: |
        A cluster-wide default reaches every project that has no selector annotation of its own, which can
        include projects the platform created. It takes effect only after the kube-apiserver pods redeploy,
        which takes several minutes. Test its impact first: the documentation warns that a default naming a
        node role can leave pods unschedulable.

        Use explicit project selectors and access controls for strong placement requirements. Teams that
        can choose tolerations can copy another team's toleration. Validate permitted placement at
        admission when that freedom would violate the design. You will meet admission policy design again
        in the later Policy as code lesson.
    - kind: show
      id: inspect-selector
      body: "Is there a cluster-wide default on this cluster? The administrator reads the Scheduler object's spec:"
      run: "oc get scheduler cluster -o yaml | sed -n '/^spec:/,$p'"
      notice: |
        No `defaultNodeSelector` field: no default applies, and projects without an annotation may use any node.
        (`policy: name: ""` is the deprecated scheduler policy field, unused; `status: {}` is empty.)
        Compare the namespace annotation with this field, and read the effective pod spec too: admission-added
        fields need not appear in the Deployment template.
    - kind: show
      id: platform-optout
      body: "Platform projects prepare for a default that might be set one day:"
      run: "oc get namespace openshift-dns -o yaml | grep node-selector"
      notice: |
        `openshift.io/node-selector: ""`: an explicitly empty project selector. It opts the DNS project out of any
        cluster-wide default, so the DNS DaemonSet can keep running on every node.
    - kind: try
      id: inspect-other-project
      body: In a hypothetical cluster, inspect the Namespace research as YAML to find its project selector annotation.
        Nothing runs.
      accept: [oc get namespace research -o yaml, oc get ns research -o yaml, oc get namespaces research -o yaml,
        oc get namespace/research -o yaml, oc get ns/research -o yaml, oc get namespace research --output yaml,
        oc get ns research --output=yaml, oc get namespace research --output=yaml, oc get -o yaml namespace research,
        oc get --output yaml namespace research, oc get --output=yaml namespace research, oc get namespace research
          -oyaml, oc get -oyaml namespace research, oc get -o yaml namespace/research, oc get namespace/research
          --output yaml, oc get --output yaml namespace/research, oc get namespace/research --output=yaml, oc get
          --output=yaml namespace/research, oc get namespace/research -oyaml, oc get -oyaml namespace/research,
        oc get -o yaml namespaces research, oc get namespaces research --output yaml, oc get --output yaml namespaces
          research, oc get namespaces research --output=yaml, oc get --output=yaml namespaces research, oc get namespaces
          research -oyaml, oc get -oyaml namespaces research, oc get namespaces/research -o yaml, oc get -o yaml
          namespaces/research, oc get namespaces/research --output yaml, oc get --output yaml namespaces/research,
        oc get namespaces/research --output=yaml, oc get --output=yaml namespaces/research, oc get namespaces/research
          -oyaml, oc get -oyaml namespaces/research, oc get -o yaml ns research, oc get ns research --output yaml,
        oc get --output yaml ns research, oc get --output=yaml ns research, oc get ns research -oyaml, oc get -oyaml
          ns research, oc get -o yaml ns/research, oc get ns/research --output yaml, oc get --output yaml ns/research,
        oc get ns/research --output=yaml, oc get --output=yaml ns/research, oc get ns/research -oyaml, oc get -oyaml
          ns/research]
      hints:
        - match: \bpayments\b
          say: The example used payments; this task asks about research.
        - match: \bpods?\b
          say: A pod shows the effective selector; the project-wide source is the Namespace annotation.
        - match: ^oc describe
          say: The task asks for YAML so you can inspect the annotation by its full key.
      hint: Use get namespace with research and output format yaml.
      then: The real result would show research’s namespace annotations. An absent node-selector annotation falls
        back to the cluster default; an explicitly empty value opts out.
    - kind: teach
      id: infra
      body: |
        Infrastructure nodes host eligible platform components. Keep their worker role alongside infra
        where recommended, and use taints to keep application workloads away. Subscription treatment
        depends on the supported components actually running there and the applicable subscription terms;
        a role label or MCP alone is insufficient.

        Move each component through its operator's supported configuration. Router placement belongs to
        the IngressController; registry placement to the image registry configuration; monitoring placement
        to per-component settings in cluster-monitoring-config. Each moved workload needs both selector
        and toleration. Editing the generated Deployment invites reconciliation to undo the edit.
      title: Move infrastructure through its owners
    - kind: show
      id: router-placement
      code: |
        # IngressController default, in openshift-ingress-operator: spec excerpt
        nodePlacement:
          nodeSelector:
            matchLabels:
              node-role.kubernetes.io/infra: ""
          tolerations:
          - key: node-role.kubernetes.io/infra
            value: reserved
            effect: NoSchedule
      origin: example
      caption: 'OpenShift 4.21: Creating infrastructure machine sets; adapted router placement example.'
      notice: The router pods can run only on nodes that carry the infra label, and they tolerate the infra taint,
        so the nodes need both the label and the taint. Check DaemonSet tolerations before tainting existing nodes.
        Agents managed by an operator may not accept custom tolerations.
    - kind: show
      id: ingress-spec
      body: "On this cluster, the administrator reads the IngressController's spec, then the selector the operator wrote into the router's Deployment:"
      run: "oc get ingresscontroller default -n openshift-ingress-operator -o yaml | sed -n '/^spec:/,/^status:/p'"
      notice: "No `nodePlacement` in the spec: nobody has asked for a placement, so the operator chooses one."
    - kind: show
      id: router-selector
      run: "oc get deployment router-default -n openshift-ingress -o jsonpath='{.spec.template.spec.nodeSelector}{\"\\n\"}'"
      notice: |
        The operator's choice on this cluster: Linux nodes with the `master` role. To place the router elsewhere,
        an administrator sets `nodePlacement` in the IngressController and the operator rewrites this selector.
        Editing the Deployment directly would be reverted.
    - kind: ask
      id: operator-owner
      prompt: Router pods return to their old nodes after someone edits their Deployment. Which object should carry
        placement?
      choices:
        - text: A second copy of the router Deployment
          why: That creates competing workload management rather than configuring the supported owner.
        - text: The infra MachineConfigPool alone
          why: The pool configures hosts and does not choose where router pods run.
        - text: The owning IngressController
          why: The operator reconciles its Deployment from the IngressController’s nodePlacement configuration.
      answer: 2
    - kind: teach
      id: custom-pools
      body: |
        A custom MCP groups workers for extra node configuration and its own rollout. It must inherit
        worker MachineConfigs and select its custom-role configs as well. Since 4.15, a MachineConfig aimed at
        the custom pool overrides a worker MachineConfig that sets the same field. Custom control-plane pools
        are unsupported.

        Each node belongs to one MCP. A worker+infra node uses an infra pool if one selects it, otherwise
        the worker pool. Removing worker without a selecting custom pool can leave a node unmanaged.
        Joining a pool can trigger a configuration rollout and reboot; plan the change as maintenance.
      title: Separate configuration and update rhythm
    - kind: show
      id: pool-example
      code: |
        apiVersion: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        metadata:
          name: payments
        spec:
          machineConfigSelector:
            matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values: [worker, payments]
          nodeSelector:
            matchLabels:
              node-role.kubernetes.io/payments: ""
          maxUnavailable: 1
          paused: false
      origin: example
      caption: 'OpenShift 4.21: Machine configuration overview; adapted worker-derived custom pool example.'
      notice: nodeSelector chooses hosts; machineConfigSelector chooses their configuration inputs. These are different
        from a pod’s scheduling selector.
    - kind: show
      id: worker-pool-selector
      body: "The real worker pool chooses its hosts the same way:"
      run: "oc get mcp worker -o jsonpath='{.spec.nodeSelector}{\"\\n\"}'"
      notice: |
        It selects nodes labelled `node-role.kubernetes.io/worker`, and `crc` has that label. Yet `oc get mcp`
        counted zero machines in `worker`: the node is a control-plane node, and the `master` pool manages it.
        Matching a pool's selector is necessary, not sufficient.
    - kind: teach
      id: canary
      body: |
        `maxUnavailable` bounds unavailable nodes within a pool during rollout; its default is one.
        Pools can update in parallel, so calculate headroom across simultaneous pool maintenance.

        `paused: true` defers configuration rollout. A canary plan updates a small pool first, verifies it,
        then unpauses larger pools within agreed windows. Paused pools block later minor-version updates.
        Certificate handling has changed across releases; the depth note explains the release-note distinction.
        Do not leave a paused pool outside an owned maintenance plan.
    - kind: order
      id: partition-plan
      prompt: Order the checks for introducing the payments partition.
      items:
        - Confirm the isolation requirement, labels, taints and failure headroom.
        - Provision suitable nodes with durable template labels and taints.
        - Apply the worker-derived MCP that selects those nodes, and wait for their configuration to settle.
        - Apply project placement and workload tolerations, then roll workloads out.
        - Verify effective pod placement and test replacement and a planned drain.
      why: Prove that suitable configured capacity exists before moving workloads. Then verify the restrictions
        during failure and maintenance, when they matter most.
    - kind: teach
      id: what-next
      body: |
        You can distinguish host separation from cluster separation, make labels survive replacement, pin a
        project to labelled nodes and see admission enforce it, combine selector and taint policy, place
        infrastructure through operators, and plan custom-pool updates.

        Next, [Project tolerations and disruption budgets](/lesson/p.project-tolerations-pdb) gives a project default tolerations and protects its workloads from drains; then [Corporate identity: LDAP and OIDC](/lesson/p.ldap-oidc) turns from where workloads run to who may
        change them: corporate identity providers and group synchronisation.
      title: What you can do now
  sections:
    - id: why-partition
      title: Why partition a cluster
      body: |
        One cluster, many tenants. Sooner or later someone asks for nodes that are *theirs*:

        - **Noisy neighbours.** A batch team saturates memory bandwidth and disks; a latency-sensitive payment service
          on the same hosts misses its targets, even though requests and quotas are respected.
        - **Compliance.** An auditor wants regulated workloads on hosts that run nothing else, with their own
          hardening and their own maintenance window.
        - **Licensing and subscriptions.** Some commercial software is licensed by the hosts it may run on, so pinning
          it to a small pool keeps the count down (the vendor's terms decide; check them). OpenShift itself does not
          count nodes that run only supported infrastructure components toward subscriptions (next sections).
        - **Dedicated hardware.** GPU, large-memory or local-NVMe nodes are expensive; ordinary pods should not fill
          them while the workloads that need them wait.

        Partitioning a cluster is cheaper than running another cluster, but it shares more:

        | Option | What is shared | Fits when |
        |---|---|---|
        | Shared nodes, quotas and limits only | everything: hosts, kernel, network, control plane | teams trust each other's workloads and only need fair shares |
        | Dedicated node pools in one cluster | control plane, etcd, cluster network, cluster-scoped objects and the administrators | host-level separation, hardware or maintenance differences, subscription sizing |
        | Separate clusters | nothing but the tooling around them | a regulator or a threat model requires a separate control plane, or teams need different versions or settings |

        A dedicated pool separates *hosts*. It does not separate the API, the network or the people with cluster-admin;
        if those must be separate, a node pool is the wrong tool.
      depth: true
    - id: three-controls
      title: 'The mental model: three questions, four tools'
      body: |
        Every partition answers four independent questions, and each has its own tool:

        | Question | Tool | Who sets it | Enforced by |
        |---|---|---|---|
        | What is this node? | **labels** on the node (`node-role.kubernetes.io/<role>`, or your own such as `pool=payments`) | administrators, ideally through the MachineSet template | nothing by itself: labels only describe |
        | Where may these pods go? | **node selectors** and node affinity on pods, or a **project node selector** added to every pod of a project | teams (pod spec) or administrators (project, cluster default) | the scheduler (filter); for project selectors, admission at pod creation |
        | Which pods does this node refuse? | **taints** on the node, **tolerations** on pods | administrators (taint), teams or admission (toleration) | the scheduler, and the taint-eviction controller in kube-controller-manager for `NoExecute` |
        | How is this node's operating system configured? | a **MachineConfigPool** selecting the node | administrators | the Machine Config Operator |

        The first three decide *placement*. The fourth is a different layer: a MachineConfigPool decides which
        configuration and which update rhythm the node gets, and has no effect on which pods it runs. A team can have a
        dedicated pool of nodes without its own MachineConfigPool, and an infra MachineConfigPool does not move a
        single pod.

        Selectors pull, taints push. A selector draws one team's pods *to* some nodes, but does not keep anyone else
        off them. A taint keeps everyone off except pods that tolerate it, but a toleration never draws a pod anywhere.
      depth: true
    - id: labels-and-roles
      title: Node labels and roles
      body: |
        A node's **role** is a label: the ROLES column of `oc get nodes` lists every label of the form
        `node-role.kubernetes.io/<role>`. A node can carry several role labels. A label records a role; it does not enforce isolation.

        Use role labels for what the Machine Config Operator and people need to see (`infra`, `payments`, `gpu`), and
        plain labels (`pool=payments`, `disktype=nvme`) for scheduling rules. Both can be set together.

        **Where to put the label matters more than which label.** On a cluster with the Machine API, nodes come and go:
        a MachineHealthCheck replaces a sick machine, the autoscaler adds and removes them. The 4.21 documentation is
        explicit that labels added directly to a node do not survive the node being replaced. Put them in the
        MachineSet's template instead, together with any taint:

        ```yaml
        apiVersion: machine.openshift.io/v1beta1
        kind: MachineSet
        metadata:
          name: <infrastructure_id>-payments-<zone>
          namespace: openshift-machine-api
        spec:
          template:
            spec:
              metadata:
                labels:                                  # copied onto every Node this MachineSet creates
                  node-role.kubernetes.io/payments: ""
                  pool: payments
              taints:
              - {key: dedicated, value: payments, effect: NoSchedule}
              # providerSpec: unchanged
        ```

        A change to a MachineSet template applies only to machines created *after* it; existing machines and nodes keep
        what they had. The documented way to roll it out is to replace the machines (for example, scale the MachineSet
        up, then back down). On clusters without the Machine API, labels and taints are set on each node by a
        documented, repeatable procedure, and that procedure is the only thing that makes them survive a rebuild.
      depth: true
    - id: infrastructure-nodes
      title: Infrastructure nodes
      body: |
        An **infrastructure node** runs only components that support the cluster. The 4.21 documentation lists what
        qualifies, including: the control plane services, the default router and the HAProxy-based Ingress
        Controller, the integrated image registry, cluster monitoring (also user-workload monitoring), cluster
        logging, and Red Hat products such as Quay, OpenShift Data Foundation, Advanced Cluster Management, Advanced
        Cluster Security, OpenShift GitOps, OpenShift Pipelines and OpenShift Service Mesh. This list concerns supported infrastructure sizing; check the applicable entitlements and subscription terms. **User application workloads change the node’s subscription sizing treatment**; check the supported component list and subscription terms. The
        machine configuration guide states the requirement plainly: the `infra` role label, and taints that keep user
        workloads off. Which MachineConfigPool manages the node plays no part. (Subscription terms are contractual; the
        documentation points to Red Hat's sizing and subscription guide for the details.)

        Building them, as documented:

        1. Create infra nodes through a MachineSet whose template adds `node-role.kubernetes.io/infra: ""` and a taint,
           for example `node-role.kubernetes.io/infra=reserved:NoSchedule`. The documentation recommends keeping the
           dual `infra,worker` labels and using taints to keep user workloads off.
        2. Optionally give them an `infra` MachineConfigPool (next section).
        3. Move each component through **its operator's own setting**, never by editing its Deployment, which the
           operator would revert:

        | Component | Object to change | Field |
        |---|---|---|
        | Router | IngressController `default` in `openshift-ingress-operator` | `spec.nodePlacement.nodeSelector.matchLabels` and `spec.nodePlacement.tolerations` |
        | Integrated registry | `configs.imageregistry.operator.openshift.io/cluster` | `spec.nodeSelector` and `spec.tolerations` |
        | Monitoring | ConfigMap `cluster-monitoring-config` in `openshift-monitoring`, key `config.yaml` | `nodeSelector` and `tolerations` under each component (`prometheusK8s`, `alertmanagerMain`, `thanosQuerier`, `kubeStateMetrics`, `metricsServer`, and others) |

        ```yaml
        # IngressController default (excerpt): router pods move to infra nodes and tolerate their taint
        spec:
          nodePlacement:
            nodeSelector:
              matchLabels:
                node-role.kubernetes.io/infra: ""
            tolerations:
            - {key: node-role.kubernetes.io/infra, value: reserved, effect: NoSchedule}
        ```

        Two details catch people out. Every moved component needs **both** the selector and the toleration: the
        selector alone leaves the pods Pending on tainted nodes. And a taint added to nodes that already run DaemonSet
        pods affects those too: the documentation notes that DaemonSet pods without a matching toleration on a newly
        tainted infra node are reported as misscheduled, and that you cannot add a toleration to a DaemonSet that an
        operator manages. Plan the taint before the nodes carry workloads, from the MachineSet template.
      depth: true
    - id: custom-machine-config-pools
      title: Custom MachineConfigPools
      body: |
        Every cluster starts with two MachineConfigPools, `master` and `worker`. A **custom pool** groups some worker
        nodes so they can receive extra configuration and be updated on their own schedule. In 4.21:

        - Custom pools are **derived from the worker pool**: they receive every MachineConfig aimed at `worker`, plus
          the ones aimed at the custom role. Since 4.15, a custom pool's MachineConfig wins when both define the same
          field. Pools that do not inherit from `worker` are not supported, and custom pools of control-plane nodes are
          not supported either (the MCO ignores them).
        - A node belongs to **exactly one** pool. A node labelled both `worker` and `infra` is managed by the `infra`
          pool if one exists, and by `worker` otherwise.
        - A node **joins** a pool by carrying the label in the pool's `nodeSelector`. The MCO then renders a
          `rendered-<pool>-…` configuration and moves the node to it; the documentation tells you to expect the pool's
          nodes to reboot to apply it.
        - Removing the `worker` label from a node that no custom pool selects leaves it **unmanaged**: the MCO no longer
          configures or updates it.

        ```yaml
        apiVersion: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        metadata:
          name: payments
        spec:
          machineConfigSelector:              # worker configs, plus those labelled for this role
            matchExpressions:
            - {key: machineconfiguration.openshift.io/role, operator: In, values: [worker, payments]}
          nodeSelector:                       # which nodes this pool manages
            matchLabels:
              node-role.kubernetes.io/payments: ""
          maxUnavailable: 1                   # nodes updated at the same time in this pool (default 1)
          paused: false
        ```

        **`maxUnavailable`** is how many nodes of the pool the MCO cordons, drains and reboots at once; the default is 1
        for every pool, and the documentation advises against raising it for the control plane. Pools update **in
        parallel** with each other, so a separate pool for a large group of nodes shortens an update; each pool still
        needs the spare capacity to absorb the nodes it takes out.

        **`paused: true`** stops the MCO from applying configuration to the pool's nodes; during a cluster update
        those nodes are skipped. That is what makes a **canary update** possible: pause the big pools, let a small pool
        update first, check the applications, then unpause the others window by window. Pausing has a cost: the
        paused nodes keep their old operating system and configuration, and while any pool is paused the cluster is
        not permitted to update to a later minor version (the 4.21 update documentation also warns that some
        maintenance tasks are inhibited). Rotated certificates are a separate matter: since 4.13 and 4.14 the
        Machine Config Daemon writes the kubelet CA and the other managed certificates to nodes directly, so they
        reach paused pools too (release notes). The 4.21 update documentation still carries the older warning that pausing blocks rotated certificates; the release notes
        describe the change. Unpause within the maintenance plan that paused the pool, and do not leave pools on
        different versions.
      depth: true
    - id: project-node-selectors
      title: Project node selectors and the cluster-wide default
      body: |+
        A pod's own `nodeSelector` is written by the team, and a team can change it. To *impose* placement, OpenShift
        adds selectors at pod creation from two places:

        - **Project node selector**: the annotation `openshift.io/node-selector` on the project's Namespace, set by
          administrators. Its labels are added to every pod created in the project.
        - **Cluster-wide default**: `spec.defaultNodeSelector` in the `Scheduler` object named `cluster`. It applies
          to pods in projects that have no project node selector. It takes effect only after the
          `openshift-kube-apiserver` pods have redeployed, which takes several minutes.

        ```yaml
        apiVersion: v1
        kind: Namespace
        metadata:
          name: payments
          annotations:
            openshift.io/node-selector: "pool=payments"
            # documented in the 4.21 nodes guide: tolerations added to the project's pods
            scheduler.alpha.kubernetes.io/defaultTolerations: >-
              [{"key": "dedicated", "operator": "Equal", "value": "payments", "effect": "NoSchedule"}]
        ---
        apiVersion: config.openshift.io/v1
        kind: Scheduler
        metadata:
          name: cluster
        spec:
          defaultNodeSelector: pool=general
        ```

        The rules, as documented:

        - A **project selector takes precedence** over the cluster-wide default.
        - A pod may **add** other keys, but may not give a **different value** to a key the project selector sets. Such a
          pod is refused at creation: `pods "…" is forbidden: pod node label selector conflicts with its project node
          label selector`. For a Deployment, that refusal shows as a `FailedCreate` event, not as a Pending pod.
        - An **empty** annotation, `openshift.io/node-selector: ""`, opts a project out of the cluster-wide default
          (the documented preparation for DaemonSets that must reach every node).
        - A default selector reaches every project without its own, which can include platform projects. The
          documentation warns that a default naming a node role can make pods unschedulable, and suggests project
          selectors as the alternative. Introduce a cluster-wide default on a test cluster first.

      depth: true
    - id: exclusive-nodes
      title: Exclusive nodes need a taint and a selector
      body: |
        "The payments nodes are for payments, and payments runs only there" is two rules, and each needs its own tool:

        | Configuration | Other teams' pods | Payments pods |
        |---|---|---|
        | taint on the nodes, toleration on payments pods | kept off the payments nodes | may run on the payments nodes **or on any other node** |
        | label on the nodes, selector on payments pods | **still land on the payments nodes** when they fit | only on the payments nodes |
        | taint + toleration **and** label + selector | kept off | only on the payments nodes |

        The Kubernetes documentation describes the same pattern for dedicated nodes: a taint for the group's
        exclusivity, plus a label and a required node affinity or selector so the pods use *only* those nodes.

        Default tolerations are defaults, not a tenant isolation policy. A team that can choose tolerations
        can request another team's dedicated nodes unless stronger placement and admission rules stop it.
        Use explicit project selectors for imposed placement, restrict who may change namespace annotations,
        and validate allowed selectors and tolerations through admission when required. A cluster-wide default
        must be tested for its impact on platform projects; do not treat it alone as a security boundary.

        NoSchedule leaves already running untolerated pods in place. Plan a drain to migrate them; NoExecute
        also causes eviction and must be evaluated as a disruptive change.
      depth: true
    - id: what-goes-wrong
      title: What goes wrong, and how to see it
      body: |
        | Symptom | Evidence | Cause | Fix |
        |---|---|---|---|
        | the team's pods run on general workers as well as on their nodes | NODE column of `oc get pods -o wide`; the pod spec has a toleration but no selector | toleration without selector: tolerations never attract | add the project node selector (or a required selector in the pod) |
        | other teams' pods appear on the dedicated nodes | `oc describe node` shows `Taints: <none>` | selector without taint, or a taint added after those pods started (`NoSchedule` does not evict) | taint through the MachineSet template; drain to move what is already there |
        | a Deployment shows 0 pods, nothing Pending | `oc get events`: `FailedCreate`, `pod node label selector conflicts with its project node label selector` | the pod template sets a different value for a key the project selector sets | remove that key from the pod; placement is the project's decision |
        | pods Pending: `didn't match Pod's node affinity/selector` after a selector was introduced | `oc get nodes --show-labels` | no node carries the label: set on old nodes by hand, never in the MachineSet template | add it to the template and replace the machines |
        | router, registry or monitoring pods Pending after the move | their events: `untolerated taint` | selector set in the operator's config, toleration missing | add the matching toleration in the same operator setting |
        | the dedicated node lost its label after a repair | the node has a new name and age | the label was on the old Node object only | labels and taints belong in the MachineSet template |
        | a node misses configuration changes and updates | `oc get mcp`: the node is counted in no pool | the `worker` label was removed and no custom pool selects the node | add the pool's label, or restore `worker` |
        | a custom pool's nodes stay on the old release; the next minor update is not permitted | `oc get mcp`: UPDATED False for that pool, `spec.paused: true` in its YAML | a pool paused for a canary and never unpaused | unpause it and let it roll out; pause only within a planned window |
        | an agent DaemonSet runs on fewer nodes than expected | DESIRED of the DaemonSet; the new nodes' taints | the DaemonSet does not tolerate the dedicated taint | add the toleration (not possible on an operator-managed DaemonSet: plan taints with that in mind) |
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **Calling a toleration "dedicated".** A toleration only removes an obstacle; without a selector the pods
          spread over general nodes too.
        - **Labelling nodes by hand on a Machine API cluster.** The next replacement or scale-up produces nodes without
          the label, and pods go Pending or land in the wrong place.
        - **Running a user application on infra nodes.** The node then needs a subscription like any worker.
        - **Editing the router's or the registry's Deployment to move it.** The operator puts its own version back; use
          the IngressController, the registry config and `cluster-monitoring-config`.
        - **Removing the `worker` label from infra nodes without an infra pool.** The MCO stops managing them.
        - **Pausing a pool for a canary and forgetting it.** Its nodes miss operating system and configuration
          updates, and the cluster cannot update to the next minor version until it is unpaused.
        - **Setting a cluster-wide default node selector in production first.** It can reach platform projects
          too; test it, or use project selectors.
        - **Treating a node pool as a security boundary like a cluster.** Tenants still share the API, etcd, the
          network and the administrators.
  review:
    - q: What makes a node show a role in the ROLES column?
      a: A label of the form node-role.kubernetes.io/<role>; a role is only a label.
    - q: Where should node labels and taints for a pool live on a cluster with the Machine API, and when do changes
        apply?
      a: In the MachineSet template (spec.template.spec.metadata.labels and spec.template.spec.taints); only machines
        created after the change get them.
    - q: Does an infra label grant product entitlements or prove infrastructure-node sizing eligibility?
      a: No. Eligibility depends on supported infrastructure workloads and applicable subscription terms. Keep user
        workloads off with placement policy; check separate product entitlements.
    - q: Where do you move the router, the registry and monitoring to infra nodes?
      a: IngressController spec.nodePlacement; the image registry config's nodeSelector and tolerations; the cluster-monitoring-config
        ConfigMap, per component. Each with a selector and a matching toleration.
    - q: What does a custom MachineConfigPool inherit, and which pool manages a node labelled worker and infra?
      a: Every worker MachineConfig, plus its own (which win on conflicts); the infra pool if it exists, because
        a node is in exactly one pool.
    - q: What do maxUnavailable and paused do on a MachineConfigPool?
      a: maxUnavailable bounds unavailable nodes per pool during rollout (default 1). paused defers configuration
        rollout and blocks later minor-version updates. MCD certificate synchronisation has specific exceptions
        introduced in 4.13/4.14; unpause within an owned maintenance plan.
    - q: 'Project node selector versus cluster-wide default: which wins, and how is each set?'
      a: The project's openshift.io/node-selector annotation wins over the Scheduler object's spec.defaultNodeSelector;
        an empty annotation opts a project out of the default.
    - q: Why does an exclusive node pool need both a taint and a selector?
      a: The taint keeps other pods off; the selector keeps the team's pods on. A toleration alone never attracts
        a pod.
  labs:
    - lab.placement-rules
    - lab.cluster-health
  limits: |
    The project node selector, its admission checks and the node label were recorded on OpenShift Local, which has
    one node: a control-plane node in the `master` pool, with platform type `None` and no MachineSets. Independent
    node groups, infra nodes, moving the router or registry, MachineSet templates, machine replacement and custom
    pools of worker hosts need several worker nodes, so they are documentation examples; the real router selector
    and pools of this cluster are shown beside them. A cluster-wide default node selector was only read, not set:
    it would reach every project on the cluster and redeploys the kube-apiserver. Custom control-plane pools are
    unsupported. Typed practice compares commands without executing them.
  enterprise: |
    Platform teams describe node pools as code: one MachineSet per pool and zone carrying the labels and taints, a
    custom MachineConfigPool per role that needs its own configuration or update window, project annotations created
    by the project-onboarding automation, and an admission policy that refuses tolerations a project was not granted.
    Infra nodes are sized and reviewed so that nothing but listed infrastructure components runs on them, and canary
    pools are unpaused within the maintenance window that paused them.
  references:
    - title: 'OpenShift 4.21: Creating infrastructure machine sets (infrastructure components, infra nodes, infra
        pool, moving the router, registry and monitoring)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_management/creating-infrastructure-machinesets
    - title: 'OpenShift 4.21: Managing compute machines with the Machine API (template changes apply to new machines)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_management/managing-compute-machines-with-the-machine-api
    - title: 'OpenShift 4.21: Machine configuration overview (machine config pools, custom pools, pausing)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/machine_configuration/machine-config-index
    - title: 'OpenShift 4.21: Performing a cluster update (maxUnavailable, canary rollout with custom pools, paused
        pools block minor updates)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/updating_clusters/performing-a-cluster-update
    - title: 'OpenShift 4.13 release notes: the MCD now syncs kubelet CA certificates on paused pools'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.13/html/release_notes/ocp-4-13-release-notes
    - title: 'OpenShift 4.14 release notes: certificates are now handled by the Machine Config Daemon'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.14/html/release_notes/ocp-4-14-release-notes
    - title: 'OpenShift 4.21: Controlling pod placement onto nodes (project and cluster-wide node selectors, taints
        and tolerations)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/nodes/controlling-pod-placement-onto-nodes-scheduling
    - title: 'Kubernetes: Taints and tolerations (dedicated nodes)'
      url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    - title: 'Kubernetes: Assigning pods to nodes'
      url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  record_on: cluster-admin
  commands:
    - {cmd: "oc get nodes", as: admin, meaning: "one node; its roles are labels"}
    - {cmd: "oc get mcp", as: admin, meaning: "the master pool manages the node; the worker pool manages none"}
    - {cmd: "oc adm new-project lab-payments --node-selector='lab-pool=payments'", as: admin, meaning: "a project whose pods may run only on nodes labelled lab-pool=payments"}
    - {cmd: "oc get namespace lab-payments -o jsonpath='{.metadata.annotations.openshift\\.io/node-selector}{\"\\n\"}'", as: admin, meaning: "the project node selector annotation"}
    - {cmd: "oc adm policy add-role-to-user edit developer -n lab-payments", as: admin, meaning: "developer may work in the project"}
    - {cmd: "oc run ledger -n lab-payments --image=registry.access.redhat.com/ubi9/ubi-minimal:latest --image-pull-policy=IfNotPresent --restart=Never -- sleep infinity", as: developer, meaning: "a pod without placement rules"}
    - {cmd: "oc get pod ledger -n lab-payments -o jsonpath='{.spec.nodeSelector}{\"\\n\"}'", as: developer, meaning: "admission added the project's selector to the pod"}
    - {cmd: "oc wait pod/ledger -n lab-payments --for=condition=PodScheduled=false --timeout=60s && oc get events -n lab-payments --field-selector reason=FailedScheduling", as: developer, meaning: "no node has the label yet"}
    - {cmd: "oc run rogue -n lab-payments --image=registry.access.redhat.com/ubi9/ubi-minimal:latest --image-pull-policy=IfNotPresent --restart=Never --overrides='{\"apiVersion\":\"v1\",\"spec\":{\"nodeSelector\":{\"lab-pool\":\"general\"}}}' -- sleep infinity", as: developer, expect: fail, meaning: "refused at creation: the selector conflicts with the project's"}
    - {cmd: "oc annotate namespace lab-payments openshift.io/node-selector-", as: developer, expect: fail, meaning: "Forbidden: the team cannot remove the project's selector"}
    - {cmd: "oc label node crc lab-pool=payments", as: admin, meaning: "the node joins the payments pool, by label"}
    - {cmd: "oc wait pod/ledger -n lab-payments --for=condition=Ready --timeout=120s && oc get pod ledger -n lab-payments -o wide", as: developer, meaning: "the waiting pod is scheduled on crc"}
    - {cmd: "oc label node crc lab-pool-", as: admin, meaning: "remove the label"}
    - {cmd: "oc delete project lab-payments", as: admin, meaning: "remove the project, its pod and the role binding"}
    - {cmd: "oc get scheduler cluster -o yaml | sed -n '/^spec:/,$p'", as: admin, meaning: "no cluster-wide default node selector"}
    - {cmd: "oc get namespace openshift-dns -o yaml | grep node-selector", as: admin, meaning: "an explicitly empty project selector opts out of any default"}
    - {cmd: "oc get ingresscontroller default -n openshift-ingress-operator -o yaml | sed -n '/^spec:/,/^status:/p'", as: admin, meaning: "the default IngressController has no nodePlacement"}
    - {cmd: "oc get deployment router-default -n openshift-ingress -o jsonpath='{.spec.template.spec.nodeSelector}{\"\\n\"}'", as: admin, meaning: "the selector the ingress operator wrote into the router Deployment"}
    - {cmd: "oc get mcp worker -o jsonpath='{.spec.nodeSelector}{\"\\n\"}'", as: admin, meaning: "the worker pool selects nodes by the worker role label"}
  experiment:
    id: X-NODE-04
    objective: "Create a project with a project node selector, show admission adding it to an ordinary user's pod and refusing a conflicting one, label the only node so the pod is scheduled, then remove the label and the project and prove the node's labels and spec are exactly as before."
    changes:
      - "Node crc: label lab-pool=payments (added, then removed)"
      - "Project lab-payments with the annotation openshift.io/node-selector=lab-pool=payments, a RoleBinding giving developer edit, and pod ledger (created, deleted)"
    preflight:
      - cmd: |-
          nodes=$(oc get nodes -o name) || exit 1
          test "$nodes" = node/crc
      - cmd: |-
          found=$(oc get namespace lab-payments --ignore-not-found -o name) || exit 1
          test -z "$found"
      - cmd: |-
          labels=$(oc get node crc -o jsonpath='{.metadata.labels}') || exit 1
          ! grep -q '"lab-pool"' <<<"$labels"
      - cmd: >-
          oc get pods,deployments,replicasets,statefulsets,daemonsets,jobs,cronjobs,replicationcontrollers -A -o json |
          jq -e 'all(.items[]; ((.spec | tojson | contains("\"lab-pool\"")) | not))'
      - {cmd: "oc wait node/crc --for=condition=Ready=True --timeout=30s"}
      - {cmd: "oc wait node/crc --for=condition=DiskPressure=False --timeout=30s"}
    snapshot:
      - "oc get node crc -o jsonpath='{.metadata.labels}'"
      - "oc get node crc -o jsonpath='{.spec}'"
      - "oc get namespace lab-payments -o name --ignore-not-found"
    rollback:
      - "oc delete project lab-payments --ignore-not-found --wait=false"
      - |-
        labels=$(oc get node crc -o jsonpath='{.metadata.labels}') || exit 1
        if grep -q '"lab-pool"' <<<"$labels"; then oc label node crc lab-pool-; fi
    settle:
      - "oc wait --for=delete namespace/lab-payments --timeout=300s"
    verify:
      - {cmd: "oc wait node/crc --for=condition=Ready=True --timeout=60s"}
      - cmd: |-
          found=$(oc get namespace lab-payments --ignore-not-found -o name) || exit 1
          test -z "$found"
      - cmd: |-
          labels=$(oc get node crc -o jsonpath='{.metadata.labels}') || exit 1
          ! grep -q '"lab-pool"' <<<"$labels"
      - {cmd: "oc wait co --all --for=condition=Degraded=False --timeout=120s"}
- id: h.observability
  title: Events, logs, metrics, traces
  subtitle: Four signals and the question each answers
  module: p2-reliability
  mode: GUIDED_INVESTIGATION
  minutes: 22
  level: 1
  supports: OpenShift 4.21 events and container logs; Prometheus and OpenTelemetry signal concepts. The events,
    logs and the Metrics API refusal were recorded on OpenShift Local 4.21 as the ordinary user developer, in a
    temporary project. That cluster has monitoring disabled, so metrics, alerts and traces are explained with
    documentation examples; typed tasks run nothing.
  record_on: cluster
  concepts:
    - obs.signals
    - obs.prometheus
  prerequisites:
    - b.pod-lifecycle
  objective: |
    Pick the signal that answers your question (events, logs, metrics or traces), read events and container logs
    correctly during triage, including the previous container instance, and explain how OpenShift collects metrics
    and alerts and why each signal has a limited lifetime.
  flow:
    - kind: teach
      id: situation
      body: |
        A user reports a broken portal. One pod never started, another restarted twice, and a third
        responds slowly. The same command will not explain all three symptoms.

        You will choose between events, logs, metrics and traces, then practise choosing the right pod
        and container instance. The events and logs you see were recorded for real on a lab cluster
        (OpenShift Local 4.21) by an ordinary user, `developer`, in a project of their own. Metrics and
        tracing stay conceptual: that cluster has monitoring disabled, and you will see what that looks like.
      title: “The portal is broken”
    - kind: teach
      id: events
      body: |
        An **event** records a recent platform action or refusal: scheduling, image pulling, restarting,
        or an admission refusal (the API server rejecting a new object, for example because a quota or a
        security rule forbids it). Each event is attached to the object it concerns, which can be a pod or
        the ReplicaSet that tried to create one. Start with events when a pod never ran. Read reason,
        object, message, count and time together.

        Events are best-effort supplementary evidence. Repeats can be aggregated into one entry, and
        entries expire. OpenShift's default event retention is three hours, compared with upstream
        Kubernetes's one hour. A missing event tomorrow does not prove nothing happened today.
      title: Ask what the platform did
    - kind: ask
      id: no-pod
      guess: true
      prompt: A Deployment wants two replicas, but no pods exist. Where is the best first evidence?
      choices:
        - text: The missing pods’ container logs
          why: No container started, so it cannot have written application output.
        - text: The application’s latency percentiles
          why: These describe handled requests, not why the controller could not create pods.
        - text: The ReplicaSet’s events
          why: Admission failures are reported by the controller that tried to create the pod. The next step shows one.
      answer: 2
    - kind: show
      id: events-example
      code: |
        $ oc get events -n academy-quota --field-selector reason=FailedCreate
        LAST SEEN   TYPE      REASON         OBJECT                     MESSAGE
        0s          Warning   FailedCreate   replicaset/big-69f668bdf   Error creating: pods "big-69f668bdf-wmzkb" is forbidden: maximum memory usage per Container is 512Mi, but limit is 1Gi
      origin: lab
      caption: Recorded on OpenShift Local in the course's quotas-limits lab (lab.quotas-limits). The project has a
        LimitRange, a per-project rule on container sizes, that caps memory at 512Mi per container, and the
        Deployment asked for 1Gi. Only the first of several identical events is shown.
      notice: |
        The event is attached to the ReplicaSet, not to a pod: the API server refused to create the pod, so there is
        no pod to describe. The message names the rule that refused it. The recording holds several events like this
        one, differing only in the pod name, because the ReplicaSet keeps trying.
    - kind: teach
      id: logs
      body: |
        Container **logs** are the program's standard output and error, written by the runtime to
        node files and served by the kubelet. They explain application startup and crashes, but a
        kernel OOM kill can leave no final stack trace.

        [Why is my application not working?](/lesson/o1.troubleshooting) read a crashing program's log; here the
        question is which instance you read. After a restart, default logs show the current instance. `--previous` requests the last terminated
        instance of a container; when a pod has several containers, `-c <name>` says which one. If the
        container never terminated, there is no previous instance to read. The kubelet normally keeps one
        such instance; this is not an archive of every restart.
      title: Ask what the program said
    - kind: show
      id: crashy-manifest
      code: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: crashy
        spec:
          replicas: 1
          selector:
            matchLabels: {app: crashy}
          template:
            metadata:
              labels: {app: crashy}
            spec:
              containers:
              - name: app
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                imagePullPolicy: IfNotPresent
                command: ["sh", "-c", "echo starting app; sleep 20; echo fatal: CONFIG_URL is not set; exit 1"]
      caption: crashy.yaml, applied by developer in the next step
      notice: The program prints a line, waits 20 seconds, prints an error and exits, as a program does when a setting is missing.
    - kind: show
      id: crashy-start
      body: "developer applies it. `oc logs deploy/…`, used next, picks a pod of the Deployment for you."
      run: "oc apply -f crashy.yaml && oc rollout status deploy/crashy --timeout=120s"
      notice: "The Deployment is created and rolled out: its pod is Ready, and the first instance of the container is running."
    - kind: show
      id: no-previous
      body: "Ask for the previous instance while the first one is still running:"
      run: "oc logs deploy/crashy --previous"
      notice: |
        An error: the container has never terminated, so there is no previous instance to return. The current
        instance has a log, though:
    - kind: show
      id: current-log
      run: "oc logs deploy/crashy"
      notice: "`starting app`: everything the running instance has printed so far."
    - kind: ask
      id: guess-previous
      guess: true
      prompt: In a few seconds the program exits with its error and the kubelet restarts the container in the same pod. Which command then shows the error line?
      choices:
        - text: "`oc logs deploy/crashy`"
          why: That reads the new, current instance, which starts again from `starting app`.
        - text: "`oc logs deploy/crashy --previous`"
          why: "`--previous` reads the last terminated instance of the container: the one that printed the error. The next steps show it."
        - text: Neither, because a restart deletes the log
          why: The kubelet keeps the last terminated instance's log while the pod exists. Deleting the pod is what loses it.
      answer: 1
    - kind: show
      id: restarted
      body: "`oc wait` can also wait for a field to reach a value. Wait for the first restart:"
      run: "oc wait pod -l app=crashy --for=jsonpath='{.status.containerStatuses[0].restartCount}'=1 --timeout=120s && oc get pods -l app=crashy"
      notice: "RESTARTS is now 1: the first instance exited and the kubelet started a new one in the same pod."
    - kind: show
      id: previous-log
      run: "oc logs deploy/crashy --previous"
      notice: |
        The first instance's last words: `starting app`, then `fatal: CONFIG_URL is not set`. This is the
        evidence a crash leaves, and `--previous` is how you read it once the container has been restarted.
    - kind: show
      id: last-state
      body: "The pod's own record of that termination, without any log:"
      run: "oc describe pod -l app=crashy | sed -n '/Last State/,/Restart Count/p'"
      notice: |
        `Last State: Terminated`, reason `Error`, exit code `1`, started and finished 20 seconds apart, as the
        program was written to do.
        If a log shows no useful error, the last termination state (an `OOMKilled` reason, for example) and the
        events are the next places to look.
    - kind: show
      id: pod-events
      body: "Finally, the project's events, sorted by their last time: what the platform did with this pod."
      run: "oc get events --sort-by=.lastTimestamp"
      notice: |
        Read the LAST SEEN column, not only the line order: `Scheduled` (22s) is listed above `SuccessfulCreate`
        and `ScalingReplicaSet` (23s), although the pod was created before it was scheduled. Some components,
        the scheduler among them, record their time in another field than `lastTimestamp`, so the sort puts
        their events first. In time: the Deployment scaled up its ReplicaSet, the ReplicaSet created the pod, the
        scheduler placed it, then come the kubelet's image, create and start events. Those three say `2s`: a repeated event is updated, not
        duplicated, and the restart repeated them. There is no `BackOff` warning yet, because this first restart
        came at once; a container that keeps failing is restarted after longer and longer waits, which appear as
        `BackOff` warnings. Events say what the platform did; the log says why the program stopped.
    - kind: try
      id: previous-task
      body: In the hypothetical billing project, pod api-8 has two containers, and the one named server restarted.
        Request that container's previous logs. Nothing runs.
