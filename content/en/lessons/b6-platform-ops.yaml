# Platform operations teaching flows. Commands are recorded on a disposable training cluster by a maintainer (scripts/record.py); code blocks marked as examples are documentation-based.
- id: n.installation
  title: Install the platform
  subtitle: Methods, topologies and day-1 decisions
  module: p0-install
  mode: ENTERPRISE_ARCHITECTURE
  minutes: 25
  level: 2
  supports: OpenShift 4.21 installation methods (installer-provisioned, user-provisioned, Agent-based Installer,
    Assisted Installer) and topologies (standard, compact, single node, two-node with arbiter, hosted control planes).
    Installing a cluster needs infrastructure the app does not have; OpenShift Local is a preinstalled single-node
    bundle. Its installation record and resulting state were read on the course's OpenShift Local 4.21 cluster by the
    cluster administrator (kubeadmin), read only; the installation itself is explained with documentation examples.
  record_on: cluster-admin
  concepts:
    - ocp.install
    - ent.ha
    - ocp.clusteroperators
  prerequisites:
    - c.openshift-extends
  objective: |
    Choose an installation method and a topology for a given environment, explain what happens during installation,
    and list the decisions that cannot be changed after day 1.
  flow:
    - kind: teach
      id: situation
      body: |
        Your team has servers for a new site, but no cluster yet. Before anyone boots an installer,
        operations needs to know who will create the machines, how much failure the site must tolerate,
        and which network ranges are safe to reserve.

        You will choose an installation method and topology, follow the bootstrap handover, and distinguish
        installation decisions from settings you can change later. Nothing is installed here: OpenShift Local
        arrives preinstalled. Its administrator reads, without changing anything, the record its installation
        left behind and the state it produced, so you can see real day-1 decisions next to the planning tasks.
      title: A cluster for a new site
    - kind: teach
      id: provisioning
      body: |
        **Installer-provisioned infrastructure (IPI)** lets the installer create infrastructure through a
        supported platform API, including bare-metal management controllers where supported.
        **User-provisioned infrastructure (UPI)** means your team supplies hosts, DNS and load balancers;
        the installer generates configuration for those hosts.

        Choose according to the control you can grant the installer. Also look past day 1 (installation)
        to day 2 (running the cluster): with the **Machine API**, which a later lesson covers in
        [Nodes, machines and capacity planning](/lesson/n.nodes-capacity), the cluster's own controllers
        create and replace hosts. That needs platform support and configuration, so UPI alone is not a
        promise of automated node replacement.
      title: Who creates the infrastructure?
    - kind: teach
      id: iso-installers
      body: |
        The **Agent-based Installer** builds an ISO you boot on your hosts. It runs installation locally,
        which suits a disconnected site with mirrored release content. The **Assisted Installer** offers
        host discovery and validation through Red Hat's hosted web service; hosts must reach that service.

        A disconnected installation needs its release images and other required content available locally.
        The method table under Go deeper compares these responsibilities.
    - kind: ask
      id: choose-disconnected
      prompt: An isolated bare-metal site has no route to Red Hat's hosted services. It wants host discovery and
        validation to run on its own hosts. Which method fits?
      choices:
        - text: Assisted, through the hosted console
          why: That guided service needs connectivity from the hosts; an isolated site cannot reach it.
        - text: Agent-based, with mirrored content
          why: The agent on each host does the discovery and validation, and the release content comes from the local
            mirror.
        - text: UPI, because only UPI works without Internet
          why: UPI can be installed disconnected too, but then your team supplies the hosts, DNS and load balancers and
            works from generated configuration. It has no host discovery step.
      answer: 1
    - kind: teach
      id: bootstrap
      body: |
        For conventional IPI and UPI installs, a temporary **bootstrap host** runs a one-member etcd (the
        database that holds the cluster's state) and a temporary control plane. RHCOS, the node operating system, starts the production control-plane
        hosts from **Ignition**, their first-boot configuration. They form the production control plane,
        which takes over before the temporary host is removed.

        The Agent-based Installer uses a control-plane host called the **rendezvous host** for bootstrap,
        so it needs no extra bootstrap machine. The Cluster Version Operator deploys the release's platform
        components; their health tells you whether installation has completed.
      title: A temporary control plane
    - kind: order
      id: bootstrap-order
      prompt: Put the conventional IPI/UPI bootstrap handover in order.
      items:
        - Boot the temporary host with its Ignition configuration.
        - Bring up the production control-plane hosts and their control plane.
        - Confirm bootstrap completion before removing the temporary host.
        - Wait for installation completion and check platform health.
      why: The temporary control plane must remain until the production control plane can continue without it.
    - kind: teach
      id: ignition-clock
      body: |
        Keep the installation directory, admin kubeconfig and initial kubeadmin password secure.
        Generate Ignition files close to the boot window: embedded certificates expire after 24 hours,
        and the documentation recommends using the files within 12 hours.

        The cluster rotates initial certificates between 16 and 22 hours after installation. If it is
        shut down before rotation and restarted after expiry, recovery can require manual approval of
        verified node-bootstrapper certificate signing requests. Reusing stale installation assets is
        not a recovery procedure.
      title: Generated configuration has a clock
    - kind: ask
      id: stale-assets
      prompt: Ignition files were generated Monday; the UPI hosts boot Thursday and fail. What do you change first?
      choices:
        - text: Reuse them with a different SSH key
          why: An SSH key helps access hosts but cannot renew the bootstrap certificates inside old assets.
        - text: Approve the hosts' pending certificate requests
          why: Approval comes after a host has joined. Expired bootstrap certificates inside the old files stop the
            hosts from joining at all.
        - text: Regenerate the installation assets
          why: Their embedded bootstrap certificates have expired; generate fresh assets for the new boot window.
      answer: 2
    - kind: teach
      id: topology
      body: |
        A standard topology separates three control-plane nodes from workers. A **compact** cluster runs
        control-plane and application workloads on three nodes. Both keep **quorum**, a majority of the
        etcd members, when one control-plane node fails, so the control plane keeps working. Application
        availability still needs replicas, placement, capacity and storage that tolerate the failure.

        **Single Node OpenShift (SNO)** puts the platform and workloads on one host: losing it causes an
        outage. Adding supported workers increases capacity, not control-plane availability. Decide the
        availability requirement before choosing the machine count.
      title: How many failures must the site tolerate?
    - kind: ask
      id: one-site
      prompt: A shop has one suitable server and accepts outages during host repairs. Which topology matches?
      choices:
        - text: SNO at the shop
          why: One host fits SNO, with a replacement plan and explicit acceptance of site outages.
        - text: A standard cluster on that server
          why: A standard highly available design needs independent hosts; several VMs on one server still share
            its failure.
        - text: One control plane stretched across distant shops
          why: Control-plane communication needs suitable latency and failure-domain design; distance does not turn
            one server per site into a safe shared control plane.
      answer: 0
    - kind: show
      id: lab-topology
      body: "The lab cluster made that choice. The administrator reads how the cluster describes its own topology:"
      run: "oc get infrastructure cluster -o jsonpath='{.status.platform}{\" \"}{.status.controlPlaneTopology}{\" \"}{.status.infrastructureTopology}{\"\\n\"}'"
      notice: |
        `None SingleReplica SingleReplica`: no platform integration (no cloud or bare-metal API the cluster could
        use), and a single replica for both the control plane and the infrastructure components.
    - kind: show
      id: lab-install-config
      body: |
        The installer keeps the install-config it used in a ConfigMap, `cluster-config-v1` in `kube-system`. The
        administrator prints a few of its top-level keys; the pull secret and SSH key, also stored there, are left out:
      run: "oc get configmap cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | grep -E '^(baseDomain|bootstrapInPlace):|^  (name|replicas|installationDisk):'"
      notice: |
        The base domain (`testing`) and the cluster name (`crc`); the indented pairs belong to the two machine pools:
        `name: worker` with `replicas: 0` (compute) and `name: master` with `replicas: 1` (control plane); and
        `bootstrapInPlace` with an installation disk: a single-node installation runs its bootstrap on the node
        itself, which then becomes the cluster, instead of using a separate bootstrap machine.
    - kind: teach
      id: other-topologies
      body: |
        A **two-node cluster with an arbiter** uses two full nodes and a smaller etcd-bearing node for
        quorum; the arbiter runs no ordinary workloads. The two-node fencing alternative is Technology
        Preview in 4.21. These designs have different infrastructure requirements.

        With **hosted control planes**, each tenant cluster's control plane runs as pods on a hosting
        cluster. Availability depends on that hosting platform as well as tenant workers. The multicluster
        engine operator delivers this capability; Advanced Cluster Management is not required. Managed
        services such as ROSA, ARO and OpenShift Dedicated shift operational responsibilities to a provider.
    - kind: teach
      id: day-one
      body: |
        Agree on the cluster name, base domain, platform, topology and network ranges with the network and
        security teams. Three ranges are set at installation: the **machine network** (the addresses of the
        hosts), the **pod network** (where pods get their addresses) and the **service network** (where
        Services get their cluster IPs). None may overlap a network the cluster must reach, and a
        NetworkPolicy cannot fix an overlap. Decide also whether FIPS mode, the installation-time setting
        for supported Federal Information Processing Standards cryptography, is required.

        These choices have different change rules. After installation the service network cannot be
        changed at all, and the pod (cluster) network can only be expanded through the documented
        OVN-Kubernetes procedure, never moved or shrunk. Mirror configuration can
        evolve through documented procedures.
        Record the choices and their supported change paths in an architecture decision record instead
        of treating every installation value as equally immutable.
      title: Decisions to settle before booting
    - kind: ask
      id: overlap
      prompt: The service network overlaps a corporate subnet needed by pods. What is the realistic response?
      choices:
        - text: Allow that subnet with a NetworkPolicy
          why: A policy filters traffic. It cannot resolve two networks using the same addresses.
        - text: Plan a supported migration
          why: The service network cannot be moved to another range in place; an architecture migration, often to a replacement
            cluster, is needed.
        - text: Edit the service range and restart the router
          why: The router does not control the service address range, and that range cannot be moved after installation.
      answer: 1
    - kind: show
      id: lab-networks
      body: "The lab cluster's three ranges, as written in its install-config:"
      run: "oc get configmap cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | sed -n '/^networking:/,/^publish:/p'"
      notice: |
        `clusterNetwork` (pods, with the size of each node's slice in `hostPrefix`), `machineNetwork` (the host's
        address range), the network plugin `networkType: OVNKubernetes`, and `serviceNetwork`. The platform `none`
        follows.
        The pod network is sized for this topology: a `/22` cut into `/23` slices holds two nodes' pod ranges, so
        a cluster expected to grow needs a larger range from day 1.
    - kind: show
      id: lab-networks-live
      body: "The same ranges in the cluster's live network configuration, long after installation:"
      run: "oc get network.config cluster -o jsonpath='{.status.clusterNetwork}{\"\\n\"}{.status.serviceNetwork}{\"\\n\"}'"
      notice: "The pod network and the service network the cluster runs with are the ones chosen at installation."
    - kind: teach
      id: installation-evidence
      body: |
        Before bootstrap completes, use the installer's bootstrap log gathering with the installation SSH
        key. After the API is available, inspect ClusterVersion and ClusterOperator conditions. A console
        Route lookup failing with “no such host” points first to DNS, including the apps wildcard.

        On UPI, absent workers can mean pending client or serving certificate requests. Check each request
        against the expected host before approving it. On a running cluster, support data comes from
        must-gather; it is not a substitute for pre-bootstrap installer logs.
      title: Match evidence to the failed stage
    - kind: show
      id: operator-example
      body: "On the finished lab cluster, the administrator reads the two objects that say whether an installation is complete:"
      run: "oc get clusterversion"
      notice: "The ClusterVersion names its release and reports Available `True`, Progressing `False`."
    - kind: show
      id: operators-example
      run: "oc get clusteroperators"
      notice: |
        A finished cluster reports each operator as Available True, Progressing False and Degraded False. During an
        installation that has not finished, an operator that is not Available explains why in MESSAGE; read that text
        first. A responding API alone does not show that the installation has completed. OpenShift Local lists
        fewer operators than an installed cluster: monitoring, for example, is switched off.
    - kind: try
      id: check-nodes
      body: After an installation, list the cluster's nodes to check whether the expected hosts joined. Nothing you
        type runs; the output shown afterwards is the lab cluster's.
      accept: [oc get nodes, oc get node, oc get no, oc get nodes -o wide, oc get nodes --output wide, oc get nodes
          --output=wide, oc get nodes --show-labels, oc get node -o wide, oc get node --output wide, oc get node
          --output=wide, oc get node --show-labels, oc get no -o wide, oc get no --output wide, oc get no --output=wide,
        oc get no --show-labels]
      hints:
        - match: ^oc get (pods|po)
          say: Pods are workloads; you need the Node objects representing joined hosts.
        - match: ^oc describe
          say: Describe gives detail; begin with a list of all joined nodes.
      hint: Use the get verb with the node resource.
      run: "oc get nodes"
      then: The lab cluster has one Node, Ready, with the roles of a single-node cluster. On a new multi-node cluster this
        lists every joined host; missing hosts need installation and certificate evidence, which the list alone does
        not give.
    - kind: reflect
      id: blueprint
      prompt: What would you record before choosing SNO for an isolated site?
      model: Record the outage tolerance, host sizing and replacement plan, network ranges and DNS, FIPS requirement,
        installation method, mirror content and access, and who owns recovery. A single server gives no control-plane
        redundancy.
    - kind: teach
      id: what-next
      body: |
        You can choose a method from infrastructure ownership and connectivity, choose a topology from the
        failure requirement, explain bootstrap handover, and identify installation decisions that need advance agreement.

        Next, scheduling explains why an installed cluster can still leave an application pod waiting for a node.
      title: What you can do now
  sections:
    - id: four-ways-to-install
      title: Four ways to install
      body: |
        | Method | Who creates the infrastructure | Typical fit |
        |---|---|---|
        | **Installer-provisioned (IPI)** | the installer, through the platform's API (cloud, vSphere, OpenStack, bare metal with BMC access) | standard environments where the installer may create machines, load balancers and DNS records |
        | **User-provisioned (UPI)** | you: machines, load balancers, DNS; the installer only produces the Ignition configuration | strict organisations, unusual networks, platforms without integration |
        | **Agent-based Installer** | you boot your machines from an ISO you generate; installation runs from the hosts themselves | on-premises and disconnected bare metal, no external service |
        | **Assisted Installer** | a hosted service on the Red Hat Hybrid Cloud Console guides discovery, validation and installation | connected environments that want a guided web flow |

        The method also shapes day 2: on installer-provisioned infrastructure the **Machine API** can create and replace
        nodes for you; on user-provisioned infrastructure, automatic node management depends on platform support and additional configuration; without it, adding nodes is manual.

        Plain Kubernetes distributions are installed by many different tools (kubeadm, cloud services). OpenShift has
        one release payload and these supported paths, and the result is always the same operator-managed platform.
      depth: true
    - id: topologies
      title: Topologies
      body: |
        | Topology | Nodes | Survives | Typical use |
        |---|---|---|---|
        | Standard | 3 control plane + 2 or more workers | control-plane quorum after one control-plane failure; workload survival depends on replicas and capacity | production |
        | Compact | 3 nodes, each control plane and worker | control-plane quorum after one node failure; workloads need resilient placement | small production, edge sites |
        | Two-node with arbiter (GA since 4.20) | 2 full nodes + a small arbiter node that stores etcd data for quorum but runs no workloads | quorum after one full-node failure; workloads need resilient placement | edge sites with tight hardware budgets |
        | Single Node OpenShift (SNO) | 1 (at least 8 vCPUs, 16 GB RAM, 120 GB disk in 4.21) | nothing: any failure is an outage | edge, labs (OpenShift Local is SNO-shaped) |
        | Hosted control planes | control planes run as pods on a management (hosting) cluster; each hosted cluster has only workers | depends on the hosting cluster | many clusters at scale, faster provisioning |

        A two-node topology with fencing instead of an arbiter is a Technology Preview in 4.21. Hosted control planes are
        delivered by the multicluster engine for Kubernetes operator (Advanced Cluster Management is not required) on
        platforms such as bare metal, OpenShift Virtualization and AWS.

        Managed offerings move the whole question to a provider: Red Hat OpenShift Service on AWS (ROSA), Azure Red Hat
        OpenShift (ARO) and OpenShift Dedicated, operated jointly with or by Red Hat.
      depth: true
    - id: day-1-decisions-you-live-with
      title: Day-1 decisions you live with
      body: |
        Some choices in `install-config.yaml` are effectively permanent, or need a migration project to change:

        - cluster name and base domain (they form `api.<cluster>.<domain>` and `*.apps.<cluster>.<domain>`);
        - platform and installation method;
        - the pod network, the service network and the machine network ranges, which must not overlap with corporate
          networks the cluster needs to reach (with OVN-Kubernetes the pod network can later be *expanded*; the service
          network cannot);
        - FIPS mode, set only at installation;
        - topology: a single-node cluster cannot be converted into a highly available one later (a compact cluster can
          receive additional workers);
        - plan before installing disconnected clusters: the mirror registry and the content mirrored to it with oc-mirror (v2; v1 is
          deprecated). The *mirror registry for Red Hat OpenShift* is a small Quay instance meant only for installation
          content, not a production registry.

        Check the supported change procedure for each parameter. Network expansion is not arbitrary replacement, and mirror settings can be changed through documented disconnected-cluster procedures.

        Write these down as an architecture decision record with the network and security teams *before* installing.
      depth: true
    - id: when-an-installation-goes-wrong
      title: When an installation goes wrong
      body: |
        Installations fail in a small number of places, and each has its own evidence:

        | Symptom | Evidence | Likely cause | Fix |
        |---|---|---|---|
        | `openshift-install wait-for bootstrap-complete` times out | `openshift-install gather bootstrap` (needs the SSH key given at install time) collects logs from the bootstrap and control-plane hosts | missing or wrong `api` / `api-int` DNS records or load balancer, hosts that cannot fetch their Ignition files, Ignition files older than their certificates | fix the infrastructure prerequisite; regenerate Ignition files that are too old |
        | bootstrap done, installation never completes | `oc get clusterversion` and `oc get clusteroperators`: read the message of every operator not Available | often ingress: no `*.apps` wildcard record or application load balancer, so the console operator reports `RouteHealthAvailable: failed to GET route` | create the record and load balancer; the operators recover on their own |
        | workers never appear (user-provisioned) | `oc get nodes` lacks them; `oc get csr` shows Pending requests | nobody approved the new nodes' certificate signing requests (client first, then serving) | approve them after checking they belong to your hosts |
        | after a shutdown in the first day, nodes stay NotReady | Pending `node-bootstrapper` requests in `oc get csr` | the initial certificates expired while the cluster was off | approve the pending requests (the documented recovery) |

        Gather logs from a running cluster with `oc adm must-gather`, not with the installer's gather command; the
        installer's version is for installations that failed before bootstrap completed.
      depth: true
    - id: common-mistakes
      title: Common mistakes
      depth: true
      body: |
        - **Overlapping network ranges.** A pod or service CIDR that overlaps a corporate subnet makes that subnet
          unreachable from pods, and fixing it later is a major change.
        - **Treating SNO as "production minus a few nodes".** It has no high availability and cannot be converted later;
          decide with the availability requirement in hand.
        - **Losing the installation directory** (kubeconfig, metadata) before a real identity provider is configured.
        - **Shutting down a new cluster in its first 24 hours.** The initial certificates may expire while it is off,
          and recovery needs manual approval of the nodes' certificate signing requests.
        - **Choosing user-provisioned infrastructure by habit.** It gives control, and costs the Machine API's automatic
          node management.
  review:
    - q: Name the four installation methods for OpenShift 4.
      a: Installer-provisioned infrastructure, user-provisioned infrastructure, the Agent-based Installer and the
        Assisted Installer.
    - q: What does the bootstrap machine do?
      a: Runs a temporary control plane that brings up the real control-plane nodes, then is removed.
    - q: Which topologies tolerate the loss of one node?
      a: Standard (one control-plane node, or workers), compact (one node) and two-node with arbiter (one full node);
        SNO tolerates none.
    - q: Name three day-1 decisions that are hard or impossible to change later.
      a: Cluster name and base domain, network ranges (the service network cannot be changed after installation;
        the pod network can only be expanded as documented, not moved or shrunk), FIPS mode (also platform and single-node topology).
    - q: Where do hosted control planes run?
      a: As pods on a management (hosting) cluster; each hosted cluster only has worker nodes of its own.
  labs: []
  limits: |
    This environment has no infrastructure for installation. OpenShift Local arrives preinstalled; the recording
    reads its installation record and its finished state, read only, and prints only chosen keys of the stored
    install-config, never its pull secret or SSH key. Practising installation requires
    supported hosts or a cloud environment, DNS, load balancing where required, image access and installation
    credentials. The lesson's other examples are documentation-based, and its typed task runs nothing.
  enterprise: |
    Large organisations standardise a small number of cluster blueprints (production standard, edge single node,
    hosted control planes for many small clusters), record the day-1 decisions per cluster, and automate installation
    from Git so that rebuilding a cluster is a routine, tested procedure.
  references:
    - title: 'OpenShift 4.21: Installation overview'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/installation_overview/ocp-installation-overview
    - title: 'OpenShift 4.21: Installation and update architecture (bootstrap process)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/architecture/architecture-installation
    - title: 'OpenShift 4.21: Preparing to install with the Agent-based Installer'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/installing_an_on-premise_cluster_with_the_agent-based_installer/preparing-to-install-with-agent-based-installer
    - title: 'OpenShift 4.21: Preparing to install on a single node'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/installing_on_a_single_node/preparing-to-install-sno
    - title: 'OpenShift 4.21: Two-node OpenShift cluster with an arbiter'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/installing_a_two_node_openshift_cluster/about-two-node-arbiter-installation
    - title: 'OpenShift 4.21: Hosted control planes overview'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/hosted_control_planes/hcp-overview
    - title: 'OpenShift 4.21: Configuring the cluster network range'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/configuring_network_settings/configuring-cluster-network-range
    - title: 'OpenShift 4.21: Installing on bare metal with user-provisioned infrastructure (Ignition certificate
        lifetime)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/installing_on_bare_metal/user-provisioned-infrastructure
    - title: 'OpenShift 4.21: Troubleshooting installation issues'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/validation_and_troubleshooting/installing-troubleshooting
    - title: 'OpenShift 4.21: Worker nodes for single-node OpenShift clusters (capacity without control-plane HA)'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/nodes/worker-nodes-for-single-node-openshift-clusters
    - title: 'OpenShift 4.21: Converting a connected cluster to a disconnected cluster'
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/disconnected_environments/connected-to-disconnected
  commands:
    - {cmd: "oc get infrastructure cluster -o jsonpath='{.status.platform}{\" \"}{.status.controlPlaneTopology}{\" \"}{.status.infrastructureTopology}{\"\\n\"}'", as: admin, meaning: "platform None; single-replica control plane and infrastructure"}
    - {cmd: "oc get configmap cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | grep -E '^(baseDomain|bootstrapInPlace):|^  (name|replicas|installationDisk):'", as: admin, meaning: "chosen keys of the stored install-config: names, replicas, bootstrap in place"}
    - {cmd: "oc get configmap cluster-config-v1 -n kube-system -o jsonpath='{.data.install-config}' | sed -n '/^networking:/,/^publish:/p'", as: admin, meaning: "the network ranges chosen at installation"}
    - {cmd: "oc get network.config cluster -o jsonpath='{.status.clusterNetwork}{\"\\n\"}{.status.serviceNetwork}{\"\\n\"}'", as: admin, meaning: "the same ranges in the live configuration"}
    - {cmd: "oc get clusterversion", as: admin, meaning: "the installed release, Available and not Progressing"}
    - {cmd: "oc get clusteroperators", as: admin, meaning: "every platform operator's state"}
    - {cmd: "oc get nodes", as: admin, meaning: "the hosts that joined: one"}
- id: b.scheduler
  title: How pods get a node
  subtitle: Filtering, scoring, affinity, taints and spreading
  module: p1-scheduling
  mode: REAL_LAB
  minutes: 35
  level: 2
  supports: Kubernetes 1.34 scheduling framework and default plugins; OpenShift 4.21 scheduler profiles. The
    placement steps were run on OpenShift Local 4.21, a one-node cluster, by the cluster administrator (kubeadmin), who
    labelled and tainted the node, and by the ordinary user developer, whose pods waited or ran because of it, in a
    temporary project. The label and the taint were then removed and the node's labels, taints and schedulability
    were compared with the copy taken before (experiment X-NODE-03). Multi-node scoring is shown by a labelled
    simulator; typed tasks run nothing.
  concepts:
    - k8s.scheduler
    - k8s.affinity
  prerequisites:
    - b.resources-qos
  record_on: cluster-admin
  objective: |
    Explain precisely how kube-scheduler chooses a node: the filter phase, the score phase, plugin weights,
    normalisation and tie-breaking. Use requests, node selectors and affinity, taints and tolerations, pod
    anti-affinity and topology spread on purpose, and recognise each one's FailedScheduling message.
  flow:
    - kind: teach
      id: situation
      body: |
        A Deployment requests three replicas, but one pod stays Pending. A teammate points at an idle CPU
        graph and says there must be a scheduler bug. Another wants to loosen a placement rule without
        checking why the rule exists.

        You will follow placement from hard requirements to preferences, learn how labels, taints and
        tolerations restrict where a pod may go, and read the scheduler's refusals. Everything you see run
        was done for real on a lab cluster (OpenShift Local 4.21, one node) by two people: the cluster
        administrator, who labels and taints the node, and an ordinary user, `developer`, whose pods wait or
        run because of it. The prompt in front of each command names who ran it. Multi-node choices come from
        an interactive model, labelled as such, and typed tasks run nothing.
      title: A pod has nowhere to go
    - kind: teach
      id: filter
      body: |
        The scheduler chooses a node for an unscheduled pod. **Filtering** rejects nodes that cannot meet
        all hard requirements: requests must fit, required labels must match, taints must be tolerated,
        and volume and placement constraints must be satisfied.

        [Requests, limits, QoS and quotas](/lesson/b.resources-qos) explains requests: scheduling reserves
        that amount on one node. It compares the request with allocatable resources minus requests already
        placed there, rather than current usage. Enough CPU across several nodes cannot host one pod
        that needs more CPU than any single node offers.
      title: First ask whether it can run
    - kind: ask
      id: request-fit
      recalls: b.resources-qos
      prompt: A pod requests 5 CPUs. Each of three nodes has 4 allocatable CPUs. Which change lets the scheduler
        place it?
      choices:
        - text: A fourth node with 4 allocatable CPUs
          why: That increases the total, but no single node can hold this pod.
        - text: Waiting until measured CPU use is zero
          why: Idle hardware still has only 4 allocatable CPUs per node, and usage is not what the fit check uses.
        - text: A node with 6 allocatable CPUs
          why: One pod must fit on one node, so a node with at least 5 allocatable CPUs, or a smaller request,
            is what makes it schedulable.
      answer: 2
    - kind: teach
      id: score
      body: |
        **Scoring** ranks the nodes that passed filtering. Plugins rate nodes from 0 to 100 after any
        needed normalisation; the scheduler multiplies scores by plugin weights and adds them. The
        highest total wins, with random selection among ties. With only one feasible node, it skips scoring.

        If no node passes, PostFilter can try **preemption**, removing lower-priority pods to make room.
        That cannot create a missing label or make a node larger. Binding assigns the chosen node to the
        pod; the kubelet there then starts its containers.
      title: Then ask which eligible node is preferable
    - kind: ask
      id: weighted-score
      prompt: All other scores are equal. Which node wins these two weighted contributions?
      choices:
        - text: 'B: its total contribution is 260'
          why: B gets 60 + 2 × 100, while A gets 80 + 2 × 0 = 80.
        - text: 'A: its resource score is higher'
          why: A wins that one plugin, but weighted contributions are summed across plugins.
        - text: 'A random node: preferences are ignored'
          why: Preferences affect scoring; randomness applies only when final totals tie.
      answer: 0
      evidence: |
        Plugin                 Weight   A    B
        NodeResourcesFit          1     80   60
        NodeAffinity              2      0  100
        # Hypothetical scores for this calculation; not cluster output.
    - kind: teach
      id: the-node
      title: The node the rules are compared with
      body: |
        Placement rules are compared with what the node says about itself: its **labels** and its **taints**.
        Reading nodes needs cluster-wide permission, so the administrator looks first.
    - kind: show
      id: nodes
      run: "oc get nodes"
      notice: |
        One node, `crc`. Its ROLES column says `control-plane,master,worker`: on OpenShift Local the only node is
        control plane and worker at once. Every placement decision here is "this node or nothing".
    - kind: show
      id: node-labels
      body: "`-L` adds a column with the value of a label. Two labels that placement rules often use:"
      run: "oc get node crc -L lab-tier -L topology.kubernetes.io/zone"
      notice: |
        Both columns are empty: the node has no `lab-tier` label (this lesson's own key) and no zone label.
        A rule that requires either cannot be met here yet.
    - kind: show
      id: node-taints
      run: "oc describe node crc | grep -E '^(Taints|Unschedulable):'"
      notice: "`Taints: <none>` and `Unschedulable: false`: nothing repels pods from this node at the moment."
    - kind: teach
      id: selectors
      body: |
        A `nodeSelector` requires every listed node label to match. Node affinity expresses richer label
        rules: `requiredDuringSchedulingIgnoredDuringExecution` filters; `preferredDuringSchedulingIgnoredDuringExecution`
        adds a preference. If both a selector and required affinity are present, both apply.

        “IgnoredDuringExecution” means later label changes do not move already running pods. Change a
        Deployment's pod template to correct a requirement for replacement pods; assigning `spec.nodeName`
        directly bypasses scheduler checks and can leave the kubelet unable to admit the pod.
      title: Labels make requirements explicit
    - kind: show
      id: tier-manifest
      code: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: tier
        spec:
          nodeSelector:
            lab-tier: demo
          containers:
          - name: app
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            imagePullPolicy: IfNotPresent
            command: ["sleep", "infinity"]
            resources:
              requests: {cpu: 5m, memory: 8Mi}
              limits: {memory: 32Mi}
      caption: pod-tier.yaml, created by developer in the next step
      notice: The pod may run only on a node labelled `lab-tier=demo`. A moment ago, the node had no such label.
    - kind: show
      id: tier-create
      run: "oc apply -f pod-tier.yaml"
      notice: "`pod/tier created`: the API server accepted the pod. Whether it can run is the scheduler's decision, a moment later."
    - kind: show
      id: tier-unscheduled
      body: "`oc wait` blocks until a condition holds. Wait for the scheduler's verdict:"
      run: "oc wait pod/tier --for=condition=PodScheduled=false --timeout=60s"
      notice: "`condition met`: the scheduler looked at the pod and found no node for it."
    - kind: show
      id: tier-event
      body: "The reason is in an event, which developer can read in their own project:"
      run: "oc get events --field-selector reason=FailedScheduling,involvedObject.name=tier"
      notice: |
        The message starts with a count, `0/1 nodes are available`: the cluster's only node cannot run the pod.
        Then comes the reason with the number of nodes it applies to: `1 node(s) didn't match Pod's node
        affinity/selector`. `no new claims to deallocate` comes from the plugin for dynamically allocated devices
        (ResourceClaims, used for GPUs and similar hardware): this pod has none, so it has nothing to free; you will
        see the phrase in every FailedScheduling message here. The text after `preemption:` says whether evicting
        lower-priority pods could make room; no eviction can create a label, so it could not.
    - kind: show
      id: developer-nodes
      body: "developer would like to see the node's labels, as the administrator did:"
      run: "oc get nodes"
      notice: |
        Forbidden: an ordinary user cannot list nodes, which are cluster-scoped. The event is all the evidence
        developer has; comparing it with the node's labels and taints is the administrator's half of the work.
    - kind: ask
      id: guess-label
      guess: true
      prompt: The administrator now labels the node `lab-tier=demo`. Nobody touches the Pending pod. What happens to it?
      choices:
        - text: It stays Pending until someone deletes and recreates it
          why: A Pending pod is not a failed pod. The scheduler keeps it in its queue and tries again when the cluster changes.
        - text: The scheduler tries again and places it on the node
          why: A change to a node's labels sends waiting pods back to the scheduler. The next steps show it.
        - text: It is rejected, because it was refused once
          why: A FailedScheduling event records one attempt. It is not a final decision.
      answer: 1
    - kind: try
      id: try-label-node
      body: "As the administrator, give the node `crc` the label `lab-tier` with the value `demo`."
      accept: ["oc label node crc lab-tier=demo", "oc label nodes crc lab-tier=demo", "oc label node/crc lab-tier=demo", "oc label nodes/crc lab-tier=demo", "oc label no crc lab-tier=demo", "oc label node crc lab-tier=demo --overwrite"]
      hints:
        - match: "lab-tier:demo|lab-tier demo"
          say: "A label is written `key=value`, with an equals sign: `lab-tier=demo`."
        - match: "^oc label (pod|pods|po)\\b"
          say: "The pod's selector is fine. The node lacks the label, so the label goes on the node."
        - match: "^oc annotate"
          say: "An annotation is not a label: selectors only ever match labels."
        - match: "^oc label crc"
          say: "`oc label` needs the kind before the name: `oc label node crc …`."
      hint: "`oc label`, the kind `node`, its name, and `key=value`."
      run: "oc label node crc lab-tier=demo"
      then: "`node/crc labeled`. Nothing else changed: the pod still has the same selector."
    - kind: show
      id: tier-runs
      body: "developer waits for the pod to become Ready, then asks where it runs:"
      run: "oc wait pod/tier --for=condition=Ready --timeout=120s && oc get pod tier -o wide"
      notice: |
        The pod that was Pending is now Running, and the NODE column says `crc`. Nobody recreated it: the label
        change sent it back to the scheduler, and this time the node passed the filter.
    - kind: show
      id: affinity-example
      code: |
        # Pod spec excerpt
        nodeSelector:
          disktype: ssd
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: [zone-a, zone-b]
      origin: example
      caption: 'Kubernetes: Assigning pods to nodes; adapted Pod spec example.'
      notice: The SSD label and one allowed zone are both required. OR joins selector terms; AND joins expressions
        within one term.
    - kind: ask
      id: combined-rules
      prompt: For this Pod excerpt, X has SSD in zone-c; Y has zone-a but no disk label. Which node qualifies?
      choices:
        - text: X, because the disk selector takes precedence
          why: The selector does not override affinity. X still needs an allowed zone.
        - text: Neither node
          why: X fails required zone affinity; Y fails nodeSelector. Both requirements must hold.
        - text: Y, because affinity replaces the disk selector
          why: Affinity and nodeSelector combine with AND, so Y still needs the SSD label.
      answer: 1
    - kind: show
      id: affine-manifest
      code: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: affine
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - {key: lab-tier, operator: In, values: [demo, staging]}
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 50
                preference:
                  matchExpressions:
                  - {key: disktype, operator: In, values: [ssd]}
          containers:
          - name: app
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            imagePullPolicy: IfNotPresent
            command: ["sleep", "infinity"]
            resources:
              requests: {cpu: 5m, memory: 8Mi}
              limits: {memory: 32Mi}
      caption: pod-affine.yaml, created by developer in the next step
      notice: |
        A requirement (`lab-tier` must be `demo` or `staging`) and a preference (a node with `disktype=ssd`,
        weight 50). The node now has `lab-tier=demo`, and no node has a `disktype` label at all.
    - kind: show
      id: affine-runs
      run: "oc apply -f pod-affine.yaml && oc wait pod/affine --for=condition=Ready --timeout=120s"
      notice: |
        Created and Ready. The requirement matched, and the preference that no node satisfies did not stop the
        pod: preferred terms only change scores, and with one feasible node there is nothing to score.
    - kind: teach
      id: taints
      body: |
        A **taint** on a node repels pods. A matching **toleration** lets a pod pass that obstacle.
        `NoSchedule` blocks new untolerated pods, `PreferNoSchedule` reduces preference for that node,
        and `NoExecute` also evicts untolerated running pods. A matching NoExecute toleration can limit
        the delay with `tolerationSeconds`.

        A toleration never targets a node. For dedicated nodes, combine a taint to keep others away
        with a selector or required affinity to keep the intended workloads there. The depth table covers
        matching operators and the automatic health taints.
      title: A toleration permits; it does not attract
    - kind: ask
      id: toleration-target
      prompt: A pod tolerates the taint on the GPU nodes but has no selector or affinity. Where may it land?
      choices:
        - text: Only on a node carrying the GPU taint
          why: That would require a selector or required affinity; tolerations remove obstacles.
        - text: Only on general nodes without that taint
          why: A matching toleration lets GPU nodes pass the taint filter too.
        - text: On any otherwise feasible node
          why: The toleration admits GPU nodes as candidates but adds no preference or requirement.
      answer: 2
    - kind: teach
      id: taint-only-node
      title: Tainting the only node, briefly
      body: |
        The administrator now taints the node with a key of the lesson's own, `lab-demo`, and the effect
        `NoSchedule`. On a one-node cluster that is a real change for everyone: pods already running stay, but
        any new pod without a matching toleration, including a platform pod being replaced, waits until the
        taint is gone. So the taint stays on for well under a minute, and `NoExecute` is never used here: it
        would evict the running platform pods that do not tolerate it.
    - kind: try
      id: try-taint-node
      body: "Taint `crc` so that new pods without a matching toleration are not scheduled there: key `lab-demo`, value `true`."
      accept: ["oc adm taint node crc lab-demo=true:NoSchedule", "oc adm taint nodes crc lab-demo=true:NoSchedule", "oc adm taint node/crc lab-demo=true:NoSchedule", "oc adm taint nodes/crc lab-demo=true:NoSchedule"]
      hints:
        - match: "NoExecute"
          say: "NoExecute also evicts running pods that do not tolerate it, and on the only node that includes the platform's. The task is to stop new pods only."
        - match: "PreferNoSchedule"
          say: "PreferNoSchedule is only a preference in scoring. The task is to keep untolerated pods off."
        - match: "lab-demo:NoSchedule"
          say: "The task gives a value too: `key=value:effect`."
        - match: "lab-demo=true$|lab-demo=true "
          say: "A taint needs an effect after a colon: `lab-demo=true:NoSchedule`."
        - match: "^oc taint|^oc label"
          say: "Taints are set with `oc adm taint`, not with a label."
      hint: "`oc adm taint`, the kind `node`, its name, and `key=value:effect`."
      run: "oc adm taint node crc lab-demo=true:NoSchedule"
      then: "`node/crc tainted`. From this moment, new pods without a matching toleration cannot be placed anywhere on this cluster."
    - kind: show
      id: node-tainted
      run: "oc describe node crc | grep -E '^(Taints|Unschedulable):'"
      notice: "`Taints: lab-demo=true:NoSchedule`. The node is still schedulable for pods that tolerate it."
    - kind: show
      id: plain-pending
      body: "developer creates `plain`, a pod with the same container as before and no placement rule at all:"
      run: "oc apply -f pod-plain.yaml && oc wait pod/plain --for=condition=PodScheduled=false --timeout=60s"
      notice: "Created, and not scheduled."
    - kind: show
      id: plain-event
      run: "oc get events --field-selector reason=FailedScheduling,involvedObject.name=plain"
      notice: |
        This time the reason is `1 node(s) had untolerated taint(s)`. It does not say which taint: developer cannot
        tell from the event, and the administrator compares it with the node's taints. A pod with no rules of its
        own can still be refused: the obstacle is on the node.
    - kind: show
      id: running-stay
      body: "And the two pods that were already running?"
      run: "oc get pods -o wide"
      notice: |
        `tier` and `affine` are still Running on `crc`: `NoSchedule` acts only when a pod is placed. `plain` is
        Pending with NODE `<none>`.
    - kind: show
      id: tolerant-manifest
      code: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: tolerant
        spec:
          tolerations:
          - key: lab-demo
            operator: Equal
            value: "true"
            effect: NoSchedule
          containers:
          - name: app
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            imagePullPolicy: IfNotPresent
            command: ["sleep", "infinity"]
            resources:
              requests: {cpu: 5m, memory: 8Mi}
              limits: {memory: 32Mi}
      caption: pod-tolerant.yaml, created by developer in the next step
      notice: "The toleration repeats the taint's key, value and effect. The value is quoted: a toleration's value is a string, and an unquoted `true` would be read as a boolean, which the API refuses for this field."
    - kind: show
      id: tolerant-runs
      run: "oc apply -f pod-tolerant.yaml && oc wait pod/tolerant --for=condition=Ready --timeout=120s"
      notice: "Created and Ready, on the tainted node: the toleration removed the obstacle for this pod only."
    - kind: ask
      id: guess-untaint
      guess: true
      prompt: The administrator removes the taint. What happens to `plain`, which is still Pending?
      choices:
        - text: It is scheduled, without anyone touching it
          why: Removing a taint sends waiting pods back to the scheduler, as the label did earlier.
        - text: It needs a toleration added before it can run
          why: The toleration was only needed while the taint existed.
        - text: It stays Pending until its next restart
          why: A pod that never started has nothing to restart. The scheduler tries again on its own.
      answer: 0
    - kind: show
      id: untaint
      body: "A key followed by a minus removes the taint (every effect with that key):"
      run: "oc adm taint node crc lab-demo-"
      notice: "`node/crc untainted`. The node repels nothing again."
    - kind: show
      id: plain-events
      body: "developer waits for `plain`, then reads its events, which `oc describe` lists at the end:"
      run: "oc wait pod/plain --for=condition=Ready --timeout=120s && oc describe pod plain | sed -n '/^Events:/,$p'"
      notice: |
        The pod's own history: a `FailedScheduling` warning naming the taint, then `Scheduled` (`Successfully
        assigned … to crc`) once the taint was gone, and the kubelet starting the container.
    - kind: show
      id: tolerant-describe
      body: "The tolerations of `tolerant`, as the API stored them:"
      run: "oc describe pod tolerant | grep -A4 '^Tolerations:'"
      notice: |
        First the pod's own toleration, `lab-demo=true:NoSchedule`. Then three that developer did not write, added
        by the API server when the pod was created: `memory-pressure`, and `not-ready` and `unreachable` for 300
        seconds, which let a pod stay five minutes on a node that stops responding before it is evicted.
    - kind: try
      id: try-untaint
      body: "Write the command that removes the taint with the key `lab-demo` from `crc`."
      accept: ["oc adm taint node crc lab-demo-", "oc adm taint nodes crc lab-demo-", "oc adm taint node/crc lab-demo-", "oc adm taint nodes/crc lab-demo-", "oc adm taint node crc lab-demo:NoSchedule-", "oc adm taint nodes crc lab-demo:NoSchedule-"]
      hints:
        - match: "lab-demo$|lab-demo:NoSchedule$"
          say: "That names a taint without saying what to do with it. A minus at the end removes it: `lab-demo-`."
        - match: "^oc label"
          say: "A taint is not a label: remove it with `oc adm taint`."
        - match: "--overwrite"
          say: "`--overwrite` replaces a taint's value. Removing it takes a minus after the key."
      hint: "`oc adm taint node crc`, then the key followed by `-`."
      run: "oc adm taint node crc lab-demo-"
      then: "`node/crc untainted`. A key with a minus removes every taint with that key; `lab-demo:NoSchedule-` removes only the one with that effect."
    - kind: show
      id: unlabel
      body: "The administrator removes the label too. A key followed by a minus removes a label as well:"
      run: "oc label node crc lab-tier-"
      notice: "`node/crc unlabeled`."
    - kind: show
      id: tier-stays
      body: "`tier` required that label. Is it still running?"
      run: "oc get pod tier -o wide"
      notice: |
        Still Running on `crc`. This is the `IgnoredDuringExecution` part of the rule: a selector is checked when
        the pod is placed, not afterwards. A replacement pod would stay Pending.
    - kind: show
      id: node-back
      body: "The administrator checks that the node is back to where it started:"
      run: "oc get node crc -L lab-tier && oc describe node crc | grep '^Taints:'"
      notice: "An empty LAB-TIER column and `Taints: <none>`. The recording's rollback compared the node's full label set and spec with copies taken before the lesson as well."
    - kind: teach
      id: spread
      body: |
        **Pod affinity** seeks co-location with matching pods; **anti-affinity** seeks separation. A
        **topology key** names the node label that defines the domain: hostname for nodes, zone for zones.
        Required anti-affinity across hostnames allows only one matching replica per node.

        **Topology spread** instead limits imbalance in the count of matching pods across eligible domains.
        With `DoNotSchedule`, exceeding `maxSkew` is a filter failure; with `ScheduleAnyway`, balance is a
        scoring preference. Label the domains consistently: hard zone spreading cannot place a pod on
        a node that lacks the zone label.
      title: Place replicas relative to other pods
    - kind: show
      id: spread-example
      code: |
        # Pod spec excerpt, for pods labelled app=web
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: web}
      origin: example
      caption: 'Kubernetes: Pod topology spread constraints; adapted Pod spec example.'
      notice: This permits a difference of at most one relative to the eligible-domain minimum when placing the
        next matching pod. minDomains and domain eligibility can change the calculation.
    - kind: ask
      id: one-node-antiaffinity
      prompt: Two replicas require anti-affinity against their own app label across hostnames. Only one node exists.
        What happens?
      choices:
        - text: One runs; the second stays Pending
          why: The first has no matching neighbour. The second would violate the required separation.
        - text: Both run because there is only one node
          why: A hard requirement is not relaxed for small clusters.
        - text: Neither runs because both already conflict
          why: Scheduling considers already placed pods; the first has nothing matching to avoid.
      answer: 0
    - kind: show
      id: two-rules
      code: |
        # apart.yaml (Deployment, 2 replicas), pod template excerpt
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: apart}}
              topologyKey: kubernetes.io/hostname
        ---
        # spread.yaml (Deployment, 3 replicas), pod template excerpt
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: spread}}
      caption: Excerpts of apart.yaml and spread.yaml, applied by developer in the next step
      notice: Both rules use the hostname as the domain, so each node is its own domain, and this cluster has exactly one.
    - kind: show
      id: two-rules-run
      run: "oc apply -f apart.yaml -f spread.yaml && oc rollout status deploy/spread --timeout=120s"
      notice: "Both Deployments are created, and `spread` rolls out completely: three replicas on one node."
    - kind: show
      id: two-rules-pods
      run: "oc get pods -l 'app in (apart,spread)' -o wide"
      notice: |
        `apart`: one replica Running, one Pending, as the question predicted. `spread`: three replicas Running on
        `crc`. With a single domain, every new pod finds that domain at the minimum count, so the skew never
        exceeds 1 and the constraint never blocks. What spreading does across several nodes or zones cannot be
        seen here.
    - kind: teach
      id: evidence
      body: |
        A filtered pod has no assigned node and can report `PodScheduled=False` with `FailedScheduling`
        events. Read each rejection reason with its node count; reasons can overlap, so counts need not
        form disjoint groups. Then compare the pod's requirements with actual node labels, taints and
        requested resources.

        If a Deployment has no pod at all, inspect the owning ReplicaSet for `FailedCreate`: admission
        may have refused it before scheduling. A scheduling gate deliberately delays a pod. These need
        different fixes from a resource-fit failure.
      title: Read the refusal before changing policy
    - kind: show
      id: all-refusals
      body: "Every scheduling refusal of this lesson, from developer's project, one line per event:"
      run: "oc get events --field-selector reason=FailedScheduling -o custom-columns=POD:.involvedObject.name,MESSAGE:.message"
      notice: |
        Three rules, three signatures: `didn't match Pod's node affinity/selector` (the label `tier` needed),
        `had untolerated taint(s)` (the taint `plain` met) and `didn't match pod anti-affinity rules` (the second
        `apart` replica, whose preemption part reads `No preemption victims found`). The reason tells you where to
        look: node labels, node taints, or other pods.
    - kind: ask
      id: read-refusal
      prompt: A pod with a hard zone spread constraint (`DoNotSchedule`) stays Pending with this event. What do you
        check on the node first?
      evidence: |
        LAST SEEN   TYPE      REASON             OBJECT                        MESSAGE
        3s          Warning   FailedScheduling   pod/zoned-6c9f9588f8-59vrm    0/1 nodes are available: 1 node(s) didn't match pod topology spread constraints (missing required label). no new claims to deallocate, preemption: 0/1 nodes are available: 1 Preemption is not helpful for scheduling.
        # Recorded in the placement-rules lab (lab.placement-rules).
      choices:
        - text: Whether it carries the zone label
          why: The reason says `missing required label`. A hard spread constraint needs the topology key
            label on every node it considers, and this node has none.
        - text: Whether it has CPU left
          why: A CPU refusal reads `Insufficient cpu`. This message names the spread constraint instead.
        - text: Whether a taint needs a toleration
          why: A taint refusal reads `had untolerated taint(s)`. This message does not mention taints.
      answer: 0
    - kind: try
      id: events-task
      body: In the hypothetical project billing, list events filtered to reason FailedScheduling. Use an explicit
        namespace; no command runs.
      accept: [oc get events -n billing --field-selector reason=FailedScheduling, oc get events --namespace billing
          --field-selector reason=FailedScheduling, oc get events --field-selector reason=FailedScheduling -n billing,
        oc get events --field-selector=reason=FailedScheduling -n billing, oc -n billing get events --field-selector
          reason=FailedScheduling, oc get events -n billing --field-selector=reason=FailedScheduling, oc get events
          --namespace=billing --field-selector=reason=FailedScheduling, oc get -n billing events --field-selector
          reason=FailedScheduling, oc get event -n billing --field-selector reason=FailedScheduling, oc get event
          --field-selector reason=FailedScheduling -n billing, oc -n billing get event --field-selector reason=FailedScheduling,
        oc get -n billing event --field-selector reason=FailedScheduling, oc get ev -n billing --field-selector
          reason=FailedScheduling, oc get ev --field-selector reason=FailedScheduling -n billing, oc -n billing
          get ev --field-selector reason=FailedScheduling, oc get -n billing ev --field-selector reason=FailedScheduling,
