id: lab.config-secrets
title: "Inject configuration"
subtitle: "ConfigMaps and Secrets as environment and as files"
summary: "Inject configuration as environment variables and as mounted files, then change it and observe which one follows."
module: a4-config-storage
mode: REAL_LAB
minutes: 35
level: 1
supports: "Recorded on OpenShift 4.21.8. ConfigMap volume updates are propagated by the kubelet's periodic sync (typically within a minute or two); environment variables never change in a running container."
concepts: [k8s.pod-lifecycle, sec.secrets]
prerequisites: [o1.config-secrets]
namespace: academy-config
objective: |
  Decouple configuration from images, know the difference between environment variables and mounted files, and
  see for yourself why a config change sometimes needs a rollout.
background: |
  A **ConfigMap** holds non-secret key/value data; a **Secret** holds sensitive data (base64-encoded, protected by
  RBAC and optionally encrypted at rest). Both can be consumed as **environment variables** (read once at
  container start) or as **files** in a volume (updated in place by the kubelet when the object changes, except
  with `subPath` mounts). The `settings` Deployment starts with no configuration at all.

  **Where everything comes from.** The app creates the project `academy-config` and applies the Deployment `settings`,
  which runs `sleep` in the small UBI 9 image `registry.access.redhat.com/ubi9/ubi-minimal` (no login needed) so that
  you can read its environment and files. You create the ConfigMap and the Secret yourself in step 1; the password is
  a made-up practice value. Clean up deletes the project.
commands:
  - {cmd: "oc create configmap app-config --from-literal=LOG_LEVEL=info -n academy-config", meaning: "a ConfigMap from literals"}
  - {cmd: "oc set env deploy/settings --from=configmap/app-config -n academy-config", meaning: "every key becomes an environment variable"}
setup:
  - |
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: settings, labels: {app: settings}}
    spec:
      replicas: 1
      selector: {matchLabels: {app: settings}}
      template:
        metadata: {labels: {app: settings}}
        spec:
          terminationGracePeriodSeconds: 2
          containers:
          - name: app
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            command: ["sleep", "infinity"]
            resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
steps:
  - id: create
    title: "Create a ConfigMap and a Secret"
    do: "Create both, then look at how the Secret is stored."
    commands:
      - {cmd: "oc create configmap app-config --from-literal=LOG_LEVEL=info --from-literal=FEATURE_X=on -n academy-config", meaning: "two keys"}
      - {cmd: "oc create secret generic app-secret --from-literal=DB_PASSWORD=lab-only-password -n academy-config", meaning: "a generic (Opaque) Secret"}
      - {cmd: "oc get secret app-secret -n academy-config -o jsonpath='{.data.DB_PASSWORD}'", meaning: "base64, not encryption"}
      - {cmd: "oc extract secret/app-secret --to=- -n academy-config", meaning: "decoded values (anyone with get secrets can do this)"}
    predict:
      prompt: "Is the Secret's value encrypted in the API response?"
      choices: ["Yes, AES", "No, only base64-encoded; access is controlled by RBAC", "It cannot be read back at all"]
      answer: 1
      explain: "Base64 is an encoding. Protection comes from RBAC on `get secrets` and, at rest, from etcd encryption (optional on OpenShift; an administrator turns it on)."
      feedback:
        - "No: anyone allowed to `get` the Secret receives the value, only base64-encoded. Encryption at rest (when enabled) protects etcd storage, not the API response."
        - "Right: base64 makes binary data safe to put in JSON or YAML; anyone who can read the Secret can decode it. RBAC decides who can read it."
        - "No: Secrets are meant to be read back by pods and by authorised users; `oc extract` decodes them in one command."
    observe: "`bGFiLW9ubHktcGFzc3dvcmQ=`, then the decoded `lab-only-password` (oc extract prints a `# DB_PASSWORD` header per key on stderr)."
  - id: env
    title: "Consume them as environment variables"
    do: "Inject every key of both objects as environment variables."
    commands:
      - {cmd: "oc set env deploy/settings --from=configmap/app-config -n academy-config", meaning: "LOG_LEVEL, FEATURE_X"}
      - {cmd: "oc set env deploy/settings --from=secret/app-secret -n academy-config", meaning: "DB_PASSWORD"}
      - {cmd: "oc rollout status deploy/settings -n academy-config --timeout=180s", meaning: "each `set env` changed the template and started a rollout; wait for the latest", timeout: 200}
      - {cmd: "oc exec deploy/settings -n academy-config -- printenv LOG_LEVEL", meaning: "info"}
    observe: "Each `oc set env` prints `deployment.apps/settings updated`; after the rollout the new pod prints `info`."
    why: "`--from` copies the keys into the pod template as `valueFrom` references, so the template changes and the Deployment rolls out new pods. The values themselves are read when the container starts."
    wait_for: [env-info]
  - id: files
    title: "Consume the ConfigMap as files"
    do: "Mount the same ConfigMap as a directory."
    commands:
      - {cmd: "oc set volume deploy/settings --add --name=cfg --type=configmap --configmap-name=app-config --mount-path=/etc/app -n academy-config", meaning: "one file per key"}
      - {cmd: "oc rollout status deploy/settings -n academy-config --timeout=180s", meaning: "new pod with the volume", timeout: 200}
      - {cmd: "oc exec deploy/settings -n academy-config -- ls /etc/app", meaning: "FEATURE_X LOG_LEVEL"}
      - {cmd: "oc exec deploy/settings -n academy-config -- cat /etc/app/LOG_LEVEL", meaning: "info"}
    wait_for: [file-info]
  - id: change
    title: "Change the ConfigMap and compare"
    do: "Set LOG_LEVEL to debug, then read the variable and the file again (the file may take a minute)."
    commands:
      - {cmd: "oc patch configmap app-config -n academy-config -p '{\"data\":{\"LOG_LEVEL\":\"debug\"}}'", meaning: "change the data"}
      - {cmd: "oc exec deploy/settings -n academy-config -- printenv LOG_LEVEL", meaning: "the environment variable"}
    predict:
      prompt: "After the patch, without any rollout, what do the variable and the file show (eventually)?"
      choices: ["Both debug", "Variable info, file debug", "Both info"]
      answer: 1
      explain: "Environment variables are copied at container start and never change; the kubelet refreshes ConfigMap volume files in place."
      feedback:
        - "No: the environment of a running process cannot be changed from outside. The variable only changes when a new container starts."
        - "Right: the variable was copied when the container started and stays `info`; the mounted file is refreshed by the kubelet and becomes `debug` after its next sync."
        - "No: a ConfigMap mounted as a volume (without subPath) is updated in place, usually within a minute or two. Only the environment variable stays old."
    wait_for: [file-debug]
    observe: "The variable still says `info`; the file says `debug` after the kubelet's next sync."
  - id: compare
    title: "Read both again"
    do: "Confirm the difference, then roll out to refresh the environment."
    commands:
      - {cmd: "oc exec deploy/settings -n academy-config -- cat /etc/app/LOG_LEVEL", meaning: "debug"}
      - {cmd: "oc exec deploy/settings -n academy-config -- printenv LOG_LEVEL", meaning: "still info"}
      - {cmd: "oc rollout restart deploy/settings -n academy-config", meaning: "new pods read the new value"}
      - {cmd: "oc rollout status deploy/settings -n academy-config --timeout=180s", meaning: "wait", timeout: 200}
      - {cmd: "oc exec deploy/settings -n academy-config -- printenv LOG_LEVEL", meaning: "debug now"}
    checks: [env-debug]
    wait_for: [env-debug]
hints: []
checks:
  - {id: env-info, title: "LOG_LEVEL=info in the environment", type: exec, from: app=settings, command: ["printenv", "LOG_LEVEL"], expect_output: "^info$", final: false, expect_text: "info"}
  - {id: file-info, title: "/etc/app/LOG_LEVEL is info", type: exec, from: app=settings, command: ["cat", "/etc/app/LOG_LEVEL"], expect_output: "^info$", final: false, expect_text: "info"}
  - {id: file-debug, title: "The mounted file followed the change", type: exec, from: app=settings, command: ["cat", "/etc/app/LOG_LEVEL"], expect_output: "^debug$", expect_text: "debug"}
  - {id: env-debug, title: "After a restart, the environment says debug", type: exec, from: app=settings, command: ["printenv", "LOG_LEVEL"], expect_output: "^debug$", expect_text: "debug"}
  - {id: secret, title: "Secret app-secret exists", type: exists, kind: secret, name: app-secret, expect_text: "exists"}
variations:
  - "Mount one key with `subPath` and change the ConfigMap: subPath mounts are never updated."
  - "Make the ConfigMap immutable (`immutable: true`): further changes are refused, and the kubelet stops watching it."
questions:
  - q: "Why might an application not notice a ConfigMap change even when mounted as files?"
    a: "It reads the file only at start, or the mount uses subPath. The app must re-read the file, or you roll out a restart."
  - q: "Where should truly sensitive values come from in production?"
    a: "An external secret store (Vault, cloud KMS) synced into Secrets, with etcd encryption and tight RBAC; never Git in clear text."
enterprise: |
  Pick one pattern per team: environment variables plus `oc rollout restart` on change (simple, explicit), or files
  plus apps that reload them. Restart automation exists too: a controller that watches ConfigMaps and restarts
  their consumers, or a hash of the configuration in the pod template (Kustomize generated names, a Helm checksum
  annotation) so that any change to it triggers a rollout through Git.
references:
  - {title: "Kubernetes: ConfigMaps", url: "https://kubernetes.io/docs/concepts/configuration/configmap/"}
  - {title: "Kubernetes: Secrets", url: "https://kubernetes.io/docs/concepts/configuration/secret/"}
  - {title: "Kubernetes: Configure a Pod to use a ConfigMap", url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/"}
  - {title: "OpenShift 4.21: Encrypting etcd data", url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/etcd/etcd-encrypt"}
