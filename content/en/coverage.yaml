# Coverage map: every topic the course intends to cover, and the material that covers it. This file is a planning
# record, not navigation. scripts/coverage.py computes each topic's status from the material itself (lessons,
# checks, labs, recordings, graders), so a topic listed here with no material shows as missing.
# The topic list follows the course's six territories. It was drawn up from the Linux, Podman, Kubernetes and
# OpenShift 4.21 documentation and from publicly listed skills of platform administrators. It is a planning aid only:
# the course is independent and reproduces no vendor course. Every lesson, lab, incident and challenge appears at least
# once: scripts/coverage.py --check fails on unknown ids and on any lesson or activity left out.
- track: Linux
  topics:
    - {id: lx-shell, title: "The shell: commands, files, expansion, redirection, exit status, text tools and editing", items: [lx.first-steps, lx.shell-basics, lx.files-text, lx.shell-expansion, lx.redirection, lx.exit-status, lx.text-tools, lx.find-links, lx.editing], limit: "Recorded on a Linux workstation as an ordinary user. Nothing is graded: you repeat the commands on your own machine and compare with the recording (the vi lesson, lx.editing, is practised in your own terminal; nothing is recorded)."}
    - {id: lx-users-ssh, title: "Users, groups, file permissions and remote access with SSH", items: [lx.users-permissions, lx.ssh-security], limit: "Recorded on a workstation or a disposable virtual machine; not graded."}
    - {id: lx-system, title: "Processes and signals, services and the journal, networking, disks and filesystems", items: [lx.processes-signals, lx.systemd-journal, lx.networking, lx.storage-filesystems], limit: "Recorded on a workstation or a disposable virtual machine; operations that need root and spare disks (partitions, logical volumes) are explained, not run."}
    - {id: lx-admin, title: "Shell scripts, packages and archives, user accounts, sudo and scheduled jobs", items: [lx.shell-scripts, lx.packages-archives, lx.users-scheduling], limit: "Recorded: scripts, package queries, archives, account reads, sudo rule checks and user timers (a workstation and a disposable virtual machine). Creating accounts and installing packages are documentation examples, not recorded; nothing is graded."}
- track: Containers
  topics:
    - {id: containers, title: "A container is a Linux process: namespaces, cgroups and the shared kernel", items: [a.container-is-a-process, lab.container-anatomy], limit: "The lesson is recorded with Podman on a workstation; the lab reads the same facts inside a pod and needs a cluster."}
    - {id: ct-podman, title: "Running, building and securing containers with Podman; diagnosing a container that will not start", items: [ct.podman-run, ct.build-images, a.container-security, ct.troubleshoot-containers], limit: "Recorded with Podman 5.8 as an ordinary user. Not graded: the app cannot check work done on your own machine."}
    - {id: ct-stacks, title: "Multi-container applications, container state, and moving images without a registry", items: [ct.podman-stack, ct.image-archives], limit: "Recorded with Podman on a workstation; not graded. Compose and pushing to a private registry are explained, not run."}
    - {id: ct-images, title: "Image names, tags and digests; registries, indexes and exact copies with Skopeo", items: [a.images-registries, ct.registries-skopeo], limit: "Recorded against public registries from a workstation; not graded."}
- track: Kubernetes
  topics:
    - {id: linux, title: "The Linux facts behind cluster failures: exit statuses, file ownership by number, pipelines, connection failures", items: [f0.linux-essentials]}
    - {id: objects-api, title: "YAML/JSON, resource identity, API discovery, namespaces, labels, selectors, ownership", items: [a.what-kubernetes-does, f0.objects-api, b.reconciliation, b.workloads, lab.deployment-reconciliation, inc.service-selector-503]}
    - {id: architecture, title: "API server, etcd, controllers, scheduler, kubelet, runtime", items: [b.architecture, lab.deployment-reconciliation]}
    - {id: openshift-additions, title: "What OpenShift adds: oc, projects, Routes, operators and the cluster version", items: [k.kubectl-to-oc, b.crds-operators, c.openshift-extends, lab.cluster-health], limit: "The cluster version and the cluster operators are read by a cluster administrator; the health lab needs a cluster-reader identity and has no grader.", gap: "lab.cluster-health has no grader (commands recorded only)."}
- track: Application operations
  topics:
    - {id: cli-console, title: "Console and CLI, contexts, API/resource inspection", items: [n.console-clis, n.console-tour, o1.cli, lab.cli-tour], limit: "The web console is shown with real screenshots of the course cluster (sign-in, menus, projects, search, the Help menu's oc downloads); console steps are read, not graded."}
    - {id: manifest-to-app, title: "From an image or a template to a running, reachable application", items: [o1.deploy-apps, n.templates, lab.deploy-apps, lab.templates, ch.ship-web-app]}
    - {id: pods-troubleshooting, title: "Pods, failing deployments, troubleshooting and collecting evidence", items: [b.pod-lifecycle, o1.troubleshooting, o1.console-apps, o3.support-data, lab.troubleshooting-tools, inc.crashloop-config, inc.imagepull, ch.recover-and-scale], limit: "Collecting a project snapshot (oc adm inspect) is recorded; a cluster-wide support archive needs a cluster administrator and is explained, not run."}
    - {id: workload-kinds, title: "Deployments, ReplicaSets, StatefulSets, Jobs, CronJobs, init containers and sidecars", items: [b.workloads, f0.statefulsets, o3.init-sidecars, lab.deployment-reconciliation, lab.statefulset-identity, lab.jobs-cronjobs], limit: "StatefulSet claim templates are recorded with an administrator reclaiming the volumes; init containers and sidecars are recorded, with no lab of their own."}
    - {id: networking, title: "Services, selectors, EndpointSlices, DNS, Routes, Ingress and the Gateway API", items: [d.services-dns, d.routes-tls, o3.ingress-gateway, lab.request-path, inc.service-selector-503, inc.wrong-targetport, inc.dns-typo, ch.ship-web-app], limit: "Ingress to Route conversion is recorded; the Gateway API is read but not enabled (it installs a service mesh this single node has no room for)."}
    - {id: config, title: "ConfigMaps, Secrets, injection and rollout implications", items: [o1.config-secrets, lab.config-secrets, inc.configmap-missing, inc.crashloop-config, ch.ship-web-app, ch.config-out-of-spec]}
    - {id: storage, title: "PVs, PVCs, StorageClasses, access modes, binding, StatefulSet storage", items: [e.storage, f0.statefulsets, lab.storage, inc.pvc-pending], limit: "Released volumes are reclaimed by an administrator in the recording; volume expansion and snapshots depend on the storage driver and are explained."}
    - {id: reliability, title: "Probes, replicas, requests/limits, QoS, autoscaling prerequisites", items: [b.pod-lifecycle, b.health-probes, b.resources-qos, lab.probes-endpoints, lab.container-anatomy, inc.readiness-503, inc.liveness-restarts, inc.oomkilled, inc.pending-resources, ch.recover-and-scale, ch.slow-start, ch.right-size], limit: "An autoscaler is created and read, but it never scales: the course cluster runs without the metrics API."}
    - {id: images-rollouts, title: "Images on the platform and on nodes, builds, ImageStreams, rollouts, rollbacks, blue/green and canary", items: [ct.openshift-images, c.projects-builds, ct.images-on-nodes, g.rollouts-change, o3.release-strategies, lab.images-builds, inc.broken-rollout, inc.imagepull], limit: "Blue/green and canary releases are recorded, with no lab of their own; the node's image store is read by an administrator."}
    - {id: app-challenges, title: "Original cumulative deployment, repair and scaling challenges", items: [ch.ship-web-app, ch.recover-and-scale, ch.right-size, ch.slow-start, ch.config-out-of-spec, ch.production-ready]}
- track: Platform administration
  topics:
    - {id: health, title: "Cluster health: release, operators, nodes, events and platform logs", items: [n.cluster-admin-health, n.console-admin, c.openshift-extends, lab.cluster-health], limit: "Recorded as the cluster administrator; the lab is read-only, needs a cluster-reader identity and has no grader. Alerts are explained: monitoring is off on the course cluster.", gap: "lab.cluster-health has no grader (commands recorded only)."}
    - {id: identity, title: "Authentication, HTPasswd, users/groups, RBAC, effective permissions", items: [c.auth, n.htpasswd-idp, n.htpasswd-users, o2.groups, f.rbac, lab.rbac, lab.groups, inc.rbac-denied, ch.deploy-bot-access, ch.bounded-cleanup], limit: "Adding an HTPasswd identity provider, logging in, changing a password and removing a user were recorded by a cluster administrator of a disposable cluster, then rolled back and verified. Graded practice covers RBAC and groups, not the identity provider."}
    - {id: access-analysis, title: "Access analysis: effective permissions as paths, stale grants, image pulls across projects", items: [l.access-paths, l.access-can-come-back, l.image-pullers, lab.access-paths, lab.access-can-come-back, lab.image-pullers]}
    - {id: workload-security, title: "SCCs, security contexts, ServiceAccounts, API access, SELinux and the node", items: [o2.service-accounts, f.scc, n.privileged-workloads, n.selinux-node, a.container-security, lab.sa-scc, inc.scc-root, ch.deploy-bot-access], limit: "Granting SCCs and reading the node were recorded by a cluster administrator and rolled back; the lab includes one administrator step."}
    - {id: tls-netpol, title: "NetworkPolicies, internal and external TLS, ingress sharding, ingress DNS and certificates", items: [d.networkpolicy-ovn, o2.tls-exposure, n.ingress-sharding, n.ingress-dns-certs, d.routes-tls, lab.tls-exposure, lab.networkpolicy, inc.networkpolicy-block, ch.protect-traffic, ch.production-ready], limit: "Recorded on OpenShift Local: network policies including an AdminNetworkPolicy, edge, re-encrypt and passthrough Routes, an ingress shard added and removed. A custom default ingress certificate and DNS forwarding are validated with server-side dry runs only."}
    - {id: non-http, title: "Exposing plain TCP services: NodePort, LoadBalancer prerequisites, Multus", items: [n.loadbalancer-services, o2.tls-exposure, lab.tls-exposure], limit: "NodePort exposure is recorded and graded; a LoadBalancer Service is requested and stays pending (no implementation on this cluster); MetalLB and Multus are explained."}
    - {id: governance, title: "Quotas, cluster quotas, LimitRanges, project templates, self-provisioning", items: [o2.quotas-limits, n.project-templates, n.cluster-quotas, b.resources-qos, lab.quotas-limits], limit: "Setting quotas, LimitRanges, a project request template and a cluster quota was recorded by a cluster administrator and rolled back. The learner practises inside a quota set by an elevated setup step; writing these objects is not graded practice."}
    - {id: declarative, title: "Manifests, declarative updates, drift, Kustomize and overlays", items: [gx.declarative, o2.kustomize-helm, lab.kustomize-helm, inc.gitops-drift]}
    - {id: packaging, title: "Packaged applications: Helm charts and OpenShift templates, installing and upgrading", items: [n.templates, o2.kustomize-helm, lab.kustomize-helm, lab.templates, ch.helm-release]}
    - {id: operators, title: "Operators, OLM, installation, permissions, subscriptions, upgrades", items: [c.olm, n.operators-lifecycle, b.crds-operators, lab.olm-inspect], limit: "Catalogs, packages and installed operators are read; no operator is installed, updated or removed (cluster-admin and catalog pulls, heavy for a small machine).", gap: "lab.olm-inspect has no grader (commands recorded only)."}
    - {id: admin-jobs, title: "Maintenance jobs and CronJobs that run with only the permissions they need", items: [o2.jobs-cronjobs, lab.jobs-cronjobs, ch.bounded-cleanup]}
    - {id: updates, title: "Machine configuration, cluster updates, version-dependent APIs, operator updates", items: [c.machineconfig-upgrades, n.cluster-updates, n.operators-lifecycle, lab.cluster-health], limit: "Pools, MachineConfigs and update status are read by an administrator; no update or MachineConfig change runs (it would restart the only node).", gap: "lab.cluster-health has no grader (commands recorded only)."}
    - {id: admin-challenges, title: "Original cumulative self-service, application security and packaged deployment challenges", items: [ch.deploy-bot-access, ch.protect-traffic, ch.bounded-cleanup, ch.helm-release, ch.production-ready], limit: "A self-service (quota/LimitRange) challenge needs cluster-admin for its setup, which the learner identity does not have."}
- track: Enterprise platform engineering
  topics:
    - {id: ent-install, title: "Installation methods and topologies", items: [n.installation], limit: "Explained, with the course cluster's own installation settings read by an administrator."}
    - {id: ent-scheduling, title: "Scheduling, capacity, cluster partitioning, project tolerations and disruption budgets", items: [b.scheduler, n.nodes-capacity, p.cluster-partitioning, p.project-tolerations-pdb, lab.scheduling, lab.placement-rules, inc.pending-resources], limit: "Labels, taints, a cordon, project node selectors, default tolerations and a budget refusing then allowing an eviction were recorded on the single node and rolled back; spreading, taint-based eviction and drains need several nodes."}
    - {id: ent-identity, title: "Corporate identity: LDAP and OIDC, group synchronisation, kubeconfig credentials", items: [p.ldap-oidc, p.ldap-group-sync, p.kubeconfig-credentials], limit: "Group synchronisation against a test directory and token and certificate kubeconfigs were recorded (administrator steps rolled back). Logging in through an LDAP or OIDC identity provider is explained, not run."}
    - {id: ent-gitops-obs, title: "GitOps with Argo CD, monitoring and alerts, logging and the Event Router", items: [gx.argocd, gx.argocd-ops, gx.openshift-gitops, h.observability, n.monitoring, n.logging, p.event-router, h.slo-incidents], limit: "gx.argocd-ops and gx.openshift-gitops record their Git, kubectl, Kustomize and Helm steps; gx.argocd is a reading with an Argo CD simulator, with nothing recorded; Argo CD itself is not installed. The Event Router is recorded; monitoring is disabled on the course cluster (OpenShift Local's default) and log collection is not installed: reading only."}
    - {id: ent-delivery, title: "Infrastructure as code, pipelines and builds, image signing and supply chain", items: [g.iac, n.cicd, n.supply-chain, f.secrets-supplychain], limit: "Readings with checks: pipelines, signing and policy controllers are not installed on the course cluster."}
    - {id: ent-backup, title: "Moving and protecting applications: export and import, OADP backup and restore, etcd backup", items: [p.export-import, e.stateful-dr, i.day2-backup, i.ha-architecture], limit: "Exporting an application and copying its image to another project are recorded; OADP needs an operator install, object storage and cluster-admin: reading only."}
    - {id: ent-governance, title: "Policy as code, many clusters and running a platform team", items: [n.policy-governance, i.multicluster, i.platform-team], limit: "An admission policy in report and deny modes was recorded by an administrator and removed; fleet management is explained."}
