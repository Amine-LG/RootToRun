name: main-alert
# A failing main must not go unnoticed while more pull requests merge. Each time a ci-main run (checks-main.yml)
# completes, this reads the CURRENT state, not the event: the latest completed ci-main run (its latest attempt) for the
# commit main points to now. If that run failed, was cancelled or timed out, it opens one issue, "main is failing",
# assigned to the owner (or comments on it when this event is that run); if that run passed, it closes the issue. An
# older run, another commit's run or a run finishing out of order cannot hide a newer failure or close the issue
# early. It is an alert, not a merge lock.
#
# workflow_run runs this file from the default branch, never from a pull request. It checks out nothing and runs no
# file of the repository; its only write permission is issues. Every value it uses comes from GitHub.
on:
  workflow_run:
    workflows: [ci-main]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: main-alert
  cancel-in-progress: false

jobs:
  alert:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read   # the runs of ci-main
      contents: read  # the commit main points to now
      issues: write
    steps:
      - name: Open, update or close the "main is failing" issue from main's current state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          [[ "$OWNER" =~ ^[A-Za-z0-9-]+$ && "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]
          title="main is failing"
          open=$(gh issue list -R "$REPO" --state open --author "app/github-actions" --search "\"$title\" in:title" \
                 --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          # the latest completed run for that commit: a re-run's newest attempt has the newest start time
          latest=$(gh api "repos/$REPO/actions/workflows/checks-main.yml/runs?branch=main&head_sha=$head&status=completed&per_page=100" \
                   --jq '.workflow_runs | sort_by(.run_started_at) | last | select(. != null) | "\(.conclusion) \(.html_url)"')
          conclusion=${latest%% *}; url=${latest#* }
          echo "main is at ${head:0:12}; its latest completed ci-main: ${latest:-none}; open issue: ${open:-none}"
          [ -n "$latest" ] || exit 0  # no completed run for the current commit yet: its own completion decides
          [[ "$conclusion" =~ ^[a-z_]+$ && "$url" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]]
          case "$conclusion" in
            success)
              if [ -n "$open" ]; then
                gh issue close -R "$REPO" "$open" --comment "ci-main passed for ${head:0:12}, the commit main points to: $url"
              fi ;;
            failure|cancelled|timed_out|startup_failure|action_required)
              body="ci-main ended with **$conclusion** for $head, the commit main points to: $url"
              if [ -z "$open" ]; then
                gh issue create -R "$REPO" --title "$title" --assignee "$OWNER" --body "$body

          Fix main before merging more pull requests. This issue closes itself when ci-main passes for the commit main
          points to (.github/workflows/main-alert.yml)."
              elif [ "$url" = "$EVENT_RUN_URL" ]; then
                gh issue comment -R "$REPO" "$open" --body "$body"
              fi ;;
            *) echo "nothing to do for $conclusion" ;;
          esac
