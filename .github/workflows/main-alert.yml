name: main-alert
# A failed run of ci-main (checks-main.yml) must not go unnoticed while more pull requests merge. When a run on main
# fails, is cancelled or times out, this opens one issue, "main is failing" (or comments on the open one), assigned to
# the owner, with the commit and the run. It closes the issue only when a run passes for the commit main points to
# now, so an older run that finishes late cannot hide a newer failure. It is an alert, not a merge lock.
#
# workflow_run runs this file from the default branch, never from a pull request. It checks out nothing and runs no
# file of the repository; its only write permission is issues. Every value it uses comes from GitHub's event.
on:
  workflow_run:
    workflows: [ci-main]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: main-alert
  cancel-in-progress: false

jobs:
  alert:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read  # the commit main points to now
      issues: write
    steps:
      - name: Open, update or close the "main is failing" issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$CONCLUSION" =~ ^[a-z_]+$ && "$EVENT" =~ ^[a-z_]+$ && "$OWNER" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$RUN_URL" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]]
          title="main is failing"
          open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number,title \
                 --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "ci-main $CONCLUSION for ${SHA:0:12} ($EVENT); main is at ${head:0:12}; open issue: ${open:-none}"
          case "$CONCLUSION" in
            success)
              if [ -n "$open" ] && [ "$SHA" = "$head" ]; then
                gh issue close -R "$REPO" "$open" --comment "ci-main passed for ${SHA:0:12}, the commit main points to: $RUN_URL"
              fi ;;
            failure|cancelled|timed_out|startup_failure|action_required)
              body="ci-main ended with **$CONCLUSION** for $SHA ($EVENT): $RUN_URL"
              if [ -n "$open" ]; then
                gh issue comment -R "$REPO" "$open" --body "$body"
              else
                gh issue create -R "$REPO" --title "$title" --assignee "$OWNER" --body "$body

          Fix main before merging more pull requests. This issue closes itself when ci-main passes for the commit main
          points to (.github/workflows/main-alert.yml)."
              fi ;;
            *) echo "nothing to do for $CONCLUSION" ;;
          esac
