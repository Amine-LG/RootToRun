name: ci
# The pull-request router (docs/CI.md). It runs no code from the pull request: it reads git's list of changed files and
# lets the classifier of the BASE commit choose a lane, calls that lane, and reports `ci-ok`, the only required check.
#   content lane (checks-content.yml): lessons, labs, recordings, screenshots, Markdown docs: the Python suite, the
#                                       content checks, the site, Windows, and every page in a browser.
#   deep lane    (checks-app.yml):     everything else, including workflows, tests and unknown paths: also the
#                                       production image and the whole browser suite, with a part on Windows.
# Pushes to main, a manual run and a weekly run use ci-main (checks-main.yml): never required on pull requests.
# Whether a pull request may merge without the owner's review is ci-guard.yml's decision (trusted, default branch).
#
# Fork pull requests get a read-only token and no secrets (pull_request, never pull_request_target); nothing here uses
# a secret. Only official actions/* are used, pinned to a commit; no third-party action, app or service.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  # a new push to a pull request cancels the run for its previous commit
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - id: tier
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # The classifier is the base commit's blob, run with isolated Python (-I: no PYTHONPATH, no current directory
        # on sys.path), on git's NUL-separated raw diff without rename detection (both paths and file modes count). Only
        # the exact line "tier=content" selects the content lane; anything else, including a failure, is deep.
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no base/head commit"; exit 1; }
          git show "$BASE:scripts/ci_needs_site.py" > "$RUNNER_TEMP/classifier.py"
          git diff --no-renames --raw -z "$BASE...$HEAD" > "$RUNNER_TEMP/changed"
          verdict=$(python3 -I "$RUNNER_TEMP/classifier.py" --tier-raw < "$RUNNER_TEMP/changed" || true)
          if [ "$verdict" = "tier=content" ]; then tier=content; else tier=deep; fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          count=$(( $(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c) / 2 ))
          echo "Lane: **$tier** ($count changed files, classified by scripts/ci_needs_site.py of the base commit ${BASE:0:12})" >> "$GITHUB_STEP_SUMMARY"

  checks-content:
    needs: classify
    if: needs.classify.outputs.tier == 'content'
    uses: ./.github/workflows/checks-content.yml

  checks-app:
    needs: classify
    if: needs.classify.outputs.tier == 'deep'
    uses: ./.github/workflows/checks-app.yml

  # The only required check. It passes only when the classifier ran and exactly the lane it chose succeeded, the other
  # lane being skipped: a lane cannot pass by being skipped, and a failed, cancelled or missing verdict fails.
  ci-ok:
    needs: [classify, checks-content, checks-app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The lane the base classifier chose succeeded
        env:
          CLASSIFY: ${{ needs.classify.result }}
          TIER: ${{ needs.classify.outputs.tier }}
          CONTENT: ${{ needs.checks-content.result }}
          APP: ${{ needs.checks-app.result }}
        run: |
          echo "classify: $CLASSIFY; lane: $TIER; checks-content: $CONTENT; checks-app: $APP"
          case "$CLASSIFY/$TIER/$CONTENT/$APP" in
            success/content/success/skipped | success/deep/skipped/success) echo "ci-ok" ;;
            *) echo "::error title=ci-ok::the chosen lane did not succeed (see the line above)"; exit 1 ;;
          esac
