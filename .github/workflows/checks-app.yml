name: checks-app
# The deep lane: called by ci.yml for every pull request that is not content-only (code, tests, scripts, workflows,
# dependencies, the image, unknown paths), and by ci-main.yml after every merge. Every job starts at once, except the
# browser shards (they wait for the one frontend build and the one image) and same-site (it compares two exports):
#   python          Linux: content checks and the full Python suite
#   site            vitest, type check, build, static export, public scan, internal links
#   windows         the contributor workflow of docs/WINDOWS.md: Python suite, content checks, build, export, server
#   same-site       the Linux and Windows exports are byte-identical
#   image           the production image, built and smoke-tested once
#   browser         the whole browser suite against that image: Chromium 3 shards + Firefox 3 shards
#   windows-browser a fifth of the browser suite in Firefox on Windows, against the export built on Windows
#   deps            dependency review (pull requests only)
# python, site, windows and same-site are the same jobs as in the content lane (test_ci_workflows.py checks it).
on:
  workflow_call:
permissions:
  contents: read
env:
  ACADEMY_CLUSTER: "off"
  KUBECONFIG: /nonexistent

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/python-env
      # first: a file that does not load makes dozens of tests fail; this names it
      - name: Content loads, teaching rules, stable addresses, coverage references, public scan
        run: scripts/test_content.sh --data-checks
      - name: Unit, API, security and content tests (the whole Python suite)
        run: scripts/test_content.sh --python

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      # the frontend tests read the lessons through the Python environment, so it comes first
      - uses: ./.github/actions/python-env
      - name: Frontend unit tests, type check and build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run build
      # the build the browser jobs serve (built once here, not once per shard)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: frontend-dist, path: frontend/dist, retention-days: 1, if-no-files-found: error}
      - name: Static export, then the same scan on the generated site
        run: .venv/bin/python scripts/export_static.py && .venv/bin/python scripts/public_scan.py frontend/dist
      - name: Internal links and assets exist
        run: .venv/bin/python scripts/check_site.py frontend/dist
      - name: Manifest of the exported site (compared with the one built on Windows)
        run: .venv/bin/python scripts/site_manifest.py frontend/dist site-linux.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: site-linux, path: site-linux.txt, retention-days: 3, if-no-files-found: error}

  # Windows: the contributor workflow of docs/WINDOWS.md, with its own commands (PowerShell, the environment's
  # .venv\Scripts\python.exe): Python and frontend tests, content checks, the static export and its checks, and the
  # local server. Each command is its own step, so a failure names what failed. tests/test_windows_doc.py keeps the
  # guide and these commands the same.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run: {shell: pwsh}
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: ./.github/actions/python-env
        with: {install: "false"}
      - name: Python environment
        run: uv venv .venv --python 3.12 && uv pip install --python .venv\Scripts\python.exe -r requirements-dev.txt
      - name: Course content loads
        run: .venv\Scripts\python.exe scripts\check_content.py
      - name: Unit, API, security, content and portability tests
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: .venv\Scripts\python.exe -m pytest -q tests --ignore=tests/e2e -n ([Math]::Min([Environment]::ProcessorCount, 4))
      - name: Teaching rules
        run: .venv\Scripts\python.exe scripts\teach_lint.py
      - name: Every lesson and lab keeps its public address
        run: .venv\Scripts\python.exe scripts\slugs.py --check
      - name: Coverage references exist
        run: .venv\Scripts\python.exe scripts\coverage.py --check
      - name: No credentials, keys, vendor course codes or certification phrases in the repository
        run: .venv\Scripts\python.exe scripts\public_scan.py
      - name: Frontend unit tests, type check and build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Static export, the scan of the generated site, and its internal links
        run: >-
          .venv\Scripts\python.exe scripts\export_static.py &&
          .venv\Scripts\python.exe scripts\public_scan.py frontend\dist &&
          .venv\Scripts\python.exe scripts\check_site.py frontend\dist
      - name: Manifest of the exported site (compared with the one built on Linux)
        run: .venv\Scripts\python.exe scripts\site_manifest.py frontend\dist site-windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: site-windows, path: site-windows.txt, retention-days: 3, if-no-files-found: error}
      # in Windows PowerShell 5.1 (the one Windows includes), the other steps in PowerShell 7
      - name: The local server answers in practice mode (scripts\serve.py --practice, as in docs/WINDOWS.md)
        shell: powershell
        run: |
          $server = Start-Process -PassThru -NoNewWindow .venv\Scripts\python.exe -ArgumentList 'scripts\serve.py', '--practice'
          try {
            foreach ($i in 1..120) {
              try { $status = Invoke-RestMethod http://127.0.0.1:8768/api/status; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($status.mode -ne 'practice') { throw "no practice-mode server on 127.0.0.1:8768" }
            $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8768/
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') { throw "the site is not served" }
            "serve.py: practice mode; the site and its API answer on 127.0.0.1:8768"
          } finally { Stop-Process -Id $server.Id }

  # The same source must export the same site on Linux and on Windows, byte for byte (paths, line endings, encodings).
  same-site:
    needs: [site, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: site-*, merge-multiple: true}
      - name: The sites exported on Linux and on Windows are identical
        run: |
          echo "$(wc -l < site-linux.txt) files exported on Linux, $(wc -l < site-windows.txt) on Windows"
          diff site-linux.txt site-windows.txt && echo "identical"

  # The production image, built once per run and smoke-tested as deployed; every browser shard tests these bytes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Build the static image
        id: build
        env:
          BUILD_COMMIT: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build -t static-site:ci -f Containerfile \
            --build-arg BUILD_COMMIT="$BUILD_COMMIT" \
            --build-arg SITE_URL=https://example.org \
            --build-arg REPO_URL="$REPO_URL" .
          echo "image-id=$(docker image inspect static-site:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Smoke test the image as it is deployed
        run: scripts/smoke_image.sh static-site:ci 8080
      - run: docker save static-site:ci -o "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: ci-image, path: "${{ runner.temp }}/image.tar", retention-days: 1, if-no-files-found: error}

  # The whole browser suite against the running image (its nginx rules, headers and Content-Security-Policy), in both
  # engines, three parts each (--shard I/N: every test in exactly one part, tests/e2e/conftest.py). Every part runs to
  # the end, so one failure does not hide another. scripts/ci_browser.sh skips apt unless the browser fails to start.
  browser:
    needs: [site, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2, 3]
    name: browser (${{ matrix.browser }} ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: ./.github/actions/python-env
      - name: Frontend packages (axe-core for the accessibility tests)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: frontend-dist, path: frontend/dist}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-image, path: "${{ runner.temp }}/ci-image"}
      - name: Start the image the image job built and smoke-tested
        env:
          TAR: ${{ runner.temp }}/ci-image/image.tar
          BUILT_ID: ${{ needs.image.outputs.image-id }}
        run: |
          docker load -q -i "$TAR"
          [ "$(docker image inspect static-site:ci --format '{{.Id}}')" = "$BUILT_ID" ] || { echo "not the built image" >&2; exit 1; }
          scripts/smoke_image.sh static-site:ci 8080
      - run: scripts/ci_browser.sh "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Browser tests against the running image
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          ACADEMY_E2E_SITE: http://127.0.0.1:8080/
          SHARD: ${{ matrix.shard }}/3
          E2E_ARTIFACTS: e2e-artifacts
        # one browser per CPU, at most four (each needs about 300-500 MB)
        run: |
          workers=$(( $(nproc) < 4 ? $(nproc) : 4 ))
          .venv/bin/python -m pytest -q tests/e2e --shard "$SHARD" -n "$workers" --durations=10
      # a failed browser test leaves its Playwright trace (tests/e2e/conftest.py): python -m playwright show-trace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with: {name: "browser-traces-${{ matrix.browser }}-${{ matrix.shard }}", path: e2e-artifacts, retention-days: 7, if-no-files-found: ignore}

  # A fifth of the browser tests in Firefox on Windows, against the static export built on Windows (Windows paths, the
  # Python static server, Firefox on Windows): before a merge, as before the lanes. A separate job beside windows, so
  # the two run at the same time; ci-main.yml runs the other four fifths after a merge.
  windows-browser:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run: {shell: pwsh}
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: ./.github/actions/python-env
        with: {install: "false"}
      - name: Python environment
        run: uv venv .venv --python 3.12 && uv pip install --python .venv\Scripts\python.exe -r requirements-dev.txt
      - name: Frontend build (the browser tests export the static site from it)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Firefox for the browser tests
        run: .venv\Scripts\python.exe -m playwright install firefox
      - name: Browser tests against the static export built on Windows (part 1 of 5)
        env:
          E2E_BROWSER: firefox
          E2E_ARTIFACTS: e2e-artifacts
        run: .venv\Scripts\python.exe -m pytest -q tests/e2e --shard 1/5 -n ([Math]::Min([Environment]::ProcessorCount, 4))
      # a failed browser test leaves its Playwright trace (tests/e2e/conftest.py): python -m playwright show-trace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with: {name: "browser-traces-windows-1", path: e2e-artifacts, retention-days: 7, if-no-files-found: ignore}

  # Known-vulnerable dependencies added by a pull request (pip and npm lockfiles), with GitHub's own dependency graph.
  # Only a pull request has a base to compare with; after a merge this job is skipped.
  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
