name: checks-content
# The content lane: called by ci.yml when the base commit's classifier says every changed file is contributor data
# (lessons, labs, incidents, challenges, recordings, screenshots, Markdown docs). Content is never run here, but it is
# applied to learners' clusters and recorded by the owner's recorder, so it gets the same Python, content, site and
# Windows checks as code (python, site, windows, same-site: the deep lane's own jobs, test_ci_workflows.py checks
# it), plus a browser check of every page. Left to the deep lane: the production image and the whole browser suite,
# which test code and nginx rules a content change cannot touch. Whether a contributor's content may merge without
# the owner's review is ci-guard.yml's decision, not this lane's.
on:
  workflow_call:
permissions:
  contents: read
env:
  ACADEMY_CLUSTER: "off"
  KUBECONFIG: /nonexistent

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/python-env
      # first: a file that does not load makes dozens of tests fail; this names it
      - name: Content loads, teaching rules, stable addresses, coverage references, public scan
        run: scripts/test_content.sh --data-checks
      - name: Unit, API, security and content tests (the whole Python suite)
        run: scripts/test_content.sh --python

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      # the frontend tests read the lessons through the Python environment, so it comes first
      - uses: ./.github/actions/python-env
      - name: Frontend unit tests, type check and build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run build
      # the build the browser jobs serve (built once here, not once per shard)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: frontend-dist, path: frontend/dist, retention-days: 1, if-no-files-found: error}
      - name: Static export, then the same scan on the generated site
        run: .venv/bin/python scripts/export_static.py && .venv/bin/python scripts/public_scan.py frontend/dist
      - name: Internal links and assets exist
        run: .venv/bin/python scripts/check_site.py frontend/dist
      - name: Manifest of the exported site (compared with the one built on Windows)
        run: .venv/bin/python scripts/site_manifest.py frontend/dist site-linux.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: site-linux, path: site-linux.txt, retention-days: 3, if-no-files-found: error}

  # Windows: the contributor workflow of docs/WINDOWS.md, with its own commands (PowerShell, the environment's
  # .venv\Scripts\python.exe): Python and frontend tests, content checks, the static export and its checks, and the
  # local server. Each command is its own step, so a failure names what failed. tests/test_windows_doc.py keeps the
  # guide and these commands the same.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run: {shell: pwsh}
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: ./.github/actions/python-env
        with: {install: "false"}
      - name: Python environment
        run: uv venv .venv --python 3.12 && uv pip install --python .venv\Scripts\python.exe -r requirements-dev.txt
      - name: Course content loads
        run: .venv\Scripts\python.exe scripts\check_content.py
      - name: Unit, API, security, content and portability tests
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: .venv\Scripts\python.exe -m pytest -q tests --ignore=tests/e2e -n ([Math]::Min([Environment]::ProcessorCount, 4))
      - name: Teaching rules
        run: .venv\Scripts\python.exe scripts\teach_lint.py
      - name: Every lesson and lab keeps its public address
        run: .venv\Scripts\python.exe scripts\slugs.py --check
      - name: Coverage references exist
        run: .venv\Scripts\python.exe scripts\coverage.py --check
      - name: No credentials, keys, vendor course codes or certification phrases in the repository
        run: .venv\Scripts\python.exe scripts\public_scan.py
      - name: Frontend unit tests, type check and build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Static export, the scan of the generated site, and its internal links
        run: >-
          .venv\Scripts\python.exe scripts\export_static.py &&
          .venv\Scripts\python.exe scripts\public_scan.py frontend\dist &&
          .venv\Scripts\python.exe scripts\check_site.py frontend\dist
      - name: Manifest of the exported site (compared with the one built on Linux)
        run: .venv\Scripts\python.exe scripts\site_manifest.py frontend\dist site-windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: site-windows, path: site-windows.txt, retention-days: 3, if-no-files-found: error}
      # in Windows PowerShell 5.1 (the one Windows includes), the other steps in PowerShell 7
      - name: The local server answers in practice mode (scripts\serve.py --practice, as in docs/WINDOWS.md)
        shell: powershell
        run: |
          $server = Start-Process -PassThru -NoNewWindow .venv\Scripts\python.exe -ArgumentList 'scripts\serve.py', '--practice'
          try {
            foreach ($i in 1..120) {
              try { $status = Invoke-RestMethod http://127.0.0.1:8768/api/status; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($status.mode -ne 'practice') { throw "no practice-mode server on 127.0.0.1:8768" }
            $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8768/
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') { throw "the site is not served" }
            "serve.py: practice mode; the site and its API answer on 127.0.0.1:8768"
          } finally { Stop-Process -Id $server.Id }

  # The same source must export the same site on Linux and on Windows, byte for byte (paths, line endings, encodings).
  same-site:
    needs: [site, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: site-*, merge-multiple: true}
      - name: The sites exported on Linux and on Windows are identical
        run: |
          echo "$(wc -l < site-linux.txt) files exported on Linux, $(wc -l < site-windows.txt) on Windows"
          diff site-linux.txt site-windows.txt && echo "identical"

  # Every lesson, lab, incident, challenge and diagnostic page opens in Chromium from the static export built in the
  # site job: its page shows (not the recovery panel), with no page or console error, and fits a phone
  # (tests/e2e/test_mobile_overflow.py). Content the renderer cannot show fails here, before it is merged.
  pages:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/python-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: frontend-dist, path: frontend/dist}
      - run: scripts/ci_browser.sh chromium
      - name: Every page renders and fits a phone
        env:
          E2E_BROWSER: chromium
          E2E_ARTIFACTS: e2e-artifacts
        run: |
          workers=$(( $(nproc) < 4 ? $(nproc) : 4 ))
          .venv/bin/python -m pytest -q tests/e2e/test_mobile_overflow.py -n "$workers"
      # the traces of failed browser tests, when there are any (tests/e2e/conftest.py): python -m playwright show-trace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with: {name: "browser-traces-pages", path: e2e-artifacts, retention-days: 7, if-no-files-found: ignore}
