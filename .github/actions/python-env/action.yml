name: python-env
description: >-
  Python 3.12 (actions/setup-python), uv from PyPI pinned by version and hash, and, unless install is "false", the
  project's .venv with requirements-dev.txt. No dependency cache: uv installs the locked set in seconds, and nothing a
  pull request writes can be read back by another run.
inputs:
  install:
    description: '"true": create .venv and install requirements-dev.txt here (Linux). Windows jobs run the documented commands themselves.'
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: uv (pinned version and hashes)
      shell: bash
      env:
        REQS: ${{ github.action_path }}/uv-requirements.txt
      run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r "$REQS"
    - name: Project environment (.venv, requirements-dev.txt)
      if: inputs.install == 'true'
      shell: bash
      env:
        UV_PYTHON_DOWNLOADS: never
      run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r requirements-dev.txt
