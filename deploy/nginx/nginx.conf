# The public site: static files only, served by an unprivileged nginx (Containerfile). No backend, no proxy.
# Runs as a non-root user with a read-only root filesystem: the pid file and temporary paths are under /tmp, the only
# writable mount. Listens on 8080 over plain HTTP; TLS ends at the ingress in front of it.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset      utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 1k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

  # Addresses used before readable URLs: one permanent redirect to the current address (written by the export).
  map_hash_bucket_size 128;
  map $uri $moved_to {
    default "";
    include /etc/nginx/redirects.map;
  }

  # File names under /assets/ contain a hash of their content, so they never change. Everything else (pages, lesson
  # data, version.json) is revalidated on every use, so a new release is visible at once.
  map $uri $cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /srv/site;
    absolute_redirect off;

    # every response, errors and redirects included (no add_header below this level, so none of these is dropped).
    # No Cross-Origin-Opener-Policy: the site has no cross-window exchanges to protect and holds no secrets, and with it automated Firefox
    # sometimes never finishes a navigation, so the browser tests could not run against this exact configuration.
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # Additions for one deployment (for example a noindex header on a test site): .conf files that the deployment
    # mounts into /etc/nginx/site.d/. The image ships none, and an empty match is not an error.
    include /etc/nginx/site.d/*.conf;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($moved_to) { return 301 $moved_to$is_args$args; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # The app asks /api/meta first to find out whether a server is present: here there never is one.
    location ^~ /api/ { access_log off; default_type application/json; return 404 '{"detail":"static site"}'; }

    # Pages are /path, never /path/ (the export writes path/index.html). Only the characters the site's addresses use:
    # a redirect to /\host or //host would send the browser to another site.
    location ~ "^(/[A-Za-z0-9._-][A-Za-z0-9._/-]*)/$" { return 301 $1$is_args$args; }

    location / {
      try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
  }
}
