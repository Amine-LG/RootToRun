# Serve the public site locally from the production image (static files and nginx, no cluster, no server code):
#   docker compose up -d      (or: podman compose up -d)
#   open http://127.0.0.1:8080
services:
  site:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/static-site:dev
    ports:
      - "127.0.0.1:${ACADEMY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
